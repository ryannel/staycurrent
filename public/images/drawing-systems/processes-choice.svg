<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title"><title id="title">An exclusive decision follows the received quote response</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="390" fill="var(--paper)"/><text x="24" y="36" text-anchor="start" class="title"><tspan x="24" dy="0">One response, one route</tspan></text><rect x="130" y="65" width="260" height="60" rx="9" class="node"/><text x="260.0" y="102.0" text-anchor="middle"><tspan x="260.0" dy="0">Record quote response</tspan></text><path d="M260 125L260 161" class="line" marker-end="url(#a)"/><path d="M260 161L285 186L260 211L235 186Z" class="node"/><text x="260" y="193" text-anchor="middle"><tspan x="260" dy="0">X</tspan></text><path d="M235 186H130V270" class="line" marker-end="url(#a)"/><path d="M285 186H390V270" class="line" marker-end="url(#a)"/><text x="126" y="235" text-anchor="middle" class="small"><tspan x="126" dy="0">Approved</tspan></text><text x="392" y="235" text-anchor="middle" class="small"><tspan x="392" dy="0">Declined</tspan></text><rect x="35" y="270" width="190" height="70" rx="9" class="node"/><text x="130.0" y="299.0" text-anchor="middle"><tspan x="130.0" dy="0">Ready for</tspan><tspan x="130.0" dy="26">repair</tspan></text><rect x="295" y="270" width="190" height="70" rx="9" class="node"/><text x="390.0" y="299.0" text-anchor="middle"><tspan x="390.0" dy="0">Close</tspan><tspan x="390.0" dy="26">request</tspan></text><text x="260" y="375" text-anchor="middle" class="small muted"><tspan x="260" dy="0">No response yet → still waiting</tspan></text></svg>