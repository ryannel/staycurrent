<svg xmlns="http://www.w3.org/2000/svg" width="520" height="490" viewBox="0 0 520 490" role="img" aria-labelledby="title"><title id="title">Message flow enters the repair service; sequence flow crosses its internal lanes</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="490" fill="var(--paper)"/><text x="24" y="36" text-anchor="start" class="title"><tspan x="24" dy="0">A message, then an internal handoff</tspan></text><rect x="24" y="65" width="472" height="80" rx="0" class="node"/><text x="260.0" y="112.0" text-anchor="middle"><tspan x="260.0" dy="0">Customer — internal work hidden</tspan></text><rect x="24" y="225" width="472" height="235" class="node"/><text x="40" y="250" text-anchor="start" class="small"><tspan x="40" dy="0">Repair service</tspan></text><path d="M24 340L496 340" class="line"/><text x="40" y="285" text-anchor="start" class="small"><tspan x="40" dy="0">Coordinator</tspan></text><text x="40" y="375" text-anchor="start" class="small"><tspan x="40" dy="0">Technician</tspan></text><rect x="215" y="270" width="200" height="54" rx="9" class="node"/><text x="315.0" y="304.0" text-anchor="middle"><tspan x="315.0" dy="0">Triage request</tspan></text><rect x="215" y="390" width="200" height="54" rx="9" class="node"/><text x="315.0" y="424.0" text-anchor="middle"><tspan x="315.0" dy="0">Diagnose fault</tspan></text><circle cx="315" cy="145" r="4" class="node"/><path d="M315 150V270" class="line dash" marker-end="url(#o)"/><text x="330" y="192" text-anchor="start" class="small"><tspan x="330" dy="0">request</tspan></text><path d="M315 324L315 390" class="line" marker-end="url(#a)"/></svg>