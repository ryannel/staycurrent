<svg xmlns="http://www.w3.org/2000/svg" width="500" height="800" viewBox="0 0 500 800" role="img" aria-labelledby="title desc"><title id="title">Shared cancellation rule</title><desc id="desc">Before repair contains four sequential child states. Cancel exits the parent to Cancelled; starting repair exits Approved to In repair.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="800" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Shared cancellation rule</text><rect x="20" y="75" width="460" height="510" rx="3" class="boundary"/><text x="40" y="108" text-anchor="start" class="strong">Before repair · parent state</text><circle cx="250" cy="133" r="6" class="accent"/><path d="M250 139 L250 160" class="line" marker-end="url(#arrow)"/><rect x="65" y="160" width="370" height="60" rx="3" class="box"/><text x="250.0" y="197.0" text-anchor="middle" class="">Submitted</text><rect x="65" y="270" width="370" height="60" rx="3" class="box"/><text x="250.0" y="307.0" text-anchor="middle" class="">Diagnosing</text><rect x="65" y="380" width="370" height="60" rx="3" class="box"/><text x="250.0" y="417.0" text-anchor="middle" class="">Awaiting approval</text><rect x="65" y="490" width="370" height="60" rx="3" class="box"/><text x="250.0" y="527.0" text-anchor="middle" class="">Approved</text><path d="M250 220 L250 270" class="line" marker-end="url(#arrow)"/><text x="267" y="253" text-anchor="start" class="small">Accept triage</text><path d="M250 330 L250 380" class="line" marker-end="url(#arrow)"/><text x="267" y="363" text-anchor="start" class="small">Issue quote</text><path d="M250 440 L250 490" class="line" marker-end="url(#arrow)"/><text x="267" y="473" text-anchor="start" class="small">Approve quote</text><path d="M250 550 L250 635 L355 635 L355 690" class="line" marker-end="url(#arrow)"/><text x="270" y="616" text-anchor="start" class="small">Start repair</text><path d="M20 350 L8 350 L8 650 L135 650 L135 690" class="line" marker-end="url(#arrow)"/><text x="35" y="633" text-anchor="start" class="small">Cancel</text><rect x="25" y="690" width="220" height="65" rx="3" class="plain"/><text x="135.0" y="729.5" text-anchor="middle" class="">Cancelled</text><rect x="265" y="690" width="210" height="65" rx="3" class="box"/><text x="370.0" y="729.5" text-anchor="middle" class="">In repair</text><text x="250" y="788" text-anchor="middle" class="small">Cancel applies to each child before repair.</text></svg>