<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title"><title id="title">Construct a small scene from labels, boxes and a relationship</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="520" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Compose before decorating</tspan></text><text x="24" y="70" text-anchor="start" class="small"><tspan x="24" dy="0">1. Leave room for the relationship</tspan></text><text x="115" y="130" text-anchor="middle"><tspan x="115" dy="0">Browser</tspan><tspan x="115" dy="26">UI</tspan></text><text x="405" y="130" text-anchor="middle"><tspan x="405" dy="0">Repair</tspan><tspan x="405" dy="26">API</tspan></text><text x="24" y="225" text-anchor="start" class="small"><tspan x="24" dy="0">2. Draw around the words</tspan></text><rect x="35" y="250" width="160" height="78" rx="9" class="node"/><text x="115.0" y="283.0" text-anchor="middle"><tspan x="115.0" dy="0">Browser</tspan><tspan x="115.0" dy="26">UI</tspan></text><rect x="325" y="250" width="160" height="78" rx="9" class="node"/><text x="405.0" y="283.0" text-anchor="middle"><tspan x="405.0" dy="0">Repair</tspan><tspan x="405.0" dy="26">API</tspan></text><text x="24" y="380" text-anchor="start" class="small"><tspan x="24" dy="0">3. Add direction and an operation</tspan></text><rect x="35" y="405" width="160" height="78" rx="9" class="node"/><text x="115.0" y="438.0" text-anchor="middle"><tspan x="115.0" dy="0">Browser</tspan><tspan x="115.0" dy="26">UI</tspan></text><rect x="325" y="405" width="160" height="78" rx="9" class="node"/><text x="405.0" y="438.0" text-anchor="middle"><tspan x="405.0" dy="0">Repair</tspan><tspan x="405.0" dy="26">API</tspan></text><path d="M195 450L325 450" class="line" marker-end="url(#a)"/><text x="260" y="400" text-anchor="middle" class="small"><tspan x="260" dy="0">submits</tspan><tspan x="260" dy="26">request</tspan></text></svg>