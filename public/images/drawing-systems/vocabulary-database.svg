<svg xmlns="http://www.w3.org/2000/svg" width="500" height="260" viewBox="0 0 500 260" role="img" aria-labelledby="title"><title id="title">Database: three drawing stages</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="35" class="title" text-anchor="start">Database</text><g transform="translate(30 62)"><ellipse cx="50" cy="19" rx="39" ry="13" class="line new"/></g><text x="80" y="194" class="small" text-anchor="middle">1 · oval</text><g transform="translate(185 62)"><ellipse cx="50" cy="19" rx="39" ry="13" class="line"/><path d="M11 19 V77 C11 94 89 94 89 77 V19" class="line new"/></g><text x="235" y="194" class="small" text-anchor="middle">2 · sides + base</text><g transform="translate(340 62)"><ellipse cx="50" cy="19" rx="39" ry="13" class="line"/><path d="M11 19 V77 C11 94 89 94 89 77 V19" class="line "/><path d="M11 45 C11 62 89 62 89 45" class="line new"/></g><text x="390" y="194" class="small" text-anchor="middle">3 · seam</text><text x="24" y="235" class="small" text-anchor="start">Blue = added marks; finish with a name.</text></svg>