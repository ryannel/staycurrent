<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350" role="img" aria-labelledby="title"><title id="title">The browser label and the submits repair arrow carry meaning; browser dots are optional decoration</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="38" class="title" text-anchor="start">Recognition and meaning</text><g transform="translate(40 70) scale(1)"><rect x="5" y="10" width="90" height="78" rx="4" class="line "/><path d="M5 31 H95" class="line "/></g><text x="185" y="105" class="" text-anchor="start">Booking site</text><text x="185" y="136" class="small" text-anchor="start">Name: keep</text><path d="M56 91 H58 M68 91 H70" class="line new"/><text x="185" y="168" class="small" text-anchor="start">Dots: optional</text><path d="M40 222 H155 M145 215 L155 222 L145 229" class="line"/><text x="185" y="229" class="" text-anchor="start">submits repair</text><text x="24" y="278" class="small" text-anchor="start">Arrowhead + verb: keep the relationship.</text><text x="24" y="320" class="small" text-anchor="start">Remove decoration before removing meaning.</text></svg>