<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520" role="img" aria-labelledby="title desc"><title id="title">Read an approval transition</title><desc id="desc">An approve event changes Awaiting approval to Approved only if it names the current quote; acceptance is recorded as the effect.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="520" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Read an approval transition</text><rect x="60" y="80" width="380" height="65" rx="3" class="box"/><text x="250.0" y="119.5" text-anchor="middle" class="">Awaiting approval</text><path d="M250 145 L250 360" class="line" marker-end="url(#arrow)"/><rect x="38" y="175" width="424" height="155" rx="3" class="plain"/><text x="58" y="207" text-anchor="start" class="small">Event: approve Q9</text><text x="58" y="233" text-anchor="start" class="small">Guard: Q9 is the current quote</text><text x="58" y="259" text-anchor="start" class="small">Effect: record acceptance of Q9</text><rect x="60" y="360" width="380" height="65" rx="3" class="box"/><text x="250.0" y="399.5" text-anchor="middle" class="">Approved</text><text x="250" y="465" text-anchor="middle" class="small">Old quote? Keep Awaiting approval.</text><text x="250" y="493" text-anchor="middle" class="small">Return a stale-quote result.</text></svg>