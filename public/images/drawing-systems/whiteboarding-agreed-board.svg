<svg xmlns="http://www.w3.org/2000/svg" width="520" height="900" viewBox="0 0 520 900" role="img" aria-labelledby="title"><title id="title">Agreed repair system with current trace, uncertainty and a separate proposal</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="900" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Request → notification</tspan></text><text x="24" y="65" text-anchor="start" class="small muted"><tspan x="24" dy="0">CURRENT DESIGN · initiated operations</tspan></text><rect x="150" y="95" width="220" height="60" rx="9" class="node"/><text x="260.0" y="132.0" text-anchor="middle"><tspan x="260.0" dy="0">Browser UI</tspan></text><path d="M260 155L260 220" class="line" marker-end="url(#a)"/><text x="278" y="190" text-anchor="start" class="small blue"><tspan x="278" dy="0">1 submits</tspan></text><rect x="150" y="220" width="220" height="60" rx="9" class="node"/><text x="260.0" y="257.0" text-anchor="middle"><tspan x="260.0" dy="0">Repair API</tspan></text><path d="M260 280L260 360" class="line" marker-end="url(#a)"/><text x="278" y="315" text-anchor="start" class="small blue"><tspan x="278" dy="0">2 stores request</tspan><tspan x="278" dy="26">and job</tspan></text><rect x="150" y="360" width="220" height="75" rx="9" class="node"/><text x="260.0" y="391.5" text-anchor="middle"><tspan x="260.0" dy="0">Repair DB</tspan><tspan x="260.0" dy="26">requests + jobs</tspan></text><rect x="150" y="515" width="220" height="75" rx="9" class="node"/><text x="260.0" y="546.5" text-anchor="middle"><tspan x="260.0" dy="0">Notification</tspan><tspan x="260.0" dy="26">worker</tspan></text><path d="M260 515L260 435" class="line" marker-end="url(#a)"/><text x="278" y="477" text-anchor="start" class="small blue"><tspan x="278" dy="0">3 reads jobs</tspan></text><path d="M260 590L260 665" class="line" marker-end="url(#a)"/><text x="278" y="625" text-anchor="start" class="small blue"><tspan x="278" dy="0">4 requests email</tspan></text><rect x="90" y="650" width="340" height="110" rx="8" class="line dash"/><rect x="150" y="670" width="220" height="65" rx="9" class="node"/><text x="260.0" y="696.5" text-anchor="middle"><tspan x="260.0" dy="0">Notification</tspan><tspan x="260.0" dy="26">provider</tspan></text><text x="110" y="752" text-anchor="start" class="small muted"><tspan x="110" dy="0">EXTERNAL</tspan></text><text x="24" y="805" text-anchor="start" class="small purple"><tspan x="24" dy="0">? Can retries send two emails?</tspan></text><path d="M24 830L496 830" class="line"/><text x="24" y="865" text-anchor="start" class="small green"><tspan x="24" dy="0">NEW: show notification status</tspan></text></svg>