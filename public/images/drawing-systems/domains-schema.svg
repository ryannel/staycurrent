<svg xmlns="http://www.w3.org/2000/svg" width="500" height="610" viewBox="0 0 500 610" role="img" aria-labelledby="title desc"><title id="title">Concepts and stored records</title><desc id="desc">A relational design can use requests with primary keys and appointments with request references.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="610" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Concepts and stored records</text><text x="30" y="80" text-anchor="start" class="strong">Conceptual relationship</text><rect x="65" y="105" width="370" height="65" rx="3" class="box"/><text x="250.0" y="144.5" text-anchor="middle" class="">RepairRequest</text><path d="M250 170 L250 235" class="line"/><text x="270" y="207" text-anchor="start" class="small">has</text><rect x="65" y="235" width="370" height="65" rx="3" class="box"/><text x="250.0" y="274.5" text-anchor="middle" class="">Appointment</text><text x="30" y="350" text-anchor="start" class="strong">One relational representation</text><rect x="40" y="375" width="420" height="75" rx="3" class="plain"/><text x="250.0" y="405.5" text-anchor="middle" class="">requests</text><text x="250.0" y="433.5" text-anchor="middle" class="">request_id: R42</text><path d="M140 500 L140 450" class="line" marker-end="url(#arrow)"/><path d="M360 500 L360 450" class="line" marker-end="url(#arrow)"/><rect x="25" y="500" width="220" height="85" rx="3" class="plain"/><text x="135.0" y="549.5" text-anchor="middle" class="">A7 · request_id R42</text><rect x="255" y="500" width="220" height="85" rx="3" class="plain"/><text x="365.0" y="549.5" text-anchor="middle" class="">A8 · request_id R42</text><text x="250" y="602" text-anchor="middle" class="small">appointments reference the request row</text></svg>