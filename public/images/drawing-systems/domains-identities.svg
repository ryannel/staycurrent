<svg xmlns="http://www.w3.org/2000/svg" width="500" height="530" viewBox="0 0 500 530" role="img" aria-labelledby="title desc"><title id="title">One case, different visits</title><desc id="desc">Request R42 remains while A7 is superseded by appointment A8.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="530" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">One case, different visits</text><rect x="50" y="80" width="400" height="100" rx="3" class="box"/><text x="250.0" y="123.0" text-anchor="middle" class="">R42 · RepairRequest</text><text x="250.0" y="151.0" text-anchor="middle" class="">Mina’s washing machine</text><path d="M250 180 L250 230 L135 230 L135 300" class="line"/><path d="M250 230 L365 230 L365 300" class="line"/><text x="250" y="266" text-anchor="middle" class="small">associated appointments</text><rect x="30" y="300" width="210" height="140" rx="3" class="plain"/><text x="135.0" y="349.0" text-anchor="middle" class="">A7</text><text x="135.0" y="377.0" text-anchor="middle" class="">Tuesday</text><text x="135.0" y="405.0" text-anchor="middle" class="">Superseded</text><rect x="260" y="300" width="210" height="140" rx="3" class="box"/><text x="365.0" y="349.0" text-anchor="middle" class="">A8</text><text x="365.0" y="377.0" text-anchor="middle" class="">Thursday</text><text x="365.0" y="405.0" text-anchor="middle" class="">Booked</text><text x="250" y="483" text-anchor="middle" class="small">R42 continues through the reschedule.</text></svg>