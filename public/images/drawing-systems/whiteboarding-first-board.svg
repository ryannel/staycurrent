<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title"><title id="title">The first account establishes browser, API, database and an unanswered worker question</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="520" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">How does a request become a notice?</tspan></text><text x="24" y="65" text-anchor="start" class="small muted"><tspan x="24" dy="0">CURRENT DESIGN · first account</tspan></text><rect x="150" y="100" width="220" height="65" rx="9" class="node"/><text x="260.0" y="139.5" text-anchor="middle"><tspan x="260.0" dy="0">Browser UI</tspan></text><path d="M260 165L260 240" class="line" marker-end="url(#a)"/><text x="275" y="205" text-anchor="start" class="small"><tspan x="275" dy="0">submits request</tspan></text><rect x="150" y="240" width="220" height="65" rx="9" class="node"/><text x="260.0" y="279.5" text-anchor="middle"><tspan x="260.0" dy="0">Repair API</tspan></text><path d="M260 305L260 390" class="line" marker-end="url(#a)"/><text x="275" y="343" text-anchor="start" class="small"><tspan x="275" dy="0">stores request</tspan><tspan x="275" dy="26">and job</tspan></text><rect x="150" y="390" width="220" height="65" rx="9" class="node"/><text x="260.0" y="429.5" text-anchor="middle"><tspan x="260.0" dy="0">Repair DB</tspan></text><text x="260" y="500" text-anchor="middle" class="small purple"><tspan x="260" dy="0">? Who reads the notification job?</tspan></text></svg>