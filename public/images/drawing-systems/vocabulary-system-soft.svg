<svg xmlns="http://www.w3.org/2000/svg" width="500" height="790" viewBox="0 0 500 790" role="img" aria-labelledby="title"><title id="title">Customer uses Booking site; site submits repair to Repair API; API stores request in Repair DB</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="37" class="title" text-anchor="start">Soft · request a repair</text><g transform="translate(55 67) scale(1)"><rect x="3" y="7" width="94" height="90" rx="18" fill="var(--wash)"/><circle cx="50" cy="21" r="14" class="line "/><path d="M50 35 V65 M24 49 H76" class="line "/><path d="M50 65 L27 91 M50 65 L73 91" class="line "/></g><text x="185" y="119" class="" text-anchor="start">Customer</text><path d="M105 173 V226 M99 218 L105 226 L111 218" class="line "/><text x="133" y="206" class="small" text-anchor="start">uses</text><g transform="translate(55 237) scale(1)"><rect x="3" y="7" width="94" height="90" rx="18" fill="var(--wash)"/><rect x="5" y="10" width="90" height="78" rx="13" class="line "/><path d="M5 31 H95" class="line "/><path d="M17 21 H19 M29 21 H31" class="line "/></g><text x="185" y="289" class="" text-anchor="start">Booking site</text><path d="M105 343 V396 M99 388 L105 396 L111 388" class="line "/><text x="133" y="376" class="small" text-anchor="start">submits repair</text><g transform="translate(55 407) scale(1)"><rect x="3" y="7" width="94" height="90" rx="18" fill="var(--wash)"/><rect x="7" y="15" width="86" height="72" rx="13" class="line "/><path d="M19 27 H35" class="line "/><path d="M73 70 H81" class="line "/></g><text x="185" y="459" class="" text-anchor="start">Repair API</text><path d="M105 513 V566 M99 558 L105 566 L111 558" class="line "/><text x="133" y="546" class="small" text-anchor="start">stores request</text><g transform="translate(55 577) scale(1)"><rect x="3" y="7" width="94" height="90" rx="18" fill="var(--wash)"/><ellipse cx="50" cy="19" rx="39" ry="13" class="line"/><path d="M11 19 V77 C11 94 89 94 89 77 V19" class="line "/><path d="M11 45 C11 62 89 62 89 45" class="line "/></g><text x="185" y="629" class="" text-anchor="start">Repair DB</text><text x="24" y="766" class="small" text-anchor="start">Arrows describe relationships, not timing.</text></svg>