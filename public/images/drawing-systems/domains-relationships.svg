<svg xmlns="http://www.w3.org/2000/svg" width="500" height="800" viewBox="0 0 500 800" role="img" aria-labelledby="title desc"><title id="title">Concepts and relationship counts</title><desc id="desc">A customer has zero or more repair requests; each request has one customer. A request has zero or more appointments and quotes; each appointment and quote has one request.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="800" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Concepts and relationship counts</text><rect x="80" y="75" width="340" height="65" rx="3" class="box"/><text x="250.0" y="114.5" text-anchor="middle" class="">Customer</text><path d="M250 140 L250 235" class="line"/><text x="227" y="166" text-anchor="end" class="small">1</text><text x="227" y="222" text-anchor="end" class="small">0..*</text><text x="275" y="191" text-anchor="start" class="small">makes</text><rect x="80" y="235" width="340" height="65" rx="3" class="box"/><text x="250.0" y="274.5" text-anchor="middle" class="">RepairRequest</text><path d="M250 300 L250 395" class="line"/><text x="227" y="327" text-anchor="end" class="small">1</text><text x="227" y="383" text-anchor="end" class="small">0..*</text><text x="275" y="352" text-anchor="start" class="small">has visits</text><rect x="80" y="395" width="340" height="65" rx="3" class="box"/><text x="250.0" y="434.5" text-anchor="middle" class="">Appointment</text><text x="250" y="500" text-anchor="middle" class="small muted">A second relationship:</text><rect x="80" y="525" width="340" height="65" rx="3" class="box"/><text x="250.0" y="564.5" text-anchor="middle" class="">RepairRequest</text><path d="M250 590 L250 685" class="line"/><text x="227" y="617" text-anchor="end" class="small">1</text><text x="227" y="673" text-anchor="end" class="small">0..*</text><text x="275" y="642" text-anchor="start" class="small">has offers</text><rect x="80" y="685" width="340" height="65" rx="3" class="box"/><text x="250.0" y="724.5" text-anchor="middle" class="">Quote</text><text x="250" y="783" text-anchor="middle" class="small">Rule: at most one current quote per request.</text></svg>