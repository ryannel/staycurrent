<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" role="img"><title>After layout repair: browser calls API, API writes database, worker reads jobs and calls notification provider</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">The same parts, arranged around two jobs</text><text x="24" y="82" class="small" text-anchor="start">RECORD THE REQUEST</text><rect x="24" y="110" width="140" height="64" rx="5" class="box "/><text x="94.0" y="148.0" class="" text-anchor="middle">Browser</text><rect x="350" y="110" width="146" height="64" rx="5" class="box "/><text x="423.0" y="148.0" class="" text-anchor="middle">Repair API</text><polyline points="164,142 350,142" class="line "/><path d="M342.10175694298664,146.31482984743784 L350.0,142.0 L342.10175694298664,137.68517015256216" class="line "/><text x="257" y="126" class="small label" text-anchor="middle">submits</text><rect x="350" y="254" width="146" height="64" rx="5" class="box "/><text x="423.0" y="292.0" class="" text-anchor="middle">Repair DB</text><polyline points="423,174 423,254" class="line "/><path d="M418.6851701525622,246.10175694298664 L423.0,254.0 L427.3148298474378,246.10175694298664" class="line "/><text x="405" y="218" class="small label" text-anchor="end">writes</text><text x="24" y="354" class="small" text-anchor="start">SEND A NOTIFICATION</text><rect x="24" y="382" width="160" height="70" rx="5" class="box "/><text x="104.0" y="423.0" class="" text-anchor="middle">Worker</text><polyline points="184,417 268,417 268,286 350,286" class="line "/><path d="M342.10175694298664,290.3148298474378 L350.0,286.0 L342.10175694298664,281.6851701525622" class="line "/><text x="265" y="470" class="small label" text-anchor="middle">reads stored jobs</text><rect x="24" y="536" width="210" height="70" rx="5" class="box "/><text x="129.0" y="565.0" class="" text-anchor="middle">Notification</text><text x="129.0" y="589.0" class="" text-anchor="middle">provider</text><polyline points="104,452 104,536" class="line "/><path d="M99.68517015256216,528.1017569429866 L104.0,536.0 L108.31482984743782,528.1017569429866" class="line "/><text x="120" y="502" class="small label" text-anchor="start">sends email</text><text x="270" y="568" class="small note" text-anchor="start">Arrow = uses / calls</text><text x="270" y="597" class="small note" text-anchor="start">Not a time scale</text></svg>