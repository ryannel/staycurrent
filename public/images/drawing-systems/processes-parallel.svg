<svg xmlns="http://www.w3.org/2000/svg" width="520" height="450" viewBox="0 0 520 450" role="img" aria-labelledby="title"><title id="title">A parallel split starts two preparation activities and a join waits for both</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="450" fill="var(--paper)"/><text x="24" y="36" text-anchor="start" class="title"><tspan x="24" dy="0">Start both; wait for both</tspan></text><path d="M260 70L285 95L260 120L235 95Z" class="node"/><text x="260" y="102" text-anchor="middle"><tspan x="260" dy="0">+</tspan></text><path d="M235 95H130V170" class="line" marker-end="url(#a)"/><path d="M285 95H390V170" class="line" marker-end="url(#a)"/><rect x="35" y="170" width="190" height="65" rx="9" class="node"/><text x="130.0" y="209.5" text-anchor="middle"><tspan x="130.0" dy="0">Check parts</tspan></text><rect x="295" y="170" width="190" height="65" rx="9" class="node"/><text x="390.0" y="209.5" text-anchor="middle"><tspan x="390.0" dy="0">Prepare bench</tspan></text><path d="M130 235V300H235" class="line" marker-end="url(#a)"/><path d="M390 235V300H285" class="line" marker-end="url(#a)"/><path d="M260 275L285 300L260 325L235 300Z" class="node"/><text x="260" y="307" text-anchor="middle"><tspan x="260" dy="0">+</tspan></text><text x="260" y="263" text-anchor="middle" class="small muted"><tspan x="260" dy="0">Both must complete</tspan></text><path d="M260 325L260 370" class="line" marker-end="url(#a)"/><rect x="135" y="370" width="250" height="55" rx="9" class="node"/><text x="260.0" y="404.5" text-anchor="middle"><tspan x="260.0" dy="0">Begin repair</tspan></text></svg>