<svg xmlns="http://www.w3.org/2000/svg" width="500" height="390" viewBox="0 0 500 390" role="img" aria-labelledby="title"><title id="title">spare personality applied to four symbols</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="37" class="title" text-anchor="start">Spare</text><g transform="translate(60 60) scale(1)"><circle cx="50" cy="21" r="14" class="line "/><path d="M50 35 V65 M24 49 H76" class="line "/><path d="M50 65 L27 91 M50 65 L73 91" class="line "/></g><text x="110" y="185" class="" text-anchor="middle">Customer</text><g transform="translate(305 60) scale(1)"><rect x="5" y="10" width="90" height="78" rx="4" class="line "/><path d="M5 31 H95" class="line "/></g><text x="355" y="185" class="" text-anchor="middle">Booking site</text><g transform="translate(60 215) scale(1)"><rect x="7" y="15" width="86" height="72" rx="4" class="line "/><path d="M19 27 H35" class="line "/></g><text x="110" y="340" class="" text-anchor="middle">Repair API</text><g transform="translate(305 215) scale(1)"><ellipse cx="50" cy="19" rx="39" ry="13" class="line"/><path d="M11 19 V77 C11 94 89 94 89 77 V19" class="line "/></g><text x="355" y="340" class="" text-anchor="middle">Repair DB</text></svg>