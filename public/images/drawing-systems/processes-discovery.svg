<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" role="img" aria-labelledby="title"><title id="title">A discovery map groups six activities into three milestone phases</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="400" fill="var(--paper)"/><text x="24" y="38" text-anchor="start" class="title"><tspan x="24" dy="0">Discovery map</tspan></text><rect x="20" y="65" width="146" height="280" rx="8" class="soft"/><text x="93" y="99" text-anchor="middle"><tspan x="93" dy="0">Intake</tspan></text><rect x="29" y="125" width="128" height="82" rx="9" class="node"/><text x="93.0" y="160.0" text-anchor="middle"><tspan x="93.0" dy="0">Receive</tspan><tspan x="93.0" dy="26">request</tspan></text><rect x="29" y="230" width="128" height="82" rx="9" class="node"/><text x="93.0" y="265.0" text-anchor="middle"><tspan x="93.0" dy="0">Triage</tspan><tspan x="93.0" dy="26">request</tspan></text><rect x="187" y="65" width="146" height="280" rx="8" class="soft"/><text x="260" y="99" text-anchor="middle"><tspan x="260" dy="0">Diagnosis</tspan></text><rect x="196" y="125" width="128" height="82" rx="9" class="node"/><text x="260.0" y="160.0" text-anchor="middle"><tspan x="260.0" dy="0">Diagnose</tspan><tspan x="260.0" dy="26">fault</tspan></text><rect x="196" y="230" width="128" height="82" rx="9" class="node"/><text x="260.0" y="265.0" text-anchor="middle"><tspan x="260.0" dy="0">Prepare</tspan><tspan x="260.0" dy="26">quote</tspan></text><rect x="354" y="65" width="146" height="280" rx="8" class="soft"/><text x="427" y="99" text-anchor="middle"><tspan x="427" dy="0">Decision</tspan></text><rect x="363" y="125" width="128" height="82" rx="9" class="node"/><text x="427.0" y="160.0" text-anchor="middle"><tspan x="427.0" dy="0">Send</tspan><tspan x="427.0" dy="26">quote</tspan></text><rect x="363" y="230" width="128" height="82" rx="9" class="node"/><text x="427.0" y="265.0" text-anchor="middle"><tspan x="427.0" dy="0">Record</tspan><tspan x="427.0" dy="26">response</tspan></text><text x="260" y="378" text-anchor="middle" class="small muted"><tspan x="260" dy="0">Phases first; routing comes next.</tspan></text></svg>