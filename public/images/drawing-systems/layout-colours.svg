<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img"><title>Five colour roles with labels and symbols that remain meaningful without colour</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">Five pens, five roles</text><path d="M28,93 L78,93" class="line " style="stroke-width:4"/><text x="96" y="87" class="" text-anchor="start">Black · structure</text><text x="96" y="117" class="small note" text-anchor="start">Named things and confirmed links</text><path d="M28,184 L78,184" class="line blue" style="stroke-width:4"/><text x="96" y="178" class="" text-anchor="start">Blue · trace ① ②</text><text x="96" y="208" class="small note" text-anchor="start">The path currently being discussed</text><path d="M28,275 L78,275" class="line green" style="stroke-width:4"/><text x="96" y="269" class="" text-anchor="start">Green · NEW</text><text x="96" y="299" class="small note" text-anchor="start">A proposed change; not implemented</text><path d="M28,366 L78,366" class="line red" style="stroke-width:4"/><text x="96" y="360" class="" text-anchor="start">Red · ! ISSUE</text><text x="96" y="390" class="small note" text-anchor="start">An observed problem to investigate</text><path d="M28,457 L78,457" class="line purple" style="stroke-width:4"/><text x="96" y="451" class="" text-anchor="start">Purple · ? CHECK</text><text x="96" y="481" class="small note" text-anchor="start">An assumption or unanswered question</text><text x="24" y="566" class="small note" text-anchor="start">Keep the words and marks on a black copy.</text></svg>