<svg xmlns="http://www.w3.org/2000/svg" width="520" height="570" viewBox="0 0 520 570" role="img" aria-labelledby="title"><title id="title">Valid details lead to a stored request; invalid details lead to correction</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="570" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Choose a validation outcome</tspan></text><rect x="10" y="60" width="140" height="65" rx="9" class="node"/><text x="80.0" y="86.5" text-anchor="middle"><tspan x="80.0" dy="0">Browser</tspan><tspan x="80.0" dy="26">UI</tspan></text><path d="M80 125L80 545" class="life"/><rect x="190" y="60" width="140" height="65" rx="9" class="node"/><text x="260.0" y="86.5" text-anchor="middle"><tspan x="260.0" dy="0">Repair</tspan><tspan x="260.0" dy="26">API</tspan></text><path d="M260 125L260 545" class="life"/><rect x="370" y="60" width="140" height="65" rx="9" class="node"/><text x="440.0" y="86.5" text-anchor="middle"><tspan x="440.0" dy="0">Repair</tspan><tspan x="440.0" dy="26">DB</tspan></text><path d="M440 125L440 545" class="life"/><path d="M80 165L260 165" class="line" marker-end="url(#a)"/><text x="170.0" y="153" text-anchor="middle" class="small"><tspan x="170.0" dy="0">Submit request</tspan></text><rect x="25" y="200" width="470" height="335" class="line"/><text x="40" y="228" text-anchor="start" class="small"><tspan x="40" dy="0">alt: details valid</tspan></text><path d="M260 285L440 285" class="line" marker-end="url(#a)"/><text x="350.0" y="247" text-anchor="middle" class="small"><tspan x="350.0" dy="0">Store request</tspan><tspan x="350.0" dy="26">and job</tspan></text><path d="M440 350L260 350" class="line dash" marker-end="url(#a)"/><text x="350.0" y="338" text-anchor="middle" class="small"><tspan x="350.0" dy="0">Commit succeeded</tspan></text><path d="M260 410L80 410" class="line dash" marker-end="url(#a)"/><text x="170.0" y="398" text-anchor="middle" class="small"><tspan x="170.0" dy="0">Received: R17</tspan></text><path d="M25 440L495 440" class="line dash"/><text x="40" y="468" text-anchor="start" class="small"><tspan x="40" dy="0">else: details invalid</tspan></text><path d="M260 520L80 520" class="line dash" marker-end="url(#a)"/><text x="170.0" y="508" text-anchor="middle" class="small"><tspan x="170.0" dy="0">Fields to correct</tspan></text></svg>