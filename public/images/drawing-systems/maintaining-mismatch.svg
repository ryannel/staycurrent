<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img"><title>The process permits cancellation after approval but an incomplete lifecycle has only start repair</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">A mismatch between two views</text><text x="24" y="80" class="small" text-anchor="start">PROCESS · stated policy</text><rect x="24" y="105" width="205" height="70" rx="5" class="box "/><text x="126.5" y="134.0" class="" text-anchor="middle">Approved</text><text x="126.5" y="158.0" class="" text-anchor="middle">quote</text><rect x="310" y="105" width="186" height="70" rx="5" class="box "/><text x="403.0" y="146.0" class="" text-anchor="middle">Cancelled</text><polyline points="229,140 310,140" class="line "/><path d="M302.10175694298664,144.31482984743784 L310.0,140.0 L302.10175694298664,135.68517015256216" class="line "/><text x="260" y="215" class="label" text-anchor="middle">cancel before repair starts</text><text x="24" y="280" class="small" text-anchor="start">LIFECYCLE · incomplete draft</text><rect x="24" y="307" width="205" height="70" rx="5" class="box "/><text x="126.5" y="348.0" class="" text-anchor="middle">Approved</text><rect x="310" y="307" width="186" height="70" rx="5" class="box "/><text x="403.0" y="348.0" class="" text-anchor="middle">Repairing</text><polyline points="229,342 310,342" class="line "/><path d="M302.10175694298664,346.3148298474378 L310.0,342.0 L302.10175694298664,337.6851701525622" class="line "/><text x="267" y="418" class="label" text-anchor="middle">start repair</text><text x="24" y="487" class="head" text-anchor="start">! Cancellation has no transition here.</text><text x="24" y="527" class="small" text-anchor="start">Which view matches the agreed policy?</text><text x="24" y="566" class="small note" text-anchor="start">Check evidence before repairing the picture.</text></svg>