<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1010" viewBox="0 0 500 1010" role="img" aria-labelledby="title desc"><title id="title">Containers · repair management</title><desc id="desc">One system boundary contains browser UI, Repair API, Repair DB and notification worker. The provider is external.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="1010" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Containers · repair management</text><rect x="20" y="65" width="460" height="775" rx="3" class="boundary"/><text x="40" y="95" text-anchor="start" class="small">Repair management · system</text><rect x="55" y="115" width="390" height="90" rx="3" class="box"/><text x="250.0" y="153.0" text-anchor="middle" class="">Browser UI · container</text><text x="250.0" y="181.0" text-anchor="middle" class="">TypeScript / browser</text><path d="M250 205 L250 300" class="line" marker-end="url(#arrow)"/><text x="270" y="238" text-anchor="start" class="small">Submits operations</text><text x="270" y="264" text-anchor="start" class="small">JSON / HTTPS</text><rect x="55" y="300" width="390" height="90" rx="3" class="box"/><text x="250.0" y="338.0" text-anchor="middle" class="">Repair API · container</text><text x="250.0" y="366.0" text-anchor="middle" class="">TypeScript / Node.js</text><path d="M250 390 L250 485" class="line" marker-end="url(#arrow)"/><text x="270" y="423" text-anchor="start" class="small">Reads / writes</text><text x="270" y="449" text-anchor="start" class="small">SQL / PostgreSQL</text><rect x="55" y="485" width="390" height="90" rx="3" class="box"/><text x="250.0" y="523.0" text-anchor="middle" class="">Repair DB · container</text><text x="250.0" y="551.0" text-anchor="middle" class="">Repair records + jobs</text><path d="M250 670 L250 575" class="line" marker-end="url(#arrow)"/><text x="270" y="608" text-anchor="start" class="small">Reads jobs;</text><text x="270" y="634" text-anchor="start" class="small">records outcomes</text><text x="270" y="660" text-anchor="start" class="small">SQL / PostgreSQL</text><rect x="55" y="670" width="390" height="90" rx="3" class="box"/><text x="250.0" y="708.0" text-anchor="middle" class="">Notification worker</text><text x="250.0" y="736.0" text-anchor="middle" class="">Container · Node.js</text><path d="M250 760 L250 890" class="line" marker-end="url(#arrow)"/><text x="270" y="861" text-anchor="start" class="small">Delivery / HTTPS</text><rect x="55" y="890" width="390" height="90" rx="3" class="external"/><text x="250.0" y="928.0" text-anchor="middle" class="">Notification provider</text><text x="250.0" y="956.0" text-anchor="middle" class="">External software system</text></svg>