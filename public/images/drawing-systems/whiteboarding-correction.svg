<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img" aria-labelledby="title"><title id="title">A mistaken database push arrow is replaced by a worker read</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="500" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Check who initiates the operation</tspan></text><text x="24" y="80" text-anchor="start" class="small red"><tspan x="24" dy="0">First interpretation: assumed push</tspan></text><rect x="35" y="115" width="180" height="65" rx="9" class="node"/><text x="125.0" y="154.5" text-anchor="middle"><tspan x="125.0" dy="0">Repair DB</tspan></text><rect x="305" y="115" width="180" height="65" rx="9" class="node"/><text x="395.0" y="154.5" text-anchor="middle"><tspan x="395.0" dy="0">Worker</tspan></text><path d="M215 147L305 147" class="line" marker-end="url(#a)"/><path d="M230 125L290 170M290 125L230 170" class="line redline"/><text x="24" y="245" text-anchor="start" class="small"><tspan x="24" dy="0">Correction: the worker checks the table</tspan></text><rect x="35" y="290" width="180" height="65" rx="9" class="node"/><text x="125.0" y="329.5" text-anchor="middle"><tspan x="125.0" dy="0">Repair DB</tspan></text><rect x="305" y="290" width="180" height="65" rx="9" class="node"/><text x="395.0" y="329.5" text-anchor="middle"><tspan x="395.0" dy="0">Worker</tspan></text><path d="M305 322L215 322" class="line" marker-end="url(#a)"/><text x="260" y="278" text-anchor="middle" class="small"><tspan x="260" dy="0">reads jobs</tspan></text><text x="260" y="420" text-anchor="middle" class="small purple"><tspan x="260" dy="0">“Does the database push work?”</tspan></text><text x="260" y="456" text-anchor="middle" class="small"><tspan x="260" dy="0">“No. The worker reads eligible jobs.”</tspan></text></svg>