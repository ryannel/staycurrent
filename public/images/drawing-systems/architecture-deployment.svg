<svg xmlns="http://www.w3.org/2000/svg" width="500" height="780" viewBox="0 0 500 780" role="img" aria-labelledby="title desc"><title id="title">Deployment · invented staging</title><desc id="desc">The browser runs on a user device. Two API instances and one worker share a VM. Repair DB has its own managed service.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="780" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Deployment · invented staging</text><rect x="30" y="75" width="440" height="120" rx="3" class="boundary"/><text x="50" y="105" text-anchor="start" class="small">User device</text><rect x="65" y="125" width="370" height="50" rx="3" class="box"/><text x="250.0" y="157.0" text-anchor="middle" class="">Browser UI instance</text><rect x="30" y="225" width="440" height="255" rx="3" class="boundary"/><text x="50" y="258" text-anchor="start" class="small">Staging · application VM</text><rect x="65" y="280" width="370" height="50" rx="3" class="box"/><text x="250.0" y="312.0" text-anchor="middle" class="">Repair API · instance A</text><rect x="65" y="345" width="370" height="50" rx="3" class="box"/><text x="250.0" y="377.0" text-anchor="middle" class="">Repair API · instance B</text><rect x="65" y="410" width="370" height="50" rx="3" class="box"/><text x="250.0" y="442.0" text-anchor="middle" class="">Notification worker · instance</text><rect x="30" y="510" width="440" height="120" rx="3" class="boundary"/><text x="50" y="542" text-anchor="start" class="small">Managed database service</text><rect x="65" y="560" width="370" height="50" rx="3" class="box"/><text x="250.0" y="592.0" text-anchor="middle" class="">Repair DB instance</text><rect x="30" y="665" width="440" height="75" rx="3" class="external"/><text x="250.0" y="695.5" text-anchor="middle" class="">Notification provider</text><text x="250.0" y="723.5" text-anchor="middle" class="">External software system</text><text x="250" y="770" text-anchor="middle" class="small muted">Placement only; communication omitted</text></svg>