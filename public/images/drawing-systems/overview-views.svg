<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img"><title>Structure, process and lifecycle views of a repair service</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">One repair request, three questions</text><text x="24" y="84" class="small" text-anchor="start">STRUCTURE · Which parts communicate?</text><rect x="24" y="110" width="130" height="60" rx="5" class="box "/><text x="89.0" y="146.0" class="" text-anchor="middle">Browser</text><rect x="202" y="110" width="110" height="60" rx="5" class="box "/><text x="257.0" y="146.0" class="" text-anchor="middle">API</text><rect x="366" y="110" width="130" height="60" rx="5" class="box "/><text x="431.0" y="146.0" class="" text-anchor="middle">Database</text><polyline points="154,140 202,140" class="line "/><path d="M194.10175694298664,144.31482984743784 L202.0,140.0 L194.10175694298664,135.68517015256216" class="line "/><polyline points="312,140 366,140" class="line "/><path d="M358.10175694298664,144.31482984743784 L366.0,140.0 L358.10175694298664,135.68517015256216" class="line "/><text x="178" y="200" class="" text-anchor="middle">calls</text><text x="340" y="200" class="" text-anchor="middle">writes</text><text x="24" y="264" class="small" text-anchor="start">PROCESS · Who does the work?</text><rect x="24" y="288" width="220" height="100" rx="5" class="box "/><text x="134.0" y="332.0" class="" text-anchor="middle">Coordinator</text><text x="134.0" y="356.0" class="" text-anchor="middle">Checks request</text><rect x="284" y="288" width="212" height="100" rx="5" class="box "/><text x="390.0" y="332.0" class="" text-anchor="middle">Technician</text><text x="390.0" y="356.0" class="" text-anchor="middle">Diagnoses fault</text><polyline points="244,338 284,338" class="line "/><path d="M276.10175694298664,342.3148298474378 L284.0,338.0 L276.10175694298664,333.6851701525622" class="line "/><text x="24" y="428" class="small note" text-anchor="start">The arrow passes work to the next activity.</text><text x="24" y="490" class="small" text-anchor="start">LIFECYCLE · When may repair begin?</text><rect x="24" y="514" width="200" height="70" rx="5" class="box "/><text x="124.0" y="543.0" class="" text-anchor="middle">Awaiting</text><text x="124.0" y="567.0" class="" text-anchor="middle">approval</text><rect x="310" y="514" width="186" height="70" rx="5" class="box "/><text x="403.0" y="555.0" class="" text-anchor="middle">Approved</text><polyline points="224,549 310,549" class="line "/><path d="M302.10175694298664,553.3148298474379 L310.0,549.0 L302.10175694298664,544.6851701525621" class="line "/><text x="267" y="624" class="" text-anchor="middle">customer approves quote</text></svg>