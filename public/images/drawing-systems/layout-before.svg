<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" role="img"><title>Before layout repair: correct parts scattered in the order they were mentioned</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">A drawing assembled as people spoke</text><rect x="36" y="90" width="146" height="60" rx="5" class="box "/><text x="109.0" y="126.0" class="" text-anchor="middle">Browser</text><rect x="322" y="110" width="154" height="60" rx="5" class="box "/><text x="399.0" y="146.0" class="" text-anchor="middle">Repair DB</text><rect x="190" y="250" width="150" height="60" rx="5" class="box "/><text x="265.0" y="286.0" class="" text-anchor="middle">Repair API</text><rect x="30" y="410" width="176" height="70" rx="5" class="box "/><text x="118.0" y="439.0" class="" text-anchor="middle">Notification</text><text x="118.0" y="463.0" class="" text-anchor="middle">provider</text><rect x="320" y="420" width="176" height="70" rx="5" class="box "/><text x="408.0" y="461.0" class="" text-anchor="middle">Worker</text><polyline points="182,120 265,120 265,250" class="line "/><path d="M260.6851701525622,242.10175694298664 L265.0,250.0 L269.3148298474378,242.10175694298664" class="line "/><polyline points="340,280 399,280 399,170" class="line "/><path d="M403.3148298474378,177.89824305701336 L399.0,170.0 L394.6851701525622,177.89824305701336" class="line "/><polyline points="408,420 408,190 399,190 399,170" class="line "/><path d="M403.3148298474378,177.89824305701336 L399.0,170.0 L394.6851701525622,177.89824305701336" class="line "/><polyline points="320,455 206,455" class="line "/><path d="M213.89824305701336,450.6851701525622 L206.0,455.0 L213.89824305701336,459.3148298474378" class="line "/><text x="250" y="98" class="small label" text-anchor="start">submits</text><text x="348" y="246" class="small label" text-anchor="start">writes</text><text x="417" y="349" class="small label" text-anchor="start">reads</text><text x="250" y="443" class="small label" text-anchor="middle">sends</text><text x="24" y="550" class="small note" text-anchor="start">The request path turns down, then back up.</text><text x="24" y="580" class="small note" text-anchor="start">Arrows reverse direction across the board.</text><text x="24" y="610" class="small note" text-anchor="start">Spacing hides the two paths.</text></svg>