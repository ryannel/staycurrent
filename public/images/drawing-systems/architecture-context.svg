<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc"><title id="title">Context · proposed teaching design</title><desc id="desc">Roles use repair management, which depends on an external notification provider.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="650" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Context · proposed teaching design</text><rect x="40" y="75" width="420" height="150" rx="3" class="external"/><text x="250.0" y="129.0" text-anchor="middle" class="">People / roles</text><text x="250.0" y="157.0" text-anchor="middle" class="">Customer · Coordinator</text><text x="250.0" y="185.0" text-anchor="middle" class="">Technician</text><path d="M250 225 L250 340" class="line" marker-end="url(#arrow)"/><text x="270" y="256" text-anchor="start" class="small">Request, triage</text><text x="270" y="282" text-anchor="start" class="small">and record repairs</text><rect x="40" y="340" width="420" height="110" rx="3" class="box"/><text x="250.0" y="374.0" text-anchor="middle" class="">Repair management</text><text x="250.0" y="402.0" text-anchor="middle" class="">Software system</text><text x="250.0" y="430.0" text-anchor="middle" class="">Manages repair cases</text><path d="M250 450 L250 550" class="line" marker-end="url(#arrow)"/><text x="270" y="485" text-anchor="start" class="small">Requests customer</text><text x="270" y="511" text-anchor="start" class="small">notifications</text><rect x="40" y="550" width="420" height="75" rx="3" class="external"/><text x="250.0" y="580.5" text-anchor="middle" class="">Notification provider</text><text x="250.0" y="608.5" text-anchor="middle" class="">External software system</text></svg>