<svg xmlns="http://www.w3.org/2000/svg" width="500" height="780" viewBox="0 0 500 780" role="img" aria-labelledby="title"><title id="title">Repair team owns Repair API, Repair DB, Email jobs and Email worker; worker requests email delivery from an outside Mail provider</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="35" class="title" text-anchor="start">Notification exercise · ownership</text><rect x="20" y="65" width="460" height="410" rx="12" class="line "/><text x="38" y="96" class="small" text-anchor="start">Repair team</text><rect x="40" y="130" width="150" height="65" rx="4" class="line "/><text x="115" y="171" class="" text-anchor="middle">Repair API</text><rect x="310" y="130" width="150" height="65" rx="4" class="line "/><text x="385" y="171" class="" text-anchor="middle">Email jobs</text><rect x="40" y="340" width="150" height="65" rx="4" class="line "/><text x="115" y="381" class="" text-anchor="middle">Repair DB</text><rect x="310" y="340" width="150" height="65" rx="4" class="line "/><text x="385" y="381" class="" text-anchor="middle">Email worker</text><path d="M200 162 H300 M292 155 L300 162 L292 169" class="line "/><text x="250" y="121" class="small" text-anchor="middle">enqueues job</text><path d="M115 205 V330 M108 322 L115 330 L122 322" class="line "/><text x="135" y="258" class="small" text-anchor="start">stores</text><text x="135" y="286" class="small" text-anchor="start">booking</text><path d="M385 330 V205 M378 213 L385 205 L392 213" class="line "/><text x="365" y="258" class="small" text-anchor="end">takes</text><text x="365" y="286" class="small" text-anchor="end">job</text><rect x="145" y="605" width="210" height="65" rx="4" class="line "/><text x="250" y="646" class="" text-anchor="middle">Mail provider</text><path d="M385 415 V540 H250 V595 M243 587 L250 595 L257 587" class="line "/><text x="24" y="520" class="small" text-anchor="start">requests email delivery</text><text x="250" y="709" class="small" text-anchor="middle">Outside the repair team</text><text x="24" y="749" class="small" text-anchor="start">Arrows describe use, not message direction.</text></svg>