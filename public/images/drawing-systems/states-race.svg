<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc"><title id="title">Two accepted orders</title><desc id="desc">If cancellation is accepted first, start is refused. If start is accepted first, cancellation is refused.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="650" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Two accepted orders</text><rect x="25" y="70" width="450" height="245" rx="3" class="plain"/><text x="45" y="104" text-anchor="start" class="strong">A · cancellation accepted first</text><text x="50" y="145" text-anchor="start" class="">Start: Approved</text><text x="50" y="189" text-anchor="start" class="">1. Cancel → Cancelled</text><text x="50" y="233" text-anchor="start" class="">2. Start → refused</text><text x="50" y="277" text-anchor="start" class="">Result: Cancelled</text><rect x="25" y="345" width="450" height="245" rx="3" class="plain"/><text x="45" y="379" text-anchor="start" class="strong">B · start accepted first</text><text x="50" y="420" text-anchor="start" class="">Start: Approved</text><text x="50" y="464" text-anchor="start" class="">1. Start → In repair</text><text x="50" y="508" text-anchor="start" class="">2. Cancel → refused</text><text x="50" y="552" text-anchor="start" class="">Result: In repair</text><text x="250" y="628" text-anchor="middle" class="small">Each decision checks the current state.</text></svg>