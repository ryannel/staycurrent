<svg xmlns="http://www.w3.org/2000/svg" width="500" height="900" viewBox="0 0 500 900" role="img" aria-labelledby="title desc"><title id="title">Lifecycle · one RepairRequest</title><desc id="desc">Created in Submitted, a request moves through diagnosis, quote approval, repair and completion.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="900" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Lifecycle · one RepairRequest</text><circle cx="250" cy="65" r="6" class="accent"/><path d="M250 71 L250 95" class="line" marker-end="url(#arrow)"/><rect x="60" y="95" width="380" height="65" rx="3" class="box"/><text x="250.0" y="134.5" text-anchor="middle" class="">Submitted</text><path d="M250 160 L250 235" class="line" marker-end="url(#arrow)"/><text x="270" y="203" text-anchor="start" class="small">Accept triage</text><rect x="60" y="235" width="380" height="65" rx="3" class="box"/><text x="250.0" y="274.5" text-anchor="middle" class="">Diagnosing</text><path d="M250 300 L250 375" class="line" marker-end="url(#arrow)"/><text x="270" y="343" text-anchor="start" class="small">Issue quote</text><rect x="60" y="375" width="380" height="65" rx="3" class="box"/><text x="250.0" y="414.5" text-anchor="middle" class="">Awaiting approval</text><path d="M250 440 L250 515" class="line" marker-end="url(#arrow)"/><text x="270" y="483" text-anchor="start" class="small">Approve quote</text><rect x="60" y="515" width="380" height="65" rx="3" class="box"/><text x="250.0" y="554.5" text-anchor="middle" class="">Approved</text><path d="M250 580 L250 655" class="line" marker-end="url(#arrow)"/><text x="270" y="623" text-anchor="start" class="small">Start repair</text><rect x="60" y="655" width="380" height="65" rx="3" class="box"/><text x="250.0" y="694.5" text-anchor="middle" class="">In repair</text><path d="M250 720 L250 795" class="line" marker-end="url(#arrow)"/><text x="270" y="763" text-anchor="start" class="small">Complete repair</text><rect x="60" y="795" width="380" height="65" rx="3" class="box"/><text x="250.0" y="834.5" text-anchor="middle" class="">Completed</text><text x="250" y="889" text-anchor="middle" class="small muted">Successful route; cancellation shown separately</text></svg>