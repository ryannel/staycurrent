<svg xmlns="http://www.w3.org/2000/svg" width="520" height="370" viewBox="0 0 520 370" role="img" aria-labelledby="title"><title id="title">Status requests repeat while the page is open and status remains nonterminal</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="370" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">A proposed status refresh</tspan></text><rect x="45" y="60" width="140" height="65" rx="9" class="node"/><text x="115.0" y="86.5" text-anchor="middle"><tspan x="115.0" dy="0">Browser</tspan><tspan x="115.0" dy="26">UI</tspan></text><path d="M115 125L115 345" class="life"/><rect x="335" y="60" width="140" height="65" rx="9" class="node"/><text x="405.0" y="86.5" text-anchor="middle"><tspan x="405.0" dy="0">Repair</tspan><tspan x="405.0" dy="26">API</tspan></text><path d="M405 125L405 345" class="life"/><rect x="25" y="145" width="470" height="195" class="line"/><text x="40" y="170" text-anchor="start" class="small"><tspan x="40" dy="0">loop: page open; status not terminal</tspan></text><path d="M115 225L405 225" class="line" marker-end="url(#a)"/><text x="260.0" y="213" text-anchor="middle" class="small"><tspan x="260.0" dy="0">Read status of R17</tspan></text><path d="M405 285L115 285" class="line dash" marker-end="url(#a)"/><text x="260.0" y="273" text-anchor="middle" class="small"><tspan x="260.0" dy="0">Current status</tspan></text><text x="260" y="325" text-anchor="middle" class="small muted"><tspan x="260" dy="0">Wait before next refresh</tspan></text></svg>