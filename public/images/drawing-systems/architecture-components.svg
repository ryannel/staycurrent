<svg xmlns="http://www.w3.org/2000/svg" width="500" height="850" viewBox="0 0 500 850" role="img" aria-labelledby="title desc"><title id="title">Components · inside Repair API</title><desc id="desc">Browser UI calls HTTP interface, request rules use the request repository, which persists data in Repair DB.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="850" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">Components · inside Repair API</text><rect x="65" y="70" width="370" height="75" rx="3" class="external"/><text x="250.0" y="100.5" text-anchor="middle" class="">Browser UI</text><text x="250.0" y="128.5" text-anchor="middle" class="">Neighbouring container</text><path d="M250 145 L250 250" class="line" marker-end="url(#arrow)"/><text x="270" y="177" text-anchor="start" class="small">Operations</text><text x="270" y="203" text-anchor="start" class="small">JSON / HTTPS</text><rect x="20" y="210" width="460" height="470" rx="3" class="boundary"/><text x="40" y="238" text-anchor="start" class="small">Repair API · container</text><rect x="65" y="265" width="370" height="75" rx="3" class="box"/><text x="250.0" y="295.5" text-anchor="middle" class="">HTTP interface</text><text x="250.0" y="323.5" text-anchor="middle" class="">Component · TypeScript</text><path d="M250 340 L250 425" class="line" marker-end="url(#arrow)"/><text x="270" y="375" text-anchor="start" class="small">Invokes operations</text><rect x="65" y="425" width="370" height="75" rx="3" class="box"/><text x="250.0" y="455.5" text-anchor="middle" class="">Request rules</text><text x="250.0" y="483.5" text-anchor="middle" class="">Component · TypeScript</text><path d="M250 500 L250 585" class="line" marker-end="url(#arrow)"/><text x="270" y="535" text-anchor="start" class="small">Loads / saves cases</text><rect x="65" y="585" width="370" height="75" rx="3" class="box"/><text x="250.0" y="615.5" text-anchor="middle" class="">Request repository</text><text x="250.0" y="643.5" text-anchor="middle" class="">Component · TypeScript</text><path d="M250 660 L250 745" class="line" marker-end="url(#arrow)"/><text x="270" y="710" text-anchor="start" class="small">SQL / PostgreSQL</text><rect x="65" y="745" width="370" height="80" rx="3" class="external"/><text x="250.0" y="778.0" text-anchor="middle" class="">Repair DB</text><text x="250.0" y="806.0" text-anchor="middle" class="">Neighbouring container</text></svg>