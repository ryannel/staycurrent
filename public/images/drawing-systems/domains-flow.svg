<svg xmlns="http://www.w3.org/2000/svg" width="500" height="490" viewBox="0 0 500 490" role="img" aria-labelledby="title desc"><title id="title">A different view · information flow</title><desc id="desc">Recipient address and message text cross the provider trust boundary from notification worker to provider.</desc><style>:root{color-scheme:light dark;--paper:#faf7ef;--ink:#302f2b;--muted:#62615a;--wash:#e6eeea;--blue:#e9edf3;--accent:#35665c;--rule:#79776e} @media(prefers-color-scheme:dark){:root{--paper:#252723;--ink:#efeee5;--muted:#c0c0b4;--wash:#34463f;--blue:#35404b;--accent:#a4c8ba;--rule:#a6a89a}} .paper{fill:var(--paper)} text{fill:var(--ink);font:22px system-ui,sans-serif} .heading{font-size:24px;font-weight:650}.small{font-size:20px}.muted{fill:var(--muted)}.strong{font-weight:650}.box{fill:var(--wash);stroke:var(--ink);stroke-width:1.6}.external{fill:var(--blue);stroke:var(--ink);stroke-width:1.6}.plain{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.boundary{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:7 5}.line{fill:none;stroke:var(--ink);stroke-width:1.7}.accent{fill:var(--accent)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="500" height="490" class="paper"/><text x="24" y="36" text-anchor="start" class="heading">A different view · information flow</text><rect x="30" y="80" width="440" height="140" rx="3" class="boundary"/><text x="50" y="112" text-anchor="start" class="small">Repair team controls</text><rect x="65" y="140" width="370" height="60" rx="3" class="box"/><text x="250.0" y="177.0" text-anchor="middle" class="">Notification worker</text><path d="M250 200 L250 375" class="line" marker-end="url(#arrow)"/><text x="270" y="253" text-anchor="start" class="small">Recipient address</text><text x="270" y="279" text-anchor="start" class="small">+ message text</text><path d="M30 320 L470 320" class="line"/><text x="40" y="350" text-anchor="start" class="small">Provider trust boundary</text><rect x="65" y="375" width="370" height="75" rx="3" class="external"/><text x="250.0" y="405.5" text-anchor="middle" class="">Notification provider</text><text x="250.0" y="433.5" text-anchor="middle" class="">External system</text></svg>