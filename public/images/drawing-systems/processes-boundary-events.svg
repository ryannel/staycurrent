<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" width="520" height="700" role="img" aria-labelledby="title"><title id="title">A reminder leaves a wait active; cancellation interrupts pre-repair work</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="700" fill="var(--paper)"/>
<text x="24" y="38" class="title">Waiting and cancellation</text>
<text x="24" y="80" class="small">Reminder: the original wait continues</text>
<rect x="45" y="110" width="290" height="80" rx="10" class="node"/>
<text x="190" y="156" text-anchor="middle">Await quote response</text>
<path d="M335 150H470" class="line" marker-end="url(#a)"/>
<text x="400" y="130" class="small" text-anchor="middle">response</text>
<circle cx="280" cy="190" r="22" class="node dash"/><circle cx="280" cy="190" r="17" class="node dash"/>
<circle cx="280" cy="190" r="11" class="node"/><path d="M280 182V190L287 194" class="line"/>
<path d="M280 212V270" class="line" marker-end="url(#a)"/><text x="300" y="243" class="small">after 2 days</text>
<rect x="160" y="270" width="240" height="65" rx="10" class="node"/><text x="280" y="309" text-anchor="middle">Send reminder</text>
<text x="24" y="395" class="small">Cancellation: stop the enclosing work</text>
<rect x="45" y="425" width="290" height="105" rx="10" class="node"/><text x="190" y="468" text-anchor="middle">Pre-repair work</text><rect x="180" y="495" width="20" height="20" class="node"/><text x="190" y="511" class="small" text-anchor="middle">+</text>
<path d="M335 465H470" class="line" marker-end="url(#a)"/><text x="400" y="445" class="small" text-anchor="middle">to repair</text>
<circle cx="280" cy="530" r="22" class="node"/><circle cx="280" cy="530" r="17" class="node"/>
<rect x="269" y="523" width="22" height="14" class="node"/><path d="M269 523L280 531L291 523" class="line"/>
<path d="M280 552V610" class="line" marker-end="url(#a)"/><text x="305" y="581" class="small">cancel request</text>
<rect x="140" y="610" width="280" height="65" rx="10" class="node"/><text x="280" y="649" text-anchor="middle">Record cancellation</text></svg>