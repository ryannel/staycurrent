<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title"><title id="title">A request is stored before the browser receives its receipt</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="440" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Successful request submission</tspan></text><rect x="10" y="60" width="140" height="65" rx="9" class="node"/><text x="80.0" y="86.5" text-anchor="middle"><tspan x="80.0" dy="0">Browser</tspan><tspan x="80.0" dy="26">UI</tspan></text><path d="M80 125L80 415" class="life"/><rect x="190" y="60" width="140" height="65" rx="9" class="node"/><text x="260.0" y="86.5" text-anchor="middle"><tspan x="260.0" dy="0">Repair</tspan><tspan x="260.0" dy="26">API</tspan></text><path d="M260 125L260 415" class="life"/><rect x="370" y="60" width="140" height="65" rx="9" class="node"/><text x="440.0" y="86.5" text-anchor="middle"><tspan x="440.0" dy="0">Repair</tspan><tspan x="440.0" dy="26">DB</tspan></text><path d="M440 125L440 415" class="life"/><path d="M80 175L260 175" class="line" marker-end="url(#a)"/><text x="170.0" y="163" text-anchor="middle" class="small"><tspan x="170.0" dy="0">Submit repair</tspan><tspan x="170.0" dy="26">request</tspan></text><path d="M260 250L440 250" class="line" marker-end="url(#a)"/><text x="350.0" y="238" text-anchor="middle" class="small"><tspan x="350.0" dy="0">Store request</tspan><tspan x="350.0" dy="26">and job</tspan></text><path d="M440 330L260 330" class="line dash" marker-end="url(#a)"/><text x="350.0" y="318" text-anchor="middle" class="small"><tspan x="350.0" dy="0">Commit succeeded</tspan></text><path d="M260 400L80 400" class="line dash" marker-end="url(#a)"/><text x="170.0" y="388" text-anchor="middle" class="small"><tspan x="170.0" dy="0">Received: R17</tspan></text></svg>