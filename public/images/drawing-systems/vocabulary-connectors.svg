<svg xmlns="http://www.w3.org/2000/svg" width="500" height="440" viewBox="0 0 500 440" role="img" aria-labelledby="title"><title id="title">Repair API stores a booking in Repair DB, and enqueues a confirmation in Email jobs; each relationship has a verb</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="38" class="title" text-anchor="start">Use one arrow meaning per view</text><rect x="25" y="75" width="145" height="60" rx="5" class="line "/><text x="97" y="113" class="" text-anchor="middle">Repair API</text><rect x="330" y="75" width="145" height="60" rx="5" class="line "/><text x="402" y="113" class="" text-anchor="middle">Repair DB</text><path d="M175 105 H322 M313 99 L322 105 L313 111" class="line "/><text x="250" y="174" class="small" text-anchor="middle">stores booking</text><text x="24" y="218" class="small" text-anchor="start">Structure: who uses what?</text><rect x="25" y="267" width="145" height="60" rx="5" class="line "/><text x="97" y="305" class="" text-anchor="middle">Repair API</text><rect x="330" y="267" width="145" height="60" rx="5" class="line "/><text x="402" y="305" class="" text-anchor="middle">Email jobs</text><path d="M175 297 H322 M313 291 L322 297 L313 303" class="line "/><text x="250" y="365" class="small" text-anchor="middle">enqueues confirmation</text><text x="24" y="410" class="small" text-anchor="start">Message movement: what is sent?</text></svg>