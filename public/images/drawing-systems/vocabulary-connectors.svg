<svg xmlns="http://www.w3.org/2000/svg" width="500" height="440" viewBox="0 0 500 440" role="img" aria-labelledby="title"><title id="title">Structural view: Email worker takes job from Email jobs. Data flow: confirmation job travels from Email jobs to Email worker.</title><style>:root{--paper:#f8f5ed;--ink:#363b3c;--muted:#66716f;--rule:#d7d9d1;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#e8eee8}@media(prefers-color-scheme:dark){:root{--paper:#252827;--ink:#eee9df;--muted:#bcc6c1;--rule:#59615e;--blue:#8dbbdf;--green:#8dc5b4;--red:#e8a08b;--purple:#c8afe1;--wash:#35423c}}@media print{:root{--paper:#fff;--ink:#252b2b;--muted:#56605d;--rule:#c8cec9;--blue:#356b96;--green:#367468;--red:#a04f3d;--purple:#79628e;--wash:#edf1ec}}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px} .small{font-size:20px;fill:var(--muted)}.title{font-size:26px;font-weight:650}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.new{stroke:var(--blue)}.wash{fill:var(--wash)}.rule{stroke:var(--rule);stroke-width:1}.accent{fill:var(--blue)} </style><rect width="100%" height="100%" fill="var(--paper)"/><text x="24" y="36" class="title">Same pair, two arrow meanings</text><text x="24" y="72" class="small" text-anchor="start">STRUCTURE · arrow = uses</text><rect x="25" y="92" width="145" height="60" rx="5" class="line"/><text x="97.5" y="129" class="" text-anchor="middle">Email worker</text><rect x="330" y="92" width="145" height="60" rx="5" class="line"/><text x="402.5" y="129" class="" text-anchor="middle">Email jobs</text><path d="M178 122 H322 M313 116 L322 122 L313 128" class="line"/><text x="250" y="190" class="small" text-anchor="middle">takes job from</text><text x="24" y="255" class="small" text-anchor="start">DATA FLOW · arrow = movement</text><rect x="25" y="277" width="145" height="60" rx="5" class="line"/><text x="97.5" y="314" class="" text-anchor="middle">Email worker</text><rect x="330" y="277" width="145" height="60" rx="5" class="line"/><text x="402.5" y="314" class="" text-anchor="middle">Email jobs</text><path d="M322 307 H178 M187 301 L178 307 L187 313" class="line"/><text x="250" y="375" class="small" text-anchor="middle">confirmation job</text><text x="24" y="420" class="small" text-anchor="start">The queue and worker stay in the same places.</text></svg>