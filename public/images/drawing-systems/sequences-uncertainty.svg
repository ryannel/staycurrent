<svg xmlns="http://www.w3.org/2000/svg" width="520" height="580" viewBox="0 0 520 580" role="img" aria-labelledby="title"><title id="title">Two different provider histories can leave a worker without a reply</title><style>
:root{--paper:#faf8f1;--ink:#303a3b;--muted:#596565;--soft:#e8e9e2;--blue:#245b9a;--green:#26704c;--red:#a33932;--purple:#75539d}
@media(prefers-color-scheme:dark){:root{--paper:#202728;--ink:#ecede5;--muted:#bdc6c2;--soft:#364140;--blue:#8fbcf1;--green:#91c8a3;--red:#f2a095;--purple:#c7a5ed}}
text{font-family:ui-sans-serif,system-ui,sans-serif;font-size:21px;fill:var(--ink)}.title{font-size:23px;font-weight:650}.small{font-size:18px}.muted{fill:var(--muted)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 6}.life{stroke:var(--muted);stroke-width:1.7;stroke-dasharray:6 5}.soft{fill:var(--soft)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.red{fill:var(--red)}.green{fill:var(--green)}.blueline{stroke:var(--blue)}.purpleline{stroke:var(--purple)}.redline{stroke:var(--red)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="var(--ink)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker></defs><rect width="520" height="580" fill="var(--paper)"/><text x="24" y="35" text-anchor="start" class="title"><tspan x="24" dy="0">Same observation: no reply</tspan></text><text x="24" y="75" text-anchor="start" class="small"><tspan x="24" dy="0">A. Request never reaches provider</tspan></text><rect x="35" y="100" width="140" height="55" rx="9" class="node"/><text x="105.0" y="134.5" text-anchor="middle"><tspan x="105.0" dy="0">Worker</tspan></text><rect x="345" y="100" width="140" height="55" rx="9" class="node"/><text x="415.0" y="134.5" text-anchor="middle"><tspan x="415.0" dy="0">Provider</tspan></text><path d="M105 155L105 270" class="life"/><path d="M415 155L415 270" class="life"/><path d="M105 190L250 190" class="line"/><text x="200" y="175" text-anchor="middle" class="small"><tspan x="200" dy="0">Request email</tspan></text><path d="M240 180L260 200M260 180L240 200" class="line redline"/><text x="110" y="290" text-anchor="start" class="small purple"><tspan x="110" dy="0">Timeout: outcome unknown</tspan></text><text x="24" y="310" text-anchor="start" class="small"><tspan x="24" dy="0">B. Provider accepts; reply is lost</tspan></text><rect x="35" y="335" width="140" height="55" rx="9" class="node"/><text x="105.0" y="369.5" text-anchor="middle"><tspan x="105.0" dy="0">Worker</tspan></text><rect x="345" y="335" width="140" height="55" rx="9" class="node"/><text x="415.0" y="369.5" text-anchor="middle"><tspan x="415.0" dy="0">Provider</tspan></text><path d="M105 390L105 505" class="life"/><path d="M415 390L415 505" class="life"/><path d="M105 425L415 425" class="line" marker-end="url(#a)"/><text x="260.0" y="413" text-anchor="middle" class="small"><tspan x="260.0" dy="0">Request email</tspan></text><text x="450" y="460" text-anchor="middle" class="small"><tspan x="450" dy="0">accepts</tspan></text><path d="M415 485L250 485" class="line dash"/><path d="M240 475L260 495M260 475L240 495" class="line redline"/><text x="110" y="525" text-anchor="start" class="small purple"><tspan x="110" dy="0">Timeout: outcome unknown</tspan></text><text x="260" y="565" text-anchor="middle" class="small purple"><tspan x="260" dy="0">? Could a retry send a second email?</tspan></text></svg>