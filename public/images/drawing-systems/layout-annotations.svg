<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img"><title>Current unknown provider behaviour and a separate proposed request key change</title><style>svg{--paper:#f0ede5;--ink:#34322e;--muted:#615d55;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89;background:var(--paper)}text{font:19px system-ui,sans-serif;fill:var(--ink)}.head{font-size:21px;font-weight:600}.small{font-size:18px}.note{fill:var(--muted)}.line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--paper);stroke:var(--ink);stroke-width:2}.blue{stroke:var(--blue)}.green{stroke:var(--green)}.red{stroke:var(--red)}.purple{stroke:var(--purple)}.label{paint-order:stroke;stroke:var(--paper);stroke-width:8;stroke-linejoin:round}@media(prefers-color-scheme:dark){svg{--paper:#262320;--ink:#e2dccf;--muted:#b5aea0;--blue:#91bfe2;--green:#a1ceaa;--red:#efa59c;--purple:#ceb0e0}}@media print{svg{--paper:#fff;--ink:#222;--muted:#444;--blue:#275f85;--green:#306b48;--red:#a43e39;--purple:#764d89}}</style><text x="24" y="36" class="head" text-anchor="start">An annotation sits beside the relationship</text><rect x="24" y="84" width="150" height="68" rx="5" class="box "/><text x="99.0" y="124.0" class="" text-anchor="middle">Worker</text><rect x="310" y="84" width="186" height="68" rx="5" class="box "/><text x="403.0" y="124.0" class="" text-anchor="middle">Provider</text><polyline points="174,118 310,118" class="line blue"/><path d="M302.10175694298664,122.31482984743782 L310.0,118.0 L302.10175694298664,113.68517015256218" class="line blue"/><text x="240" y="184" class="label" text-anchor="middle">① sends email</text><path d="M242,194 L242,236" class="line purple"/><text x="28" y="274" class="" text-anchor="start">? CHECK · Does the provider deduplicate?</text><text x="28" y="310" class="small note" text-anchor="start">Owner: Sam · verify the API contract</text><text x="24" y="380" class="head" text-anchor="start"