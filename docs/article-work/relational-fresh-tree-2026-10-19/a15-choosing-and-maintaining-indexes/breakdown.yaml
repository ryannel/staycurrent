topic: Relational indexes and access methods
title: Choosing and maintaining indexes
brief: >-
  Teach index judgement through an order lookup, a customer's recent orders and a
  small active-order queue. Follow an ordered lookup through index entries and row
  fetches, then design the smallest index set that serves these reads without
  imposing excessive write, storage, logging or cache costs. Develop composite key
  order, ordering and limits, covering, predicate eligibility, partial and expression
  indexes, uniqueness and clustered versus secondary row locators. Use PostgreSQL
  18 for executable examples and MySQL 8.4 InnoDB where a contrasting implementation
  changes the decision; label each contract. Finish with evidence for building,
  consolidating, rebuilding or removing an index. Own access eligibility, key and
  locator design and index-set costs. Refer physical layout, caches and cleanup to
  storage; estimates and statistics to execution; workload experiments to
  investigation; integrity design and operational change procedures to their owners.
heading:
  - title: Follow a lookup from the index to the row
    brief: >-
      Start with finding one order in a large table. Show a bounded illustrative
      ordered tree, its search keys, leaf entries and row locators, then follow a
      range through adjacent entries and fetch the required rows. Distinguish tree
      descent, entries examined, rows fetched and rows returned; a short descent
      does not imply a cheap query. Compare a small result scattered across table
      pages with a broad result served by a scan. Treat diagrams as a model rather
      than observed engine execution, with a small measured PostgreSQL plan as a
      separate check; leave page layout and buffer mechanisms to storage.
    heading:
      - title: Know what the locator points to
        brief: >-
          Contrast a PostgreSQL index's heap tuple locator with an InnoDB secondary
          entry's clustered primary key and the resulting second tree lookup.
          Explain which structure holds row values and why a wide or changing
          clustered key affects secondary indexes. A logical primary key is not
          universally the table's physical order; distinguish continuously
          maintained clustered organisation from PostgreSQL's one-off CLUSTER
          rewrite. Give the key-design consequence here and link to storage for
          physical organisation and updates, and integrity design for identity.
  - title: Put keys in the order the workload needs
    brief: >-
      Develop one candidate for customer recent-order reads from the actual filter,
      order and output contract. Make lexicographic order visible using
      (customer_id, created_at, order_id), with a stable tie-breaker. Compare this
      candidate with reversed columns and separate indexes before offering rules.
      Choose among competing query shapes rather than indexing every predicate.
    heading:
      - title: Separate a narrow search interval from later filtering
        brief: >-
          Trace leading equalities, the first range and constraints on later keys;
          distinguish conditions that bound the scanned interval from those that
          reject entries before fetching rows. Contrast a missing leading key and
          two range predicates. Avoid both 'most selective first' and 'nothing
          after the first range helps' as universal rules. Briefly show PostgreSQL
          18 skip scan as a conditional alternative for suitable leading-key
          cardinalities, not a replacement for workload-led key order; execution
          owns the estimate that makes it attractive.
      - title: Reuse order and stop after enough rows
        brief: >-
          Explain when an index supplies ORDER BY and LIMIT without sorting many
          rows, including the effect of fixed leading keys, mixed ascending and
          descending directions, backward scans and null ordering. An index's
          physical traversal never promises SQL output order without ORDER BY.
          Show an early-stop query that wins despite moderate selectivity and a
          mismatched order that still needs a sort; leave sort algorithms to
          execution and pagination protocols to application engineering.
  - title: Avoid row fetches only when the saving pays for the width
    brief: >-
      Add the small payload needed by the recent-orders screen, distinguish search
      keys from included columns, and compare a covering candidate with fetching
      the rows. Covering is relative to a query, including its filters, rather than
      a property that makes every query index-only. Explain that PostgreSQL's
      visibility checks can still require heap fetches and use that evidence to
      challenge the expected saving; refer MVCC and cleanup mechanisms to storage.
      Contrast InnoDB's clustered-key presence in secondary entries where it
      changes coverage. Account for wider entries, extra writes and reduced cache
      capacity before adding payload; do not advocate covering SELECT *.
  - title: Check whether the query is eligible to use the index
    brief: >-
      Separate 'the access method cannot answer this condition' from 'the planner
      estimates a different eligible path is cheaper'. Use small before-and-after
      predicates to examine casts, parameter types, functions, collations,
      comparison operators and prefix versus leading-wildcard text matching.
      Do not teach that every cast or function prevents index access: locate which
      side changes and check the named engine's supported operators and matching
      rules. Preserve SQL meaning when rewriting, especially nulls, time zones and
      case comparison. Refer cost estimates, statistics and plan caching mechanics
      to execution.
    heading:
      - title: Index an expression or a useful subset
        brief: >-
          Use one normalised lookup and the active-order queue to motivate
          expression and partial indexes. Explain expression matching and
          engine-specific function restrictions, computation and maintenance
          costs, rows entering or leaving a subset, and how a query must establish
          the partial predicate. Contrast a literal predicate with a generic
          parameterised plan that cannot prove it; do not claim that all prepared
          statements are ineligible. PostgreSQL features are examples, not portable
          DDL. Explain why a fleet of partial indexes for every category is usually
          a poor substitute for a suitable composite index or partitioning.
      - title: Preserve the index's integrity role
        brief: >-
          Distinguish an index used to accelerate reads from one enforcing a unique
          key or supporting a constraint. Explain that search-key columns and
          included payload have different uniqueness roles, and flag named-engine
          differences in null uniqueness and constraint/index dependencies.
          Indexes supporting foreign-key checks can matter even when ordinary
          select-query counters are quiet; automatic creation differs by engine.
          Refer rule design and concurrent enforcement to integrity and transaction
          articles, while making constraint dependencies a required input to any
          consolidation or removal decision.
  - title: Choose an access path for the amount and kind of work
    brief: >-
      Compare one composite index, combinations of single-column indexes and a
      table scan against the same query and result. PostgreSQL bitmap combinations
      can combine AND or OR conditions and group heap visits, but have their own
      startup, recheck and ordering consequences; they do not preserve the useful
      order of an ordinary ordered scan. A scan may win for broad results, small
      tables or locality, while a narrow covering index or early stop can change
      the answer. Use examined entries and table fetches, not a universal
      selectivity percentage; execution owns the chosen plan and its estimates.
    heading:
      - title: Change access method when the question changes
        brief: >-
          Use three short workload contrasts rather than a method catalogue:
          exact equality that might justify a hash index, token or membership
          search that benefits from an inverted index, and range-overlap or spatial
          predicates that need a suitable specialised structure. In PostgreSQL,
          name hash, GIN and GiST only to connect supported operators, possible
          rechecks and write costs to those questions; do not promise one structure
          supports every operator or supplies ordered output. Give coarse summaries
          such as BRIN only the local consequence that candidate page ranges may
          still need scanning and rechecking, and refer their mechanism and physical
          correlation to execution. Retain one decision table in this section,
          without separate child articles or product tutorials.
  - title: Judge the whole index set against reads and writes
    brief: >-
      Return to the lookup, recent-order read and active queue beside reservation
      updates. Assemble a small candidate set and account for inserts, deletes,
      changed keys and payloads, predicate membership, expression computation,
      uniqueness checks, storage, log volume and cache competition. Explain that
      update work depends on the engine and changed columns rather than every
      index always receiving the same change. Link to storage for splits,
      retained versions and cleanup mechanisms, giving only their index-design
      consequences here. Compare a narrow prefix index with a longer candidate:
      apparent prefix coverage does not prove redundancy when width, ordering,
      uniqueness, predicates, operators or read patterns differ.
  - title: Build, observe and retire indexes with evidence
    brief: >-
      Finish with one index decision record: target query shapes and baseline,
      candidate definition, expected access and work reduction, write and space
      budget, observed results and conditions for keeping or removing it. Consume
      representative measurements from investigation rather than reteaching
      benchmarking. Monitor usage over a meaningful workload cycle, query plans,
      size, row-fetch evidence and write effects, accounting for reset counters,
      rare critical jobs and reads on other servers. Treat advisor suggestions and
      zero scans as hypotheses, not authority to create or drop.
    heading:
      - title: Building online still consumes resources and takes locks
        brief: >-
          Contrast ordinary and concurrent PostgreSQL builds, including extra
          work, waits for transactions, failure leaving an invalid index and
          unique-build interactions with concurrent writers. Contrast InnoDB's
          supported online secondary-index creation with clustered-key changes
          that rebuild the table, using version-specific operation support.
          Account for temporary and final disk use, CPU, I/O, logging, lock phases
          and replication consequences; online does not mean no blocking or no
          workload impact. Identify the observations and preconditions an
          operational change procedure must handle; leave the runbook, backfill
          coordination and rollback protocol to operations and application
          engineering.
      - title: Consolidate, rebuild or remove for a stated reason
        brief: >-
          Distinguish changing a definition, reclaiming demonstrated wasted space,
          repairing a damaged or invalid structure and refreshing planner
          statistics; rebuilding is not a universal cure for a bad plan or a
          calendar-based obligation. Explain how storage's cleanup evidence and
          execution's plan evidence lead to different actions. Before removal,
          reconcile overlapping definitions and constraint dependencies, check
          affected query shapes and infrequent jobs, and retain recreation and
          verification requirements for the operational owner. End by deciding
          which candidate to keep, shrink, replace or reject for the running
          workload, with reasons that remain testable as it changes.
