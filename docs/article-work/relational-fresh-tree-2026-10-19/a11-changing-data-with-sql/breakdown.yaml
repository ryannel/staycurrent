topic: SQL data-change statement semantics
title: Changing data with SQL
brief: >-
  Make one PostgreSQL 18 data-change statement meet an explicit contract: intended
  identities, resulting values, returned rows and failure behaviour. Begin beyond
  the parent's basic INSERT, UPDATE and DELETE sequence, using the same order
  fixture with a resettable input batch. Develop defaults and generated values,
  predicates and old-value expressions, joined changes, ON CONFLICT and MERGE,
  affected counts, RETURNING, constraint timing and trigger effects. Challenge
  missing and repeated inputs, suppressed writes and successful statements whose
  transaction can still fail. Keep concurrency histories and commit protocols in
  transactions, integrity design in modelling, ambiguous client outcomes and
  ingestion workflows in application engineering. No further article is needed:
  optional combined-statement depth remains beside the results it explains.
heading:
  - title: State the change before running it
    brief: >-
      Reuse the parent's orders and order lines rather than replaying syntax.
      Add a tiny input_changes fixture containing a valid key, an absent key and
      a repeated key. Require a contract for target identities, one input meaning
      per identity, assignments, rejected and skipped inputs, and expected returned
      identities. Ask readers to predict these before each run, then reset and
      compare identities, values and unchanged rows. Explain that a prior SELECT
      preview helps inspect a predicate but does not reserve the rows for a later
      write; hand that guarantee to transactions.
  - title: Derive the rows and values a statement changes
    brief: >-
      Extend the known statements with a multi-row INSERT source and a conditional
      order-line UPDATE; account for empty sources and predicates that are false
      or unknown. Show omitted columns, DEFAULT, explicit NULL, identity values
      and computed generated columns as distinct choices. Explain that SET
      expressions read the row's old values, not earlier assignments in textual
      order, with a two-column prediction exercise. Distinguish a target row
      matching an UPDATE from its value actually changing. Explain DELETE's
      predicate against the same intended-identity contract; do not reteach its
      introductory syntax.
  - title: Make each joined change unambiguous
    brief: >-
      Change order-line quantities from the input batch using UPDATE ... FROM;
      delete selected lines with DELETE ... USING. Require at most one meaningful
      source value for each target identity. Expose duplicate matches: UPDATE
      chooses one matching source row without a reliable choice, while DELETE
      still removes a target once and source-derived RETURNING fields must not
      be treated as a reliable explanation of which duplicate caused it. Check
      missing keys and repeated input keys explicitly before choosing a unique
      key, a deliberate aggregation rule, or rejection; DISTINCT is not a business
      rule for conflicting values. Contrast a scalar assignment subquery's
      cardinality error with a joined update's ambiguity. Verify the changed
      identity set and reconcile unmatched inputs, including the empty batch.
  - title: Read what the statement actually returned
    brief: >-
      Compare command counts, returned identities and postcondition checks on one
      fixture. Teach PostgreSQL 18 RETURNING expressions with OLD and NEW: inserted
      defaults, before/after update values and deleted values, with aliases where
      helpful. Counts can include same-value updates; a count alone does not
      identify rows, detect the wrong predicate, or enumerate cascades and trigger
      writes. A zero-row result needs interpretation from the statement contract.
      Treat returned rows as unordered unless a containing query supplies ordering.
      Finish each example by comparing the returned identity set and independently
      checking persisted values within its stated transaction context.
    heading:
      - title: A returned row is not a committed transaction
        brief: >-
          Separate errors during execution, end-of-statement checks for applicable
          immediate deferrable constraints, and outstanding deferred checks.
          PostgreSQL non-deferrable checks need not wait until statement end;
          NOT NULL and CHECK are not deferrable. Provide a small supplied deferrable
          foreign-key fixture: BEGIN, set the applicable check deferred, make a
          temporarily invalid change with RETURNING, observe returned identities,
          then show rejection at COMMIT and the absence of a committed result.
          Contrast an ordinary statement-time constraint failure and avoid treating
          provisional streamed rows as a successful command. Explain that unhandled
          statement failure aborts the current transaction; transaction recovery,
          savepoints and choosing deferral belong to transactions, constraint
          property design to modelling. The lesson owns result meaning only.
  - title: Decide what a conflict should mean
    brief: >-
      Extend the same fixture with a non-deferrable unique order-line key and
      incoming quantities. Use ON CONFLICT DO NOTHING and DO UPDATE, explaining
      conflict-target inference or a named supported arbiter, existing values,
      EXCLUDED values and the update predicate. Distinguish a conflict-target
      predicate from the predicate deciding whether to update. Predict insert,
      update, skip and unrelated-error outcomes; a false update predicate or
      DO NOTHING yields no returned row for that input. Expose repeated proposed
      keys and the DO UPDATE cardinality error rather than promising input
      deduplication. State PostgreSQL's insert-or-update contract with its predicate
      and independent-error qualifications; defer competing-writer histories,
      locks, retries and idempotency to their owners.
    heading:
      - title: Choose MERGE for a matched-action contract
        brief: >-
          Contrast MERGE with ON CONFLICT through a small explicit source/target
          action table: matched, not matched by target, and not matched by source.
          Separate join classification from WHEN conditions; apply only the first
          applicable WHEN action and explain DO NOTHING. Show why a target-only
          condition in ON can change classification unexpectedly. Require a unique
          source-to-target action mapping and expose a repeated modifying match's
          cardinality failure. Use PostgreSQL 18 RETURNING plus merge_action() to
          check inserted, updated and deleted identities; skipped actions return
          none. Do not promise ON CONFLICT's competing-insert contract for MERGE;
          hand the concurrency comparison to transactions. Keep a complete-source
          deletion example bounded and explicitly label when absence means delete.
  - title: Account for effects the statement text does not show
    brief: >-
      Use supplied tiny trigger definitions and an audit table, introducing only
      the function syntax necessary to read their effects. Ask readers to predict
      command count, returned target values and audit rows separately, then inspect
      all three. Keep this depth inline so RETURNING, failures and trigger timing
      share one explanation rather than creating a trigger-programming article.
    heading:
      - title: Row timing, statement timing and suppressed rows
        brief: >-
          Distinguish per-row and per-statement triggers and BEFORE from AFTER.
          Test a BEFORE row trigger that changes NEW, one that skips a row, and a
          statement trigger on a command matching no rows. Show that RETURNING
          includes the BEFORE-adjusted target row; a skipped target is not returned
          or counted, but statement triggers can still run. Explain AFTER row
          triggers' ignored return value rather than suggesting they replace NEW.
      - title: Extra writes and errors have their own results
        brief: >-
          Add an AFTER trigger audit insert and a raised-error case. RETURNING
          does not enumerate audit rows or other added writes; inspect those
          relations explicitly. A subsequent trigger-issued update is a separate
          write, so do not describe RETURNING as a fresh read of all final table
          state. A trigger error can fail the statement, and deferred constraint
          trigger work may remain outstanding. Contrast ordinary AFTER timing
          with deferrable constraint triggers. Revisit ON CONFLICT briefly to show
          BEFORE INSERT changes reflected in EXCLUDED and that an upsert can
          involve both insert and update trigger paths; details of concurrent
          ordering and database-code deployment remain with their owners.
  - title: Combine changes only when the result contract needs it
    brief: >-
      Optional depth: move deleted order lines into an archive with a
      data-modifying CTE whose RETURNING relation supplies the insert. Distinguish
      this data flow from assumed textual execution order: modifying CTEs execute
      once to completion, share a snapshot and communicate changes through
      RETURNING, not by expecting siblings to observe updated base rows. Do not
      modify one row twice across siblings or the outer command. Explain that
      the outer command's count is not the sum of all writes. Challenge an empty
      source and a failed destination check. This is statement semantics, not a
      substitute for a multi-statement transaction protocol.
  - title: Choose the scope of removing data
    brief: >-
      Contrast bounded DELETE with whole-relation TRUNCATE: no WHERE or per-row
      RETURNING, explicit related-table scope, identity restart/continuation,
      foreign-key restrictions, CASCADE and the different trigger events. Use
      disposable fixture tables to predict which identities and related tables
      disappear. Explain that PostgreSQL TRUNCATE is transactional but has distinct
      locking and snapshot visibility behaviour, linking to transactions rather
      than calling it a faster DELETE. Close with a compact decision exercise:
      choose ordinary or joined change, ON CONFLICT, MERGE or TRUNCATE, name the
      expected identities and side effects, and route any cross-statement invariant,
      retry, unknown client outcome or bulk ingestion requirement to its owner.
