assignment:
  topic: Relational ingestion and bulk data movement
  title: Importing and moving data reliably
  brief: >-
    Build a bulk import or export protocol with source identity, a declared snapshot or change
    boundary, staging, type and encoding conversion, validation, quarantine and explicit publication
    into the target. Choose transaction and batch boundaries from failure recovery, target invariants,
    throughput and concurrent readers or writers. Cover native bulk facilities and driver batching
    through their operational contracts, without reteaching SQL syntax or engine internals. Make
    chunks restartable using durable checkpoints, stable record identity and deduplication; handle
    corrections, deletions and late records under a declared source-of-truth policy. Reconcile
    source and target using counts, keyed checks and business aggregates while accounting for
    concurrent source changes and transformed data. Establish acceptance, cutover and rollback
    criteria and test interruption, invalid records and replay. Relate change capture to continued
    synchronisation when needed; link to external coordination for delivery and to execution or
    operations for bulk-load resource and maintenance effects. Own crossing the source-target
    boundary; compatible schema backfills remain with application delivery.
introducing_heading: Move many records with a recoverable protocol
parent:
  topic: Relational application engineering
  title: Building applications with a relational database
  brief: >-
    Teach how application boundaries turn database guarantees into reliable product behaviour.
    Follow an order reservation from a client request through a driver, a bounded transaction
    and a committed result to confirmation delivery. Give a compact working contract for resource
    use, result interpretation, retries, external effects and change delivery, then provide focused
    routes to working depth. Include database-resident behaviour, real-engine tests and bulk data
    movement. Own client and delivery protocols; use SQL and transaction guarantees supplied by
    neighbouring articles without reteaching their semantics or mechanisms.
neighbours:
  - topic: Relational client resource and query contracts
    title: Making bounded database calls
    brief: >-
      Teach drivers, parameterised SQL and application value mapping through a real request path.
      Cover values versus SQL identifiers, dynamic query construction, nulls, exact numbers, dates
      and time zones, generated identity, result streaming and cursor lifetimes. Make transaction
      ownership explicit across helpers and asynchronous work. Own session initialisation and
      cleanup after successful use as well as failure, including request or tenant context. Compare
      application connection pooling with external session and transaction pooling; check prepared
      statements, settings, temporary objects and session locks against the selected driver and
      pooler configuration. Develop pool sizing and admission control from concurrency and connection
      budgets, including deployment multiplication, pool acquisition limits, backpressure and
      overload rejection. Distinguish connection, pool, statement and request timeouts; follow
      cancellation races, uncertain completion, failed transactions and connection reset or discard
      before reuse according to the chosen driver and engine. Inspect ORM or generated SQL, bound
      query count and result size, expose N+1 and hidden flush or lazy-loading behaviour, and
      measure caller latency, waiting and executed work. Test these contracts with a real engine,
      including connection reuse that cannot leak one request's context into the next borrower.
      Own client resource use; link to SQL semantics, concurrency design and engine performance
      diagnosis rather than reproducing them.
  - topic: Relational application retries and idempotency
    title: Retrying commands without repeating their effects
    brief: >-
      Build an application command protocol for transient failures, explicit aborts and lost commit
      responses. Coordinate bounded retries, deadlines, backoff and jitter without multiplying
      retries across layers. Choose retry boundaries using the transaction article's correctness
      rules; account for application state and effects outside the transaction. Develop durable
      idempotency records with request fingerprints, concurrent attempts, result recording, expiry
      and retention, and a status or reconciliation path for ambiguous outcomes. Distinguish transport
      request identity from the business invariant that forbids a duplicate operation. Explain
      the limits of idempotency when an external system has no usable deduplication or lookup
      contract. Test duplicate, reordered and interrupted attempts with real engine commits and
      controlled client failures; distinguish injected observation loss from an observed network
      failure. Stop when the reader can specify a safe replay policy and recovery path for each
      command outcome.
  - topic: Relational coordination with external systems
    title: Delivering work beyond the database
    brief: >-
      Teach durable work records, transactional outbox and consumer inbox or deduplication protocols
      through external notification and read-model updates. Follow claim, delivery, acknowledgement,
      duplicate handling, ordering, retry, poison work, backlog and retention through crash histories.
      Separate local atomic recording from delivery guarantees, and explain what a consumer must
      make atomic with its own durable effects. Compare polling with change capture as a way to
      transport committed changes, including initial snapshots, resume positions, schema evolution,
      retention gaps and rebuild or reconciliation obligations without teaching replication internals.
      Set cache and read-model contracts for staleness, invalidation or versioned refresh, read-after-write
      expectations and recovery from missed work. Handle long-running business workflows with
      explicit state, compensating actions and human reconciliation where a single transaction
      cannot cover the effects; avoid a separate general workflow or messaging survey. Test relay
      and consumer crash points and state the exact limits of any exactly-once claim. Own integration
      protocols; link to relational distribution for routing and replicated-read guarantees.
  - topic: Compatible relational application delivery
    title: Evolving schemas without breaking running applications
    brief: >-
      Design a staged schema and data migration while multiple application and worker versions
      remain live. Cover compatibility matrices, expand and contract sequencing, feature or traffic
      gates, long-lived jobs and prepared statements, constraints and index rollout, DDL transaction
      and locking differences, and the privileges of a separate migration runner. Develop restartable
      bounded backfills under concurrent writes, including progress records, ownership of new
      writes, validation, convergence and cutover. Examine dual-write and dual-read transitions
      explicitly instead of assuming they stay synchronised. Test old and new code against intermediate
      schemas, representative data volumes and interrupted steps; set observable stop conditions,
      release and rollback gates, and a recovery plan for irreversible data changes. Coordinate
      database-resident code and change-stream consumers with the same version contract. Own application
      delivery; link to modelling for schema meaning and operations or execution for service procedures
      and engine-specific lock and resource investigation.
collection_branches:
  - topic: Relational data modelling and integrity
    title: Designing relational data
    brief: >-
      Turn business facts and invariants into relational schemas that remain understandable as
      requirements change. Develop an order-reservation design from statements of fact through
      keys, relationships, dependencies, types and constraints, then challenge it with changes,
      missing values, history and competing writers. The reader should be able to explain what
      each row means, what identifies it, which invalid states the database rejects, which rules
      require a transaction protocol, and what a deliberate duplication costs. Own schema meaning
      and integrity design; SQL owns statement semantics, transactions owns concurrency protocols,
      application engineering owns delivery of schema and data migrations, and execution owns
      physical tuning.
  - topic: SQL queries and data changes
    title: Working with SQL
    brief: >-
      Teach a newcomer to read, write and check useful SQL against a small order schema, progressing
      from an explicit result contract to joins, grouped results and bounded changes. Use PostgreSQL
      18 as one executable reference dialect, with a resettable fixture and expected results;
      label extensions and differences that change the answer rather than running parallel product
      tutorials. Develop judgement about row grain, duplicate multiplicity, missing values, ties
      and the rows a statement affects. Introduce substantial query composition and data-change
      semantics here, with two focused descendants supplying their working depth. Keep views,
      routines, triggers and import/export statement effects in this article. Own statement meaning
      and result validation; schema integrity design, transaction protocols, client integration,
      execution diagnosis and operational procedures have separate owners. Stop when the reader
      can produce and challenge a query or change against an explicit contract, identify dialect
      assumptions and choose the relevant depth.
  - topic: Relational transactions and concurrency
    title: Reasoning about transactions
    brief: >-
      Teach how to turn an application invariant into a transaction protocol whose permitted outcomes
      can be explained and tested. Use a stock reservation as the running example, using PostgreSQL
      18 as the reference engine and SQL dialect, then expose the limits of single-row reasoning
      with a rule spanning several rows. Connect atomicity, isolation and durability to outcomes;
      explain snapshots, locks, multiversion concurrency, anomalies, serialisability, conditional
      changes, uniqueness, deadlocks and retries. Compare named engine contracts where they change
      the protocol, rather than treating isolation labels as interchangeable. The reader should
      leave able to analyse a two-session history, choose and justify a protection mechanism,
      recognise abort and retry boundaries, and design a deterministic concurrency test. The child
      develops complete multi-row protocols. Application engineering owns connection lifetimes,
      ambiguous client outcomes, idempotency across requests and external effects; execution owns
      physical recovery and performance investigation; distribution owns cross-server consistency
      and transaction coordination.
  - topic: Relational execution, storage and performance
    title: Understanding and improving database work
    brief: >-
      Build a practical model of the work a relational engine performs, then use it to improve
      transactional, analytical and mixed workloads. Follow an order lookup, reservation update
      and sales report through storage, access paths, planning, execution and commit. Give newcomers
      a first useful diagnosis before directing them to deeper mechanisms and investigation. Distinguish
      doing less work from waiting less and adding resources; require evidence that an improvement
      survives representative concurrency and preserves correctness. Own engine mechanisms and
      performance investigation. Refer transaction correctness, application protocols, service
      objectives and recovery procedures, and multi-server coordination to their neighbouring
      articles.
  - topic: Relational application engineering
    title: Building applications with a relational database
    brief: >-
      Teach how application boundaries turn database guarantees into reliable product behaviour.
      Follow an order reservation from a client request through a driver, a bounded transaction
      and a committed result to confirmation delivery. Give a compact working contract for resource
      use, result interpretation, retries, external effects and change delivery, then provide
      focused routes to working depth. Include database-resident behaviour, real-engine tests
      and bulk data movement. Own client and delivery protocols; use SQL and transaction guarantees
      supplied by neighbouring articles without reteaching their semantics or mechanisms.
  - topic: Relational service operations, security and recovery
    title: Operating and recovering a relational service
    brief: >-
      Teach how to establish, secure, observe and sustain a relational service against explicit
      workload and recovery objectives. Cover installation and managed-service responsibilities,
      configuration and resource limits, workload and capacity observation, roles and least privilege,
      authentication, encryption and secrets, tenant isolation and audit requirements, including
      privileges exercised by database-resident code, backups and point-in-time recovery, retention
      and restore validation, incidents and evidence preservation, upgrades and routine maintenance.
      Build executable recovery and change procedures with verified preconditions, recovery targets
      and failure cases; distinguish crash recovery, replica failover, backup restoration and
      disaster recovery. Include human mistakes, corruption, exhausting resources and loss of
      a failure domain. Own operational decisions and runbooks; execution owns diagnostic mechanisms
      and distribution owns replication and routing guarantees.
  - topic: Replication and distribution in relational databases
    title: Relational data across servers
    brief: >-
      Teach the relational mechanisms and trade-offs needed to choose and operate replication,
      failover, sharding and distributed SQL. Develop log replication and application-visible
      consistency, read routing and lag, failover and fencing, quorum and consensus where required,
      partitioning and placement, shard keys and movement, distributed query/transaction coordination,
      contention and cross-region latency. Analyse failure and recovery histories rather than
      relying on topology diagrams or product labels. Compare single-writer replication, application-managed
      sharding and integrated distributed relational systems; include migrations between them
      and tests of promised guarantees. Own multi-server mechanisms and application consequences;
      operations owns service-wide runbooks and backup policy. Teach the necessary distributed-systems
      reasoning in context without expanding the parked shared programme.
