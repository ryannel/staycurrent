topic: Relational history and temporal modelling
title: Modelling history and time
brief: >-
  Design history from the past questions an application must answer. Use a contract rate
  and an order's agreed price to choose among audit records, immutable transaction
  snapshots, versioned entities and time intervals. Develop a backdated correction into
  valid-time and recorded-time history, then specify identity, interval rules, historical
  references, provenance and deletion. Distinguish constraints from the concurrent update
  protocols needed to preserve temporal meaning; compare bounded PostgreSQL and SQL Server
  facilities and validate representative as-of answers. Own historical representation and
  constraints; leave transaction protocols and retention execution with their owners.
heading:
  - title: Begin with the question about the past
    brief: >-
      Contrast what rate applies now, what rate applied on 15 January, what we believed
      on 15 January, and what price an order actually agreed. Use these questions to compare
      current rows plus audit records, an immutable order-price snapshot, identified entity
      versions, valid-time intervals and recorded-time history. Explain which answers each
      representation can reconstruct and what facts it deliberately loses. An event's
      occurrence, business effectiveness and database recording need not share a timestamp;
      an audit log, change feed, backup or MVCC version store is not automatically the
      application's historical model. Keep the comparison in this article rather than
      creating a catalogue of modelling patterns.
  - title: Give identities and periods an exact meaning
    brief: >-
      Separate the stable contract identity from a particular version or assertion identity.
      Define a half-open effective interval [from, to), the business choice of date versus
      instant, time-zone interpretation, precision and boundary comparisons. Make adjacent
      intervals unambiguous; distinguish an allowed gap, unknown applicability and a known
      absence of a rate. Choose an explicit representation for an open end and reject empty
      or reversed periods. Explain how a reference to an entity, a specific immutable
      version, a copied agreed fact or a value resolved at an effective instant promises
      different historical behaviour. Carry the order's agreed price beside the changing
      contract rate so readers can see why an ordinary foreign key does not freeze meaning.
  - title: Correct yesterday without rewriting what was known
    brief: >-
      Work a complete row-level example: a rate of 100 is recorded on 2 January as effective
      from 1 January; on 20 January a correction arrives saying it became 120 on 10 January.
      First split the valid-time timeline into [1 January, 10 January) at 100 and
      [10 January, open) at 120. Then add a recorded-time axis only when the question asks
      what was believed before the correction: retain the former assertion for recorded
      [2 January, 20 January) and the replacement assertions from 20 January onwards.
      Show a two-axis diagram and the rows before and after, preserving assertion identity,
      correction linkage and unaffected valid periods. Compare the answer for effective
      15 January at recorded 15 January with the answer for effective 15 January at recorded
      21 January. State that before 2 January there is no recorded assertion. Separate a
      correction of an erroneous fact from a newly effective business change. Define the
      recorded cut and its ordering guarantees, including tied clock values and several
      changes within one transaction; an application clock timestamp is not by
      itself a commit order or proof of when an outside observer learned the fact. Keep the
      original order-price snapshot unchanged unless a separately recorded business action
      changes the agreement.
  - title: Enforce the timeline you have promised
    brief: >-
      Turn the example's meaning into explicit invariants. For one valid-time history,
      work a PostgreSQL range exclusion constraint on contract identity and overlapping
      effective periods; include btree_gist for scalar identity equality, non-null identity
      and period, non-empty periods and a
      consistent half-open convention. Show adjacent, overlapping and gapped candidate rows
      and the expected acceptance or rejection. Once recorded history is retained, explain
      why excluding every repeated valid interval would reject legitimate old assertions:
      the two-axis rule rejects two assertions for the same contract only when their valid
      and recorded periods both overlap. Show the corresponding range exclusion shape and
      bounded insert/update cases. Distinguish no overlap from continuous coverage, one
      open-ended current state and coordinated closing/splitting/inserting of assertions.
      A read-then-insert overlap check alone is unsafe under competing writers; declarative
      protection supplies a different guarantee. Give a two-writer counterexample for a
      remaining continuity or correction invariant and hand the required serialised
      per-contract transaction protocol and retries to Reasoning about transactions. Do not
      imply an ordinary row CHECK can enforce a cross-row timeline.
  - title: Preserve historical relationships and explain corrections
    brief: >-
      Extend the contract and order case to a historical reference: choosing a parent version
      at one instant differs from requiring the parent to cover the child's entire interval,
      and multiple adjacent parent periods may supply that coverage. Specify which axis or
      axes the relationship uses and which assertions a correction may supersede; an
      ordinary identity foreign key supplies neither temporal coverage nor an as-of join.
      Record actor/source, recording time, reason and correction linkage separately from
      temporal validity, without presenting a history table as tamper-proof evidence.
      Decide whether deletion ends business applicability, retracts a mistaken assertion,
      marks an entity deleted or removes stored evidence. State the historical answers each
      policy preserves or destroys, including references to deleted entities and the limits
      of reconstructing history after a purge. Hand access policy, retention schedules and
      erasure/recovery execution to Operating and recovering a relational service.
  - title: Know what the database's temporal features supply
    brief: >-
      Use a compact comparison tied to the same invariants rather than parallel product
      tutorials. PostgreSQL 18 provides WITHOUT OVERLAPS temporal unique/primary keys and
      PERIOD foreign keys, as well as range exclusion constraints; explain non-overlap and
      combined referenced-period coverage without implying automatic capture of recorded
      history or general two-axis referential integrity. SQL Server system-versioned tables
      maintain current and previous row versions and support FOR SYSTEM_TIME queries;
      distinguish their database-managed period from business validity and from commit or
      observer time, including transaction-begin timestamps, UTC and zero-duration versions.
      Explain that these features do not choose correction meaning, preserve immutable
      agreements, prove who made a change or supply business-time constraints automatically.
      Name version and feature limits, consult primary documentation and avoid treating
      engine-maintained system time as an application's freely backdatable valid time.
  - title: Prove the as-of answers before accepting the model
    brief: >-
      Finish with a compact expected-answer worksheet for the worked rows: before first
      recording, immediately before and exactly at each valid/recorded boundary, after the
      backdated correction, inside a gap and after termination. Validate both axes separately
      and together, including historical joins and the order's unchanged agreement snapshot.
      Check row cardinality as well as returned values, so a missing assertion or two matches
      cannot look like a successful answer. Exercise rejected overlaps, permitted adjacency,
      corrections at existing boundaries and concurrent correction attempts against the
      chosen real engine; label the timeline diagram an illustrative model rather than an
      observed schedule. Include a representative SQL predicate or engine as-of form without
      reteaching query mechanics. Let the reader justify the smallest history representation
      that answers the required questions and identify any rule still owed by a transaction
      protocol.
