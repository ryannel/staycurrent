assignment:
  topic: Relational physical storage, versions and recovery
  title: How relational engines store and change data
  brief: >-
    Teach the path from logical rows to physical work: pages and records, row and column layouts,
    compression and large values, heap and clustered storage organisation, buffer management and
    operating-system caches, updates and retained versions, free-space reuse, logging, checkpoints
    and crash recovery. Compare consequential named implementations, including redo and undo responsibilities,
    without treating one engine's page layout or visibility rules as universal. Explain commit
    durability mechanisms, write amplification, old-version cleanup, reclamation and the maintenance
    debt caused by long transactions or sustained writes. Show how to measure these effects and
    reason about safe bulk-loading and maintenance choices. Own physical mechanisms and their
    performance consequences. Own the physical layout, compression, cache, version and log/cleanup
    explanations; indexes owns key/locator design and execution applies those physical properties
    to operator work. Keep bulk loading here to physical/log/cleanup effects; investigation owns
    experiment design. Transaction articles own isolation correctness, and operations owns backup,
    restore and maintenance runbooks.
introducing_heading: Rows, memory and durable writes
parent:
  topic: Relational execution, storage and performance
  title: Understanding and improving database work
  brief: >-
    Build a practical model of the work a relational engine performs, then use it to improve transactional,
    analytical and mixed workloads. Follow an order lookup, reservation update and sales report
    through storage, access paths, planning, execution and commit. Give newcomers a first useful
    diagnosis before directing them to deeper mechanisms and investigation. Distinguish doing
    less work from waiting less and adding resources; require evidence that an improvement survives
    representative concurrency and preserves correctness. Own engine mechanisms and performance
    investigation. Refer transaction correctness, application protocols, service objectives and
    recovery procedures, and multi-server coordination to their neighbouring articles.
neighbours:
  - topic: Relational workload diagnosis, measurement and benchmarking
    title: Investigating database performance
    brief: >-
      Teach a repeatable investigation from a defined symptom and workload baseline to ranked
      hypotheses, discriminating measurements, controlled interventions and verification. Combine
      statement-level totals and latency distributions, query plans, wait and blocking evidence,
      CPU, storage latency and throughput, caches, log pressure, memory and temporary work. Consume
      the storage, index and execution articles' evidence with short local reminders; do not reteach
      cache mechanisms, operators or the statistics model. Attribute expensive frequent queries
      as well as outliers; diagnose lock waits, saturation and regressions caused by data, parameters,
      plans, versions, configuration or workload mix. Use representative data, skew, concurrency
      and transaction boundaries; distinguish cold and warm states, offered load and completed
      throughput, instrument overhead and repeated-run variation, and preserve failures and tail
      latency. Teach safe use of execution-measuring plan tools, which may execute changes. Evaluate
      query and schema changes, memory and concurrency controls, bulk-load strategies and workload
      isolation against throughput, latency, capacity and cost. Establish resource headroom and
      marginal cost from measurements, and recognise when admission, application design, hardware
      or a different architecture must change. Operations owns service targets, ongoing monitoring
      and incidents; application engineering owns pools, backpressure and delivery protocols.
  - topic: Relational indexes and access methods
    title: Choosing and maintaining indexes
    brief: >-
      Develop index judgement from ordered-tree lookup, range scans and table fetches to composite
      key order, equality and range predicates, ordering, covering and index-only access, partial
      and expression indexes, uniqueness, and the key and row-locator consequences of clustered
      versus secondary organisation. Explain when scans or index combinations win and when predicates,
      conversions, collations or parameter behaviour prevent the expected access path. Introduce
      alternative access methods only through workloads that justify them. Refer coarse data skipping
      to execution, giving only the local access-path consequence. Measure read benefits against
      update, storage, logging and cache costs. Teach evidence-led index building, monitoring,
      consolidation, rebuilding and removal, including concurrent activity and engine-specific
      locking or resource effects. Own key order, row locators, access eligibility and index-set
      maintenance costs; reference storage for physical layout and caches and execution for estimates
      and statistics. Refer operational change procedures and integrity design to their owners.
  - topic: Relational query planning and execution
    title: Reading plans and understanding execution
    brief: >-
      Teach how planners choose access paths, join order and join algorithms, aggregation and
      sorting from cardinality and cost estimates. Develop plan reading using estimates, actual
      rows and loops, startup and total work, filters, fetched pages, memory, spills and parallel
      workers without adding overlapping node timings as independent elapsed time. Explain statistics,
      skew, correlated values, stale estimates, parameter-sensitive plans and plan caching. Connect
      nested-loop, hash and merge joins, hash and ordered aggregation, external sorting, materialisation
      and pipelining to resource use, including memory multiplied across operators, workers and
      concurrent queries. Own estimates/statistics, operator memory and spills, batching/vectorisation,
      coarse data skipping in scans and parallel coordination. Apply storage's row/column layouts
      and compression with brief reminders rather than repeating their physical explanations.
      Local partitioning owns key/granularity and lifecycle decisions; this article explains how
      pruning appears in execution. Make the analytical report the principal worked thread and
      a transactional lookup a brief contrast, preserving SQL semantics. Investigation consumes
      plan evidence for workload-wide prioritisation and benchmarking.
  - topic: Local relational table partitioning
    title: Partitioning tables for access and maintenance
    brief: >-
      Teach when table partitioning earns its complexity through pruning, retention, loading or
      bounded maintenance rather than assuming it makes queries faster. Choose partition keys
      and granularity against concrete predicates, data distribution, growth and lifecycle needs.
      Explain partition-aware plans, indexes and statistics, local and global uniqueness constraints,
      joins, partition counts, hot partitions and queries that cannot prune. Follow creating,
      attaching, detaching and retiring data through validation, locks, resource use and rollback
      constraints in named engines, and compare a partitioned design with an ordinary indexed
      table using representative measurements. Keep correctness and application migration protocols
      with their owners, and keep sharding and cross-server movement in the distribution branch.
collection_branches:
  - topic: Relational data modelling and integrity
    title: Designing relational data
    brief: >-
      Turn business facts and invariants into relational schemas that remain understandable as
      requirements change. Develop an order-reservation design from statements of fact through
      keys, relationships, dependencies, types and constraints, then challenge it with changes,
      missing values, history and competing writers. The reader should be able to explain what
      each row means, what identifies it, which invalid states the database rejects, which rules
      require a transaction protocol, and what a deliberate duplication costs. Own schema meaning
      and integrity design; SQL owns statement semantics, transactions owns concurrency protocols,
      application engineering owns delivery of schema and data migrations, and execution owns
      physical tuning.
  - topic: SQL queries and data changes
    title: Working with SQL
    brief: >-
      Teach a newcomer to read, write and check useful SQL against a small order schema, progressing
      from an explicit result contract to joins, grouped results and bounded changes. Use PostgreSQL
      18 as one executable reference dialect, with a resettable fixture and expected results;
      label extensions and differences that change the answer rather than running parallel product
      tutorials. Develop judgement about row grain, duplicate multiplicity, missing values, ties
      and the rows a statement affects. Introduce substantial query composition and data-change
      semantics here, with two focused descendants supplying their working depth. Keep views,
      routines, triggers and import/export statement effects in this article. Own statement meaning
      and result validation; schema integrity design, transaction protocols, client integration,
      execution diagnosis and operational procedures have separate owners. Stop when the reader
      can produce and challenge a query or change against an explicit contract, identify dialect
      assumptions and choose the relevant depth.
  - topic: Relational transactions and concurrency
    title: Reasoning about transactions
    brief: >-
      Teach how to turn an application invariant into a transaction protocol whose permitted outcomes
      can be explained and tested. Use a stock reservation as the running example, using PostgreSQL
      18 as the reference engine and SQL dialect, then expose the limits of single-row reasoning
      with a rule spanning several rows. Connect atomicity, isolation and durability to outcomes;
      explain snapshots, locks, multiversion concurrency, anomalies, serialisability, conditional
      changes, uniqueness, deadlocks and retries. Compare named engine contracts where they change
      the protocol, rather than treating isolation labels as interchangeable. The reader should
      leave able to analyse a two-session history, choose and justify a protection mechanism,
      recognise abort and retry boundaries, and design a deterministic concurrency test. The child
      develops complete multi-row protocols. Application engineering owns connection lifetimes,
      ambiguous client outcomes, idempotency across requests and external effects; execution owns
      physical recovery and performance investigation; distribution owns cross-server consistency
      and transaction coordination.
  - topic: Relational execution, storage and performance
    title: Understanding and improving database work
    brief: >-
      Build a practical model of the work a relational engine performs, then use it to improve
      transactional, analytical and mixed workloads. Follow an order lookup, reservation update
      and sales report through storage, access paths, planning, execution and commit. Give newcomers
      a first useful diagnosis before directing them to deeper mechanisms and investigation. Distinguish
      doing less work from waiting less and adding resources; require evidence that an improvement
      survives representative concurrency and preserves correctness. Own engine mechanisms and
      performance investigation. Refer transaction correctness, application protocols, service
      objectives and recovery procedures, and multi-server coordination to their neighbouring
      articles.
  - topic: Relational application engineering
    title: Building applications with a relational database
    brief: >-
      Teach how application boundaries turn database guarantees into reliable product behaviour.
      Cover drivers, parameterised SQL, type and value mapping, connection and transaction lifetimes,
      pools, timeouts, cancellation, backpressure, query budgets and ORM/generated-query inspection.
      Develop practical handling of retries, idempotency and ambiguous outcomes, and coordination
      with external systems through durable work records, outbox/inbox patterns and change capture
      where appropriate. Teach compatible schema and data migrations, backfills, deployment and
      rollback constraints, testing with a real engine, database-resident behaviour placement
      and its testing/deployment consequences, and ingestion and bulk data movement through staging,
      validation, restartability and source/target reconciliation. Teach integration boundaries
      for caches and read models. Own client and delivery protocols; avoid reteaching SQL, transaction
      isolation or the internals of neighbouring system families.
  - topic: Relational service operations, security and recovery
    title: Operating and recovering a relational service
    brief: >-
      Teach how to establish, secure, observe and sustain a relational service against explicit
      workload and recovery objectives. Cover installation and managed-service responsibilities,
      configuration and resource limits, workload and capacity observation, roles and least privilege,
      authentication, encryption and secrets, tenant isolation and audit requirements, including
      privileges exercised by database-resident code, backups and point-in-time recovery, retention
      and restore validation, incidents and evidence preservation, upgrades and routine maintenance.
      Build executable recovery and change procedures with verified preconditions, recovery targets
      and failure cases; distinguish crash recovery, replica failover, backup restoration and
      disaster recovery. Include human mistakes, corruption, exhausting resources and loss of
      a failure domain. Own operational decisions and runbooks; execution owns diagnostic mechanisms
      and distribution owns replication and routing guarantees.
  - topic: Replication and distribution in relational databases
    title: Relational data across servers
    brief: >-
      Teach the relational mechanisms and trade-offs needed to choose and operate replication,
      failover, sharding and distributed SQL. Develop log replication and application-visible
      consistency, read routing and lag, failover and fencing, quorum and consensus where required,
      partitioning and placement, shard keys and movement, distributed query/transaction coordination,
      contention and cross-region latency. Analyse failure and recovery histories rather than
      relying on topology diagrams or product labels. Compare single-writer replication, application-managed
      sharding and integrated distributed relational systems; include migrations between them
      and tests of promised guarantees. Own multi-server mechanisms and application consequences;
      operations owns service-wide runbooks and backup policy. Teach the necessary distributed-systems
      reasoning in context without expanding the parked shared programme.
