topic: Relational physical storage, versions and recovery
title: How relational engines store and change data
brief: >-
  Follow an order lookup, reservation update and sales scan from logical values to pages,
  caches, retained versions and durable writes. Build a physical-work model that explains
  read and write amplification, space growth, commit latency and maintenance debt. Use
  PostgreSQL 18 as the concrete row-store thread, compare MySQL 8.4 InnoDB where clustered
  storage and undo change that model, and use SQL Server columnstore for a bounded contrast
  in compressed analytical storage. These are named implementations, not universal relational
  rules. Teach the evidence needed to choose layouts, loading and reclamation approaches;
  leave index key and locator design, operator execution, isolation correctness, experiment
  design and operational recovery procedures with their respective articles.
heading:
  - title: Account for the work behind one changed row
    brief: >-
      Begin with a reservation update that changes a few logical bytes but can read and dirty
      pages, maintain indexes, preserve an earlier version and generate durable log records.
      Contrast an order lookup with a report scanning selected columns. Define logical data,
      allocated space, working set, page reads, log bytes and eventual storage writes as separate
      quantities. Use an explicitly illustrative work ledger, not invented benchmark results;
      introduce amplification as a ratio whose layer and denominator must be stated.
  - title: Fit records into pages and choose what travels together
    brief: >-
      Explain records, page headers, slot directories, variable-width fields, null metadata,
      alignment and free space using a simplified page drawing anchored in PostgreSQL's heap
      format. Connect row width and occupancy to pages fetched, cached and written without
      asking readers to memorise offsets or assuming every engine shares this layout.
    heading:
      - title: Heap pages and clustered rows have different locality
        brief: >-
          Compare PostgreSQL heap placement with InnoDB clustered-index leaf records and
          SQL Server's choice of heap or clustered rowstore. Show sequential versus scattered
          access, page splits, locality drift and reserved page space as physical consequences.
          Distinguish PostgreSQL CLUSTER's one-time rewrite from an organisation maintained
          as rows change. Refer key choice, secondary locators and access-path selection to
          the index article rather than repeating their design rules.
      - title: Column groups, compression and large values change the bill
        brief: >-
          Contrast fetching a whole row with reading selected compressed columns, including
          reconstruction and CPU costs. Use SQL Server compressed rowgroups, delta stores
          and deletion metadata to explain how an updatable columnstore defers physical work;
          leave vectorised operators and data skipping to execution. Explain dictionary and
          run-length encoding as bounded examples, not guaranteed codecs. Compare inline
          and out-of-line values using PostgreSQL TOAST and InnoDB overflow pages, tracing
          extra fetches and rewrites. Distinguish logical payload, compressed bytes and total
          table-plus-index-plus-overflow space.
  - title: A cache miss is not necessarily a device read
    brief: >-
      Trace a page through an engine buffer pool, operating-system page cache where used,
      and persistent storage. Explain hits, misses, read-ahead, eviction, dirty pages, background
      flushing and the difference between pinning a page and locking a logical row. Contrast
      PostgreSQL shared buffers plus OS caching with InnoDB's configurable buffered or direct
      I/O paths; do not promise a fixed double-cache architecture. Relate useful working-set
      size and cache pollution to contention and latency, avoiding universal cache-size recipes.
      Show why an engine hit ratio, a shared-buffer read count and device I/O answer different
      questions; memory for query operators is owned by execution.
  - title: An update creates work that can outlive the transaction
    brief: >-
      Follow insert, update, delete, rollback and commit through two physical histories:
      PostgreSQL retained heap tuples and InnoDB current records plus undo chains. Explain
      which old information is required for readers and rollback without reteaching snapshot
      correctness or isolation levels. Show PostgreSQL HOT as a conditional avoidance of
      index-entry work when indexed values and same-page space permit it, not a promise that
      all updates are in-place or index-free. Contrast a short burst of changes with a long-lived
      reader under continuous writes, making version retention and cleanup eligibility visible.
    heading:
      - title: Reuse free space without confusing it with a smaller file
        brief: >-
          Separate dead or delete-marked records, reclaimable space, free space available to
          the engine, allocated files and bytes returned to the operating system. Explain
          pruning, PostgreSQL free-space and visibility maps, autovacuum and InnoDB purge
          at the mechanism level. Explain PostgreSQL freezing and wraparound protection
          briefly as a distinct reason maintenance is mandatory. Include old snapshots and
          other retention horizons, including relevant replication-slot effects, as potential
          blockers rather than blaming every growing file on one long transaction.
  - title: Commit makes the log durable before all pages are durable
    brief: >-
      Draw a single-server timeline with in-memory change, log generation, log flush,
      acknowledgement and later data-page write. Explain write-ahead ordering, log sequence
      positions, group commit and flush latency. State the assumed durability settings and
      storage flush contract, and distinguish process crash, host or power failure and loss
      of the storage device. An acknowledged local commit does not imply replica durability,
      disaster recovery or immediate data-page persistence.
    heading:
      - title: Redo, undo and transaction status have different jobs
        brief: >-
          Compare PostgreSQL WAL redo plus transaction-status visibility with InnoDB redo
          and undo. Follow a crash with both committed and unfinished changes: durable page
          contents can need redo, and recovery must exclude or roll back unfinished work
          according to the implementation. Do not invent a PostgreSQL per-row undo log or
          imply InnoDB undo is disposable before crash recovery and readers no longer need it.
          Distinguish the InnoDB redo log from MySQL's binary log, whose replication and
          point-in-time-recovery contracts belong to neighbouring articles.
      - title: Checkpoints bound recovery work and move write pressure
        brief: >-
          Explain fuzzy checkpoint progress, dirty-page flushing, recovery starting points
          and safe log reuse without claiming every dirty page is flushed at commit or every
          checkpoint empties the log. Trace partial-page-write protection using PostgreSQL
          full-page images and InnoDB doublewrite as named mechanisms with costs. Connect
          checkpoint frequency, write bursts, log capacity and recovery work; log retention
          for archiving or replication can remain after crash recovery no longer needs it.
          A checkpoint is not a backup, integrity repair or proof of an achieved recovery time.
  - title: Measure the physical cost and the debt still waiting
    brief: >-
      Return to the work ledger and map each quantity to bounded evidence: relation, index
      and overflow sizes; live/dead tuple estimates and vacuum progress; InnoDB undo history
      and purge progress; buffer and OS/device I/O; WAL or redo byte rates, log flush waits
      and checkpoint statistics; and columnstore rowgroup/deletion state. Name versioned
      PostgreSQL views such as pg_stat_io, pg_stat_wal and pg_stat_checkpointer and InnoDB
      metrics as examples, explaining counter deltas, estimates and observation scope.
      Distinguish generation rate, retention backlog and reclamation throughput. Diagnose
      three short cases: a warm query with no shared-buffer hit, fast commits with later
      flushing pressure, and file growth despite successful deletion. Send workload ranking,
      controlled trials and representative benchmarking to investigation.
  - title: Choose bulk-loading and maintenance by the work they defer
    brief: >-
      Compare sustained small changes, bounded batches and bulk loading through page locality,
      log generation, flush pressure, retained versions, index upkeep and cleanup headroom.
      Connect batch boundaries to peak undo or WAL demand and recovery scope without proposing
      universal batch sizes. Explain when a rewrite or compaction can recover useful density
      and when ordinary reuse is enough, including temporary disk demand, extra logging,
      blocking and subsequent cache warming. Contrast normal durable loads with engine-specific
      reduced-logging paths; state exact preconditions and crash, replication and recovery
      consequences rather than suggesting logging can simply be disabled. Use PostgreSQL COPY
      and InnoDB bulk-load guidance as physical examples. Refer SQL import semantics and
      application staging/reconciliation, index-set decisions, benchmark design and executable
      maintenance or restore runbooks to their owners. End with a decision from measured
      bottleneck, retained-history cause, headroom and required guarantees.
