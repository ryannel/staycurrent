topic: Relational databases
title: Relational databases
brief: >-
  Take an intelligent engineer who is new to relational databases to expert
  practice: choosing an appropriate relational system, designing and building
  applications with it, diagnosing behaviour, and operating and recovering it
  with sound judgement. Introduce the relational contract, follow a small order
  reservation through its data, queries, transaction and durable execution, and
  use that example to explain which deeper questions the reader must answer.
  Teach the mechanisms and implementation differences needed for those
  decisions. The root supplies a usable mental model and task-based entrances;
  its descendants supply the working depth. Compare neighbouring database
  families where relevant without planning their collections, and teach required
  distribution mechanisms within the relational context.
heading:
  - title: Put facts into relations and protect their meaning
    brief: >-
      Begin with customers, orders, order lines and stock reservations. Show
      which facts belong together, how keys connect them, and why duplicating a
      fact makes change harder. Separate the mathematical relational model from
      SQL's concrete tables and its treatment of duplicates, missing values and
      ordering. Establish that data types, keys, constraints and transactions
      jointly determine which states an application can safely represent; the
      root needs one worked constraint, not a catalogue of normal forms.
    heading:
      - title: Decide what the database must keep true
        brief: >-
          Contrast a row's valid quantity with a rule about stock shared by
          concurrent orders. Explain that some invariants fit declarations and
          others require a deliberate transaction protocol. Introduce schema
          design as the durable expression of meaning and access needs.
        nested_article:
          topic: Relational data modelling and integrity
          title: Designing relational data
          brief: >-
            Teach how to turn business facts and invariants into relational
            schemas that remain understandable as requirements change. Cover
            keys and identity, relationships and cardinality, dependency-led
            normalisation and deliberate denormalisation, data types, missing
            values, time and units, constraints and their implementation limits,
            and the relationship between logical design and access patterns.
            Include concrete modelling trade-offs for history, ownership and
            lifecycle; distinguish rules the database can enforce declaratively
            from rules that need transaction protocols. Own schema meaning and
            integrity design; application delivery owns rolling a schema change
            through existing code and data.
  - title: State the result you need in SQL
    brief: >-
      Follow one order summary from connected rows to a joined and grouped
      result. Explain that a declarative statement describes a result or change
      while the engine chooses how to execute it. Establish row multiplicity,
      absent matches and deterministic ordering as correctness concerns before
      performance. Show that a successful statement is not yet proof that a
      multi-statement business operation is safe.
    nested_article:
      topic: SQL queries and data changes
      title: Working with SQL
      brief: >-
        Develop practical, portable SQL understanding from reading and changing
        a small schema to composing and validating substantial queries. Teach
        joins and cardinality, filtering and three-valued logic, aggregation,
        subqueries, common table expressions, set operations, window functions,
        ordering and pagination, and insert/update/delete including conflict
        handling and returned results. Explain how to reason about duplicates,
        missing data, ties and deterministic outcomes, with exercises that
        expose plausible wrong answers. Treat SQL as a family with meaningful
        dialect differences; provide a compact executable reference dialect
        rather than parallel product tutorials. Own statement semantics;
        transaction protocols and execution diagnosis have separate owners.
  - title: Make a business decision survive concurrent work
    brief: >-
      Let two customers attempt to reserve the final item. Show why a
      read-then-write sequence can fail even when its statements are individually
      valid. Introduce commit, rollback, isolation and conflicts through the
      invariant that matters, distinguish atomicity from visibility and
      durability, and make explicit that transaction behaviour depends on the
      engine and chosen isolation. Give the reader the question to ask: which
      concurrent histories can this protocol admit?
    nested_article:
      topic: Relational transactions and concurrency
      title: Reasoning about transactions
      brief: >-
        Teach how to design, analyse and test transaction protocols for real
        application invariants. Connect atomicity, isolation and durability to
        observable outcomes; explain snapshots, locking and multiversion
        concurrency, isolation anomalies and serialisability, conditional writes,
        uniqueness, deadlocks and aborts, and safe retry boundaries. Compare
        consequential implementation differences in named relational systems
        without implying that identical isolation labels promise identical
        behaviour. Include long transactions, contention and explicit protocols
        for multi-row invariants. Own transaction correctness and concurrency
        mechanisms; application integration owns connection lifetimes, ambiguous
        client outcomes and coordination with external effects.
  - title: Understand the work behind a statement
    brief: >-
      Trace the order summary and reservation through planning, access paths,
      row versions, memory and storage. Use a small scan-versus-index example
      to connect data size, selectivity and write costs; distinguish a logical
      result from a physical plan. Explain at introductory depth why a commit
      acknowledgement, a page write and a recoverable record need not be the
      same event. Establish a diagnosis loop that starts with evidence about
      the workload and waits rather than reflexively adding an index.
    nested_article:
      topic: Relational execution, storage and performance
      title: Understanding and improving database work
      brief: >-
        Build the mechanism-level understanding needed to diagnose and improve
        relational workloads. Connect physical storage, rows and versions,
        buffers and caches, logging and crash recovery, indexes and access
        methods, query planning and cardinality estimates, joins and sorting,
        memory and temporary work, and write amplification and maintenance.
        Teach plan reading, statistics, measurement, benchmarking and a
        repeatable diagnosis process for slow queries, lock waits, resource
        saturation and workload regressions. Cover partitioning as a local
        organisation and maintenance choice, workload-aware capacity and cost,
        and limits beyond which query tuning cannot solve the problem. Compare
        implementation mechanisms only where they change judgement. Own engine
        mechanisms and performance investigation; operations owns service
        objectives and recovery procedures, while distribution owns work across
        independently failing servers.
  - title: Build the application around a database contract
    brief: >-
      Follow an order request across a client connection, its transaction and a
      payment or fulfilment system. Distinguish parameter safety, transaction
      safety and request safety. Show why a timed-out commit can leave the
      caller uncertain and why an external side effect needs its own delivery
      protocol. Introduce evolution as keeping old and new code compatible
      while data and schemas change.
    nested_article:
      topic: Relational application engineering
      title: Building applications with a relational database
      brief: >-
        Teach how application boundaries turn database guarantees into reliable
        product behaviour. Cover drivers, parameterised SQL, type and value
        mapping, connection and transaction lifetimes, pools, timeouts,
        cancellation, backpressure, query budgets and ORM/generated-query
        inspection. Develop practical handling of retries, idempotency and
        ambiguous outcomes, and coordination with external systems through
        durable work records, outbox/inbox patterns and change capture where
        appropriate. Teach compatible schema and data migrations, backfills,
        deployment and rollback constraints, testing with a real engine, and
        integration boundaries for caches and read models. Own client and
        delivery protocols; avoid reteaching SQL, transaction isolation or the
        internals of neighbouring system families.
  - title: Keep the service trustworthy through change and failure
    brief: >-
      Turn the order database into a service with an owner, access boundaries,
      latency and availability objectives, and an explicit tolerable loss and
      recovery time. Distinguish crash recovery, failover and restoring a
      backup using a concrete mistaken deletion. Introduce health evidence,
      access control and tested recovery as part of building the system, not
      tasks deferred until after launch.
    nested_article:
      topic: Relational service operations, security and recovery
      title: Operating and recovering a relational service
      brief: >-
        Teach how to establish, secure, observe and sustain a relational service
        against explicit workload and recovery objectives. Cover installation
        and managed-service responsibilities, configuration and resource
        limits, workload and capacity observation, roles and least privilege,
        authentication, encryption and secrets, tenant isolation and audit
        requirements, backups and point-in-time recovery, retention and restore
        validation, incidents and evidence preservation, upgrades and routine
        maintenance. Build executable recovery and change procedures with
        verified preconditions, recovery targets and failure cases; distinguish
        crash recovery, replica failover, backup restoration and disaster
        recovery. Include human mistakes, corruption, exhausting resources and
        loss of a failure domain. Own operational decisions and runbooks;
        execution owns diagnostic mechanisms and distribution owns replication
        and routing guarantees.
  - title: Decide where data and decisions must live
    brief: >-
      Move from one database server to replicas and then to a dataset or
      workload that requires more than one writer or failure domain. Explain
      the different purposes of replicas, partitioning and sharding, and connect
      each to stale reads, routing, coordination and failure. Keep the root's
      focus on the consequences for the order invariant and user experience;
      shared distributed-systems study is not a prerequisite for this branch.
    nested_article:
      topic: Replication and distribution in relational databases
      title: Relational data across servers
      brief: >-
        Teach the relational mechanisms and trade-offs needed to choose and
        operate replication, failover, sharding and distributed SQL. Develop
        log replication and application-visible consistency, read routing and
        lag, failover and fencing, quorum and consensus where required,
        partitioning and placement, shard keys and movement, distributed
        query/transaction coordination, contention and cross-region latency.
        Analyse failure and recovery histories rather than relying on topology
        diagrams or product labels. Compare single-writer replication,
        application-managed sharding and integrated distributed relational
        systems; include migrations between them and tests of promised
        guarantees. Own multi-server mechanisms and application consequences;
        operations owns service-wide runbooks and backup policy. Teach the
        necessary distributed-systems reasoning in context without expanding
        the parked shared programme.
  - title: Choose a system by testing its consequential differences
    brief: >-
      Return to the order workload and identify the assumptions that change a
      system choice: embedded or networked operation, SQL and type semantics,
      concurrency and durability, scale and geography, extensions, operational
      ownership and total cost. Establish that a relational label and a feature
      checklist do not establish workload fitness. End with task-based reading
      paths for first application, a correctness incident, a slow workload,
      recovery preparation and a system evaluation.
    nested_article:
      topic: Choosing and evaluating relational systems
      title: Choosing a relational system
      brief: >-
        Teach a repeatable evaluation method driven by workload, correctness,
        recovery, growth, deployment and team constraints. Compare embedded
        engines, conventional server engines and distributed SQL using a small
        set of representative implementations selected for consequential
        differences, without creating a vendor catalogue. Cover dialect and
        type compatibility, transaction and durability guarantees, access
        methods and specialist capabilities, extension and ecosystem needs,
        hosted-service responsibility boundaries, resource and commercial
        costs, portability and exit constraints. Design proof-of-concept tests
        for realistic data, concurrency, failures, upgrades and recovery, and
        distinguish documented promises, measured results and assumptions.
        Compare neighbouring database families only to establish when the
        relational approach fits or needs a complementary system. Require any
        implementation-specific deeper article to justify its reading cost
        through mechanisms not adequately taught in the common branches.
