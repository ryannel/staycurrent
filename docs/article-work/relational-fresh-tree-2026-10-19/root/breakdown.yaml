topic: Relational databases
title: Relational databases
brief: >-
  Take an intelligent engineer who is new to relational databases to expert practice:
  choosing an appropriate relational system, designing and building applications
  with it, diagnosing behaviour, and operating and recovering it with sound judgement.
  The root gives a compact relational mental model, a complete order-reservation
  walkthrough, early task entrances and a worked system shortlist. Its stopping condition
  is that a newcomer can explain the database contract, distinguish responsibilities
  of the application and operator, and choose the next question to investigate. Descendants
  supply working depth. Teach implementation differences where they change judgement,
  compare neighbouring database families without planning their collections, and
  teach required distribution mechanisms in the relational context.
heading:
- title: Find your next question
  brief: >-
    Define a relational database briefly as a system for representing related facts,
    querying and changing them, and enforcing specified integrity and transaction
    rules. Set up the order-reservation example, then expose direct task entrances
    before the walkthrough: first application to design, SQL and application integration;
    correctness incident to transactions; slow workload to execution and diagnosis;
    recovery preparation to operations; system evaluation to the root's shortlist
    section, following distribution only when its constraints matter. Name a concrete
    outcome for each path and make clear that the following walkthrough is the continuous
    first-reading route, not a prerequisite for revisiting one branch.
- title: Put facts into relations and protect their meaning
  brief: >-
    Show customers, orders, order lines and stock reservations as a small connected
    schema. Explain facts, keys and relationships through that example, and use one
    valid-quantity constraint to show a database-enforced rule. Establish that a
    schema expresses meaning, rather than being a collection of containers. Defer
    formal dependency analysis, SQL duplicates and missing-value semantics to their
    owning branches; introduce the shared-stock concurrency rule only in the transaction
    section.
  nested_article:
    topic: Relational data modelling and integrity
    title: Designing relational data
    brief: >-
      Teach how to turn business facts and invariants into relational schemas that
      remain understandable as requirements change. Cover keys and identity, relationships
      and cardinality, dependency-led normalisation and deliberate denormalisation,
      data types, missing values, time and units, constraints and their implementation
      limits, and the relationship between logical design and access patterns. Include
      concrete modelling trade-offs for history, ownership and lifecycle; distinguish
      rules the database can enforce declaratively from procedural enforcement and
      rules that need transaction protocols. Own schema meaning and integrity design;
      application delivery owns rolling a schema change through existing code and
      data.
- title: State the result you need in SQL
  brief: >-
    Follow one order summary from connected rows to a joined answer. Show one plausible
    join that multiplies order totals and repair it, establishing that desired result
    and row cardinality must be reasoned about before speed. Explain declarative
    SQL as specifying the answer while an engine chooses the work. Stop before a
    query tutorial; absent matches, missing values, ordering and SQL constructs belong
    in the child.
  nested_article:
    topic: SQL queries and data changes
    title: Working with SQL
    brief: >-
      Develop practical, portable SQL understanding from reading and changing a small
      schema to composing and validating substantial queries. Teach joins and cardinality,
      filtering and three-valued logic, aggregation, subqueries, common table expressions,
      set operations, window functions, ordering and pagination, and insert/update/delete
      including conflict handling and returned results. Cover views, routines and
      triggers through their observable effects, and bulk/import/export facilities
      through the reference dialect's semantics and limits. Explain how to reason
      about duplicates, missing data, ties and deterministic outcomes, with exercises
      that expose plausible wrong answers. Treat SQL as a family with meaningful
      dialect differences; provide a compact executable reference dialect rather
      than parallel product tutorials. Own statement semantics; transaction protocols
      and execution diagnosis have separate owners.
- title: Make a business decision survive concurrent work
  brief: >-
    Let two customers attempt to reserve the final item. Show one read-then-write
    history that violates the stock invariant and one repaired transaction protocol
    with explicit preconditions. Use only the atomicity, visibility and conflict
    concepts needed to explain the contrast, distinguishing commit from a blanket
    claim that any transaction is safe. Explain that permitted concurrent histories
    depend on the engine and isolation setting. Defer anomaly catalogues and engine
    labels to the child.
  nested_article:
    topic: Relational transactions and concurrency
    title: Reasoning about transactions
    brief: >-
      Teach how to design, analyse and test transaction protocols for real application
      invariants. Connect atomicity, isolation and durability to observable outcomes;
      explain snapshots, locking and multiversion concurrency, isolation anomalies
      and serialisability, conditional writes, uniqueness, deadlocks and aborts,
      and safe retry boundaries. Compare consequential implementation differences
      in named relational systems without implying that identical isolation labels
      promise identical behaviour. Include long transactions, contention and explicit
      protocols for multi-row invariants. Own transaction correctness and concurrency
      mechanisms; application integration owns connection lifetimes, ambiguous client
      outcomes and coordination with external effects.
- title: Understand the work behind a statement
  brief: >-
    Use one compact picture to follow the reservation transaction's update through
    its chosen access path, rows or pages in memory, and a recoverable commit. Give one scan-versus-index
    contrast and contrast the single-order lookup with a report over many orders;
    do not turn either into an index or analytics lesson. Establish that a declarative
    answer does not imply a fixed amount of work, and that a commit acknowledgement
    differs from writing a data page. End with the diagnostic entrance: measure what
    consumed time before changing the schema. Defer row-version storage, plan vocabulary,
    crash replay and the full diagnosis method to the child.
  nested_article:
    topic: Relational execution, storage and performance
    title: Understanding and improving database work
    brief: >-
      Build the mechanism-level understanding needed to diagnose and improve relational
      workloads. Connect physical storage, rows and versions, buffers and caches,
      logging and crash recovery, indexes and access methods, query planning and
      cardinality estimates, joins and sorting, row and column layouts, scan-oriented
      and parallel execution, memory and temporary work, and write amplification
      and maintenance. Teach plan reading, statistics, measurement, benchmarking
      and a repeatable diagnosis process for transactional, analytical and mixed
      workloads, including slow queries, lock waits, resource saturation and workload
      regressions. Cover partitioning as a local organisation and maintenance choice,
      workload-aware capacity and cost, bulk-loading resource and maintenance effects,
      and limits beyond which query tuning cannot solve the problem. Compare implementation
      mechanisms only where they change judgement. Own engine mechanisms and performance
      investigation; operations owns service objectives and recovery procedures,
      while distribution owns work across independently failing servers.
- title: Build the application around a database contract
  brief: >-
    Lose the reply to a successful order commit and follow what the caller can and
    cannot infer. Use that one incident to distinguish transaction success from request
    success and introduce request identity and safe replay. Point onward to external
    work such as fulfilment, managing concurrent connections and compatible schema
    change as application responsibilities, without introducing their protocols in
    the root. The child owns parameter safety, client lifetimes and implementation
    detail.
  nested_article:
    topic: Relational application engineering
    title: Building applications with a relational database
    brief: >-
      Teach how application boundaries turn database guarantees into reliable product
      behaviour. Cover drivers, parameterised SQL, type and value mapping, connection
      and transaction lifetimes, pools, timeouts, cancellation, backpressure, query
      budgets and ORM/generated-query inspection. Develop practical handling of retries,
      idempotency and ambiguous outcomes, and coordination with external systems
      through durable work records, outbox/inbox patterns and change capture where
      appropriate. Teach compatible schema and data migrations, backfills, deployment
      and rollback constraints, testing with a real engine, database-resident behaviour
      placement and its testing/deployment consequences, and ingestion and bulk data
      movement through staging, validation, restartability and source/target reconciliation.
      Teach integration boundaries for caches and read models. Own client and delivery
      protocols; avoid reteaching SQL, transaction isolation or the internals of
      neighbouring system families.
- title: Keep the service trustworthy through change and failure
  brief: >-
    Use one mistaken deletion to distinguish crash recovery, replica failover and
    restoring an earlier state. Give the service an owner, an acceptable data-loss
    window and a recovery-time target, then show why a usable restore must have been
    tested. State that access control and health evidence are part of operating the
    service, while leaving their control lists and procedures to the child. Stop
    once the reader can identify which recovery mechanism the incident needs.
  nested_article:
    topic: Relational service operations, security and recovery
    title: Operating and recovering a relational service
    brief: >-
      Teach how to establish, secure, observe and sustain a relational service against
      explicit workload and recovery objectives. Cover installation and managed-service
      responsibilities, configuration and resource limits, workload and capacity
      observation, roles and least privilege, authentication, encryption and secrets,
      tenant isolation and audit requirements, including privileges exercised by
      database-resident code, backups and point-in-time recovery, retention and restore
      validation, incidents and evidence preservation, upgrades and routine maintenance.
      Build executable recovery and change procedures with verified preconditions,
      recovery targets and failure cases; distinguish crash recovery, replica failover,
      backup restoration and disaster recovery. Include human mistakes, corruption,
      exhausting resources and loss of a failure domain. Own operational decisions
      and runbooks; execution owns diagnostic mechanisms and distribution owns replication
      and routing guarantees.
- title: Decide where data and decisions must live
  brief: >-
    Show an order read reaching a replica before its latest change, then give one
    concrete reason to split write ownership across servers. Distinguish copying
    data from dividing responsibility and identify the resulting application-visible
    questions about freshness, routing and coordination. Stop before topology taxonomies,
    quorum explanations or sharding design. The child teaches the distribution reasoning
    required for relational practice without depending on the parked shared programme.
  nested_article:
    topic: Replication and distribution in relational databases
    title: Relational data across servers
    brief: >-
      Teach the relational mechanisms and trade-offs needed to choose and operate
      replication, failover, sharding and distributed SQL. Develop log replication
      and application-visible consistency, read routing and lag, failover and fencing,
      quorum and consensus where required, partitioning and placement, shard keys
      and movement, distributed query/transaction coordination, contention and cross-region
      latency. Analyse failure and recovery histories rather than relying on topology
      diagrams or product labels. Compare single-writer replication, application-managed
      sharding and integrated distributed relational systems; include migrations
      between them and tests of promised guarantees. Own multi-server mechanisms
      and application consequences; operations owns service-wide runbooks and backup
      policy. Teach the necessary distributed-systems reasoning in context without
      expanding the parked shared programme.
- title: Choose a system by testing its consequential differences
  brief: >-
    Work through a bounded shortlist between embedded, conventional server and distributed
    relational deployment shapes for the order application; contrast a reporting
    or mixed workload so the example does not silently define all relational use.
    Use a concise requirement-to-evidence matrix: data and query semantics; concurrency
    and durable acknowledgement; workload shape, scale and geography; recovery and
    operational ownership; specialist capabilities and ecosystem; and cost, portability
    and exit constraints. Distinguish documented promises, measured results and assumptions.
    Show a small validation checklist whose concurrency, performance, change and
    recovery tests point to their owning branches rather than repeating their mechanisms.
    Explain when a neighbouring database family or complementary read model fits
    the requirements better. The outcome is a defensible shortlist and a plan for
    disqualifying evidence, not a product catalogue or a requirement to master the
    whole corpus before making a reversible first choice. Keep this synthesis in
    the root; commission a product-specific deeper article only when a consequential
    mechanism cannot be taught adequately in the common branches.
