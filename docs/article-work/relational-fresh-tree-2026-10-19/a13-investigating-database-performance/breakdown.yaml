topic: Relational workload diagnosis, measurement and benchmarking
title: Investigating database performance
brief: >-
  Teach a repeatable investigation from a defined symptom and workload baseline to ranked
  hypotheses, discriminating measurements, controlled interventions and verification. Use an
  order service whose lookup, reservation update and sales report compete for one database as
  the worked thread. Combine statement totals, latency distributions, plans, waits and resource
  evidence without mistaking any one signal for a diagnosis. Use PostgreSQL 18 for concrete
  instrumentation, identifying which measurements and semantics require translation in another
  engine. Build representative experiments that preserve correctness, errors and tail latency,
  then use the results to choose changes and establish capacity and marginal cost. Consume
  storage, index and execution explanations rather than repeating their mechanisms. Operations
  owns targets, ongoing monitoring and incident procedures; application engineering owns pools,
  admission and delivery protocols. This article owns the evidence needed to recommend changes
  across those boundaries. Keep the method in one article so readers can complete an investigation
  without following a separate benchmarking branch.
heading:
  - title: Turn a slow service into a testable question
    brief: >-
      Start with reservation requests becoming slow while a sales report runs. Define the affected
      operation, timing boundary, interval, workload and acceptable outcome using the service
      target supplied by operations. Separate end-to-end request time, waiting to enter the
      database, statement execution and commit; a fast isolated statement does not clear the
      database or explain the request. Record version, configuration, data and parameter
      distribution, transaction boundaries and recent changes. End with a baseline and two
      competing hypotheses, not a preferred tuning knob.
  - title: Find the work that deserves attention
    brief: >-
      Collect aligned interval deltas for normalised statement counts, total execution time,
      rows, reads, writes and temporary work, then connect them to request traces and latency
      distributions. Use frequent cheap lookups, occasional costly reports and blocked updates
      to show why total contribution and bad individual outcomes require separate rankings.
      Account for concurrent elapsed-time totals, changing sample populations, statistics resets,
      retention and observation overhead. A normalised statement can hide parameter groups with
      very different costs; aggregates and means do not recover tail percentiles. Preserve failed,
      cancelled and timed-out requests in the workload account rather than counting only successes.
  - title: Distinguish doing work from waiting for it
    brief: >-
      Build a small hypothesis table whose rows state a possible cause, supporting observation,
      alternative explanation and next discriminating measurement. Correlate active statements,
      sampled wait events and blocking relationships with host and service metrics over the same
      window. A wait label or high utilisation alone does not establish the cause.
    heading:
      - title: Follow blocking before changing the plan
        brief: >-
          Trace waiting reservations to their blocker and transaction lifetime; distinguish a
          lock queue from CPU or storage saturation and from a client leaving a transaction open.
          Capture representative sessions over time rather than treating one activity snapshot
          as a duration profile. Use the transaction and application articles to judge the
          protocol change after diagnosis; leave cancellation and incident procedures to operations.
      - title: Join plans to resource evidence
        brief: >-
          Apply the execution article's rows, loops, spills and operator evidence to shortlisted
          statements. Compare CPU demand and runnable work, storage latency and throughput, cache
          activity, memory pressure and temporary I/O, and log/commit pressure. Include background
          checkpoint and cleanup activity where it overlaps the symptom. Separate engine buffer
          reads from physical device reads and a cache ratio from the quantity of work avoided;
          refer physical explanations to storage. Use correlated measurements to distinguish
          excess work, a constrained resource and competing workloads rather than listing knobs.
  - title: Explain a regression with a discriminating comparison
    brief: >-
      Compare a good and bad interval or controlled reproduction using the same operation and
      result contract. Separate changes in data size or skew, parameter values, selected plans,
      engine version, configuration and workload mix. Preserve representative parameter classes
      and plan evidence before changing statistics or configuration. Apply the execution article's
      estimation and plan-cache model with brief reminders. State which observation would reject
      each hypothesis and change one suspected cause at a time where feasible; a coincident
      deployment or different plan is evidence to investigate rather than proof of causation.
    heading:
      - title: Measure an execution without causing an uncontrolled change
        brief: >-
          Distinguish estimated plans from execution-measuring tools. PostgreSQL EXPLAIN ANALYZE
          executes the statement, including side effects; use a disposable representative copy
          for writes and side-effecting reads, with bounded runtime and resource use. A rollback
          is not a blanket safety guarantee for external effects or consumed sequence values.
          Record instrumentation options, timing overhead and omitted client/network work, then
          verify important timings through normal execution. Never present plan node timing sums
          as request latency or a one-query plan run as proof under concurrency.
  - title: Reproduce the workload without making the test easier
    brief: >-
      Specify a resettable fixture, data volume and skew, parameter distribution, read/write mix,
      transaction boundaries, think time and concurrency or arrival schedule. Preserve relevant
      durability and integrity settings. Include the load generator, connection path and environment
      limits so a client bottleneck is not credited to the database. Label cold and warm states,
      warm-up and measurement windows; repeated variants need comparable starting state, run
      order and multiple runs. Keep illustrative traces separate from observed execution.
    heading:
      - title: Count arrivals, completions and the work still waiting
        brief: >-
          Contrast fixed concurrent clients, which may send less work as responses slow, with
          scheduled arrivals. Record offered load, admitted load, completed throughput, queue
          growth, retries, failures and cancellations. Measure latency from the declared arrival
          boundary, including waiting, and explain how a generator that pauses during stalls can
          hide slow requests. Report distributions and sample counts for each operation, not
          pooled averages or averages of percentiles; distinguish reproducible changes from
          repeated-run variation. Keep load bounded and run destructive or saturating tests away
          from the live service.
  - title: Compare fixes against the whole workload
    brief: >-
      Return to the report competing with reservations. Compare doing less work through query
      or index/schema changes, changing memory or concurrency limits, separating reporting work,
      and adding resources. Measure latency distributions, throughput, resource demand, storage
      and write/log costs, failures and correctness for the same offered workload. More memory
      for one execution may reduce spills but worsen concurrent memory pressure; a faster report
      can still harm reservations. Refer index, execution, storage and application mechanisms to
      their owners and require evidence of the proposed trade-off rather than repeating tutorials.
    heading:
      - title: Test a bulk load as an end-to-end job
        brief: >-
          Compare batch size, commit cadence, loading path, index maintenance strategy and scheduling
          against elapsed job time, concurrent request latency, log/storage pressure and the
          resource cost of subsequent cleanup or index work. Hold final contents, integrity,
          durability and recovery requirements constant; state changed guarantees explicitly if
          alternatives cannot do so. Include validation and post-load convergence in the measurement
          window instead of reporting ingestion rate alone. Application engineering owns staging,
          restartability and reconciliation; storage owns the physical explanation.
  - title: Find the useful capacity and keep the evidence
    brief: >-
      Sweep representative offered load to locate where throughput stops improving while queues,
      failures or tail latency grow. Set measured operating headroom against the supplied service
      target and burst/recovery needs rather than a universal utilisation threshold. Compare
      resource and monetary cost per completed useful operation, incremental cost for additional
      sustainable throughput and the uncertainty in those estimates; include the same workload,
      guarantees and accounting period in each alternative. Revisit measurements as data and
      workload mix grow rather than extrapolating one small run linearly. Recognise evidence that
      admission, application work, hardware or architecture must change and hand the decision
      to its owner. Finish with a compact investigation record: symptom and baseline, hypotheses,
      observations, rejected explanations, intervention, repeated verification, remaining risks
      and regression signals for operations. Ask the reader to choose and justify the next
      measurement for a fresh variant of the original symptom.
