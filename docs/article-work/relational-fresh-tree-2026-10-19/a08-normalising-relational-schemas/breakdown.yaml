topic: Dependencies and relational decomposition
title: Normalising relational schemas
brief: >-
  Derive dependencies from business facts and use them to decide whether splitting a relation
  removes an anomaly without changing its meaning. Work an order-line example through candidate
  keys, first, second and third normal forms; prove lossless reconstruction and check dependency
  preservation. Use a small overlapping-key counterexample for the BCNF trade-off and one
  independent multivalued fact for fourth normal form. Own decomposition reasoning; leave
  complete schema design and deliberate duplication to the parent, history to its neighbouring
  article, and SQL join mechanics and concurrency protocols to their owners. Normal forms
  are tests of stated dependencies, not a guarantee of a complete or appropriate design.
heading:
  - title: Start with facts that must remain true
    brief: >-
      Open with an inconsistent update to an order's repeated customer name. Establish the
      representation before deriving keys: first normal form replaces a repeating group of
      independently related line facts in one cell with one line per row and values from the
      chosen scalar domains. Explain atomicity relative to the intended domain and operations:
      an address or timestamp need not be split merely because it has parts. The following
      proofs concern set relations and ordinary present values; SQL duplicates, NULLs, arrays
      and JSON require their owners' separate representational decisions. Keep this setup
      compact and retain the resulting flat OrderLine relation throughout: order number,
      line number, order date, customer number, current customer name, product number,
      current product name, quantity and price charged for that line. State one customer
      and date per order, customer-number-to-current-name and product-number-to-current-name
      rules, and order-number-plus-line-number determining product, quantity and charged
      price. The same product may occur on several lines with different prices. Contrast
      current names with historical snapshots to avoid inventing the wrong dependency.
      Show the insertion and deletion anomalies alongside the opening update, distinguishing
      redundancy from missing entities and lifecycle requirements that the parent owns.
  - title: Find the keys implied by the rules
    brief: >-
      Read X -> Y as agreement on X requiring agreement on Y in every legal state. Distinguish
      a determinant, a superkey and a minimal candidate key; the primary key is one selected
      candidate. Compute attribute closure by repeatedly applying dependencies, then remove
      attributes to test minimality. Derive the order-line candidate key from the stated rules,
      show why product number cannot replace line number, and keep alternate keys visible
      when testing normal forms. A violating pair can refute a claimed dependency, but a tidy
      sample cannot establish a business rule. Adding a surrogate identifier leaves existing
      dependencies and their anomalies in place.
  - title: Separate facts that depend on different keys
    brief: >-
      Continue the same example through two motivated stages rather than a normal-form ladder
      of unrelated tables. Define a prime attribute as belonging to some candidate key. State
      2NF as no non-prime attribute depending on a proper subset of any candidate key; show order date and
      customer facts depending on only the order-number part of the line key. Split Orders
      from OrderLines. For 3NF, expose the remaining customer-number-to-name dependency in
      Orders and product-number-to-name dependency in OrderLines, then split Customers and
      Products. Keep the charged price on the line under the stated business rule. Name the
      resulting relations, keys and dependencies and replay the initial invalid updates.
      Give the precise 3NF test beside its motivating split: for each non-trivial X -> A
      implied by the dependencies, X is a superkey or A is prime. Relate it to the simple
      transitive-dependency example without replacing the definition with a chosen-primary-key
      shorthand. Recompute keys and projected dependencies in each resulting relation,
      rather than treating original key labels as permanent. Reuse the exact definition
      in the later overlapping-key example instead of introducing another definition section.
  - title: Prove that the split preserves the intended relationships
    brief: >-
      Distinguish two questions: joining projections reconstructs every legal original relation
      without invented tuples, and enforcing dependencies within the new relations implies
      the original dependencies without joining. Illustrate a lossy split with two original
      tuples that yield a spurious combination, then test each binary split of the order-line
      example using the common attributes determining all attributes of one side under the
      functional dependencies. Show why applying lossless binary splits successively proves
      the whole reconstruction. Check preservation by projecting implied dependencies onto
      each relation and taking their combined closure; do not just check whether the original
      dependency text appears unchanged. Keeping all columns and passing one sample round-trip
      is insufficient. Foreign keys support references but do not establish these properties.
  - title: Choose between BCNF and a dependency that spans the split
    brief: >-
      Use Assignment(student, course, instructor) under student+course -> instructor and
      instructor -> course: a student has one instructor per course, and each instructor
      teaches one course. Derive both candidate keys, student+course and student+instructor;
      show why course is prime and the relation satisfies 3NF while instructor is not a
      superkey, violating BCNF. Split into InstructorCourse and StudentInstructor. Prove
      losslessness, then construct individually legal component states in which one student
      has two instructors for the same course: the original student+course dependency is
      not preserved. Compare retaining 3NF with accepting a rule spanning relations; name
      the integrity obligation and hand its concurrent enforcement to the parent and
      transaction owner instead of prescribing a trigger as a complete solution.
    heading:
      - title: Use a decomposition method with a known guarantee
        brief: >-
          Summarise the choice once the counterexample establishes its cost: repeatedly split
          on a BCNF violation for lossless BCNF without a general preservation guarantee;
          for functional dependencies, use 3NF synthesis when preservation matters. Explain
          the needed minimal-cover steps using Assignment's existing two dependencies: group
          determinants to obtain Assignment and InstructorCourse, then remove the contained
          InstructorCourse relation, retaining the original 3NF Assignment. It already contains
          a candidate key; state the general method's conditional key-relation addition without
          introducing another worked schema. Place this retained 3NF result beside the BCNF
          components and their spanning constraint. State the lossless and preservation
          guarantees and their dependence on the supplied dependencies. Omit exhaustive cover
          derivation and algorithm proofs; the recipe neither discovers the business model
          nor minimises the entire application's table count.
  - title: Separate genuinely independent multivalued facts
    brief: >-
      Use PersonLanguageHobby(person, language, hobby) under the explicit rule that a person's
      languages and hobbies vary independently. No non-trivial functional dependency need
      hold, so the relation can be in BCNF while needing every language-hobby combination.
      Add a language to expose the repeated work, define the multivalued dependency and
      fourth normal form, and split PersonLanguage from PersonHobby. Show the four-tuple
      rectangle required by independence and lossless reconstruction. Change the requirement
      so that a language is used for a particular hobby: now the pairing is a fact and the
      same split invents facts. Briefly acknowledge join dependencies beyond this case
      without adding a catalogue of higher normal forms. End by having the reader justify
      a split using its business rule, keys, removed anomaly, losslessness and preserved or
      newly spanning constraints; return whole-design and deliberate-duplication decisions
      to the parent.
