review:
  perspective: independent adversarial editor
  mode: breakdown
  article: a08-normalising-relational-schemas
  status: changes_requested
  independence: >-
    Read the assigned context, the shared commission and this breakdown without reading
    the practitioner review, existing relational articles, coverage maps or earlier plans.
  references_read:
    - src/reference-articles/sequences.astro
    - src/reference-articles/indexes.astro
    - src/reference-articles/storage.astro
  figure_code_read:
    - src/components/explainers/sequences/SequencePlayer.astro
    - src/components/explainers/indexes/IndexFigure.astro
    - src/components/explainers/indexes/ScanFigure.astro
    - src/components/explainers/indexes/BuildFigure.astro
    - src/components/explainers/indexes/DescentFigure.astro
    - src/components/explainers/indexes/RangeFigure.astro
    - src/components/explainers/indexes/ClusteredFigure.astro
    - src/components/explainers/indexes/SelectivityFigure.astro
    - src/components/explainers/indexes/CompositeFigure.astro
    - src/components/explainers/indexes/CoveringFigure.astro
    - src/components/explainers/indexes/WriteFigure.astro
    - src/components/explainers/indexes/SplitsFigure.astro
    - src/components/explainers/indexes/DeletedFigure.astro
    - src/components/explainers/storage/StepFigure.astro
    - src/components/explainers/storage/StorageDefs.astro
  overall: >-
    Keep one article with no child articles. Its distinct contribution is deciding whether
    decomposition preserves stated facts and locally enforceable dependencies. Folding the
    whole article into the modelling parent would bury the closure and counterexample work
    the parent cannot teach in a short section. Splitting normal forms into separate pages
    would multiply navigation and force readers to carry keys and assumptions between pages.
    The order-line spine, the overlapping-key exception and the independence counterexample
    earn their space. Tighten the opening sequence and bind the method recipe to its preceding
    counterexample before accepting the plan.
  findings:
    - id: AE1
      priority: medium
      location: breakdown.yaml:13-46
      issue: >-
        The opening starts with a flat one-line-per-row relation, derives its key, and only
        then introduces a repeating group in one cell to establish one line per row. The
        reader has already accepted and reasoned over the representation that the third
        section now establishes. This is a backward step with a new bad representation,
        rather than the references' progression in which each section changes one thing
        about an already visible case.
      repair: >-
        Fold the 1NF/domain material into the opening heading before candidate-key derivation.
        Use one compact before/after order example: a grouped list of lines becomes one line
        per row, then state the domain and set/present-value assumptions and keep that flat
        relation for closure and decomposition. The original first heading can still open
        with an immediately recognisable inconsistent update before this short clarification.
        Remove the separate Give each cell a value from the intended domain heading.
      useful_understanding_lost: >-
        None if relative atomicity, the counterexample and the proof assumptions survive.
        Only a separate navigation stop and the return to an earlier representation disappear.
      acceptance:
        - One line per row and proof assumptions precede the first attribute-closure calculation.
        - The brief still distinguishes a structured domain value from independently related line facts.
        - The opening does not repeat the parent's general entity-discovery or SQL representation lessons.
    - id: AE2
      priority: medium
      location: breakdown.yaml:90-100
      issue: >-
        The BCNF section earns its formalism by showing a concrete integrity obligation.
        Its nested method then introduces minimal covers, determinant grouping, relation
        containment and a key-containing relation without binding that work to a stated
        input and result. Small worked decision recipe is a useful limit, but the plan
        still permits another schema and a substantial algorithms detour immediately before
        the independent-fact example.
      repair: >-
        Explicitly reuse Assignment and its already stated dependencies for the synthesis
        comparison. Show the cover/group/containment decisions that apply to that input and
        the resulting retained 3NF relation beside the previously proposed BCNF components.
        Explain the key-relation addition as a compact conditional guarantee of the general
        method, without inventing a fourth schema merely to exercise the branch. Keep only
        the minimal-cover detail needed to make the recipe executable; leave exhaustive
        cover derivation and algorithm proofs out of this article.
      useful_understanding_lost: >-
        No commissioned judgement is lost. Readers lose exhaustive algorithm practice and
        another worked schema, while retaining a usable method and the reason its guarantee
        may matter. Those omitted details do not justify a child article in this commission.
      acceptance:
        - The method brief names Assignment as its worked input and identifies its resulting 3NF relation.
        - The preservation-versus-BCNF decision remains visible after the recipe.
        - No additional schema or separate algorithms child is introduced.
        - Supplied-dependency assumptions and both synthesis guarantees remain explicit.
  section_challenge:
    - location: breakdown.yaml:13-25
      section: Start with facts that must remain true
      decision: retain and absorb the domain setup
      value: >-
        Anomalies establish the problem; current names versus charged snapshots show that
        normalisation depends on meaning. This is the only necessary overlap with the parent.
      cost_control: >-
        Show one compact relation and a selected changed cell rather than separate full-width
        tables for every anomaly. Keep lifecycle ownership to one short boundary statement.
      cut_or_merge_loss: None from merging the domain setup here; cutting the factual rules would invalidate later reasoning.
    - location: breakdown.yaml:26-35
      section: Find the keys implied by the rules
      decision: retain
      value: Closure and minimality equip the reader to test a proposed key rather than trust a label.
      cost_control: >-
        Work one closure and one failed substitution; avoid repeating the parent's catalogue
        of identifier choices. Keep the surrogate warning as a short consequence of the same FDs.
      cut_or_merge_loss: Folding this into the parent would separate the calculation from the normal-form tests that need it.
    - location: breakdown.yaml:36-46
      section: Give each cell a value from the intended domain
      decision: fold into the opening as AE1
      value: Establishes the representation and the assumptions under which the proofs are read.
      cost_control: One counterexample and one short assumptions paragraph are enough.
      cut_or_merge_loss: No useful understanding lost if the qualifications survive.
    - location: breakdown.yaml:47-56
      section: Separate facts that depend on different keys
      decision: retain as the main worked transformation
      value: Connects partial and transitive dependencies to particular repairs while preserving the charged-price fact.
      cost_control: >-
        Use the same rows and columns throughout. Replay the original bad update after the
        split rather than restating a fresh list of generic anomalies for each named normal form.
      cut_or_merge_loss: Cutting either stage would hide the different source of the redundancy it repairs.
    - location: breakdown.yaml:57-65
      section: Check the definition against all candidate keys
      decision: merge into the surrounding decomposition section or a compact definition inset
      value: Prevents the primary-key-only shorthand from becoming the reader's definition of 3NF.
      cost_control: >-
        Introduce the exact test beside the motivating split, then apply the same definition
        again in Assignment. A separate nested navigation entry does not add an independent task.
      cut_or_merge_loss: None if the exact test and recomputation of projected keys survive; do not cut that substance.
    - location: breakdown.yaml:66-77
      section: Prove that the split preserves the intended relationships
      decision: retain
      value: This is the article's central judgement, not an optional theoretical appendix.
      cost_control: >-
        Carry forward the already produced relations. Show one fully expanded proof and a
        compact table of the remaining common-attribute tests; avoid reprinting the complete
        decomposition in prose. Keep losslessness and preservation visibly separate.
      cut_or_merge_loss: Merging this away would encourage readers to equate fewer anomalies with a sound decomposition.
    - location: breakdown.yaml:78-89
      section: Choose between BCNF and a dependency that spans the split
      decision: retain
      value: A small second example refutes the plausible stronger-is-always-better rule that the main example cannot expose.
      cost_control: >-
        Use only the three attributes and the two dependencies already specified. Stop after
        the concrete unenforced obligation; implementation belongs to its named owners.
      cut_or_merge_loss: Loss of the commissioned BCNF versus dependency-preservation trade-off.
    - location: breakdown.yaml:90-100
      section: Use a decomposition method with a known guarantee
      decision: retain within the BCNF section with AE2 limits
      value: Turns recognising the trade-off into a repeatable next step.
      cost_control: Reuse Assignment; do not become an algorithms survey or a separate child page.
      cut_or_merge_loss: Cutting the method entirely would leave a counterexample without a constructive alternative.
    - location: breakdown.yaml:101-114
      section: Separate genuinely independent multivalued facts
      decision: retain
      value: >-
        The independent/paired switch shows the limit of FD-only analysis and supplies the
        commissioned fourth-normal-form case; it cannot be replaced by another transitive FD.
      cost_control: >-
        Use the four-tuple rectangle and change only the independence requirement. Omit the
        acknowledgement of further join dependencies if it grows beyond a single sentence;
        a list of higher normal forms has no decision to support here.
      cut_or_merge_loss: >-
        Cutting the section loses the FD limit and 4NF reasoning. Cutting only the further-form
        acknowledgement loses a terminology signpost, with no loss to the taught decision.
  reference_teaching_assessment:
    strengths:
      - >-
        Like the repair booking, customer-42 orders and P7 price change, the proposed OrderLine
        case carries the main conceptual work without resetting context at every heading.
      - >-
        The BCNF and 4NF counterexamples change an assumption that changes a decision, matching
        the references' useful comparisons rather than providing decorative variation.
      - >-
        The plan correctly distinguishes assumptions and proofs from a sample round-trip, in
        the spirit of the references' separation of illustrative models from measured runs.
    writing_stage_guidance:
      - >-
        Preserve the reference pattern of directing attention, showing the change and explaining
        the result. For a lossy split, name the original two tuples, mark the invented tuple
        in the reconstructed table and say which business fact it invents. For independence,
        compare the same rectangle with the pairing requirement changed. Static side-by-side
        tables are sufficient; an animation is worthwhile only if stepping exposes that change.
      - >-
        The figure wrappers provide readable text, captions and step controls or static output.
        Any future normalisation figure must remain understandable without playback and carry
        the business-rule assumptions in nearby prose. Do not present a successful finite sample
        as a universal proof.
  recheck:
    required: true
    scope: >-
      Re-read the repaired opening sequence and the method brief against AE1 and AE2. Check
      that any structural consolidation retains exact normal-form tests and that no new child
      page or unrelated worked schema was added. No article prose or publication work is authorised.
  repair_recheck:
    status: accepted
    reviewed_file: breakdown.yaml
    resolutions:
      - id: AE1
        status: resolved
        evidence: >-
          The opening now establishes repeating groups, one line per row, relative domain
          atomicity, set semantics and present values before the key-derivation heading.
          It retains the address/timestamp distinction and keeps the flat OrderLine relation
          throughout. The separate 1NF heading is removed. General entity discovery and SQL
          representation remain with their named owners.
        acceptance: All three original acceptance criteria pass.
      - id: AE2
        status: resolved
        evidence: >-
          The synthesis brief explicitly reuses Assignment's two dependencies, generates
          Assignment and InstructorCourse, removes the contained InstructorCourse relation
          and retains 3NF Assignment. The result is compared directly with the existing BCNF
          components and their spanning constraint. The key-relation addition remains a
          conditional part of the general method; no fourth schema or child article appears.
          Both guarantees and their supplied-dependency assumptions remain explicit.
        acceptance: All four original acceptance criteria pass.
      - id: exact-3NF-heading-consolidation
        status: resolved
        evidence: >-
          The exact non-trivial-dependency test and recomputation of projected keys and
          dependencies are folded beside the motivating 3NF split. The brief explicitly
          reuses that test in the overlapping-key example, eliminating a definition-only
          navigation stop without cutting its substance.
    remaining_findings: []
    scope_limit: >-
      This accepts the repaired breakdown's learning sequence and boundaries. Writing-stage
      guidance about visible tuples, assumptions and readable figures remains guidance for
      the later commission; no prose, rendered figure or technical implementation was reviewed.
  final_status: accepted_after_repair
