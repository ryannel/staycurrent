topic: Relational execution, storage and performance
title: Understanding and improving database work
brief: >-
  Build a practical model of the work a relational engine performs, then use it
  to improve transactional, analytical and mixed workloads. Follow an order lookup,
  reservation update and sales report through storage, access paths, planning,
  execution and commit. Give newcomers a first useful diagnosis before directing
  them to deeper mechanisms and investigation. Distinguish doing less work from
  waiting less and adding resources; require evidence that an improvement survives
  representative concurrency and preserves correctness. Own engine mechanisms and
  performance investigation. Refer transaction correctness, application protocols,
  service objectives and recovery procedures, and multi-server coordination to
  their neighbouring articles.
heading:
  - title: Start with the work the user is waiting for
    brief: >-
      Introduce three concrete symptoms in one small orders system: a slow lookup,
      a reservation that waits despite a cheap query plan, and a report that
      disrupts checkout. Make report interference the first worked investigation;
      use the other symptoms as brief contrasts and later return points. Introduce
      only enough measurement vocabulary to read that case, and offer task
      entrances to investigation, access paths and execution.
  - title: Follow a statement from arrival to completion
    brief: >-
      Trace admission and queueing, parsing and planning, execution, waits, result
      transfer and commit acknowledgement on a compact timeline. Separate client
      elapsed time, server execution time and resource work, including concurrent
      activity and work deferred until later. Locate the connection pool and
      network at the application boundary and storage flushes within the engine;
      do not imply every engine follows one identical pipeline. Use the reservation
      and report to show why CPU, reads, log writes, memory and lock waits need
      different explanations. Provide the minimum map needed for the following
      sections.
  - title: Diagnose a workload before choosing a fix
    brief: >-
      Complete the report-interference case before the mechanism tour. Compare
      checkout with and without simultaneous reports using a stated observation
      window, offered load, throughput, latency distribution and failures. Contrast
      lock blocking with resource saturation as hypotheses; use blocking evidence
      and CPU demand to discriminate them. In a controlled trial, limit concurrent
      reports and compare the same offered workload, accounting for queued reports,
      completion time and checkout outcomes rather than hiding displaced work.
      Show the unchanged checkout plan becoming slower under the competing load.
      Keep one before-and-after evidence table here, including correctness,
      resource demand and deferred maintenance effects. Record data scale, workload
      assumptions, repetition and a reassessment trigger. End with the tuning
      stopping rule: if required work or contention exceeds the available budget,
      change admission, application boundaries, resources or architecture through
      the responsible neighbouring article. Introduce slow work, blocking and
      saturation as contrasting evidence patterns, not three full first cases.
    nested_article:
      topic: Relational workload diagnosis, measurement and benchmarking
      title: Investigating database performance
      brief: >-
        Teach a repeatable investigation from a defined symptom and workload
        baseline to ranked hypotheses, discriminating measurements, controlled
        interventions and verification. Combine statement-level totals and latency
        distributions, query plans, wait and blocking evidence, CPU, storage
        latency and throughput, caches, log pressure, memory and temporary work.
        Consume the storage, index and execution articles' evidence with short
        local reminders; do not reteach cache mechanisms, operators or the
        statistics model. Attribute expensive frequent queries as well as outliers;
        diagnose lock
        waits, saturation and regressions caused by data, parameters, plans,
        versions, configuration or workload mix. Use representative data,
        skew, concurrency and transaction boundaries; distinguish cold and warm
        states, offered load and completed throughput, instrument overhead and
        repeated-run variation, and preserve failures and tail latency. Teach
        safe use of execution-measuring plan tools, which may execute changes.
        Evaluate query and schema changes, memory and concurrency controls,
        bulk-load strategies and workload isolation against throughput, latency,
        capacity and cost. Establish resource headroom and marginal cost from
        measurements, and recognise when admission, application design, hardware
        or a different architecture must change. Operations owns service targets,
        ongoing monitoring and incidents; application engineering owns pools,
        backpressure and delivery protocols.
  - title: Rows, memory and durable writes
    brief: >-
      Follow one read and one update through a deliberately bounded storage model:
      logical rows and versions, physical pages, buffer and operating-system caches,
      dirty state, log records and eventual data writes. Explain why a cache hit,
      a committed change and a cleaned-up old version are different events. Separate
      an illustrative model from named-engine measurements. Summarise how layout,
      version retention, logging and background maintenance turn logical operations
      into physical work before introducing the deeper storage article.
    nested_article:
      topic: Relational physical storage, versions and recovery
      title: How relational engines store and change data
      brief: >-
        Teach the path from logical rows to physical work: pages and records,
        row and column layouts, compression and large values, heap and clustered
        storage organisation, buffer management and operating-system caches, updates and
        retained versions, free-space reuse, logging, checkpoints and crash recovery.
        Compare consequential named implementations, including redo and undo
        responsibilities, without treating one engine's page layout or visibility
        rules as universal. Explain commit durability mechanisms, write amplification,
        old-version cleanup, reclamation and the maintenance debt caused by long
        transactions or sustained writes. Show how to measure these effects and
        reason about safe bulk-loading and maintenance choices. Own physical
        mechanisms and their performance consequences. Own the physical layout,
        compression, cache, version and log/cleanup explanations; indexes owns
        key/locator design and execution applies those physical properties to
        operator work. Keep bulk loading here to physical/log/cleanup effects;
        investigation owns experiment design. Transaction articles own isolation
        correctness, and operations owns backup, restore and maintenance runbooks.
  - title: Find fewer rows without making every write too expensive
    brief: >-
      Compare a scan with an ordered access path for the order lookup, accounting
      for index traversal, matching entries, table fetches and visibility checks
      where applicable. Show that selectivity, locality, covering data, ordering
      and table size change the answer. Carry the same index through inserts and
      updates so its storage, logging and maintenance costs remain visible. End
      with a concrete workload trade-off rather than an instruction to index every
      filter.
    nested_article:
      topic: Relational indexes and access methods
      title: Choosing and maintaining indexes
      brief: >-
        Develop index judgement from ordered-tree lookup, range scans and table
        fetches to composite key order, equality and range predicates, ordering,
        covering and index-only access, partial and expression indexes, uniqueness,
        and the key and row-locator consequences of clustered versus secondary
        organisation. Explain when scans or index
        combinations win and when predicates, conversions, collations or parameter
        behaviour prevent the expected access path. Introduce alternative access
        methods only through workloads that justify them. Refer coarse data
        skipping to execution, giving only the local access-path consequence.
        Measure read benefits against update, storage,
        logging and cache costs. Teach evidence-led index building, monitoring,
        consolidation, rebuilding and removal, including concurrent activity and
        engine-specific locking or resource effects. Own key order, row locators,
        access eligibility and index-set maintenance costs; reference storage
        for physical layout and caches and execution for estimates and statistics.
        Refer operational change procedures and integrity design to their owners.
  - title: Turn a query into an executable flow of data
    brief: >-
      Read a small plan as rows flowing through operators, with separate estimates
      and observations. Use the sales report to introduce cardinality, row width,
      join choice, aggregation and sorting; show how an early underestimate can
      multiply later work. Explain that a planner's cost is a comparison model,
      not elapsed time, and that plan-node times and parallel work need careful
      interpretation. Preview memory and temporary work through their effect on
      this report; leave the algorithm catalogue, execution styles and parallel
      detail to the child.
    nested_article:
      topic: Relational query planning and execution
      title: Reading plans and understanding execution
      brief: >-
        Teach how planners choose access paths, join order and join algorithms,
        aggregation and sorting from cardinality and cost estimates. Develop
        plan reading using estimates, actual rows and loops, startup and total
        work, filters, fetched pages, memory, spills and parallel workers without
        adding overlapping node timings as independent elapsed time. Explain
        statistics, skew, correlated values, stale estimates, parameter-sensitive
        plans and plan caching. Connect nested-loop, hash and merge joins, hash
        and ordered aggregation, external sorting, materialisation and pipelining
        to resource use, including memory multiplied across operators, workers
        and concurrent queries. Own estimates/statistics, operator memory and
        spills, batching/vectorisation, coarse data skipping in scans and parallel
        coordination. Apply storage's row/column layouts and compression with
        brief reminders rather than repeating their physical explanations. Local
        partitioning owns key/granularity and lifecycle decisions; this article
        explains how pruning appears in execution. Make the analytical report
        the principal worked thread and a transactional lookup a brief contrast,
        preserving SQL semantics. Investigation consumes plan evidence for
        workload-wide prioritisation and benchmarking.
  - title: Organise growing data around the work it must support
    brief: >-
      Contrast a faster access path with changing physical organisation or removing
      expired data. Use date-based order retention to explain local partitioning,
      pruning and bounded maintenance, then show a lookup that touches every
      partition. Apply the earlier evidence method to the lifecycle decision;
      reference storage and indexes for growth and maintenance work rather than
      repeating those mechanisms or the capacity comparison. Keep partitioning within
      one service distinct from routing data across independently failing servers.
    nested_article:
      topic: Local relational table partitioning
      title: Partitioning tables for access and maintenance
      brief: >-
        Teach when table partitioning earns its complexity through pruning,
        retention, loading or bounded maintenance rather than assuming it makes
        queries faster. Choose partition keys and granularity against concrete
        predicates, data distribution, growth and lifecycle needs. Explain
        partition-aware plans, indexes and statistics, local and global uniqueness
        constraints, joins, partition counts, hot partitions and queries that
        cannot prune. Follow creating, attaching, detaching and retiring data
        through validation, locks, resource use and rollback constraints in
        named engines, and compare a partitioned design with an ordinary indexed
        table using representative measurements. Keep correctness and application
        migration protocols with their owners, and keep sharding and cross-server
        movement in the distribution branch.
