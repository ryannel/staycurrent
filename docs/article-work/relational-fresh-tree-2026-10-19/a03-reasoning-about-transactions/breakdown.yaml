topic: Relational transactions and concurrency
title: Reasoning about transactions
brief: >-
  Teach how to turn an application invariant into a transaction protocol whose
  permitted outcomes can be explained and tested. Use a stock reservation as the
  running example, using PostgreSQL 18 as the reference engine and SQL dialect,
  then expose the limits of single-row reasoning with a rule spanning several
  rows. Connect atomicity, isolation and durability to outcomes;
  explain snapshots, locks, multiversion concurrency, anomalies, serialisability,
  conditional changes, uniqueness, deadlocks and retries. Compare named engine
  contracts where they change the protocol, rather than treating isolation labels
  as interchangeable. The reader should leave able to analyse a two-session
  history, choose and justify a protection mechanism, recognise abort and retry
  boundaries, and design a deterministic concurrency test. The child develops
  complete multi-row protocols. Application engineering owns connection lifetimes,
  ambiguous client outcomes, idempotency across requests and external effects;
  execution owns physical recovery and performance investigation; distribution
  owns cross-server consistency and transaction coordination.
heading:
  - title: Start with the rule that must remain true
    brief: >-
      State that available stock must never become negative and that a reservation
      must correspond to a stock change. Follow two customers through a check-then-
      write race before introducing terminology. Write down the initial state,
      each transaction's reads and writes, successful commit and abort, and the
      acceptable final states. Separate a transaction that is wrong even alone
      from one that is correct alone but unsafe under concurrency.
    heading:
      - title: What a transaction promises
        brief: >-
          Explain BEGIN, COMMIT, ROLLBACK and implicit statement transactions using
          the example. Relate atomicity to partial failure, isolation to overlapping
          work and durability to the configured acknowledgement and failure contract.
          Explain that ACID consistency still requires correct rules and protocols.
          Name savepoints as partial rollback boundaries, not independent commits,
          and flag transactional DDL and sequence behaviour as engine-specific.
      - title: Read a history before choosing a setting
        brief: >-
          Introduce a two-lane read/write/commit history with explicit values and
          blocking points. Ask the reader to predict the result, then compare it
          with legal serial executions. Treat the figure as an illustrative schedule;
          recorded native-engine runs elsewhere must state version and settings.
          Keep replication visibility and acknowledgement loss for their owners.
  - title: Put the decision and the change under one protection
    brief: >-
      Repair the reservation using a conditional stock decrement inside the same
      transaction as the reservation insert. Explain why wrapping an earlier read
      and a later unconditional write in BEGIN does not by itself repair the race.
      Carry the invariant through success, rejection and rollback.
    heading:
      - title: Conditional updates and version checks
        brief: >-
          Show an engine-specific conditional UPDATE, affected-row or returned-row
          check, and an optimistic version comparison. Contrast applying an increment
          to the current protected row with overwriting it using a stale value.
          Explain what zero matching rows means and why a failed version check
          requires a fresh business decision. State assumptions about target identity,
          update semantics and the isolation level; do not generalise one product's
          predicate recheck behaviour to all engines.
      - title: Let uniqueness arbitrate competing inserts
        brief: >-
          Show why checking absence and then inserting is insufficient, while an
          appropriate unique constraint arbitrates concurrent claims. Follow the
          winner, waiting or rejected contender, and application interpretation of
          the result. Link constraint design and SQL conflict syntax to their owners;
          retain the concurrency contract, including errors that are domain rejection
          rather than automatically retryable infrastructure failures.
  - title: Understand what a read can see and what a lock protects
    brief: >-
      Build a minimal mechanism model only after the reader has a concrete protocol.
      Contrast a snapshot used to select visible versions with locks or conflict
      checks used to coordinate changes. Explain that multiversion concurrency does
      not remove writer conflicts or guarantee serialisability.
    heading:
      - title: A snapshot is a view, not a reservation
        brief: >-
          Distinguish a statement snapshot, a transaction snapshot and reading one's
          own writes. Use a changing total and its detail rows to expose fractured
          observations across statements. Explain how an ordinary read, a locking
          read and a write can follow different visibility rules in one system.
          Keep physical version storage and reclamation mechanics in execution.
      - title: Rows, ranges and the row that is not there
        brief: >-
          Explain shared and exclusive conflicts, row locking, predicate or range
          protection and the difference between blocking prevention and dependency
          tracking that may abort. Show that locking returned rows cannot generally
          protect an empty result or future insertion. Introduce a stable guard row
          as an explicit coordination point; develop its full protocol in the child.
  - title: Choose isolation by the outcomes it must exclude
    brief: >-
      Replace a memorised ladder of isolation names with a small set of histories.
      Connect dirty reads, changing rereads, phantoms, lost updates and write skew to
      failed decisions; show that a stable snapshot can still permit incompatible
      decisions. Define serialisability by equivalence to a serial order of committed
      transactions, not by absence of overlap or a universal real-time guarantee.
    heading:
      - title: Stable reads can still produce an impossible decision
        brief: >-
          Use two depots with one available unit each and a rule requiring at least
          one unreserved unit across both. Each transaction reads a total of two,
          decides that reserving one unit is allowed, and changes its own depot row.
          Either alone leaves one; both committing from the same snapshot leave
          zero. In either serial order the second decision must reject. Use this
          history to distinguish a changed result set from write skew and explain
          read/write dependencies; avoid a separate anomaly encyclopaedia.
      - title: Check the engine contract behind the name
        brief: >-
          Use a compact decision table of versioned contracts, with PostgreSQL 18
          as the running reference: READ COMMITTED and snapshot-based REPEATABLE
          READ versus SERIALIZABLE;
          MySQL InnoDB consistent reads, locking reads and range protection; and
          SQLite rollback-journal versus WAL reader/writer behaviour and write
          transaction start modes. Make settings, storage engine and journal mode
          explicit. Show only contrasting histories that change a protection or
          restart decision; keep full commands and alternative native runs in
          supporting evidence, verified against current primary documentation.
          Do not replay every example in each engine or build parallel product
          tutorials; shared isolation labels do not establish shared behaviour.
  - title: Protect a rule that spans several rows
    brief: >-
      Give the parent a complete worked repair of the two-depot reserve rule using
      serialisable execution and whole-transaction restart with fresh reads and a
      new reserve decision, with its assumptions stated. Compare
      that choice briefly with a shared guard row and materialising an enforceable
      constraint. Explain that every transaction able to violate the rule must
      participate, including administrative and background writes. A small decision
      table should let the reader recognise when the deeper protocol work is needed.
    nested_article:
      topic: Transaction protocols for multi-row invariants
      title: Protecting rules across several rows
      brief: >-
        Teach how to design and prove transaction protocols for rules involving a
        changing set of rows. Require the parent's isolation model and complete
        fixed-set serialisable repair as prerequisites; recap or link that baseline
        rather than reteaching it. Reuse the two-depot reserve invariant, extending
        it to concurrent insertion and deletion of depots. Develop stable guard-row
        locking and a remodelled constraint or conditional aggregate counter, and
        revisit serialisable reasoning where the changing set alters the proof.
        Include missing rows, concurrent insertion
        and deletion, lock order, snapshot timing, every participating write path,
        and repair after abort. Explain why locking only the matching rows or using
        an advisory lock without universal participation is insufficient. Compare
        safety, concurrency and maintenance costs, and supply deterministic
        two-session counterexamples and passing histories for the new protocols,
        using PostgreSQL as reference and named engine contrasts only where their
        contracts change the proof. Own
        these complete database protocols; use the parent's isolation model rather
        than reteaching it, and leave request idempotency and external side effects
        to application engineering.
  - title: Make blocking and aborts part of the design
    brief: >-
      Trace a deadlock from two transactions acquiring the same resources in
      opposite order; distinguish a wait, a deadlock victim, a timeout, a constraint
      rejection and a serialization failure. Explain that preventing invalid commits
      can legitimately require rejecting work, and progress under contention needs
      a bounded policy as well as a safety argument.
    heading:
      - title: Restart the decision, not the last statement
        brief: >-
          Show that a known deadlock or serialization abort requires the transaction
          to be unwound and its reads and decisions repeated. Identify engine-specific
          error scope, including statement rollback versus transaction abort and
          invalid transaction states; do not infer safety from a generic error class.
          State retryable outcomes and bounded retry/backoff assumptions at the
          protocol boundary. Hand ambiguous commit outcomes, driver behaviour and
          effects outside the database to application engineering.
      - title: Shorten the critical section without weakening the rule
        brief: >-
          Explain consistent acquisition order, unnecessary lock footprint, hot
          coordination rows, long-lived snapshots and transactions waiting on user
          input. Show why reducing work inside a transaction can improve progress
          but splitting an invariant across commits changes correctness. Distinguish
          safe waiting from queue-oriented NOWAIT or SKIP LOCKED choices that may
          intentionally return an incomplete set. Link wait diagnosis and capacity
          tuning to execution rather than growing an operational runbook here.
  - title: Test the protocol against a hostile schedule
    brief: >-
      Turn the earlier histories into one reproducible PostgreSQL 18 worksheet,
      rather than retelling their explanations. Demonstrate its barrier-and-assertion
      method on the original reservation: fixed initial rows, exact statements,
      explicit barriers, captured results, commit or abort status and final invariant
      assertions. Include unsafe and repaired variants and rollback after a forced
      mid-transaction failure. Reuse the two-depot fixture as a short second scenario:
      reproduce write skew under REPEATABLE READ, then run the SERIALIZABLE repair,
      capture whichever transaction aborts, and restart it with fresh reads so its
      new business decision preserves the reserve. Make universal writer participation
      explicit. Link the already explained deadlock and retry cases as additional
      worksheet scenarios rather than repeating their narrative in the main text.
      Check safety and completion under bounded load, and record version, isolation,
      relevant settings and expected alternatives. Distinguish illustrative schedules
      from native observations and explain why random success is not a correctness
      argument. End with a compact protocol checklist: rule, all writers, read
      assumptions, protection, abort handling and tests. Link application integration
      testing without taking over its driver and deployment concerns.
