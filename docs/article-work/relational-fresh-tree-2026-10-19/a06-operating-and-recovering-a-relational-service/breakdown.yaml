topic: Relational service operations, security and recovery
title: Operating and recovering a relational service
brief: >-
  Turn workload, trust and recovery requirements into a service that can be
  established, observed, changed and recovered deliberately. Follow the same
  order-reservation service through provisioning, a busy trading period, routine
  maintenance and an incident. Update one compact service record throughout:
  illustrative objective values and accepted reservation markers lead to tested
  settings, before/after observations and a failed acceptance result that forces
  a policy revision. Label illustrative inputs, modelled outcomes and observed
  execution distinctly. Teach operational decisions and executable runbooks,
  using a pinned PostgreSQL release for concrete examples and identifying
  managed-service substitutions. Engine diagnosis belongs to execution and
  replication, fencing and routing guarantees belong to distribution; use those
  mechanisms as preconditions rather than teaching them again. A reader should
  finish with an owned service specification, actionable alerts, a rehearsed
  change procedure and evidence that a chosen recovery path meets its objectives.
heading:
  - title: Decide what this service must survive
    brief: >-
      Begin with the reservation service's peak workload, latency and availability
      objectives, data sensitivity and named failure domains. Select explicit
      illustrative values for peak demand, a latency objective and recovery
      objectives; identify accepted reservation markers to check after recovery.
      These are requirements to test, never observations or product promises.
      Define recovery point and recovery time objectives in terms of lost accepted work and time
      until usable service, including detection, decision, provisioning,
      restoration, validation and traffic return. Separate tolerable data loss
      from correctness failures. Assign authority, on-call ownership and escalation;
      show how a requirement becomes a measurable test rather than a product label.
      Define the common procedure record once: verified target identity, authority,
      preconditions and dependencies, expected effect, recorded evidence, gates,
      stop conditions, recovery route and acceptance. Reuse it for subsequent
      changes, containment and recovery rather than repeating a general checklist.
    heading:
      - title: Choose a recovery path for the actual failure
        brief: >-
          Use one decision table for process crash, server loss, mistaken deletion,
          suspected corruption, resource exhaustion and loss of a region or account.
          Distinguish crash recovery, replica failover, backup restoration and
          disaster recovery by dependencies and surviving state. A replica can
          reproduce an unwanted change; disaster recovery includes credentials,
          keys, configuration, network and application dependencies. Send mechanism
          questions about failover, fencing and routing to distribution; use its
          observed readiness conditions as live gates before a recovery action.
  - title: Establish a service you can reproduce
    brief: >-
      Walk from an empty host or managed-service account to an isolated working
      instance: supported release, installation or service creation, storage and
      file ownership, network reachability, administrative access, configuration
      inventory, logging and a smoke transaction that writes the first accepted
      reservation marker. Use one pinned installation path plus a compact managed-
      service substitution table. Update the same service record with tested
      reachability, actual settings and provider restrictions. Keep a small
      responsibility table for
      host patching, database patching, access, backup policy, restore validation
      and failure-domain independence; a managed service changes the executor but
      still requires an accountable owner and tested guarantees.
    heading:
      - title: Bound resource use before accepting traffic
        brief: >-
          Set an initial envelope for connections, concurrent work, memory, CPU,
          data and temporary space, log growth and storage throughput. Use a
          numerical concurrency example to show why a per-operation memory limit
          is not a server-wide budget. Keep administrative headroom, set justified
          statement and lock limits, and record which settings require a restart,
          reload, new session or provider operation. Validate the envelope against
          the intended workload and recovery storage needs; link to application
          pooling and backpressure and execution's capacity investigation.
  - title: Establish and test the trust boundary
    brief: >-
      Map application, migration, analyst, backup, automation and emergency
      identities to required actions. Introduce authentication, authorisation,
      transport encryption, backup and storage protection, key custody and audit
      evidence as separate controls. Require negative tests under the actual
      application identity and a tested emergency-access route before go-live.
      Explain why tenant protection includes privileged code and operational
      exports as well as normal queries.
    nested_article:
      topic: Relational service access control and security operations
      title: Securing relational access
      brief: >-
        Build and test a relational trust boundary from named identities and a
        threat model. Teach roles, ownership, role membership, grants and default
        privileges; separate application, migration, backup, analyst and emergency
        access. Cover authentication, network access, verified TLS, credential and
        certificate rotation, secrets and encryption-key custody, storage and backup
        encryption, tenant isolation choices and row-policy bypasses, audit scope,
        sensitive log data, retention and evidence protection. Treat routines,
        triggers, views and extensions as potential privilege boundaries: test
        invoker versus definer behaviour, executable privileges, object resolution
        and untrusted inputs using the chosen engine's actual rules. Include a
        reproducible least-privilege and cross-tenant denial test plus an access
        revocation and rotation exercise with failure and lockout cases.
        Use the same named actors and one denied cross-tenant attempt through
        ordinary queries, resident code and an operational export to connect the
        controls, rather than multiplying object-by-object tutorials. Compare
        implementation differences where the safe design changes; SQL owns routine
        semantics, application engineering owns placement and deployment, and
        this article owns security policy and verification.
  - title: Observe the service and act before it runs out of room
    brief: >-
      Derive a compact dashboard and actionable alerts from the service contract:
      request latency, errors and throughput alongside queueing, connections,
      resource saturation, data and log growth, maintenance debt, backup freshness,
      archive continuity and restore-test age. Observe whether the selected
      recovery path is ready now, consuming distribution's verified signals for
      standby availability, durable receive or replay position as appropriate,
      topology and synchronous state, freshness and current data-loss exposure.
      Do not infer catch-up or recovery time from a lag duration. Work one alert
      where customer traffic succeeds but protection has degraded: assign an owner
      and choose repair, explicit temporary risk acceptance or a work restriction
      required by the service contract. Record measurement window and workload
      mix; distinguish customer symptoms from explanatory signals. Give
      each alert a threshold rationale, owner, urgency and first safe action.
      Use a measured or explicitly modelled busy period to update the same service
      record: compare demand and observations before and after a bounded response.
      Connect growth rate and lead time to a capacity decision, accounting for
      maintenance, restore and temporary-space headroom and managed-service limits.
    heading:
      - title: Rehearse a connection and storage exhaustion response
        brief: >-
          Make connection exhaustion the full containment walkthrough using the
          common procedure record: identify the demand source, preserve operator
          access and reduce or reject work through the application boundary before
          changing limits; compare the resulting service observations. Treat storage
          pressure as a short variation with its different trigger, safe action and
          stop condition: establish which data, temporary or retained-log category
          is growing, preserve recoverability and choose a documented bounded remedy.
          Never present deletion of database files as cleanup.
          Link execution for diagnosis and distribution for replication retention
          causes. State when to escalate, stop or invoke a recovery procedure.
  - title: Prove recovery before relying on it
    brief: >-
      Turn the failure table into a recovery policy: recovery-point coverage,
      backup form, independence, retention, protected credentials and keys, restore
      environment and measured drills. Distinguish a successful backup job, an
      integrity check, a completed restore and validated application behaviour.
      Show a deletion timeline where the selected recovery point saves an earlier
      state but discards later good writes unless they are reconciled separately.
      Move the destructive event or remove one recovery dependency and ask which
      accepted reservation markers remain recoverable within the chosen objective.
      Include one failed drill result that forces a revised policy or setting in
      the shared service record. Keep method comparison, commands and reconciliation
      execution in the child. Keep a concise acceptance record here.
    nested_article:
      topic: Relational backups, restoration and disaster-recovery exercises
      title: Proving relational recovery
      brief: >-
        Design a backup and retention policy against explicit data-loss and
        recovery-time objectives, then execute and validate recovery in an isolated
        environment. Compare logical exports, physical backups, coordinated
        snapshots and log archives by consistency, restore scope, compatibility,
        dependencies and supported recovery targets. Teach base-backup and log
        continuity, retention dependencies, protected independent copies, restore
        permissions, encryption keys and configuration. Make mistaken deletion the
        full worked restoration using the parent's common procedure record: target
        selection, isolated point-in-time restore, integrity and
        business-invariant checks, reconciliation of later valid work, controlled
        traffic return and renewed backup protection. Treat corruption and total
        failure-domain loss as targeted restoration branches with different
        surviving dependencies and validation needs; the parent owns incident
        command, containment and preservation of original evidence. Use short
        failure variations for inaccessible keys, missing logs, insufficient space,
        unavailable control-plane access and an unmet recovery-time objective,
        rather than repeating full incident narratives.
        Distinguish backup checksums from successful recovery; rehearse failover
        only against distribution's verified promotion, fencing and routing
        preconditions and live observations that the intended recovery path is
        currently ready. Record elapsed time, recovered markers, lost accepted work,
        evidence, stop conditions and ownership. Explain what the drill establishes
        and what remains untested; keep engine crash-recovery mechanics and
        replication protocols in their owning articles.
  - title: Change and maintain the service without guessing
    brief: >-
      First apply the common procedure record to a short configuration change,
      reading back its effective scope and before/after observations. Treat the
      version upgrade as the consequential variation: compatible versions and
      artefacts, prerequisite restore evidence, realistic workload window and spare
      resources, expected interruption and new acceptance gates. Show only what
      changes from the first procedure; distinguish reverting configuration from restoring data or migrating back
      after incompatible changes and newly accepted writes. Rehearse with realistic
      data volume, extensions, drivers and permissions and record the measured
      outage rather than promising a generic zero-downtime upgrade.
    heading:
      - title: Schedule upkeep from debt and risk
        brief: >-
          Cover patch and support policy, engine-specific vacuum or garbage
          collection, statistics, index upkeep and integrity checks at the level of
          operational triggers, work windows, resource budgets and validation.
          In the PostgreSQL example, distinguish protective transaction and
          multixact age maintenance from optional optimisation, observe progress
          and blockers, and escalate before protective limits stop writes. Do not
          imply ordinary vacuum and table rewrites have the same space or locking
          effects. Show how long-running work or unavailable storage can defeat
          maintenance and threaten availability. Execution explains the mechanisms
          and repair diagnosis; application engineering owns rolling schema changes and
          backfills. Decide who owns provider maintenance notices, certificate
          expiry and restoring protection after a change.
  - title: Run an incident from evidence to restored confidence
    brief: >-
      Reuse the common procedure record for the additional judgement required by
      suspected corruption: uncertain scope, incident command, justified write or
      access restrictions, preservation of logs and original media or snapshots
      before destructive repair, decisions and handover. Choose a verified recovery
      path and consume the recovery child's restoration and validation output
      rather than narrating restoration again. Distinguish containment from
      diagnosis and permanent repair; include required stakeholder escalation
      without inventing regulatory obligations. Close the same service record with
      recovered reservation markers, reconciled business state, observed service
      acceptance, renewed protection, the revision forced by the failed drill and
      an outstanding limitation. Avoid another general operations checklist.
