topic: Replication and distribution in relational databases
title: Relational data across servers
brief: >-
  Teach how independently failing relational servers change the database contract.
  Begin with an order reservation whose writer fails after acknowledging a commit,
  and whose next read reaches another server. Use operation histories to distinguish
  replication, partitioning and distributed coordination, then compare a single writer
  with replicas, application-managed shards and an integrated distributed relational
  system against an explicit workload and failure budget. Explain enough log, quorum,
  placement and routing mechanics to choose a path and recognise a broken promise;
  the three deeper articles supply implementation and operational depth. Keep local
  transaction semantics with the transactions article and service-wide recovery
  procedures and backup policy with operations. Teach required distributed-systems
  reasoning here without depending on a separate programme.
heading:
  - title: Follow one reservation across a failure
    brief: >-
      Start with a client write, an acknowledgement, a writer failure and a read
      through another endpoint. Annotate invocation, response, log receipt, durable
      storage and application separately; ask what the surviving server may return
      and whether the client can distinguish loss from an unknown outcome. Introduce
      replication as copies, partitioning as ownership of different data and
      coordination as agreement about decisions. Keep the example's claimed outcomes
      conditional on the stated protocol; a topology drawing alone proves none of them.
  - title: Write down the contract before choosing a topology
    brief: >-
      Turn the reservation workload into required invariants, read freshness,
      read-your-writes and monotonic-session needs, permitted acknowledged-write loss,
      recovery time, regional latency, throughput and outage behaviour. Distinguish
      transaction isolation from replica-read freshness and real-time ordering, and
      crash durability from survival of a stated failure domain. Show what a timeout
      or network partition prevents participants from knowing; a protocol must choose
      when to wait, reject, serve stale data or permit divergent writes. Treat client
      retries and external effects as an application-engineering hand-off.
  - title: Keep one writer and copy its history
    brief: >-
      Trace how a committed change reaches a replica through log transport and
      application, and place the client acknowledgement on that timeline. Separate
      received, persisted and replayed positions, asynchronous and synchronous
      acknowledgement contracts, and read-only replicas from additional writers.
      Explain why a healthy writer can coexist with stale replicas, why a replica is
      not a backup, and how read routing changes what a session observes. Introduce
      promotion as a change in authority that requires old-writer exclusion, then
      hand off detailed protocols to the child.
    nested_article:
      topic: Single-writer relational replication and failover
      title: Replication, replica reads and failover
      brief: >-
        Develop single-writer replication from commit logging through transport,
        persistence, replay, bootstrapping and catch-up. Compare physical and logical
        replication through their consequences for schema, replica contents, upgrades,
        identity, ordering and retention. Derive precisely what each acknowledgement
        mode and failure-domain placement promises about acknowledged-write survival
        and read visibility. Design replica routing for lag, causal/session position
        waits, fallback and overload; distinguish time-based lag estimates from replay
        progress and application freshness. Analyse promotion histories with client
        reconnection, divergent timelines, stale candidates, fencing and reintegration
        of the old writer; distinguish leader selection from safe exclusion and
        failover from backup restoration. Explain logical-feed duplicate delivery;
        keep multi-writer material to a short boundary warning about conflict handling
        and globally enforced constraints, linking to the coordinated and
        conflict-resolving comparison in distributed SQL. Use verified named relational
        implementations only where their actual contracts change the decision. End
        with failure-injection histories and evidence for loss, stale reads, recovery
        time and a sole writable authority, completing the parent's common acceptance
        worksheet for replica lag and promotion. Operations owns the complete service
        runbook and application engineering owns ambiguous outcomes and external effects.
  - title: Split ownership when one writer is the limit
    brief: >-
      Distinguish local table partitioning from distributing ownership across servers.
      Work through placing orders by account: a local account transaction becomes
      cheap while a global uniqueness rule, cross-account transfer and global report
      cross ownership boundaries. Compare range and hash placement, co-location,
      skew and hotspots, including secondary indexes and the routing directory. Show
      how a reshard changes ownership while clients are still reading and writing;
      scale-out requires a correct movement protocol as well as additional machines.
    nested_article:
      topic: Application-managed relational sharding
      title: Designing and moving relational shards
      brief: >-
        Teach when application-managed sharding is justified and how to choose shard
        keys from transactions, joins, growth, tenant boundaries and access patterns.
        Compare range, hash and directory routing, co-location and placement across
        failure domains. Develop hot-key, hot-tenant, uneven-growth and global-index
        cases; account for uniqueness, referential integrity, identifiers, fan-out
        reads, aggregates, pagination and unavailable shards. Explain the explicit
        options for cross-shard invariants: keep related work together, use a
        supported atomic protocol or redesign the business workflow with visible
        intermediate states. Develop an online split or move, including the initial
        move out of one writer, with a snapshot,
        concurrent-change capture, catch-up, ownership epochs, a cutover barrier,
        stale-router handling, reconciliation and rollback limits; show how to
        prevent lost or doubled effects and avoid uncontrolled dual writes. Include
        movement throttling, routing metadata availability and correctness checks
        under interruption. Complete the parent's common acceptance worksheet for
        stale routing and interrupted movement. Own shard ownership and movement; link to application
        delivery for rolling code/schema compatibility and to distributed coordination
        for the mechanics of an atomic cross-shard transaction.
  - title: Make distributed SQL's coordination visible
    brief: >-
      Explain that a SQL interface can hide placement and message exchange while
      applications still pay their latency and failure costs. Draw one statement's
      fan-out and one transaction's reads, replicated writes and commit decision.
      Distinguish consensus within a replica group, atomic commit across groups,
      isolation across transactions and a real-time consistency promise. Place
      quorum members, leaders or leaseholders, data and clients on the same latency
      budget; additional replicas do not divide the cost of a hot key or eliminate
      cross-region coordination.
    nested_article:
      topic: Integrated distributed relational systems
      title: Coordinating distributed SQL
      brief: >-
        Build the machinery needed to assess an integrated distributed relational
        system: replicated ranges or tablets, placement and rebalancing, routing,
        leaders or leases, quorum intersection, terms or epochs, log commitment and
        recovery after partitions. Explain the selected implementation's safe voting
        membership changes: replica catch-up, safety across old and new configurations,
        and the failure-domain availability retained during a transition; require an
        interrupted membership-change history. Distinguish quorum replication and consensus
        from atomic commit, then follow a cross-range transaction through participant
        preparation, durable decision, coordinator failure and recovery. Connect
        distributed snapshots, timestamps, clock assumptions and uncertainty handling
        to documented isolation and real-time ordering guarantees without implying
        one universal protocol. Trace distributed joins, aggregation, secondary-index
        maintenance, constraint checks and transaction retries through network work,
        contention and failure. Derive latency and availability consequences from
        concrete regional placements, including loss of a region, minority operation,
        stale-read options, hotspots and rebalancing load. Compare a small number of
        verified relational implementations at the mechanism and contract level;
        cover synchronously coordinated writes alongside asynchronous or
        conflict-resolving multi-writer alternatives and the invariants they can
        preserve. Complete the parent's common acceptance worksheet for quorum loss,
        interrupted membership changes and commit recovery. Require executable tests
        of the claimed guarantees and distinguish
        illustrative histories from observations of a real engine. Local isolation
        theory belongs to transactions; full operating runbooks belong to operations.
  - title: Compare choices and change architecture safely
    brief: >-
      Use the same reservation workload to compare a larger single writer with
      replicas, application-managed shards and integrated distributed SQL. Show a
      compact decision table covering transaction locality, read requirements,
      write contention, failure domains, regional latency, coordination ownership
      and operational cost; avoid selecting by a scalability or availability label.
      Give one short transition decision example: what constraints, identities and
      results must be equivalent at the target, which system may accept writes,
      what reconciliation evidence permits authority handover, and when rollback
      ceases to be a simple routing change. Keep these architecture decisions here;
      the sharding article owns the worked snapshot, change-capture and cutover
      history, including an initial move from one writer. Application engineering
      owns rolling compatibility, backfill/restart and client delivery mechanics.
  - title: Test the promise, including the uncomfortable interval
    brief: >-
      Finish with a reusable acceptance worksheet: invariant, promised failure set,
      concurrent requests and responses with uncertainty, permissible outcomes and
      evidence limits. Complete it once for the opening reservation and replica
      failure. Include checks of acknowledged-write survival, valid authority or a
      coordinated writer set for each ownership unit and epoch, observed read order,
      invariant preservation and convergence after healing. Give concise prompts
      that route replica lag and promotion to replication, stale routing and
      interrupted movement to sharding, and quorum loss and interrupted membership
      or commit recovery to distributed SQL. Each child completes the same worksheet
      for its concrete mechanism rather than repeating the general test method.
      Explain what server logs, commit positions and client histories can establish,
      and why healthy steady-state benchmarks, wall-clock timestamps alone and a few
      successful failures do not prove the general guarantee. Separate controlled
      local models from measured engine behaviour and give operations the tested
      conditions and thresholds needed for its recovery procedures.
