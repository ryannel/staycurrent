topic: SQL queries and data changes
title: Working with SQL
brief: >-
  Teach a newcomer to read, write and check useful SQL against a small order schema,
  progressing from an explicit result contract to joins, grouped results and bounded
  changes. Use PostgreSQL 18 as one executable reference dialect, with a resettable
  fixture and expected results; label extensions and differences that change the
  answer rather than running parallel product tutorials. Develop judgement about
  row grain, duplicate multiplicity, missing values, ties and the rows a statement
  affects. Introduce substantial query composition and data-change semantics here,
  with two focused descendants supplying their working depth. Keep views, routines,
  triggers and import/export statement effects in this article. Own statement
  meaning and result validation; schema integrity design, transaction protocols,
  client integration, execution diagnosis and operational procedures have separate
  owners. Stop when the reader can produce and challenge a query or change against
  an explicit contract, identify dialect assumptions and choose the relevant depth.
heading:
  - title: Start with a result you can check
    brief: >-
      State the requested row grain, columns, inclusion rules, duplicate policy and
      ordering before writing SQL. Introduce customers, orders, order lines and
      payments with a small labelled fixture containing multiple lines and payments,
      an unmatched customer, a missing value and tied timestamps. Supply minimal
      CREATE TABLE and INSERT setup, reset instructions and a first SELECT with
      its expected result. Use the schema as given; defer its design to the data
      modelling article. Say exactly which PostgreSQL 18 engine executes examples
      and distinguish observed results from hand-worked teaching tables.
    heading:
      - title: One runnable dialect, a family of contracts
        brief: >-
          Establish the portable core and a compact convention for marking extensions.
          Distinguish identifiers, quoted identifiers, string literals, statement
          boundaries and typed values. Introduce consequential dialect differences
          beside the task they change, then collect a compact portability ledger at
          the end; verify named differences against versioned primary documentation
          when writing. Reader-supplied values belong
          in parameters; the application article owns driver syntax and SQL injection
          defence. Do not equate similar syntax with identical semantics.
  - title: Build a result from expressions and rows
    brief: >-
      Read SELECT, FROM and WHERE using a logical explanation of intermediate rows,
      explicitly distinguished from an engine execution sequence. Project named
      columns and aliases, then use one explicitly typed calculation whose integer
      division and precision affect the requested value. Introduce other expressions
      only at the later task that needs them. Explain
      that a query result is unordered unless its outermost query requests order and
      normally retains duplicate rows; use DISTINCT only when the result contract
      requires duplicate elimination.
  - title: Filter when some facts are missing
    brief: >-
      Develop TRUE, FALSE and UNKNOWN with a tiny truth table and row predictions.
      Teach comparisons, AND/OR/NOT precedence, IS NULL, IS NOT NULL and explicit
      null-safe equality in the reference dialect. Explain why WHERE retains only
      TRUE, why NULL is not an empty string or zero, and why COALESCE changes meaning.
      Now use CASE and protected division to choose whether an undefined ratio is
      missing or excluded, showing the resulting rows. Textual AND/OR order is not
      an evaluation guard; put NULLIF or a suitable CASE inside the risky expression.
      Test nullable membership with IN and NOT IN and teach NOT EXISTS once as the
      expression of no matching row. Include pattern and range predicates, the
      inclusive endpoints of BETWEEN and half-open timestamp ranges, with text
      comparison and session time-zone assumptions beside their examples. Hand schema
      choices about whether a fact may be missing to data modelling.
  - title: Join without losing the meaning of a row
    brief: >-
      Build a join from matching row pairs, then predict result counts from key
      cardinality before running it. Teach inner, cross, left and full outer joins,
      aliases and self-joins; explain a right join by swapping sides rather than
      adding another recipe. Use explicit ON conditions and selected columns. Show
      unmatched rows, multiple matches, null join keys and the difference between
      filtering ON and WHERE after an outer join. Make both accidental cross joins
      and legitimate many-to-many multiplication visible.
  - title: Summarise at the intended grain
    brief: >-
      Move from rows to groups using GROUP BY and HAVING, distinguishing row filters
      from group filters. Explain COUNT(*), COUNT(expression), DISTINCT aggregates,
      SUM and AVG, including NULL inputs and empty input. Use explicit grouping of
      selected non-aggregate expressions as the portable starting rule and label
      reference-dialect functional-dependency allowances. Show conditional aggregates
      with CASE and the reference dialect's FILTER, a denominator checked separately,
      and an aggregate whose value depends on explicit input order. Reuse the unsafe
      division example: protect the aggregate's input or filter it, rather than
      guarding the completed aggregate with an outer CASE. Keep detailed evaluation
      exceptions in query composition. Defer specialist grouping sets unless needed
      by the query-composition descendant's worked task.
    heading:
      - title: A plausible total can still be wrong
        brief: >-
          Carry the visible line/payment row-pair multiplication from the join
          example into a SUM and predict its incorrect total. Demonstrate that
          DISTINCT can hide repeated rows while preserving the wrong total. State
          the required one-row-per-order grain before combining amounts; the next
          section constructs that repair with separately aggregated inputs. Reuse
          the earlier existence test when only membership is required. Check unmatched
          and duplicate keys with small counterexamples; physical joins belong to
          execution diagnosis.
  - title: Compose a query around intermediate results
    brief: >-
      Complete the preceding wrong-total example once: name separately aggregated
      line and payment results with CTEs, then join one row per order and check the
      corrected total. Explain each intermediate result's grain before revealing its
      rows, using the same fixture rather than three alternative formulations.
      Contrast combining rows with a set operation, combining columns with a join,
      grouping rows into aggregates and retaining rows with a window function.
      Preview a latest-order-per-customer result with tied timestamps to motivate
      explicit tie policy. Choose a form for clarity of meaning; SQL structure does
      not prescribe materialisation or execution order.
    nested_article:
      topic: Composing and validating substantial SQL queries
      title: Composing SQL queries
      brief: >-
        Build a customer-period report from the parent's order totals: one row per
        customer and period with ordered and paid amounts, latest order, a ranking
        and a previous-period comparison. Choose derived results, CTEs and scalar or
        correlated subqueries by the intermediate grain each stage requires; explain
        scalar cardinality, empty results and correlation scope through alternatives
        at a real report stage. Build window partitioning, ordering, peers and frames
        through rankings, running totals and lag/lead, specifying tie policy and
        distinguishing window order from final result order. Stop the main path when
        readers can assemble and independently check the report's grain, totals and
        tie behaviour against duplicate, absent, NULL and empty fixtures. Reuse the
        parent's membership and ordering lessons without reteaching them. Add small
        explicit overlap/difference tasks for UNION/INTERSECT/EXCEPT and ALL, testing
        duplicate multiplicity and compatible types. Give difficult multi-column
        keyset pagination its own direct task entrance, including nullable keys,
        direction, collation and mutable-data limits, without replaying basic pages.
        Make recursion an optional bounded traversal of a tiny added
        categories(id, parent_id) hierarchy, with termination and cycle handling.
        LATERAL and less-used window variations earn optional depth only where a
        named task needs them. Own a short expression-safety depth note on aggregate
        argument evaluation and CASE's planning-time constant-evaluation limits.
        Separate logical reasoning from engine traces and label dialect-specific
        features; planning, indexing and transaction guarantees have separate owners.
  - title: Ask for a deterministic order and page
    brief: >-
      Teach multi-column ORDER BY, ascending and descending direction, explicit NULL
      placement and a unique tie-breaker. Distinguish ordering the output from
      choosing rows within a subquery or window. Explain LIMIT/OFFSET, the standard
      FETCH form and what WITH TIES requests. Contrast an offset page with a simple
      keyset page using the same total order; show insertions between requests so
      readers do not infer a stable multi-request snapshot. Deeper cursor predicates
      belong to query composition, snapshot protocols to transactions and access
      costs to execution.
  - title: Change exactly the intended rows
    brief: >-
      Introduce explicit-column INSERT, INSERT ... SELECT, UPDATE and DELETE with
      predicates and returned results. State the target-row contract, predict the
      affected set on the fixture and compare the returned row identities and values
      with that prediction. Use a disposable setup for destructive exercises. Show
      defaults, generated identifiers and constraint rejection as observable effects,
      without reteaching integrity design. Contrast changing a value, setting NULL,
      deleting a row and returning no row; a successful statement need not affect
      one row. A preceding SELECT is a reasoning aid rather than concurrency protection.
    nested_article:
      topic: SQL data-change statement semantics
      title: Changing data with SQL
      brief: >-
        Teach precise INSERT, UPDATE, DELETE and reference-dialect MERGE semantics,
        including defaults and generated values, multi-row sources, predicates,
        expressions over old values, affected-row counts and RETURNING. Explain
        constraint failures and distinguish checking during statement execution,
        end-of-statement checks for applicable immediate deferrable constraints and
        deferred checks that may still reject commit. Show a statement returning rows
        while a deferred check remains outstanding; hand control of deferral and
        commit handling to transactions and constraint-property choices to modelling.
        Explain how trigger effects influence returned results without promising a
        transaction outcome. Own the detailed row-level versus statement-level,
        BEFORE versus AFTER, modified-value, added-write, raised-error and zero-row
        trigger cases, showing which values RETURNING includes and which side effects
        it does not enumerate. Begin beyond the parent's known insert/update/delete
        sequence rather than replaying its syntax tutorial. Develop conditional updates and conflict handling
        with PostgreSQL 18 ON CONFLICT, its conflict target, EXCLUDED values, update
        predicate and no-row outcomes; contrast the contract of MERGE rather than
        treating it as a spelling of upsert. Expose duplicate source matches in
        UPDATE ... FROM, DELETE ... USING and MERGE, specify a unique source-to-target
        mapping, and test missing and repeated input keys. Explain data-modifying
        CTE statement semantics only where needed to reason about combined results;
        use explicit contracts rather than assuming textual step order. Contrast
        DELETE and TRUNCATE through their visible scope and effects. Use prediction,
        returned identities and postcondition checks on a resettable fixture. Hand
        multi-statement invariants, concurrent histories and retries to transactions,
        ambiguous client outcomes and idempotency to application engineering, and
        bulk ingestion workflows to that article rather than claiming that one
        SQL statement solves them.
  - title: Follow SQL stored behind a name
    brief: >-
      Explain the observable contracts of views, routines and triggers using a small
      view and a triggered data change. A name can hide SQL that runs when read or
      written; inspect its definition and effects when a result is surprising.
      Keep placement, deployment and operational privilege policy with their owners.
    heading:
      - title: Views expose a query, materialised views retain a result
        brief: >-
          Teach column contracts and dependency on underlying data with ordinary
          views, their reference-dialect write restrictions and check options. Contrast
          an ordinary view with a materialised result and explicit refresh, including
          what freshness the reader can infer. Show that ordering inside a definition
          does not replace the caller's result-order contract. Leave refresh resource
          costs and runbooks to execution and operations.
      - title: Routines and triggers can add reads and writes
        brief: >-
          Distinguish calling a function in a query from invoking a procedure, using
          the reference dialect's rules and explicitly labelling dialect differences.
          Show one triggered change adding a visible effect beyond the written
          statement, then inspect the routine and trigger definitions. Returned rows
          may not enumerate every side effect. Give detailed trigger timing,
          granularity, zero-row and returned-value cases to Changing data with SQL;
          keep this a bounded diagnostic bridge. Provide an inspection checklist for
          visible definitions and effects; do not make procedural trigger code a
          substitute for an analysed concurrency protocol. Application engineering
          owns placement and tests/deployment, operations owns execution privileges.
  - title: Know what import and export actually do
    brief: >-
      Demonstrate PostgreSQL 18 COPY FROM, COPY TO and query export with explicit
      columns, a small round-trip file and expected results. Distinguish server file
      access, STDIN/STDOUT and the psql client's backslash-copy command; state what is
      available in the chosen executable environment. Explain text versus CSV quoting,
      NULL versus empty values, encoding and type parsing, default/generated columns,
      constraint and trigger effects, and the reference command's failure or row-skip
      contract. Export a query with an explicit order when order matters. Keep the
      treatment at statement semantics: staging, checkpoints, restartability and
      reconciliation belong to application engineering; loading costs to execution
      and filesystem privileges to operations. Provide a small semantic example here
      rather than a separate bulk-loading article.
  - title: Prove the answer with cases that could break it
    brief: >-
      Finish with one compact query-and-change exercise on the same schema, with
      expected row identities, multiplicities, NULL values, totals and ordering stated
      before the solution. Reuse edge cases introduced throughout rather than adding
      a new tutorial. Challenge empty input, no match, repeated matches, tied values
      and a rejected change; show how a small counterexample refutes a plausible
      query. Separate equality of unordered multisets from equality of ordered
      results, avoid verifying a query solely with another copy of the same logic,
      and identify where a statement test cannot establish concurrency correctness
      or production performance. Collect the task-local dialect notes in a compact
      end reference for NULL ordering, casts, text comparison/collation, time
      arithmetic, grouping, pagination and data-change extensions. Point to the two descendants by the reader's next
      task rather than adding a syntax catalogue.
