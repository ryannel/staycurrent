topic: Relational application engineering
title: Building applications with a relational database
brief: >-
  Teach how application boundaries turn database guarantees into reliable product
  behaviour. Follow an order reservation from a client request through a driver,
  a bounded transaction and a committed result to confirmation delivery. Give a
  compact working contract for resource use, result interpretation, retries,
  external effects and change delivery, then provide focused routes to working
  depth. Include database-resident behaviour, real-engine tests and bulk data
  movement. Own client and delivery protocols; use SQL and transaction guarantees
  supplied by neighbouring articles without reteaching their semantics or mechanisms.
heading:
  - title: Follow one request beyond the commit
    brief: >-
      Trace an order reservation with an inventory change, durable request identity
      and confirmation work. Separate the caller's observation, the database result
      and the external effect. Establish what a successful API response promises
      and what remains pending; show why a missing response alone cannot establish
      whether a command committed. Use the same example throughout, with links to
      SQL and transaction design when their guarantees become prerequisites.
  - title: Make each database call bounded and explicit
    brief: >-
      Walk through acquiring a connection, binding values, consuming results,
      completing a transaction and returning a connection with a known session
      context for the next borrower. Introduce safe
      parameter binding, exact value mapping, query count and resource budgets,
      and the difference between pool waiting and database execution. Give a small
      caller-side contract before the deeper treatment of drivers and overload.
    nested_article:
      topic: Relational client resource and query contracts
      title: Making bounded database calls
      brief: >-
        Teach drivers, parameterised SQL and application value mapping through a
        real request path. Cover values versus SQL identifiers, dynamic query
        construction, nulls, exact numbers, dates and time zones, generated identity,
        result streaming and cursor lifetimes. Make transaction ownership explicit
        across helpers and asynchronous work. Own session initialisation and
        cleanup after successful use as well as failure, including request or
        tenant context. Compare application connection pooling with external
        session and transaction pooling; check prepared statements, settings,
        temporary objects and session locks against the selected driver and
        pooler configuration. Develop pool sizing and admission
        control from concurrency and connection budgets, including deployment
        multiplication, pool acquisition limits, backpressure and overload rejection.
        Distinguish connection, pool, statement and request timeouts; follow
        cancellation races, uncertain completion, failed transactions and connection
        reset or discard before reuse according to the chosen driver and engine.
        Inspect ORM or generated SQL, bound query count and result size, expose N+1
        and hidden flush or lazy-loading behaviour, and measure caller latency,
        waiting and executed work. Test these contracts with a real engine,
        including connection reuse that cannot leak one request's context into
        the next borrower. Own
        client resource use; link to SQL semantics, concurrency design and engine
        performance diagnosis rather than reproducing them.
  - title: Decide what a caller may repeat
    brief: >-
      Classify a rejected request, an explicit transaction abort and an uncertain
      outcome using a short failure timeline. Establish that retry policy follows
      the whole command's effects and a stable business identity. Give the caller
      a way to look up a pending or completed result instead of treating every
      timeout as a failed operation.
    nested_article:
      topic: Relational application retries and idempotency
      title: Retrying commands without repeating their effects
      brief: >-
        Build an application command protocol for transient failures, explicit
        aborts and lost commit responses. Coordinate bounded retries, deadlines,
        backoff and jitter without multiplying retries across layers. Choose
        retry boundaries using the transaction article's correctness rules; account
        for application state and effects outside the transaction. Develop durable
        idempotency records with request fingerprints, concurrent attempts, result
        recording, expiry and retention, and a status or reconciliation path for
        ambiguous outcomes. Distinguish transport request identity from the
        business invariant that forbids a duplicate operation. Explain the limits
        of idempotency when an external system has no usable deduplication or
        lookup contract. Test duplicate, reordered and interrupted attempts with
        real engine commits and controlled client failures; distinguish injected
        observation loss from an observed network failure. Stop when the reader
        can specify a safe replay policy and recovery path for each command outcome.
  - title: Carry committed intent across system boundaries
    brief: >-
      Continue the reservation into confirmation delivery and an order-status read
      model. Compare a direct call, durable work recorded with the business change
      and a change stream. Identify the crash between two independent effects and
      show how explicit pending state, repeated delivery and reconciliation make
      that boundary manageable. Keep cache and read-model promises visible to callers.
    nested_article:
      topic: Relational coordination with external systems
      title: Delivering work beyond the database
      brief: >-
        Teach durable work records, transactional outbox and consumer inbox or
        deduplication protocols through external notification and read-model
        updates. Follow claim, delivery, acknowledgement, duplicate handling,
        ordering, retry, poison work, backlog and retention through crash histories.
        Separate local atomic recording from delivery guarantees, and explain what
        a consumer must make atomic with its own durable effects. Compare polling
        with change capture as a way to transport committed changes, including
        initial snapshots, resume positions, schema evolution, retention gaps and
        rebuild or reconciliation obligations without teaching replication internals.
        Set cache and read-model contracts for staleness, invalidation or versioned
        refresh, read-after-write expectations and recovery from missed work.
        Handle long-running business workflows with explicit state, compensating
        actions and human reconciliation where a single transaction cannot cover
        the effects; avoid a separate general workflow or messaging survey. Test
        relay and consumer crash points and state the exact limits of any
        exactly-once claim. Own integration protocols; link to relational
        distribution for routing and replicated-read guarantees.
  - title: Change code, schema and existing data together
    brief: >-
      Lay old and new application versions beside old and new schema forms on a
      deployment timeline. Show a compatible expansion, resumable data transition,
      cutover and later removal. Distinguish rolling code back from recovering
      transformed or deleted data, and make the compatibility evidence the release
      condition.
    nested_article:
      topic: Compatible relational application delivery
      title: Evolving schemas without breaking running applications
      brief: >-
        Design a staged schema and data migration while multiple application and
        worker versions remain live. Cover compatibility matrices, expand and
        contract sequencing, feature or traffic gates, long-lived jobs and prepared
        statements, constraints and index rollout, DDL transaction and locking
        differences, and the privileges of a separate migration runner. Develop
        restartable bounded backfills under concurrent writes, including progress
        records, ownership of new writes, validation, convergence and cutover.
        Examine dual-write and dual-read transitions explicitly instead of assuming
        they stay synchronised. Test old and new code against intermediate schemas,
        representative data volumes and interrupted steps; set observable stop
        conditions, release and rollback gates, and a recovery plan for irreversible
        data changes. Coordinate database-resident code and change-stream consumers
        with the same version contract. Own application delivery; link to modelling
        for schema meaning and operations or execution for service procedures and
        engine-specific lock and resource investigation.
  - title: Put behaviour where its contract can be maintained
    brief: >-
      Compare an application function, constraint, view, routine and trigger for a
      small business operation using transaction scope, visibility, invocation,
      privileges and all writer paths. Teach the application consequences of hidden
      trigger effects, routine versioning and deployment order, and the need to
      inspect generated SQL and test the complete write path. Use SQL's observable
      semantics and modelling's integrity choices as prerequisites. Keep this
      placement decision here; give testing and migration obligations to the same
      owner as the behaviour.
  - title: Move many records with a recoverable protocol
    brief: >-
      Distinguish an online command, a schema backfill and an import from another
      authority. Sketch staging, validation, acceptance and source-to-target
      reconciliation for an external order feed. Explain what evidence makes a
      partially completed transfer safe to resume or reject before offering the
      detailed bulk-movement path.
    nested_article:
      topic: Relational ingestion and bulk data movement
      title: Importing and moving data reliably
      brief: >-
        Build a bulk import or export protocol with source identity, a declared
        snapshot or change boundary, staging, type and encoding conversion,
        validation, quarantine and explicit publication into the target. Choose
        transaction and batch boundaries from failure recovery, target invariants,
        throughput and concurrent readers or writers. Cover native bulk facilities
        and driver batching through their operational contracts, without reteaching
        SQL syntax or engine internals. Make chunks restartable using durable
        checkpoints, stable record identity and deduplication; handle corrections,
        deletions and late records under a declared source-of-truth policy. Reconcile
        source and target using counts, keyed checks and business aggregates while
        accounting for concurrent source changes and transformed data. Establish
        acceptance, cutover and rollback criteria and test interruption, invalid
        records and replay. Relate change capture to continued synchronisation when
        needed; link to external coordination for delivery and to execution or
        operations for bulk-load resource and maintenance effects. Own crossing
        the source-target boundary; compatible schema backfills remain with
        application delivery.
  - title: Prove the application contract before release
    brief: >-
      Assemble an executable acceptance matrix for the reservation: normal result,
      explicit abort, lost response, duplicate request, pool exhaustion, cancelled
      work, relay restart, stale read model and mixed-version deployment. Use a
      real engine and the actual driver, migration runner and SQL or ORM layer;
      reserve mocks for dependencies they can faithfully represent. Separate
      deterministic fault injection, concurrency schedules and observed executions.
      Check durable final state and externally visible promises as well as responses,
      with production-relevant engine settings, privileges and diagnostic evidence.
      Point into the focused articles for their tests instead of creating a second
      testing syllabus. End with a request, delivery and release checklist whose
      entries correspond to a demonstrated contract and an accountable owner.
