topic: Composing and validating substantial SQL queries
title: Composing SQL queries
brief: >-
  Build and independently check a customer-period report from the order totals introduced in
  Working with SQL. Choose each intermediate result by its grain, use subqueries and CTEs to
  express the stages, and add latest-order selection, rankings, running totals and previous-period
  comparisons without multiplying facts or confusing ties. Finish the main path with a checked
  report; offer small, separate task entrances for set operations, difficult keyset pagination,
  bounded hierarchy traversal and expression safety. Use PostgreSQL 18 as the executable
  reference dialect, labelling consequential dialect assumptions. Own query meaning and result
  validation; hand physical plans and indexes to execution, concurrent histories to transactions,
  and cursor delivery protocols to application engineering.
heading:
  - title: Define the report before composing the query
    brief: >-
      Reuse the parent's customers, orders, order lines, payments and one-row-per-order totals;
      do not replay joins, membership predicates or basic ordering. Specify one row for every
      selected customer and requested monthly period, including customers with no orders.
      Define a small explicit periods input with half-open boundaries and a stated time zone,
      rather than adding a date-generation tutorial. Ordered amount belongs to the order's
      creation period; paid amount is the payments received in that period for that customer's
      orders, so a payment may occur in a later period than its order. State that report inputs
      are one currency and choose exact numeric amounts. Require ordered and paid amounts,
      latest order identity within the period, revenue rank within the period and a comparison
      with the immediately preceding requested calendar period. Include expected rows on a
      tiny fixture before showing the composed query. State where a missing fact means zero
      and where it means unknown, so COALESCE cannot silently decide the business contract.
  - title: Name intermediate results by what one row means
    brief: >-
      Build order-period and payment-period aggregates independently before attaching them to
      the customer-period spine. Record keys and expected row counts at each boundary; show
      one two-line, two-payment order inflating a tempting raw join. Reuse the parent's aggregation
      knowledge to repair the grain rather than reteaching GROUP BY. Express one intermediate
      result as a derived table and then a named CTE, choosing names and visibility for readability.
      Draw their dependency relation as a logical reasoning aid, explicitly not an engine trace
      or promise of materialisation, textual execution order or improved speed. Keep CTE
      materialisation tuning with execution and data-modifying CTEs with Changing data with SQL.
  - title: Select one latest order without hiding cardinality
    brief: >-
      At the report's latest-order stage compare a scalar correlated subquery returning an order
      identity with a derived ranked relation joined at most once per customer-period. Explain
      the reference dialect's scalar contract: one column and at most one row, no rows gives
      NULL, and several rows cause an error; an aggregate with no GROUP BY still produces one
      row even on empty input. Qualify outer references to make correlation scope visible and
      show a misbound inner column changing the answer. Choose latest by ordered_at descending
      then order_id descending, making an intentional deterministic selection among timestamp
      ties. Derive all latest-order fields from that selected identity rather than separately
      taking MAX of unrelated columns. Defer the ranked implementation until the next section;
      compare equal results on no-order and tied-order fixtures without claiming per-row physical
      execution for correlation.
    heading:
      - title: Optional — return several fields from the selected order
        brief: >-
          Only if a reader needs latest identity, date and amount together, show a compact
          LEFT JOIN LATERAL subquery with the same deterministic order and limit. Explain
          access to the preceding FROM item and retention of a customer-period with no match;
          label reference syntax and compare the result contract with joining the ranked relation.
          Keep this a short alternative at the same report stage rather than a new LATERAL tour.
  - title: Rank and compare rows while keeping the report grain
    brief: >-
      Introduce windows on the aggregated report rows: PARTITION BY defines the comparison
      group, window ORDER BY defines its sequence, and output rows retain their grain. Complete
      the latest-order relation with row_number and an outer filter. Rank customers within each
      period by ordered amount, using rank for shared positions and gaps; briefly contrast
      dense_rank and row_number using the same tie. Keep the tie-defining rank order separate
      from the deterministic final ORDER BY period, rank, customer_id; adding customer_id to
      the rank order would destroy shared ranks. Then use lag per customer ordered by period
      to compare ordered amount with the previous month, preserving the zero-activity periods
      built into the spine. Explain that lag means previous row, not inherently previous calendar
      period, and no prior row produces NULL. Use one lead prediction to check the reverse
      relation. Show that filtering periods before the window changes its input and use an outer
      query when filtering calculated ranks or retaining a display range after comparison.
    heading:
      - title: Make the running-total frame explicit
        brief: >-
          Add a running ordered total per customer over the unique period sequence using
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. Use the existing tied-order rows
          for one compact contrast: PostgreSQL's default ordered aggregate frame includes
          peers, whereas ROWS with a complete deterministic order advances row by row. Separate
          partition, ordering peers and frame membership with labelled rows, and state that rank
          and lag/lead are not changed by this frame in PostgreSQL. Demonstrate last_value's
          current-frame surprise only as a small optional task to get the last value over the
          whole partition; omit an encyclopaedia of frame modes and ranking functions.
  - title: Challenge the finished report independently
    brief: >-
      Present the assembled query and a result table, then stop the main reading path when
      the reader can predict and check its output. Check uniqueness of customer-period keys
      and the expected spine row count; reconcile ordered and paid amounts to independent
      source sums using the same scope and period definitions, not copies of the composed
      query. Assert the chosen latest identity, rank ties, first-period NULL comparison and
      running total. Reset and vary duplicate-looking facts with distinct keys, two payments,
      a later payment, equal timestamps, equal customer totals, no orders, an unpaid order,
      a permitted NULL amount, an empty period and completely empty input. Preserve the
      distinction between an unknown source amount and no matching facts; specify the selected
      policy and check it explicitly. Give a prediction exercise containing one deliberate grain
      error and one tie error, with expected corrections. Identify this as result evidence from
      reference-dialect execution when actually run; dependency sketches alone establish no
      observed execution or performance claim.
  - title: Optional task — reconcile two lists with set operations
    brief: >-
      Reuse two tiny customer-period identifier lists, for example customers who ordered and
      customers who paid, to answer combined coverage, overlap and difference with UNION,
      INTERSECT and EXCEPT. Add repeated identifiers, NULL and an empty side; predict and check
      duplicate elimination versus ALL multiplicity, including INTERSECT ALL's minimum count
      and EXCEPT ALL's non-negative count difference. Require equal column counts and compatible
      corresponding types, demonstrate an explicit cast rather than trusting implicit coercion,
      and distinguish set-operation duplicate treatment of NULL from predicate equality.
      Parenthesise mixed operations and attach final ordering explicitly. Keep this a short
      independent task without reteaching the parent's membership tests.
  - title: Optional task — resume a page with mixed and nullable sort keys
    brief: >-
      Enter directly at a difficult order-list requirement: ordered_at DESC NULLS LAST,
      customer_name ASC under an explicitly named reference collation, then unique order_id ASC.
      Build a strict lexicographic after-cursor predicate branch by branch with the same null
      buckets, directions and collation as ORDER BY; do not imply a row comparison handles
      mixed directions or NULL automatically. Include all ordered values and the tie-breaker
      in the cursor. Predict boundaries across equal values, nullable timestamps and names,
      and forward and reverse traversal, reversing null placement consistently when reversing
      the order. Test page concatenation against the full sorted fixed fixture with no gaps or
      repeated identities. Explain that changed sort keys, insertions and deletions between
      requests can still move rows; a cursor alone promises no stable multi-request snapshot.
      Hand snapshot protocols to transactions, cursor encoding and validation to application
      engineering, and access-path costs to execution. Do not replay OFFSET or basic pages.
  - title: Optional task — walk a bounded category hierarchy
    brief: >-
      Add only a tiny categories(id, parent_id) fixture and ask for descendants of one category
      with depth and path. Explain the anchor, recursive member and working result through
      predicted rows, using an explicit maximum depth as a visible task bound and path-based
      cycle detection. Test a leaf, missing root, self-cycle and longer cycle; define whether
      a detected cycle row is shown and mark a depth-bound truncation rather than presenting
      a truncated result as complete. Show why UNION does not guarantee termination when a
      growing depth or path makes each row different. Label PostgreSQL's supported CYCLE syntax
      as an alternative to an explicit path check; distinguish computed output order from
      traversal execution and require final ORDER BY. Do not use outer LIMIT as a termination
      guarantee or expand this into a graph-query course.
  - title: Optional depth — protect expressions at the level they are evaluated
    brief: >-
      Use one report ratio to show that guarding an aggregate with outer CASE does not protect
      unsafe aggregate arguments: protect the divisor inside the argument with NULLIF or
      exclude unsuitable inputs with an aggregate FILTER, choosing NULL and zero semantics
      explicitly. Explain PostgreSQL's planning-time evaluation of constant expressions such
      as an unreachable constant division by zero, so CASE is not a general barrier. Distinguish
      these limits from ordinary conditional result selection without suggesting a physical
      expression evaluation order; use versioned primary documentation and small expected-error
      cases. Keep this a short safety note, not an optimiser tutorial.
