assignment:
  topic: Application-managed relational sharding
  title: Designing and moving relational shards
  brief: >-
    Teach when application-managed sharding is justified and how to choose shard keys from transactions,
    joins, growth, tenant boundaries and access patterns. Compare range, hash and directory routing,
    co-location and placement across failure domains. Develop hot-key, hot-tenant, uneven-growth
    and global-index cases; account for uniqueness, referential integrity, identifiers, fan-out
    reads, aggregates, pagination and unavailable shards. Explain the explicit options for cross-shard
    invariants: keep related work together, use a supported atomic protocol or redesign the business
    workflow with visible intermediate states. Develop an online split or move, including the
    initial move out of one writer, with a snapshot, concurrent-change capture, catch-up, ownership
    epochs, a cutover barrier, stale-router handling, reconciliation and rollback limits; show
    how to prevent lost or doubled effects and avoid uncontrolled dual writes. Include movement
    throttling, routing metadata availability and correctness checks under interruption. Complete
    the parent's common acceptance worksheet for stale routing and interrupted movement. Own shard
    ownership and movement; link to application delivery for rolling code/schema compatibility
    and to distributed coordination for the mechanics of an atomic cross-shard transaction.
introducing_heading: Split ownership when one writer is the limit
parent:
  topic: Replication and distribution in relational databases
  title: Relational data across servers
  brief: >-
    Teach how independently failing relational servers change the database contract. Begin with
    an order reservation whose writer fails after acknowledging a commit, and whose next read
    reaches another server. Use operation histories to distinguish replication, partitioning and
    distributed coordination, then compare a single writer with replicas, application-managed
    shards and an integrated distributed relational system against an explicit workload and failure
    budget. Explain enough log, quorum, placement and routing mechanics to choose a path and recognise
    a broken promise; the three deeper articles supply implementation and operational depth. Keep
    local transaction semantics with the transactions article and service-wide recovery procedures
    and backup policy with operations. Teach required distributed-systems reasoning here without
    depending on a separate programme.
neighbours:
  - topic: Single-writer relational replication and failover
    title: Replication, replica reads and failover
    brief: >-
      Develop single-writer replication from commit logging through transport, persistence, replay,
      bootstrapping and catch-up. Compare physical and logical replication through their consequences
      for schema, replica contents, upgrades, identity, ordering and retention. Derive precisely
      what each acknowledgement mode and failure-domain placement promises about acknowledged-write
      survival and read visibility. Design replica routing for lag, causal/session position waits,
      fallback and overload; distinguish time-based lag estimates from replay progress and application
      freshness. Analyse promotion histories with client reconnection, divergent timelines, stale
      candidates, fencing and reintegration of the old writer; distinguish leader selection from
      safe exclusion and failover from backup restoration. Explain logical-feed duplicate delivery;
      keep multi-writer material to a short boundary warning about conflict handling and globally
      enforced constraints, linking to the coordinated and conflict-resolving comparison in distributed
      SQL. Use verified named relational implementations only where their actual contracts change
      the decision. End with failure-injection histories and evidence for loss, stale reads, recovery
      time and a sole writable authority, completing the parent's common acceptance worksheet
      for replica lag and promotion. Operations owns the complete service runbook and application
      engineering owns ambiguous outcomes and external effects.
  - topic: Integrated distributed relational systems
    title: Coordinating distributed SQL
    brief: >-
      Build the machinery needed to assess an integrated distributed relational system: replicated
      ranges or tablets, placement and rebalancing, routing, leaders or leases, quorum intersection,
      terms or epochs, log commitment and recovery after partitions. Explain the selected implementation's
      safe voting membership changes: replica catch-up, safety across old and new configurations,
      and the failure-domain availability retained during a transition; require an interrupted
      membership-change history. Distinguish quorum replication and consensus from atomic commit,
      then follow a cross-range transaction through participant preparation, durable decision,
      coordinator failure and recovery. Connect distributed snapshots, timestamps, clock assumptions
      and uncertainty handling to documented isolation and real-time ordering guarantees without
      implying one universal protocol. Trace distributed joins, aggregation, secondary-index maintenance,
      constraint checks and transaction retries through network work, contention and failure.
      Derive latency and availability consequences from concrete regional placements, including
      loss of a region, minority operation, stale-read options, hotspots and rebalancing load.
      Compare a small number of verified relational implementations at the mechanism and contract
      level; cover synchronously coordinated writes alongside asynchronous or conflict-resolving
      multi-writer alternatives and the invariants they can preserve. Complete the parent's common
      acceptance worksheet for quorum loss, interrupted membership changes and commit recovery.
      Require executable tests of the claimed guarantees and distinguish illustrative histories
      from observations of a real engine. Local isolation theory belongs to transactions; full
      operating runbooks belong to operations.
collection_branches:
  - topic: Relational data modelling and integrity
    title: Designing relational data
    brief: >-
      Turn business facts and invariants into relational schemas that remain understandable as
      requirements change. Develop an order-reservation design from statements of fact through
      keys, relationships, dependencies, types and constraints, then challenge it with changes,
      missing values, history and competing writers. The reader should be able to explain what
      each row means, what identifies it, which invalid states the database rejects, which rules
      require a transaction protocol, and what a deliberate duplication costs. Own schema meaning
      and integrity design; SQL owns statement semantics, transactions owns concurrency protocols,
      application engineering owns delivery of schema and data migrations, and execution owns
      physical tuning.
  - topic: SQL queries and data changes
    title: Working with SQL
    brief: >-
      Teach a newcomer to read, write and check useful SQL against a small order schema, progressing
      from an explicit result contract to joins, grouped results and bounded changes. Use PostgreSQL
      18 as one executable reference dialect, with a resettable fixture and expected results;
      label extensions and differences that change the answer rather than running parallel product
      tutorials. Develop judgement about row grain, duplicate multiplicity, missing values, ties
      and the rows a statement affects. Introduce substantial query composition and data-change
      semantics here, with two focused descendants supplying their working depth. Keep views,
      routines, triggers and import/export statement effects in this article. Own statement meaning
      and result validation; schema integrity design, transaction protocols, client integration,
      execution diagnosis and operational procedures have separate owners. Stop when the reader
      can produce and challenge a query or change against an explicit contract, identify dialect
      assumptions and choose the relevant depth.
  - topic: Relational transactions and concurrency
    title: Reasoning about transactions
    brief: >-
      Teach how to turn an application invariant into a transaction protocol whose permitted outcomes
      can be explained and tested. Use a stock reservation as the running example, using PostgreSQL
      18 as the reference engine and SQL dialect, then expose the limits of single-row reasoning
      with a rule spanning several rows. Connect atomicity, isolation and durability to outcomes;
      explain snapshots, locks, multiversion concurrency, anomalies, serialisability, conditional
      changes, uniqueness, deadlocks and retries. Compare named engine contracts where they change
      the protocol, rather than treating isolation labels as interchangeable. The reader should
      leave able to analyse a two-session history, choose and justify a protection mechanism,
      recognise abort and retry boundaries, and design a deterministic concurrency test. The child
      develops complete multi-row protocols. Application engineering owns connection lifetimes,
      ambiguous client outcomes, idempotency across requests and external effects; execution owns
      physical recovery and performance investigation; distribution owns cross-server consistency
      and transaction coordination.
  - topic: Relational execution, storage and performance
    title: Understanding and improving database work
    brief: >-
      Build a practical model of the work a relational engine performs, then use it to improve
      transactional, analytical and mixed workloads. Follow an order lookup, reservation update
      and sales report through storage, access paths, planning, execution and commit. Give newcomers
      a first useful diagnosis before directing them to deeper mechanisms and investigation. Distinguish
      doing less work from waiting less and adding resources; require evidence that an improvement
      survives representative concurrency and preserves correctness. Own engine mechanisms and
      performance investigation. Refer transaction correctness, application protocols, service
      objectives and recovery procedures, and multi-server coordination to their neighbouring
      articles.
  - topic: Relational application engineering
    title: Building applications with a relational database
    brief: >-
      Teach how application boundaries turn database guarantees into reliable product behaviour.
      Follow an order reservation from a client request through a driver, a bounded transaction
      and a committed result to confirmation delivery. Give a compact working contract for resource
      use, result interpretation, retries, external effects and change delivery, then provide
      focused routes to working depth. Include database-resident behaviour, real-engine tests
      and bulk data movement. Own client and delivery protocols; use SQL and transaction guarantees
      supplied by neighbouring articles without reteaching their semantics or mechanisms.
  - topic: Relational service operations, security and recovery
    title: Operating and recovering a relational service
    brief: >-
      Turn workload, trust and recovery requirements into a service that can be established, observed,
      changed and recovered deliberately. Follow the same order-reservation service through provisioning,
      a busy trading period, routine maintenance and an incident. Update one compact service record
      throughout: illustrative objective values and accepted reservation markers lead to tested
      settings, before/after observations and a failed acceptance result that forces a policy
      revision. Label illustrative inputs, modelled outcomes and observed execution distinctly.
      Teach operational decisions and executable runbooks, using a pinned PostgreSQL release for
      concrete examples and identifying managed-service substitutions. Engine diagnosis belongs
      to execution and replication, fencing and routing guarantees belong to distribution; use
      those mechanisms as preconditions rather than teaching them again. A reader should finish
      with an owned service specification, actionable alerts, a rehearsed change procedure and
      evidence that a chosen recovery path meets its objectives.
  - topic: Replication and distribution in relational databases
    title: Relational data across servers
    brief: >-
      Teach how independently failing relational servers change the database contract. Begin with
      an order reservation whose writer fails after acknowledging a commit, and whose next read
      reaches another server. Use operation histories to distinguish replication, partitioning
      and distributed coordination, then compare a single writer with replicas, application-managed
      shards and an integrated distributed relational system against an explicit workload and
      failure budget. Explain enough log, quorum, placement and routing mechanics to choose a
      path and recognise a broken promise; the three deeper articles supply implementation and
      operational depth. Keep local transaction semantics with the transactions article and service-wide
      recovery procedures and backup policy with operations. Teach required distributed-systems
      reasoning here without depending on a separate programme.
