assignment:
  topic: Transaction protocols for multi-row invariants
  title: Protecting rules across several rows
  brief: >-
    Teach how to design and prove transaction protocols for rules involving a changing set of
    rows. Require the parent's isolation model and complete fixed-set serialisable repair as prerequisites;
    recap or link that baseline rather than reteaching it. Reuse the two-depot reserve invariant,
    extending it to concurrent insertion and deletion of depots. Develop stable guard-row locking
    and a remodelled constraint or conditional aggregate counter, and revisit serialisable reasoning
    where the changing set alters the proof. Include missing rows, concurrent insertion and deletion,
    lock order, snapshot timing, every participating write path, and repair after abort. Explain
    why locking only the matching rows or using an advisory lock without universal participation
    is insufficient. Compare safety, concurrency and maintenance costs, and supply deterministic
    two-session counterexamples and passing histories for the new protocols, using PostgreSQL
    as reference and named engine contrasts only where their contracts change the proof. Own these
    complete database protocols; use the parent's isolation model rather than reteaching it, and
    leave request idempotency and external side effects to application engineering.
introducing_heading: Protect a rule that spans several rows
parent:
  topic: Relational transactions and concurrency
  title: Reasoning about transactions
  brief: >-
    Teach how to turn an application invariant into a transaction protocol whose permitted outcomes
    can be explained and tested. Use a stock reservation as the running example, using PostgreSQL
    18 as the reference engine and SQL dialect, then expose the limits of single-row reasoning
    with a rule spanning several rows. Connect atomicity, isolation and durability to outcomes;
    explain snapshots, locks, multiversion concurrency, anomalies, serialisability, conditional
    changes, uniqueness, deadlocks and retries. Compare named engine contracts where they change
    the protocol, rather than treating isolation labels as interchangeable. The reader should
    leave able to analyse a two-session history, choose and justify a protection mechanism, recognise
    abort and retry boundaries, and design a deterministic concurrency test. The child develops
    complete multi-row protocols. Application engineering owns connection lifetimes, ambiguous
    client outcomes, idempotency across requests and external effects; execution owns physical
    recovery and performance investigation; distribution owns cross-server consistency and transaction
    coordination.
