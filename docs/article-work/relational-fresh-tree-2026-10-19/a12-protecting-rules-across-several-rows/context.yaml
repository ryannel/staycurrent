collection_branches:
  - topic: Relational data modelling and integrity
    title: Designing relational data
    brief: >-
      Turn business facts and invariants into relational schemas that remain understandable as
      requirements change. Develop an order-reservation design from statements of fact through
      keys, relationships, dependencies, types and constraints, then challenge it with changes,
      missing values, history and competing writers. The reader should be able to explain what
      each row means, what identifies it, which invalid states the database rejects, which rules
      require a transaction protocol, and what a deliberate duplication costs. Own schema meaning
      and integrity design; SQL owns statement semantics, transactions owns concurrency protocols,
      application engineering owns delivery of schema and data migrations, and execution owns
      physical tuning.
  - topic: SQL queries and data changes
    title: Working with SQL
    brief: >-
      Teach a newcomer to read, write and check useful SQL against a small order schema, progressing
      from an explicit result contract to joins, grouped results and bounded changes. Use PostgreSQL
      18 as one executable reference dialect, with a resettable fixture and expected results;
      label extensions and differences that change the answer rather than running parallel product
      tutorials. Develop judgement about row grain, duplicate multiplicity, missing values, ties
      and the rows a statement affects. Introduce substantial query composition and data-change
      semantics here, with two focused descendants supplying their working depth. Keep views,
      routines, triggers and import/export statement effects in this article. Own statement meaning
      and result validation; schema integrity design, transaction protocols, client integration,
      execution diagnosis and operational procedures have separate owners. Stop when the reader
      can produce and challenge a query or change against an explicit contract, identify dialect
      assumptions and choose the relevant depth.
  - topic: Relational transactions and concurrency
    title: Reasoning about transactions
    brief: >-
      Teach how to turn an application invariant into a transaction protocol whose permitted outcomes
      can be explained and tested. Use a stock reservation as the running example, using PostgreSQL
      18 as the reference engine and SQL dialect, then expose the limits of single-row reasoning
      with a rule spanning several rows. Connect atomicity, isolation and durability to outcomes;
      explain snapshots, locks, multiversion concurrency, anomalies, serialisability, conditional
      changes, uniqueness, deadlocks and retries. Compare named engine contracts where they change
      the protocol, rather than treating isolation labels as interchangeable. The reader should
      leave able to analyse a two-session history, choose and justify a protection mechanism,
      recognise abort and retry boundaries, and design a deterministic concurrency test. The child
      develops complete multi-row protocols. Application engineering owns connection lifetimes,
      ambiguous client outcomes, idempotency across requests and external effects; execution owns
      physical recovery and performance investigation; distribution owns cross-server consistency
      and transaction coordination.
  - topic: Relational execution, storage and performance
    title: Understanding and improving database work
    brief: >-
      Build the mechanism-level understanding needed to diagnose and improve relational workloads.
      Connect physical storage, rows and versions, buffers and caches, logging and crash recovery,
      indexes and access methods, query planning and cardinality estimates, joins and sorting,
      row and column layouts, scan-oriented and parallel execution, memory and temporary work,
      and write amplification and maintenance. Teach plan reading, statistics, measurement, benchmarking
      and a repeatable diagnosis process for transactional, analytical and mixed workloads, including
      slow queries, lock waits, resource saturation and workload regressions. Cover partitioning
      as a local organisation and maintenance choice, workload-aware capacity and cost, bulk-loading
      resource and maintenance effects, and limits beyond which query tuning cannot solve the
      problem. Compare implementation mechanisms only where they change judgement. Own engine
      mechanisms and performance investigation; operations owns service objectives and recovery
      procedures, while distribution owns work across independently failing servers.
  - topic: Relational application engineering
    title: Building applications with a relational database
    brief: >-
      Teach how application boundaries turn database guarantees into reliable product behaviour.
      Cover drivers, parameterised SQL, type and value mapping, connection and transaction lifetimes,
      pools, timeouts, cancellation, backpressure, query budgets and ORM/generated-query inspection.
      Develop practical handling of retries, idempotency and ambiguous outcomes, and coordination
      with external systems through durable work records, outbox/inbox patterns and change capture
      where appropriate. Teach compatible schema and data migrations, backfills, deployment and
      rollback constraints, testing with a real engine, database-resident behaviour placement
      and its testing/deployment consequences, and ingestion and bulk data movement through staging,
      validation, restartability and source/target reconciliation. Teach integration boundaries
      for caches and read models. Own client and delivery protocols; avoid reteaching SQL, transaction
      isolation or the internals of neighbouring system families.
  - topic: Relational service operations, security and recovery
    title: Operating and recovering a relational service
    brief: >-
      Teach how to establish, secure, observe and sustain a relational service against explicit
      workload and recovery objectives. Cover installation and managed-service responsibilities,
      configuration and resource limits, workload and capacity observation, roles and least privilege,
      authentication, encryption and secrets, tenant isolation and audit requirements, including
      privileges exercised by database-resident code, backups and point-in-time recovery, retention
      and restore validation, incidents and evidence preservation, upgrades and routine maintenance.
      Build executable recovery and change procedures with verified preconditions, recovery targets
      and failure cases; distinguish crash recovery, replica failover, backup restoration and
      disaster recovery. Include human mistakes, corruption, exhausting resources and loss of
      a failure domain. Own operational decisions and runbooks; execution owns diagnostic mechanisms
      and distribution owns replication and routing guarantees.
  - topic: Replication and distribution in relational databases
    title: Relational data across servers
    brief: >-
      Teach the relational mechanisms and trade-offs needed to choose and operate replication,
      failover, sharding and distributed SQL. Develop log replication and application-visible
      consistency, read routing and lag, failover and fencing, quorum and consensus where required,
      partitioning and placement, shard keys and movement, distributed query/transaction coordination,
      contention and cross-region latency. Analyse failure and recovery histories rather than
      relying on topology diagrams or product labels. Compare single-writer replication, application-managed
      sharding and integrated distributed relational systems; include migrations between them
      and tests of promised guarantees. Own multi-server mechanisms and application consequences;
      operations owns service-wide runbooks and backup policy. Teach the necessary distributed-systems
      reasoning in context without expanding the parked shared programme.
