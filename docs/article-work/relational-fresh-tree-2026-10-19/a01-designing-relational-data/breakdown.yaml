topic: Relational data modelling and integrity
title: Designing relational data
brief: >-
  Turn business facts and invariants into relational schemas that remain understandable
  as requirements change. Develop an order-reservation design from statements of fact
  through keys, relationships, dependencies, types and constraints, then challenge it
  with changes, missing values, history and competing writers. The reader should be
  able to explain what each row means, what identifies it, which invalid states the
  database rejects, which rules require a transaction protocol, and what a deliberate
  duplication costs. Own schema meaning and integrity design; SQL owns statement
  semantics, transactions owns concurrency protocols, application engineering owns
  delivery of schema and data migrations, and execution owns physical tuning.
heading:
  - title: Write down facts and forbidden states first
    brief: >-
      Begin with a small order-reservation scenario and ambiguous requirements rather
      than a table diagram. Separate a product's current price, an agreed order-line
      price, a reservation and a completed sale. Write representative facts, queries,
      lifecycle transitions and counterexamples. Translate terms such as unique,
      required, current and owned into explicit scope and time boundaries.
    heading:
      - title: Give every relation a sentence
        brief: >-
          State exactly what one row asserts and at what grain; distinguish an entity,
          an association and an event. Draw a compact candidate schema with example
          rows, including two order lines for the same product, and use competing
          interpretations to expose unspecified requirements.
      - title: Keep an invariant ledger
        brief: >-
          Record each rule with an example valid state, a forbidden state and an
          expected enforcement owner. Start with line identity, positive quantities,
          tenant-scoped references and reservation totals; revise the ledger as the
          design develops. Separate stored truth from convenient answers and measures
          derived from that truth.
  - title: Choose identity and model relationships
    brief: >-
      Derive candidate keys from facts and business rules. Choose a primary key while
      preserving other required uniqueness. Explain the consequences of natural,
      surrogate and composite keys, including stability, scope, generated identifiers
      and equality; an identifier alone does not prevent duplicate business facts.
    heading:
      - title: Make uniqueness match the business scope
        brief: >-
          Work through order-line identity, reusable external identifiers, case and
          collation-sensitive names, and tenant-local identifiers. Show how composite
          uniqueness and references preserve scope, including a cross-tenant reference
          that individually valid identifiers would otherwise allow. Separate identity
          from display order and from any promise of gap-free numbering.
      - title: Represent cardinality and participation
        brief: >-
          Map one-to-many, many-to-many and optional one-to-one relationships to keys,
          references and association relations. Distinguish at most one from exactly
          one and an optional reference from a required reverse relationship. Give
          relationship attributes a home; examine repeated columns, lists of identifiers,
          polymorphic references and subtype alternatives through the rules they obscure.
  - title: Let dependencies explain where facts belong
    brief: >-
      Use a deliberately repetitive order sheet to reveal update, insertion and
      deletion anomalies. Derive functional dependencies from business meaning rather
      than accidental sample uniqueness. Decompose product, order and line facts while
      keeping the agreed sale price with the line; show why this is a different fact
      from the product's current price.
    heading:
      - title: Check that decomposition preserves meaning
        brief: >-
          Introduce candidate keys, partial and transitive dependencies and useful
          normal forms through this worked design. Reconstruct the original facts with
          a join, expose a lossy split that invents combinations, and distinguish
          lossless reconstruction from preservation of enforceable dependencies.
        nested_article:
          topic: Dependencies and relational decomposition
          title: Normalising relational schemas
          brief: >-
            Teach dependency-led schema decomposition from explicit business facts:
            candidate-key derivation, functional dependencies, first normal form and
            atomicity relative to a domain, second and third normal forms, BCNF,
            lossless joins and dependency preservation. Use counterexamples and a
            worked decomposition, including the trade-off between BCNF and preserving
            a dependency and an independent multivalued fact that motivates fourth
            normal form. Keep each normal form tied to a practical counterexample;
            do not turn normalisation into a ritual or infer rules from sample data.
            Own decomposition reasoning; the parent owns the complete schema design
            and deliberate duplication, while SQL owns query mechanics.
      - title: Separate a flexible attribute from a hidden schema
        brief: >-
          Compare dedicated columns, lookup relations and document-valued attributes
          for stable core facts and variable extensions. Evaluate type checks,
          references, uniqueness, querying and evolution costs; use a concrete new
          attribute requirement to show when an entity-attribute-value design or a
          document hides invariants the application must now maintain.
  - title: Give values precise domains
    brief: >-
      Choose representations from meaning, range, precision and comparison rules.
      Connect schema and application values without cataloguing every engine type.
      Make rounding, units, textual equality and absence explicit requirements rather
      than incidental defaults.
    heading:
      - title: Store quantities with units and precision
        brief: >-
          Model counts, measured quantities and money with currency, range and rounding
          policy. Compare exact and approximate numeric representations using an order
          total; distinguish a percentage from its chosen scale and a currency amount
          from a unitless number. Explain domain checks and the limits of type names as
          business validation.
      - title: Distinguish missing, unknown and inapplicable
        brief: >-
          Use an unassigned shipment, an unknown value and an intentionally absent
          attribute to decide between null, an explicit state and a separate relation.
          Explain the design consequences of three-valued predicates, nullable
          uniqueness and composite references; require engine-specific verification
          rather than assuming null behaves identically in every constraint. SQL owns
          the full expression and join semantics.
      - title: Distinguish instants, local times and durations
        brief: >-
          Separate an audit instant, a local delivery appointment and a duration. Specify
          time zone context, precision and interval boundaries, including daylight-saving
          ambiguity and expiry at an exact boundary. Explain which original context must
          be retained rather than assuming a stored timestamp encodes the user's zone
          or historical interpretation.
  - title: Turn the invariant ledger into enforcement
    brief: >-
      Annotate the evolving schema with not-null, check, unique and foreign-key
      constraints and show a rejected counterexample for each. Explain immediate and
      deferred checking as choices in allowed transitions, and distinguish accepting
      individual rows from protecting a rule across rows, relations and concurrent
      transactions. Verify capabilities against named engine versions when they change
      the design.
    heading:
      - title: Put ordinary guards in the schema
        brief: >-
          Classify row-local validity, key uniqueness and referential validity, then
          use the ledger to select each ordinary guard once. Work a conditional
          uniqueness rule through a structural reformulation and, where supported,
          a conditional index; identify the capability and equality assumptions that
          change the choice. Keep temporal interval enforcement with the history child.
      - title: Recognise rules that need more than a row check
        brief: >-
          Work one deferred-checking transition and contrast it with an aggregate
          reservation limit and a lifecycle transition rule. Explain the reach and
          gaps of generated values, routines and triggers, including what a procedure
          can reject without establishing a guarantee across concurrent writers. Trace
          two competing reservations that both pass a naive check, specify the required
          invariant and hand protocol construction to the transactions article.
      - title: Make rejection useful to every writer
        brief: >-
          Give constraints stable names and map failures to domain outcomes. Include
          imports, administrative changes and application writes in the enforcement
          boundary, and distinguish friendly pre-validation from the final guard.
          Explain that declaring a constraint and establishing that existing data
          satisfies it are separate concerns; link migration execution to application
          engineering and access policy to operations.
  - title: Model ownership, history and lifecycle deliberately
    brief: >-
      Extend the example with changed customer details, cancelled reservations,
      deleted products and corrected order facts. Decide whether the application
      needs current state, an immutable snapshot, a sequence of events or time-bounded
      facts, and state who owns each relation and its lifecycle.
    heading:
      - title: Decide what survives a change or deletion
        brief: >-
          Compare a live customer address reference with the address agreed for an
          order, and restrict, cascade, nullification and explicit lifecycle transitions
          for related rows. Treat ownership, shared references, soft deletion, identifier
          reuse and retention as separate decisions. Surface the conflict between an
          audit trail and erasure requirements as a requirement to resolve, without
          offering legal advice or equating a delete flag with deletion.
      - title: Preserve the past the question actually needs
        brief: >-
          Contrast current-state updates, order snapshots, append-only change records
          and valid-time intervals with a backdated price correction. State whether a
          question asks what was true then or what the system believed then. Show why
          a changed-at column or audit log alone may not answer either question
          completely, and introduce the deeper temporal design only when both axes
          or interval invariants are needed.
        nested_article:
          topic: Relational history and temporal modelling
          title: Modelling history and time
          brief: >-
            Design relational history from questions about past facts and corrections.
            Compare current rows plus audit records, immutable transaction snapshots,
            versioned entities, valid-time intervals and recorded-time history; develop
            a worked backdated correction into a two-time-axis example when the
            requirements demand it. Specify stable identity, interval boundaries,
            overlaps, gaps, open-ended periods, historical references, provenance,
            deletion and correction policy. Work an interval/overlap enforcement
            example, distinguishing structural or declarative protection from a rule
            requiring the transactions owner's concurrent update protocol. Explain
            what temporal features in named systems do and do not supply, and how to
            validate representative as-of answers. Own historical meaning,
            representation and temporal constraint choices; the parent owns ordinary
            rule placement and operations owns retention and recovery execution.
  - title: Use access patterns without losing the source of truth
    brief: >-
      Test the logical design against the required reads and writes before changing
      it for convenience. Compare joining normalised facts, storing an order total,
      maintaining a summary and producing a separate read model. Distinguish an agreed
      historical snapshot from a duplicate of the same current fact.
    heading:
      - title: Make duplication a maintenance contract
        brief: >-
          For each derived value, name its authoritative inputs, update owner, atomicity
          or permitted staleness, rebuild method and reconciliation check. Challenge a
          stored order total after line edits, cancellations and failed updates. Decide
          when measured need justifies duplication; hand cache and read-model delivery
          to application engineering and query and index diagnosis to execution.
      - title: Separate logical identity from physical organisation
        brief: >-
          Explain that an index, partition key or storage layout can affect cost and
          available enforcement without defining the business identity. Include a
          workload-driven key choice whose consequences must be measured, and flag
          partition or shard scope when it limits enforceable uniqueness or references;
          hand the mechanisms to execution and distribution.
  - title: Test the design against a new requirement
    brief: >-
      Present the complete annotated schema and cumulative invariant ledger as the
      review artefact: row-meaning sentences, candidate and primary keys, relationship
      cardinalities, domains and units, enforcement owners, history and deletion policy,
      and duplication contracts. Use its existing counterexamples as evidence rather
      than repeating their walkthroughs. Now require split fulfilment and cancellation
      after partial shipment: ask the reader to revise row meanings, identity,
      lifecycle, quantity rules and enforcement ownership, then explain a defensible
      design and its trade-offs. Finish when the reader can defend the revised schema
      with examples and counterexamples and identify the assumptions that must change
      before application engineering delivers a migration.
