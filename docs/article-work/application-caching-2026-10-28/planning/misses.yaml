topic: Cache misses, refresh and source protection
title: Handling cache misses
brief: >-
  Keep useful requests within the source's capacity when a popular answer expires
  or the cache becomes cold or unavailable. Follow P7's callers through shared
  fills, bounded waiting and refresh, then widen the view to many keys competing
  for the same source. Choose which work to admit and what the other callers
  receive. Redis is one implementation; a cache outage must not remove the
  source's protection.
heading:
  - title: One expiry can start many reads
    brief: >-
      Begin with P7 cached and several callers arriving just after its entry
      expires. Follow each miss until the first fill completes, counting source
      reads and callers still waiting. Define a cache stampede through that burst.
      Slow the source read while keeping arrivals fixed to expose more overlapping
      work. Contrast the short burst with a flattering daily hit ratio. Keep the
      timings and capacity in this drawing explicitly illustrative.
  - title: Share the work for one key
    brief: >-
      Give App A one in-flight fill per complete cache key. The first caller starts
      it; later callers share its result or error. Recheck the cache after gaining
      fill ownership, and remove the in-flight entry when the work ends. Show the
      source-read count falling while the waiting callers remain visible.
    heading:
      - title: Bound the wait as well as the work
        brief: >-
          Give callers a deadline and the shared loader its own bounded lifetime.
          One caller leaving need not cancel work that others still need. Limit
          waiter count and memory, propagate failure, and avoid releasing a source
          slot while timed-out work is still running. Distinguish requesting
          cancellation from knowing the source stopped. A waiter whose budget
          ends receives a permitted stale result or an explicit failure; it does
          not automatically start another source read.
      - title: Across application instances
        brief: >-
          Add App B: a per-process map can now permit one fill in each process.
          Decide whether this bounded duplication is acceptable before adding
          shared refresh ownership. For a lease, draw a slow owner surviving its
          lease and a replacement owner starting. An owner token checked atomically
          at publication and release can protect those cache operations on the
          selected store; it does not cancel old source work or make the source
          and cache one transaction. Preserve the freshness article's validity
          rules and source-wide admission even when lease service is unavailable.
  - title: Refresh while an answer is still usable
    brief: >-
      Put an early refresh point and the last allowed serving time on one timeline.
      One caller starts a refresh while others reuse the still-permitted answer.
      If refreshing fails, the last allowed time still holds. Compare a hot key
      with an unused one to show what eager refreshing can waste. Spread refresh
      or expiry times across keys with jitter, without extending the agreed age
      allowance. Show why staggered deadlines do not solve a burst on one key
      or the simultaneous loss of the whole cache.
  - title: Limit source work across all keys
    brief: >-
      Replace the repeated P7 calls with misses for different products: per-key
      coalescing now has little to combine. Draw finite source execution slots,
      a bounded waiting area and an explicit rejection path. Separate a limit on
      concurrent work from a limit on starts per second; neither an unbounded
      queue nor a connection pool alone establishes a useful response deadline.
      Choose limits from measured source capacity with room for checkout and
      other uncached work. Count refreshes, warming and retries in the same
      budget. Show how per-instance limits add across the fleet, so scaling App A
      into more instances cannot silently multiply the intended source allowance.
  - title: When the cache is unavailable
    brief: >-
      Make the cache call slow or fail, then follow the remaining request budget.
      Distinguish a cache error from a missing key. Bounded cache waits and pending
      calls protect the application; bounded source admission protects the
      dependency. Returning the source answer is useful only when that work can
      be admitted. Where it cannot, use a still-permitted local copy, an explicitly
      reduced result or a timely failure. Show how automatic retries can consume
      the same scarce capacity again; any retries fit the overall deadline and
      budget. Briefly explain controlled bypass and recovery probes if used,
      without turning the section into a general circuit-breaker course.
  - title: Return from a cold cache
    brief: >-
      Bring the cache back empty while requests continue. Compare demand-driven
      fills with a bounded warm-up of useful keys, both using the existing source
      allowance. A whole-dataset prefill can compete with users and evict useful
      entries; it is not automatically a recovery step. Reintroduce traffic or
      application instances gradually and stop the ramp when source latency or
      admitted work shows the limit has been reached. Finish by exercising the
      complete design with a slow fill, a failed refresher, many distinct misses
      and cache loss. Count useful replies, rejected requests and actual source
      work separately. Operating a cache owns the production rollout procedure.

context:
  parent_boundary: >-
    The introduction establishes a miss, the first popular-key burst and why an
    empty cache creates source work. This article develops the mechanisms and
    budgets that make those situations manageable.
  neighbouring_boundaries:
    - Cache keys owns which requests may share an answer; use its full identity for coalescing too.
    - Freshness owns acceptable age, invalidation races and version rules; refresh does not redefine them.
    - Cache memory owns admission of entries and eviction; source-work admission here is a different decision.
    - Redis integration owns runnable client code, concrete timeout configuration and command verification.
    - Operations owns incident diagnosis, deployment and production recovery procedures using these mechanisms.
  split_decision: >-
    Keep these sections together: reducing duplicate fills and bounding total
    source work are both needed to judge the same failure path. The short lease
    example establishes its operational limit; a general locking or consensus
    treatment would expand the commission. No nested article is required.
  shared_facts: >-
    Use shop north's public P7 card, GBP 20.00 and revision 1, with the established
    complete key. Checkout remains authoritative. App B is the second instance.
    Extra workload timings, source slots and arrival sequences are invented and
    labelled. A 30-second insertion TTL does not establish a source-age promise.
  figure_needs: >-
    Carry the same callers through uncoalesced and shared-fill traces. Keep the
    loader and waiters separately visible when one caller times out. A second
    trace shows a lease expiring before its old owner finishes. A timeline shows
    refresh and the last allowed serve, while a queue/slot view shows many keys
    exhausting a shared source budget. Readers should see where work disappears,
    where it still runs and which caller gets which outcome.
  modelling_boundary: >-
    Constant service times can make a small queue illustration inspectable; they
    do not predict production throughput or latency percentiles. If using an
    arrival-rate times fill-duration estimate, name its steady-rate assumptions
    and do not call it a hard bound. A timeout alone is never modelled as proof
    that the underlying operation has stopped.
  preparation: >-
    Read all 19 bounded reference parts separately with every END marker:
    sequences 1–6, indexes 1–7, storage 1–6. Inspected rendered sequences figure 3,
    indexes figure 1 and storage figure 2. Their visible waits, work counters and
    reused state guide this plan. Continuity checked against the canonical example
    and the parent/child ownership boundaries.
  primary_sources:
    - title: Caching challenges and strategies
      url: https://aws.amazon.com/builders-library/caching-challenges-and-strategies/
      checked: 2026-10-28
      relevance: Cache loss, cold starts and bounded dependency traffic; test with caching disabled.
    - title: Using load shedding to avoid overload
      url: https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/
      checked: 2026-10-28
      relevance: Useful completed requests, finite capacity, timely rejection and overload testing.
    - title: Timeouts, retries, and backoff with jitter
      url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
      checked: 2026-10-28
      relevance: Waiting consumes resources; retries add work; correlated timers create bursts.
    - title: Go singleflight package
      url: https://pkg.go.dev/golang.org/x/sync/singleflight
      checked: 2026-10-28
      relevance: A concrete per-Group mechanism suppresses overlapping calls for one key and shares their result.
    - title: Memcached meta protocol
      url: https://docs.memcached.org/protocols/meta/
      checked: 2026-10-28
      relevance: Refresh ownership, early recache and stale serving exist beyond Redis; CAS can guard publication.
    - title: Redis distributed locks
      url: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
      checked: 2026-10-28
      relevance: Single-instance expiry and owner-checked release; a slow former owner can outlive its lease. Do not import the broader Redlock algorithm into this article.
