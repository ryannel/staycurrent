topic: Cache admission, eviction and memory
title: Cache memory and eviction
brief: >-
  Choose which reusable answers deserve a limited memory budget and check that
  the choice saves useful source work as requests change. Follow the shop's
  product cards through a small cache, account for the bytes beyond their values,
  and compare admission and eviction on the same request trace. Apply that
  understanding to Redis as one implementation, distinguishing its policies and
  memory accounting from the illustrative model.
heading:
  - title: The catalogue, the working set and the cache
    brief: >-
      Begin with repeated requests for P7 among requests for other product cards.
      Draw the requests beside the copies currently resident in memory, counting
      hits and source reads. Define a working set over a chosen interval and
      distinguish it from the whole catalogue and the subset that is worth
      keeping. Show why fitting useful repeated answers can matter more than
      storing every product, and why a change in popular products changes that
      judgement.
  - title: What one entry costs
    brief: >-
      Build up one entry from its encoded value, complete key and bookkeeping.
      Show allocator rounding or unused space as a further cost, keeping the
      byte diagram explicitly illustrative. Compare equal entry counts with
      unequal value sizes: one large result can take the room used by many
      product cards. Use representative size classes rather than multiplying
      every entry by the size of P7. Explain how narrower representations or a
      size limit can help, and what application work they add or leave behind.
    heading:
      - title: Leave room for the rest of the process
        brief: >-
          Place cached entries inside the larger process and host budget. Include
          connections, temporary work, allocator retention and any enabled
          replication or persistence activity. A configured cache allowance is
          not a promise about total resident memory. Use measured headroom for
          the selected deployment rather than prescribing a universal percentage.
  - title: Expiry does not reserve a place
    brief: >-
      Give a card an expiry time, then evict it earlier to make room. Contrast
      time-based expiry with removal under pressure: a still-usable copy can be
      absent and an expired entry's physical memory may be reclaimed later.
      The application must tolerate a miss before the TTL ends. Keep the shared
      30-second insertion TTL distinct from a source-age guarantee, linking to
      freshness for that contract. Shortening TTL solely to reduce memory may
      increase source reads; it is not a substitute for a memory budget.
  - title: Decide what enters and what leaves
    brief: >-
      Fill a small cache, then make another answer arrive. Name eviction as
      choosing residents to remove and admission as deciding whether the new
      answer deserves space at all. Reuse the same labelled requests and sizes
      while changing one rule, so the reader sees which later source reads each
      decision creates. Show a large one-use result displacing useful cards,
      then keep it out with an explicit admission rule.
    heading:
      - title: Recent use and frequent use
        brief: >-
          Derive least-recently-used and least-frequently-used choices from
          visible histories. Run a recurring hot set, a one-time scan and a
          shift to new popular products. Show both the appeal and the failure
          of each prediction; frequency needs a way to forget old popularity.
          A reuse-based admission filter can resist scans but can also delay a
          newly popular answer. Explain that none knows future requests.
      - title: Count the work saved by the space
        brief: >-
          Compare hits, occupied bytes and avoided source work for unequal
          answers. A higher hit count need not save more costly work. Use a
          transparent small model to expose that trade-off, not an invented
          universal ranking formula. Explain that a library's weight limit
          may constrain occupancy without making its eviction policy optimise
          benefit per byte.
  - title: Put the budget into Redis
    brief: >-
      Translate the general choices into maxmemory and an explicit policy for
      the worked disposable cache. Explain allkeys versus volatile candidates,
      and show that noeviction can refuse a fill while a successful source result
      is still available to return. Keep non-disposable state outside this
      eviction budget. Redis samples eviction candidates and approximates LRU
      and LFU; the exact trace model cannot predict its next victim.
    heading:
      - title: Measure entries and the process separately
        brief: >-
          Use MEMORY USAGE on representative keys and INFO memory to distinguish
          allocations, the dataset and process RSS. Explain that summing key
          estimates does not account for every process cost, and that maxmemory
          excludes some replication and AOF buffering. Briefly connect this to
          the earlier headroom drawing. Memcached's size-class allocation and
          Caffeine's entry or weight limits illustrate why these details change
          with implementation; avoid a product configuration catalogue.
  - title: Check the choice against changing requests
    brief: >-
      Replay representative requests with sizes, update or expiry events and
      source costs recorded. Compare a smaller and larger budget, then a policy
      change, using the same inputs. Include cold, steady, scan and shifted-hot-set
      phases; show where extra memory stops saving much work. Verify the chosen
      implementation on a disposable instance before relying on the model.
      Use eviction, expiry, rejected-fill and source-work observations to state
      what would overturn the choice. Route ongoing incident diagnosis and
      rollouts to Operating a cache, and cold-miss admission to Handling cache
      misses.

context:
  parent_boundary: >-
    The introduction gives the first full-cache example and distinguishes expiry
    from eviction. This article owns memory accounting, admission, retention
    policy and the evidence for sizing them.
  neighbours: >-
    Choosing a cache owns whether and where another copy earns its cost. Keys
    owns answer identity and representation compatibility. Freshness owns
    acceptable age and invalidation. Misses owns source admission and waiting.
    Redis integration owns the complete application code. Operations owns
    diagnosis, rollout and recovery using the signals established here.
  split_decision: >-
    Keep one article. Byte accounting, candidate selection and workload replay
    form one practical retention decision. Detailed replacement-algorithm
    internals, allocator tuning and operational incident procedures would add
    a different course or duplicate existing owners.
  figure_needs: >-
    A request trace beside labelled cache residents should make the returning
    source work visible. A byte drawing should show value, key and overhead
    inside a larger process allowance. Replay the same trace under alternative
    admission and eviction decisions, including unequal sizes and changed
    popularity. Keep counters and causes together, as in Storage's buffer slots
    and Indexes' page-read comparisons. Let the writer choose the final visual
    structure rather than prescribing one figure per section.
  continuity: >-
    Use the canonical north/P7 product card and full key where key bytes matter.
    Extra product identifiers, sizes, popularity and source costs are labelled
    illustrative scenario facts. Keep the source-backed role: eviction loses a
    reusable answer, not an accepted sale. The 30-second TTL starts on insertion
    and is not promised residency or an unconditional source-age bound.
  evidence: >-
    All 19 bounded reference parts read separately with END markers: sequences
    1–6, indexes 1–7, storage 1–6. Inspected storage figures 1 and 2 and indexes
    figure 3 from the coordinator's rendered reference captures. Planning
    primary sources checked 28 October 2026; no memory measurements or policy
    replay claimed here. The writer must verify any reported native values.
  primary_sources:
    - title: Redis key eviction
      url: https://redis.io/docs/latest/develop/reference/eviction/
      relevance: >-
        maxmemory, excluded buffers, eviction eligibility, noeviction errors and
        sampled approximate LRU/LFU. LFU forgets historic frequency through decay.
    - title: Redis MEMORY USAGE
      url: https://redis.io/docs/latest/commands/memory-usage/
      relevance: >-
        Per-key allocations include key, value and administrative overhead;
        nested types use sampling by default. Report measured version and
        allocator rather than treating documentation examples as this workload.
    - title: Redis INFO
      url: https://redis.io/docs/latest/commands/info/
      relevance: >-
        Distinguishes used_memory, used_memory_dataset, used_memory_rss and
        mem_not_counted_for_evict. A high fragmentation ratio also includes
        process overhead and is not a complete diagnosis by itself.
    - title: Caffeine eviction
      url: https://github.com/ben-manes/caffeine/wiki/Eviction
      relevance: >-
        Entry and weight limits are distinct. Weights are computed on creation
        or update and do not themselves select eviction victims by relative weight.
    - title: Caffeine design
      url: https://github.com/ben-manes/caffeine/wiki/Design
      relevance: >-
        Window TinyLFU supplies a concrete admission design combining a recency
        window with estimated frequency; the article needs its decision, not
        its complete implementation.
    - title: Memcached performance and efficiency
      url: https://docs.memcached.org/serverguide/performance/
      relevance: >-
        Item allocation includes keys and bookkeeping and rounds to size classes.
        Other process memory exists beyond the item allowance. Expiry and
        physical reclamation are different events.
