topic: Application caching
title: Application caching
brief: >-
  Understand how an application reuses a saved answer, judge whether that reuse
  earns another copy, and recognise the freshness, capacity and failure decisions
  it introduces. Follow the shop's product P7 from one source read to a cache hit,
  a price change and a cache miss. Make those decisions intelligible here; the
  children own their detailed designs and working procedures. Redis supplies
  concrete practice as one implementation among several.
heading:
  - title: Reusing an answer
    brief: >-
      Follow the first product request through the application, cache and source,
      then the next request through the same drawing. Establish key, value, hit,
      miss and cache-aside through the operations. The cached product card saves
      source work; the database still owns the price and checkout still reads it.
      Distinguish an application result from a database's cached storage pages.
  - title: What a hit saves
    brief: >-
      Compare the work on the hit and miss paths with one small invented workload.
      Show why repeated expensive answers offer reuse and unique cheap answers
      may not. Place the copy inside one application process, then beside two
      instances in a shared service; make the extra hop and separate local copies
      visible. Readers can choose a plausible starting point here.
    nested_article:
      topic: Choosing whether and where to cache
      title: Choosing a cache
      brief: >-
        Decide whether to cache a measured workload and where to put the copy.
        Compare source improvements, local caches, shared caches and justified
        combinations through saved work, latency, reuse, cost and ownership.
        Treat Redis, Valkey, Memcached and language cache libraries as choices
        where their differences affect this decision. Own the workload evaluation
        and placement trade-offs; the root supplies the hit and miss model.
  - title: Which requests can share an answer
    brief: >-
      Change the shop or language while keeping product ID P7. Show how a key
      that names only the product can return the wrong card. Establish that a key
      identifies an answer for a particular context, including its representation.
      Show the corrected key without turning the section into a key-format guide.
    nested_article:
      topic: Cache keys and cached representations
      title: Cache keys
      brief: >-
        Design keys and values so that only requests entitled to the same answer
        share it. Work through shop, locale, currency, query parameters,
        authorisation-dependent results, representation changes and cached
        absence. Own key identity, encoding and value compatibility. Freshness
        owns when a previously correct answer or absence ceases to be usable.
  - title: When the source changes
    brief: >-
      Raise P7's source price from 20.00 to 22.00 while the cache still holds
      20.00. Explain expiry and invalidation as ways of ending reuse, with a short
      concrete source-write-then-delete sequence. Establish that separate cache
      and source operations can leave a stale copy, and keep checkout's current
      price check visible. The deeper article owns race analysis and stronger
      freshness designs.
    nested_article:
      topic: Cache freshness and invalidation
      title: Freshness and invalidation
      brief: >-
        Choose a freshness promise and a source/cache update path that can meet
        it. Distinguish entry lifetime from source age; follow concurrent fills,
        delayed source reads, missed invalidations, deletions and newly created
        records. Compare accepting stale answers, expiry, invalidation, updating
        copies and version-based approaches, including the work and remaining
        assumptions of each. Give read-after-write needs an explicit solution
        or route to the source. The root owns the first price-change example.
  - title: When requests arrive together
    brief: >-
      Expire one popular product while several callers arrive. Draw the repeated
      source reads and then a shared fill, so the reader can see why hit rate
      alone misses the burst. Empty the whole cache to reveal the larger source
      demand. Explain that rebuilding a copy requires capacity and that returning
      an error can protect work the source must still perform.
    nested_article:
      topic: Cache misses, refresh and source protection
      title: Handling cache misses
      brief: >-
        Keep useful service within the source's capacity through popular-key
        expiry, cache failure and a cold start. Develop request coalescing,
        bounded waiting, refresh timing, permitted stale serving and admission of
        source work from visible request traces. Explain the limits of per-process
        coalescing and any shared refresh lease, including a slow former owner.
        Distinguish protecting one hot key from protecting the source across many
        keys. Freshness owns which stale answers are acceptable.
  - title: When the cache fills
    brief: >-
      Fill a small cache with product cards, then add a large, rarely requested
      answer. Show which useful copies must leave and which source reads return.
      Distinguish eviction under memory pressure from expiry after a time limit.
      Explain why admitting every result or counting entries alone can waste the
      memory budget.
    nested_article:
      topic: Cache admission, eviction and memory
      title: Cache memory and eviction
      brief: >-
        Choose which answers deserve limited memory and evaluate that choice
        against changing requests. Work through entry sizes, overhead, working
        sets, admission, eviction and expiry using trace replay and a byte budget.
        Compare recency and frequency where they change saved work, keeping
        illustrative policies distinct from Redis's implementation. Own memory
        sizing and retention choices; operating the cache uses the resulting
        signals to diagnose changes.
  - title: Using Redis for the worked cache
    brief: >-
      Connect the cache box to a concrete GET, SET with expiry and deletion of
      P7's key. Explain that the application supplies the source reads and update
      logic. Position Redis as the collection's worked implementation, alongside
      other shared stores and local libraries. Show what the upcoming practical
      article lets the reader try, with no claim that commands alone establish
      the freshness or failure policy.
    nested_article:
      topic: Implementing an application cache with Redis
      title: Caching with Redis
      brief: >-
        Build and exercise a source-backed product cache with a pinned Redis and
        client version. Follow reads, fills, expiry and committed source updates
        through actual application code. Handle missing, malformed and obsolete
        entries, cache errors, timeout budgets, connections and pending work.
        Apply the collection's decisions rather than surveying Redis features.
        Own runnable integration and its demonstrated behaviour; introduce deeper
        Redis topology or client work only where a distinct practical need earns it.
  - title: Keeping the cache useful
    brief: >-
      Read a small before-and-after service view: request latency, source work,
      cache errors and freshness. Show why a high hit ratio can coexist with poor
      service. End with the decisions a reader can now make and routes to the
      deeper work, including testing a cold or unavailable cache before depending
      on its warm performance.
    nested_article:
      topic: Operating and changing an application cache
      title: Operating a cache
      brief: >-
        Diagnose whether a cache still improves the application and change it
        without losing control of source demand or answer validity. Join
        application and cache observations in concrete incidents; distinguish
        cache slowness, source slowness, low reuse, memory pressure and stale
        results. Rehearse a bounded rollout, cold recovery and rollback, with
        appropriate access and deployment choices for the Redis example.
        Use earlier mechanisms rather than teaching them again; include topology
        and failover depth only as the selected deployment requires.
