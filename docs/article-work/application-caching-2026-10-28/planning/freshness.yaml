topic: Cache freshness and invalidation
title: Freshness and invalidation
brief: >-
  Choose what a cached answer may lag behind and design how reuse ends when its
  source changes. Follow P7's price from GBP 20.00 to GBP 22.00 through expiry,
  invalidation and a delayed fill. Distinguish an entry's lifetime from the age
  of its source observation, account for missed changes and affected answers,
  and choose when to reuse, validate or read the source. The parent introduces
  the first price change; this article owns the freshness decision and its races.
heading:
  - title: What does fresh mean here?
    brief: >-
      Contrast a public product card with checkout and with the merchant reading
      back an edit. Name the requirement each actually has: an allowed age, seeing
      one's completed write, or using authoritative state for a decision. Keep
      P7's source value beside the displayed value so a reader can describe a
      stale answer without assuming that every use needs the latest value.
  - title: Expiry measures time in the cache
    brief: >-
      Put the source observation, delayed fill and expiry on one timeline. A
      30-second TTL begins at insertion; it does not count the time before that
      insertion. Extend the same timeline with a lagging source replica and a
      second cache layer. A copied answer keeps its age; moving it or renewing
      an expiry does not make a new source observation.
    heading:
      - title: Enforcing an age limit
        brief: >-
          Give the product card a maximum age measured from a trustworthy source
          observation. Reject an over-age fill and check again before returning
          an answer. Explain what makes the timestamp meaningful: the source
          snapshot, elapsed time and clock assumptions. The native lab's local
          monotonic clock demonstrates one process only; neither a stale replica
          nor an old transaction snapshot becomes current by being read now.
  - title: Invalidate after the source commits
    brief: >-
      Follow commit then delete, and compare deleting before commit, when a miss
      can refill the old price. Explain what happens if the source commits but
      deletion fails or the application stops. The write remains accepted at
      the source; invalidation needs retry or another repair route. An expiry
      can bound reuse only under the age assumptions already established.
  - title: A fill can arrive after the deletion
    brief: >-
      Step through the agreed race: App A reads revision 1 and pauses; App B
      commits revision 2 and deletes the key; App A fills revision 1. Show both
      values after each event and the newly started TTL. Repeat with a cache
      update replacing deletion to show that an old fill can overwrite that
      update too. Atomic Redis commands do not make these separate source and
      cache operations one transaction.
  - title: Find every answer that changed
    brief: >-
      Let P7 appear in its product card and in a cached list of products under
      GBP 21.00. Raising the price changes both answers, including list membership.
      Trace the dependencies rather than assuming that deleting P7's key repairs
      every result. Compare known affected keys, a broader group invalidation and
      expiry where the allowed age permits it. Keep the source work caused by
      broad invalidation visible and link to Handling cache misses.
    heading:
      - title: Recovering missed changes
        brief: >-
          Explain a committed change record and retrying consumer as a repair
          mechanism, including delayed, repeated and reordered notifications.
          Every writer, including imports and administrative changes, must reach
          the repair path. A durable outbox or change stream closes a particular
          loss gap; it does not remove delivery delay or the late-fill race.
          Redis notifications track Redis changes and can be lost on disconnect.
  - title: Absence, deletion and access changes
    brief: >-
      Create P99 after an earlier read cached its absence, then delete a previously
      cached product. Both change what an answer means and need the same freshness
      decisions as a price change. A timeout is not a negative result. For a
      restricted variant, revoke access while leaving the product bytes unchanged:
      a content TTL cannot replace the current access check required by that policy.
      Key construction and representation stay with Cache keys.
  - title: Put the revision in the identity
    brief: >-
      Show revision 1 and revision 2 under different keys, then explain how a reader
      chooses the current one. Develop a complete simple design that reads the
      authoritative revision and selects or builds a matching representation.
      Version selection and payload must agree; a stale selector recreates the
      problem. This can save expensive assembly while retaining a small source
      read. Old versions still need memory cleanup.
    nested_article:
      topic: Versioned cache fills and invalidation ordering
      title: Versioned cache fills
      brief: >-
        Design and test conditional cache publication when concurrent fills and
        asynchronous invalidations may arrive out of order. Follow P7 through
        source revisions, cache generations and rejected old fills; distinguish
        knowing a newer version from knowing the current source version. Explain
        the lifetime of generation metadata through eviction, expiry, restart and
        deletion, and what to do when it is missing. Compare a retained-version
        design with the parent's authoritative revision lookup. Own protocol
        details and counterexamples; refresh ownership and source-load control
        remain with Handling cache misses.
  - title: Reading after a write
    brief: >-
      Return to the merchant's edit and checkout. Reading the authoritative source
      after the acknowledged commit is a clear starting solution; a replica or old
      transaction snapshot may not meet that promise. A returned revision can
      express a minimum acceptable version only if the chosen read path can honour
      it. Finish by matching the illustrated needs to age-limited reuse,
      invalidation with repair, validated versions or a source read.
context:
  key: freshness
  parent: index
  example: docs/coverage/application-caching-2026-10-28-example.md
  boundaries:
    - >-
      Keep comparisons beside the decisions they change. Redis is a worked store;
      its TTL, notifications and atomic commands are not universal cache behaviour.
    - >-
      Write-through names where source and cache updates are organised; it does not
      itself supply cross-store atomicity. Write-behind would make the cache part
      of accepted-write storage and is outside this source-backed collection.
    - >-
      Handling cache misses owns coalescing, refresh leases, soft/hard refresh
      scheduling and source admission. This article supplies the permitted age
      and never treats a refresh lease as proof that its value is current.
    - >-
      The optional child owns version/generation protocol mechanics and metadata
      retention. The main article must remain useful with expiry, invalidation,
      authoritative reads and the fully explained revision-key design alone.
  proposed_example_extension: >-
    An illustrative north-shop query lists products priced below GBP 21.00. P7
    qualifies at revision 1 and leaves the result at revision 2. This introduces
    one derived dependency without changing canonical product facts.
  references_read: >-
    All 19 complete bounded parts, with END markers: sequences 1-6, indexes 1-7,
    storage 1-6. Inspected rendered sequences figure 5, indexes figure 3 and
    storage figure 5 from the coordinator's reference captures. Use one visible
    state transition at a time, preserving entities and values across comparisons.
  evidence: >-
    practice/cache_lab.py and evidence/native-redis.json reproduce the delayed-fill
    sequence on Redis 8.10.3, with an in-process source model. They also compare
    accepting a delayed snapshot with a local observation-age check. They establish
    no cross-process clock protocol, replica behaviour or production race frequency.
  primary_sources:
    - url: https://aws.amazon.com/builders-library/caching-challenges-and-strategies/
      use: Acceptable stale results, expiration choices and freshness during dependency failure.
    - url: https://redis.io/docs/latest/commands/expire/
      use: Expiration lifetime, renewal and the effects of overwriting a key.
    - url: https://redis.io/docs/latest/commands/set/
      use: A value and its expiry can be set together; scope remains one Redis operation.
    - url: https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf
      use: Section 3.2.1 explains late cache fills and invalidated fill tokens in a Memcache implementation.
    - url: https://engineering.fb.com/2022/06/08/core-infra/cache-made-consistent/
      use: Reordered fills and invalidations; eviction can remove knowledge of a newer version.
    - url: https://redis.io/docs/latest/develop/pubsub/keyspace-notifications/
      use: Redis key notifications describe Redis changes and lose events while the subscriber is disconnected.
    - url: https://redis.io/docs/latest/develop/reference/client-side-caching/
      use: Redis client tracking maintains client copies of Redis data, not coherence with the separate source.
    - url: https://docs.memcached.org/protocols/meta/
      use: Conditional fills and version-based consistency are available in other cache implementations too.
