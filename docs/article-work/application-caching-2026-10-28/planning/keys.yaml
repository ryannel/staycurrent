topic: Cache keys and cached representations
title: Cache keys
brief: >-
  Design a key and value that let requests reuse the same permitted answer.
  Derive the shop's product key from the request, then account for query options,
  access context, encoding, representation changes and cached absence. A reader
  should be able to explain why two requests may share an entry and recognise
  when an extra key field merely wastes reuse. The introduction supplies the
  hit/miss model; freshness owns how an answer loses validity over time, and the
  Redis article owns the complete runnable client and error handling.
heading:
  - title: The key names an answer
    brief: >-
      Begin with north's P7 card at GBP 20.00, then request south's independent
      P7 at GBP 18.00. Follow both lookups through a cache keyed only by product
      ID, making the wrong returned card visible. Add shop identity and repeat.
      Establish that a key names the result of a particular operation in a
      context, not merely a source row. The same reasoning applies to a local
      cache, Redis and other shared stores.
  - title: Which inputs change the result
    brief: >-
      Derive product:v1:north:P7:en-GB:GBP one component at a time. Distinguish
      shop, product, locale, currency and representation version; the application
      supplies the translated or converted representation. Change one input and
      show whether the answer can still be shared. Carry the reasoning to a
      product-list query with filter, sort, page and selected fields. A request
      ID need not split identical answers, while an omitted sort or page can
      merge different ones. Cache the smallest useful shared result when a
      complete personalised response would create one entry per reader.
    heading:
      - title: Normalising equivalent requests
        brief: >-
          Give two parameter spellings that the application's query contract
          treats identically and show one canonical key. Explain that sorting
          parameter names, applying defaults or normalising case is safe only
          when it preserves the query's meaning. Repeated parameters, list order,
          missing values and explicit empty values can differ; do not teach
          blanket string sorting as canonicalisation.
  - title: Encoding the parts without collisions
    brief: >-
      Show how two different tuples can become the same colon-joined string
      when a component contains the separator. The baseline shop identifiers
      use a validated restricted alphabet; explain that assumption. For general
      inputs, use an unambiguous typed or length-delimited encoding with a fixed
      field order. A digest can shorten that encoding but cannot recover an
      omitted input or repair ambiguous serialisation. Show the human-readable
      namespace alongside the encoded request. Redis accepts binary-safe keys;
      other stores and client APIs impose different limits. Colons are a naming
      convention, not a hierarchy or access boundary.
  - title: Sharing data without sharing permission
    brief: >-
      Keep the baseline catalogue public. Introduce a labelled variant with an
      access-restricted view and follow the permission check on both a miss and
      a hit. A hit must not skip the application's authorisation decision.
      Distinguish sharing the underlying product data after checking access
      from caching an already filtered or personalised answer, whose key must
      capture the relevant audience or principal. A tenant prefix separates
      names; it does not authenticate a caller or grant permission. Include only
      a brief warning that a user ID does not make an old permission decision
      current, routing revocation and policy changes to freshness. Avoid placing
      raw credentials or sensitive request text in observable key names.
  - title: Changing the cached representation
    brief: >-
      Put an old and a new application reader beside the same stored card.
      Show how a changed field name, type or meaning can make readable bytes the
      wrong value for one reader. Compare compatible decoding with a new format
      namespace. Keep v1, the representation version in the key, visibly distinct
      from revision 1 or 2, the source product revision in the value. Validate
      the expected envelope before reuse; malformed or unsupported entries are
      unusable cache results, not proof of a missing product. A new namespace
      creates misses and old entries still occupy memory; link their rollout
      consequences to operating the cache instead of developing them here.
  - title: Remembering that a result was absent
    brief: >-
      Follow a lookup of P99 through three outcomes: no cache entry, a successful
      source read reporting no product, and a source error. Give a cached
      not-found result an explicit tagged representation, distinct from a cache
      miss and from a present value that happens to be empty or zero. The source
      failure must remain an error, not become invented absence. The worked
      cache propagates source failures rather than saving them as results. The key still
      includes the request's shop and access context. Explain that later creation
      ends the truth of this absence; freshness owns its expiry and invalidation.
  - title: Checking a key design
    brief: >-
      Return to the product card and inspect a compact set of paired requests.
      Hold the source state fixed while changing shop, locale, currency, query
      options, audience and representation. Where answers differ, the entries
      must stay separate; where the same permitted answer is safe to reuse, an
      accidental extra input should not defeat sharing. Check that every reader
      and writer uses the same key construction. Finish with one understandable
      key/value contract and the next question: how long that answer remains
      acceptable, developed in Freshness and invalidation.

# Context for the writer and tree review, not reader-facing copy:
# - This is one coherent key-design outcome. No deeper article is proposed.
# - Keep shop south/P7/GBP18 as the explicitly labelled collision variation;
#   north/P7 remains GBP20 (revision1), later GBP22 (revision2).
# - The restricted view is a separate labelled scenario, not a change to the
#   public catalogue. Any named permission or personalised-field facts should
#   be agreed in the shared example before the writer uses them across articles.
# - All 19 fixed reference text parts read with END markers; inspected rendered
#   sequences figure1, indexes figure2 and storage figure3. Their useful pattern
#   is a stable set of entities with one changed input and an observable result.
# - Primary sources checked 28 October 2026:
#   https://redis.io/docs/latest/develop/using-commands/keyspace/
#   Redis keys are binary-safe; colon-separated sections are conventional names.
#   https://docs.djangoproject.com/en/5.2/topics/cache/#cache-key-prefixing
#   https://docs.djangoproject.com/en/5.2/topics/cache/#cache-versioning
#   https://docs.djangoproject.com/en/5.2/topics/cache/#template-fragment-caching
#   Concrete framework examples of explicit variation, prefixes and versions;
#   these demonstrate the wider principle, not a Django tutorial requirement.
#   https://aws.amazon.com/builders-library/caching-challenges-and-strategies/
#   Shared formats must survive mixed application versions and rollback;
#   discarding incompatible cached values can create a source-load surge.
# - No native engine experiment is claimed by this plan. The wrong-answer and
#   encoding demonstrations are deterministic illustrative request models.
