topic: Implementing an application cache with Redis
title: Caching with Redis
brief: >-
  Implement and exercise a source-backed product-card cache. Follow one request
  through a real Redis client, then make the same path handle unusable entries,
  cache failures and bounded waiting. Keep the authoritative source responsible
  for accepted product changes. Redis is the worked shared store; the application
  owns the key, representation, freshness policy and fallback. The reader leaves
  with runnable code and an understanding of the decisions needed to adapt it.
heading:
  - title: Follow a product request
    brief: >-
      Connect the familiar application, cache and source boxes to the actual
      client calls. Read P7's complete key with GET; on a miss read the source,
      encode its product card and save it with SET and EX in one command. Follow
      a second request to its hit. Show the returned value beside the command
      that produced it, and make clear that Redis never calls the source itself.
      Introduce the pinned client and disposable practice setup here.
  - title: Reuse one client through the application
    brief: >-
      Give the cache client and its connection pool a process lifetime, with
      creation at startup and closure at shutdown. Show several requests sharing
      the pool rather than opening a connection per lookup. Set a finite pool
      size and explain what happens when no connection is available. Use the
      selected client's tested configuration explicitly; distinguish transport
      connection limits from the application's limit on pending requests.
  - title: Decide whether a value can be used
    brief: >-
      Develop the decoding branch using four visible replies: absent key, valid
      product, explicit not-found envelope and malformed or unsupported content.
      Check the envelope's schema and expected product context before reuse.
      The value's format version differs from its source revision. A successful
      source lookup of P99 can establish absence; a failed lookup cannot. Use an
      explicit cache-miss sentinel rather than truthiness, so empty and zero
      values are not silently treated as misses. Key design owns the full identity
      argument; apply its contract here.
  - title: Keep the source result when a fill fails
    brief: >-
      Complete the miss branch with a bounded source call and optional cache fill.
      If the source succeeds but SET fails, the request still has its source
      result. If the source fails, preserve that failure instead of writing an
      invented absence. Keep cache errors observable and distinguish a temporary
      unavailable cache from an authentication, schema or command fault that
      needs repair. A cache error may allow fallback only through the source-work
      budget; it must not create unlimited database work.
  - title: Fit the cache inside the request deadline
    brief: >-
      Draw a request's remaining time through connection acquisition, GET, source
      work and optional SET. Configure connection and command limits together
      with an overall application deadline. Make the retry policy explicit so
      hidden retries cannot consume the source's remaining time. Contrast a slow
      read with a slow optional fill and show which result the caller gets.
      Cancellation stops waiting and the selected client cleans up its connection;
      it does not retract a command already received by Redis. Avoid unbounded
      detached fills or replaying an old payload after reconnect. The misses
      article owns fleet-wide admission and request coalescing.
  - title: Change the source, then invalidate
    brief: >-
      Update the source to revision 2 and invalidate the same key only after its
      commit succeeds. Follow the next miss to GBP 22.00. A failed invalidation
      does not undo that committed update, and a timed-out mutation must not be
      blindly repeated as though the source certainly rejected it. Reuse the
      native lab's delayed revision-1 fill to show the remaining race briefly,
      then link to freshness and its versioned-fill child for stronger designs.
      SET with a fresh expiry controls entry lifetime; it cannot certify source
      age. Reads that need authoritative current state bypass this cached card.
  - title: Exercise the complete adapter
    brief: >-
      Join the developed branches in one downloadable adapter and a small driver
      with a clearly labelled source model. Demonstrate miss/hit, expiry,
      malformed and obsolete entries, negative results, source failure, rejected
      optional fills, exhausted resources and cancellation. Record what was run
      against Redis and what was injected by the test harness. Let the reader
      change one condition and inspect the result and source-call count. End by
      identifying the application-specific source adapter, freshness allowance,
      capacity and access settings to supply before operating the design.

context:
  parent_boundary: >-
    The introduction already explains cache-aside and shows GET, SET and deletion
    as the operations behind its cache box. This article owns the complete
    application integration and its observed behaviour, rather than reteaching
    the general choice to cache or cataloguing Redis commands.
  neighbouring_boundaries:
    - Cache keys owns answer identity, safe sharing and representation choices.
    - Freshness owns age promises, invalidation races and version-based designs.
    - Handling cache misses owns coalescing and source protection across a fleet.
    - Cache memory and eviction owns sizing, admission and eviction policies.
    - Operating a cache owns deployment topology, access setup, incidents and rollout.
  split_decision: >-
    Keep this as one article. Connection lifetime, value handling and deadlines
    change the behaviour of the same cache-aside adapter. A separate client article
    would make the reader assemble those essentials across pages. General
    asyncio teaching, Redis data structures, persistence, Sentinel and Cluster
    are outside this integration lesson; operations owns any needed topology depth.
  implementation_choice: >-
    Use Python's redis-py asyncio client for the application adapter if it remains
    the clearest tested choice. Pin the exact release installed and exercised;
    current stable reference documentation identifies 8.1.0, but that is not
    evidence of a local client run. The existing dependency-free RESP client is
    deliberately a command lab and should not become the recommended application
    client. Explain only the asynchronous control flow that the adapter needs.
  figure_needs: >-
    Follow one request with application/source/cache state visible together.
    Then change the cache reply or the operation that fails. Show a separate
    deadline timeline, including time spent waiting for a connection and a reply,
    and the successful source value that survives a failed fill. Keep code beside
    the branch it implements rather than opening with a large defensive wrapper.
  practice_requirements: >-
    Add the adapter and its runnable driver alongside practice/cache_lab.py;
    coordinate exact filenames and downloads with the build owner. Use the owned
    local Redis harness, exact distributed files and a pinned dependency. Verify
    meaningful results and cleanup. If a fault is injected at the client boundary,
    label it as such rather than claiming a network failure was reproduced. The
    source model is not a measured production database. An event-loop timeout is
    cooperative, so blocking work must not be described as forcibly cancellable.
  retained_native_evidence: >-
    evidence/native-redis.json and .md record Redis 8.10.3 and Python 3.14.5,
    including miss/fill/hit, real expiry, plain SET clearing TTL, commit/DEL/refill,
    delayed stale fill, a local observation-age check and OOM on optional SET.
    Reuse these command observations while their script remains unchanged.
    They establish neither application-client cancellation nor production latency.
  continuity: >-
    Keep north/P7/en-GB/GBP, GBP 20.00 to 22.00, price_pence 2000 to 2200 and
    source revision 1 to 2. Use product:v1:north:P7:en-GB:GBP; v1 names the
    representation. The 30-second insertion TTL is an example setting, not an
    unconditional source-age promise. P99 may have a tagged not-found result.
    Checkout reads the authoritative source. No extra shared facts are required.
  preparation: >-
    Read all 19 complete bounded reference parts with END markers: sequences
    1–6, indexes 1–7 and storage 1–6. Inspected sequences figure 3, indexes
    figure 1 and storage figure 5 in the coordinator's rendered captures.
    Their progressive changes to one case, visible waits and preserved state
    guide this article's teaching sequence.
  primary_sources:
    - title: Redis SET
      url: https://redis.io/docs/latest/commands/set/
      checked: 2026-10-28
      relevance: Combined value/expiry write and replacement semantics.
    - title: redis-py asynchronous operations
      url: https://redis.io/docs/latest/develop/clients/redis-py/async/
      checked: 2026-10-28
      relevance: Shared client lifecycle, pool ownership and cancellation cleanup.
    - title: redis-py connection API
      url: https://redis.readthedocs.io/en/stable/connections.html
      checked: 2026-10-28
      relevance: Exact client options; verify against the selected installed version.
    - title: redis-py production usage
      url: https://redis.io/docs/latest/develop/clients/redis-py/produsage/
      checked: 2026-10-28
      relevance: Explicit retries, timeout settings and exception categories.
    - title: redis-py error handling
      url: https://redis.io/docs/latest/develop/clients/redis-py/error-handling/
      checked: 2026-10-28
      relevance: Distinct connection, command and data errors; adapt fallback to source capacity.
