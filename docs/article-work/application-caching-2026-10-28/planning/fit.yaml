topic: Choosing an application cache
title: Deciding what and where to cache
brief: >-
  Decide whether reusing an application result earns the cost of caching, then
  choose no cache, an in-process cache, a shared cache or a justified combination.
  Trace the work saved by the shop's product-card requests, measure reuse and the
  whole request path, and test the choice under changing load and cold starts.
  Redis is one possible shared implementation. This article owns the selection
  and evaluation decision; neighbouring articles own correctness and operation.
heading:
  - title: Find the work a hit would remove
    brief: >-
      Follow the request for P7's product card through source lookup, assembly and
      response. Show what caching the row, an assembled card or a computed result
      would skip, and what still runs on every request. Compare with the existing
      uncached path, including a database whose pages are already in memory.
      Identify a measurable latency, source-load or cost problem before choosing
      another copy. An adequate uncached path is a useful outcome.
  - title: Look for answers that will be reused
    brief: >-
      Read a short request trace with repeated P7 requests and less popular
      products. Define a hit ratio through actual hits and requests, then show
      why a changing popular set, short useful lifetime and many request variants
      reduce reuse. Contrast a frequently reused cheap answer with a costly miss:
      counts of hits alone do not measure saved work. Carry one stable unit of
      cache lookup through the comparison.
  - title: Count the cost of both paths
    brief: >-
      Draw no-cache, hit and miss paths with the added lookup, decoding and fill
      work visible. Derive an illustrative weighted mean from those paths and
      find when the cache saves time. Keep latency and source work distinct. A
      mean improvement can coexist with worse slow requests; show the miss
      population in the latency distribution before explaining percentiles.
      End-to-end measurements decide the result when contention changes timings.
  - title: Choose where the copy lives
    brief: >-
      Compare one process's memory with a shared service by following the same
      requests across several application instances. Make duplicate copies,
      separate warming and differing cached versions visible for local caches;
      make the network trip and shared dependency visible for remote caches.
      Use an in-process library such as Caffeine and shared stores such as Redis,
      Valkey or Memcached as concrete choices where their properties matter.
    heading:
      - title: When a second layer earns its place
        brief: >-
          Add a small local layer ahead of a shared cache only after showing the
          hot repeated remote lookups it removes. Count conditional hit ratios
          at each layer rather than adding them. Show that each layer has its
          own age and invalidation problem; a hit in the first layer never asks
          the second whether the value changed. Link to freshness for mechanisms.
  - title: Test the workload you expect
    brief: >-
      Compare the proposed design against an uncached baseline using realistic
      key popularity, payloads, updates, concurrency and network placement. Measure
      application latency distributions, useful source work and cache overhead.
      Include cold start, a shifted popular set and cache unavailability. A fast
      GET benchmark does not establish application benefit. Demonstrate why a
      warmed-cache-only result cannot justify the choice; source protection is
      developed in the misses article.
  - title: Make a decision you can revisit
    brief: >-
      Return to the product-card workload and select a placement from the evidence.
      Weigh saved source capacity and latency against memory, transfer, cache
      service cost and ongoing maintenance. State the required freshness and
      failure behaviour, the observation that would overturn the choice, and the
      smallest rollout that can test it. Route the reader to key identity,
      freshness and capacity for the chosen design's next decisions.

context:
  parent_boundary: >-
    The introduction explains a source-backed cache, one miss and one hit, and
    why the product card cannot authorise a checkout. It gives an initial sense
    of benefit; this article owns the full fit, placement and evaluation judgement.
  neighbouring_boundaries:
    - Key identity owns variant encoding, schema versions and authorisation.
    - Freshness owns TTL meaning, invalidation, racing fills and multiple-layer validity.
    - Miss protection owns coalescing, overload budgets and bounded fallback.
    - Capacity owns working-set sizing, admission and eviction policy.
    - Redis integration owns commands, client code and executable native practice.
    - Operations owns production diagnosis, rollout procedures and recovery.
  split_decision: >-
    No deeper child is needed at this stage. Benefit, placement and the experiment
    that can disprove a choice form one reader decision. Product implementation
    and operational diagnosis already have separate owners.
  shared_facts: >-
    Shop north; product P7 is the blue mug, GBP 20.00 (price_pence 2000), revision
    1; a source update makes it GBP 22.00 (2200), revision 2. The cache serves
    display cards; checkout reads authoritative data. The established key is
    product:v1:north:P7:en-GB:GBP. All worked latency, request-rate and cost numbers
    are illustrative unless separately measured. The example 30-second TTL is
    insertion retention, not an unconditional bound on source age.
  figure_needs: >-
    Make the work removed and work added visible in request paths; show reuse as
    a sequence of requests; keep hits and misses visible in a latency distribution;
    show which process owns each copy when changing placement. Drawings should
    explain the decision before prose adds qualifications. A small adjustable
    cost model may support arithmetic, with its fixed assumptions stated.
  arithmetic_boundary: >-
    One possible simple model uses constant cache lookup C, source work S and
    synchronous cache fill W. A hit costs C and a miss C+S+W, giving mean
    C+(1-h)*(S+W) for hit fraction h. This assumes one lookup per request, no
    overlap, no failures, no refresh work and unchanged source timing. Its mean
    cannot predict a percentile or account for queueing. Adjust the equation if
    the writer chooses a different fill path, and label the model explicitly.
  preparation: >-
    Read all 19 bounded reference parts separately with their END markers:
    sequences 1–6, indexes 1–7, storage 1–6. Inspected rendered sequences figure 3,
    indexes figure 1 and storage figure 2. Sequence diagrams' visible waits,
    Indexes' counters over fixed data and Storage's same-case comparisons guide
    the teaching, without importing their engine-specific claims.
  primary_sources:
    - title: Caching challenges and strategies
      url: https://aws.amazon.com/builders-library/caching-challenges-and-strategies/
      checked: 2026-10-28
      relevance: >-
        AWS's first-hand account supports evaluating reuse, local/shared placement,
        cold starts and cache loss. Use its documented trade-offs, not universal
        claims that every fleet scales or fails in the same way.
    - title: Redis benchmark
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/benchmarks/
      checked: 2026-10-28
      relevance: >-
        Primary documentation for benchmark assumptions and the effects of
        payloads, clients, key distribution and network conditions. Command
        throughput is evidence about that benchmark, not a measured product-card
        request path.
    - title: Diagnosing latency issues
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/
      checked: 2026-10-28
      relevance: >-
        Redis distinguishes server work from communication and scheduling costs.
        Avoid copying its illustrative hardware timings into this workload.
    - title: Caffeine statistics
      url: https://github.com/ben-manes/caffeine/wiki/Statistics
      checked: 2026-10-28
      relevance: >-
        A concrete local cache exposes hit rate, eviction count and load penalty.
        These help evaluate an in-process option without assuming Redis is the
        only way to cache application results.
