topic: Versioned cache fills and invalidation ordering
title: Versioned cache fills
brief: >-
  Design and test a conditional fill that cannot undo an invalidation already
  processed by the cache. Follow P7's delayed revision 1 through remembered
  source revisions and a revocable fill token. Distinguish a known newer version
  from the current source state, and make missing metadata reject old work.
  Compare this protection with the parent's authoritative revision lookup;
  source-work scheduling remains with Handling cache misses.
heading:
  - title: The old fill arrives last
    brief: >-
      Replay the parent's exact failure: App A reads P7 at GBP 20.00, revision 1,
      and pauses; App B commits GBP 22.00, revision 2, then deletes the cache key;
      App A publishes revision 1. Show why successful deletion and individually
      atomic commands did not prevent the old answer returning. Define the
      narrower target: a fill must not undo a deletion processed after it began.
  - title: Remembering a newer revision
    brief: >-
      Let an invalidation record revision 2 and reject a later fill carrying
      revision 1. Apply comparisons atomically and never lower the remembered
      revision when messages arrive out of order. Then evict that knowledge and
      replay the old fill. Missing metadata cannot mean revision zero or permission
      to publish. Keeping a number is useful only while its meaning and lifetime
      survive every path that changes the entry.
  - title: Reserve permission before reading
    brief: >-
      Develop a complete alternative for this race: an atomic reservation on a
      missing key returns a new one-use token before the source read. Publishing
      atomically replaces only the matching reservation with the ready value;
      invalidation deletes either state. Replay P7: deletion removes App A's
      permission, so its old fill is rejected. Show why checking then writing in
      separate operations, or reserving after the read, reopens the race.
  - title: When the permission disappears
    brief: >-
      Remove the reservation by expiry, eviction or an empty restart. The old fill
      still fails because missing is not a match. A new attempt reserves a new
      token and makes a new source read; it must not reuse the earlier result.
      Contrast this with a generation counter reset to a familiar number. Explain
      that restoring old state after failure is different from losing state and
      lies outside the simple single-instance guarantee.
  - title: What the cache has not heard
    brief: >-
      Delay the revision 2 invalidation until after a fill has published: a valid
      token cannot reveal the unseen commit. A late or repeated delete can remove
      a newer copy, causing work without restoring an older one. Repeat with a
      source replica returning revision 1 after the reservation. State the source
      read and delivery assumptions beside the result, and distinguish rejecting
      a cache write from deciding whether the waiting caller may use its result.
  - title: Choose where to establish the revision
    brief: >-
      Compare remembered source revisions, revocable fill tokens and the parent's
      authoritative revision lookup. A remembered maximum prevents known
      regression; a token prevents an invalidated attempt from publishing; an
      authoritative selector establishes which revision was current at that read.
      None freezes later source changes. Choose the simpler source lookup when
      its cost is acceptable or the cache cannot retain the required guarantees.
  - title: Exercise the competing orders
    brief: >-
      Give a reproducible controlled schedule, first failing with unconditional
      publication, then rejecting the same old fill with the token check. Also
      test publication before deletion, reservation loss followed by a new token,
      duplicate completion and delayed invalidation. Name the expected source,
      cache and caller outcomes separately. Make the remaining stale interval
      visible rather than treating every rejected write as a freshness proof.
context:
  key: versioned-fills
  parent: freshness
  example: docs/coverage/application-caching-2026-10-28-example.md
  boundaries:
    - >-
      The parent owns freshness requirements, source-observation age, invalidation
      delivery and the complete authoritative-revision selection example. This
      child owns conditional-publication mechanics and their counterexamples.
    - >-
      Handling cache misses owns coalescing, refresh ownership, bounded waiting
      and source admission. A permission to publish is not proof that source work
      has only one executor. Link to that article for callers encountering an
      existing reservation; do not recreate its scheduling design here.
    - >-
      Redis is one implementation. Memcached CAS and suitable local cache
      synchronisation offer related primitives, with their own contracts. This
      is not a general consistency course or a complete failover protocol.
  protocol_notes:
    - >-
      Use one logical record per complete representation key, absent, loading
      with a token, or ready with payload and source revision. For the worked
      single-instance Redis model, use the canonical product key and atomically
      test/replace that record; no separate metadata key is needed. Tokens must
      not be reused across attempts. A fresh unpredictable identifier is a
      practical choice; any uniqueness assumption should be stated.
    - >-
      Invalidation removes both a ready entry and an outstanding reservation.
      Publication succeeds only when the record is still loading with exactly
      that token; success consumes the permission. Missing, different-token and
      already-ready states reject the old attempt. Errors or uncertain outcomes
      must never fall back to an unconditional SET. A token TTL cleans up stuck
      attempts; it is not a freshness age limit.
    - >-
      Demonstrate both serial orders at the atomic publication/deletion boundary.
      Publish first and deletion removes the value; delete first and publication
      fails. This reasoning assumes one cache history with no restored earlier
      reservation. Redis scripting provides atomic cache operations, not a
      transaction with the source and not protection from all failover histories.
    - >-
      A lost or expired retained revision watermark is unknown state. A design
      depending on that watermark must restore trustworthy knowledge or bypass
      that path, not accept a delayed candidate as its bootstrap truth. Deletion
      and recreation need ordered identity/version semantics too; erasing a row
      must not silently reset the revision comparison. Keep this as a compact
      counterexample and recovery judgement, not a second full protocol.
    - >-
      A generation counts cache state changes; a source revision identifies source
      state; a token identifies one publication attempt; v1 in the canonical key
      identifies representation format. Introduce each beside the event it names.
      Do not treat these four values as interchangeable versions.
    - >-
      A rejected fill says nothing by itself about whether its source result may
      be returned to its original caller. Apply the parent's age/minimum-revision
      requirement; a strict requirement may need another authoritative read or a
      failed request. Checkout continues to use authoritative current price and
      stock, outside the cached card decision.
    - >-
      Missing state after a clean restart rejects old tokens. A restored snapshot
      or lagging promoted replica could resurrect one, so the narrow demonstration
      cannot support a failover guarantee. A deployment must establish a recovery
      boundary that makes old attempts unusable, or bypass the cache for the
      required source validation. Do not imply that WAIT or a longer token TTL
      supplies that boundary.
  references_read: >-
    All 19 bounded reference parts read separately with END markers: sequences
    1-6, indexes 1-7, storage 1-6. Inspected rendered sequences figure 5, indexes
    figure 3 and storage figure 5. Keep P7, App A, App B, source and cache in stable
    positions; make each changed value or revoked permission visible. Explanatory
    text must still carry the reasoning without interaction.
  figure_and_practice_context:
    - >-
      One stepped comparison should replay the same P7 events with unconditional
      fill, retained revision knowledge and revocable token. An optional removal
      of metadata exposes the difference. Display source revision, cache state
      and publication result separately. Keep this an explicitly illustrative
      schedule, with a readable ordered event alternative.
    - >-
      A small decision table can compare what each design establishes, the state
      it depends on and its extra source work. Prefer this to another large
      interaction; source-revision selection is already taught in the parent.
    - >-
      The writer may extend practice/cache_lab.py using its owned Redis helper
      for a deterministic token demonstration and save separate execution
      evidence. Existing evidence/native-redis.json establishes only the original
      unprotected late-fill race on Redis 8.10.3 with a model source. No protected
      protocol, replica behaviour or production frequency has yet been measured.
  primary_sources:
    - url: https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf
      use: >-
        Section 3.2.1 describes fill tokens invalidated by deletion. Use its
        publication permission mechanism; leave herd mitigation with misses.
    - url: https://engineering.fb.com/2022/06/08/core-infra/cache-made-consistent/
      use: >-
        Reordered fills and invalidations, including the loss of newer-version
        knowledge through eviction. Supports the retained-watermark counterexample.
    - url: https://docs.memcached.org/protocols/meta/
      use: >-
        Miss placeholders and CAS provide a concrete alternative implementation
        context. Check actual conditional-set semantics before proposing code.
    - url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      use: >-
        Atomic script execution supports a short conditional replacement on the
        cache. It does not include the application source read or source commit.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
      use: >-
        Asynchronous replication and possible write loss during failover limit
        the history assumed by a single-instance publication demonstration.
