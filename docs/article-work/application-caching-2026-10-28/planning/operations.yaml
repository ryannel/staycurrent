topic: Operating and changing an application cache
title: Operating a cache
brief: >-
  Decide whether the cache is still helping the application, locate the cause
  when it is not, and change or recover it without overwhelming the source or
  returning unacceptable answers. Follow the shop's product-card service through
  a latency incident, a loss of useful hits and a change of cached representation.
  Redis supplies concrete observations and deployment examples; the operating
  questions apply to other caches too. Earlier articles own the mechanisms;
  this article joins their evidence into actions and checks the result.
heading:
  - title: Measure what the application receives
    brief: >-
      Follow one request through a valid hit, a miss, an unusable cached value
      and a cache error. Record application outcomes, latency distributions,
      cache lookup and fill times, source attempts and admitted source work.
      Distinguish a key found by Redis from an answer the application can reuse.
      Read counter differences over the same interval, accounting for restarts
      and resets, rather than dividing unrelated totals. Redis INFO supplies
      useful server counters; it does not identify the application's request,
      freshness policy or final result. Use a compact annotated service view
      whose signals map to the request path.
  - title: Follow a slow request
    brief: >-
      Compare two product-card incidents with the same increased client latency.
      In one, Redis command execution grows; in the other, the wait is in the
      client pool, connection, network or application. Locate the wait with a
      trace and corresponding server evidence before choosing a change. Explain
      why a quiet SLOWLOG does not clear the whole cache path: its timing excludes
      communication with the client. Check payload size, client resource pressure
      and connection churn where the evidence points. Preserve the deadline and
      pending-work limits developed in Caching with Redis.
  - title: Explain the extra source work
    brief: >-
      Keep request volume beside valid hits, source work and source latency.
      Show that a steady hit ratio can hide growing source demand when traffic
      grows, and that a falling ratio has several causes. Compare a cold namespace,
      expiring entries, eviction, changed request variants and repeated failures
      to store useful fills. Join application outcomes with Redis expired and
      evicted counters, rejected commands and memory measurements. Choose one
      supported intervention, then check whether useful work and user outcomes
      improve. The memory and misses articles own policy derivation and admission
      mechanisms; refer to them without repeating them.
  - title: Check the answers as well as their speed
    brief: >-
      Revisit the P7 price change with a fast cache that continues returning
      revision 1. Show which recorded revision, observation age, invalidation
      progress or carefully sampled source comparison would expose the problem.
      A later source read may observe a change made after the cached response,
      so a difference alone does not prove that the response violated its promise.
      Evaluate the stated age or version requirement at the appropriate point.
      Trace all affected representations and current access checks when needed.
      A high hit ratio and low latency cannot establish validity; the freshness
      article owns the repair mechanisms.
  - title: Choose the failure you can recover from
    brief: >-
      Draw the application, source and selected shared-cache deployment. Compare
      one replaceable Redis instance with a replicated deployment when an outage
      would otherwise exceed the source budget. Replication can improve cache
      availability but asynchronous failover can lose acknowledged cache writes
      or invalidations and expose older copies. A recovered endpoint does not
      prove that its data meets the freshness contract. Explain how the client
      discovers or reconnects to the current endpoint, and test its bounded
      behaviour during the transition. Managed services take on operational work;
      their client and data guarantees still need checking.
    heading:
      - title: Memory, restart and scale
        brief: >-
          Decide whether persistence helps the disposable cache recover a useful
          working set, considering saved load, restart time and the validity of
          restored entries. An empty restart can be preferable when safe rebuilding
          is already budgeted; replication without persistence can also propagate
          an empty restarted primary. If one node cannot hold or serve the useful
          set, explain that Redis Cluster distributes keys and requires a client
          that handles redirects. One hot key still has one slot owner; adding
          shards does not divide that key's work. Multi-key protocols must fit
          the chosen topology. Keep provisioning commands and general cluster
          administration in the product documentation.
      - title: Limit access to the cache
        brief: >-
          Keep the shared store reachable only from the systems that need it and
          protect connections with the deployment's TLS and authentication setup.
          Give the application the commands and key patterns it needs, while
          administration uses a separate identity. In Redis, a key prefix alone
          does not restrict commands such as FLUSHALL. Verify both a permitted
          product operation and a forbidden administrative operation for the
          configured identity. Rotate credentials with a tested reconnection
          path. These store permissions do not replace the application's decision
          about which reader may see an answer.
  - title: Rehearse the change and the recovery
    brief: >-
      Follow a product-card format change from v1 to v2 through a small rollout,
      wider traffic and possible rollback. Keep old and new readers compatible
      with what they can encounter, or give formats separate namespaces. Show
      the extra memory and source demand while two namespaces coexist. Source
      changes must still invalidate every live representation. A rollback must
      not trust an old namespace whose invalidations have stopped. Increase the
      rollout only while application latency, source budget, validity and error
      behaviour meet their declared limits; stop or reverse it when they do not.
    heading:
      - title: Bring a cold cache back gradually
        brief: >-
          Rehearse cache unavailability and an empty cache with the same bounded
          source path used in normal service. Admit a controlled amount of warm-up
          and request work together, observe useful hits returning, and increase
          traffic only as the source remains healthy. A responding Redis PING is
          not a warm-cache or application-readiness test. Prefer rebuilding useful
          answers to indiscriminate full-dataset warming. End with a short worked
          change record: what changed, the observation that permits the next step,
          the stop condition and the rollback or recovery path.
context:
  key: operating-caches
  parent: index
  example: docs/coverage/application-caching-2026-10-28-example.md
  boundaries:
    - >-
      This is one integrated operating decision. No child is proposed: Redis
      deployment details appear only where they change failure, validity, source
      demand or access. A general Sentinel/Cluster administration course would
      expand the commission and duplicate client or distributed-systems teaching.
    - >-
      Cache benefits owns the original workload evaluation; keys owns representation
      compatibility; freshness owns age, invalidation and version protocols;
      misses owns coalescing and source admission; memory owns retention sizing;
      Redis integration owns the client path and executable command practice.
    - >-
      Use one visible request path with observations attached, then change the
      failing part. Prefer an explanatory incident trace and rollout timeline to
      an inventory of metrics, commands or alert thresholds. Any example thresholds
      are workload decisions, not universal Redis recommendations.
  figure_needs:
    - >-
      Put application wait, cache command execution and source work on the same
      path so that similar symptoms lead to different next checks.
    - >-
      Show aligned observation windows before and after a change, with counters
      converted to deltas and valid answers distinguished from Redis key hits.
    - >-
      Track the same source and cache revisions across replica promotion or an
      empty restart; show both freshness consequences and rebuilding demand.
    - >-
      Keep old/new application readers and v1/v2 cached answers visible through
      rollout and rollback, alongside the shared source-work and memory budgets.
  evidence_limits: >-
    The existing native lab demonstrates Redis command behaviour on 8.10.3 with
    a Python dictionary source. It does not measure service latency, exercise
    replication/failover, or establish a production capacity limit. Incident and
    rollout numbers must be labelled illustrative unless separately executed and
    recorded. If the writer provides runnable access or topology exercises, verify
    those exact files on owned disposable instances under the database-verification
    guidance; otherwise describe documented behaviour without claiming a run.
  preparation: >-
    Read all 19 complete bounded reference parts with END markers: sequences 1-6,
    indexes 1-7, storage 1-6. Inspected rendered sequences figure 3, indexes figure
    3 and storage figure 5. Follow their method of locating work and knowledge in
    a visible system, changing one condition and explaining the resulting action.
  primary_sources:
    - url: https://aws.amazon.com/builders-library/caching-challenges-and-strategies/
      use: >-
        Application cache observations, cold starts, bounded fallback, and format
        changes that can cause source overload during deployment.
    - url: https://redis.io/docs/latest/commands/info/
      use: >-
        Server statistics and memory fields. Keyspace hits and misses count
        dictionary lookups, not the application's complete validity decision.
    - url: https://redis.io/docs/latest/commands/slowlog/
      use: Command execution timing excludes communication with clients.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/
      use: Distinguish command work from network, operating-system and client costs.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
      use: >-
        Asynchronous replication and write loss; full resynchronisation and the
        risk of propagating an empty primary when persistence is disabled.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/
      use: >-
        Endpoint discovery and failover responsibilities; Sentinel does not remove
        the replication loss window.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/
      use: >-
        Slot ownership, MOVED and ASK client handling, multi-key boundaries and
        asynchronous replication limits. This supports deployment decisions only.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/security/
      use: Network isolation, authentication and TLS protect different boundaries.
    - url: https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
      use: >-
        Commands and key patterns are separate permissions; patterns do not limit
        whole-database commands. Check permitted and forbidden operations.
