neighbours:
- id: a10
  slug: constraints
  title: Expressing rules with constraints
  brief: Teach how to translate application invariants into database constraints and identify what remains
    outside their scope. Develop a booking schema through required values, candidate keys, tenant-scoped
    references, conditional uniqueness, mutually dependent rows and non-overlapping reservations. Make
    each example end with an enforcement decision and valid and invalid changes. Check the selected engine's
    null, timing and constraint capabilities; reshape the data where that makes a rule enforceable, and
    state the obligations of triggers or transaction protocols where it does not. Examine update and deletion
    actions and finish with an enforcement map and concurrency cases for the transactions branch. Leave
    value representation, transaction anomaly analysis and adding constraints to live data to their owning
    articles.
  parent: a01
  href: /review/relational-next/constraints/
  children: []
  sections:
  - title: State the rule before choosing its constraint
    anchor: state-the-rule-before-choosing-its-constraint
    level: 2
  - title: Close the gaps in required values and identity
    anchor: close-the-gaps-in-required-values-and-identity
    level: 2
  - title: Reference the whole relationship
    anchor: reference-the-whole-relationship
    level: 2
  - title: Enforce uniqueness only where the rule applies
    anchor: enforce-uniqueness-only-where-the-rule-applies
    level: 2
  - title: Decide when related changes must become valid
    anchor: decide-when-related-changes-must-become-valid
    level: 2
  - title: Make reservation conflicts a stored rule where possible
    anchor: make-reservation-conflicts-a-stored-rule-where-possible
    level: 2
  - title: Choose what a referenced change is allowed to do
    anchor: choose-what-a-referenced-change-is-allowed-to-do
    level: 2
  - title: Account for rules the schema cannot express
    anchor: account-for-rules-the-schema-cannot-express
    level: 2
- id: a11
  slug: normalisation
  title: Normalisation and deliberate redundancy
  brief: Teach how to recognise facts with different dependencies, split their storage without losing
    meaning, and justify retaining a derived copy. Extend the booking design with candidate-key, partial-dependency,
    transitive-dependency and independent-set cases; introduce normal-form names only when they explain
    a consequential choice. Check both reconstruction and enforceability after a split. Compare repeated
    attributes, cached totals, summary tables and materialised results through their read benefit and
    maintenance contract. Finish with a defensible design and a falsifiable case for its redundancy, using
    the performance and transaction branches for detailed validation rather than expanding this into a
    theory or optimisation curriculum.
  parent: a01
  href: /review/relational-next/normalisation/
  children: []
