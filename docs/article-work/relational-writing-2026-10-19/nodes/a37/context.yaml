article:
  topic: Relational service maintenance and upgrades
  title: Maintaining and upgrading a relational service
  brief: Teach practitioners to keep a relational service healthy and change its engine version through
    controlled, observable work. Connect required upkeep to the workload and engine mechanisms that create
    it; distinguish automatic work, operator intervention and managed-service duties. Build a maintenance
    and upgrade procedure with explicit resource and interruption budgets, compatibility checks, recovery
    choices and validation. Use a worked service example and current primary engine documentation for
    concrete procedures. Link to performance for storage and query mechanisms, to operations neighbours
    for monitoring, topology and restoration, and to live database changes for schema migration or database
    moves. Keep this as one practical article.
  heading:
  - title: Identify the work the service keeps creating
    brief: 'Introduce maintenance as work generated by normal operation, and upgrades as changes to the
      software that performs that work. Begin with a concrete service whose data, retained versions, logs
      and statistics change under load. Establish an engine- and deployment-specific inventory: what runs
      automatically, how completion is observed, what can fall behind and who can intervene. Refer to
      the parent''s responsibility map for managed versus self-managed boundaries; automatic work still
      needs evidence of progress.'
    anchor: identify-the-work-the-service-keeps-creating
  - title: Diagnose upkeep before choosing a command
    brief: Give readers a compact evidence-to-action table for the recurring duties below. Distinguish
      a backlog, an impediment to progress and a misleading expectation about reclaiming space. Check
      the selected engine's documented behaviour before prescribing an operation; link underlying storage
      and performance explanations instead of rebuilding them here.
    heading:
    - title: Clean up versions that are no longer needed
      brief: Explain the operational connection between retained row versions, cleanup progress and transactions
        or other consumers that can retain history. Inspect engine-specific progress and blockers, including
        any mandatory housekeeping whose delay threatens availability. Choose between removing a blocker,
        adjusting automatic work and a documented manual intervention. Keep transaction visibility theory
        in its owner.
      anchor: clean-up-versions-that-are-no-longer-needed
    - title: Keep planner statistics useful
      brief: Recognise workload or data changes that warrant checking statistics, inspect when collection
        ran and whether it completed, and schedule engine-supported refresh work with attention to cost.
        Distinguish statistics upkeep from diagnosing and tuning an individual query; follow the performance
        article when fresh statistics do not resolve the observed regression.
      anchor: keep-planner-statistics-useful
    - title: Account for retained logs
      brief: Identify why the engine retains logs and which recovery, archival or replication consumer
        governs release. Diagnose stalled consumption and retention growth using engine-supported controls.
        Establish that a retention setting is not proof of usable recovery coverage. Link to backups and
        topology for their policies and procedures; never present deleting active engine files as routine
        space reclamation.
      anchor: account-for-retained-logs
    - title: Decide whether storage or indexes need intervention
      brief: Separate reusable space inside engine files from space returned to the filesystem, and recurring
        cleanup from heavier rebuild or compaction operations where the engine supports them. Require
        evidence of a useful outcome before scheduling expensive work. Check locks, temporary space, log
        generation and replica effects against the exact operation. Refer index selection and storage
        mechanics to performance; avoid universal periodic rebuild advice.
      anchor: decide-whether-storage-or-indexes-need-intervention
    anchor: diagnose-upkeep-before-choosing-a-command
  - title: Fit maintenance within the service budget
    brief: Turn one diagnosed upkeep problem into a scheduled change. Estimate duration, temporary space,
      additional I/O and logs, lock acquisition and interruption using representative evidence. Coordinate
      overlapping jobs, replica or archival consumers and backup windows through their owners. Set progress
      signals, stop conditions and a completion test; check whether stopping actually releases locks,
      space or work in the chosen engine. Show when reducing concurrency or using a maintenance window
      is the practical choice, rather than assuming every operation must run online.
    anchor: fit-maintenance-within-the-service-budget
  - title: Establish an upgrade path before choosing a date
    brief: Distinguish patch and major upgrades while checking the actual release notes, supported source-to-target
      paths and service restrictions for both. Inventory application drivers, SQL and configuration behaviour,
      collations, extensions and external tooling where relevant. Verify replica protocol or format compatibility,
      mixed-version restrictions, backup usability and restore tools for the intended path. Identify who
      controls timing and versions in a managed service. Compare the engine's supported in-place or replacement
      methods by interruption, resources and recovery options; link database-move mechanics to the live-change
      branch.
    anchor: establish-an-upgrade-path-before-choosing-a-date
  - title: Rehearse the upgrade and the way back
    brief: Use a representative isolated copy and the documented procedure for the exact versions and
      extensions. Run preflight checks, measure elapsed time and storage needs, and exercise the application
      workload and recovery dependencies. Practise a failed preflight and an interruption or failed validation
      at a meaningful point. Draw the point beyond which restarting old binaries is unsupported, and distinguish
      switching back to an intact old service from restoring an independent recovery copy. Account for
      writes accepted after cutover when judging loss and rollback feasibility; link to the restoration
      and live-change owners for those procedures.
    anchor: rehearse-the-upgrade-and-the-way-back
  - title: Execute with explicit gates
    brief: 'Present the worked upgrade as a concise runbook: verify prerequisites and recovery evidence,
      coordinate traffic and dependent jobs, perform the supported steps, observe progress and decide
      whether to continue, stop or invoke the rehearsed recovery path. Place go/no-go gates before costly
      or irreversible transitions and assign an operator to each decision. Show how replica compatibility
      and managed-service controls alter the sequence without duplicating failover design or the parent''s
      incident framework.'
    anchor: execute-with-explicit-gates
  - title: Prove completion and update the next run
    brief: Validate the intended maintenance outcome or engine version, object and extension state, application
      correctness, error rates, latency, resource headroom and upkeep progress against the pre-change
      baseline. Check replication, archival and backup work through their owning procedures, and establish
      recovery coverage for the new state before retiring the previous recovery option. Distinguish successful
      command completion from successful service operation. Record actual interruption, resource use,
      deviations and follow-up work so the next scheduled change uses evidence.
    anchor: prove-completion-and-update-the-next-run
