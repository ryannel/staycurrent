article:
  topic: Relational data design
  title: Designing relational data
  brief: Teach an engineer to translate application facts, rules and access needs into a relational schema.
    Follow a booking application from ordinary requirements to tables, identities, relationships, value
    representations and enforceable rules, exposing the failures each decision prevents. Establish a practical
    account of normalisation and controlled redundancy, then account for history and deletion. Test the
    design with representative reads, changes and lifecycle scenarios. Develop specialised modelling only
    where it changes these relational decisions; leave query fluency, transaction protocols and live migration
    procedures to their neighbouring articles.
  heading:
  - title: Begin with facts and rules
    brief: Start with customers booking places on scheduled sessions. Separate a customer's identity,
      a session's identity and the fact of a booking from the screens that display them. Write down example
      facts, vocabulary, ownership, cardinalities, required reads and changes, and lifecycle rules. Expose
      ambiguous requirements such as whether one customer may book twice or a cancelled booking must remain
      visible before choosing tables.
    anchor: begin-with-facts-and-rules
  - title: Give every row a clear meaning
    brief: State what one row represents and what makes two rows the same fact. Turn one-to-many and many-to-many
      relationships into keys and relationship tables; put relationship attributes, such as booking status,
      on the relationship. Distinguish a required reference from a promise that a parent has at least
      one child. Work through duplicate bookings, repeat sessions and customer merges to show why row
      meaning and identity precede a convenient identifier.
    heading:
    - title: Choose identity and scope deliberately
      brief: Compare natural, surrogate and composite keys using mutable customer identifiers and bookings
        scoped to a session. Explain candidate keys, primary keys and the uniqueness rules that remain
        necessary after adding an artificial identifier. Make tenant scope explicit in both uniqueness
        and references. Treat identifier generation, exposure and storage cost as design considerations
        without turning identifier formats into a catalogue.
      anchor: choose-identity-and-scope-deliberately
    - title: Represent optional relationships
      brief: 'Use the booking example to distinguish a relationship that may be absent from an entity
        that exists independently: a customer can exist without a booking, while each booking must identify
        its customer and session. Translate those requirements into optional or required references and
        state what an absent relationship means.'
      anchor: represent-optional-relationships
    anchor: give-every-row-a-clear-meaning
  - title: A value needs a meaning as well as a type
    brief: Show how a fee, a session start and a customer's contact details need explicit units, precision,
      comparison rules and missing-value meanings. Establish that choosing a database type is part of
      the application's contract. Use unknown, inapplicable and deliberately absent values to introduce
      nulls and designs that preserve distinctions the application needs.
    nested_article:
      topic: Relational value representation
      title: Choosing types and representing missing values
      brief: Choose representations that preserve a value's meaning, allowed states and useful operations
        across the database and application boundary. Develop a booking schema through prices, identifiers,
        customer text, reservation times and optional details, using concrete failures to justify each
        choice. Distinguish exactness from precision, identity from presentation, instants from local
        schedules, and missing information from empty values. Compare scalar columns, arrays, JSON, binary
        values, related rows and external payloads through validation, query and ownership requirements.
        Use selected, documented engine differences only when they change a decision. Leave SQL expression
        behaviour, constraint design, historical modelling and live migration procedures to their owning
        articles.
      href: /review/relational-next/types/
    anchor: a-value-needs-a-meaning-as-well-as-a-type
  - title: Make invalid facts difficult to store
    brief: Translate booking requirements into required columns, uniqueness, references and checks, then
      try to insert or change invalid examples. Distinguish rules about one stored row, relationships
      between rows and an operation spanning several changes. Make the boundary between declarative constraints
      and a transaction protocol visible; application checks alone do not establish that stored data always
      satisfies the rule.
    nested_article:
      topic: Relational schema invariants
      title: Expressing rules with constraints
      brief: Teach how to translate application invariants into database constraints and identify what
        remains outside their scope. Develop a booking schema through required values, candidate keys,
        tenant-scoped references, conditional uniqueness, mutually dependent rows and non-overlapping
        reservations. Make each example end with an enforcement decision and valid and invalid changes.
        Check the selected engine's null, timing and constraint capabilities; reshape the data where that
        makes a rule enforceable, and state the obligations of triggers or transaction protocols where
        it does not. Examine update and deletion actions and finish with an enforcement map and concurrency
        cases for the transactions branch. Leave value representation, transaction anomaly analysis and
        adding constraints to live data to their owning articles.
      href: /review/relational-next/constraints/
    anchor: make-invalid-facts-difficult-to-store
  - title: Store each fact where it belongs
    brief: Use copied customer details, multiple contact columns and repeating session information to
      expose update, insertion and deletion anomalies. Introduce functional dependencies and normalisation
      through repairs that give each fact an owner. Distinguish a historical price agreed at booking from
      an accidental copy of the current session price; similar values need not represent the same fact.
      Establish normalisation as a way to reason about correctness and change, without requiring a tour
      of every normal form.
    nested_article:
      topic: Relational normalisation and deliberate redundancy
      title: Normalisation and deliberate redundancy
      brief: Teach how to recognise facts with different dependencies, split their storage without losing
        meaning, and justify retaining a derived copy. Extend the booking design with candidate-key, partial-dependency,
        transitive-dependency and independent-set cases; introduce normal-form names only when they explain
        a consequential choice. Check both reconstruction and enforceability after a split. Compare repeated
        attributes, cached totals, summary tables and materialised results through their read benefit
        and maintenance contract. Finish with a defensible design and a falsifiable case for its redundancy,
        using the performance and transaction branches for detailed validation rather than expanding this
        into a theory or optimisation curriculum.
      href: /review/relational-next/normalisation/
    anchor: store-each-fact-where-it-belongs
  - title: Decide what changes and what must be remembered
    brief: Walk a booking through amendment, cancellation, customer deletion and later reporting. Separate
      current state, an agreed historical fact and evidence of a change. Explain why overwriting or adding
      a deleted flag is a decision about meaning, visibility, uniqueness and references. Record retention
      and erasure requirements early enough that the schema can support them, without prescribing jurisdiction-specific
      legal rules.
    nested_article:
      topic: Relational history and data lifecycle design
      title: Modelling history and data lifecycles
      brief: Teach how to choose among current-state rows, immutable snapshots, change records and effective-dated
        versions for concrete relational requirements. Distinguish when a fact applied from when the database
        recorded it, introducing both dimensions only when late information and corrections require them.
        Design version identity, historical references, interval boundaries and overlap rules so point-in-time
        questions have a defined answer. Compare status changes, tombstones, archival and deletion through
        their effects on references, uniqueness, reporting, retention and erasure. Bound the evidence
        that history rows provide and the removal achieved by deleting live rows; refer operational procedures
        and live lifecycle changes to their owning branches.
      href: /review/relational-next/history/
    anchor: decide-what-changes-and-what-must-be-remembered
  - title: Test the schema against the application's life
    brief: Assemble the booking schema into a reviewable design with row meanings, key choices and an
      invariant inventory. Trace representative reads and changes, including an empty database, missing
      references, duplicate input, a tenant boundary, customer merges, corrected history and deletion.
      Demonstrate simple queries to catch accidental many-to-many multiplication and ambiguous meaning,
      leaving SQL instruction to its own branch. Separate database-enforced rules from transaction and
      application responsibilities, identify workload checks for performance review, and record unresolved
      assumptions and expected future changes. End with evidence that a design meets requirements, rather
      than a claim that one schema fits every application.
    anchor: test-the-schema-against-the-application-s-life
