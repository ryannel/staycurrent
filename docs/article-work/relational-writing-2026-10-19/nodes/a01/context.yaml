  article:
    topic: Relational value representation
    title: Choosing types and representing missing values
    brief: Choose representations that preserve a value's meaning, allowed states and useful operations
      across the database and application boundary. Develop a booking schema through prices, identifiers,
      customer text, reservation times and optional details, using concrete failures to justify each choice.
      Distinguish exactness from precision, identity from presentation, instants from local schedules,
      and missing information from empty values. Compare scalar columns, arrays, JSON, binary values,
      related rows and external payloads through validation, query and ownership requirements. Use selected,
      documented engine differences only when they change a decision. Leave SQL expression behaviour,
      constraint design, historical modelling and live migration procedures to their owning articles.
    heading:
    - title: Start with what a value must preserve
      brief: 'Turn each booking field into a small representation contract: meaning, unit, valid range,
        required distinctions, equality, ordering and expected operations. Distinguish domain meaning
        from a storage type and from a formatted display. Show how a price without a currency and a booking
        time without a temporal meaning can both fit a column while failing the application. Use this
        contract throughout the article instead of presenting an exhaustive type catalogue.'
      anchor: start-with-what-a-value-must-preserve
    - title: Choose numeric representations from the error you can accept
      brief: Compare fixed-width integers, exact decimal values and approximate floating-point values
        through prices, measured quantities and calculated estimates. Make range, scale, rounding points
        and acceptable error explicit; exact storage alone does not settle division or business rounding.
        Compare decimal amounts with integer minor units, retaining currency and allowing for currencies
        and quantities with different scales. Include overflow, fractional-unit loss and a value changed
        by a driver or serialisation layer as failure cases. Keep arithmetic and conversion expression
        semantics in the SQL-values article.
      anchor: choose-numeric-representations-from-the-error-you-can-accept
    - title: Preserve identity and define text equality
      brief: 'Distinguish identifiers from quantities: a telephone number or external code may need leading
        zeroes, punctuation or a namespace even when it contains digits. Compare integer, UUID and text
        representations by required range, accepted form, interchange and exact matching, leaving key
        generation and identity design to the parent. For customer names and booking codes, distinguish
        original spelling, display order, search matching and identity equality. Explain how encoding,
        Unicode normalisation, case and accent policies, collation and length limits affect those decisions.
        Use a compact documented engine comparison where text equality or trailing-space behaviour changes
        which codes count as duplicates; link uniqueness enforcement to constraints and expression behaviour
        to SQL values.'
      anchor: preserve-identity-and-define-text-equality
    - title: Store the time the application actually means
      brief: Separate a calendar date, a local wall-clock time, an instant and an elapsed duration using
        a booking date, confirmation event and recurring opening schedule. Show why an offset and a named
        time zone answer different questions, why an instant alone cannot retain the intended local recurrence,
        and why a type name does not establish which zone information is preserved. For local schedules,
        retain the intended zone and define what happens at ambiguous or nonexistent clock times and after
        time-zone rule changes. Choose precision and application interchange deliberately. Verify selected
        timestamp and session-zone behaviour against engine documentation; leave date expressions and
        historical version modelling to their owning articles.
      anchor: store-the-time-the-application-actually-means
    - title: Represent missing information without inventing facts
      brief: Distinguish an unknown value, an inapplicable field, an absent relationship, an empty string
        or collection, and a known zero. Explain when one nullable column expresses the requirement and
        when an explicit state plus associated data is needed, such as an unprovided versus declined contact
        detail. Treat a default as a decision about omitted input, distinguishing omission from explicit
        null and checking engine behaviour. Show how sentinel dates and empty text can collapse meaningful
        states. Connect each design to required fields, comparisons and uniqueness, directing readers
        to SQL values for three-valued expressions and to constraints for enforceable valid combinations
        and engine-specific null uniqueness rules.
      anchor: represent-missing-information-without-inventing-facts
    - title: Choose the boundary of a structured value
      brief: Compare ordinary columns and related rows with an array or JSON booking-options value. Ask
        whether elements need independent identity, references, uniqueness, validation, frequent filtering
        or separate changes, and whether the enclosing row truly owns the whole value. Use one requirement
        change to show when an embedded value should become related rows; avoid another normalisation
        lesson. Distinguish a missing JSON property, JSON null and SQL null, and require an explicit shape
        and evolution policy for retained JSON. Briefly compare binary values with external payload references
        through size, database validation and query needs, access ownership and lifecycle consistency.
        Identify what cannot be made atomic across an external store and the database; link the recovery
        protocol and storage procedures to their owners instead of expanding them here.
      anchor: choose-the-boundary-of-a-structured-value
    - title: Check representations at the application boundary
      brief: 'Review the completed booking fields against their representation contracts with a compact
        fixture table: a numeric boundary, a rounded amount, a leading-zero identifier, text variants,
        a daylight-saving transition, missing and empty values, and an older structured payload. Check
        accepted and rejected inputs, database round trips and application serialisation using the actual
        selected engine and driver. Record versions and settings for observed behaviour and distinguish
        documented expectations from executed checks. Finish with the remaining decisions to take to constraints,
        SQL expressions or live schema evolution; do not require specialist type or document-store study
        to complete an ordinary relational schema.'
      anchor: check-representations-at-the-application-boundary
- id: a10
  href: /review/relational-next/constraints/
  article:
    topic: Relational schema invariants
    title: Expressing rules with constraints
    brief: Teach how to translate application invariants into database constraints and identify what remains
      outside their scope. Develop a booking schema through required values, candidate keys, tenant-scoped
      references, conditional uniqueness, mutually dependent rows and non-overlapping reservations. Make
      each example end with an enforcement decision and valid and invalid changes. Check the selected
      engine's null, timing and constraint capabilities; reshape the data where that makes a rule enforceable,
      and state the obligations of triggers or transaction protocols where it does not. Examine update
      and deletion actions and finish with an enforcement map and concurrency cases for the transactions
      branch. Leave value representation, transaction anomaly analysis and adding constraints to live
      data to their owning articles.
    heading:
    - title: State the rule before choosing its constraint
      brief: Begin with the booking application's rule that a confirmed reservation belongs to an existing
        customer and resource in the same tenant and occupies a valid interval. Separate the rule into
        required facts, permitted values, identity, references and relationships between rows. State whether
        each rule applies to every stored row, a subset, a completed transaction or an application operation.
        Pair each intended rule with one accepted and one rejected change so enforcement has an observable
        meaning; application validation remains useful feedback but does not itself cover other writers.
      anchor: state-the-rule-before-choosing-its-constraint
    - title: Close the gaps in required values and identity
      brief: Use required booking fields and a tenant's external reservation reference to choose NOT NULL,
        CHECK, a primary key and additional candidate-key constraints. Show why a generated row identifier
        alone does not prevent a duplicate business fact. Test null separately from an out-of-range value
        and distinguish a default from a requirement. Specify which fields make up the business key, their
        tenant scope and the intended treatment of missing values, then verify the chosen engine's CHECK
        and uniqueness behaviour. Link to value representation for choosing types and comparison semantics
        rather than repeating that lesson.
      anchor: close-the-gaps-in-required-values-and-identity
    - title: Reference the whole relationship
      brief: 'Follow a booking whose tenant and resource identifiers are individually valid but describe
        different tenants. Derive a composite reference to an eligible referenced key and test inserts
        and changes on both sides. Make optional relationships explicit: decide what a partially missing
        composite reference means and check the engine''s matching options or require the columns together.
        Distinguish a valid reference from a guarantee that every parent has a child. Use one generic
        type-and-identifier reference as a counterexample only if it helps show why reshaping a relationship
        can restore enforceable references.'
      anchor: reference-the-whole-relationship
    - title: Enforce uniqueness only where the rule applies
      brief: Extend the booking example with at most one current external reference per tenant, while
        retaining cancelled or historical records under an explicit policy. Translate the condition into
        the selected engine's supported mechanism, such as a partial unique index, and distinguish its
        role from a general unique constraint. Check whether the resulting key can be a foreign-key target
        rather than assuming all uniqueness mechanisms are interchangeable. Test activation, cancellation,
        replacement and null cases; if the engine cannot express the intended rule, compare reshaping
        current and historical facts with handing enforcement to a transaction protocol.
      anchor: enforce-uniqueness-only-where-the-rule-applies
    - title: Decide when related changes must become valid
      brief: Use a booking and its required lead participant to expose the difference between a valid
        final state and a sequence whose intermediate states violate references. First ask whether changing
        relationship ownership or insertion order removes the cycle. Where deferral is justified, identify
        the specific constraints and operations the selected engine can defer, distinguish statement-time
        from transaction-end checking, and include a transaction whose final state still fails. Explain
        that deferring existing checks does not create an unstated rule such as every booking having a
        participant; model and enforce that requirement separately. Leave isolation and multi-session
        schedules to the transactions article.
      anchor: decide-when-related-changes-must-become-valid
    - title: Make reservation conflicts a stored rule where possible
      brief: Define the resource, tenant, applicable reservation states and interval boundaries for the
        rule that reservations must not overlap. Test adjacency, equal endpoints, invalid or missing bounds,
        resource changes and changes from a non-blocking state to a blocking state. Investigate a declarative
        range or temporal enforcement mechanism in the selected engine, checking version and capability
        rather than presenting it as portable SQL. Show the exact rule that mechanism guarantees and any
        supporting validation it needs. When unavailable, take the same invariant and cases to transaction
        design rather than replacing enforcement with an unchecked availability query. Leave the choice
        of historical time model to lifecycle design.
      anchor: make-reservation-conflicts-a-stored-rule-where-possible
    - title: Choose what a referenced change is allowed to do
      brief: Walk the reference graph when a customer, resource or booking is updated or removed. Choose
        rejection, explicit reassignment, nulling an optional reference or cascading only after stating
        the business meaning and retention requirement. Test a chain with shared entities to expose how
        a cascade can remove more than the intended business object, and distinguish reference survival
        from permission to perform a deletion. Check the chosen engine's action and timing semantics,
        including any distinction between restricting a change and checking its final result. Link to
        lifecycle design for retention policy and operations for removal beyond live rows.
      anchor: choose-what-a-referenced-change-is-allowed-to-do
    - title: Account for rules the schema cannot express
      brief: 'Finish an enforcement map for the running schema: the invariant, enforcing object, allowed
        change paths, validation cases and any remaining transaction or application obligation. Use a
        total-capacity or minimum-child-count requirement to recognise a rule that the chosen declarative
        mechanisms do not cover. Compare reshaping the stored fact, a database trigger and an all-writers
        transaction protocol by the scope they protect and the maintenance and concurrency obligations
        they introduce; a trigger''s database location is not itself a concurrency argument. Hand simultaneous
        duplicate creation, conflicting reservations, child insertion during parent deletion and mutually
        dependent changes to the transactions article with expected acceptable outcomes. Verify actual
        engine behaviour against primary documentation and recorded tests when writing; label illustrative
        change sequences accordingly. Send discovery of existing violations and live constraint deployment
        to schema evolution.'
      anchor: account-for-rules-the-schema-cannot-express
- id: a11
  href: /review/relational-next/normalisation/
  article:
    topic: Relational normalisation and deliberate redundancy
    title: Normalisation and deliberate redundancy
    brief: Teach how to recognise facts with different dependencies, split their storage without losing
      meaning, and justify retaining a derived copy. Extend the booking design with candidate-key, partial-dependency,
      transitive-dependency and independent-set cases; introduce normal-form names only when they explain
      a consequential choice. Check both reconstruction and enforceability after a split. Compare repeated
      attributes, cached totals, summary tables and materialised results through their read benefit and
      maintenance contract. Finish with a defensible design and a falsifiable case for its redundancy,
      using the performance and transaction branches for detailed validation rather than expanding this
      into a theory or optimisation curriculum.
    heading:
    - title: State what determines each fact
      brief: Start from the parent's booking schema and a service-line extension whose rows mix booking
        facts, service facts and quantities. Write dependencies as business rules about all permitted
        states, not coincidences in the current sample. Show the inconsistent update, missing insertion
        and destructive deletion that expose the mixed ownership before naming functional dependencies.
        Identify all minimal unique combinations under explicit business assumptions, including tenant
        scope; distinguish the selected primary key from the other candidate keys. Show why a generated
        row identifier does not remove dependencies or inconsistent copies. Recall in one sentence that
        current and agreed prices can be different facts, linking to the parent and history article for
        that established distinction.
      anchor: state-what-determines-each-fact
    - title: Split facts that depend on different keys
      brief: Decompose the service-line example into booking, service and booked-service relations. Explain
        why booking attributes depend on only the booking part of the composite key and service attributes
        on the service part, while a quantity belongs to their association. State the one-line-per-service
        assumption; if repeated lines are permitted, reconsider the key rather than force the example.
      heading:
      - title: Follow indirect dependencies
        brief: Extend the same case with a service category whose label is determined by category identity.
          Separate the category fact and trace a label correction through the resulting tables. Introduce
          partial and transitive dependencies, and second and third normal forms, as names for the reasoning
          just used; avoid treating every non-key dependency as the same case.
        anchor: follow-indirect-dependencies
      - title: Handle overlapping candidate keys when they matter
        brief: Use one small counterexample where considering only the chosen primary key misses a dependency
          involving an alternative key. Introduce the stronger Boyce-Codd condition only to explain the
          remaining repetition and the choice of decomposition. Reuse this same example for the enforcement
          tradeoff below; omit a progression through formal proofs and algorithms.
        anchor: handle-overlapping-candidate-keys-when-they-matter
      anchor: split-facts-that-depend-on-different-keys
    - title: Prove that the split preserves the relationships
      brief: Reconstruct the original facts by joining the proposed relations and compare them with a
        deliberately unsafe split that admits extra combinations. Explain lossless decomposition as preservation
        of permitted facts, not merely a match on one test dataset. Use the shared determinant in a simple
        binary split to make the reason visible, then carry the same reasoning through the staged split.
      heading:
      - title: Check what can still be enforced locally
        brief: 'Distinguish lossless reconstruction from dependency preservation. In the overlapping-key
          case, identify a rule that a proposed split can no longer check within one table. Make the tradeoff
          explicit: choose a useful design only after locating enforcement of every required rule. Link
          constraint mechanisms and concurrent enforcement to their owning articles.'
        anchor: check-what-can-still-be-enforced-locally
      anchor: prove-that-the-split-preserves-the-relationships
    - title: Separate independent sets without inventing combinations
      brief: Give a venue independently recorded facilities and supported languages. Show why storing
        every facility-language combination repeats two independent sets, and why separate venue-facility
        and venue-language relations retain their meaning. Introduce a multivalued dependency and fourth
        normal form only to explain this decision, including how to represent a venue with an empty set.
      heading:
      - title: Keep combinations that are themselves facts
        brief: Change the requirement so a language is available only for particular services or facilities.
          Demonstrate the false availability implied by projecting and rejoining independent sets, and
          retain the actual association instead. Derive independence from the requirement rather than
          a visual pattern in sample rows. Stop here without a higher-normal-form survey.
        anchor: keep-combinations-that-are-themselves-facts
      anchor: separate-independent-sets-without-inventing-combinations
    - title: Decide which repeated results are worth storing
      brief: Compare computing a booking total from source lines with storing that total; then use short
        variations for a repeated current attribute, a summary table and a materialised query result.
        Separate an ordinary view from stored results and an agreed historical value from a derived current
        copy. Explain that joins alone do not establish a performance problem and a stored result moves
        work into updates, refreshes and recovery. Require a concrete expensive read, a representative
        workload and a target before accepting redundancy. Compare the measured benefit with extra writes,
        contention, storage, refresh work and acceptable staleness; consider simpler query or index alternatives.
        Hand query plans, benchmark design and intervention validation to performance.
      anchor: decide-which-repeated-results-are-worth-storing
    - title: Give every derived copy a maintenance contract
      brief: 'Complete a contract for the stored booking total: authoritative source facts, included statuses
        and calculation rule, freshness visible to readers, owner of updates, concurrency protection and
        a repair or rebuild path. Cover inserts, corrections, cancellations, deletions and every writer
        that can affect the result. Require the same answers for the other forms of stored result.'
      heading:
      - title: Choose atomic maintenance or explicit lag
        brief: Contrast changing the total with source rows in one transaction against rebuilding or refreshing
          it later. Use one small lost-update counterexample to establish the required concurrency guarantee,
          then link its implementation to transactions. For asynchronous maintenance, require a stated
          lag allowance and a guarantee that missing, repeated or out-of-order changes cannot leave undetected
          drift. Link delivery and recovery protocols to application integration rather than developing
          them here.
        anchor: choose-atomic-maintenance-or-explicit-lag
      - title: Make drift detectable and rebuilding safe
        brief: Require a source-based comparison and a rebuild guarantee that accounts for concurrent
          changes and identifies when the replacement is usable. Record the owner and reader behaviour
          if repair fails; link replacement procedures and operational scheduling to evolution and operations.
          A value that cannot be recovered from the alleged source requires revisiting the source-of-truth
          decision, not a more elaborate refresh procedure here.
        anchor: make-drift-detectable-and-rebuilding-safe
      anchor: give-every-derived-copy-a-maintenance-contract
    - title: Defend the design with changes and counterexamples
      brief: 'Finish with a compact review of the worked schema: identify keys and dependencies, demonstrate
        reconstruction without extra combinations, account for independent and correlated sets, and locate
        enforcement for each rule. Exercise one correction, one deletion and competing total updates;
        specify the promised reader result and recovery after an interrupted refresh. Retain a redundant
        result only with its maintenance contract and measured benefit. Distinguish paper reasoning, illustrative
        schedules and any later engine execution evidence; do not claim these design checks establish
        performance or concurrent correctness on their own.'
      anchor: defend-the-design-with-changes-and-counterexamples
- id: a12
  href: /review/relational-next/history/
  article:
    topic: Relational history and data lifecycle design
    title: Modelling history and data lifecycles
    brief: Teach how to choose among current-state rows, immutable snapshots, change records and effective-dated
      versions for concrete relational requirements. Distinguish when a fact applied from when the database
      recorded it, introducing both dimensions only when late information and corrections require them.
      Design version identity, historical references, interval boundaries and overlap rules so point-in-time
      questions have a defined answer. Compare status changes, tombstones, archival and deletion through
      their effects on references, uniqueness, reporting, retention and erasure. Bound the evidence that
      history rows provide and the removal achieved by deleting live rows; refer operational procedures
      and live lifecycle changes to their owning branches.
    heading:
    - title: Start with the questions the past must answer
      brief: Extend the booking example with a changed customer address, an agreed price, a cancellation
        and a corrected room assignment. Ask separately what is true now, what was agreed at booking,
        what applied on a given date and what the system knew when it issued a report. Identify the question,
        owner and required retention before choosing a history pattern. Keep the simple current-state
        design where no historical answer is required.
      anchor: start-with-the-questions-the-past-must-answer
    - title: Store the facts each question needs
      brief: Compare four representations against those questions, showing what an overwrite loses and
        what retaining a row still fails to explain. A schema may combine representations when they serve
        distinct requirements.
      heading:
      - title: Preserve an agreement with a snapshot
        brief: Preserve the address and price agreed for a booking independently of later customer or
          catalogue edits. Explain why this is a historical fact with its own meaning, rather than an
          accidentally stale current value. Choose the snapshot boundary and capture time; refer dependency
          reasoning and maintenance of derived copies to the normalisation article.
        anchor: preserve-an-agreement-with-a-snapshot
      - title: Record changes when the sequence matters
        brief: Contrast a row containing the current cancellation status with records of requested, confirmed
          and reversed changes. Define whether a change record captures an action, a before-and-after
          difference or a complete resulting state. Show the information needed to reconstruct a state
          and why timestamps alone need not establish an unambiguous change order. Do not expand into
          an event-sourcing architecture.
        anchor: record-changes-when-the-sequence-matters
      - title: Use effective-dated versions for facts with a period of applicability
        brief: Model a room's capacity or a customer's contractual rate over time when questions concern
          which value applied during a period. Distinguish this requirement from merely keeping every
          overwritten row. Compare explicit applicability periods with a history of recorded changes without
          turning the comparison into a catalogue of temporal features.
        anchor: use-effective-dated-versions-for-facts-with-a-period-of-applicability
      anchor: store-the-facts-each-question-needs
    - title: Separate an entity from its versions
      brief: Give the enduring entity and each stored version clear identities. Decide whether a booking's
        reference means the current customer, a particular customer version or the customer details preserved
        in the agreement. Show how following a reference to today's row can change a historical report.
        Preserve tenant scope in entity and version references and in uniqueness; use the constraints
        article for enforcement mechanisms.
      anchor: separate-an-entity-from-its-versions
    - title: Define time boundaries and correction rules
      brief: Make a point-in-time answer precise before implementing it. Use a small timeline and expected
        query results; refer timestamp and time-zone representation to the value-representation article.
      heading:
      - title: Make each instant resolve to a defined version
        brief: Choose inclusive starts and exclusive ends, represent the current open end deliberately,
          and state whether gaps or overlaps are valid for this fact. Test the exact instant where one
          version gives way to another and a query spanning that boundary. Distinguish per-entity version
          overlap from the separate problem of conflicting bookings. State the required invariant and
          link to constraints and transactions for safe enforcement.
        anchor: make-each-instant-resolve-to-a-defined-version
      - title: Add recorded time only when corrections require it
        brief: Use a rate change entered late to distinguish when the rate applied from when the database
          learned it. Compare a corrected account of a past date with reproducing the report issued before
          the correction. Introduce two time dimensions only when both answers are required, defining
          what a correction supersedes and which prior assertion remains queryable. Explain that an automatically
          maintained row history must be checked against these semantics rather than assumed to encode
          business time.
        anchor: add-recorded-time-only-when-corrections-require-it
      anchor: define-time-boundaries-and-correction-rules
    - title: Decide what leaving the active set means
      brief: Compare cancelling a booking, marking a customer deleted, retaining a minimal tombstone,
        moving history to an archive and physically deleting rows. Choose from required behaviour rather
        than treating a deleted flag as a complete lifecycle policy.
      heading:
      - title: Follow references, uniqueness and reports through removal
        brief: State whether historical bookings remain meaningful after a customer leaves, which identifying
          details remain and whether a former identifier may be reused. Show how inactive rows affect
          uniqueness, joins and counts, and how forgetting the active-row condition exposes them to ordinary
          queries. Treat archival as a change in availability and access path, not proof of deletion.
          Refer constraint actions and conditional uniqueness to their owning article.
        anchor: follow-references-uniqueness-and-reports-through-removal
      - title: Specify retention and erasure beyond the row
        brief: Separate the design requirement to retain business evidence from the requirement to remove
          or minimise identifying data. Identify copies in history tables, snapshots, derived results,
          replicas, exports and backups; deleting a live row alone does not define their lifecycle. Produce
          a retention and removal requirement for operations to implement, including what a restore must
          do with previously removed data. Keep jurisdictional requirements explicit inputs and leave
          removal and restore procedures to operations and live schema changes to evolution.
        anchor: specify-retention-and-erasure-beyond-the-row
      anchor: decide-what-leaving-the-active-set-means
    - title: Test what the history can truthfully establish
      brief: 'Walk one booking through creation, agreement, a later profile edit, a backdated correction,
        cancellation and eventual removal. Write expected answers for today''s view, the applicable past
        state and any required as-recorded report, including boundary instants and missing history. Inventory
        who can alter history and how changes are captured: stored history alone does not prove completeness,
        attribution or resistance to tampering. Hand access and audit requirements to security, concurrency
        cases to transactions and live conversion work to evolution. Finish with the smallest design that
        answers the agreed questions throughout the lifecycle.'
      anchor: test-what-the-history-can-truthfully-establish
scope_boundary: 'Use the actual parent, sibling and child plans: teach a useful high-level answer here,
  introduce deeper questions in context, and leave their detailed mechanisms/procedures with the owning
  child. Do not duplicate a sibling. A parent must still teach a complete useful first case, not just
  advertise links.'
