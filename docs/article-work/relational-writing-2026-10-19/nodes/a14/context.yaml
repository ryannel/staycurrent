article:
  topic: SQL joins, cardinality and aggregation
  title: Joining and summarising data
  brief: 'Build correct multi-table application queries and reports by keeping the meaning of one result
    row explicit. Develop join cardinality, outer-join filtering, grouping, counts, conditional totals
    and the repair of double-counting with a small connected set of checked examples. Follow the parent-first
    reading path. Before the first worked task, tell contextual entrants to read Working with SQL''s section
    Express a larger question in checkable stages: its small staged query supplies the derived-table or
    CTE notation used here. Assume that section alongside the parent''s first join and grouped query;
    concentrate on cases that produce plausible wrong answers. No composition tutorial or prerequisite
    visit to Composing larger SQL queries is needed. Identify the example engine and consequential dialect
    behaviour at first use. Keep detailed existence and membership semantics with Composing larger SQL
    queries, expression semantics with Getting SQL values right, and execution methods and costs with
    performance. This article supplies the depth needed for expert relational practice without a further
    reporting or join-specialist branch.'
  heading:
  - title: State what one result row represents
    brief: Start from a report requiring one row per customer with order value and payment value, including
      customers without activity. State which details qualify, what zero and unknown mean, and whether
      totals refer to all time or a chosen period. Establish customer, order, order-line and payment keys
      and relationships. Predict the result columns and hand-calculate a tiny expected result before extending
      the parent's basic join example. Reuse these facts through the article rather than introducing a
      new domain for every SQL feature.
    anchor: state-what-one-result-row-represents
  - title: Follow the matches a join produces
    brief: Trace one-to-one, one-to-many and many-to-many matches as pairs of source rows, preserving
      duplicates unless the question explicitly removes them. Predict per-key multiplicity before running
      a join; test missing and incomplete join predicates, non-unique matching columns and composite keys.
      Use a short employee-to-manager self-join to explain independent aliases and missing managers, without
      opening a hierarchy-traversal lesson. Show why selecting customers with any qualifying order through
      the parent's presence test does not multiply customer rows; link to Composing larger SQL queries
      for EXISTS and membership detail. Leave physical join algorithms and their costs to performance.
    anchor: follow-the-matches-a-join-produces
  - title: Preserve unmatched rows deliberately
    brief: Follow a LEFT JOIN through a customer with no orders and one with only out-of-period orders.
      Compare a detail predicate in ON with the same predicate in WHERE and show the resulting retained
      or rejected rows. Locate null-extended rows separately from matched detail rows whose attributes
      are null; use a guaranteed non-null detail key when testing for a missing match. Keep full and right
      joins to a brief explanation only if needed to interpret the example or reverse the preserved side.
      Link to SQL values for three-valued logic instead of reteaching it.
    anchor: preserve-unmatched-rows-deliberately
  - title: Group at the level the question asks for
    brief: Derive GROUP BY keys from the result-row contract, grouping by stable customer identity rather
      than merging customers with the same display name. Show how adding a grouping column changes the
      result's level of detail and why selecting an ungrouped value needs a defined rule; use explicit
      grouped columns and flag consequential engine differences in functional-dependency allowances. Separate
      filtering source rows with WHERE from filtering completed groups with HAVING. Require explicit final
      ordering when the report promises an order. Contrast grouped totals with retaining individual rows,
      linking to Calculating across related rows for the latter task.
    anchor: group-at-the-level-the-question-asks-for
  - title: Make counts, missing values and conditional totals agree
    brief: Compare COUNT(*), COUNT(detail_key), COUNT(nullable_value) and COUNT(DISTINCT value) on the
      same outer-joined rows. Explain which rows or non-null values each counts and what distinctness
      removes. Contrast a global aggregate over empty input with a grouped query that has no groups, then
      show how retained customers can still produce zero-detail rows. Establish SUM and other relevant
      aggregate null behaviour in the named engine. Choose COALESCE only after deciding whether absence
      means zero or unknown. Derive paid and unpaid totals with CASE inside an aggregate, naming FILTER
      as an engine-supported alternative where useful. Keep arithmetic and null-expression details with
      Getting SQL values right.
    anchor: make-counts-missing-values-and-conditional-totals-agree
  - title: Combine independent totals without multiplying them
    brief: Give one customer multiple orders and multiple payments, show the two detail sets and paired
      join rows, and ask the reader to predict both totals before explaining how they become overstated.
      Repair the report by aggregating each independent detail at customer level before joining those
      results to customers. Show the intermediate order and payment subtotals, each with one row per customer,
      beside the final join. Use only the derived-table or CTE notation from the stated prerequisite,
      Working with SQL's section Express a larger question in checkable stages. Verify at most one row
      per customer in each intermediate result and preserve absent details explicitly. Explain why DISTINCT
      on final rows, SUM(DISTINCT amount), or a distinct count cannot generally repair unrelated totals;
      equal-valued legitimate payments must survive. Add a subtotal only if the chosen report actually
      needs one, distinguishing a subtotal marker from an ordinary null and checking against double-summing
      subtotal rows. Do not expand into a catalogue of grouping extensions.
    anchor: combine-independent-totals-without-multiplying-them
  - title: Prove the report against awkward data
    brief: 'Finish with a compact adversarial fixture set targeting this article''s additional failure
      cases: no activity, several details on each side, repeated legitimate amounts, duplicate display
      names, a nullable measured value, an out-of-period detail and empty qualifying input. Compare complete
      expected rows, per-customer totals and a separately calculated overall total; check one result row
      per promised key and explicitly requested ordering. Introduce an incorrect predicate or extra join
      to demonstrate that the checks detect the wrong answer. Record named-engine results and distinguish
      hand-derived expectations from observed execution. Passing correctness checks does not establish
      acceptable execution cost; hand that diagnosis to the performance branch.'
    anchor: prove-the-report-against-awkward-data
