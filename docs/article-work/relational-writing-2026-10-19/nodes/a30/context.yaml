    level: 2
neighbours:
- id: a29
  slug: schema-changes
  title: Changing schemas without breaking applications
  brief: Turn an intended schema change into an executable, interruptible procedure with measured limits
    on production impact. Use PostgreSQL 18 as the worked engine, pinning the exact server and migration-tool
    versions before writing runnable examples. Reuse the parent's application-compatibility sequence and
    concentrate on locks, queued work, scans, rewrites, dependencies and deployment restrictions. Develop
    staged constraint validation and a large column-type change, then use a compact operation table to
    cover related column, index and table changes. Give every stage preconditions, transaction boundaries,
    completion evidence and a response to failure. Link the data-job and operations owners for their procedures;
    do not create a separate article for each DDL command or engine.
  parent: a06
  href: /review/relational-next/schema-changes/
  children: []
  sections:
  - title: Describe the physical change before scheduling it
    anchor: describe-the-physical-change-before-scheduling-it
