article:
  topic: Relational backfills, imports and corrections
  title: Running reliable data changes
  brief: Teach resumable, idempotent data jobs through one backfill that converts the order system's delivery
    address into a structured representation while orders continue to change. Develop an explicit input
    contract, complete work coverage, protection against stale writes, atomic progress and recovery after
    an uncertain batch outcome. Bound the effect on the live workload and reconcile meaning as well as
    row coverage. Contrast external imports and production corrections only where their input, duplicate
    or recovery contracts change the procedure. Reuse the parent's application compatibility argument
    and link transaction guarantees, request retries and operational diagnosis rather than teach them
    again. Verify executable procedures against the selected engine and version.
  heading:
  - title: Define what each changed row must mean
    brief: Start with a parser that can misinterpret an address or reject it, rather than treating the
      job as a loop around UPDATE. Specify the authoritative source, transformation version, source identity
      and required invariant; distinguish a legitimate empty value from a row awaiting processing. Define
      acceptable, invalid and ambiguous inputs and their recorded dispositions. Give the job a durable
      identity and keep enough source and outcome evidence to explain or repair a result. Establish the
      parent's prerequisite that all active and delayed writers follow the agreed representation protocol.
    anchor: define-what-each-changed-row-must-mean
  - title: Define a set of work that can actually be finished
    brief: 'Compare a durable worklist with a traversal ordered by an immutable unique key. Show why offsets
      over changing rows can skip work, and why a largest allocated identifier or timestamp alone is not
      a commit boundary: a lower identifier can become visible after the cursor has passed it. Choose
      one complete protocol for the example, combining an explicit enumeration boundary with writers that
      maintain the new representation and a catch-up check for work that became visible later. State the
      handling of inserts, deletes and eligibility changes during the run. Checkpoints must describe accounted-for
      work, including quarantined and deferred rows, rather than merely the greatest key observed. Avoid
      a long-lived snapshot unless its workload and retention costs are accepted.'
    anchor: define-a-set-of-work-that-can-actually-be-finished
  - title: Stop the backfill from overwriting a newer address
    brief: Interleave a worker read, an application edit and the attempted worker write. Work through
      a conditional update guarded by a source version that every relevant writer advances, or another
      explicitly verified protocol. Derive the structured value from the guarded source and inspect the
      actual affected rows. A failed condition means re-read, defer or record a conflict; it must not
      silently count as successful conversion. Account for deleted rows without recreating them. Explain
      how writers preserve the invariant after a row has been processed. Link isolation and locking mechanisms
      and check the concrete update semantics for the chosen engine.
    anchor: stop-the-backfill-from-overwriting-a-newer-address
  - title: Commit the batch and its progress together
    brief: Put row changes, recorded dispositions and durable progress in the same transaction where possible.
      Walk through interruption before commit and a lost acknowledgement after commit. Recover through
      the durable job record and an idempotent replay rule, using the existing transaction and retry articles
      for the abort-versus-unknown distinction. Define the idempotency identity using the job, source
      record and relevant version; a retry must neither double-apply a correction nor skip an uncommitted
      effect. Begin with one worker. If concurrent workers are needed, require exclusive claims or disjoint
      work and prevent a replaced worker from advancing shared progress; do not introduce a general job-scheduler
      design.
    anchor: commit-the-batch-and-its-progress-together
  - title: Account for everything a row change can trigger
    brief: Inventory constraints, foreign keys, generated values, identities, triggers, change consumers
      and application side effects before the first batch. Apply dependent changes in a valid referential
      order and verify stored results after database-generated behaviour. Explain why bypassing the application
      can omit an intended effect, while reusing its normal write path can send unwanted notifications
      or duplicate external actions. Choose deliberately which effects the job produces and how their
      delivery is recorded and reconciled, linking application integration for atomic handoff and external
      deduplication. Keep constraint and index deployment in the schema-change sibling.
    anchor: account-for-everything-a-row-change-can-trigger
  - title: Keep each batch inside the workload budget
    brief: Select and rehearse batches using transaction duration, lock waits, rows touched, logging,
      storage growth and replica lag as well as row count. Show that a small result set can still require
      a large scan or expensive trigger work. Use observed request latency and database pressure to reduce
      batch size, concurrency or rate, or pause at a committed boundary. Define cancellation conditions
      and record the last durable progress before resuming. Link operational signals and query diagnosis;
      teach the job's control decisions without rebuilding monitoring or maintenance guidance.
    anchor: keep-each-batch-inside-the-workload-budget
  - title: Adapt the input contract for imports and corrections
    brief: Reuse the same job and batch method. For an import, stage raw input when validation, deduplication
      or review must precede live changes; preserve a source identifier and input version, validate parsing
      and relationships, and state whether duplicate input is rejected, merged or replaces a prior version.
      Require a deliberate conflict policy for existing live rows; an upsert alone does not establish
      business correctness. For a correction, record the expected faulty state and intended replacement,
      guard against subsequent legitimate edits and preserve before-images where reversal is required.
      Explain why blindly restoring those before-images later could erase valid intervening changes. Do
      not repeat complete import and correction walkthroughs or develop a separate ingestion curriculum.
    anchor: adapt-the-input-contract-for-imports-and-corrections
  - title: Prove completion before removing the machinery
    brief: Reconcile the declared source scope with accepted, rejected, conflicted and outstanding records
      using identities and versions. Demonstrate checks for missing rows, unexpected rows, duplicates,
      broken relationships and semantically wrong transformations; equal counts alone cannot establish
      correctness. Validate changing source and destination data against a consistent boundary or the
      established writer protocol, rather than comparing unrelated live snapshots. Require all deferrals
      to be resolved or explicitly accepted and show that new writes preserve the invariant. Record the
      transformation version, scope, reconciliation results, exceptions and remaining recovery options.
      Hand evidence to the parent's read-switch and retirement gates; retain or remove staging, before-images
      and job records under their agreed retention policy.
    anchor: prove-completion-before-removing-the-machinery
