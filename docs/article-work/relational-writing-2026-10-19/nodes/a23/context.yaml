neighbours:
- id: a20
  slug: connections
  title: Managing connections and transaction lifetimes
  brief: Teach how to own a stateful database connection from acquisition to safe reuse or disposal, including
    exceptions, cancellation, streaming and shutdown. Separate application handles, pool leases, transactions
    and database sessions; verify their relationship against the chosen driver and any proxy. Diagnose
    occupied pools using acquisition wait, lease duration, active database work and connection counts,
    then bound admission and aggregate connection demand. Extend the parent's ordinary request example
    through resource failures rather than repeating it. Own cancellation and connection-reuse mechanics
    here; link to request recovery for deadlines, idempotency and decisions about uncertain operation
    outcomes, to transactions for correctness guarantees and to performance and operations for workload
    capacity and service budgets.
  parent: a04
  href: /review/relational-next/connections/
  children: []
  sections:
  - title: Know what a borrowed handle owns
    anchor: know-what-a-borrowed-handle-owns
    level: 2
  - title: Return only a connection that is ready for another borrower
    anchor: return-only-a-connection-that-is-ready-for-another-borrower
    level: 2
  - title: Cancellation is a cleanup sequence
    anchor: cancellation-is-a-cleanup-sequence
    level: 3
  - title: Match session state to the pooling mode
    anchor: match-session-state-to-the-pooling-mode
    level: 2
  - title: Keep result consumption inside the resource lifetime
    anchor: keep-result-consumption-inside-the-resource-lifetime
    level: 2
  - title: Bound demand before enlarging the pool
    anchor: bound-demand-before-enlarging-the-pool
    level: 2
  - title: Find where the lease time goes
    anchor: find-where-the-lease-time-goes
    level: 2
  - title: Prove cleanup across failures and shutdown
