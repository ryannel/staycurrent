  contributes only the depth needed for that original goal.
article:
  topic: Relational query composition and ORM behaviour
  title: Controlling the queries your application performs
  brief: Make handwritten SQL, query builders and ORM operations accountable for the database work a request
    performs. Use one bounded order-list example to trace statements, round trips, returned rows and materialised
    objects; diagnose lazy loading, N+1 reads, joined collection multiplication and implicit writes. Choose
    projections, loading strategies and batch sizes that preserve the required result while bounding application
    work. Inspect pagination and streaming at the abstraction boundary, preserve binding and authorisation
    during composition, and test representative query and result bounds against the selected database
    and library. Build on the parent's ordinary request and security explanation; leave SQL semantics,
    physical execution tuning, connection cleanup and request recovery with their existing owners.
  heading:
  - title: Trace one request to its actual statements
    brief: Start with an order-list endpoint that displays a bounded set of orders, their customer names
      and item summaries. Write down the required response before comparing equivalent SQL, query-builder
      and ORM expressions. Capture the statements actually executed across request handling and response
      serialisation, with correlation to the request and transaction. Record statement count, database
      round trips, rows returned and objects retained separately; an abstraction call is not a measurement
      of any of these. Explain safe parameter observation through redacted values and types, and label
      invented traces as illustrations rather than observed behaviour.
    anchor: trace-one-request-to-its-actual-statements
  - title: Find the reads hidden behind object access
    brief: Follow the endpoint through its initial order query, customer access and item iteration. Show
      how a serializer or template can trigger additional reads after the apparent query has completed.
      Vary the number of parent records to expose repeated per-record loading, distinguishing it from
      a fixed set of intentional queries. Account for already-loaded relationships and identity-map reuse
      so a warm session does not hide the cold-request behaviour. Use explicit loading boundaries or supported
      checks against unexpected lazy loads where they make the request's work predictable.
    anchor: find-the-reads-hidden-behind-object-access
  - title: Choose a loading shape for the response
    brief: Compare a direct projection, a joined load and separate batched relationship queries for the
      same response. Count SQL rows, distinct entities and final response items rather than treating them
      as interchangeable. Include empty relationships and an order with many items to check meaning as
      well as work. Choose the shape from needed fields, relationship cardinality, round trips and transfer
      or allocation limits, rather than declaring one loading strategy universally best.
    heading:
    - title: See what joined collections multiply
      brief: Extend one order with two independent collections and trace the rows returned by their joined
        load. Verify how the selected library reconstructs entities and collections, including duplicate
        handling; deduplicated objects alone do not establish bounded transferred rows. Show when fetching
        the collections separately keeps the response's meaning while reducing repeated data. Link join
        semantics to the SQL owner and expensive execution to performance.
      anchor: see-what-joined-collections-multiply
    - title: Bound separate loads and batches
      brief: Fetch relationships for a bounded set of authorised parent identifiers, then attach them
        to the correct parents while retaining empty collections. Make parameter and batch limits explicit
        for the selected database, driver and library. Compare the resulting fixed batches with per-parent
        reads, and state how several statements interact with the request's required view of changing
        data. Use the transaction branch's guarantees when one consistent view is required; do not derive
        them again here.
      anchor: bound-separate-loads-and-batches
    anchor: choose-a-loading-shape-for-the-response
  - title: Keep pages and streams bounded through materialisation
    brief: Translate the SQL branch's chosen page and ordering contract through the application abstraction.
      Inspect whether a collection load or deduplication changes which parent records a limit applies
      to; where needed, select the bounded parent page first and load its related data afterwards. Bound
      child cardinality and response size as well as parent count. For a large sequential export, verify
      whether iteration actually limits driver buffering, object tracking and application retention. Show
      how processing in chunks can still retain every object accidentally. Identify the connection and
      transaction ownership that streaming requires and link cleanup and slow-consumer handling to the
      connection article. Do not introduce another pagination or cursor curriculum.
    anchor: keep-pages-and-streams-bounded-through-materialisation
  - title: Inspect the writes and transactions an abstraction introduces
    brief: Change a tracked object before issuing an apparent read and capture whether the selected ORM
      flushes pending writes, when the transaction begins and which connection executes each statement.
      Contrast flush with commit using the existing transaction guarantees. Inspect generated writes,
      optimistic concurrency conditions where configured, and whether bulk or raw-SQL operations leave
      tracked objects stale. Verify the selected library's documented behaviour and version rather than
      generalising across ORMs. Keep transaction ownership explicit across helper calls; leave transaction
      lifetime cleanup and recovery from errors to the neighbouring articles.
    anchor: inspect-the-writes-and-transactions-an-abstraction-introduces
  - title: Preserve binding and authority as queries are composed
    brief: Apply the parent's parameter-binding and authorisation rules to reusable filters, relationship
      loaders and query fragments. Trace the tenant or owner restriction through the initial query, separate
      relationship loads, counts and mutations, including a caller-supplied identifier from another tenant.
      Verify that raw fragments keep values bound and that dynamic SQL structure uses an allowed selection.
      Check how optional filters, aliases and global scopes compose instead of assuming a query builder
      supplies the request's authority. Link SQL null and predicate semantics to their owner rather than
      reteaching expression rules.
    anchor: preserve-binding-and-authority-as-queries-are-composed
  - title: Test the generated work as part of the operation's contract
    brief: Run representative integration tests through the real database, driver and abstraction, including
      response serialisation. Seed no related rows, ordinary rows, many parents, a high-cardinality child
      collection and cross-tenant identifiers. Assert response meaning, allowed statement or round-trip
      bounds, transferred or materialised result bounds where observable, and absence of unexpected writes;
      vary parent count so an N+1 regression cannot pass on a one-row fixture. Use library-specific expected
      ranges when batching changes counts, and avoid brittle full SQL string snapshots as the sole evidence.
      Recheck after loading changes or dependency upgrades. Hand a small number of individually costly
      statements and their parameters to the performance investigation rather than treating a low query
      count as proof of efficiency.
    anchor: test-the-generated-work-as-part-of-the-operation-s-contract
