- id: a23
  slug: background-work
  title: Connecting transactions to background work and events
  brief: Make work beyond a relational transaction discoverable and recoverable. Follow one committed
    order and its external fulfilment request through a transactional job or outbox record, worker ownership,
    repeated attempts and uncertain external outcomes. Compare direct calls and database change capture
    by their remaining failure windows. Bound event contracts, ordering, retention and replay to what
    is needed to account for committed intent; reuse transaction concurrency and request-idempotency mechanisms
    rather than deriving them again.
  parent: a04
  href: /review/relational-next/background-work/
