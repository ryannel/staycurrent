  title: Checking an embedded choice with SQLite
  brief: Decide whether SQLite can meet one application's relational requirements in its intended deployment.
    Trace file ownership, connections and transactions to writer contention, durability and recovery obligations;
    verify the actual library, driver and settings with small acceptance cases. Produce a defensible adoption
    decision and starting configuration. Reuse the common transaction, integration, performance and operations
    methods rather than teach them again; this is an optional candidate check, not a SQLite internals
    curriculum.
