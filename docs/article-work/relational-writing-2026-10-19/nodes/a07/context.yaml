- id: a35
  href: /review/relational-next/security/
  article:
    topic: Securing relational services
    title: Securing a relational service
    brief: Teach how to build and verify operational access boundaries around a relational database, using
      one service's application, migration, reporting, backup and emergency access tasks. Connect network
      reachability, identity, privileges, ownership, encryption and audit evidence to what each actor
      can actually do. Develop safe rotation, revocation and compromise response with selected-engine
      checks and explicit managed-service responsibilities. Keep application query safety and application
      authorisation in integration, restoration procedures in backups, and the common incident decision
      method in service operations. Follow the parent-first reading route through Running a relational
      service; readers entering here directly should read its section Recover the incident without destroying
      the evidence before this article's final compromise exercise. This article supplies the operational
      security depth needed for relational practice; it does not open a general security architecture
      branch.
    heading:
    - title: Turn access needs into testable boundaries
      brief: 'Start with a small service whose application reads and changes orders, deployment job changes
        schema, reporter reads a restricted dataset and backup operator preserves recovery copies. Map
        each identity to its connection route, permitted operations, objects and duration of access, then
        name the actions it must be unable to perform. Include database hosts or files, provider control
        planes, exports and recovery copies: SQL grants alone do not describe every route to the data.
        Separate service-owner duties from managed-service guarantees and restrictions using the parent''s
        responsibility map rather than reproducing its operating introduction.'
      anchor: turn-access-needs-into-testable-boundaries
    - title: Admit only the intended connections
      brief: Trace a connection from a workload to the database through address exposure, network policy,
        server admission rules and authentication. Explain why reachability, authenticated identity and
        permission to use data are separate checks. Choose private or explicitly restricted connection
        paths, including administrator and maintenance routes, and verify both accepted and rejected connections
        from representative locations. Check the engine's rule ordering, local socket or file access,
        authentication methods and managed endpoint behaviour where those alter the boundary; avoid a
        general networking course.
      anchor: admit-only-the-intended-connections
    - title: Give each job the authority it needs
      brief: Build the worked service's role and privilege design from concrete tasks. Separate login
        identities from reusable privilege roles where supported; distinguish object use, ownership, role
        membership, grant authority and administrative powers. Keep the ordinary application identity
        from owning its schema or performing deployment operations. Follow one new table or routine through
        creation and access to expose inherited, public and default privileges, namespace resolution and
        privileged execution paths that can undermine the intended design. Check selected-engine semantics
        rather than present portable grant syntax. Introduce row or column restrictions only when the
        database enforces a required boundary, testing ownership and administrative bypasses; link application
        authorisation to integration.
      anchor: give-each-job-the-authority-it-needs
    - title: Protect connections, copies and the keys that unlock them
      brief: Distinguish encrypted traffic from authenticated server identity, then configure a connection
        that verifies the expected server and rejects an untrusted certificate or wrong name. Explain
        client certificates only where they are the chosen authentication method. Map encryption at rest
        across database storage, logs, temporary data, backups, snapshots and exports; identify who can
        decrypt each copy and which administrators remain trusted. Verify the selected engine or service's
        actual coverage and restrictions. Connect key access, retention and recoverability to the backup
        article's restoration rehearsal so encryption neither creates an unnoticed plaintext copy nor
        makes an otherwise valid recovery copy unusable.
      anchor: protect-connections-copies-and-the-keys-that-unlock-them
    - title: Change credentials without losing control of access
      brief: 'Walk through rotating one application credential and one expiring certificate or trust root:
        inventory consumers, introduce the replacement, update and reconnect clients, verify use, then
        retire the old material. Include pools, scheduled jobs, replicas and backup clients where relevant.
        Keep secrets out of source, connection logs and broadly readable runtime configuration. Test what
        credential expiry, role changes and revocation do to existing sessions as well as new connections,
        and require an explicit session termination step where necessary. Distinguish provider-managed
        rotation promises from consumer updates the operator must still perform.'
      anchor: change-credentials-without-losing-control-of-access
    - title: Prove permitted work succeeds and forbidden work fails
      brief: Turn the initial access map into a repeatable verification exercise using the real connection
        path and each effective identity. Demonstrate permitted reads and writes alongside rejected cross-boundary
        reads, schema changes, privilege grants and unauthorised connections. Include newly created objects,
        role inheritance and recovery-copy or control-plane access in the relevant tests. Use disposable
        data or an isolated environment for destructive attempts; retain expected outcomes, observed results
        and the tested engine, service and configuration. Repeat after changes that can alter access and
        explain what these bounded tests leave unproven. Clearly label any diagram or simulated access
        matrix as an illustrative model.
      anchor: prove-permitted-work-succeeds-and-forbidden-work-fails
    - title: Leave useful evidence and a controlled emergency route
      brief: Select audit records for connection attempts, privileged operations, grant and ownership
        changes, and access to sensitive data or recovery copies where supported. Preserve actor, time
        and affected object while limiting sensitive statement values and credential exposure. Establish
        retention, independent protection and access to records, and verify what the chosen engine and
        managed service can record before relying on them. Distinguish operational logs from a complete
        account of data access. Provide a separately controlled, short-lived emergency identity whose
        use is attributable, tested, revoked and reviewed; account for provider or identity-service failure
        without making the ordinary application an administrator.
      anchor: leave-useful-evidence-and-a-controlled-emergency-route
    - title: Revoke compromised access and verify the boundary again
      brief: 'Recall the incident sequence from Running a relational service, section Recover the incident
        without destroying the evidence, without repeating its runbook. Apply it to suspected theft of
        the application credential. Identify the affected identities and routes, preserve available evidence,
        restrict exposure, revoke or replace credentials and terminate relevant sessions using verified
        engine procedures. Inspect role memberships, ownership, new objects, scheduled work and copied
        data according to the authority the identity actually held. Distinguish stopping further access
        from establishing what was read or changed: rotation cannot recover disclosed data or prove its
        integrity. Set explicit checks for restoring access and hand possible data repair to the restoration
        owner; finish by rerunning the positive and negative tests and recording remaining uncertainty.
        Keep this database-specific response within the common incident process rather than creating another
        incident article.'
      anchor: revoke-compromised-access-and-verify-the-boundary-again
- id: a36
  href: /review/relational-next/monitoring-and-capacity/
  article:
    topic: Relational service monitoring and capacity
    title: Monitoring and sizing a relational service
    brief: Teach practitioners to establish deployment visibility, maintain capacity and growth budgets,
      reserve normal and degraded headroom, and act on useful alerts before a service reaches a limit.
      Produce a dashboard, an evidence-routing table and capacity worksheets tied to service objectives
      and intervention lead times. Reuse the workload measurement and load evidence from Improving performance
      under concurrent load (a28), the sole owner of deep concurrent-workload diagnosis. Link to the owning
      maintenance, topology and restoration procedures for their operational evidence and actions.
    heading:
    - title: Build the dashboard the deployment can support
      brief: Start from the important application operations, availability and latency objectives, expected
        demand and recovery requirements established for the service. Inventory engine views, host or
        container metrics, provider metrics, application instrumentation and external checks. Record collection
        intervals, permissions, overhead, visibility gaps and the limits that require provider intervention
        in a managed service.
      heading:
      - title: Apply the workload measures to one service view
        brief: Build a compact dashboard showing application outcomes, database latency, completed work,
          queues and waits alongside CPU, memory, I/O, free space, connection limits, retained versions,
          log growth and replica lag where applicable. Include a brief local legend naming the displayed
          time window and whether each measure covers an application operation or an engine request; distinguish
          a rate per unit of time from a gauge at a sampling point. Define completed, failed and rejected
          work at that boundary and queued work still awaiting service, labelling any overlapping provider
          categories. Link a28 for deeper interpretation without requiring its full investigation to read
          this dashboard. Label engine and provider definitions and add workload, deployment and maintenance
          annotations. Each panel must support an operating decision or a route to further investigation.
        anchor: apply-the-workload-measures-to-one-service-view
      anchor: build-the-dashboard-the-deployment-can-support
    - title: Route a changed signal with its evidence
      brief: Supply a small table with observed service change, evidence to retain and the owning diagnostic
        or incident procedure. Route rising latency or queueing to a28, a specific query to execution-plan
        diagnosis, retained versions or abnormal log growth to maintenance and replication, lost writer
        availability to topology, and suspected damage to the parent's incident method and restoration.
        Retain the relevant time window, workload and deployment changes, engine observations and logs
        before actions erase them. The table chooses a destination; it does not repeat a latency-regression
        investigation or the common containment procedure.
      anchor: route-a-changed-signal-with-its-evidence
    - title: Forecast space and the time left to act
      brief: Produce a capacity worksheet with measured starting sizes, growth assumptions, retention
        periods, uncertainty and the owner of each limit. Separate local engine storage, remote retained
        copies and provider quotas without double-counting physical allocations. Record where the selected
        engine and deployment supply each measurement.
      heading:
      - title: Include retained and temporary allocations
        brief: Budget table data, indexes, engine overhead, retained row versions, transaction logs and
          independent backup copies. Include consumers that can delay log removal, plus peak temporary
          work, ingestion, rebuilds, upgrades and restore staging using their documented procedures. Estimate
          growth from observed bytes and planned workload changes; distinguish reserved capacity from
          immediately usable space.
        anchor: include-retained-and-temporary-allocations
      - title: Compare growth with intervention lead time
        brief: Calculate time to a hard limit under ordinary and adverse growth assumptions. Compare it
          with detection, investigation, provisioning and execution lead times, including quotas and expansion
          restrictions. Turn the result into a dated action threshold and a forecast-review date, rather
          than a universal free-space percentage.
        anchor: compare-growth-with-intervention-lead-time
      anchor: forecast-space-and-the-time-left-to-act
    - title: Reserve capacity for normal and degraded operation
      brief: Extend the worksheet to compute, memory, I/O and connections using the measured operating
        envelope from a28. Record ordinary peaks separately from failure, promoted-writer load, replica
        catch-up, backup or restore work and maintenance overlap. State which scenarios must retain ordinary
        objectives and which permit agreed reduced service; reserve headroom against those cases and provisioning
        delays.
      heading:
      - title: Accept the budget against existing evidence
        brief: Reuse a28's representative load method and results, and the bounded failover and restoration
          rehearsals from their owners. Check whether their data size, workload, deployment, background
          work and duration support this budget. State acceptance criteria for application outcomes, capacity
          limits and recovery time, plus the assumptions or evidence gaps that require a targeted recheck.
          Do not commission a second load-test tutorial or treat an untested forecast as demonstrated
          capacity.
        anchor: accept-the-budget-against-existing-evidence
      anchor: reserve-capacity-for-normal-and-degraded-operation
    - title: Turn capacity and service alerts into owned action
      brief: Derive urgent alerts from sustained user impact, rapid use of the allowed failure budget
        or imminent exhaustion of required capacity; route longer-horizon growth and upkeep signals to
        scheduled action. Give each an owner, retained evidence, response deadline and linked procedure.
        Use service objectives and intervention lead times to set thresholds, account for missing telemetry
        and verify delivery and response with bounded tests. Close the worksheet with who acts, when to
        escalate and which capacity assumption must be rechecked after a material workload, engine or
        deployment change. Delegate bottleneck diagnosis and the worked comparison of reducing work, changing
        limits or adding resources to a28; delegate topology changes to their operational owner. Check
        the resulting service outcome and update the capacity forecast.
      anchor: turn-capacity-and-service-alerts-into-owned-action
- id: a37
  href: /review/relational-next/maintenance-and-upgrades/
  article:
    topic: Relational service maintenance and upgrades
    title: Maintaining and upgrading a relational service
    brief: Teach practitioners to keep a relational service healthy and change its engine version through
      controlled, observable work. Connect required upkeep to the workload and engine mechanisms that
      create it; distinguish automatic work, operator intervention and managed-service duties. Build a
      maintenance and upgrade procedure with explicit resource and interruption budgets, compatibility
      checks, recovery choices and validation. Use a worked service example and current primary engine
      documentation for concrete procedures. Link to performance for storage and query mechanisms, to
      operations neighbours for monitoring, topology and restoration, and to live database changes for
      schema migration or database moves. Keep this as one practical article.
    heading:
    - title: Identify the work the service keeps creating
      brief: 'Introduce maintenance as work generated by normal operation, and upgrades as changes to
        the software that performs that work. Begin with a concrete service whose data, retained versions,
        logs and statistics change under load. Establish an engine- and deployment-specific inventory:
        what runs automatically, how completion is observed, what can fall behind and who can intervene.
        Refer to the parent''s responsibility map for managed versus self-managed boundaries; automatic
        work still needs evidence of progress.'
      anchor: identify-the-work-the-service-keeps-creating
    - title: Diagnose upkeep before choosing a command
      brief: Give readers a compact evidence-to-action table for the recurring duties below. Distinguish
        a backlog, an impediment to progress and a misleading expectation about reclaiming space. Check
        the selected engine's documented behaviour before prescribing an operation; link underlying storage
        and performance explanations instead of rebuilding them here.
      heading:
      - title: Clean up versions that are no longer needed
        brief: Explain the operational connection between retained row versions, cleanup progress and
          transactions or other consumers that can retain history. Inspect engine-specific progress and
          blockers, including any mandatory housekeeping whose delay threatens availability. Choose between
          removing a blocker, adjusting automatic work and a documented manual intervention. Keep transaction
          visibility theory in its owner.
        anchor: clean-up-versions-that-are-no-longer-needed
      - title: Keep planner statistics useful
        brief: Recognise workload or data changes that warrant checking statistics, inspect when collection
          ran and whether it completed, and schedule engine-supported refresh work with attention to cost.
          Distinguish statistics upkeep from diagnosing and tuning an individual query; follow the performance
          article when fresh statistics do not resolve the observed regression.
        anchor: keep-planner-statistics-useful
      - title: Account for retained logs
        brief: Identify why the engine retains logs and which recovery, archival or replication consumer
          governs release. Diagnose stalled consumption and retention growth using engine-supported controls.
          Establish that a retention setting is not proof of usable recovery coverage. Link to backups
          and topology for their policies and procedures; never present deleting active engine files as
          routine space reclamation.
        anchor: account-for-retained-logs
      - title: Decide whether storage or indexes need intervention
        brief: Separate reusable space inside engine files from space returned to the filesystem, and
          recurring cleanup from heavier rebuild or compaction operations where the engine supports them.
          Require evidence of a useful outcome before scheduling expensive work. Check locks, temporary
          space, log generation and replica effects against the exact operation. Refer index selection
          and storage mechanics to performance; avoid universal periodic rebuild advice.
        anchor: decide-whether-storage-or-indexes-need-intervention
      anchor: diagnose-upkeep-before-choosing-a-command
    - title: Fit maintenance within the service budget
      brief: Turn one diagnosed upkeep problem into a scheduled change. Estimate duration, temporary space,
        additional I/O and logs, lock acquisition and interruption using representative evidence. Coordinate
        overlapping jobs, replica or archival consumers and backup windows through their owners. Set progress
        signals, stop conditions and a completion test; check whether stopping actually releases locks,
        space or work in the chosen engine. Show when reducing concurrency or using a maintenance window
        is the practical choice, rather than assuming every operation must run online.
      anchor: fit-maintenance-within-the-service-budget
    - title: Establish an upgrade path before choosing a date
      brief: Distinguish patch and major upgrades while checking the actual release notes, supported source-to-target
        paths and service restrictions for both. Inventory application drivers, SQL and configuration
        behaviour, collations, extensions and external tooling where relevant. Verify replica protocol
        or format compatibility, mixed-version restrictions, backup usability and restore tools for the
        intended path. Identify who controls timing and versions in a managed service. Compare the engine's
        supported in-place or replacement methods by interruption, resources and recovery options; link
        database-move mechanics to the live-change branch.
      anchor: establish-an-upgrade-path-before-choosing-a-date
    - title: Rehearse the upgrade and the way back
      brief: Use a representative isolated copy and the documented procedure for the exact versions and
        extensions. Run preflight checks, measure elapsed time and storage needs, and exercise the application
        workload and recovery dependencies. Practise a failed preflight and an interruption or failed
        validation at a meaningful point. Draw the point beyond which restarting old binaries is unsupported,
        and distinguish switching back to an intact old service from restoring an independent recovery
        copy. Account for writes accepted after cutover when judging loss and rollback feasibility; link
        to the restoration and live-change owners for those procedures.
      anchor: rehearse-the-upgrade-and-the-way-back
    - title: Execute with explicit gates
      brief: 'Present the worked upgrade as a concise runbook: verify prerequisites and recovery evidence,
        coordinate traffic and dependent jobs, perform the supported steps, observe progress and decide
        whether to continue, stop or invoke the rehearsed recovery path. Place go/no-go gates before costly
        or irreversible transitions and assign an operator to each decision. Show how replica compatibility
        and managed-service controls alter the sequence without duplicating failover design or the parent''s
        incident framework.'
      anchor: execute-with-explicit-gates
    - title: Prove completion and update the next run
      brief: Validate the intended maintenance outcome or engine version, object and extension state,
        application correctness, error rates, latency, resource headroom and upkeep progress against the
        pre-change baseline. Check replication, archival and backup work through their owning procedures,
        and establish recovery coverage for the new state before retiring the previous recovery option.
        Distinguish successful command completion from successful service operation. Record actual interruption,
        resource use, deviations and follow-up work so the next scheduled change uses evidence.
      anchor: prove-completion-and-update-the-next-run
- id: a38
  href: /review/relational-next/replicas-and-partitions/
  article:
    topic: Relational replication, failover and data placement
    title: Operating replicas and partitioned data
    brief: Choose and operate a relational topology against explicit availability, data-loss, recovery
      and read-freshness requirements. Follow changes from the writer to a replica, distinguish acknowledgement
      from replay and usable reads, then practise safe promotion, exclusion of the former writer, reconnection
      and rejoining. Decide whether local table partitioning preserves the schema and earns its continuing
      lifecycle cost, then distinguish it from distributing database ownership and assess the routing,
      transaction, movement and recovery costs of the latter. Use selected-engine and managed-service
      contracts and bounded failure rehearsals to establish what the deployment can actually deliver.
      Keep consensus theory, query tuning, application retry mechanics and backup restoration with their
      owners.
    heading:
    - title: Turn service requirements into a placement decision
      brief: Start with one relational service whose writers, readers and failure domains are visible.
        Specify acceptable interruption, lost acknowledged changes, freshness and latency for named failures
        before adding replicas or locations. Compare a larger single writer, read replicas, a standby,
        and distributed ownership by the requirement each addresses. Identify whether the proposed placement
        leaves shared dependencies that defeat the intended protection; reuse the parent's responsibility
        map for self-managed and hosted duties.
      anchor: turn-service-requirements-into-a-placement-decision
    - title: Follow a committed change to a replica
      brief: Use a change timeline to separate local commit, sending, receiving, durable storage and replay.
        Explain physical replication and logical change replication by their copied units and resulting
        compatibility, schema, object-coverage and promotion restrictions. Check those restrictions for
        the chosen engine and version rather than treating every replication target as an interchangeable
        standby.
      heading:
      - title: Decide what an acknowledgement promises
        brief: Compare asynchronous and synchronous acknowledgement at their documented stages and participating
          members. Trace what the client can be told during replica loss or a broken connection, which
          copies may contain an acknowledged change, and when writes wait or fail. Relate timeout, quorum
          or synchronous-member policy to the deployment's data-loss and availability requirements without
          developing a general consensus course. Link transaction outcomes and application reconciliation
          to their existing owners.
        anchor: decide-what-an-acknowledgement-promises
      - title: Keep the stream able to catch up
        brief: Distinguish transport backlog from replay backlog and explain why elapsed lag, bytes behind
          and application-visible freshness answer different questions. Establish retention and disk-pressure
          limits for a disconnected or slow member, including any mechanism that holds logs for it. Decide
          when catching up is feasible and when the documented rebuild path is required, linking service
          alerting and storage budgets to monitoring.
        anchor: keep-the-stream-able-to-catch-up
      anchor: follow-a-committed-change-to-a-replica
    - title: Send each read to a copy that can answer it
      brief: Classify reads by whether stale results are acceptable, a preceding write must be visible,
        or a transaction needs a documented consistent view. Explain how replay progress, routing, connection
        lifetime and engine-specific replica restrictions affect those choices. Work through a read immediately
        after an update and a read during replica lag; choose writer routing, a supported progress barrier
        or another documented service feature where appropriate. Include replica resource contention and
        query cancellation only where they change routing or operating policy, leaving query optimisation
        and client implementation elsewhere.
      anchor: send-each-read-to-a-copy-that-can-answer-it
    - title: Replace a writer without leaving two authorities
      brief: 'Develop one promotion runbook from a failed-writer scenario: establish the observed state
        and recovery budget, identify an eligible candidate and its recoverable position, exclude the
        former writer, promote through the supported mechanism, switch routing and validate service. Explain
        why inability to reach the old writer is insufficient evidence that it can no longer accept writes.
        Distinguish planned switchovers from unplanned promotion and state the go/no-go evidence for each
        step.'
      heading:
      - title: Reconnect clients and establish the result
        brief: Account for cached discovery, proxies, connection pools and existing sessions when changing
          the writer endpoint. Validate that new writes reach the intended authority and required reads
          see them. Record interruption and any lost acknowledged changes; hand uncertain request outcomes
          to application reconciliation rather than repeat its retry and idempotency procedures.
        anchor: reconnect-clients-and-establish-the-result
      - title: Rejoin or replace the former member
        brief: Keep the old writer excluded until its history and the new writer's history have been compared
          using supported procedures. Choose catch-up, rewind where supported, or replacement from an
          authorised source; verify required logs, compatibility, capacity and replica health before readmission.
          Link to the backup article when restoration supplies the replacement, without teaching a second
          restoration procedure.
        anchor: rejoin-or-replace-the-former-member
      anchor: replace-a-writer-without-leaving-two-authorities
    - title: Choose between local partitions and distributed ownership
      brief: 'First work one time-retained event table through a local-partition decision. Choose its
        partition key and boundaries from access patterns and retention work, accounting for skew and
        queries that span partitions; link measured pruning benefit to performance. Check the selected
        engine''s uniqueness, reference and index arrangements against the table''s invariants, distinguishing
        the intended logical rules from what the available objects enforce. Define the treatment of future,
        late and corrected rows when a partition is missing or a boundary changes, including corrections
        that move a row between partitions. Assign ownership of advance creation and retirement. For one
        attachment or removal, state the gates for proceeding, pausing and declaring completion: valid
        coverage of continuing writes, compatible schema and dependencies, verified data and required
        retention, and confirmed post-change routing and results. Link physical schema-change, locking
        and resource procedures to a29, live lifecycle and retirement procedures to a06, and ongoing capacity
        and alerting to monitoring. Finish with an explicit retain-or-reject decision against an ordinary
        unpartitioned table, counting the operating work as well as the measured benefit; do not build
        a partitioning catalogue or repeat those procedures. Then distinguish that local layout from assigning
        data and write ownership across database services. Show a relational workload whose demand cannot
        be met by moving reads alone, and evaluate whether distributing it is justified. Treat application-managed
        shards and an integrated distributed relational service as different operating contracts; inspect
        documented routing, placement and transaction guarantees rather than inferring them from the label.'
      heading:
      - title: Choose a key and trace work across owners
        brief: Follow a tenant or order key through routing, unique constraints, joins and transactions.
          Assess skew, hot keys, shared tables and operations without the routing key. Contrast colocated
          work with cross-owner work using the selected implementation's guarantees and latency costs.
          Keep local partition pruning with performance and correctness mechanisms with transactions;
          use them here to decide whether the placement satisfies the workload.
        anchor: choose-a-key-and-trace-work-across-owners
      - title: Move ownership and retain a recovery path
        brief: Explain how growth, skew or location requirements lead to moving data and changing routing.
          Require a documented cutover boundary, write authority, validation and rollback or forward-recovery
          option. Assess spare capacity, per-owner replica protection and recovery coordination, including
          whether a restore can establish the required cross-owner consistency. Link detailed live moves
          and restoration to their owners; do not create a resharding speciality.
        anchor: move-ownership-and-retain-a-recovery-path
      anchor: choose-between-local-partitions-and-distributed-ownership
    - title: Check the actual hosting and distribution contract
      brief: Apply the preceding questions to a managed high-availability service and a distributed relational
        deployment. Identify who detects failure, excludes writers, promotes or changes ownership, updates
        endpoints and repairs members. Check documented acknowledgement, read-consistency, placement and
        failure-domain settings, along with failover triggers, supported operator actions and service
        limits. Record which requirements depend on configuration or deployment shape rather than assuming
        that an availability label establishes them.
      anchor: check-the-actual-hosting-and-distribution-contract
    - title: Rehearse the failures that determine the choice
      brief: In a disposable, representative selected-engine deployment, rehearse a planned switchover,
        writer loss, loss of replica connectivity and a returning old writer; add an ownership or location
        failure when the chosen topology distributes data. Bound each fault and define stop conditions
        and cleanup before execution. Record acknowledged operations, replica progress, the authoritative
        writer, observed read results, reconnection, retention pressure and recovery time, then compare
        them with the requirement and documented contract. Keep illustrative timelines distinct from measured
        execution and state what the rehearsal does not establish. Finish with the evidence needed to
        accept the topology or revise the design.
      anchor: rehearse-the-failures-that-determine-the-choice
- id: a39
  href: /review/relational-next/backup-and-restore/
  article:
    topic: Relational backups and tested restoration
    title: Backing up and restoring relational data
    brief: Teach relational practitioners to choose recovery copies for named loss cases and prove that
      they can restore correct data within the required time and loss bounds. Follow one accidental-deletion
      case from backup selection through an isolated restoration and a controlled return to service, contrasting
      complete service loss where the procedure changes. Develop consistency, dependencies, retention,
      independent access, full and point-in-time restoration, selective recovery and measured validation.
      This is the shared restore procedure used by incidents, database moves and adoption checks; leave
      incident command, replica promotion, application reconciliation mechanics and migration design to
      their owners. Check executable procedures against the selected engine and service, and distinguish
      rehearsed results from intended recovery.
    heading:
    - title: Start with the loss you must recover from
      brief: 'Turn the parent''s recovery requirements into concrete cases: lost service storage, an accidental
        committed change, corruption discovered later, and loss of the account or credentials that control
        both production and its copies. Name the data and dependent services required, acceptable loss,
        interruption budget and detection delay. Explain why a surviving replica or a successful backup
        job does not by itself establish recovery from each case; link writer replacement to topology
        and incident selection to the parent.'
      anchor: start-with-the-loss-you-must-recover-from
    - title: Choose the copy that can reconstruct the required state
      brief: Compare recovery methods by the state they capture, the restore they permit, compatibility
        constraints and expected recovery work. Use the running case to choose a base copy and any subsequent
        history it needs, rather than treating the methods as interchangeable products.
      heading:
      - title: Logical exports preserve a selected representation
        brief: Develop consistent export scope, schema and data ordering, roles, extensions and other
          objects that may require separate capture. Explain how transaction boundaries and multi-database
          scope affect consistency. Evaluate portability and selective loading against type, collation,
          version and object compatibility, and account for rebuilding indexes and validating constraints
          during restore.
        anchor: logical-exports-preserve-a-selected-representation
      - title: Physical backups and snapshots need an engine contract
        brief: Explain what an engine-supported physical backup captures and which files, tablespaces,
          logs, configuration and versions must accompany it. Contrast a documented consistent or recoverable
          snapshot with an arbitrary copy of changing files. Check coordination across volumes and services,
          snapshot dependencies and restoration restrictions in the selected engine and hosting contract.
        anchor: physical-backups-and-snapshots-need-an-engine-contract
      - title: Point-in-time recovery needs a complete history
        brief: Connect a usable base backup to the required transaction-log chain and an identifiable
          recovery target. Explain how missing segments, incompatible history, retention gaps or an unsupported
          target defeat the intended restore. Verify the engine's target identifiers, granularity and
          inclusion rules; distinguish transaction-log recovery from selective replay of application intentions.
        anchor: point-in-time-recovery-needs-a-complete-history
      anchor: choose-the-copy-that-can-reconstruct-the-required-state
    - title: Keep recovery possible after production fails
      brief: Design retention around detection delay and the oldest state the cases require, including
        the dependency between retained base copies and logs. Track copy locations, catalogue metadata,
        checksums and job failures, while keeping restore evidence separate from copy completion. Evaluate
        independent copies against storage, region, administrative account and credential loss. Preserve
        recoverable encryption keys, restore identities, configuration and required external dependencies;
        use security's access and key controls. Identify who can delete copies or shorten retention and
        test access using the recovery identity.
      anchor: keep-recovery-possible-after-production-fails
    - title: Rehearse a full restore in isolation
      brief: Restore a representative backup into a clean destination with documented engine, extension
        and service prerequisites. Keep it isolated from live writers, queues and external side effects.
        Record retrieval, provisioning, decryption, restore, recovery and validation time, including constrained
        capacity and permissions. Establish full recovery before adding a target time so that a failure
        can be attributed to the base copy, missing dependencies or history rather than a vague failed
        drill.
      anchor: rehearse-a-full-restore-in-isolation
    - title: Recover to the last acceptable state
      brief: Develop the accidental-deletion case using retained evidence to choose a recovery boundary
        before the harmful change. Restore separately, apply the documented history and verify the resulting
        transaction boundary with known records. Treat wall-clock estimates as evidence requiring checks,
        and stop when the target or log chain cannot be established. For managed services, inspect documented
        recovery windows, granularity, restore-to-new destination behaviour, regional or account restrictions
        and configuration that is not restored automatically. Keep the current copy available for comparison
        and legitimate later work.
      anchor: recover-to-the-last-acceptable-state
    - title: Decide between replacing the database and repairing selected data
      brief: Show that returning the entire database to an earlier point can discard valid later changes.
        Compare a whole-service return with extracting the affected data from an isolated restore and
        applying a deliberate repair. Trace foreign keys, identifiers, dependent rows and concurrent updates
        so selective recovery is not presented as a safe table copy. Define the evidence, write coordination
        and application-domain reconciliation needed before merging; hand the implementation of corrective
        data work and external-effect reconciliation to evolution and integration. Make an unresolved
        conflict a reason to withhold cutover or repair.
      anchor: decide-between-replacing-the-database-and-repairing-selected-data
    - title: Prove readiness before returning traffic
      brief: Separate engine recovery completion from acceptable service state. Check integrity using
        supported engine tools, schema and object availability, representative data invariants, permissions
        and application workflows; compare against the chosen recovery boundary and expected loss. Define
        go/no-go criteria, exclusive write authority, connection and dependency changes, and a preserved
        fallback before the parent's incident procedure authorises reopening traffic. Record actual restored
        state, data loss, time to usable service, test scope and remaining gaps. Repeat rehearsals after
        material changes to data volume, versions, backup configuration or hosting, and let measured recovery
        determine whether the requirements are met.
      anchor: prove-readiness-before-returning-traffic
