- id: a03
  slug: transactions
  title: Making concurrent changes correct
  brief: Teach practitioners to state application invariants, choose transaction boundaries and preserve
    those invariants under concurrent execution and failures. Connect isolation anomalies to locking,
    versioned reads, conflict detection, constraints and serialisation, using labelled illustrative schedules
    and verified engine behaviour. Develop practical choices among atomic statements, conditional changes,
    locks and stronger isolation, including deadlocks, retries and uncertain commit outcomes. Explain
    the database's durability boundary and the limit of transactions across external effects; leave detailed
    client integration and service recovery procedures to their respective articles.
  parent: a00
  href: /review/relational-next/transactions/
