original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Operating and recovering relational services
  title: Running a relational service
  brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service against
    explicit availability, data-loss and recovery requirements. Connect those requirements to access boundaries,
    service signals, capacity, maintenance, topology, backup and incident procedures. Give readers the
    working model needed to choose a safe next action, with contextual articles developing the procedures
    and implementation differences. Distinguish self-managed duties from managed service contracts. Keep
    query tuning, application retry logic and live schema changes in their neighbouring branches, and
    the separate distributed-systems programme outside this branch.
  heading:
  - title: Define what the service must survive
    brief: 'Start with an ordinary application''s database, its users and its operating owner. Turn acceptable
      interruption, acceptable loss of acknowledged changes, recovery time and retained recovery history
      into explicit requirements for named failures. Distinguish service availability, data durability
      and data correctness: meeting one does not establish the others. Include dependencies such as identity,
      storage, keys, networking and the application connection path when defining recovery. Use a small
      failure-and-recovery table to show which mechanisms and evidence each requirement demands.'
    heading:
    - title: Assign every operating responsibility
      brief: Compare a self-managed installation with a managed service using the same responsibility
        checklist. Establish who patches, monitors, retains backups, controls keys, initiates failover,
        restores data and proves that applications can use the recovered service. Require documented limits,
        escalation paths and tested procedures rather than treating a service label or availability commitment
        as a recovery design.
      anchor: assign-every-operating-responsibility
    anchor: define-what-the-service-must-survive
  - title: Limit who can reach and change the data
    brief: Follow one application connection through network access, authenticated identity and database
      privileges. Explain why encryption in transit and at rest, least privilege, restricted administrative
      access and audit evidence solve different problems. Establish separate application, migration, monitoring,
      backup and emergency access needs, and include backup copies and recovery keys within the security
      boundary. Keep parameter binding and application injection prevention with the integration branch.
    nested_article:
      topic: Securing relational services
      title: Securing a relational service
      brief: Teach how to build and verify operational access boundaries around a relational database,
        using one service's application, migration, reporting, backup and emergency access tasks. Connect
        network reachability, identity, privileges, ownership, encryption and audit evidence to what each
        actor can actually do. Develop safe rotation, revocation and compromise response with selected-engine
        checks and explicit managed-service responsibilities. Keep application query safety and application
        authorisation in integration, restoration procedures in backups, and the common incident decision
        method in service operations. Follow the parent-first reading route through Running a relational
        service; readers entering here directly should read its section Recover the incident without destroying
        the evidence before this article's final compromise exercise. This article supplies the operational
        security depth needed for relational practice; it does not open a general security architecture
        branch.
      href: /review/relational-next/security/
    anchor: limit-who-can-reach-and-change-the-data
  - title: Observe the service before it reaches a limit
    brief: Start with successful and failed application work, latency and demand, then connect those observations
      to connections, active work, waits, CPU, memory, storage latency and free space. Include retained
      versions, transaction logs, replica lag and backup health where the selected system exposes them.
      Explain the difference between a symptom, a resource limit and a cause. Establish baselines and
      headroom for growth, maintenance and recovery, with actionable alerts and a first diagnostic step.
      Link query and workload diagnosis to the performance branch.
    nested_article:
      topic: Relational service monitoring and capacity
      title: Monitoring and sizing a relational service
      brief: Teach practitioners to establish deployment visibility, maintain capacity and growth budgets,
        reserve normal and degraded headroom, and act on useful alerts before a service reaches a limit.
        Produce a dashboard, an evidence-routing table and capacity worksheets tied to service objectives
        and intervention lead times. Reuse the workload measurement and load evidence from Improving performance
        under concurrent load (a28), the sole owner of deep concurrent-workload diagnosis. Link to the
        owning maintenance, topology and restoration procedures for their operational evidence and actions.
      href: /review/relational-next/monitoring-and-capacity/
    anchor: observe-the-service-before-it-reaches-a-limit
  - title: Make routine maintenance a controlled change
    brief: Explain how ordinary writes create ongoing storage and statistics upkeep, and why long transactions,
      retention and neglected maintenance can turn gradual growth into an outage. Give each operating
      change an owner, precondition, resource allowance, observation plan and recovery path. Distinguish
      routine upkeep, software patching and major-version upgrades; verify compatibility and recovery
      before altering the production service. Link storage mechanisms and query effects to performance
      and live schema changes to evolution.
    nested_article:
      topic: Relational service maintenance and upgrades
      title: Maintaining and upgrading a relational service
      brief: Teach practitioners to keep a relational service healthy and change its engine version through
        controlled, observable work. Connect required upkeep to the workload and engine mechanisms that
        create it; distinguish automatic work, operator intervention and managed-service duties. Build
        a maintenance and upgrade procedure with explicit resource and interruption budgets, compatibility
        checks, recovery choices and validation. Use a worked service example and current primary engine
        documentation for concrete procedures. Link to performance for storage and query mechanisms, to
        operations neighbours for monitoring, topology and restoration, and to live database changes for
        schema migration or database moves. Keep this as one practical article.
      href: /review/relational-next/maintenance-and-upgrades/
    anchor: make-routine-maintenance-a-controlled-change
  - title: Choose where reads and writes can safely run
    brief: Establish a single writable service as the initial topology, then introduce replicas, failover
      and partitioning through the particular availability, read load, locality or capacity problem each
      addresses. Trace an acknowledged write to a later read and a possible promotion, distinguishing
      replication progress, read freshness and protection from loss. Explain that replication does not
      replace retained recovery history. Introduce the operating costs and transaction boundaries of partitioned
      data without opening a separate distributed-systems curriculum.
    nested_article:
      topic: Relational replication, failover and data placement
      title: Operating replicas and partitioned data
      brief: Choose and operate a relational topology against explicit availability, data-loss, recovery
        and read-freshness requirements. Follow changes from the writer to a replica, distinguish acknowledgement
        from replay and usable reads, then practise safe promotion, exclusion of the former writer, reconnection
        and rejoining. Decide whether local table partitioning preserves the schema and earns its continuing
        lifecycle cost, then distinguish it from distributing database ownership and assess the routing,
        transaction, movement and recovery costs of the latter. Use selected-engine and managed-service
        contracts and bounded failure rehearsals to establish what the deployment can actually deliver.
        Keep consensus theory, query tuning, application retry mechanics and backup restoration with their
        owners.
      href: /review/relational-next/replicas-and-partitions/
    anchor: choose-where-reads-and-writes-can-safely-run
  - title: Prove that the data can be restored
    brief: Compare restoration after accidental deletion, storage corruption and loss of the service.
      Introduce consistent backups, retained transaction history and point-in-time recovery as recovery
      inputs whose coverage and limits must be checked. Include configuration, credentials, encryption
      keys, extensions and sufficient destination capacity in the recovery dependency list. A successful
      backup job is evidence of one step; a timed restoration and application-level validation establish
      what recovery can actually do.
    nested_article:
      topic: Relational backups and tested restoration
      title: Backing up and restoring relational data
      brief: Teach relational practitioners to choose recovery copies for named loss cases and prove that
        they can restore correct data within the required time and loss bounds. Follow one accidental-deletion
        case from backup selection through an isolated restoration and a controlled return to service,
        contrasting complete service loss where the procedure changes. Develop consistency, dependencies,
        retention, independent access, full and point-in-time restoration, selective recovery and measured
        validation. This is the shared restore procedure used by incidents, database moves and adoption
        checks; leave incident command, replica promotion, application reconciliation mechanics and migration
        design to their owners. Check executable procedures against the selected engine and service, and
        distinguish rehearsed results from intended recovery.
      href: /review/relational-next/backup-and-restore/
    anchor: prove-that-the-data-can-be-restored
  - title: Recover the incident without destroying the evidence
    brief: 'Teach one incident decision sequence in this article: establish impact and ownership, preserve
      evidence and recovery options, distinguish plausible causes, contain ongoing damage, select a prepared
      procedure and validate service and data before reopening traffic. Work through a compact contrast
      between overload and accidental deletion to show why relieving demand and recovering correct data
      require different actions. Add a failure-to-procedure table linking saturation, connection or lock
      blockage and exhausted capacity to monitoring and performance; compromised access to security; writer
      or host loss to topology; and corruption or operator error to restoration. Preserve useful logs,
      copies and recovery history before intervention. Define explicit go/no-go criteria for recovery
      and resumed traffic, including data validation, application reconnection and reconciliation handoffs.
      Record and communicate actual data loss and interruption, then repair the failed controls or runbook
      assumptions. Reuse the detailed procedures in their owning articles, verify any concrete engine
      steps, and label illustrative incident timelines clearly.'
    anchor: recover-the-incident-without-destroying-the-evidence
