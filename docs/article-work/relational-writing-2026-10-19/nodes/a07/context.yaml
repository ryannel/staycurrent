- id: a01
  slug: data-design
  title: Designing relational data
  brief: Teach an engineer to translate application facts, rules and access needs into a relational schema.
    Follow a booking application from ordinary requirements to tables, identities, relationships, value
    representations and enforceable rules, exposing the failures each decision prevents. Establish a practical
    account of normalisation and controlled redundancy, then account for history and deletion. Test the
    design with representative reads, changes and lifecycle scenarios. Develop specialised modelling only
    where it changes these relational decisions; leave query fluency, transaction protocols and live migration
    procedures to their neighbouring articles.
