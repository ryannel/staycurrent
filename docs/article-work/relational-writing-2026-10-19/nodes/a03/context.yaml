child_article_plans:
- id: a18
  href: /review/relational-next/locking/
  article:
    topic: Relational locking and concurrency protocols
    title: Designing changes that coordinate with locks
    brief: Teach practitioners to construct and assess explicit locking protocols for relational invariants
      that ordinary constraints or a conditional row change cannot express. Develop one reservation-capacity
      example using PostgreSQL at a stated isolation level, with primary-source checks and reproducible
      sessions required before presenting engine behaviour as established. Cover existing and missing
      rows, inserts, coordination rows, lock modes, acquisition order, waiting and deadlocks. Finish with
      an argument covering every writer and a two-session check. Link to isolation for interpreting engine
      contracts and to application integration for retry machinery; do not expand into a queue or lock
      catalogue.
    heading:
    - title: Identify the decision that needs protection
      brief: Start from a reservation rule whose decision reads several rows before inserting or changing
        a reservation. Reuse the parent's capacity example and show the uncovered interleaving in a labelled
        illustrative schedule. State the invariant, the decision's scope and the read-to-change interval
        that needs protection. Explain briefly why the available constraint or conditional single-row
        change does not settle this version of the rule, referring to the parent for the general choice
        of protection.
      anchor: identify-the-decision-that-needs-protection
    - title: Cover every change that could invalidate the decision
      brief: 'List the paths that reserve, cancel, move reservations, change capacity, delete resources
        or perform administrative corrections. Map each to the state it can invalidate and the coordination
        it must acquire before doing so. Distinguish locking existing rows from preventing new qualifying
        rows: a predicate''s current result is not itself a complete coverage argument. Include an empty
        result and an absent resource as adversarial cases. Explain that range or predicate protection
        needs a specific engine contract; do not infer it from the presence of a locking clause.'
      anchor: cover-every-change-that-could-invalidate-the-decision
    - title: Give the invariant a stable coordination row
      brief: Construct the running protocol around an existing resource row shared by every writer that
        can affect its capacity rule. Define how that row is created, retained and found, and what happens
        when it is absent; a failed lookup must not silently authorise an unprotected insert. Put acquisition
        before the protected decision and mutations. For the selected PostgreSQL isolation setting, verify
        when the capacity and reservation reads see a writer that committed while this transaction waited.
        Make the needed fresh read or recheck explicit rather than assuming that acquiring a lock repairs
        a stale snapshot. State which operations may avoid coordination because they cannot violate the
        invariant, with a reason for each exception.
      anchor: give-the-invariant-a-stable-coordination-row
    - title: Choose the lock and keep it through the decision
      brief: Use the selected engine's documented compatibility and lifetime rules to choose a mode that
        makes competing protocol participants conflict. Verify interaction with the actual updates, deletes
        and references in the example; teach only the modes needed to assess it. Distinguish waiting for
        another holder from reading previously visible data. Trace acquisition, decision, changes and
        commit or rollback, including the relevant failure and savepoint boundaries if the example uses
        them. Shorten the protected interval by moving unrelated computation and external calls outside
        it, while keeping every prerequisite read and change inside its protection.
      anchor: choose-the-lock-and-keep-it-through-the-decision
    - title: Acquire several resources in a consistent order
      brief: Extend the same example to moving a reservation between resources. Show an illustrative wait
        cycle when two transactions acquire them in opposite orders, then define a canonical order and
        explicit acquisition procedure that all participating paths follow. Do not equate SQL result ordering
        with a verified lock acquisition contract. Explain that constraints, implicit locks and other
        paths can still introduce deadlocks; verify the selected engine's victim and transaction-state
        behaviour. A known abort requires abandoning the failed attempt and reconsidering the transaction,
        with client retry policy delegated to application integration.
      anchor: acquire-several-resources-in-a-consistent-order
    - title: Decide what waiting and skipping mean for the application
      brief: 'Explain how a coordination row becomes a contention point and how a long holder increases
        waiting. Relate bounded work, lock-wait limits and refusal to wait to the operation''s success
        or failure contract, without teaching general workload tuning. Use one optional claim example
        only to explain what skipping locked candidates changes: an empty claim result cannot by itself
        establish that no eligible work exists, and skipped work does not establish ordered processing.
        Verify the selected syntax and behaviour. Stop before leases, worker recovery, queue scheduling
        or retry algorithms.'
      anchor: decide-what-waiting-and-skipping-mean-for-the-application
    - title: Check the protocol with two sessions and an all-writers argument
      brief: 'Provide a reproducible worksheet with schema, initial rows, exact statement order, pause
        points, assertions and cleanup. Record engine version, isolation and relevant settings, and distinguish
        expected illustrative schedules from recorded observations. Exercise the unprotected race, the
        protected wait followed by a fresh decision, an initially empty reservation set, an insert path
        and the reversed-order deadlock. Check the final invariant as well as returned results and errors.
        Finish with a compact correctness argument: all conflicting writers coordinate on the same stable
        identity, acquisition precedes the relevant reads, those reads have the required visibility, protection
        lasts through the change, and rollback leaves no partial result. Identify bypass paths that invalidate
        this argument. Passing selected runs supports the argument but does not prove coverage of every
        possible writer.'
      anchor: check-the-protocol-with-two-sessions-and-an-all-writers-argument
- id: a19
  href: /review/relational-next/isolation/
  article:
    topic: Relational isolation guarantees and implementations
    title: Reading and testing isolation guarantees
    brief: Teach relational practitioners to turn an engine's documented isolation contract and reproducible
      concurrent sessions into a justified choice of protection and abort handling. Reuse a reservation
      invariant to trace snapshot visibility, locking reads and concurrent changes, then introduce a staffing
      invariant only to expose a distinct multirow dependency. Compare PostgreSQL and MySQL InnoDB only
      where a verified difference changes the application decision. Distinguish snapshot isolation, serialisability
      and real-time ordering. Label illustrative schedules separately from observed runs; record engine
      version, settings, observations and the limited conclusions each run supports. Link to the locking
      article for protocol construction and to application integration for retry machinery. Stop at the
      implementation depth needed to use relational transactions correctly.
    heading:
    - title: Turn an isolation name into a contract
      brief: Start with the reservation invariant and the observations a transaction uses to decide whether
        to accept a booking. Read the selected engine's primary documentation for the exact version, isolation
        setting, transaction mode and statement forms. Extract when reads become visible, which conflicting
        changes wait or fail, and what a successful commit promises. Treat the isolation-level name as
        an entry to that contract rather than a portable list of guarantees. State which assumptions belong
        to the database and which require every writer to follow an application protocol; link to the
        parent for choosing that protocol.
      anchor: turn-an-isolation-name-into-a-contract
    - title: Establish when the transaction sees a change
      brief: Use a two-session reservation schedule to compare two ordinary reads separated by another
        transaction's commit. Trace statement and transaction snapshots and the transaction's own changes,
        identifying when the snapshot is established rather than assuming BEGIN fixes it. Compare selected
        PostgreSQL and InnoDB settings only where the resulting visibility changes the booking decision.
        Explain versioned reads just far enough to show why a stable view need not reserve the data being
        read. Keep long-lived snapshot resource costs with performance and operations.
      anchor: establish-when-the-transaction-sees-a-change
    - title: Read and update can consult different states
      brief: Extend the same schedule with a locking read and a concurrent update. Predict which operation
        waits, which row version or condition it can use after the competing transaction finishes, and
        whether it can abort instead of proceeding. Verify the relevant engine and statement behaviour
        before deriving an obligation. Include a conditional capacity change so readers distinguish a
        checked atomic change from an earlier ordinary read followed by an unguarded write. Examine a
        mixed ordinary-read and locking-read transaction where that distinction affects the result; do
        not imply that every statement in a transaction necessarily consults one common view. Link to
        the locking article for choosing protected rows, lock modes, acquisition order and deadlocks.
      anchor: read-and-update-can-consult-different-states
    - title: A consistent snapshot can still permit an invalid combination
      brief: Introduce the staffing rule that at least one person must remain available. Let two transactions
        read the same qualifying set and change different rows; draw the read/write dependencies that
        make their combined outcome impossible in a serial execution. Explain why preventing conflicting
        writes to one row does not by itself protect a predicate or multirow invariant. Use this case
        to distinguish snapshot isolation from serialisability, then relate an insert into a previously
        read predicate to the same coverage question without adding an anomaly catalogue. Show why row-repeatability
        alone is insufficient evidence for the application's guarantee.
      anchor: a-consistent-snapshot-can-still-permit-an-invalid-combination
    - title: Serialisability protects an outcome by ordering or rejection
      brief: Apply the selected engines' documented serialisable contracts to the staffing schedule. Explain
        only the implementation detail needed to understand the observed choice between blocking and conflict
        detection; distinguish a dependency-tracking mechanism from a lock that blocks a writer. Derive
        the obligation to reconsider and rerun the whole database transaction after a relevant known abort,
        including reads and decisions, rather than retrying only the rejected statement. A particular
        failed run neither identifies every possible victim nor guarantees every repetition will abort.
        Link to application integration for retry limits, deadlines and external effects, and to the parent
        for the distinction between a known abort and an unknown commit outcome.
      anchor: serialisability-protects-an-outcome-by-ordering-or-rejection
    - title: A serial order does not establish a real-time order
      brief: Use a compact timeline to distinguish equivalence to some serial execution from a guarantee
        that also respects completed-before-started operations. Explain why an application's claim about
        an earlier acknowledgement and a later observation needs an explicitly documented ordering and
        read-path guarantee. Do not infer such a guarantee merely from the word serialisable, a timestamp
        or an experiment. Keep distributed replication and stronger cross-service ordering analysis with
        their owning articles.
      anchor: a-serial-order-does-not-establish-a-real-time-order
    - title: Build a repeatable check and state what it proves
      brief: Assemble the earlier cases into a small disposable two-session worksheet with schema, seed
        rows, explicit transaction settings and ordered session steps. Coordinate the interesting interleaving
        through visible checkpoints rather than timing guesses. Record exact engine version, relevant
        settings, statements, returned rows, blocking, errors, commit results and the final invariant
        check; identify each expected result separately from an observed run. Pair observations with version-matched
        primary documentation in a compact comparison that ends in a concrete choice of protection or
        whole-transaction retry obligation. Include an adversarial interleaving and a changed query or
        insert that challenges the conclusion. Explain that a passing schedule can expose a counterexample
        but cannot prove safety for all executions; finish with the contract-based argument covering the
        reads, writes and assumptions the application actually uses. Recheck relevant cases when an engine
        upgrade, setting or query changes.
      anchor: build-a-repeatable-check-and-state-what-it-proves
