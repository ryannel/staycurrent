- id: a02
  slug: sql
  title: Working with SQL
  brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database to
    expressing and checking substantial application and analytical queries. Teach selection, joins, aggregation,
    subqueries, set operations, window calculations and recursion where they solve useful relational problems.
    Develop precise reasoning about duplicates, nulls, ordering, time, pagination and data changes. Teach
    how to establish expected results and test edge cases. Distinguish portable concepts from dialect
    behaviour without attempting an exhaustive syntax catalogue; leave execution-cost diagnosis to its
    own branch.
