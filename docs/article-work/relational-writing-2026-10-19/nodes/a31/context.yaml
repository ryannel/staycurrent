article:
  topic: Moving a relational database
  title: Moving databases with a controlled cutover
  brief: Teach one controlled move of an order database from a source to a destination, following the
    copy, intervening changes and transfer of write authority. Choose between a rehearsed write pause
    and a copy with change capture using the allowed outage and measured transfer time. Establish compatibility,
    a consistent starting state and an explicit final change boundary; prove that the destination meets
    them before admitting writes. Define abort conditions and explain how destination writes change the
    route back. Reuse the parent article's application compatibility method and the operations branch's
    replication and recovery evidence. Verify concrete commands and guarantees against the selected engine,
    version, deployment and migration tool; do not build an engine-pair migration catalogue.
  heading:
  - title: Choose the simplest move that fits the write pause
    brief: 'Start with the additional failure case: orders continue to change while their earlier state
      is being copied, so a successful copy alone cannot authorise switching the application. State the
      allowed write interruption, data-loss tolerance, workload scope and completion evidence. Measure
      copy, validation and restart time in rehearsal. Use a bounded write pause when the whole move fits;
      otherwise identify the extra capture, retention and reconciliation work required to shorten that
      pause. Keep a controlled pause as a complete path, rather than treating online migration as the
      default.'
    anchor: choose-the-simplest-move-that-fits-the-write-pause
  - title: Prove that the destination preserves the workload's meaning
    brief: Follow representative order reads and writes through the proposed destination. Inventory schema,
      types, collations and comparison rules, time handling, identities and sequences, generated values,
      constraints, triggers, extensions and query semantics only where they affect this move. Separate
      schema and object transfer from row transfer, and identify state the chosen mechanism does not carry.
      Test application roles and permissions, connections and representative queries with realistic data
      and concurrency. Link general application-version compatibility and query diagnosis to their owners;
      keep any required engine conversion within this move.
    anchor: prove-that-the-destination-preserves-the-workload-s-meaning
  - title: Join the starting copy to every later change
    brief: Draw one timeline showing the consistent source snapshot, the capture boundary, copied rows
      and subsequent inserts, updates and deletes. Require a documented way to connect snapshot and change
      stream without lost changes, including the tool's treatment of overlap, ordering, transaction boundaries
      and restart. Verify table eligibility, row identification, DDL handling, sequence handling and other
      replication limitations for the selected mechanism. Set a policy for schema changes during the move.
      Check retention, catch-up capacity and copy load; define when an expired boundary or unsupported
      change requires restarting the copy. For the pause path, show how fencing all writers supplies the
      stable copy boundary without a live change stream.
    anchor: join-the-starting-copy-to-every-later-change
  - title: Rehearse the destination and reconcile the copied state
    brief: Run the actual procedure on representative volume and workload, including interruption and
      restart. Reconcile missing, duplicate and incorrect rows with key-range checks and domain invariants,
      using comparable snapshots or an agreed change boundary so concurrent changes do not invalidate
      comparisons. Explain why a row count alone cannot establish correctness. Exercise order creation,
      updates, constraints and generated identifiers; verify capacity, permissions and connection behaviour.
      Reuse operations' restore and replication checks where applicable. Record measured timings, tolerances,
      owners and evidence that make a cutover attempt acceptable.
    anchor: rehearse-the-destination-and-reconcile-the-copied-state
  - title: Fence writers and prove the final boundary has arrived
    brief: 'Develop an ordered cutover runbook: stop admitting writes, drain or resolve in-flight work,
      fence source writers, record the final committed change boundary, wait for that boundary to be applied
      at the destination, and complete the final reconciliation. Include background workers, delayed jobs,
      scheduled tasks, administrators and old connection pools in the writer inventory; a routing or DNS
      change alone is not evidence that they have stopped writing. Resolve uncertain request outcomes
      through the application integration procedure. Verify all unreplicated state, including identifiers,
      before enabling destination writes. Make exclusive write authority and the boundary evidence explicit
      gates, with an owner empowered to abort when either is unproved.'
    anchor: fence-writers-and-prove-the-final-boundary-has-arrived
  - title: Admit destination traffic with a defined way to stop
    brief: 'Switch connection configuration, retire or refresh old pools, and reopen writers only after
      the preceding gates pass. Use observable application checks and bounded workload admission to detect
      semantic, permission and capacity failures. Distinguish an abort before destination writes from
      a return after new orders have committed there: the latter needs a verified reverse synchronisation
      or another migration that preserves those writes. Do not imply that sending connections back restores
      a consistent service. Decide the return procedure and its feasibility before cutover; avoid dual
      writes unless a separately justified correctness protocol already exists.'
    anchor: admit-destination-traffic-with-a-defined-way-to-stop
  - title: Close the move with evidence
    brief: Record the final boundary, reconciliation results, application acceptance and current write
      authority. Keep the source fenced for the agreed decision window and hand destination recovery protection
      and routine monitoring to operations. Identify the evidence that permits removing temporary capture,
      credentials and migration resources. Link lifecycle retirement to the parent and ongoing replication,
      failover and backup administration to operations, without repeating their procedures.
    anchor: close-the-move-with-evidence
