  - title: Close the change with evidence and deliberate cleanup
    anchor: close-the-change-with-evidence-and-deliberate-cleanup
    level: 2
- id: a30
  slug: data-changes
  title: Running reliable data changes
  brief: Teach resumable, idempotent data jobs through one backfill that converts the order system's delivery
    address into a structured representation while orders continue to change. Develop an explicit input
    contract, complete work coverage, protection against stale writes, atomic progress and recovery after
    an uncertain batch outcome. Bound the effect on the live workload and reconcile meaning as well as
    row coverage. Contrast external imports and production corrections only where their input, duplicate
    or recovery contracts change the procedure. Reuse the parent's application compatibility argument
    and link transaction guarantees, request retries and operational diagnosis rather than teach them
    again. Verify executable procedures against the selected engine and version.
  parent: a06
  href: /review/relational-next/data-changes/
  children: []
  sections:
  - title: Define what each changed row must mean
    anchor: define-what-each-changed-row-must-mean
    level: 2
