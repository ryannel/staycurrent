- id: a39
  slug: backup-and-restore
  title: Backing up and restoring relational data
  brief: Teach relational practitioners to choose recovery copies for named loss cases and prove that
    they can restore correct data within the required time and loss bounds. Follow one accidental-deletion
    case from backup selection through an isolated restoration and a controlled return to service, contrasting
    complete service loss where the procedure changes. Develop consistency, dependencies, retention, independent
    access, full and point-in-time restoration, selective recovery and measured validation. This is the
    shared restore procedure used by incidents, database moves and adoption checks; leave incident command,
    replica promotion, application reconciliation mechanics and migration design to their owners. Check
    executable procedures against the selected engine and service, and distinguish rehearsed results from
    intended recovery.
  parent: a07
