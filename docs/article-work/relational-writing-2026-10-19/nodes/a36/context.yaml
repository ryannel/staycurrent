neighbours:
- id: a35
  slug: security
  title: Securing a relational service
  brief: Teach how to build and verify operational access boundaries around a relational database, using
    one service's application, migration, reporting, backup and emergency access tasks. Connect network
    reachability, identity, privileges, ownership, encryption and audit evidence to what each actor can
    actually do. Develop safe rotation, revocation and compromise response with selected-engine checks
    and explicit managed-service responsibilities. Keep application query safety and application authorisation
    in integration, restoration procedures in backups, and the common incident decision method in service
    operations. Follow the parent-first reading route through Running a relational service; readers entering
    here directly should read its section Recover the incident without destroying the evidence before
    this article's final compromise exercise. This article supplies the operational security depth needed
    for relational practice; it does not open a general security architecture branch.
  parent: a07
  href: /review/relational-next/security/
  children: []
