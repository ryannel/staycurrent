- id: a37
  slug: maintenance-and-upgrades
  title: Maintaining and upgrading a relational service
  brief: Teach practitioners to keep a relational service healthy and change its engine version through
    controlled, observable work. Connect required upkeep to the workload and engine mechanisms that create
    it; distinguish automatic work, operator intervention and managed-service duties. Build a maintenance
    and upgrade procedure with explicit resource and interruption budgets, compatibility checks, recovery
    choices and validation. Use a worked service example and current primary engine documentation for
    concrete procedures. Link to performance for storage and query mechanisms, to operations neighbours
    for monitoring, topology and restoration, and to live database changes for schema migration or database
    moves. Keep this as one practical article.
  parent: a07
  href: /review/relational-next/maintenance-and-upgrades/
