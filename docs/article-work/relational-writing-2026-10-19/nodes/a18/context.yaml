article:
  topic: Relational locking and concurrency protocols
  title: Designing changes that coordinate with locks
  brief: Teach practitioners to construct and assess explicit locking protocols for relational invariants
    that ordinary constraints or a conditional row change cannot express. Develop one reservation-capacity
    example using PostgreSQL at a stated isolation level, with primary-source checks and reproducible
    sessions required before presenting engine behaviour as established. Cover existing and missing rows,
    inserts, coordination rows, lock modes, acquisition order, waiting and deadlocks. Finish with an argument
    covering every writer and a two-session check. Link to isolation for interpreting engine contracts
    and to application integration for retry machinery; do not expand into a queue or lock catalogue.
  heading:
  - title: Identify the decision that needs protection
    brief: Start from a reservation rule whose decision reads several rows before inserting or changing
      a reservation. Reuse the parent's capacity example and show the uncovered interleaving in a labelled
      illustrative schedule. State the invariant, the decision's scope and the read-to-change interval
      that needs protection. Explain briefly why the available constraint or conditional single-row change
      does not settle this version of the rule, referring to the parent for the general choice of protection.
    anchor: identify-the-decision-that-needs-protection
  - title: Cover every change that could invalidate the decision
    brief: 'List the paths that reserve, cancel, move reservations, change capacity, delete resources
      or perform administrative corrections. Map each to the state it can invalidate and the coordination
      it must acquire before doing so. Distinguish locking existing rows from preventing new qualifying
      rows: a predicate''s current result is not itself a complete coverage argument. Include an empty
      result and an absent resource as adversarial cases. Explain that range or predicate protection needs
      a specific engine contract; do not infer it from the presence of a locking clause.'
    anchor: cover-every-change-that-could-invalidate-the-decision
  - title: Give the invariant a stable coordination row
    brief: Construct the running protocol around an existing resource row shared by every writer that
      can affect its capacity rule. Define how that row is created, retained and found, and what happens
      when it is absent; a failed lookup must not silently authorise an unprotected insert. Put acquisition
      before the protected decision and mutations. For the selected PostgreSQL isolation setting, verify
      when the capacity and reservation reads see a writer that committed while this transaction waited.
      Make the needed fresh read or recheck explicit rather than assuming that acquiring a lock repairs
      a stale snapshot. State which operations may avoid coordination because they cannot violate the
      invariant, with a reason for each exception.
    anchor: give-the-invariant-a-stable-coordination-row
  - title: Choose the lock and keep it through the decision
    brief: Use the selected engine's documented compatibility and lifetime rules to choose a mode that
      makes competing protocol participants conflict. Verify interaction with the actual updates, deletes
      and references in the example; teach only the modes needed to assess it. Distinguish waiting for
      another holder from reading previously visible data. Trace acquisition, decision, changes and commit
      or rollback, including the relevant failure and savepoint boundaries if the example uses them. Shorten
      the protected interval by moving unrelated computation and external calls outside it, while keeping
      every prerequisite read and change inside its protection.
    anchor: choose-the-lock-and-keep-it-through-the-decision
  - title: Acquire several resources in a consistent order
    brief: Extend the same example to moving a reservation between resources. Show an illustrative wait
      cycle when two transactions acquire them in opposite orders, then define a canonical order and explicit
      acquisition procedure that all participating paths follow. Do not equate SQL result ordering with
      a verified lock acquisition contract. Explain that constraints, implicit locks and other paths can
      still introduce deadlocks; verify the selected engine's victim and transaction-state behaviour.
      A known abort requires abandoning the failed attempt and reconsidering the transaction, with client
      retry policy delegated to application integration.
    anchor: acquire-several-resources-in-a-consistent-order
  - title: Decide what waiting and skipping mean for the application
    brief: 'Explain how a coordination row becomes a contention point and how a long holder increases
      waiting. Relate bounded work, lock-wait limits and refusal to wait to the operation''s success or
      failure contract, without teaching general workload tuning. Use one optional claim example only
      to explain what skipping locked candidates changes: an empty claim result cannot by itself establish
      that no eligible work exists, and skipped work does not establish ordered processing. Verify the
      selected syntax and behaviour. Stop before leases, worker recovery, queue scheduling or retry algorithms.'
    anchor: decide-what-waiting-and-skipping-mean-for-the-application
  - title: Check the protocol with two sessions and an all-writers argument
    brief: 'Provide a reproducible worksheet with schema, initial rows, exact statement order, pause points,
      assertions and cleanup. Record engine version, isolation and relevant settings, and distinguish
      expected illustrative schedules from recorded observations. Exercise the unprotected race, the protected
      wait followed by a fresh decision, an initially empty reservation set, an insert path and the reversed-order
      deadlock. Check the final invariant as well as returned results and errors. Finish with a compact
      correctness argument: all conflicting writers coordinate on the same stable identity, acquisition
      precedes the relevant reads, those reads have the required visibility, protection lasts through
      the change, and rollback leaves no partial result. Identify bypass paths that invalidate this argument.
      Passing selected runs supports the argument but does not prove coverage of every possible writer.'
    anchor: check-the-protocol-with-two-sessions-and-an-all-writers-argument
