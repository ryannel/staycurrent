- id: a05
  slug: performance
  title: Understanding and improving database performance
  brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
    Build the necessary understanding of row and index storage, buffering, version retention, access paths,
    join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and observed
    plans without confusing their units or treating estimates as execution evidence. Connect query shape,
    indexes, physical layout, maintenance and resource contention to workload latency, throughput and
    capacity. Choose and validate changes with representative data and concurrency, including write and
    operational costs; deepen engine internals only where they explain a diagnosis or intervention. Give
    the parent a complete ordinary diagnosis-to-measured-improvement loop. Tell readers to finish this
    article, including its concluding comparison method, before selecting an optional contextual investigation
    by the question their evidence raises.
