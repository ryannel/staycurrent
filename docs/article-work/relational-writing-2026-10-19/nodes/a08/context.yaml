original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Choosing relational systems and deployments
  title: Choosing a relational database
  brief: Teach how to select and validate a relational engine and deployment for a concrete application.
    Turn workload, correctness, latency, availability, locality, operational capacity and total cost into
    explicit requirements and rejection tests. Compare representative embedded, server and distributed
    relational choices through the mechanisms that change those tests, including managed service restrictions
    and responsibilities. Finish with a realistic evaluation and a documented adoption decision. Use neighbouring
    storage families only to establish suitability; use conditional implementation follow-ups to check
    a candidate's actual contract. SQLite and CockroachDB are alternative adoption routes, not a required
    sequence; common disposable PostgreSQL practice starts in Working with SQL before this selection evaluation
    is complete. Keep the PostgreSQL candidate record here.
  heading:
  - title: Begin with the application's promises
    brief: Follow an ordinary application from its facts and critical reads and changes to a short selection
      brief. Record invariants and transaction boundaries, dataset size and growth, skew, concurrency,
      latency percentiles, burst shape, availability, acceptable data loss, recovery time and location
      requirements. Separate measured needs, forecast needs and negotiable preferences. Make each hard
      requirement testable and explain why an engine name is not yet a design.
    anchor: begin-with-the-application-s-promises
  - title: Establish whether a relational system fits
    brief: Use relationships, integrity rules, transactional changes and changing query needs to explain
      the relational fit. Identify cases where access patterns, data volume or specialised search and
      analytical needs merit a neighbouring storage family or a separate derived system. Account for synchronisation,
      recovery and operational costs before adding another store; keep the detailed design of those families
      outside this article.
    anchor: establish-whether-a-relational-system-fits
  - title: Choose the process and failure boundary
    brief: Compare an embedded library, a database service and a distributed relational service by who
      owns the data files, where requests execute, how writers coordinate, which network paths enter latency
      and which failures affect reads and commits. Explain that an engine, a topology and a hosting arrangement
      are separate choices. Use SQLite, PostgreSQL and CockroachDB as concrete representatives of alternative
      choices, not a required learning sequence. Take the SQLite route only for an embedded candidate
      and the CockroachDB route only after a concrete distributed requirement survives comparison with
      a simpler server. Introduce other candidates only when a required capability makes them relevant.
      Do not infer identical SQL semantics, transaction guarantees or capacity from the relational label.
    heading:
    - title: When the database lives with the application
      brief: Introduce the attraction and boundaries of an embedded relational engine through application
        ownership, concurrent writers, file placement, deployment and backup needs. Establish the tests
        that decide whether the embedded arrangement serves this application. Introduce SQLite's concrete
        adoption checks only when evaluating an embedded candidate.
      nested_article:
        topic: Adopting SQLite for an application
        title: Checking an embedded choice with SQLite
        brief: Decide whether SQLite can meet one application's relational requirements in its intended
          deployment. Trace file ownership, connections and transactions to writer contention, durability
          and recovery obligations; verify the actual library, driver and settings with small acceptance
          cases. Produce a defensible adoption decision and starting configuration. Reuse the common transaction,
          integration, performance and operations methods rather than teach them again; this is an optional
          candidate check, not a SQLite internals curriculum.
        href: /review/relational-next/sqlite/
      anchor: when-the-database-lives-with-the-application
    - title: When applications share a database service
      brief: Introduce the service boundary, connection and resource limits, primary write placement,
        replica read semantics and operating responsibilities that distinguish a server deployment. Show
        how requirements produce a shortlist among PostgreSQL, MySQL and other server engines without
        ranking them universally. Common disposable PostgreSQL practice starts in Working with SQL before
        completing selection. Keep a compact PostgreSQL candidate record here, linked to the common articles'
        PostgreSQL evidence for configuration, schema and SQL behaviour, correctness, workload and recovery
        gates. Name the exact version, service tier and topology; trace the actual application, driver,
        pooler and server path. Record connection and pooling limits, required session features, relevant
        transaction, timeout and durability settings, extensions and access controls with reasons and
        verification sources. Check candidate-specific differences and restrictions rather than repeat
        the common lessons; require dialect and guarantee checks when choosing another engine.
      anchor: when-applications-share-a-database-service
    - title: When data and writes must span machines or regions
      brief: Enter this alternative route only after a concrete distributed requirement survives comparison
        with a simpler server. Compare transaction placement, coordination latency, locality, failure
        handling and operational cost against those needs. Introduce a concrete CockroachDB evaluation
        while keeping a general distributed-systems curriculum outside the commission.
      nested_article:
        topic: Adopting a distributed relational system with CockroachDB
        title: Checking a distributed choice with CockroachDB
        brief: Decide whether a specific CockroachDB version and deployment meet an application's distributed
          relational requirements. Follow one regional order-reservation workload from its placement and
          transaction boundaries through compatibility, latency, contention and failure tests to a documented
          adoption or rejection. Establish a minimal topology and starting configuration, dated version
          and service-tier evidence, and the resource, network and operating cost of meeting the requirements.
          Reuse common transaction, application integration, evolution, performance and operations methods;
          explain distributed mechanisms only far enough to predict or interpret acceptance results. Illustrative
          traces explain hypotheses; only observed tests establish acceptance, and untested claims remain
          explicit gaps.
        href: /review/relational-next/cockroachdb/
      anchor: when-data-and-writes-must-span-machines-or-regions
    anchor: choose-the-process-and-failure-boundary
  - title: Compare the deployment contract and its full cost
    brief: Build a responsibility table for application team, database operator and provider. Verify service
      limits, supported versions, extensions, privileges, connection and storage limits, maintenance windows,
      upgrades, data location, network access, encryption, audit needs, backup retention, restore granularity
      and failover behaviour. Separate availability promises from tested recovery capability. Compare
      realistic compute, memory, storage, I/O, replicas, transfer, licensing, support and engineering
      effort, including idle and burst costs. Treat product terms and service-tier behaviour as dated
      evidence. For the PostgreSQL candidate, add service-specific configuration and privilege restrictions,
      maintenance and upgrade constraints and remaining operational obligations to this same table, naming
      an owner for each obligation.
    anchor: compare-the-deployment-contract-and-its-full-cost
  - title: Test the candidates against the same application
    brief: Turn hard requirements into pass-or-fail gates and trade-offs into a small decision table.
      Use representative schema, realistic data distribution and growth, production-shaped queries and
      concurrent changes, and the actual driver and network path. Verify results and invariants before
      measuring steady and burst latency, throughput, resource use and cost. Include slow clients, connection
      pressure, contention and required failure, failover and backup-restore exercises. Record version,
      configuration, dataset, observations, uncertainty and untested cases; distinguish illustrative models
      from execution evidence and marketing benchmarks from this workload. Draw on the performance and
      operations branches for the detailed procedures. Link the common PostgreSQL examples and observed
      results where their version, configuration and execution path apply; exercise the candidate's actual
      driver, pool mode and hosting differences where those results do not establish the contract. Keep
      documentation claims, local models and unexecuted checks distinct from observed acceptance results.
    anchor: test-the-candidates-against-the-same-application
  - title: Make the choice reversible enough to live with
    brief: Write a decision record naming the candidate, deployment, acceptance evidence, rejected alternatives,
      unresolved risks and the conditions that would reopen the choice. Check ecosystem maturity, driver
      and tooling support, staff skills and support arrangements. Make portability concrete by inventorying
      dialect, data types, extensions, operational dependencies, export access and migration downtime;
      demonstrate a small export and re-import where an exit requirement matters. Establish a staged adoption
      and verification plan, with explicit stop criteria, before committing critical data. Complete the
      compact PostgreSQL record with the verified starting configuration, linked acceptance evidence,
      measured candidate limits, acceptance gaps and an owner for each unresolved check. Accept, reject
      or defer it against the original gates without creating another PostgreSQL teaching destination.
      Link live migration procedures to the evolution article.
    anchor: make-the-choice-reversible-enough-to-live-with
