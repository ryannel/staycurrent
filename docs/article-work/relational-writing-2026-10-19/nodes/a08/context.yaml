child_article_plans:
- id: a32
  href: /review/relational-next/sqlite/
  article:
    topic: Adopting SQLite for an application
    title: Checking an embedded choice with SQLite
    brief: Decide whether SQLite can meet one application's relational requirements in its intended deployment.
      Trace file ownership, connections and transactions to writer contention, durability and recovery
      obligations; verify the actual library, driver and settings with small acceptance cases. Produce
      a defensible adoption decision and starting configuration. Reuse the common transaction, integration,
      performance and operations methods rather than teach them again; this is an optional candidate check,
      not a SQLite internals curriculum.
    heading:
    - title: Put the database file in the deployment diagram
      brief: Start with a concrete application, such as a single-host service whose web workers and background
        job share a local database. Mark who opens the file, owns its storage, writes concurrently and
        can recover it after host loss. Compare that intended arrangement with requirements already established
        in Choosing a relational database; reject it early if ownership, independent host access or recovery
        expectations do not fit.
      heading:
      - title: Verify the library the application actually loads
        brief: Record SQLite and driver versions, relevant build options, required extensions and connection/threading
          restrictions. Distinguish the library used by the running application from an installed command-line
          tool. Make support for required SQL and deployment platforms a testable acceptance condition
          rather than infer it from the SQLite name.
        anchor: verify-the-library-the-application-actually-loads
      - title: Check the storage and access boundary
        brief: Inspect local versus network storage, locking and sync behaviour, directory permissions,
          journal sidecars, container volumes and restart persistence. Explain WAL's same-host requirement
          where it rules out a deployment. Establish that access to the process and files defines the
          security boundary; link the security article for the wider protection and recovery obligations.
        anchor: check-the-storage-and-access-boundary
      anchor: put-the-database-file-in-the-deployment-diagram
    - title: Observe two connections competing for a write
      brief: Use a small, explicitly scheduled two-connection example to show one transaction holding
        writer access while another waits or fails. Relate this to actual transaction duration and simultaneous
        writers rather than infer suitability from database size or request count. Link Transactions for
        isolation guarantees and application integration for retry policy.
      heading:
      - title: Choose when a transaction asks to write
        brief: Compare a deferred read-then-write transaction with BEGIN IMMEDIATE; inspect driver autocommit
          and implicit transaction behaviour. Explain busy and stale-snapshot outcomes only far enough
          to decide whether the transaction must restart and where its boundary belongs. Configure bounded
          busy handling, and test its actual behaviour instead of treating a timeout as a guarantee that
          every failed write will eventually run.
        anchor: choose-when-a-transaction-asks-to-write
      - title: Keep reader and writer lifetimes visible
        brief: Check when statements, cursors and transactions release their resources, including slow
          response streaming and background work. Connect a long writer to queueing and a long WAL reader
          to checkpoint progress and log growth. Measure representative overlap with multiple connections
          and processes where the deployment uses them; leave general workload tuning and request deadlines
          to their existing owners.
        anchor: keep-reader-and-writer-lifetimes-visible
      anchor: observe-two-connections-competing-for-a-write
    - title: Choose a journal and durability contract
      brief: Compare rollback journalling and WAL through the reader/writer interactions that affect this
        application. Explain checkpointing only as the movement that permits WAL reuse and introduces
        operational work. Verify supported journal and synchronous settings against SQLite's documentation,
        the driver and the actual filesystem; do not present WAL as an automatic improvement.
      heading:
      - title: State what a successful commit must survive
        brief: Separate application-process failure, operating-system failure and power loss. Connect
          the chosen journal/synchronous combination and storage sync assumptions to the required acknowledged-write
          survival, checkpoint work and latency. Read settings back at their documented scope, distinguishing
          persistent database settings from per-connection initialisation. Reuse Making concurrent changes
          correct for transaction durability and Backing up and restoring relational data and Running
          a relational service for service recovery.
        anchor: state-what-a-successful-commit-must-survive
      anchor: choose-a-journal-and-durability-contract
    - title: Prove the application's data contract on SQLite
      brief: Run a small schema and the application's critical statements through its actual driver. Verify
        foreign-key enforcement on every new connection, expected NOT NULL, CHECK and uniqueness behaviour,
        and the chosen use of STRICT tables or flexible typing. Include both accepted and rejected values
        so successful insertion alone cannot stand in for constraint validation.
      heading:
      - title: Check representations at the driver boundary
        brief: Test integer ranges, exact money representation, timestamps, NULLs, collations and parameter/result
          conversions where this application uses them. Check required SQL and schema-change support against
          the loaded version. Reuse the schema, query and evolution articles for their design methods;
          show only differences that could accept or disqualify SQLite.
        anchor: check-representations-at-the-driver-boundary
      anchor: prove-the-application-s-data-contract-on-sqlite
    - title: Rehearse a recoverable deployment
      brief: Apply the shared restoration method to SQLite's files and APIs. Select a supported consistent
        backup mechanism, such as the online backup API, and explain why copying a changing main file
        does not establish a valid backup. Restore independently and validate application invariants and
        measured recovery time. Check recovery copies survive the host or volume failure in the application's
        requirement; a local copy alone cannot demonstrate that.
      heading:
      - title: Verify restarts, upgrades and interrupted work
        brief: Rehearse deployment with persistent data, permission checks, connection initialisation
          and a controlled schema change. Test process termination, lock contention and disposable disk-full
          or I/O-failure cases supported by the test environment. Record error and restart behaviour without
          mistaking a killed process for a power-loss test. Link operations and evolution for full recovery
          and cutover procedures.
        anchor: verify-restarts-upgrades-and-interrupted-work
      anchor: rehearse-a-recoverable-deployment
    - title: Make the adoption decision from acceptance evidence
      brief: Collect the deployment diagram, library/driver versions, verified settings, data-contract
        results, contention latency and error rates, and restoration evidence against the original rejection
        gates. Mark every result as observed, documented or still assumed, with dates and links to primary
        SQLite and driver documentation. Accept with explicit limits or reject the candidate; identify
        the workload or deployment change that would trigger reevaluation and reuse the database-move
        article for an eventual exit. Do not expand failed gates into new SQLite specialist branches.
      anchor: make-the-adoption-decision-from-acceptance-evidence
- id: a34
  href: /review/relational-next/cockroachdb/
  article:
    topic: Adopting a distributed relational system with CockroachDB
    title: Checking a distributed choice with CockroachDB
    brief: Decide whether a specific CockroachDB version and deployment meet an application's distributed
      relational requirements. Follow one regional order-reservation workload from its placement and transaction
      boundaries through compatibility, latency, contention and failure tests to a documented adoption
      or rejection. Establish a minimal topology and starting configuration, dated version and service-tier
      evidence, and the resource, network and operating cost of meeting the requirements. Reuse common
      transaction, application integration, evolution, performance and operations methods; explain distributed
      mechanisms only far enough to predict or interpret acceptance results. Illustrative traces explain
      hypotheses; only observed tests establish acceptance, and untested claims remain explicit gaps.
    heading:
    - title: Name the requirement that needs distribution
      brief: Start with an order-reservation application whose users and data span regions. State its
        invariants, required read freshness, transaction boundaries, latency budgets by client location,
        permitted interruption and data loss, and any data residency obligations. Carry forward the parent's
        rejection gates and ask which requirement a simpler deployment fails. Distinguish placing application
        traffic, placing rows and surviving a failure; geographical presence alone establishes none of
        their contracts. Keep this a conditional candidate evaluation rather than a compulsory product
        lesson.
      anchor: name-the-requirement-that-needs-distribution
    - title: Turn the requirements into a minimal topology
      brief: Select the exact release, hosting arrangement and service tier before designing tests. Record
        supported regions, locality and survival controls, deployment minimums, scaling and configuration
        limits, maintenance responsibilities and contractual restrictions from dated primary documentation.
        Draw gateway locations, data ranges and their voting and non-voting replicas only to explain where
        an operation travels and which failures retain a quorum. Choose the smallest topology capable
        of testing the stated failure goal; distinguish an economical development cluster from evidence
        for the intended production topology.
      heading:
      - title: Place each transaction's data and work
        brief: Map regional customers, inventory and orders to the candidate's supported table and row
          locality choices. Verify actual replica and leaseholder placement rather than infer it from
          SQL connection location. Compare a local reservation with a transaction touching inventory in
          another region, including foreign-key checks, unique constraints, secondary indexes and joins
          where they change coordination. Use the paths to predict latency and detect hidden cross-region
          work. Check physical copies and backups against residency requirements rather than treating
          locality as a residency promise.
        anchor: place-each-transaction-s-data-and-work
      anchor: turn-the-requirements-into-a-minimal-topology
    - title: Check the application's actual SQL contract
      brief: Build a compact compatibility acceptance set from the real schema and access paths. Verify
        required types, constraints, expressions, SQL semantics, generated identifiers, isolation choices
        and schema-change facilities against the pinned release. Exercise the intended driver, ORM, protocol
        features, prepared statements and connection pool; PostgreSQL protocol support is an entry point
        for tests, not proof that PostgreSQL behaviour or extensions carry across. Record unsupported
        requirements, acceptable adaptations and their cost. Reuse the evolution branch's compatibility
        and rollout method to check representative schema jobs, restrictions and application coexistence
        without repeating the migration procedure.
      anchor: check-the-application-s-actual-sql-contract
    - title: Make the client contract survive coordination failures
      brief: Run the representative reservation transaction through the chosen driver's transaction handling.
        Verify the configured isolation and actual retryable abort and ambiguous-outcome signals for this
        release, including the boundary between database, driver and application retries. Use the transaction
        branch's correctness tests and integration branch's retry, deadline, idempotency and reconciliation
        methods to demonstrate that an abort or uncertain commit does not oversell inventory or duplicate
        a reservation. Test a disconnect around commit and a transaction whose deadline expires during
        contention. Explain coordination and contention only where they account for those outcomes; do
        not build another consensus or retry curriculum.
      anchor: make-the-client-contract-survive-coordination-failures
    - title: Measure locality and contention with production-shaped work
      brief: Apply the performance branch's workload method with realistic regional traffic, data volume,
        concurrency, connection behaviour and competing work. Compare local and cross-region transactions,
        shared hot inventory and dispersed inventory, measuring end-to-end latency distributions, completed
        throughput, retry rate and invariant violations. Count retry and queueing time inside the application
        deadline. Inspect query plans, distribution and service signals to distinguish coordination distance,
        hot keys, poor query shape and resource saturation. Test the smallest justified change and repeat
        the same acceptance case; do not substitute a local toy trace or a vendor benchmark for measured
        results.
      anchor: measure-locality-and-contention-with-production-shaped-work
    - title: Prove the named failures and recovery path
      brief: In an authorised disposable environment matching the required topology, exercise client or
        gateway loss, node loss and the stated zone or region failure. Include a network partition where
        it tests the requirement. Observe which operations remain available, interruption and tail latency,
        retry and uncertain outcomes, correctness of acknowledged work, and behaviour while capacity returns.
        Verify placement has converged before claiming the survival goal. Use operations' topology and
        restore procedures to gather evidence for backup availability, recoverable keys and a timed restore
        with application validation; replication and survival tests do not establish recovery from accidental
        deletion. Record provider restrictions and any failure case that cannot be tested as an acceptance
        gap, using contractual evidence without presenting it as execution.
      anchor: prove-the-named-failures-and-recovery-path
    - title: Decide whether the measured contract is worth its cost
      brief: Complete one adoption record linking each requirement to its configuration, dated source,
        measured result, limitation and pass or rejection threshold. Include baseline and degraded capacity,
        replica and index storage, cross-region traffic, backups, maintenance and operator effort, plus
        the commercial and service-tier conditions required by the topology. State the verified starting
        configuration, unresolved gaps and reassessment triggers. Reuse the common restore and cutover
        evidence to check a practical exit route rather than teach it again. Adopt only when the distributed
        requirement, application contract, recovery evidence and total cost meet the gates; otherwise
        identify which requirement or candidate must change.
      anchor: decide-whether-the-measured-contract-is-worth-its-cost
scope_boundary: 'Use the actual parent, sibling and child plans: teach a useful high-level answer here,
  introduce deeper questions in context, and leave their detailed mechanisms/procedures with the owning
  child. Do not duplicate a sibling. A parent must still teach a complete useful first case, not just
  advertise links.'
