original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational execution and performance
  title: Understanding and improving database performance
  brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
    Build the necessary understanding of row and index storage, buffering, version retention, access paths,
    join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and observed
    plans without confusing their units or treating estimates as execution evidence. Connect query shape,
    indexes, physical layout, maintenance and resource contention to workload latency, throughput and
    capacity. Choose and validate changes with representative data and concurrency, including write and
    operational costs; deepen engine internals only where they explain a diagnosis or intervention. Give
    the parent a complete ordinary diagnosis-to-measured-improvement loop. Tell readers to finish this
    article, including its concluding comparison method, before selecting an optional contextual investigation
    by the question their evidence raises.
  heading:
  - title: Start with the work people need to finish
    brief: 'State the reading contract first: complete this parent through the final comparison method
      before following its contextual links. The children are optional investigations selected by a concrete
      question, not a required sequence through storage, indexes, plans and concurrency. Follow an application''s
      growing order history through a slow customer lookup, a reporting query and concurrent order changes.
      Define acceptable latency, throughput and resource cost for each operation. Distinguish a frequent
      small cost from an occasional expensive request, and database execution from waiting for a connection,
      network transfer and application processing. Establish a baseline with query frequency, latency
      distributions, representative parameters, row counts and concurrent activity before choosing a remedy.'
    anchor: start-with-the-work-people-need-to-finish
  - title: Find where time and work accumulate
    brief: Move from an affected operation to evidence about execution, blocking, storage reads, CPU,
      temporary work and result transfer. Compare a query's typical and slow executions with changes in
      parameters, data size and concurrent work. Separate observations from hypotheses; a slow query or
      a busy resource does not by itself identify the limiting cause. Use the operations branch for service
      monitoring and incident procedures, and the integration branch for pool waits and excessive round
      trips.
    anchor: find-where-time-and-work-accumulate
  - title: Rows have a physical home and a lifetime
    brief: Establish the working model needed to explain why equal result sizes can require very different
      work. Introduce pages, row and index organisation, cached and uncached access, locality, row width
      and retained versions. Connect logical changes and long transactions to the physical work and retained
      space that a performance investigation must measure, while keeping durability and isolation guarantees
      in their owning branches. After completing the parent, choose the storage investigation when unexplained
      page traffic, working-set growth or retained space makes the physical organisation consequential.
    nested_article:
      topic: Relational physical storage and working sets
      title: How stored rows become physical work
      brief: Teach the physical model needed to explain page traffic, cache pressure and unreclaimed space
        in relational workloads. Follow one changing table through reads, wider rows, updates, retained
        versions and space reuse, connecting each mechanism to evidence and a possible intervention. Use
        selected PostgreSQL and InnoDB differences only when they change that diagnosis; verify the chosen
        version's behaviour against primary documentation. Keep row locators here only far enough to understand
        physical locality; the index article owns traversal, key order, coverage and the detailed secondary-index/base-row
        access path. Treat physical pruning as one measurable layout intervention. Link transaction semantics
        and operational reorganisation procedures to their owners, and use the parent's comparison method
        rather than teaching benchmarking again. Stop at the depth needed for relational engineering decisions,
        without a separate storage-engine or partitioning curriculum.
      href: /review/relational-next/physical-storage/
    anchor: rows-have-a-physical-home-and-a-lifetime
  - title: Give the query a useful route to its rows
    brief: Compare scanning, locating a range through an index and fetching base rows. Explain selectivity,
      ordering and coverage through the running lookup, then show why a small table, a broad request or
      scattered fetches can favour a scan. Introduce composite key order and query expressions as practical
      constraints on useful access. Account for every added index in changes, storage and upkeep. After
      completing the parent, choose the index investigation when the evidence calls for designing or comparing
      access paths; its local plan legend permits that task without first completing the full plan-diagnosis
      investigation.
    nested_article:
      topic: Designing and evaluating relational indexes
      title: Choosing indexes for a workload
      brief: At the opening, require completion of Understanding and improving database performance, including
        its concluding Change one explanation into a measured improvement as the common comparison method
        used here. Derive index candidates from the work a relational workload needs, explain how their
        keys limit and order access, and decide whether their read benefit earns their write, space and
        operating costs. Use one tenant order-history workload with equality filters, a date range, an
        ordered first page and a related-row lookup. Extend it only when another query exposes a consequential
        trade-off. Own B-tree traversal, composite key order, coverage, base-row access and index eligibility.
        Supply a compact local reporting legend before using observed index evidence; no sibling article
        is a prerequisite. Offer Diagnosing a query from its execution plan for deeper evidence reading
        and plan-choice diagnosis. Link physical storage and safe schema changes to their owners. Keep
        the depth at choosing and evaluating relational indexes, without an index-family catalogue or
        another benchmarking curriculum.
      href: /review/relational-next/indexes/
    anchor: give-the-query-a-useful-route-to-its-rows
  - title: Explain the work and test a plan hypothesis
    brief: 'Work through a compact observed plan for the running reporting query, following scans, joins,
      filtering, grouping and ordering. Explain estimated cost versus elapsed execution, estimated versus
      observed rows, per-loop versus total work and inclusive reporting before interpreting the figures.
      Establish safe plan collection on disposable data: execution-based inspection executes effects and
      consumes resources. Carry one ordinary example from slow report to a consequential underestimated
      input, a supported stale-statistics hypothesis and a targeted statistics refresh. Distinguish inaccurate
      estimates from accurately predicted expensive work; changed estimates alone do not establish an
      improvement. State the predicted reduction in repeated work and retain the before/after evidence
      for the concluding workload comparison. Mention parameter skew and prepared execution as reasons
      a result may differ in the application. After completing the parent, choose the plan investigation
      when the question requires following actual operators, explaining an estimate mismatch or checking
      common and rare prepared parameters. It completes that diagnosis in one destination rather than
      handing its central remedy to another article.'
    nested_article:
      topic: Reading and diagnosing relational execution plans
      title: Diagnosing a query from its execution plan
      brief: 'Complete one ordinary slow-query investigation in PostgreSQL: collect safe evidence, follow
        physical rows and repeated work, interpret reporting units, explain a consequential estimate error,
        test a targeted remedy and accept it against the workload. Use the same reporting query throughout,
        including common and rare prepared parameters, so statistics and plan choice resolve the original
        diagnosis rather than begin another tour. Record the concrete engine version and verify its behaviour
        against primary documentation. Distinguish captured evidence from illustrative arithmetic and
        explain what each observation cannot establish. Keep uncommon nodes, parallel variants and planner
        controls conditional and compact. Link index design, storage mechanisms, concurrent-load diagnosis
        and the parent''s comparison method to their owners; do not expand into optimiser or storage-engine
        specialism. No further article is required to finish this task.'
      href: /review/relational-next/query-plans/
    anchor: explain-the-work-and-test-a-plan-hypothesis
  - title: A faster query can still make the workload slower
    brief: Put the candidate improvements back beside concurrent lookups, reports and changes. Connect
      higher concurrency to queues and competition for CPU, memory, I/O and locks; account for per-operation
      memory and parallel workers. Explain how an index can help reads while making writes more expensive,
      and how a long report can change the conditions for short requests. Use transaction and integration
      guidance for lock lifetimes, retry behaviour and admission at the application boundary. After completing
      the parent, choose concurrent-load diagnosis when isolated query evidence does not explain latency
      or completed throughput under competing work; use operations for monitoring and provisioning.
    nested_article:
      topic: Relational workload contention and capacity
      title: Improving performance under concurrent load
      brief: Diagnose why a relational workload slows as concurrent demand grows, and choose changes that
        improve useful completed work and tail latency. Distinguish the work of an individual execution
        from queuing and competition for resources. Use one mixed workload and selected engine evidence
        to connect demand, outstanding work, resource pressure and serial bottlenecks to an intervention.
        Reuse the parent's common comparison method and the storage, plan, transaction and application-integration
        explanations. Keep pool implementation, service budgets, provisioning procedures and recovery
        with their existing owners.
      href: /review/relational-next/concurrent-load/
    anchor: a-faster-query-can-still-make-the-workload-slower
  - title: Change one explanation into a measured improvement
    brief: 'Complete the ordinary report investigation by comparing the statistics remedy with its recorded
      baseline under representative application work. State the observed result and accept, reject or
      revise the hypothesis; do not require a child article to finish this loop. Establish the reusable
      comparison method here before the optional investigations apply it. Turn each diagnosis into a prediction:
      which work should disappear, which measurement should change and what new cost might appear. Compare
      a query rewrite, index change, layout or statistics change, maintenance intervention and added resources
      as remedies for particular evidence. Verify results and edge cases before measuring. Test with representative
      size, distributions, parameter classes, warm and cold conditions, concurrency and ongoing changes;
      record the engine version and configuration, measurement variance and instrumentation limits. Measure
      end-to-end latency distributions, throughput, resource use, write cost and maintenance burden together.
      Set acceptance and regression criteria, retain reproducible evidence and use schema-evolution guidance
      for deploying a successful change safely. Close by revisiting the running workload and identifying
      when growth requires another investigation.'
    anchor: change-one-explanation-into-a-measured-improvement
