- id: a24
  href: /review/relational-next/physical-storage/
  article:
    topic: Relational physical storage and working sets
    title: How stored rows become physical work
    brief: Teach the physical model needed to explain page traffic, cache pressure and unreclaimed space
      in relational workloads. Follow one changing table through reads, wider rows, updates, retained
      versions and space reuse, connecting each mechanism to evidence and a possible intervention. Use
      selected PostgreSQL and InnoDB differences only when they change that diagnosis; verify the chosen
      version's behaviour against primary documentation. Keep row locators here only far enough to understand
      physical locality; the index article owns traversal, key order, coverage and the detailed secondary-index/base-row
      access path. Treat physical pruning as one measurable layout intervention. Link transaction semantics
      and operational reorganisation procedures to their owners, and use the parent's comparison method
      rather than teaching benchmarking again. Stop at the depth needed for relational engineering decisions,
      without a separate storage-engine or partitioning curriculum.
    heading:
    - title: A row request becomes page work
      brief: 'Begin with a concrete investigation: a query returns the same small result while its page
        work or latency grows as the table changes. Introduce pages as units of organisation and buffering,
        separating requested rows, pages examined, buffer hits and actual storage reads. Use a labelled
        illustrative page map to show why returned bytes do not measure the work. Link observed plan and
        I/O reporting conventions to the plan-reading article; do not present model counts as measured
        execution or equate a buffer hit with zero CPU work.'
      anchor: a-row-request-becomes-page-work
    - title: Where a row lives determines locality
      brief: Compare a heap-organised table with a table organised around a clustered key using only the
        physical differences needed to reason about nearby rows, repeated page visits and row identity.
        Show how a row locator connects an index entry to a physical row without repeating the index article's
        access-path lesson. Distinguish key order from guaranteed physical contiguity and SQL result order.
        Use PostgreSQL and InnoDB as explicitly identified implementations rather than universal relational
        rules; link candidate indexes and their coverage costs to the index owner.
      anchor: where-a-row-lives-determines-locality
    - title: The working set includes more than the returned columns
      brief: Build a working-set picture from the table pages, index pages and other retained data actually
        touched by the workload, distinguishing this from total database size and available memory. Explain
        how row width, page occupancy and locality affect cache residency and reads. Follow a wide value
        through an engine's inline and out-of-line representation, including when the selected query needs
        to fetch or decompress it. Test whether narrowing the selected columns or separating rarely used
        values changes physical work; do not assume projection alone makes existing table pages smaller.
        Keep concurrent memory competition and resource sizing with the workload and operations owners.
      anchor: the-working-set-includes-more-than-the-returned-columns
    - title: Updates leave work behind them
      brief: Follow an update and a deletion through a clearly bounded versioned-storage illustration.
        Explain why a logical change can retain older data and require additional table, index or undo
        work, with the chosen engine's representation stated explicitly. Distinguish current rows, versions
        that readers may still need, reclaimable space, reusable space and space returned to the operating
        system. Explain why a long-lived snapshot or a lagging cleanup process can enlarge the working
        set even when the visible row count is stable. Refer to the transaction article for visibility
        and isolation semantics; own only their physical consequences here.
      anchor: updates-leave-work-behind-them
    - title: Decide whether layout and cleanup explain the cost
      brief: 'Connect the worked table''s growing page traffic to testable hypotheses: wider rows, scattered
        access, low page occupancy, retained versions or cleanup falling behind. Choose engine-supported
        observations that can distinguish these explanations, with their collection cost and scope. Distinguish
        external fragmentation, internal free space and lost locality rather than using one bloat percentage
        as a diagnosis. Explain ordinary reuse and cleanup before considering reorganisation, and show
        why a large file or a slow query alone does not establish a need to rebuild it.'
      heading:
      - title: Reorganisation exchanges future work for immediate work
        brief: Compare expected changes in page occupancy, locality and file size with rewrite I/O, temporary
          space, log generation, index work, locks and concurrent workload impact. State which effects
          depend on the selected engine and operation. Identify the evidence that would make the change
          worthwhile and the signs that continued churn would erase its benefit. Link the actual scheduling,
          rollout and recovery procedure to schema evolution and operations instead of supplying maintenance
          commands here.
        anchor: reorganisation-exchanges-future-work-for-immediate-work
      anchor: decide-whether-layout-and-cleanup-explain-the-cost
    - title: Partitioning helps only when it removes relevant work
      brief: Introduce local physical partitioning through one time-bounded query on the same table. Show
        an illustrative partition map and require observed evidence of which partitions and pages the
        engine accesses. Explain how predicates, partition bounds and engine-supported pruning affect
        whether work is eliminated, including runtime pruning only where the selected engine supports
        it. Compare the selective query with a query spanning all partitions, accounting for planning
        and per-partition access overhead. After the pruning experiment, hand the local-partition design
        and lifecycle decision to 'Operating replicas and partitioned data' (a38), which owns key and
        boundary choices, schema compatibility, continuing write coverage and the retain-or-reject decision.
        Link physical DDL to 'Changing schemas without breaking applications' (a29), and lifecycle and
        retirement gates to 'Changing a live database' (a06). Keep the physical explanation and measured
        benefit here; do not repeat their design or operating procedures or create another partitioning
        branch.
      anchor: partitioning-helps-only-when-it-removes-relevant-work
    - title: Choose a physical change from its measured effect
      brief: 'Finish the worked investigation with a small choice among reducing the touched data, improving
        locality, allowing cleanup to progress or changing the layout. Use the parent''s comparison method
        and preserve SQL results. Add this article''s necessary evidence: page and storage work, warm-cache
        conditions, retained versions, reusable and allocated space, and the immediate cost of the intervention.
        State whether each demonstration is an illustrative model or captured execution, record engine/version
        and relevant settings for captures, and explain when the evidence points onward to index design,
        concurrency diagnosis or operational maintenance.'
      anchor: choose-a-physical-change-from-its-measured-effect
- id: a25
  href: /review/relational-next/indexes/
  article:
    topic: Designing and evaluating relational indexes
    title: Choosing indexes for a workload
    brief: At the opening, require completion of Understanding and improving database performance, including
      its concluding Change one explanation into a measured improvement as the common comparison method
      used here. Derive index candidates from the work a relational workload needs, explain how their
      keys limit and order access, and decide whether their read benefit earns their write, space and
      operating costs. Use one tenant order-history workload with equality filters, a date range, an ordered
      first page and a related-row lookup. Extend it only when another query exposes a consequential trade-off.
      Own B-tree traversal, composite key order, coverage, base-row access and index eligibility. Supply
      a compact local reporting legend before using observed index evidence; no sibling article is a prerequisite.
      Offer Diagnosing a query from its execution plan for deeper evidence reading and plan-choice diagnosis.
      Link physical storage and safe schema changes to their owners. Keep the depth at choosing and evaluating
      relational indexes, without an index-family catalogue or another benchmarking curriculum.
    heading:
    - title: Start with the queries the workload must serve
      brief: 'Collect actual predicates, join keys, ordering, grouping, projected columns, parameter classes
        and execution frequency before proposing indexes. Record existing constraints and indexes, table
        size and change rate. Use the order history query to distinguish rows returned from rows inspected
        and to name the work a candidate should remove. Establish the competing write path and related-row
        lookup so the first successful query cannot decide the whole design. Link application query capture
        and the parent''s workload comparison method instead of repeating them. Give the local reporting
        legend here: estimates predict work; observed rows report execution, with the engine''s per-loop
        or total convention stated beside loops. Distinguish index entries examined, page accesses and
        base-row visits from rows returned; name the engine''s actual counters and do not invent unavailable
        entry counts. State whether page counters describe repeated accesses, cache hits or reads rather
        than assuming distinct pages or physical I/O. Keep model counts explicitly separate from captured
        execution. This is enough to assess the article''s index observations; deeper interpretation is
        optional reading in Diagnosing a query from its execution plan.'
      anchor: start-with-the-queries-the-workload-must-serve
    - title: Follow a B-tree from key to row
      brief: Build the minimum model of ordered keys, page traversal, matching leaf entries and row locators
        needed to explain an access path. Distinguish finding a starting point, scanning index entries
        and visiting base rows. Compare a few selective lookups with a broad result whose scattered row
        visits can make a scan preferable. Explain that selectivity, locality and cache state influence
        the cost; an index existing does not make its use cheaper. Use labelled illustrations rather than
        invented execution evidence, and link physical storage for page layout and working-set mechanisms.
      anchor: follow-a-b-tree-from-key-to-row
    - title: Put composite keys in the order the query can use
      brief: Compare candidate orders such as tenant, creation time and tenant, status, creation time
        against the shared workload. Trace equality prefixes and range bounds, distinguish keys that bound
        the scanned interval from later tests that reject entries, and show what changes when a leading
        condition is absent. Treat this as a baseline B-tree model and check the selected engine's actual
        access path for optimisations that can use later keys; avoid an absolute leftmost-prefix rule
        or a most-selective-column recipe.
      heading:
      - title: Join lookups and several query shapes compete for key order
        brief: Derive a candidate for repeated inner-side join probes from the values supplied by the
          outer side. Compare it with the index serving the history query, including whether an existing
          prefix already supplies useful access. Offer Diagnosing a query from its execution plan for
          deeper join-method explanation. Show why one composite index need not serve every optional filter,
          and why separate single-column indexes are not automatically equivalent to it.
        anchor: join-lookups-and-several-query-shapes-compete-for-key-order
      - title: Ordering and grouping can change the useful route
        brief: Follow index order through fixed equality keys, ascending or descending requirements, null
          placement and a bounded first page. Explain when an access path can avoid sorting or feed ordered
          grouping, and why filters, joins and the selected plan can still prevent that benefit. Keep
          SQL pagination correctness and aggregate semantics with their existing owners. Use engine-checked
          examples rather than promising that matching column names eliminate a sort.
        anchor: ordering-and-grouping-can-change-the-useful-route
      anchor: put-composite-keys-in-the-order-the-query-can-use
    - title: Decide which row visits are worth avoiding
      brief: 'Contrast search and ordering keys with extra returned values stored for coverage, using
        included columns where the selected engine supports them. Show how wider entries reduce density
        and increase storage and update work. Explain that containing every requested value only makes
        an index-only path possible: visibility checks and engine organisation can still require base-row
        visits. Inspect actual fetch evidence using the local reporting legend; offer Diagnosing a query
        from its execution plan for deeper evidence interpretation. Own this key-to-base-row explanation
        once and link storage for the underlying row and version mechanisms.'
      anchor: decide-which-row-visits-are-worth-avoiding
    - title: Check that the query is eligible to use the index
      brief: Separate a useful hypothetical key order from an index the engine can use for the actual
        expression and comparison. Check operand types, implicit conversions, comparison operators and
        collation against the selected engine; a textual resemblance between query and definition is insufficient.
      heading:
      - title: Index a subset or an expression when that removes real work
        brief: 'Introduce a partial or filtered index for a small active subset and an expression index
          for an actual transformed lookup. Explain predicate implication, expression compatibility, null
          semantics and engine rules for indexable expressions. Test representative parameterised statements:
          the planner may lack the information needed to prove a subset predicate. Account for rows entering
          or leaving the subset and for expression evaluation during writes. Keep plan caching mechanics
          with Diagnosing a query from its execution plan and uniqueness semantics with schema design.'
        anchor: index-a-subset-or-an-expression-when-that-removes-real-work
      - title: Change index family only for an access need B-trees do not meet
        brief: Use at most one workload-driven contrast, such as membership search within a document or
          a broad range over physically correlated data, to explain why another family could be a candidate.
          Verify supported operators, ordering, precision and any recheck work in primary engine documentation.
          Point to the relevant feature article for specialised search. Stop once the reader can identify
          a justified candidate to evaluate; do not survey access methods.
        anchor: change-index-family-only-for-an-access-need-b-trees-do-not-meet
      anchor: check-that-the-query-is-eligible-to-use-the-index
    - title: Count the obligations created by each candidate
      brief: Follow inserts, updates and deletes through additional index entries, including wider keys,
        changed indexed values, uniqueness checks and contention on busy key ranges. Assess space, write
        amplification and maintenance work at the workload's actual change rate. Separate an index's access
        role from a primary-key or uniqueness constraint's correctness role; a faster replacement cannot
        silently discard the constraint. Check foreign key lookup needs and engine-specific automatic
        index creation. Compare apparent duplicates by key order, predicates, expressions, included values
        and constraint dependencies before declaring one redundant.
      anchor: count-the-obligations-created-by-each-candidate
    - title: Keep the candidate only if its benefit survives the workload
      brief: 'Apply Change one explanation into a measured improvement, the completed performance parent''s
        common comparison method, to the index hypothesis: confirm reduced entries examined, base-row
        fetches or sorting in observed plans, then compare workload reads and writes including tail latency,
        throughput and index size. Include large and small tenants, common and rare values, nulls, skew,
        different range widths and changing query mixes. If the predicted route is not selected, hand
        the estimate-versus-observation mismatch to Diagnosing a query from its execution plan for deeper
        diagnosis rather than forcing index use. Distinguish a favourable demonstration from captured
        execution evidence. End with a justified retain, revise or remove decision and its regression
        signals. Link creation, validation, constraint replacement and removal to schema evolution and
        operations for locking, resource headroom and recovery; index design alone does not establish
        a safe live deployment procedure.'
      anchor: keep-the-candidate-only-if-its-benefit-survives-the-workload
- id: a26
  href: /review/relational-next/query-plans/
  article:
    topic: Reading and diagnosing relational execution plans
    title: Diagnosing a query from its execution plan
    brief: 'Complete one ordinary slow-query investigation in PostgreSQL: collect safe evidence, follow
      physical rows and repeated work, interpret reporting units, explain a consequential estimate error,
      test a targeted remedy and accept it against the workload. Use the same reporting query throughout,
      including common and rare prepared parameters, so statistics and plan choice resolve the original
      diagnosis rather than begin another tour. Record the concrete engine version and verify its behaviour
      against primary documentation. Distinguish captured evidence from illustrative arithmetic and explain
      what each observation cannot establish. Keep uncommon nodes, parallel variants and planner controls
      conditional and compact. Link index design, storage mechanisms, concurrent-load diagnosis and the
      parent''s comparison method to their owners; do not expand into optimiser or storage-engine specialism.
      No further article is required to finish this task.'
    heading:
    - title: Collect evidence for the slow report safely
      brief: Establish one query joining customers, orders and order lines, filtering a dated interval
        and region, grouping totals and returning an ordered limited result. Supply schema, relevant indexes,
        data distribution, common and rare parameters, and a small correctness fixture covering duplicates,
        nulls and ties. Distinguish estimated EXPLAIN from execution-based EXPLAIN ANALYZE before showing
        the latter on disposable data. Explain that execution can write, invoke effectful functions or
        triggers, take locks and consume shared resources; a rollback does not undo every effect, including
        sequence or external work. Use ANALYZE and BUFFERS appropriately, explaining TIMING and optional
        I/O timing. Record version, settings, parameters, capture conditions and whether each plan is
        captured or illustrative. Link production collection procedures to operations. State the observed
        slowness and the question this evidence can answer.
      anchor: collect-evidence-for-the-slow-report-safely
    - title: Follow where the report spends its work
      brief: Read the plan tree as physical data dependencies with consumer demand, rather than SQL clause
        order. Follow candidate rows through scan conditions, filters, base-row fetches and join inputs
        to the final groups and ordering. Teach sequential, index and bitmap access only far enough to
        interpret the case's conditions, rechecks and heap work; reuse index and storage explanations.
        Trace nested-loop repeated probes, hash build/probe and merge input ordering with compact alternatives
        where needed to compare physical work without changing join semantics. Identify late filtering
        and large intermediates. Explain blocking sorts and aggregation, reported memory/disk use, hash
        batches and temporary work where the case requires them. A spill indicates work and resource pressure,
        not by itself bad statistics or a safe global memory increase. Explain Materialize or Memoize
        briefly only if the captured plan needs saved or parameter-keyed reuse; omit an independent node
        catalogue.
      anchor: follow-where-the-report-spends-its-work
    - title: Interpret counts, costs and timings before blaming a node
      brief: Annotate estimated rows, width, startup and total cost alongside observed rows, loops and
        startup/total time using PostgreSQL's actual averaging and rounding conventions. Derive total
        row work from per-loop figures only where their semantics permit it. Separate arbitrary planner
        cost units from elapsed milliseconds, inclusive node time from exclusive work, and planning/execution
        reports from application latency. Never sum inclusive node timings or buffer reports. Interpret
        shared hits, reads, dirtied/written blocks and temporary blocks without equating a buffer read
        with physical device I/O. Explain instrumentation overhead and the evidence lost with per-node
        timing disabled. Account for partially consumed inputs, LIMIT, never-executed branches and varying
        loops before comparing estimates. If parallel nodes occur, add a compact annotated worker fragment
        showing planned/launched workers, leader participation and the version's aggregate/per-worker
        conventions; overlapping intervals cannot be added into elapsed time or exclusive CPU time. Keep
        a separate parallel variant optional.
      anchor: interpret-counts-costs-and-timings-before-blaming-a-node
    - title: Locate the first error that could change the choice
      brief: Walk backwards from the case's repeated work or large intermediate to the earliest consequential
        estimate/observation mismatch on a sufficiently consumed input. Distinguish an estimate fault
        from accurate predictions of genuinely expensive necessary work, misleading early termination
        and runtime conditions. Explain how underestimated rows can favour repeated lookups or alter join
        ordering and expected sort/hash sizes; the largest error ratio is not automatically the useful
        target. Build a short simplified calculation of table size, predicate selectivity and join multiplicity,
        clearly labelled as a model rather than PostgreSQL's estimator. Relate rows, width and anticipated
        CPU/page work to comparison of legal plans, without suggesting costs are measured duration or
        row estimates directly allocate fixed memory. State one falsifiable explanation for the report
        and the next observation needed.
      anchor: locate-the-first-error-that-could-change-the-choice
    - title: Check the statistics behind that prediction
      brief: 'Inspect the implicated table estimates and pg_stats summaries alongside bounded observations
        of the actual data, accounting for diagnostic query cost. Explain null fractions, distinct values,
        common-value frequencies and histograms through the case''s skew; use a dependent same-table predicate
        pair to show why independent selectivities can mislead. Distinguish that dependency from physical
        value/order correlation used in access costing. Separate stale statistics after data changes,
        sampling or summary limits and unrepresented dependencies; fresh statistics remain approximate.
        Choose one case-supported remedy: targeted ANALYZE for drift, an increased statistics target for
        missing consequential skew, or supported extended statistics with subsequent data collection.
        Compare estimates and resulting work after an isolated change. Use versioned planner-statistics
        and CREATE STATISTICS documentation to bound supported predicate forms; do not promise cross-table
        join correction. Account for analysis, planning and continuing maintenance costs. Keep other remedies
        a short hypothesis-to-test table, not extra investigations.'
      anchor: check-the-statistics-behind-that-prediction
    - title: Check the application's common and rare parameters
      brief: Run the same report through its actual session and preparation path with a common and a rare
        parameter, distinguishing driver preparation decisions from server prepared execution. Compare
        PostgreSQL custom and generic plans to show the information available for known values versus
        reusable unknown parameters and the planning-time trade-off. Explain automatic selection, reuse
        and documented invalidation or replanning triggers from the selected version's PREPARE and plan_cache_mode
        documentation; a literal-only test does not establish application behaviour. Check whether the
        targeted statistics remedy helps both parameter classes or leaves a preparation-sensitive choice.
        If necessary, test a locally scoped preparation or cache-mode change against both classes including
        planning overhead. Do not turn this into a catalogue of engine caching rules or planner settings.
      anchor: check-the-application-s-common-and-rare-parameters
    - title: Verify the remedy and close the investigation
      brief: 'Complete an evidence ledger connecting the original symptom, supported cause, isolated remedy,
        changed estimates, physical work and measured outcome. Verify result equivalence for duplicates,
        nulls, conversions, ordering and LIMIT before comparing performance, including any predicate rewrite.
        Reuse the parent''s representative workload comparison method to check common and rare parameters,
        concurrency, end-to-end latency, completed work and relevant write/resource costs; a faster isolated
        execution is not sufficient acceptance. State remaining uncertainty and when drift requires rechecking.
        If accurate estimates still leave a surprising choice, briefly explain bounded legal alternatives
        and imperfect costing. Use a scoped planner control only as a conditional experiment: a faster
        alternative supports a hypothesis but does not prove its root cause; retaining a control requires
        scope, rationale and a removal condition. Route new index design or concurrent contention to their
        owners. Finish with the verified ordinary remedy and its acceptance record, so the reader can
        complete this diagnosis in one destination.'
      anchor: verify-the-remedy-and-close-the-investigation
- id: a28
  href: /review/relational-next/concurrent-load/
  article:
    topic: Relational workload contention and capacity
    title: Improving performance under concurrent load
    brief: Diagnose why a relational workload slows as concurrent demand grows, and choose changes that
      improve useful completed work and tail latency. Distinguish the work of an individual execution
      from queuing and competition for resources. Use one mixed workload and selected engine evidence
      to connect demand, outstanding work, resource pressure and serial bottlenecks to an intervention.
      Reuse the parent's common comparison method and the storage, plan, transaction and application-integration
      explanations. Keep pool implementation, service budgets, provisioning procedures and recovery with
      their existing owners.
    heading:
    - title: Locate where the extra time appears
      brief: Introduce a workload with short account updates and longer reporting queries whose isolated
        executions are acceptable but whose concurrent latency rises. Trace the measured interval from
        application admission and connection acquisition through database execution and completion. Separate
        application waiting from database waits, active work and result transfer; link connection handling
        to application integration. Compare the same query and parameter classes alone and under load
        without assuming that a fast isolated plan explains concurrent behaviour.
      anchor: locate-where-the-extra-time-appears
    - title: Count arrivals, completions and outstanding work together
      brief: Establish a single measurement boundary and distinguish offered demand, admitted work, starts,
        successful completions, failures and timeouts. State which work remains outstanding after a caller
        stops waiting. Follow rates, outstanding work and latency through a steady interval and an interval
        where arrivals exceed departures; do not describe a growing queue as a stable capacity measurement.
      heading:
      - title: An average relationship needs a stable population
        brief: Use a labelled illustrative calculation relating average outstanding work, achieved throughput
          and average time within the same boundary. State steady-state, consistent-unit and representative-window
          assumptions. Explain why the relationship neither predicts a tail percentile nor supplies a
          universal concurrency setting, and why a transient overload requires tracking accumulation and
          drainage.
        anchor: an-average-relationship-needs-a-stable-population
      - title: A waiting client can hide demand
        brief: Contrast clients that wait for completion before issuing more work with an arrival schedule
          independent of response time. Show how slow responses can reduce the former's offered rate and
          conceal overload. Record intended arrivals, actual admissions and achieved completions; distinguish
          scheduled-arrival latency from execution-only latency. Treat retries as additional demand and
          link their correctness and deadline policies to application integration.
        anchor: a-waiting-client-can-hide-demand
      anchor: count-arrivals-completions-and-outstanding-work-together
    - title: Find what the concurrent executions are competing for
      brief: Correlate the workload slowdown with engine activity, wait categories and host resource evidence
        over the same interval. Use PostgreSQL as one concrete evidence path, verifying views and reporting
        semantics against primary documentation. Distinguish accumulated counters, interval rates, gauges
        and sampled activity. A wait name or a high utilisation figure is a hypothesis to investigate,
        not a diagnosis by itself.
      heading:
      - title: CPU, memory and storage pressure
        brief: Separate CPU demand and runnable competition from storage waits and temporary-file work.
          Compare query classes and plans for repeated work, spill evidence and parallel workers, using
          the plan-reading sibling for interpretation. Investigate the aggregate memory needs of concurrent
          operators and workers before changing per-operation limits. Relate cache misses and the active
          working set to physical I/O without treating a cache-hit ratio as an explanation of latency;
          link page and locality mechanics to physical storage.
        anchor: cpu-memory-and-storage-pressure
      - title: A hot row can limit a mostly idle database
        brief: Follow a blocking chain to the owning transaction and the business operation that holds
          the contested row. Distinguish transaction locks from engine-specific page or internal synchronisation
          waits. Explain how concentrated access can serialise progress despite spare CPU or storage capacity.
          Diagnose transaction duration, statement work and access skew without treating weaker isolation
          as a general performance remedy; link locking guarantees and deadlocks to transactions.
        anchor: a-hot-row-can-limit-a-mostly-idle-database
      - title: Background work and old transactions change the competition
        brief: Correlate maintenance, checkpoints or other background activity with foreground waits and
          completed work, using the selected engine's actual mechanisms. Investigate long transactions
          and snapshots for their workload consequences, including retained versions, larger working sets
          and constrained cleanup. Link version-retention mechanics to physical storage and maintenance
          procedures to operations. Assess deferred maintenance debt as well as immediate foreground gains.
        anchor: background-work-and-old-transactions-change-the-competition
      anchor: find-what-the-concurrent-executions-are-competing-for
    - title: Match the intervention to the limiting resource
      brief: Return to the mixed workload and choose a change from the evidence. Explain the expected
        change in demand, queuing or serial work before comparing outcomes. Preserve SQL results, transaction
        guarantees and business invariants while testing performance hypotheses.
      heading:
      - title: Bound the work in progress
        brief: Test a small set of active-concurrency limits and workload schedules. Compare useful completions
          and latency across both the admission queue and database, so moving a queue does not masquerade
          as an improvement. Show why fewer active executions can reduce competition and why too few can
          leave useful resources idle. Account for rejected or deferred demand and starvation of long
          work. Link pool implementation and request deadline handling to application integration.
        anchor: bound-the-work-in-progress
      - title: Reduce work and shorten serial sections
        brief: Use plan and index evidence to reduce work in the competing query classes, linking design
          details to their sibling articles. Evaluate batching against per-item overhead, lock duration,
          memory, transaction size and fairness. Test whether shortening a transaction or changing how
          a hot business record is updated removes contention while preserving its invariant; do not imply
          that adding resources removes an inherently serial dependency.
        anchor: reduce-work-and-shorten-serial-sections
      - title: Reconsider parallel work and targeted resources
        brief: Compare faster individual reports with their aggregate CPU, memory, storage and worker
          demand alongside short transactions. Test whether changing parallelism improves total completed
          work and the latency of each class. Consider additional CPU, memory or storage capability only
          when evidence predicts relief of that resource limit, and check for the next bottleneck. Hand
          provisioning execution to operations.
        anchor: reconsider-parallel-work-and-targeted-resources
      anchor: match-the-intervention-to-the-limiting-resource
    - title: Test the proposed limit without hiding the overload
      brief: Apply the parent's comparison method to a bounded concurrency and demand sweep, keeping query
        mix, parameter skew, transaction duration and cache conditions representative. State a stop condition
