article:
  topic: Relational isolation guarantees and implementations
  title: Reading and testing isolation guarantees
  brief: Teach relational practitioners to turn an engine's documented isolation contract and reproducible
    concurrent sessions into a justified choice of protection and abort handling. Reuse a reservation
    invariant to trace snapshot visibility, locking reads and concurrent changes, then introduce a staffing
    invariant only to expose a distinct multirow dependency. Compare PostgreSQL and MySQL InnoDB only
    where a verified difference changes the application decision. Distinguish snapshot isolation, serialisability
    and real-time ordering. Label illustrative schedules separately from observed runs; record engine
    version, settings, observations and the limited conclusions each run supports. Link to the locking
    article for protocol construction and to application integration for retry machinery. Stop at the
    implementation depth needed to use relational transactions correctly.
  heading:
  - title: Turn an isolation name into a contract
    brief: Start with the reservation invariant and the observations a transaction uses to decide whether
      to accept a booking. Read the selected engine's primary documentation for the exact version, isolation
      setting, transaction mode and statement forms. Extract when reads become visible, which conflicting
      changes wait or fail, and what a successful commit promises. Treat the isolation-level name as an
      entry to that contract rather than a portable list of guarantees. State which assumptions belong
      to the database and which require every writer to follow an application protocol; link to the parent
      for choosing that protocol.
    anchor: turn-an-isolation-name-into-a-contract
  - title: Establish when the transaction sees a change
    brief: Use a two-session reservation schedule to compare two ordinary reads separated by another transaction's
      commit. Trace statement and transaction snapshots and the transaction's own changes, identifying
      when the snapshot is established rather than assuming BEGIN fixes it. Compare selected PostgreSQL
      and InnoDB settings only where the resulting visibility changes the booking decision. Explain versioned
      reads just far enough to show why a stable view need not reserve the data being read. Keep long-lived
      snapshot resource costs with performance and operations.
    anchor: establish-when-the-transaction-sees-a-change
  - title: Read and update can consult different states
    brief: Extend the same schedule with a locking read and a concurrent update. Predict which operation
      waits, which row version or condition it can use after the competing transaction finishes, and whether
      it can abort instead of proceeding. Verify the relevant engine and statement behaviour before deriving
      an obligation. Include a conditional capacity change so readers distinguish a checked atomic change
      from an earlier ordinary read followed by an unguarded write. Examine a mixed ordinary-read and
      locking-read transaction where that distinction affects the result; do not imply that every statement
      in a transaction necessarily consults one common view. Link to the locking article for choosing
      protected rows, lock modes, acquisition order and deadlocks.
    anchor: read-and-update-can-consult-different-states
  - title: A consistent snapshot can still permit an invalid combination
    brief: Introduce the staffing rule that at least one person must remain available. Let two transactions
      read the same qualifying set and change different rows; draw the read/write dependencies that make
      their combined outcome impossible in a serial execution. Explain why preventing conflicting writes
      to one row does not by itself protect a predicate or multirow invariant. Use this case to distinguish
      snapshot isolation from serialisability, then relate an insert into a previously read predicate
      to the same coverage question without adding an anomaly catalogue. Show why row-repeatability alone
      is insufficient evidence for the application's guarantee.
    anchor: a-consistent-snapshot-can-still-permit-an-invalid-combination
  - title: Serialisability protects an outcome by ordering or rejection
    brief: Apply the selected engines' documented serialisable contracts to the staffing schedule. Explain
      only the implementation detail needed to understand the observed choice between blocking and conflict
      detection; distinguish a dependency-tracking mechanism from a lock that blocks a writer. Derive
      the obligation to reconsider and rerun the whole database transaction after a relevant known abort,
      including reads and decisions, rather than retrying only the rejected statement. A particular failed
      run neither identifies every possible victim nor guarantees every repetition will abort. Link to
      application integration for retry limits, deadlines and external effects, and to the parent for
      the distinction between a known abort and an unknown commit outcome.
    anchor: serialisability-protects-an-outcome-by-ordering-or-rejection
  - title: A serial order does not establish a real-time order
    brief: Use a compact timeline to distinguish equivalence to some serial execution from a guarantee
      that also respects completed-before-started operations. Explain why an application's claim about
      an earlier acknowledgement and a later observation needs an explicitly documented ordering and read-path
      guarantee. Do not infer such a guarantee merely from the word serialisable, a timestamp or an experiment.
      Keep distributed replication and stronger cross-service ordering analysis with their owning articles.
    anchor: a-serial-order-does-not-establish-a-real-time-order
  - title: Build a repeatable check and state what it proves
    brief: Assemble the earlier cases into a small disposable two-session worksheet with schema, seed
      rows, explicit transaction settings and ordered session steps. Coordinate the interesting interleaving
      through visible checkpoints rather than timing guesses. Record exact engine version, relevant settings,
      statements, returned rows, blocking, errors, commit results and the final invariant check; identify
      each expected result separately from an observed run. Pair observations with version-matched primary
      documentation in a compact comparison that ends in a concrete choice of protection or whole-transaction
      retry obligation. Include an adversarial interleaving and a changed query or insert that challenges
      the conclusion. Explain that a passing schedule can expose a counterexample but cannot prove safety
      for all executions; finish with the contract-based argument covering the reads, writes and assumptions
      the application actually uses. Recheck relevant cases when an engine upgrade, setting or query changes.
    anchor: build-a-repeatable-check-and-state-what-it-proves
