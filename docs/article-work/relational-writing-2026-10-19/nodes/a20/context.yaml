original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational connection and transaction lifecycle management
  title: Managing connections and transaction lifetimes
  brief: Teach how to own a stateful database connection from acquisition to safe reuse or disposal, including
    exceptions, cancellation, streaming and shutdown. Separate application handles, pool leases, transactions
    and database sessions; verify their relationship against the chosen driver and any proxy. Diagnose
    occupied pools using acquisition wait, lease duration, active database work and connection counts,
    then bound admission and aggregate connection demand. Extend the parent's ordinary request example
    through resource failures rather than repeating it. Own cancellation and connection-reuse mechanics
    here; link to request recovery for deadlines, idempotency and decisions about uncertain operation
    outcomes, to transactions for correctness guarantees and to performance and operations for workload
    capacity and service budgets.
  heading:
  - title: Know what a borrowed handle owns
    brief: Draw the ownership chain from application task through pool lease and driver connection to
      database session, with a transaction and result stream attached to their actual owner. Show why
      a convenient pool-level query call may acquire a different connection each time, while a multi-statement
      transaction needs the affinity guaranteed by its transaction handle or checked-out client. Verify
      implicit transaction and autocommit behaviour, concurrent use restrictions and commit-on-context-exit
      behaviour against the selected API; do not infer them from similarly named methods in another driver.
      Use PostgreSQL with one pinned driver as the concrete case, distinguishing its behaviour from the
      general ownership questions. The node-postgres transaction documentation supplies one explicit same-client
      example at https://node-postgres.com/features/transactions.
    anchor: know-what-a-borrowed-handle-owns
  - title: Return only a connection that is ready for another borrower
    brief: 'Extend the parent''s success and error path into a small resource-state diagram: waiting,
      acquired, in use, cleaning up, reusable or discarded. Give each lease one owner and one terminal
      release or discard, including failures during begin, execution, rollback and cleanup. Await completion
      and required result draining before reuse; finish or roll back an open transaction through the chosen
      API, and distinguish a clean idle session from one in a failed transaction. Preserve the original
      operation error while recording cleanup failure. Explain what the pool actually resets on return
      and when broken protocol, failed cleanup or uncertain connection state requires disposal. Resource
      disposal does not settle an operation''s commit outcome; hand that question to request recovery.'
    heading:
    - title: Cancellation is a cleanup sequence
      brief: Follow cancellation while waiting for a lease, executing a statement and cleaning up. Verify
        whether cancelling acquisition removes the queued waiter; prevent a late acquisition from becoming
        an unowned lease. Distinguish a cancellation request from observed command termination, then await
        the driver's completion and protocol synchronisation requirements, roll back when needed and release
        or discard. Keep required cleanup alive when the caller's task is cancelled, using the runtime's
        supported mechanism and a bounded cleanup allowance; never return a connection while work or results
        still belong to the old borrower. Use the chosen driver's documentation and PostgreSQL's cancellation
        contract at https://www.postgresql.org/docs/18/libpq-cancel.html as implementation evidence, without
        presenting libpq calls as another driver's API. Request recovery owns interpreting timeouts and
        deciding whether to retry or reconcile.
      anchor: cancellation-is-a-cleanup-sequence
    anchor: return-only-a-connection-that-is-ready-for-another-borrower
  - title: Match session state to the pooling mode
    brief: Compare a direct connection, an application pool and a transaction-pooling proxy only where
      they change state ownership and reuse. Track temporary settings, role or tenant context, temporary
      objects, prepared statements and cursors across transaction end and lease return. Prefer transaction-scoped
      state when supported, verify reset guarantees and discard when safe isolation between borrowers
      cannot be established. Distinguish SQL-level preparation from protocol-level preparation and driver
      statement caches; support depends on proxy version and configuration. Use a compact compatibility
      example from https://www.pgbouncer.org/features.html and the selected driver's documentation, rather
      than a universal claim that transaction pooling preserves or forbids all prepared statements. Keep
      authorisation design in the parent and query-plan behaviour in performance.
    anchor: match-session-state-to-the-pooling-mode
  - title: Keep result consumption inside the resource lifetime
    brief: Show a slow consumer holding a cursor, transaction or leased connection after database execution
      has produced rows. Make stream ownership explicit through full consumption, early loop exit, consumer
      error and disconnect. Close or cancel the stream, await the driver's required draining or acknowledgement,
      close its transaction where applicable and only then return the lease. Verify cursor lifetime and
      fetch buffering for the selected API; do not assume all streaming APIs retain the same resources.
      Bound consumer hold time and choose bounded materialisation or shorter retrieval units only when
      their result semantics allow it, linking query composition and SQL for those choices. Explain the
      retained connection and open-transaction consequences without reteaching snapshot or retained-version
      mechanics.
    anchor: keep-result-consumption-inside-the-resource-lifetime
  - title: Bound demand before enlarging the pool
    brief: Separate admitted application work, queued acquisition, leased client connections, proxy queues
      and database sessions. Bound the acquisition queue and wait, shed work when it cannot obtain a lease
      within the caller's supplied budget and avoid holding a lease across unrelated external calls. Allocate
      a connection allowance across application replicas, overlapping deployments, background workers
      and distinct pools, leaving the operational reserve supplied by operations. Show an explicitly illustrative
      aggregate-count example; behind a proxy distinguish frontend client counts from backend database-session
      limits. An increased pool is a hypothesis to validate against completed work and contention, not
      a default response to waiting. Link performance for concurrent-load diagnosis and operations for
      selecting service capacity and reserve; do not derive another sizing theory.
    anchor: bound-demand-before-enlarging-the-pool
  - title: Find where the lease time goes
    brief: Correlate acquisition wait and timeout counts, queue depth, leased and idle counts, lease-duration
      distributions and database-session activity for one request or worker. Use contrasting traces to
      distinguish a missing release, idle open transaction, slow result consumer, slow or blocked SQL,
      exhausted admission and stale idle connection; high occupancy alone does not identify the cause.
      Separate executing database time from application time while holding the lease, and account for
      proxy-side waiting where present. Put borrower identity and transaction age alongside counts so
      an investigation can find the owner. Repair ownership or cleanup defects here; hand SQL and workload
      bottlenecks to performance and service-wide incident response to operations. Verify driver behaviour
      on idle disconnects and replacement so validation, connection lifetime settings and reconnect handling
      do not become assumptions that a successful borrow proves the next statement will succeed.
    anchor: find-where-the-lease-time-goes
  - title: Prove cleanup across failures and shutdown
    brief: Use a tiny real-driver pool to expose leaks quickly. Inject a statement error, cancellation
      during acquisition and execution, early stream termination, failed rollback and connection loss;
      after each case check that every lease has returned or been discarded, no abandoned transaction
      remains and the next borrower receives usable state without the previous borrower's settings. Record
      driver, database and proxy versions and configuration, distinguishing captured behaviour from the
      explanatory state diagram. For shutdown, stop admission and background acquisition, let owners finish
      within a bounded grace period, clean up or close remaining connections through the documented API
      and await pool closure. Test that a leaked lease cannot make shutdown wait indefinitely. Keep uncertain
      business outcomes discoverable for the request-recovery owner rather than treating successful process
      exit as proof of transaction completion.
    anchor: prove-cleanup-across-failures-and-shutdown
