neighbours:
- id: a21
  slug: generated-queries
  title: Controlling the queries your application performs
  brief: Make handwritten SQL, query builders and ORM operations accountable for the database work a request
    performs. Use one bounded order-list example to trace statements, round trips, returned rows and materialised
    objects; diagnose lazy loading, N+1 reads, joined collection multiplication and implicit writes. Choose
    projections, loading strategies and batch sizes that preserve the required result while bounding application
    work. Inspect pagination and streaming at the abstraction boundary, preserve binding and authorisation
    during composition, and test representative query and result bounds against the selected database
    and library. Build on the parent's ordinary request and security explanation; leave SQL semantics,
    physical execution tuning, connection cleanup and request recovery with their existing owners.
  parent: a04
  href: /review/relational-next/generated-queries/
