    anchor: find-the-reads-hidden-behind-object-access
    level: 2
  - title: Choose a loading shape for the response
    anchor: choose-a-loading-shape-for-the-response
    level: 2
  - title: See what joined collections multiply
    anchor: see-what-joined-collections-multiply
    level: 3
  - title: Bound separate loads and batches
    anchor: bound-separate-loads-and-batches
    level: 3
  - title: Keep pages and streams bounded through materialisation
    anchor: keep-pages-and-streams-bounded-through-materialisation
    level: 2
  - title: Inspect the writes and transactions an abstraction introduces
    anchor: inspect-the-writes-and-transactions-an-abstraction-introduces
    level: 2
  - title: Preserve binding and authority as queries are composed
    anchor: preserve-binding-and-authority-as-queries-are-composed
    level: 2
  - title: Test the generated work as part of the operation's contract
    anchor: test-the-generated-work-as-part-of-the-operation-s-contract
    level: 2
- id: a23
  slug: background-work
  title: Connecting transactions to background work and events
  brief: Make work beyond a relational transaction discoverable and recoverable. Follow one committed
    order and its external fulfilment request through a transactional job or outbox record, worker ownership,
    repeated attempts and uncertain external outcomes. Compare direct calls and database change capture
    by their remaining failure windows. Bound event contracts, ordering, retention and replay to what
    is needed to account for committed intent; reuse transaction concurrency and request-idempotency mechanisms
    rather than deriving them again.
  parent: a04
  href: /review/relational-next/background-work/
  children: []
  sections:
  - title: Find the gap between committing and doing the work
    anchor: find-the-gap-between-committing-and-doing-the-work
