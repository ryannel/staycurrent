format: 'Astro content fragment: frontmatter imports permitted; opening prose, then contents nav, article
  h2/h3 sections with IDs, sources section. Shared route wrapper supplies h1/title metadata, breadcrumbs,
  article container and bottom child reading list. Use the provided headings as scope/flow, adapting wording
  naturally; no outer html/body or SiteLayout. Article components may use native Astro scripts and scoped
  CSS. Own component files only in assigned directory. Save the staged draft at output, but write imports
  as they will resolve at final_article_path (normally ../../components/relational-next/your-id/). The
  orchestrator will copy a returned draft there for browser review. Do not write the final src article
  path or wait for review capacity. Use the supplied heading anchor values as HTML IDs; retain them when
  wording a heading naturally, so contextual prerequisite links remain stable. Figure-internal titles
  use figcaption or styled paragraphs, not h2/h3/h4 elements: the site check forbids headings inside figures.'
