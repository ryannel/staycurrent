original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational replication, failover and data placement
  title: Operating replicas and partitioned data
  brief: Choose and operate a relational topology against explicit availability, data-loss, recovery and
    read-freshness requirements. Follow changes from the writer to a replica, distinguish acknowledgement
    from replay and usable reads, then practise safe promotion, exclusion of the former writer, reconnection
    and rejoining. Decide whether local table partitioning preserves the schema and earns its continuing
    lifecycle cost, then distinguish it from distributing database ownership and assess the routing, transaction,
    movement and recovery costs of the latter. Use selected-engine and managed-service contracts and bounded
    failure rehearsals to establish what the deployment can actually deliver. Keep consensus theory, query
    tuning, application retry mechanics and backup restoration with their owners.
  heading:
  - title: Turn service requirements into a placement decision
    brief: Start with one relational service whose writers, readers and failure domains are visible. Specify
      acceptable interruption, lost acknowledged changes, freshness and latency for named failures before
      adding replicas or locations. Compare a larger single writer, read replicas, a standby, and distributed
      ownership by the requirement each addresses. Identify whether the proposed placement leaves shared
      dependencies that defeat the intended protection; reuse the parent's responsibility map for self-managed
      and hosted duties.
    anchor: turn-service-requirements-into-a-placement-decision
  - title: Follow a committed change to a replica
    brief: Use a change timeline to separate local commit, sending, receiving, durable storage and replay.
      Explain physical replication and logical change replication by their copied units and resulting
      compatibility, schema, object-coverage and promotion restrictions. Check those restrictions for
      the chosen engine and version rather than treating every replication target as an interchangeable
      standby.
    heading:
    - title: Decide what an acknowledgement promises
      brief: Compare asynchronous and synchronous acknowledgement at their documented stages and participating
        members. Trace what the client can be told during replica loss or a broken connection, which copies
        may contain an acknowledged change, and when writes wait or fail. Relate timeout, quorum or synchronous-member
        policy to the deployment's data-loss and availability requirements without developing a general
        consensus course. Link transaction outcomes and application reconciliation to their existing owners.
      anchor: decide-what-an-acknowledgement-promises
    - title: Keep the stream able to catch up
      brief: Distinguish transport backlog from replay backlog and explain why elapsed lag, bytes behind
        and application-visible freshness answer different questions. Establish retention and disk-pressure
        limits for a disconnected or slow member, including any mechanism that holds logs for it. Decide
        when catching up is feasible and when the documented rebuild path is required, linking service
        alerting and storage budgets to monitoring.
      anchor: keep-the-stream-able-to-catch-up
    anchor: follow-a-committed-change-to-a-replica
  - title: Send each read to a copy that can answer it
    brief: Classify reads by whether stale results are acceptable, a preceding write must be visible,
      or a transaction needs a documented consistent view. Explain how replay progress, routing, connection
      lifetime and engine-specific replica restrictions affect those choices. Work through a read immediately
      after an update and a read during replica lag; choose writer routing, a supported progress barrier
      or another documented service feature where appropriate. Include replica resource contention and
      query cancellation only where they change routing or operating policy, leaving query optimisation
      and client implementation elsewhere.
    anchor: send-each-read-to-a-copy-that-can-answer-it
  - title: Replace a writer without leaving two authorities
    brief: 'Develop one promotion runbook from a failed-writer scenario: establish the observed state
      and recovery budget, identify an eligible candidate and its recoverable position, exclude the former
      writer, promote through the supported mechanism, switch routing and validate service. Explain why
      inability to reach the old writer is insufficient evidence that it can no longer accept writes.
      Distinguish planned switchovers from unplanned promotion and state the go/no-go evidence for each
      step.'
    heading:
    - title: Reconnect clients and establish the result
      brief: Account for cached discovery, proxies, connection pools and existing sessions when changing
        the writer endpoint. Validate that new writes reach the intended authority and required reads
        see them. Record interruption and any lost acknowledged changes; hand uncertain request outcomes
        to application reconciliation rather than repeat its retry and idempotency procedures.
      anchor: reconnect-clients-and-establish-the-result
    - title: Rejoin or replace the former member
      brief: Keep the old writer excluded until its history and the new writer's history have been compared
        using supported procedures. Choose catch-up, rewind where supported, or replacement from an authorised
        source; verify required logs, compatibility, capacity and replica health before readmission. Link
        to the backup article when restoration supplies the replacement, without teaching a second restoration
        procedure.
      anchor: rejoin-or-replace-the-former-member
    anchor: replace-a-writer-without-leaving-two-authorities
  - title: Choose between local partitions and distributed ownership
    brief: 'First work one time-retained event table through a local-partition decision. Choose its partition
      key and boundaries from access patterns and retention work, accounting for skew and queries that
      span partitions; link measured pruning benefit to performance. Check the selected engine''s uniqueness,
      reference and index arrangements against the table''s invariants, distinguishing the intended logical
      rules from what the available objects enforce. Define the treatment of future, late and corrected
      rows when a partition is missing or a boundary changes, including corrections that move a row between
      partitions. Assign ownership of advance creation and retirement. For one attachment or removal,
      state the gates for proceeding, pausing and declaring completion: valid coverage of continuing writes,
      compatible schema and dependencies, verified data and required retention, and confirmed post-change
      routing and results. Link physical schema-change, locking and resource procedures to a29, live lifecycle
      and retirement procedures to a06, and ongoing capacity and alerting to monitoring. Finish with an
      explicit retain-or-reject decision against an ordinary unpartitioned table, counting the operating
      work as well as the measured benefit; do not build a partitioning catalogue or repeat those procedures.
      Then distinguish that local layout from assigning data and write ownership across database services.
      Show a relational workload whose demand cannot be met by moving reads alone, and evaluate whether
      distributing it is justified. Treat application-managed shards and an integrated distributed relational
      service as different operating contracts; inspect documented routing, placement and transaction
      guarantees rather than inferring them from the label.'
    heading:
    - title: Choose a key and trace work across owners
      brief: Follow a tenant or order key through routing, unique constraints, joins and transactions.
        Assess skew, hot keys, shared tables and operations without the routing key. Contrast colocated
        work with cross-owner work using the selected implementation's guarantees and latency costs. Keep
        local partition pruning with performance and correctness mechanisms with transactions; use them
        here to decide whether the placement satisfies the workload.
      anchor: choose-a-key-and-trace-work-across-owners
    - title: Move ownership and retain a recovery path
      brief: Explain how growth, skew or location requirements lead to moving data and changing routing.
        Require a documented cutover boundary, write authority, validation and rollback or forward-recovery
        option. Assess spare capacity, per-owner replica protection and recovery coordination, including
        whether a restore can establish the required cross-owner consistency. Link detailed live moves
        and restoration to their owners; do not create a resharding speciality.
      anchor: move-ownership-and-retain-a-recovery-path
    anchor: choose-between-local-partitions-and-distributed-ownership
  - title: Check the actual hosting and distribution contract
    brief: Apply the preceding questions to a managed high-availability service and a distributed relational
      deployment. Identify who detects failure, excludes writers, promotes or changes ownership, updates
      endpoints and repairs members. Check documented acknowledgement, read-consistency, placement and
      failure-domain settings, along with failover triggers, supported operator actions and service limits.
      Record which requirements depend on configuration or deployment shape rather than assuming that
      an availability label establishes them.
    anchor: check-the-actual-hosting-and-distribution-contract
  - title: Rehearse the failures that determine the choice
    brief: In a disposable, representative selected-engine deployment, rehearse a planned switchover,
      writer loss, loss of replica connectivity and a returning old writer; add an ownership or location
      failure when the chosen topology distributes data. Bound each fault and define stop conditions and
      cleanup before execution. Record acknowledged operations, replica progress, the authoritative writer,
      observed read results, reconnection, retention pressure and recovery time, then compare them with
      the requirement and documented contract. Keep illustrative timelines distinct from measured execution
      and state what the rehearsal does not establish. Finish with the evidence needed to accept the topology
      or revise the design.
    anchor: rehearse-the-failures-that-determine-the-choice
