  slug: monitoring-and-capacity
  title: Monitoring and sizing a relational service
  brief: Teach practitioners to establish deployment visibility, maintain capacity and growth budgets,
    reserve normal and degraded headroom, and act on useful alerts before a service reaches a limit. Produce
    a dashboard, an evidence-routing table and capacity worksheets tied to service objectives and intervention
    lead times. Reuse the workload measurement and load evidence from Improving performance under concurrent
    load (a28), the sole owner of deep concurrent-workload diagnosis. Link to the owning maintenance,
    topology and restoration procedures for their operational evidence and actions.
