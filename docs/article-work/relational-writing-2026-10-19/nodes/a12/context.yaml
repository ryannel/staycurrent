neighbours:
- id: a09
  slug: types
  title: Choosing types and representing missing values
  brief: Choose representations that preserve a value's meaning, allowed states and useful operations
    across the database and application boundary. Develop a booking schema through prices, identifiers,
    customer text, reservation times and optional details, using concrete failures to justify each choice.
    Distinguish exactness from precision, identity from presentation, instants from local schedules, and
    missing information from empty values. Compare scalar columns, arrays, JSON, binary values, related
    rows and external payloads through validation, query and ownership requirements. Use selected, documented
    engine differences only when they change a decision. Leave SQL expression behaviour, constraint design,
    historical modelling and live migration procedures to their owning articles.
  parent: a01
  href: /review/relational-next/types/
  children: []
  sections:
  - title: Start with what a value must preserve
