original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Querying and changing relational data with SQL
  title: Working with SQL
  brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database to
    expressing and checking substantial application and analytical queries. Teach selection, joins, aggregation,
    subqueries, set operations, window calculations and recursion where they solve useful relational problems.
    Develop precise reasoning about duplicates, nulls, ordering, time, pagination and data changes. Teach
    how to establish expected results and test edge cases. Distinguish portable concepts from dialect
    behaviour without attempting an exhaustive syntax catalogue; leave execution-cost diagnosis to its
    own branch.
  heading:
  - title: Start with a database you can inspect and reset
    brief: Introduce a small order-and-payment database with supplied setup and reset scripts. Show how
      to connect, identify the engine and version, inspect tables, columns, keys and sample rows, execute
      a statement and read an error. Explain which commands belong to the client and which are SQL. Keep
      the exercise disposable and mark implementation-specific syntax at its first use.
    anchor: start-with-a-database-you-can-inspect-and-reset
  - title: Decide what one result row means
    brief: 'Translate a request such as outstanding orders into a result contract: one row per chosen
      entity or group, its columns and types, inclusion rules, treatment of missing facts, duplicate policy
      and required ordering. Hand-calculate a small expected result before writing SQL. Use the contract
      throughout the article to expose plausible answers at the wrong level of detail.'
    anchor: decide-what-one-result-row-means
  - title: Select rows and calculate their columns
    brief: Build SELECT expressions, aliases, FROM and WHERE through a useful first query. Teach comparisons,
      Boolean conditions and precedence, CASE, explicit column selection and DISTINCT. Explain the logical
      transformation of a query as a reasoning aid rather than an execution trace. Establish that repeated
      values and repeated result rows are meaningful until the result contract says otherwise.
    anchor: select-rows-and-calculate-their-columns
  - title: Make values, missing facts and time explicit
    brief: Establish null as a missing value and show why an ordinary comparison cannot replace IS NULL.
      Introduce three-valued predicates and show which rows a filter retains. Use an amount calculation
      and a reporting date boundary to motivate checking expression types, casts and time semantics before
      trusting a result.
    nested_article:
      topic: SQL expression semantics, missing values and time
      title: Getting SQL values right
      brief: Teach practitioners to recognise and repair plausible wrong answers caused by SQL expression
        semantics. Extend the parent's basic null example through missing-value logic, deliberate defaults,
        arithmetic, text comparison, conversions and time calculations. Use a compact booking-and-charge
        report with hand-checked expected values, PostgreSQL as the named reference engine, and documented
        dialect differences only where they change the result or the repair. Keep representation choices
        in schema design, aggregate and join semantics in their sibling, membership traps in query composition
        and driver conversion in application integration. Stop at the depth needed to write and verify
        ordinary relational queries; no function catalogue or specialist calendar branch is needed.
      href: /review/relational-next/sql-values/
    anchor: make-values-missing-facts-and-time-explicit
  - title: Combine related facts without changing the question
    brief: Walk through a join with a tiny row-by-row result and then group order lines into a total.
      Make input and output row identity visible. Introduce inner and left joins, ON, GROUP BY, aggregates
      and HAVING sufficiently to read and build a basic report, then expose the inflated total caused
      by joining two independent one-to-many relationships.
    nested_article:
      topic: SQL joins, cardinality and aggregation
      title: Joining and summarising data
      brief: 'Build correct multi-table application queries and reports by keeping the meaning of one
        result row explicit. Develop join cardinality, outer-join filtering, grouping, counts, conditional
        totals and the repair of double-counting with a small connected set of checked examples. Follow
        the parent-first reading path. Before the first worked task, tell contextual entrants to read
        Working with SQL''s section Express a larger question in checkable stages: its small staged query
        supplies the derived-table or CTE notation used here. Assume that section alongside the parent''s
        first join and grouped query; concentrate on cases that produce plausible wrong answers. No composition
        tutorial or prerequisite visit to Composing larger SQL queries is needed. Identify the example
        engine and consequential dialect behaviour at first use. Keep detailed existence and membership
        semantics with Composing larger SQL queries, expression semantics with Getting SQL values right,
        and execution methods and costs with performance. This article supplies the depth needed for expert
        relational practice without a further reporting or join-specialist branch.'
      href: /review/relational-next/joins-and-aggregation/
    anchor: combine-related-facts-without-changing-the-question
  - title: Express a larger question in checkable stages
    brief: Complete one useful unpaid-order report with a basic common table expression or derived result
      and an EXISTS test for related payments. Inspect each stage against its result contract and check
      the final answer, leaving the reader able to organise an ordinary query without further reading.
      Briefly motivate set operations and repeated parent-child expansion as different questions developed
      in the child; recursion is optional for traversal tasks. Distinguish this logical organisation from
      a description of physical execution.
    nested_article:
      topic: SQL subqueries, set operations and recursive queries
      title: Composing larger SQL queries
      brief: Extend the parent's completed report and existence test with the correctness decisions needed
        when queries return scalar values, supply tables, compare memberships or combine results. Make
        cardinality, correlation, null policy, compatible types and duplicate policy explicit. Explain
        how a checked query becomes a reusable view without implying an execution strategy. Offer one
        optional hierarchy traversal with deliberate termination, cycle, multiplicity and ordering rules.
        Use a named engine and identify consequential dialect differences; leave execution costs, materialisation
        and plan diagnosis to performance, and view deployment to evolution.
      href: /review/relational-next/query-composition/
    anchor: checkable-stages
  - title: Compare rows while keeping their detail
    brief: Contrast a grouped total with a per-order row carrying its customer's total. Introduce OVER,
      partition and ordering through that difference, then motivate ranking and running calculations.
      Show why the rows available to a calculation and the order eventually displayed are separate decisions.
    nested_article:
      topic: SQL window calculations
      title: Calculating across related rows
      brief: Teach window calculations as a way to compare and summarise related rows while retaining
        the required detail. Develop latest rows per entity, top items per group, shares of totals, running
        and moving totals, and changes from an earlier event using two small, hand-checked datasets. Distinguish
        input rows, partitions, ordering, peers and frames, and make ties, missing periods and filtering
        choices observable in expected results. Use a named PostgreSQL version for runnable examples,
        check consequential behaviour against its primary documentation, and identify dialect differences
        only when they change a reader's query or result. Assume the parent's basic query and staging
        workflow; link value semantics, aggregation and execution-cost diagnosis to their existing owners.
        Stop at reliable application and reporting calculations rather than a function catalogue or analytical
        specialism.
      href: /review/relational-next/window-functions/
    anchor: compare-rows-while-keeping-their-detail
  - title: Order and page a result deliberately
    brief: Teach a complete ORDER BY with tie-breakers, explicit null placement where supported, and LIMIT
      or the chosen dialect's equivalent. Compare offset and keyset pagination by walking a small ordered
      result, including composite cursors, tied values and page boundaries. Explain how insertion, deletion
      and changed sort values between requests affect the traversal contract. Link snapshot and transaction
      guarantees to the concurrency branch and access-path costs to performance rather than claiming a
      cursor alone freezes a result.
    anchor: order-and-page-a-result-deliberately
  - title: Change the intended rows and inspect the outcome
    brief: Introduce INSERT, UPDATE and DELETE on the disposable data, showing predicates, affected rows
      and returned values where supported. Connect a change to its precondition and postcondition, including
      a conditional update that can match zero rows. Introduce transaction grouping and rollback for practice,
      while leaving concurrent correctness and failure guarantees to their owning branch.
    nested_article:
      topic: SQL data modification
      title: Changing data with SQL
      brief: Make INSERT, UPDATE and DELETE express a deliberate change to a known target set, then establish
        whether their results satisfy the intended postcondition. Extend the parent's first change workflow
        through set-based changes, insert-from-query, defaults and generated identifiers, constraint failures,
        ambiguous source matches and conflict-handling choices. Use a small order-and-stock fixture in
        a named PostgreSQL version, checking consequential behaviour against its primary documentation
        and recording actual results separately from illustrative examples. Keep conflict-handling inserts,
        upsert and MERGE together as an outcome decision; identify consequential dialect differences without
        building a syntax catalogue. Use bounded transactions for disposable exercises and link to transaction
        reasoning for concurrent correctness, application integration for retries and idempotency, and
        evolution for production corrections and backfills.
      href: /review/relational-next/changing-data/
    anchor: change-the-intended-rows-and-inspect-the-outcome
  - title: Check the answer before trusting the query
    brief: Finish the outstanding-orders task with an explicit expected result and repeatable setup, query
      and reset steps. Use a compact fixture set covering empty inputs, absent relationships, duplicate
      details, nulls, ties, boundary timestamps and zero or multiple update matches; children test the
      additional failure cases they introduce. Compare row multiplicities and types as well as values;
      compare order only when promised. Check each intermediate result and a few independent totals or
      invariants rather than accepting one attractive sample output. Establish that passing correctness
      checks does not establish acceptable execution cost, and link to the performance branch when the
      answer is correct but too expensive.
    anchor: check-the-answer-before-trusting-the-query
