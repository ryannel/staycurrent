- id: a13
  href: /review/relational-next/sql-values/
  article:
    topic: SQL expression semantics, missing values and time
    title: Getting SQL values right
    brief: Teach practitioners to recognise and repair plausible wrong answers caused by SQL expression
      semantics. Extend the parent's basic null example through missing-value logic, deliberate defaults,
      arithmetic, text comparison, conversions and time calculations. Use a compact booking-and-charge
      report with hand-checked expected values, PostgreSQL as the named reference engine, and documented
      dialect differences only where they change the result or the repair. Keep representation choices
      in schema design, aggregate and join semantics in their sibling, membership traps in query composition
      and driver conversion in application integration. Stop at the depth needed to write and verify ordinary
      relational queries; no function catalogue or specialist calendar branch is needed.
    heading:
    - title: Start with the answer each expression must mean
      brief: Reuse a small booking-and-charge fixture to state what a missing charge, zero charge, discounted
        amount, customer label and reporting period mean. Give expected expression outputs and included
        row identifiers before SQL. Record the PostgreSQL version and relevant session settings for executable
        examples; distinguish predicted results from recorded execution. Link to representation design
        for why these columns have their chosen types, rather than reopening that choice here.
      anchor: start-with-the-answer-each-expression-must-mean
    - title: Follow unknown through a predicate
      brief: Extend the parent's IS NULL introduction by tracing TRUE, FALSE and UNKNOWN through comparison,
        NOT, AND and OR on the report's optional charge. Show why negating a comparison need not recover
        missing rows, and distinguish a predicate's value from WHERE's decision to retain a row. Build
        an explicit policy for including unknowns and use IS DISTINCT FROM or the named dialect's null-safe
        comparison where that policy calls for it. Keep null-sensitive membership and outer-join filtering
        with their sibling owners; do not repeat their query walkthroughs.
      anchor: follow-unknown-through-a-predicate
    - title: Make defaults and conditional results express the business rule
      brief: Use searched CASE to distinguish unknown, waived and charged amounts, then show when COALESCE
        legitimately supplies a fallback and when it destroys a distinction needed by the report. Treat
        empty text, zero and null separately. Explain compatible branch result types and guard a division
        with NULLIF or a suitable conditional expression. Verify the reference engine's evaluation rules
        and limitations before suggesting that a conditional expression safely guards an error; avoid
        portable promises about evaluation order or short-circuiting.
      anchor: make-defaults-and-conditional-results-express-the-business-rule
    - title: Check the arithmetic before trusting the amount
      brief: Follow an average charge or discount calculation through operand types, division, intermediate
        precision and the final rounded value. Use one counterexample each where integer division, approximate
        representation, rounding placement or an intermediate overflow changes the intended answer. Show
        why converting the operands before calculation can differ from converting the result, and why
        display rounding and a contractual money-rounding rule are different operations. Check negative
        values, zero denominators and boundary values against documented PostgreSQL semantics; mention
        another dialect only when a consequential difference would change the query. Leave storage-type
        selection to design.
      anchor: check-the-arithmetic-before-trusting-the-amount
    - title: Ask which text counts as equal or matching
      brief: Use a customer lookup to distinguish exact comparison, a declared case/accent comparison
        policy and pattern matching. Explain how operand type and collation affect comparison and ordering,
        using only the distinctions needed to explain differing answers in the example. Demonstrate the
        meaning and escaping of LIKE wildcards and a literal percent or underscore supplied as search
        data. Verify relevant Unicode, locale and trailing-space edge cases in the named engine and collation
        rather than promising universal behaviour. Leave index support and search-performance diagnosis
        to performance, and parameter binding to application integration.
      anchor: ask-which-text-counts-as-equal-or-matching
    - title: Make conversions visible at the expression boundary
      brief: Compare a typed value with text input to expose type inference, implicit conversion and explicit
        casts. Show a parse failure, an ambiguous date input and a lossy numeric conversion; state which
        inputs the report accepts before choosing its conversion. Use unambiguous literals and explicit
        types where they clarify intent, recording session-dependent parsing settings. Verify which conversions
        fail, round or truncate in the chosen engine. Do not imply that a cast validates the business
        rule or that a preceding WHERE condition guarantees conversion evaluation order. Link driver-side
        conversion and validation to application integration rather than repeating it.
      anchor: make-conversions-visible-at-the-expression-boundary
    - title: Calculate reporting boundaries in the intended clock
      brief: Start from the report's question to distinguish a date, a local date-time, an instant, a
        named time zone and an interval. Use a local business-day report to derive its two boundaries
        in the named zone and compare event instants with a half-open interval, including an event exactly
        at each boundary. Contrast a fixed UTC offset with the named zone's rules and distinguish displaying
        an instant locally from interpreting a local clock reading. Use a daylight-saving transition to
        expose nonexistent and repeated local times; verify the engine's resolution behaviour and make
        the application's ambiguity policy explicit. Keep schema storage choices and historical modelling
        in design.
      anchor: calculate-reporting-boundaries-in-the-intended-clock
    - title: Separate calendar movement from elapsed duration
      brief: Compare a booking moved to the same local time on the following day with a timeout or elapsed-hours
        calculation across the same daylight-saving boundary. Verify the named engine's interval arithmetic
        and month-end behaviour only as needed to explain those outcomes. Make the reference clock for
        a relative reporting period explicit, including PostgreSQL's documented transaction/statement/clock
        timestamp distinctions when they change a long-running report's answer. Avoid a general calendar
        or scheduling tutorial.
      anchor: separate-calendar-movement-from-elapsed-duration
    - title: Keep a small regression fixture for value semantics
      brief: Close by repairing the original report and comparing its values and selected row identifiers
        with the declared expectations. Keep null and zero, a negative amount, a rounding boundary, literal
        wildcard text, invalid input and time-boundary cases, including the daylight-saving examples introduced
        above. Record engine version, collation, time zone, parsing settings, query and observed result
        beside the evidence. Use primary documentation to explain consequential behaviours and repeat
        the affected checks when changing engine or relevant settings. Passing these checks establishes
        only the tested result semantics; direct plan and workload questions to performance without a
        second testing tutorial.
      anchor: keep-a-small-regression-fixture-for-value-semantics
- id: a14
  href: /review/relational-next/joins-and-aggregation/
  article:
    topic: SQL joins, cardinality and aggregation
    title: Joining and summarising data
    brief: 'Build correct multi-table application queries and reports by keeping the meaning of one result
      row explicit. Develop join cardinality, outer-join filtering, grouping, counts, conditional totals
      and the repair of double-counting with a small connected set of checked examples. Follow the parent-first
      reading path. Before the first worked task, tell contextual entrants to read Working with SQL''s
      section Express a larger question in checkable stages: its small staged query supplies the derived-table
      or CTE notation used here. Assume that section alongside the parent''s first join and grouped query;
      concentrate on cases that produce plausible wrong answers. No composition tutorial or prerequisite
      visit to Composing larger SQL queries is needed. Identify the example engine and consequential dialect
      behaviour at first use. Keep detailed existence and membership semantics with Composing larger SQL
      queries, expression semantics with Getting SQL values right, and execution methods and costs with
      performance. This article supplies the depth needed for expert relational practice without a further
      reporting or join-specialist branch.'
    heading:
    - title: State what one result row represents
      brief: Start from a report requiring one row per customer with order value and payment value, including
        customers without activity. State which details qualify, what zero and unknown mean, and whether
        totals refer to all time or a chosen period. Establish customer, order, order-line and payment
        keys and relationships. Predict the result columns and hand-calculate a tiny expected result before
        extending the parent's basic join example. Reuse these facts through the article rather than introducing
        a new domain for every SQL feature.
      anchor: state-what-one-result-row-represents
    - title: Follow the matches a join produces
      brief: Trace one-to-one, one-to-many and many-to-many matches as pairs of source rows, preserving
        duplicates unless the question explicitly removes them. Predict per-key multiplicity before running
        a join; test missing and incomplete join predicates, non-unique matching columns and composite
        keys. Use a short employee-to-manager self-join to explain independent aliases and missing managers,
        without opening a hierarchy-traversal lesson. Show why selecting customers with any qualifying
        order through the parent's presence test does not multiply customer rows; link to Composing larger
        SQL queries for EXISTS and membership detail. Leave physical join algorithms and their costs to
        performance.
      anchor: follow-the-matches-a-join-produces
    - title: Preserve unmatched rows deliberately
      brief: Follow a LEFT JOIN through a customer with no orders and one with only out-of-period orders.
        Compare a detail predicate in ON with the same predicate in WHERE and show the resulting retained
        or rejected rows. Locate null-extended rows separately from matched detail rows whose attributes
        are null; use a guaranteed non-null detail key when testing for a missing match. Keep full and
        right joins to a brief explanation only if needed to interpret the example or reverse the preserved
        side. Link to SQL values for three-valued logic instead of reteaching it.
      anchor: preserve-unmatched-rows-deliberately
    - title: Group at the level the question asks for
      brief: Derive GROUP BY keys from the result-row contract, grouping by stable customer identity rather
        than merging customers with the same display name. Show how adding a grouping column changes the
        result's level of detail and why selecting an ungrouped value needs a defined rule; use explicit
        grouped columns and flag consequential engine differences in functional-dependency allowances.
        Separate filtering source rows with WHERE from filtering completed groups with HAVING. Require
        explicit final ordering when the report promises an order. Contrast grouped totals with retaining
        individual rows, linking to Calculating across related rows for the latter task.
      anchor: group-at-the-level-the-question-asks-for
    - title: Make counts, missing values and conditional totals agree
      brief: Compare COUNT(*), COUNT(detail_key), COUNT(nullable_value) and COUNT(DISTINCT value) on the
        same outer-joined rows. Explain which rows or non-null values each counts and what distinctness
        removes. Contrast a global aggregate over empty input with a grouped query that has no groups,
        then show how retained customers can still produce zero-detail rows. Establish SUM and other relevant
        aggregate null behaviour in the named engine. Choose COALESCE only after deciding whether absence
        means zero or unknown. Derive paid and unpaid totals with CASE inside an aggregate, naming FILTER
        as an engine-supported alternative where useful. Keep arithmetic and null-expression details with
        Getting SQL values right.
      anchor: make-counts-missing-values-and-conditional-totals-agree
    - title: Combine independent totals without multiplying them
      brief: Give one customer multiple orders and multiple payments, show the two detail sets and paired
        join rows, and ask the reader to predict both totals before explaining how they become overstated.
        Repair the report by aggregating each independent detail at customer level before joining those
        results to customers. Show the intermediate order and payment subtotals, each with one row per
        customer, beside the final join. Use only the derived-table or CTE notation from the stated prerequisite,
        Working with SQL's section Express a larger question in checkable stages. Verify at most one row
        per customer in each intermediate result and preserve absent details explicitly. Explain why DISTINCT
        on final rows, SUM(DISTINCT amount), or a distinct count cannot generally repair unrelated totals;
        equal-valued legitimate payments must survive. Add a subtotal only if the chosen report actually
        needs one, distinguishing a subtotal marker from an ordinary null and checking against double-summing
        subtotal rows. Do not expand into a catalogue of grouping extensions.
      anchor: combine-independent-totals-without-multiplying-them
    - title: Prove the report against awkward data
      brief: 'Finish with a compact adversarial fixture set targeting this article''s additional failure
        cases: no activity, several details on each side, repeated legitimate amounts, duplicate display
        names, a nullable measured value, an out-of-period detail and empty qualifying input. Compare
        complete expected rows, per-customer totals and a separately calculated overall total; check one
        result row per promised key and explicitly requested ordering. Introduce an incorrect predicate
        or extra join to demonstrate that the checks detect the wrong answer. Record named-engine results
        and distinguish hand-derived expectations from observed execution. Passing correctness checks
        does not establish acceptable execution cost; hand that diagnosis to the performance branch.'
      anchor: prove-the-report-against-awkward-data
- id: a15
  href: /review/relational-next/query-composition/
  article:
    topic: SQL subqueries, set operations and recursive queries
    title: Composing larger SQL queries
    brief: Extend the parent's completed report and existence test with the correctness decisions needed
      when queries return scalar values, supply tables, compare memberships or combine results. Make cardinality,
      correlation, null policy, compatible types and duplicate policy explicit. Explain how a checked
      query becomes a reusable view without implying an execution strategy. Offer one optional hierarchy
      traversal with deliberate termination, cycle, multiplicity and ordering rules. Use a named engine
      and identify consequential dialect differences; leave execution costs, materialisation and plan
      diagnosis to performance, and view deployment to evolution.
    heading:
    - title: Choose what the inner query must return
      brief: Start from the parent's established result-row contract rather than repeating its staged-report
        walkthrough or CTE introduction. Distinguish a scalar value, a relation of rows and a yes-or-no
        existence question through small extensions to its order-and-payment data. For a scalar lookup,
        check zero, one and multiple returned rows, including a one-row null result; demonstrate the chosen
        engine's zero-row null and multiple-row failure behaviour. Explain when a constraint establishes
        cardinality and when a business rule requires an explicit aggregate or ordered selection. Do not
        hide ambiguity with an arbitrary first row.
      anchor: choose-what-the-inner-query-must-return
    - title: Make the dependency on the outer row visible
      brief: Trace a correlated scalar query and a correlated EXISTS predicate for two deliberately different
        outer orders. Qualify names and show how a missing correlation predicate silently asks a global
        question. Distinguish the logical dependence on outer values from claims about how many times
        an engine executes the inner query. Contrast a table subquery's row and column contract with a
        scalar position, and expose the row multiplication that an apparently equivalent join can introduce.
        Link join-cardinality repairs to Joining and summarising data rather than repeating them.
      anchor: make-the-dependency-on-the-outer-row-visible
    - title: Define what membership means when values can be missing
      brief: Compare IN, EXISTS, NOT IN and NOT EXISTS on a tiny fixture containing matches, non-matches,
        repeated inner values, an empty inner result and nulls on either side. Show the NOT IN trap by
        recording true, false or unknown before applying WHERE. Repair an exclusion query with a correlated
        NOT EXISTS and an explicit policy for a null outer key; ordinary equality in the correlation does
        not by itself make nulls match. If null denotes an equal membership value for the task, use the
        named engine's null-safe comparison and check that policy separately. Reuse the parent's basic
        existence lesson and link expression semantics for general three-valued logic. Do not promise
        that rewriting predicates improves performance.
      anchor: define-what-membership-means-when-values-can-be-missing
    - title: Combine result sets with the intended multiplicity
      brief: Use two small customer-selection queries to derive UNION, INTERSECT and EXCEPT from their
        expected outputs. Align column count, column positions and compatible types explicitly; compatible
        types alone do not establish compatible business meanings. Compare UNION with UNION ALL, then
        explain duplicate elimination and the supported ALL variants through counts of repeated rows.
        Show how nulls participate in set duplicate comparison rather than importing ordinary equality
        behaviour. Mark unsupported dialect variants, parenthesise mixed operations, and place a final
        ORDER BY over the complete result. Keep branch-local limiting and ordering separate from any promise
        about final display order.
      anchor: combine-result-sets-with-the-intended-multiplicity
    - title: Give a checked query a reusable interface
      brief: Turn one already checked composition into a view with deliberately named columns and explicit
        selection. Demonstrate a consuming query and explain that reuse names a query interface; it does
        not promise stored results, fixed row order or a particular plan. Keep the decision focused on
        a stable meaning shared by callers. Link materialised results and execution choices to performance,
        and interface changes, permissions and production deployment to their owning branches instead
        of extending into view administration.
      anchor: give-a-checked-query-a-reusable-interface
    - title: Follow a hierarchy only when the task requires traversal
      brief: 'Mark this section as optional: ordinary reports, window calculations, pagination and changes
        do not depend on it. Develop one task, listing the descendants of a selected category in a parent-child
        hierarchy, with a tiny fixture and a hand-drawn expected result. Keep it as a bounded SQL traversal
        rather than surveying graph algorithms or alternative hierarchy representations.'
      heading:
      - title: Separate the starting rows from each expansion
        brief: Build the recursive CTE's anchor and expansion, showing the working rows after successive
          rounds as a logical explanation, not an observed execution trace. Define whether the selected
          root appears and what each output row represents. Check the recursive columns' types, missing
          roots, leaves and a hierarchy with multiple levels. Explain termination when expansion produces
          no further eligible rows.
        anchor: separate-the-starting-rows-from-each-expansion
      - title: Stop cycles and choose which repeats to retain
        brief: Introduce a deliberate cycle into the disposable fixture and repair the traversal using
          the named engine's cycle facility or an explicit visited path. Explain why UNION's whole-row
          deduplication is not a general cycle defence when depth or path changes on every visit. Distinguish
          revisiting a node along one path from the result's desired duplicate policy. Treat a maximum-depth
          limit as a safety bound that can truncate an answer, with a visible truncation check, rather
          than proof of a complete traversal. Use an explicit path or ordering key and final ORDER BY;
          traversal evaluation order does not establish display order. Identify the relevant recursive-syntax
          differences without adding another recursive-query article.
        anchor: stop-cycles-and-choose-which-repeats-to-retain
      anchor: follow-a-hierarchy-only-when-the-task-requires-traversal
    - title: Check the contracts introduced by composition
      brief: 'Close with repeatable checks targeted at this article''s extra failure cases: scalar zero
        and multiple rows, a lost correlation, nullable membership including an empty inner set, unequal
        duplicate counts across set branches, and the optional traversal''s missing root, leaf, cycle
        and depth bound. Compare expected values, nulls, column types and row counts; compare order only
        where the query promises it. Keep a compact answer key showing why attractive rewrites are or
        are not equivalent under these contracts. Passing these checks establishes the illustrated answers,
        not acceptable execution cost; hand that diagnosis to performance.'
      anchor: check-the-contracts-introduced-by-composition
- id: a16
  href: /review/relational-next/window-functions/
  article:
    topic: SQL window calculations
    title: Calculating across related rows
    brief: Teach window calculations as a way to compare and summarise related rows while retaining the
      required detail. Develop latest rows per entity, top items per group, shares of totals, running
      and moving totals, and changes from an earlier event using two small, hand-checked datasets. Distinguish
      input rows, partitions, ordering, peers and frames, and make ties, missing periods and filtering
      choices observable in expected results. Use a named PostgreSQL version for runnable examples, check
      consequential behaviour against its primary documentation, and identify dialect differences only
      when they change a reader's query or result. Assume the parent's basic query and staging workflow;
      link value semantics, aggregation and execution-cost diagnosis to their existing owners. Stop at
      reliable application and reporting calculations rather than a function catalogue or analytical specialism.
    heading:
    - title: Decide what one result row represents
      brief: Start with a ledger containing entity, event identifier, timestamp and amount, and a small
        item-sales fixture with group, item, period and sales. Include tied timestamps, tied sales, a
        missing period and a null amount. State whether the query needs each event, each item-period or
        one winner per entity. Contrast retaining those rows with collapsing them through grouping, referring
        to the joins and aggregation article for establishing that input grain. Hand-calculate a small
        expected result before introducing the window syntax.
      anchor: decide-what-one-result-row-represents
    - title: Separate the input, partition and two kinds of order
      brief: Annotate one OVER expression to distinguish the rows supplied by the query, PARTITION BY,
        window ORDER BY and the final query ORDER BY. Establish what makes rows peers under the chosen
        window ordering and why an event identifier can resolve an otherwise tied event sequence. Show
        the same calculated values displayed in a different final order. Explain windows over already-aggregated
        item-period rows without repeating the parent's grouping tutorial. Keep this a logical account
        of query meaning rather than a claim about physical execution.
      anchor: separate-the-input-partition-and-two-kinds-of-order
    - title: Choose one latest row or preserve tied winners
      brief: Use the ledger to choose one latest event per entity with ROW_NUMBER and a stated timestamp
        and identifier ordering. Decide what latest means when the timestamp ties and whether the identifier
        is merely a repeatable selection rule. Reuse the sales fixture to compare a fixed number of items
        with all items tied at a rank, and show the different cutoff results from ROW_NUMBER, RANK and
        DENSE_RANK. Do not add an identifier to the business ranking order when that would destroy the
        intended ties; use a separate display ordering. State the null-ordering policy if the ordering
        key can be null.
      anchor: choose-one-latest-row-or-preserve-tied-winners
    - title: Filter after the calculation when the question requires it
      brief: Complete the winner query by computing its window value in a derived table or CTE and filtering
        in the outer query. Use the staging technique already taught by the parent, concentrating here
        on the change in meaning. Contrast selecting the latest event and then checking its amount with
        selecting the latest event among amounts passing a condition. Show that restricting a report date
        range before a running calculation can remove history that its opening value needs. Mention QUALIFY
        only as a dialect-dependent spelling where supported, with the outer-query form as the worked
        baseline.
      anchor: filter-after-the-calculation-when-the-question-requires-it
    - title: Keep a whole-group denominator for shares
      brief: Calculate each item's share of its group's total from the sales rows, choosing the intended
        group and period explicitly. Display numerator, denominator and expected share together. Contrast
        a whole-partition aggregate with an ordered aggregate whose frame can produce a running denominator.
        Require an explicit policy for zero totals and missing amounts, linking arithmetic and null semantics
        rather than repeating them. Check the sum of shares where the declared input and denominator make
        that a valid invariant.
      anchor: keep-a-whole-group-denominator-for-shares
    - title: Make running and moving frames explicit
      brief: Mark the rows contributing to a ledger running total, then compare an explicit ROWS frame
        with the default ordered aggregate frame at tied timestamps. Explain why the default can advance
        across peers together, and specify the ordering needed for an event-by-event total. Reuse the
        sales fixture to distinguish the last three recorded rows from an interval of time using a value-based
        RANGE frame. Check boundary inclusion, ties, partial opening frames and missing periods. Explain
        that a frame does not invent absent periods; when a report requires zero-filled calendar periods,
        prepare that input before calculating and link to joins and time semantics. Verify the chosen
        engine's RANGE offset types and ordering restrictions. Bound frame discussion to these tasks rather
        than touring every frame option.
      anchor: make-running-and-moving-frames-explicit
    - title: Compare with the previous event or previous period
      brief: Use LAG on the ledger's defined event order to calculate an amount change. Show a first event
        with no predecessor, a predecessor whose amount is null, and an ordinary predecessor; use an additional
        predecessor identifier when the result must distinguish absence from a null value. Explain the
        difference between supplying a default for an absent row and replacing a present null. Reuse the
        missing-period sales example to show that the previous recorded row need not be the previous calendar
        period. Choose between event comparison and prepared calendar input according to the reporting
        question. Keep any IGNORE NULLS discussion tied to documented support in the named engine.
      anchor: compare-with-the-previous-event-or-previous-period
    - title: Check the calculation at its boundaries
      brief: 'Finish with a compact exercise reusing the fixtures: select tied top sellers, calculate
        their shares from the intended complete group, and report a moving value without losing required
        history. Ask the reader to identify input grain, partition, ordering, tie policy, frame and filtering
        stage before comparing expected rows and values. Check a singleton group, ties, a missing period,
        null values and a date-range boundary; vary insertion order to expose reliance on an incomplete
        ordering. Require explicit final output ordering for checked tables. Record the engine/version
        and primary documentation used for frames, ranking and predecessor behaviour. Successful result
        checks establish these examples'' meaning; link performance analysis for their execution cost.'
      anchor: check-the-calculation-at-its-boundaries
- id: a17
  href: /review/relational-next/changing-data/
  article:
    topic: SQL data modification
    title: Changing data with SQL
    brief: Make INSERT, UPDATE and DELETE express a deliberate change to a known target set, then establish
      whether their results satisfy the intended postcondition. Extend the parent's first change workflow
      through set-based changes, insert-from-query, defaults and generated identifiers, constraint failures,
      ambiguous source matches and conflict-handling choices. Use a small order-and-stock fixture in a
      named PostgreSQL version, checking consequential behaviour against its primary documentation and
      recording actual results separately from illustrative examples. Keep conflict-handling inserts,
      upsert and MERGE together as an outcome decision; identify consequential dialect differences without
      building a syntax catalogue. Use bounded transactions for disposable exercises and link to transaction
      reasoning for concurrent correctness, application integration for retries and idempotency, and evolution
      for production corrections and backfills.
    heading:
    - title: State the change before writing the statement
      brief: Start from the parent's basic update and specify the intended entity, target keys, expected
        number of matches and postcondition. Distinguish changing one identified order from changing every
        qualifying order, including tenant scope where identifiers are tenant-local. Derive the candidate
        set with a query and inspect the same predicate's treatment of nulls, zero matches and unexpectedly
        broad matches. Link to expression semantics for three-valued logic. Establish that a preview helps
        find mistakes but is not a reservation of those rows against concurrent writers; the transaction
        branch owns that guarantee.
      anchor: state-the-change-before-writing-the-statement
    - title: Insert the intended rows and keep their identities
      brief: Use explicit column lists for a single row, several rows and INSERT from a query. Check the
        source's row meaning and duplicate policy before using it to create rows, and distinguish an empty
        source from an unexpected failure to insert. Compare omitted columns, DEFAULT and explicit NULL
        against the actual schema. Retrieve generated keys through the named engine's documented returned
        values rather than inferring them from a maximum or assuming consecutive identifiers. Introduce
        constraints only through what they accept or reject; schema design owns their modelling and evolution
        owns adding them to live data.
      anchor: insert-the-intended-rows-and-keep-their-identities
    - title: Make set-based updates unambiguous
      brief: Derive a multirow update from a checked key set, express new values from stored values or
        a source relation, and inspect the resulting values. Include a conditional stock decrement to
        show a business precondition in the change itself, interpreting zero matches without treating
        it as proof of one particular cause. Require each target row in a source-driven update to have
        the intended number of source matches. Expose duplicate source matches in a fixture and repair
        the source through a justified unique key, aggregation or explicit selection rule; arbitrary deduplication
        must not invent the business rule. Verify UPDATE FROM behaviour in the chosen engine rather than
        assume a portable winner. Link join-cardinality teaching and transaction-level invariant reasoning.
      anchor: make-set-based-updates-unambiguous
    - title: Delete rows and account for dependent changes
      brief: Select the exact rows to remove using keys and predicates, including a bounded example derived
        from a related table. Check zero and multiple matches and show how a missing predicate changes
        the scope. Inspect how the fixture's foreign keys reject deletion or apply declared referential
        actions, including effects on dependent rows. Distinguish deleting a row from assigning NULL or
        changing its business status without prescribing a universal soft-delete policy. Keep cascade
        design in data modelling and production purges in evolution.
      anchor: delete-rows-and-account-for-dependent-changes
    - title: Decide what should happen when an insert meets existing data
      brief: State whether a conflicting business key should reject the operation, preserve the existing
        row or update selected values, then choose documented SQL for that outcome. In one consolidated
        comparison, use PostgreSQL conflict-handling INSERT for the key-based case and introduce MERGE
        only where matching source and target rows genuinely calls for different actions. Check the relevant
        uniqueness rule, null policy, duplicate source keys, update expressions and returned or affected
        rows. Identify version and dialect limits at first use. Do not equate MERGE, upsert and a read-then-write
        sequence or infer common concurrent-insert guarantees from similar syntax; link to the transaction
        branch when competing writers determine correctness. Leave request deduplication to application
        integration.
      anchor: decide-what-should-happen-when-an-insert-meets-existing-data
    - title: Inspect what changed inside a bounded transaction
      brief: Extend the parent's BEGIN, COMMIT and ROLLBACK workflow with assertions about target keys,
        returned values and final database state. Explain precisely what the chosen engine's affected-row
        count and RETURNING output establish, including an update assigning the existing value and a conflict
        action that changes no row. Avoid inferring all dependent or trigger effects from a direct row
        count; inspect the relevant postconditions. Exercise a constraint rejection and the documented
        transaction state afterwards, then restore a usable session. Treat generated identifiers and other
        effects according to documented rollback behaviour rather than assuming rollback rewinds everything.
        Inspection before commit does not replace commit acknowledgement or concurrency reasoning; link
        those decisions to transactions and application integration.
      anchor: inspect-what-changed-inside-a-bounded-transaction
    - title: Prove the change against awkward inputs
      brief: Finish with a compact executable exercise that combines a source-driven change and its insert-or-update
        policy, requiring expected target keys and postconditions before execution. Reuse fixtures for
        no match, one match, several intended matches, a null-sensitive predicate, duplicate source matches
        and a constraint violation. Compare predicted and observed returned rows and final state, rolling
        back the disposable exercise after inspection. Separate this single-session evidence from a claim
        about concurrent correctness or acceptable execution cost. Point readers to transactions for invariants,
        performance for expensive changes, evolution for live backfills and corrections, and application
        integration for request outcomes and retries. Stop before teaching those procedures again.
      anchor: prove-the-change-against-awkward-inputs
