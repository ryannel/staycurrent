- id: a16
  slug: window-functions
  title: Calculating across related rows
  brief: Teach window calculations as a way to compare and summarise related rows while retaining the
    required detail. Develop latest rows per entity, top items per group, shares of totals, running and
    moving totals, and changes from an earlier event using two small, hand-checked datasets. Distinguish
    input rows, partitions, ordering, peers and frames, and make ties, missing periods and filtering choices
    observable in expected results. Use a named PostgreSQL version for runnable examples, check consequential
    behaviour against its primary documentation, and identify dialect differences only when they change
    a reader's query or result. Assume the parent's basic query and staging workflow; link value semantics,
    aggregation and execution-cost diagnosis to their existing owners. Stop at reliable application and
    reporting calculations rather than a function catalogue or analytical specialism.
  parent: a02
  href: /review/relational-next/window-functions/
