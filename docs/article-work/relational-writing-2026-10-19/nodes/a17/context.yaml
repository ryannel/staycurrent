neighbours:
- id: a13
  slug: sql-values
  title: Getting SQL values right
  brief: Teach practitioners to recognise and repair plausible wrong answers caused by SQL expression
    semantics. Extend the parent's basic null example through missing-value logic, deliberate defaults,
    arithmetic, text comparison, conversions and time calculations. Use a compact booking-and-charge report
    with hand-checked expected values, PostgreSQL as the named reference engine, and documented dialect
    differences only where they change the result or the repair. Keep representation choices in schema
    design, aggregate and join semantics in their sibling, membership traps in query composition and driver
    conversion in application integration. Stop at the depth needed to write and verify ordinary relational
    queries; no function catalogue or specialist calendar branch is needed.
  parent: a02
  href: /review/relational-next/sql-values/
