- id: a14
  slug: joins-and-aggregation
  title: Joining and summarising data
  brief: 'Build correct multi-table application queries and reports by keeping the meaning of one result
    row explicit. Develop join cardinality, outer-join filtering, grouping, counts, conditional totals
    and the repair of double-counting with a small connected set of checked examples. Follow the parent-first
    reading path. Before the first worked task, tell contextual entrants to read Working with SQL''s section
    Express a larger question in checkable stages: its small staged query supplies the derived-table or
    CTE notation used here. Assume that section alongside the parent''s first join and grouped query;
    concentrate on cases that produce plausible wrong answers. No composition tutorial or prerequisite
    visit to Composing larger SQL queries is needed. Identify the example engine and consequential dialect
    behaviour at first use. Keep detailed existence and membership semantics with Composing larger SQL
    queries, expression semantics with Getting SQL values right, and execution methods and costs with
    performance. This article supplies the depth needed for expert relational practice without a further
    reporting or join-specialist branch.'
  parent: a02
