original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational schema and data evolution
  title: Changing a live database
  brief: Teach engineers to change schemas, stored data and database locations while applications continue
    to run. Use a change to an order system to connect application compatibility, physical database work,
    concurrent writes, verification and recovery. Give every change an explicit sequence, measurable completion
    conditions and a safe response to interruption. Introduce deeper procedures for schema changes, data
    jobs and database moves only where they enable reliable relational practice. Treat retention and deletion
    as changes to the guarantees readers and recovery procedures can rely on. Check concrete procedures
    against the selected engine, version and deployment.
  heading:
  - title: A change has more than one finish line
    brief: Start with an order system replacing a free-text delivery address with a structured address.
      Separate deploying code, making the schema usable, converting existing rows, switching readers and
      retiring the old representation. State the invariant that must hold through the transition, the
      applications and jobs using each representation, and the evidence needed before advancing. Distinguish
      schema migration records from proof that the whole change is complete.
    anchor: a-change-has-more-than-one-finish-line
  - title: Keep old and new applications compatible
    brief: Draw the successive application and schema versions, including overlapping deployments, background
      jobs and delayed clients. Work through adding the new representation, populating it, switching reads
      and removing the old one. Make concurrent writes and the authoritative representation explicit;
      dual writing alone is not a consistency argument. Explain when a short coordinated maintenance window
      costs less and provides clearer guarantees than a long compatibility period. Link transaction and
      application integration guidance for atomic writes and request-level retry behaviour.
    anchor: keep-old-and-new-applications-compatible
  - title: Find out what the database must do
    brief: Translate the proposed change into catalogue work, scans, validation, index construction, row
      movement or copying as applicable to the chosen engine. Explain why an online label does not establish
      a safe lock wait, resource cost or failure path. Inventory dependent views, constraints, indexes,
      generated values, prepared statements and replication consumers. Establish lock and execution limits,
      storage headroom, workload budgets and abort criteria using a representative rehearsal and verified
      engine behaviour. Link performance diagnosis and operational monitoring rather than repeat their
      general methods.
    nested_article:
      topic: Safe relational schema changes
      title: Changing schemas without breaking applications
      brief: Turn an intended schema change into an executable, interruptible procedure with measured
        limits on production impact. Use PostgreSQL 18 as the worked engine, pinning the exact server
        and migration-tool versions before writing runnable examples. Reuse the parent's application-compatibility
        sequence and concentrate on locks, queued work, scans, rewrites, dependencies and deployment restrictions.
        Develop staged constraint validation and a large column-type change, then use a compact operation
        table to cover related column, index and table changes. Give every stage preconditions, transaction
        boundaries, completion evidence and a response to failure. Link the data-job and operations owners
        for their procedures; do not create a separate article for each DDL command or engine.
      href: /review/relational-next/schema-changes/
    anchor: find-out-what-the-database-must-do
  - title: Move existing data while writes continue
    brief: 'Show why deploying a new column leaves existing rows unfinished and why one large update may
      exceed an acceptable transaction or workload budget. Introduce bounded batches, durable progress,
      restart safety and explicit ownership of concurrent changes. Distinguish a backfill from an import
      or correction: each needs an input contract, duplicate policy, error handling and reconciliation.
      Require a concrete meaning of complete, including rows created or changed during the job.'
    nested_article:
      topic: Relational backfills, imports and corrections
      title: Running reliable data changes
      brief: Teach resumable, idempotent data jobs through one backfill that converts the order system's
        delivery address into a structured representation while orders continue to change. Develop an
        explicit input contract, complete work coverage, protection against stale writes, atomic progress
        and recovery after an uncertain batch outcome. Bound the effect on the live workload and reconcile
        meaning as well as row coverage. Contrast external imports and production corrections only where
        their input, duplicate or recovery contracts change the procedure. Reuse the parent's application
        compatibility argument and link transaction guarantees, request retries and operational diagnosis
        rather than teach them again. Verify executable procedures against the selected engine and version.
      href: /review/relational-next/data-changes/
    anchor: move-existing-data-while-writes-continue
  - title: Switch traffic only when the destination is ready
    brief: Extend the same staged-change reasoning to moving a database. Separate copying existing data,
      carrying later changes, validating the destination and transferring write authority. Explain that
      a replica caught up at one instant is not yet a complete cutover argument. Introduce readiness gates
      for data, application behaviour, connections, permissions and performance, and an explicit treatment
      of writes during the switch. Link replication and recovery mechanisms to the operations branch.
    nested_article:
      topic: Moving a relational database
      title: Moving databases with a controlled cutover
      brief: Teach one controlled move of an order database from a source to a destination, following
        the copy, intervening changes and transfer of write authority. Choose between a rehearsed write
        pause and a copy with change capture using the allowed outage and measured transfer time. Establish
        compatibility, a consistent starting state and an explicit final change boundary; prove that the
        destination meets them before admitting writes. Define abort conditions and explain how destination
        writes change the route back. Reuse the parent article's application compatibility method and
        the operations branch's replication and recovery evidence. Verify concrete commands and guarantees
        against the selected engine, version, deployment and migration tool; do not build an engine-pair
        migration catalogue.
      href: /review/relational-next/database-moves/
    anchor: switch-traffic-only-when-the-destination-is-ready
  - title: Plan recovery before the first irreversible step
    brief: Label each stage as safely retryable, reversible with preserved data, or requiring compensation
      or restoration. Distinguish rolling back a code deployment, reversing a schema operation and undoing
      its data effects; identify the point at which old code can no longer run. Assign ownership and observable
      stop conditions, retain the evidence needed to resume, and decide how to handle partial success.
      Explain how a correction can reverse a transformation only when enough original information survives.
      Link tested backup restoration and point-in-time recovery procedures, including their effect on
      intervening valid writes, to operations.
    anchor: plan-recovery-before-the-first-irreversible-step
  - title: Retire old data and prove the change is finished
    brief: 'Require evidence that old readers and writers have disappeared, the new invariant holds and
      the workload is stable before removing compatibility paths, columns, staging tables or migration
      machinery. Apply this to a retention change: define which records become eligible, what related
      and derived data must change, and how deletion reaches replicas, exports and backup expiry under
      the actual service guarantees. Distinguish removing rows from immediately reclaiming space or eliminating
      every recoverable copy. Plan bounded deletion work and restoration procedures that do not silently
      reintroduce retired data. Finish the running example with a concise change record containing validation
      results, remaining recovery options and the final ownership of the data.'
    anchor: retire-old-data-and-prove-the-change-is-finished
