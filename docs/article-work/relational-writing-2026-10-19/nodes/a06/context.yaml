    heading:
    - title: Describe the physical change before scheduling it
      brief: Begin with an orders table whose amount column needs a wider representation and whose future
        writes must obey a new rule. Carry forward the parent's compatibility contract, authoritative
        representation and retirement gate. Inventory table size, dependencies, indexes, partitions, triggers,
        readers, writers and replicas. Build an operation table for adding a column or default, altering
        a type, adding a constraint, building an index, and renaming or dropping a table. For each exact
        form identify metadata work, validation scans, physical rewrites, lock requirements and remaining
        storage work; do not infer cost from statement length or an online label. Use the table to choose
        a short bounded pause or a staged change.
      anchor: describe-the-physical-change-before-scheduling-it
    - title: Keep a waiting schema change from stopping the workload
      brief: 'Follow three sessions: an existing transaction holds a conflicting lock, the schema statement
        waits, and later application work queues behind it. Teach how to inspect blockers, transaction
        age and queued requests using the selected engine''s lock and activity views. Separate time waiting
        for a lock from time executing and from time holding locks before commit. Choose lock and statement
        timeouts, a cancellation owner and retry conditions from the service''s interruption budget. Rehearse
        cancellation during waiting and execution, including the need to end a failed transaction and
        check what locks or work remain. Link transaction semantics and incident handling.'
      anchor: keep-a-waiting-schema-change-from-stopping-the-workload
    - title: Make the migration runner's boundaries visible
      brief: 'Show the actual command sequence and migration record produced by one versioned runner.
        Establish which statements it wraps in a transaction, which must run separately, how sessions
        inherit timeouts, and how it prevents two runners from applying the same change. Check engine-specific
        DDL atomicity, concurrent-operation restrictions and deployment privileges against documentation
        and a disposable rehearsal. Include a lost connection after submitting DDL: inspect server state,
        catalogue state and the runner''s history before deciding whether to resume, repair the record
        or rerun. A successful migration-history entry is evidence about the runner, not the complete
        application or database postcondition.'
      anchor: make-the-migration-runner-s-boundaries-visible
    - title: Enforce new writes before validating old rows
      brief: Work a new orders CHECK constraint through the selected engine's staged enforcement and validation
        facilities. Show exactly when new inserts and updates must satisfy the rule, which historical
        rows remain unchecked and what validation must prove. Deliberately include an invalid old row
        and a concurrent invalid write. Repair historical violations using the neighbouring data-job procedure,
        then validate and inspect the resulting constraint state. Record locks and concurrent-work behaviour
        at each step, and show recovery after interrupted or failed validation. Contrast foreign-key and
        not-null deployment only where their supported forms or dependencies change this procedure; do
        not generalise staged validation to every constraint.
      anchor: enforce-new-writes-before-validating-old-rows
    - title: Build a required index through failure and completion
      brief: Compare an ordinary build with the selected engine's concurrent build using the operation
        table's workload and interruption requirements. Follow its phases, waits and resource demand,
        including its transaction restrictions. Force one interrupted build and one uniqueness failure,
        inspect whether an invalid or incomplete index remains and explain its operational consequences
        before choosing cleanup or another attempt. When the change requires a uniqueness constraint,
        distinguish building a usable eligible index from attaching the final constraint. Prove validity
        and intended constraint ownership; use the index and performance articles for index selection
        and query-benefit assessment.
      anchor: build-a-required-index-through-failure-and-completion
    - title: Change a large representation in recoverable stages
      brief: Develop the amount-column type change into a complete physical procedure. First rehearse
        a direct conversion and measure its locking, rewrite, disk and logging costs, conversion failures
        and dependency effects. If those exceed the chosen budget, use a replacement column with explicit
        conversion semantics and reuse the parent's concurrent-write authority protocol and the neighbouring
        article's resumable backfill. Show the schema statements that create the new representation, prepare
        its constraints and indexes, and switch dependent views, functions or other consumers. Verify
        foreign-key, trigger and generated-value dependencies where present. Define a stable reconciliation
        gate before switching reads, and a safe interruption response at each stage. Do not treat a rename
        as proof that every dependency now uses the intended representation.
      anchor: change-a-large-representation-in-recoverable-stages
    - title: Rehearse the production impact and set stop conditions
      brief: Run the two procedures with representative data volume, long transactions and sustained concurrent
        reads and writes. Capture lock waits, request latency and errors, free space, logging volume and
        replica delay against explicit continuation and cancellation limits. Identify which replication
        arrangement carries schema changes and what must be coordinated separately; link operations for
        steady-state replication and recovery. Include an interrupted stage and a repeated invocation
        so the rehearsal proves the proposed recovery path. Record expected versus observed results, server
        and runner versions and deployment differences. Use PostgreSQL 18 ALTER TABLE, CREATE INDEX and
        relevant locking and replication documentation as primary references, including https://www.postgresql.org/docs/18/sql-altertable.html
        and https://www.postgresql.org/docs/18/sql-createindex.html.
      anchor: rehearse-the-production-impact-and-set-stop-conditions
    - title: Close the change with evidence and deliberate cleanup
      brief: Produce a completed change record connecting desired schema and application behaviour to
        observed catalogue definitions, validated constraints, valid indexes, representative workload
        checks and replica state. Distinguish a cancelled transaction from a committed earlier stage or
        an uncertain client outcome. List concrete cleanup for invalid indexes, temporary constraints,
        replacement columns and obsolete tables, retaining old representations until the parent's compatibility
        and retirement gates permit removal. Before a table rename or drop, inspect database dependencies
        and application or job references that catalogues cannot reveal; avoid using cascading removal
        as a substitute for that inventory. State which steps can be reversed directly and which need
        a forward repair or the existing recovery procedure to preserve writes accepted since the change.
      anchor: close-the-change-with-evidence-and-deliberate-cleanup
- id: a30
  href: /review/relational-next/data-changes/
  article:
    topic: Relational backfills, imports and corrections
    title: Running reliable data changes
    brief: Teach resumable, idempotent data jobs through one backfill that converts the order system's
      delivery address into a structured representation while orders continue to change. Develop an explicit
      input contract, complete work coverage, protection against stale writes, atomic progress and recovery
      after an uncertain batch outcome. Bound the effect on the live workload and reconcile meaning as
      well as row coverage. Contrast external imports and production corrections only where their input,
      duplicate or recovery contracts change the procedure. Reuse the parent's application compatibility
      argument and link transaction guarantees, request retries and operational diagnosis rather than
      teach them again. Verify executable procedures against the selected engine and version.
    heading:
    - title: Define what each changed row must mean
      brief: Start with a parser that can misinterpret an address or reject it, rather than treating the
        job as a loop around UPDATE. Specify the authoritative source, transformation version, source
        identity and required invariant; distinguish a legitimate empty value from a row awaiting processing.
        Define acceptable, invalid and ambiguous inputs and their recorded dispositions. Give the job
        a durable identity and keep enough source and outcome evidence to explain or repair a result.
        Establish the parent's prerequisite that all active and delayed writers follow the agreed representation
        protocol.
      anchor: define-what-each-changed-row-must-mean
    - title: Define a set of work that can actually be finished
      brief: 'Compare a durable worklist with a traversal ordered by an immutable unique key. Show why
        offsets over changing rows can skip work, and why a largest allocated identifier or timestamp
        alone is not a commit boundary: a lower identifier can become visible after the cursor has passed
        it. Choose one complete protocol for the example, combining an explicit enumeration boundary with
        writers that maintain the new representation and a catch-up check for work that became visible
        later. State the handling of inserts, deletes and eligibility changes during the run. Checkpoints
        must describe accounted-for work, including quarantined and deferred rows, rather than merely
        the greatest key observed. Avoid a long-lived snapshot unless its workload and retention costs
        are accepted.'
      anchor: define-a-set-of-work-that-can-actually-be-finished
    - title: Stop the backfill from overwriting a newer address
      brief: Interleave a worker read, an application edit and the attempted worker write. Work through
        a conditional update guarded by a source version that every relevant writer advances, or another
        explicitly verified protocol. Derive the structured value from the guarded source and inspect
        the actual affected rows. A failed condition means re-read, defer or record a conflict; it must
        not silently count as successful conversion. Account for deleted rows without recreating them.
        Explain how writers preserve the invariant after a row has been processed. Link isolation and
        locking mechanisms and check the concrete update semantics for the chosen engine.
      anchor: stop-the-backfill-from-overwriting-a-newer-address
    - title: Commit the batch and its progress together
      brief: Put row changes, recorded dispositions and durable progress in the same transaction where
        possible. Walk through interruption before commit and a lost acknowledgement after commit. Recover
        through the durable job record and an idempotent replay rule, using the existing transaction and
        retry articles for the abort-versus-unknown distinction. Define the idempotency identity using
        the job, source record and relevant version; a retry must neither double-apply a correction nor
        skip an uncommitted effect. Begin with one worker. If concurrent workers are needed, require exclusive
        claims or disjoint work and prevent a replaced worker from advancing shared progress; do not introduce
        a general job-scheduler design.
      anchor: commit-the-batch-and-its-progress-together
    - title: Account for everything a row change can trigger
      brief: Inventory constraints, foreign keys, generated values, identities, triggers, change consumers
        and application side effects before the first batch. Apply dependent changes in a valid referential
        order and verify stored results after database-generated behaviour. Explain why bypassing the
        application can omit an intended effect, while reusing its normal write path can send unwanted
        notifications or duplicate external actions. Choose deliberately which effects the job produces
        and how their delivery is recorded and reconciled, linking application integration for atomic
        handoff and external deduplication. Keep constraint and index deployment in the schema-change
        sibling.
      anchor: account-for-everything-a-row-change-can-trigger
    - title: Keep each batch inside the workload budget
      brief: Select and rehearse batches using transaction duration, lock waits, rows touched, logging,
        storage growth and replica lag as well as row count. Show that a small result set can still require
        a large scan or expensive trigger work. Use observed request latency and database pressure to
        reduce batch size, concurrency or rate, or pause at a committed boundary. Define cancellation
        conditions and record the last durable progress before resuming. Link operational signals and
        query diagnosis; teach the job's control decisions without rebuilding monitoring or maintenance
        guidance.
      anchor: keep-each-batch-inside-the-workload-budget
    - title: Adapt the input contract for imports and corrections
      brief: Reuse the same job and batch method. For an import, stage raw input when validation, deduplication
        or review must precede live changes; preserve a source identifier and input version, validate
        parsing and relationships, and state whether duplicate input is rejected, merged or replaces a
        prior version. Require a deliberate conflict policy for existing live rows; an upsert alone does
        not establish business correctness. For a correction, record the expected faulty state and intended
        replacement, guard against subsequent legitimate edits and preserve before-images where reversal
        is required. Explain why blindly restoring those before-images later could erase valid intervening
        changes. Do not repeat complete import and correction walkthroughs or develop a separate ingestion
        curriculum.
      anchor: adapt-the-input-contract-for-imports-and-corrections
    - title: Prove completion before removing the machinery
      brief: Reconcile the declared source scope with accepted, rejected, conflicted and outstanding records
        using identities and versions. Demonstrate checks for missing rows, unexpected rows, duplicates,
        broken relationships and semantically wrong transformations; equal counts alone cannot establish
        correctness. Validate changing source and destination data against a consistent boundary or the
        established writer protocol, rather than comparing unrelated live snapshots. Require all deferrals
        to be resolved or explicitly accepted and show that new writes preserve the invariant. Record
        the transformation version, scope, reconciliation results, exceptions and remaining recovery options.
        Hand evidence to the parent's read-switch and retirement gates; retain or remove staging, before-images
        and job records under their agreed retention policy.
      anchor: prove-completion-before-removing-the-machinery
- id: a31
  href: /review/relational-next/database-moves/
  article:
    topic: Moving a relational database
    title: Moving databases with a controlled cutover
    brief: Teach one controlled move of an order database from a source to a destination, following the
      copy, intervening changes and transfer of write authority. Choose between a rehearsed write pause
      and a copy with change capture using the allowed outage and measured transfer time. Establish compatibility,
      a consistent starting state and an explicit final change boundary; prove that the destination meets
      them before admitting writes. Define abort conditions and explain how destination writes change
      the route back. Reuse the parent article's application compatibility method and the operations branch's
      replication and recovery evidence. Verify concrete commands and guarantees against the selected
      engine, version, deployment and migration tool; do not build an engine-pair migration catalogue.
    heading:
    - title: Choose the simplest move that fits the write pause
      brief: 'Start with the additional failure case: orders continue to change while their earlier state
        is being copied, so a successful copy alone cannot authorise switching the application. State
        the allowed write interruption, data-loss tolerance, workload scope and completion evidence. Measure
        copy, validation and restart time in rehearsal. Use a bounded write pause when the whole move
        fits; otherwise identify the extra capture, retention and reconciliation work required to shorten
        that pause. Keep a controlled pause as a complete path, rather than treating online migration
        as the default.'
      anchor: choose-the-simplest-move-that-fits-the-write-pause
    - title: Prove that the destination preserves the workload's meaning
      brief: Follow representative order reads and writes through the proposed destination. Inventory
        schema, types, collations and comparison rules, time handling, identities and sequences, generated
        values, constraints, triggers, extensions and query semantics only where they affect this move.
        Separate schema and object transfer from row transfer, and identify state the chosen mechanism
        does not carry. Test application roles and permissions, connections and representative queries
        with realistic data and concurrency. Link general application-version compatibility and query
        diagnosis to their owners; keep any required engine conversion within this move.
      anchor: prove-that-the-destination-preserves-the-workload-s-meaning
    - title: Join the starting copy to every later change
      brief: Draw one timeline showing the consistent source snapshot, the capture boundary, copied rows
        and subsequent inserts, updates and deletes. Require a documented way to connect snapshot and
        change stream without lost changes, including the tool's treatment of overlap, ordering, transaction
        boundaries and restart. Verify table eligibility, row identification, DDL handling, sequence handling
        and other replication limitations for the selected mechanism. Set a policy for schema changes
        during the move. Check retention, catch-up capacity and copy load; define when an expired boundary
        or unsupported change requires restarting the copy. For the pause path, show how fencing all writers
        supplies the stable copy boundary without a live change stream.
      anchor: join-the-starting-copy-to-every-later-change
    - title: Rehearse the destination and reconcile the copied state
      brief: Run the actual procedure on representative volume and workload, including interruption and
        restart. Reconcile missing, duplicate and incorrect rows with key-range checks and domain invariants,
        using comparable snapshots or an agreed change boundary so concurrent changes do not invalidate
        comparisons. Explain why a row count alone cannot establish correctness. Exercise order creation,
        updates, constraints and generated identifiers; verify capacity, permissions and connection behaviour.
        Reuse operations' restore and replication checks where applicable. Record measured timings, tolerances,
        owners and evidence that make a cutover attempt acceptable.
      anchor: rehearse-the-destination-and-reconcile-the-copied-state
    - title: Fence writers and prove the final boundary has arrived
      brief: 'Develop an ordered cutover runbook: stop admitting writes, drain or resolve in-flight work,
        fence source writers, record the final committed change boundary, wait for that boundary to be
        applied at the destination, and complete the final reconciliation. Include background workers,
        delayed jobs, scheduled tasks, administrators and old connection pools in the writer inventory;
        a routing or DNS change alone is not evidence that they have stopped writing. Resolve uncertain
        request outcomes through the application integration procedure. Verify all unreplicated state,
        including identifiers, before enabling destination writes. Make exclusive write authority and
        the boundary evidence explicit gates, with an owner empowered to abort when either is unproved.'
      anchor: fence-writers-and-prove-the-final-boundary-has-arrived
    - title: Admit destination traffic with a defined way to stop
      brief: 'Switch connection configuration, retire or refresh old pools, and reopen writers only after
        the preceding gates pass. Use observable application checks and bounded workload admission to
        detect semantic, permission and capacity failures. Distinguish an abort before destination writes
        from a return after new orders have committed there: the latter needs a verified reverse synchronisation
        or another migration that preserves those writes. Do not imply that sending connections back restores
        a consistent service. Decide the return procedure and its feasibility before cutover; avoid dual
        writes unless a separately justified correctness protocol already exists.'
      anchor: admit-destination-traffic-with-a-defined-way-to-stop
    - title: Close the move with evidence
      brief: Record the final boundary, reconciliation results, application acceptance and current write
        authority. Keep the source fenced for the agreed decision window and hand destination recovery
        protection and routine monitoring to operations. Identify the evidence that permits removing temporary
        capture, credentials and migration resources. Link lifecycle retirement to the parent and ongoing
        replication, failover and backup administration to operations, without repeating their procedures.
      anchor: close-the-move-with-evidence
scope_boundary: 'Use the actual parent, sibling and child plans: teach a useful high-level answer here,
  introduce deeper questions in context, and leave their detailed mechanisms/procedures with the owning
  child. Do not duplicate a sibling. A parent must still teach a complete useful first case, not just
  advertise links.'
