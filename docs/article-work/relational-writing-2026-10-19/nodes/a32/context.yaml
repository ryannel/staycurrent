  path or wait for review capacity. Use the supplied heading anchor values as HTML IDs; retain them when
  wording a heading naturally, so contextual prerequisite links remain stable. Figure-internal titles
  use figcaption or styled paragraphs, not h2/h3/h4 elements: the site check forbids headings inside figures.'
