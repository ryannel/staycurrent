neighbours:
- id: a34
  slug: cockroachdb
  title: Checking a distributed choice with CockroachDB
  brief: Decide whether a specific CockroachDB version and deployment meet an application's distributed
    relational requirements. Follow one regional order-reservation workload from its placement and transaction
    boundaries through compatibility, latency, contention and failure tests to a documented adoption or
    rejection. Establish a minimal topology and starting configuration, dated version and service-tier
    evidence, and the resource, network and operating cost of meeting the requirements. Reuse common transaction,
    application integration, evolution, performance and operations methods; explain distributed mechanisms
    only far enough to predict or interpret acceptance results. Illustrative traces explain hypotheses;
    only observed tests establish acceptance, and untested claims remain explicit gaps.
  parent: a08
  href: /review/relational-next/cockroachdb/
