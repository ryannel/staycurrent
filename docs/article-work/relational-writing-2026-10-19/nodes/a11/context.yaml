original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational normalisation and deliberate redundancy
  title: Normalisation and deliberate redundancy
  brief: Teach how to recognise facts with different dependencies, split their storage without losing
    meaning, and justify retaining a derived copy. Extend the booking design with candidate-key, partial-dependency,
    transitive-dependency and independent-set cases; introduce normal-form names only when they explain
    a consequential choice. Check both reconstruction and enforceability after a split. Compare repeated
    attributes, cached totals, summary tables and materialised results through their read benefit and
    maintenance contract. Finish with a defensible design and a falsifiable case for its redundancy, using
    the performance and transaction branches for detailed validation rather than expanding this into a
    theory or optimisation curriculum.
  heading:
  - title: State what determines each fact
    brief: Start from the parent's booking schema and a service-line extension whose rows mix booking
      facts, service facts and quantities. Write dependencies as business rules about all permitted states,
      not coincidences in the current sample. Show the inconsistent update, missing insertion and destructive
      deletion that expose the mixed ownership before naming functional dependencies. Identify all minimal
      unique combinations under explicit business assumptions, including tenant scope; distinguish the
      selected primary key from the other candidate keys. Show why a generated row identifier does not
      remove dependencies or inconsistent copies. Recall in one sentence that current and agreed prices
      can be different facts, linking to the parent and history article for that established distinction.
    anchor: state-what-determines-each-fact
  - title: Split facts that depend on different keys
    brief: Decompose the service-line example into booking, service and booked-service relations. Explain
      why booking attributes depend on only the booking part of the composite key and service attributes
      on the service part, while a quantity belongs to their association. State the one-line-per-service
      assumption; if repeated lines are permitted, reconsider the key rather than force the example.
    heading:
    - title: Follow indirect dependencies
      brief: Extend the same case with a service category whose label is determined by category identity.
        Separate the category fact and trace a label correction through the resulting tables. Introduce
        partial and transitive dependencies, and second and third normal forms, as names for the reasoning
        just used; avoid treating every non-key dependency as the same case.
      anchor: follow-indirect-dependencies
    - title: Handle overlapping candidate keys when they matter
      brief: Use one small counterexample where considering only the chosen primary key misses a dependency
        involving an alternative key. Introduce the stronger Boyce-Codd condition only to explain the
        remaining repetition and the choice of decomposition. Reuse this same example for the enforcement
        tradeoff below; omit a progression through formal proofs and algorithms.
      anchor: handle-overlapping-candidate-keys-when-they-matter
    anchor: split-facts-that-depend-on-different-keys
  - title: Prove that the split preserves the relationships
    brief: Reconstruct the original facts by joining the proposed relations and compare them with a deliberately
      unsafe split that admits extra combinations. Explain lossless decomposition as preservation of permitted
      facts, not merely a match on one test dataset. Use the shared determinant in a simple binary split
      to make the reason visible, then carry the same reasoning through the staged split.
    heading:
    - title: Check what can still be enforced locally
      brief: 'Distinguish lossless reconstruction from dependency preservation. In the overlapping-key
        case, identify a rule that a proposed split can no longer check within one table. Make the tradeoff
        explicit: choose a useful design only after locating enforcement of every required rule. Link
        constraint mechanisms and concurrent enforcement to their owning articles.'
      anchor: check-what-can-still-be-enforced-locally
    anchor: prove-that-the-split-preserves-the-relationships
  - title: Separate independent sets without inventing combinations
    brief: Give a venue independently recorded facilities and supported languages. Show why storing every
      facility-language combination repeats two independent sets, and why separate venue-facility and
      venue-language relations retain their meaning. Introduce a multivalued dependency and fourth normal
      form only to explain this decision, including how to represent a venue with an empty set.
    heading:
    - title: Keep combinations that are themselves facts
      brief: Change the requirement so a language is available only for particular services or facilities.
        Demonstrate the false availability implied by projecting and rejoining independent sets, and retain
        the actual association instead. Derive independence from the requirement rather than a visual
        pattern in sample rows. Stop here without a higher-normal-form survey.
      anchor: keep-combinations-that-are-themselves-facts
    anchor: separate-independent-sets-without-inventing-combinations
  - title: Decide which repeated results are worth storing
    brief: Compare computing a booking total from source lines with storing that total; then use short
      variations for a repeated current attribute, a summary table and a materialised query result. Separate
      an ordinary view from stored results and an agreed historical value from a derived current copy.
      Explain that joins alone do not establish a performance problem and a stored result moves work into
      updates, refreshes and recovery. Require a concrete expensive read, a representative workload and
      a target before accepting redundancy. Compare the measured benefit with extra writes, contention,
      storage, refresh work and acceptable staleness; consider simpler query or index alternatives. Hand
      query plans, benchmark design and intervention validation to performance.
    anchor: decide-which-repeated-results-are-worth-storing
  - title: Give every derived copy a maintenance contract
    brief: 'Complete a contract for the stored booking total: authoritative source facts, included statuses
      and calculation rule, freshness visible to readers, owner of updates, concurrency protection and
      a repair or rebuild path. Cover inserts, corrections, cancellations, deletions and every writer
      that can affect the result. Require the same answers for the other forms of stored result.'
    heading:
    - title: Choose atomic maintenance or explicit lag
      brief: Contrast changing the total with source rows in one transaction against rebuilding or refreshing
        it later. Use one small lost-update counterexample to establish the required concurrency guarantee,
        then link its implementation to transactions. For asynchronous maintenance, require a stated lag
        allowance and a guarantee that missing, repeated or out-of-order changes cannot leave undetected
        drift. Link delivery and recovery protocols to application integration rather than developing
        them here.
      anchor: choose-atomic-maintenance-or-explicit-lag
    - title: Make drift detectable and rebuilding safe
      brief: Require a source-based comparison and a rebuild guarantee that accounts for concurrent changes
        and identifies when the replacement is usable. Record the owner and reader behaviour if repair
        fails; link replacement procedures and operational scheduling to evolution and operations. A value
        that cannot be recovered from the alleged source requires revisiting the source-of-truth decision,
        not a more elaborate refresh procedure here.
      anchor: make-drift-detectable-and-rebuilding-safe
    anchor: give-every-derived-copy-a-maintenance-contract
  - title: Defend the design with changes and counterexamples
    brief: 'Finish with a compact review of the worked schema: identify keys and dependencies, demonstrate
      reconstruction without extra combinations, account for independent and correlated sets, and locate
      enforcement for each rule. Exercise one correction, one deletion and competing total updates; specify
      the promised reader result and recovery after an interrupted refresh. Retain a redundant result
      only with its maintenance contract and measured benefit. Distinguish paper reasoning, illustrative
      schedules and any later engine execution evidence; do not claim these design checks establish performance
      or concurrent correctness on their own.'
    anchor: defend-the-design-with-changes-and-counterexamples
