    level: 2
  - title: Choose identity and scope deliberately
    anchor: choose-identity-and-scope-deliberately
    level: 3
  - title: Represent optional relationships
    anchor: represent-optional-relationships
    level: 3
  - title: A value needs a meaning as well as a type
    anchor: a-value-needs-a-meaning-as-well-as-a-type
