neighbours:
- id: a24
  slug: physical-storage
  title: How stored rows become physical work
  brief: Teach the physical model needed to explain page traffic, cache pressure and unreclaimed space
    in relational workloads. Follow one changing table through reads, wider rows, updates, retained versions
    and space reuse, connecting each mechanism to evidence and a possible intervention. Use selected PostgreSQL
    and InnoDB differences only when they change that diagnosis; verify the chosen version's behaviour
    against primary documentation. Keep row locators here only far enough to understand physical locality;
    the index article owns traversal, key order, coverage and the detailed secondary-index/base-row access
    path. Treat physical pruning as one measurable layout intervention. Link transaction semantics and
    operational reorganisation procedures to their owners, and use the parent's comparison method rather
    than teaching benchmarking again. Stop at the depth needed for relational engineering decisions, without
    a separate storage-engine or partitioning curriculum.
  parent: a05
  href: /review/relational-next/physical-storage/
  children: []
