- id: a17
  slug: changing-data
  title: Changing data with SQL
  brief: Make INSERT, UPDATE and DELETE express a deliberate change to a known target set, then establish
    whether their results satisfy the intended postcondition. Extend the parent's first change workflow
    through set-based changes, insert-from-query, defaults and generated identifiers, constraint failures,
    ambiguous source matches and conflict-handling choices. Use a small order-and-stock fixture in a named
    PostgreSQL version, checking consequential behaviour against its primary documentation and recording
    actual results separately from illustrative examples. Keep conflict-handling inserts, upsert and MERGE
    together as an outcome decision; identify consequential dialect differences without building a syntax
    catalogue. Use bounded transactions for disposable exercises and link to transaction reasoning for
    concurrent correctness, application integration for retries and idempotency, and evolution for production
    corrections and backfills.
  parent: a02
  href: /review/relational-next/changing-data/
