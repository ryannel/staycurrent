- id: a15
  slug: query-composition
  title: Composing larger SQL queries
  brief: Extend the parent's completed report and existence test with the correctness decisions needed
    when queries return scalar values, supply tables, compare memberships or combine results. Make cardinality,
    correlation, null policy, compatible types and duplicate policy explicit. Explain how a checked query
    becomes a reusable view without implying an execution strategy. Offer one optional hierarchy traversal
    with deliberate termination, cycle, multiplicity and ordering rules. Use a named engine and identify
    consequential dialect differences; leave execution costs, materialisation and plan diagnosis to performance,
    and view deployment to evolution.
  parent: a02
