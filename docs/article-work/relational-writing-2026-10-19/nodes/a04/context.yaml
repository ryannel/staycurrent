- id: a20
  href: /review/relational-next/connections/
  article:
    topic: Relational connection and transaction lifecycle management
    title: Managing connections and transaction lifetimes
    brief: Teach how to own a stateful database connection from acquisition to safe reuse or disposal,
      including exceptions, cancellation, streaming and shutdown. Separate application handles, pool leases,
      transactions and database sessions; verify their relationship against the chosen driver and any
      proxy. Diagnose occupied pools using acquisition wait, lease duration, active database work and
      connection counts, then bound admission and aggregate connection demand. Extend the parent's ordinary
      request example through resource failures rather than repeating it. Own cancellation and connection-reuse
      mechanics here; link to request recovery for deadlines, idempotency and decisions about uncertain
      operation outcomes, to transactions for correctness guarantees and to performance and operations
      for workload capacity and service budgets.
    heading:
    - title: Know what a borrowed handle owns
      brief: Draw the ownership chain from application task through pool lease and driver connection to
        database session, with a transaction and result stream attached to their actual owner. Show why
        a convenient pool-level query call may acquire a different connection each time, while a multi-statement
        transaction needs the affinity guaranteed by its transaction handle or checked-out client. Verify
        implicit transaction and autocommit behaviour, concurrent use restrictions and commit-on-context-exit
        behaviour against the selected API; do not infer them from similarly named methods in another
        driver. Use PostgreSQL with one pinned driver as the concrete case, distinguishing its behaviour
        from the general ownership questions. The node-postgres transaction documentation supplies one
        explicit same-client example at https://node-postgres.com/features/transactions.
      anchor: know-what-a-borrowed-handle-owns
    - title: Return only a connection that is ready for another borrower
      brief: 'Extend the parent''s success and error path into a small resource-state diagram: waiting,
        acquired, in use, cleaning up, reusable or discarded. Give each lease one owner and one terminal
        release or discard, including failures during begin, execution, rollback and cleanup. Await completion
        and required result draining before reuse; finish or roll back an open transaction through the
        chosen API, and distinguish a clean idle session from one in a failed transaction. Preserve the
        original operation error while recording cleanup failure. Explain what the pool actually resets
        on return and when broken protocol, failed cleanup or uncertain connection state requires disposal.
        Resource disposal does not settle an operation''s commit outcome; hand that question to request
        recovery.'
      heading:
      - title: Cancellation is a cleanup sequence
        brief: Follow cancellation while waiting for a lease, executing a statement and cleaning up. Verify
          whether cancelling acquisition removes the queued waiter; prevent a late acquisition from becoming
          an unowned lease. Distinguish a cancellation request from observed command termination, then
          await the driver's completion and protocol synchronisation requirements, roll back when needed
          and release or discard. Keep required cleanup alive when the caller's task is cancelled, using
          the runtime's supported mechanism and a bounded cleanup allowance; never return a connection
          while work or results still belong to the old borrower. Use the chosen driver's documentation
          and PostgreSQL's cancellation contract at https://www.postgresql.org/docs/18/libpq-cancel.html
          as implementation evidence, without presenting libpq calls as another driver's API. Request
          recovery owns interpreting timeouts and deciding whether to retry or reconcile.
        anchor: cancellation-is-a-cleanup-sequence
      anchor: return-only-a-connection-that-is-ready-for-another-borrower
    - title: Match session state to the pooling mode
      brief: Compare a direct connection, an application pool and a transaction-pooling proxy only where
        they change state ownership and reuse. Track temporary settings, role or tenant context, temporary
        objects, prepared statements and cursors across transaction end and lease return. Prefer transaction-scoped
        state when supported, verify reset guarantees and discard when safe isolation between borrowers
        cannot be established. Distinguish SQL-level preparation from protocol-level preparation and driver
        statement caches; support depends on proxy version and configuration. Use a compact compatibility
        example from https://www.pgbouncer.org/features.html and the selected driver's documentation,
        rather than a universal claim that transaction pooling preserves or forbids all prepared statements.
        Keep authorisation design in the parent and query-plan behaviour in performance.
      anchor: match-session-state-to-the-pooling-mode
    - title: Keep result consumption inside the resource lifetime
      brief: Show a slow consumer holding a cursor, transaction or leased connection after database execution
        has produced rows. Make stream ownership explicit through full consumption, early loop exit, consumer
        error and disconnect. Close or cancel the stream, await the driver's required draining or acknowledgement,
        close its transaction where applicable and only then return the lease. Verify cursor lifetime
        and fetch buffering for the selected API; do not assume all streaming APIs retain the same resources.
        Bound consumer hold time and choose bounded materialisation or shorter retrieval units only when
        their result semantics allow it, linking query composition and SQL for those choices. Explain
        the retained connection and open-transaction consequences without reteaching snapshot or retained-version
        mechanics.
      anchor: keep-result-consumption-inside-the-resource-lifetime
    - title: Bound demand before enlarging the pool
      brief: Separate admitted application work, queued acquisition, leased client connections, proxy
        queues and database sessions. Bound the acquisition queue and wait, shed work when it cannot obtain
        a lease within the caller's supplied budget and avoid holding a lease across unrelated external
        calls. Allocate a connection allowance across application replicas, overlapping deployments, background
        workers and distinct pools, leaving the operational reserve supplied by operations. Show an explicitly
        illustrative aggregate-count example; behind a proxy distinguish frontend client counts from backend
        database-session limits. An increased pool is a hypothesis to validate against completed work
        and contention, not a default response to waiting. Link performance for concurrent-load diagnosis
        and operations for selecting service capacity and reserve; do not derive another sizing theory.
      anchor: bound-demand-before-enlarging-the-pool
    - title: Find where the lease time goes
      brief: Correlate acquisition wait and timeout counts, queue depth, leased and idle counts, lease-duration
        distributions and database-session activity for one request or worker. Use contrasting traces
        to distinguish a missing release, idle open transaction, slow result consumer, slow or blocked
        SQL, exhausted admission and stale idle connection; high occupancy alone does not identify the
        cause. Separate executing database time from application time while holding the lease, and account
        for proxy-side waiting where present. Put borrower identity and transaction age alongside counts
        so an investigation can find the owner. Repair ownership or cleanup defects here; hand SQL and
        workload bottlenecks to performance and service-wide incident response to operations. Verify driver
        behaviour on idle disconnects and replacement so validation, connection lifetime settings and
        reconnect handling do not become assumptions that a successful borrow proves the next statement
        will succeed.
      anchor: find-where-the-lease-time-goes
    - title: Prove cleanup across failures and shutdown
      brief: Use a tiny real-driver pool to expose leaks quickly. Inject a statement error, cancellation
        during acquisition and execution, early stream termination, failed rollback and connection loss;
        after each case check that every lease has returned or been discarded, no abandoned transaction
        remains and the next borrower receives usable state without the previous borrower's settings.
        Record driver, database and proxy versions and configuration, distinguishing captured behaviour
        from the explanatory state diagram. For shutdown, stop admission and background acquisition, let
        owners finish within a bounded grace period, clean up or close remaining connections through the
        documented API and await pool closure. Test that a leaked lease cannot make shutdown wait indefinitely.
        Keep uncertain business outcomes discoverable for the request-recovery owner rather than treating
        successful process exit as proof of transaction completion.
      anchor: prove-cleanup-across-failures-and-shutdown
- id: a21
  href: /review/relational-next/generated-queries/
  article:
    topic: Relational query composition and ORM behaviour
    title: Controlling the queries your application performs
    brief: Make handwritten SQL, query builders and ORM operations accountable for the database work a
      request performs. Use one bounded order-list example to trace statements, round trips, returned
      rows and materialised objects; diagnose lazy loading, N+1 reads, joined collection multiplication
      and implicit writes. Choose projections, loading strategies and batch sizes that preserve the required
      result while bounding application work. Inspect pagination and streaming at the abstraction boundary,
      preserve binding and authorisation during composition, and test representative query and result
      bounds against the selected database and library. Build on the parent's ordinary request and security
      explanation; leave SQL semantics, physical execution tuning, connection cleanup and request recovery
      with their existing owners.
    heading:
    - title: Trace one request to its actual statements
      brief: Start with an order-list endpoint that displays a bounded set of orders, their customer names
        and item summaries. Write down the required response before comparing equivalent SQL, query-builder
        and ORM expressions. Capture the statements actually executed across request handling and response
        serialisation, with correlation to the request and transaction. Record statement count, database
        round trips, rows returned and objects retained separately; an abstraction call is not a measurement
        of any of these. Explain safe parameter observation through redacted values and types, and label
        invented traces as illustrations rather than observed behaviour.
      anchor: trace-one-request-to-its-actual-statements
    - title: Find the reads hidden behind object access
      brief: Follow the endpoint through its initial order query, customer access and item iteration.
        Show how a serializer or template can trigger additional reads after the apparent query has completed.
        Vary the number of parent records to expose repeated per-record loading, distinguishing it from
        a fixed set of intentional queries. Account for already-loaded relationships and identity-map
        reuse so a warm session does not hide the cold-request behaviour. Use explicit loading boundaries
        or supported checks against unexpected lazy loads where they make the request's work predictable.
      anchor: find-the-reads-hidden-behind-object-access
    - title: Choose a loading shape for the response
      brief: Compare a direct projection, a joined load and separate batched relationship queries for
        the same response. Count SQL rows, distinct entities and final response items rather than treating
        them as interchangeable. Include empty relationships and an order with many items to check meaning
        as well as work. Choose the shape from needed fields, relationship cardinality, round trips and
        transfer or allocation limits, rather than declaring one loading strategy universally best.
      heading:
      - title: See what joined collections multiply
        brief: Extend one order with two independent collections and trace the rows returned by their
          joined load. Verify how the selected library reconstructs entities and collections, including
          duplicate handling; deduplicated objects alone do not establish bounded transferred rows. Show
          when fetching the collections separately keeps the response's meaning while reducing repeated
          data. Link join semantics to the SQL owner and expensive execution to performance.
        anchor: see-what-joined-collections-multiply
      - title: Bound separate loads and batches
        brief: Fetch relationships for a bounded set of authorised parent identifiers, then attach them
          to the correct parents while retaining empty collections. Make parameter and batch limits explicit
          for the selected database, driver and library. Compare the resulting fixed batches with per-parent
          reads, and state how several statements interact with the request's required view of changing
          data. Use the transaction branch's guarantees when one consistent view is required; do not derive
          them again here.
        anchor: bound-separate-loads-and-batches
      anchor: choose-a-loading-shape-for-the-response
    - title: Keep pages and streams bounded through materialisation
      brief: Translate the SQL branch's chosen page and ordering contract through the application abstraction.
        Inspect whether a collection load or deduplication changes which parent records a limit applies
        to; where needed, select the bounded parent page first and load its related data afterwards. Bound
        child cardinality and response size as well as parent count. For a large sequential export, verify
        whether iteration actually limits driver buffering, object tracking and application retention.
        Show how processing in chunks can still retain every object accidentally. Identify the connection
        and transaction ownership that streaming requires and link cleanup and slow-consumer handling
        to the connection article. Do not introduce another pagination or cursor curriculum.
      anchor: keep-pages-and-streams-bounded-through-materialisation
    - title: Inspect the writes and transactions an abstraction introduces
      brief: Change a tracked object before issuing an apparent read and capture whether the selected
        ORM flushes pending writes, when the transaction begins and which connection executes each statement.
        Contrast flush with commit using the existing transaction guarantees. Inspect generated writes,
        optimistic concurrency conditions where configured, and whether bulk or raw-SQL operations leave
        tracked objects stale. Verify the selected library's documented behaviour and version rather than
        generalising across ORMs. Keep transaction ownership explicit across helper calls; leave transaction
        lifetime cleanup and recovery from errors to the neighbouring articles.
      anchor: inspect-the-writes-and-transactions-an-abstraction-introduces
    - title: Preserve binding and authority as queries are composed
      brief: Apply the parent's parameter-binding and authorisation rules to reusable filters, relationship
        loaders and query fragments. Trace the tenant or owner restriction through the initial query,
        separate relationship loads, counts and mutations, including a caller-supplied identifier from
        another tenant. Verify that raw fragments keep values bound and that dynamic SQL structure uses
        an allowed selection. Check how optional filters, aliases and global scopes compose instead of
        assuming a query builder supplies the request's authority. Link SQL null and predicate semantics
        to their owner rather than reteaching expression rules.
      anchor: preserve-binding-and-authority-as-queries-are-composed
    - title: Test the generated work as part of the operation's contract
      brief: Run representative integration tests through the real database, driver and abstraction, including
        response serialisation. Seed no related rows, ordinary rows, many parents, a high-cardinality
        child collection and cross-tenant identifiers. Assert response meaning, allowed statement or round-trip
        bounds, transferred or materialised result bounds where observable, and absence of unexpected
        writes; vary parent count so an N+1 regression cannot pass on a one-row fixture. Use library-specific
        expected ranges when batching changes counts, and avoid brittle full SQL string snapshots as the
        sole evidence. Recheck after loading changes or dependency upgrades. Hand a small number of individually
        costly statements and their parameters to the performance investigation rather than treating a
        low query count as proof of efficiency.
      anchor: test-the-generated-work-as-part-of-the-operation-s-contract
- id: a22
  href: /review/relational-next/request-recovery/
  article:
    topic: Relational request deadlines, retries and idempotency
    title: Recovering database requests safely
    brief: Design a bounded application request across pool acquisition, statements, transaction completion
      and response delivery. Decide what may be repeated from evidence about the database outcome, then
      give a logical operation a durable identity so overlapping attempts and lost responses can be resolved
      safely. Keep deadline budgets, retry eligibility, idempotency records and reconciliation within
      one operation contract. Build on the transaction branch's guarantees; link connection cleanup mechanics
      and external-effect recovery to their owners.
    heading:
    - title: Separate the request from the operation
      brief: 'Reuse the parent''s order-placement example after its ordinary successful path. Give the
        logical order operation a stable identity and distinguish it from each transport request and database
        transaction attempt. Follow one lost response through three possible histories: no transaction
        began, the transaction aborted, or the order committed without the caller learning its result.
        Use an explicitly illustrative timeline to establish what each observer knows. Link the transaction
        branch for the underlying commit and abort guarantees rather than deriving its concurrency theory
        again.'
      anchor: separate-the-request-from-the-operation
    - title: Spend one deadline across the whole request
      brief: Allocate an end-to-end deadline across admission, pool acquisition, statements, transaction
        completion and response delivery. Derive each stage's allowance from time remaining and reserve
        time for completion and recovery. Distinguish stopping synchronous waiting from proving that the
        operation has stopped; any accepted work allowed to outlive its caller needs a bounded lifecycle
        and a discoverable result.
      heading:
      - title: Establish what each timeout actually limits
        brief: Compare application waiting limits, driver timeouts and server-side statement or transaction
          limits for the selected database and driver. Verify their scope, when their clocks start, which
          error or completion evidence reaches the caller, and whether commit is covered. Do not infer
          rollback from a client timeout, cancellation request or connection loss. Treat cancellation
          delivery and a confirmed database response as different observations. Refer connection draining,
          reset and discard mechanics to the connection-lifecycle article; this article decides whether
          the logical operation may proceed or be repeated.
        anchor: establish-what-each-timeout-actually-limits
      - title: Keep retries inside the remaining budget
        brief: Include acquisition, execution and bounded backoff in one deadline and attempt budget.
          Use jitter and admission limits to avoid synchronised retry demand; stop when a useful attempt
          cannot fit. Identify one retry-owning layer and account for automatic driver or framework retries
          so attempts do not multiply invisibly. A caller deadline ending is a reason to stop waiting,
          not evidence that another attempt is safe.
        anchor: keep-retries-inside-the-remaining-budget
      anchor: spend-one-deadline-across-the-whole-request
    - title: Choose the next action from outcome evidence
      brief: Build a compact decision table from the chosen implementation's documented error codes and
        transaction state. Separate permanent request or constraint failures, confirmed aborts eligible
        for retry, and unknown outcomes needing operation lookup or reconciliation. Record whether work
        was sent, whether abort or commit was confirmed, and whether the connection remains usable under
        the sibling article's contract. A transient-looking network error alone does not establish retry
        safety.
      heading:
      - title: Repeat the complete logical transaction when required
        brief: Use a confirmed serialization failure or deadlock victim as a bounded example. Re-run all
          reads, decisions and writes that belong to the transaction using fresh transaction state, subject
          to the application's retry policy. Keep stable request intent and operation identity while recomputing
          decisions that depended on database state. Verify actual database and driver error semantics;
          do not assume every statement error aborts the whole transaction. Avoid replaying external calls
          inside the retry body and link their recovery to the external-work article.
        anchor: repeat-the-complete-logical-transaction-when-required
      anchor: choose-the-next-action-from-outcome-evidence
    - title: Make the operation identity part of the data contract
      brief: Develop one idempotent order-placement design whose duplicate attempts can return the same
        committed business result. Define which effects the contract covers and what the caller should
        do while the result is still unresolved. Explain why a key alone does not make an operation idempotent;
        correctness depends on scope, request equivalence, concurrent claims, atomic changes, retained
        results and expiry working together.
      heading:
      - title: Define the key and the request it identifies
        brief: Scope the unique key to the authenticated tenant or principal and operation kind, and require
          the caller to reuse it for the same logical operation. Preserve authorisation when looking up
          a result. Compare a canonical fingerprint of the meaningful request fields so a reused key with
          different intent fails explicitly. Decide which fields are excluded and how canonicalisation
          or API version changes affect equivalence. A new key starts a new operation and cannot resolve
          an unknown earlier attempt.
        anchor: define-the-key-and-the-request-it-identifies
      - title: Commit the claim, business change and result together
        brief: Sketch a minimal operation table with a scoped unique key, fingerprint, stable business
          identifier and retained result. Use one transaction for claiming the key, making the relational
          business changes and storing the result, so rollback removes them together and commit makes
          them discoverable together. Use a uniqueness constraint and the transaction branch's mechanisms
          to arbitrate concurrent attempts; avoid an application-side check followed by an unprotected
          insert. Walk through two overlapping requests with bounded conflict waiting, post-conflict lookup
          and fingerprint comparison. Verify the selected isolation level's visibility and conflict behaviour
          rather than assuming the losing attempt immediately sees a committed record.
        anchor: commit-the-claim-business-change-and-result-together
      - title: Return a retained result and define its lifetime
        brief: Retain the stable result or sufficient committed data to reconstruct the promised response,
          including expected business rejection results if the operation contract requires them. Distinguish
          that result from per-attempt diagnostics. Define how long callers may retry or query, how cleanup
          handles active or unresolved work, and what a late request means after expiry. Show that deleting
          the only duplicate evidence can allow an old operation to execute again; retain an identity
          or tombstone longer when the business rule needs it. Do not promise replay protection beyond
          the stated retention and key-reuse contract.
        anchor: return-a-retained-result-and-define-its-lifetime
      anchor: make-the-operation-identity-part-of-the-data-contract
    - title: Resolve an outcome that the caller did not receive
      brief: After a lost commit response, query by the same operation identity through an authoritative
        path with appropriate visibility. A matching committed record supplies the result; a conflicting
        fingerprint is a request error. A missing record is inconclusive while an earlier transaction
        may still be in flight or a replica may lag. Re-enter only through the same atomic claim protocol,
        or keep the operation unresolved until its status can be proved. Bound lookup and waiting attempts,
        expose a stable status identity when resolution outlives the synchronous request, and make unresolved
        cases discoverable for reconciliation. If separate durable pending claims are introduced, require
        an explicit recovery protocol before allowing takeover; an expired caller deadline or claim lease
        does not prove an old worker has stopped. Link external systems' unknown outcomes to the external-work
        article instead of extending the relational transaction's guarantee to them.
      anchor: resolve-an-outcome-that-the-caller-did-not-receive
    - title: Test the failure windows around commit
      brief: 'Specify a small acceptance exercise against the selected real database and driver: exhaust
        acquisition time; cancel during execution; force a confirmed retryable abort; cut the connection
        before and after commit; suppress the response after a known commit; and submit simultaneous requests
        with matching and conflicting fingerprints. Include a request whose first attempt outlives its
        caller and a late duplicate near retention expiry. Assert the number of committed business effects,
        retained results, bounded attempts and eventual resolution, alongside connection handling supplied
        by its owning article. Capture database evidence that distinguishes a confirmed commit from an
        injected network failure whose outcome remains unknown. Label diagrams and local fault models
        as illustrative; record implementation versions and the evidence actually observed, without claiming
        that a fault script proves every network or cancellation interleaving.'
      anchor: test-the-failure-windows-around-commit
- id: a23
  href: /review/relational-next/background-work/
  article:
    topic: Relational background work and external effects
    title: Connecting transactions to background work and events
    brief: Make work beyond a relational transaction discoverable and recoverable. Follow one committed
      order and its external fulfilment request through a transactional job or outbox record, worker ownership,
      repeated attempts and uncertain external outcomes. Compare direct calls and database change capture
      by their remaining failure windows. Bound event contracts, ordering, retention and replay to what
      is needed to account for committed intent; reuse transaction concurrency and request-idempotency
      mechanisms rather than deriving them again.
    heading:
    - title: Find the gap between committing and doing the work
      brief: Start with an order whose database change and external fulfilment call must both happen.
        Trace a call before commit, a call after commit and a call held inside an open transaction through
        database failure, process death and a lost response. Separate the evidence that the database committed,
        that an external system accepted the operation and that its outcome is known. Establish which
        synchronous calls can tolerate their failure contract and when durable unfinished work is necessary.
        Link to request recovery for the caller's unknown transaction outcome and retry contract.
      anchor: find-the-gap-between-committing-and-doing-the-work
    - title: Commit the business change and the intent together
      brief: 'Use one order example throughout: create the order and a durable work record in the same
        transaction. Give the work a stable operation identity and sufficient immutable input or an explicit
        rule for reading later state. Explain why enqueueing elsewhere after commit leaves a gap, and
        why a database job record or transactional outbox closes that particular gap without completing
        the external effect. Distinguish a job that a worker executes from an event that describes an
        agreed business fact, while retaining the same atomic-intent mechanism. Define the application
        response as accepted or pending when external completion is still outstanding.'
      anchor: commit-the-business-change-and-the-intent-together
    - title: Claim work without keeping a transaction open during the call
      brief: 'Define pending, claimed, completed and failed or unresolved states using ownership, attempt
        identity, lease expiry, next-attempt time and recorded outcome. Show a short atomic claim transaction,
        an external call after the claim commits and a conditional completion transaction. Reuse the transaction
        branch''s locking or conditional-update mechanisms; verify the selected engine''s claim and competing-worker
        behaviour. Recover abandoned claims after worker death, and reject completion from an obsolete
        attempt. Explain that a lease can expire while an old worker is still executing: database ownership
        protects database transitions but cannot by itself stop an external effect. Keep retry attempts
        bounded and discoverable, with a deliberate route for permanent failures and manual reconciliation.'
      anchor: claim-work-without-keeping-a-transaction-open-during-the-call
    - title: Make repeated attempts refer to the same operation
      brief: Follow external success followed by worker death before completion is recorded. Reuse the
        stable operation identity across delivery attempts and distinguish it from each claim's attempt
        identity. Check the receiver's deduplication scope, request matching, retained outcome and expiry
        contract; link to the request-recovery article for implementing atomic idempotency records. Where
        the receiver cannot suppress repeats, choose authoritative outcome lookup, reconciliation, an
        acceptable repeated effect or an explicitly unresolved state according to the business operation.
        Do not describe a completed work record, lease or transport acknowledgement as proof that an external
        effect occurred only once.
      anchor: make-repeated-attempts-refer-to-the-same-operation
    - title: Give published records a meaning that survives delay
      brief: For an outbox publisher, define the event identity, business meaning, payload owner and compatibility
        obligation before treating a row change as an integration contract. Contrast an immutable event
        fact with a pointer to current state, showing how delayed publication changes what a receiver
        can reconstruct. Introduce an order version only when a business rule requires per-order sequence
        or stale-event detection; check whether concurrent workers and retries preserve that required
        scope. Keep global ordering and broker behaviour outside the article. Retain source records, payload
        versions and deduplication evidence for the promised recovery and replay interval, including how
        replay can repeat external effects.
      anchor: give-published-records-a-meaning-that-survives-delay
    - title: Compare polling with database change capture
      brief: 'Compare polling the same outbox with capturing its committed changes, and contrast both
        with publishing raw application-table changes. Keep the comparison to the relational application''s
        contract: which committed changes are visible, how initial capture joins ongoing changes, what
        a saved source position establishes and what duplicates can follow restart. Require implementation-specific
        verification of snapshot boundaries, transaction visibility, schema changes, position persistence
        and source-log retention. Explain why capture moves the publication mechanism without making external
        outcomes atomic with the original transaction. Do not expand into capture connector administration
        or messaging internals.'
      anchor: compare-polling-with-database-change-capture
    - title: Recover the unfinished order from retained evidence
      brief: Close the worked case by locating an unclaimed record, an expired claim, an external success
        with no recorded completion and a publisher that has stopped advancing. Relate work age, attempts,
        recorded outcomes and source position to the next safe action. For lost downstream progress, establish
        whether retained outbox records or captured changes can reproduce the required work within the
        receiver's duplicate-handling contract; when the history has expired, reconcile authoritative
        database state or rebuild the required projection under a defined boundary. Leave general consumer
        and broker recovery to their owners. Specify failure-injection observations around commit, claim,
        external acceptance, completion and publication, and label illustrative timelines separately from
        evidence obtained with the chosen database, worker and receiver.
      anchor: recover-the-unfinished-order-from-retained-evidence
scope_boundary: 'Use the actual parent, sibling and child plans: teach a useful high-level answer here,
  introduce deeper questions in context, and leave their detailed mechanisms/procedures with the owning
  child. Do not duplicate a sibling. A parent must still teach a complete useful first case, not just
  advertise links.'
