topic: Relational service monitoring and capacity
title: Monitoring and sizing a relational service
brief: >-
  Teach practitioners to connect service objectives to useful database and infrastructure
  signals, investigate changes against workload and deployment history, and budget capacity
  for normal operation, failover, maintenance and recovery. Build actionable alerts and
  validate operating limits with representative load and measured recovery evidence. Use
  the evidence to choose whether to reduce work, change a limit, add resources or change
  topology. Link to performance for query diagnosis and benchmark methods, integration
  for pool implementation, and the neighbouring operational articles for maintenance,
  replication and restoration procedures.
heading:
  - title: Start with the service the application needs
    brief: >-
      Define the important operations, expected traffic, availability and latency objectives,
      and recovery requirements. Carry one example workload through a service dashboard and
      capacity budget. Distinguish an application operation, a database request and a
      transaction so that success rates, retries and throughput have explicit denominators.
    heading:
      - title: Measure outcomes at the right boundary
        brief: >-
          Measure application outcomes alongside database availability, request latency,
          errors and completed work. Show how waiting before a request reaches the engine
          can be absent from engine timings. Separate successful work from rejected,
          aborted and uncertain outcomes, linking transaction and integration explanations
          for their handling. Use representative operation classes and tail latency rather
          than a service-wide average alone.
      - title: Know what the deployment exposes
        brief: >-
          Inventory engine views, host or container metrics, service-provider metrics,
          application instrumentation and external checks. Record collection intervals,
          permissions, overhead and missing visibility. For a managed service, identify
          which limits and maintenance actions the operator can observe or change and
          which require the provider.
  - title: Build a small set of signals that explains pressure
    brief: >-
      Connect completed work, latency, errors and queues to the resources or dependencies
      that constrain the service. Select signals because they support a decision, and keep
      workload and deployment annotations beside their time series.
    heading:
      - title: Read rates, distributions and waiting together
        brief: >-
          Distinguish cumulative counters from gauges; calculate rates over named windows
          and account for resets and missing samples. Compare like operation classes and
          periods. Interpret latency distributions, active work, queued work, waiting
          connections and transaction age together. Explain why low completed throughput
          can accompany overload and why high utilisation alone does not identify a fault.
      - title: Follow pressure to an operating constraint
        brief: >-
          Relate CPU, memory, storage space, storage latency and throughput, connection
          limits, lock waits, retained versions, transaction-log growth and replica lag
          to symptoms at the service boundary. Check the chosen engine and provider's
          definitions, resource caps and units. Link performance's mechanisms for detailed
          diagnosis and neighbouring operations articles for upkeep and replication.
  - title: Investigate a change against its history
    brief: >-
      Walk through a latency regression using a timeline of traffic, operation mix, data
      growth, deployments, configuration changes and scheduled work. Locate the first
      changed signals, distinguish correlation from an established cause, and compare
      competing explanations with bounded checks. Preserve useful evidence before
      restarting or changing limits. Hand query-level investigation to performance and
      incident containment and recovery selection to the parent article.
  - title: Account for everything that needs space
    brief: >-
      Build an explicit capacity worksheet with measured starting sizes, growth assumptions,
      retention periods and uncertainty. Separate local engine storage, remote retained
      copies and provider quotas; avoid counting the same physical allocation twice.
    heading:
      - title: Estimate steady growth and retained data
        brief: >-
          Budget table data, indexes, engine overhead, retained row versions, transaction
          logs and backups using the selected engine's measurements and retention rules.
          Include replica or recovery consumers that can delay log removal, and account
          for independent backup copies in their own storage domain. Estimate growth
          from observed bytes and workload changes rather than row counts alone.
      - title: Reserve temporary space and time to respond
        brief: >-
          Add peak temporary work, bulk ingestion, index or table rebuilds, upgrades and
          restore staging according to their documented procedures. Estimate time to a
          hard limit under plausible growth scenarios and compare it with detection,
          provisioning and intervention lead times. Distinguish reserved capacity from
          immediately usable space and include service quotas and expansion constraints.
  - title: Size for the work the service must survive
    brief: >-
      Estimate compute, memory, I/O and connection needs from measured workload demand,
      concurrency and operating limits. Use performance's representative load methods
      to find the tested service envelope without presenting a universal sizing ratio.
      Distinguish sustainable capacity, short bursts and queue accumulation.
    heading:
      - title: Budget normal, failover and maintenance conditions separately
        brief: >-
          Compare ordinary peaks with degraded capacity after a failure, promoted-writer
          load, replica catch-up, backup or restore work and maintenance overlap. Identify
          which scenarios must meet the usual objectives and which have agreed reduced
          service. Choose explicit headroom from those cases and provisioning delays,
          including provider resource and topology restrictions.
      - title: Check the envelope with representative evidence
        brief: >-
          Specify the data size, operation mix, concurrency, cache state, background work
          and duration needed to validate the budget. Inspect latency, errors, queues and
          resource pressure together, including behaviour as a limit is approached. Reuse
          bounded failover and restore rehearsals from their owning articles to measure
          degraded capacity and recovery time; record assumptions, stop conditions and
          results rather than treating an estimate as a guarantee.
  - title: Make alerts lead to an action
    brief: >-
      Derive urgent alerts from sustained user impact, rapid consumption of the allowed
      failure budget or imminent loss of required capacity. Use longer-horizon growth and
      upkeep signals for scheduled action. Give every alert an owner, relevant evidence,
      a response deadline and a linked procedure. Balance detection time against noise,
      handle missing telemetry explicitly, and verify delivery and response with bounded
      tests. Set thresholds from the service's objectives and intervention lead times.
  - title: Choose an intervention and prove it helped
    brief: >-
      Work through an evidence-based choice among reducing incoming or background work,
      changing a documented limit, increasing a constrained resource and changing topology.
      Explain what observation would support each choice and what could invalidate it;
      raising a connection limit, for example, requires evidence that downstream capacity
      can serve the added concurrency. Delegate query changes to performance and topology
      procedures to their owner. Define success, a rollback trigger and an observation
      window before the change, then check application outcomes and the capacity budget
      under comparable load. Update the forecast and repeat validation after material
      workload, data, engine or deployment changes.
