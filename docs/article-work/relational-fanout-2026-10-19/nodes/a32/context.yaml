original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Adopting SQLite for an application
  title: Checking an embedded choice with SQLite
  brief: Teach the implementation knowledge needed to decide whether and how to adopt SQLite for
    a concrete application. Trace connections and transactions to file ownership and writer coordination;
    verify journal modes, busy handling, reader lifetimes, durability settings and filesystem assumptions
    against the intended deployment. Check typing, constraints, connection settings and required
    SQL behaviour with small examples. Establish safe backup, restore and deployment checks, and
    test representative contention and failure cases. Link general transaction, integration, performance
    and recovery methods rather than repeat them; stop at a defensible adoption decision rather than
    an SQLite internals curriculum.
parent:
  topic: Choosing relational systems and deployments
  title: Choosing a relational database
  brief: Teach how to select and validate a relational engine and deployment for a concrete application.
    Turn workload, correctness, latency, availability, locality, operational capacity and total cost
    into explicit requirements and rejection tests. Compare representative embedded, server and distributed
    relational choices through the mechanisms that change those tests, including managed service
    restrictions and responsibilities. Finish with a realistic evaluation and a documented adoption
    decision. Use neighbouring storage families only to establish suitability; use implementation
    follow-ups to check a candidate's actual contract rather than to build a vendor catalogue.
  introducing_heading: When the database lives with the application
neighbouring_articles:
- topic: Adopting PostgreSQL for an application
  title: Checking a server choice with PostgreSQL
  brief: Teach the concrete implementation checks needed to adopt PostgreSQL and select a suitable
    deployment. Connect the server's process, connection, transaction, version-retention and durability
    behaviour to application and operational requirements, deepening mechanisms only where they change
    adoption. Verify required SQL, types, constraints, driver behaviour and extension support. Compare
    self-managed and managed candidates through configuration access, pooling, maintenance, upgrades,
    replication, backup and restore contracts. Produce a verified starting configuration and acceptance
    evidence for the chosen version and service; refer to the neighbouring articles for detailed
    design, tuning, migrations and recovery work.
- topic: Adopting a distributed relational system with CockroachDB
  title: Checking a distributed choice with CockroachDB
  brief: Teach the concrete checks needed to decide whether CockroachDB meets an application's distributed
    relational requirements. Connect data and replica placement, transaction coordination, contention,
    locality and node or region loss to observed latency and correctness tests. Verify SQL and protocol
    compatibility, supported constraints and data types, retry and ambiguous-outcome behaviour, schema-change
    facilities and deployment limits against the intended version and service tier. Establish a minimal
    topology, acceptance workload and recovery evidence, accounting for resource and network cost.
    Use the common transaction, integration, evolution and operations branches for their methods;
    teach distributed mechanisms only where they enable an adoption decision or explain a failed
    test.
boundary_notes:
- Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
  integration owns request retries, idempotency, deadlines and reconciliation. Link rather than repeat.
- Performance owns query/workload work and intervention validation; operations owns service signals,
  budgets, maintenance procedures and recovery. Link shared mechanisms.
