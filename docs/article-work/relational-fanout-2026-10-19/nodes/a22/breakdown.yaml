topic: Relational request deadlines, retries and idempotency
title: Recovering database requests safely
brief: >-
  Design a bounded application request across pool acquisition, statements,
  transaction completion and response delivery. Decide what may be repeated from
  evidence about the database outcome, then give a logical operation a durable
  identity so overlapping attempts and lost responses can be resolved safely.
  Keep deadline budgets, retry eligibility, idempotency records and reconciliation
  within one operation contract. Build on the transaction branch's guarantees;
  link connection cleanup mechanics and external-effect recovery to their owners.
heading:
  - title: Separate the request from the operation
    brief: >-
      Reuse the parent's order-placement example after its ordinary successful
      path. Give the logical order operation a stable identity and distinguish
      it from each transport request and database transaction attempt. Follow
      one lost response through three possible histories: no transaction began,
      the transaction aborted, or the order committed without the caller learning
      its result. Use an explicitly illustrative timeline to establish what each
      observer knows. Link the transaction branch for the underlying commit and
      abort guarantees rather than deriving its concurrency theory again.
  - title: Spend one deadline across the whole request
    brief: >-
      Allocate an end-to-end deadline across admission, pool acquisition,
      statements, transaction completion and response delivery. Derive each
      stage's allowance from time remaining and reserve time for completion and
      recovery. Distinguish stopping synchronous waiting from proving that the
      operation has stopped; any accepted work allowed to outlive its caller
      needs a bounded lifecycle and a discoverable result.
    heading:
      - title: Establish what each timeout actually limits
        brief: >-
          Compare application waiting limits, driver timeouts and server-side
          statement or transaction limits for the selected database and driver.
          Verify their scope, when their clocks start, which error or completion
          evidence reaches the caller, and whether commit is covered. Do not
          infer rollback from a client timeout, cancellation request or connection
          loss. Treat cancellation delivery and a confirmed database response as
          different observations. Refer connection draining, reset and discard
          mechanics to the connection-lifecycle article; this article decides
          whether the logical operation may proceed or be repeated.
      - title: Keep retries inside the remaining budget
        brief: >-
          Include acquisition, execution and bounded backoff in one deadline and
          attempt budget. Use jitter and admission limits to avoid synchronised
          retry demand; stop when a useful attempt cannot fit. Identify one
          retry-owning layer and account for automatic driver or framework
          retries so attempts do not multiply invisibly. A caller deadline ending
          is a reason to stop waiting, not evidence that another attempt is safe.
  - title: Choose the next action from outcome evidence
    brief: >-
      Build a compact decision table from the chosen implementation's documented
      error codes and transaction state. Separate permanent request or constraint
      failures, confirmed aborts eligible for retry, and unknown outcomes needing
      operation lookup or reconciliation. Record whether work was sent, whether
      abort or commit was confirmed, and whether the connection remains usable
      under the sibling article's contract. A transient-looking network error
      alone does not establish retry safety.
    heading:
      - title: Repeat the complete logical transaction when required
        brief: >-
          Use a confirmed serialization failure or deadlock victim as a bounded
          example. Re-run all reads, decisions and writes that belong to the
          transaction using fresh transaction state, subject to the application's
          retry policy. Keep stable request intent and operation identity while
          recomputing decisions that depended on database state. Verify actual
          database and driver error semantics; do not assume every statement
          error aborts the whole transaction. Avoid replaying external calls
          inside the retry body and link their recovery to the external-work
          article.
  - title: Make the operation identity part of the data contract
    brief: >-
      Develop one idempotent order-placement design whose duplicate attempts can
      return the same committed business result. Define which effects the
      contract covers and what the caller should do while the result is still
      unresolved. Explain why a key alone does not make an operation idempotent;
      correctness depends on scope, request equivalence, concurrent claims,
      atomic changes, retained results and expiry working together.
    heading:
      - title: Define the key and the request it identifies
        brief: >-
          Scope the unique key to the authenticated tenant or principal and
          operation kind, and require the caller to reuse it for the same logical
          operation. Preserve authorisation when looking up a result. Compare a
          canonical fingerprint of the meaningful request fields so a reused key
          with different intent fails explicitly. Decide which fields are
          excluded and how canonicalisation or API version changes affect
          equivalence. A new key starts a new operation and cannot resolve an
          unknown earlier attempt.
      - title: Commit the claim, business change and result together
        brief: >-
          Sketch a minimal operation table with a scoped unique key, fingerprint,
          stable business identifier and retained result. Use one transaction
          for claiming the key, making the relational business changes and
          storing the result, so rollback removes them together and commit makes
          them discoverable together. Use a uniqueness constraint and the
          transaction branch's mechanisms to arbitrate concurrent attempts;
          avoid an application-side check followed by an unprotected insert.
          Walk through two overlapping requests with bounded conflict waiting,
          post-conflict lookup and fingerprint comparison. Verify the selected
          isolation level's visibility and conflict behaviour rather than
          assuming the losing attempt immediately sees a committed record.
      - title: Return a retained result and define its lifetime
        brief: >-
          Retain the stable result or sufficient committed data to reconstruct
          the promised response, including expected business rejection results
          if the operation contract requires them. Distinguish that result from
          per-attempt diagnostics. Define how long callers may retry or query,
          how cleanup handles active or unresolved work, and what a late request
          means after expiry. Show that deleting the only duplicate evidence
          can allow an old operation to execute again; retain an identity or
          tombstone longer when the business rule needs it. Do not promise
          replay protection beyond the stated retention and key-reuse contract.
  - title: Resolve an outcome that the caller did not receive
    brief: >-
      After a lost commit response, query by the same operation identity through
      an authoritative path with appropriate visibility. A matching committed
      record supplies the result; a conflicting fingerprint is a request error.
      A missing record is inconclusive while an earlier transaction may still be
      in flight or a replica may lag. Re-enter only through the same atomic claim
      protocol, or keep the operation unresolved until its status can be proved.
      Bound lookup and waiting attempts, expose a stable status identity when
      resolution outlives the synchronous request, and make unresolved cases
      discoverable for reconciliation. If separate durable pending claims are
      introduced, require an explicit recovery protocol before allowing takeover;
      an expired caller deadline or claim lease does not prove an old worker has
      stopped. Link external systems' unknown outcomes to the external-work
      article instead of extending the relational transaction's guarantee to them.
  - title: Test the failure windows around commit
    brief: >-
      Specify a small acceptance exercise against the selected real database and
      driver: exhaust acquisition time; cancel during execution; force a confirmed
      retryable abort; cut the connection before and after commit; suppress the
      response after a known commit; and submit simultaneous requests with matching
      and conflicting fingerprints. Include a request whose first attempt outlives
      its caller and a late duplicate near retention expiry. Assert the number of
      committed business effects, retained results, bounded attempts and eventual
      resolution, alongside connection handling supplied by its owning article.
      Capture database evidence that distinguishes a confirmed commit from an
      injected network failure whose outcome remains unknown. Label diagrams and
      local fault models as illustrative; record implementation versions and the
      evidence actually observed, without claiming that a fault script proves
      every network or cancellation interleaving.
