original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational normalisation and deliberate redundancy
  title: Normalisation and deliberate redundancy
  brief: Develop the dependency reasoning needed to recognise mixed facts and split tables without
    losing relationships or introducing spurious combinations. Use practical examples of candidate
    keys, partial and transitive dependencies and independent multivalued facts; introduce formal
    terms only where they make a design decision clearer. Compare normalised source data with cached
    totals, repeated attributes, summary tables and materialised results. Require a stated source
    of truth, freshness requirement, update ownership, concurrency strategy and repair or rebuild
    path for derived copies. Decide whether measured read benefits justify write and maintenance
    costs, using the performance and transaction branches for their detailed validation.
parent:
  topic: Relational data design
  title: Designing relational data
  brief: Teach an engineer to translate application facts, rules and access needs into a relational
    schema. Follow a booking application from ordinary requirements to tables, identities, relationships,
    value representations and enforceable rules, exposing the failures each decision prevents. Establish
    a practical account of normalisation and controlled redundancy, then account for history and
    deletion. Test the design with representative reads, changes and lifecycle scenarios. Develop
    specialised modelling only where it changes these relational decisions; leave query fluency,
    transaction protocols and live migration procedures to their neighbouring articles.
  introducing_heading: Store each fact where it belongs
neighbouring_articles:
  - topic: Relational value representation
    title: Choosing types and representing missing values
    brief: Teach how to choose relational value representations from the meaning and operations of
      the data. Cover exact and approximate numbers, quantities and money, identifiers, text comparison
      and collation, dates, instants, local schedules and time zones, with concrete failure cases
      and selected engine differences. Explain null, defaults, empty values and explicit state models;
      connect their design consequences to comparison, uniqueness and required fields without reteaching
      SQL expressions. Decide when arrays, JSON, binary values, separate related rows or external
      payloads preserve the required validation, queries and evolution. Keep semi-structured values
      bounded by their ownership and consistency rules, rather than teaching a separate document
      database curriculum.
  - topic: Relational schema invariants
    title: Expressing rules with constraints
    brief: Teach how to translate application invariants into database constraints and identify what
      remains outside their scope. Work through required values, candidate keys, composite references,
      conditional uniqueness, mutually dependent rows and non-overlapping reservations, checking
      the selected engine's null, timing and constraint capabilities. Explain when to reshape the
      data so a rule becomes enforceable, and the tradeoffs of triggers or transaction protocols
      when a declarative rule is unavailable. Examine update and deletion actions, including why
      cascading may remove more than the business rule intends. Supply valid and invalid change cases
      and identify concurrency tests to take to the transactions article. Leave transaction anomaly
      analysis and adding constraints to an existing live database to their owning branches.
  - topic: Relational history and data lifecycle design
    title: Modelling history and data lifecycles
    brief: Teach how to choose among current-state rows, immutable snapshots, change records and
      effective-dated versions for concrete relational requirements. Distinguish when a fact applied
      from when the database recorded it, and introduce both dimensions only when late information
      and corrections require them. Design version identity, relationships to historical entities,
      interval boundaries and overlap rules so point-in-time questions have a defined answer. Compare
      status changes, tombstones, archival and deletion through their effects on references, uniqueness,
      reporting, retention and erasure. Explain the limits of history rows as audit evidence and
      of deletion from live tables as removal from replicas, exports and backups; refer operational
      procedures and live lifecycle changes to their owning branches.
boundary_notes:
  - Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
    integration owns request retries, idempotency, deadlines and reconciliation. Link rather than
    repeat.
  - Performance owns query/workload work and intervention validation; operations owns service signals,
    budgets, maintenance procedures and recovery. Link shared mechanisms.
