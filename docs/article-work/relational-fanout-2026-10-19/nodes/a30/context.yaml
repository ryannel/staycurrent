original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational backfills, imports and corrections
  title: Running reliable data changes
  brief: Teach how to design and operate resumable, idempotent data jobs for backfills, external
    imports and production corrections. Start with an explicit transformation, source identity, invariants
    and treatment of invalid or duplicate records. Use staging where it enables validation before
    changing live rows. Develop batch boundaries and checkpoints that do not silently omit moving
    data, conditional updates or another verified concurrency protocol, and safe recovery after an
    uncertain batch outcome. Handle dependencies, triggers, generated values, referential order and
    application side effects. Bound locks, transaction size, logging and replica lag; throttle using
    observed workload impact. Reconcile source and destination with checks that expose missing, duplicate
    and semantically incorrect data, then record completion and cleanup. Link request retry and transaction
    theory rather than rebuild them here.
parent:
  topic: Relational schema and data evolution
  title: Changing a live database
  brief: Teach engineers to change schemas, stored data and database locations while applications
    continue to run. Use a change to an order system to connect application compatibility, physical
    database work, concurrent writes, verification and recovery. Give every change an explicit sequence,
    measurable completion conditions and a safe response to interruption. Introduce deeper procedures
    for schema changes, data jobs and database moves only where they enable reliable relational practice.
    Treat retention and deletion as changes to the guarantees readers and recovery procedures can
    rely on. Check concrete procedures against the selected engine, version and deployment.
  introducing_heading: Move existing data while writes continue
neighbouring_articles:
- topic: Safe relational schema changes
  title: Changing schemas without breaking applications
  brief: Develop executable schema-change procedures for representative column, type, constraint,
    index and table changes on a selected relational engine. Follow lock acquisition and queued work,
    scans and physical rewrites, dependencies and replication effects. Work through staged validation
    of a new constraint and a large structural change, including concurrent writes, failed or partially
    completed operations and cleanup. Verify transaction boundaries, online-operation restrictions
    and tool behaviour against the engine and version. Rehearse with realistic data and concurrency,
    choose timeouts and cancellation conditions, and define evidence for completion. Keep specialist
    engine internals subordinate to selecting and executing a safe change.
- topic: Moving a relational database
  title: Moving databases with a controlled cutover
  brief: Teach how to move a relational workload between instances, deployments or engines using
    a tested copy, change-capture and cutover procedure, or a simpler bounded write pause when appropriate.
    Assess schema, type, collation, time, identity, sequence, extension and query-semantic compatibility
    where these affect the actual move. Establish a consistent starting copy, an explicit boundary
    for subsequent changes, and verified handling of DDL and replication limitations. Reconcile data
    and rehearse application behaviour, capacity and permissions. Define write authority, drain or
    fence writers, handle connection pools and delayed jobs, and prove that the final change boundary
    has arrived before enabling destination writes. Set cutover and abort gates; explain why accepting
    new writes can make a return to the source require reverse synchronisation or another migration.
    Keep steady-state replication, failover and backup administration in the operations branch.
boundary_notes:
- Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
  integration owns request retries, idempotency, deadlines and reconciliation. Link rather than repeat.
- Performance owns query/workload work and intervention validation; operations owns service signals,
  budgets, maintenance procedures and recovery. Link shared mechanisms.
