topic: Reading and diagnosing relational execution plans
title: Following a query through its execution plan
brief: >-
  Teach readers to collect and interpret estimated and observed PostgreSQL plans,
  following one shared reporting query from SQL to physical work. Make execution
  effects, reporting units and evidence limits explicit before diagnosing repeated
  work, large intermediates, filtering and spills. Turn a supported observation
  into a correctness-preserving intervention to test. Share the worked case with
  Explaining and correcting plan choices: this article owns collecting and reading
  evidence, and hands off the first consequential estimate/observation mismatch
  for statistics and parameter diagnosis. Link index design, storage mechanisms,
  concurrent-load investigation and the parent's comparison method rather than
  teaching them again. Use a documented PostgreSQL version and distinguish captured
  execution from illustrative plans throughout.
heading:
  - title: Start with the query and the work it must return
    brief: >-
      Establish a compact reporting case joining customers, orders and order lines,
      filtering a dated interval and region, grouping totals and returning a sorted
      limited result. State duplicate, null, ordering and tie behaviour so later
      rewrites have a correctness contract. Give the schema, relevant indexes,
      representative parameter values and data distribution once, in a shared case
      record reused by the optimiser article. Show SQL, a small expected result and
      a plan together; explain that a plan describes chosen physical operations,
      not the order in which SQL clauses are written.
  - title: Choose what evidence it is safe to collect
    brief: >-
      Separate an estimated EXPLAIN from EXPLAIN ANALYZE, which executes the
      statement and adds observations. Demonstrate an appropriate PostgreSQL
      EXPLAIN invocation with ANALYZE and BUFFERS on an isolated copy, explaining
      the effect of TIMING and optional I/O timing. Warn before execution about
      writes, triggers or effectful functions, locks, resource consumption and
      sensitive captured values. Explain why a wrapping rollback does not undo
      every possible side effect, such as sequence advancement or external work;
      use disposable data for effectful examples. Record server version, settings,
      parameters and whether evidence is captured or illustrative. Link production
      collection procedures to operations rather than inventing an incident runbook.
  - title: Follow rows through the plan tree
    brief: >-
      Read indentation and parent-child relationships as data dependencies while
      explaining demand from consumers, blocking work and early termination.
      Follow sequential, index, index-only and bitmap access paths far enough to
      interpret Index Cond, Filter, Recheck Cond, rows removed and heap fetches in
      the selected engine's output. Contrast returned rows with visited candidates
      and base-row work; explain when LIMIT or another consumer stops a child
      before completion. Link coverage, visibility and page-locality mechanisms to
      their index and physical-storage owners. Do not turn this into access-path
      eligibility or index-design instruction.
  - title: Recognise how joins turn input rows into work
    brief: >-
      Trace nested-loop, hash and merge joins through small annotated fragments of
      the shared case, using labelled illustrative alternatives where necessary.
      Identify outer and inner inputs, repeated probes, hash build and probe work,
      and required ordering for merge joins. Preserve the SQL join's result contract
      while showing how many intermediate rows each physical choice can produce.
      Read join conditions separately from later join filters and spot repeated
      inner work or a large intermediate reduced only much later. Teach only the
      mechanism needed to understand the evidence; join-order search and why the
      optimiser chose a method belong to the neighbouring optimiser article.
  - title: Find work that must accumulate, remember or spill
    brief: >-
      Follow sorts and grouped or hashed aggregation in the report, distinguishing
      streaming from blocking behaviour and any reported top-N optimisation.
      Interpret Sort Method, reported memory or disk use, hash batches and temporary
      block evidence according to the selected version's documentation. Explain
      Materialize as replaying saved input and Memoize as parameter-keyed reuse
      when those nodes appear, using loops, hits and misses to see whether repeated
      work is avoided. Connect a spill to the operation and its inputs; do not infer
      a safe global memory increase from one node's report. Leave service-wide
      memory competition and concurrency limits to the workload article.
  - title: Read the numbers in their own units
    brief: >-
      Annotate the captured plan's estimated startup and total cost, estimated rows
      and width, then actual startup and total time, rows and loops. State
      PostgreSQL's averaging and rounding conventions and multiply per-loop rows
      by loops only where the displayed semantics support that calculation.
      Distinguish estimate units from milliseconds, inclusive node timings from
      exclusive work, and startup time from completion time. Never sum node times
      or buffers across a tree with inclusive reporting. Explain shared buffer
      hits, reads, dirtied and written blocks, local and temporary blocks, and
      optional I/O timing without equating a PostgreSQL buffer read with a physical
      device read. Distinguish planning time, executor time and application-observed
      latency; explain instrumentation overhead and the interpretation limits when
      per-node timing is disabled.
  - title: Account for parallel and incomplete execution
    brief: >-
      Read Gather or Gather Merge, workers planned and launched, worker detail and
      leader participation in a small parallel variant of the case. Explain the
      selected version's aggregate versus per-worker reporting before comparing
      counts or timings. Show why overlapping worker intervals and inclusive node
      times cannot be added into elapsed time or attributed as exclusive CPU time.
      Recognise never-executed nodes, varying loop counts and partially consumed
      inputs; an estimate/actual mismatch after early termination is not by itself
      proof of bad statistics. Link workload-level parallelism decisions to the
      concurrency article.
  - title: Turn a plan observation into a testable change
    brief: >-
      Finish the shared case with a short evidence ledger: observation, supported
      explanation, uncertainty and proposed intervention. Prioritise consequential
      repeated work, late filtering, excessive intermediate rows or spilling rather
      than the visually largest number. Locate the earliest meaningful
      estimate/observation mismatch on a sufficiently consumed input and hand its
      statistics or parameter explanation to Explaining and correcting plan
      choices. For an observed-work problem, choose one query-shape or candidate
      access-path experiment, preserving duplicate, null, ordering and limit
      semantics. Compare the resulting work using the parent's common measurement
      method and link index or resource costs to their owners. End with a compact
      plan-reading exercise whose answer separates demonstrated work from hypotheses
      that require another measurement.
