topic: Relational application integration
title: Building applications around a relational database
brief: >-
  Follow an application request through its driver, connection, statements and
  transaction to the response and any external effects. Teach how to preserve
  values and authority at those boundaries, understand the SQL an abstraction
  performs, bound resource use and recover from failures with evidence about
  what completed. Build on the transaction article's correctness guarantees;
  deepen connection management, query composition, request recovery and external
  work only where their separate decisions need it.
heading:
  - title: Follow one request across the boundaries
    brief: >-
      Trace an order placement from validated input through connection acquisition,
      bound statements, transaction completion and response delivery. Identify
      which component owns each step and where a successful database operation
      can outlive the request that started it. Use an explicitly illustrative
      timeline to distinguish application progress from evidence of database
      completion. Link to the transaction branch for atomicity, isolation and
      durability rather than deriving those guarantees again.
  - title: Preserve values and authority when sending SQL
    brief: >-
      Establish the driver as a boundary with an explicit conversion contract and
      an explicit database identity. Show how a plausible value or apparently
      safe query can change meaning before it reaches the database.
    heading:
      - title: Bind values and check their round trip
        brief: >-
          Explain parameter binding with a small query and distinguish values
          from SQL structure. Inspect the selected driver's handling of large
          integers, exact decimals, nulls, dates, timestamps and time zones;
          choose representations deliberately and test representative round
          trips. Make conversion and truncation failures visible. Treat prepared
          statement reuse and parameter syntax as implementation behaviour to
          verify, without turning this into a protocol catalogue.
      - title: Keep untrusted input out of SQL structure
        brief: >-
          Teach parameterised statements for values, allowlisted choices and
          supported identifier quoting for dynamic identifiers or sort clauses,
          and scrutiny of raw-query escape hatches. Distinguish input validation
          from injection prevention. Include ORM-generated and stored-routine
          calls in the same boundary reasoning rather than treating their names
          as guarantees of safety.
      - title: Give each application action the authority it needs
        brief: >-
          Separate authenticated application identity, database credentials and
          row-level authorisation. Show where tenant predicates or verified
          database policies must apply to reads and changes, including background
          jobs and raw queries. Keep administrative and migration authority out
          of ordinary request paths, and prevent sensitive values leaking into
          query logs. Link service credential, encryption and policy operation
          details to the operations branch.
  - title: Borrow a connection for bounded work
    brief: >-
      Establish that connections carry state and that a transaction must use the
      connection or transaction handle required by the driver. Keep user think
      time and unrelated network work outside its lifetime. Show acquisition,
      commit or rollback, result cleanup and release on success and error paths,
      with failed connections discarded according to the driver contract. Explain
      how long occupancy turns application concurrency into pool queues before
      introducing the focused diagnosis.
    nested_article:
      topic: Relational connection and transaction lifecycle management
      title: Managing connections and transaction lifetimes
      brief: >-
        Teach how to acquire, use, clean up and release stateful database
        connections safely across request success, exceptions, cancellation and
        shutdown. Verify transaction-handle affinity, autocommit, session state,
        prepared statement and cursor lifetimes against the selected driver and
        any connection proxy or pooler. Diagnose leaks, idle transactions, slow
        consumers, stale connections and pool exhaustion using acquisition wait,
        occupancy, active database work and connection counts. Set bounded
        admission and acquisition limits; budget pools across application
        instances and background workers against database capacity rather than
        assuming a larger pool is faster. Cover streaming-result cleanup and
        reset or discard decisions without reteaching isolation or service
        capacity planning.
  - title: Make the abstraction's database work visible
    brief: >-
      Compare an explicit query with an ORM operation that appears equivalent.
      Count statements, round trips, returned rows and materialised objects;
      identify implicit reads or writes and transaction boundaries. Establish
      that object convenience does not remove the need to understand the SQL
      and its result semantics. Link execution-plan diagnosis to the performance
      branch after identifying the application operation that generated the work.
    nested_article:
      topic: Relational query composition and ORM behaviour
      title: Controlling the queries your application performs
      brief: >-
        Teach how to inspect and shape database work produced by handwritten SQL,
        query builders and ORMs. Diagnose N+1 reads, lazy loading, eager-loading
        row multiplication, implicit flushes and accidental transaction changes
        with captured statements and bounded examples. Choose projections,
        loading strategies, batching, pagination and streaming according to the
        access need, result semantics, round trips and memory limits. Preserve
        query parameterisation and authorisation through composition. Verify
        generated SQL and representative query-count and result bounds in tests;
        leave SQL language depth to the SQL branch and physical execution
        tuning to performance.
  - title: Recover according to what the application knows
    brief: >-
      Distinguish a rejected operation, a confirmed transaction abort and an
      operation whose outcome is unknown to the caller. Use a lost response
      after a possible commit to explain why repeating the request can repeat
      its effect. Relate request deadlines, cancellation and retries to the
      actual driver and database contract, using the transaction branch's
      failure distinctions as the starting point.
    nested_article:
      topic: Relational request deadlines, retries and idempotency
      title: Recovering database requests safely
      brief: >-
        Design a bounded request lifecycle across pool acquisition, statements,
        transaction completion and response delivery. Verify what client
        timeouts, server limits, cancellation and connection loss establish
        about ongoing work and connection reuse. Classify retryable confirmed
        aborts, permanent errors and ambiguous outcomes; retry the complete
        logical transaction where required, within a shared deadline and
        bounded attempt budget. Build an idempotency record whose key scope,
        request fingerprint, concurrent claims, atomic business changes,
        stored result and retention match the operation's contract. Resolve
        unknown outcomes by authoritative lookup or reconciliation, including
        requests that overlap or outlive the original caller. Use fault tests
        around commit and response delivery; do not assume a timeout proves
        rollback or repeat the transaction branch's concurrency theory.
  - title: Make work beyond the transaction recoverable
    brief: >-
      Trace an order commit followed by a notification or payment call and show
      the separate failure windows. Establish that a durable record of intent
      can make unfinished work discoverable while the external effect still
      needs its own duplication and reconciliation rules. Introduce database
      jobs and database-derived events through the same concrete recovery
      problem, without expanding into a general messaging curriculum.
    nested_article:
      topic: Relational background work and external effects
      title: Connecting transactions to background work and events
      brief: >-
        Teach how to coordinate committed relational state with external calls,
        background jobs and database-derived events. Compare direct calls,
        transactional job or outbox records, and change-data-capture publication
        by the failure windows each leaves. Design worker claims, leases,
        attempts, completion and abandoned-work recovery using the transaction
        branch's concurrency mechanisms. Handle repeated delivery and external
        outcomes with stable operation identities, receiver deduplication where
        available, and reconciliation where it is not. Explain ordering only
        within the scope a business rule needs. Establish event meaning and
        schema ownership, replay and retention requirements, and recovery from
        stalled publication or consumer progress loss. Treat database change
        capture behaviour as implementation-specific and keep broker internals
        and general distributed-systems protocols outside scope.
  - title: Test the complete application path
    brief: >-
      Assemble a compact acceptance exercise for the running order example:
      exact value round trips, cross-tenant attempts, bounded query counts,
      exhausted pools, leaked or cancelled work, concurrency conflicts, a lost
      commit response and repeated external delivery. Use a real selected
      database and driver for integration guarantees; label local simulations
      as models. Record the evidence needed to distinguish waiting for a
      connection, executing a statement, completing a transaction and finishing
      background work. Link deeper workload measurement and service incident
      response to their owning branches.
