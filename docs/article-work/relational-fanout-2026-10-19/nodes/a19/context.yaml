expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational isolation guarantees and implementations
  title: Reading and testing isolation guarantees
  brief: Teach practitioners to derive usable isolation guarantees from engine documentation and
    reproducible concurrent sessions. Trace statement and transaction snapshots, locking reads, concurrent
    updates, predicate dependencies and serialisation failures through a small set of invariant failures.
    Compare representative PostgreSQL and MySQL InnoDB behaviour where the same level name or query
    shape produces a materially different application decision; add no vendor catalogue. Explain
    the distinction between snapshot isolation and serialisability, and between serialisability and
    real-time ordering. For each worked case, label illustrative schedules separately from verified
    runs, record engine version and settings, state the observation and derive the protection or
    retry obligation it supports. Own interpretation and testing of engine guarantees here; link
    to the locking article for constructing protocols, selecting protected rows and teaching acquisition
    order and deadlocks rather than repeating that work. Keep implementation internals only where
    they explain the obligation.
parent:
  topic: Relational transactions and application correctness
  title: Making concurrent changes correct
  brief: Teach practitioners to state application invariants, choose transaction boundaries and preserve
    those invariants under concurrent execution and failures. Connect isolation anomalies to locking,
    versioned reads, conflict detection, constraints and serialisation, using labelled illustrative
    schedules and verified engine behaviour. Develop practical choices among atomic statements, conditional
    changes, locks and stronger isolation, including deadlocks, retries and uncertain commit outcomes.
    Explain the database's durability boundary and the limit of transactions across external effects;
    leave detailed client integration and service recovery procedures to their respective articles.
  introducing_heading: Stronger isolation can reject a result instead of waiting
neighbouring_articles:
  - topic: Relational locking and concurrency protocols
    title: Designing changes that coordinate with locks
    brief: Teach relational practitioners to design and assess explicit locking protocols for invariants
      that ordinary constraints or a conditional row change cannot express. Work through row and
      predicate coverage, stable coordination rows, missing rows, inserts, lock modes and acquisition
      order using verified behaviour of the selected engine. Explain lock lifetime, waiting, deadlocks
      and contention; show how to shorten a transaction without releasing protection before the decision
      is complete. Assess selected queue or claim patterns only where they clarify the guarantees
      sacrificed by skipping or refusing locked work. Finish with a reproducible two-session check
      and a correctness argument covering all writers. Leave general workload tuning and client retry
      machinery to their owning articles.
boundary_notes:
  - Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
    integration owns request retries, idempotency, deadlines and reconciliation. Link rather than
    repeat.
  - Performance owns query/workload work and intervention validation; operations owns service signals,
    budgets, maintenance procedures and recovery. Link shared mechanisms.
