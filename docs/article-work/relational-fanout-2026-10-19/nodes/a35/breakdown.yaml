topic: Securing relational services
title: Securing a relational service
brief: >-
  Teach how to build and verify operational access boundaries around a relational
  database, using one service's application, migration, reporting, backup and
  emergency access tasks. Connect network reachability, identity, privileges,
  ownership, encryption and audit evidence to what each actor can actually do.
  Develop safe rotation, revocation and compromise response with selected-engine
  checks and explicit managed-service responsibilities. Keep application query
  safety and application authorisation in integration, restoration procedures in
  backups, and the common incident decision method in service operations. This
  article supplies the operational security depth needed for relational practice;
  it does not open a general security architecture branch.
heading:
  - title: Turn access needs into testable boundaries
    brief: >-
      Start with a small service whose application reads and changes orders,
      deployment job changes schema, reporter reads a restricted dataset and backup
      operator preserves recovery copies. Map each identity to its connection
      route, permitted operations, objects and duration of access, then name the
      actions it must be unable to perform. Include database hosts or files,
      provider control planes, exports and recovery copies: SQL grants alone do
      not describe every route to the data. Separate service-owner duties from
      managed-service guarantees and restrictions using the parent's responsibility
      map rather than reproducing its operating introduction.
  - title: Admit only the intended connections
    brief: >-
      Trace a connection from a workload to the database through address exposure,
      network policy, server admission rules and authentication. Explain why
      reachability, authenticated identity and permission to use data are separate
      checks. Choose private or explicitly restricted connection paths, including
      administrator and maintenance routes, and verify both accepted and rejected
      connections from representative locations. Check the engine's rule ordering,
      local socket or file access, authentication methods and managed endpoint
      behaviour where those alter the boundary; avoid a general networking course.
  - title: Give each job the authority it needs
    brief: >-
      Build the worked service's role and privilege design from concrete tasks.
      Separate login identities from reusable privilege roles where supported;
      distinguish object use, ownership, role membership, grant authority and
      administrative powers. Keep the ordinary application identity from owning
      its schema or performing deployment operations. Follow one new table or
      routine through creation and access to expose inherited, public and default
      privileges, namespace resolution and privileged execution paths that can
      undermine the intended design. Check selected-engine semantics rather than
      present portable grant syntax. Introduce row or column restrictions only
      when the database enforces a required boundary, testing ownership and
      administrative bypasses; link application authorisation to integration.
  - title: Protect connections, copies and the keys that unlock them
    brief: >-
      Distinguish encrypted traffic from authenticated server identity, then
      configure a connection that verifies the expected server and rejects an
      untrusted certificate or wrong name. Explain client certificates only where
      they are the chosen authentication method. Map encryption at rest across
      database storage, logs, temporary data, backups, snapshots and exports;
      identify who can decrypt each copy and which administrators remain trusted.
      Verify the selected engine or service's actual coverage and restrictions.
      Connect key access, retention and recoverability to the backup article's
      restoration rehearsal so encryption neither creates an unnoticed plaintext
      copy nor makes an otherwise valid recovery copy unusable.
  - title: Change credentials without losing control of access
    brief: >-
      Walk through rotating one application credential and one expiring
      certificate or trust root: inventory consumers, introduce the replacement,
      update and reconnect clients, verify use, then retire the old material.
      Include pools, scheduled jobs, replicas and backup clients where relevant.
      Keep secrets out of source, connection logs and broadly readable runtime
      configuration. Test what credential expiry, role changes and revocation do
      to existing sessions as well as new connections, and require an explicit
      session termination step where necessary. Distinguish provider-managed
      rotation promises from consumer updates the operator must still perform.
  - title: Prove permitted work succeeds and forbidden work fails
    brief: >-
      Turn the initial access map into a repeatable verification exercise using
      the real connection path and each effective identity. Demonstrate permitted
      reads and writes alongside rejected cross-boundary reads, schema changes,
      privilege grants and unauthorised connections. Include newly created
      objects, role inheritance and recovery-copy or control-plane access in the
      relevant tests. Use disposable data or an isolated environment for destructive
      attempts; retain expected outcomes, observed results and the tested engine,
      service and configuration. Repeat after changes that can alter access and
      explain what these bounded tests leave unproven. Clearly label any diagram
      or simulated access matrix as an illustrative model.
  - title: Leave useful evidence and a controlled emergency route
    brief: >-
      Select audit records for connection attempts, privileged operations, grant
      and ownership changes, and access to sensitive data or recovery copies where
      supported. Preserve actor, time and affected object while limiting sensitive
      statement values and credential exposure. Establish retention, independent
      protection and access to records, and verify what the chosen engine and
      managed service can record before relying on them. Distinguish operational
      logs from a complete account of data access. Provide a separately controlled,
      short-lived emergency identity whose use is attributable, tested, revoked
      and reviewed; account for provider or identity-service failure without
      making the ordinary application an administrator.
  - title: Revoke compromised access and verify the boundary again
    brief: >-
      Work through suspected theft of the application credential using the
      parent's incident method. Identify the affected identities and routes,
      preserve available evidence, restrict exposure, revoke or replace credentials
      and terminate relevant sessions using verified engine procedures. Inspect
      role memberships, ownership, new objects, scheduled work and copied data
      according to the authority the identity actually held. Distinguish stopping
      further access from establishing what was read or changed: rotation cannot
      recover disclosed data or prove its integrity. Set explicit checks for
      restoring access and hand possible data repair to the restoration owner;
      finish by rerunning the positive and negative tests and recording remaining
      uncertainty. Keep this database-specific response within the common incident
      process rather than creating another incident article.
