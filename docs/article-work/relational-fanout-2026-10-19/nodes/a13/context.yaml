original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: SQL expression semantics, missing values and time
  title: Getting SQL values right
  brief: 'Teach the expression semantics needed to produce correct relational results: null propagation
    and three-valued logic; null-safe comparisons; CASE and COALESCE; numeric precision, division,
    rounding and overflow; text comparison, collation and pattern matching; and explicit versus implicit
    conversions. Develop date, local date-time, instant, interval and named-zone distinctions through
    reporting periods and elapsed-time calculations, including half-open boundaries and daylight-saving
    changes. Verify behaviour in a named engine and identify consequential dialect differences. Keep
    schema type selection in the design branch and driver conversion in application integration;
    avoid a function catalogue or a specialist calendar curriculum.'
parent:
  topic: Querying and changing relational data with SQL
  title: Working with SQL
  brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database
    to expressing and checking substantial application and analytical queries. Teach selection, joins,
    aggregation, subqueries, set operations, window calculations and recursion where they solve useful
    relational problems. Develop precise reasoning about duplicates, nulls, ordering, time, pagination
    and data changes. Teach how to establish expected results and test edge cases. Distinguish portable
    concepts from dialect behaviour without attempting an exhaustive syntax catalogue; leave execution-cost
    diagnosis to its own branch.
  introducing_heading: Make values, missing facts and time explicit
neighbouring_articles:
  - topic: SQL joins, cardinality and aggregation
    title: Joining and summarising data
    brief: Teach how to construct multi-table application queries and reports while preserving their
      intended row meaning. Reason about relationship cardinality, join conditions, self-joins, outer
      joins, unmatched rows and the placement of predicates. Develop GROUP BY, HAVING, conditional
      aggregates, counts, distinct values, empty inputs and null handling. Repair double-counting
      by aggregating at the required level before combining independent details, and use existence
      queries when only presence matters. Include subtotals only where a concrete reporting task
      warrants them. Check expected rows and totals on adversarial fixtures; leave physical join
      methods and execution costs to performance.
  - topic: SQL subqueries, set operations and recursive queries
    title: Composing larger SQL queries
    brief: Teach practitioners to express and validate substantial queries through scalar and table
      subqueries, correlated existence tests, derived tables, common table expressions, UNION, INTERSECT
      and EXCEPT. Make duplicate handling, compatible column types, scalar cardinality and null-sensitive
      membership explicit, including the NOT IN trap and a checked alternative. Use named stages
      to make a report and a reusable view understandable without promising a particular execution
      strategy. Develop one recursive hierarchy or dependency traversal with an anchor, expansion,
      termination, cycle handling, duplicate policy and explicit result ordering. Limit recursion
      to useful relational traversal rather than a general graph-algorithm course; leave materialisation
      and plan diagnosis to performance and view deployment to evolution.
  - topic: SQL window calculations
    title: Calculating across related rows
    brief: 'Teach window functions through practical tasks: latest rows per entity, top items per
      group, running and moving totals, shares of a total and changes from a previous event. Distinguish
      input rows, partitions, window order, peer groups, frames and final output order. Explain ties,
      stable tie-breakers, ranking choices, ROWS versus value-based frames, default-frame surprises
      and null or absent predecessor values. Show how to filter a computed window result using a
      further query stage and how filtering before calculation can change its meaning. Require hand-checked
      examples with ties and missing periods; cover only functions and dialect differences needed
      for these decisions.'
  - topic: SQL data modification
    title: Changing data with SQL
    brief: Teach single-row and set-based INSERT, UPDATE and DELETE, INSERT from a query, defaults,
      generated identifiers, constraints and inspection of affected or returned rows. Derive changes
      from explicit target sets and postconditions; handle zero matches, multiple matches, null-sensitive
      predicates and ambiguous source matches in joined updates. Explain conflict-handling inserts,
      upsert and MERGE through their intended outcomes and the chosen engine's documented semantics
      without treating them as interchangeable concurrency guarantees. Use BEGIN, COMMIT and ROLLBACK
      for bounded exercises and link transaction reasoning for invariants and concurrent writers.
      Keep production backfills, resumability and live correction procedures in schema and data evolution,
      and request retries and idempotency in application integration.
boundary_notes:
  - Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
    integration owns request retries, idempotency, deadlines and reconciliation. Link rather than
    repeat.
  - Performance owns query/workload work and intervention validation; operations owns service signals,
    budgets, maintenance procedures and recovery. Link shared mechanisms.
