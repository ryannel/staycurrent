topic: SQL data modification
title: Changing data with SQL
brief: >-
  Make INSERT, UPDATE and DELETE express a deliberate change to a known target set,
  then establish whether their results satisfy the intended postcondition. Extend
  the parent's first change workflow through set-based changes, insert-from-query,
  defaults and generated identifiers, constraint failures, ambiguous source matches
  and conflict-handling choices. Use a small order-and-stock fixture in a named
  PostgreSQL version, checking consequential behaviour against its primary
  documentation and recording actual results separately from illustrative examples.
  Keep conflict-handling inserts, upsert and MERGE together as an outcome decision;
  identify consequential dialect differences without building a syntax catalogue.
  Use bounded transactions for disposable exercises and link to transaction reasoning
  for concurrent correctness, application integration for retries and idempotency,
  and evolution for production corrections and backfills.
heading:
  - title: State the change before writing the statement
    brief: >-
      Start from the parent's basic update and specify the intended entity, target
      keys, expected number of matches and postcondition. Distinguish changing one
      identified order from changing every qualifying order, including tenant scope
      where identifiers are tenant-local. Derive the candidate set with a query and
      inspect the same predicate's treatment of nulls, zero matches and unexpectedly
      broad matches. Link to expression semantics for three-valued logic. Establish
      that a preview helps find mistakes but is not a reservation of those rows
      against concurrent writers; the transaction branch owns that guarantee.
  - title: Insert the intended rows and keep their identities
    brief: >-
      Use explicit column lists for a single row, several rows and INSERT from a
      query. Check the source's row meaning and duplicate policy before using it to
      create rows, and distinguish an empty source from an unexpected failure to
      insert. Compare omitted columns, DEFAULT and explicit NULL against the actual
      schema. Retrieve generated keys through the named engine's documented returned
      values rather than inferring them from a maximum or assuming consecutive
      identifiers. Introduce constraints only through what they accept or reject;
      schema design owns their modelling and evolution owns adding them to live data.
  - title: Make set-based updates unambiguous
    brief: >-
      Derive a multirow update from a checked key set, express new values from stored
      values or a source relation, and inspect the resulting values. Include a
      conditional stock decrement to show a business precondition in the change
      itself, interpreting zero matches without treating it as proof of one particular
      cause. Require each target row in a source-driven update to have the intended
      number of source matches. Expose duplicate source matches in a fixture and
      repair the source through a justified unique key, aggregation or explicit
      selection rule; arbitrary deduplication must not invent the business rule.
      Verify UPDATE FROM behaviour in the chosen engine rather than assume a portable
      winner. Link join-cardinality teaching and transaction-level invariant reasoning.
  - title: Delete rows and account for dependent changes
    brief: >-
      Select the exact rows to remove using keys and predicates, including a bounded
      example derived from a related table. Check zero and multiple matches and show
      how a missing predicate changes the scope. Inspect how the fixture's foreign
      keys reject deletion or apply declared referential actions, including effects
      on dependent rows. Distinguish deleting a row from assigning NULL or changing
      its business status without prescribing a universal soft-delete policy. Keep
      cascade design in data modelling and production purges in evolution.
  - title: Decide what should happen when an insert meets existing data
    brief: >-
      State whether a conflicting business key should reject the operation, preserve
      the existing row or update selected values, then choose documented SQL for that
      outcome. In one consolidated comparison, use PostgreSQL conflict-handling INSERT
      for the key-based case and introduce MERGE only where matching source and target
      rows genuinely calls for different actions. Check the relevant uniqueness rule,
      null policy, duplicate source keys, update expressions and returned or affected
      rows. Identify version and dialect limits at first use. Do not equate MERGE,
      upsert and a read-then-write sequence or infer common concurrent-insert guarantees
      from similar syntax; link to the transaction branch when competing writers
      determine correctness. Leave request deduplication to application integration.
  - title: Inspect what changed inside a bounded transaction
    brief: >-
      Extend the parent's BEGIN, COMMIT and ROLLBACK workflow with assertions about
      target keys, returned values and final database state. Explain precisely what
      the chosen engine's affected-row count and RETURNING output establish, including
      an update assigning the existing value and a conflict action that changes no
      row. Avoid inferring all dependent or trigger effects from a direct row count;
      inspect the relevant postconditions. Exercise a constraint rejection and the
      documented transaction state afterwards, then restore a usable session. Treat
      generated identifiers and other effects according to documented rollback
      behaviour rather than assuming rollback rewinds everything. Inspection before
      commit does not replace commit acknowledgement or concurrency reasoning; link
      those decisions to transactions and application integration.
  - title: Prove the change against awkward inputs
    brief: >-
      Finish with a compact executable exercise that combines a source-driven change
      and its insert-or-update policy, requiring expected target keys and postconditions
      before execution. Reuse fixtures for no match, one match, several intended
      matches, a null-sensitive predicate, duplicate source matches and a constraint
      violation. Compare predicted and observed returned rows and final state, rolling
      back the disposable exercise after inspection. Separate this single-session
      evidence from a claim about concurrent correctness or acceptable execution cost.
      Point readers to transactions for invariants, performance for expensive changes,
      evolution for live backfills and corrections, and application integration for
      request outcomes and retries. Stop before teaching those procedures again.
