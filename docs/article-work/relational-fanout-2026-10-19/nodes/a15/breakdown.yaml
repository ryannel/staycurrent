topic: SQL subqueries, set operations and recursive queries
title: Composing larger SQL queries
brief: >-
  Extend the parent's completed report and existence test with the correctness
  decisions needed when queries return scalar values, supply tables, compare
  memberships or combine results. Make cardinality, correlation, null policy,
  compatible types and duplicate policy explicit. Explain how a checked query
  becomes a reusable view without implying an execution strategy. Offer one
  optional hierarchy traversal with deliberate termination, cycle, multiplicity
  and ordering rules. Use a named engine and identify consequential dialect
  differences; leave execution costs, materialisation and plan diagnosis to
  performance, and view deployment to evolution.
heading:
  - title: Choose what the inner query must return
    brief: >-
      Start from the parent's established result-row contract rather than repeating
      its staged-report walkthrough or CTE introduction. Distinguish a scalar
      value, a relation of rows and a yes-or-no existence question through small
      extensions to its order-and-payment data. For a scalar lookup, check zero,
      one and multiple returned rows, including a one-row null result; demonstrate
      the chosen engine's zero-row null and multiple-row failure behaviour. Explain
      when a constraint establishes cardinality and when a business rule requires
      an explicit aggregate or ordered selection. Do not hide ambiguity with an
      arbitrary first row.
  - title: Make the dependency on the outer row visible
    brief: >-
      Trace a correlated scalar query and a correlated EXISTS predicate for two
      deliberately different outer orders. Qualify names and show how a missing
      correlation predicate silently asks a global question. Distinguish the
      logical dependence on outer values from claims about how many times an
      engine executes the inner query. Contrast a table subquery's row and column
      contract with a scalar position, and expose the row multiplication that an
      apparently equivalent join can introduce. Link join-cardinality repairs
      to Joining and summarising data rather than repeating them.
  - title: Define what membership means when values can be missing
    brief: >-
      Compare IN, EXISTS, NOT IN and NOT EXISTS on a tiny fixture containing
      matches, non-matches, repeated inner values, an empty inner result and nulls
      on either side. Show the NOT IN trap by recording true, false or unknown
      before applying WHERE. Repair an exclusion query with a correlated NOT
      EXISTS and an explicit policy for a null outer key; ordinary equality in
      the correlation does not by itself make nulls match. If null denotes an
      equal membership value for the task, use the named engine's null-safe
      comparison and check that policy separately. Reuse the parent's basic
      existence lesson and link expression semantics for general three-valued
      logic. Do not promise that rewriting predicates improves performance.
  - title: Combine result sets with the intended multiplicity
    brief: >-
      Use two small customer-selection queries to derive UNION, INTERSECT and
      EXCEPT from their expected outputs. Align column count, column positions
      and compatible types explicitly; compatible types alone do not establish
      compatible business meanings. Compare UNION with UNION ALL, then explain
      duplicate elimination and the supported ALL variants through counts of
      repeated rows. Show how nulls participate in set duplicate comparison
      rather than importing ordinary equality behaviour. Mark unsupported
      dialect variants, parenthesise mixed operations, and place a final ORDER BY
      over the complete result. Keep branch-local limiting and ordering separate
      from any promise about final display order.
  - title: Give a checked query a reusable interface
    brief: >-
      Turn one already checked composition into a view with deliberately named
      columns and explicit selection. Demonstrate a consuming query and explain
      that reuse names a query interface; it does not promise stored results,
      fixed row order or a particular plan. Keep the decision focused on a stable
      meaning shared by callers. Link materialised results and execution choices
      to performance, and interface changes, permissions and production deployment
      to their owning branches instead of extending into view administration.
  - title: Follow a hierarchy only when the task requires traversal
    brief: >-
      Mark this section as optional: ordinary reports, window calculations,
      pagination and changes do not depend on it. Develop one task, listing the
      descendants of a selected category in a parent-child hierarchy, with a
      tiny fixture and a hand-drawn expected result. Keep it as a bounded SQL
      traversal rather than surveying graph algorithms or alternative hierarchy
      representations.
    heading:
      - title: Separate the starting rows from each expansion
        brief: >-
          Build the recursive CTE's anchor and expansion, showing the working rows
          after successive rounds as a logical explanation, not an observed
          execution trace. Define whether the selected root appears and what
          each output row represents. Check the recursive columns' types,
          missing roots, leaves and a hierarchy with multiple levels. Explain
          termination when expansion produces no further eligible rows.
      - title: Stop cycles and choose which repeats to retain
        brief: >-
          Introduce a deliberate cycle into the disposable fixture and repair
          the traversal using the named engine's cycle facility or an explicit
          visited path. Explain why UNION's whole-row deduplication is not a
          general cycle defence when depth or path changes on every visit.
          Distinguish revisiting a node along one path from the result's desired
          duplicate policy. Treat a maximum-depth limit as a safety bound that
          can truncate an answer, with a visible truncation check, rather than
          proof of a complete traversal. Use an explicit path or ordering key
          and final ORDER BY; traversal evaluation order does not establish
          display order. Identify the relevant recursive-syntax differences
          without adding another recursive-query article.
  - title: Check the contracts introduced by composition
    brief: >-
      Close with repeatable checks targeted at this article's extra failure
      cases: scalar zero and multiple rows, a lost correlation, nullable
      membership including an empty inner set, unequal duplicate counts across
      set branches, and the optional traversal's missing root, leaf, cycle and
      depth bound. Compare expected values, nulls, column types and row counts;
      compare order only where the query promises it. Keep a compact answer key
      showing why attractive rewrites are or are not equivalent under these
      contracts. Passing these checks establishes the illustrated answers, not
      acceptable execution cost; hand that diagnosis to performance.
