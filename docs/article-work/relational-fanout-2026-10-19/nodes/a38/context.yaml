original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational replication, failover and data placement
  title: Operating replicas and partitioned data
  brief: Teach practitioners to select and operate a relational topology against explicit service
    requirements. Develop physical and logical replication where their different units and restrictions
    affect the choice, asynchronous and synchronous acknowledgement, lag and retention, replica reads,
    promotion, exclusion of the former writer, client reconnection and rejoining or replacing members.
    Distinguish local table partitioning from distributing ownership across database services; explain
    routing, skew, hotspots, cross-partition joins and transactions, movement and added recovery
    obligations only to the depth needed for relational decisions. Include managed high-availability
    and distributed relational deployments where their documented guarantees change the operating
    procedure. Verify selected-engine failover and placement behaviour with bounded failure tests;
    defer general consensus theory and application retry mechanics.
parent:
  topic: Operating and recovering relational services
  title: Running a relational service
  brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service
    against explicit availability, data-loss and recovery requirements. Connect those requirements
    to access boundaries, service signals, capacity, maintenance, topology, backup and incident procedures.
    Give readers the working model needed to choose a safe next action, with contextual articles
    developing the procedures and implementation differences. Distinguish self-managed duties from
    managed service contracts. Keep query tuning, application retry logic and live schema changes
    in their neighbouring branches, and the separate distributed-systems programme outside this branch.
  introducing_heading: Choose where reads and writes can safely run
neighbouring_articles:
- topic: Securing relational services
  title: Securing a relational service
  brief: Teach how to build and verify operational access boundaries around a relational database.
    Develop network exposure, authentication, role and privilege design, object ownership, administrative
    separation, credential and certificate rotation, encrypted connections, storage and backup encryption,
    key recovery and audit records through concrete access tasks. Include negative permission tests,
    safe emergency access, revocation and compromise response. Check selected-engine privilege and
    connection behaviour and managed-service restrictions. Refer application query safety to integration;
    pursue general security architecture only where it changes a database operating decision.
- topic: Relational service monitoring and capacity
  title: Monitoring and sizing a relational service
  brief: Teach how to instrument service objectives, choose useful engine and infrastructure signals,
    interpret rates and saturation, and investigate a change against workload and deployment history.
    Develop capacity estimates for data, indexes, retained versions, logs, temporary work, backup
    and recovery; distinguish normal headroom from failover and maintenance requirements. Design
    actionable alerts and representative load and recovery checks. Use evidence to choose among reducing
    work, changing limits, increasing resources and changing topology. Leave individual query plans
    and index design to performance, and application pool implementation to integration.
- topic: Relational service maintenance and upgrades
  title: Maintaining and upgrading a relational service
  brief: Teach how to schedule, observe and repair the engine's required upkeep, including version
    cleanup, statistics, log retention and storage or index maintenance where applicable. Distinguish
    engine-specific mechanisms and automatic work from tasks that still require intervention. Plan
    patches and major upgrades around application and extension compatibility, resource needs, locking
    or downtime, replica and backup compatibility, rollback feasibility and post-change validation.
    Rehearse representative upgrades and failure paths using verified engine procedures. Coordinate
    with backups and topology without reteaching their design or live schema migration techniques.
- topic: Relational backups and tested restoration
  title: Backing up and restoring relational data
  brief: Teach how to select logical exports, engine-supported physical backups, snapshots and transaction-log
    retention for specified recovery cases, including consistency, dependencies, portability and
    recovery granularity. Define retention, independent copies, access protection and loss scenarios;
    verify that the required logs and keys remain available. Develop isolated full and point-in-time
    restoration rehearsals, recovery-point selection, integrity and application checks, measured
    recovery time, and safe cutover. Cover managed-service restore constraints and the limits of
    selective recovery when later valid changes must be reconciled. Check exact procedures against
    the selected engine and service; retain evidence and distinguish rehearsed recovery from an untested
    plan.
boundary_notes:
- Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
  integration owns request retries, idempotency, deadlines and reconciliation. Link rather than repeat.
- Performance owns query/workload work and intervention validation; operations owns service signals,
  budgets, maintenance procedures and recovery. Link shared mechanisms.
