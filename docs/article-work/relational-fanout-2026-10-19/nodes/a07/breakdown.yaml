topic: Operating and recovering relational services
title: Running a relational service
brief: >-
  Teach practitioners to secure, observe, maintain, scale and recover a relational
  service against explicit availability, data-loss and recovery requirements.
  Connect those requirements to access boundaries, service signals, capacity,
  maintenance, topology, backup and incident procedures. Give readers the working
  model needed to choose a safe next action, with contextual articles developing
  the procedures and implementation differences. Distinguish self-managed duties
  from managed service contracts. Keep query tuning, application retry logic and
  live schema changes in their neighbouring branches, and the separate
  distributed-systems programme outside this branch.
heading:
  - title: Define what the service must survive
    brief: >-
      Start with an ordinary application's database, its users and its operating
      owner. Turn acceptable interruption, acceptable loss of acknowledged changes,
      recovery time and retained recovery history into explicit requirements for
      named failures. Distinguish service availability, data durability and data
      correctness: meeting one does not establish the others. Include dependencies
      such as identity, storage, keys, networking and the application connection
      path when defining recovery. Use a small failure-and-recovery table to show
      which mechanisms and evidence each requirement demands.
    heading:
      - title: Assign every operating responsibility
        brief: >-
          Compare a self-managed installation with a managed service using the
          same responsibility checklist. Establish who patches, monitors, retains
          backups, controls keys, initiates failover, restores data and proves that
          applications can use the recovered service. Require documented limits,
          escalation paths and tested procedures rather than treating a service
          label or availability commitment as a recovery design.
  - title: Limit who can reach and change the data
    brief: >-
      Follow one application connection through network access, authenticated
      identity and database privileges. Explain why encryption in transit and at
      rest, least privilege, restricted administrative access and audit evidence
      solve different problems. Establish separate application, migration,
      monitoring, backup and emergency access needs, and include backup copies
      and recovery keys within the security boundary. Keep parameter binding and
      application injection prevention with the integration branch.
    nested_article:
      topic: Securing relational services
      title: Securing a relational service
      brief: >-
        Teach how to build and verify operational access boundaries around a
        relational database. Develop network exposure, authentication, role and
        privilege design, object ownership, administrative separation, credential
        and certificate rotation, encrypted connections, storage and backup
        encryption, key recovery and audit records through concrete access tasks.
        Include negative permission tests, safe emergency access, revocation and
        compromise response. Check selected-engine privilege and connection
        behaviour and managed-service restrictions. Refer application query safety
        to integration; pursue general security architecture only where it changes
        a database operating decision.
  - title: Observe the service before it reaches a limit
    brief: >-
      Start with successful and failed application work, latency and demand, then
      connect those observations to connections, active work, waits, CPU, memory,
      storage latency and free space. Include retained versions, transaction logs,
      replica lag and backup health where the selected system exposes them.
      Explain the difference between a symptom, a resource limit and a cause.
      Establish baselines and headroom for growth, maintenance and recovery, with
      actionable alerts and a first diagnostic step. Link query and workload
      diagnosis to the performance branch.
    nested_article:
      topic: Relational service monitoring and capacity
      title: Monitoring and sizing a relational service
      brief: >-
        Teach how to instrument service objectives, choose useful engine and
        infrastructure signals, interpret rates and saturation, and investigate a
        change against workload and deployment history. Develop capacity estimates
        for data, indexes, retained versions, logs, temporary work, backup and
        recovery; distinguish normal headroom from failover and maintenance
        requirements. Design actionable alerts and representative load and
        recovery checks. Use evidence to choose among reducing work, changing
        limits, increasing resources and changing topology. Leave individual query
        plans and index design to performance, and application pool implementation
        to integration.
  - title: Make routine maintenance a controlled change
    brief: >-
      Explain how ordinary writes create ongoing storage and statistics upkeep,
      and why long transactions, retention and neglected maintenance can turn
      gradual growth into an outage. Give each operating change an owner,
      precondition, resource allowance, observation plan and recovery path.
      Distinguish routine upkeep, software patching and major-version upgrades;
      verify compatibility and recovery before altering the production service.
      Link storage mechanisms and query effects to performance and live schema
      changes to evolution.
    nested_article:
      topic: Relational service maintenance and upgrades
      title: Maintaining and upgrading a relational service
      brief: >-
        Teach how to schedule, observe and repair the engine's required upkeep,
        including version cleanup, statistics, log retention and storage or index
        maintenance where applicable. Distinguish engine-specific mechanisms and
        automatic work from tasks that still require intervention. Plan patches
        and major upgrades around application and extension compatibility,
        resource needs, locking or downtime, replica and backup compatibility,
        rollback feasibility and post-change validation. Rehearse representative
        upgrades and failure paths using verified engine procedures. Coordinate
        with backups and topology without reteaching their design or live schema
        migration techniques.
  - title: Choose where reads and writes can safely run
    brief: >-
      Establish a single writable service as the initial topology, then introduce
      replicas, failover and partitioning through the particular availability,
      read load, locality or capacity problem each addresses. Trace an
      acknowledged write to a later read and a possible promotion, distinguishing
      replication progress, read freshness and protection from loss. Explain that
      replication does not replace retained recovery history. Introduce the
      operating costs and transaction boundaries of partitioned data without
      opening a separate distributed-systems curriculum.
    nested_article:
      topic: Relational replication, failover and data placement
      title: Operating replicas and partitioned data
      brief: >-
        Teach practitioners to select and operate a relational topology against
        explicit service requirements. Develop physical and logical replication
        where their different units and restrictions affect the choice,
        asynchronous and synchronous acknowledgement, lag and retention, replica
        reads, promotion, exclusion of the former writer, client reconnection and
        rejoining or replacing members. Distinguish local table partitioning from
        distributing ownership across database services; explain routing, skew,
        hotspots, cross-partition joins and transactions, movement and added
        recovery obligations only to the depth needed for relational decisions.
        Include managed high-availability and distributed relational deployments
        where their documented guarantees change the operating procedure. Verify
        selected-engine failover and placement behaviour with bounded failure
        tests; defer general consensus theory and application retry mechanics.
  - title: Prove that the data can be restored
    brief: >-
      Compare restoration after accidental deletion, storage corruption and loss
      of the service. Introduce consistent backups, retained transaction history
      and point-in-time recovery as recovery inputs whose coverage and limits
      must be checked. Include configuration, credentials, encryption keys,
      extensions and sufficient destination capacity in the recovery dependency
      list. A successful backup job is evidence of one step; a timed restoration
      and application-level validation establish what recovery can actually do.
    nested_article:
      topic: Relational backups and tested restoration
      title: Backing up and restoring relational data
      brief: >-
        Teach how to select logical exports, engine-supported physical backups,
        snapshots and transaction-log retention for specified recovery cases,
        including consistency, dependencies, portability and recovery granularity.
        Define retention, independent copies, access protection and loss scenarios;
        verify that the required logs and keys remain available. Develop isolated
        full and point-in-time restoration rehearsals, recovery-point selection,
        integrity and application checks, measured recovery time, and safe cutover.
        Cover managed-service restore constraints and the limits of selective
        recovery when later valid changes must be reconciled. Check exact
        procedures against the selected engine and service; retain evidence and
        distinguish rehearsed recovery from an untested plan.
  - title: Recover the incident without destroying the evidence
    brief: >-
      Teach one incident decision sequence in this article: establish impact and
      ownership, preserve evidence and recovery options, distinguish plausible
      causes, contain ongoing damage, select a prepared procedure and validate
      service and data before reopening traffic. Work through a compact contrast
      between overload and accidental deletion to show why relieving demand and
      recovering correct data require different actions. Add a failure-to-procedure
      table linking saturation, connection or lock blockage and exhausted capacity
      to monitoring and performance; compromised access to security; writer or
      host loss to topology; and corruption or operator error to restoration.
      Preserve useful logs, copies and recovery history before intervention.
      Define explicit go/no-go criteria for recovery and resumed traffic, including
      data validation, application reconnection and reconciliation handoffs.
      Record and communicate actual data loss and interruption, then repair the
      failed controls or runbook assumptions. Reuse the detailed procedures in
      their owning articles, verify any concrete engine steps, and label
      illustrative incident timelines clearly.
