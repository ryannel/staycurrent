original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Operating and recovering relational services
  title: Running a relational service
  brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service
    against explicit availability, data-loss and recovery requirements. Develop operational use of
    access control, network and encryption boundaries, monitoring, capacity planning, maintenance,
    upgrades, backups and tested restoration. Explain replication, failover, read placement and partitioning
    only to the depth needed to choose a relational topology, recognise its consistency and failure
    boundaries and operate it safely. Include incident diagnosis and recovery from corruption, operator
    error and service loss, with verified procedures and evidence. Distinguish self-managed duties
    from managed service contracts; keep the separate distributed-systems programme outside this
    branch.
parent:
  topic: Relational databases
  title: Relational databases
  brief: Introduce relational databases through an ordinary application that must keep related facts
    correct while people read and change them. Establish the model, the work a database performs
    and the decisions its users remain responsible for. Give an intelligent engineer new to the subject
    a useful first working model and a route to expert practice in choosing, designing, querying,
    integrating, diagnosing, operating and recovering a relational service. Keep detailed mechanisms
    in the contextual articles where they change a practical decision.
  introducing_heading: Operate for the failure you must recover from
neighbouring_articles:
  - topic: Relational data design
    title: Designing relational data
    brief: Teach an engineer to translate application facts, rules and access needs into a relational
      schema. Develop identity, relationship cardinality, keys, types, missing values, constraints
      and normalisation through concrete design decisions and failure cases. Explain when deliberate
      redundancy, history, semi-structured values or derived data earns its consistency and maintenance
      cost. Make resulting designs testable against representative reads, changes and lifecycle requirements;
      pursue formal theory and specialised modelling only as far as those decisions need.
  - topic: Querying and changing relational data with SQL
    title: Working with SQL
    brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database
      to expressing and checking substantial application and analytical queries. Teach selection,
      joins, aggregation, subqueries, set operations, window calculations and recursion where they
      solve useful relational problems. Develop precise reasoning about duplicates, nulls, ordering,
      time, pagination and data changes. Teach how to establish expected results and test edge cases.
      Distinguish portable concepts from dialect behaviour without attempting an exhaustive syntax
      catalogue; leave execution-cost diagnosis to its own branch.
  - topic: Relational transactions and application correctness
    title: Making concurrent changes correct
    brief: Teach practitioners to state application invariants, choose transaction boundaries and
      preserve those invariants under concurrent execution and failures. Connect isolation anomalies
      to locking, versioned reads, conflict detection, constraints and serialisation, using labelled
      illustrative schedules and verified engine behaviour. Develop practical choices among atomic
      statements, conditional changes, locks and stronger isolation, including deadlocks, retries
      and uncertain commit outcomes. Explain the database's durability boundary and the limit of
      transactions across external effects; leave detailed client integration and service recovery
      procedures to their respective articles.
  - topic: Relational application integration
    title: Building applications around a relational database
    brief: 'Teach how to integrate a relational database into a reliable application: drivers and
      type conversion, parameterised statements, connection pools, transaction lifetimes, query composition
      and ORM behaviour. Diagnose excessive round trips, unbounded work and pool exhaustion. Design
      deadlines, cancellation, retries and idempotency around the actual database and driver guarantees,
      including ambiguous outcomes. Handle external effects, background work and database-derived
      events with explicit failure and reconciliation paths. Cover injection prevention and application
      access boundaries; use the transaction branch''s concurrency reasoning rather than reteaching
      it.'
  - topic: Relational execution and performance
    title: Understanding and improving database performance
    brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
      Build the necessary understanding of row and index storage, buffering, version retention, access
      paths, join methods, sorting, aggregation, statistics and optimiser choices. Read estimated
      and observed plans without confusing their units or treating estimates as execution evidence.
      Connect query shape, indexes, physical layout, maintenance and resource contention to workload
      latency, throughput and capacity. Choose and validate changes with representative data and
      concurrency, including write and operational costs; deepen engine internals only where they
      explain a diagnosis or intervention.
  - topic: Relational schema and data evolution
    title: Changing a live database
    brief: Teach how to plan, execute and verify schema changes, backfills, imports, corrections
      and database moves while applications continue to use the data. Reason about compatibility
      across deployed application versions, locks and physical rewrites, resource limits and failure
      recovery. Develop staged constraint changes, resumable and idempotent data work, reconciliation,
      cutover criteria and honest rollback plans. Include retention and deletion changes where they
      alter application or recovery guarantees. Check procedures against the selected engine's DDL,
      tooling and replication behaviour rather than assuming that every change is transactional or
      online.
  - topic: Choosing relational systems and deployments
    title: Choosing a relational database
    brief: Teach how to select and validate a relational engine and deployment for a concrete application.
      Derive candidates from workload, data shape, correctness, scale, latency, availability, locality,
      operations, ecosystem, portability and total cost. Compare representative embedded, server
      and distributed relational choices where their mechanisms change the decision, including managed
      service restrictions and responsibilities. Build an evaluation with realistic data, concurrency,
      failure and recovery tests and explicit exit criteria. Establish the concrete implementation
      knowledge needed to adopt a chosen system without creating a vendor catalogue or a parallel
      specialist curriculum. Use neighbouring storage families only to establish relational suitability
      and boundaries.
boundary_notes:
  - Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
    integration owns request retries, idempotency, deadlines and reconciliation. Link rather than
    repeat.
  - Performance owns query/workload work and intervention validation; operations owns service signals,
    budgets, maintenance procedures and recovery. Link shared mechanisms.
