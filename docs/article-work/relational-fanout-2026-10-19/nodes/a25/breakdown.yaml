topic: Designing and evaluating relational indexes
title: Choosing indexes for a workload
brief: >-
  Derive index candidates from the work a relational workload needs, explain how
  their keys limit and order access, and decide whether their read benefit earns
  their write, space and operating costs. Use one tenant order-history workload
  with equality filters, a date range, an ordered first page and a related-row
  lookup. Extend it only when another query exposes a consequential trade-off.
  Own B-tree traversal, composite key order, coverage, base-row access and index
  eligibility. Reuse the plan-reading article's reporting conventions and the
  performance parent's common comparison method. Link statistics diagnosis,
  physical storage and safe schema changes to their owners. Keep the depth at
  choosing and evaluating relational indexes, without an index-family catalogue
  or another benchmarking curriculum.
heading:
  - title: Start with the queries the workload must serve
    brief: >-
      Collect actual predicates, join keys, ordering, grouping, projected columns,
      parameter classes and execution frequency before proposing indexes. Record
      existing constraints and indexes, table size and change rate. Use the order
      history query to distinguish rows returned from rows inspected and to name
      the work a candidate should remove. Establish the competing write path and
      related-row lookup so the first successful query cannot decide the whole
      design. Link application query capture and the parent's workload comparison
      method instead of repeating them.
  - title: Follow a B-tree from key to row
    brief: >-
      Build the minimum model of ordered keys, page traversal, matching leaf
      entries and row locators needed to explain an access path. Distinguish
      finding a starting point, scanning index entries and visiting base rows.
      Compare a few selective lookups with a broad result whose scattered row
      visits can make a scan preferable. Explain that selectivity, locality and
      cache state influence the cost; an index existing does not make its use
      cheaper. Use labelled illustrations rather than invented execution evidence,
      and link physical storage for page layout and working-set mechanisms.
  - title: Put composite keys in the order the query can use
    brief: >-
      Compare candidate orders such as tenant, creation time and tenant, status,
      creation time against the shared workload. Trace equality prefixes and
      range bounds, distinguish keys that bound the scanned interval from later
      tests that reject entries, and show what changes when a leading condition
      is absent. Treat this as a baseline B-tree model and check the selected
      engine's actual access path for optimisations that can use later keys;
      avoid an absolute leftmost-prefix rule or a most-selective-column recipe.
    heading:
      - title: Join lookups and several query shapes compete for key order
        brief: >-
          Derive a candidate for repeated inner-side join probes from the values
          supplied by the outer side. Compare it with the index serving the
          history query, including whether an existing prefix already supplies
          useful access. Link join-method explanation to plan reading. Show why
          one composite index need not serve every optional filter, and why
          separate single-column indexes are not automatically equivalent to it.
      - title: Ordering and grouping can change the useful route
        brief: >-
          Follow index order through fixed equality keys, ascending or descending
          requirements, null placement and a bounded first page. Explain when an
          access path can avoid sorting or feed ordered grouping, and why filters,
          joins and the selected plan can still prevent that benefit. Keep SQL
          pagination correctness and aggregate semantics with their existing
          owners. Use engine-checked examples rather than promising that matching
          column names eliminate a sort.
  - title: Decide which row visits are worth avoiding
    brief: >-
      Contrast search and ordering keys with extra returned values stored for
      coverage, using included columns where the selected engine supports them.
      Show how wider entries reduce density and increase storage and update work.
      Explain that containing every requested value only makes an index-only
      path possible: visibility checks and engine organisation can still require
      base-row visits. Inspect actual fetch evidence using the plan article's
      conventions. Own this key-to-base-row explanation once and link storage
      for the underlying row and version mechanisms.
  - title: Check that the query is eligible to use the index
    brief: >-
      Separate a useful hypothetical key order from an index the engine can use
      for the actual expression and comparison. Check operand types, implicit
      conversions, comparison operators and collation against the selected
      engine; a textual resemblance between query and definition is insufficient.
    heading:
      - title: Index a subset or an expression when that removes real work
        brief: >-
          Introduce a partial or filtered index for a small active subset and an
          expression index for an actual transformed lookup. Explain predicate
          implication, expression compatibility, null semantics and engine rules
          for indexable expressions. Test representative parameterised statements:
          the planner may lack the information needed to prove a subset predicate.
          Account for rows entering or leaving the subset and for expression
          evaluation during writes. Keep plan caching mechanics with the
          optimiser article and uniqueness semantics with schema design.
      - title: Change index family only for an access need B-trees do not meet
        brief: >-
          Use at most one workload-driven contrast, such as membership search
          within a document or a broad range over physically correlated data,
          to explain why another family could be a candidate. Verify supported
          operators, ordering, precision and any recheck work in primary engine
          documentation. Point to the relevant feature article for specialised
          search. Stop once the reader can identify a justified candidate to
          evaluate; do not survey access methods.
  - title: Count the obligations created by each candidate
    brief: >-
      Follow inserts, updates and deletes through additional index entries,
      including wider keys, changed indexed values, uniqueness checks and
      contention on busy key ranges. Assess space, write amplification and
      maintenance work at the workload's actual change rate. Separate an index's
      access role from a primary-key or uniqueness constraint's correctness role;
      a faster replacement cannot silently discard the constraint. Check foreign
      key lookup needs and engine-specific automatic index creation. Compare
      apparent duplicates by key order, predicates, expressions, included values
      and constraint dependencies before declaring one redundant.
  - title: Keep the candidate only if its benefit survives the workload
    brief: >-
      Apply the parent's comparison method to the specific index hypothesis:
      confirm reduced entries examined, base-row fetches or sorting in observed
      plans, then compare workload reads and writes including tail latency,
      throughput and index size. Include large and small tenants, common and rare
      values, nulls, skew, different range widths and changing query mixes. If the
      predicted route is not selected, hand the estimate-versus-observation
      mismatch to statistics diagnosis rather than forcing index use. Distinguish
      a favourable demonstration from captured execution evidence. End with a
      justified retain, revise or remove decision and its regression signals.
      Link creation, validation, constraint replacement and removal to schema
      evolution and operations for locking, resource headroom and recovery;
      index design alone does not establish a safe live deployment procedure.
