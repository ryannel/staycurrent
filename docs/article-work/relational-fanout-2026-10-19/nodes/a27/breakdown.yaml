topic: Relational statistics and optimiser decisions
title: Explaining and correcting plan choices
brief: >-
  Teach how to turn a surprising relational plan choice into a testable explanation
  and a targeted correction. Continue the shared worked case from Following a query
  through its execution plan at its first consequential estimate/observation
  mismatch; that sibling owns obtaining and reading the plan. Use PostgreSQL as the
  concrete engine, recording the version and checking engine behaviour against its
  primary documentation. Build only the statistics, cardinality, cost and parameter
  model needed to distinguish missing information from a genuinely expensive query
  or a constrained planning choice. Test remedies against SQL correctness, rare and
  common parameter values, data drift and planning overhead. Use the parent's
  workload comparison method and link index design, storage and operating procedures
  to their owners. Keep this as one focused article without an optimiser algorithm
  survey or further specialist branches.
heading:
  - title: Start with the choice that needs explaining
    brief: >-
      Resume the sibling's captured report query and its first consequential
      mismatch instead of reconstructing its joins or explaining plan notation.
      State the competing choices and the observation that makes the selected one
      suspect. Separate a cardinality error from accurate estimates with unexpectedly
      costly execution, and from a query that necessarily returns or processes much
      data. Treat an estimate error as consequential when it plausibly changes
      access, join order or resource use; the largest ratio is not automatically the
      best investigation target. Distinguish illustrative arithmetic from captured
      execution throughout.
  - title: What the planner needs to predict
    brief: >-
      Build a small numerical model from table size to matching rows and join
      output. Explain selectivity, null fractions, distinct values, common-value
      frequencies and histograms, showing why a uniform average misses skew.
      Use one dependent pair of predicates to expose the independence assumption.
      Distinguish correlation between column values from physical value/order
      correlation used in access costing. Show how uniqueness and join-key
      distributions inform multiplicity without treating every join as a fixed
      fraction of a Cartesian product. Label the calculations as simplified models,
      not a reproduction of PostgreSQL's estimator.
  - title: How a small error changes the rest of the plan
    brief: >-
      Follow the worked case's underestimated intermediate into the choices it
      influences: repeated lookups, join ordering, scan alternatives and expected
      hash or sort sizes. Reuse the sibling's operator explanations. Explain how
      estimated rows, row width and anticipated CPU and page work feed a comparison
      of eligible plans; cost units are not elapsed time. A spill or slow lookup
      does not itself prove a statistics fault. Conversely, better cardinality can
      change several downstream decisions at once. Avoid implying that an estimate
      directly allocates a fixed amount of execution memory in every engine.
  - title: Find which information is missing
    brief: >-
      Inspect the relevant PostgreSQL table estimates and pg_stats entries for the
      predicates and join keys already implicated by the plan. Compare their
      coverage and distributions with bounded observations of the data, accounting
      for the cost of diagnostic queries. Explain sampled statistics, stale
      statistics after data changes and genuinely unrepresented dependencies as
      different hypotheses. Fresh statistics remain approximate. Include
      expressions and joins whose selectivity cannot be inferred well from the
      available summaries. Check the versioned Statistics Used by the Planner and
      CREATE STATISTICS documentation; do not promise that multicolumn statistics
      repair cross-table join estimates or every predicate form.
  - title: Match the remedy to the hypothesis
    brief: >-
      Use a compact decision sequence in the shared case: refresh relevant
      statistics for drift, consider a higher targeted statistics setting when the
      sample or summary misses consequential skew, and collect appropriate extended
      statistics for supported same-table dependencies. Explain why creating a
      PostgreSQL statistics object also requires data collection. Compare the
      changed estimates and resulting choice after each isolated intervention.
      Account for analysis and planning costs and continuing maintenance. Assess
      predicate rewrites where they expose useful information, checking nulls,
      duplicates, type conversion and result equivalence before timing. Hand off
      index eligibility and candidate design to the index article, and scheduled
      maintenance procedures to operations.
  - title: The same statement can need different plans
    brief: >-
      Vary the shared query between a rare and a common parameter value, retaining
      the same SQL meaning, and compare PostgreSQL custom and generic prepared
      plans. Explain what information a planner can use with known versus unknown
      values, the planning-time trade-off, and why testing a literal query alone
      may miss the application's behaviour. Observe prepared execution in the
      actual session and preparation path, distinguishing server behaviour from
      driver decisions. Use versioned PREPARE and plan_cache_mode documentation to
      explain automatic selection, cached-plan reuse and documented replanning
      triggers; do not generalise these rules to every engine. Compare both
      parameter classes when testing a local plan-cache setting or preparation
      change, including planning overhead.
  - title: Know when a better estimate is not enough
    brief: >-
      Explain that the optimiser compares a bounded set of legal alternatives
      using an imperfect cost model; exact row estimates do not establish that
      every useful plan was considered or that the selected plan will be fastest.
      Relate unavailable access paths, query-shape boundaries and selected planning
      settings to a concrete hypothesis rather than surveying search algorithms.
      Use a scoped planner control only as an experiment to test an alternative;
      distinguish evidence that another choice helps from proof of the root cause.
      Require an explicit reason, scope and removal condition before retaining a
      control, and acknowledge its sensitivity to other parameters, data drift and
      engine changes. Close the shared case with the evidence supporting the remedy
      and reuse the parent's acceptance method for workload-level validation.
