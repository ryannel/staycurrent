original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational workload contention and capacity
  title: Improving performance under concurrent load
  brief: Teach how to distinguish expensive individual executions from queuing and shared-resource
    contention in a relational workload. Relate arrival rate, completed throughput, outstanding work
    and latency with stated assumptions, including what changes when the workload cannot keep up.
    Investigate CPU, memory, cache and storage pressure, temporary spills, lock waits, hot rows or
    pages and competing background maintenance using engine evidence. Evaluate concurrency limits,
    batching, workload scheduling, query and index changes, parallelism and targeted resource changes
    against tail latency and total completed work. Include the effect of long transactions on retained
    versions and maintenance, linking the storage and transaction explanations. Bound experiments
    and distinguish offered load from achieved throughput; leave service-wide monitoring, provisioning
    procedures and recovery to operations.
parent:
  topic: Relational execution and performance
  title: Understanding and improving database performance
  brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
    Build the necessary understanding of row and index storage, buffering, version retention, access
    paths, join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and
    observed plans without confusing their units or treating estimates as execution evidence. Connect
    query shape, indexes, physical layout, maintenance and resource contention to workload latency,
    throughput and capacity. Choose and validate changes with representative data and concurrency,
    including write and operational costs; deepen engine internals only where they explain a diagnosis
    or intervention.
  introducing_heading: A faster query can still make the workload slower
neighbouring_articles:
- topic: Relational physical storage and working sets
  title: How stored rows become physical work
  brief: 'Teach the physical storage model needed to diagnose relational workloads: pages, heap and
    clustered organisation, row locators, secondary indexes, wide and out-of-line values, caching
    and locality. Follow reads and updates far enough to explain page traffic, cache pressure, fragmentation,
    retained row versions and space reuse. Compare selected engine implementations only where their
    differences change a diagnosis or intervention. Explain how long-lived snapshots and maintenance
    progress affect the working set, and how physical partitioning and pruning can reduce or fail
    to reduce work. Make layout and maintenance trade-offs measurable, including the resource and
    locking costs of reorganising data; link operational procedures and transaction semantics rather
    than recreating them. Stop before storage engine implementation and distributed partitioning
    become independent goals.'
- topic: Designing and evaluating relational indexes
  title: Choosing indexes for a workload
  brief: Teach how to derive candidate indexes from predicates, joins, ordering, grouping and returned
    columns, then verify them against real plans and workload measurements. Build a usable B-tree
    model for equality, ranges, composite key order and ordered retrieval. Explain coverage and base-row
    access without assuming an index-only path avoids every table visit. Cover partial or filtered
    indexes, expression indexes, collation and type compatibility where they change eligibility;
    introduce other index families only for concrete relational access needs. Evaluate selectivity,
    data skew, redundant indexes and changing query mixes alongside write amplification, space, contention
    and maintenance. Separate an index's constraint role from its access role, and link live creation
    and removal procedures to schema evolution and operations. Avoid universal index recipes and
    exhaustive vendor catalogues.
- topic: Reading and diagnosing relational execution plans
  title: Following a query through its execution plan
  brief: Teach readers to obtain and interpret estimated and observed plans in a selected engine,
    with explicit warnings that execution-based inspection runs the statement and can have writes,
    locks and other effects. Follow access paths, nested-loop, hash and merge joins, sorts, aggregation,
    materialisation and parallel work through concrete queries. Explain row counts, loops, filters,
    fetches, memory and temporary spills, startup and total cost, timing and buffer or I/O evidence
    using the engine's actual reporting conventions. Distinguish per-loop from total figures, inclusive
    from exclusive time, instrumentation overhead and parallel overlap; never sum plan timings or
    compare arbitrary cost units as elapsed time. Recognise repeated work, large intermediates, early
    termination and late filtering. Connect the evidence to a testable intervention while preserving
    SQL results, and label illustrative plans separately from captured execution evidence.
- topic: Relational statistics and optimiser decisions
  title: Explaining and correcting plan choices
  brief: Build the practical model of cardinality estimates, statistics and cost comparison needed
    to investigate bad plans. Cover distributions, null fractions, distinct values, correlation,
    sampled or stale statistics and joins; demonstrate how estimation errors propagate into join
    order, access and resource choices. Teach how to locate the first consequential mismatch between
    estimates and observations, inspect relevant statistics and test targeted remedies. Include prepared
    statements, parameter-sensitive plans, plan caching and re-planning where the selected engine's
    behaviour affects a workload. Assess predicate rewrites, statistics changes and plan controls
    against correctness, data drift and different parameter classes. Explain optimisation boundaries
    without a catalogue of search algorithms or hints, and verify engine-specific behaviour against
    primary documentation.
boundary_notes:
- Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
  integration owns request retries, idempotency, deadlines and reconciliation. Link rather than repeat.
- Performance owns query/workload work and intervention validation; operations owns service signals,
  budgets, maintenance procedures and recovery. Link shared mechanisms.
