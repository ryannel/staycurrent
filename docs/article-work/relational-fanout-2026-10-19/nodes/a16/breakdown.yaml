topic: SQL window calculations
title: Calculating across related rows
brief: >-
  Teach window calculations as a way to compare and summarise related rows while
  retaining the required detail. Develop latest rows per entity, top items per
  group, shares of totals, running and moving totals, and changes from an earlier
  event using two small, hand-checked datasets. Distinguish input rows, partitions,
  ordering, peers and frames, and make ties, missing periods and filtering choices
  observable in expected results. Use a named PostgreSQL version for runnable
  examples, check consequential behaviour against its primary documentation, and
  identify dialect differences only when they change a reader's query or result.
  Assume the parent's basic query and staging workflow; link value semantics,
  aggregation and execution-cost diagnosis to their existing owners. Stop at
  reliable application and reporting calculations rather than a function catalogue
  or analytical specialism.
heading:
  - title: Decide what one result row represents
    brief: >-
      Start with a ledger containing entity, event identifier, timestamp and amount,
      and a small item-sales fixture with group, item, period and sales. Include tied
      timestamps, tied sales, a missing period and a null amount. State whether the
      query needs each event, each item-period or one winner per entity. Contrast
      retaining those rows with collapsing them through grouping, referring to the
      joins and aggregation article for establishing that input grain. Hand-calculate
      a small expected result before introducing the window syntax.
  - title: Separate the input, partition and two kinds of order
    brief: >-
      Annotate one OVER expression to distinguish the rows supplied by the query,
      PARTITION BY, window ORDER BY and the final query ORDER BY. Establish what
      makes rows peers under the chosen window ordering and why an event identifier
      can resolve an otherwise tied event sequence. Show the same calculated values
      displayed in a different final order. Explain windows over already-aggregated
      item-period rows without repeating the parent's grouping tutorial. Keep this a
      logical account of query meaning rather than a claim about physical execution.
  - title: Choose one latest row or preserve tied winners
    brief: >-
      Use the ledger to choose one latest event per entity with ROW_NUMBER and a
      stated timestamp and identifier ordering. Decide what latest means when the
      timestamp ties and whether the identifier is merely a repeatable selection
      rule. Reuse the sales fixture to compare a fixed number of items with all
      items tied at a rank, and show the different cutoff results from ROW_NUMBER,
      RANK and DENSE_RANK. Do not add an identifier to the business ranking order
      when that would destroy the intended ties; use a separate display ordering.
      State the null-ordering policy if the ordering key can be null.
  - title: Filter after the calculation when the question requires it
    brief: >-
      Complete the winner query by computing its window value in a derived table or
      CTE and filtering in the outer query. Use the staging technique already taught
      by the parent, concentrating here on the change in meaning. Contrast selecting
      the latest event and then checking its amount with selecting the latest event
      among amounts passing a condition. Show that restricting a report date range
      before a running calculation can remove history that its opening value needs.
      Mention QUALIFY only as a dialect-dependent spelling where supported, with
      the outer-query form as the worked baseline.
  - title: Keep a whole-group denominator for shares
    brief: >-
      Calculate each item's share of its group's total from the sales rows, choosing
      the intended group and period explicitly. Display numerator, denominator and
      expected share together. Contrast a whole-partition aggregate with an ordered
      aggregate whose frame can produce a running denominator. Require an explicit
      policy for zero totals and missing amounts, linking arithmetic and null
      semantics rather than repeating them. Check the sum of shares where the
      declared input and denominator make that a valid invariant.
  - title: Make running and moving frames explicit
    brief: >-
      Mark the rows contributing to a ledger running total, then compare an explicit
      ROWS frame with the default ordered aggregate frame at tied timestamps. Explain
      why the default can advance across peers together, and specify the ordering
      needed for an event-by-event total. Reuse the sales fixture to distinguish the
      last three recorded rows from an interval of time using a value-based RANGE
      frame. Check boundary inclusion, ties, partial opening frames and missing
      periods. Explain that a frame does not invent absent periods; when a report
      requires zero-filled calendar periods, prepare that input before calculating
      and link to joins and time semantics. Verify the chosen engine's RANGE offset
      types and ordering restrictions. Bound frame discussion to these tasks rather
      than touring every frame option.
  - title: Compare with the previous event or previous period
    brief: >-
      Use LAG on the ledger's defined event order to calculate an amount change.
      Show a first event with no predecessor, a predecessor whose amount is null,
      and an ordinary predecessor; use an additional predecessor identifier when the
      result must distinguish absence from a null value. Explain the difference
      between supplying a default for an absent row and replacing a present null.
      Reuse the missing-period sales example to show that the previous recorded row
      need not be the previous calendar period. Choose between event comparison and
      prepared calendar input according to the reporting question. Keep any
      IGNORE NULLS discussion tied to documented support in the named engine.
  - title: Check the calculation at its boundaries
    brief: >-
      Finish with a compact exercise reusing the fixtures: select tied top sellers,
      calculate their shares from the intended complete group, and report a moving
      value without losing required history. Ask the reader to identify input grain,
      partition, ordering, tie policy, frame and filtering stage before comparing
      expected rows and values. Check a singleton group, ties, a missing period,
      null values and a date-range boundary; vary insertion order to expose reliance
      on an incomplete ordering. Require explicit final output ordering for checked
      tables. Record the engine/version and primary documentation used for frames,
      ranking and predecessor behaviour. Successful result checks establish these
      examples' meaning; link performance analysis for their execution cost.
