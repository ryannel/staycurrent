original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal, not expertise in its own topic.
assignment:
  topic: Relational query composition and ORM behaviour
  title: Controlling the queries your application performs
  brief: Teach how to inspect and shape database work produced by handwritten SQL, query builders
    and ORMs. Diagnose N+1 reads, lazy loading, eager-loading row multiplication, implicit flushes
    and accidental transaction changes with captured statements and bounded examples. Choose projections,
    loading strategies, batching, pagination and streaming according to the access need, result semantics,
    round trips and memory limits. Preserve query parameterisation and authorisation through composition.
    Verify generated SQL and representative query-count and result bounds in tests; leave SQL language
    depth to the SQL branch and physical execution tuning to performance.
parent:
  topic: Relational application integration
  title: Building applications around a relational database
  brief: Follow an application request through its driver, connection, statements and transaction
    to the response and any external effects. Teach how to preserve values and authority at those
    boundaries, understand the SQL an abstraction performs, bound resource use and recover from failures
    with evidence about what completed. Build on the transaction article's correctness guarantees;
    deepen connection management, query composition, request recovery and external work only where
    their separate decisions need it.
  introducing_heading: Make the abstraction's database work visible
neighbouring_articles:
- topic: Relational connection and transaction lifecycle management
  title: Managing connections and transaction lifetimes
  brief: Teach how to acquire, use, clean up and release stateful database connections safely across
    request success, exceptions, cancellation and shutdown. Verify transaction-handle affinity, autocommit,
    session state, prepared statement and cursor lifetimes against the selected driver and any connection
    proxy or pooler. Diagnose leaks, idle transactions, slow consumers, stale connections and pool
    exhaustion using acquisition wait, occupancy, active database work and connection counts. Set
    bounded admission and acquisition limits; budget pools across application instances and background
    workers against database capacity rather than assuming a larger pool is faster. Cover streaming-result
    cleanup and reset or discard decisions without reteaching isolation or service capacity planning.
- topic: Relational request deadlines, retries and idempotency
  title: Recovering database requests safely
  brief: Design a bounded request lifecycle across pool acquisition, statements, transaction completion
    and response delivery. Verify what client timeouts, server limits, cancellation and connection
    loss establish about ongoing work and connection reuse. Classify retryable confirmed aborts,
    permanent errors and ambiguous outcomes; retry the complete logical transaction where required,
    within a shared deadline and bounded attempt budget. Build an idempotency record whose key scope,
    request fingerprint, concurrent claims, atomic business changes, stored result and retention
    match the operation's contract. Resolve unknown outcomes by authoritative lookup or reconciliation,
    including requests that overlap or outlive the original caller. Use fault tests around commit
    and response delivery; do not assume a timeout proves rollback or repeat the transaction branch's
    concurrency theory.
- topic: Relational background work and external effects
  title: Connecting transactions to background work and events
  brief: Teach how to coordinate committed relational state with external calls, background jobs
    and database-derived events. Compare direct calls, transactional job or outbox records, and change-data-capture
    publication by the failure windows each leaves. Design worker claims, leases, attempts, completion
    and abandoned-work recovery using the transaction branch's concurrency mechanisms. Handle repeated
    delivery and external outcomes with stable operation identities, receiver deduplication where
    available, and reconciliation where it is not. Explain ordering only within the scope a business
    rule needs. Establish event meaning and schema ownership, replay and retention requirements,
    and recovery from stalled publication or consumer progress loss. Treat database change capture
    behaviour as implementation-specific and keep broker internals and general distributed-systems
    protocols outside scope.
boundary_notes:
- Transactions establish guarantees and the abort-versus-unknown-outcome distinction; application
  integration owns request retries, idempotency, deadlines and reconciliation. Link rather than repeat.
- Performance owns query/workload work and intervention validation; operations owns service signals,
  budgets, maintenance procedures and recovery. Link shared mechanisms.
