topic: Relational schema invariants
title: Expressing rules with constraints
brief: >-
  Teach how to translate application invariants into database constraints and identify
  what remains outside their scope. Develop a booking schema through required values,
  candidate keys, tenant-scoped references, conditional uniqueness, mutually dependent
  rows and non-overlapping reservations. Make each example end with an enforcement
  decision and valid and invalid changes. Check the selected engine's null, timing and
  constraint capabilities; reshape the data where that makes a rule enforceable, and
  state the obligations of triggers or transaction protocols where it does not. Examine
  update and deletion actions and finish with an enforcement map and concurrency cases
  for the transactions branch. Leave value representation, transaction anomaly analysis
  and adding constraints to live data to their owning articles.
heading:
  - title: State the rule before choosing its constraint
    brief: >-
      Begin with the booking application's rule that a confirmed reservation belongs to
      an existing customer and resource in the same tenant and occupies a valid interval.
      Separate the rule into required facts, permitted values, identity, references and
      relationships between rows. State whether each rule applies to every stored row,
      a subset, a completed transaction or an application operation. Pair each intended
      rule with one accepted and one rejected change so enforcement has an observable
      meaning; application validation remains useful feedback but does not itself cover
      other writers.
  - title: Close the gaps in required values and identity
    brief: >-
      Use required booking fields and a tenant's external reservation reference to choose
      NOT NULL, CHECK, a primary key and additional candidate-key constraints. Show why a
      generated row identifier alone does not prevent a duplicate business fact. Test null
      separately from an out-of-range value and distinguish a default from a requirement.
      Specify which fields make up the business key, their tenant scope and the intended
      treatment of missing values, then verify the chosen engine's CHECK and uniqueness
      behaviour. Link to value representation for choosing types and comparison semantics
      rather than repeating that lesson.
  - title: Reference the whole relationship
    brief: >-
      Follow a booking whose tenant and resource identifiers are individually valid but
      describe different tenants. Derive a composite reference to an eligible referenced
      key and test inserts and changes on both sides. Make optional relationships explicit:
      decide what a partially missing composite reference means and check the engine's
      matching options or require the columns together. Distinguish a valid reference
      from a guarantee that every parent has a child. Use one generic type-and-identifier
      reference as a counterexample only if it helps show why reshaping a relationship
      can restore enforceable references.
  - title: Enforce uniqueness only where the rule applies
    brief: >-
      Extend the booking example with at most one current external reference per tenant,
      while retaining cancelled or historical records under an explicit policy. Translate
      the condition into the selected engine's supported mechanism, such as a partial
      unique index, and distinguish its role from a general unique constraint. Check
      whether the resulting key can be a foreign-key target rather than assuming all
      uniqueness mechanisms are interchangeable. Test activation, cancellation, replacement
      and null cases; if the engine cannot express the intended rule, compare reshaping
      current and historical facts with handing enforcement to a transaction protocol.
  - title: Decide when related changes must become valid
    brief: >-
      Use a booking and its required lead participant to expose the difference between
      a valid final state and a sequence whose intermediate states violate references.
      First ask whether changing relationship ownership or insertion order removes the
      cycle. Where deferral is justified, identify the specific constraints and operations
      the selected engine can defer, distinguish statement-time from transaction-end
      checking, and include a transaction whose final state still fails. Explain that
      deferring existing checks does not create an unstated rule such as every booking
      having a participant; model and enforce that requirement separately. Leave isolation
      and multi-session schedules to the transactions article.
  - title: Make reservation conflicts a stored rule where possible
    brief: >-
      Define the resource, tenant, applicable reservation states and interval boundaries
      for the rule that reservations must not overlap. Test adjacency, equal endpoints,
      invalid or missing bounds, resource changes and changes from a non-blocking state
      to a blocking state. Investigate a declarative range or temporal enforcement
      mechanism in the selected engine, checking version and capability rather than
      presenting it as portable SQL. Show the exact rule that mechanism guarantees and
      any supporting validation it needs. When unavailable, take the same invariant and
      cases to transaction design rather than replacing enforcement with an unchecked
      availability query. Leave the choice of historical time model to lifecycle design.
  - title: Choose what a referenced change is allowed to do
    brief: >-
      Walk the reference graph when a customer, resource or booking is updated or removed.
      Choose rejection, explicit reassignment, nulling an optional reference or cascading
      only after stating the business meaning and retention requirement. Test a chain
      with shared entities to expose how a cascade can remove more than the intended
      business object, and distinguish reference survival from permission to perform a
      deletion. Check the chosen engine's action and timing semantics, including any
      distinction between restricting a change and checking its final result. Link to
      lifecycle design for retention policy and operations for removal beyond live rows.
  - title: Account for rules the schema cannot express
    brief: >-
      Finish an enforcement map for the running schema: the invariant, enforcing object,
      allowed change paths, validation cases and any remaining transaction or application
      obligation. Use a total-capacity or minimum-child-count requirement to recognise a
      rule that the chosen declarative mechanisms do not cover. Compare reshaping the
      stored fact, a database trigger and an all-writers transaction protocol by the
      scope they protect and the maintenance and concurrency obligations they introduce;
      a trigger's database location is not itself a concurrency argument. Hand simultaneous
      duplicate creation, conflicting reservations, child insertion during parent deletion
      and mutually dependent changes to the transactions article with expected acceptable
      outcomes. Verify actual engine behaviour against primary documentation and recorded
      tests when writing; label illustrative change sequences accordingly. Send discovery
      of existing violations and live constraint deployment to schema evolution.
