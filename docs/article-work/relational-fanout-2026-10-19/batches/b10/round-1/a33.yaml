topic: Adopting PostgreSQL for an application
title: Checking a server choice with PostgreSQL
brief: Validate PostgreSQL as a shared database service for an application's stated requirements.
  Reuse the common relational design, SQL, transaction, integration, performance, evolution and operations
  evidence, adding only implementation and hosting checks that can change the adoption decision.
  Compare candidate deployments, record a verified starting configuration for the exact version and
  service tier, and finish with acceptance results, unresolved gaps and an owner for each obligation.
  This is a conditional candidate check, not a PostgreSQL curriculum.
heading:
  - title: Turn the shortlist into a checkable deployment
    brief: Start with the parent's requirements and rejection gates, then name the PostgreSQL version,
      hosting arrangement, topology, client driver and any required extensions. Draw the application,
      pooler, server and storage boundaries so connection ownership, resource limits and failure
      assumptions are explicit. Use one representative application path throughout; separate facts
      verified in documentation from behaviour observed in that deployment.
  - title: Verify the application contract
    brief: Run the common schema, query and correctness examples against the candidate through the
      intended driver. Check required SQL, data types, constraints, collation and time handling,
      transaction defaults, error reporting and extension availability where the application relies
      on them. Record version and service restrictions with evidence. Link the common transaction
      and integration explanations for guarantees, aborts, unknown outcomes and retry design; here
      establish whether the actual client and server contract passes those existing tests.
  - title: Check connections and transaction lifetimes
    brief: Connect PostgreSQL's server processes and connection consumption to the application's
      concurrency and memory budget. Check direct and pooled connections, including whether the proposed
      pooling mode supports the session features and transaction boundaries the application uses.
      Explain version retention and vacuum only far enough to show why long transactions and retained
      snapshots belong in the acceptance workload. Verify connection limits, queueing, transaction
      duration and timeout behaviour under that workload, reusing the integration and performance
      methods rather than opening another tuning course.
  - title: Establish the hosting and durability contract
    brief: Reuse the shared deployment responsibility table to compare self-managed and managed candidates.
      Verify configuration and privilege access, extension support, storage and commit-durability
      settings, maintenance and upgrade constraints, and the promised replication, failover, backup
      and restore behaviour. Relate acknowledgement and recovery promises to the application's loss
      and interruption tolerances; identify what needs a measured acceptance result. Link the common
      operations and evolution procedures and their restore or cutover evidence, asking here whether
      the candidate permits and satisfies them. Date service-tier claims and name obligations that
      remain with the application team.
  - title: Record a starting configuration and adoption decision
    brief: Assemble the exact server or service version, connection and pooling limits, relevant
      transaction and timeout defaults, durability choices, required extensions and access controls
      into a small reproducible configuration record with reasons and verification sources. Attach
      results from the representative workload and the common contention, disconnection, failover,
      restore and upgrade checks that the requirements demand. Label any local model, unexecuted
      check or service claim separately from observed results. Accept, reject or defer the candidate
      against the original gates; list unresolved evidence, owners and conditions for revisiting
      the decision. Keep detailed query tuning, schema change and recovery procedures with their
      existing articles.
