topic: Adopting a distributed relational system with CockroachDB
title: Checking a distributed choice with CockroachDB
brief: Decide whether a specific CockroachDB version and deployment meet an application's distributed
  relational requirements. Follow one regional order-reservation workload from its placement and
  transaction boundaries through compatibility, latency, contention and failure tests to a documented
  adoption or rejection. Establish a minimal topology and starting configuration, dated version and
  service-tier evidence, and the resource, network and operating cost of meeting the requirements.
  Reuse common transaction, application integration, evolution, performance and operations methods;
  explain distributed mechanisms only far enough to predict or interpret acceptance results. Illustrative
  traces explain hypotheses; only observed tests establish acceptance, and untested claims remain
  explicit gaps.
heading:
  - title: Name the requirement that needs distribution
    brief: Start with an order-reservation application whose users and data span regions. State its
      invariants, required read freshness, transaction boundaries, latency budgets by client location,
      permitted interruption and data loss, and any data residency obligations. Carry forward the
      parent's rejection gates and ask which requirement a simpler deployment fails. Distinguish
      placing application traffic, placing rows and surviving a failure; geographical presence alone
      establishes none of their contracts. Keep this a conditional candidate evaluation rather than
      a compulsory product lesson.
  - title: Turn the requirements into a minimal topology
    brief: Select the exact release, hosting arrangement and service tier before designing tests.
      Record supported regions, locality and survival controls, deployment minimums, scaling and
      configuration limits, maintenance responsibilities and contractual restrictions from dated
      primary documentation. Draw gateway locations, data ranges and their voting and non-voting
      replicas only to explain where an operation travels and which failures retain a quorum. Choose
      the smallest topology capable of testing the stated failure goal; distinguish an economical
      development cluster from evidence for the intended production topology.
    heading:
      - title: Place each transaction's data and work
        brief: Map regional customers, inventory and orders to the candidate's supported table and
          row locality choices. Verify actual replica and leaseholder placement rather than infer
          it from SQL connection location. Compare a local reservation with a transaction touching
          inventory in another region, including foreign-key checks, unique constraints, secondary
          indexes and joins where they change coordination. Use the paths to predict latency and
          detect hidden cross-region work. Check physical copies and backups against residency requirements
          rather than treating locality as a residency promise.
  - title: Check the application's actual SQL contract
    brief: Build a compact compatibility acceptance set from the real schema and access paths. Verify
      required types, constraints, expressions, SQL semantics, generated identifiers, isolation choices
      and schema-change facilities against the pinned release. Exercise the intended driver, ORM,
      protocol features, prepared statements and connection pool; PostgreSQL protocol support is
      an entry point for tests, not proof that PostgreSQL behaviour or extensions carry across. Record
      unsupported requirements, acceptable adaptations and their cost. Reuse the evolution branch's
      compatibility and rollout method to check representative schema jobs, restrictions and application
      coexistence without repeating the migration procedure.
  - title: Make the client contract survive coordination failures
    brief: Run the representative reservation transaction through the chosen driver's transaction
      handling. Verify the configured isolation and actual retryable abort and ambiguous-outcome
      signals for this release, including the boundary between database, driver and application retries.
      Use the transaction branch's correctness tests and integration branch's retry, deadline, idempotency
      and reconciliation methods to demonstrate that an abort or uncertain commit does not oversell
      inventory or duplicate a reservation. Test a disconnect around commit and a transaction whose
      deadline expires during contention. Explain coordination and contention only where they account
      for those outcomes; do not build another consensus or retry curriculum.
  - title: Measure locality and contention with production-shaped work
    brief: Apply the performance branch's workload method with realistic regional traffic, data volume,
      concurrency, connection behaviour and competing work. Compare local and cross-region transactions,
      shared hot inventory and dispersed inventory, measuring end-to-end latency distributions, completed
      throughput, retry rate and invariant violations. Count retry and queueing time inside the application
      deadline. Inspect query plans, distribution and service signals to distinguish coordination
      distance, hot keys, poor query shape and resource saturation. Test the smallest justified change
      and repeat the same acceptance case; do not substitute a local toy trace or a vendor benchmark
      for measured results.
  - title: Prove the named failures and recovery path
    brief: In an authorised disposable environment matching the required topology, exercise client
      or gateway loss, node loss and the stated zone or region failure. Include a network partition
      where it tests the requirement. Observe which operations remain available, interruption and
      tail latency, retry and uncertain outcomes, correctness of acknowledged work, and behaviour
      while capacity returns. Verify placement has converged before claiming the survival goal. Use
      operations' topology and restore procedures to gather evidence for backup availability, recoverable
      keys and a timed restore with application validation; replication and survival tests do not
      establish recovery from accidental deletion. Record provider restrictions and any failure case
      that cannot be tested as an acceptance gap, using contractual evidence without presenting it
      as execution.
  - title: Decide whether the measured contract is worth its cost
    brief: Complete one adoption record linking each requirement to its configuration, dated source,
      measured result, limitation and pass or rejection threshold. Include baseline and degraded
      capacity, replica and index storage, cross-region traffic, backups, maintenance and operator
      effort, plus the commercial and service-tier conditions required by the topology. State the
      verified starting configuration, unresolved gaps and reassessment triggers. Reuse the common
      restore and cutover evidence to check a practical exit route rather than teach it again. Adopt
      only when the distributed requirement, application contract, recovery evidence and total cost
      meet the gates; otherwise identify which requirement or candidate must change.
