topic: Relational value representation
title: Choosing types and representing missing values
brief: Choose representations that preserve a value's meaning, allowed states and useful operations
  across the database and application boundary. Develop a booking schema through prices, identifiers,
  customer text, reservation times and optional details, using concrete failures to justify each
  choice. Distinguish exactness from precision, identity from presentation, instants from local schedules,
  and missing information from empty values. Compare scalar columns, arrays, JSON, binary values,
  related rows and external payloads through validation, query and ownership requirements. Use selected,
  documented engine differences only when they change a decision. Leave SQL expression behaviour,
  constraint design, historical modelling and live migration procedures to their owning articles.
heading:
  - title: Start with what a value must preserve
    brief: 'Turn each booking field into a small representation contract: meaning, unit, valid range,
      required distinctions, equality, ordering and expected operations. Distinguish domain meaning
      from a storage type and from a formatted display. Show how a price without a currency and a
      booking time without a temporal meaning can both fit a column while failing the application.
      Use this contract throughout the article instead of presenting an exhaustive type catalogue.'
  - title: Choose numeric representations from the error you can accept
    brief: Compare fixed-width integers, exact decimal values and approximate floating-point values
      through prices, measured quantities and calculated estimates. Make range, scale, rounding points
      and acceptable error explicit; exact storage alone does not settle division or business rounding.
      Compare decimal amounts with integer minor units, retaining currency and allowing for currencies
      and quantities with different scales. Include overflow, fractional-unit loss and a value changed
      by a driver or serialisation layer as failure cases. Keep arithmetic and conversion expression
      semantics in the SQL-values article.
  - title: Preserve identity and define text equality
    brief: 'Distinguish identifiers from quantities: a telephone number or external code may need
      leading zeroes, punctuation or a namespace even when it contains digits. Compare integer, UUID
      and text representations by required range, accepted form, interchange and exact matching,
      leaving key generation and identity design to the parent. For customer names and booking codes,
      distinguish original spelling, display order, search matching and identity equality. Explain
      how encoding, Unicode normalisation, case and accent policies, collation and length limits
      affect those decisions. Use a compact documented engine comparison where text equality or trailing-space
      behaviour changes which codes count as duplicates; link uniqueness enforcement to constraints
      and expression behaviour to SQL values.'
  - title: Store the time the application actually means
    brief: Separate a calendar date, a local wall-clock time, an instant and an elapsed duration
      using a booking date, confirmation event and recurring opening schedule. Show why an offset
      and a named time zone answer different questions, why an instant alone cannot retain the intended
      local recurrence, and why a type name does not establish which zone information is preserved.
      For local schedules, retain the intended zone and define what happens at ambiguous or nonexistent
      clock times and after time-zone rule changes. Choose precision and application interchange
      deliberately. Verify selected timestamp and session-zone behaviour against engine documentation;
      leave date expressions and historical version modelling to their owning articles.
  - title: Represent missing information without inventing facts
    brief: Distinguish an unknown value, an inapplicable field, an absent relationship, an empty
      string or collection, and a known zero. Explain when one nullable column expresses the requirement
      and when an explicit state plus associated data is needed, such as an unprovided versus declined
      contact detail. Treat a default as a decision about omitted input, distinguishing omission
      from explicit null and checking engine behaviour. Show how sentinel dates and empty text can
      collapse meaningful states. Connect each design to required fields, comparisons and uniqueness,
      directing readers to SQL values for three-valued expressions and to constraints for enforceable
      valid combinations and engine-specific null uniqueness rules.
  - title: Choose the boundary of a structured value
    brief: Compare ordinary columns and related rows with an array or JSON booking-options value.
      Ask whether elements need independent identity, references, uniqueness, validation, frequent
      filtering or separate changes, and whether the enclosing row truly owns the whole value. Use
      one requirement change to show when an embedded value should become related rows; avoid another
      normalisation lesson. Distinguish a missing JSON property, JSON null and SQL null, and require
      an explicit shape and evolution policy for retained JSON. Briefly compare binary values with
      external payload references through size, database validation and query needs, access ownership
      and lifecycle consistency. Identify what cannot be made atomic across an external store and
      the database; link the recovery protocol and storage procedures to their owners instead of
      expanding them here.
  - title: Check representations at the application boundary
    brief: 'Review the completed booking fields against their representation contracts with a compact
      fixture table: a numeric boundary, a rounded amount, a leading-zero identifier, text variants,
      a daylight-saving transition, missing and empty values, and an older structured payload. Check
      accepted and rejected inputs, database round trips and application serialisation using the
      actual selected engine and driver. Record versions and settings for observed behaviour and
      distinguish documented expectations from executed checks. Finish with the remaining decisions
      to take to constraints, SQL expressions or live schema evolution; do not require specialist
      type or document-store study to complete an ordinary relational schema.'
