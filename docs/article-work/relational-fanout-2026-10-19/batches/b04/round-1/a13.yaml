topic: SQL expression semantics, missing values and time
title: Getting SQL values right
brief: Teach practitioners to recognise and repair plausible wrong answers caused by SQL expression
  semantics. Extend the parent's basic null example through missing-value logic, deliberate defaults,
  arithmetic, text comparison, conversions and time calculations. Use a compact booking-and-charge
  report with hand-checked expected values, PostgreSQL as the named reference engine, and documented
  dialect differences only where they change the result or the repair. Keep representation choices
  in schema design, aggregate and join semantics in their sibling, membership traps in query composition
  and driver conversion in application integration. Stop at the depth needed to write and verify
  ordinary relational queries; no function catalogue or specialist calendar branch is needed.
heading:
  - title: Start with the answer each expression must mean
    brief: Reuse a small booking-and-charge fixture to state what a missing charge, zero charge,
      discounted amount, customer label and reporting period mean. Give expected expression outputs
      and included row identifiers before SQL. Record the PostgreSQL version and relevant session
      settings for executable examples; distinguish predicted results from recorded execution. Link
      to representation design for why these columns have their chosen types, rather than reopening
      that choice here.
  - title: Follow unknown through a predicate
    brief: Extend the parent's IS NULL introduction by tracing TRUE, FALSE and UNKNOWN through comparison,
      NOT, AND and OR on the report's optional charge. Show why negating a comparison need not recover
      missing rows, and distinguish a predicate's value from WHERE's decision to retain a row. Build
      an explicit policy for including unknowns and use IS DISTINCT FROM or the named dialect's null-safe
      comparison where that policy calls for it. Keep null-sensitive membership and outer-join filtering
      with their sibling owners; do not repeat their query walkthroughs.
  - title: Make defaults and conditional results express the business rule
    brief: Use searched CASE to distinguish unknown, waived and charged amounts, then show when COALESCE
      legitimately supplies a fallback and when it destroys a distinction needed by the report. Treat
      empty text, zero and null separately. Explain compatible branch result types and guard a division
      with NULLIF or a suitable conditional expression. Verify the reference engine's evaluation
      rules and limitations before suggesting that a conditional expression safely guards an error;
      avoid portable promises about evaluation order or short-circuiting.
  - title: Check the arithmetic before trusting the amount
    brief: Follow an average charge or discount calculation through operand types, division, intermediate
      precision and the final rounded value. Use one counterexample each where integer division,
      approximate representation, rounding placement or an intermediate overflow changes the intended
      answer. Show why converting the operands before calculation can differ from converting the
      result, and why display rounding and a contractual money-rounding rule are different operations.
      Check negative values, zero denominators and boundary values against documented PostgreSQL
      semantics; mention another dialect only when a consequential difference would change the query.
      Leave storage-type selection to design.
  - title: Ask which text counts as equal or matching
    brief: Use a customer lookup to distinguish exact comparison, a declared case/accent comparison
      policy and pattern matching. Explain how operand type and collation affect comparison and ordering,
      using only the distinctions needed to explain differing answers in the example. Demonstrate
      the meaning and escaping of LIKE wildcards and a literal percent or underscore supplied as
      search data. Verify relevant Unicode, locale and trailing-space edge cases in the named engine
      and collation rather than promising universal behaviour. Leave index support and search-performance
      diagnosis to performance, and parameter binding to application integration.
  - title: Make conversions visible at the expression boundary
    brief: Compare a typed value with text input to expose type inference, implicit conversion and
      explicit casts. Show a parse failure, an ambiguous date input and a lossy numeric conversion;
      state which inputs the report accepts before choosing its conversion. Use unambiguous literals
      and explicit types where they clarify intent, recording session-dependent parsing settings.
      Verify which conversions fail, round or truncate in the chosen engine. Do not imply that a
      cast validates the business rule or that a preceding WHERE condition guarantees conversion
      evaluation order. Link driver-side conversion and validation to application integration rather
      than repeating it.
  - title: Calculate reporting boundaries in the intended clock
    brief: Start from the report's question to distinguish a date, a local date-time, an instant,
      a named time zone and an interval. Use a local business-day report to derive its two boundaries
      in the named zone and compare event instants with a half-open interval, including an event
      exactly at each boundary. Contrast a fixed UTC offset with the named zone's rules and distinguish
      displaying an instant locally from interpreting a local clock reading. Use a daylight-saving
      transition to expose nonexistent and repeated local times; verify the engine's resolution behaviour
      and make the application's ambiguity policy explicit. Keep schema storage choices and historical
      modelling in design.
  - title: Separate calendar movement from elapsed duration
    brief: Compare a booking moved to the same local time on the following day with a timeout or
      elapsed-hours calculation across the same daylight-saving boundary. Verify the named engine's
      interval arithmetic and month-end behaviour only as needed to explain those outcomes. Make
      the reference clock for a relative reporting period explicit, including PostgreSQL's documented
      transaction/statement/clock timestamp distinctions when they change a long-running report's
      answer. Avoid a general calendar or scheduling tutorial.
  - title: Keep a small regression fixture for value semantics
    brief: Close by repairing the original report and comparing its values and selected row identifiers
      with the declared expectations. Keep null and zero, a negative amount, a rounding boundary,
      literal wildcard text, invalid input and time-boundary cases, including the daylight-saving
      examples introduced above. Record engine version, collation, time zone, parsing settings, query
      and observed result beside the evidence. Use primary documentation to explain consequential
      behaviours and repeat the affected checks when changing engine or relevant settings. Passing
      these checks establishes only the tested result semantics; direct plan and workload questions
      to performance without a second testing tutorial.
