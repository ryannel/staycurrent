topic: Relational history and data lifecycle design
title: Modelling history and data lifecycles
brief: Teach how to choose among current-state rows, immutable snapshots, change records and effective-dated
  versions for concrete relational requirements. Distinguish when a fact applied from when the database
  recorded it, introducing both dimensions only when late information and corrections require them.
  Design version identity, historical references, interval boundaries and overlap rules so point-in-time
  questions have a defined answer. Compare status changes, tombstones, archival and deletion through
  their effects on references, uniqueness, reporting, retention and erasure. Bound the evidence that
  history rows provide and the removal achieved by deleting live rows; refer operational procedures
  and live lifecycle changes to their owning branches.
heading:
  - title: Start with the questions the past must answer
    brief: Extend the booking example with a changed customer address, an agreed price, a cancellation
      and a corrected room assignment. Ask separately what is true now, what was agreed at booking,
      what applied on a given date and what the system knew when it issued a report. Identify the
      question, owner and required retention before choosing a history pattern. Keep the simple current-state
      design where no historical answer is required.
  - title: Store the facts each question needs
    brief: Compare four representations against those questions, showing what an overwrite loses
      and what retaining a row still fails to explain. A schema may combine representations when
      they serve distinct requirements.
    heading:
      - title: Preserve an agreement with a snapshot
        brief: Preserve the address and price agreed for a booking independently of later customer
          or catalogue edits. Explain why this is a historical fact with its own meaning, rather
          than an accidentally stale current value. Choose the snapshot boundary and capture time;
          refer dependency reasoning and maintenance of derived copies to the normalisation article.
      - title: Record changes when the sequence matters
        brief: Contrast a row containing the current cancellation status with records of requested,
          confirmed and reversed changes. Define whether a change record captures an action, a before-and-after
          difference or a complete resulting state. Show the information needed to reconstruct a
          state and why timestamps alone need not establish an unambiguous change order. Do not expand
          into an event-sourcing architecture.
      - title: Use effective-dated versions for facts with a period of applicability
        brief: Model a room's capacity or a customer's contractual rate over time when questions
          concern which value applied during a period. Distinguish this requirement from merely keeping
          every overwritten row. Compare explicit applicability periods with a history of recorded
          changes without turning the comparison into a catalogue of temporal features.
  - title: Separate an entity from its versions
    brief: Give the enduring entity and each stored version clear identities. Decide whether a booking's
      reference means the current customer, a particular customer version or the customer details
      preserved in the agreement. Show how following a reference to today's row can change a historical
      report. Preserve tenant scope in entity and version references and in uniqueness; use the constraints
      article for enforcement mechanisms.
  - title: Define time boundaries and correction rules
    brief: Make a point-in-time answer precise before implementing it. Use a small timeline and expected
      query results; refer timestamp and time-zone representation to the value-representation article.
    heading:
      - title: Make each instant resolve to a defined version
        brief: Choose inclusive starts and exclusive ends, represent the current open end deliberately,
          and state whether gaps or overlaps are valid for this fact. Test the exact instant where
          one version gives way to another and a query spanning that boundary. Distinguish per-entity
          version overlap from the separate problem of conflicting bookings. State the required invariant
          and link to constraints and transactions for safe enforcement.
      - title: Add recorded time only when corrections require it
        brief: Use a rate change entered late to distinguish when the rate applied from when the
          database learned it. Compare a corrected account of a past date with reproducing the report
          issued before the correction. Introduce two time dimensions only when both answers are
          required, defining what a correction supersedes and which prior assertion remains queryable.
          Explain that an automatically maintained row history must be checked against these semantics
          rather than assumed to encode business time.
  - title: Decide what leaving the active set means
    brief: Compare cancelling a booking, marking a customer deleted, retaining a minimal tombstone,
      moving history to an archive and physically deleting rows. Choose from required behaviour rather
      than treating a deleted flag as a complete lifecycle policy.
    heading:
      - title: Follow references, uniqueness and reports through removal
        brief: State whether historical bookings remain meaningful after a customer leaves, which
          identifying details remain and whether a former identifier may be reused. Show how inactive
          rows affect uniqueness, joins and counts, and how forgetting the active-row condition exposes
          them to ordinary queries. Treat archival as a change in availability and access path, not
          proof of deletion. Refer constraint actions and conditional uniqueness to their owning
          article.
      - title: Specify retention and erasure beyond the row
        brief: Separate the design requirement to retain business evidence from the requirement to
          remove or minimise identifying data. Identify copies in history tables, snapshots, derived
          results, replicas, exports and backups; deleting a live row alone does not define their
          lifecycle. Produce a retention and removal requirement for operations to implement, including
          what a restore must do with previously removed data. Keep jurisdictional requirements explicit
          inputs and leave removal and restore procedures to operations and live schema changes to
          evolution.
  - title: Test what the history can truthfully establish
    brief: 'Walk one booking through creation, agreement, a later profile edit, a backdated correction,
      cancellation and eventual removal. Write expected answers for today''s view, the applicable
      past state and any required as-recorded report, including boundary instants and missing history.
      Inventory who can alter history and how changes are captured: stored history alone does not
      prove completeness, attribution or resistance to tampering. Hand access and audit requirements
      to security, concurrency cases to transactions and live conversion work to evolution. Finish
      with the smallest design that answers the agreed questions throughout the lifecycle.'
