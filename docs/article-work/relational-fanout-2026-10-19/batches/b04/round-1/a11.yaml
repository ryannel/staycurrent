topic: Relational normalisation and deliberate redundancy
title: Normalisation and deliberate redundancy
brief: Teach how to recognise facts with different dependencies, split their storage without losing
  meaning, and justify retaining a derived copy. Extend the booking design with candidate-key, partial-dependency,
  transitive-dependency and independent-set cases; introduce normal-form names only when they explain
  a consequential choice. Check both reconstruction and enforceability after a split. Compare repeated
  attributes, cached totals, summary tables and materialised results through their read benefit and
  maintenance contract. Finish with a defensible design and a falsifiable case for its redundancy,
  using the performance and transaction branches for detailed validation rather than expanding this
  into a theory or optimisation curriculum.
heading:
  - title: State what determines each fact
    brief: Start from the parent's booking schema and a service-line extension whose rows mix booking
      facts, service facts and quantities. Write dependencies as business rules about all permitted
      states, not coincidences in the current sample. Show the inconsistent update, missing insertion
      and destructive deletion that expose the mixed ownership before naming functional dependencies.
    heading:
      - title: Check every candidate key
        brief: Identify minimal unique combinations under explicit business assumptions, including
          tenant scope. Distinguish the selected primary key from other candidate keys. Show that
          adding a generated row identifier neither removes the original dependencies nor prevents
          inconsistent copies of a fact.
      - title: Separate a changing fact from a different fact
        brief: 'Briefly recall the parent''s distinction between a current service price and the
          price agreed for a booking: equal values need not express one fact. Establish which fact
          each dependency describes before proposing a split; refer historical representation and
          value semantics to their sibling articles.'
  - title: Split facts that depend on different keys
    brief: Decompose the service-line example into booking, service and booked-service relations.
      Explain why booking attributes depend on only the booking part of the composite key and service
      attributes on the service part, while a quantity belongs to their association. State the one-line-per-service
      assumption; if repeated lines are permitted, reconsider the key rather than force the example.
    heading:
      - title: Follow indirect dependencies
        brief: Extend the same case with a service category whose label is determined by category
          identity. Separate the category fact and trace a label correction through the resulting
          tables. Introduce partial and transitive dependencies, and second and third normal forms,
          as names for the reasoning just used; avoid treating every non-key dependency as the same
          case.
      - title: Handle overlapping candidate keys when they matter
        brief: Use one small counterexample where considering only the chosen primary key misses
          a dependency involving an alternative key. Introduce the stronger Boyce-Codd condition
          only to explain the remaining repetition and the choice of decomposition; omit a progression
          through formal proofs and algorithms.
  - title: Prove that the split preserves the relationships
    brief: Reconstruct the original facts by joining the proposed relations and compare them with
      a deliberately unsafe split that admits extra combinations. Explain lossless decomposition
      as preservation of permitted facts, not merely a match on one test dataset. Use the shared
      determinant in a simple binary split to make the reason visible, then carry the same reasoning
      through the staged split.
    heading:
      - title: Check what can still be enforced locally
        brief: 'Distinguish lossless reconstruction from dependency preservation. In the overlapping-key
          case, identify a rule that a proposed split can no longer check within one table. Make
          the tradeoff explicit: choose a useful design only after locating enforcement of every
          required rule. Link constraint mechanisms and concurrent enforcement to their owning articles.'
  - title: Separate independent sets without inventing combinations
    brief: Give a venue independently recorded facilities and supported languages. Show why storing
      every facility-language combination repeats two independent sets, and why separate venue-facility
      and venue-language relations retain their meaning. Introduce a multivalued dependency and fourth
      normal form only to explain this decision, including how to represent a venue with an empty
      set.
    heading:
      - title: Keep combinations that are themselves facts
        brief: Change the requirement so a language is available only for particular services or
          facilities. Demonstrate the false availability implied by projecting and rejoining independent
          sets, and retain the actual association instead. Derive independence from the requirement
          rather than a visual pattern in sample rows. Stop here without a higher-normal-form survey.
  - title: Decide which repeated results are worth storing
    brief: Compare computing a booking total from source lines with storing that total; then use
      short variations for a repeated current attribute, a summary table and a materialised query
      result. Separate an ordinary view from stored results and an agreed historical value from a
      derived current copy. Explain that joins alone do not establish a performance problem and a
      stored result moves work into updates, refreshes and recovery.
    heading:
      - title: Measure the decision against the workload
        brief: Require a concrete expensive read, a representative workload and a target before accepting
          redundancy. Compare the measured benefit with extra writes, contention, storage, refresh
          work and acceptable staleness; include simpler query or index alternatives without teaching
          their implementation. Hand query plans, benchmark design and intervention validation to
          performance.
  - title: Give every derived copy a maintenance contract
    brief: 'Complete a contract for the stored booking total: authoritative source facts, included
      statuses and calculation rule, freshness visible to readers, owner of updates, concurrency
      protection and a repair or rebuild path. Cover inserts, corrections, cancellations, deletions
      and every writer that can affect the result. Require the same answers for the other forms of
      stored result.'
    heading:
      - title: Choose atomic maintenance or explicit lag
        brief: Contrast changing the total with source rows in one transaction against rebuilding
          or refreshing it later. Show a small two-writer schedule that loses a total update, and
          identify the guarantee the chosen maintenance strategy must provide. For asynchronous maintenance,
          state how omissions, repeated work and out-of-order changes are detected or made harmless;
          link protocol design and request recovery to transactions and application integration instead
          of supplying parallel tutorials.
      - title: Make drift detectable and rebuilding safe
        brief: Define a source-based comparison, a consistent input boundary and a rule for including
          changes that arrive during a rebuild. Decide when readers may use the replacement and what
          happens when repair fails. A rebuildable copy remains derived; a value that cannot be recovered
          from the alleged source requires revisiting the source-of-truth decision. Refer live rollout
          procedures and operational scheduling to their owning branches.
  - title: Defend the design with changes and counterexamples
    brief: 'Finish with a compact review of the worked schema: identify keys and dependencies, demonstrate
      reconstruction without extra combinations, account for independent and correlated sets, and
      locate enforcement for each rule. Exercise one correction, one deletion and competing total
      updates; specify the promised reader result and recovery after an interrupted refresh. Retain
      a redundant result only with its maintenance contract and measured benefit. Distinguish paper
      reasoning, illustrative schedules and any later engine execution evidence; do not claim these
      design checks establish performance or concurrent correctness on their own.'
