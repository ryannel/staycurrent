topic: Safe relational schema changes
title: Changing schemas without breaking applications
brief: Turn an intended schema change into an executable, interruptible procedure with measured limits
  on production impact. Use PostgreSQL 18 as the worked engine, pinning the exact server and migration-tool
  versions before writing runnable examples. Reuse the parent's application-compatibility sequence
  and concentrate on locks, queued work, scans, rewrites, dependencies and deployment restrictions.
  Develop staged constraint validation and a large column-type change, then use a compact operation
  table to cover related column, index and table changes. Give every stage preconditions, transaction
  boundaries, completion evidence and a response to failure. Link the data-job and operations owners
  for their procedures; do not create a separate article for each DDL command or engine.
heading:
  - title: Describe the physical change before scheduling it
    brief: Begin with an orders table whose amount column needs a wider representation and whose
      future writes must obey a new rule. Carry forward the parent's compatibility contract, authoritative
      representation and retirement gate. Inventory table size, dependencies, indexes, partitions,
      triggers, readers, writers and replicas. Build an operation table for adding a column or default,
      altering a type, adding a constraint, building an index, and renaming or dropping a table.
      For each exact form identify metadata work, validation scans, physical rewrites, lock requirements
      and remaining storage work; do not infer cost from statement length or an online label. Use
      the table to choose a short bounded pause or a staged change.
  - title: Keep a waiting schema change from stopping the workload
    brief: 'Follow three sessions: an existing transaction holds a conflicting lock, the schema statement
      waits, and later application work queues behind it. Teach how to inspect blockers, transaction
      age and queued requests using the selected engine''s lock and activity views. Separate time
      waiting for a lock from time executing and from time holding locks before commit. Choose lock
      and statement timeouts, a cancellation owner and retry conditions from the service''s interruption
      budget. Rehearse cancellation during waiting and execution, including the need to end a failed
      transaction and check what locks or work remain. Link transaction semantics and incident handling.'
  - title: Make the migration runner's boundaries visible
    brief: 'Show the actual command sequence and migration record produced by one versioned runner.
      Establish which statements it wraps in a transaction, which must run separately, how sessions
      inherit timeouts, and how it prevents two runners from applying the same change. Check engine-specific
      DDL atomicity, concurrent-operation restrictions and deployment privileges against documentation
      and a disposable rehearsal. Include a lost connection after submitting DDL: inspect server
      state, catalogue state and the runner''s history before deciding whether to resume, repair
      the record or rerun. A successful migration-history entry is evidence about the runner, not
      the complete application or database postcondition.'
  - title: Enforce new writes before validating old rows
    brief: Work a new orders CHECK constraint through the selected engine's staged enforcement and
      validation facilities. Show exactly when new inserts and updates must satisfy the rule, which
      historical rows remain unchecked and what validation must prove. Deliberately include an invalid
      old row and a concurrent invalid write. Repair historical violations using the neighbouring
      data-job procedure, then validate and inspect the resulting constraint state. Record locks
      and concurrent-work behaviour at each step, and show recovery after interrupted or failed validation.
      Contrast foreign-key and not-null deployment only where their supported forms or dependencies
      change this procedure; do not generalise staged validation to every constraint.
  - title: Build a required index through failure and completion
    brief: Compare an ordinary build with the selected engine's concurrent build using the operation
      table's workload and interruption requirements. Follow its phases, waits and resource demand,
      including its transaction restrictions. Force one interrupted build and one uniqueness failure,
      inspect whether an invalid or incomplete index remains and explain its operational consequences
      before choosing cleanup or another attempt. When the change requires a uniqueness constraint,
      distinguish building a usable eligible index from attaching the final constraint. Prove validity
      and intended constraint ownership; use the index and performance articles for index selection
      and query-benefit assessment.
  - title: Change a large representation in recoverable stages
    brief: Develop the amount-column type change into a complete physical procedure. First rehearse
      a direct conversion and measure its locking, rewrite, disk and logging costs, conversion failures
      and dependency effects. If those exceed the chosen budget, use a replacement column with explicit
      conversion semantics and reuse the parent's concurrent-write authority protocol and the neighbouring
      article's resumable backfill. Show the schema statements that create the new representation,
      prepare its constraints and indexes, and switch dependent views, functions or other consumers.
      Verify foreign-key, trigger and generated-value dependencies where present. Define a stable
      reconciliation gate before switching reads, and a safe interruption response at each stage.
      Do not treat a rename as proof that every dependency now uses the intended representation.
  - title: Rehearse the production impact and set stop conditions
    brief: Run the two procedures with representative data volume, long transactions and sustained
      concurrent reads and writes. Capture lock waits, request latency and errors, free space, logging
      volume and replica delay against explicit continuation and cancellation limits. Identify which
      replication arrangement carries schema changes and what must be coordinated separately; link
      operations for steady-state replication and recovery. Include an interrupted stage and a repeated
      invocation so the rehearsal proves the proposed recovery path. Record expected versus observed
      results, server and runner versions and deployment differences. Use PostgreSQL 18 ALTER TABLE,
      CREATE INDEX and relevant locking and replication documentation as primary references, including
      https://www.postgresql.org/docs/18/sql-altertable.html and https://www.postgresql.org/docs/18/sql-createindex.html.
  - title: Close the change with evidence and deliberate cleanup
    brief: Produce a completed change record connecting desired schema and application behaviour
      to observed catalogue definitions, validated constraints, valid indexes, representative workload
      checks and replica state. Distinguish a cancelled transaction from a committed earlier stage
      or an uncertain client outcome. List concrete cleanup for invalid indexes, temporary constraints,
      replacement columns and obsolete tables, retaining old representations until the parent's compatibility
      and retirement gates permit removal. Before a table rename or drop, inspect database dependencies
      and application or job references that catalogues cannot reveal; avoid using cascading removal
      as a substitute for that inventory. State which steps can be reversed directly and which need
      a forward repair or the existing recovery procedure to preserve writes accepted since the change.
