topic: Choosing relational systems and deployments
title: Choosing a relational database
brief: Teach how to select and validate a relational engine and deployment for a concrete application.
  Turn workload, correctness, latency, availability, locality, operational capacity and total cost
  into explicit requirements and rejection tests. Compare representative embedded, server and distributed
  relational choices through the mechanisms that change those tests, including managed service restrictions
  and responsibilities. Finish with a realistic evaluation and a documented adoption decision. Use
  neighbouring storage families only to establish suitability; use implementation follow-ups to check
  a candidate's actual contract rather than to build a vendor catalogue.
heading:
  - title: Begin with the application's promises
    brief: Follow an ordinary application from its facts and critical reads and changes to a short
      selection brief. Record invariants and transaction boundaries, dataset size and growth, skew,
      concurrency, latency percentiles, burst shape, availability, acceptable data loss, recovery
      time and location requirements. Separate measured needs, forecast needs and negotiable preferences.
      Make each hard requirement testable and explain why an engine name is not yet a design.
  - title: Establish whether a relational system fits
    brief: Use relationships, integrity rules, transactional changes and changing query needs to
      explain the relational fit. Identify cases where access patterns, data volume or specialised
      search and analytical needs merit a neighbouring storage family or a separate derived system.
      Account for synchronisation, recovery and operational costs before adding another store; keep
      the detailed design of those families outside this article.
  - title: Choose the process and failure boundary
    brief: Compare an embedded library, a database service and a distributed relational service by
      who owns the data files, where requests execute, how writers coordinate, which network paths
      enter latency and which failures affect reads and commits. Explain that an engine, a topology
      and a hosting arrangement are separate choices. Use SQLite, PostgreSQL and CockroachDB as concrete
      representatives, with other candidates introduced only when a required capability makes them
      relevant. Do not infer identical SQL semantics, transaction guarantees or capacity from the
      relational label.
    heading:
      - title: When the database lives with the application
        brief: Introduce the attraction and boundaries of an embedded relational engine through application
          ownership, concurrent writers, file placement, deployment and backup needs. Establish the
          tests that decide whether the embedded arrangement serves this application before introducing
          SQLite's concrete adoption checks.
        nested_article:
          topic: Adopting SQLite for an application
          title: Checking an embedded choice with SQLite
          brief: Teach the implementation knowledge needed to decide whether and how to adopt SQLite
            for a concrete application. Trace connections and transactions to file ownership and
            writer coordination; verify journal modes, busy handling, reader lifetimes, durability
            settings and filesystem assumptions against the intended deployment. Check typing, constraints,
            connection settings and required SQL behaviour with small examples. Establish safe backup,
            restore and deployment checks, and test representative contention and failure cases.
            Link general transaction, integration, performance and recovery methods rather than repeat
            them; stop at a defensible adoption decision rather than an SQLite internals curriculum.
      - title: When applications share a database service
        brief: Introduce the service boundary, connection and resource limits, primary write placement,
          replica read semantics and operating responsibilities that distinguish a server deployment.
          Show how requirements produce a shortlist among PostgreSQL, MySQL and other server engines
          without ranking them universally. Use PostgreSQL for a concrete verification path, and
          require dialect and guarantee checks when choosing another engine.
        nested_article:
          topic: Adopting PostgreSQL for an application
          title: Checking a server choice with PostgreSQL
          brief: Teach the concrete implementation checks needed to adopt PostgreSQL and select a
            suitable deployment. Connect the server's process, connection, transaction, version-retention
            and durability behaviour to application and operational requirements, deepening mechanisms
            only where they change adoption. Verify required SQL, types, constraints, driver behaviour
            and extension support. Compare self-managed and managed candidates through configuration
            access, pooling, maintenance, upgrades, replication, backup and restore contracts. Produce
            a verified starting configuration and acceptance evidence for the chosen version and
            service; refer to the neighbouring articles for detailed design, tuning, migrations and
            recovery work.
      - title: When data and writes must span machines or regions
        brief: Derive the need for a distributed relational candidate from requirements that a simpler
          deployment cannot satisfy. Compare transaction placement, coordination latency, locality,
          failure handling and operational cost against those needs. Introduce a concrete CockroachDB
          evaluation while keeping a general distributed-systems curriculum outside the commission.
        nested_article:
          topic: Adopting a distributed relational system with CockroachDB
          title: Checking a distributed choice with CockroachDB
          brief: Teach the concrete checks needed to decide whether CockroachDB meets an application's
            distributed relational requirements. Connect data and replica placement, transaction
            coordination, contention, locality and node or region loss to observed latency and correctness
            tests. Verify SQL and protocol compatibility, supported constraints and data types, retry
            and ambiguous-outcome behaviour, schema-change facilities and deployment limits against
            the intended version and service tier. Establish a minimal topology, acceptance workload
            and recovery evidence, accounting for resource and network cost. Use the common transaction,
            integration, evolution and operations branches for their methods; teach distributed mechanisms
            only where they enable an adoption decision or explain a failed test.
  - title: Compare the deployment contract and its full cost
    brief: Build a responsibility table for application team, database operator and provider. Verify
      service limits, supported versions, extensions, privileges, connection and storage limits,
      maintenance windows, upgrades, data location, network access, encryption, audit needs, backup
      retention, restore granularity and failover behaviour. Separate availability promises from
      tested recovery capability. Compare realistic compute, memory, storage, I/O, replicas, transfer,
      licensing, support and engineering effort, including idle and burst costs. Treat product terms
      and service-tier behaviour as dated evidence.
  - title: Test the candidates against the same application
    brief: Turn hard requirements into pass-or-fail gates and trade-offs into a small decision table.
      Use representative schema, realistic data distribution and growth, production-shaped queries
      and concurrent changes, and the actual driver and network path. Verify results and invariants
      before measuring steady and burst latency, throughput, resource use and cost. Include slow
      clients, connection pressure, contention and required failure, failover and backup-restore
      exercises. Record version, configuration, dataset, observations, uncertainty and untested cases;
      distinguish illustrative models from execution evidence and marketing benchmarks from this
      workload. Draw on the performance and operations branches for the detailed procedures.
  - title: Make the choice reversible enough to live with
    brief: Write a decision record naming the candidate, deployment, acceptance evidence, rejected
      alternatives, unresolved risks and the conditions that would reopen the choice. Check ecosystem
      maturity, driver and tooling support, staff skills and support arrangements. Make portability
      concrete by inventorying dialect, data types, extensions, operational dependencies, export
      access and migration downtime; demonstrate a small export and re-import where an exit requirement
      matters. Establish a staged adoption and verification plan, with explicit stop criteria, before
      committing critical data. Link live migration procedures to the evolution article.
