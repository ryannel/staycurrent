topic: Relational schema and data evolution
title: Changing a live database
brief: Teach engineers to change schemas, stored data and database locations while applications continue
  to run. Use a change to an order system to connect application compatibility, physical database
  work, concurrent writes, verification and recovery. Give every change an explicit sequence, measurable
  completion conditions and a safe response to interruption. Introduce deeper procedures for schema
  changes, data jobs and database moves only where they enable reliable relational practice. Treat
  retention and deletion as changes to the guarantees readers and recovery procedures can rely on.
  Check concrete procedures against the selected engine, version and deployment.
heading:
  - title: A change has more than one finish line
    brief: Start with an order system replacing a free-text delivery address with a structured address.
      Separate deploying code, making the schema usable, converting existing rows, switching readers
      and retiring the old representation. State the invariant that must hold through the transition,
      the applications and jobs using each representation, and the evidence needed before advancing.
      Distinguish schema migration records from proof that the whole change is complete.
  - title: Keep old and new applications compatible
    brief: Draw the successive application and schema versions, including overlapping deployments,
      background jobs and delayed clients. Work through adding the new representation, populating
      it, switching reads and removing the old one. Make concurrent writes and the authoritative
      representation explicit; dual writing alone is not a consistency argument. Explain when a short
      coordinated maintenance window costs less and provides clearer guarantees than a long compatibility
      period. Link transaction and application integration guidance for atomic writes and request-level
      retry behaviour.
  - title: Find out what the database must do
    brief: Translate the proposed change into catalogue work, scans, validation, index construction,
      row movement or copying as applicable to the chosen engine. Explain why an online label does
      not establish a safe lock wait, resource cost or failure path. Inventory dependent views, constraints,
      indexes, generated values, prepared statements and replication consumers. Establish lock and
      execution limits, storage headroom, workload budgets and abort criteria using a representative
      rehearsal and verified engine behaviour. Link performance diagnosis and operational monitoring
      rather than repeat their general methods.
    nested_article:
      topic: Safe relational schema changes
      title: Changing schemas without breaking applications
      brief: Develop executable schema-change procedures for representative column, type, constraint,
        index and table changes on a selected relational engine. Follow lock acquisition and queued
        work, scans and physical rewrites, dependencies and replication effects. Work through staged
        validation of a new constraint and a large structural change, including concurrent writes,
        failed or partially completed operations and cleanup. Verify transaction boundaries, online-operation
        restrictions and tool behaviour against the engine and version. Rehearse with realistic data
        and concurrency, choose timeouts and cancellation conditions, and define evidence for completion.
        Keep specialist engine internals subordinate to selecting and executing a safe change.
  - title: Move existing data while writes continue
    brief: 'Show why deploying a new column leaves existing rows unfinished and why one large update
      may exceed an acceptable transaction or workload budget. Introduce bounded batches, durable
      progress, restart safety and explicit ownership of concurrent changes. Distinguish a backfill
      from an import or correction: each needs an input contract, duplicate policy, error handling
      and reconciliation. Require a concrete meaning of complete, including rows created or changed
      during the job.'
    nested_article:
      topic: Relational backfills, imports and corrections
      title: Running reliable data changes
      brief: Teach how to design and operate resumable, idempotent data jobs for backfills, external
        imports and production corrections. Start with an explicit transformation, source identity,
        invariants and treatment of invalid or duplicate records. Use staging where it enables validation
        before changing live rows. Develop batch boundaries and checkpoints that do not silently
        omit moving data, conditional updates or another verified concurrency protocol, and safe
        recovery after an uncertain batch outcome. Handle dependencies, triggers, generated values,
        referential order and application side effects. Bound locks, transaction size, logging and
        replica lag; throttle using observed workload impact. Reconcile source and destination with
        checks that expose missing, duplicate and semantically incorrect data, then record completion
        and cleanup. Link request retry and transaction theory rather than rebuild them here.
  - title: Switch traffic only when the destination is ready
    brief: Extend the same staged-change reasoning to moving a database. Separate copying existing
      data, carrying later changes, validating the destination and transferring write authority.
      Explain that a replica caught up at one instant is not yet a complete cutover argument. Introduce
      readiness gates for data, application behaviour, connections, permissions and performance,
      and an explicit treatment of writes during the switch. Link replication and recovery mechanisms
      to the operations branch.
    nested_article:
      topic: Moving a relational database
      title: Moving databases with a controlled cutover
      brief: Teach how to move a relational workload between instances, deployments or engines using
        a tested copy, change-capture and cutover procedure, or a simpler bounded write pause when
        appropriate. Assess schema, type, collation, time, identity, sequence, extension and query-semantic
        compatibility where these affect the actual move. Establish a consistent starting copy, an
        explicit boundary for subsequent changes, and verified handling of DDL and replication limitations.
        Reconcile data and rehearse application behaviour, capacity and permissions. Define write
        authority, drain or fence writers, handle connection pools and delayed jobs, and prove that
        the final change boundary has arrived before enabling destination writes. Set cutover and
        abort gates; explain why accepting new writes can make a return to the source require reverse
        synchronisation or another migration. Keep steady-state replication, failover and backup
        administration in the operations branch.
  - title: Plan recovery before the first irreversible step
    brief: Label each stage as safely retryable, reversible with preserved data, or requiring compensation
      or restoration. Distinguish rolling back a code deployment, reversing a schema operation and
      undoing its data effects; identify the point at which old code can no longer run. Assign ownership
      and observable stop conditions, retain the evidence needed to resume, and decide how to handle
      partial success. Explain how a correction can reverse a transformation only when enough original
      information survives. Link tested backup restoration and point-in-time recovery procedures,
      including their effect on intervening valid writes, to operations.
  - title: Retire old data and prove the change is finished
    brief: 'Require evidence that old readers and writers have disappeared, the new invariant holds
      and the workload is stable before removing compatibility paths, columns, staging tables or
      migration machinery. Apply this to a retention change: define which records become eligible,
      what related and derived data must change, and how deletion reaches replicas, exports and backup
      expiry under the actual service guarantees. Distinguish removing rows from immediately reclaiming
      space or eliminating every recoverable copy. Plan bounded deletion work and restoration procedures
      that do not silently reintroduce retired data. Finish the running example with a concise change
      record containing validation results, remaining recovery options and the final ownership of
      the data.'
