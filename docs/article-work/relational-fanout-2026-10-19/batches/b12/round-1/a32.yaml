topic: Adopting SQLite for an application
title: Checking an embedded choice with SQLite
brief: Decide whether SQLite can meet one application's relational requirements in its intended deployment.
  Trace file ownership, connections and transactions to writer contention, durability and recovery
  obligations; verify the actual library, driver and settings with small acceptance cases. Produce
  a defensible adoption decision and starting configuration. Reuse the common transaction, integration,
  performance and operations methods rather than teach them again; this is an optional candidate
  check, not a SQLite internals curriculum.
heading:
  - title: Put the database file in the deployment diagram
    brief: Start with a concrete application, such as a single-host service whose web workers and
      background job share a local database. Mark who opens the file, owns its storage, writes concurrently
      and can recover it after host loss. Compare that intended arrangement with requirements already
      established in Choosing a relational database; reject it early if ownership, independent host
      access or recovery expectations do not fit.
    heading:
      - title: Verify the library the application actually loads
        brief: Record SQLite and driver versions, relevant build options, required extensions and
          connection/threading restrictions. Distinguish the library used by the running application
          from an installed command-line tool. Make support for required SQL and deployment platforms
          a testable acceptance condition rather than infer it from the SQLite name.
      - title: Check the storage and access boundary
        brief: Inspect local versus network storage, locking and sync behaviour, directory permissions,
          journal sidecars, container volumes and restart persistence. Explain WAL's same-host requirement
          where it rules out a deployment. Establish that access to the process and files defines
          the security boundary; link the security article for the wider protection and recovery
          obligations.
  - title: Observe two connections competing for a write
    brief: Use a small, explicitly scheduled two-connection example to show one transaction holding
      writer access while another waits or fails. Relate this to actual transaction duration and
      simultaneous writers rather than infer suitability from database size or request count. Link
      Transactions for isolation guarantees and application integration for retry policy.
    heading:
      - title: Choose when a transaction asks to write
        brief: Compare a deferred read-then-write transaction with BEGIN IMMEDIATE; inspect driver
          autocommit and implicit transaction behaviour. Explain busy and stale-snapshot outcomes
          only far enough to decide whether the transaction must restart and where its boundary belongs.
          Configure bounded busy handling, and test its actual behaviour instead of treating a timeout
          as a guarantee that every failed write will eventually run.
      - title: Keep reader and writer lifetimes visible
        brief: Check when statements, cursors and transactions release their resources, including
          slow response streaming and background work. Connect a long writer to queueing and a long
          WAL reader to checkpoint progress and log growth. Measure representative overlap with multiple
          connections and processes where the deployment uses them; leave general workload tuning
          and request deadlines to their existing owners.
  - title: Choose a journal and durability contract
    brief: Compare rollback journalling and WAL through the reader/writer interactions that affect
      this application. Explain checkpointing only as the movement that permits WAL reuse and introduces
      operational work. Verify supported journal and synchronous settings against SQLite's documentation,
      the driver and the actual filesystem; do not present WAL as an automatic improvement.
    heading:
      - title: State what a successful commit must survive
        brief: Separate application-process failure, operating-system failure and power loss. Connect
          the chosen journal/synchronous combination and storage sync assumptions to the required
          acknowledged-write survival, checkpoint work and latency. Read settings back at their documented
          scope, distinguishing persistent database settings from per-connection initialisation.
          Reuse Making concurrent changes correct for transaction durability and Backing up and restoring
          relational data and Running a relational service for service recovery.
  - title: Prove the application's data contract on SQLite
    brief: Run a small schema and the application's critical statements through its actual driver.
      Verify foreign-key enforcement on every new connection, expected NOT NULL, CHECK and uniqueness
      behaviour, and the chosen use of STRICT tables or flexible typing. Include both accepted and
      rejected values so successful insertion alone cannot stand in for constraint validation.
    heading:
      - title: Check representations at the driver boundary
        brief: Test integer ranges, exact money representation, timestamps, NULLs, collations and
          parameter/result conversions where this application uses them. Check required SQL and schema-change
          support against the loaded version. Reuse the schema, query and evolution articles for
          their design methods; show only differences that could accept or disqualify SQLite.
  - title: Rehearse a recoverable deployment
    brief: Apply the shared restoration method to SQLite's files and APIs. Select a supported consistent
      backup mechanism, such as the online backup API, and explain why copying a changing main file
      does not establish a valid backup. Restore independently and validate application invariants
      and measured recovery time. Check recovery copies survive the host or volume failure in the
      application's requirement; a local copy alone cannot demonstrate that.
    heading:
      - title: Verify restarts, upgrades and interrupted work
        brief: Rehearse deployment with persistent data, permission checks, connection initialisation
          and a controlled schema change. Test process termination, lock contention and disposable
          disk-full or I/O-failure cases supported by the test environment. Record error and restart
          behaviour without mistaking a killed process for a power-loss test. Link operations and
          evolution for full recovery and cutover procedures.
  - title: Make the adoption decision from acceptance evidence
    brief: Collect the deployment diagram, library/driver versions, verified settings, data-contract
      results, contention latency and error rates, and restoration evidence against the original
      rejection gates. Mark every result as observed, documented or still assumed, with dates and
      links to primary SQLite and driver documentation. Accept with explicit limits or reject the
      candidate; identify the workload or deployment change that would trigger reevaluation and reuse
      the database-move article for an eventual exit. Do not expand failed gates into new SQLite
      specialist branches.
