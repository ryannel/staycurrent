topic: Relational backups and tested restoration
title: Backing up and restoring relational data
brief: Teach relational practitioners to choose recovery copies for named loss cases and prove that
  they can restore correct data within the required time and loss bounds. Follow one accidental-deletion
  case from backup selection through an isolated restoration and a controlled return to service,
  contrasting complete service loss where the procedure changes. Develop consistency, dependencies,
  retention, independent access, full and point-in-time restoration, selective recovery and measured
  validation. This is the shared restore procedure used by incidents, database moves and adoption
  checks; leave incident command, replica promotion, application reconciliation mechanics and migration
  design to their owners. Check executable procedures against the selected engine and service, and
  distinguish rehearsed results from intended recovery.
heading:
  - title: Start with the loss you must recover from
    brief: 'Turn the parent''s recovery requirements into concrete cases: lost service storage, an
      accidental committed change, corruption discovered later, and loss of the account or credentials
      that control both production and its copies. Name the data and dependent services required,
      acceptable loss, interruption budget and detection delay. Explain why a surviving replica or
      a successful backup job does not by itself establish recovery from each case; link writer replacement
      to topology and incident selection to the parent.'
  - title: Choose the copy that can reconstruct the required state
    brief: Compare recovery methods by the state they capture, the restore they permit, compatibility
      constraints and expected recovery work. Use the running case to choose a base copy and any
      subsequent history it needs, rather than treating the methods as interchangeable products.
    heading:
      - title: Logical exports preserve a selected representation
        brief: Develop consistent export scope, schema and data ordering, roles, extensions and other
          objects that may require separate capture. Explain how transaction boundaries and multi-database
          scope affect consistency. Evaluate portability and selective loading against type, collation,
          version and object compatibility, and account for rebuilding indexes and validating constraints
          during restore.
      - title: Physical backups and snapshots need an engine contract
        brief: Explain what an engine-supported physical backup captures and which files, tablespaces,
          logs, configuration and versions must accompany it. Contrast a documented consistent or
          recoverable snapshot with an arbitrary copy of changing files. Check coordination across
          volumes and services, snapshot dependencies and restoration restrictions in the selected
          engine and hosting contract.
      - title: Point-in-time recovery needs a complete history
        brief: Connect a usable base backup to the required transaction-log chain and an identifiable
          recovery target. Explain how missing segments, incompatible history, retention gaps or
          an unsupported target defeat the intended restore. Verify the engine's target identifiers,
          granularity and inclusion rules; distinguish transaction-log recovery from selective replay
          of application intentions.
  - title: Keep recovery possible after production fails
    brief: Design retention around detection delay and the oldest state the cases require, including
      the dependency between retained base copies and logs. Track copy locations, catalogue metadata,
      checksums and job failures, while keeping restore evidence separate from copy completion. Evaluate
      independent copies against storage, region, administrative account and credential loss. Preserve
      recoverable encryption keys, restore identities, configuration and required external dependencies;
      use security's access and key controls. Identify who can delete copies or shorten retention
      and test access using the recovery identity.
  - title: Rehearse a full restore in isolation
    brief: Restore a representative backup into a clean destination with documented engine, extension
      and service prerequisites. Keep it isolated from live writers, queues and external side effects.
      Record retrieval, provisioning, decryption, restore, recovery and validation time, including
      constrained capacity and permissions. Establish full recovery before adding a target time so
      that a failure can be attributed to the base copy, missing dependencies or history rather than
      a vague failed drill.
  - title: Recover to the last acceptable state
    brief: Develop the accidental-deletion case using retained evidence to choose a recovery boundary
      before the harmful change. Restore separately, apply the documented history and verify the
      resulting transaction boundary with known records. Treat wall-clock estimates as evidence requiring
      checks, and stop when the target or log chain cannot be established. For managed services,
      inspect documented recovery windows, granularity, restore-to-new destination behaviour, regional
      or account restrictions and configuration that is not restored automatically. Keep the current
      copy available for comparison and legitimate later work.
  - title: Decide between replacing the database and repairing selected data
    brief: Show that returning the entire database to an earlier point can discard valid later changes.
      Compare a whole-service return with extracting the affected data from an isolated restore and
      applying a deliberate repair. Trace foreign keys, identifiers, dependent rows and concurrent
      updates so selective recovery is not presented as a safe table copy. Define the evidence, write
      coordination and application-domain reconciliation needed before merging; hand the implementation
      of corrective data work and external-effect reconciliation to evolution and integration. Make
      an unresolved conflict a reason to withhold cutover or repair.
  - title: Prove readiness before returning traffic
    brief: Separate engine recovery completion from acceptable service state. Check integrity using
      supported engine tools, schema and object availability, representative data invariants, permissions
      and application workflows; compare against the chosen recovery boundary and expected loss.
      Define go/no-go criteria, exclusive write authority, connection and dependency changes, and
      a preserved fallback before the parent's incident procedure authorises reopening traffic. Record
      actual restored state, data loss, time to usable service, test scope and remaining gaps. Repeat
      rehearsals after material changes to data volume, versions, backup configuration or hosting,
      and let measured recovery determine whether the requirements are met.
