topic: Querying and changing relational data with SQL
title: Working with SQL
brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database
  to expressing and checking substantial application and analytical queries. Teach selection, joins,
  aggregation, subqueries, set operations, window calculations and recursion where they solve useful
  relational problems. Develop precise reasoning about duplicates, nulls, ordering, time, pagination
  and data changes. Teach how to establish expected results and test edge cases. Distinguish portable
  concepts from dialect behaviour without attempting an exhaustive syntax catalogue; leave execution-cost
  diagnosis to its own branch.
heading:
  - title: Start with a database you can inspect and reset
    brief: Introduce a small order-and-payment database with supplied setup and reset scripts. Show
      how to connect, identify the engine and version, inspect tables, columns, keys and sample rows,
      execute a statement and read an error. Explain which commands belong to the client and which
      are SQL. Keep the exercise disposable and mark implementation-specific syntax at its first
      use.
  - title: Decide what one result row means
    brief: 'Translate a request such as outstanding orders into a result contract: one row per chosen
      entity or group, its columns and types, inclusion rules, treatment of missing facts, duplicate
      policy and required ordering. Hand-calculate a small expected result before writing SQL. Use
      the contract throughout the article to expose plausible answers at the wrong level of detail.'
  - title: Select rows and calculate their columns
    brief: Build SELECT expressions, aliases, FROM and WHERE through a useful first query. Teach
      comparisons, Boolean conditions and precedence, CASE, explicit column selection and DISTINCT.
      Explain the logical transformation of a query as a reasoning aid rather than an execution trace.
      Establish that repeated values and repeated result rows are meaningful until the result contract
      says otherwise.
  - title: Make values, missing facts and time explicit
    brief: Establish null as a missing value and show why an ordinary comparison cannot replace IS
      NULL. Introduce three-valued predicates and show which rows a filter retains. Use an amount
      calculation and a reporting date boundary to motivate checking expression types, casts and
      time semantics before trusting a result.
    nested_article:
      topic: SQL expression semantics, missing values and time
      title: Getting SQL values right
      brief: 'Teach the expression semantics needed to produce correct relational results: null propagation
        and three-valued logic; null-safe comparisons; CASE and COALESCE; numeric precision, division,
        rounding and overflow; text comparison, collation and pattern matching; and explicit versus
        implicit conversions. Develop date, local date-time, instant, interval and named-zone distinctions
        through reporting periods and elapsed-time calculations, including half-open boundaries and
        daylight-saving changes. Verify behaviour in a named engine and identify consequential dialect
        differences. Keep schema type selection in the design branch and driver conversion in application
        integration; avoid a function catalogue or a specialist calendar curriculum.'
  - title: Combine related facts without changing the question
    brief: Walk through a join with a tiny row-by-row result and then group order lines into a total.
      Make input and output row identity visible. Introduce inner and left joins, ON, GROUP BY, aggregates
      and HAVING sufficiently to read and build a basic report, then expose the inflated total caused
      by joining two independent one-to-many relationships.
    nested_article:
      topic: SQL joins, cardinality and aggregation
      title: Joining and summarising data
      brief: Teach how to construct multi-table application queries and reports while preserving
        their intended row meaning. Reason about relationship cardinality, join conditions, self-joins,
        outer joins, unmatched rows and the placement of predicates. Develop GROUP BY, HAVING, conditional
        aggregates, counts, distinct values, empty inputs and null handling. Repair double-counting
        by aggregating at the required level before combining independent details, and use existence
        queries when only presence matters. Include subtotals only where a concrete reporting task
        warrants them. Check expected rows and totals on adversarial fixtures; leave physical join
        methods and execution costs to performance.
  - title: Express a larger question in checkable stages
    brief: Introduce a named intermediate result for an unpaid-order report and show how each stage
      can be inspected against its contract. Explain the roles of a subquery, an existence test,
      a set operation and a common table expression. Introduce recursion only when a repeated parent-child
      relationship requires repeated expansion; query structure alone does not describe physical
      work.
    nested_article:
      topic: SQL subqueries, set operations and recursive queries
      title: Composing larger SQL queries
      brief: Teach practitioners to express and validate substantial queries through scalar and table
        subqueries, correlated existence tests, derived tables, common table expressions, UNION,
        INTERSECT and EXCEPT. Make duplicate handling, compatible column types, scalar cardinality
        and null-sensitive membership explicit, including the NOT IN trap and a checked alternative.
        Use named stages to make a report and a reusable view understandable without promising a
        particular execution strategy. Develop one recursive hierarchy or dependency traversal with
        an anchor, expansion, termination, cycle handling, duplicate policy and explicit result ordering.
        Limit recursion to useful relational traversal rather than a general graph-algorithm course;
        leave materialisation and plan diagnosis to performance and view deployment to evolution.
  - title: Compare rows while keeping their detail
    brief: Contrast a grouped total with a per-order row carrying its customer's total. Introduce
      OVER, partition and ordering through that difference, then motivate ranking and running calculations.
      Show why the rows available to a calculation and the order eventually displayed are separate
      decisions.
    nested_article:
      topic: SQL window calculations
      title: Calculating across related rows
      brief: 'Teach window functions through practical tasks: latest rows per entity, top items per
        group, running and moving totals, shares of a total and changes from a previous event. Distinguish
        input rows, partitions, window order, peer groups, frames and final output order. Explain
        ties, stable tie-breakers, ranking choices, ROWS versus value-based frames, default-frame
        surprises and null or absent predecessor values. Show how to filter a computed window result
        using a further query stage and how filtering before calculation can change its meaning.
        Require hand-checked examples with ties and missing periods; cover only functions and dialect
        differences needed for these decisions.'
  - title: Order and page a result deliberately
    brief: Teach a complete ORDER BY with tie-breakers, explicit null placement where supported,
      and LIMIT or the chosen dialect's equivalent. Compare offset and keyset pagination by walking
      a small ordered result, including composite cursors, tied values and page boundaries. Explain
      how insertion, deletion and changed sort values between requests affect the traversal contract.
      Link snapshot and transaction guarantees to the concurrency branch and access-path costs to
      performance rather than claiming a cursor alone freezes a result.
  - title: Change the intended rows and inspect the outcome
    brief: Introduce INSERT, UPDATE and DELETE on the disposable data, showing predicates, affected
      rows and returned values where supported. Connect a change to its precondition and postcondition,
      including a conditional update that can match zero rows. Introduce transaction grouping and
      rollback for practice, while leaving concurrent correctness and failure guarantees to their
      owning branch.
    nested_article:
      topic: SQL data modification
      title: Changing data with SQL
      brief: Teach single-row and set-based INSERT, UPDATE and DELETE, INSERT from a query, defaults,
        generated identifiers, constraints and inspection of affected or returned rows. Derive changes
        from explicit target sets and postconditions; handle zero matches, multiple matches, null-sensitive
        predicates and ambiguous source matches in joined updates. Explain conflict-handling inserts,
        upsert and MERGE through their intended outcomes and the chosen engine's documented semantics
        without treating them as interchangeable concurrency guarantees. Use BEGIN, COMMIT and ROLLBACK
        for bounded exercises and link transaction reasoning for invariants and concurrent writers.
        Keep production backfills, resumability and live correction procedures in schema and data
        evolution, and request retries and idempotency in application integration.
  - title: Check the answer before trusting the query
    brief: Finish the outstanding-orders task with an explicit expected result and repeatable setup,
      query and reset steps. Test empty inputs, absent relationships, duplicate details, nulls, ties,
      boundary timestamps and zero or multiple update matches. Compare row multiplicities and types
      as well as values; compare order only when promised. Check each intermediate result and a few
      independent totals or invariants rather than accepting one attractive sample output. Establish
      that passing correctness checks does not establish acceptable execution cost, and link to the
      performance branch when the answer is correct but too expensive.
