topic: Relational execution and performance
title: Understanding and improving database performance
brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
  Build the necessary understanding of row and index storage, buffering, version retention, access
  paths, join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and
  observed plans without confusing their units or treating estimates as execution evidence. Connect
  query shape, indexes, physical layout, maintenance and resource contention to workload latency,
  throughput and capacity. Choose and validate changes with representative data and concurrency,
  including write and operational costs; deepen engine internals only where they explain a diagnosis
  or intervention.
heading:
  - title: Start with the work people need to finish
    brief: Follow an application's growing order history through a slow customer lookup, a reporting
      query and concurrent order changes. Define acceptable latency, throughput and resource cost
      for each operation. Distinguish a frequent small cost from an occasional expensive request,
      and database execution from waiting for a connection, network transfer and application processing.
      Establish a baseline with query frequency, latency distributions, representative parameters,
      row counts and concurrent activity before choosing a remedy.
  - title: Find where time and work accumulate
    brief: Move from an affected operation to evidence about execution, blocking, storage reads,
      CPU, temporary work and result transfer. Compare a query's typical and slow executions with
      changes in parameters, data size and concurrent work. Separate observations from hypotheses;
      a slow query or a busy resource does not by itself identify the limiting cause. Use the operations
      branch for service monitoring and incident procedures, and the integration branch for pool
      waits and excessive round trips.
  - title: Rows have a physical home and a lifetime
    brief: Establish the working model needed to explain why equal result sizes can require very
      different work. Introduce pages, row and index organisation, cached and uncached access, locality,
      row width and retained versions. Connect logical changes and long transactions to the physical
      work and retained space that a performance investigation must measure, while keeping durability
      and isolation guarantees in their owning branches.
    nested_article:
      topic: Relational physical storage and working sets
      title: How stored rows become physical work
      brief: 'Teach the physical storage model needed to diagnose relational workloads: pages, heap
        and clustered organisation, row locators, secondary indexes, wide and out-of-line values,
        caching and locality. Follow reads and updates far enough to explain page traffic, cache
        pressure, fragmentation, retained row versions and space reuse. Compare selected engine implementations
        only where their differences change a diagnosis or intervention. Explain how long-lived snapshots
        and maintenance progress affect the working set, and how physical partitioning and pruning
        can reduce or fail to reduce work. Make layout and maintenance trade-offs measurable, including
        the resource and locking costs of reorganising data; link operational procedures and transaction
        semantics rather than recreating them. Stop before storage engine implementation and distributed
        partitioning become independent goals.'
  - title: Give the query a useful route to its rows
    brief: Compare scanning, locating a range through an index and fetching base rows. Explain selectivity,
      ordering and coverage through the running lookup, then show why a small table, a broad request
      or scattered fetches can favour a scan. Introduce composite key order and query expressions
      as practical constraints on useful access. Account for every added index in changes, storage
      and upkeep.
    nested_article:
      topic: Designing and evaluating relational indexes
      title: Choosing indexes for a workload
      brief: Teach how to derive candidate indexes from predicates, joins, ordering, grouping and
        returned columns, then verify them against real plans and workload measurements. Build a
        usable B-tree model for equality, ranges, composite key order and ordered retrieval. Explain
        coverage and base-row access without assuming an index-only path avoids every table visit.
        Cover partial or filtered indexes, expression indexes, collation and type compatibility where
        they change eligibility; introduce other index families only for concrete relational access
        needs. Evaluate selectivity, data skew, redundant indexes and changing query mixes alongside
        write amplification, space, contention and maintenance. Separate an index's constraint role
        from its access role, and link live creation and removal procedures to schema evolution and
        operations. Avoid universal index recipes and exhaustive vendor catalogues.
  - title: Read a plan as a programme of physical operations
    brief: Work through a small plan for the reporting query, following how scans, joins, filtering,
      grouping and ordering produce rows. Establish the difference between estimated cost and measured
      execution, and between rows produced and work performed. Show why the most visually prominent
      node or largest reported duration is not automatically the place to change first. Introduce
      safe plan collection before inviting deeper operator-by-operator diagnosis.
    nested_article:
      topic: Reading and diagnosing relational execution plans
      title: Following a query through its execution plan
      brief: Teach readers to obtain and interpret estimated and observed plans in a selected engine,
        with explicit warnings that execution-based inspection runs the statement and can have writes,
        locks and other effects. Follow access paths, nested-loop, hash and merge joins, sorts, aggregation,
        materialisation and parallel work through concrete queries. Explain row counts, loops, filters,
        fetches, memory and temporary spills, startup and total cost, timing and buffer or I/O evidence
        using the engine's actual reporting conventions. Distinguish per-loop from total figures,
        inclusive from exclusive time, instrumentation overhead and parallel overlap; never sum plan
        timings or compare arbitrary cost units as elapsed time. Recognise repeated work, large intermediates,
        early termination and late filtering. Connect the evidence to a testable intervention while
        preserving SQL results, and label illustrative plans separately from captured execution evidence.
  - title: Understand why the optimiser chose that plan
    brief: Show how estimated row counts influence access paths, join order and memory needs. Use
      a skewed customer or correlated predicates to make a plausible estimate fail. Distinguish an
      inaccurate estimate from an accurate estimate paired with a costly physical choice. Explain
      why refreshing statistics, changing query shape or choosing different parameters can matter,
      and why a forced plan is a hypothesis with a maintenance cost.
    nested_article:
      topic: Relational statistics and optimiser decisions
      title: Explaining and correcting plan choices
      brief: Build the practical model of cardinality estimates, statistics and cost comparison needed
        to investigate bad plans. Cover distributions, null fractions, distinct values, correlation,
        sampled or stale statistics and joins; demonstrate how estimation errors propagate into join
        order, access and resource choices. Teach how to locate the first consequential mismatch
        between estimates and observations, inspect relevant statistics and test targeted remedies.
        Include prepared statements, parameter-sensitive plans, plan caching and re-planning where
        the selected engine's behaviour affects a workload. Assess predicate rewrites, statistics
        changes and plan controls against correctness, data drift and different parameter classes.
        Explain optimisation boundaries without a catalogue of search algorithms or hints, and verify
        engine-specific behaviour against primary documentation.
  - title: A faster query can still make the workload slower
    brief: Put the candidate improvements back beside concurrent lookups, reports and changes. Connect
      higher concurrency to queues and competition for CPU, memory, I/O and locks; account for per-operation
      memory and parallel workers. Explain how an index can help reads while making writes more expensive,
      and how a long report can change the conditions for short requests. Use transaction and integration
      guidance for lock lifetimes, retry behaviour and admission at the application boundary.
    nested_article:
      topic: Relational workload contention and capacity
      title: Improving performance under concurrent load
      brief: Teach how to distinguish expensive individual executions from queuing and shared-resource
        contention in a relational workload. Relate arrival rate, completed throughput, outstanding
        work and latency with stated assumptions, including what changes when the workload cannot
        keep up. Investigate CPU, memory, cache and storage pressure, temporary spills, lock waits,
        hot rows or pages and competing background maintenance using engine evidence. Evaluate concurrency
        limits, batching, workload scheduling, query and index changes, parallelism and targeted
        resource changes against tail latency and total completed work. Include the effect of long
        transactions on retained versions and maintenance, linking the storage and transaction explanations.
        Bound experiments and distinguish offered load from achieved throughput; leave service-wide
        monitoring, provisioning procedures and recovery to operations.
  - title: Change one explanation into a measured improvement
    brief: 'Turn each diagnosis into a prediction: which work should disappear, which measurement
      should change and what new cost might appear. Compare a query rewrite, index change, layout
      or statistics change, maintenance intervention and added resources as remedies for particular
      evidence. Verify results and edge cases before measuring. Test with representative size, distributions,
      parameter classes, warm and cold conditions, concurrency and ongoing changes; record the engine
      version and configuration, measurement variance and instrumentation limits. Measure end-to-end
      latency distributions, throughput, resource use, write cost and maintenance burden together.
      Set acceptance and regression criteria, retain reproducible evidence and use schema-evolution
      guidance for deploying a successful change safely. Close by revisiting the running workload
      and identifying when growth requires another investigation.'
