topic: Relational transactions and application correctness
title: Making concurrent changes correct
brief: Teach practitioners to state application invariants, choose transaction boundaries and preserve
  those invariants under concurrent execution and failures. Connect isolation anomalies to locking,
  versioned reads, conflict detection, constraints and serialisation, using labelled illustrative
  schedules and verified engine behaviour. Develop practical choices among atomic statements, conditional
  changes, locks and stronger isolation, including deadlocks, retries and uncertain commit outcomes.
  Explain the database's durability boundary and the limit of transactions across external effects;
  leave detailed client integration and service recovery procedures to their respective articles.
heading:
  - title: Start with the fact that must remain true
    brief: Use a reservation example to express a precise rule about remaining capacity, reservations
      and ownership. Separate an invariant from a convenient sequence of application steps, and name
      every writer that could affect it. Establish the invariant and acceptable outcomes before choosing
      SQL or an isolation level.
    heading:
      - title: Put the complete change inside a boundary
        brief: Decide which related changes must succeed or fail together. Explain commit, rollback
          and visibility through a successful reservation and a failed one; distinguish atomicity
          from protection against concurrent decisions. Include transaction lifetime and savepoints
          only as needed to explain which work a rollback undoes, leaving connection and request
          handling to integration.
      - title: Let the database reject invalid states where it can
        brief: Map suitable invariants to keys, uniqueness, references and checks, while distinguishing
          their scope from rules over several rows or external facts. Show why an application pre-check
          is not itself enforcement. Refer to data design for constraint syntax and modelling, and
          to schema evolution for deploying constraints on a live database.
  - title: Two correct-looking transactions can make an incorrect result
    brief: Interleave two reservation attempts and compare their reads, decisions and writes against
      the stated invariant. Introduce a labelled illustrative schedule with explicit initial state,
      transaction boundaries and outcomes. Make the difference between this model and an observed
      engine execution unmistakable.
    heading:
      - title: The protection must cover the decision as well as the write
        brief: Explain stale read-modify-write decisions and lost changes, then use a multirow staffing
          rule to reveal a failure that separate row updates cannot expose. Introduce read dependencies,
          predicates and newly matching rows through these decisions rather than as a catalogue of
          anomaly names.
      - title: A repeatable view does not by itself prove the rule
        brief: Distinguish a statement's view, a transaction's view and a serialisable execution
          contract. Explain serial equivalence using the example and separate that guarantee from
          real-time ordering and the freshness of a particular read. State which observations and
          aborts would change the application's reasoning.
  - title: Choose protection for the invariant you actually have
    brief: Develop a worked decision sequence from a single counter to a uniqueness rule and then
      a rule spanning rows. For each choice, identify the protected fact, the database guarantee
      it relies on, competing writers and the observable success or failure result. Prefer the simplest
      argument that covers every writer.
    heading:
      - title: Express a change and its condition together
        brief: Replace a separate read and overwrite with an atomic expression or a conditional change.
          Explain checking the affected rows or returned result, version tokens and concurrent conflict
          behaviour. Distinguish a failed business condition from a transaction abort and avoid implying
          one row's condition protects an unrelated aggregate.
      - title: Coordinate decisions that span several rows
        brief: Compare locking a stable coordination row, locking the relevant existing rows and
          requesting serialisable execution. Explain why the chosen rows or predicates must cover
          every way the rule can be broken, including new rows and writers using another code path.
          Introduce the deeper lock design work after making this coverage argument concrete.
        nested_article:
          topic: Relational locking and concurrency protocols
          title: Designing changes that coordinate with locks
          brief: Teach relational practitioners to design and assess explicit locking protocols for
            invariants that ordinary constraints or a conditional row change cannot express. Work
            through row and predicate coverage, stable coordination rows, missing rows, inserts,
            lock modes and acquisition order using verified behaviour of the selected engine. Explain
            lock lifetime, waiting, deadlocks and contention; show how to shorten a transaction without
            releasing protection before the decision is complete. Assess selected queue or claim
            patterns only where they clarify the guarantees sacrificed by skipping or refusing locked
            work. Finish with a reproducible two-session check and a correctness argument covering
            all writers. Leave general workload tuning and client retry machinery to their owning
            articles. Own the protocol construction, protected-row selection, acquisition-order and
            deadlock tutorial here; state the particular verified isolation assumptions each protocol
            needs and link to the isolation article for interpreting and comparing engine contracts.
  - title: Understand the isolation contract behind the choice
    brief: Connect versioned reads, locking and conflict detection to what a transaction can observe,
      which writes can proceed and when a transaction must wait or abort. Establish that an isolation
      name is insufficient evidence for the selected engine's behaviour; show how to read its contract
      and check an example before relying on it.
    heading:
      - title: Versions and locks answer different questions
        brief: Trace a reader and a writer through a minimal versioned example. Explain snapshot
          selection, visibility and concurrent write arbitration without claiming that versioned
          reads eliminate locks. Distinguish ordinary reads from locking reads and account for statement
          boundaries and predicate coverage when assessing a decision.
      - title: Stronger isolation can reject a result instead of waiting
        brief: Relate serialisable guarantees to preventing or detecting incompatible dependencies.
          Explain why a valid application transaction can be aborted and why successful execution
          of individual statements does not establish eventual commit. Introduce deeper comparison
          only where the implementation changes the concurrency protocol or required failure handling.
        nested_article:
          topic: Relational isolation guarantees and implementations
          title: Reading and testing isolation guarantees
          brief: Teach practitioners to derive usable isolation guarantees from engine documentation
            and reproducible concurrent sessions. Trace statement and transaction snapshots, locking
            reads, concurrent updates, predicate dependencies and serialisation failures through
            a small set of invariant failures. Compare representative PostgreSQL and MySQL InnoDB
            behaviour where the same level name or query shape produces a materially different application
            decision; add no vendor catalogue. Explain the distinction between snapshot isolation
            and serialisability, and between serialisability and real-time ordering. For each worked
            case, label illustrative schedules separately from verified runs, record engine version
            and settings, state the observation and derive the protection or retry obligation it
            supports. Own interpretation and testing of engine guarantees here; link to the locking
            article for constructing protocols, selecting protected rows and teaching acquisition
            order and deadlocks rather than repeating that work. Keep implementation internals only
            where they explain the obligation.
  - title: An aborted transaction must be reconsidered as a whole
    brief: Follow a deadlock and a serialisation conflict to rollback, identifying which earlier
      reads and decisions must be repeated. Explain consistent lock order, bounded transaction duration
      and the limits of deadlock avoidance. Distinguish business rejection, known abort and a failure
      whose commit outcome is unknown; make the database guarantee the basis of the decision to retry.
    heading:
      - title: Retrying one statement can preserve a stale decision
        brief: Show why repeating only the failed write can reuse assumptions that no longer hold.
          Establish the whole-transaction retry requirement where the engine's contract calls for
          it, including rechecking the invariant, while linking to application integration for retry
          limits, backoff, deadlines, idempotency and driver-specific error handling.
      - title: Losing the reply does not prove rollback
        brief: Place connection loss before a commit request, during commit and after a successful
          commit to distinguish a known abort from an uncertain result. Explain why blindly repeating
          the business operation is unsafe when commit is unknown, and hand reconciliation and durable
          request identities to the application integration article.
  - title: Commit has a durability boundary and a system boundary
    brief: Explain why an acknowledged commit has meaning only under a stated durability and failure
      contract. Introduce durable logging and recovery just far enough to separate committed work
      from in-memory state, then connect engine settings, storage and replication acknowledgement
      to the failures that may lose an acknowledged change. Link to operations for service choices
      and recovery tests.
    heading:
      - title: A database rollback cannot undo an external effect
        brief: Trace charging a payment or publishing a message before and after database commit,
          exposing both failure windows. Establish that a local transaction cannot make an independent
          service participate merely by calling it inside the transaction. Introduce recording intent
          with the database change and link to application integration for delivery, deduplication
          and reconciliation design; keep distributed transaction theory outside this article.
  - title: Check the argument with competing sessions and failures
    brief: 'End with a compact procedure: write the invariant and permitted outcomes, enumerate writers
      and competing schedules, name the exact engine guarantees, and run controlled concurrent sessions
      against a disposable database. Include contention, insert races, a known abort and an interrupted
      commit response. Check final state and application decisions, record version and settings,
      and explain that successful test runs support but do not replace the coverage argument. Revisit
      the initial reservation to justify the chosen protection and identify which application and
      operational responsibilities remain.'
