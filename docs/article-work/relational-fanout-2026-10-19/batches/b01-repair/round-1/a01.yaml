topic: Relational data design
title: Designing relational data
brief: Teach an engineer to translate application facts, rules and access needs into a relational
  schema. Follow a booking application from ordinary requirements to tables, identities, relationships,
  value representations and enforceable rules, exposing the failures each decision prevents. Establish
  a practical account of normalisation and controlled redundancy, then account for history and deletion.
  Test the design with representative reads, changes and lifecycle scenarios. Develop specialised
  modelling only where it changes these relational decisions; leave query fluency, transaction protocols
  and live migration procedures to their neighbouring articles.
heading:
  - title: Begin with facts and rules
    brief: Start with customers booking places on scheduled sessions. Separate a customer's identity,
      a session's identity and the fact of a booking from the screens that display them. Write down
      example facts, vocabulary, ownership, cardinalities, required reads and changes, and lifecycle
      rules. Expose ambiguous requirements such as whether one customer may book twice or a cancelled
      booking must remain visible before choosing tables.
  - title: Give every row a clear meaning
    brief: State what one row represents and what makes two rows the same fact. Turn one-to-many
      and many-to-many relationships into keys and relationship tables; put relationship attributes,
      such as booking status, on the relationship. Distinguish a required reference from a promise
      that a parent has at least one child. Work through duplicate bookings, repeat sessions and
      customer merges to show why row meaning and identity precede a convenient identifier.
    heading:
      - title: Choose identity and scope deliberately
        brief: Compare natural, surrogate and composite keys using mutable customer identifiers and
          bookings scoped to a session. Explain candidate keys, primary keys and the uniqueness rules
          that remain necessary after adding an artificial identifier. Make tenant scope explicit
          in both uniqueness and references. Treat identifier generation, exposure and storage cost
          as design considerations without turning identifier formats into a catalogue.
      - title: Represent optional relationships
        brief: 'Use the booking example to distinguish a relationship that may be absent from an
          entity that exists independently: a customer can exist without a booking, while each booking
          must identify its customer and session. Translate those requirements into optional or required
          references and state what an absent relationship means.'
  - title: A value needs a meaning as well as a type
    brief: Show how a fee, a session start and a customer's contact details need explicit units,
      precision, comparison rules and missing-value meanings. Establish that choosing a database
      type is part of the application's contract. Use unknown, inapplicable and deliberately absent
      values to introduce nulls and designs that preserve distinctions the application needs.
    nested_article:
      topic: Relational value representation
      title: Choosing types and representing missing values
      brief: Teach how to choose relational value representations from the meaning and operations
        of the data. Cover exact and approximate numbers, quantities and money, identifiers, text
        comparison and collation, dates, instants, local schedules and time zones, with concrete
        failure cases and selected engine differences. Explain null, defaults, empty values and explicit
        state models; connect their design consequences to comparison, uniqueness and required fields
        without reteaching SQL expressions. Decide when arrays, JSON, binary values, separate related
        rows or external payloads preserve the required validation, queries and evolution. Keep semi-structured
        values bounded by their ownership and consistency rules, rather than teaching a separate
        document database curriculum.
  - title: Make invalid facts difficult to store
    brief: Translate booking requirements into required columns, uniqueness, references and checks,
      then try to insert or change invalid examples. Distinguish rules about one stored row, relationships
      between rows and an operation spanning several changes. Make the boundary between declarative
      constraints and a transaction protocol visible; application checks alone do not establish that
      stored data always satisfies the rule.
    nested_article:
      topic: Relational schema invariants
      title: Expressing rules with constraints
      brief: Teach how to translate application invariants into database constraints and identify
        what remains outside their scope. Work through required values, candidate keys, composite
        references, conditional uniqueness, mutually dependent rows and non-overlapping reservations,
        checking the selected engine's null, timing and constraint capabilities. Explain when to
        reshape the data so a rule becomes enforceable, and the tradeoffs of triggers or transaction
        protocols when a declarative rule is unavailable. Examine update and deletion actions, including
        why cascading may remove more than the business rule intends. Supply valid and invalid change
        cases and identify concurrency tests to take to the transactions article. Leave transaction
        anomaly analysis and adding constraints to an existing live database to their owning branches.
  - title: Store each fact where it belongs
    brief: Use copied customer details, multiple contact columns and repeating session information
      to expose update, insertion and deletion anomalies. Introduce functional dependencies and normalisation
      through repairs that give each fact an owner. Distinguish a historical price agreed at booking
      from an accidental copy of the current session price; similar values need not represent the
      same fact. Establish normalisation as a way to reason about correctness and change, without
      requiring a tour of every normal form.
    nested_article:
      topic: Relational normalisation and deliberate redundancy
      title: Normalisation and deliberate redundancy
      brief: Develop the dependency reasoning needed to recognise mixed facts and split tables without
        losing relationships or introducing spurious combinations. Use practical examples of candidate
        keys, partial and transitive dependencies and independent multivalued facts; introduce formal
        terms only where they make a design decision clearer. Compare normalised source data with
        cached totals, repeated attributes, summary tables and materialised results. Require a stated
        source of truth, freshness requirement, update ownership, concurrency strategy and repair
        or rebuild path for derived copies. Decide whether measured read benefits justify write and
        maintenance costs, using the performance and transaction branches for their detailed validation.
  - title: Decide what changes and what must be remembered
    brief: Walk a booking through amendment, cancellation, customer deletion and later reporting.
      Separate current state, an agreed historical fact and evidence of a change. Explain why overwriting
      or adding a deleted flag is a decision about meaning, visibility, uniqueness and references.
      Record retention and erasure requirements early enough that the schema can support them, without
      prescribing jurisdiction-specific legal rules.
    nested_article:
      topic: Relational history and data lifecycle design
      title: Modelling history and data lifecycles
      brief: Teach how to choose among current-state rows, immutable snapshots, change records and
        effective-dated versions for concrete relational requirements. Distinguish when a fact applied
        from when the database recorded it, and introduce both dimensions only when late information
        and corrections require them. Design version identity, relationships to historical entities,
        interval boundaries and overlap rules so point-in-time questions have a defined answer. Compare
        status changes, tombstones, archival and deletion through their effects on references, uniqueness,
        reporting, retention and erasure. Explain the limits of history rows as audit evidence and
        of deletion from live tables as removal from replicas, exports and backups; refer operational
        procedures and live lifecycle changes to their owning branches.
  - title: Test the schema against the application's life
    brief: Assemble the booking schema into a reviewable design with row meanings, key choices and
      an invariant inventory. Trace representative reads and changes, including an empty database,
      missing references, duplicate input, a tenant boundary, customer merges, corrected history
      and deletion. Demonstrate simple queries to catch accidental many-to-many multiplication and
      ambiguous meaning, leaving SQL instruction to its own branch. Separate database-enforced rules
      from transaction and application responsibilities, identify workload checks for performance
      review, and record unresolved assumptions and expected future changes. End with evidence that
      a design meets requirements, rather than a claim that one schema fits every application.
