topic: Relational background work and external effects
title: Connecting transactions to background work and events
brief: Make work beyond a relational transaction discoverable and recoverable. Follow one committed
  order and its external fulfilment request through a transactional job or outbox record, worker
  ownership, repeated attempts and uncertain external outcomes. Compare direct calls and database
  change capture by their remaining failure windows. Bound event contracts, ordering, retention and
  replay to what is needed to account for committed intent; reuse transaction concurrency and request-idempotency
  mechanisms rather than deriving them again.
heading:
  - title: Find the gap between committing and doing the work
    brief: Start with an order whose database change and external fulfilment call must both happen.
      Trace a call before commit, a call after commit and a call held inside an open transaction
      through database failure, process death and a lost response. Separate the evidence that the
      database committed, that an external system accepted the operation and that its outcome is
      known. Establish which synchronous calls can tolerate their failure contract and when durable
      unfinished work is necessary. Link to request recovery for the caller's unknown transaction
      outcome and retry contract.
  - title: Commit the business change and the intent together
    brief: 'Use one order example throughout: create the order and a durable work record in the same
      transaction. Give the work a stable operation identity and sufficient immutable input or an
      explicit rule for reading later state. Explain why enqueueing elsewhere after commit leaves
      a gap, and why a database job record or transactional outbox closes that particular gap without
      completing the external effect. Distinguish a job that a worker executes from an event that
      describes an agreed business fact, while retaining the same atomic-intent mechanism. Define
      the application response as accepted or pending when external completion is still outstanding.'
  - title: Claim work without keeping a transaction open during the call
    brief: 'Define pending, claimed, completed and failed or unresolved states using ownership, attempt
      identity, lease expiry, next-attempt time and recorded outcome. Show a short atomic claim transaction,
      an external call after the claim commits and a conditional completion transaction. Reuse the
      transaction branch''s locking or conditional-update mechanisms; verify the selected engine''s
      claim and competing-worker behaviour. Recover abandoned claims after worker death, and reject
      completion from an obsolete attempt. Explain that a lease can expire while an old worker is
      still executing: database ownership protects database transitions but cannot by itself stop
      an external effect. Keep retry attempts bounded and discoverable, with a deliberate route for
      permanent failures and manual reconciliation.'
  - title: Make repeated attempts refer to the same operation
    brief: Follow external success followed by worker death before completion is recorded. Reuse
      the stable operation identity across delivery attempts and distinguish it from each claim's
      attempt identity. Check the receiver's deduplication scope, request matching, retained outcome
      and expiry contract; link to the request-recovery article for implementing atomic idempotency
      records. Where the receiver cannot suppress repeats, choose authoritative outcome lookup, reconciliation,
      an acceptable repeated effect or an explicitly unresolved state according to the business operation.
      Do not describe a completed work record, lease or transport acknowledgement as proof that an
      external effect occurred only once.
  - title: Give published records a meaning that survives delay
    brief: For an outbox publisher, define the event identity, business meaning, payload owner and
      compatibility obligation before treating a row change as an integration contract. Contrast
      an immutable event fact with a pointer to current state, showing how delayed publication changes
      what a receiver can reconstruct. Introduce an order version only when a business rule requires
      per-order sequence or stale-event detection; check whether concurrent workers and retries preserve
      that required scope. Keep global ordering and broker behaviour outside the article. Retain
      source records, payload versions and deduplication evidence for the promised recovery and replay
      interval, including how replay can repeat external effects.
  - title: Compare polling with database change capture
    brief: 'Compare polling the same outbox with capturing its committed changes, and contrast both
      with publishing raw application-table changes. Keep the comparison to the relational application''s
      contract: which committed changes are visible, how initial capture joins ongoing changes, what
      a saved source position establishes and what duplicates can follow restart. Require implementation-specific
      verification of snapshot boundaries, transaction visibility, schema changes, position persistence
      and source-log retention. Explain why capture moves the publication mechanism without making
      external outcomes atomic with the original transaction. Do not expand into capture connector
      administration or messaging internals.'
  - title: Recover the unfinished order from retained evidence
    brief: Close the worked case by locating an unclaimed record, an expired claim, an external success
      with no recorded completion and a publisher that has stopped advancing. Relate work age, attempts,
      recorded outcomes and source position to the next safe action. For lost downstream progress,
      establish whether retained outbox records or captured changes can reproduce the required work
      within the receiver's duplicate-handling contract; when the history has expired, reconcile
      authoritative database state or rebuild the required projection under a defined boundary. Leave
      general consumer and broker recovery to their owners. Specify failure-injection observations
      around commit, claim, external acceptance, completion and publication, and label illustrative
      timelines separately from evidence obtained with the chosen database, worker and receiver.
