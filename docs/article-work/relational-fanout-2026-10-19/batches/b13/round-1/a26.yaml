topic: Reading and diagnosing relational execution plans
title: Diagnosing a query from its execution plan
brief: 'Complete one ordinary slow-query investigation in PostgreSQL: collect safe evidence, follow
  physical rows and repeated work, interpret reporting units, explain a consequential estimate error,
  test a targeted remedy and accept it against the workload. Use the same reporting query throughout,
  including common and rare prepared parameters, so statistics and plan choice resolve the original
  diagnosis rather than begin another tour. Record the concrete engine version and verify its behaviour
  against primary documentation. Distinguish captured evidence from illustrative arithmetic and explain
  what each observation cannot establish. Keep uncommon nodes, parallel variants and planner controls
  conditional and compact. Link index design, storage mechanisms, concurrent-load diagnosis and the
  parent''s comparison method to their owners; do not expand into optimiser or storage-engine specialism.
  No further article is required to finish this task.'
heading:
  - title: Collect evidence for the slow report safely
    brief: Establish one query joining customers, orders and order lines, filtering a dated interval
      and region, grouping totals and returning an ordered limited result. Supply schema, relevant
      indexes, data distribution, common and rare parameters, and a small correctness fixture covering
      duplicates, nulls and ties. Distinguish estimated EXPLAIN from execution-based EXPLAIN ANALYZE
      before showing the latter on disposable data. Explain that execution can write, invoke effectful
      functions or triggers, take locks and consume shared resources; a rollback does not undo every
      effect, including sequence or external work. Use ANALYZE and BUFFERS appropriately, explaining
      TIMING and optional I/O timing. Record version, settings, parameters, capture conditions and
      whether each plan is captured or illustrative. Link production collection procedures to operations.
      State the observed slowness and the question this evidence can answer.
  - title: Follow where the report spends its work
    brief: Read the plan tree as physical data dependencies with consumer demand, rather than SQL
      clause order. Follow candidate rows through scan conditions, filters, base-row fetches and
      join inputs to the final groups and ordering. Teach sequential, index and bitmap access only
      far enough to interpret the case's conditions, rechecks and heap work; reuse index and storage
      explanations. Trace nested-loop repeated probes, hash build/probe and merge input ordering
      with compact alternatives where needed to compare physical work without changing join semantics.
      Identify late filtering and large intermediates. Explain blocking sorts and aggregation, reported
      memory/disk use, hash batches and temporary work where the case requires them. A spill indicates
      work and resource pressure, not by itself bad statistics or a safe global memory increase.
      Explain Materialize or Memoize briefly only if the captured plan needs saved or parameter-keyed
      reuse; omit an independent node catalogue.
  - title: Interpret counts, costs and timings before blaming a node
    brief: Annotate estimated rows, width, startup and total cost alongside observed rows, loops
      and startup/total time using PostgreSQL's actual averaging and rounding conventions. Derive
      total row work from per-loop figures only where their semantics permit it. Separate arbitrary
      planner cost units from elapsed milliseconds, inclusive node time from exclusive work, and
      planning/execution reports from application latency. Never sum inclusive node timings or buffer
      reports. Interpret shared hits, reads, dirtied/written blocks and temporary blocks without
      equating a buffer read with physical device I/O. Explain instrumentation overhead and the evidence
      lost with per-node timing disabled. Account for partially consumed inputs, LIMIT, never-executed
      branches and varying loops before comparing estimates. If parallel nodes occur, add a compact
      annotated worker fragment showing planned/launched workers, leader participation and the version's
      aggregate/per-worker conventions; overlapping intervals cannot be added into elapsed time or
      exclusive CPU time. Keep a separate parallel variant optional.
  - title: Locate the first error that could change the choice
    brief: Walk backwards from the case's repeated work or large intermediate to the earliest consequential
      estimate/observation mismatch on a sufficiently consumed input. Distinguish an estimate fault
      from accurate predictions of genuinely expensive necessary work, misleading early termination
      and runtime conditions. Explain how underestimated rows can favour repeated lookups or alter
      join ordering and expected sort/hash sizes; the largest error ratio is not automatically the
      useful target. Build a short simplified calculation of table size, predicate selectivity and
      join multiplicity, clearly labelled as a model rather than PostgreSQL's estimator. Relate rows,
      width and anticipated CPU/page work to comparison of legal plans, without suggesting costs
      are measured duration or row estimates directly allocate fixed memory. State one falsifiable
      explanation for the report and the next observation needed.
  - title: Check the statistics behind that prediction
    brief: 'Inspect the implicated table estimates and pg_stats summaries alongside bounded observations
      of the actual data, accounting for diagnostic query cost. Explain null fractions, distinct
      values, common-value frequencies and histograms through the case''s skew; use a dependent same-table
      predicate pair to show why independent selectivities can mislead. Distinguish that dependency
      from physical value/order correlation used in access costing. Separate stale statistics after
      data changes, sampling or summary limits and unrepresented dependencies; fresh statistics remain
      approximate. Choose one case-supported remedy: targeted ANALYZE for drift, an increased statistics
      target for missing consequential skew, or supported extended statistics with subsequent data
      collection. Compare estimates and resulting work after an isolated change. Use versioned planner-statistics
      and CREATE STATISTICS documentation to bound supported predicate forms; do not promise cross-table
      join correction. Account for analysis, planning and continuing maintenance costs. Keep other
      remedies a short hypothesis-to-test table, not extra investigations.'
  - title: Check the application's common and rare parameters
    brief: Run the same report through its actual session and preparation path with a common and
      a rare parameter, distinguishing driver preparation decisions from server prepared execution.
      Compare PostgreSQL custom and generic plans to show the information available for known values
      versus reusable unknown parameters and the planning-time trade-off. Explain automatic selection,
      reuse and documented invalidation or replanning triggers from the selected version's PREPARE
      and plan_cache_mode documentation; a literal-only test does not establish application behaviour.
      Check whether the targeted statistics remedy helps both parameter classes or leaves a preparation-sensitive
      choice. If necessary, test a locally scoped preparation or cache-mode change against both classes
      including planning overhead. Do not turn this into a catalogue of engine caching rules or planner
      settings.
  - title: Verify the remedy and close the investigation
    brief: 'Complete an evidence ledger connecting the original symptom, supported cause, isolated
      remedy, changed estimates, physical work and measured outcome. Verify result equivalence for
      duplicates, nulls, conversions, ordering and LIMIT before comparing performance, including
      any predicate rewrite. Reuse the parent''s representative workload comparison method to check
      common and rare parameters, concurrency, end-to-end latency, completed work and relevant write/resource
      costs; a faster isolated execution is not sufficient acceptance. State remaining uncertainty
      and when drift requires rechecking. If accurate estimates still leave a surprising choice,
      briefly explain bounded legal alternatives and imperfect costing. Use a scoped planner control
      only as a conditional experiment: a faster alternative supports a hypothesis but does not prove
      its root cause; retaining a control requires scope, rationale and a removal condition. Route
      new index design or concurrent contention to their owners. Finish with the verified ordinary
      remedy and its acceptance record, so the reader can complete this diagnosis in one destination.'
