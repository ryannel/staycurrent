collection: Relational databases
commission: '2026-10-24'
status: provisional; awaiting independent collection planning review
scope:
  destinations: 58
  preserved_introduction: 1
  general_and_distributed: 30
  postgresql_implementation: 13
  cockroachdb_implementation: 10
  postgresql_specialists: 4
  merges_proposed: 0
rules:
- The accepted root article is preserved. Root child carriers annotate collection ownership; they are not source
  edits.
- Every destination occurs once as a nested_article; the root is RL76. IDs, slugs and stable keys match the input
  inventory.
- Parentage is an introduction relationship, not a mandatory reading sequence. Prerequisites name the minimum concepts,
  which an experienced reader may already know.
- Each brief fixes a useful understanding and boundary, not a detailed syllabus or mandatory visual design. Writers
  may develop and polish provisional headings.
- General articles own mechanisms and decisions. Product articles own pinned implementation practice and native
  evidence, with only local recaps.
- Numerical models and chosen schedules are illustrative unless a writer records actual native execution. Source
  assumptions and unsettled decisions are in planner-record.md.
