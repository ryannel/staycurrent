  - title: Tables and related facts
    brief: >-
      The reader can interpret a small relational example: what a table, row and column represent,
      how identifiers connect related facts, and how the database can enforce stated rules.
      They understand why facts with different meanings need to be distinguished, including a
      current offered price and an agreed sale price. This understanding prepares them for the
      design, SQL and transaction branches, which own the working depth. The writer chooses
      the examples, sequence, visuals and amount of syntax needed to establish that understanding.
