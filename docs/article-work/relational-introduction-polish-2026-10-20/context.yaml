child_article_plans:
- id: a01
  href: /review/relational-next/data-design/
  article:
    topic: Relational data design
    title: Designing relational data
    brief: Teach an engineer to translate application facts, rules and access needs into a relational
      schema. Follow a booking application from ordinary requirements to tables, identities, relationships,
      value representations and enforceable rules, exposing the failures each decision prevents. Establish
      a practical account of normalisation and controlled redundancy, then account for history and deletion.
      Test the design with representative reads, changes and lifecycle scenarios. Develop specialised
      modelling only where it changes these relational decisions; leave query fluency, transaction protocols
      and live migration procedures to their neighbouring articles.
    heading:
    - title: Begin with facts and rules
      brief: Start with customers booking places on scheduled sessions. Separate a customer's identity,
        a session's identity and the fact of a booking from the screens that display them. Write down
        example facts, vocabulary, ownership, cardinalities, required reads and changes, and lifecycle
        rules. Expose ambiguous requirements such as whether one customer may book twice or a cancelled
        booking must remain visible before choosing tables.
      anchor: begin-with-facts-and-rules
    - title: Give every row a clear meaning
      brief: State what one row represents and what makes two rows the same fact. Turn one-to-many and
        many-to-many relationships into keys and relationship tables; put relationship attributes, such
        as booking status, on the relationship. Distinguish a required reference from a promise that a
        parent has at least one child. Work through duplicate bookings, repeat sessions and customer merges
        to show why row meaning and identity precede a convenient identifier.
      heading:
      - title: Choose identity and scope deliberately
        brief: Compare natural, surrogate and composite keys using mutable customer identifiers and bookings
          scoped to a session. Explain candidate keys, primary keys and the uniqueness rules that remain
          necessary after adding an artificial identifier. Make tenant scope explicit in both uniqueness
          and references. Treat identifier generation, exposure and storage cost as design considerations
          without turning identifier formats into a catalogue.
        anchor: choose-identity-and-scope-deliberately
      - title: Represent optional relationships
        brief: 'Use the booking example to distinguish a relationship that may be absent from an entity
          that exists independently: a customer can exist without a booking, while each booking must identify
          its customer and session. Translate those requirements into optional or required references
          and state what an absent relationship means.'
        anchor: represent-optional-relationships
      anchor: give-every-row-a-clear-meaning
    - title: A value needs a meaning as well as a type
      brief: Show how a fee, a session start and a customer's contact details need explicit units, precision,
        comparison rules and missing-value meanings. Establish that choosing a database type is part of
        the application's contract. Use unknown, inapplicable and deliberately absent values to introduce
        nulls and designs that preserve distinctions the application needs.
      nested_article:
        topic: Relational value representation
        title: Choosing types and representing missing values
        brief: Choose representations that preserve a value's meaning, allowed states and useful operations
          across the database and application boundary. Develop a booking schema through prices, identifiers,
          customer text, reservation times and optional details, using concrete failures to justify each
          choice. Distinguish exactness from precision, identity from presentation, instants from local
          schedules, and missing information from empty values. Compare scalar columns, arrays, JSON,
          binary values, related rows and external payloads through validation, query and ownership requirements.
          Use selected, documented engine differences only when they change a decision. Leave SQL expression
          behaviour, constraint design, historical modelling and live migration procedures to their owning
          articles.
        href: /review/relational-next/types/
      anchor: a-value-needs-a-meaning-as-well-as-a-type
    - title: Make invalid facts difficult to store
      brief: Translate booking requirements into required columns, uniqueness, references and checks,
        then try to insert or change invalid examples. Distinguish rules about one stored row, relationships
        between rows and an operation spanning several changes. Make the boundary between declarative
        constraints and a transaction protocol visible; application checks alone do not establish that
        stored data always satisfies the rule.
      nested_article:
        topic: Relational schema invariants
        title: Expressing rules with constraints
        brief: Teach how to translate application invariants into database constraints and identify what
          remains outside their scope. Develop a booking schema through required values, candidate keys,
          tenant-scoped references, conditional uniqueness, mutually dependent rows and non-overlapping
          reservations. Make each example end with an enforcement decision and valid and invalid changes.
          Check the selected engine's null, timing and constraint capabilities; reshape the data where
          that makes a rule enforceable, and state the obligations of triggers or transaction protocols
          where it does not. Examine update and deletion actions and finish with an enforcement map and
          concurrency cases for the transactions branch. Leave value representation, transaction anomaly
          analysis and adding constraints to live data to their owning articles.
        href: /review/relational-next/constraints/
      anchor: make-invalid-facts-difficult-to-store
    - title: Store each fact where it belongs
      brief: Use copied customer details, multiple contact columns and repeating session information to
        expose update, insertion and deletion anomalies. Introduce functional dependencies and normalisation
        through repairs that give each fact an owner. Distinguish a historical price agreed at booking
        from an accidental copy of the current session price; similar values need not represent the same
        fact. Establish normalisation as a way to reason about correctness and change, without requiring
        a tour of every normal form.
      nested_article:
        topic: Relational normalisation and deliberate redundancy
        title: Normalisation and deliberate redundancy
        brief: Teach how to recognise facts with different dependencies, split their storage without losing
          meaning, and justify retaining a derived copy. Extend the booking design with candidate-key,
          partial-dependency, transitive-dependency and independent-set cases; introduce normal-form names
          only when they explain a consequential choice. Check both reconstruction and enforceability
          after a split. Compare repeated attributes, cached totals, summary tables and materialised results
          through their read benefit and maintenance contract. Finish with a defensible design and a falsifiable
          case for its redundancy, using the performance and transaction branches for detailed validation
          rather than expanding this into a theory or optimisation curriculum.
        href: /review/relational-next/normalisation/
      anchor: store-each-fact-where-it-belongs
    - title: Decide what changes and what must be remembered
      brief: Walk a booking through amendment, cancellation, customer deletion and later reporting. Separate
        current state, an agreed historical fact and evidence of a change. Explain why overwriting or
        adding a deleted flag is a decision about meaning, visibility, uniqueness and references. Record
        retention and erasure requirements early enough that the schema can support them, without prescribing
        jurisdiction-specific legal rules.
      nested_article:
        topic: Relational history and data lifecycle design
        title: Modelling history and data lifecycles
        brief: Teach how to choose among current-state rows, immutable snapshots, change records and effective-dated
          versions for concrete relational requirements. Distinguish when a fact applied from when the
          database recorded it, introducing both dimensions only when late information and corrections
          require them. Design version identity, historical references, interval boundaries and overlap
          rules so point-in-time questions have a defined answer. Compare status changes, tombstones,
          archival and deletion through their effects on references, uniqueness, reporting, retention
          and erasure. Bound the evidence that history rows provide and the removal achieved by deleting
          live rows; refer operational procedures and live lifecycle changes to their owning branches.
        href: /review/relational-next/history/
      anchor: decide-what-changes-and-what-must-be-remembered
    - title: Test the schema against the application's life
      brief: Assemble the booking schema into a reviewable design with row meanings, key choices and an
        invariant inventory. Trace representative reads and changes, including an empty database, missing
        references, duplicate input, a tenant boundary, customer merges, corrected history and deletion.
        Demonstrate simple queries to catch accidental many-to-many multiplication and ambiguous meaning,
        leaving SQL instruction to its own branch. Separate database-enforced rules from transaction and
        application responsibilities, identify workload checks for performance review, and record unresolved
        assumptions and expected future changes. End with evidence that a design meets requirements, rather
        than a claim that one schema fits every application.
      anchor: test-the-schema-against-the-application-s-life
- id: a02
  href: /review/relational-next/sql/
  article:
    topic: Querying and changing relational data with SQL
    title: Working with SQL
    brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database to
      expressing and checking substantial application and analytical queries. Teach selection, joins,
      aggregation, subqueries, set operations, window calculations and recursion where they solve useful
      relational problems. Develop precise reasoning about duplicates, nulls, ordering, time, pagination
      and data changes. Teach how to establish expected results and test edge cases. Distinguish portable
      concepts from dialect behaviour without attempting an exhaustive syntax catalogue; leave execution-cost
      diagnosis to its own branch.
    heading:
    - title: Start with a database you can inspect and reset
      brief: Introduce a small order-and-payment database with supplied setup and reset scripts. Show
        how to connect, identify the engine and version, inspect tables, columns, keys and sample rows,
        execute a statement and read an error. Explain which commands belong to the client and which are
        SQL. Keep the exercise disposable and mark implementation-specific syntax at its first use.
      anchor: start-with-a-database-you-can-inspect-and-reset
    - title: Decide what one result row means
      brief: 'Translate a request such as outstanding orders into a result contract: one row per chosen
        entity or group, its columns and types, inclusion rules, treatment of missing facts, duplicate
        policy and required ordering. Hand-calculate a small expected result before writing SQL. Use the
        contract throughout the article to expose plausible answers at the wrong level of detail.'
      anchor: decide-what-one-result-row-means
    - title: Select rows and calculate their columns
      brief: Build SELECT expressions, aliases, FROM and WHERE through a useful first query. Teach comparisons,
        Boolean conditions and precedence, CASE, explicit column selection and DISTINCT. Explain the logical
        transformation of a query as a reasoning aid rather than an execution trace. Establish that repeated
        values and repeated result rows are meaningful until the result contract says otherwise.
      anchor: select-rows-and-calculate-their-columns
    - title: Make values, missing facts and time explicit
      brief: Establish null as a missing value and show why an ordinary comparison cannot replace IS NULL.
        Introduce three-valued predicates and show which rows a filter retains. Use an amount calculation
        and a reporting date boundary to motivate checking expression types, casts and time semantics
        before trusting a result.
      nested_article:
        topic: SQL expression semantics, missing values and time
        title: Getting SQL values right
        brief: Teach practitioners to recognise and repair plausible wrong answers caused by SQL expression
          semantics. Extend the parent's basic null example through missing-value logic, deliberate defaults,
          arithmetic, text comparison, conversions and time calculations. Use a compact booking-and-charge
          report with hand-checked expected values, PostgreSQL as the named reference engine, and documented
          dialect differences only where they change the result or the repair. Keep representation choices
          in schema design, aggregate and join semantics in their sibling, membership traps in query composition
          and driver conversion in application integration. Stop at the depth needed to write and verify
          ordinary relational queries; no function catalogue or specialist calendar branch is needed.
        href: /review/relational-next/sql-values/
      anchor: make-values-missing-facts-and-time-explicit
    - title: Combine related facts without changing the question
      brief: Walk through a join with a tiny row-by-row result and then group order lines into a total.
        Make input and output row identity visible. Introduce inner and left joins, ON, GROUP BY, aggregates
        and HAVING sufficiently to read and build a basic report, then expose the inflated total caused
        by joining two independent one-to-many relationships.
      nested_article:
        topic: SQL joins, cardinality and aggregation
        title: Joining and summarising data
        brief: 'Build correct multi-table application queries and reports by keeping the meaning of one
          result row explicit. Develop join cardinality, outer-join filtering, grouping, counts, conditional
          totals and the repair of double-counting with a small connected set of checked examples. Follow
          the parent-first reading path. Before the first worked task, tell contextual entrants to read
          Working with SQL''s section Express a larger question in checkable stages: its small staged
          query supplies the derived-table or CTE notation used here. Assume that section alongside the
          parent''s first join and grouped query; concentrate on cases that produce plausible wrong answers.
          No composition tutorial or prerequisite visit to Composing larger SQL queries is needed. Identify
          the example engine and consequential dialect behaviour at first use. Keep detailed existence
          and membership semantics with Composing larger SQL queries, expression semantics with Getting
          SQL values right, and execution methods and costs with performance. This article supplies the
          depth needed for expert relational practice without a further reporting or join-specialist branch.'
        href: /review/relational-next/joins-and-aggregation/
      anchor: combine-related-facts-without-changing-the-question
    - title: Express a larger question in checkable stages
      brief: Complete one useful unpaid-order report with a basic common table expression or derived result
        and an EXISTS test for related payments. Inspect each stage against its result contract and check
        the final answer, leaving the reader able to organise an ordinary query without further reading.
        Briefly motivate set operations and repeated parent-child expansion as different questions developed
        in the child; recursion is optional for traversal tasks. Distinguish this logical organisation
        from a description of physical execution.
      nested_article:
        topic: SQL subqueries, set operations and recursive queries
        title: Composing larger SQL queries
        brief: Extend the parent's completed report and existence test with the correctness decisions
          needed when queries return scalar values, supply tables, compare memberships or combine results.
          Make cardinality, correlation, null policy, compatible types and duplicate policy explicit.
          Explain how a checked query becomes a reusable view without implying an execution strategy.
          Offer one optional hierarchy traversal with deliberate termination, cycle, multiplicity and
          ordering rules. Use a named engine and identify consequential dialect differences; leave execution
          costs, materialisation and plan diagnosis to performance, and view deployment to evolution.
        href: /review/relational-next/query-composition/
      anchor: checkable-stages
    - title: Compare rows while keeping their detail
      brief: Contrast a grouped total with a per-order row carrying its customer's total. Introduce OVER,
        partition and ordering through that difference, then motivate ranking and running calculations.
        Show why the rows available to a calculation and the order eventually displayed are separate decisions.
      nested_article:
        topic: SQL window calculations
        title: Calculating across related rows
        brief: Teach window calculations as a way to compare and summarise related rows while retaining
          the required detail. Develop latest rows per entity, top items per group, shares of totals,
          running and moving totals, and changes from an earlier event using two small, hand-checked datasets.
          Distinguish input rows, partitions, ordering, peers and frames, and make ties, missing periods
          and filtering choices observable in expected results. Use a named PostgreSQL version for runnable
          examples, check consequential behaviour against its primary documentation, and identify dialect
          differences only when they change a reader's query or result. Assume the parent's basic query
          and staging workflow; link value semantics, aggregation and execution-cost diagnosis to their
          existing owners. Stop at reliable application and reporting calculations rather than a function
          catalogue or analytical specialism.
        href: /review/relational-next/window-functions/
      anchor: compare-rows-while-keeping-their-detail
    - title: Order and page a result deliberately
      brief: Teach a complete ORDER BY with tie-breakers, explicit null placement where supported, and
        LIMIT or the chosen dialect's equivalent. Compare offset and keyset pagination by walking a small
        ordered result, including composite cursors, tied values and page boundaries. Explain how insertion,
        deletion and changed sort values between requests affect the traversal contract. Link snapshot
        and transaction guarantees to the concurrency branch and access-path costs to performance rather
        than claiming a cursor alone freezes a result.
      anchor: order-and-page-a-result-deliberately
    - title: Change the intended rows and inspect the outcome
      brief: Introduce INSERT, UPDATE and DELETE on the disposable data, showing predicates, affected
        rows and returned values where supported. Connect a change to its precondition and postcondition,
        including a conditional update that can match zero rows. Introduce transaction grouping and rollback
        for practice, while leaving concurrent correctness and failure guarantees to their owning branch.
      nested_article:
        topic: SQL data modification
        title: Changing data with SQL
        brief: Make INSERT, UPDATE and DELETE express a deliberate change to a known target set, then
          establish whether their results satisfy the intended postcondition. Extend the parent's first
          change workflow through set-based changes, insert-from-query, defaults and generated identifiers,
          constraint failures, ambiguous source matches and conflict-handling choices. Use a small order-and-stock
          fixture in a named PostgreSQL version, checking consequential behaviour against its primary
          documentation and recording actual results separately from illustrative examples. Keep conflict-handling
          inserts, upsert and MERGE together as an outcome decision; identify consequential dialect differences
          without building a syntax catalogue. Use bounded transactions for disposable exercises and link
          to transaction reasoning for concurrent correctness, application integration for retries and
          idempotency, and evolution for production corrections and backfills.
        href: /review/relational-next/changing-data/
      anchor: change-the-intended-rows-and-inspect-the-outcome
    - title: Check the answer before trusting the query
      brief: Finish the outstanding-orders task with an explicit expected result and repeatable setup,
        query and reset steps. Use a compact fixture set covering empty inputs, absent relationships,
        duplicate details, nulls, ties, boundary timestamps and zero or multiple update matches; children
        test the additional failure cases they introduce. Compare row multiplicities and types as well
        as values; compare order only when promised. Check each intermediate result and a few independent
        totals or invariants rather than accepting one attractive sample output. Establish that passing
        correctness checks does not establish acceptable execution cost, and link to the performance branch
        when the answer is correct but too expensive.
      anchor: check-the-answer-before-trusting-the-query
- id: a03
  href: /review/relational-next/transactions/
  article:
    topic: Relational transactions and application correctness
    title: Making concurrent changes correct
    brief: Teach practitioners to state application invariants, choose transaction boundaries and preserve
      those invariants under concurrent execution and failures. Connect isolation anomalies to locking,
      versioned reads, conflict detection, constraints and serialisation, using labelled illustrative
      schedules and verified engine behaviour. Develop practical choices among atomic statements, conditional
      changes, locks and stronger isolation, including deadlocks, retries and uncertain commit outcomes.
      Explain the database's durability boundary and the limit of transactions across external effects;
      leave detailed client integration and service recovery procedures to their respective articles.
    heading:
    - title: Start with the fact that must remain true
      brief: Use a reservation example to express a precise rule about remaining capacity, reservations
        and ownership. Separate an invariant from a convenient sequence of application steps, and name
        every writer that could affect it. Establish the invariant and acceptable outcomes before choosing
        SQL or an isolation level.
      heading:
      - title: Put the complete change inside a boundary
        brief: Decide which related changes must succeed or fail together. Explain commit, rollback and
          visibility through a successful reservation and a failed one; distinguish atomicity from protection
          against concurrent decisions. Include transaction lifetime and savepoints only as needed to
          explain which work a rollback undoes, leaving connection and request handling to integration.
        anchor: put-the-complete-change-inside-a-boundary
      - title: Let the database reject invalid states where it can
        brief: Map suitable invariants to keys, uniqueness, references and checks, while distinguishing
          their scope from rules over several rows or external facts. Show why an application pre-check
          is not itself enforcement. Refer to data design for constraint syntax and modelling, and to
          schema evolution for deploying constraints on a live database.
        anchor: let-the-database-reject-invalid-states-where-it-can
      anchor: start-with-the-fact-that-must-remain-true
    - title: Two correct-looking transactions can make an incorrect result
      brief: Interleave two reservation attempts and compare their reads, decisions and writes against
        the stated invariant. Introduce a labelled illustrative schedule with explicit initial state,
        transaction boundaries and outcomes. Make the difference between this model and an observed engine
        execution unmistakable.
      heading:
      - title: The protection must cover the decision as well as the write
        brief: Explain stale read-modify-write decisions and lost changes, then use a multirow staffing
          rule to reveal a failure that separate row updates cannot expose. Introduce read dependencies,
          predicates and newly matching rows through these decisions rather than as a catalogue of anomaly
          names.
        anchor: the-protection-must-cover-the-decision-as-well-as-the-write
      - title: A repeatable view does not by itself prove the rule
        brief: Distinguish a statement's view, a transaction's view and a serialisable execution contract.
          Explain serial equivalence using the example and separate that guarantee from real-time ordering
          and the freshness of a particular read. State which observations and aborts would change the
          application's reasoning.
        anchor: a-repeatable-view-does-not-by-itself-prove-the-rule
      anchor: two-correct-looking-transactions-can-make-an-incorrect-result
    - title: Choose protection for the invariant you actually have
      brief: Develop a worked decision sequence from a single counter to a uniqueness rule and then a
        rule spanning rows. For each choice, identify the protected fact, the database guarantee it relies
        on, competing writers and the observable success or failure result. Prefer the simplest argument
        that covers every writer.
      heading:
      - title: Express a change and its condition together
        brief: Replace a separate read and overwrite with an atomic expression or a conditional change.
          Explain checking the affected rows or returned result, version tokens and concurrent conflict
          behaviour. Distinguish a failed business condition from a transaction abort and avoid implying
          one row's condition protects an unrelated aggregate.
        anchor: express-a-change-and-its-condition-together
      - title: Coordinate decisions that span several rows
        brief: Compare locking a stable coordination row, locking the relevant existing rows and requesting
          serialisable execution. Explain why the chosen rows or predicates must cover every way the rule
          can be broken, including new rows and writers using another code path. Introduce the deeper
          lock design work after making this coverage argument concrete.
        nested_article:
          topic: Relational locking and concurrency protocols
          title: Designing changes that coordinate with locks
          brief: Teach practitioners to construct and assess explicit locking protocols for relational
            invariants that ordinary constraints or a conditional row change cannot express. Develop one
            reservation-capacity example using PostgreSQL at a stated isolation level, with primary-source
            checks and reproducible sessions required before presenting engine behaviour as established.
            Cover existing and missing rows, inserts, coordination rows, lock modes, acquisition order,
            waiting and deadlocks. Finish with an argument covering every writer and a two-session check.
            Link to isolation for interpreting engine contracts and to application integration for retry
            machinery; do not expand into a queue or lock catalogue.
          href: /review/relational-next/locking/
        anchor: coordinate-decisions-that-span-several-rows
      anchor: choose-protection-for-the-invariant-you-actually-have
    - title: Understand the isolation contract behind the choice
      brief: Connect versioned reads, locking and conflict detection to what a transaction can observe,
        which writes can proceed and when a transaction must wait or abort. Establish that an isolation
        name is insufficient evidence for the selected engine's behaviour; show how to read its contract
        and check an example before relying on it.
      heading:
      - title: Versions and locks answer different questions
        brief: Trace a reader and a writer through a minimal versioned example. Explain snapshot selection,
          visibility and concurrent write arbitration without claiming that versioned reads eliminate
          locks. Distinguish ordinary reads from locking reads and account for statement boundaries and
          predicate coverage when assessing a decision.
        anchor: versions-and-locks-answer-different-questions
      - title: Stronger isolation can reject a result instead of waiting
        brief: Relate serialisable guarantees to preventing or detecting incompatible dependencies. Explain
          why a valid application transaction can be aborted and why successful execution of individual
          statements does not establish eventual commit. Introduce deeper comparison only where the implementation
          changes the concurrency protocol or required failure handling.
        nested_article:
          topic: Relational isolation guarantees and implementations
          title: Reading and testing isolation guarantees
          brief: Teach relational practitioners to turn an engine's documented isolation contract and
            reproducible concurrent sessions into a justified choice of protection and abort handling.
            Reuse a reservation invariant to trace snapshot visibility, locking reads and concurrent changes,
            then introduce a staffing invariant only to expose a distinct multirow dependency. Compare
            PostgreSQL and MySQL InnoDB only where a verified difference changes the application decision.
            Distinguish snapshot isolation, serialisability and real-time ordering. Label illustrative
            schedules separately from observed runs; record engine version, settings, observations and
            the limited conclusions each run supports. Link to the locking article for protocol construction
            and to application integration for retry machinery. Stop at the implementation depth needed
            to use relational transactions correctly.
          href: /review/relational-next/isolation/
        anchor: stronger-isolation-can-reject-a-result-instead-of-waiting
      anchor: understand-the-isolation-contract-behind-the-choice
    - title: An aborted transaction must be reconsidered as a whole
      brief: Follow a deadlock and a serialisation conflict to rollback, identifying which earlier reads
        and decisions must be repeated. Explain consistent lock order, bounded transaction duration and
        the limits of deadlock avoidance. Distinguish business rejection, known abort and a failure whose
        commit outcome is unknown; make the database guarantee the basis of the decision to retry.
      heading:
      - title: Retrying one statement can preserve a stale decision
        brief: Show why repeating only the failed write can reuse assumptions that no longer hold. Establish
          the whole-transaction retry requirement where the engine's contract calls for it, including
          rechecking the invariant, while linking to application integration for retry limits, backoff,
          deadlines, idempotency and driver-specific error handling.
        anchor: retrying-one-statement-can-preserve-a-stale-decision
      - title: Losing the reply does not prove rollback
        brief: Place connection loss before a commit request, during commit and after a successful commit
          to distinguish a known abort from an uncertain result. Explain why blindly repeating the business
          operation is unsafe when commit is unknown, and hand reconciliation and durable request identities
          to the application integration article.
        anchor: losing-the-reply-does-not-prove-rollback
      anchor: an-aborted-transaction-must-be-reconsidered-as-a-whole
    - title: Commit has a durability boundary and a system boundary
      brief: Explain why an acknowledged commit has meaning only under a stated durability and failure
        contract. Introduce durable logging and recovery just far enough to separate committed work from
        in-memory state, then connect engine settings, storage and replication acknowledgement to the
        failures that may lose an acknowledged change. Link to operations for service choices and recovery
        tests.
      heading:
      - title: A database rollback cannot undo an external effect
        brief: Trace charging a payment or publishing a message before and after database commit, exposing
          both failure windows. Establish that a local transaction cannot make an independent service
          participate merely by calling it inside the transaction. Introduce recording intent with the
          database change and link to application integration for delivery, deduplication and reconciliation
          design; keep distributed transaction theory outside this article.
        anchor: a-database-rollback-cannot-undo-an-external-effect
      anchor: commit-has-a-durability-boundary-and-a-system-boundary
    - title: Check the argument with competing sessions and failures
      brief: 'End with a compact procedure: write the invariant and permitted outcomes, enumerate writers
        and competing schedules, name the exact engine guarantees, and run controlled concurrent sessions
        against a disposable database. Include contention, insert races, a known abort and an interrupted
        commit response. Check final state and application decisions, record version and settings, and
        explain that successful test runs support but do not replace the coverage argument. Revisit the
        initial reservation to justify the chosen protection and identify which application and operational
        responsibilities remain.'
      anchor: check-the-argument-with-competing-sessions-and-failures
- id: a04
  href: /review/relational-next/applications/
  article:
    topic: Relational application integration
    title: Building applications around a relational database
    brief: Follow an application request through its driver, connection, statements and transaction to
      the response and any external effects. Teach how to preserve values and authority at those boundaries,
      understand the SQL an abstraction performs, bound resource use and recover from failures with evidence
      about what completed. Build on the transaction article's correctness guarantees; deepen connection
      management, query composition, request recovery and external work only where their separate decisions
      need it.
    heading:
    - title: Follow one request across the boundaries
      brief: Trace an order placement from validated input through connection acquisition, bound statements,
        transaction completion and response delivery. Identify which component owns each step and where
        a successful database operation can outlive the request that started it. Use an explicitly illustrative
        timeline to distinguish application progress from evidence of database completion. Link to the
        transaction branch for atomicity, isolation and durability rather than deriving those guarantees
        again.
      anchor: follow-one-request-across-the-boundaries
    - title: Preserve values and authority when sending SQL
      brief: Establish the driver as a boundary with an explicit conversion contract and an explicit database
        identity. Show how a plausible value or apparently safe query can change meaning before it reaches
        the database.
      heading:
      - title: Bind values and check their round trip
        brief: Explain parameter binding with a small query and distinguish values from SQL structure.
          Inspect the selected driver's handling of large integers, exact decimals, nulls, dates, timestamps
          and time zones; choose representations deliberately and test representative round trips. Make
          conversion and truncation failures visible. Treat prepared statement reuse and parameter syntax
          as implementation behaviour to verify, without turning this into a protocol catalogue.
        anchor: bind-values-and-check-their-round-trip
      - title: Keep untrusted input out of SQL structure
        brief: Teach parameterised statements for values, allowlisted choices and supported identifier
          quoting for dynamic identifiers or sort clauses, and scrutiny of raw-query escape hatches. Distinguish
          input validation from injection prevention. Include ORM-generated and stored-routine calls in
          the same boundary reasoning rather than treating their names as guarantees of safety.
        anchor: keep-untrusted-input-out-of-sql-structure
      - title: Give each application action the authority it needs
        brief: Separate authenticated application identity, database credentials and row-level authorisation.
          Show where tenant predicates or verified database policies must apply to reads and changes,
          including background jobs and raw queries. Keep administrative and migration authority out of
          ordinary request paths, and prevent sensitive values leaking into query logs. Link service credential,
          encryption and policy operation details to the operations branch.
        anchor: give-each-application-action-the-authority-it-needs
      anchor: preserve-values-and-authority-when-sending-sql
    - title: Borrow a connection for bounded work
      brief: Establish that connections carry state and that a transaction must use the connection or
        transaction handle required by the driver. Keep user think time and unrelated network work outside
        its lifetime. Show acquisition, commit or rollback, result cleanup and release on success and
        error paths, with failed connections discarded according to the driver contract. Explain how long
        occupancy turns application concurrency into pool queues before introducing the focused diagnosis.
      nested_article:
        topic: Relational connection and transaction lifecycle management
        title: Managing connections and transaction lifetimes
        brief: Teach how to own a stateful database connection from acquisition to safe reuse or disposal,
          including exceptions, cancellation, streaming and shutdown. Separate application handles, pool
          leases, transactions and database sessions; verify their relationship against the chosen driver
          and any proxy. Diagnose occupied pools using acquisition wait, lease duration, active database
          work and connection counts, then bound admission and aggregate connection demand. Extend the
          parent's ordinary request example through resource failures rather than repeating it. Own cancellation
          and connection-reuse mechanics here; link to request recovery for deadlines, idempotency and
          decisions about uncertain operation outcomes, to transactions for correctness guarantees and
          to performance and operations for workload capacity and service budgets.
        href: /review/relational-next/connections/
      anchor: borrow-a-connection-for-bounded-work
    - title: Make the abstraction's database work visible
      brief: Compare an explicit query with an ORM operation that appears equivalent. Count statements,
        round trips, returned rows and materialised objects; identify implicit reads or writes and transaction
        boundaries. Establish that object convenience does not remove the need to understand the SQL and
        its result semantics. Link execution-plan diagnosis to the performance branch after identifying
        the application operation that generated the work.
      nested_article:
        topic: Relational query composition and ORM behaviour
        title: Controlling the queries your application performs
        brief: Make handwritten SQL, query builders and ORM operations accountable for the database work
          a request performs. Use one bounded order-list example to trace statements, round trips, returned
          rows and materialised objects; diagnose lazy loading, N+1 reads, joined collection multiplication
          and implicit writes. Choose projections, loading strategies and batch sizes that preserve the
          required result while bounding application work. Inspect pagination and streaming at the abstraction
          boundary, preserve binding and authorisation during composition, and test representative query
          and result bounds against the selected database and library. Build on the parent's ordinary
          request and security explanation; leave SQL semantics, physical execution tuning, connection
          cleanup and request recovery with their existing owners.
        href: /review/relational-next/generated-queries/
      anchor: make-the-abstraction-s-database-work-visible
    - title: Recover according to what the application knows
      brief: Distinguish a rejected operation, a confirmed transaction abort and an operation whose outcome
        is unknown to the caller. Use a lost response after a possible commit to explain why repeating
        the request can repeat its effect. Relate request deadlines, cancellation and retries to the actual
        driver and database contract, using the transaction branch's failure distinctions as the starting
        point.
      nested_article:
        topic: Relational request deadlines, retries and idempotency
        title: Recovering database requests safely
        brief: Design a bounded application request across pool acquisition, statements, transaction completion
          and response delivery. Decide what may be repeated from evidence about the database outcome,
          then give a logical operation a durable identity so overlapping attempts and lost responses
          can be resolved safely. Keep deadline budgets, retry eligibility, idempotency records and reconciliation
          within one operation contract. Build on the transaction branch's guarantees; link connection
          cleanup mechanics and external-effect recovery to their owners.
        href: /review/relational-next/request-recovery/
      anchor: recover-according-to-what-the-application-knows
    - title: Make work beyond the transaction recoverable
      brief: Trace an order commit followed by a notification or payment call and show the separate failure
        windows. Establish that a durable record of intent can make unfinished work discoverable while
        the external effect still needs its own duplication and reconciliation rules. Introduce database
        jobs and database-derived events through the same concrete recovery problem, without expanding
        into a general messaging curriculum.
      nested_article:
        topic: Relational background work and external effects
        title: Connecting transactions to background work and events
        brief: Make work beyond a relational transaction discoverable and recoverable. Follow one committed
          order and its external fulfilment request through a transactional job or outbox record, worker
          ownership, repeated attempts and uncertain external outcomes. Compare direct calls and database
          change capture by their remaining failure windows. Bound event contracts, ordering, retention
          and replay to what is needed to account for committed intent; reuse transaction concurrency
          and request-idempotency mechanisms rather than deriving them again.
        href: /review/relational-next/background-work/
      anchor: make-work-beyond-the-transaction-recoverable
    - title: Test the complete application path
      brief: 'Assemble a compact acceptance exercise for the running order example: exact value round
        trips, cross-tenant attempts, bounded query counts, exhausted pools, leaked or cancelled work,
        concurrency conflicts, a lost commit response and repeated external delivery. Use a real selected
        database and driver for integration guarantees; label local simulations as models. Record the
        evidence needed to distinguish waiting for a connection, executing a statement, completing a transaction
        and finishing background work. Link deeper workload measurement and service incident response
        to their owning branches.'
      anchor: test-the-complete-application-path
- id: a05
  href: /review/relational-next/performance/
  article:
    topic: Relational execution and performance
    title: Understanding and improving database performance
    brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
      Build the necessary understanding of row and index storage, buffering, version retention, access
      paths, join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and
      observed plans without confusing their units or treating estimates as execution evidence. Connect
      query shape, indexes, physical layout, maintenance and resource contention to workload latency,
      throughput and capacity. Choose and validate changes with representative data and concurrency, including
      write and operational costs; deepen engine internals only where they explain a diagnosis or intervention.
      Give the parent a complete ordinary diagnosis-to-measured-improvement loop. Tell readers to finish
      this article, including its concluding comparison method, before selecting an optional contextual
      investigation by the question their evidence raises.
    heading:
    - title: Start with the work people need to finish
      brief: 'State the reading contract first: complete this parent through the final comparison method
        before following its contextual links. The children are optional investigations selected by a
        concrete question, not a required sequence through storage, indexes, plans and concurrency. Follow
        an application''s growing order history through a slow customer lookup, a reporting query and
        concurrent order changes. Define acceptable latency, throughput and resource cost for each operation.
        Distinguish a frequent small cost from an occasional expensive request, and database execution
        from waiting for a connection, network transfer and application processing. Establish a baseline
        with query frequency, latency distributions, representative parameters, row counts and concurrent
        activity before choosing a remedy.'
      anchor: start-with-the-work-people-need-to-finish
    - title: Find where time and work accumulate
      brief: Move from an affected operation to evidence about execution, blocking, storage reads, CPU,
        temporary work and result transfer. Compare a query's typical and slow executions with changes
        in parameters, data size and concurrent work. Separate observations from hypotheses; a slow query
        or a busy resource does not by itself identify the limiting cause. Use the operations branch for
        service monitoring and incident procedures, and the integration branch for pool waits and excessive
        round trips.
      anchor: find-where-time-and-work-accumulate
    - title: Rows have a physical home and a lifetime
      brief: Establish the working model needed to explain why equal result sizes can require very different
        work. Introduce pages, row and index organisation, cached and uncached access, locality, row width
        and retained versions. Connect logical changes and long transactions to the physical work and
        retained space that a performance investigation must measure, while keeping durability and isolation
        guarantees in their owning branches. After completing the parent, choose the storage investigation
        when unexplained page traffic, working-set growth or retained space makes the physical organisation
        consequential.
      nested_article:
        topic: Relational physical storage and working sets
        title: How stored rows become physical work
        brief: Teach the physical model needed to explain page traffic, cache pressure and unreclaimed
          space in relational workloads. Follow one changing table through reads, wider rows, updates,
          retained versions and space reuse, connecting each mechanism to evidence and a possible intervention.
          Use selected PostgreSQL and InnoDB differences only when they change that diagnosis; verify
          the chosen version's behaviour against primary documentation. Keep row locators here only far
          enough to understand physical locality; the index article owns traversal, key order, coverage
          and the detailed secondary-index/base-row access path. Treat physical pruning as one measurable
          layout intervention. Link transaction semantics and operational reorganisation procedures to
          their owners, and use the parent's comparison method rather than teaching benchmarking again.
          Stop at the depth needed for relational engineering decisions, without a separate storage-engine
          or partitioning curriculum.
        href: /review/relational-next/physical-storage/
      anchor: rows-have-a-physical-home-and-a-lifetime
    - title: Give the query a useful route to its rows
      brief: Compare scanning, locating a range through an index and fetching base rows. Explain selectivity,
        ordering and coverage through the running lookup, then show why a small table, a broad request
        or scattered fetches can favour a scan. Introduce composite key order and query expressions as
        practical constraints on useful access. Account for every added index in changes, storage and
        upkeep. After completing the parent, choose the index investigation when the evidence calls for
        designing or comparing access paths; its local plan legend permits that task without first completing
        the full plan-diagnosis investigation.
      nested_article:
        topic: Designing and evaluating relational indexes
        title: Choosing indexes for a workload
        brief: At the opening, require completion of Understanding and improving database performance,
          including its concluding Change one explanation into a measured improvement as the common comparison
          method used here. Derive index candidates from the work a relational workload needs, explain
          how their keys limit and order access, and decide whether their read benefit earns their write,
          space and operating costs. Use one tenant order-history workload with equality filters, a date
          range, an ordered first page and a related-row lookup. Extend it only when another query exposes
          a consequential trade-off. Own B-tree traversal, composite key order, coverage, base-row access
          and index eligibility. Supply a compact local reporting legend before using observed index evidence;
          no sibling article is a prerequisite. Offer Diagnosing a query from its execution plan for deeper
          evidence reading and plan-choice diagnosis. Link physical storage and safe schema changes to
          their owners. Keep the depth at choosing and evaluating relational indexes, without an index-family
          catalogue or another benchmarking curriculum.
        href: /review/relational-next/indexes/
      anchor: give-the-query-a-useful-route-to-its-rows
    - title: Explain the work and test a plan hypothesis
      brief: 'Work through a compact observed plan for the running reporting query, following scans, joins,
        filtering, grouping and ordering. Explain estimated cost versus elapsed execution, estimated versus
        observed rows, per-loop versus total work and inclusive reporting before interpreting the figures.
        Establish safe plan collection on disposable data: execution-based inspection executes effects
        and consumes resources. Carry one ordinary example from slow report to a consequential underestimated
        input, a supported stale-statistics hypothesis and a targeted statistics refresh. Distinguish
        inaccurate estimates from accurately predicted expensive work; changed estimates alone do not
        establish an improvement. State the predicted reduction in repeated work and retain the before/after
        evidence for the concluding workload comparison. Mention parameter skew and prepared execution
        as reasons a result may differ in the application. After completing the parent, choose the plan
        investigation when the question requires following actual operators, explaining an estimate mismatch
        or checking common and rare prepared parameters. It completes that diagnosis in one destination
        rather than handing its central remedy to another article.'
      nested_article:
        topic: Reading and diagnosing relational execution plans
        title: Diagnosing a query from its execution plan
        brief: 'Complete one ordinary slow-query investigation in PostgreSQL: collect safe evidence, follow
          physical rows and repeated work, interpret reporting units, explain a consequential estimate
          error, test a targeted remedy and accept it against the workload. Use the same reporting query
          throughout, including common and rare prepared parameters, so statistics and plan choice resolve
          the original diagnosis rather than begin another tour. Record the concrete engine version and
          verify its behaviour against primary documentation. Distinguish captured evidence from illustrative
          arithmetic and explain what each observation cannot establish. Keep uncommon nodes, parallel
          variants and planner controls conditional and compact. Link index design, storage mechanisms,
          concurrent-load diagnosis and the parent''s comparison method to their owners; do not expand
          into optimiser or storage-engine specialism. No further article is required to finish this task.'
        href: /review/relational-next/query-plans/
      anchor: explain-the-work-and-test-a-plan-hypothesis
    - title: A faster query can still make the workload slower
      brief: Put the candidate improvements back beside concurrent lookups, reports and changes. Connect
        higher concurrency to queues and competition for CPU, memory, I/O and locks; account for per-operation
        memory and parallel workers. Explain how an index can help reads while making writes more expensive,
        and how a long report can change the conditions for short requests. Use transaction and integration
        guidance for lock lifetimes, retry behaviour and admission at the application boundary. After
        completing the parent, choose concurrent-load diagnosis when isolated query evidence does not
        explain latency or completed throughput under competing work; use operations for monitoring and
        provisioning.
      nested_article:
        topic: Relational workload contention and capacity
        title: Improving performance under concurrent load
        brief: Diagnose why a relational workload slows as concurrent demand grows, and choose changes
          that improve useful completed work and tail latency. Distinguish the work of an individual execution
          from queuing and competition for resources. Use one mixed workload and selected engine evidence
          to connect demand, outstanding work, resource pressure and serial bottlenecks to an intervention.
          Reuse the parent's common comparison method and the storage, plan, transaction and application-integration
          explanations. Keep pool implementation, service budgets, provisioning procedures and recovery
          with their existing owners.
        href: /review/relational-next/concurrent-load/
      anchor: a-faster-query-can-still-make-the-workload-slower
    - title: Change one explanation into a measured improvement
      brief: 'Complete the ordinary report investigation by comparing the statistics remedy with its recorded
        baseline under representative application work. State the observed result and accept, reject or
        revise the hypothesis; do not require a child article to finish this loop. Establish the reusable
        comparison method here before the optional investigations apply it. Turn each diagnosis into a
        prediction: which work should disappear, which measurement should change and what new cost might
        appear. Compare a query rewrite, index change, layout or statistics change, maintenance intervention
        and added resources as remedies for particular evidence. Verify results and edge cases before
        measuring. Test with representative size, distributions, parameter classes, warm and cold conditions,
        concurrency and ongoing changes; record the engine version and configuration, measurement variance
        and instrumentation limits. Measure end-to-end latency distributions, throughput, resource use,
        write cost and maintenance burden together. Set acceptance and regression criteria, retain reproducible
        evidence and use schema-evolution guidance for deploying a successful change safely. Close by
        revisiting the running workload and identifying when growth requires another investigation.'
      anchor: change-one-explanation-into-a-measured-improvement
- id: a06
  href: /review/relational-next/live-changes/
  article:
    topic: Relational schema and data evolution
    title: Changing a live database
    brief: Teach engineers to change schemas, stored data and database locations while applications continue
      to run. Use a change to an order system to connect application compatibility, physical database
      work, concurrent writes, verification and recovery. Give every change an explicit sequence, measurable
      completion conditions and a safe response to interruption. Introduce deeper procedures for schema
      changes, data jobs and database moves only where they enable reliable relational practice. Treat
      retention and deletion as changes to the guarantees readers and recovery procedures can rely on.
      Check concrete procedures against the selected engine, version and deployment.
    heading:
    - title: A change has more than one finish line
      brief: Start with an order system replacing a free-text delivery address with a structured address.
        Separate deploying code, making the schema usable, converting existing rows, switching readers
        and retiring the old representation. State the invariant that must hold through the transition,
        the applications and jobs using each representation, and the evidence needed before advancing.
        Distinguish schema migration records from proof that the whole change is complete.
      anchor: a-change-has-more-than-one-finish-line
    - title: Keep old and new applications compatible
      brief: Draw the successive application and schema versions, including overlapping deployments, background
        jobs and delayed clients. Work through adding the new representation, populating it, switching
        reads and removing the old one. Make concurrent writes and the authoritative representation explicit;
        dual writing alone is not a consistency argument. Explain when a short coordinated maintenance
        window costs less and provides clearer guarantees than a long compatibility period. Link transaction
        and application integration guidance for atomic writes and request-level retry behaviour.
      anchor: keep-old-and-new-applications-compatible
    - title: Find out what the database must do
      brief: Translate the proposed change into catalogue work, scans, validation, index construction,
        row movement or copying as applicable to the chosen engine. Explain why an online label does not
        establish a safe lock wait, resource cost or failure path. Inventory dependent views, constraints,
        indexes, generated values, prepared statements and replication consumers. Establish lock and execution
        limits, storage headroom, workload budgets and abort criteria using a representative rehearsal
        and verified engine behaviour. Link performance diagnosis and operational monitoring rather than
        repeat their general methods.
      nested_article:
        topic: Safe relational schema changes
        title: Changing schemas without breaking applications
        brief: Turn an intended schema change into an executable, interruptible procedure with measured
          limits on production impact. Use PostgreSQL 18 as the worked engine, pinning the exact server
          and migration-tool versions before writing runnable examples. Reuse the parent's application-compatibility
          sequence and concentrate on locks, queued work, scans, rewrites, dependencies and deployment
          restrictions. Develop staged constraint validation and a large column-type change, then use
          a compact operation table to cover related column, index and table changes. Give every stage
          preconditions, transaction boundaries, completion evidence and a response to failure. Link the
          data-job and operations owners for their procedures; do not create a separate article for each
          DDL command or engine.
        href: /review/relational-next/schema-changes/
      anchor: find-out-what-the-database-must-do
    - title: Move existing data while writes continue
      brief: 'Show why deploying a new column leaves existing rows unfinished and why one large update
        may exceed an acceptable transaction or workload budget. Introduce bounded batches, durable progress,
        restart safety and explicit ownership of concurrent changes. Distinguish a backfill from an import
        or correction: each needs an input contract, duplicate policy, error handling and reconciliation.
        Require a concrete meaning of complete, including rows created or changed during the job.'
      nested_article:
        topic: Relational backfills, imports and corrections
        title: Running reliable data changes
        brief: Teach resumable, idempotent data jobs through one backfill that converts the order system's
          delivery address into a structured representation while orders continue to change. Develop an
          explicit input contract, complete work coverage, protection against stale writes, atomic progress
          and recovery after an uncertain batch outcome. Bound the effect on the live workload and reconcile
          meaning as well as row coverage. Contrast external imports and production corrections only where
          their input, duplicate or recovery contracts change the procedure. Reuse the parent's application
          compatibility argument and link transaction guarantees, request retries and operational diagnosis
          rather than teach them again. Verify executable procedures against the selected engine and version.
        href: /review/relational-next/data-changes/
      anchor: move-existing-data-while-writes-continue
    - title: Switch traffic only when the destination is ready
      brief: Extend the same staged-change reasoning to moving a database. Separate copying existing data,
        carrying later changes, validating the destination and transferring write authority. Explain that
        a replica caught up at one instant is not yet a complete cutover argument. Introduce readiness
        gates for data, application behaviour, connections, permissions and performance, and an explicit
        treatment of writes during the switch. Link replication and recovery mechanisms to the operations
        branch.
      nested_article:
        topic: Moving a relational database
        title: Moving databases with a controlled cutover
        brief: Teach one controlled move of an order database from a source to a destination, following
          the copy, intervening changes and transfer of write authority. Choose between a rehearsed write
          pause and a copy with change capture using the allowed outage and measured transfer time. Establish
          compatibility, a consistent starting state and an explicit final change boundary; prove that
          the destination meets them before admitting writes. Define abort conditions and explain how
          destination writes change the route back. Reuse the parent article's application compatibility
          method and the operations branch's replication and recovery evidence. Verify concrete commands
          and guarantees against the selected engine, version, deployment and migration tool; do not build
          an engine-pair migration catalogue.
        href: /review/relational-next/database-moves/
      anchor: switch-traffic-only-when-the-destination-is-ready
    - title: Plan recovery before the first irreversible step
      brief: Label each stage as safely retryable, reversible with preserved data, or requiring compensation
        or restoration. Distinguish rolling back a code deployment, reversing a schema operation and undoing
        its data effects; identify the point at which old code can no longer run. Assign ownership and
        observable stop conditions, retain the evidence needed to resume, and decide how to handle partial
        success. Explain how a correction can reverse a transformation only when enough original information
        survives. Link tested backup restoration and point-in-time recovery procedures, including their
        effect on intervening valid writes, to operations.
      anchor: plan-recovery-before-the-first-irreversible-step
    - title: Retire old data and prove the change is finished
      brief: 'Require evidence that old readers and writers have disappeared, the new invariant holds
        and the workload is stable before removing compatibility paths, columns, staging tables or migration
        machinery. Apply this to a retention change: define which records become eligible, what related
        and derived data must change, and how deletion reaches replicas, exports and backup expiry under
        the actual service guarantees. Distinguish removing rows from immediately reclaiming space or
        eliminating every recoverable copy. Plan bounded deletion work and restoration procedures that
        do not silently reintroduce retired data. Finish the running example with a concise change record
        containing validation results, remaining recovery options and the final ownership of the data.'
      anchor: retire-old-data-and-prove-the-change-is-finished
- id: a07
  href: /review/relational-next/operations/
  article:
    topic: Operating and recovering relational services
    title: Running a relational service
    brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service against
      explicit availability, data-loss and recovery requirements. Connect those requirements to access
      boundaries, service signals, capacity, maintenance, topology, backup and incident procedures. Give
      readers the working model needed to choose a safe next action, with contextual articles developing
      the procedures and implementation differences. Distinguish self-managed duties from managed service
      contracts. Keep query tuning, application retry logic and live schema changes in their neighbouring
      branches, and the separate distributed-systems programme outside this branch.
    heading:
    - title: Define what the service must survive
      brief: 'Start with an ordinary application''s database, its users and its operating owner. Turn
        acceptable interruption, acceptable loss of acknowledged changes, recovery time and retained recovery
        history into explicit requirements for named failures. Distinguish service availability, data
        durability and data correctness: meeting one does not establish the others. Include dependencies
        such as identity, storage, keys, networking and the application connection path when defining
        recovery. Use a small failure-and-recovery table to show which mechanisms and evidence each requirement
        demands.'
      heading:
      - title: Assign every operating responsibility
        brief: Compare a self-managed installation with a managed service using the same responsibility
          checklist. Establish who patches, monitors, retains backups, controls keys, initiates failover,
          restores data and proves that applications can use the recovered service. Require documented
          limits, escalation paths and tested procedures rather than treating a service label or availability
          commitment as a recovery design.
        anchor: assign-every-operating-responsibility
      anchor: define-what-the-service-must-survive
    - title: Limit who can reach and change the data
      brief: Follow one application connection through network access, authenticated identity and database
        privileges. Explain why encryption in transit and at rest, least privilege, restricted administrative
        access and audit evidence solve different problems. Establish separate application, migration,
        monitoring, backup and emergency access needs, and include backup copies and recovery keys within
        the security boundary. Keep parameter binding and application injection prevention with the integration
        branch.
      nested_article:
        topic: Securing relational services
        title: Securing a relational service
        brief: Teach how to build and verify operational access boundaries around a relational database,
          using one service's application, migration, reporting, backup and emergency access tasks. Connect
          network reachability, identity, privileges, ownership, encryption and audit evidence to what
          each actor can actually do. Develop safe rotation, revocation and compromise response with selected-engine
          checks and explicit managed-service responsibilities. Keep application query safety and application
          authorisation in integration, restoration procedures in backups, and the common incident decision
          method in service operations. Follow the parent-first reading route through Running a relational
          service; readers entering here directly should read its section Recover the incident without
          destroying the evidence before this article's final compromise exercise. This article supplies
          the operational security depth needed for relational practice; it does not open a general security
          architecture branch.
        href: /review/relational-next/security/
      anchor: limit-who-can-reach-and-change-the-data
    - title: Observe the service before it reaches a limit
      brief: Start with successful and failed application work, latency and demand, then connect those
        observations to connections, active work, waits, CPU, memory, storage latency and free space.
        Include retained versions, transaction logs, replica lag and backup health where the selected
        system exposes them. Explain the difference between a symptom, a resource limit and a cause. Establish
        baselines and headroom for growth, maintenance and recovery, with actionable alerts and a first
        diagnostic step. Link query and workload diagnosis to the performance branch.
      nested_article:
        topic: Relational service monitoring and capacity
        title: Monitoring and sizing a relational service
        brief: Teach practitioners to establish deployment visibility, maintain capacity and growth budgets,
          reserve normal and degraded headroom, and act on useful alerts before a service reaches a limit.
          Produce a dashboard, an evidence-routing table and capacity worksheets tied to service objectives
          and intervention lead times. Reuse the workload measurement and load evidence from Improving
          performance under concurrent load (a28), the sole owner of deep concurrent-workload diagnosis.
          Link to the owning maintenance, topology and restoration procedures for their operational evidence
          and actions.
        href: /review/relational-next/monitoring-and-capacity/
      anchor: observe-the-service-before-it-reaches-a-limit
    - title: Make routine maintenance a controlled change
      brief: Explain how ordinary writes create ongoing storage and statistics upkeep, and why long transactions,
        retention and neglected maintenance can turn gradual growth into an outage. Give each operating
        change an owner, precondition, resource allowance, observation plan and recovery path. Distinguish
        routine upkeep, software patching and major-version upgrades; verify compatibility and recovery
        before altering the production service. Link storage mechanisms and query effects to performance
        and live schema changes to evolution.
      nested_article:
        topic: Relational service maintenance and upgrades
        title: Maintaining and upgrading a relational service
        brief: Teach practitioners to keep a relational service healthy and change its engine version
          through controlled, observable work. Connect required upkeep to the workload and engine mechanisms
          that create it; distinguish automatic work, operator intervention and managed-service duties.
          Build a maintenance and upgrade procedure with explicit resource and interruption budgets, compatibility
          checks, recovery choices and validation. Use a worked service example and current primary engine
          documentation for concrete procedures. Link to performance for storage and query mechanisms,
          to operations neighbours for monitoring, topology and restoration, and to live database changes
          for schema migration or database moves. Keep this as one practical article.
        href: /review/relational-next/maintenance-and-upgrades/
      anchor: make-routine-maintenance-a-controlled-change
    - title: Choose where reads and writes can safely run
      brief: Establish a single writable service as the initial topology, then introduce replicas, failover
        and partitioning through the particular availability, read load, locality or capacity problem
        each addresses. Trace an acknowledged write to a later read and a possible promotion, distinguishing
        replication progress, read freshness and protection from loss. Explain that replication does not
        replace retained recovery history. Introduce the operating costs and transaction boundaries of
        partitioned data without opening a separate distributed-systems curriculum.
      nested_article:
        topic: Relational replication, failover and data placement
        title: Operating replicas and partitioned data
        brief: Choose and operate a relational topology against explicit availability, data-loss, recovery
          and read-freshness requirements. Follow changes from the writer to a replica, distinguish acknowledgement
          from replay and usable reads, then practise safe promotion, exclusion of the former writer,
          reconnection and rejoining. Decide whether local table partitioning preserves the schema and
          earns its continuing lifecycle cost, then distinguish it from distributing database ownership
          and assess the routing, transaction, movement and recovery costs of the latter. Use selected-engine
          and managed-service contracts and bounded failure rehearsals to establish what the deployment
          can actually deliver. Keep consensus theory, query tuning, application retry mechanics and backup
          restoration with their owners.
        href: /review/relational-next/replicas-and-partitions/
      anchor: choose-where-reads-and-writes-can-safely-run
    - title: Prove that the data can be restored
      brief: Compare restoration after accidental deletion, storage corruption and loss of the service.
        Introduce consistent backups, retained transaction history and point-in-time recovery as recovery
        inputs whose coverage and limits must be checked. Include configuration, credentials, encryption
        keys, extensions and sufficient destination capacity in the recovery dependency list. A successful
        backup job is evidence of one step; a timed restoration and application-level validation establish
        what recovery can actually do.
      nested_article:
        topic: Relational backups and tested restoration
        title: Backing up and restoring relational data
        brief: Teach relational practitioners to choose recovery copies for named loss cases and prove
          that they can restore correct data within the required time and loss bounds. Follow one accidental-deletion
          case from backup selection through an isolated restoration and a controlled return to service,
          contrasting complete service loss where the procedure changes. Develop consistency, dependencies,
          retention, independent access, full and point-in-time restoration, selective recovery and measured
          validation. This is the shared restore procedure used by incidents, database moves and adoption
          checks; leave incident command, replica promotion, application reconciliation mechanics and
          migration design to their owners. Check executable procedures against the selected engine and
          service, and distinguish rehearsed results from intended recovery.
        href: /review/relational-next/backup-and-restore/
      anchor: prove-that-the-data-can-be-restored
    - title: Recover the incident without destroying the evidence
      brief: 'Teach one incident decision sequence in this article: establish impact and ownership, preserve
        evidence and recovery options, distinguish plausible causes, contain ongoing damage, select a
        prepared procedure and validate service and data before reopening traffic. Work through a compact
        contrast between overload and accidental deletion to show why relieving demand and recovering
        correct data require different actions. Add a failure-to-procedure table linking saturation, connection
        or lock blockage and exhausted capacity to monitoring and performance; compromised access to security;
        writer or host loss to topology; and corruption or operator error to restoration. Preserve useful
        logs, copies and recovery history before intervention. Define explicit go/no-go criteria for recovery
        and resumed traffic, including data validation, application reconnection and reconciliation handoffs.
        Record and communicate actual data loss and interruption, then repair the failed controls or runbook
        assumptions. Reuse the detailed procedures in their owning articles, verify any concrete engine
        steps, and label illustrative incident timelines clearly.'
      anchor: recover-the-incident-without-destroying-the-evidence
- id: a08
  href: /review/relational-next/choosing/
  article:
    topic: Choosing relational systems and deployments
    title: Choosing a relational database
    brief: Teach how to select and validate a relational engine and deployment for a concrete application.
      Turn workload, correctness, latency, availability, locality, operational capacity and total cost
      into explicit requirements and rejection tests. Compare representative embedded, server and distributed
      relational choices through the mechanisms that change those tests, including managed service restrictions
      and responsibilities. Finish with a realistic evaluation and a documented adoption decision. Use
      neighbouring storage families only to establish suitability; use conditional implementation follow-ups
      to check a candidate's actual contract. SQLite and CockroachDB are alternative adoption routes,
      not a required sequence; common disposable PostgreSQL practice starts in Working with SQL before
      this selection evaluation is complete. Keep the PostgreSQL candidate record here.
    heading:
    - title: Begin with the application's promises
      brief: Follow an ordinary application from its facts and critical reads and changes to a short selection
        brief. Record invariants and transaction boundaries, dataset size and growth, skew, concurrency,
        latency percentiles, burst shape, availability, acceptable data loss, recovery time and location
        requirements. Separate measured needs, forecast needs and negotiable preferences. Make each hard
        requirement testable and explain why an engine name is not yet a design.
      anchor: begin-with-the-application-s-promises
    - title: Establish whether a relational system fits
      brief: Use relationships, integrity rules, transactional changes and changing query needs to explain
        the relational fit. Identify cases where access patterns, data volume or specialised search and
        analytical needs merit a neighbouring storage family or a separate derived system. Account for
        synchronisation, recovery and operational costs before adding another store; keep the detailed
        design of those families outside this article.
      anchor: establish-whether-a-relational-system-fits
    - title: Choose the process and failure boundary
      brief: Compare an embedded library, a database service and a distributed relational service by who
        owns the data files, where requests execute, how writers coordinate, which network paths enter
        latency and which failures affect reads and commits. Explain that an engine, a topology and a
        hosting arrangement are separate choices. Use SQLite, PostgreSQL and CockroachDB as concrete representatives
        of alternative choices, not a required learning sequence. Take the SQLite route only for an embedded
        candidate and the CockroachDB route only after a concrete distributed requirement survives comparison
        with a simpler server. Introduce other candidates only when a required capability makes them relevant.
        Do not infer identical SQL semantics, transaction guarantees or capacity from the relational label.
      heading:
      - title: When the database lives with the application
        brief: Introduce the attraction and boundaries of an embedded relational engine through application
          ownership, concurrent writers, file placement, deployment and backup needs. Establish the tests
          that decide whether the embedded arrangement serves this application. Introduce SQLite's concrete
          adoption checks only when evaluating an embedded candidate.
        nested_article:
          topic: Adopting SQLite for an application
          title: Checking an embedded choice with SQLite
          brief: Decide whether SQLite can meet one application's relational requirements in its intended
            deployment. Trace file ownership, connections and transactions to writer contention, durability
            and recovery obligations; verify the actual library, driver and settings with small acceptance
            cases. Produce a defensible adoption decision and starting configuration. Reuse the common
            transaction, integration, performance and operations methods rather than teach them again;
            this is an optional candidate check, not a SQLite internals curriculum.
          href: /review/relational-next/sqlite/
        anchor: when-the-database-lives-with-the-application
      - title: When applications share a database service
        brief: Introduce the service boundary, connection and resource limits, primary write placement,
          replica read semantics and operating responsibilities that distinguish a server deployment.
          Show how requirements produce a shortlist among PostgreSQL, MySQL and other server engines without
          ranking them universally. Common disposable PostgreSQL practice starts in Working with SQL before
          completing selection. Keep a compact PostgreSQL candidate record here, linked to the common
          articles' PostgreSQL evidence for configuration, schema and SQL behaviour, correctness, workload
          and recovery gates. Name the exact version, service tier and topology; trace the actual application,
          driver, pooler and server path. Record connection and pooling limits, required session features,
          relevant transaction, timeout and durability settings, extensions and access controls with reasons
          and verification sources. Check candidate-specific differences and restrictions rather than
          repeat the common lessons; require dialect and guarantee checks when choosing another engine.
        anchor: when-applications-share-a-database-service
      - title: When data and writes must span machines or regions
        brief: Enter this alternative route only after a concrete distributed requirement survives comparison
          with a simpler server. Compare transaction placement, coordination latency, locality, failure
          handling and operational cost against those needs. Introduce a concrete CockroachDB evaluation
          while keeping a general distributed-systems curriculum outside the commission.
        nested_article:
          topic: Adopting a distributed relational system with CockroachDB
          title: Checking a distributed choice with CockroachDB
          brief: Decide whether a specific CockroachDB version and deployment meet an application's distributed
            relational requirements. Follow one regional order-reservation workload from its placement
            and transaction boundaries through compatibility, latency, contention and failure tests to
            a documented adoption or rejection. Establish a minimal topology and starting configuration,
            dated version and service-tier evidence, and the resource, network and operating cost of meeting
            the requirements. Reuse common transaction, application integration, evolution, performance
            and operations methods; explain distributed mechanisms only far enough to predict or interpret
            acceptance results. Illustrative traces explain hypotheses; only observed tests establish
            acceptance, and untested claims remain explicit gaps.
          href: /review/relational-next/cockroachdb/
        anchor: when-data-and-writes-must-span-machines-or-regions
      anchor: choose-the-process-and-failure-boundary
    - title: Compare the deployment contract and its full cost
      brief: Build a responsibility table for application team, database operator and provider. Verify
        service limits, supported versions, extensions, privileges, connection and storage limits, maintenance
        windows, upgrades, data location, network access, encryption, audit needs, backup retention, restore
        granularity and failover behaviour. Separate availability promises from tested recovery capability.
        Compare realistic compute, memory, storage, I/O, replicas, transfer, licensing, support and engineering
        effort, including idle and burst costs. Treat product terms and service-tier behaviour as dated
        evidence. For the PostgreSQL candidate, add service-specific configuration and privilege restrictions,
        maintenance and upgrade constraints and remaining operational obligations to this same table,
        naming an owner for each obligation.
      anchor: compare-the-deployment-contract-and-its-full-cost
    - title: Test the candidates against the same application
      brief: Turn hard requirements into pass-or-fail gates and trade-offs into a small decision table.
        Use representative schema, realistic data distribution and growth, production-shaped queries and
        concurrent changes, and the actual driver and network path. Verify results and invariants before
        measuring steady and burst latency, throughput, resource use and cost. Include slow clients, connection
        pressure, contention and required failure, failover and backup-restore exercises. Record version,
        configuration, dataset, observations, uncertainty and untested cases; distinguish illustrative
        models from execution evidence and marketing benchmarks from this workload. Draw on the performance
        and operations branches for the detailed procedures. Link the common PostgreSQL examples and observed
        results where their version, configuration and execution path apply; exercise the candidate's
        actual driver, pool mode and hosting differences where those results do not establish the contract.
        Keep documentation claims, local models and unexecuted checks distinct from observed acceptance
        results.
      anchor: test-the-candidates-against-the-same-application
    - title: Make the choice reversible enough to live with
      brief: Write a decision record naming the candidate, deployment, acceptance evidence, rejected alternatives,
        unresolved risks and the conditions that would reopen the choice. Check ecosystem maturity, driver
        and tooling support, staff skills and support arrangements. Make portability concrete by inventorying
        dialect, data types, extensions, operational dependencies, export access and migration downtime;
        demonstrate a small export and re-import where an exit requirement matters. Establish a staged
        adoption and verification plan, with explicit stop criteria, before committing critical data.
        Complete the compact PostgreSQL record with the verified starting configuration, linked acceptance
        evidence, measured candidate limits, acceptance gaps and an owner for each unresolved check. Accept,
        reject or defer it against the original gates without creating another PostgreSQL teaching destination.
        Link live migration procedures to the evolution article.
      anchor: make-the-choice-reversible-enough-to-live-with
scope_boundary: 'Use the actual parent, sibling and child plans: teach a useful high-level answer here,
  introduce deeper questions in context, and leave their detailed mechanisms/procedures with the owning
  child. Do not duplicate a sibling. A parent must still teach a complete useful first case, not just
  advertise links.'
