original_topic: Relational databases
expertise_goal: Intelligent newcomer to expert practitioner in using relational databases; this article
  contributes only the depth needed for that original goal.
article:
  topic: Relational databases
  title: Relational databases
  brief: 'Introduce relational databases through an ordinary application that must keep related facts
    correct while people read and change them. Establish the model, the work a database performs and the
    decisions its users remain responsible for. Give an intelligent engineer new to the subject a useful
    first working model and a route to expert practice in choosing, designing, querying, integrating,
    diagnosing, operating and recovering a relational service. Keep detailed mechanisms in the contextual
    articles where they change a practical decision. Make the parent-first reading contract explicit:
    the current article supplies a usable answer before its contextual children deepen a question. Newcomers
    finish the working-route parent articles before selecting that depth; readers entering for a particular
    task see any precise prerequisite section at the contextual entrance.'
  heading:
  - title: One action changes several facts
    brief: 'Follow a small order-taking application: customers place orders, orders contain items, stock
      is limited and payment can fail. Show the questions readers need to answer and the inconsistencies
      that separate file or application updates can leave behind. Introduce the database as the place
      that stores shared facts, answers questions and enforces specified rules; distinguish those guarantees
      from business rules nobody has expressed.'
    anchor: one-action-changes-several-facts
  - title: Tables describe facts and relationships
    brief: Give the example a few tables with named, typed columns and rows. Use keys and references to
      explain identity and relationships, then a join to show that storing related facts separately need
      not make them inaccessible together. Introduce constraints, missing values and the distinction between
      a logical schema and its physical storage without turning this orientation into a schema-design
      course.
    nested_article:
      topic: Relational data design
      title: Designing relational data
      brief: Teach an engineer to translate application facts, rules and access needs into a relational
        schema. Follow a booking application from ordinary requirements to tables, identities, relationships,
        value representations and enforceable rules, exposing the failures each decision prevents. Establish
        a practical account of normalisation and controlled redundancy, then account for history and deletion.
        Test the design with representative reads, changes and lifecycle scenarios. Develop specialised
        modelling only where it changes these relational decisions; leave query fluency, transaction protocols
        and live migration procedures to their neighbouring articles.
      href: /review/relational-next/data-design/
    anchor: tables-describe-facts-and-relationships
  - title: Ask for a result, then check what it means
    brief: Walk from a simple selection to an order summary using filtering, a join and aggregation. Explain
      that SQL describes a result while the engine chooses how to obtain it. Make duplicate rows, missing
      matches, nulls and explicit ordering visible early, so plausible output is not mistaken for a correct
      answer. Show that SQL also changes data and that a successful statement can still express the wrong
      change.
    nested_article:
      topic: Querying and changing relational data with SQL
      title: Working with SQL
      brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database
        to expressing and checking substantial application and analytical queries. Teach selection, joins,
        aggregation, subqueries, set operations, window calculations and recursion where they solve useful
        relational problems. Develop precise reasoning about duplicates, nulls, ordering, time, pagination
        and data changes. Teach how to establish expected results and test edge cases. Distinguish portable
        concepts from dialect behaviour without attempting an exhaustive syntax catalogue; leave execution-cost
        diagnosis to its own branch.
      href: /review/relational-next/sql/
    anchor: ask-for-a-result-then-check-what-it-means
  - title: A transaction protects a change within a stated contract
    brief: Group the example's related updates into a transaction and distinguish commit from rollback.
      Use two customers buying the last item to show why a transaction boundary alone does not specify
      every concurrency guarantee. Introduce isolation, constraints and the durable-commit contract as
      questions the application must answer, with engine and configuration differences made explicit.
      Explain that a payment provider lies outside a local database transaction.
    nested_article:
      topic: Relational transactions and application correctness
      title: Making concurrent changes correct
      brief: Teach practitioners to state application invariants, choose transaction boundaries and preserve
        those invariants under concurrent execution and failures. Connect isolation anomalies to locking,
        versioned reads, conflict detection, constraints and serialisation, using labelled illustrative
        schedules and verified engine behaviour. Develop practical choices among atomic statements, conditional
        changes, locks and stronger isolation, including deadlocks, retries and uncertain commit outcomes.
        Explain the database's durability boundary and the limit of transactions across external effects;
        leave detailed client integration and service recovery procedures to their respective articles.
      href: /review/relational-next/transactions/
    anchor: a-transaction-protects-a-change-within-a-stated-contract
  - title: The application is part of the database system
    brief: Follow one request through a driver, a connection, statements and the returned result. Explain
      parameter binding, connection ownership, transaction lifetime and the difference between a database
      error and an unknown outcome after a broken connection. Show why request deadlines, retries and
      external effects must be designed together with the database contract.
    nested_article:
      topic: Relational application integration
      title: Building applications around a relational database
      brief: Follow an application request through its driver, connection, statements and transaction
        to the response and any external effects. Teach how to preserve values and authority at those
        boundaries, understand the SQL an abstraction performs, bound resource use and recover from failures
        with evidence about what completed. Build on the transaction article's correctness guarantees;
        deepen connection management, query composition, request recovery and external work only where
        their separate decisions need it.
      href: /review/relational-next/applications/
    anchor: the-application-is-part-of-the-database-system
  - title: Correct SQL still has to do physical work
    brief: Compare finding an order by scanning rows with following an index, then show that reads, writes,
      joins and sorting compete for resources. Introduce plans, estimates and measured execution as evidence
      about that work. Explain why an index or more hardware is a hypothesis to test, and why performance
      includes tail latency and the effect on concurrent requests.
    nested_article:
      topic: Relational execution and performance
      title: Understanding and improving database performance
      brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
        Build the necessary understanding of row and index storage, buffering, version retention, access
        paths, join methods, sorting, aggregation, statistics and optimiser choices. Read estimated and
        observed plans without confusing their units or treating estimates as execution evidence. Connect
        query shape, indexes, physical layout, maintenance and resource contention to workload latency,
        throughput and capacity. Choose and validate changes with representative data and concurrency,
        including write and operational costs; deepen engine internals only where they explain a diagnosis
        or intervention. Give the parent a complete ordinary diagnosis-to-measured-improvement loop. Tell
        readers to finish this article, including its concluding comparison method, before selecting an
        optional contextual investigation by the question their evidence raises.
      href: /review/relational-next/performance/
    anchor: correct-sql-still-has-to-do-physical-work
  - title: Data and applications change at different speeds
    brief: Add a new required fact to the running example while old application instances and existing
      rows still exist. Explain why schema edits, data conversion and application deployment form one
      compatibility problem. Introduce staged change, verification and recovery from partial progress;
      distinguish reversing a schema edit from recovering data already lost.
    nested_article:
      topic: Relational schema and data evolution
      title: Changing a live database
      brief: Teach engineers to change schemas, stored data and database locations while applications
        continue to run. Use a change to an order system to connect application compatibility, physical
        database work, concurrent writes, verification and recovery. Give every change an explicit sequence,
        measurable completion conditions and a safe response to interruption. Introduce deeper procedures
        for schema changes, data jobs and database moves only where they enable reliable relational practice.
        Treat retention and deletion as changes to the guarantees readers and recovery procedures can
        rely on. Check concrete procedures against the selected engine, version and deployment.
      href: /review/relational-next/live-changes/
    anchor: data-and-applications-change-at-different-speeds
  - title: Operate for the failure you must recover from
    brief: 'Move from an individual query to the service: access control, connections, resource headroom,
      maintenance and signals that reveal trouble. Separate service availability from recovery of correct
      data, using a server failure and an accidental deletion as contrasting cases. Introduce replicas,
      backups, recovery objectives and restore rehearsals as mechanisms whose guarantees must be demonstrated
      for the chosen deployment.'
    nested_article:
      topic: Operating and recovering relational services
      title: Running a relational service
      brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service
        against explicit availability, data-loss and recovery requirements. Connect those requirements
        to access boundaries, service signals, capacity, maintenance, topology, backup and incident procedures.
        Give readers the working model needed to choose a safe next action, with contextual articles developing
        the procedures and implementation differences. Distinguish self-managed duties from managed service
        contracts. Keep query tuning, application retry logic and live schema changes in their neighbouring
        branches, and the separate distributed-systems programme outside this branch.
      href: /review/relational-next/operations/
    anchor: operate-for-the-failure-you-must-recover-from
  - title: Choose a system by testing the contract you need
    brief: 'Return to the example with its workload, correctness rules, operational requirements and team
      constraints now visible. Explain why relational systems can share SQL and still differ materially
      in transaction, execution, compatibility and recovery behaviour. Frame selection as a short list
      of requirements, disqualifying limits and representative experiments, including whether a relational
      system fits the problem at all. Close with a compact route table. For a first working application,
      start with the supplied disposable setup at the beginning of Working with SQL (a02), then complete
      the parent articles Designing relational data (a01), Working with SQL (a02), Making concurrent changes
      correct (a03) and Building applications around a relational database (a04), in that order. Use their
      complete ordinary application path before returning to selected value, constraint, query or concurrency
      depth when its question matters. Correct but slow work starts with the complete performance parent
      (a05), then follows its evidence to the merged query-plan diagnosis (a26) for query or plan work,
      or Improving performance under concurrent load (a28) for queueing, contention or concurrency; neither
      route requires both children. Service limits start with Running a relational service (a07) and its
      capacity article (a36); a live change starts with Changing a live database (a06). Finish each task
      parent before choosing its deeper investigations or procedures, with any additional prerequisite
      section named at the entrance. For an adoption decision, use Choosing a relational database (a08):
      take the SQLite article (a32) only for an embedded candidate and the CockroachDB article (a34) only
      after a concrete distributed requirement survives comparison with a simpler service. Common server
      practice stays in the main examples and compact PostgreSQL candidate record. The disposable exercise
      engine is a starting environment; completing system selection is unnecessary before the first query.'
    nested_article:
      topic: Choosing relational systems and deployments
      title: Choosing a relational database
      brief: Teach how to select and validate a relational engine and deployment for a concrete application.
        Turn workload, correctness, latency, availability, locality, operational capacity and total cost
        into explicit requirements and rejection tests. Compare representative embedded, server and distributed
        relational choices through the mechanisms that change those tests, including managed service restrictions
        and responsibilities. Finish with a realistic evaluation and a documented adoption decision. Use
        neighbouring storage families only to establish suitability; use conditional implementation follow-ups
        to check a candidate's actual contract. SQLite and CockroachDB are alternative adoption routes,
        not a required sequence; common disposable PostgreSQL practice starts in Working with SQL before
        this selection evaluation is complete. Keep the PostgreSQL candidate record here.
      href: /review/relational-next/choosing/
    anchor: choose-a-system-by-testing-the-contract-you-need
