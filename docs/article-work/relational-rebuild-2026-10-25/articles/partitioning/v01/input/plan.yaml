topic: Relational table partitioning
title: Table partitioning and data lifecycle
brief: >-
  Choose a partition boundary that removes useful query work or matches an approved
  retirement unit. Derive pruning from predicates, preserve the intended identity
  and reference rules, and judge whether maintaining and retiring partitions earns
  its cost. Table partitioning does not by itself distribute work across servers.
  Use an independent monthly copy of the exact generated 2026 shop workload;
  business deletion meaning belongs to History, correction and deletion, live
  conversion to Live schema changes and backfills, and cross-machine placement to
  Sharding and distributed SQL.
heading:
  - title: One table, several partitions
    brief: >-
      Understand how a partition key routes rows into disjoint pieces while callers
      query one logical table. Follow the shop's placed_at into half-open UTC month
      ranges, including an exact boundary. Distinguish partitions, indexes and
      servers; splitting this table does not promise parallelism or more capacity.
  - title: Partition pruning
    brief: >-
      Derive which month ranges cannot contain a query's answer before considering
      access inside the remaining partitions. Contrast October's paid-order report,
      a full-year report and an order-ID-only lookup. Keep the paid-status test and
      the order-line join visible: pruning orders does not automatically prune an
      unrelated line table or remove the work inside October.
    heading:
      - title: Predicates that expose the boundary
        brief: >-
          Write explicit typed time bounds whose relationship to the partition key
          the engine can establish. Recognise that transformed expressions and
          parameter values need engine-specific checking; distinguish pruning at
          planning from pruning during execution without teaching native plan
          fields in depth.
  - title: Choosing the partition key and size
    brief: >-
      Match range, list or hash boundaries to frequent predicates and lifecycle
      work. Compare monthly time ranges with customer-based partitioning: customer
      1001's skew does not vanish by hashing customers, and old rows remain spread
      across customer partitions. Weigh small retirement units and selective reads
      against partition count, metadata, planning and maintenance costs. Keeping
      the table unpartitioned with suitable indexes is a valid outcome.
  - title: Keys and references across partitions
    brief: >-
      Separate global business identity from what local indexes enforce. In a
      labelled PostgreSQL example, understand why adding placed_at to a unique
      order_id key permits the same ID at different times and changes the reference
      contract. Account for order_items and payments before choosing composite
      references, a supported global enforcement mechanism or an unpartitioned
      authority. Generating apparently unique IDs does not replace enforcement.
      Correcting the partition key may also move a row and affect its references.
  - title: Adding and retiring partitions
    brief: >-
      Treat the partition set as maintained data infrastructure. Provide future
      ranges, decide how to handle late rows and missing ranges, and distinguish
      detaching a still-existing table from destroying its data. For the independent
      retirement scenario, the approved cutoff is 1 February 2026 at 00:00 UTC:
      January is wholly eligible; a cutoff inside January does not authorise
      removing the whole month.
    heading:
      - title: Retiring related data safely
        brief: >-
          Establish eligibility for every row and its dependants before removal,
          account for incoming references and writers, and verify what remains
          queryable afterwards. A fast partition operation does not establish
          deletion meaning, erase recovery copies or bypass locks. Preserve a
          recoverable stage where the policy permits it; engine-specific locks and
          restrictions must be checked. The history article owns the deletion
          decision and external copies; the schema-change article owns converting
          an existing live schema.
  - title: Checking that partitioning earns its cost
    brief: >-
      Predict the pieces and work a change should exclude, then compare equivalent
      results and actual plans on an owned fixture. Test October, the full year,
      an ID lookup, boundary and late writes, reference enforcement and retirement.
      Separate saved scans from work still required by the line join; include
      planning, write and maintenance costs. Counts and timings become observations
      only after execution, and this small generated fixture cannot establish a
      production partitioning threshold.
