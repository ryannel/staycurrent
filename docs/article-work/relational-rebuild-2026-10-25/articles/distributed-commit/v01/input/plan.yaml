topic: Distributed atomic commit
title: Transactions across partitions
brief: >-
  Understand how one purchase obtains a recoverable commit-or-abort outcome across
  several owners. Follow preparation, the durable decision and recovery after
  coordinator loss; distinguish them from replica agreement, isolation and client
  request recovery. Judge the coordination required by the complete invariant,
  including constraint and index work, without treating one protocol model as
  every engine's implementation.
heading:
  - title: One purchase, two owners
    brief: >-
      Reuse the parent's independent purchase-103 replay: A creates the pending
      order and two lines; P guards both stock decrements. See why committing
      either side first can leave an incomplete purchase even when each side's
      replicas agree. No payment is involved.
  - title: Preparing to commit
    brief: >-
      Understand the participant's durable promise to retain enough work and
      protection to honour a later decision. Prepared work is provisional, not a
      successful purchase. A refusal prevents commit; a participant that has
      promised cannot simply abandon the work when its timer expires.
  - title: Recording one decision
    brief: >-
      Follow a labelled two-phase commit model from every participant's readiness
      to a durable decision and its delivery. Understand why recording precedes
      notification, why all required participants matter, and why learning the
      same decision at different moments does not permit opposing outcomes.
  - title: When the coordinator disappears
    brief: >-
      Distinguish a recoverable decision from evidence that is temporarily
      inaccessible. Use failures around the decision to explain what another
      process must learn before completing the purchase.
    heading:
      - title: Prepared, with no known outcome
        brief: >-
          Recognise the blocking case in classic two-phase commit: surviving
          prepared participants cannot infer commit or abort from silence, even
          if they can still communicate with each other.
      - title: A decision that outlives its coordinator
        brief: >-
          Follow recovery from authoritative replicated transaction state and
          delivery of an already chosen outcome. Replacing the coordinator must
          preserve that authority; an unavailable quorum or an old copy cannot
          justify inventing a new decision.
  - title: Commit, visibility and cleanup
    brief: >-
      Distinguish the transaction's outcome from each owner's later installation
      or cleanup. Explain how transactional visibility must respect unresolved
      work, without promising simultaneous physical updates. Atomic commit alone
      neither provides a common snapshot for separate reads nor establishes the
      isolation needed by competing purchases.
  - title: What the transaction must coordinate
    brief: >-
      Identify all owners needed by the rule, including globally enforced keys,
      references and indexes. Trace the dependent communication and durable-state
      waits rather than assuming one fixed round-trip count. Co-location can
      reduce coordination, but shared stock remains authoritative and prepared
      work can hold resources while recovery waits.
  - title: Recovering the purchase at the application boundary
    brief: >-
      Keep the database's transaction decision distinct from a client's knowledge
      of it. A lost reply still requires the existing stable-request protocol.
      Recognise that engines can optimise commit and recovery while preserving
      their contract; route native intents, records and error handling to
      CockroachDB transactions and retries, and external delivery to the outbox
      article.
