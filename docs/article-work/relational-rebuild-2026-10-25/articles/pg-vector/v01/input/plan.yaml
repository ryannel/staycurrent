topic: PostgreSQL vector retrieval
title: Vector search in PostgreSQL
brief: >-
  Choose and verify exact, HNSW or IVFFlat retrieval for a filtered nearest-neighbour
  request, judging recall, latency and lifecycle cost separately from an embedding
  model's usefulness. Own the complete vector retrieval and evaluation outcome;
  linguistic matching belongs to Full-text search in PostgreSQL, and shared
  extension and live schema-change procedures remain with their existing owners.
heading:
  - title: Vectors, distance and useful results
    brief: >-
      Understand how a query vector orders stored vectors, and why finding those
      neighbours accurately does not establish that customers find them useful.
      Use explicitly invented coordinates beside the shop's established products;
      preserve the distinction between numerical examples and learned embeddings.
    heading:
      - title: Choosing the distance
        brief: >-
          Match dimensions, model version, preprocessing and distance to the
          representation's contract. Interpret L2, cosine distance and negative
          inner product without treating their scores as interchangeable; recognise
          invalid or unsearchable values before comparing retrieval methods.
  - title: Exact nearest neighbours
    brief: >-
      Establish the nearest eligible rows by computing distances over the filtered
      population and choosing the smallest. Read the SQL's distance operator,
      ascending order and limit together; connect the query to its operator class.
      Recognise when a selective ordinary filter index makes exact retrieval cheap.
  - title: HNSW indexes
    brief: >-
      Follow a small illustrative search through a multilayer proximity graph to
      understand how limited exploration can miss a closer neighbour. Relate search
      effort to recall and work, while separating query settings from graph-building
      choices and their memory, build and insertion costs.
  - title: IVFFlat indexes
    brief: >-
      Follow assignment to lists and a query that probes only some lists. Locate a
      missed neighbour in an unsearched list, then understand the work added by
      further probes. Judge the initial training population, list count and later
      distribution changes alongside build and memory costs.
  - title: Filtering nearest neighbours
    brief: >-
      Distinguish nearest eligible rows from filtering an already limited global
      result. In the independent post-103 example, P7 has stock zero while P3 and
      P9 remain available. Make visible how rejecting approximate candidates can
      leave a short answer even when enough eligible rows exist.
    heading:
      - title: Searching further
        brief: >-
          Understand iterative scans as bounded additional exploration. Separate
          strict distance ordering of found rows from finding the true nearest
          rows; understand relaxed ordering and subsequent sorting without assuming
          that sorting restores missing neighbours or that a full answer proves recall.
      - title: Narrowing the search population
        brief: >-
          Choose among exact filtering, more approximate exploration, a suitable
          partial index or partitioned populations from actual query distributions.
          Account for index count, maintenance and planner eligibility; preserve
          authorised scope in the query rather than relying on proximity for access.
  - title: Measuring recall and latency
    brief: >-
      Compare approximate results with an exact baseline using the same vectors,
      metric, filters and visible data. Calculate nearest-neighbour recall from
      returned identities, handle ties and fewer-than-k eligible rows explicitly,
      and evaluate semantic usefulness separately with judged tasks.
    heading:
      - title: Comparing retrieval methods
        brief: >-
          Use representative queries and filter selectivities to compare result
          count, recall, repeated latency and access work for exact, HNSW and
          IVFFlat. Verify the actual plans and settings; distinguish a forced
          mechanics demonstration from the planner's normal choice, and a synthetic
          workload from evidence about production relevance or throughput.
  - title: Keeping vectors and indexes useful
    brief: >-
      Account for source changes, embedding generation and model-version changes,
      as well as inserts, deletes, vacuum, index size and rebuilding. Distinguish
      stale or incompatible vectors from approximate-search misses. Choose a
      retrieval design whose measured saving earns its ongoing cost; link shared
      extension dependency and live-change procedures without repeating them.
  - title: Sources and further reading
    brief: >-
      Provide version-specific primary sources for operators, approximate search,
      filtering and maintenance, plus the provenance and limits of any observations.
