topic: Relational integrity constraints
title: Constraints and data integrity
brief: >-
  Turn the shop's rules about identity, required values, valid rows, references
  and incompatible facts into enforceable schema rules. Judge what each rule
  proves, including NULL behaviour, tenant membership and check timing. Prefer
  declarative enforcement where it fits; recognise when a trigger still needs a
  concurrency protocol. This article owns tenant integrity; access control owns
  permission, history owns correction and deletion policy, and transactions owns
  sound concurrent protocols beyond these constraints.
heading:
  - title: Rules the database enforces
    brief: >-
      Understand a constraint through an attempted invalid order line: a rejected
      change preserves a stated rule even when the write comes from another
      application or an import. Distinguish a useful application check from the
      enforced rule, and a valid stored state from a correct business decision.

  - title: Required values and CHECK constraints
    brief: >-
      Combine NOT NULL with a row predicate to require a positive quantity;
      understand why CHECK alone admits an unknown result. Use the existing
      stock, price and status rules to judge their exact reach: a permitted
      status value does not establish a valid transition or a settled order.
      Distinguish a default from a restriction and required text from non-empty
      text.

  - title: Primary keys and UNIQUE constraints
    brief: >-
      Enforce row identity with the order line's (order_id, line_no), allowing
      the same line number in another order and the same product on distinct
      lines. Distinguish a primary key, another unique business identifier and
      generated key values; generating an identifier does not itself enforce
      uniqueness.
    heading:
      - title: Uniqueness when a value is optional
        brief: >-
          Apply an explicit policy to the shared loyalty-code scenario: assigned
          codes must be unique while several customers may have no code. Judge
          the chosen engine's NULL behaviour rather than assuming UNIQUE means
          one missing value. Recognise that uniqueness limited to selected rows
          needs an appropriate conditional rule, not an extra application check.

  - title: Foreign keys
    brief: >-
      Follow an order line to its order and product to understand a referencing
      value, a referenced key and a rejected dangling reference. Distinguish
      requiring a reference from allowing it to be absent; recognise partial
      NULLs in a composite reference. A foreign key does not require an order
      to have any lines or payments.
    heading:
      - title: Deleting or changing a referenced row
        brief: >-
          Translate an already chosen lifecycle policy into NO ACTION, RESTRICT,
          CASCADE or an optional reference action. Follow the affected shop rows
          so the reader can judge the consequence of a cascade and distinguish
          deletion from changing a status. History owns whether an order or its
          evidence should be retained; this section owns enforcing that choice.

  - title: Tenant integrity with composite references
    brief: >-
      Understand why an existing tenant and an existing customer do not prove
      that the customer belongs to that tenant. Use the coordinator-approved
      tenant variant to enforce the pair with a composite key and matching
      foreign key, keeping required parts non-null. Carry the same reasoning
      through tenant-owned order lines, products and payments. Distinguish
      globally unique identifiers from tenant membership and integrity from
      authority to read or write; access control owns the latter.

  - title: Exclusion constraints
    brief: >-
      Recognise a pairwise rule that equality-based uniqueness cannot express:
      two required, non-empty booking intervals for the same resource must not
      overlap. Use the accepted room-reservation scenario to distinguish an
      overlap from an adjoining interval and understand the same-resource
      condition. Learn enough PostgreSQL-labelled exclusion syntax to express
      the rule, including
      interval bounds; detailed range operations and index mechanics are outside
      this treatment.

  - title: When constraints are checked
    brief: >-
      Distinguish satisfying a rule after each change from satisfying an eligible
      deferred rule at commit. Understand one child-before-parent change that
      must be reordered or use a deliberately deferrable reference. The final
      state must still pass; deferral changes check timing and does not supply
      isolation. Qualify which PostgreSQL constraint kinds can be deferred.

  - title: Rules that need a transaction protocol
    brief: >-
      Use order 103's payment total to recognise a rule over several rows that a
      row CHECK cannot maintain. Contrast a trigger inspecting old and new row
      values with a trigger reading other rows: moving the check into the
      database does not by itself coordinate concurrent decisions. Make the
      two-payment counterexample understandable here; transactions owns the
      complete isolation, locking and retry protocol. Retain a non-negative
      stock constraint without treating it as the full stock-selling protocol.

  - title: Checking the rule you wrote
    brief: >-
      Judge enforcement using valid and deliberately invalid changes, including
      updates, missing values, wrong tenants and referenced-row changes. Use
      meaningful constraint names to connect a rejection to its rule, and
      recognise that a declared constraint and validated existing data are
      separate questions when changing a populated schema. Keep engine-specific
      enforcement and feature support explicit; live rollout procedures belong
      with schema-change operation rather than this article's rule design.
