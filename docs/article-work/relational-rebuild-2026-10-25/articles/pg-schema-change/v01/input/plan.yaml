topic: PostgreSQL live schema and index work
title: PostgreSQL schema changes under load
brief: >-
  Choose PostgreSQL 18 schema and index operations from the locks they require,
  the physical work they perform and the state they leave behind. Bound waits,
  establish price-backfill agreement and constraint validity, recover failed
  concurrent builds, and choose justified index upkeep or removal. Use the
  established price-to-hundredths migration; the general article owns caller
  compatibility and the return protocol, the index article owns access-method
  choice, and the vacuum article owns retained versions and transaction age.
heading:
  - title: A short schema change can still block the shop
    brief: >-
      Understand lock acquisition separately from execution and commit. Follow an
      existing reader, a waiting ACCESS EXCLUSIVE request and a later reader to
      see how even metadata work can create a queue. Distinguish table locks
      from row-update locks and keep strong-lock transactions short.
    heading:
      - title: Bound the wait before taking the lock
        brief: >-
          Choose separate lock and statement limits for a migration session,
          identify the actual blocker and stop a waiting attempt deliberately.
          Know that lock_timeout applies to each acquisition, that a failed
          explicit transaction needs rollback, and that repeated immediate
          attempts can repeatedly obstruct the workload.
  - title: Metadata changes, scans and table rewrites
    brief: >-
      Classify a proposed command by both lock strength and work. Compare adding
      nullable price_hundredths, adding a non-volatile default, validating rows
      and converting the stored price in place. Understand why avoiding a heap
      rewrite does not avoid a strong lock, and why changing a default does not
      backfill existing rows.
    heading:
      - title: When a rewrite is the wrong live operation
        brief: >-
          Judge the blocking interval, extra table and index space, WAL and old
          snapshot consequences of a rewrite. Relate the price conversion to
          expansion plus bounded updates when a direct conversion cannot fit.
          Distinguish dropping a column from reclaiming its physical space.
  - title: Backfill the current price in bounded transactions
    brief: >-
      Apply the established bridge-writer protocol using PostgreSQL's guarded
      updates. Preserve P7's committed 22.00/2200 against stale 2000, commit
      resumable batches, and reconcile skipped or late rows. Establish missing
      values and unequal representations separately while permitted writers
      preserve agreement; a last key or zero-null count alone is insufficient.
    heading:
      - title: Let foreground work set the migration rate
        brief: >-
          Use useful request completions, row-lock waits, free space, WAL and
          replica backlog to choose whether another batch fits. Understand the
          retained-version and index work caused by updates without repeating
          vacuum diagnosis or durability settings. A stopped launcher does not
          establish that its database transaction has ended.
  - title: Enforce new writes, then validate existing rows
    brief: >-
      Distinguish installing an enforced NOT VALID constraint from proving the
      old population. Use PostgreSQL 18's separate not-null validation and a
      price rule to understand what each proves; non-nullness alone cannot
      certify the conversion. Keep the brief installation transaction separate
      from the scan and understand the weaker validation lock.
    heading:
      - title: Check, not-null and foreign-key constraints
        brief: >-
          Choose the appropriate NOT VALID and VALIDATE CONSTRAINT procedure,
          including locks on a foreign key's referenced table. Judge when
          enforcing a rule will reject updates to existing violating rows.
          Preserve the new representation's accepted range and non-negative
          rule; remove transitional requirements only at the agreed contract
          boundary.
      - title: Add uniqueness through a completed unique index
        brief: >-
          Understand why UNIQUE is not a NOT VALID backfill shortcut. Build an
          eligible unique index concurrently and attach it with USING INDEX
          when a constraint is required, allowing for the final strong lock and
          primary-key not-null requirements. Keep existing shop identities and
          business uniqueness rules unchanged.
  - title: Build an index while writes continue
    brief: >-
      Compare an ordinary build with CREATE INDEX CONCURRENTLY using the
      established customer-history index. Understand the extra scans and waits
      needed to reach a usable index while writes continue, and distinguish an
      existing definition, readiness for writes and validity for queries.
    heading:
      - title: Read the phase before judging progress
        brief: >-
          Interpret pg_stat_progress_create_index phases and their current-phase
          counters, including waits for writers and old snapshots. Do not turn
          scan completion into whole-operation completion or an estimated finish
          time. Allow for resource competition, conflicting maintenance, one
          concurrent build per table and commands that cannot run in a
          transaction block.
  - title: Recover a failed concurrent build
    brief: >-
      Inspect the index definition and catalogue state after failure or an
      uncertain client outcome. Recognise an invalid leftover and its possible
      write cost; a failed unique build can already affect writers. Resolve the
      cause, choose drop-and-retry or REINDEX INDEX CONCURRENTLY, and verify the
      resulting state rather than accepting an existing name.
    heading:
      - title: A concurrent rebuild can leave two different leftovers
        brief: >-
          Distinguish a failed replacement from a successful replacement whose
          old index remains. Use catalogue state, dependencies and the documented
          ccnew/ccold suffixes to choose cleanup without removing the working
          index. Explain the replacement and cleanup boundary through one
          coherent example, rather than a second full build tutorial.
  - title: Choose the upkeep the index needs
    brief: >-
      Decide whether evidence calls for a rebuild, deferred-work cleanup or
      summary maintenance. Keep these distinct from query design and from
      vacuum's retained-horizon obligations. Compare the useful work restored
      with the peak space, scans, locks and foreground cost of the intervention.
    heading:
      - title: Rebuild a sparse B-tree when the saving earns the work
        brief: >-
          Distinguish reusable pages from a smaller file and diagnose persistent
          sparse leaves from size, density and workload evidence. Choose ordinary
          or concurrent REINDEX with their different blocking and resource costs;
          neither an index's age nor a fixed density threshold is sufficient.
      - title: Finish GIN pending work
        brief: >-
          Recognise that searches still include pending entries and that a
          foreground insert can inherit cleanup. Choose deliberate pending-list
          cleanup or background upkeep from the evidence; turning fastupdate off
          does not flush work already pending. Confirm the backlog and useful
          query work after the intervention.
      - title: Keep BRIN summaries useful
        brief: >-
          Distinguish an unsummarised new range from an over-broad existing
          summary. Choose summarisation, or deliberate desummarisation and
          resummarisation, for the corresponding state. Understand that correct
          results can survive absent or broad summaries while unnecessary heap
          work grows, and that summarisation cannot repair poor physical
          correlation.
  - title: Retire an index or column at an established boundary
    brief: >-
      Retain the working route until the replacement is valid, serves the
      supported workload and preserves required constraints. Investigate usage
      over an understood observation period and inspect dependencies before
      removal. Choose DROP INDEX CONCURRENTLY only where supported; its waits
      and transaction restrictions remain operational work.
    heading:
      - title: Verify the state left behind
        brief: >-
          Accept the change using semantic agreement, validated constraints,
          valid index definitions, representative results and remaining cleanup
          evidence. Contract the old price only after its callers and return
          promise retire. Distinguish a command returning, the new route working
          and obsolete physical work being removed.
