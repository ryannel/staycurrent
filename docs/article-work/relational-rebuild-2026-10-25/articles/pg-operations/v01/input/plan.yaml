topic: PostgreSQL operational diagnosis
title: Operating and diagnosing PostgreSQL
brief: >-
  Trace a slow request from its application pool to PostgreSQL evidence, distinguish
  blocking, excessive work and connection pressure, and choose a targeted native
  intervention. Bound its waits and verify useful service through cancellation,
  cleanup and recovery. General incident reasoning and capacity budgets remain
  with their existing articles.
heading:
  - title: From a request to its backend
    brief: >-
      Match Mina's post-103 history request to its checkout interval, borrowed
      connection and server session. Understand why a caller still in the pool
      queue has no current SQL to find, and why application names and session
      identity need the request's time window.
    heading:
      - title: Keep evidence after the statement finishes
        brief: >-
          Connect activity samples and appropriately scoped duration, error and
          lock-wait logs. Recognise the monitoring privileges and advance setup
          needed to preserve evidence without adding unbounded diagnostic work.
  - title: Read activity state and waits together
    brief: >-
      Use pg_stat_activity to distinguish an active statement, an idle connection
      and an open idle transaction. Interpret backend_start, xact_start,
      query_start and state_change against the current state; a last query is not
      necessarily still running. Sample waits without equating active or a null
      wait with processor use.
  - title: Follow a blocked statement to its blocker
    brief: >-
      Follow pg_blocking_pids and inspect pg_locks to connect the history read's
      requested table lock to holder H's open transaction. Distinguish the
      waiting statement from the transaction keeping it waiting; use the
      ACCESS EXCLUSIVE lock-only branch, not an ordinary row update.
    heading:
      - title: Read the whole dependency
        brief: >-
          Recognise blockers that are themselves waiting, queued conflicting
          requests and prepared transactions. Explain why the longest query,
          a list of locks or the absence of a deadlock does not identify the
          right intervention. Detailed lock protocols and schema-operation
          lifecycles remain with their owners.
  - title: Find the work behind the incident
    brief: >-
      Use pg_stat_statements interval changes to separate more executions from
      more work per execution. Keep statement identity, aggregation and reset
      boundaries clear; connect the report's workload to resource evidence
      before selecting a bounded plan investigation. Detailed EXPLAIN analysis
      and repairs belong to Reading and repairing PostgreSQL plans.
  - title: Diagnose connection pressure
    brief: >-
      Compare client backends by application and state with the actual pool's
      borrowed and queued populations. Read max_connections and both reservation
      settings to establish ordinary admission and operational access. Judge
      whether sessions are scarce or admitted work is excessive before changing
      a limit; general pool sizing and overload policy remain with capacity.
  - title: Separate storage delay from storage exhaustion
    brief: >-
      Correlate PostgreSQL I/O waits and interval counters with host storage
      latency and free-space trends. Identify the growing object and its
      maintenance owner before choosing relief. Preserve space for recovery;
      vacuum retention, WAL/checkpoint interpretation and replica or archive
      policy remain in their specialist articles.
  - title: Bound the next attempt
    brief: >-
      Choose lock_timeout and statement_timeout for different parts of an
      attempt, inside the request's remaining deadline. Understand what
      idle-in-transaction and transaction timeouts terminate. Apply deliberate
      local limits without treating a timeout as proof of clean connection
      reuse or repeatedly recreating the same wait.
  - title: Cancel a statement or end a session
    brief: >-
      Choose owner-driven transaction completion, pg_cancel_backend or
      pg_terminate_backend from the current dependency and the work at risk.
      Recheck the target's identity and state before signalling it. Distinguish
      sending a signal, observing statement or session termination, and cleaning
      up the client's transaction.
    heading:
      - title: An idle holder has no query to cancel
        brief: >-
          Use H to explain why cancelling a waiter, or signalling H's finished
          lock statement, cannot be assumed to release the dependency. End the
          known lock-only transaction and check its actual locks; do not extend
          that harmless rollback assumption to business work.
      - title: Account for the recovery work
        brief: >-
          Judge the wider costs of session loss and restart: aborted-version
          cleanup, possible WAL replay, cold caches and reconnecting or retrying
          callers. A lost commit reply still needs outcome reconciliation;
          recovery drills and retry protocols retain their existing owners.
  - title: Verify the service recovered
    brief: >-
      Test the predicted chain from changed backend evidence through completed
      statements and returned clients to useful history responses. Check queued
      and new callers, errors, latency and remaining headroom, then restore
      optional work gradually. Keep the intervention's effect distinct from
      the lasting repair and retain the evidence needed by its owner.
