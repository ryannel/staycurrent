topic: Relational storage and durability
title: Storage and durability
brief: >-
  Trace a logical update through pages, buffers, retained versions and durable
  history. Judge the costs of cleanup, write amplification and commit waiting,
  and distinguish restart recovery from recovery after lost storage or an
  unwanted committed change. Native PostgreSQL diagnosis and settings, replica
  routing and restore procedures belong to their existing owners.
heading:
  - title: Pages and buffers
    brief: >-
      Understand why reading or changing one row involves a larger storage unit
      and often an index too. Follow P7 from its stored page into a memory buffer;
      distinguish a cache hit, a storage read and a durable copy.
    heading:
      - title: Rows, indexes and space
        brief: >-
          Connect row width, per-row overhead, free space and indexes to the pages
          a table needs. Recognise heap and clustered storage as different layouts;
          native byte layouts and page traversal remain in the implementation articles.
      - title: The working set
        brief: >-
          Understand how repeatedly used pages share a finite cache and why a miss
          need not mean a physical drive read. Separate a correct restart from a
          warm cache; leave cache sizing and native counters to implementation practice.
  - title: Row versions and cleanup
    brief: >-
      Explain why a report with an established snapshot can read P7 at 20.00 while
      a later query reads the committed 22.00. Distinguish versions retained in a
      table from reconstruction through undo, and connect retention to cleanup work.
    heading:
      - title: Space reuse and file size
        brief: >-
          Distinguish a version still needed by a reader, obsolete material eligible
          for cleanup, reusable internal space and space returned to the operating
          system. Judge why a large file alone does not justify a rewrite; native
          retention diagnosis and transaction age belong to PostgreSQL vacuum practice.
      - title: Physical versions and business history
        brief: >-
          Recognise that storage versions and undo are maintained for engine needs
          and can disappear. They do not replace an explicitly modelled price history,
          an audit record or a restorable backup.
  - title: Dirty pages and the write-ahead log
    brief: >-
      Follow the price update in memory while the stored page remains older.
      Understand that log records are generated during the transaction, and why
      durable log must precede the corresponding data-page write. A page write
      and a transaction commit establish different facts.
    heading:
      - title: Logging the change before writing the page
        brief: >-
          Understand how durable redo information can reconstruct a change before
          its data page is persisted. Keep log position, page progress and transaction
          outcome distinct; neither a log position nor a page write is a business timestamp.
      - title: Writing dirty pages
        brief: >-
          Understand why changed buffers eventually need writing and why eviction
          can make a reader wait for earlier write work. Recognise that a stored
          page can include unfinished changes whose visibility still depends on
          transaction outcome.
  - title: What commit waits for
    brief: >-
      Explain why a fully durable acknowledgement can precede the data-page write
      but must follow the required log flush. Follow that flush through volatile
      caches to the storage contract, rather than treating a successful file write
      as proof of survival.
    heading:
      - title: Group commit and batching
        brief: >-
          Understand how several transactions can share one flush, and why a single
          client's commit latency differs from total throughput. Judge batching
          alongside its changed transaction boundary; use labelled models rather
          than assumed rates for the reader's storage.
      - title: Asynchronous commit
        brief: >-
          Judge the consequence of acknowledging before the durable flush: a recent
          confirmed change may be lost. Distinguish this supported loss window from
          disabling write-order safeguards and risking corruption. Exact settings
          and failure drills remain with the native durability articles.
  - title: Crash recovery and checkpoints
    brief: >-
      Predict P7's recovered value when a failure occurs before durable commit,
      after durable commit but before its reply, or after acknowledgement. Explain
      how replay and transaction outcome restore a consistent database without
      assuming that every replayed change committed.
    heading:
      - title: Replaying the durable history
        brief: >-
          Understand how recovery fills gaps in persisted pages without applying
          the logical update twice, and how unfinished work is hidden or undone
          according to the engine. A lost commit reply leaves the application's
          outcome uncertain; the retry protocol belongs to its existing article.
      - title: Checkpoints and restart work
        brief: >-
          Understand how a completed checkpoint establishes a safe replay starting
          point, trading background writes against later recovery work. Recognise
          partial-page protection and retained log as requirements; a checkpoint
          is neither a backup nor a fixed bound on outage time.
  - title: Write amplification
    brief: >-
      Account for the physical work behind a small logical change: log records,
      table and index pages, retained versions and later maintenance. Connect
      checkpoints and page protection to additional writes; explain why neither
      row count nor a fixed two-writes formula predicts the cost.
    heading:
      - title: Different storage engines, different write work
        brief: >-
          Recognise that the page-update model is one design. Briefly contrast
          log-structured storage, where immutable files are merged by compaction,
          without importing that mechanism into PostgreSQL or teaching CockroachDB's
          native storage and replication internals here.
  - title: What restart recovery cannot fix
    brief: >-
      Choose the right next question for a process crash, power loss, lost storage
      or an unwanted committed price of 2.20. Recovery preserves committed intent,
      including mistakes; surviving storage and a reliable durability contract
      remain assumptions of the local restart model.
    heading:
      - title: Replicas and durable copies
        brief: >-
          Understand why another machine helps only to the extent that the needed
          history reached it under the promised acknowledgement rule. A replica can
          lag or copy the same mistake. Detailed copied-history progress and read
          routing belong to the child; failover authority has its own owner.
        nested_article:
          topic: Replicated database reads
          title: Replicas, lag and read routing
          brief: >-
            Trace copied history through received, durable and replayed progress.
            Choose read routing from freshness and failure promises, including
            read-your-write needs, stale reads and log retention. The parent explains
            why an additional copy changes the failure promise; failover owns write
            authority transfer.
      - title: Backup, restore and correction
        brief: >-
          Understand why lost files need a surviving recoverable copy and why
          replaying to the present preserves a bad committed change. Recognise
          restoration to an earlier point and business correction as different
          choices; recovery targets, later-work reconciliation and external effects
          belong to their existing owners.
        nested_article:
          topic: Relational backup and recovery
          title: Backup, restore and reconciliation
          brief: >-
            Choose and verify a restorable history from recovery-point and
            recovery-time needs. Test the backup chain and restore target, close
            the source history, and reconcile valid later work and external effects
            without duplicate application. The parent distinguishes these losses
            from a local restart; native procedures remain with their implementation owners.
