topic: Large SQL results
title: Pagination and consistent exports
brief: >-
  Choose a continuation contract for a changing list and a snapshot contract for
  an export. Build keyset cursors that preserve ties and predict omissions,
  duplicates and the cost of keeping a result available. Query results owns
  result-row meaning; indexes owns efficient access paths; application SQL owns
  driver streaming and cancellation mechanics.
heading:
  - title: LIMIT and OFFSET
    brief: >-
      Understand a page as part of an explicitly ordered result, with a unique
      tie-breaker for each result row. Follow two pages of the shop's newest
      orders, then see an insertion or deletion move the numbered boundary.
      Judge when numbered pages over a small or fixed result justify OFFSET,
      whose skipped rows still require work.
  - title: Keyset pagination
    brief: >-
      Continue after the last returned ordering key rather than a row count.
      Derive the strict next-page predicate for placed_at DESC, order_id DESC,
      preserving orders tied at one timestamp. Recognise that this supplies a
      range an index can serve, while index design and measured efficiency
      belong in Indexes and access paths.
    heading:
      - title: Matching the whole sort order
        brief: >-
          Derive continuation from all ordering terms, their directions and
          explicit NULL placement. Understand why the non-null, same-direction
          row comparison needs a different predicate for mixed directions or
          nullable terms. Preserve the result-row identity already established
          by the query; an order ID alone cannot distinguish joined order lines.
      - title: Previous pages and the end of the list
        brief: >-
          Use the first returned key, reverse the comparison and query order,
          then restore display order to fetch the preceding page. Use one extra
          row to determine whether another page existed at this read, without
          mistaking that for an exact total or a promise about the next request.
  - title: What a cursor must preserve
    brief: >-
      Preserve every boundary value at database precision together with the
      query's filters and ordering contract. Understand an API page token as
      continuation data, distinct from a database cursor or an authorisation
      grant. Decide what changing a filter, changing the sort or an expired
      token means for restarting a traversal.
  - title: Changes between pages
    brief: >-
      Predict which changes keyset pagination tolerates: deleting an earlier
      row no longer shifts the boundary, while new rows before it are outside
      the continuation. Follow a changed sort key or filter membership across
      the boundary to explain omissions and repeats. Understand why a high-water
      key bounds a traversal without creating a snapshot, including for a row
      that becomes visible only after its position has been passed.
  - title: One snapshot for an export
    brief: >-
      Define an export by the rows and values visible to one database snapshot.
      Contrast fresh snapshots for separate page queries with one snapshot
      across all batches; PostgreSQL's read-only Repeatable Read transaction
      supplies the concrete example. Choose between reading one result in
      batches and materialising the required result for later download, keeping
      driver mechanics in SQL at the application boundary.
    heading:
      - title: Resuming the same export
        brief: >-
          Distinguish resuming a retained result from rerunning the query against
          a newer snapshot. Understand why a saved key or saved membership IDs
          cannot preserve changing exported values. Choose a retained projection
          or a deliberately new export when the original snapshot is no longer
          available; detailed job recovery protocols stay with their existing
          owners.
  - title: The cost of keeping a result available
    brief: >-
      Weigh connection occupancy and retained row versions against the storage
      needed for a materialised result. Bound export duration, result retention
      and client waiting; cancellation must release the database work and its
      transaction, and incomplete output must remain recognisable as incomplete.
      Choose a short-lived continuation for browsing or a retained snapshot
      result for a reproducible export without holding a transaction open during
      a person's navigation. Engine internals and cancellation procedures belong
      in their existing articles.
