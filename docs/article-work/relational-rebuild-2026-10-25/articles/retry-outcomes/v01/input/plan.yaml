topic: Recovering logical database requests
title: Retries and uncertain commit outcomes
brief: >-
  Distinguish a known transaction abort from an uncertain outcome, restart the
  right work, and recover one purchase through a stable request identity and an
  atomically recorded result. Use the order-103 purchase replay and the agreed
  purchase-103 token. Own the complete client-request recovery protocol;
  connection handling, external delivery and CockroachDB's native retry paths
  remain with their existing articles.
heading:
  - title: When the reply never arrives
    brief: >-
      Understand why a missing reply cannot decide whether the purchase
      committed. Make two runs visible: no committed purchase, and committed
      order 103 with a lost reply. The caller's observation is the same; stock
      and the stored order differ. A blind repeat can report unavailable stock
      after the original purchase succeeded.
    heading:
      - title: A known abort
        brief: >-
          Recognise an explicit transaction abort as evidence that this attempt
          did not commit. A fresh attempt repeats the complete transaction and
          its decisions; an earlier attempt's read results are no longer usable.
      - title: An uncertain outcome
        brief: >-
          Distinguish database commit from the database reply and the reply to
          the caller. A timeout, cancellation request or broken connection alone
          does not establish rollback. Recovery needs durable application facts.
  - title: One request identity across attempts
    brief: >-
      Reuse purchase-103 for every attempt at Mina's one purchase. Scope the key
      to customer 1 and the purchase operation; distinguish request identity from
      order identity and from two intentional purchases with identical contents.
      Bind the key to the relevant canonical payload and reject changed
      quantities under the same key.
  - title: Commit the purchase and its result together
    brief: >-
      Understand why a unique request record, the guarded stock changes, order
      103 and its lines, and the terminal result must commit in one transaction.
      Show how either separate commit order leaves a recovery gap. Success
      records order 103 and leaves P3 at 10 and P7 at 0, without a payment.
    heading:
      - title: A business refusal is a result
        brief: >-
          Distinguish a committed refusal such as insufficient stock from an
          aborted database attempt. Define which terminal business decisions
          are retained and returned on repeats; retain no partial purchase.
          An aborted transaction leaves neither its purchase nor its receipt.
  - title: Two attempts for the same request
    brief: >-
      Follow simultaneous attempts through a database-enforced unique key,
      rather than a preliminary absence check. Only the attempt that obtains
      the key may apply the purchase. If it commits, the other compares the
      payload and returns its stored result; if it aborts, another attempt can
      acquire the key. Make waiting and fresh visibility explicit without
      treating an invisible or missing row as proof of failure.
  - title: Recover the recorded result
    brief: >-
      Follow purchase-103 through a lost commit reply and a lost application
      reply. Re-enter the same protected protocol and return the committed
      result for order 103 without changing stock again. Use an authoritative
      current observation; an old snapshot or lagging replica cannot prove
      absence. Distinguish the original result from the order's later status.
  - title: Choosing what to retry
    brief: >-
      Separate retryable known aborts, terminal business decisions, persistent
      errors and uncertain outcomes. Explain full-transaction retries for
      serialization failures and suitable deadlocks, including decision logic,
      while preserving the logical request identity. Bound attempts and elapsed
      time, back off with jitter, and keep recovery possible after the caller
      stops waiting; exhaustion does not convert uncertainty into failure.
  - title: The limits of duplicate protection
    brief: >-
      Judge the guarantee from key scope, payload comparison, atomicity and
      retained results. Explain why deleting a receipt can admit a late repeat,
      so the retry and retention contract must agree. The protocol protects
      this database operation within its retained history. Payment-provider
      calls, emails and worker recovery need the separate outbox and job
      protocol; native CockroachDB errors and driver cleanup stay in their
      existing implementation articles.
