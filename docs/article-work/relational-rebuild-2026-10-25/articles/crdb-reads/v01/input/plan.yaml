topic: CockroachDB read choices
title: CockroachDB isolation and follower reads
brief: >-
  Choose native isolation, historical timestamps and read routing from the
  decision the application must support. Judge freshness, common history,
  follower eligibility and retention separately. Use CockroachDB v26.2 and the
  shop's independent P7 price replay. Commit, retry and ambiguous-result
  procedures remain with CockroachDB transactions and retries; general
  distributed snapshot reasoning remains with Time, snapshots and distributed
  reads.
heading:
  - title: Current reads and historical reads
    brief: >-
      Distinguish an ordinary current read from a deliberate observation of
      earlier committed data. Follow P7's independent 20.00 to 22.00 price
      change: an earlier price can suit a catalogue display with an explicit
      freshness allowance, but cannot authorise a current stock allocation or
      settle an uncertain purchase outcome.
  - title: Serializable and Read Committed
    brief: >-
      Choose between CockroachDB's default Serializable and its native Read
      Committed by the guarantees the whole decision needs. Establish the
      effective isolation explicitly rather than importing PostgreSQL behaviour
      through the shared client protocol.
    heading:
      - title: One snapshot or a new snapshot for each statement
        brief: >-
          Understand the difference between a Serializable transaction's
          coherent read history and Read Committed's advancing statement
          snapshots. Use two P7 reads around the independent price commit.
          Neither level makes every statement observe changes committed after
          its snapshot; Read Committed is not a historical follower-read mode.
      - title: Decisions across rows
        brief: >-
          Use the separate order-103 payment-limit attempts to see why committed
          statement results alone cannot protect a multi-statement invariant.
          Judge the weaker guarantee before choosing Read Committed to reduce
          retries. Recognise remaining abort/error cases; link to the transaction
          article for handling them and to the general isolation article for
          complete invariant and locking protocols.
  - title: Reading as of one timestamp
    brief: >-
      Understand AS OF SYSTEM TIME as a read-only view of database history,
      distinct from the shop's business effective dates. Keep related reads at
      one chosen timestamp, including a multi-statement historical transaction;
      separately recomputed relative timestamps need not preserve the same
      view. An AS OF clause selects history without proving which replica served
      it.
  - title: Closed timestamps and safe follower reads
    brief: >-
      Explain why a follower needs both the range's closed-timestamp promise
      and the associated applied replication history before serving that time.
      Distinguish this evidence from merely storing an old P7 version. Carry
      the same requested timestamp across relevant ranges; a nearby SQL gateway
      alone establishes neither local KV service nor safe history.
    heading:
      - title: Current reads from nearby replicas
        brief: >-
          Recognise that follower reads also include strong reads, particularly
          from GLOBAL tables. Avoid equating every follower read with deliberate
          staleness. Explain the read/write placement trade briefly; native
          GLOBAL table design and regional survival remain with the locality
          article.
  - title: Exact and bounded staleness
    brief: >-
      Select a fixed historical view or let the engine choose a timestamp within
      a freshness requirement. Keep the permitted age separate from the
      probability of nearby service and from a latency guarantee.
    heading:
      - title: Exact staleness
        brief: >-
          Use an explicit timestamp or follower_read_timestamp() for historical
          reads, including several statements sharing one view. Recognise that
          the convenience timestamp favours follower eligibility without
          guaranteeing local service or freedom from conflicting intents.
      - title: Bounded staleness
        brief: >-
          Apply with_max_staleness or with_min_timestamp to an eligible P7
          primary-key lookup. Understand the minimum timestamp as a lower bound,
          not an exact snapshot, and nearest_only as an availability choice.
          Respect v26.2's implicit single-statement, single-row and no-index-join
          limits; this is not the multi-query report mechanism.
  - title: Freshness after a write
    brief: >-
      Start a fresh current transaction when the caller needs its newly confirmed purchase.
      Recognise why an arbitrary staleness allowance can miss that write and
      when a trustworthy minimum-history bound would be needed instead.
      Historical absence cannot establish that an uncertain purchase failed;
      recover through the transaction article's protected request protocol.
  - title: Retained history and unavailable reads
    brief: >-
      Judge whether the required historical versions remain available as well
      as whether a replica can safely serve their time. Inspect effective GC
      retention, account for the lifetime of a fixed historical view, and handle
      unavailable history explicitly. Retention changes have storage costs;
      increasing them is not an audit-history or backup design.
  - title: Checking the read that actually ran
    brief: >-
      Check effective isolation and the executed query's historical timestamp,
      follower-read evidence and SQL/KV locations. Distinguish successful SQL
      from proof of the chosen serving path, and correctness observations from
      latency or availability measurements. Use this evidence to confirm the
      read choice against the application's decision and freshness requirement.
