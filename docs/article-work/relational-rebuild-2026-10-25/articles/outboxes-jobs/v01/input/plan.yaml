topic: Durable external work
title: Outboxes and database-backed jobs
brief: >-
  Commit an external intention with the domain change, then recover delivery and
  worker execution without losing the work or blindly repeating its effect.
  Distinguish stable work identity from a worker's claim, and judge what receiver
  deduplication, leases, expiry and fencing actually protect. Use order 103's
  order-received acknowledgement as a proposed shop extension. Logical purchase
  recovery belongs in Retries and uncertain commit outcomes; general lock
  protocols and native row-change streams remain with their existing owners.
heading:
  - title: The gap between a commit and a send
    brief: >-
      Understand why sending before the order commits can announce a rolled-back
      order, while sending afterwards can lose the acknowledgement if the process
      stops. A database rollback cannot retract an external effect, even when the
      call is made inside the transaction.
  - title: The transactional outbox
    brief: >-
      Record order 103 and its acknowledgement intention in one durable database
      transaction. Understand what becomes atomic and why a separate relay can
      resume from committed work. An outbox holds messages to deliver; a
      database-backed job holds work to execute, and one notification row can
      serve both roles.
    heading:
      - title: Give the work a stable identity
        brief: >-
          Keep the same work ID and intended payload through every delivery
          attempt. Distinguish the purchase request, the resulting acknowledgement
          and each worker claim. Decide which facts must be captured at creation
          rather than rebuilt from mutable order data later.
  - title: Why delivery can repeat
    brief: >-
      Follow a relay stopping before the call, after receiver acceptance, and
      after recording completion. Understand why marking complete first risks
      loss, while recording completion afterwards leaves a duplicate window.
      A lost reply leaves the external result unknown; an outbox alone cannot
      promise one external effect or eventual success without a working recovery
      process.
  - title: Make repeated delivery safe
    brief: >-
      Choose the deduplication authority where the effect happens. Reuse the work
      ID with the same payload under an external API's stated contract, or commit
      a consumer's processed-message record with its database effect. Understand
      why a local sent flag cannot deduplicate an ordinary remote send.
    heading:
      - title: Know where the guarantee ends
        brief: >-
          Distinguish receiver acceptance, broker acceptance and completed
          business work. Match deduplication retention to retries and later
          redrive; after the receiver forgets an identity, reconcile an unknown
          outcome rather than assuming replay remains safe.
  - title: Claiming work with several workers
    brief: >-
      Make eligibility testing and recording a claim one atomic database action.
      Apply a short PostgreSQL FOR UPDATE SKIP LOCKED transaction to take a
      bounded set of jobs, record their claim generations and lease deadlines,
      and commit before doing external work. Understand that the row lock ends
      at commit; the stored claim governs later attempts.
    heading:
      - title: A queue is not an ordered report
        brief: >-
          Understand that skipping locked rows allows other workers to progress
          but can return no claim while unfinished work remains. Claim order does
          not establish completion order or fairness. Apply the locking mechanism
          here; leave general isolation and deadlock analysis with Locks,
          contention and deadlocks.
  - title: Recovering a lost worker
    brief: >-
      Follow Worker A stopping, its lease expiring and Worker B reclaiming the
      same work with a new generation. Distinguish a lease deadline from a
      completion signal. Renew and finish only through guarded updates for the
      current, unexpired claim, treating a rejected update as lost authority.
    heading:
      - title: Expiry does not stop the old worker
        brief: >-
          See how a paused worker or delayed request can continue after another
          worker takes over. Longer leases and heartbeats change recovery delay
          and duplicate frequency; they cannot prove that stale execution has
          stopped. Use one stated database clock policy for claim decisions.
      - title: Fencing stale work
        brief: >-
          Distinguish a database guard that rejects an old claim's completion
          from receiver-enforced fencing of an external resource. Follow an old
          generation rejected after a newer one is accepted. Tokens must be
          ordered for the protected resource and checked atomically there;
          fencing does not itself deduplicate repeated effects from one attempt.
  - title: When the order of work matters
    brief: >-
      Decide whether independent jobs can finish in any order or changes for one
      order need a per-order sequence and receiver-side version checks. A
      timestamp, generated ID or ORDER BY in a multiworker poll does not by
      itself preserve business order. Distinguish a recorded event about the past
      from a command whose validity may need checking when it executes.
  - title: Retrying and retiring work
    brief: >-
      Schedule retryable failures with bounded backoff and jitter; retain failed
      or exhausted work for diagnosis and deliberate redrive. Separate a lease
      expiry, a job's business deadline, cancellation and deletion. Neither
      cancelling a job nor letting its deadline pass retracts an accepted
      external action.
    heading:
      - title: Keep recovery observable
        brief: >-
          Use oldest eligible work age, completion latency, repeated claims and
          failures to recognise stalled delivery. Preserve stable identities and
          outcome evidence during repair and cleanup. Bound polling, batches and
          concurrency; choose a broker when delivery, fan-out or throughput needs
          warrant it, while retaining responsibility for the database-to-broker
          handover. Native PostgreSQL change-feed setup belongs in PostgreSQL
          logical replication and change feeds.
