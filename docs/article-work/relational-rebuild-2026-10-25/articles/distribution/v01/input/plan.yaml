topic: Distributed relational databases
title: Sharding and distributed SQL
brief: >-
  Choose a distribution boundary from the work and invariants it keeps together
  and the bottleneck it can relieve. Distinguish shards from replicas, understand
  authoritative history and quorum availability within one replicated partition,
  and separate that agreement from transactions and snapshots across partitions.
  Native PostgreSQL and CockroachDB mechanisms belong to their implementation articles.
heading:
  - title: Replicas and shards
    brief: >-
      Understand a replica as another copy and a shard as a portion with an
      owner. Each shard can have replicas, and one machine can hold several
      shards. Local table partitions do not themselves add machines; a SQL
      connection's destination need not own the data it requests.
  - title: Choosing a shard key
    brief: >-
      Derive a useful grouping from the shop's requests. Keeping one order with
      its lines and payments makes order work local; grouping by customer can
      also keep Mina's history together. Neither grouping makes the shop's
      shared product stock belong independently to each buyer.
    heading:
      - title: Co-location and invariant scope
        brief: >-
          Recognise the routing information and compatible placement needed to
          keep related tables together. Preserve globally meaningful order
          identity and references: local uniqueness or adding a routing column
          does not by itself enforce the original global rule. Count all facts
          a purchase must change before calling it a local transaction.
      - title: Range and hash distribution
        brief: >-
          Compare ordered ranges with hashing the distribution key. See why
          range predicates can select adjoining pieces, while hashing changes
          that locality. Judge the choice against actual predicates and write
          patterns rather than expecting either method to balance every workload.
      - title: Skew and hot keys
        brief: >-
          Distinguish unequal data size from concentrated requests and writes.
          Hashing customer_id cannot divide customer 1001's 70% share of the
          supplied generated orders; extra machines cannot independently sell
          the same last P7 mug. Recognise the locality and coordination costs of
          splitting a hot group more finely.
  - title: Queries across shards
    brief: >-
      Trace a known-key request to one owning partition and a shop-wide report
      to all relevant partitions and a combined result. Understand fan-out,
      remote joins and data movement; an index or lookup directory can change
      routing but has its own placement and maintenance work. Parallel work
      can improve elapsed time while total work and exposure to slow participants grow.
  - title: One authoritative replicated history
    brief: >-
      Follow the separate P7 catalogue-price change through one replicated
      partition. A leader orders proposed changes; replicas retain and apply
      agreed history. Distinguish a proposal, durable agreement, application and
      the client's successful reply without requiring every copy to be current.
    heading:
      - title: What the acknowledgement promises
        brief: >-
          Use an explicitly labelled three-voter Raft model to understand a
          durable majority acknowledgement. Election and log rules preserve
          the committed prefix across leadership changes; counting copies alone
          is insufficient. State the failure and storage assumptions, and do not
          infer arbitrary follower-read freshness or a cross-shard SQL commit
          from agreement on one partition's log.
      - title: Losing a quorum
        brief: >-
          See why two communicating voters out of three can make progress
          after a suitable leader is established, while one cannot confirm new
          writes. A network split does not create two independent authorities.
          Reachability alone also cannot establish a current read; older reads
          require their declared contract. Regional placement owns the detailed
          latency and failure-domain design.
        nested_article:
          topic: Distributed SQL placement
          title: Regional placement and survival
          brief: >-
            Place data and voting replicas against stated latency and survival
            needs. Derive quorum survival from failure domains and trace remote
            coordination from apparently local data and global invariants. The
            parent establishes replica agreement and the cost of losing a quorum.
  - title: Transactions across partitions
    brief: >-
      Return to purchase 103 with its order work and shared product stock under
      different owners. Agreement among copies of each participant does not
      decide whether all participants commit together. Explain the need for one
      recoverable atomic outcome and the possibility of waiting after failure;
      leave the commit protocol and coordinator recovery to the child.
    nested_article:
      topic: Distributed atomic commit
      title: Transactions across partitions
      brief: >-
        Explain atomic outcomes across partitions, including recovery of a
        distributed decision after coordinator loss. Distinguish replica
        agreement from transaction commit and connect invariant scope to the
        participants that must coordinate. The parent identifies the participants
        and establishes authoritative replicated history.
  - title: Reading across partitions
    brief: >-
      Understand why individually valid reads from separate owners need not form
      one compatible observation. A distributed report needs a defined common
      history, separately from its fan-out cost. Establish the question without
      developing clock, timestamp or safe-read algorithms here.
    nested_article:
      topic: Distributed read histories
      title: Time, snapshots and distributed reads
      brief: >-
        Read related partitions at a safe common history. Compare logical
        timestamps, clock uncertainty and safe historical reads while
        distinguishing a past observation from authority for a current decision.
        The parent establishes partition ownership and why separate valid reads
        do not by themselves establish one snapshot.
  - title: Growing and changing the cluster
    brief: >-
      Understand that adding a machine supplies capacity only after useful data
      and work reach it. Moving a replica requires catch-up; changing ownership
      or voting membership must preserve authority and history. Movement uses
      resources needed by foreground work and recovery; the child owns the safe
      procedures and membership analysis.
    nested_article:
      topic: Distributed cluster evolution
      title: Rebalancing and cluster change
      brief: >-
        Move replicas and data while preserving authoritative history. Explain
        catch-up and safe membership change, and budget rebalancing and
        decommissioning without treating lost redundancy as spare capacity. The
        parent establishes ownership, replica agreement and why movement consumes capacity.
  - title: Deciding what to distribute
    brief: >-
      Judge a proposed layout against the actual limiting resource, representative
      requests, invariant participants, skew, acknowledgements and failure needs.
      Distinguish less work from parallel work and retained contention. Recognise
      when a single writer, better access paths or read replicas meet the need;
      choose the PostgreSQL or CockroachDB route for concrete capabilities and evidence.
