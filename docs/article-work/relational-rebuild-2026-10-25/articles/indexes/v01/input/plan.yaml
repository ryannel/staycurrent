topic: Relational indexes
title: Indexes and access paths
brief: >-
  Derive an index from the rows a query must find, their required order and the
  values it needs afterwards. Explain the work saved through search bounds,
  fewer row fetches and early stopping; judge that saving against data skew,
  index width, writes and the other queries sharing the table. Develop B-tree
  access paths through the shop's order history. The parent owns general plan
  diagnosis; implementation articles own native methods and counters, and schema
  change articles own safe live builds and removal.
heading:
  - title: From an index entry to a row
    brief: >-
      Understand a key and row locator as a separately maintained route to data.
      Follow an ordered B-tree search to the first matching entry, along a range
      and back to the table. Make index pages, entries examined and table-page
      visits distinguishable; briefly contrast a heap locator with a secondary
      lookup through a clustered table's key.
  - title: Column order in a composite index
    brief: >-
      Derive the customer-history key from customer equality, a time bound and
      newest-first ordering. Understand lexicographic order by comparing customer
      alone, customer then time, and time then customer. Judge the useful leading
      prefix from the whole workload rather than automatically putting the most
      selective column first.
    heading:
      - title: Equality, ranges and later columns
        brief: >-
          Distinguish conditions that bound a contiguous scan from checks on
          entries already visited. Explain why a later condition can save row
          fetches without making the same saving in index traversal. Recognise
          that skip scans and repeated searches are implementation-dependent
          alternatives, not grounds for declaring every suffix query unusable.
  - title: Match the query to the indexed value
    brief: >-
      Judge whether the query compares the value and ordering the index actually
      stores. Use the existing UTC time range to contrast a direct timestamp
      bound with transforming the stored timestamp. Recognise that types,
      expressions, collation and supported operators matter; native operator
      classes and alternative PostgreSQL methods belong in their existing article.
  - title: ORDER BY and stopping at LIMIT
    brief: >-
      Explain when equality on a leading key leaves the remaining entries in the
      requested order, allowing the history query to stop after enough eligible
      rows. Account for descending direction, mixed directions, null placement
      and an explicit order-ID tie-breaker. Keep ORDER BY in SQL; pagination owns
      cursor correctness and changing-list behaviour. A limit after customer
      totals does not let an ordinary order-date index stop before those totals
      have been calculated.
  - title: Selectivity and where the matching rows live
    brief: >-
      Judge an access path by the fraction matching and the pages holding those
      rows, not by an index's existence. Compare narrow and broad bounds and
      common and rare customers, including the shared fixture's skew. Explain
      why collecting row locations in page order or scanning once can beat
      individual fetches, and why combining indexes can lose useful ordering.
      Reuse the parent's measurement distinctions without reteaching its planner
      or statistics diagnosis.
  - title: Covering indexes and index-only scans
    brief: >-
      Separate search keys from stored payload using the history query's returned
      status. Understand that covering is relative to all values this query needs,
      and can avoid table fetches without narrowing the scanned range. Weigh
      wider entries and payload updates against the saving. Explain the visibility
      qualification sufficiently to avoid promising zero table fetches; detailed
      PostgreSQL visibility-map and vacuum behaviour stays with native owners.
  - title: Partial and expression indexes
    brief: >-
      Choose a smaller or differently keyed index only when its subset or stored
      expression matches the query's meaning. Compare paid-only history with
      all-status history, and an expression lookup with a direct UTC range.
      Explain predicate implication and planning limitations without assuming a
      parameter proves a fixed predicate. Keep both variants as sections rather
      than adding specialist pages.
  - title: Indexes for joins and foreign keys
    brief: >-
      Apply the same leading-key reasoning to repeated order-line lookups through
      (order_id, line_no) and to finding orders for a customer. Distinguish the
      unique lookup supporting a referenced key from the referencing-side lookup
      needed by parent changes. Check what the engine already created, and keep
      constraint meaning with the integrity article and join-method selection
      with the parent.
  - title: What each index adds to writes
    brief: >-
      Follow the maintenance caused by an insert and by changing a key, a payload
      or a partial-index predicate. Understand additional storage, cache demand,
      log work, page splits and eventual cleanup as costs of the chosen access
      paths, with engine-dependent update behaviour. Briefly connect clustered
      key width and insertion pattern to secondary-index cost. Do not prescribe
      fill factors, rebuilds or live maintenance procedures here.
  - title: Choose a set of indexes for the workload
    brief: >-
      Combine the customer history, paid-only history, broad report and reference
      lookups into a small set of candidates. Recognise when a shared leading
      prefix serves several queries and when separate indexes or their combination
      suit different searches. Treat an apparently redundant index as a candidate
      for investigation: uniqueness, predicates, ordering, width and rare jobs
      can preserve a distinct purpose. Safe removal belongs with schema changes.
  - title: Check that the proposed work disappeared
    brief: >-
      Predict which bounds, rejected fetches or sort a candidate should remove;
      compare correct results and measured paths on the same data and statistics
      state. Test common and rare customers, narrow and broad dates, all-status
      and paid-only requests, and competing writes. Distinguish illustrated entry
      counts from native counters and repeated page accesses from storage reads.
      Accept the index set only when the saved read work earns its space and
      maintenance cost; link to native plan interpretation and live rollout for
      their deeper procedures.
