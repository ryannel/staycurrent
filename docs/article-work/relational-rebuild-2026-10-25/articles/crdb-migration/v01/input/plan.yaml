topic: PostgreSQL-to-CockroachDB migration
title: Moving a SQL application to CockroachDB
brief: >-
  Find semantic incompatibilities behind familiar SQL and preserve the shop's
  application contract. Rehearse a consistent offline copy, accept one new write
  authority and return through a validated reverse copy once CockroachDB has
  accepted new work. Native retry mechanics, engine upgrades and backup procedures
  remain with their existing owners.
heading:
  - title: The same SQL can mean something different
    brief: >-
      Distinguish a PostgreSQL client connection from compatible behaviour. Use
      integer division and integer range to make two differences concrete, then
      choose explicit arithmetic and target types from the application's intended
      result and accepted values. Check the actual driver and generated SQL.
  - title: Preserve one purchase
    brief: >-
      Carry the guarded stock changes, pending order, agreed lines and retained
      request result as one contract. Choose isolation explicitly and verify the
      whole operation, refusals and repeats under the target runtime identity.
      Link to CockroachDB transactions and retries for its complete error protocol;
      changing the endpoint does not supply that protocol.
  - title: Choose a migration you can rehearse
    brief: >-
      Choose a write pause covering final export, load and acceptance for this small
      shop. Prepare reviewed target DDL and a client-side CSV copy; account for all
      business tables, request records, durable work and access configuration.
      Recognise when the measured pause instead requires a coordinated bulk-copy
      and change-stream method, including a separately tested return path.
  - title: Close the source and copy its final state
    brief: >-
      Stop admission and external dispatch, settle in-flight work, drain and exclude
      source writers, then test a stale runtime caller. Export the related state
      from one PostgreSQL snapshot, load an empty isolated candidate in dependency
      order and retain the source closed. A consistent earlier copy alone does not
      include later commits; routing alone does not close a writer.
  - title: Accept the target before opening it
    brief: >-
      Compare complete keys and values, relationships and retained operation
      identities, then test the actual application and grants. Keep target callers
      excluded until acceptance. Transfer authority deliberately and run the
      established purchase-103 replay: pending order 103, two lines worth 29.00,
      stock 10/0/4 and no payment; its repeat recovers the same result and durable
      acknowledgement identity. Make the first accepted target work visible.
  - title: Return without losing accepted work
    brief: >-
      Before target work, an excluded candidate can be abandoned for the intact
      closed source. Afterwards, the original PostgreSQL copy is stale. Close and
      drain CockroachDB, copy its complete compatible final state into a fresh
      PostgreSQL candidate, validate it and transfer authority again. Preserve
      payloads, results and durable work so a repeat cannot buy or dispatch twice.
      An unavailable source, incompatible target values or unresolved external
      effects require a different recovery or reconciliation decision.
  - title: Finish the application transfer
    brief: >-
      Verify caller destinations, workers, operating access and recovery coverage
      under the new authority before retiring the old paths. Distinguish the
      bounded two-engine rehearsal from production duration, cluster survival and
      external delivery guarantees. Native backup, security and performance
      procedures remain with their existing articles.
