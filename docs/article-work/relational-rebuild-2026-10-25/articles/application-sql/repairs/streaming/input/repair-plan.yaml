topic: Application database boundary
title: SQL at the application boundary
brief: >-
  Preserve query meaning and transaction ownership across drivers, pools and
  ORMs. Choose parameters and result mappings deliberately, bound the work of
  related-row loading, and leave each request's connection safe after success,
  error or cancellation. Assume SELECT, guarded writes and a transaction
  boundary; deeper retry, capacity, authority and external-delivery protocols
  retain their accepted owners.
heading:
  - title: From an application request to SQL
    brief: >-
      Understand how a request becomes SQL text, input values and returned rows
      through a driver, with a pool supplying a reusable connection. Follow
      Mina's order history so the same intended result can be recognised through
      raw SQL, a query builder or an ORM.
  - title: Parameters and SQL structure
    brief: >-
      Keep customer and order values separate from executable SQL. Understand
      why a bound value cannot choose a column or sort direction, and select
      variable SQL structure from application-controlled alternatives. Distinguish
      binding values from naming and caching a prepared statement.
  - title: Mapping the result
    brief: >-
      Treat selected columns, their names, types and cardinality as the
      application contract. Preserve exact amounts, instants and NULL meanings
      across driver conversions; distinguish an absent row from a row containing
      a NULL. Use the shop's existing prices and placed_at values rather than
      introducing another type tutorial.
    heading:
      - title: Reading a write's result
        brief: >-
          Distinguish returned rows from affected-row counts. A guarded stock
          change that affects zero rows is a completed statement whose condition
          did not match; the caller must decide whether to abandon the purchase.
          Do not infer a unique cause from a zero count.
  - title: Consuming a large result
    brief: >-
      Distinguish selecting a bounded result from consuming one result
      incrementally. Keep the result and its connection under one owner through
      awaited consumption, completion, early stopping and failure; close or
      dispose of unfinished work before reuse. Pagination owns continuation and
      export snapshot correctness.
  - title: The N+1 query problem
    brief: >-
      Recognise the extra query hidden in each relationship access or loop.
      Compare Mina's two orders and four order lines loaded one order at a time,
      in a batch, or through a join. Judge round trips alongside rows transferred
      and preserve the requested parent records and their complete lines.
    heading:
      - title: Choosing what to load
        brief: >-
          Bound the parent selection before loading its lines, and choose a
          projection, joined load or batched load for the required result.
          Recognise duplicated parent data and accidental limits on joined rows.
          Inspect emitted SQL rather than assuming one ORM call means one query.
      - title: Several queries and one result
        brief: >-
          Recognise that batched reads are separate observations: a shared
          connection or a default PostgreSQL transaction does not by itself give
          every SELECT the same snapshot. Identify a consistency requirement and
          route its isolation design to the transaction reading.
  - title: Connections and transaction ownership
    brief: >-
      Carry order 103's guarded stock changes, order and two lines through one
      checked-out connection and one transaction owner. Understand why separate
      pool convenience calls can split the work, and why helpers must use the
      caller's transaction rather than commit independently. Keep unrelated
      waits outside this transaction.
    heading:
      - title: Borrowing and returning a connection
        brief: >-
          Follow checkout, use, completion and release on every path. Reuse a
          process-level pool, borrow only while needed, and distinguish returning
          a connection from closing the pool. Recognise an unavailable connection
          as a request wait; pool budgets and overload policy belong to
          Connections, overload and capacity.
      - title: Session state survives a request
        brief: >-
          Understand that a reused database session can retain settings after a
          request ends. Establish stable connection defaults and scope temporary
          PostgreSQL settings to the transaction where appropriate; a release
          alone does not promise a reset.
      - title: ORM sessions and commits
        brief: >-
          Locate the same ownership boundary in an ORM's transaction or unit of
          work. Distinguish changing an object, flushing SQL and committing, and
          account for documented implicit reads or writes. Do not share a mutable
          unit of work between unrelated requests.
  - title: Errors and connection cleanup
    brief: >-
      Transport a known database rejection without losing its code or relevant
      constraint identity, and distinguish it from an application rejection,
      programming fault or broken connection. Roll back a failed PostgreSQL
      transaction before reuse; discard a connection whose usable state cannot
      be established. Cleanup must preserve the original failure.
    heading:
      - title: Deadlines and cancellation
        brief: >-
          Separate pool waiting, a client giving up, a database statement timeout
          and a confirmed cancellation. Stop scheduling further work, settle or
          dispose of in-flight work and finish transaction cleanup before reuse.
          A cancelled HTTP request is not proof that database work stopped.
      - title: When the commit reply is missing
        brief: >-
          Distinguish a confirmed rollback from an outcome the application cannot
          determine after sending COMMIT. Preserve that uncertainty when handling
          or disposing of the connection; cancellation and a later cleanup
          attempt cannot prove a lost commit failed. Retries and uncertain commit
          outcomes owns request identity, deduplication and recovery.
  - title: External work after a database change
    brief: >-
      Understand why neither an external call inside the transaction nor a
      fire-and-forget call after it makes an order and its external effect atomic.
      Establish the purpose of committing a durable intention with the order;
      the child owns delivery, claiming and recovery.
    nested_article:
      topic: Durable external work
      title: Outboxes and database-backed jobs
      brief: >-
        Commit a durable intention with the domain change, then deliver or claim
        work despite duplicate execution and worker loss. Design deduplication,
        leases, expiry and fencing so recovery preserves the intended external
        effects. The parent establishes the database/external boundary, without
        implementing the delivery or worker protocol.
  - title: The identity behind a connection
    brief: >-
      Distinguish the application's database identity from Mina's authenticated
      customer identity. Binding a customer value does not decide whose rows the
      request may access. Establish why runtime, migration and support tasks need
      deliberate authority; the child owns privilege and tenant-access design.
    nested_article:
      topic: Relational authority and tenant access
      title: Database access and least privilege
      brief: >-
        Derive runtime, migration and support privileges from their tasks. Test
        tenant access as the actual trusted identity, distinguishing database
        authorisation, application identity and row-level integrity. The parent
        introduces connection identity; this child owns the access design and
        its verification, with native policies left to implementation articles.
