topic: Relational normalisation and decomposition
title: Normalisation and decomposition
brief: >-
  Derive keys and safe decompositions from declared dependencies, and judge the
  enforcement trade-off between 3NF and BCNF. Own the formal definitions, closure,
  synthesis and higher normal forms. Relational data modelling supplies the first
  anomaly diagnoses and simple reconstruction examples; this article makes those
  judgements systematic. Use the shop's independent scenarios and the centrally
  agreed advice and pairwise-approval extensions.
heading:
  - title: Dependencies describe the allowed facts
    brief: >-
      Understand a functional dependency as a rule over every legal state, not a
      pattern proved by today's rows. Establish relation schemas, attribute sets,
      trivial dependencies and the set-based, non-null assumptions of the analysis.
      Reuse order-line identity and current customer names without confusing agreed
      unit prices with catalogue prices.
  - title: Attribute closure and candidate keys
    brief: >-
      Compute an attribute closure by applying dependencies until nothing changes;
      use it to decide implication, superkeys and minimal candidate keys. Distinguish
      attribute closure from the closure of a dependency set. Make the accumulated
      attributes and the dependency enabling each step visible.
    heading:
      - title: Finding every candidate key
        brief: >-
          Use attributes absent from dependency right sides to constrain the search,
          then test combinations and minimality. Find both overlapping keys in the
          independent advice scenario; choosing a primary key does not remove the
          other key from normalisation analysis.
      - title: Why the inference rules work
        brief: >-
          Understand reflexivity, augmentation and transitivity through the agreement
          of pairs of rows, and use their soundness and completeness to justify the
          closure procedure without requiring an enumeration of every implied rule.
  - title: Lossless joins and dependency preservation
    brief: >-
      Separate two promises: projections reconstruct every legal original relation
      exactly, and local dependencies together enforce the original dependencies.
      Make an extra reconstructed row visible and explain why losing information
      can produce more rows. Neither promise follows from having fewer columns.
    heading:
      - title: Testing a binary decomposition
        brief: >-
          Test whether the shared attributes determine either component. Understand
          this as necessary and sufficient under functional dependencies alone, and
          as sufficient when additional kinds of constraint apply.
      - title: Testing several projections
        brief: >-
          Carry out one small FD chase, merging symbols forced equal until a complete
          distinguished row appears or no change remains. Distinguish this guarantee
          for all legal states from joining one sample successfully.
      - title: Testing the dependencies that remain
        brief: >-
          Project implied dependencies onto each component and test whether their
          union entails the originals. Use closure to perform the check; merely
          retaining the originally written dependencies can miss an implied one.
  - title: From second normal form to Boyce–Codd normal form
    brief: >-
      Diagnose partial and transitive dependencies with all candidate keys in view.
      State 2NF, the precise prime-attribute exception in 3NF, and BCNF's requirement
      that every non-trivial FD have a superkey determinant. Keep the treatment tied
      to concrete allowed changes rather than a ladder of labels.
  - title: Decomposing into BCNF
    brief: >-
      Split on a violating dependency, retain its determinant in both components,
      and repeat using the dependencies implied on each new schema. Explain why
      each split is lossless and why different choices can preserve different rules.
    heading:
      - title: When a lossless split makes a rule harder to enforce
        brief: >-
          In the independent advice scenario, follow both overlapping keys, the BCNF
          split and a locally valid pair of assignments whose join violates the
          customer/style rule. Start with a valid assignment. Understand why 3NF can
          be an intentional choice; constraint mechanisms and concurrent enforcement
          belong to Constraints and data integrity and Transactions and isolation.
  - title: Synthesising a dependency-preserving 3NF design
    brief: >-
      Reduce the dependencies to an equivalent minimal cover, remove extraneous
      determinant attributes and redundant rules, group by determinant, and create
      component schemas. Remove contained schemas and add a candidate-key schema
      if none contains one. Understand the lossless and dependency-preserving
      guarantees and recognise that a minimal cover or resulting design need not
      be unique.
    heading:
      - title: Why a key relation may be needed
        brief: >-
          Use a product/name/tag relation from the existing tag scenario: product ID
          determines product name, but product/tag membership must also survive.
          See why synthesising only product ID and name omits part of the original
          fact, and why retaining the product/tag key repairs the construction.
  - title: Multivalued dependencies and fourth normal form
    brief: >-
      Formalise the existing independent tags/suppliers example as all combinations
      within each product. Understand tuple swapping, complementary attribute sets,
      trivial MVDs and the 4NF test. Derive the lossless binary split and distinguish
      independence from merely having several values; an association between tag
      and supplier would change the rule.
  - title: Join dependencies and fifth normal form
    brief: >-
      Understand a join dependency as exact reconstruction from specified
      projections in every legal state. Reuse the original offers and their absent
      triple to disprove the proposed pairwise decomposition. Contrast the separate
      pairwise-approval policy, where that reconstruction is a declared rule. State
      5NF as every non-trivial JD being implied by the set of candidate-key
      dependencies, and explain why some useful decompositions need three
      projections rather than successive binary splits. Classify schemas from
      declared dependencies, not accidental properties of the displayed rows.
  - title: What higher normal forms can promise
    brief: >-
      Distinguish 6NF's irreducibility under join dependencies from 5NF's
      key-implied dependencies, and DK/NF's requirement that domains and keys imply
      all constraints. Recognise their different aims and limits; detailed temporal
      operations remain with History, correction and deletion. A higher normal-form
      label does not establish performance or express every business rule.
  - title: Choosing and checking a decomposition
    brief: >-
      Apply the methods to a proposed design: state its facts and dependencies,
      derive keys, establish losslessness, check preserved rules and identify any
      enforcement responsibility left across tables. Distinguish theoretical
      reconstruction of projections from the deliberate ability to record a
      product before it has tags or suppliers. Keep SQL null semantics, migration
      procedures and measured query costs with their existing owners.
