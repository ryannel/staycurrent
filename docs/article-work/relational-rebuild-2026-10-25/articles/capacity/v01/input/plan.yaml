topic: Relational workload capacity
title: Connections, overload and capacity
brief: >-
  Distinguish open connections, admitted work and queued requests. Budget pools
  and concurrent work around the limiting resource, choose bounded overload
  behaviour, and validate useful service with recovery headroom. Diagnosis
  belongs to the parent; individual connection handling and native operating
  procedures remain with their existing owners.
heading:
  - title: Connections and work in progress
    brief: >-
      Follow Mina's history request from the application queue through a borrowed
      connection to completion. Distinguish idle connections, occupied clients,
      executing statements and database waits; make the populations and their
      boundaries visible without repeating the parent's diagnosis.
  - title: Throughput, latency and concurrency
    brief: >-
      Understand why longer connection holding needs more occupied clients at
      the same completed rate. Use consistent boundaries and mean values in
      Little's Law; distinguish this stable-workload relationship from a growing
      queue and from a pool-sizing recommendation.
  - title: Find the resource that limits useful work
    brief: >-
      Judge history reads and reports by their processor, memory, storage and
      contention costs rather than treating every request as equal. Recognise
      when more simultaneous work adds delay or reduces useful completions;
      detailed query and lock repairs stay with their owners.
  - title: Budget connection pools across the application
    brief: >-
      Reconcile every instance and background worker with one database connection
      budget, allowing for scaling and deployment overlap. Distinguish that
      connection ceiling from a tested active-work limit and preserve operational
      access; adding application instances does not create database capacity.
    heading:
      - title: A pooler adds another boundary
        brief: >-
          Understand how many client connections can share fewer server
          connections and where waiting moves. Check session-state and transaction
          compatibility before choosing a pooling mode; native setup belongs to
          the implementation articles.
  - title: Bound waiting and reject excess work
    brief: >-
      Choose an explicit admission limit, finite queue and waiting budget that
      leave time for useful execution. Follow excess requests to a deliberate
      rejection, deferment or permitted reduced response instead of allowing
      hidden queues and retries to grow without a bound.
    heading:
      - title: Keep work classes within the shared budget
        brief: >-
          Protect interactive history requests from optional reports and noisy
          callers while accounting for their common database resources. Separate
          pools alone do not reserve processors, memory or storage.
      - title: Deadlines, cancellation and retries
        brief: >-
          Carry the remaining deadline across queues and attempts, remove expired
          queued work, and account for cancellation until work has actually ended.
          Bound retry amplification; safe retry identity and uncertain commits
          remain with Retries and uncertain commit outcomes.
  - title: Leave capacity for recovery
    brief: >-
      Budget resources and free space for background upkeep, repairs, cold starts
      and reduced-capacity operation. Understand that clearing a backlog needs
      capacity beyond new arrivals, and reconnecting or restoring paused work can
      consume that margin; replica movement and native recovery stay elsewhere.
  - title: Test the workload and the overload policy
    brief: >-
      Validate the chosen limits on a representative request mix and data shape,
      including bursts, slower dependencies and recovery. Compare offered load,
      admitted work, useful completions, tail latency, refusals and queue drainage;
      recognise when a load generator hides demand by waiting for replies.
