topic: PostgreSQL version and system migration
title: Upgrading and migrating PostgreSQL
brief: >-
  Choose a PostgreSQL upgrade or migration method from compatibility, interruption
  and recovery needs. Rehearse a complete target, close the source history,
  transfer one write authority and accept the resulting service. Distinguish
  preservation of old files from a safe return after target writes. Native
  publication/subscriber mechanics belong to PostgreSQL logical replication and
  change feeds; restore procedures belong to Restoring PostgreSQL to a recovery
  target; PostgreSQL-to-CockroachDB contract changes belong to Moving a SQL
  application to CockroachDB.
heading:
  - title: Choose an upgrade method
    brief: >-
      Understand what changes between minor and major releases, and compare
      pg_upgrade, dump and restore, and logical replication by what they move,
      where copying happens and which work falls inside the interruption.
    heading:
      - title: Minor and major releases
        brief: >-
          Distinguish a compatible minor update from a major-version transfer.
          Read the migration notes for every crossed major release; changing
          binaries or promoting a physical standby is not a general major upgrade.
      - title: Reuse the files or reconstruct the database
        brief: >-
          Judge pg_upgrade against an independent logical target. A stopped
          dump-and-restore path trades a longer write pause for less moving
          machinery; continuous logical copying moves work before the final pause
          while adding a stream and a completeness obligation.
  - title: Define what must survive the move
    brief: >-
      Establish the application and operational contract before choosing the
      cutover. Separate copied rows from the objects, identities, settings and
      dependent services needed to use them.
    heading:
      - title: Inventory the whole service
        brief: >-
          Account for every required database and object, roles and grants,
          extensions, configuration, sequences, external consumers and workers.
          A products-only publication cannot transfer the shop's orders and
          payments; a single-database dump does not define cluster-wide globals.
      - title: Test compatibility on the intended target
        brief: >-
          Exercise the actual client, SQL and access identities against the new
          server and extension versions. Include collation and operating-system
          changes, migration tooling and representative query work; successful
          copying alone does not establish equivalent behaviour.
  - title: Rehearse pg_upgrade
    brief: >-
      Understand how the new version's pg_upgrade checks and transforms a stopped
      cluster. Use a separate rehearsal to expose compatibility failures,
      required follow-up work, space needs and the actual interruption.
    heading:
      - title: Checks and a complete rehearsal
        brief: >-
          Distinguish pg_upgrade --check from a completed upgrade and application
          acceptance. Rehearse with the intended transfer mode, compatible cluster
          settings and extension software; complete generated repair and statistics
          work before relying on affected objects.
      - title: Copy, clone and link modes
        brief: >-
          Understand which modes preserve independent old files and which share
          them. Starting a link-mode target makes the old cluster unsafe to start;
          keeping a backup and choosing a supported mode are recovery decisions,
          separate from whether the new application has written anything.
  - title: Prepare an independent logical target
    brief: >-
      Judge whether a consistent stopped-source dump or a coordinated initial
      copy followed by changes fits the move. Keep target application writers and
      external dispatch excluded while preparing the candidate.
    heading:
      - title: A consistent copy needs a final boundary
        brief: >-
          Understand why a live dump omits later commits and an arbitrary dump
          followed by a new stream can leave a gap. For a streaming move, require
          every selected table to finish synchronisation and the exact stream to
          cover the required source history; native setup stays with its owner.
      - title: Complete what the row stream leaves out
        brief: >-
          Prepare schema, sequence state, large objects and other required state
          outside logical table changes. Keep DDL coordinated and verify required
          relationships and objects; running apply workers and matching row counts
          cannot prove a complete service.
  - title: Close the source history
    brief: >-
      Establish a finite final source state before accepting the destination.
      Make admission, in-flight outcomes, replication progress and old-writer
      exclusion visible as different conditions of the same handover.
    heading:
      - title: Drain every writer
        brief: >-
          Stop new source work, drain transactions and account for uncertain
          commits and external calls. Include pools, imports, scheduled tasks,
          administrators and restart paths; moving an address does not exclude
          their existing connections or their return as writers.
      - title: Prove the target has the final source state
        brief: >-
          Relate a closed source boundary to durable applied progress on the exact
          target, then compare required data under fresh observations. Receipt,
          zero reported lag or one correct P7 price cannot establish this proof;
          unrelated native positions must not be compared as one history.
  - title: Accept the target before admitting writers
    brief: >-
      Combine data, object, application and operational evidence into a deliberate
      decision. Keep the former source excluded while validation uses the
      candidate under controlled access.
    heading:
      - title: Check facts and application behaviour
        brief: >-
          Verify the shop's complete required keys, values and relationships,
          runtime permissions and representative reads and controlled writes.
          Preserve order 103's pending status, agreed total 29.00 and stock
          10/0/4 independently of catalogue price; reconcile known exceptions.
      - title: Move callers and dependent work
        brief: >-
          Replace stale connections, verify each caller's destination and resume
          jobs and external dispatch only under the accepted authority. Confirm
          required consumers, replicas, monitoring and recoverability belong to
          the new service rather than assuming they followed its data.
  - title: Know when a simple return ends
    brief: >-
      Distinguish aborting before target writes from recovering after histories
      diverge. A physically intact old cluster is already stale once the target
      accepts an authoritative change absent from it.
    heading:
      - title: Return before new authoritative work
        brief: >-
          Rehearse excluding the candidate and returning callers to the preserved
          source only while its files are usable and its history is complete.
          Include target validation writes and external effects in that judgement,
          not merely whether public traffic has been enabled.
      - title: Recover after the target has written
        brief: >-
          Follow target-only P7 20.00 to 22.00 while the stopped source remains at
          20.00. Returning now needs a compatible, tested transfer or reconciliation
          of accepted work; reverse replication and older-version restore are not
          automatic undo mechanisms, and external effects do not roll back.
  - title: Finish the migration
    brief: >-
      Establish and test backup coverage and required redundancy for the accepted
      service before retiring the old recovery path. Record the achieved
      interruption, accepted exceptions and remaining obligations; a small
      successful rehearsal is not a production duration guarantee.
