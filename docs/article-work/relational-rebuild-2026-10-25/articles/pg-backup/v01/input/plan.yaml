topic: PostgreSQL backup and restoration
title: Restoring PostgreSQL to a recovery target
brief: >-
  Build and test a PostgreSQL base-backup and archived-WAL recovery path, choose
  a target in the right history and prove the recovered facts before reopening
  service. Follow the shop's separate 2.20 price mistake and later payment 504;
  close source writes and reconcile the known accepted payment without charging
  again. Own native physical and bounded logical restore procedures; general
  recovery design, restart durability and promotion of an existing replica
  remain with their respective articles.
heading:
  - title: Which backup can reach the target?
    brief: >-
      Understand why restoring before the price mistake also omits the later
      payment. Choose whole-cluster physical recovery for a WAL target, or a
      logical export for reconstruction of its selected objects; a dump cannot
      be advanced through WAL. Use the general recovery article for RPO, RTO
      and the choice between business correction, restore and failover.
    heading:
      - title: Restoring a logical dump
        brief: >-
          Follow a small custom-format dump into a fresh isolated database with
          pg_restore, stopping on errors and checking required roles, extensions,
          ownership and recovered facts. Recognise the psql path for plain SQL
          and the separate treatment of globals; migration compatibility and
          write cutover remain with the upgrade article.
  - title: Archive WAL before taking the backup
    brief: >-
      Establish and test PostgreSQL archiving, including the required server
      settings and a destination that preserves source identity and filenames.
      Judge success from safely stored, retrievable files and honest command
      results; understand why completed-segment archiving can lag a local commit.
    heading:
      - title: Read archive progress without assuming coverage
        brief: >-
          Use pg_stat_archiver, archive contents and logs together. A recent
          successful filename does not prove an unbroken chain; failures can
          also accumulate WAL on the source. A forced switch makes a segment
          eligible for archiving, rather than proving the archive has it.
  - title: Take and verify a base backup
    brief: >-
      Follow pg_basebackup with streamed WAL and its manifest through a complete
      backup. Distinguish the WAL that makes this backup usable from the later
      archive needed for a chosen target; retain backup labels and tablespace
      information. The earliest usable recovery point follows backup completion.
    heading:
      - title: What pg_verifybackup proves
        brief: >-
          Check the backup's files, checksums and required consistency WAL with
          matching tools. Understand why this does not verify every later archive
          segment, the target state or application readiness.
      - title: Incremental backups have earlier dependencies
        brief: >-
          Understand the native incremental path: WAL summaries support taking
          increments, and pg_combinebackup reconstructs a full backup from the
          required chain before recovery. Retain and verify its dependencies;
          summarisation does not replace archived WAL for recovery targets.
  - title: Choose the target and timeline
    brief: >-
      Identify the intended source history and a supported stopping boundary.
      Use a deliberately created named restore point after backup completion
      for the controlled shop drill; do not imply that a marker can be created
      retrospectively for an unknown incident.
    heading:
      - title: Time, transaction ID and WAL position
        brief: >-
          Choose among the native target forms using available evidence. Explain
          inclusive and exclusive boundaries where supported, commit order
          rather than numerical transaction-ID order, and explicit time zones.
          Detection time and application timestamps do not establish the boundary.
      - title: A recovery creates another branch
        brief: >-
          Read a timeline and its history as the identity of a recovery branch.
          Choose the intended timeline deliberately when archives contain several;
          an LSN alone does not identify a state across histories.
  - title: Restore into an isolated cluster
    brief: >-
      Follow a fresh copy of the verified backup into a compatible PostgreSQL
      instance with correct paths, tablespaces, permissions and configuration.
      Configure archive retrieval, recovery.signal, the selected target and pause
      for inspection; exclude ordinary callers, source streaming and external
      dispatch while preserving the original recovery material.
    heading:
      - title: Inspect the paused recovery
        brief: >-
          Confirm recovery has actually paused using native state and logs, then
          inspect the recovered shop. Continue towards a later target only while
          recovery permits it; an earlier attempt needs a fresh restore.
  - title: Prove the selected history was recovered
    brief: >-
      Match the reported source, timeline and stopping evidence to the intended
      cut. Check P7 at 20.00, order 103 pending with its agreed total 29.00,
      payment 504 absent and stock 10/0/4. Separately verify application reads
      and required objects with external dispatch still disabled.
    heading:
      - title: A missing segment stops the path
        brief: >-
          Demonstrate a required post-backup archive gap on a disposable copy,
          with a target beyond it and no alternative WAL source. Distinguish
          expected archive lookups for absent files from failure to reach the
          explicit target; do not accept a different stopping point as success.
  - title: Complete recovery and reconcile the payment
    brief: >-
      Close the original source history, including in-flight database and provider
      outcomes, before final accounting. Finish the verified recovery under
      controlled access, then apply the established reconciliation for payment
      504 and order-103-part-payment-1 once, retaining its immutable meaning.
      Unknown provider outcomes stay unresolved; the old authority must remain fenced.
    heading:
      - title: Return one authority to service
        brief: >-
          Check the resulting 20.00 catalogue price, pending 29.00 order, one
          10.00 payment, 19.00 due and unchanged stock. Account for restored
          dispatch records and applicable correction or deletion decisions before
          resuming callers and workers. Native standby promotion remains in the
          replication article; recovery design and reconciliation rules remain
          in the general recovery article.
  - title: Keep the recovery path testable
    brief: >-
      Retain complete base, incremental and WAL dependencies plus timeline history
      and required software, configuration and recovery access. Test new branch
      coverage before expiring older paths. Measure access, transfer, restore,
      replay, validation and reconciliation against the service objective; the
      tiny drill establishes behaviour, not a production recovery rate.
