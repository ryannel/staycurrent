topic: SQL data changes
title: Updates, upserts and bulk imports
brief: >-
  Make a change conditional, interpret its affected rows, and choose what an
  existing key means. Stage, validate and reconcile a replayable catalogue batch,
  including a rejected row and work stopped between commits. This article owns
  write and import mechanics; concurrent invariants, uncertain request outcomes,
  application plumbing and live backfill convergence belong to their neighbours.
heading:
  - title: Conditional updates and deletes
    brief: >-
      Understand UPDATE and DELETE as operations on every row satisfying a
      predicate. Follow P7's catalogue price from 20.00 to 22.00 with its key and
      expected old price in the condition; distinguish assigning a value from
      changing the stored value by an expression.
    heading:
      - title: Put the condition in the change
        brief: >-
          Recognise why an earlier SELECT is a preview, while the write's WHERE
          clause decides eligibility. Omitting a condition broadens the change;
          a key alone does not express an expected state. Transactions and
          isolation owns the concurrent stock and multi-row protocols.
      - title: Constraints still apply
        brief: >-
          Understand that an eligible row can still be refused by a constraint,
          including a referenced product's deletion. A guard returning no row and
          a statement failing are different outcomes; a successful guard does not
          establish a rule involving several rows.
  - title: What the affected rows tell you
    brief: >-
      Use a count and PostgreSQL RETURNING to distinguish an applied change from
      an unmet condition. A zero count does not identify which condition failed,
      an update count can include unchanged values, and returned rows do not
      establish that a surrounding transaction committed.
  - title: Choosing an upsert's meaning
    brief: >-
      Understand an upsert as an insert with an explicit response to an existing
      unique key. Follow the catalogue feed's P7 and new P11: update only the
      columns this source owns, leaving existing stock and agreed order prices
      alone.
    heading:
      - title: Ignore, replace or accumulate
        brief: >-
          Choose deliberately between refusing a conflict, keeping existing data,
          replacing supplied fields, and adding a delta. Repeating price 22.00 and
          adding two mugs have different effects; DO NOTHING does not prove two
          payloads agree. PostgreSQL ON CONFLICT handles its specified key
          conflict, not every possible error.
      - title: One proposed value for each key
        brief: >-
          Reject or resolve conflicting source rows by a stated business rule
          before applying them. File order is not a last-writer policy. Recognise
          that duplicate source matches also make UPDATE FROM unsafe and can
          make ON CONFLICT DO UPDATE fail.
  - title: Load into staging first
    brief: >-
      Separate receiving a file from changing shop facts. Preserve immutable batch
      identity, source row numbers and raw values so every row can be traced,
      validated and corrected without losing its original rejection.
    heading:
      - title: Validate the proposed rows
        brief: >-
          Separate file parsing, value conversion, row rules, key conflicts and
          cross-table checks. In B17, P3's negative price is rejected with its
          reason; P7, P11 and P9 remain eligible. Validation does not replace
          constraints at the final write.
      - title: Account for every source row
        brief: >-
          Distinguish received, rejected, pending and applied rows, with explicit
          treatment of unchanged or deliberately skipped rows. Reconcile counts
          and identities against the sealed input rather than treating a bulk
          loader's row count as proof that the intended shop changes happened.
  - title: Apply a validated batch
    brief: >-
      Use set-based writes from a validated source with one candidate per product.
      Existing products receive catalogue fields; P11 is inserted with stock 0.
      Distinguish this partial feed from a complete replacement catalogue:
      absence from this file is not permission to delete a product.
    heading:
      - title: Upsert or MERGE
        brief: >-
          Choose ON CONFLICT for insert-or-update on a unique key, or recognise
          MERGE when source-to-target matching needs several explicit actions.
          Their matching and concurrency guarantees differ. Keep this a bounded
          comparison; do not present MERGE as interchangeable upsert syntax.
      - title: Choose the commit boundary
        brief: >-
          Compare one atomic import with committed chunks: a failed later chunk
          cannot undo earlier commits. Commit each chunk's target changes and
          applied-row records together. This establishes import progress, while
          Transactions and isolation owns the wider concurrency protocol.
  - title: Resume and reconcile an interrupted import
    brief: >-
      Follow B17 after P7 and P11 committed but before P9's chunk started:
      two applied, one rejected, one pending. Resume pending work from durable
      records, finish P9, and reconcile the three applied rows and retained
      rejection against the four input rows.
    heading:
      - title: Replaying the same batch
        brief: >-
          Keep the original batch identity and contents, skip recorded completed
          work, and preserve each decision. Submit corrected rejected data under
          a distinct revision. An upsert alone does not make deltas, stale files
          or changed payloads safe to replay; uncertain commit recovery has its
          full request protocol in Retries and uncertain commit outcomes.
  - title: Choosing a bulk loading method
    brief: >-
      Choose multi-row INSERT, INSERT SELECT or a bulk loader according to source
      and size. Understand PostgreSQL COPY as efficient transport into staging,
      including client versus server file access and its limited error-skipping
      option. Balance chunk cost and partial visibility; leave index maintenance,
      storage tuning and live backfills to their owners.
  - title: Sources and further reading
    brief: >-
      Separate documented PostgreSQL behaviour, invented batch scenarios and any
      subsequently observed executions. Offer primary references for write
      results, conflict handling, bulk loading and atomic transaction boundaries.
