topic: PostgreSQL access methods
title: PostgreSQL index methods and operators
brief: >-
  Choose an access method and operator class from the query's meaning, the
  information the index retains and the way the data is organised. Explain all
  six built-in methods, distinguish candidates from confirmed matches, and
  verify the useful work and write cost of a candidate. General B-tree design
  and physical visibility are prerequisites; specialist retrieval and live
  maintenance retain their existing owners.
heading:
  - title: Access methods and operator classes
    brief: >-
      Understand how the access method supplies a search structure while an
      operator class connects a data type and its operators to that structure.
      Recognise why an index on the right column can still lack the required
      search, using product-name prefix matching and comparison order.
    heading:
      - title: Finding the supported operators
        brief: >-
          Read USING and the column's operator class in an index definition.
          Check the operator's operand types, collation and operator-family
          support rather than guessing from its spelling or the method's name.
  - title: B-tree and hash indexes
    brief: >-
      Use the established customer-history request to distinguish an ordered
      search from equality alone. Explain a hash bucket's stored hash, possible
      collisions and equality recheck; judge its narrower capabilities against
      B-tree without assuming equality makes hash faster.
    heading:
      - title: What the query needs after equality
        brief: >-
          Recognise when range bounds, ordered LIMIT, several key columns,
          uniqueness or index-only retrieval rule out a hash replacement.
          Apply the prerequisite's B-tree reasoning without reteaching its full
          key-design procedure.
  - title: GIN indexes and component values
    brief: >-
      Follow P7's gift and ceramic tags into separate keys and their posting
      lists, then back to candidate rows. Distinguish containment or overlap
      from comparison of a whole array, and relate exactness to the selected
      operator and class rather than to GIN alone.
    heading:
      - title: From component lookup to text search
        brief: >-
          Understand that retrieving rows containing keys does not by itself
          define linguistic matching, phrases or relevance. Establish the
          inverted-index concept here; the child owns a complete text-search
          design and its evaluation.
        nested_article:
          topic: PostgreSQL linguistic retrieval
          title: Full-text search in PostgreSQL
          brief: >-
            Build text retrieval from tokens, phrases and configuration through
            ranked, filtered results. Own linguistic matching, ranking,
            relevance evaluation and changes to indexed text or configuration;
            the parent supplies GIN machinery and candidate/recheck concepts.
  - title: GiST and SP-GiST indexes
    brief: >-
      Understand two extensible search frameworks rather than treating either
      as one universal spatial index. Make pruning visible: GiST follows
      summaries covering child values; SP-GiST follows partitions of a search
      space. Choose among supported classes using predicate shape and data.
    heading:
      - title: Overlap and partitioned searches
        brief: >-
          Use the existing half-open reservation intervals to establish indexed
          overlap, then a small mathematical point example to distinguish
          bounding regions from space partitions. Keep specialised type design,
          exclusion rules and extension dependencies with their owners.
      - title: Distance ordering and nearest neighbours
        brief: >-
          Recognise an operator class's distance-ordering capability and an
          index-assisted ORDER BY distance LIMIT query. Distinguish this from
          B-tree value ordering and from approximate embedding retrieval; the
          child owns vector methods and recall evaluation.
        nested_article:
          topic: PostgreSQL vector retrieval
          title: Vector search in PostgreSQL
          brief: >-
            Evaluate exact, HNSW and IVFFlat vector retrieval under filtering,
            nearest-neighbour recall, latency and lifecycle costs, separately
            from the embedding model's semantic usefulness. The parent explains
            native operator support and distance-ordering context; shared
            extension lifecycle remains with Types and extensions in PostgreSQL.
  - title: BRIN indexes and physical correlation
    brief: >-
      Follow a timestamp predicate from a min/max block-range summary to the
      heap pages it cannot exclude and the rows checked there. Compare the
      same values in correlated and mixed physical order; understand the
      precision/size trade-off in pages_per_range and the cost of unsummarised
      ranges without treating time-valued data as automatically suitable.
  - title: Candidates, rechecks and visible rows
    brief: >-
      Separate checking an operator's candidate, testing another SQL filter
      and establishing tuple visibility. Explain lossy index representations
      and page-level bitmap lossiness as different reasons for rechecks;
      exact bitmap locations do not guarantee an exact predicate match.
    heading:
      - title: Reading the index evidence in EXPLAIN
        brief: >-
          Relate Index Cond, Recheck Cond, Rows Removed by Index Recheck,
          Filter and exact/lossy Heap Blocks to the work already explained.
          Check buffers and returned results, without treating Recheck Cond
          alone as a count or emitted rows as all index entries examined.
  - title: What each method adds to writes
    brief: >-
      Judge read savings alongside index size, changed entries and deferred
      work. Develop GIN's many extracted keys and pending-list cleanup,
      hash overflow or growth, and BRIN summary upkeep. Connect ordinary
      index maintenance to the parent's HOT limits; live operating procedures
      remain with PostgreSQL schema changes under load.
  - title: Choosing and checking an access method
    brief: >-
      Choose a supported operator/class first, then compare candidates from
      retained information, physical organisation, requested ordering and
      write workload. Test equivalent results and native plans on representative
      values and layouts; separate demonstrated mechanics from a planner's
      unforced choice and from production performance.
  - title: Sources and further reading
    brief: >-
      Provide versioned PostgreSQL documentation for method capabilities,
      operator classes and plan evidence, with specialist and maintenance
      reading at the boundaries where it becomes useful.
