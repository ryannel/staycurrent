topic: PostgreSQL durability and restart
title: PostgreSQL WAL, checkpoints and durability
brief: >-
  Interpret PostgreSQL's inserted, written and flushed WAL, checkpoint activity
  and retained files without mistaking one for another. Choose commit settings
  against the failure and loss the application can accept, and verify an isolated
  restart drill using client acknowledgements, recovered rows and server logs.
  General storage mechanisms are prerequisites; backup restoration and standby
  promises belong to their existing neighbouring articles.
heading:
  - title: Inserted, written and flushed WAL
    brief: >-
      Follow the independent P7 price change from 20.00 to 22.00 through native
      WAL progress. Read an LSN and a byte difference as positions and volume in
      one identified history, rather than elapsed time, a transaction identity
      or proof of commit. Make the three progress points visible together.
  - title: What COMMIT waits for
    brief: >-
      Explain the local acknowledgement boundary with synchronous_commit on and
      off, then choose from acceptable loss and replayability. Distinguish early
      acknowledgement from disabling fsync or full_page_writes; the latter can
      threaten consistency. Keep the storage flush contract explicit.
    heading:
      - title: Choosing the setting for one transaction
        brief: >-
          Understand SET LOCAL and the setting in effect at commit. An early
          external confirmation can outlive lost asynchronous work; PostgreSQL
          does not retain a dependent database transaction while losing its
          prerequisite. Recognise when configured synchronous standbys add a
          separate wait, whose detailed promises belong to replication.
  - title: Completing a checkpoint
    brief: >-
      Connect a completed checkpoint to its safe redo starting point, rather
      than to every later page change. Explain checkpoint_timeout, max_wal_size
      and checkpoint_completion_target through the trade between page writing,
      replay work and full-page images. Keep protection against interrupted page
      writes visible without repeating the general storage chapter.
  - title: Reading WAL and checkpoint work
    brief: >-
      Use bounded observation intervals to separate generated WAL, page-image
      work, checkpoint requests and completed work, background page writing and
      client I/O. Read checkpoint logs alongside current native statistics before
      changing a setting; a large cumulative count alone cannot identify a cause.
  - title: Why pg_wal can keep growing
    brief: >-
      Distinguish newly generated WAL from space occupied by retained or recycled
      segment files. Treat max_wal_size as a soft checkpoint control, not a disk
      quota. Recognise retention by archives or replicas and hand their repair
      procedures to the existing owners; never infer that a checkpoint permits
      deleting files by hand.
  - title: Testing crash recovery
    brief: >-
      Conduct and interpret a drill on an identified disposable PostgreSQL
      instance with surviving storage. Compare an acknowledged price update and
      unfinished work with the recovered result. Explain what that evidence
      establishes and what it leaves untested.
    heading:
      - title: Record the starting conditions
        brief: >-
          Capture the instance, version, effective settings, client results and
          log baseline before the test. Use permanent logged data and preserve
          the shop's post-103 facts. Keep test evidence outside the instance
          being stopped.
      - title: Stop and restart the instance
        brief: >-
          Distinguish an immediate stop from a clean fast shutdown. Reconnect
          after recovery and check committed and unfinished work through SQL;
          a successful connection alone does not establish the data outcome.
      - title: Read the recovery evidence
        brief: >-
          Relate the recorded redo start, redo end and readiness to the recovered
          price. Separate replay time from the whole interruption and later
          cache warming. Retain the limits of a process-stop test and the reset
          boundary of cumulative statistics.
  - title: Choosing a recovery budget
    brief: >-
      Judge checkpoint changes using representative writing and repeated owned
      restart evidence, without converting WAL bytes or one replay rate into an
      outage guarantee. Separate local restart from lost storage or the unwanted
      committed 2.20 price, which require correction or another recoverable copy.
  - title: Sources and further reading
    brief: >-
      Provide the versioned PostgreSQL manuals and distinguish documented
      mechanisms, illustrative schedules and observations from the eventual
      owned drill. Link directly to the existing backup and replication readings
      when their distinct recovery promises become necessary.
