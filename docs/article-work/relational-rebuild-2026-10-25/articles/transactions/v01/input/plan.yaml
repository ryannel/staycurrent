topic: Relational transactions and isolation
title: Transactions and isolation
brief: >-
  Choose atomic work and isolation from the invariant being preserved. Distinguish
  committed visibility, statement and transaction snapshots and serial outcomes
  through the shop purchase, guarded stock and a multi-row payment limit. The
  children own explicit lock protocols and recovery from failed or uncertain
  requests; storage owns the physical implementation of versions and durability.
heading:
  - title: One purchase, one transaction
    brief: >-
      Choose the database changes that must commit together. Replay order 103:
      its order, two lines and both stock decrements either survive together or
      are rolled back together. Understand BEGIN, COMMIT, ROLLBACK and implicit
      per-statement transactions without assuming atomicity proves the business
      decision correct or includes an external payment call.
  - title: Guarding the last mug
    brief: >-
      See why two earlier reads followed by stock = 0 can accept two purchases
      even with non-negative stock. Follow the guarded stock decrement under
      PostgreSQL Read Committed: Mina commits order 103, Tariq's competing guard
      for order 104 updates no row. Treat that result as a decision to roll back
      the whole losing purchase, rather than an automatic database error.
  - title: What a transaction can see
    brief: >-
      Understand a snapshot as the committed facts available to a read, together
      with its transaction's own changes. Make visible why another session cannot
      read half a committed purchase, while successive reads can still combine
      observations from different moments.
    heading:
      - title: Read Committed
        brief: >-
          Follow two ordinary SELECT statements across order 103's commit and
          recognise their separate statement snapshots. Keep the guarded UPDATE's
          wait and predicate recheck distinct from an ordinary snapshot read.
      - title: Repeatable Read
        brief: >-
          Use PostgreSQL's stable transaction snapshot when several reads need
          one view. Establish it at the first query or data change, rather than
          BEGIN; recognise that an overlapping update of the same row can abort
          the transaction. Separate this guarantee from serializable decisions.
  - title: When the rule spans rows
    brief: >-
      Understand why guarding one existing product row does not generalise to a
      rule about a changing set. In the separate payment-limit scenario, two
      attempts each read no payments against order 103's 29.00 value and insert
      20.00 in different rows. Both can pass on stable snapshots and jointly break
      the rule; a row CHECK or locking only existing payments does not close it.
    heading:
      - title: Write skew and serial outcomes
        brief: >-
          Recognise the payment race as write skew: neither possible serial order
          allows both payments, even though each transaction's reads repeat.
          Distinguish nonrepeatable reads, phantoms and serialization anomalies
          through the worked cases; qualify isolation names by implementation.
      - title: Serializable
        brief: >-
          Preserve the payment limit by putting its reads, decision and insert in
          Serializable transactions for every participating writer. Follow one
          abort and a fresh whole-transaction attempt, which now sees 20.00 and
          refuses another 20.00. Understand serial equivalence of committed work,
          rather than literal one-at-a-time execution or a guaranteed winner.
  - title: Giving a decision a common lock
    brief: >-
      Recognise a common authority, such as the order row for its payments, as an
      alternative way to coordinate a multi-row decision. Understand why the lock
      must cover the decision through commit and why a lock does not refresh an
      old snapshot. The child owns the complete lock and snapshot protocol, scope,
      acquisition order and diagnosis of waiting.
    nested_article:
      topic: Relational lock protocols
      title: Locks, contention and deadlocks
      brief: >-
        Choose a lockable authority and a sound isolation and snapshot protocol
        for a decision. Design lock scope and acquisition order, then diagnose
        deadlocks and bound waiting without weakening the invariant. The parent
        establishes snapshots, isolation and the one-row versus multi-row problem.
  - title: An abort and a missing commit reply
    brief: >-
      Distinguish a known-aborted attempt from a lost reply that leaves the commit
      outcome unknown. Understand why isolation failures require fresh reads and
      decisions, and why a missing reply does not justify another purchase. The
      child owns request identity, recorded results and the recovery procedure.
    nested_article:
      topic: Recovering logical database requests
      title: Retries and uncertain commit outcomes
      brief: >-
        Distinguish a known abort from a commit whose reply was lost. Reuse one
        logical request identity, reject conflicting payloads, and recover the
        recorded result rather than applying a purchase twice. The parent
        establishes atomic purchase work and whole-transaction isolation retries.
  - title: Choosing isolation for a rule
    brief: >-
      Judge a proposed transaction by stating its invariant, the facts its decision
      reads and every operation that can change them. Use the stock and payment
      cases to choose a guard, stable read view, serializable decision or common
      lock protocol; keep constraints and short atomic boundaries in the design.
      Verify the chosen engine's behaviour and relevant concurrent schedules.
