topic: PostgreSQL query planning
title: Reading and repairing PostgreSQL plans
brief: >-
  Interpret PostgreSQL's measured plans and choose a repair from the work they
  reveal. Distinguish per-loop averages, inclusive counters and elapsed time;
  test statistics, access paths and prepared plans against skew and contrasting
  parameters. Build on the general plan-reading method and PostgreSQL's physical
  architecture; native index-method semantics and operational waits belong to
  their existing articles.
heading:
  - title: EXPLAIN and EXPLAIN ANALYZE
    brief: >-
      Obtain an interpretable execution of the shop report, retaining parameters,
      settings and data state. Understand that ANALYZE executes the statement;
      distinguish this measurement from collecting planner statistics.
    heading:
      - title: What the measurement includes
        brief: >-
          Choose node timing, buffers and machine-readable output for the
          question. Distinguish planning and execution time from ordinary client
          latency, and recognise profiling and output-conversion costs.
  - title: Rows, loops and cardinality estimates
    brief: >-
      Follow one native report plan from inputs to output. Compare estimated and
      actual emitted rows on the same basis, then use loops to expose repeated
      work rather than mistaking an average for a total.
    heading:
      - title: Rows returned and rows rejected
        brief: >-
          Interpret scan filters, join filters and rechecks as different work.
          Account for rounded per-loop counters, early stopping and nodes that
          never ran before diagnosing a cardinality error.
      - title: Repeated inner work
        brief: >-
          Relate the report's inner lookup and aggregate to their outer input.
          Recognise when Materialize or Memoize changes the amount actually
          repeated, rather than multiplying every child by every outer row.
  - title: Buffers and execution time
    brief: >-
      Reconcile repeated accesses with shared, local and temporary block counters.
      Read nested node measurements without adding the same work twice or
      treating buffer accesses as distinct pages or physical drive reads.
    heading:
      - title: Costs and elapsed time
        brief: >-
          Distinguish estimated startup and total costs from measured
          milliseconds. Relate startup to the first emitted row and total time
          to completion, allowing for inclusive child work and partial consumption.
      - title: Reading inclusive counters
        brief: >-
          Understand which displayed values are per-loop averages and which are
          accumulated totals. Distinguish a cached read, a dirtied page, a backend
          write and measured I/O time before choosing a repair.
  - title: Repairing cardinality estimates
    brief: >-
      Find the earliest consequential estimate error and decide whether stale
      statistics, value skew or related predicates explain it. Judge a statistics
      change by its estimates and resulting work, not by ANALYZE completing.
    heading:
      - title: ANALYZE and column statistics
        brief: >-
          Use pg_stats to connect common values, histograms and distinct counts
          to the shop's common and rare customers. Test a targeted statistics
          refresh or higher target without expecting exact counts.
      - title: Extended statistics and their limits
        brief: >-
          Match dependencies, multivariate common values and distinct counts to
          the estimation question. Explain why a date range or join error may
          remain; creating statistics must be followed by collection and evidence.
  - title: Testing an access path
    brief: >-
      Predict which fetches, rejected rows or repeated searches a candidate path
      removes, then check native evidence. A sequential scan can be a sound
      choice; a familiar node name or lower estimated cost is insufficient.
    heading:
      - title: Conditions, searches and heap fetches
        brief: >-
          Read Index Cond, Filter, bitmap rechecks, Index Searches and Heap Fetches
          against rows and buffers. Check ordering and LIMIT in the history
          query; leave method and operator-class comparisons to the index article.
      - title: Comparing another route
        brief: >-
          Use a bounded alternative plan to test a hypothesis, including removing
          repeated SQL work. Distinguish an experiment with planner switches from
          a repair that remains effective under ordinary planning and write costs.
  - title: Sorts, hashes and temporary files
    brief: >-
      Identify disk sorts, hash batches and temporary-block work in a measured
      plan. Reduce unnecessary working data before testing a local memory
      allowance, accounting for several operations, workers and simultaneous queries.
  - title: Parallel plans
    brief: >-
      Follow Gather or Gather Merge through partial and final work. Distinguish
      planned from launched workers, inspect worker imbalance and duplicated
      inner work, and avoid treating accumulated process time as statement latency.
  - title: Prepared statements and parameter skew
    brief: >-
      Explain why the same parameterised request can need different routes for
      common and rare values. Distinguish a custom plan from a generic plan and
      the planning work saved from execution work added.
    heading:
      - title: Inspecting the plan actually used
        brief: >-
          Use EXPLAIN EXECUTE and session plan counts to observe the choice.
          Understand the automatic cost comparison without assuming that the
          sixth execution must switch to a generic plan.
      - title: Testing a prepared-plan repair
        brief: >-
          Compare custom, generic and automatic planning across representative
          parameters and execution order. Choose a targeted response from total
          planning and execution costs rather than disabling preparation indiscriminately.
  - title: Checking the repair against the workload
    brief: >-
      Accept a repair only when its predicted work disappears, results remain
      correct and ordinary executions support it across the relevant request
      mix. Preserve evidence and identify delays that require operational diagnosis.
