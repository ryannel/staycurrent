topic: Replicated database reads
title: Replicas, lag and read routing
brief: >-
  Trace committed history through receipt, durable storage and replay, then choose
  read routing from the freshness and failure promise a request needs. Reuse the
  separate P7 catalogue-price change from 20.00 to 22.00 without changing order
  103. Own single-copy read routing; the child owns transfer of write authority.
heading:
  - title: Copying the primary's history
    brief: >-
      Understand how a primary and read replicas hold copies of the same database
      history, and why this can move read work without dividing the data or
      removing the work of applying writes. A live copy also copies committed mistakes.
  - title: Received, durable and replayed
    brief: >-
      Follow the price change to a replica and distinguish having its records,
      retaining them through the promised failure, and applying its commit so a
      new snapshot can see the change. Make the durable-but-not-yet-readable state visible.
  - title: What a commit waits for
    brief: >-
      Judge asynchronous replication and synchronous acknowledgement by which
      copies and progress points the reply covers. Understand why waiting for
      remote durability differs from waiting for replay, and how unavailable
      required acknowledgements can hold up writes.
  - title: Reading your own writes
    brief: >-
      Choose a primary read or a replica proven to include the required committed
      history. Understand why the check must qualify the actual read target before
      its new snapshot, and why a fixed delay is insufficient.
    heading:
      - title: Waiting for a replica
        brief: >-
          Follow an illustrative history-qualified token through a bounded wait,
          successful read and timeout. Choose primary fallback or an explicit
          inability to meet the promise; an older answer requires an agreed weaker contract.
  - title: Stale reads and changing replicas
    brief: >-
      Decide which reads may use an older view and distinguish read-your-writes
      from monotonic reads. Follow a read of 22.00 on replica A followed by 20.00
      on B; retained session history can restrict eligible targets.
    heading:
      - title: Fresh enough for the request
        brief: >-
          Distinguish including a required change from being current or meeting a
          time-based staleness bound. An older snapshot can be useful for browsing
          or reporting; decisions that change data still need their rules enforced
          at the write authority, even after a fresh read.
  - title: Lag and retained history
    brief: >-
      Locate a growing gap in sending, receiving or applying history rather than
      treating lag as one number. Understand catch-up capacity, competition with
      read work and the difference between backlog, recent delay and a catch-up estimate.
    heading:
      - title: Keeping enough log to catch up
        brief: >-
          Understand why a disconnected copy needs retained history, why retention
          can exhaust storage, and why removing that history can require an archive
          or a fresh copy. Native measurements and controls belong in PostgreSQL
          physical replicas and promotion.
  - title: When the primary is unavailable
    brief: >-
      Identify what committed history a surviving copy can recover and what reads
      it can safely promise. A reachable or up-to-date replica does not by itself
      gain permission to write; topology changes also require revalidating history tokens.
    nested_article:
      topic: Relational write authority
      title: Failover and fencing
      brief: >-
        Distinguish suspected failure from authority to write. Fence a former
        writer, choose a promotion point with an explicit loss boundary, reconcile
        divergence and rejoin safely. The parent establishes copy progress and
        read promises; this child owns the authority-transfer procedure.
