topic: PostgreSQL version maintenance
title: PostgreSQL vacuum and transaction age
brief: >-
  Diagnose retained versions, visibility and transaction-age risk before changing
  PostgreSQL maintenance. Distinguish reusable space from costly bloat and file
  shrinkage, then choose and verify a targeted intervention. Build on Inside
  PostgreSQL's visibility and HOT explanation; wider incidents, replication
  retention policy and detailed index or table rewrite procedures remain with
  their existing owners.
heading:
  - title: Why the old price must stay
    brief: >-
      Follow the independent P7 price change from 20.00 to 22.00 while a report
      retains its earlier Repeatable Read snapshot. Understand why commit and a
      completed vacuum do not make the old tuple removable, and what changes
      when the last relevant retention requirement ends.
  - title: What vacuum changes
    brief: >-
      Follow eligible cleanup through heap tuples, obsolete index entries and
      reusable page space. Connect the free space map to reuse and the visibility
      map to safe heap avoidance. Preserve the distinction between pruning,
      vacuum and ANALYZE; none is a promise to compact every page or shrink a file.
  - title: Find what holds cleanup back
    brief: >-
      Use table statistics, vacuum reports and retention evidence to distinguish
      cleanup that has not happened from cleanup that cannot yet happen. Read
      backend_xid and backend_xmin with session state, prepared transactions,
      slot xmin/catalog_xmin and standby feedback; elapsed time alone does not
      identify the retaining horizon. Recognise which retention owner must resolve
      the cause before more vacuum work can help.
  - title: Reusable space, bloat and file size
    brief: >-
      Distinguish retained tuple bytes, reusable free space, excess pages and
      space returned to the operating system. Judge whether expected reuse is
      sufficient or persistent scan, cache and storage costs justify compaction.
      Understand ordinary vacuum's limited tail truncation and VACUUM FULL's
      rewrite, lock and spare-space cost. Diagnose index bloat separately;
      detailed rebuild and rewrite rollouts belong to PostgreSQL schema changes
      under load.
  - title: Transaction ID age and freezing
    brief: >-
      Understand why an unchanged live tuple can require maintenance even when
      there are no dead versions. Relate finite XID ordering, freezing and
      all-frozen pages to age(relfrozenxid) and age(datfrozenxid), including TOAST
      and system catalogues. Judge age in transaction consumption rather than
      elapsed days, leaving margin for completion instead of aiming at the limit.
    heading:
      - title: MultiXact age
        brief: >-
          Recognise the separate age obligation created by multiple row lockers.
          Interpret mxid_age(relminmxid) and database-level MultiXact age without
          treating a healthy XID age or the XID retention remedies as sufficient.
      - title: When transaction age becomes urgent
        brief: >-
          Distinguish routine freezing, forced anti-wraparound work and protective
          write restrictions. Resolve the relevant old transaction or retention
          cause and let targeted ordinary vacuum advance age; do not substitute
          file compaction or indiscriminate emergency FREEZE work for the needed
          repair. Verify progress at the table and database levels.
  - title: Keeping autovacuum ahead of the workload
    brief: >-
      Distinguish eligibility from available worker time and cleanup capacity.
      Use effective table settings and workload change rates to judge triggers,
      insert-driven vacuum and age-driven work. Choose table-specific trigger or
      resource changes from evidence; reducing a threshold cannot remove a
      retained horizon, and adding workers can add resource competition.
    heading:
      - title: Read the work that is happening
        brief: >-
          Combine fresh cumulative statistics, autovacuum logs, waits and
          pg_stat_progress_vacuum phases. A recent run or a finished heap scan
          does not establish successful reclamation or completed maintenance.
          Recognise manual vacuum/analyse needs for temporary tables and manual
          parent statistics for partitioned tables; their partitions are vacuumed
          as ordinary stored tables.
  - title: Choosing and checking a maintenance action
    brief: >-
      Work from the symptom to its cause and a measurable acceptance condition:
      release retention, let ordinary vacuum catch up, repair age, refresh
      statistics or arrange justified compaction. Check that the relevant horizon,
      reclaimability, workload cost or age actually improved, and that the cause
      will not immediately recur. Keep slot policy with replication and wider
      request diagnosis with PostgreSQL operations.
