topic: Distributed SQL placement
title: Regional placement and survival
brief: >-
  Place data and voting replicas against stated latency and survival requirements.
  Derive majority survival from failure domains and find remote coordination within
  replica groups, between transaction participants and through global constraints.
  Apply the parent's authoritative-history and quorum model to a separate regional
  layout of the shop. Safe transitions belong to Rebalancing and cluster change;
  native settings belong to CockroachDB table locality and region survival.
heading:
  - title: Regions and failure domains
    brief: >-
      Understand a failure domain as resources one incident can remove together.
      Distinguish machine, zone and region, request origin, data owner and voting
      replica. State the failures a request must tolerate; three machines in one
      region do not supply three independent regional survivors.
  - title: Counting the surviving voters
    brief: >-
      Remove each domain from a fixed voting group and test whether communicating
      survivors still reach its configured majority. Compare three voters placed
      within one region, two-plus-one across two regions, and one per region;
      generalise to five placed two-plus-two-plus-one. Separate retained history
      from write availability and voting from non-voting copies.
  - title: What a regional write waits for
    brief: >-
      Trace one product-shard command through the durable acknowledgements that
      complete its leader's majority. Compare the healthy path with losing the
      nearest remote voter. Derive the required network wait, distinguishing it
      from client routing, storage, election and other work; assumed round trips
      are neither measured commit latency nor recovery deadlines.
  - title: A local order can need remote stock
    brief: >-
      Trace purchase 103 from its application and customer-shard A leader in North
      to product-shard P's leader in West. Distinguish coordination between owners
      from agreement among each owner's copies, and recognise both as latency and
      availability dependencies. Transactions across partitions owns the full
      atomic decision and recovery protocol.
  - title: Global constraints have a location
    brief: >-
      Count uniqueness, reference and index work before calling a transaction local.
      Use globally meaningful order_id and a hypothetical uniqueness owner in East
      to expose an additional dependency. Regional composite keys change the rule;
      copied product details do not allocate independent stock. Enforcement
      mechanisms remain engine-dependent.
  - title: Reading near the application
    brief: >-
      Judge a nearby read against its history contract. Current reads may need
      remote authority or freshness evidence; permitted historical reads can follow
      different paths. Apply the replica neighbour's durable/applied distinction:
      a nearby copy supplies neither quorum nor permission to purchase against
      old stock. Detailed routing and common-snapshot machinery stay with their owners.
  - title: Choosing and checking a placement
    brief: >-
      Check representative requests in normal operation, zone loss, each region's
      loss and communication failure. Include every required owner's majority,
      application routing and capacity after loss. Separate structural survival
      from measured latency and recovery time; follow the cluster-change and
      CockroachDB locality articles for safe transitions and native verification.
