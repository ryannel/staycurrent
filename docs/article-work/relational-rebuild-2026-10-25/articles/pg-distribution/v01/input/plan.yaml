topic: Distributed PostgreSQL choices
title: Distributing PostgreSQL work
brief: >-
  Choose native partitions, application shards, Citus or foreign tables from the
  work they place and the rules they can preserve. Trace local requests, skew
  and fan-out through the shop, then preserve one write authority while moving
  a customer group between PostgreSQL owners. General distribution protocols,
  table-partition lifecycle and whole-system upgrades remain with their owners.
heading:
  - title: Native table partitioning
    brief: >-
      Recognise when pruning or lifecycle boundaries within one PostgreSQL
      instance solve the problem, and when independent work needs another
      server. Distinguish local partitions, read replicas and shards; retain
      the foreign-partition exception without implying automatic distributed
      transactions or rebalancing. Detailed pruning and retirement belong to
      Table partitioning and data lifecycle.
  - title: Application-managed shards
    brief: >-
      Trace how a customer routing key selects a PostgreSQL database and how
      related order work stays together. Understand the routing, connection,
      schema, recovery and movement responsibilities the application takes on.
      Use the existing customer-group and shared-product placement.
    heading:
      - title: Finding the right owner
        brief: >-
          Follow Mina's customer-key history request to one owner, then an
          order-ID-only request that needs a maintained directory or searches
          several owners. Distinguish selecting a database from finding rows
          through its local indexes.
      - title: Keeping rules within reach
        brief: >-
          Identify the complete purchase participants, including shared P7
          stock, global order identity and references. Independent local
          commits cannot preserve the original purchase contract. PostgreSQL
          prepared transactions require a recoverable transaction manager;
          the distributed-commit prerequisite owns the protocol analysis.
  - title: Co-location in Citus
    brief: >-
      Understand how a Citus SQL entry point uses distribution metadata to
      route work to PostgreSQL workers. Derive a local customer join from
      compatible distribution keys and co-location, rather than assuming
      related table names or equal-looking keys suffice. Contrast this with
      application routing without promising unrestricted distributed SQL.
    heading:
      - title: Distribution keys and constraints
        brief: >-
          Judge Citus's distribution-column requirements for unique keys and
          supported foreign keys against the shop's original global IDs.
          Adding customer_id to an order key does not enforce order_id alone.
          Treat the illustrative customer-distributed copy as a candidate
          layout, not an accepted migration of the shop's integrity contract.
      - title: Shared reference tables
        brief: >-
          Understand why a small shared catalogue projection can avoid remote
          read joins and why maintaining Citus reference tables adds write
          coordination. Distinguish these managed copies from independent
          stock allowances; retaining shared stock can keep purchases
          distributed even when order history is local.
  - title: Foreign tables and remote work
    brief: >-
      Use postgres_fdw to reason about querying separately owned PostgreSQL
      tables through local SQL. Follow what filtering and joining happen
      remotely and what rows cross the connection; EXPLAIN VERBOSE exposes
      the remote SQL. Foreign-table access supplies neither an ownership
      directory nor an automatic shard-movement service.
    heading:
      - title: The transaction boundary
        brief: >-
          Recognise per-remote-server transaction and snapshot behaviour
          without inferring a common snapshot across servers. PostgreSQL 18
          postgres_fdw cannot prepare remote transactions for two-phase
          commit, so a local BEGIN is insufficient evidence for an atomic
          purchase across independent owners.
  - title: Skew and queries across workers
    brief: >-
      Derive fan-out and combining work for the paid-order line-value report,
      and distinguish local joins, transferred rows and final aggregation.
      Reuse customer 1001's 84,000 of 120,000 generated orders to show why
      hashing a frequent key does not divide it. Moving a hot group can move
      its load; it does not split that group or arbitrate P7 independently.
      Separate row counts, observed traffic and measured elapsed time.
  - title: Moving a shard safely
    brief: >-
      Follow a deliberately paused application-managed customer-group move
      from source PostgreSQL S to destination D. Move its related records and
      request outcomes together, preserve outside references and routing, and
      distinguish a verified copy from authority to accept writes. General
      replica membership and capacity analysis stay with Rebalancing and
      cluster change; whole-system migrations stay with the upgrade article.
    heading:
      - title: Close the source before handing over
        brief: >-
          Understand a recoverable handover: gate affected work, drain admitted
          transactions, copy and validate the closed source state, persist the
          routing decision, then admit destination writes. Keep the source
          closed so stale clients must refresh or fail. A crash at any stage
          must recover the recorded owner rather than enable both.
      - title: Catch-up, return and managed movement
        brief: >-
          Recognise what an online variant additionally needs: an aligned
          snapshot and change stream, retained history, compatible apply and
          a final protected boundary. Citus manages co-located shard moves
          through its supported movement machinery; inspect completion and
          placement evidence. After destination writes, returning requires
          their reconciliation or reverse transfer, not changing the route
          back to the old copy.
  - title: Choosing and checking the design
    brief: >-
      Make a justified choice from the bottleneck, routing information,
      invariant scope and movement burden. Compare equivalent history,
      report and purchase behaviour, including missing keys, hot keys,
      unavailable workers and stale routes during a move. Include schema,
      backup and recovery responsibilities for every database and metadata
      authority; more workers alone do not establish acceptable operation.
