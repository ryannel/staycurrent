topic: Relational hierarchy modelling
title: Modelling hierarchies
brief: >-
  Choose a representation for the shop's category tree or shared ancestry from the
  reads and changes it must support. Read and write adjacency lists and edge
  tables, traverse them with recursive SQL, and compare materialised paths,
  closure tables and nested sets through the same subtree move. Maintain their
  invariants, recognise concurrent cycle risks and verify derived structures.
  The modelling parent introduces recursive references and one versus several
  parents; this article owns the representation comparison and working hierarchy
  procedures. General constraint mechanisms and transaction theory stay with
  Constraints and data integrity and Transactions and isolation.
heading:
  - title: Categories, parents and descendants
    brief: >-
      Distinguish a category from its position in the hierarchy, direct parentage
      from ancestry, and a tree from a forest or a directed acyclic graph. Start
      from Teaware → Mugs → Blue mugs and the separate multiple-parent Gifts
      alternative. Establish the concrete questions: children, breadcrumbs,
      descendants and moving Mugs with Blue mugs still beneath it.
  - title: Adjacency lists
    brief: >-
      Read one category row with a nullable parent reference as one immediate
      relationship. Understand what a primary key, self-referencing foreign key
      and self-parent check establish, and why they do not establish one connected
      acyclic tree. See the corresponding category rows beside their relationships.
    heading:
      - title: Roots, children and sibling order
        brief: >-
          Find direct children and roots, preserve stable category IDs when names
          change, and store sibling order separately when the shop requires it.
          Recognise a parent-column index as support for child lookups rather than
          an integrity rule. A synthetic catalogue root is a modelling choice.
  - title: Recursive queries
    brief: >-
      Follow all descendants with a complete recursive CTE: a starting row, the
      next generation found by joining its parent ID and termination when no next
      rows remain. Make the successive working rows and final result visible;
      state whether the starting category is included. Reverse the relationship
      to obtain an ancestor chain for breadcrumbs.
    heading:
      - title: Ordering and cycle detection
        brief: >-
          Produce a deliberate display order with depth or a path and an outer
          ORDER BY. Distinguish that result order from physical evaluation order.
          Track visited IDs, or use PostgreSQL CYCLE, so malformed links cannot
          recurse indefinitely. Understand why UNION only removes duplicate whole
          rows and cannot cure every cycle when depth or path keeps changing.
  - title: Moving a subtree safely
    brief: >-
      Move Mugs from Teaware to Gifts by changing its one parent reference while
      leaving Blue mugs attached. Reject a new parent inside the moving subtree,
      including the subtree root itself, and apply the chosen root and deletion
      policy. Show the accepted move and a rejected descendant-parent link.
    heading:
      - title: Concurrent changes can create a cycle
        brief: >-
          Understand how two individually valid checks on different rows can
          jointly store a cycle. Provide one complete conservative PostgreSQL
          transaction procedure that blocks topology writers before reading,
          validates the prospective move, changes it and commits. Explain its
          contention cost; refer to Transactions and isolation for general locking,
          serializable execution and retry methods.
      - title: Deleting a category
        brief: >-
          Choose explicitly between rejecting a deletion with children, deleting
          a subtree or promoting its children. Distinguish a hierarchy maintenance
          procedure from the business decision it implements; keep lifecycle and
          retention policy in History, correction and deletion.
  - title: Edge tables and multiple parents
    brief: >-
      Separate category rows from parent–child edge rows when Mugs belongs under
      both Teaware and Gifts. Enforce valid endpoints and unique edges, and
      recognise that omitting uniqueness on child ID permits several parents.
      Apply the same reachability check and transaction boundary to a new edge.
    heading:
      - title: One category, several paths
        brief: >-
          Distinguish one reachable category from each path to it. A traversal
          from Catalogue reaches Mugs and Blue mugs through both branches; choose
          distinct reachable IDs or path rows to match the question. Do not invent
          one breadcrumb, one depth or one subtree owner for a shared category.
      - title: Removing an edge is not deleting a category
        brief: >-
          Remove the Gifts → Mugs association without removing Mugs or its other
          ancestry. Give a practical edge deletion and reachability recheck;
          retain nodes reachable through another route. General arbitrary graph
          algorithms and weighted bill-of-materials calculations are outside this
          category article.
  - title: Materialised paths
    brief: >-
      Read a stored root-to-node sequence of stable IDs as a materialised path.
      Derive ancestors and select descendants by whole path segments, avoiding
      name changes and ambiguous text prefixes. Explain PostgreSQL ltree as a
      concrete indexed path option whose operators include equality with self.
    heading:
      - title: A move rewrites descendant paths
        brief: >-
          Replace the old Mugs path prefix for Mugs and Blue mugs in one protected
          transaction, preserving each remaining suffix. Provide the usable
          procedure and parent/path consistency checks. Recognise that one path
          per category represents one parentage route; storing every route for
          shared ancestry can multiply paths and maintenance work.
  - title: Closure tables
    brief: >-
      Store ancestor–descendant reachability pairs, including each node's
      zero-distance self pair. Read ancestors and descendants with ordinary joins,
      and interpret depth only under the stated tree convention. Make the pairs
      introduced by one category insertion visible. Understand the additional
      storage, reaching quadratic pair counts in a long chain.
    heading:
      - title: Maintaining a tree's closure
        brief: >-
          Give insertion and subtree-move procedures within the protected
          transaction: retain internal subtree pairs, remove obsolete outside
          ancestry and add new-ancestor × subtree-descendant pairs with corrected
          depths. Keep direct parentage authoritative and check the stored closure
          against reachability rebuilt from it before accepting the change.
      - title: Shared ancestry changes deletion
        brief: >-
          Recognise that removing one edge can leave a pair reachable by another
          route and can leave several valid path lengths. For this shop's DAG,
          use a distinct-pair reachability closure rebuilt from authoritative
          edges after protected topology changes; do not apply the tree deletion
          recipe or a single unqualified depth column. Judge when that rebuild is
          too costly for the workload.
  - title: Nested sets
    brief: >-
      Understand a tree encoded by entry and exit numbers: ancestor intervals
      contain descendant intervals. Read a whole subtree with a range condition,
      and distinguish a valid nested interval structure from rows that merely
      satisfy left < right. Show the same category tree as intervals and as rows.
    heading:
      - title: Insertions and moves renumber the tree
        brief: >-
          Work through the rows affected by creating a gap or moving a numbered
          subtree. Supply a complete practical maintenance route for the small,
          infrequently changed catalogue: keep direct edges authoritative,
          regenerate a deterministic traversal's bounds and replace the derived
          numbering atomically under the topology lock. Verify unique endpoints,
          proper nesting and agreement with the source tree. Explain why ordinary
          single-interval nested sets do not represent shared nodes in a DAG.
  - title: Choosing and checking a representation
    brief: >-
      Choose from actual child, breadcrumb and subtree queries, depth and width,
      move frequency, shared ancestry and acceptable write blocking. Compare
      adjacency/edges, paths, closure and nested sets using the worked move's rows
      rather than universal speed rankings. Distinguish stored direct facts from
      derived acceleration structures, define their one update boundary and use
      recomputation to detect missing or stale derived rows. Preserve the simplest
      representation that meets measured needs; index design and execution-plan
      diagnosis belong to their existing articles.
