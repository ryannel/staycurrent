topic: Relational query results
title: Joins and the meaning of a result row
brief: >-
  Construct PostgreSQL 18 queries whose rows answer the application's question.
  Predict matches, missing matches and row multiplication; choose joins or
  existence tests deliberately; complete the shop's still-due report by joining
  separate per-order summaries. The reader knows tables, primary and foreign
  keys and simple SELECT/WHERE, but need not have read modelling. Teach the
  GROUP BY/SUM and missing-payment handling required for this report here;
  broader aggregation, windows and ordering belong in the neighbour.
heading:
  - title: What should one result row mean?
    brief: >-
      Choose one row per order before selecting its columns. Keep the order's
      identity visible while constructing the query; selecting a customer's
      name does not turn order rows into customer rows.
  - title: INNER JOIN produces one row for every match
    brief: >-
      Join orders to customers, then order lines. Predict why the first preserves
      one row per order and the second produces one per line. Understand aliases,
      explicit matching conditions and how a complete unique key bounds matches.
  - title: LEFT JOIN keeps rows without a match
    brief: >-
      Keep order 103 when attaching payments. Distinguish a missing match from
      a stored value, and see why a condition on payment method in ON answers a
      different question from the same condition in WHERE.
  - title: EXISTS asks whether there is a match
    brief: >-
      Find customers with orders once each and customers without orders using
      EXISTS and NOT EXISTS. Use a related subquery when only presence matters;
      distinguish no payment from an unpaid balance.
  - title: Why two joins multiply amounts
    brief: >-
      Follow order 101's two lines and two payments into four combinations.
      Explain why summing either amount afterwards counts it twice, even though
      every join condition is correct. Judge DISTINCT by what it removes rather
      than using it to conceal a change of row meaning.
  - title: Summarise each side before joining
    brief: >-
      Turn lines and payments independently into at most one summary per order,
      then join those results. Understand enough GROUP BY, SUM and named
      subqueries to explain why neither total can now multiply.
    heading:
      - title: One total for each order
        brief: >-
          Derive line value from quantity and the recorded unit price, then sum
          by order_id. Give the payment summary the same row meaning. A named
          WITH query makes each intermediate result available to the final query.
      - title: The still-due report
        brief: >-
          Return each order with its recorded line value, payments and balance.
          Keep unpaid orders, apply an explicit zero policy for absent summaries
          and filter positive balances at the appropriate query level. Confirm
          101 and 102 have zero due and 103 has 29.00 due.
    nested_article:
      topic: Relational aggregation, windows and ordered results
      title: Aggregates, windows and ordered results
      brief: >-
        Choose grouped or per-row calculations and deliberate result ordering.
        Query results teaches the narrow per-order summaries needed to avoid
        multiplied amounts; this article owns broader grouping, HAVING/FILTER,
        count and empty-input distinctions, windows, rankings and ordering.
  - title: Combining result rows with UNION
    brief: >-
      Distinguish attaching matching columns from combining compatible result
      rows. Use the paid-order and pending-order customer lists to explain
      UNION ALL, deliberate duplicate removal with UNION, and when INTERSECT
      or EXCEPT answers a shared-membership or difference question.
  - title: Check the result against the question
    brief: >-
      Trace a result row back to its contributing facts and challenge accidental
      assumptions with missing and multiple matches. A later partial payment
      on 103 changes its balance but does not make it settled. Explain why
      presentation order needs ORDER BY and query meaning does not specify
      the engine's execution plan.
