topic: Relational databases
title: Relational databases
brief: >-
  Understand how shared tables let a shop ask new questions while preserving
  meaningful facts through changes, concurrent requests and failures. Start with
  no database vocabulary; follow one purchase far enough to distinguish row
  meaning, query results, constraints, transactions, physical work and durability.
  Recognise when a relational system suits the application and choose a useful
  next article. Detailed design, SQL construction and operating procedures belong
  in the contextual children.
heading:
  - title: Tables and rows
    brief: >-
      Read customers, products, orders and order lines as related collections of
      facts. Identify a row, column, table and schema from a few visible records;
      follow customer_id from Mina's order to her customer row. Explain why a
      stable key identifies a fact without relying on row position or a name.
      Introduce relation without requiring mathematical vocabulary.
    nested_article:
      topic: Relational data modelling
      title: Relational data modelling
      brief: >-
        Design rows, keys and relationships that express the shop's facts and
        survive required changes. Diagnose dependencies and redundancy, preserve
        historical facts, and judge practical normalisation and modelling
        variations; formal decomposition and hierarchy procedures have their own
        children. The introduction establishes how to read related tables.
    heading:
      - title: Values and missing data
        brief: >-
          Show that quantity, amount, product identity and a recorded moment have
          different meanings even when displayed as text. Establish that a
          missing value needs an explicit meaning and that zero is a value;
          leave conversion, equality, NULL predicates and type selection to the
          child. Do not imply that a missing payment row is a stored NULL amount.
        nested_article:
          topic: SQL values and equality
          title: Values, missing data and equality
          brief: >-
            Choose representations for money, time, text and identity, then
            reason correctly about conversion, equality, ordering and NULL.
            Own three-valued predicates and value-level edge cases; modelling
            owns row meaning and query results owns missing matches.
      - title: Constraints
        brief: >-
          Contrast an ordinary change with a rejected duplicate order identity,
          unknown customer reference or negative stock. Define constraints as
          database-enforced rules over accepted states; explain why the shop
          still has rules whose enforcement needs several steps.
        nested_article:
          topic: Relational integrity constraints
          title: Constraints and data integrity
          brief: >-
            Turn identity, row and relationship rules into enforceable schema
            boundaries, including composite tenant references. Distinguish
            declarative enforcement, triggers and rules needing a transaction
            protocol; authorisation belongs in access control.
  - title: Asking questions of the same facts
    brief: >-
      Read a small SELECT that chooses Mina's orders and then one that pairs
      each order line with its product. Follow the actual matching rows, explain
      that the result has its own columns and row meaning, and distinguish a
      question from a prescribed physical search. Use order 103's two lines to
      show why an order can appear twice without there being two orders. Leave
      result construction, joins, absence and the still-due report to the child.
    nested_article:
      topic: SQL query results
      title: Joins and the meaning of a result row
      brief: >-
        Construct SELECT and JOIN results whose rows mean what the question
        requires. Predict multiplicity and missing matches, use existence tests
        and complete the still-due report by summarising lines and payments
        separately per order. Own that narrow GROUP BY and SUM example; general
        aggregation, windows, pagination and execution plans belong to neighbours.
        Also own the compact distinction between joining columns and combining
        compatible rows, including UNION ALL, UNION, INTERSECT and EXCEPT.
  - title: Making a purchase
    brief: >-
      Follow order 103 from the explicitly labelled state before its purchase to
      its committed order, two lines and reduced stock. Define INSERT, UPDATE,
      DELETE and transaction through the change. Show a failure after one step
      and the rollback that prevents a partial purchase; payment is separate and
      order 103 remains pending. A readable diagram can carry the procedure;
      full executable purchase code belongs in the children.
    heading:
      - title: Conditions on a change
        brief: >-
          Read stock = stock - 1 with product_id = 'P7' AND stock >= 1 as one
          guarded operation. Explain that zero changed rows is a failed
          precondition that the caller must handle, not a successful sale.
          Connect this to all-or-nothing order creation without teaching imports
          or the complete application error protocol.
        nested_article:
          topic: SQL data changes
          title: Updates, upserts and bulk imports
          brief: >-
            Express write preconditions and interpret affected rows, choose
            conflict semantics for upserts, and stage, validate and reconcile a
            replayable import. Transactions owns concurrent invariant protocols;
            application SQL owns connection and error handling.
      - title: Two buyers and one mug
        brief: >-
          Give Mina and Tariq separate requests that both read the last mug.
          Make visible why two individually atomic purchases can still make an
          unsound decision, then show the guarded change admitting only Mina's
          purchase. State the illustrative execution's PostgreSQL Read Committed
          assumptions; other systems may instead require a retry. Explain that
          BEGIN alone does not choose a sound concurrency protocol.
        nested_article:
          topic: Relational transactions and isolation
          title: Transactions and isolation
          brief: >-
            Choose a transaction boundary and concurrency protocol from the
            invariant that must hold. Distinguish atomic effects, snapshots and
            serial outcomes; develop one-row stock and multi-row capacity limits.
            Detailed lock diagnosis and recovery from uncertain commits belong
            in children.
  - title: SQL in an application
    brief: >-
      Place the application, database connection and server around the purchase.
      Explain the application's responsibility for one transaction's connection,
      values, result and failure; introduce parameters through Mina's ID. Show
      why an ORM still causes database work and why sending an external payment
      or email is not rolled back with database rows.
    nested_article:
      topic: Application database boundary
      title: SQL at the application boundary
      brief: >-
        Preserve SQL meaning and transaction ownership across drivers, pools and
        ORMs. Separate parameters from SQL structure; handle result mapping,
        errors, cancellation and repeated queries coherently. Concurrency,
        idempotent recovery, outboxes and capacity have neighbouring owners.
  - title: The work behind a query
    brief: >-
      Contrast finding Mina's orders by reading all rows with using a maintained
      index. Introduce the query plan as the database's choice of work; make the
      extra index maintenance on writes visible. Explain why result size and
      work done differ, without importing the reference's 36-order or 60,000-order
      figures into the core shop as if they were its starting rows.
    nested_article:
      topic: Relational query execution
      title: Query execution and performance
      brief: >-
        Follow rows through scans, joins, grouping and sorting, and use a plan to
        locate inaccurate estimates, repeated work, spills and unnecessary data
        movement. Own the general method for measuring and repairing work;
        index design, table partitioning and engine-specific counters have
        distinct deeper owners.
  - title: Keeping a confirmed change
    brief: >-
      Distinguish a transaction's committed result from the application's receipt
      of its reply. Introduce durable storage and a recovery log through one
      before-crash and after-restart purchase state. Separate crash recovery,
      another live copy and a recoverable earlier copy; a replica also copies a
      mistaken deletion. Explain what a missing reply leaves unknown without
      developing retry, log or restore procedures.
    nested_article:
      topic: Relational storage and durability
      title: Storage and durability
      brief: >-
        Connect a logical change to pages, buffers, row versions and cleanup,
        then explain write-ahead ordering, commit durability and crash recovery.
        Distinguish space reuse from file shrinkage, and restart recovery from
        recovering lost storage or an unwanted committed change. Native settings
        and drills belong in the implementation articles.
  - title: Operating a changing database
    brief: >-
      Follow one slow purchase to distinguish waiting for a connection, waiting
      behind another transaction and doing too much query work. Establish that
      live schemas, privileges, capacity and recovery need deliberate operating
      decisions. Give useful direct routes from these concrete symptoms, without
      turning the introduction into a checklist of specialist terminology.
    nested_article:
      topic: Relational database operations
      title: Diagnosing a database incident
      brief: >-
        Trace a slow or failing request through admission, lock waits, execution
        and storage pressure using evidence, then choose a bounded intervention
        with a recovery path. Capacity, safe schema changes, access control and
        engine-native diagnosis have their own deeper treatments.
  - title: More than one machine
    brief: >-
      Distinguish copying the same facts to another machine from distributing
      different facts across machines. Follow an order that touches more than
      one placement boundary to reveal added coordination and failure cases.
      Establish that relational tables and SQL do not require one server, while
      extra servers do not by themselves remove a hot row or global invariant.
    nested_article:
      topic: Sharding and distributed relational databases
      title: Sharding and distributed SQL
      brief: >-
        Choose a distribution boundary from local work, invariant scope and the
        actual bottleneck. Distinguish native partitions, replicas and shards;
        derive skew, fan-out and coordination from the key. Distributed commit,
        snapshots, placement and cluster change have contextual children.
  - title: PostgreSQL and CockroachDB
    brief: >-
      Identify PostgreSQL and CockroachDB as two implementations to which these
      concepts apply, with different storage and deployment designs. Help the
      reader choose an implementation route from the system they need to use;
      SQL resemblance does not establish identical transactions, types or
      operating procedures. Keep product comparisons tied to the explained
      application needs rather than a feature ranking.
    heading:
      - title: Inside PostgreSQL
        brief: >-
          Locate one PostgreSQL connection and request within a server managing
          tables and indexes; point to the native investigation when the reader
          needs process, page and maintenance details.
        nested_article:
          topic: PostgreSQL architecture and practice
          title: Inside PostgreSQL
          brief: >-
            Trace one request through PostgreSQL processes, shared buffers,
            heap tuples and indexes. Explain visibility and HOT updates well
            enough to connect SQL behaviour to physical work; native maintenance,
            planning, recovery and specialist capabilities have deeper owners.
      - title: Inside CockroachDB
        brief: >-
          Locate one CockroachDB SQL request within a cluster that routes data
          access and keeps replicas; point to the native investigation when
          distribution or retries affect the application.
        nested_article:
          topic: CockroachDB architecture and practice
          title: Inside CockroachDB
          brief: >-
            Trace SQL rows and indexes through CockroachDB ordered keys, ranges,
            local storage and replicated ownership. Explain splits, leases and
            agreement, including why a hot key remains hot; native transactions,
            query work, placement and operations have deeper owners.
  - title: Choosing a next question
    brief: >-
      Judge relational fit from related facts, changing questions and invariants
      shared by writers, alongside the costs of schema evolution, coordination
      and operation. Offer short routes for designing a schema, obtaining a
      correct result, making a safe purchase, fixing a slow request and restoring
      service. Let an experienced reader enter at the task they have; the tree
      is not a requirement to read every parent first. Other database families
      remain outside this commission.
  - title: Sources and further reading
    brief: >-
      Cite primary relational, SQL and implementation documentation supporting
      the concepts actually used, and link contextual routes at the point they
      become useful. Keep the sources at the bottom, closed initially.
