topic: Relational authority and tenant access
title: Database access and least privilege
brief: >-
  Derive runtime, migration and support privileges from the tasks each must perform.
  Understand whose identity the database trusts and test both permitted work and
  forbidden tenant access under that identity. Separate authorisation from tenant
  data integrity. This article owns the transferable design and verification;
  PostgreSQL roles, policies and privileged code and CockroachDB secure operation
  own their native implementation procedures.
heading:
  - title: Who the database sees
    brief: >-
      Distinguish the signed-in person, the application service's database login and
      the tenant selected for a request. Follow one tenant-10 customer lookup from
      the request to the connection: a shared service login does not independently
      identify the person or establish their right to select a tenant. Make visible
      who verifies that right before SQL runs.
  - title: Privileges follow the work
    brief: >-
      Turn checkout, a schema migration and a support lookup into separate authority
      requirements: actions, objects, columns and tenant scope. Understand why
      SELECT, INSERT, UPDATE and DELETE are different grants, why support read access
      still exposes data, and why the runtime needs neither schema ownership nor
      the ability to grant itself broader access. Derive one sufficient set rather
      than copying an administrator's connection.
    heading:
      - title: Ownership and indirect privileges
        brief: >-
          Recognise that effective authority also comes through ownership, group
          membership, privileges available to everyone and callable routines or
          views. Revoking one direct grant need not remove access. Keep the runtime
          unable to assume the migration identity; native privilege inheritance,
          ownership and privileged-routine rules belong in the implementation articles.
  - title: Table access is not tenant access
    brief: >-
      Use tenant 10's customers and tenant 20's customer 4, Rowan Vale, to show what
      a forgotten tenant condition exposes when a service can read the whole
      customers table. Parameters preserve SQL structure but do not authorise the
      selected tenant. Compare an application check with a database-enforced row
      boundary or restricted interface, explaining which mistakes each can stop.
  - title: What a row boundary trusts
    brief: >-
      Understand that a database policy can use only an identity or context it has
      been given. Trace trusted tenant context through a reused connection, including
      a missing context and a tenant switch. If the same service can freely change
      that context, the policy can guard an omitted condition but still trusts the
      service to select the right tenant. Check both access to existing rows and
      the tenant of inserted or changed rows; native policy syntax and bypass cases
      belong in PostgreSQL roles, policies and privileged code.
  - title: Access and integrity answer different questions
    brief: >-
      Compare an unauthorised read of Rowan's valid customer row with the invalid
      order reference (tenant_id, customer_id) = (10, 4). An integrity constraint
      protects the association; it does not decide who may read Rowan. Conversely,
      an authorised writer still needs integrity rules. Constraints and data
      integrity owns composite references and their enforcement.
  - title: Test the identity that will do the work
    brief: >-
      Build an allow-and-deny test from the task requirements using the deployed
      runtime and support connection identities, rather than an owner or
      administrator. Confirm a legitimate tenant-10 lookup; reject or hide Rowan
      from tenant 10 as designed; exercise forbidden writes, forged or missing
      tenant context, tenant changes and connection reuse. Check effective identity
      and unchanged data as well as returned rows: an empty result is not by itself
      proof that a write was safely denied. Distinguish expected illustrative
      outcomes from any results actually executed by the writer.
  - title: Keep privileges correct as the schema changes
    brief: >-
      Treat a new table, column or routine as a new access decision and rerun the
      relevant identity tests after migration. Include grants inherited from groups
      and defaults in the review; remove temporary support authority when its task
      ends. Take the same task requirements to PostgreSQL roles, policies and
      privileged code for native implementation and to Operating and securing a
      CockroachDB cluster for its secure identities and privilege checks.
