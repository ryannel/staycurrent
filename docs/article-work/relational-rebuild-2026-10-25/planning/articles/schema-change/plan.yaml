topic: Relational schema evolution
title: Live schema changes and backfills
brief: >-
  Move through compatible schema, data and caller states using expand, migrate
  and contract. Prove that a live backfill converges despite concurrent changes
  and late rows, then judge when to switch readers, pause, return or retire the
  old form. Follow an exact price-to-hundredths conversion; native DDL, lock,
  index-validity and schema-job procedures belong to the implementation articles.
heading:
  - title: Expand, migrate and contract
    brief: >-
      Understand why renaming or replacing a field in one deployment can break
      callers still using it. Follow products.price to price_hundredths through
      a period when both forms coexist, with 20.00 and 2000 meaning the same price.
  - title: Compatibility during a rolling deployment
    brief: >-
      Judge each caller against the schema and data it may meet. A bridge caller
      reads the old price and writes both forms atomically; it can coexist with
      old callers before new reads are enabled. Make the accepted read and write
      combinations visible rather than treating a deployed release as one state.
    heading:
      - title: Close the old write path
        brief: >-
          Understand why every old-only writer and its in-flight work must drain
          before this backfill starts. Web instances, workers, imports and manual
          tools all count; one surviving writer can make an already copied row
          stale without making its new field NULL.
  - title: Backfill without overwriting a newer value
    brief: >-
      Follow a worker that reads P7 at 20.00 before a bridge writer commits
      22.00 and 2200. Distinguish repeatable work from a stale overwrite: derive
      the new value from the current protected source, or condition the write
      on that source still matching and retry a conflict.
    heading:
      - title: Commit and resume in bounded batches
        brief: >-
          Understand why a cursor records committed coverage, not semantic
          correctness. A crash after a batch commit can replay that batch;
          the same current-state transformation must remain safe to repeat,
          and a checkpoint must never skip uncommitted work.
      - title: Rows arriving behind the cursor
        brief: >-
          See why reaching the last key cannot establish completeness in a live
          table. A late P11 can sort before visited P3; the bridge must initialise
          both forms on insert, while unfinished or skipped work remains part of
          reconciliation rather than disappearing behind the cursor.
  - title: Prove that the migration has converged
    brief: >-
      Establish both coverage and meaning: no required value is missing and each
      new value equals the agreed transformation of its source. Combine that
      evidence with a write rule that preserves it, so later commits cannot
      recreate disagreement. A finished job, a maximum cursor and matching row
      counts each leave part of this proof unanswered.
  - title: Switch readers and preserve a return path
    brief: >-
      Enable new reads only after semantic checks and required database objects
      are ready. Keep both forms current during the return window and verify
      equivalent application results. Returning to bridge readers is different
      from restoring old-only writers, which would reopen the migration race.
  - title: Run the change within the available headroom
    brief: >-
      Judge the physical operation separately from application compatibility:
      a compatible change can still wait for locks or consume spare processor,
      storage and log capacity. Bound batches and waits, observe foreground
      service, and confirm what actually stopped when pausing. Native mechanisms
      belong to PostgreSQL schema changes under load and CockroachDB schema jobs
      under load.
  - title: Contract the old form
    brief: >-
      Retire old reads, rollback targets and other dependencies before stopping
      legacy writes and dropping the old field. The transition must also allow
      new inserts while the old NOT NULL column still exists. Identify when its
      data stops being maintained: return after that point requires reconciliation
      or a new migration, not just an older application release.
    heading:
      - title: Constraints, indexes and replacement tables
        brief: >-
          Carry the same acceptance rule to related changes: future-write
          enforcement does not establish that old rows satisfy a constraint,
          an existing index need not be ready, and a copied table needs ongoing
          changes reconciled before routing switches. Leave native validation,
          build, cutover and cleanup procedures with their existing owners.
