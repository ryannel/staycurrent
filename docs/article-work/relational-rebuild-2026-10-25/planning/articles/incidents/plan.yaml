topic: Relational database operations
title: Diagnosing a database incident
brief: >-
  Start with a slow or failing application request and use correlated evidence to
  distinguish waiting for a connection, lock waits, expensive execution and
  storage pressure. Choose a bounded intervention, account for its recovery cost
  and verify that useful service recovers. This article owns symptom-to-cause
  reasoning; native evidence and commands, lock and plan repair, workload budgets
  and live-change procedures belong to their established articles.
heading:
  - title: Start with the request
    brief: >-
      Establish what should have completed, what the caller actually saw, the
      affected requests and the incident window. Follow Mina's existing
      customer-1 order-history read through the application and database; locate
      connection acquisition, statement work and result consumption without
      counting nested waits twice.
    heading:
      - title: Compare the same work before and after
        brief: >-
          Compare errors, completed requests and latency for comparable inputs
          and load, alongside recent application, schema and workload changes.
          Preserve a small evidence window; a coincident change is a hypothesis,
          and a timeout or missing reply establishes less than a database answer.
  - title: Waiting for a connection
    brief: >-
      Use acquisition time, queued callers and borrowed connections to establish
      whether this request has reached the database. Trace what keeps existing
      borrowers occupied: useful work, database waits, slow consumption or a
      missing release. A full pool describes where callers wait, not why.
    heading:
      - title: When the queue is a symptom
        brief: >-
          Make the chain from longer connection occupancy to later callers'
          acquisition delay visible. Explain why adding connections cannot
          release a lock or establish more resource capacity; this article
          diagnoses the queue, while its child designs admission and budgets.
        nested_article:
          topic: Relational workload capacity
          title: Connections, overload and capacity
          brief: >-
            Distinguish connections, active work and queued requests, then budget
            admitted work and recovery headroom around the real limiting resource.
            Choose bounded overload behaviour and validate capacity under a
            representative workload; the parent establishes which delay explains
            the incident.
  - title: Waiting inside the database
    brief: >-
      Correlate the affected statement with its current wait, blocker and
      transaction lifetime, rather than equating an active session with CPU work.
      In the independent PostgreSQL lock-only branch, an ACCESS EXCLUSIVE lock on
      orders blocks ordinary history reads; blocked borrowers can then fill the
      pool. Ordinary row-update locks do not explain that ordinary-read wait.
    heading:
      - title: Follow the dependency to its holder
        brief: >-
          Explain why a transaction idle between statements can still block
          useful work and why removing an arbitrary waiter leaves its cause in
          place. A wait chain need not be a deadlock. Use Locks, contention and
          deadlocks for protocol repair and the native operations article for
          collecting evidence and ending selected work.
  - title: When execution is expensive
    brief: >-
      Establish that useful execution accounts for the delay before investigating
      the plan. Relate the statement's work and invocation frequency to the
      resources other requests share; an individually acceptable report can
      become disruptive when run repeatedly or concurrently.
    heading:
      - title: Find the work that grew
        brief: >-
          Use the agreed paid-order report to distinguish more input, repeated
          work, a changed route and temporary spills from a lock wait. A
          historical total, one slow sample or an isolated benchmark is not the
          incident workload. Query execution and performance owns measured plan
          analysis and testing a lasting repair.
  - title: Storage delay and running out of space
    brief: >-
      Distinguish waiting for reads, temporary writes or durable commit from
      exhausting free space. Correlate the affected work with storage latency,
      activity and space trends in the same window; page accesses and a full
      cache do not alone establish a storage bottleneck.
    heading:
      - title: Find what is consuming the resource
        brief: >-
          Recognise that reporting, background writing, retained versions or log
          growth can share storage with foreground requests. Use an explicitly
          illustrative space trajectory to explain urgency and recovery
          headroom. Native diagnosis and safe space repair belong to operations,
          vacuum and WAL articles; spare space and workload budgets belong to
          capacity planning.
  - title: Choose a bounded intervention
    brief: >-
      Turn the supported cause into one targeted action with a predicted effect,
      a scope, an observation period and a stopping condition. Develop pausing
      optional reporting or ending an identified lock-only holder far enough to
      show what should change, while retaining the evidence needed to judge it.
    heading:
      - title: Cancellation and recovery still do work
        brief: >-
          Distinguish abandoning a caller, cancelling a statement and ending a
          session or transaction. Confirm completion and cleanup before reusing
          resources; preserve uncertain commit outcomes. Account for engine-
          dependent rollback, queued work, reconnects and cache warming before
          treating a restart as relief. Native commands and recovery protocols
          stay with their implementation and retry articles.
  - title: When a live change triggered the incident
    brief: >-
      Connect a schema operation's exclusion and a backfill's resource work to
      the wait and pressure already explained. Show why pausing new work or
      reverting an application release does not by itself prove that an
      in-progress database change has stopped or that earlier caller states
      remain compatible. The child owns the complete change protocol.
    nested_article:
      topic: Relational schema evolution
      title: Live schema changes and backfills
      brief: >-
        Move through compatible schema and caller states using expand, migrate
        and contract. Prove a backfill converged despite races and late rows,
        and define acceptance and return boundaries; the parent recognises a
        change as a possible incident trigger and chooses initial containment.
  - title: Verify that useful service recovered
    brief: >-
      Check the predicted wait or resource change together with completed useful
      requests, errors, latency and queue drainage under the relevant traffic.
      A quiet server after rejecting all work is not successful recovery. Restore
      paused work cautiously, check whether the cause returns, and carry the
      retained evidence into the appropriate lasting repair.
