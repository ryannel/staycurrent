topic: CockroachDB secure operation
title: Operating and securing a CockroachDB cluster
brief: >-
  Verify the server and runtime identity, effective privileges and tenant boundary
  of a secure CockroachDB connection. Diagnose reduced range protection from native
  evidence, then drain and decommission a node only when the remaining placement
  and capacity preserve the required survival margin. General membership theory,
  regional policy, query tuning and upgrades remain with their existing articles.
heading:
  - title: A secure connection has two identities
    brief: >-
      Follow shop_runtime connecting to a secure self-hosted v26.2 cluster. Distinguish
      the server identity verified through its CA and address from the SQL identity
      authenticated by the server; neither establishes the application's tenant
      authority. Make the node, runtime and administrative credentials distinguishable.
    heading:
      - title: Verify the connection the application uses
        brief: >-
          Understand what verify-full checks through a successful connection and
          rejected trust or hostname cases. Verify the resulting SQL identity using
          the actual runtime credential; keep credential expiry, renewal and a new
          connection check part of maintaining this boundary.
  - title: Give each task its own authority
    brief: >-
      Translate shop_runtime, shop_migrate and shop_support into native login roles,
      memberships and object privileges. Keep ownership and administrative authority
      outside runtime; inspect inherited, public and grantable access rather than
      relying on a list of direct table grants.
    heading:
      - title: Test the allowed and forbidden work
        brief: >-
          Pair an authorised shop read with rejected schema, payment and support-write
          operations on separate real login connections. Preserve support's selected
          customer and order fields through a verified restricted interface, with no
          unrestricted base-table path; do not assume PostgreSQL privilege syntax.
  - title: Enforce the tenant boundary
    brief: >-
      Use the supplied tenant-10 rows and tenant-20 customer 4 to develop CockroachDB
      row-level security. Relate table privileges, applicable policies, USING and
      WITH CHECK to omitted filters and forbidden tenant-changing writes. Keep valid
      cross-table association constraints distinct from permission to see a row.
    heading:
      - title: What the policy trusts
        brief: >-
          Show that service-supplied tenant context is trusted input: a caller that can
          choose 20 can change the policy result. Verify missing context and connection
          reuse after commit and rollback. Tenant filtering does not establish a
          person's rights within the tenant.
      - title: Check every route to the rows
        brief: >-
          Test runtime and support through their actual table or view paths, including
          owner, admin and BYPASSRLS exceptions. Recognise that constraints, privileged
          interfaces and data-copy operations need their own access checks; a passing
          ordinary SELECT test does not secure those paths.
  - title: Read node health and range health together
    brief: >-
      Connect node status and its observation time to replication metrics, configured
      replica requirements and SHOW RANGES evidence. Distinguish a reachable SQL
      gateway, an available range and restored protection; count voting replicas for
      each affected range rather than healthy machines across the cluster.
    heading:
      - title: Under-replicated does not mean unavailable
        brief: >-
          Follow one three-voter range while a replica becomes unreachable and returns
          or is replaced. Make the surviving majority and lost extra-failure margin
          visible, with unavailable ranges as a distinct case. Separate documented
          models from any captured local status transition.
  - title: Find what prevents replication from recovering
    brief: >-
      Use a bounded native evidence chain from unhealthy ranges to node or store
      reachability, replication settings, eligible destinations and resource
      headroom. Distinguish recovery in progress from stalled movement, and choose
      the next check from evidence rather than assuming another node or restart fixes
      the cause. Query-work and hot-key repairs remain with query performance.
  - title: Check the cluster that will remain
    brief: >-
      Apply the general movement budget to one planned CockroachDB node removal.
      Verify affected voters, placement constraints and capacity during movement and
      after the next required failure. Explain why successful native decommissioning
      pre-flight checks do not establish available disk or workload capacity.
  - title: Drain and decommission a node
    brief: >-
      Follow one verified target from traffic withdrawal and draining to native
      decommissioning, replica movement and final membership status. Distinguish a
      temporary stop from permanent removal; a drained process or a zero-replica
      progress row alone is not permission to discard its store.
    heading:
      - title: When decommissioning stalls
        brief: >-
          Interpret pre-flight errors, remaining replica evidence and operational
          logs to identify the missing destination or other blocker. Keep the target
          available while resolving it; use supported recovery or recommissioning
          only within its current membership state.
      - title: Verify the result before the next change
        brief: >-
          Establish decommissioned membership, evacuated replicas, restored range
          protection and acceptable authorised shop service before ending the
          maintenance unit. Use local process observations for native behaviour;
          require separate deployment evidence for failure domains and capacity.
  - title: Sources and further reading
    brief: >-
      Use the v26.2 security, role, RLS, range-health and node-shutdown references.
      Point to regional locality, query performance, backup and upgrades for their
      owned procedures, and explain the limits of the disposable v26.2.8 rehearsal.
