topic: Relational backup and recovery
title: Backup, restore and reconciliation
brief: >-
  Choose and verify recoverable history against acceptable data loss and service
  recovery time. Restore the intended state, close the source history, and
  reconcile valid later work and external outcomes without applying an operation
  twice. The article owns the transferable method; native backup and restore
  procedures remain with the PostgreSQL and CockroachDB articles.
heading:
  - title: What must the shop recover?
    brief: >-
      Start with the separate mistaken P7 price of 2.20. Judge correction against
      restoring an earlier history: restart and a replica can faithfully preserve
      the mistake, while an earlier restore also omits valid later work. Keep
      business correction with History, correction and deletion and live-copy
      promotion with Failover and fencing.
    heading:
      - title: Recovery point and recovery time
        brief: >-
          Translate acceptable lost work into a recovery point objective and
          acceptable interruption into a recovery time objective. Distinguish a
          target from achieved coverage and measured recovery; service recovery
          includes obtaining the backup, replay, validation and necessary
          reconciliation, not merely starting the database.
  - title: A backup and the history it needs
    brief: >-
      Understand why a named backup is insufficient evidence of recoverability.
      Follow a complete starting copy and its required later history to the
      intended target; a missing dependency or gap can make newer files useless
      for that target. Make coverage and the effect of one missing interval visible.
    heading:
      - title: Logical and physical backups
        brief: >-
          Choose from the recovery task. Logical exports reconstruct selected
          data and schema; a supported physical recovery path restores the
          engine's stored state. A PostgreSQL dump cannot be advanced with WAL,
          and an arbitrary live file copy is not a supported consistent backup.
          Check actual object scope, dependencies and version requirements rather
          than assuming every method has the same capabilities.
      - title: Full backups, increments and retained history
        brief: >-
          Understand full versus incremental as a separate choice from logical
          versus physical. Retain every dependency required by the selected
          method and target. Backup frequency alone does not establish the latest
          recoverable point or an arbitrary point-in-time capability; shorter
          backup chains can trade more copying for less restore work.
      - title: Keeping recovery material usable
        brief: >-
          Judge whether the chosen failure can also destroy or deny access to
          the backup. Include required configuration, compatible software,
          credentials and decryption material in recovery arrangements, and
          manage retention by recoverable coverage rather than file age alone.
  - title: Choosing the restore target
    brief: >-
      Distinguish the latest available point from the desired point. Use evidence
      to place the target before the unwanted committed change and confirm the
      recovered facts; an incident discovery time or application timestamp does
      not identify that boundary by itself. Show that replaying through the bad
      commit retains it, while stopping earlier excludes all later work too.
    heading:
      - title: Which history, which objects?
        brief: >-
          Identify the source history and restore scope as well as the stopping
          point. Recovery selects a supported state, not an arbitrary selection
          of transactions to omit. Preserve the original history for evidence;
          extracting sound facts from a separate restored copy can be safer than
          replacing the entire service. Native target syntax and scope limits
          belong to the implementation articles.
  - title: Proving a restore works
    brief: >-
      Test recovery into an isolated destination with external workers disabled.
      Distinguish file and checksum checks, a successful engine restore, the
      intended recovered state and a usable application. A green backup job or
      server accepting connections does not establish all four.
    heading:
      - title: Check the recovered facts
        brief: >-
          Verify source identity, selected target and representative business
          facts. For the shop, check the expected P7 price, pending order 103,
          agreed line total 29.00, stock 10/0/4 and the expected presence or
          absence of the later payment. Exercise permissions and an application
          read without delivering messages or taking payments.
      - title: Measure the recovery path
        brief: >-
          Rehearse the complete path with realistic size and recovery access,
          retaining achieved point, elapsed stages and unresolved work. Use the
          result to change the backup design or recovery objective; do not turn
          a small example or replay-rate estimate into a production guarantee.
  - title: Close the source history
    brief: >-
      Establish a finite boundary before declaring later-work reconciliation
      complete. Stop new source writes and external dispatch, resolve or account
      for in-flight work, preserve the final evidence and prevent stale clients
      or workers from continuing on the old authority. A candidate restored copy
      stays isolated until this boundary and the handover are controlled.
    heading:
      - title: What evidence survives?
        brief: >-
          Build the later-work set from retained source outcomes and independent
          evidence, keeping uncertain commits unresolved until established.
          If the source is lost, distinguish the history actually recoverable
          from work merely believed to have occurred; state any unprovable gap.
          Detailed promotion and fencing protocols remain with Failover and fencing.
  - title: Reconcile valid later work
    brief: >-
      Separate retained work, the unwanted change, valid omitted work and work
      whose validity depends on the mistaken state. Reconcile logical operations
      with their original identity and meaning, not a blind replay of SQL or a
      copy of every row after an application timestamp.
    heading:
      - title: Preserve identity and apply once
        brief: >-
          Carry the original identity, canonical meaning and established outcome
          into a controlled reconciliation. Check whether it is already present;
          make each accepted database repair and its reconciliation record one
          atomic outcome. A repeat verifies the same result, a mismatch stops,
          and restored absence of an old request record does not prove that the
          original operation never committed.
      - title: Recheck the business rule
        brief: >-
          Judge each repair against the recovered relationships and invariants.
          A valid later payment must still match its order and amount; a purchase
          or booking must not consume stock or capacity twice. Preserve dependent
          operations in a valid order and route incompatible cases to an explicit
          business decision rather than silently labelling them recovered.
  - title: External effects do not roll back
    brief: >-
      Follow the agreed later 10.00 partial payment for order 103 across the
      restored database and an independently retained provider outcome. Restoring
      before the price mistake can remove payment 504 while leaving its charge
      completed. Reconcile that known effect without charging again; restoring
      local request or delivery records can remove duplicate protection too.
    heading:
      - title: Known, absent and unresolved outcomes
        brief: >-
          Use the stable external operation identity and the receiver's actual
          lookup and deduplication contract. Record a known completed result;
          perform new work only when its absence and safe execution are
          established. An absent local row, expired key or missing provider reply
          leaves uncertainty, not permission for a fresh effect. Detailed worker
          delivery belongs with Outboxes and database-backed jobs.
  - title: Return one recovered service to use
    brief: >-
      Judge readiness from the verified target, closed source, accounted later
      work and explicit external exceptions. Route callers and workers to one
      authority, rebuild or reconcile derived copies as required, and establish
      backup coverage for the new history. Record achieved loss and recovery
      time, including any restricted service, rather than declaring success
      solely because the restore command finished.
