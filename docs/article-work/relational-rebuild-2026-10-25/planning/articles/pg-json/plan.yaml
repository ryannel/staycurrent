topic: PostgreSQL JSONB design
title: PostgreSQL JSON and structured alternatives
brief: >-
  Choose columns, related rows or JSONB from the facts, validation and update
  boundary. Read and change JSONB without losing distinctions between types,
  missing fields and nulls, and match predicates to useful native indexes.
  Preserve established identities and rules; general modelling, value semantics
  and access-method machinery remain with their existing owners.
heading:
  - title: What belongs in a JSON document
    brief: >-
      Apply the modelling decision to the shop's product details. Keep identity,
      price, stock and independent relationships explicit; compare JSONB with
      typed columns and subtype rows using P3's Japan origin and P7's 300 ml
      capacity. A document groups facts that are meaningfully read and changed
      together, rather than removing their schema.
    heading:
      - title: Arrays and composite values
        brief: >-
          Recognise native arrays for homogeneous values and composites for
          named typed fields. Neither supplies independent row identity or
          per-element foreign keys; P7's gift/ceramic membership can still belong
          in related rows. Keep this a practical comparison, not a new type survey.
  - title: JSON and JSONB
    brief: >-
      Choose JSONB for queried documents while recognising what conversion loses:
      object-key order, whitespace and duplicate keys. Distinguish valid JSON
      syntax from an object of the expected shape, and avoid treating JSONB as
      an exact copy of an incoming message or as an untyped text field.
  - title: Reading values and missing fields
    brief: >-
      Follow one field through JSON-preserving extraction and text extraction.
      Distinguish numeric 300, string "300", JSON null, an absent field and a SQL
      NULL document before comparing or casting. Understand why text ordering
      cannot answer a numeric capacity question and why a cast is not a complete
      validation policy. General NULL and equality rules belong in Values.
  - title: Validating a document
    brief: >-
      Express an explicit object, presence, JSON-type and value contract with
      PostgreSQL constraints. Test missing, null, wrong-type and invalid-value
      cases; prevent an unknown CHECK result from accepting a required field and
      guard unsafe conversions. Contrast a hypothetical positive-capacity rule
      with a typed detail row, retaining ordinary keys and references for
      independent facts. General constraint enforcement remains with Constraints.
  - title: Containment, existence and JSON paths
    brief: >-
      Choose the predicate from the question: top-level existence, nested
      containment, whole-value equality or a path filter. Use the established
      gift/ceramic tags to make nesting, extra elements, order and multiplicity
      visible. Introduce JSONPath through a useful filter, explaining its
      structural adaptation and suppressed errors so a successful search is not
      mistaken for validation.
    heading:
      - title: Turning JSON into rows, and rows into JSON
        brief: >-
          Use a small native extraction or JSON_TABLE example to obtain typed
          SQL columns while retaining the source identity and occurrence meaning.
          Recognise that conversion does not install storage constraints. Build
          an order-103 JSON response from its existing relational lines to show
          that an API document need not dictate storage; result-grain and general
          aggregation mechanics remain with their existing articles.
  - title: Indexing the question being asked
    brief: >-
      Match the actual JSON expression, operand type and operator to an index.
      Distinguish broad document searches from a recurring scalar range or
      ordering request. Use the existing GIN and plan understanding rather than
      reteaching access methods.
    heading:
      - title: JSONB GIN operator classes
        brief: >-
          Choose jsonb_ops when key existence is needed, and consider
          jsonb_path_ops for supported containment and JSONPath searches.
          Understand the different retained information, empty-structure limit
          and query-dependent trade-off. Operator support does not promise that
          every JSONPath condition yields useful search keys or that GIN supplies
          result order.
      - title: Indexes on JSON expressions
        brief: >-
          Compare a whole-document GIN containment predicate with a matching
          subdocument expression index. Use a validated numeric extraction and
          B-tree for capacity bounds or order; a GIN on the document does not
          substitute for it. Recognise when a frequently governed field deserves
          a typed column instead. Check equivalent results, native conditions,
          rechecks, heap work and write cost without inventing performance results.
  - title: Changing part of a document
    brief: >-
      Understand jsonb_set and subscripting as changes to a value in one locked
      row, with PostgreSQL row-version and index work behind them. Distinguish
      path creation from a shallow concatenation, and server-side edits of the
      current value from replacing it with a stale client copy. Different keys
      in one row still share its write contention; split independently managed
      facts when the ownership boundary calls for it. Transaction protocols and
      physical internals remain with their existing owners.
  - title: Keeping the schema useful as requirements change
    brief: >-
      Reassess the product design when optional description becomes required,
      ranged, referenced or independently edited data. Keep one authority for a
      promoted field and an explicit missing-value policy. JSON flexibility moves
      validation and compatibility work rather than eliminating it; live
      backfills, writer handover and concurrent index builds belong in the
      existing schema-change articles.
