topic: CockroachDB architecture and practice
title: Inside CockroachDB
brief: >-
  Trace shop rows and indexes through ordered keys, ranges, replicated ownership
  and local Pebble storage. Distinguish the SQL gateway, range leaseholder and
  voting replicas, then explain what splits and movement can distribute and why
  one busy key can remain a bottleneck as the cluster grows. Use a versioned
  self-hosted deployment; children own transaction protocols, tuning and operating
  procedures.
heading:
  - title: SQL on any node
    brief: >-
      Follow a lookup of P7 from a SQL connection to KV requests and back. Understand
      why the gateway need not store the requested data and why accepting SQL on
      several nodes does not create independent write authorities for P7.
    heading:
      - title: PostgreSQL clients and SQL compatibility
        brief: >-
          Recognise the familiar connection protocol while treating supported SQL
          and application semantics as a separate contract. The parent establishes
          the different engine; the child owns application transfer and validation.
        nested_article:
          topic: PostgreSQL-to-CockroachDB migration
          title: Moving a SQL application to CockroachDB
          brief: >-
            Find semantic incompatibilities behind similar SQL and port the
            application contract. Validate a consistent copy, transfer one write
            authority and reconcile a return path after new writes; the parent
            introduces the different execution and storage architecture.
  - title: Rows and indexes become keys
    brief: >-
      Understand how table and index identities prefix ordered column values.
      Locate P7 in the primary index and follow Mina's orders through a separate
      customer index to their primary keys. Make visible why another index is
      another set of stored keys, potentially on different ranges.
    heading:
      - title: Column families
        brief: >-
          Understand how columns of one row are grouped into KV values, so a row
          need not mean one key per column. Use the default family for the main
          example; family tuning is unnecessary to understand its route.
      - title: Adding an index to existing rows
        brief: >-
          Recognise that a new customer-history index needs existing entries as well as
          concurrent changes. Establish why a live backfill consumes real cluster
          resources; the child owns job handling and application compatibility.
        nested_article:
          topic: CockroachDB schema evolution
          title: CockroachDB schema jobs under load
          brief: >-
            Treat schema changes as observable jobs within an application
            compatibility protocol. Interpret progress, failure and cleanup, and
            accept a backfill or unique index after semantic checks; the parent
            explains why the new representation requires work.
  - title: Ranges and routing
    brief: >-
      Divide the ordered keyspace into adjoining intervals and locate P7 in one
      range. Distinguish a range from a table, an index and a machine. Follow cached
      range metadata to replicas, including refreshed routing after ownership or
      boundaries change, without implying every request searches every node.
  - title: Replicas, Raft and the leaseholder
    brief: >-
      Apply the prerequisite's agreement model to one native range and the separate
      P7 price change. Distinguish durable agreement, applying a command and a SQL
      transaction outcome. Explain the leaseholder's serving authority and Raft's
      ordered history; in this version leader leases colocate these roles except
      briefly during transfer. Count voters per range.
    heading:
      - title: Replica placement and lease placement
        brief: >-
          Understand that placing copies and placing serving authority answer
          different questions. Derive one remote dependency from a stated placement;
          native locality policy and survival verification belong in the child.
        nested_article:
          topic: CockroachDB regional placement
          title: CockroachDB table locality and region survival
          brief: >-
            Choose regional-by-table, regional-by-row or GLOBAL tables and survival
            goals from access and failure requirements. Verify placement and
            survival separately from measured regional latency; the parent explains
            the range replicas and leases those policies place.
  - title: What each replica stores
    brief: >-
      Follow an agreed change into a store's Pebble engine: memory, local WAL,
      sorted files and compaction. Distinguish the range's replicated Raft history
      from Pebble's local recovery log. Understand why a range is a logical ownership
      interval rather than one file, and why compaction adds storage work.
    heading:
      - title: Versions of the same key
        brief: >-
          Reuse the independent P7 price change to distinguish retained 20.00 and
          later 22.00 versions from separate replicas. Establish that a replica
          needs safe-history evidence to serve a read; the child owns read choices.
        nested_article:
          topic: CockroachDB read choices
          title: CockroachDB isolation and follower reads
          brief: >-
            Choose Serializable, Read Committed and historical reads from the
            decision they support. Explain safe follower reads, freshness and
            retention limits; the parent introduces versioned keys and distinguishes
            copied data from authority to serve it.
      - title: Replication and recovery copies
        brief: >-
          Understand why replicated storage can survive a machine loss while
          faithfully preserving an unwanted committed change. The child owns
          backup coverage, restoration and reconciliation with later valid work.
        nested_article:
          topic: CockroachDB history restoration
          title: CockroachDB backup and recovery
          brief: >-
            Validate full and incremental backup coverage and restore scope.
            Restore intended history, close source writes and reconcile a later
            valid booking by identity, capacity and external effects without
            consuming capacity twice; the parent distinguishes replicas from
            recoverable earlier history.
  - title: One transaction across ranges
    brief: >-
      Return separately to before purchase 103. Locate order, line, stock and
      relevant index or constraint work without inventing a fixed native range
      count. Understand why each range's Raft agreement still needs a shared
      transaction outcome. The parent establishes participants and atomic scope;
      the child owns intents, commit and retries.
    nested_article:
      topic: CockroachDB transaction execution
      title: CockroachDB transactions and retries
      brief: >-
        Relate intents and transaction state to atomic visibility, then handle
        native retry and ambiguous-result paths for one logical purchase. Preserve
        request identity and keep external work outside replayed transactions;
        the parent establishes why its keys can cross replicated ranges.
  - title: Splits, movement and hotspots
    brief: >-
      Follow one range becoming two, then distinguish that boundary change from
      moving replicas or transferring a lease. Explain how size and load can lead
      to splits and how independent key groups can use additional nodes. Show why
      more nodes alone neither move useful work nor guarantee balanced demand.
    heading:
      - title: A hot range and a hot key
        brief: >-
          Contrast separable demand on several keys, writes at an ordered index's
          advancing edge and repeated changes to the same P7 stock authority.
          Explain which work a split can separate. The child owns native diagnosis
          and the costs of alternative keys or indexes.
        nested_article:
          topic: CockroachDB performance
          title: CockroachDB query work and hot ranges
          brief: >-
            Locate lookups, fan-out, SQL/KV work, network movement and contention
            from native evidence. Weigh covering and distributed keys against
            write and ordering costs; the parent explains why splitting independent
            keys cannot divide one hot-key decision.
  - title: Reading the cluster's range evidence
    brief: >-
      Connect one owned native observation to the model: keys covered, voting and
      non-voting replicas, and leaseholder. Distinguish this changing placement
      snapshot from workload measurements or a health verdict. Explain why losing
      one range's quorum can block requests despite healthy nodes elsewhere;
      operating procedures belong in the child.
    nested_article:
      topic: CockroachDB secure operation
      title: Operating and securing a CockroachDB cluster
      brief: >-
        Verify secure runtime identity, least privilege and tenant isolation. Use
        native evidence to diagnose under-replication and range health, then remove
        a node within the survival budget; the parent teaches how to read replica
        ownership without attempting maintenance procedures.
  - title: Changing the cluster version
    brief: >-
      Recognise that upgrading node binaries and finalising the cluster version
      are separate transitions. Relate rolling change to per-range redundancy and
      compatibility, keeping the release-specific rollout and return procedure in
      the child.
    nested_article:
      topic: CockroachDB cluster version evolution
      title: Upgrading a CockroachDB cluster
      brief: >-
        Rehearse binary rollout and the cluster-version boundary. Distinguish mixed
        binaries from finalised compatibility, and verify application acceptance,
        rollback eligibility and recovery choices; the parent establishes the
        replicated owners that must remain usable during change.
