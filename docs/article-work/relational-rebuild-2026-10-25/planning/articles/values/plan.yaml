topic: SQL values and equality
title: Values, missing data and equality
brief: >-
  Choose representations that preserve the distinctions the application needs:
  exact amounts, moments and local dates, text, identifiers and structured values.
  Understand how types, conversion and collation determine arithmetic, equality
  and ordering. Predict predicates involving NULL and choose deliberate missing
  value and uniqueness rules. Use the shop's prices, product codes and order
  times, with agreed optional-attribute scenarios. This article owns
  value representation and comparison, while modelling owns row meaning, query
  results owns missing matches, and PostgreSQL JSON owns native JSONB procedures.
heading:
  - title: Types, values and their written forms
    brief: >-
      Understand that a type determines permitted values and operations, while
      a displayed string is one representation. Start with P7, 20.00 and order
      103's placement time: a product code, an amount and a moment need different
      meanings even if the application receives all three as text. Units and
      business rules still need stating; choosing a type does not supply them.
  - title: Numbers, money and rounding
    brief: >-
      Choose integers for counts, exact decimal or explicitly scaled integers
      for amounts, and approximate floating point for quantities whose intended
      error permits it. Use the shop's existing numeric(8,2) prices and payments
      without assigning a currency. Make visible the distinction between stored
      precision, a formatted display and the arithmetic performed.
    heading:
      - title: Precision and scale
        brief: >-
          Interpret numeric(8,2), including its range, rounding on storage and
          overflow. Understand why exact decimal storage still needs a policy
          for division, allocation and when to round; three rounded shares of
          an amount need not add back to it. A count of minor units also needs
          a named unit, a sufficient range and deliberate division.
      - title: Conversion can change the answer
        brief: >-
          Trace integer division and a conversion before versus after the
          calculation. Recognise implicit conversion in mixed expressions and
          use explicit casts or correctly typed parameters when meaning depends
          on it. A later conversion cannot recover digits already discarded;
          casting approximate data to decimal cannot restore its original value.
  - title: Dates, local times and instants
    brief: >-
      Choose a calendar date, local date and time, or instant from what the fact
      means. Show order 103's 2026-10-20 10:15 UTC and 12:15 at offset +02 as the
      same instant. Explain PostgreSQL timestamptz's conversion and display rules,
      including that it retains neither the input zone name nor its offset.
    heading:
      - title: Time zones and calendar arithmetic
        brief: >-
          Understand why a local time needs a zone and sometimes a resolution
          rule to identify an instant, why a fixed offset is not a zone's future
          rules, and why a calendar day can differ from 24 elapsed hours.
          Recognise session-dependent casts and comparisons; make the intended
          zone explicit when deriving a business date. Keep temporal history
          design and scheduling procedures outside this article.
  - title: Text, collation and equality
    brief: >-
      Distinguish the characters stored, the text shown to a person and the rules
      used to compare it. Choose length limits from actual rules and understand
      that collation can change ordering and, where configured, equality.
      Preserve names while defining an explicit comparison policy for codes;
      lowercasing is a policy choice, not a universal repair.
    heading:
      - title: Which differences matter?
        brief: >-
          Reason about case, accents, Unicode normal forms and significant
          whitespace through a small comparison. Distinguish a search that
          deliberately ignores differences from an identifier that must preserve
          them. Qualify PostgreSQL's deterministic and nondeterministic
          collations; avoid inferring that every locale collation ignores case.
  - title: Identifiers are values with a purpose
    brief: >-
      Choose integer, UUID or text representation from the identifier's meaning
      and generation boundary. Keep P7 as a code and customer_id as a reference,
      rather than treating numeric-looking codes as quantities. Distinguish
      generating an identifier from enforcing uniqueness, identifying a business
      duplicate, ordering events and granting access. Modelling owns which facts
      and keys identify a row; index articles own storage and insertion costs.
  - title: When one value has parts
    brief: >-
      Judge decomposition from the questions, comparisons, validation and updates
      the attribute must support, rather than whether its display contains
      punctuation. Use Green tea, 50 g to distinguish a product's name from its
      pack size. Understand that SQL can hold structured values and that JSON
      syntax validity alone does not establish business meaning. Modelling owns
      independent facts and relationships; PostgreSQL JSON owns JSONB operators,
      validation techniques and indexing.
  - title: NULL and missing information
    brief: >-
      Treat NULL as a marker for absent information, distinct from zero, an empty
      string and a missing row. Give each nullable attribute an explicit meaning;
      represent separate absence reasons explicitly when the application needs
      to distinguish them. Use the agreed unknown package weight rather than
      changing the meaning of order 103's absent payments.
    heading:
      - title: True, false and unknown
        brief: >-
          Follow a nullable weight through comparison, NOT, AND and OR, then
          through WHERE, which keeps only true. Explain why the negated filter
          need not return every excluded row. Use IS NULL and IS NOT NULL for
          missingness, and make a small IN/NOT IN example with NULL predictable
          from the same logic, without reteaching joins or existence queries.
      - title: Comparing and replacing missing values
        brief: >-
          Understand why NULL = NULL is unknown and when IS NOT DISTINCT FROM
          expresses the required comparison. Use COALESCE only when the fallback
          has the intended meaning: an unknown weight is not a weight of zero.
          A presentation label may be safe where substituting a calculation
          input would hide missing information.
      - title: Equality depends on the operation
        brief: >-
          Distinguish ordinary equality predicates from duplicate elimination
          and uniqueness rules. Use two absent loyalty codes to explain default
          PostgreSQL UNIQUE behaviour and NULLS NOT DISTINCT, with a brief
          warning that defaults differ by engine. Explain CHECK accepting
          unknown versus NOT NULL excluding it, and deliberate NULLS FIRST/LAST
          placement in an ordered result. Constraints owns enforcement design
          and rollout; query results and aggregation own their full result
          operations, not this comparison boundary.
