topic: PostgreSQL architecture and practice
title: Inside PostgreSQL
brief: >-
  Trace a connection and a product lookup through PostgreSQL processes, shared
  buffers, index entries and heap tuples. Explain how snapshots select versions
  and when HOT can avoid new ordinary index entries. Use the independent P7
  price change from 20.00 to 22.00; native plan repair, maintenance diagnosis and
  durability controls belong to the existing specialist articles.
heading:
  - title: Connections and backend processes
    brief: >-
      Understand how an application connection reaches its backend process and
      how several backends share one server's data and memory. Distinguish a
      connection, a transaction and a query; query stages are work inside the
      backend, not a chain of separate servers.
    heading:
      - title: When a connected request waits
        brief: >-
          Recognise that a borrowed connection can be idle, waiting or executing,
          and that parallel workers are additional participants in some plans.
          Locating an incident's delay needs evidence beyond the process map.
        nested_article:
          topic: PostgreSQL operational diagnosis
          title: Operating and diagnosing PostgreSQL
          brief: >-
            Trace a request through pool and server evidence to distinguish
            blocked work, excessive execution and connection pressure, then test
            a bounded intervention. The parent establishes which processes and
            resources can be involved.
  - title: From SQL to an execution plan
    brief: >-
      Follow the product-price SELECT through parsing and name resolution,
      rewriting, planning and execution to returned rows. Understand that the
      executor follows a chosen plan and that an available primary-key index
      does not require the planner to use it for this tiny table.
    nested_article:
      topic: PostgreSQL query planning
      title: Reading and repairing PostgreSQL plans
      brief: >-
        Interpret native estimates, per-loop counters, buffers and timings, and
        test statistics, access paths and prepared-plan repairs under varied
        inputs. The parent locates planning and execution without repeating the
        general plan-reading method or diagnosing a slow plan.
  - title: Shared buffers
    brief: >-
      Follow a needed table or index page into shared buffers and recognise reuse
      by another backend. Distinguish page identity from a buffer slot, a shared
      hit from a buffer miss, and a miss from a physical drive read. Explain why
      a finite cache sometimes has to reclaim a slot.
    heading:
      - title: Pins, page locks and replacement
        brief: >-
          Understand that a pin prevents a buffer being repurposed while a
          backend uses it, while short content locks protect access to its page.
          These are different from transaction row locks. Give enough of clock
          sweep to explain why replacement is not a perfect least-recently-used
          list; leave settings and incident diagnosis to their owners.
  - title: Heap pages and row addresses
    brief: >-
      Read a heap page as a header, line pointers, free space and tuple data.
      Understand why a page-and-item TID survives movement within the page but
      ctid identifies a physical version, not the product. Keep product_id as
      the logical identity and show where an index's locator lands.
    heading:
      - title: Large values and TOAST
        brief: >-
          Understand how a supported wide value can be compressed or stored in
          associated TOAST rows while its pointer stays in the main tuple.
          Relate row width to page density without treating a logical value as
          bytes that must all fit in the heap tuple.
  - title: Row versions and visibility
    brief: >-
      Follow P7's old and new tuples through an update and commit. An established
      read-only Repeatable Read snapshot still selects 20.00 while a later
      snapshot selects 22.00 from the same shared physical storage. Explain
      creator and replacement metadata, transaction outcome and snapshot
      membership; neither an XID comparison nor non-zero xmax alone establishes
      visibility. Show why uncommitted or aborted new versions are not ordinary
      readers' values.
  - title: From an index entry to a visible row
    brief: >-
      Follow an illustrative B-tree lookup from P7's key to its heap line
      pointer and the tuple visibility check. Understand why finding a matching
      entry is not enough to return a current row. Explain the visibility map's
      page-level proof for an eligible index-only scan without teaching index
      design again.
    nested_article:
      topic: PostgreSQL access methods
      title: PostgreSQL index methods and operators
      brief: >-
        Choose B-tree, hash, GIN, GiST, SP-GiST or BRIN and an operator class from
        the query's operators and data organisation; verify candidates, rechecks
        and write costs. The parent gives the B-tree-to-heap and visibility
        setting, leaving method comparisons to the child.
  - title: Heap-only tuple updates
    brief: >-
      Explain how P7's price update can retain existing ordinary index entries
      when price is not referenced by those indexes and the new tuple fits on
      the same page. Follow the old tuple's link to the new one. Compare an
      index referencing price and insufficient same-page space, so the reader
      can judge why unchanged business identity does not guarantee HOT.
    heading:
      - title: Free space and fillfactor
        brief: >-
          Understand how reserved page space can make HOT more likely while
          increasing the pages needed to hold the same rows. Treat fillfactor
          as a workload trade, not a guarantee or a universal setting.
      - title: Reclaiming old versions
        brief: >-
          Follow an obsolete HOT tuple becoming eligible for pruning and its
          original index target becoming a redirect when appropriate. Recognise
          that cleanup must preserve versions still required, that ordinary
          access can prune, and that reuse does not imply a smaller file.
        nested_article:
          topic: PostgreSQL version maintenance
          title: PostgreSQL vacuum and transaction age
          brief: >-
            Diagnose retained versions, visibility and transaction-age risk
            before choosing vacuum or related interventions. Distinguish reuse,
            bloat and file shrinkage. The parent teaches first visibility, HOT
            and pruning; the child owns horizons, age evidence and maintenance
            procedures.
  - title: The write path and background processes
    brief: >-
      Place the same price update's dirty heap and possible index pages beside
      WAL generation and commit. Locate the WAL writer, background writer,
      checkpointer and autovacuum workers by their different jobs. Preserve the
      write-ahead rule and distinguish a committed version, a durable commit,
      a clean buffer and reclaimed space; none proves the others.
    nested_article:
      topic: PostgreSQL durability and restart
      title: PostgreSQL WAL, checkpoints and durability
      brief: >-
        Interpret WAL progress, checkpoint work and commit settings against a
        tested durability promise, including a bounded crash drill and restart
        evidence. The parent places those processes in the physical write path;
        the general storage article owns the mechanism and failure distinctions.
