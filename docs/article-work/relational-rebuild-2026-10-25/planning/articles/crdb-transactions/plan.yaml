topic: CockroachDB transaction execution
title: CockroachDB transactions and retries
brief: >-
  Explain how intents and recoverable transaction state give one purchase an
  atomic outcome across ranges. Handle CockroachDB v26.2 Serializable retry
  errors and ambiguous results while preserving one logical request and keeping
  external effects outside replayed work. General invariant design, request
  recovery and read-isolation choices remain with their existing articles.
heading:
  - title: Write intents and transaction records
    brief: >-
      Follow the independent order-103 replay from stock P3 12 and P7 1 to
      provisional stock, order and line writes. Distinguish a replicated intent
      from a committed value, and the native transaction record from the
      application's purchase-request row. Make visible how another operation
      finds the transaction's status rather than accepting unfinished stock work.
  - title: Parallel Commits and intent resolution
    brief: >-
      Understand the evidence that makes the purchase committed: a STAGING record
      plus successful listed writes can prove commitment; STAGING alone cannot.
      Separate that outcome and its successful reply from later COMMITTED marking
      and intent resolution. Explain why a later reader can respect the purchase
      before every provisional marker has been removed, including if its
      coordinator disappears. Use a documented protocol model, not a measured
      multi-node trace or a fixed latency promise.
  - title: Why Serializable transactions need retries
    brief: >-
      Relate competing work to a timestamp push, read refresh and a possible
      restart. Distinguish successful refresh from re-executing SQL. Explain why
      an interactive purchase whose decisions depend on returned rows still needs
      client handling even though CockroachDB can retry suitable buffered
      statements or batches automatically. Identify SQLSTATE 40001 and recognise
      that the failure can surface when committing.
  - title: Retry the complete purchase
    brief: >-
      Use one bounded transaction function that rolls back a known retryable
      failure, begins a fresh attempt, repeats its reads and decisions, and checks
      commit before returning success. Keep customer 1's purchase-103 and canonical basket
      outside the loop; keep the unique request claim, guarded stock changes,
      pending order and retained result together inside it. Discard attempt-local
      answers. A stock refusal and a payload mismatch are different from 40001.
      Provider calls must stay outside replayed work; link to the existing outbox
      procedure when durable external work is required.
    heading:
      - title: Retry savepoints
        brief: >-
          Recognise the alternative used by some drivers and libraries:
          cockroach_restart is an outer retry savepoint established before data
          work; rollback to it still requires replaying the complete operation.
          RELEASE SAVEPOINT attempts commitment and can itself require a retry;
          after successful release, COMMIT clears the connection. Distinguish it
          from an ordinary purchase-work savepoint.
  - title: Recover an ambiguous result
    brief: >-
      Map SQLSTATE 40003 and a lost commit reply to an unknown outcome, rather
      than a known abort. Recover through the existing unique-request protocol
      with the same identity and payload on a usable connection. Recovering
      accepted order 103 leaves stock P3 10 and P7 0, two lines worth 29.00 and
      no payment. An absent observation or an expired waiting budget does not
      authorise a second purchase. Compare the native retry, ambiguity, business
      result and persistent-error branches without repeating the general protocol.
