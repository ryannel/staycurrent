topic: CockroachDB regional placement
title: CockroachDB table locality and region survival
brief: >-
  Choose REGIONAL BY TABLE, REGIONAL BY ROW or GLOBAL from the requests a table
  serves, and choose the database survival goal from the failures those requests
  must survive. Verify declared policy, actual replica placement and application
  behaviour without treating a structural model or local process test as measured
  regional latency. General quorum derivation belongs to Regional placement and
  survival; query tuning and cluster maintenance retain their existing owners.
heading:
  - title: Database regions and home regions
    brief: >-
      Distinguish node locality, database regions, the database primary region and
      a table or row's home region. Follow a request from its SQL gateway to the
      relevant range leaseholder; choosing a primary region does not make that
      region the sole SQL entry point or keep every copy there.
  - title: Regional by table
    brief: >-
      Understand why REGIONAL BY TABLE suits data usually read and changed from
      one region, including the default home in the primary region and an explicit
      alternative. Use the independent shop placement with products homed in West
      to make the cost of access from North visible; a home region is an access
      policy, not an exclusive storage boundary.
  - title: Regional by row
    brief: >-
      Understand how one SQL table can home different rows in different regions
      through crdb_region and automatically partition its indexes. Judge whether
      the application's routing and row ownership supply the intended locality,
      rather than assuming that a customer's location or every later request
      determines the row's home.
    heading:
      - title: Choosing a row's home region
        brief: >-
          Follow the independent order-copy scenario with orders 101 and 103 in
          North and 102 in West. Understand the gateway-based insert default,
          explicit assignment and changing crdb_region; related order lines need a
          deliberate matching choice. Do not present automatic rehoming or foreign
          key inference as default behaviour.
      - title: The work that remains remote
        brief: >-
          See why a local order lookup can be fast while a purchase still needs
          West's stock authority, reference checks and global uniqueness checks.
          Preserve globally meaningful order_id when explaining implicit regional
          partitioning; explicitly adding region to a unique key changes its
          scope. Establish the native consequences without reproducing the query
          performance article's plan-tuning procedures.
  - title: Global tables
    brief: >-
      Judge GLOBAL for reference data read from all regions when higher write
      latency is acceptable. Use a separate illustrative order_statuses table of
      the three existing statuses to explain up-to-date nearby reads and the
      write-side wait that makes them possible; this does not make stock
      allocation local or choose the survival goal. Detailed read protocols belong
      to CockroachDB isolation and follower reads.
  - title: Surviving a region failure
    brief: >-
      Distinguish the default database-wide zone survival goal from SURVIVE REGION
      FAILURE and its requirement for at least three database regions. Apply the
      already learned quorum test to the native regional-table voting layouts:
      three home-region voters versus a five-voter, two–two–one regional layout.
      See the remote acknowledgement required by region survival while keeping
      non-voters separate from the quorum count.
    heading:
      - title: What the survival goal promises
        brief: >-
          Understand why losing a region can leave the configured majority and
          still involve detection, lease or leadership changes, request rerouting
          and reduced capacity. A surviving database does not restore a vanished
          application endpoint or promise an unchanged latency; GLOBAL and home
          region choices do not substitute for the database survival goal.
  - title: Checking policy and placement
    brief: >-
      Connect SHOW REGIONS and SHOW CREATE output to the intended database and
      table policy, explicit row-region values and index partitions. Then use
      SHOW RANGES with details to locate actual leaseholders, voting replicas and
      non-voters after convergence, covering the relevant indexes as well as base
      rows. Distinguish desired configuration, observed placement and measured
      request behaviour before declaring a requirement satisfied.
  - title: Testing the complete request
    brief: >-
      Turn the shop's access and failure requirements into healthy and degraded
      checks from surviving gateways, including all purchase participants. Know
      what a controlled region-loss experiment must establish and what evidence
      a local labelled-node fixture cannot supply. Measure representative request
      latency in the intended topology; health repair and planned node removal
      belong to Operating and securing a CockroachDB cluster.
