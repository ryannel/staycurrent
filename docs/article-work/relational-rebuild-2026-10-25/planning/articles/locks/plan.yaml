topic: Relational lock protocols
title: Locks, contention and deadlocks
brief: >-
  Choose a lockable authority and a sound isolation and snapshot protocol for a
  decision. Design lock scope and acquisition order, diagnose deadlocks and bound
  waiting without weakening the invariant. Transactions and isolation owns the
  isolation foundations; incident diagnosis owns whether blocking explains a
  request symptom, and capacity owns admission and queuing.
heading:
  - title: What waits for a lock
    brief: >-
      Understand which competing operations must wait and when the holder releases
      them. Revisit the last P7 mug only far enough to distinguish a guarded write,
      an explicit locking read and an ordinary snapshot read. Make the holder,
      waiter and transaction end visible.
  - title: Choose the row that governs the decision
    brief: >-
      Understand why locking existing payment rows cannot protect the absence of
      another payment. Use order 103, worth 29.00 with no payments, and two attempted
      payments of 20.00 to choose its order row as their common authority. Every
      mutation that can change the payment limit must follow the same protocol.
    heading:
      - title: Locking rows does not lock a condition
        brief: >-
          Distinguish protecting the returned rows from preventing a future insert
          or protecting an aggregate. Judge when a constraint, a stable parent row
          or a different serialisation protocol supplies the missing authority.
  - title: Read the decision after acquiring the lock
    brief: >-
      Follow a complete payment protocol: acquire the order lock, read the total,
      decide, write and commit while retaining the authority. At PostgreSQL Read
      Committed, use a separate statement for the decision read after the lock
      returns, so the second attempt sees the first payment and refuses 40.00.
    heading:
      - title: A lock does not refresh a snapshot
        brief: >-
          Understand why an unchanged guard row can serialise lock ownership while
          a Repeatable Read decision still uses an earlier snapshot. Recognise
          that combining the lock and aggregate into one Read Committed statement
          also lacks the promised later snapshot. Choose a protocol whose
          visibility and conflict behaviour support its decision; the parent owns
          the general comparison of isolation levels.
  - title: Choose lock scope and strength
    brief: >-
      Choose the smallest authority that covers the invariant and the conflict
      strength the operation needs. Distinguish row locks from table locks and
      application-defined advisory locks. Understand why broader locks or a
      shared guard can make independent requests contend, and why weaker locks
      must still exclude every invalidating operation.
    heading:
      - title: Keep the protected work short
        brief: >-
          Shorten the interval from acquisition to transaction end without moving
          the decision outside it. Keep user input and remote calls outside that
          interval. Recognise that an idle transaction can remain the holder;
          changing the business unit of serialisation requires a new proof of the
          invariant, while admission policy belongs to capacity.
  - title: How a deadlock forms
    brief: >-
      Distinguish a wait chain that can advance from a cycle that cannot. Use a
      separate P3/P7 lock-only schedule: each transaction holds one product and
      requests the other. Understand victim abort and the need to restart complete
      aborted work; detailed retry and uncertain-outcome recovery belong to their
      existing owner.
    heading:
      - title: Acquire locks in a consistent order
        brief: >-
          Break the cycle by giving all paths the same resource order, including
          less frequent paths and implicit locks. Acquire the required strength
          early enough to avoid competing upgrades. Do not infer acquisition order
          from an unordered set of keys or rely on a predictable deadlock victim.
  - title: Follow the waiter to the blocker
    brief: >-
      Reconstruct who holds and requests each resource, follow a chain to its
      blocking transaction and distinguish prolonged contention from a deadlock.
      Relate transaction age, idle state and the deadlock report to the protocol
      that needs repair. PostgreSQL monitoring and intervention procedures belong
      to its operations article; symptom-to-cause triage belongs to incidents.
  - title: Put a bound on waiting
    brief: >-
      Choose waiting, immediate refusal or skipping only when its result still
      serves the operation. Distinguish a per-lock wait limit from a statement or
      request deadline, and handle failure by ending the failed work cleanly.
      Skipping a busy authority cannot establish that a payment is safe; queue
      consumers may have different selection semantics. Deadlock detection timing
      is not a general waiting deadline.
  - title: Sources and further reading
    brief: >-
      Supply primary documentation for the stated engine behaviour and contextual
      reading for isolation, retry recovery, incident diagnosis and capacity.
