topic: PostgreSQL physical replication
title: PostgreSQL physical replicas and promotion
brief: >-
  Operate a PostgreSQL physical standby by separating WAL receipt, writing,
  durable flush and replay. Choose synchronous commit promises and retention
  policies, promote a fenced candidate with an explicit loss boundary, and
  return the former primary safely. Use the independent P7 price change from
  20.00 to 22.00; general read routing and fencing are prerequisites, while
  selective row streams and recovery to a past target belong to neighbours.
heading:
  - title: A standby follows the cluster's WAL
    brief: >-
      Follow the price change from the primary's WAL sender through the
      standby's WAL receiver and recovery process. Understand why a physical
      standby needs a compatible base copy and continuous WAL, copies the
      cluster rather than selected tables, and can accept read-only queries
      during recovery.
    heading:
      - title: Create a streaming standby
        brief: >-
          Establish one workable setup with compatible PostgreSQL versions,
          replication access, sender capacity, a full pg_basebackup and
          standby configuration. Understand what standby.signal,
          primary_conninfo and a deliberately owned physical slot do, and
          verify the actual upstream, recovery role and read-only service
          before treating the copy as ready. Backup-chain design remains
          with Restoring PostgreSQL to a recovery target.
  - title: Written, flushed and replayed WAL
    brief: >-
      Relate the prerequisite's progress stages to pg_stat_replication and
      pg_stat_wal_receiver. Use the price change to distinguish a stored
      commit from one visible to a new snapshot; a receive function's name
      alone does not define its persistence guarantee.
    heading:
      - title: Read the progress evidence
        brief: >-
          Locate a gap using sent_lsn, write_lsn, flush_lsn and replay_lsn,
          receiver evidence and compatible-history byte differences.
          Understand that pg_last_wal_receive_lsn already includes sync to
          disk, sender reports can lag, and recent lag intervals or an idle
          transaction timestamp do not predict catch-up time.
      - title: Check the copy that will answer
        brief: >-
          Apply a bounded replay-position check to the exact standby and
          establish the read snapshot afterwards. Distinguish a conservative
          post-commit WAL requirement from the transaction's exact commit
          record; carry history identity and reject unqualified comparisons
          after promotion. General routing and fallback choices remain with
          Replicas, lag and read routing.
  - title: What synchronous commit waits for
    brief: >-
      Choose the promise made by a successful write using both
      synchronous_standby_names and synchronous_commit. Separate local
      durability, standby filesystem writes, durable standby WAL and replay;
      a durable copy need not yet return 22.00, and an arbitrary other copy
      inherits none of its promise.
    heading:
      - title: Choose the required standbys
        brief: >-
          Understand application_name matching and FIRST versus ANY through
          a small A/B example. Relate each acknowledgement set to eligible
          promotion candidates without confusing acknowledgement counts
          with leader election or assuming every listed standby holds
          every acknowledged commit.
      - title: When acknowledgements cannot arrive
        brief: >-
          Judge the latency and write-availability cost of a required
          standby that disconnects or stops replaying. Understand how local
          and off change the promise, why on alone enables no remote wait
          when synchronous_standby_names is empty, and why a missing reply
          does not establish that the transaction aborted.
  - title: Keep the standby able to recover
    brief: >-
      Maintain both the WAL needed to resume and enough replay capacity to
      remain a useful candidate. Choose explicitly between retention cost,
      query completion and standby readiness rather than treating a
      connected receiver as sufficient protection.
    heading:
      - title: Slots, archives and missing WAL
        brief: >-
          Use physical-slot restart_lsn, availability state and storage
          headroom to judge retention risk. Explain wal_keep_size and
          max_slot_wal_keep_size, including the loss of resumability at a
          limit. Recover a missing segment from a usable archive or rebuild
          from a fresh base copy; remove an abandoned slot only after
          deciding its consumer's future.
      - title: Queries that delay recovery
        brief: >-
          Explain a recovery conflict using an existing report snapshot.
          Choose standby delay and hot_standby_feedback policy from the
          copy's reporting or failover purpose. Distinguish a replay-delay
          budget from a per-query timeout, and explain feedback's upstream
          tuple-retention cost and its inability to prevent every conflict.
  - title: Choose the history to promote
    brief: >-
      Use native role, timeline and recoverable-WAL evidence to choose a
      candidate. Relate its surviving prefix to the actual commit promise,
      including A durable before replay and B missing the confirmed edit.
      State known or possible loss; do not infer an incident boundary from
      a stale lag sample.
    heading:
      - title: Switchover with a known boundary
        brief: >-
          Explain how stopped write admission, drained work, a final WAL
          boundary and confirmed exclusion of the old primary allow a
          planned handover to establish what must survive. Keep restart
          exclusion in force while the candidate catches up; an emergency
          failover may lack that final source evidence.
  - title: Promote and verify the new primary
    brief: >-
      Apply the established fencing protocol before pg_ctl promote or
      pg_promote. Understand completion evidence and the recovery of
      locally available WAL, then verify this server's role, timeline and
      expected shop facts before admitting writes and replacing old pool
      connections. PostgreSQL's promotion command supplies neither fencing
      nor automatic failure detection; general authority and reconciliation
      methods remain with Failover and fencing.
  - title: Return the former primary as a standby
    brief: >-
      Preserve divergent evidence before replacing state. Choose pg_rewind
      when its common-history, WAL, checksum or wal_log_hints, and
      full_page_writes prerequisites hold; otherwise take a fresh base
      copy. Rewind follows the chosen history and does not merge omitted
      operations.
    heading:
      - title: Verify the restored protection
        brief: >-
          Configure the returning copy for recovery before starting it,
          check its upstream and timeline, and verify streaming, flush and
          replay. Re-establish slots and synchronous policy deliberately,
          then confirm redundancy and caller routing as part of the whole
          handover. Distinguish a successful promotion from restored
          protection and rehearse both.
