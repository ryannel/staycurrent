topic: CockroachDB cluster version evolution
title: Upgrading a CockroachDB cluster
brief: >-
  Rehearse a supported self-hosted upgrade and judge when to continue, stop,
  return to the previous binaries or use recovery. Distinguish each node's
  binary from the active cluster version and finalisation. Own native rollout
  and return eligibility; application schema jobs, cross-system migration and
  full restore/reconciliation procedures remain with their existing owners.
heading:
  - title: Binaries and cluster version
    brief: >-
      Follow three nodes from v26.1.8 to v26.2.8. Understand why mixed binaries,
      all-new binaries held at cluster version 26.1, and finalised version 26.2
      are different states. A gateway's version is not a cluster inventory;
      an old cluster version does not suppress every binary-level change.
  - title: Prepare the upgrade and its return path
    brief: >-
      Establish the supported release path, relevant release changes, healthy
      ranges, routing, resource margin and a tested compatible recovery copy.
      Choose and verify an explicit finalisation policy before restarting any
      node. Use the operations and cluster-change prerequisites for their
      detailed health, draining and capacity methods.
  - title: Restart one node at a time
    brief: >-
      Preserve the node's identity and store through an orderly temporary stop,
      binary replacement and restart. Use rejoin, build, SQL readiness, range
      health and useful application completion to decide whether the next node
      may stop. Explain why a responsive gateway or elapsed wait alone cannot
      establish that checkpoint.
  - title: Test while the old cluster version is held
    brief: >-
      Verify every node is on the intended binary while the cluster remains at
      26.1. Check the shop's reads, guarded writes, reconnect/retry paths and
      allowed and forbidden access through deployed clients. Use release notes
      to separate changes testable now from those requiring finalisation;
      passing tests now cannot establish the latter.
  - title: Return to the previous binaries
    brief: >-
      Rehearse the supported rolling return while finalisation has never begun
      and the old cluster version is deliberately retained. Keep the separate
      P7 catalogue change from 20.00 to 22.00 across this return: replacing
      software does not undo committed business writes. Verify builds, health
      and application behaviour again.
  - title: Finalise the cluster version
    brief: >-
      Make the separate decision to begin irreversible internal migrations once
      all nodes and acceptance evidence qualify. Observe migration jobs and
      the active version through completion, then test finalisation-dependent
      behaviour. The return boundary closes when finalisation begins, even
      while SHOW CLUSTER SETTING version still reports the previous version.
  - title: When the upgrade cannot continue
    brief: >-
      Distinguish a failed node restart, a held upgrade with an eligible binary
      return, and stalled or completed finalisation. Preserve evidence and
      repair the identified blocker; do not force an older binary onto an
      advanced store. Recovery needs a compatible earlier backup, one write
      authority and reconciliation of later valid work; the backup article
      owns the working procedure.
  - title: Patch upgrades and future releases
    brief: >-
      Apply the same rolling health and application checks to a patch change
      without inventing a separate major-version finalisation step. Recheck
      the documented source/target path, release notes, settings and return
      rules for each future upgrade; this rehearsal establishes one bounded
      transition, not a universal version-skipping policy.
