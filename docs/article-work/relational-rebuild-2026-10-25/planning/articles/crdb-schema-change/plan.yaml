topic: CockroachDB schema evolution
title: CockroachDB schema jobs under load
brief: >-
  Treat CockroachDB schema changes as observable jobs within an application
  compatibility protocol. Follow an online index build, distinguish progress,
  cancellation, reversion and later cleanup, and accept a price backfill or unique
  index from its data and caller contract. General expand, migrate and contract
  belongs in Live schema changes and backfills; index selection and binary
  upgrades remain with their existing owners.
heading:
  - title: A schema job and an application migration
    brief: >-
      Understand which work CockroachDB performs and which work the application
      still owns. Reuse the price-to-hundredths migration: adding its column does
      not convert the business representation, deploy bridge writers or authorise
      new reads. Keep DDL steps separate from application data transactions and
      inspect actual outcomes when a migration tool reports an error.
  - title: Building an index while writes continue
    brief: >-
      Explain why an index needs entries for existing rows and ongoing writes
      before readers can use it. Make the evolving row and index entries visible,
      including an insert or update during the build. Distinguish CockroachDB's
      internal schema transitions from compatibility between application releases;
      online execution still consumes processor, storage and network resources.
  - title: Follow the job you started
    brief: >-
      Connect the submitted statement to its job ID and read native job evidence:
      identity, status, running phase, progress and errors. Distinguish a retrying
      job from terminal failure, and completed engine work from accepted application
      behaviour. A percentage or an absent waiting client cannot establish either.
  - title: Pause, cancel and allow cleanup
    brief: >-
      Choose between waiting, pausing and abandoning a change using foreground
      service health and available headroom. Distinguish cancelling the waiting
      statement from controlling its job, requested transitions from observed
      states, and reversion from later garbage collection. Preserve compatible
      callers while work is paused; recognise cancellation restrictions and
      reversion failure without treating cancellation as a universal undo.
  - title: A unique index can fail for the right reason
    brief: >-
      Apply an explicit policy to the optional loyalty-code scenario: assigned
      codes are unique and several unassigned NULL values are allowed. Follow a
      duplicate through build failure, cleanup, an agreed data correction and a
      new build. A preflight duplicate query cannot reserve the rule against later
      writes; verify successful enforcement and caller handling before depending
      on it.
  - title: Accept the change before retiring the old form
    brief: >-
      Combine terminal job evidence, the intended schema and semantic checks.
      For prices, verify complete and exact agreement with price times 100 under
      the continuing bridge rule, including the separate 22.00/2200 update. For
      loyalty codes, verify the intended key and NULL policy with accepted and
      rejected writes. Switch callers only after those checks; retire old fields
      and dependencies at the agreed return boundary, allowing for physical
      cleanup that can outlast logical removal.
