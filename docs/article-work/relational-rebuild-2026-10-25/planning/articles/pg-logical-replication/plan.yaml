topic: PostgreSQL row-change streams
title: PostgreSQL logical replication and change feeds
brief: >-
  Configure and operate a PostgreSQL publication and subscription with deliberate
  row identity, initial synchronisation and schema compatibility. Follow selected
  changes into a separate database, diagnose stopped application and retained WAL,
  and judge what a change-feed consumer must preserve to resume safely. Physical
  standby operation belongs to PostgreSQL physical replicas and promotion;
  application delivery contracts belong to Outboxes and database-backed jobs;
  full migration acceptance and write handover belong to Upgrading and migrating
  PostgreSQL.
heading:
  - title: From WAL to a changed row
    brief: >-
      Follow the independent P7 catalogue-price change from 20.00 to 22.00 through
      logical decoding, pgoutput and the subscriber's apply worker. Understand why
      the target identifies a row by a key and stores its own tuples and indexes,
      rather than replaying the publisher's heap addresses.
    heading:
      - title: Publications, subscriptions and slots
        brief: >-
          Distinguish the selected changes, the subscriber's connection and apply
          configuration, and the publisher's retained restart position. Recognise
          one database's stream and one subscription's transactional order;
          unrelated subscriptions do not establish a shared application boundary.
      - title: What the copied price means
        brief: >-
          See the publisher commit before a later subscriber read can return
          22.00. The logical copy can lag and carries only selected facts. Order
          103 stays pending with no payment and an agreed line total of 29.00;
          neither physical standby readiness nor a backup follows from this copy.

  - title: Replica identity
    brief: >-
      Understand what lets an UPDATE or DELETE find its earlier target row.
      Choose identity before publishing changing tables; distinguish a stable
      product_id from a physical tuple address or the price being changed.
    heading:
      - title: The primary key and the old key
        brief: >-
          Use products.product_id as the default identity and understand why
          identifying the old row is necessary even when a key itself changes.
          Recognise when a qualifying unique index can be chosen instead.
      - title: Tables without a suitable key
        brief: >-
          Distinguish insert-only use from publishing updates and deletes without
          identity, which can reject those writes on the publisher. Judge FULL
          as a fallback with larger old-row information and potentially expensive
          subscriber searches, rather than a universal repair.

  - title: Create a publication and subscription
    brief: >-
      Establish a small, one-way PostgreSQL 18 products copy whose application
      writes stay on the publisher. Understand which preparation and commands
      belong on each server and what evidence makes the result usable.
    heading:
      - title: Prepare both databases
        brief: >-
          Provide logical WAL and capacity for senders, slots and apply and
          synchronisation workers; create compatible, correctly named target
          tables before subscribing. Recognise the replication connection,
          initial-copy SELECT and subscriber ownership privileges required, and
          why publication selection is not an access-control boundary.
      - title: Copy existing rows, then follow changes
        brief: >-
          Create the products publication and subscription with the normal
          initial copy. Follow a consistent table snapshot and changes made
          during copying until the table enters normal replication. Distinguish
          command success, completed copy and ready tables; several tables do
          not all become usable merely because one has finished.
      - title: Starting from an existing copy
        brief: >-
          Recognise that copy_data=false skips copying rather than proving
          alignment. A preloaded target needs a coordinated snapshot and stream
          boundary; an arbitrary dump followed by a newly created slot can miss
          changes. Keep the ordinary initial-copy path as the working example.

  - title: Choose which changes to publish
    brief: >-
      Define a deliberate row and column contract instead of assuming a
      publication reproduces a database. Keep replica identity available in the
      selected data and account for both initial copying and later operations.
    heading:
      - title: Tables, columns and operations
        brief: >-
          Judge a catalogue projection of product_id, name and price without
          stock. Distinguish selecting columns from selecting INSERT, UPDATE,
          DELETE and TRUNCATE operations; operation selection does not restrict
          the initial copy, and TRUNCATE is not a row-by-row filtered delete.
      - title: Row filters and changing membership
        brief: >-
          Understand filters on old and new rows: a publisher UPDATE can arrive
          as an INSERT or DELETE when a row enters or leaves the selection.
          Relate permitted filter columns to replica identity. Recognise that
          overlapping publications combine row filters and that changing a
          filter does not automatically rebuild existing target contents.
      - title: Adding another table
        brief: >-
          Coordinate target schema, publication membership and subscription
          refresh, then check the new table's synchronisation. Do not infer that
          adding a table to the publication alone has copied its existing rows.

  - title: Keep the subscriber compatible
    brief: >-
      Account for state that the row stream does not carry and for local apply
      behaviour. Understand why a subscription can be healthy today yet stop at
      the next schema or permission change.
    heading:
      - title: Schema changes on two servers
        brief: >-
          Apply a sufficient additive target change before the publisher starts
          sending the new column, and distinguish this from general permission
          to reorder arbitrary DDL. Match names and convertible types, maintain
          compatible constraints, and recognise that DDL is not replicated.
      - title: Sequences and other missing state
        brief: >-
          Distinguish replicated values in identity columns from their unreplicated
          sequence state. Account for roles, object definitions and large objects
          when judging completeness; the products-only example creates no order
          sequence. Full migration inventory and acceptance belong to Upgrading
          and migrating PostgreSQL.
      - title: Constraints and triggers during apply
        brief: >-
          Recognise that apply uses replica trigger behaviour, so ordinary triggers
          and foreign-key enforcement must not be assumed to replay application
          behaviour. Keep local writes away from replicated tables; they can be
          overwritten, cause errors or leave undetected divergence. Treat
          TRUNCATE across related tables as a subscription-boundary decision.

  - title: Replication progress and retained WAL
    brief: >-
      Decide whether the copy is starting, moving, blocked or unable to resume.
      Connect a stale P7 price with publisher resource retention, rather than
      treating lag as a single time counter.
    heading:
      - title: Received, applied and visible
        brief: >-
          Combine table readiness, subscription worker state, error evidence,
          replication-origin progress and a fresh target read. Distinguish source
          receipt from applied transactions and an already-open reader's snapshot;
          message timestamps alone do not measure business freshness.
      - title: What a slot keeps
        brief: >-
          Distinguish confirmed_flush_lsn from restart_lsn, the oldest WAL still
          required. Understand why an inactive slot can keep WAL and catalogue
          history, and why retained bytes are not the same as selected change-feed
          bytes or a promise about catch-up time.
      - title: Bound the cost of a stopped consumer
        brief: >-
          Monitor retained WAL, free storage, inactivity, safe_wal_size and slot
          validity together. Judge retention limits and idle expiry as a trade
          between publisher protection and losing the ability to resume, with an
          explicit reinitialisation plan.

  - title: Repair a stopped subscription
    brief: >-
      Diagnose the reason before restarting or discarding progress. Distinguish a
      recoverable apply error from missing history and restore a known contract
      between the source, target and slot.
    heading:
      - title: Schema errors and conflicting rows
        brief: >-
          Use the subscriber log and error counters to locate the failing
          transaction, repair incompatible schema or conflicting target data,
          and verify resumed application. Understand that some conflicts stop
          apply while missing UPDATE or DELETE targets can be skipped.
      - title: Skipping and resynchronising
        brief: >-
          Judge a transaction skip by the facts it omits, not merely by whether
          the worker starts again. A lost slot or invalid initial alignment needs
          deliberate reinitialisation and reconciliation; creating a replacement
          slot cannot recreate changes that are no longer available.
      - title: Pause and retire deliberately
        brief: >-
          Distinguish disabling a subscription from releasing its publisher
          resources. Retire both subscription and remote slots, accounting for
          an unreachable publisher and temporary table-sync slots, and verify
          cleanup before considering the consumer removed.

  - title: Using the stream as a change feed
    brief: >-
      Distinguish PostgreSQL's built-in table subscriber from a logical-decoding
      consumer maintaining a projection or transporting outbox rows. Identify the
      snapshot, transaction, restart and acknowledgement contract that consumer
      must provide, without assuming a connector or an external effect exists.
    heading:
      - title: Restart after a consumer failure
        brief: >-
          Follow a consumer that applies a change and stops before recording its
          restart position; then reverse the order to expose omission. Understand
          redelivery after recovery and the need to coordinate durable effects
          with acknowledged progress. Native subscriber progress tracking does
          not provide the same atomicity for an external service.
      - title: Row changes and application intentions
        brief: >-
          Distinguish a changed products row from the explicit order-103-ack
          intention. A feed can carry an outbox record but does not infer that
          intention from arbitrary table changes or establish one external effect.
          Outboxes and database-backed jobs owns stable work identity, receiver
          deduplication, delivery ordering and recovery of external outcomes.

  - title: Changing the publisher or the write authority
    brief: >-
      Recognise two different transitions: continuing an existing feed after its
      publisher fails, and making a logical subscriber the application's writer.
      Establish the native replication evidence each needs without replacing the
      neighbouring promotion and migration procedures.
    heading:
      - title: Continue after publisher failover
        brief: >-
          Understand that promoting a physical standby does not by itself preserve
          logical restart state. Account for failover-enabled logical slots,
          synchronisation and verified readiness on the intended standby before
          reconnecting consumers. Physical promotion, fencing and former-primary
          return remain with PostgreSQL physical replicas and promotion.
      - title: Hand the copy to a migration
        brief: >-
          Supply evidence of ready tables, application through the final source
          boundary, compatible schema and deliberate sequence preparation. A
          caught-up product or zero reported lag alone cannot authorise target
          writes. Upgrading and migrating PostgreSQL owns fencing and draining
          source writers, full acceptance, write handover and the return boundary.
