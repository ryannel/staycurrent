topic: CockroachDB performance
title: CockroachDB query work and hot ranges
brief: >-
  Follow SQL work through index keys, KV requests and distributed execution, then
  use native CockroachDB v26.2 evidence to distinguish an expensive access path,
  concentrated range load and contention on one key. Choose covering or distributed
  keys by the work they remove and the write and ordering costs they introduce.
  General operator repair belongs to Query execution and performance; regional
  placement policy and cluster-health procedures remain with their existing owners.
heading:
  - title: SQL work and KV work
    brief: >-
      Follow the shop's customer-history read from a SQL gateway through a
      customer-leading secondary index to primary-index rows. Understand why
      result rows, searched key spans, range owners and requests are different
      quantities. Build on Inside CockroachDB's range model without repeating
      its replication explanation.
  - title: Covering indexes and index joins
    brief: >-
      Derive the ordered history key and the status value it lacks. Understand
      how STORING (status) can remove primary-index fetches without changing the
      search interval, and weigh the additional maintained data. Distinguish
      CockroachDB's index join from a lookup join between tables; retain the
      requested ORDER BY and tie-breaker.
  - title: Reading EXPLAIN ANALYZE
    brief: >-
      Read one native history-query comparison to locate bounds, estimates,
      emitted rows, KV rows and bytes, RPCs, SQL/KV CPU work and waiting. Distinguish
      EXPLAIN's proposal from EXPLAIN ANALYZE's execution. Interpret cumulative
      measurements on their own basis rather than adding them into elapsed time;
      relate changed estimates or statistics to a concrete route choice.
    heading:
      - title: Where the delay occurs
        brief: >-
          Separate useful execution from reported contention and admission waits,
          and compare the statement with the application's request boundary.
          Use the existing incident and capacity articles when the delay is
          outside this access path.
  - title: Distributed execution and fan-out
    brief: >-
      Use a DistSQL plan to distinguish the nodes processing SQL from the nodes
      supplying KV data: local SQL execution can still fetch remotely. Follow
      the existing paid-order report through its scans, lookups and exchanges to
      judge where rows and bytes move, where inputs shrink and where skew leaves
      one required participant busy. General join and aggregation analysis stays
      with Query execution and performance; locality policy stays with its owner.
  - title: Finding the hot range
    brief: >-
      Connect a busy node and the affected statements to a range, index and key
      interval using matching observation windows. Combine native range-demand
      evidence with utilisation, SHOW RANGES and the schema; a placement snapshot
      alone measures neither load nor contention. Distinguish a moving index edge,
      a busy prefix and repeated access to one row before choosing a repair.
  - title: Sequential keys and hash-sharded indexes
    brief: >-
      Understand why increasing keys keep new writes at an index edge after
      splits, including in a secondary index despite a dispersed primary key.
      Compare customer-leading order, dispersed identifiers and hash-sharded
      indexes by the demand they can separate. Explain the added bucket searches
      and combination needed by ordered range reads; judge the whole index set
      rather than treating more shards as an automatic improvement.
  - title: Contention on one row
    brief: >-
      Use an independent P7 stock-contention scenario to connect native waiting
      and blocking transactions to the same key. Understand why hashing, splitting
      or adding nodes cannot create independent authority over that stock value.
      Reduce avoidable work and time inside the protected transaction while
      preserving its guards; native retry mechanics remain with CockroachDB
      transactions and retries. Historical-read choices remain with the read article.
  - title: Testing the repair against the workload
    brief: >-
      Accept a change only after equivalent results and predicted work changes
      survive common and rare customers, narrow and broad requests, and competing
      writes. Compare latency, throughput, resource use and contention as well as
      the plan, retaining version, topology, data and settings. Distinguish
      illustrative placement and workload models from native observations;
      a single-node run cannot establish distribution or regional performance.
