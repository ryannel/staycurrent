topic: PostgreSQL specialised types and extension lifecycle
title: Types and extensions in PostgreSQL
brief: >-
  Choose types, operators and index support that preserve the meaning of overlap
  and spatial questions. Install extensions with deliberate authority, then keep
  their software, objects and application dependencies recoverable through
  restore, update and removal. Use the established room reservations; keep spatial
  probes separate from shop facts. General access methods, integrity theory,
  roles, recovery and major-server migration remain with their existing owners.
heading:
  - title: Ranges, bounds and overlap
    brief: >-
      Express a reservation as a tstzrange and distinguish overlap, containment
      and adjacency. Reuse R1's 7001 and independent attempts 7002 and 7003 with
      their established UTC times and half-open bounds; the type's operators must
      preserve that boundary policy.
    heading:
      - title: Combining room equality with time overlap
        brief: >-
          Understand why the built-in range class needs btree_gist's text equality
          class for the established same-room exclusion. Distinguish finding an
          overlap from enforcing non-overlap. Keep the complete integrity argument
          in Constraints and data integrity and GiST mechanics in the index article.
  - title: Spatial types and predicates
    brief: >-
      Choose PostgreSQL's built-in geometric types for simple Cartesian questions
      or PostGIS when
      coordinate systems and geographic operations require it. Distinguish
      geometry's coordinate-system units from geography's Earth-distance model;
      an SRID label does not transform coordinates.
    heading:
      - title: Finding points within a distance
        brief: >-
          Follow a small mathematical example from a bounding-box candidate to
          ST_DWithin's distance test. Match the stored type, query expression and
          GiST support; a box match is insufficient and an index is no promise of
          use or speed. Use labelled coordinate units, not invented shop locations.
  - title: Installing an extension
    brief: >-
      Distinguish supporting software on the server from CREATE EXTENSION in one
      database. Inspect available and installed versions, dependencies and schema
      requirements before choosing a deliberate installation version.
    heading:
      - title: Installation authority and application access
        brief: >-
          Separate privileged software provision, extension installation and
          ordinary use. Explain trusted-extension eligibility, ownership and
          protected installation schemas through btree_gist without giving runtime
          migration authority. Apply the established role and search-path model.
  - title: Extension objects and application dependencies
    brief: >-
      Follow the reservation rule through its exclusion index and operator class
      to btree_gist. Distinguish extension members, declared prerequisite
      extensions and application objects that use them. Catalogue dependencies
      protect recorded relationships; application SQL and dynamic code still need
      an explicit inventory.
  - title: Restoring extension data and behaviour
    brief: >-
      Understand why a logical dump recreates extension membership through
      installation rather than carrying its software and every member definition.
      Provision a compatible target and verify restored values, predicates,
      constraints and caller access, not only rows or an extension name.
    heading:
      - title: The extension in the recovery contract
        brief: >-
          Retain compatible libraries, scripts, required configuration and external
          dependencies for recovery and standby targets. Recognise registered
          configuration data and undumped member edits as special cases. General
          backup chains and restore commands stay in the recovery articles.
  - title: Updating extension software and database objects
    brief: >-
      Separate replacing server software from updating each database's extension
      objects. Inspect installed versions and supported update paths, follow the
      extension's release procedure and rehearse application behaviour and required
      maintenance on a recoverable copy.
    heading:
      - title: What makes an update acceptable
        brief: >-
          Check operator results, stored-value compatibility, constraints, index
          requirements and actual caller access after the update. Neither an
          available version nor a successful ALTER EXTENSION proves compatibility;
          a reverse script or simple downgrade is not guaranteed. Whole-server
          transfer and authority handover remain with the upgrade article.
  - title: Removing an extension
    brief: >-
      Use the reservation dependency to distinguish RESTRICT's refusal from
      CASCADE's removal of dependants. Establish which data and enforcement survive
      before changing anything; remove application reliance and provide any
      replacement representation or rule first. Dropping an extension is not an
      update or an uninstall of its server files.
