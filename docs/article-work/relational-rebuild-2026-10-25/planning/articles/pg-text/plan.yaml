topic: PostgreSQL linguistic retrieval
title: Full-text search in PostgreSQL
brief: >-
  Build and assess a PostgreSQL text search from document preparation and query
  meaning through indexed matching, filtered ranking and upkeep. Distinguish
  linguistic matches, index candidates and useful results. Use an explicitly
  illustrative search projection of the shop catalogue; native index mechanics
  belong to PostgreSQL index methods and operators, and embedding retrieval to
  Vector search in PostgreSQL.
heading:
  - title: From words to lexemes
    brief: >-
      Understand how a configuration turns source text into searchable lexemes,
      positions and stop-word gaps. Follow a small catalogue example through
      to_tsvector and @@; distinguish this representation from the original
      text and from a direct type cast.
    heading:
      - title: Choosing a text search configuration
        brief: >-
          Judge stemming and stop-word choices against the document language and
          vocabulary. Keep document and query preparation compatible, specify the
          configuration deliberately, and use ts_debug to explain a missing or
          unexpected match rather than changing the index first.
  - title: Turning a search request into a query
    brief: >-
      Choose plain, phrase, web-style or explicit tsquery input from the intended
      search interface. Understand conjunction, alternatives, exclusion and
      lexeme prefixes through changed requests, while binding input as SQL data.
      Decide what empty, stop-word-only and purely negative requests should do.
    heading:
      - title: Phrases and positions
        brief: >-
          Distinguish words anywhere from an ordered lexeme sequence and a
          specified positional gap. Make a phrase with an omitted stop word
          intelligible, and explain why a normalised phrase is not an exact
          original-character match.
  - title: Building the searchable document
    brief: >-
      Choose the unit being retrieved and the fields it includes. Preserve the
      shop's product names, handle an absent illustrative description, and mark
      title and description occurrences with different weights. Understand what
      combining their vectors does to positions and field boundaries.
    heading:
      - title: Expression index or stored search vector
        brief: >-
          Choose between indexing an explicitly configured document expression
          and retaining a stored generated tsvector for repeated matching and
          ranking. Understand the space and repeated-computation trade, query
          expression compatibility, and why a same-row generated expression
          cannot maintain a document assembled from other tables.
  - title: Finding matches with a GIN index
    brief: >-
      Apply the parent's posting-list model to text lexemes. Follow shared keys
      into candidate rows, then distinguish the information needed for ordinary
      membership, phrases and weight restrictions. Understand that GIN narrows
      matching work but supplies neither a relevance order nor the original
      document; keep wider access-method mechanics with the parent.
  - title: Ranking the eligible results
    brief: >-
      Produce a bounded, deterministic result ordered by rank and product ID,
      with all required SQL filters applied before choosing the winners. Reuse
      the post-order-103 stock values to distinguish a strong text match from an
      eligible in-stock result. See why ranking an arbitrary pre-limited set can
      miss the best eligible matches.
    heading:
      - title: What the relevance score measures
        brief: >-
          Compare frequency, field weights, proximity and length normalisation
          through changed document evidence. Choose between ts_rank and
          ts_rank_cd by the desired behaviour; treat their scores as local
          ordering signals whose usefulness needs judgement, rather than a
          probability or a corpus-wide relevance measure.
      - title: Showing why a result matched
        brief: >-
          Use original text for a useful excerpt after selecting results.
          Understand ts_headline's separate cost and why highlighted words do
          not prove every query restriction; render untrusted excerpts safely.
  - title: Keeping search data current
    brief: >-
      Trace a source-text edit through its derived vector and index, then
      distinguish it from a change to dictionaries or configuration. Know when
      stored vectors must be regenerated as well as their indexes rebuilt;
      rebuilding an index over stale stored vectors cannot repair their meaning.
      Keep query and document configuration compatible during the transition.
    heading:
      - title: Changing the search configuration
        brief: >-
          Treat a language, dictionary or stop-word change as a representation
          change. Establish fresh derivation and result checks before switching
          readers; distinguish dictionary-file reload from recomputation. Leave
          lock management, concurrent builds and live backfill procedures with
          PostgreSQL schema changes under load.
  - title: Checking search quality and query work
    brief: >-
      Assess expected matches and result order on representative labelled
      requests separately from execution cost. Compare a complete reference
      result with the indexed result, then inspect candidates, rechecks,
      filtering, ranking and sorting for rare and common terms. Check update
      cost too; a tiny teaching corpus establishes meaning, not production
      latency or a guaranteed plan.
  - title: When the request needs another kind of search
    brief: >-
      Recognise exact codes, arbitrary substrings, misspellings and semantic
      similarity as different requests. Explain the bounded role of ordinary
      comparisons and pg_trgm beside linguistic matching, without treating
      stemming as spelling correction or synonym discovery. Direct embedding
      retrieval and its separate evaluation to Vector search in PostgreSQL.
