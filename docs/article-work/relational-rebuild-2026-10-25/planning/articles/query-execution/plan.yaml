topic: Relational query execution
title: Query execution and performance
brief: >-
  Follow rows through scans, joins, grouping and sorting, and use measured plans
  to explain excessive execution work. Locate consequential estimate errors,
  repeated work, spills and data movement; choose a repair and test its result
  and workload cost. Own physical operators and the transferable method; index
  design, partition design, native plan counters and incident triage retain
  their accepted owners.
heading:
  - title: From SQL to an execution plan
    brief: >-
      Understand that SQL specifies the result while a physical plan chooses
      how to obtain it. Trace the shop's October paid-order line value report
      from orders and order lines to one row per customer: Tariq 40.00, Mina
      39.50. Make the intermediate rows and result grain visible in a hand-traced
      model, without presenting it as an observed engine plan.
    heading:
      - title: Rows flowing between operators
        brief: >-
          Read a plan as connected operations whose outputs feed later work,
          rather than as SQL clauses executed in written order. Understand why
          an operation can produce few rows after examining many, and why some
          work must finish before the first result can appear.
  - title: Scans, filters and access paths
    brief: >-
      Understand a full scan as examining stored data and a filter as rejecting
      rows. Distinguish rows examined, rows returned and page access; a small
      answer alone does not imply a cheap query. Introduce pages and cached
      reads only far enough to judge scan work; storage internals belong in
      Storage and durability.
    heading:
      - title: When an index reduces the work
        brief: >-
          Compare scanning orders with seeking a small matching range, including
          the subsequent row fetches. Understand why a broad report can favour
          a scan and why an existing index need not help. Establish the choice
          here; the child owns deriving and maintaining useful access paths
          across a workload.
        nested_article:
          topic: Relational indexes
          title: Indexes and access paths
          brief: >-
            Derive useful index keys, ranges, ordering and covering from a query
            and the distribution of values. Compare pages and rows examined
            with rows returned, then weigh write, space and maintenance costs
            across the workload. The parent establishes scans and access-path
            choice; this child owns index design.
      - title: Skipping partitions
        brief: >-
          Understand how a date predicate can exclude whole historical pieces
          before scanning the remaining data. Contrast that with a predicate
          which excludes none. Establish pruning without implying that a
          partitioned table spreads execution across servers; the child owns
          boundary design and lifecycle consequences.
        nested_article:
          topic: Relational table partitioning
          title: Table partitioning and data lifecycle
          brief: >-
            Choose a partition boundary for useful pruning or retention without
            assuming it distributes work across servers. Derive pruning from
            predicates and account for global identity, references and safe
            partition retirement. The parent explains excluded work; this
            child owns the design and its lifecycle consequences.
  - title: Join methods
    brief: >-
      See how different physical methods produce the same matching order and
      order-line rows. Judge their work from the sizes and properties of the
      inputs reaching the join, rather than treating one method as universally
      best. Join meaning and accidental multiplication remain with Joins and
      the meaning of a result row.
    heading:
      - title: Nested-loop joins
        brief: >-
          Follow each outer row into an inner lookup or scan. Understand how
          a small outer input and cheap lookup can work well, and how many
          outer rows multiply even individually cheap work. Make repetitions
          visible, including the possibility of reusing inner results.
      - title: Hash joins
        brief: >-
          Follow building a hash table from one input and probing it with the
          other, checking matching keys and preserving matching occurrences.
          Understand the build work and memory requirement, and why avoiding
          repeated lookups can suit larger inputs.
      - title: Merge joins
        brief: >-
          Follow matching key groups in two ordered inputs, including repeated
          keys. Judge the benefit against obtaining the required input order;
          an index or an added sort can supply it. Do not infer a guaranteed
          final result order from the join method.
      - title: Join order and intermediate rows
        brief: >-
          Understand why reducing eligible orders before joining their lines
          can reduce downstream work. Distinguish legal physical reordering
          from a rewrite that changes join meaning; fewer intermediate rows
          are useful only when the required result is preserved.
  - title: Grouping, sorting and the first result
    brief: >-
      Follow the report's matching line values into customer totals and then
      their requested order. Understand the physical work behind reducing many
      input rows to a few groups, without repeating the neighbouring article's
      treatment of aggregate and window semantics.
    heading:
      - title: Hashing or ordering the groups
        brief: >-
          Compare keeping state for each group with consuming rows already
          ordered by group key. Connect group count and carried row width to
          working memory, and recognise that grouping does not promise the
          report's requested output order.
      - title: Sorting and LIMIT
        brief: >-
          Distinguish sorting all input from retaining only the best few
          candidates. Understand why a small LIMIT may still require examining
          all candidates, while a suitable ordered input can permit early
          stopping. Make first-row delay and total work distinct judgements.
      - title: When working data spills to disk
        brief: >-
          Understand temporary disk work when a sort or hash operation exceeds
          its memory allowance. Judge reducing rows or state before increasing
          memory, and account for simultaneous operations and queries. Native
          counters and setting procedures belong in the implementation articles.
  - title: How the planner estimates the work
    brief: >-
      Understand cardinality as the number of rows at a plan step and statistics
      as imperfect evidence for estimating it. Connect a consequential estimate
      error to a join choice, repeated lookup or unexpectedly large working set;
      a correct estimate can still describe expensive required work.
    heading:
      - title: Skew, correlation and changing data
        brief: >-
          Understand why a common value differs from a rare one, why related
          predicates need not reduce rows independently, and why old statistics
          can misrepresent a changed workload. Recognise the purpose and limits
          of refreshing or improving statistics; native statistics definitions
          and prepared-plan behaviour remain with the implementation articles.
  - title: Reading a measured plan
    brief: >-
      Work through one real, version-labelled plan of the report on the
      separately generated fixture. Match its operations to the row flow and
      compare estimates with measured work. Distinguish an estimated plan from
      execution evidence: collecting actual statistics runs the statement.
    heading:
      - title: Find where the work grows
        brief: >-
          Follow the inputs to the expensive region and locate the earliest
          consequential divergence or multiplication. Account for repetitions
          using the chosen engine's documented units, and distinguish emitted
          rows from rows examined. Check whether early stopping explains an
          apparently low actual row count before calling it an estimate error.
      - title: Read the measurements in context
        brief: >-
          Distinguish estimated cost from elapsed time and total work from
          latency. Check whether reported times or resource counts include
          child work, avoiding double counting. Native counter-by-counter
          interpretation belongs in Reading and repairing PostgreSQL plans;
          this article teaches the questions to ask of any plan format.
  - title: Repairing excessive work
    brief: >-
      Carry one measured diagnosis through a concrete before-and-after repair,
      explaining the work removed and checking the same result. Choose the
      intervention from the evidence: improve a consequential estimate, reduce
      repeated or late-discarded work, obtain a useful access path, or reduce
      a demonstrated spill. Do not make a plan-node name the diagnosis.
    heading:
      - title: Change the cause and measure again
        brief: >-
          State a falsifiable prediction about the affected rows, repetitions
          or temporary work, then compare it with the repaired plan. Preserve
          required multiplicity and ordering. Treat forced alternatives as
          diagnostic comparisons whose lasting value still needs evidence,
          rather than a general replacement for fixing the cause.
      - title: When the query must do substantial work
        brief: >-
          Recognise an accurate plan processing a genuinely large request.
          Judge whether the application needs all those rows and columns or
          can ask a smaller equivalent question. Explain when a changed report
          requirement or retained summary needs a separate correctness decision.
  - title: Parallel work and data movement
    brief: >-
      Understand splitting work between workers, then gathering or exchanging
      results, including across machines. Make rows and bytes crossing that
      boundary visible and see why reducing them can matter. Compare elapsed
      benefit with added total work and uneven worker load; native distributed
      diagnosis and placement remain in their accepted articles.
  - title: Testing a repair against the workload
    brief: >-
      Accept a repair only after checking result equivalence and repeatable
      execution under realistic data size, distributions and parameters. Use
      narrow and broad ranges and common and rare values; distinguish cache
      effects from reduced work. Compare request latency and resource use under
      representative concurrency, including regressions to other queries.
    heading:
      - title: Keep the evidence with the comparison
        brief: >-
          Retain query parameters, schema and statistics state, engine version,
          settings, data-generation facts and the before-and-after plans.
          Compare enough ordinary executions to separate a repeatable effect
          from timing noise; account for profiling overhead and result transfer.
          Hand-traced models establish mechanisms, not performance predictions.
      - title: When the plan is not the delay
        brief: >-
          Recognise the limit of execution-plan evidence when the request is
          delayed by admission, connection acquisition, locks or other waits.
          Route that investigation to Diagnosing a database incident; capacity
          budgets and overload policy remain with Connections, overload and
          capacity.
