topic: Distributed read histories
title: Time, snapshots and distributed reads
brief: >-
  Choose a safe common history for a read spanning partitions, and judge whether
  its freshness suits the task. Understand what logical timestamps, clock
  uncertainty and replica progress each establish. Reuse purchase 103 across
  customer shard A and product shard P. The parent establishes why a common
  snapshot is needed; this article owns how its history becomes safe to read.
  Native isolation, follower-read syntax and controls belong to CockroachDB
  isolation and follower reads.
heading:
  - title: One snapshot across shards
    brief: >-
      Read purchase 103 before or after its atomic commit without combining an
      absent order with its completed stock decrement. Understand that a common
      snapshot selects compatible committed versions across every participant,
      even when the requests arrive at different times. Assume atomic commit;
      its decision and recovery protocol belong to Transactions across partitions.
  - title: Timestamps and logical clocks
    brief: >-
      Understand how a shared timestamp can identify the versions to read, and
      why unrelated local log positions or wall-clock readings cannot supply
      that contract. Follow message-carried logical time, then the physical and
      logical parts of a hybrid logical clock. Increasing timestamps preserve
      known causal order; their numerical order alone proves neither causation
      nor replica readiness.
  - title: Clock uncertainty and real-time order
    brief: >-
      See why a write can appear to have a later timestamp despite completing
      before a read begins on another node. Distinguish a consistent snapshot
      from a promise to include earlier completed transactions. Compare bounded
      time with commit waiting against uncertainty handling in an HLC-based
      system, without treating clocks alone as an isolation or commit protocol.
  - title: When a replica can answer
    brief: >-
      Require evidence that the relevant history through the chosen timestamp
      is complete and applied on each read target. Make visible why receiving a
      timestamp, durable log entry or closure promise is insufficient before
      its required state is applied. Recognise how unresolved writes can hold
      back a safe read, and when to wait, reroute or report unavailability.
  - title: Choosing a historical snapshot
    brief: >-
      Choose one exact timestamp for related reads, or let the system choose
      within a permitted freshness bound. Understand why independently choosing
      an older time at each shard can still mix histories. Intersect replica
      readiness with retained version history; an older read may be easier to
      serve, but a collected version cannot be recovered by waiting for replay.
  - title: A report is not a stock reservation
    brief: >-
      Use a consistent past view for a report while recognising that its stock
      value does not authorise another purchase. A current decision still needs
      the guarded write and isolation protocol at the relevant authority.
      Choose freshness, snapshot scope and failure behaviour from the task;
      use Replicas, lag and read routing for session routing and CockroachDB
      isolation and follower reads for concrete read choices.
