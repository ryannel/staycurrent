topic: Distributed cluster evolution
title: Rebalancing and cluster change
brief: >-
  Move a replicated partition without losing agreed history or creating competing
  authorities. Judge catch-up, membership, placement and capacity through the
  transition, and establish when a node can safely leave. Native operating
  procedures belong to the implementation articles.
heading:
  - title: What rebalancing moves
    brief: >-
      Distinguish moving a leader, moving a stored replica and changing a shard's
      logical ownership. Use the shop's product shard P to explain why adding an
      empty machine does not immediately relieve its existing owners.
  - title: Copying a live partition
    brief: >-
      Follow a consistent base copy and the later history needed while writes
      continue. Keep the old replicas authoritative during catch-up; copying all
      base bytes does not establish readiness to replace a voter.
    heading:
      - title: Keeping the continuation available
        brief: >-
          Understand why the base copy needs compatible history and replication
          metadata, and why missing retained history can require a fresh copy.
          Reuse the distinction between durable and applied progress.
  - title: Changing voting membership
    brief: >-
      Replace P's voter R3 with R4 through a supported protocol. Distinguish a
      non-voting learner from a ready voter, and make visible why independent
      decisions under old and new voter sets can disagree.
    heading:
      - title: Joint consensus
        brief: >-
          Use one labelled Raft model to follow old membership, a joint
          configuration requiring both majorities, and completed new membership.
          Understand why catch-up and voting authority are separate conditions;
          actual engines may use other safe reconfiguration protocols.
  - title: Preserving the survival margin
    brief: >-
      Check the required communicating voters and failure domains at intermediate
      stages as well as at the destination. A missing voter has consumed
      redundancy; a learner or a second copy in the same failure domain does not
      automatically restore the intended protection.
  - title: Capacity during rebalancing
    brief: >-
      Budget foreground work alongside transfer, retained history, replay and
      temporary copies at each source and destination. Choose a rate and scope
      that permit progress while retaining room for the declared additional
      failure and recovery work.
    heading:
      - title: Catching up while writes continue
        brief: >-
          Apply the earlier net-backlog reasoning to a move: incoming work can
          consume all replay capacity. Recognise when slowing transfers protects
          service but prolongs the period of exposure; estimates depend on stated
          rates and bottlenecks.
      - title: Capacity after removing a node
        brief: >-
          Test whether remaining eligible stores can hold the final placement
          and serve its work, including growth and recovery headroom. Cluster-wide
          free bytes and balanced replica counts do not establish that every
          constrained destination can accept a replica.
  - title: Decommissioning a node
    brief: >-
      Extend the single-partition move to every affected replica group and active
      role. Distinguish draining requests from removing stored replicas, and
      recognise why an accepted request or a stalled copy is not completion.
    heading:
      - title: Evidence before shutdown
        brief: >-
          Require completed membership changes, the intended healthy placement,
          preserved history and acceptable foreground service before retiring
          the old location. Diagnose a stall from progress, eligible destinations
          and capacity; native commands and status interpretation belong to the
          implementation articles.
