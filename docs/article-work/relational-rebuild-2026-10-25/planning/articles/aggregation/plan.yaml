topic: SQL aggregation and windows
title: Aggregates and window functions
brief: >-
  Choose whether a calculation should produce one row per group or keep each
  input row. Build grouped reports and per-row comparisons with deliberate
  populations, counts, ordering and frames. Query results owns the per-order
  balance report; this article generalises the methods using ordered products
  and their order lines. Physical execution and pagination belong elsewhere.
heading:
  - title: GROUP BY
    brief: >-
      Understand how five order lines become three product summaries. Choose
      grouping columns from the intended result grain, distinguish line counts
      from ordered units, and predict what adding another grouping column
      changes. Make visible which input rows contribute to each result.
    heading:
      - title: What belongs in a group row
        brief: >-
          Select grouped values and aggregate results deliberately. An aggregate
          such as MAX does not select the other columns of the row containing
          that value. Grouping does not promise result order; request it explicitly.
  - title: WHERE, HAVING and FILTER
    brief: >-
      Choose between removing input rows, rejecting completed groups and
      restricting one aggregate's contributors. Compare all ordered units with
      units on paid orders without removing the pending lines from every
      calculation. Make the three populations visible on the same starting rows.
  - title: Counts, NULLs and empty inputs
    brief: >-
      Distinguish COUNT(*), COUNT(value), COUNT(DISTINCT value) and SUM(quantity).
      Recognise the preserved row of an outer join when counting Edda's orders.
      Predict a scalar aggregate over no input versus a grouped query with no
      groups, and distinguish missing measurements from a known zero before
      applying COALESCE.
  - title: Keeping each row with a window function
    brief: >-
      Use OVER and PARTITION BY to attach a product's total ordered quantity to
      each contributing order line without collapsing the lines. Compare the
      grouped and window results over identical input, then calculate each
      line's share with deliberate numeric division. Distinguish window ordering
      from final display ordering.
    heading:
      - title: Which rows the window sees
        brief: >-
          Understand that filtering and grouping determine the rows available to
          windows. A window over product summaries sees products, whereas a
          window over order lines sees lines; its name does not restore an
          earlier grain or repair multiplied inputs.
  - title: Ranking and ties
    brief: >-
      Rank the three product summaries by ordered units: tea and mugs tie at
      three, followed by the teapot at one. Choose ROW_NUMBER, RANK or DENSE_RANK
      according to whether the requirement counts rows, competition places or
      distinct scores. Distinguish deterministic row selection from preserving
      business ties, and keep a display tie-breaker outside a rank that must
      still recognise equal scores.
  - title: Window frames
    brief: >-
      Distinguish a partition, its ordering and the current row's frame. Follow
      cumulative ordered value through the five lines: lines of an order share
      placed_at, so the default ordered frame includes peers together. Choose
      an explicit ROWS frame and a complete line order for accumulation one
      line at a time, or a whole-partition frame for a partition-wide result.
    heading:
      - title: Rows, values and peer groups
        brief: >-
          Choose ROWS for row positions, RANGE for distance in the ordering
          value and GROUPS for peer-group positions. Understand why a bounded
          row frame is not a calendar period, including gaps and partition ends.
          Recognise that LAST_VALUE reads the last row of its frame, which may
          differ from the last row of the partition.
      - title: Previous and next rows
        brief: >-
          Use LAG or LEAD when the question needs a neighbouring row rather than
          an aggregate over a frame. At one row per order, compare Mina's order
          dates within her own history; distinguish no previous row from a
          previous NULL value. Do not infer frame-sensitive behaviour from
          frame-sensitive aggregates.
  - title: Filtering a calculated result
    brief: >-
      Use an outer query to filter completed window results. Compare exactly
      two selected rows with including tied ranks, and keep the window's input
      population intact until the calculation is complete. Use the established
      grain, population, tie and frame decisions to judge a report; continue to
      Query execution for its physical work and Pagination for continuation.
