topic: CockroachDB history restoration
title: CockroachDB backup and recovery
brief: Validate native backup coverage and restore scope, recover the intended shop state, and reconcile valid later payment work by its original identity without charging again or consuming stock twice. General recovery choices belong in Backup, restore and reconciliation; live cluster health and whole-application migration remain with their owners.
heading:
  - title: Recovering an earlier shop state
    brief: Understand why restoring before the mistaken P7 price also omits valid payment 504, while order 103, its agreed prices and its stock consumption remain. Recognise the difference between a recovered database state and a recovered service.
  - title: Full backups and incremental chains
    brief: Read a backup collection as complete recovery paths rather than independent files, and distinguish a new full backup from an increment added to an existing chain.
    heading:
      - title: Finding the backup to restore
        brief: Use SHOW BACKUPS and SHOW BACKUP to identify the source, selected full-backup path, subsequent increments, object scope and covered end times. Understand what LATEST selects before relying on it.
      - title: Keeping a complete path
        brief: Recognise why the full backup and required increments must remain readable together, with usable storage access and decryption material. A later increment cannot replace a missing dependency.
  - title: Revision history and restore targets
    brief: Distinguish restoring a saved backup point from restoring an interior point captured by revision history. Judge whether the intended cut before the mistake is actually covered.
    heading:
      - title: The history a backup captures
        brief: Understand the bounded history captured by full and incremental backups with revision history, and why retained source revisions and backup coverage are different promises.
      - title: Choosing a point before the mistake
        brief: Connect RESTORE AS OF SYSTEM TIME to a supported point in the selected chain and verify its resulting facts. Restoring the later payment's original point would also restore the earlier price mistake; the restored object does not retain the backup's whole version history.
  - title: Choosing the restore scope
    brief: Choose table, database or full-cluster restoration according to the state needed and the destination's requirements, keeping related objects and application access in view.
    heading:
      - title: Restore related objects together
        brief: Understand why a table's dependencies need deliberate inclusion and why skipping them changes the recovered contract. Use a database restore under a new name to examine this shop together without replacing its source.
      - title: Data, identities and the destination
        brief: Distinguish restoring the shop database from restoring cluster users and privileges. Recognise full-cluster destination restrictions and check supported versions, required keys and runtime access before declaring the copy usable.
  - title: Proving the restored state
    brief: Understand what native metadata, file checks, schema checks and an actual restore each establish, then verify the intended shop facts in an isolated candidate.
    heading:
      - title: From file checks to a restore
        brief: Distinguish SHOW BACKUP WITH check_files, schema_only, verify_backup_table_data and a complete restore. Read job completion evidence without treating a returned job identity or a successful file check as service recovery.
      - title: Check the facts across the cut
        brief: Verify P7 at 20.00, pending order 103 with agreed total 29.00, payment 504 absent and stock 10/0/4. Check constraints and application access, and distinguish a small native drill from evidence about production recovery time.
  - title: Reconcile the later payment
    brief: Apply the established recovery method to this CockroachDB candidate, using a finite source history and native transactions to preserve the payment's meaning and apply it once.
    heading:
      - title: Close the source history
        brief: Establish a final set of later outcomes by excluding source writers and external dispatch and accounting for in-flight operations. Preserve source evidence before reconciling; the mechanisms of a whole-application handover belong in the migration article.
      - title: Record the charge that already happened
        brief: Use the known accepted provider result for order-103-part-payment-1 to record payment 504 and its immutable operation mapping atomically. Repeating the repair verifies the same result; a mismatched payload or unknown external outcome stops it.
      - title: Preserve the retained purchase
        brief: Check the 10.00 payment against order 103's unchanged 29.00 agreement, leaving 19.00 due and pending status. Retain stock 10/0/4; recovering the payment must not repeat the purchase or its stock decrement.
  - title: Return the recovered service to use
    brief: Judge readiness from the verified target, closed old authority, accounted-for later work, correct runtime access and controlled external dispatch. Re-establish backup coverage for the recovered history and retain unresolved outcomes explicitly; general recovery objectives remain with the prerequisite.
