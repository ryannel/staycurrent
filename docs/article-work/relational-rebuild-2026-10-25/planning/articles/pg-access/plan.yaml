topic: PostgreSQL authority boundaries
title: PostgreSQL roles, policies and privileged code
brief: >-
  Trace the authority behind a PostgreSQL request and configure roles, grants,
  row policies and privileged functions so runtime and support tasks cannot
  acquire migration authority or another tenant's rows. Verify allowed and
  forbidden paths as the actual application identities. Transferable access
  design, tenant integrity and extension lifecycle remain with their owners.
heading:
  - title: Roles and the identity running a statement
    brief: >-
      Distinguish a LOGIN role, an inherited privilege and SET ROLE through
      shop_runtime, shop_migrate and shop_support. Understand session_user and
      current_user well enough to identify whose authority a statement uses.
    heading:
      - title: Role membership and inheritance
        brief: >-
          Follow INHERIT, SET and ADMIN options through a small membership chain.
          Recognise that NOINHERIT alone does not prevent assuming a role, and
          that inherited ownership or membership administration can expand authority.
  - title: Grants, ownership and new objects
    brief: >-
      Give each task the required database, schema and object privileges while
      keeping ownership and schema creation away from runtime and support.
      Understand why REVOKE on one path cannot cancel privileges obtained elsewhere.
    heading:
      - title: Schema privileges and object privileges
        brief: >-
          Separate CONNECT, schema USAGE, schema CREATE and table or column access.
          Keep support's selected customer and order reads narrower than whole-table
          grants; recognise separately granted sequence access when an application uses it.
      - title: Ownership and default privileges
        brief: >-
          Separate the role creating or altering objects from application callers.
          Understand existing grants versus creator-specific ALTER DEFAULT PRIVILEGES,
          including PUBLIC routine execution and the effect of creating objects after SET ROLE.
  - title: Tenant identity in a shared connection
    brief: >-
      Follow an authorised tenant-10 request into the shared shop_runtime identity.
      Understand who supplies tenant context, why a caller-settable setting is no
      proof of authorisation, and how transaction-local context avoids carrying one
      request's scope into the next.
  - title: Row-level security
    brief: >-
      Add row policies to ordinary object privileges and follow the tenant-10
      request that asks for tenant 20 or customer 4. Understand enablement,
      default denial and why an application WHERE clause is not the policy boundary.
    heading:
      - title: USING and WITH CHECK
        brief: >-
          Distinguish which existing rows a command can reach from which resulting
          rows it can create. Recognise filtered reads or updates versus rejected
          writes, including an attempt to move an allowed row to another tenant.
      - title: Combining policies
        brief: >-
          Predict how applicable role and command policies combine. See how another
          permissive policy can widen access, while restrictive policies narrow an
          existing permissive allowance. Keep policy decisions simple where possible.
  - title: Where row policies stop
    brief: >-
      Recognise owner, superuser and BYPASSRLS access, the purpose and limits of
      FORCE ROW LEVEL SECURITY, and operations outside row filtering. Keep row
      authorisation separate from tenant integrity and complete information isolation.
    heading:
      - title: Views and the authority behind them
        brief: >-
          Follow a support read through a view to its base tables. Distinguish
          default view-owner checks from security_invoker checks, and understand why
          a view over a policy-protected table needs its own authority analysis.
  - title: SECURITY DEFINER functions
    brief: >-
      Choose caller privileges by default and a narrowly privileged function only
      for a justified task. Understand that changing current_user changes permission
      and policy evaluation; a tenant argument alone cannot authorise the caller.
    heading:
      - title: search_path and trusted objects
        brief: >-
          Follow how a caller-controlled object name can redirect privileged code.
          Secure name resolution with qualified objects, trusted schemas and an
          explicit function search_path that puts pg_temp last; constrain the
          function owner's authority and who may replace its dependencies.
      - title: A narrow callable interface
        brief: >-
          Limit EXECUTE to intended callers, removing PUBLIC access in the creation
          transaction. Preserve the tenant and operation boundary inside the function;
          avoid general SQL or object-name interfaces and handle any necessary
          dynamic SQL as both an injection and an authorisation problem.
  - title: Testing the application identities
    brief: >-
      Verify the complete connection, role, context and object path through allowed
      and denied requests. Distinguish missing privileges, policy-filtered rows and
      rejected new rows; test reuse after commit and rollback, indirect access and
      newly migrated objects without relying on an owner's successful query.
