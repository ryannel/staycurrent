topic: Temporal relational data
title: History, correction and deletion
brief: >-
  Represent changing facts with explicit effective and recorded times, and choose
  the history needed to explain a past decision. Correct mistakes and complete
  retention and deletion work across related records and external copies without
  repricing historical purchases. Modelling owns the first current-versus-agreed
  distinction; this article owns its temporal consequences. SQL change mechanics
  belong in Updates, upserts and bulk imports; restoring database history belongs
  in Backup, restore and reconciliation.
heading:
  - title: Which past are we keeping?
    brief: >-
      Distinguish today's catalogue, an order's agreement and a record of earlier
      assertions. P7 changing to 22.00 leaves order 103's agreed 20.00 and total
      29.00 intact.
    heading:
      - title: Facts, versions and events
        brief: >-
          Choose a current value, a retained agreement, dated versions or recorded
          events from the questions the application must answer. An updated_at
          value alone cannot recover the values it replaced.
  - title: Effective time
    brief: >-
      Represent when a fact applies in the business, including a scheduled future
      change. Give the product a stable identity and each price version its own
      interval and identity.
    heading:
      - title: Periods and boundaries
        brief: >-
          Read half-open periods and select the price at their shared boundary.
          Distinguish an unbounded end from an unknown value; an open-ended future
          version is not necessarily the price effective now.
      - title: Overlaps and gaps
        brief: >-
          State whether one price must apply at every instant in the modelled
          period. Reject conflicting overlaps and decide what a gap means rather
          than silently choosing one row.
  - title: Recorded time
    brief: >-
      Separate when the shop says a price applied from when that assertion was
      recorded. A late correction must support both today's corrected account and
      the account used before the correction.
    heading:
      - title: Correcting an effective date
        brief: >-
          Follow a correction from P7's initially recorded 22 October price change
          to 21 October. Preserve the earlier assertion and its recording period
          while replacing the affected effective periods coherently.
      - title: Asking both time questions
        brief: >-
          Distinguish the price effective on 21 October according to the current
          record from the price believed then according to an earlier record.
          Select both periods when the question needs both.
      - title: System-versioned tables
        brief: >-
          Recognise bitemporal data and what engine-managed history can supply.
          Check the meaning of its system timestamps; business effective time and
          exact commit visibility do not follow automatically.
  - title: Correcting a purchase
    brief: >-
      Distinguish a changed business fact, a mistaken record and a later amendment
      or refund. Preserve the meaning of the original agreement while making the
      corrected outcome and its reason explicit.
    heading:
      - title: Related facts at the same time
        brief: >-
          Decide whether a purchase needs captured terms, a reference to a specific
          version or a temporal lookup. Joining old orders to today's catalogue or
          unrestricted version history can change or multiply their meaning.
      - title: Carrying a correction through
        brief: >-
          Identify affected records, reports and issued documents; retain enough
          provenance to explain the correction and verify its consequences.
          Correct business facts in the current database; do not rewind unrelated
          valid work with a restore.
  - title: Retirement, cancellation and deletion
    brief: >-
      Separate an inactive product, a cancelled order, a hidden customer account
      and erased information. Choose each relationship's deletion behaviour from
      what its records mean, rather than applying a universal cascade.
    heading:
      - title: Soft deletion
        brief: >-
          Understand that a deletion flag retains the data and introduces live-row
          rules for reads, references and uniqueness. It can support retirement or
          recovery but does not itself fulfil an erasure policy.
      - title: Retaining purchases without retaining everything
        brief: >-
          Separate the purchase facts that an agreed retention policy requires
          from customer details no longer needed. Removing a name alone does not
          establish anonymity; retained links and copies still matter.
  - title: Retention across the whole record
    brief: >-
      Define what is kept, why, for how long and what ends retention, including
      history and correction records. Auditability does not justify keeping all
      personal details indefinitely; policy determines permitted retention.
    heading:
      - title: Deleting related and external copies
        brief: >-
          Follow one approved deletion through profile data, historical versions,
          issued documents and derived copies. Track pending and failed work and
          verify each destination; removing one database row is not completion.
      - title: Backups and restored data
        brief: >-
          Include backup expiry and the prevention of deleted data returning to
          use. Retain the deletion decisions needed by recovery; backup selection,
          restore procedures and reconciliation belong in Backup, restore and
          reconciliation.
  - title: Choosing how much history to build
    brief: >-
      Choose the smallest model that answers required historical questions and
      survives its correction and deletion cases. Judge it with a boundary instant,
      a late correction and an incomplete external deletion before relying on it.
