topic: Relational write authority
title: Failover and fencing
brief: >-
  Distinguish suspected failure from permission to write. Judge whether a former
  writer is excluded, which surviving history can honour the commit promise, and
  what a promotion may omit. Account for divergent work and return a former
  primary safely. Follow the parent's separate P7 price experiment; native
  PostgreSQL procedures belong in PostgreSQL physical replicas and promotion.
heading:
  - title: A missing heartbeat does not stop a writer
    brief: >-
      Understand how a broken link can leave the primary serving some callers
      while others promote a replica. Recognise split brain as competing write
      histories, even when each database remains locally consistent.
  - title: Fence the former primary
    brief: >-
      Understand fencing as enforced exclusion from authoritative writes before
      the replacement accepts them. Judge confirmed shutdown with restart
      exclusion, independent power fencing and other complete enforcement paths;
      changing an address alone leaves existing connections and workers possible.
    heading:
      - title: Leases need enforcement
        brief: >-
          Distinguish agreement about the next leader from stopping the previous
          one. Understand why lease expiry requires reliable demotion or fencing,
          and why a fencing token protects only operations whose recipient
          enforces its authority check. Leave consensus and membership analysis
          to Sharding and distributed SQL and Rebalancing and cluster change.
  - title: Choose the history to promote
    brief: >-
      Compare candidates using compatible history and recoverable committed
      progress. With the parent's H/U/C model, A durably holds C but has not
      replayed it; B is before C. Understand why A can retain the 22.00 edit after
      replay while promotion of B without obtaining C omits it.
    heading:
      - title: State the loss boundary
        brief: >-
          Relate acknowledged commits to the copies and progress required by the
          actual replication policy. Judge when preservation is established,
          when waiting or unavailable writes preserve the promise, and when an
          emergency promotion explicitly accepts possible or known loss. Recent
          lag measurements and a leader-election majority do not prove that a
          candidate contains every acknowledged commit.
  - title: Promotion is only part of the handover
    brief: >-
      Understand the ordered obligations: exclude competing writers, establish
      the candidate's usable history, promote under the authority protocol, then
      admit callers to the verified writer. Account for old pooled connections,
      in-flight requests and workers. A lost commit reply remains uncertain;
      request identity and retry mechanics stay with their existing owners.
  - title: Account for missing and divergent work
    brief: >-
      Understand the common prefix and separate branches after promotion.
      Preserve the former history before destructive rejoin work; distinguish
      omitted confirmed changes, uncertain outcomes and subsequent authoritative
      work. Reconcile accepted business operations under their original identity
      and current constraints, rather than merging physical logs or blindly
      replaying SQL. Backup, restore and reconciliation owns the detailed
      later-work and external-effect procedure.
  - title: Return the former primary as a replica
    brief: >-
      Understand why a recovered machine cannot resume its former authority.
      Keep it excluded while preserving evidence and making its data follow the
      chosen history through a supported rewind or fresh copy. Verify role,
      catch-up and routing before relying on restored redundancy; native tools
      and their prerequisites belong in PostgreSQL physical replicas and promotion.
  - title: Practise the whole transfer
    brief: >-
      Contrast a planned switchover, which can stop and drain writes and establish
      the final copied history, with failover under missing evidence. Judge a
      rehearsal by writer exclusion, retained and omitted commits, caller
      behaviour, service recovery time and restored protection. Include broken
      links and a returning former primary, not only a stopped server.
