topic: Anchored zoom, rotation and dragging through transformed coordinate spaces
title: Keep a diagram under the pointer
brief: >-
  Build on Coordinates in a zoomable editor and its settled Review board example
  in docs/coverage/coordinate-editor-example.md. Give a programmer who has read
  that root article a complete small single-pointer gesture implementation and
  the judgement to repair it. The reader should be able to derive pan, anchored
  zoom, chosen-pivot view rotation and card dragging from the point each operation
  retains; reproduce the recorded normal and resized drag snapshots; extend them
  to the root's rotated view; and explain why adding a client displacement divided
  by zoom to a card translation fails. They should also handle capture, completion
  and cancellation, reject stale or invalid conversions before changing stored
  state, and distinguish a geometric error from an interrupted event stream.
  Keep the root's space names, column-vector convention and browser bridge, with
  reminders and links at their first reuse. Do not reteach matrix multiplication,
  rotation or inversion. Proposed extra numbers are in example-extension.md for
  central settlement before writing. Reuse one geometry/state module and one
  gesture comparison rather than a separate mechanism for each figure. A supplied
  zoom factor and angle control suffice; exclude wheel normalisation, multi-touch
  recognition, inertia, undo and a scene graph framework. No further child earns
  a page. Model arithmetic and invariant checks are distinct from observed browser
  events and rendered controls; require both kinds of checking during writing.
heading:
  - title: Decide what the gesture must keep
    brief: >-
      Open with Review slipping away from the pointer when its parent is turned.
      State explicitly that this article builds on Coordinates in a zoomable
      editor. Remind the reader that O stores card geometry, G its placement,
      W the board, V the root SVG user space and C browser client CSS pixels.
      Link back to the root's space ladder, composition and inverse explanations.
      Remind them that an invariant is a condition the update keeps true. The
      named Gesture promises table pairs each operation with its retained point
      and stored parameters: pan retains a chosen world point under a moving
      pointer and changes pan in V; zoom and view rotation keep a world anchor at
      a chosen V point and change zoom/angle plus pan; card drag retains the
      grabbed point in O and changes card translation in G. Introduce view angle
      theta and write the restricted editor view as v = z R(theta) w + t_V,
      reminding the reader that R turns a displacement and t_V is applied after
      it. The initial theta is zero; the root's centre-turned view has theta
      90 degrees and t_V (660, -40). This is the same view mapping in a convenient
      parameter form, not an extra camera inversion or a new coordinate space.
  - title: Pan in the view's coordinates
    brief: >-
      Start with the simplest promise. At pointer-down, convert the pointer from
      C through V to the world anchor w; at an update obtain the current pointer
      v in V and solve t'_V = v - z R(theta) w. With fixed zoom, angle and bridge
      this reduces to adding the V displacement to the old pan. Use the named
      Move the view snapshot: in the half-size, turned-view state, client
      (310, 190) to (350, 210) is V movement (80, 40), so pan changes from
      (660, -40) to (740, 0). Adding (40, 20) directly is a wrong-space update.
      Explain why the board moves as a whole and why dividing by zoom would
      calculate a different kind of displacement. Recompute the pointer in V
      from the current root SVG mapping; a cached pointer-down bridge is only
      valid while that bridge remains unchanged. Keep the chosen world anchor
      rather than accumulating rounded per-event movements.
  - title: Zoom and turn around the chosen point
    brief: >-
      Reuse the pan equation with a stationary target a_V. Recover the world
      anchor a_W using the old view inverse, choose the new zoom and angle, then
      derive t'_V = a_V - z' R(theta') a_W by substituting the retained point into
      the new view. Explain each subtraction as occurring in V. Obtain a_V from
      the current client-to-V mapping, never directly from client coordinates.
      Reproduce the canonical baseline zoom 2 to 3 and pan (-70, -100), then the
      root's turned-view zoom 2 to 3 with pan (800, -170). A chosen-pivot rotation
      example resets to baseline and turns the view 90 degrees about the marked
      point at V (320, 320), producing pan (600, 60); distinguish this chosen
      pivot from the root's V-centre pivot (400, 300). Neither changes stored
      card or group geometry. Use a labelled anchor/target trace in the shared
      Gesture comparison, with a stationary target cross and before/after world
      point, so keeping pan unchanged or dropping R can be seen to break the
      promise. Let the reader choose the pivot with a labelled diagram marker;
      zoom/angle controls retain that V target, using the SVG centre until a
      target is chosen. Convert an actual pointer position from C when choosing
      the marker. Explain clamping as limiting a requested value to the allowed
      interval. Validate finite inputs; clamp a valid requested zoom to the
      example's 0.25 to 4 range before solving the compensating pan. The limits
      are editor policy. Show that zooming further at a bound causes no drift.
  - title: Move the card in its parent's space
    brief: >-
      At pointer-down map C to O once to save the actual grabbed local point g_O;
      do not snap the card origin to the pointer or assume every grab is (10, 10).
      At each move map the current pointer C to G using the parent group's current
      mapping. For the example's translation-only card placement derive
      t'_G = pointer_G - g_O, and verify by mapping the retained point forward.
      This is an absolute position update, not conversion of a displacement as
      a point. If recalling the root's optional card rotation, briefly state
      that a fixed card linear part L requires subtracting L g_O instead; a
      pivot offset already inside the card placement must be represented
      consistently. Keep that reminder out of the main gesture path.
      Reproduce the canonical normal drag to t_G (40, 0) and resized drag to
      (50, -20). Then combine the root's turned view and half-size SVG: client
      (310, 190) to (350, 210) requires t_G (-10, 0). The named Gesture comparison
      toggles derived update and Divide client movement by zoom, with baseline,
      resized and turned-view presets, Reset and visible starting state. In the
      last preset that tempting update produces t_G (50, 30), putting the grab
      at client (290, 180), visibly away from the pointer (350, 210). Show the
      C, V, W and G displacement arrows and the resulting absolute placement;
      ask the reader to predict the direction before revealing it. Keep pan
      mode distinct: the same pointer motion moves every object there.
    heading:
      - title: Ask the right element for the mapping
        brief: >-
          Use a compact DOM-role table to connect each inverse to its destination:
          the card for O at the grab, its parent group for G during card movement,
          the world layer for W, and the root SVG for V. Remind the reader that
          getScreenCTM maps that element's local coordinates to C, so its inverse
          already includes the browser bridge. Do not apply the model chain a
          second time. Explain why event.target is an unreliable choice after
          capture or when a card contains labels. Reacquire the appropriate
          current matrix after layout or view changes; keep rendering and reads
          on the same committed state, without an independently animated CSS
          transform. A two-frame Resize between moves trace keeps g_O but changes
          the bridge from full size to half size before the next event, making
          a stale inverse's error visible. Deliberately changing a parent or view
          mid-drag may change the required translation; the absolute equation
          re-establishes the grab at the next update without resetting g_O.
  - title: Give the gesture a beginning and an end
    brief: >-
      Introduce pointer events, pointerId and pointer capture as delivery of one
      pointer's events to a chosen element even when it leaves that element.
      Use one active gesture record with mode, pointerId and the retained local
      or world anchor. An explicit Card or Pan tool avoids a competing gesture
      recogniser. Accept a primary-button start only when idle, validate its
      coordinates and capture on a stable editor element; ignore other pointer
      IDs. Set touch-action on the editor surface before interaction begins;
      explain its browser-pan policy locally, without disabling page gestures
      elsewhere. Capture alone does not prevent browser gesture cancellation.
      Provide the complete connected handler route, sharing the derived geometry
      functions: start, matching move, final valid pointer-up update and cleanup.
      On pointercancel or unexpected lostpointercapture, end the gesture and keep
      the last valid placement, with no invented final movement. Make cleanup
      safe to repeat because normal release can also produce capture loss. Handle a
      failed capture request without leaving an active gesture. A small Gesture
      lifecycle table distinguishes completion from cancellation and labels the
      keep-last-valid behaviour as this editor's policy, not an API rollback.
      Source API details from the primary sources in child-record.md. Keep event
      logging in the browser check separate from the illustrative geometry trace.
  - title: Check the promise before storing the update
    brief: >-
      Bring the helpers and handlers together as one small implementation route,
      not disconnected formula snippets. Take current state and mappings, compute
      a candidate, verify it, then commit state and render together. Reject a
      missing mapping, non-finite input/inverse/result or a disallowed zoom before
      mutating stored placement; clear the active gesture on an unmappable update
      while retaining its last valid state. Remind and link to the root's collapsed
      group explanation. A singular DOMMatrix inverse may contain NaN rather
      than throw, so catching an exception alone is insufficient. Do not substitute
      an unexplained determinant cutoff. The named Find the broken promise table
      connects symptoms to checks: wrong direction to parent axes, size-dependent
      drag to the bridge, zoom drift to anchor/compensation, a jump after resize to
      stale state, and a stuck gesture to missing lifecycle cleanup.
      Require forward checks of every canonical and proposed snapshot, multiple
      smaller moves versus one move, unchanged zoom at bounds, off-origin grabs,
      resize between events, capture outside the card, cancellation, capture loss
      and singular-state rejection. Exact quarter-turn expectations can be checked
      mathematically; arbitrary-angle checks need a stated tolerance. Separately
      observe the browser implementation's matrices, event sequence and rendered
      controls in the isolated preview, including keyboard-operable preset and
      zoom/angle controls and light/dark readability. State what those observations
      establish; do not infer cross-browser or physical-device coverage. Keep all
      outcomes visible with static snapshots when interaction is unavailable.
