topic: Coordinate spaces and affine transforms for a zoomable diagram editor
title: Coordinates in a zoomable editor
brief: >-
  Teach a capable programmer with no graphics mathematics how to keep an object's
  geometry local, place it inside a transformed group, move the editor's view,
  and map a browser pointer back to the object. Use the settled Review board
  example in docs/coverage/coordinate-editor-example.md throughout. By the end, the reader can name the
  input and output space of each conversion; calculate the marked point's route
  from card (10, 10) to browser client (440, 400) and back; distinguish a point
  from a displacement; construct and compose the six coefficients of a 2D affine
  transform; predict and repair a swapped transform order; rotate around a chosen
  pivot; implement a guarded local hit test; and explain why a collapsed transform
  cannot support unique backward mapping. Derive notation, rotation and matrix
  operations through this example rather than assume a linear-algebra course.
  Give a complete small SVG/DOMMatrix implementation route in the root, including
  pan, zoom, rotation and pointer conversion. Explain the invariant behind anchored
  zoom and dragging before offering the one deeper article on implementing those
  gestures. Keep this collection to two proposed articles; no third page currently
  earns its cost. Scope is 2D affine geometry and the browser coordinate bridge,
  not perspective, rendering engines, diagram layout algorithms or a general
  linear-algebra survey. Figures are mathematical teaching models until browser
  behaviour is separately checked. The writer must check calculations and the
  rendered controls, and separate those evidence types.
heading:
  - title: One card, several sets of coordinates
    brief: >-
      Begin with the practical task: find the spot on the Review card under a
      pointer after its group has turned and the view has zoomed. Define a
      coordinate space as an origin, axis directions and units. Introduce card
      O, group G, world W, editor view V and browser client C only as their roles
      become necessary. State rightwards x, downwards y and clockwise positive
      angles in the initial browser-aligned frame; transformed local axes may
      point elsewhere. A named Space ladder figure shows the same marked point,
      local axes and conversions, not five independent points. Establish the
      forward route O to G to W to V to C and the need to reverse it for input.
      State the implementation approach early: store geometry locally, compose
      outward for display and invert the resulting mapping for input. Leave
      matrix symbols until the scalar operations give them meaning.
  - title: A position and a movement follow different rules
    brief: >-
      Use the card translation (30, 20) to distinguish a point from a displacement
      between two points. Show point subtraction within the same space, adding a
      displacement to a point, and why adding coordinates from different spaces
      is not meaningful without conversion. Introduce translation and uniform
      scale through x and y arithmetic. Show that a translation affects a point
      but cancels from the displacement between points. The named Point and step
      comparison follows the marked point and the local step (10, 0); avoid
      treating a movement as a point whose origin should also move. Relate view
      zoom to units and pan to a displacement in V, rather than rewriting the
      card's stored coordinates.
  - title: Turn the group around a known pivot
    brief: >-
      Derive the example's clockwise quarter-turn from where its two unit steps
      go: (1, 0) becomes (0, 1), and (0, 1) becomes (-1, 0). Then extend to an
      arbitrary angle by introducing cosine and sine as the components of the
      turned unit step, with a unit-circle inset and the actual coordinate
      equations. Explain the degrees used in the controls and DOMMatrix versus
      radians required by JavaScript trigonometric functions if those functions
      appear. The named Pivot comparison holds the card centre fixed while
      contrasting rotation about its origin and about its centre. Derive
      subtract pivot, rotate, add pivot before writing a product of transforms.
      Distinguish turning the group from turning the view; the camera-rotation
      extension gives a concrete instance of the same rule.
  - title: Six numbers describe the whole placement
    brief: >-
      Build x' = ax + cy + e and y' = bx + dy + f from the mapped origin and
      the two mapped unit steps already encountered. Define an affine transform
      through this linear part plus translation; explain that straight lines map
      to lines or, under collapse, points, and that parallel directions are
      preserved unless collapsed. Angles and lengths need not be preserved.
      Use a labelled basis-and-origin diagram, with the record's actual card to
      world coefficients. Introduce a matrix as a compact table for these two
      equations. Derive the extra coordinate: 1 for a point, 0 for a displacement,
      so one 3 by 3 table expresses both operations. State column vectors and the
      six-value browser order [a, b, c, d, e, f] explicitly. Distinguish display
      layout of the table from the constructor's value order; derive the identity
      mapping rather than assuming its name is known.
  - title: Put the conversions together in the right order
    brief: >-
      Compose the card, group and view mappings by substitution, then show how
      matrix multiplication packages that substitution. Work one coefficient
      through the calculation so multiplication is an understood operation,
      not an unexplained API call. Introduce M_A_from_B only after naming its
      source and destination, and use matching spaces to check composition.
      Explain that the rightmost mapping acts on the point first with this
      column-vector convention. The named Follow the card table shows the
      complete baseline route and the composed coefficients; check they agree.
      The named Pan then zoom comparison lets the reader change zoom and switch
      between T(pan)S(zoom) and S(zoom)T(pan), with numerical coordinates and a
      visible pan arrow. At the baseline it contrasts V (320, 320) with
      (380, 360). Let the reader predict which pan distance changes with zoom.
      Keep controls labelled in the same terms as the prose, provide reset and
      a static baseline, and identify it as an illustrative model.
  - title: Follow the pointer back to the card
    brief: >-
      Define an inverse as the mapping which undoes a conversion. Reverse the
      chain and undo its steps in reverse order; the baseline client point
      (440, 400) must recover card point (10, 10). Derive the 2 by 2 inverse by
      solving the two scalar equations after subtracting the translation, and
      name the denominator ad - bc as the determinant only when it is needed,
      requiring it to be non-zero before dividing.
      Explain an inverse of a product through undoing actions, not a memorised
      formula. The named Out and back figure connects the forward and reverse
      routes. Test the recovered coordinates against the card's local rectangle
      [0, 80] by [0, 40]; state that this is a filled-rectangle geometry test,
      not a complete policy for strokes, overlap, occlusion or selection.
    heading:
      - title: Connect the maths to browser coordinates
        brief: >-
          Define browser client coordinates and CSS pixels before using clientX
          and clientY. V is the root SVG's user space, and is not generally the
          browser viewport or a physical-pixel buffer. Use nested SVG groups and
          explicit matrix values to connect the model to rendering. Explain that
          getScreenCTM supplies the element-local to browser-client mapping,
          including the browser bridge; invert that matrix once to map a pointer
          to the card. Give the complete small DOMMatrix/DOMPoint recipe with
          checks for a missing matrix and a non-finite inverse/result; explain
          that these mean input cannot be mapped and retain the last valid
          state. The following section explains the geometric loss of a unique
          inverse. Compare the explicit model composition
          with the browser-supplied matrix in a later browser check. The named
          Half-size editor comparison uses the record's 400 by 300 CSS rendering
          of the 800 by 600 viewBox, showing why subtracting a bounding rectangle
          alone is insufficient. Do not multiply client coordinates by device
          pixel ratio or add page scroll to a client-space matrix. Keep display
          and input on the same current transform state.
  - title: When the way back disappears
    brief: >-
      Return to the determinant as an area-scale test, justified by the mapped
      unit steps. The named Collapsed group figure applies zero horizontal group
      scale before rotation and shows two distinct card points mapping to the
      same client point. Explain the lost information and why neither reversing
      steps nor an API can recover a unique position. Distinguish a negative
      determinant, which reflects an axis, from a zero determinant. Explain that
      a very small non-zero scale can greatly amplify pointer error even though
      an inverse mathematically exists; do not present a universal determinant
      cutoff as a numerical-stability test. Require finite input/state, positive
      bounded editor zoom, rejection of invalid inverses, and retention of the
      last valid interaction state as explicit policy for this example.
  - title: Keep the chosen point under the pointer
    brief: >-
      Finish the root's implementation story by stating what each interaction
      changes: panning changes the view translation in V, rotating changes a
      specified placement about a named pivot, and moving the card changes its
      translation in G. Introduce an invariant as something an operation keeps
      true. Derive anchored zoom from keeping the world point under the pointer
      fixed, including the baseline zoom 2 to 3 and new pan (-70, -100). Explain
      that a card drag retains the grabbed local point and converts pointer
      movement into the card's parent space; dividing a client movement by zoom
      alone fails once axes or the browser bridge differ. Give a compact
      implementation checklist covering named spaces, multiplication order,
      pivot, current state and valid inversion so the reader can build the
      baseline editor without another page. Only then introduce the deeper
      gesture article. Keep event-lifecycle detail and the fuller gesture
      implementation there.
    nested_article:
      topic: Anchored zoom, rotation and dragging through transformed coordinate spaces
      title: Keep a diagram under the pointer
      brief: >-
        Build on Coordinates in a zoomable editor, with reminders and links for
        its named spaces, composition and inverse. Extend the same Review board
        state to implement anchored zoom and a card drag that preserve the
        grabbed point through a rotated parent and a resized SVG. Derive updates
        from invariants and the space in which each stored parameter lives.
        Include panning in V and rotation about a chosen point, and show how the
        same invariants work when the view itself is rotated. Use the recorded
        drag and zoom snapshots, with a manipulable comparison between the
        derived update and the tempting wrong-space update. The reader should
        be able to reproduce those snapshots, explain the failed update,
        implement pointer capture and gesture cancellation, and diagnose a
        stale or singular mapping without corrupting state. Reuse one source
        of geometry and transform data; distinguish model invariants from
        observed browser events. Scope is a small single-pointer editor and a
        supplied zoom-factor input, not a full touch recogniser, wheel-device
        normalisation, scene graph framework or undo system. Check event API
        claims against primary sources during child planning. Do not repeat
        the root's matrix derivation or add further child articles.
