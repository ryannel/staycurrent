topic: Measuring latency percentiles across a service
title: Building trustworthy latency measurements
brief: Continue Understanding latency percentiles to make its performance-evidence workflow implementable
  for the shop's order-history service. Build on its definitions, rank convention, start cohorts, outcome-aware
  300 ms budget, pooling and class-mix examples; give short reminders and links rather than reteaching
  statistics. Follow docs/coverage/latency-percentiles-example.md, including its centrally settled child
  extensions and Excluded health check. Teach the reader to record a whole logical caller request, reconstruct
  a cohort at a cutoff, instrument a compatible histogram, combine service-wide observations, choose enough
  duration detail for a decision, and inspect whether a load generator actually offered the intended demand.
  Own a small complete runnable caller-record fixture and a separate Prometheus query fixture, with inputs,
  expected outputs and evidence limits. Distinguish a start-cohort objective from a terminal-observation
  dashboard throughout. All supplied traffic is constructed; no production telemetry or load-test result
  is implied. Keep monitoring architecture, tracing systems, long-term reliability policy and resource
  diagnosis outside scope. Complete this contribution within this article; no further article is commissioned.
heading:
- title: Record the whole caller request
  brief: 'Start with the reader''s task: make the root''s release comparison reproducible. The named Caller
    record path diagram follows start, optional attempts, complete result or terminal failure, event record
    and duration observation. Mark the caller boundary; a server handler''s timer cannot supply it. Introduce
    an event record as a saved fact about one request and an identifier as its joining key before the
    schema. Use the root''s logical request and attempt reminder to place the timer outside any retry
    loop. The examples themselves contain no retries.'
  heading:
  - title: Keep starts, outcomes and elapsed time together
    brief: 'Specify a complete small Python caller recorder with an injected transport and clock for deterministic
      replay, then show its real-clock substitution points. Begin timing before caller-side dispatch/waiting;
      classify success only after the complete useful history result has arrived, not upon receipt of
      headers. Persist a start before dispatch in the fixture; append one terminal event with the same
      identifier on complete success, terminal error or caller deadline. Retain explicit starts without
      terminals. Define monotonic clock as a clock suitable for elapsed differences and use its integer
      readings for duration; record UTC start time separately for real calendar-window membership, without
      subtracting remote clocks. Explain the fixture''s one relative millisecond clock before using its
      fields. Carry eligibility and the class known at start unchanged to the terminal event. Remind the
      reader that eligible means real history requests for the intended operation, excluding identified
      synthetic health checks; failures of real requests remain eligible. Record this choice as true or
      false at start rather than infer it from duration or outcome. Permit unclassified for the core data
      because their class membership is unspecified. Keep identifiers and detailed causes in event records.
      Define the bounded outcome vocabulary success, error and deadline. Validate duplicate or conflicting
      terminals and impossible timestamps rather than silently double-counting. A deadline records the
      actual caller terminal wait; its configured limit is not an observed duration, and the constructed
      exact 300 ms deadline does not predict scheduler precision. State the fixture''s complete-record
      assumption, logging overhead, and loss/crash limitation: an absent start cannot be inferred from
      this log, and a missing terminal does not prove live work. Production collection must check coverage
      before making a complete-population claim.'
- title: Rebuild the cohort at the assessment time
  brief: Introduce a reducer as the small program that joins these events and calculates the report. The
    named Cohort replay listing must include a complete input fixture, validation, selection, arithmetic
    and expected output; it is not pseudocode with an unspecified denominator. It should be runnable locally
    without a service or Prometheus installation.
  heading:
  - title: Select starts before counting successes
    brief: 'Filter eligible logical requests by start >= window_start and start < window_end. Retain those
      identifiers after the window closes. Reconstruct terminal state only from events available by the
      assessment, ignoring later terminals even when the full replay file contains them. State the distinction
      between event time and collection time; a reconstruction of what was known then also filters by
      collection time, while this fixture assumes prompt complete collection. Compute timely successes
      with outcome == success and elapsed <= 300 ms; include every selected eligible start in the denominator.
      Output starts, known terminals by outcome, outstanding count and ages, timely-success lower/upper
      bounds, and complete/incomplete duration status alongside the result. Do not append pending ages
      to the duration distribution. Evaluate the settled Requests still waiting state: ten starts, eight
      timely successes, two pending, bounds 80–90%, completed-subset p99 80 ms, no final whole-cohort
      p99. At an inclusive assessment cutoff, process terminal events at that instant first; with complete
      records, a still-pending request of age exactly 300 ms cannot gain a timely terminal event strictly
      later.'
  - title: Keep later completions in their original cohort
    brief: Use the proposed separately labelled Later completions with an older start table. Preserve
      the original ten-start cohort; add an older-start row only in this extended fixture to expose its
      exclusion by the start filter and inclusion in a terminal-event window. At 300000 ms the cohort
      remains at 80–90%, while the exact terminal-event set in [0,300000) has nine timely successes out
      of nine. At 300300 ms the original cohort is complete at 9/10, with final raw p99 600 ms; its last
      two terminal events fall in the later terminal window, whose timely-success fraction is 1/2. The
      later start cohort is empty in this fixture, so its objective is undefined, not 100%. Show the two
      selection predicates next to the same event rows. These are exact event-set results, not claims
      that a scraped rate query has exact event-window attribution. Re-run the reducer on the settled
      Failure and deadline variation to obtain 988/1000 (98.8%); make the incorrect duration-only 990/1000
      visibly fail the success predicate.
- title: Observe terminal durations in Prometheus
  brief: 'Define Prometheus here as the concrete metric collection and query tool. Explain its data model
    before choosing bounded labels: a time series is a sequence of timestamped readings identified by
    one metric name and its complete set of labels; the metric name says what quantity is read, and each
    label is a named attribute with a value. Changing a label value gives a different series. Define a
    counter as an accumulating total between resets, a scrape as a periodic reading of exposed totals,
    and a sample as one stored value with its reading timestamp. A sample of a total is not one request
    duration. Extend the existing One termination, two records diagram with the named One observation,
    repeated readings table from the proposed example delta. It reuses only the existing Excluded health
    check fixture and its eligible-01 and check-01 records, in fresh isolated state; no core request or
    Synthetic query replay clock changes. Follow the unique eligible-01 terminal at 80 ms through the
    event-log entry and eligibility gate to one 0.08 second duration observation. Before the table, remind
    the reader that a histogram stores duration counts and explain seconds, cumulative inclusive upper-bound
    buckets, le, _count and _sum: this observation increments each configured bucket whose upper bound
    includes 0.08 by one, increments _count by one and adds 0.08 to _sum. Show the complete stored identity
    of a bucket, count and sum series, including request_class, outcome and scrape job/instance labels;
    name the exporter role here. Fabricated scrapes at 10, 90 and 130 ms read zero, then the updated totals,
    then those same totals after excluded check-01 terminates at 120 ms. Different scrape timestamps extend
    each existing series without creating more request observations. Other class/outcome totals remain
    zero. Retain excluded events for audit, with no histogram observation. This histogram has terminal-observation
    attribution, not start-cohort attribution. The pending requests have made no duration observations
    yet. These readings are planned teaching snapshots, not an executed scrape or replacement query fixture.'
  heading:
  - title: Export compatible buckets with bounded labels
    brief: 'Specify the classic histogram history_caller_duration_seconds, constructed with the Python
      prometheus_client Histogram API, bounded request_class and outcome labels, and common finite bounds
      0.1, 0.2, 0.3, 0.6, 1 and 2 seconds plus +Inf. Explain seconds before converting the root''s milliseconds.
      Reuse the series identities and cumulative bucket/count/sum meanings just shown in One observation,
      repeated readings; now show initialization of all permitted label combinations before traffic so
      zero successes are represented rather than silently missing. Core observations use request_class=unclassified;
      the separate mix cohorts use small and large, preserving their own membership. No request IDs, raw
      URLs or customer IDs become labels. Scrape job/instance identify caller exporters, not history-1/history-2
      server handling. For the aggregation fixture use caller-a and caller-b as an explicitly constructed
      exporter partition of the baseline''s same 900/100 observations; do not infer caller deployment
      or routing from the root''s server split. Use the named Raw requests to buckets table from the extension
      for cumulative counts, outcome slices and sums. Supply a short runnable recording/exposition example,
      shared with the event fixture''s terminal handler. After validation and duplicate handling, gate
      the call to observe on the joined start record''s eligible=true; eligible=false must skip observe
      entirely for this metric, regardless of success, error or deadline. Both event-cohort selection
      and metric recording use that same carried eligibility value. The histogram therefore contains only
      eligible logical history requests, with no additional eligibility label; both query populations
      inherit that metric contract. Guarantee at most one observation per eligible terminal event and
      zero per excluded terminal in that in-process example. Use the separately labelled Excluded health
      check input/output table in the canonical example: retain an excluded 20 ms success in the audit
      log, while eligible cohort outputs and every histogram bucket, _count and _sum remain unchanged.
      Run it with a fresh event list and isolated histogram state; never append it to core data. Explain
      that log and metric writes are not an atomic durable transaction and a crash can leave their totals
      different. Reconcile against coverage evidence rather than promising exactly once collection through
      restarts. Deploying or designing a durable telemetry pipeline is out of scope.'
  - title: Combine observations before asking for p99
    brief: 'Introduce PromQL as the query language, rate as change per second over the stated range, sum
      as addition of values from selected series at an evaluation time, and histogram_quantile as estimation
      from the combined buckets. Reuse One observation, repeated readings: each metric name plus complete
      label set identifies a separate sampled history; rate first uses the readings within each selected
      bucket series. Then sum by (le) groups those per-series rates with the same le value, adding across
      job, instance, request_class and outcome while retaining one result per upper bound. It does not
      add repeated scrape totals or merge different upper bounds. Contrast the same bucket identity with
      outcome=error or another exporter as a distinct input, then retain request_class as a second grouping
      label when class-specific results are needed. Explain the operations before presenting the full
      expression. Use histogram_quantile(0.99, sum by (le) (rate(history_caller_duration_seconds_bucket{job="history-callers"}[5m])))
      for a pooled all-outcome caller-terminal p99, in seconds. Explain that by (le) retains the bucket
      identity while adding exporter, class and outcome counts; the selector must include exactly the
      intended service/environment. The all-outcome result includes eligible failures; the observation
      gate has already excluded synthetic health checks before any query runs. A query cannot recover
      eligibility discarded by a recorder that observed excluded traffic. Apply rate before summing so
      per-exporter resets remain detectable. Require identical classic bucket layouts, units, boundaries
      and observation semantics across exporters; reject a mixed-layout rollout rather than silently merging
      mismatched le series. Reuse the root''s failed average-of-quantiles lesson in one compact query
      comparison: an exported summary quantile is already computed and cannot be pooled into the service
      p99 by either ordinary or request-weighted averaging. Python''s Summary API is not the quantile-producing
      implementation being demonstrated; do not invent that output. For comparable class evidence retain
      request_class in sum by (le, request_class), alongside the pooled result; retain outcome similarly
      for diagnostic distributions. Return to mix A/B without assigning those classes to the core observations.'
- title: Keep the budget count more precise than the percentile
  brief: 'Use Raw requests to buckets in three views: the root''s coarse ranges converted to cumulative
    classic bounds 0.1, 1 and +Inf; the decision layout with an explicit 0.3 second boundary; and a single
    finer boundary at 0.55 seconds around the changed cohort''s tail. Derive classic linear interpolation
    inside the containing bucket, defining lower bound, upper bound, previous cumulative count and bucket
    count where used. Label every result an estimate. Both coarse p99 estimates are about 918.18 ms, despite
    raw p99 values 200 and 600 ms; the coarse data still only locate each raw p99 in (100,1000] ms. Decision-layout
    estimates are 200 and about 457.89 ms; adding 550 ms narrows the latter estimate to about 576.32 ms,
    without restoring raw values. This is duration-resolution loss, distinct from missing requests or
    uncertainty about future traffic. The threshold''s explicit boundary preserves its observed success
    count: use sum(rate(history_caller_duration_seconds_bucket{job="history-callers",outcome="success",le="0.3"}[5m]))
    / sum(rate(history_caller_duration_seconds_count{job="history-callers"}[5m])) and explain numerator
    and denominator populations before the query. Its meaning is timely successes among eligible terminal
    observations, not among starts. Both numerator and denominator use the metric''s eligibility gate;
    outcome=success narrows only the numerator, so eligible errors and deadlines remain in the denominator.
    The exact snapshot fractions are 99%, 98% and 98.8% for baseline, changed and the failure variation;
    fast error and deadline remain in the denominator. An empty or zero-rate denominator is no traffic/undefined,
    not a healthy objective. Distinguish exact threshold classification within the observed histogram
    from approximate time attribution after scraping. Give a compact format choice: this executable path
    uses classic histograms for its explicit boundary; native histograms instead carry a distribution
    in a histogram sample and use different query syntax. Define a bucket schema as the rule setting its
    boundaries: custom boundaries are explicitly chosen; standard exponential boundaries are spaced by
    a fixed multiplier, with configurable resolution, plus a zero bucket for values close to zero. State
    that interpolation depends on this schema: classic histograms, native histograms with custom boundaries
    and native zero buckets use linear interpolation; standard exponential native non-zero buckets use
    exponential interpolation, assuming observations would be uniformly spread among hypothetical finer
    exponential buckets. Check the selected client, server, scrape configuration and any storage path
    before advising native use; do not call them universally unsupported or prescribe a format irrespective
    of stack. A native fraction at an unaligned 300 ms threshold can be estimated: retain a separate exact
    outcome-aware threshold counter if exact classification is required. Avoid a second native implementation
    or a format survey.'
- title: Check the query against a known recording
  brief: Supply a separate runnable promtool expression fixture with the complete input series, evaluation
    time and expected labels/values, using the proposed Synthetic query replay clock. Feed one core batch's
    histogram counts into a synthetic counter jump, with regular 15 second samples before and after it;
    this tests the expressions without inventing original request arrival times. Run baseline, changed
    and failure variations separately. Expect the interpolation and ratio values above, not the raw ranks.
    Check outcome slices, pooling, no-success/positive-denominator, no-traffic, missing-series and an
    exporter reset. Reject mismatched bucket layouts before evaluating the comparison. Explain that the
    counter samples were manufactured query inputs; a successful fixture proves their query arithmetic,
    not instrumentation coverage or real scrape reliability. Scrapes assign observed counter changes to
    intervals, so terminal events near window edges are not an exact event selection; rate/increase can
    extrapolate and need not produce integer request counts. Inspect scrape gaps, absent targets, initialization
    and resets before trusting a result; rate's reset handling cannot restore unobserved increments lost
    in a restart. Keep the exact event-set cutoff demonstration separate from these scrape samples. Publish
    the actual versions and execution evidence with the eventual fixture, and mark anything not executed
    as a specification.
- title: Make sure the test offered the intended work
  brief: Use the named Scheduled requests during a pause timeline and complete table in the extension,
    a separate six-request experiment with intended starts every 100 ms in [0,600). Define offered demand
    and generator lag (actual minus intended start) before using them. Compare independent dispatch with
    one caller waiting for each reply; service responses follow the explicit constructed pause model,
    not an inferred database stall. Show intended starts, actual starts, terminal times, outcomes, dropped/unsent
    starts and pending work at 600 ms. Independent dispatch offers six requests with durations 560,460,360,260,160,80
    ms; serial dispatch starts only at 0 and 560 ms, so four intended requests are unsent, its second
    actual caller wait is only 80 ms and its generator lag is 460 ms. Define coordinated omission as suppression
    of intended independent demand when issuing the next request depends on earlier completion. A serial
    workload can correctly model a genuinely serial user; it cannot establish capacity under the six independent
    arrivals. Keep actual-start caller latency separate from intended-to-terminal delay, and do not invent
    durations for unsent requests or add them to the root's eligible-start denominator. Inspect arrival
    rate, actual starts, dropped work, generator lag, completions and outstanding work together. Mention
    an arrival-rate executor as a practical way to schedule independently, while checking available workers
    and dropped iterations; an open scheduling setting alone does not prove demand was delivered. Corrected
    or synthetic latency values cannot recreate unoffered contention. This small example demonstrates
    accounting and test suitability, not a realistic queue or universal tail-estimation correction.
- title: Decide whether the measurement supports the change
  brief: 'Finish with the named Measurement handover table, tied to the root''s Release comparison record.
    Each row pairs an evidence defect with an action and the result needed to proceed: retrieve missing
    start/outcome records for cohort completeness; inspect a stalled cohort whose best possible budget
    result already fails; retain finer duration detail when coarse buckets hide the comparison; fix eligibility
    or outcome predicates when errors look fast; compare matched classes when mix changes; and rerun suitable
    offered demand when the generator suppressed arrivals. For the settled complete core cohorts, the
    exact 300 ms counts support the root''s 99% versus 98% recorded-cohort judgement; the synthetic metric
    fixture separately verifies query arithmetic for terminal observations. Neither proves a causal release
    regression or the next window''s behaviour. Require population, boundary, units, window attribution,
    assessment time, starts/terminals/pending, class mix, outcomes, representation and generator evidence
    to travel with the comparison. The reader can implement and audit the two paths after this article;
    subsequent diagnosis belongs to the existing performance reading, not another child in this commission.'
