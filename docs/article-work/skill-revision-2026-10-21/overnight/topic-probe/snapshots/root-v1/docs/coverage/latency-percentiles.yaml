topic: Latency percentiles
title: Understanding latency percentiles
brief: Take an engineer new to latency statistics to sound practical judgement about performance evidence.
  Follow the fictional shop's order-history service in docs/coverage/latency-percentiles-example.md from
  a healthy-looking average and slow requests to a defensible release decision. Teach the reader to define
  the measured requests, interpret their ranked durations, choose a useful budget, combine distributions
  correctly and recognise evidence that cannot support a conclusion. The root completes an interpretation
  and decision workflow; its child implements the measurement path. Introduce needed terms at first use,
  without assuming the database collection. All example numbers are constructed, not observed service
  behaviour. Keep database diagnosis and general monitoring architecture outside this commission.
heading:
- title: Find p99 among the requests
  brief: 'Open with the shop''s unchanged typical wait and deteriorating slow requests. Define latency
    as elapsed time across a stated start and finish, and a distribution as the collection of those durations.
    Use the named Sorted requests figure and accompanying exact count table to locate p50, p95 and p99
    in the baseline''s 1,000 observations. Explain percentile, rank, median and tail where first needed.
    State the teaching calculation: sort ascending and choose position ceil(p times N), with p written
    as a fraction. Other estimators can differ, especially with few observations; do not imply this is
    every tool''s algorithm. Contrast the mean with p99 using the baseline and changed datasets. Show
    the remaining observations beyond p99 and their maximum: p99 is neither the slowest request nor a
    guarantee for the next one.'
- title: Decide whose wait you are measuring
  brief: Use the named One history request timeline to distinguish caller elapsed time, server handling,
    waiting and individual database calls. Define the measurement population and five-minute observation
    window before comparing numbers. One logical request can contain several attempts after a retry; define
    both and retain the logical request's total wait. Keep outcome categories visible, including failures
    and caller deadlines, rather than silently dropping them. A server-only metric excludes time outside
    its boundary. Explain that request percentiles do not establish the percentage of users affected,
    and that component p99 values do not add to an end-to-end p99. Require direct end-to-end measurement
    for that claim. Distinguish the synthetic caller-boundary dataset here from any existing database
    timings.
- title: Count requests that meet the budget
  brief: 'Choose a budget from the operation''s needs, not from a ritual choice of p99. Define a service
    level objective only when naming the illustrative target: at least 99% of eligible logical history
    requests succeed within 300 ms. The named Budget table shows baseline 990/1,000 and changed 980/1,000.
    Explain the complementary questions: a percentile asks how long a chosen fraction waited; a budget
    count asks what fraction met a chosen duration. Include all eligible requests in this objective''s
    denominator and only timely successes in its numerator; report success and failure durations separately
    for diagnosis. Fast errors cannot improve objective compliance. Define eligibility explicitly rather
    than assuming every HTTP response is useful work. Keep this five-minute teaching decision distinct
    from a full long-term reliability policy. Separate routes and meaningful request classes before comparing
    releases, because a changed mix can move the overall percentile even when each class is unchanged.'
- title: Combine the requests before finding their percentile
  brief: 'Split the baseline across history-1 and history-2 using the example record. The named Two instances,
    one service figure must expose request counts, local p99 values, the incorrect arithmetic and count-weighted
    averages, and the actual percentile of the pooled observations. Neither average reconstructs the pooled
    rank. The same limitation applies when combining time intervals. Introduce a histogram as counts grouped
    by duration ranges: retaining compatible distribution information permits combination before calculating
    the percentile. Contrast that with keeping only a precomputed percentile. Explain what information
    a dashboard must retain; leave metric formats and query syntax to the child. Finish the conceptual
    counterexample before offering that deeper route.'
  nested_article:
    topic: Measuring latency percentiles across a service
    title: Building trustworthy latency measurements
    brief: 'Continue the same shop, boundaries, datasets and budget to make the commission''s measurement
      method implementable. Follow recorded durations into a concrete Prometheus histogram and a service-wide
      percentile and budget fraction; explain each metric, label, unit and query operation before use.
      Preserve request counts, outcomes and windows. Compare raw ranks with histogram estimates using
      a named Raw requests to buckets worked table, distinguishing duration-resolution error from uncertainty
      about future traffic. Demonstrate why averaging precomputed summary quantiles fails, how compatible
      histograms can be combined, and how bucket boundaries or native-histogram resolution affect the
      decision. Include the 300 ms boundary case and verify tool/version support rather than prescribing
      one metric format universally. Use a named Scheduled requests during a pause timeline to explain
      how a test whose callers wait for replies can suppress independent offered demand: define coordinated
      omission, retain intended and actual starts, generator lag and uncompleted work, and distinguish
      a genuinely closed-loop workload from an unsuitable capacity test. Supply a small reproducible calculation/query
      fixture with explicit expected results and evidence limits; do not present invented telemetry as
      a deployed measurement. This is a measurement implementation within the same expertise goal, not
      a broader monitoring course.'
- title: Check what a tail estimate can support
  brief: Use the named Request count and window comparison to reduce the observed set from 1,000 requests
    to a separate 100-request illustrative window. Mark the selected ranks so the reader can see how few
    observations determine the high percentile; do not invent a universal minimum sample count. Separate
    an exact percentile of recorded values from an estimate of behaviour under future traffic. A longer
    window may bring more observations but conceal a short incident or mix different operating conditions.
    Averages of plotted p99 points cannot recover the full-window p99. Show request counts and time boundaries
    beside the result. Distinguish this evidence limitation from loss of duration detail in histogram
    buckets, reminding the reader of the child's worked measurement route. Omitted failures, selectively
    recorded requests and changing measurement boundaries require fixing the evidence, not interpreting
    another decimal place.
- title: Make the performance decision
  brief: 'Resolve the opening shop comparison: baseline meets the illustrative budget in its recorded
    window; the changed dataset misses it even though the median is unchanged and the mean moves little.
    These constructed samples establish arithmetic, not a causal release regression or future guarantee.
    Use a compact named Release comparison record to ask for matching request classes, demand, boundaries,
    counts, outcomes, duration representation and windows; compare useful completions as well as latency
    so reduced offered work or errors cannot masquerade as improvement. Choose accept, investigate or
    measure again from the evidence and its limits. An elevated p99 identifies a symptom, not a database
    or queueing cause. Point to existing performance and concurrent-load reading only for that subsequent
    diagnosis; the reader can complete this article without following it.'
