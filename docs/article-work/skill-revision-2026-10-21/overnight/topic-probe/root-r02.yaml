topic: Latency percentiles
title: Understanding latency percentiles
brief: >-
  Take an engineer new to latency statistics to sound practical judgement about performance evidence.
  Follow the fictional shop's order-history service in docs/coverage/latency-percentiles-example.md,
  with the proposed additions in example-extension-r02.md, from a healthy-looking average and slow
  requests to a defensible release decision. Teach the reader to define the measured requests,
  interpret their ranked durations, choose a useful budget, account for unfinished and failed work,
  compare request classes and combine distributions correctly. The root completes an interpretation
  and decision workflow independently; its contextual child makes the measurement path implementable.
  Introduce needed terms at first use, without assuming the database collection. All example numbers
  are constructed, not observed service behaviour. Keep database diagnosis and general monitoring
  architecture outside this commission.
heading:
  - title: Find p99 among the requests
    brief: >-
      Open with the shop's unchanged typical wait and deteriorating slow requests. Define latency
      as elapsed time across a stated start and finish, and a distribution as the collection of those
      durations. Use the named Sorted requests figure and accompanying exact count table to locate
      p50, p95 and p99 in the baseline's 1,000 observations. Explain percentile, rank, median and tail
      where first needed. State the teaching calculation: sort ascending and choose the one-based position
      ceil(p times N), meaning round p times N up to an integer, with p written as a fraction. Other
      estimators can differ, especially with few observations; do not imply this is every tool's algorithm. Define the mean as total duration divided
      by request count, and contrast it with p99 using the baseline and changed datasets. Show the remaining observations beyond p99 and their maximum:
      p99 is neither the slowest request nor a guarantee for the next one. These are complete sets;
      the next section shows why that qualification matters.
  - title: Decide whose wait you are measuring
    brief: >-
      Use the named One history request timeline to distinguish caller elapsed time, server handling,
      waiting and individual database calls. Define a logical request and an attempt before explaining
      retries: a retry is another attempt within the logical request's total caller wait. Define the
      population, an attribution rule saying which window a request belongs to, and the later assessment
      time before comparing numbers. Define eligible requests as real history requests for the intended
      operation, excluding identified synthetic health checks. For this article a start cohort means those
      requests whose caller start falls within a stated five-minute window, including its start and excluding
      its end; keep those requests assigned to that window even if they finish later. The two core
      cohorts are assessed after all have terminated; their aggregate counts imply no arrival order.
      Define a terminal event as receiving the complete result or a terminal failure at the caller.
      Expiry of a caller deadline ends the caller's wait as a terminal failure even if server work
      continues; outstanding means the caller has no terminal outcome yet. Keep outcome categories visible.
      The named Requests still waiting table introduces the separate ten-request cutoff variation:
      eight have succeeded in 80 ms, and two are outstanding with ages 400 ms and 100 ms at the window's
      end. The completed subset's p99 is 80 ms, but the full start cohort's final duration distribution
      is not yet known. Do not insert ages as completed durations or invent eventual server completion.
      A window counting terminal events is a different valid question: work still waiting has not yet
      entered it, and requests started earlier may enter it. Explain that distinction before interpreting
      a completion-time dashboard during a stall. A server-only metric excludes time outside its boundary.
      Request percentiles do not establish the percentage of users affected, and component p99 values
      do not add to an end-to-end p99; require direct end-to-end measurement for that claim. Distinguish
      these synthetic caller-boundary examples from existing database timings.
  - title: Count requests that meet the budget
    brief: >-
      Choose a budget from the operation's needs, not from a ritual choice of p99. Define a service
      level objective only when naming the illustrative target: at least 99% of eligible logical history
      requests succeed within 300 ms, including equality, for the start cohort already defined. Eligibility
      excludes identified synthetic health checks, not failed real history requests. The named Budget
      table first shows baseline 990/1,000 and changed 980/1,000. Explain the complementary questions:
      a percentile asks how long a chosen fraction waited; a budget count asks what fraction met a chosen
      duration and outcome. Include every eligible start in the denominator and only timely successes
      in the numerator. Extend that same table with the complete Failure and deadline variation: replace
      two baseline 80 ms successes with one 20 ms terminal failure and one caller deadline at 300 ms.
      Count 988 timely successes out of 1,000, or 98.8%; counting all terminal durations at most 300 ms
      would misleadingly give 990/1,000. The caller deadline is a known failed caller wait, not a known
      eventual successful service duration. Report success and failure durations separately for diagnosis.
      Return to Requests still waiting: keep all ten starts in the denominator, with eight timely successes,
      one outstanding request already too old to succeed within 300 ms and one still unresolved. The final
      fraction can only be 80% or 90%, so the 99% target is already missed even though the completed subset
      suggests 8/8 and p99 80 ms. In general label a cohort result provisional while a young pending request
      can still change it; a duration percentile may remain incomplete after the budget outcome is settled.
      Keep this local teaching decision distinct from a full long-term reliability policy.
    heading:
      - title: When the work changes
        brief: >-
          Use the named Same class speeds, different mix table from the shared extension. Define a request
          class as a meaningful subset before comparing releases. In two separate complete 1,000-request
          start cohorts, small histories always take 80 ms and large histories always take 600 ms. Change
          their counts from 995/5 to 980/20 while holding both class distributions fixed. Locate pooled
          rank 990: it is 80 ms in the first cohort and 600 ms in the second. Each class's p99 is unchanged.
          This is a constructed change of mix, not the cause of the core baseline/changed difference or
          an observed regression. Require both pooled and comparable per-class evidence: the slower
          pooled experience is real, but cannot by itself establish that either class got slower.
  - title: Combine the requests before finding their percentile
    brief: >-
      Split the baseline across history-1 and history-2 using the example record. The named Two instances,
      one service figure must expose request counts, local p99 values, the incorrect arithmetic and
      count-weighted averages, and the actual percentile of the pooled observations. Neither average
      reconstructs the pooled rank. The same limitation applies when combining time intervals. Introduce
      a histogram as counts grouped by duration ranges: retaining compatible distribution information
      permits combination before calculating the percentile. Contrast that with keeping only a precomputed
      percentile. Explain what information a dashboard must retain; leave metric formats and query syntax
      to the child. Distribution pooling does not repair a missing population: the start/terminal-window
      distinction and outstanding work still matter. Finish the conceptual counterexample before offering
      the deeper route.
    nested_article:
      topic: Measuring latency percentiles across a service
      title: Building trustworthy latency measurements
      brief: >-
        Continue the same shop, boundaries, datasets, start-cohort rule and budget to make the commission's
        measurement method implementable. Use caller event records keyed by request identifier, with
        caller start, terminal timestamp and outcome when available, and explicit outstanding state, to
        reproduce the root's start-cohort accounting, including its provisional cutoff bounds. Supply
        an executable small fixture that selects starts in the stated window and evaluates timely success
        without assigning completed durations to pending requests. Retain request identifiers in event
        records, not as unbounded Prometheus labels. Alongside that fixture follow completed caller
        durations into a concrete Prometheus histogram, service-wide percentile and outcome-aware budget
        fraction for its explicitly labelled terminal-observation window. Explain each metric, label,
        unit and query operation before use. A normal histogram updated on termination and queried over
        time does not select requests by their start time; do not claim its range query reconstructs the
        root's start cohort. Demonstrate this difference with Requests still waiting, including older
        starts that can terminate in a later window. Preserve counts, outcomes, request classes and
        attribution rules, and distinguish caller instrumentation from server-only handling metrics.
        Compare raw ranks with histogram estimates using a named Raw requests to buckets worked table,
        distinguishing duration-resolution error from uncertainty about future traffic. Demonstrate why
        averaging precomputed summary quantiles fails, how compatible histograms can be combined, and
        how bucket boundaries or native-histogram resolution affect the decision. Include the 300 ms
        boundary and the failed caller deadline: a duration threshold alone is not timely success.
        Verify tool/version support rather than prescribing one metric format universally. Use a named
        Scheduled requests during a pause timeline to explain how a test whose callers wait for replies
        can suppress independent offered demand: define coordinated omission, retain intended and actual
        starts, generator lag and outstanding work, and distinguish a genuinely closed-loop workload
        from an unsuitable capacity test. Give expected results and evidence limits for the event-record
        and query fixtures; do not present invented telemetry as deployed measurement. Keep this a
        measurement implementation within the same expertise goal, not a broader monitoring course.
  - title: Check what a tail estimate can support
    brief: >-
      Use the named Request count and window comparison to reduce the observed set from 1,000 requests
      to a separate 100-request illustrative window. Mark the selected ranks so the reader can see how
      few observations determine the high percentile; do not invent a universal minimum sample count.
      Separate an exact percentile of a complete recorded set from an estimate of behaviour under future
      traffic and from an incomplete set missing outstanding requests. A longer window may bring more
      observations but conceal a short incident or mix different operating conditions. Averages of plotted
      p99 points cannot recover the full-window p99. Show request counts, start/terminal attribution,
      window boundaries, assessment time and outstanding counts beside the result. Distinguish these
      evidence limitations from loss of duration detail in histogram buckets; the root teaches the
      distinction and the child offers the optional worked implementation. Omitted failures, selectively
      recorded requests and changing measurement boundaries require fixing the evidence, not interpreting
      another decimal place.
  - title: Make the performance decision
    brief: >-
      Resolve the opening shop comparison: baseline meets the illustrative budget in its complete
      recorded start cohort; the changed dataset misses it even though the median is unchanged and the
      mean moves little. These constructed samples establish arithmetic, not a causal release regression
      or future guarantee. Use a compact named Release comparison record to ask for matching request
      classes, demand, boundaries, counts, outcomes, duration representation, window attribution and
      assessment times. Use the earlier worked cases to justify three judgements: investigate the stalled
      ten-request cohort because even its best possible timely-success result misses the target; reject
      counting fast failures or the caller deadline as useful completions; and inspect class mix before
      attributing the pooled p99 rise to slower within-class performance. Compare useful completions and
      eligible starts as well as latency so reduced offered work, errors or outstanding requests cannot
      masquerade as improvement. Choose accept, investigate or measure again from the evidence and its
      limits; collect a complete cohort or better matched class evidence where the relevant conclusion
      remains unresolved. An elevated p99 identifies a symptom, not a database or queueing cause. Point
      to existing performance and concurrent-load reading only for subsequent diagnosis; the reader can
      complete this article without following it or the measurement child.
