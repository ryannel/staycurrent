topic: Latency percentiles
title: Understanding latency percentiles
brief: Take an engineer new to latency statistics to sound practical judgement about performance evidence.
  Follow the fictional shop's order-history service in docs/coverage/latency-percentiles-example.md, including
  its settled cutoff, outcome and class-mix variations, from a healthy-looking average and slow requests
  to a defensible release decision. Teach the reader to define the measured requests, interpret their
  ranked durations, choose a useful budget, account for unfinished and failed work, compare request classes
  and combine distributions correctly. The root completes an interpretation and decision workflow independently;
  its contextual child makes the measurement path implementable. Introduce needed terms at first use,
  without assuming the database collection. All example numbers are constructed, not observed service
  behaviour. Keep database diagnosis and general monitoring architecture outside this commission.
heading:
- title: Find p99 among the requests
  brief: 'Open with the shop''s unchanged typical wait and deteriorating slow requests. Define latency
    as elapsed time across a stated start and finish, and a distribution as the collection of those durations.
    Use the named Sorted requests figure and accompanying exact count table to locate p50, p95 and p99
    in the baseline''s 1,000 observations. Explain percentile, rank, median and tail where first needed.
    State the teaching calculation: sort ascending and choose the one-based position ceil(p times N),
    meaning round p times N up to an integer, with p written as a fraction. Other estimators can differ,
    especially with few observations; do not imply this is every tool''s algorithm. Define the mean as
    total duration divided by request count, and contrast it with p99 using the baseline and changed datasets.
    Show the remaining observations beyond p99 and their maximum: p99 is neither the slowest request nor
    a guarantee for the next one. These are complete sets; the next section shows why that qualification
    matters.'
- title: Decide whose wait you are measuring
  brief: 'Use the named One history request timeline to distinguish caller elapsed time, server handling,
    waiting and individual database calls. Define a logical request and an attempt before explaining retries:
    a retry is another attempt within the logical request''s total caller wait. Define the population,
    an attribution rule saying which window a request belongs to, and the later assessment time before
    comparing numbers. Define eligible requests as real history requests for the intended operation, excluding
    identified synthetic health checks. For this article a start cohort means those requests whose caller
    start falls within a stated five-minute window, including its start and excluding its end; keep those
    requests assigned to that window even if they finish later. The two core cohorts are assessed after
    all have terminated; their aggregate counts imply no arrival order. Define a terminal event as receiving
    the complete result or a terminal failure at the caller. Expiry of a caller deadline ends the caller''s
    wait as a terminal failure even if server work continues; outstanding means the caller has no terminal
    outcome yet. Keep outcome categories visible. The named Requests still waiting table introduces the
    separate ten-request cutoff variation: eight have succeeded in 80 ms, and two are outstanding with
    ages 400 ms and 100 ms at the window''s end. The completed subset''s p99 is 80 ms, but the full start
    cohort''s final duration distribution is not yet known. Do not insert ages as completed durations
    or invent eventual server completion. A window counting terminal events is a different valid question:
    work still waiting has not yet entered it, and requests started earlier may enter it. Explain that
    distinction before interpreting a completion-time dashboard during a stall. A server-only metric excludes
    time outside its boundary. Request percentiles do not establish the percentage of users affected,
    and component p99 values do not add to an end-to-end p99; require direct end-to-end measurement for
    that claim. Distinguish these synthetic caller-boundary examples from existing database timings.'
- title: Count requests that meet the budget
  brief: 'Choose a budget from the operation''s needs, not from a ritual choice of p99. Define a service
    level objective only when naming the illustrative target: at least 99% of eligible logical history
    requests succeed within 300 ms, including equality, for the start cohort already defined. Eligibility
    excludes identified synthetic health checks, not failed real history requests. The named Budget table
    first shows baseline 990/1,000 and changed 980/1,000. Explain the complementary questions: a percentile
    asks how long a chosen fraction waited; a budget count asks what fraction met a chosen duration and
    outcome. Include every eligible start in the denominator and only timely successes in the numerator.
    Extend that same table with the complete Failure and deadline variation: replace two baseline 80 ms
    successes with one 20 ms terminal failure and one caller deadline at 300 ms. Count 988 timely successes
    out of 1,000, or 98.8%; counting all terminal durations at most 300 ms would misleadingly give 990/1,000.
    The caller deadline is a known failed caller wait, not a known eventual successful service duration.
    Report success and failure durations separately for diagnosis. Return to Requests still waiting: keep
    all ten starts in the denominator, with eight timely successes, one outstanding request already too
    old to succeed within 300 ms and one still unresolved. The final fraction can only be 80% or 90%,
    so the 99% target is already missed even though the completed subset suggests 8/8 and p99 80 ms. In
    general label a cohort result provisional while a young pending request can still change it; a duration
    percentile may remain incomplete after the budget outcome is settled. Keep this local teaching decision
    distinct from a full long-term reliability policy.'
  heading:
  - title: When the work changes
    brief: 'Use the named Same class speeds, different mix table from the canonical example. Define a
      request class as a meaningful subset before comparing releases. In two separate complete 1,000-request
      start cohorts, small histories always take 80 ms and large histories always take 600 ms. Change
      their counts from 995/5 to 980/20 while holding both class distributions fixed. Locate pooled rank
      990: it is 80 ms in the first cohort and 600 ms in the second. Each class''s p99 is unchanged. This
      is a constructed change of mix, not the cause of the core baseline/changed difference or an observed
      regression. Require both pooled and comparable per-class evidence: the slower pooled experience
      is real, but cannot by itself establish that either class got slower.'
- title: Combine the requests before finding their percentile
  brief: 'Split the baseline across history-1 and history-2 using the example record. The named Two instances,
    one service figure must expose request counts, local p99 values, the incorrect arithmetic and count-weighted
    averages, and the actual percentile of the pooled observations. Neither average reconstructs the pooled
    rank. The same limitation applies when combining time intervals. Introduce a histogram as counts grouped
    by duration ranges, called buckets: retaining compatible distribution information permits combination
    before calculating the percentile. Contrast that with keeping only a precomputed percentile. Then
    use the compact named Same range counts, different p99 table to show the information those counts
    lose. Re-express each complete core start cohort using three non-overlapping ranges in milliseconds:
    at most 100, greater than 100 and at most 1,000, and greater than 1,000. Both columns contain 900,
    99 and 1 requests respectively. Mark positions 901–999 inside the middle range, including selected
    rank 990. From these range counts alone, each p99 is only known to be greater than 100 ms and at most
    1,000 ms; the baseline''s exact 200 ms and changed cohort''s exact 600 ms cannot be recovered. Keep
    the earlier raw values beside the grouped view to expose the loss. Identical range counts therefore
    cannot establish unchanged p99 or justify an improvement claim: they have hidden the core comparison''s
    real change. Retrieve retained raw durations or collect suitably finer duration detail before deciding
    a comparison that these counts leave unresolved. Do not claim a different estimate restores discarded
    values. This is one view of the settled requests, with no new traffic, missing outcomes or arrival
    schedule. Explain what information a dashboard must retain; leave estimators, metric formats, resolution
    configuration, query syntax and the full executable bucket table to the child. Distribution pooling
    does not repair a missing population: the start/terminal-window distinction and outstanding work still
    matter. Finish both conceptual counterexamples before offering the deeper route.'
  nested_article:
    topic: Measuring latency percentiles across a service
    title: Building trustworthy latency measurements
    brief: Continue Understanding latency percentiles to make its performance-evidence workflow implementable
      for the shop's order-history service. Build on its definitions, rank convention, start cohorts,
      outcome-aware 300 ms budget, pooling and class-mix examples; give short reminders and links rather
      than reteaching statistics. Follow docs/coverage/latency-percentiles-example.md, including its centrally
      settled child extensions and Excluded health check. Teach the reader to record a whole logical caller
      request, reconstruct a cohort at a cutoff, instrument a compatible histogram, combine service-wide
      observations, choose enough duration detail for a decision, and inspect whether a load generator
      actually offered the intended demand. Own a small complete runnable caller-record fixture and a
      separate Prometheus query fixture, with inputs, expected outputs and evidence limits. Distinguish
      a start-cohort objective from a terminal-observation dashboard throughout. All supplied traffic
      is constructed; no production telemetry or load-test result is implied. Keep monitoring architecture,
      tracing systems, long-term reliability policy and resource diagnosis outside scope. Complete this
      contribution within this article; no further article is commissioned.
    heading:
    - title: Record the whole caller request
      brief: 'Start with the reader''s task: make the root''s release comparison reproducible. The named
        Caller record path diagram follows start, optional attempts, complete result or terminal failure,
        event record and duration observation. Mark the caller boundary; a server handler''s timer cannot
        supply it. Introduce an event record as a saved fact about one request and an identifier as its
        joining key before the schema. Use the root''s logical request and attempt reminder to place the
        timer outside any retry loop. The examples themselves contain no retries.'
      heading:
      - title: Keep starts, outcomes and elapsed time together
        brief: 'Specify a complete small Python caller recorder with an injected transport and clock for
          deterministic replay, then show its real-clock substitution points. Begin timing before caller-side
          dispatch/waiting; classify success only after the complete useful history result has arrived,
          not upon receipt of headers. Persist a start before dispatch in the fixture; append one terminal
          event with the same identifier on complete success, terminal error or caller deadline. Retain
          explicit starts without terminals. Define monotonic clock as a clock suitable for elapsed differences
          and use its integer readings for duration; record UTC start time separately for real calendar-window
          membership, without subtracting remote clocks. Explain the fixture''s one relative millisecond
          clock before using its fields. Carry eligibility and the class known at start unchanged to the
          terminal event. Remind the reader that eligible means real history requests for the intended
          operation, excluding identified synthetic health checks; failures of real requests remain eligible.
          Record this choice as true or false at start rather than infer it from duration or outcome.
          Permit unclassified for the core data because their class membership is unspecified. Keep identifiers
          and detailed causes in event records. Define the bounded outcome vocabulary success, error and
          deadline. Validate duplicate or conflicting terminals and impossible timestamps rather than
          silently double-counting. A deadline records the actual caller terminal wait; its configured
          limit is not an observed duration, and the constructed exact 300 ms deadline does not predict
          scheduler precision. State the fixture''s complete-record assumption, logging overhead, and
          loss/crash limitation: an absent start cannot be inferred from this log, and a missing terminal
          does not prove live work. Production collection must check coverage before making a complete-population
          claim.'
    - title: Rebuild the cohort at the assessment time
      brief: Introduce a reducer as the small program that joins these events and calculates the report.
        The named Cohort replay listing must include a complete input fixture, validation, selection,
        arithmetic and expected output; it is not pseudocode with an unspecified denominator. It should
        be runnable locally without a service or Prometheus installation.
      heading:
      - title: Select starts before counting successes
        brief: 'Filter eligible logical requests by start >= window_start and start < window_end. Retain
          those identifiers after the window closes. Reconstruct terminal state only from events available
          by the assessment, ignoring later terminals even when the full replay file contains them. State
          the distinction between event time and collection time; a reconstruction of what was known then
          also filters by collection time, while this fixture assumes prompt complete collection. Compute
          timely successes with outcome == success and elapsed <= 300 ms; include every selected eligible
          start in the denominator. Output starts, known terminals by outcome, outstanding count and ages,
          timely-success lower/upper bounds, and complete/incomplete duration status alongside the result.
          Do not append pending ages to the duration distribution. Evaluate the settled Requests still
          waiting state: ten starts, eight timely successes, two pending, bounds 80–90%, completed-subset
          p99 80 ms, no final whole-cohort p99. At an inclusive assessment cutoff, process terminal events
          at that instant first; with complete records, a still-pending request of age exactly 300 ms
          cannot gain a timely terminal event strictly later.'
      - title: Keep later completions in their original cohort
        brief: Use the proposed separately labelled Later completions with an older start table. Preserve
          the original ten-start cohort; add an older-start row only in this extended fixture to expose
          its exclusion by the start filter and inclusion in a terminal-event window. At 300000 ms the
          cohort remains at 80–90%, while the exact terminal-event set in [0,300000) has nine timely successes
          out of nine. At 300300 ms the original cohort is complete at 9/10, with final raw p99 600 ms;
          its last two terminal events fall in the later terminal window, whose timely-success fraction
          is 1/2. The later start cohort is empty in this fixture, so its objective is undefined, not
          100%. Show the two selection predicates next to the same event rows. These are exact event-set
          results, not claims that a scraped rate query has exact event-window attribution. Re-run the
          reducer on the settled Failure and deadline variation to obtain 988/1000 (98.8%); make the incorrect
          duration-only 990/1000 visibly fail the success predicate.
    - title: Observe terminal durations in Prometheus
      brief: 'Define Prometheus here as the concrete metric collection and query tool. Explain its data
        model before choosing bounded labels: a time series is a sequence of timestamped readings identified
        by one metric name and its complete set of labels; the metric name says what quantity is read,
        and each label is a named attribute with a value. Changing a label value gives a different series.
        Define a counter as an accumulating total between resets, a scrape as a periodic reading of exposed
        totals, and a sample as one stored value with its reading timestamp. A sample of a total is not
        one request duration. Extend the existing One termination, two records diagram with the named
        One observation, repeated readings table from the proposed example delta. It reuses only the
        existing Excluded health check fixture and its eligible-01 and check-01 records, in fresh isolated
        state; no core request or Synthetic query replay clock changes. Follow the unique eligible-01
        terminal at 80 ms through the event-log entry and eligibility gate to one 0.08 second duration
        observation. Before the table, remind the reader that a histogram stores duration counts and
        explain seconds, cumulative inclusive upper-bound buckets, le, _count and _sum: this observation
        increments each configured bucket whose upper bound includes 0.08 by one, increments _count by
        one and adds 0.08 to _sum. Show the complete stored identity of a bucket, count and sum series,
        including request_class, outcome and scrape job/instance labels; name the exporter role here.
        Fabricated scrapes at 10, 90 and 130 ms read zero, then the updated totals, then those same totals
        after excluded check-01 terminates at 120 ms. Different scrape timestamps extend each existing
        series without creating more request observations. Other class/outcome totals remain zero.
        Retain excluded events for audit, with no histogram observation. This histogram has terminal-observation
        attribution, not start-cohort attribution. The pending requests have made no duration observations
        yet. These readings are planned teaching snapshots, not an executed scrape or replacement query fixture.'
      heading:
      - title: Export compatible buckets with bounded labels
        brief: 'Specify the classic histogram history_caller_duration_seconds, constructed with the Python
          prometheus_client Histogram API, bounded request_class and outcome labels, and common finite
          bounds 0.1, 0.2, 0.3, 0.6, 1 and 2 seconds plus +Inf. Explain seconds before converting the
          root''s milliseconds. Reuse the series identities and cumulative bucket/count/sum meanings
          just shown in One observation, repeated readings; now show initialization of all permitted label
          combinations before traffic so zero successes
          are represented rather than silently missing. Core observations use request_class=unclassified;
          the separate mix cohorts use small and large, preserving their own membership. No request IDs,
          raw URLs or customer IDs become labels. Scrape job/instance identify caller exporters, not history-1/history-2
          server handling. For the aggregation fixture use caller-a and caller-b as an explicitly constructed
          exporter partition of the baseline''s same 900/100 observations; do not infer caller deployment
          or routing from the root''s server split. Use the named Raw requests to buckets table from the
          extension for cumulative counts, outcome slices and sums. Supply a short runnable recording/exposition
          example, shared with the event fixture''s terminal handler. After validation and duplicate handling,
          gate the call to observe on the joined start record''s eligible=true; eligible=false must skip
          observe entirely for this metric, regardless of success, error or deadline. Both event-cohort
          selection and metric recording use that same carried eligibility value. The histogram therefore
          contains only eligible logical history requests, with no additional eligibility label; both
          query populations inherit that metric contract. Guarantee at most one observation per eligible
          terminal event and zero per excluded terminal in that in-process example. Use the separately
          labelled Excluded health check input/output table in the canonical example: retain an excluded
          20 ms success in the audit log, while eligible cohort outputs and every histogram bucket, _count
          and _sum remain unchanged. Run it with a fresh event list and isolated histogram state; never
          append it to core data. Explain that log and metric writes are not an atomic durable transaction
          and a crash can leave their totals different. Reconcile against coverage evidence rather than
          promising exactly once collection through restarts. Deploying or designing a durable telemetry
          pipeline is out of scope.'
      - title: Combine observations before asking for p99
        brief: 'Introduce PromQL as the query language, rate as change per second over the stated range,
          sum as addition of values from selected series at an evaluation time, and histogram_quantile
          as estimation from the combined buckets. Reuse One observation, repeated readings: each metric
          name plus complete label set identifies a separate sampled history; rate first uses the readings
          within each selected bucket series. Then sum by (le) groups those per-series rates with the same
          le value, adding across job, instance, request_class and outcome while retaining one result per
          upper bound. It does not add repeated scrape totals or merge different upper bounds. Contrast
          the same bucket identity with outcome=error or another exporter as a distinct input, then retain
          request_class as a second grouping label when class-specific results are needed. Explain the
          operations before presenting the full expression. Use histogram_quantile(0.99,
          sum by (le) (rate(history_caller_duration_seconds_bucket{job="history-callers"}[5m]))) for a
          pooled all-outcome caller-terminal p99, in seconds. Explain that by (le) retains the bucket
          identity while adding exporter, class and outcome counts; the selector must include exactly
          the intended service/environment. The all-outcome result includes eligible failures; the observation
          gate has already excluded synthetic health checks before any query runs. A query cannot recover
          eligibility discarded by a recorder that observed excluded traffic. Apply rate before summing
          so per-exporter resets remain detectable. Require identical classic bucket layouts, units, boundaries
          and observation semantics across exporters; reject a mixed-layout rollout rather than silently
          merging mismatched le series. Reuse the root''s failed average-of-quantiles lesson in one compact
          query comparison: an exported summary quantile is already computed and cannot be pooled into
          the service p99 by either ordinary or request-weighted averaging. Python''s Summary API is not
          the quantile-producing implementation being demonstrated; do not invent that output. For comparable
          class evidence retain request_class in sum by (le, request_class), alongside the pooled result;
          retain outcome similarly for diagnostic distributions. Return to mix A/B without assigning those
          classes to the core observations.'
    - title: Keep the budget count more precise than the percentile
      brief: 'Use Raw requests to buckets in three views: the root''s coarse ranges converted to cumulative
        classic bounds 0.1, 1 and +Inf; the decision layout with an explicit 0.3 second boundary; and
        a single finer boundary at 0.55 seconds around the changed cohort''s tail. Derive classic linear
        interpolation inside the containing bucket, defining lower bound, upper bound, previous cumulative
        count and bucket count where used. Label every result an estimate. Both coarse p99 estimates are
        about 918.18 ms, despite raw p99 values 200 and 600 ms; the coarse data still only locate each
        raw p99 in (100,1000] ms. Decision-layout estimates are 200 and about 457.89 ms; adding 550 ms
        narrows the latter estimate to about 576.32 ms, without restoring raw values. This is duration-resolution
        loss, distinct from missing requests or uncertainty about future traffic. The threshold''s explicit
        boundary preserves its observed success count: use sum(rate(history_caller_duration_seconds_bucket{job="history-callers",outcome="success",le="0.3"}[5m]))
        / sum(rate(history_caller_duration_seconds_count{job="history-callers"}[5m])) and explain numerator
        and denominator populations before the query. Its meaning is timely successes among eligible terminal
        observations, not among starts. Both numerator and denominator use the metric''s eligibility gate;
        outcome=success narrows only the numerator, so eligible errors and deadlines remain in the denominator.
        The exact snapshot fractions are 99%, 98% and 98.8% for baseline, changed and the failure variation;
        fast error and deadline remain in the denominator. An empty or zero-rate denominator is no traffic/undefined,
        not a healthy objective. Distinguish exact threshold classification within the observed histogram
        from approximate time attribution after scraping. Give a compact format choice: this executable
        path uses classic histograms for its explicit boundary; native histograms retain distributions
        with configurable resolution and have different query syntax and interpolation. Check the selected
        client, server, scrape configuration and any storage path before advising native use; do not call
        them universally unsupported or prescribe a format irrespective of stack. A native fraction at
        an unaligned 300 ms threshold can be estimated: retain a separate exact outcome-aware threshold
        counter if exact classification is required. Avoid a second native implementation or a format
        survey.'
    - title: Check the query against a known recording
      brief: Supply a separate runnable promtool expression fixture with the complete input series, evaluation
        time and expected labels/values, using the proposed Synthetic query replay clock. Feed one core
        batch's histogram counts into a synthetic counter jump, with regular 15 second samples before
        and after it; this tests the expressions without inventing original request arrival times. Run
        baseline, changed and failure variations separately. Expect the interpolation and ratio values
        above, not the raw ranks. Check outcome slices, pooling, no-success/positive-denominator, no-traffic,
        missing-series and an exporter reset. Reject mismatched bucket layouts before evaluating the comparison.
        Explain that the counter samples were manufactured query inputs; a successful fixture proves their
        query arithmetic, not instrumentation coverage or real scrape reliability. Scrapes assign observed
        counter changes to intervals, so terminal events near window edges are not an exact event selection;
        rate/increase can extrapolate and need not produce integer request counts. Inspect scrape gaps,
        absent targets, initialization and resets before trusting a result; rate's reset handling cannot
        restore unobserved increments lost in a restart. Keep the exact event-set cutoff demonstration
        separate from these scrape samples. Publish the actual versions and execution evidence with the
        eventual fixture, and mark anything not executed as a specification.
    - title: Make sure the test offered the intended work
      brief: Use the named Scheduled requests during a pause timeline and complete table in the extension,
        a separate six-request experiment with intended starts every 100 ms in [0,600). Define offered
        demand and generator lag (actual minus intended start) before using them. Compare independent
        dispatch with one caller waiting for each reply; service responses follow the explicit constructed
        pause model, not an inferred database stall. Show intended starts, actual starts, terminal times,
        outcomes, dropped/unsent starts and pending work at 600 ms. Independent dispatch offers six requests
        with durations 560,460,360,260,160,80 ms; serial dispatch starts only at 0 and 560 ms, so four
        intended requests are unsent, its second actual caller wait is only 80 ms and its generator lag
        is 460 ms. Define coordinated omission as suppression of intended independent demand when issuing
        the next request depends on earlier completion. A serial workload can correctly model a genuinely
        serial user; it cannot establish capacity under the six independent arrivals. Keep actual-start
        caller latency separate from intended-to-terminal delay, and do not invent durations for unsent
        requests or add them to the root's eligible-start denominator. Inspect arrival rate, actual starts,
        dropped work, generator lag, completions and outstanding work together. Mention an arrival-rate
        executor as a practical way to schedule independently, while checking available workers and dropped
        iterations; an open scheduling setting alone does not prove demand was delivered. Corrected or
        synthetic latency values cannot recreate unoffered contention. This small example demonstrates
        accounting and test suitability, not a realistic queue or universal tail-estimation correction.
    - title: Decide whether the measurement supports the change
      brief: 'Finish with the named Measurement handover table, tied to the root''s Release comparison
        record. Each row pairs an evidence defect with an action and the result needed to proceed: retrieve
        missing start/outcome records for cohort completeness; inspect a stalled cohort whose best possible
        budget result already fails; retain finer duration detail when coarse buckets hide the comparison;
        fix eligibility or outcome predicates when errors look fast; compare matched classes when mix
        changes; and rerun suitable offered demand when the generator suppressed arrivals. For the settled
        complete core cohorts, the exact 300 ms counts support the root''s 99% versus 98% recorded-cohort
        judgement; the synthetic metric fixture separately verifies query arithmetic for terminal observations.
        Neither proves a causal release regression or the next window''s behaviour. Require population,
        boundary, units, window attribution, assessment time, starts/terminals/pending, class mix, outcomes,
        representation and generator evidence to travel with the comparison. The reader can implement
        and audit the two paths after this article; subsequent diagnosis belongs to the existing performance
        reading, not another child in this commission.'
- title: Check what a tail estimate can support
  brief: Use the named Request count and window comparison to reduce the observed set from 1,000 requests
    to a separate 100-request illustrative window. Mark the selected ranks so the reader can see how few
    observations determine the high percentile; do not invent a universal minimum sample count. Separate
    an exact percentile of a complete recorded set from an estimate of behaviour under future traffic
    and from an incomplete set missing outstanding requests. A longer window may bring more observations
    but conceal a short incident or mix different operating conditions. Averages of plotted p99 points
    cannot recover the full-window p99. Show request counts, start/terminal attribution, window boundaries,
    assessment time and outstanding counts beside the result. Distinguish these evidence limitations from
    loss of duration detail in histogram buckets by returning to Same range counts, different p99. All
    1,000 requests in each cohort were recorded and settled, yet grouping erased the selected duration.
    Exact raw durations would recover those recorded p99 values but would not guarantee the next window's
    tail. More observations or a longer window cannot recover values already discarded from that fixed
    record; sparse samples and changing future traffic are separate reasons to qualify predictions. The
    child offers the optional implementation, not the reasoning needed for this root judgement. Omitted
    failures, selectively recorded requests and changing measurement boundaries require fixing the evidence,
    not interpreting another decimal place.
- title: Make the performance decision
  brief: 'Resolve the opening shop comparison: baseline meets the illustrative budget in its complete
    recorded start cohort; the changed dataset misses it even though the median is unchanged and the mean
    moves little. These constructed samples establish arithmetic, not a causal release regression or future
    guarantee. Use a compact named Release comparison record to ask for matching request classes, demand,
    boundaries, counts, outcomes, duration representation, window attribution and assessment times. Use
    the earlier worked cases to justify three judgements: investigate the stalled ten-request cohort because
    even its best possible timely-success result misses the target; reject counting fast failures or the
    caller deadline as useful completions; and inspect class mix before attributing the pooled p99 rise
    to slower within-class performance. Return to Same range counts, different p99 when checking duration
    representation: with only its identical coarse counts, measure again or retrieve better retained evidence
    rather than accept a claim that p99 improved or stayed unchanged. The original raw core counts still
    establish the earlier budget result; the coarse view does not overturn it. Compare useful completions
    and eligible starts as well as latency so reduced offered work, errors or outstanding requests cannot
    masquerade as improvement. Choose accept, investigate or measure again from the evidence and its limits;
    collect a complete cohort or better matched class evidence where the relevant conclusion remains unresolved.
    An elevated p99 identifies a symptom, not a database or queueing cause. Point to existing performance
    and concurrent-load reading only for subsequent diagnosis; the reader can complete this article without
    following it or the measurement child.'
