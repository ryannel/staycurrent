<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review gesture editor</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui; }
  body { max-width: 800px; margin: 1rem auto; padding: 0 1rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
  button, select { font: inherit; padding: .5rem; }
  svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; }
  rect, circle { fill: Canvas; stroke: CanvasText; }
  text { fill: CanvasText; }
  output { display: block; margin: 1rem 0; overflow-wrap: anywhere; }
</style>
<h1>Review gesture editor</h1>
<p>Use Card to drag Review, or Pan to move the board. Zoom and turn keep the SVG centre fixed.</p>
<div class="controls">
  <label>Pointer tool <select id="tool"><option>Card</option><option>Pan</option></select></label>
  <button id="zoom-in">Zoom ×1.5</button><button id="zoom-out">Zoom ÷1.5</button>
  <button id="turn">Turn 15°</button><button id="reset">Reset</button>
</div>
<output id="status" aria-live="polite"></output>
<svg viewBox="0 0 800 600" aria-label="Review board">
  <rect width="800" height="600" />
  <g data-world>
    <circle cx="210" cy="130" r="16" />
    <g data-parent>
      <rect width="140" height="90" fill="none" stroke-dasharray="4 3" style="fill:none" />
      <g data-card><rect width="80" height="40" /><text x="8" y="27" font-size="16">Review</text></g>
    </g>
  </g>
</svg>
<script type="module">
/* SHARED MODULES */
const surface = document.querySelector('svg');
const world = surface.querySelector('[data-world]'); // W coordinates
const parent = surface.querySelector('[data-parent]'); // G coordinates
const card = surface.querySelector('[data-card]'); // O coordinates
const tool = document.querySelector('#tool');
const status = document.querySelector('#status');
let state = initialState();
function commit(next) {
  state = next;
  const m = matrices(state);
  world.setAttribute('transform', svgMatrix(m.V_from_W));
  parent.setAttribute('transform', svgMatrix(m.W_from_G));
  card.setAttribute('transform', svgMatrix(m.G_from_O));
}
commit(state);
const gesture = installGestures({ surface, world, parent, card,
  getState: () => state, commit, getMode: () => tool.value,
  report: message => status.textContent = message
});
function changeView(factor, degrees) {
  gesture.cancel();
  const targetV = { x: 400, y: 300 };
  const next = anchoredView(state, targetV, state.view.zoom * factor, state.view.angle + degrees);
  if (next) {
    commit(next);
    status.textContent = `Zoom ${state.view.zoom}; angle ${state.view.angle}°; centre retained.`;
  }
}
document.querySelector('#zoom-in').onclick = () => changeView(1.5, 0);
document.querySelector('#zoom-out').onclick = () => changeView(1 / 1.5, 0);
document.querySelector('#turn').onclick = () => changeView(1, 15);
document.querySelector('#reset').onclick = () => {
  gesture.cancel(); commit(initialState()); status.textContent = 'Reset.';
};
status.textContent = 'Ready. Choose Card or Pan.';
</script>
</html>
