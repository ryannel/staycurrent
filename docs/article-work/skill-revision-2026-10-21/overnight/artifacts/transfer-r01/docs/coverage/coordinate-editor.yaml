topic: Coordinate spaces and affine transforms for a zoomable diagram editor
title: Coordinates in a zoomable editor
brief: Teach a capable programmer with no graphics mathematics how to keep an object's geometry local,
  place it inside a transformed group, move the editor's view, and map a browser pointer back to the object.
  Use the settled Review board example in docs/coverage/coordinate-editor-example.md throughout. By the
  end, the reader can name the input and output space of each conversion; calculate the marked point's
  route from card (10, 10) to browser client (440, 400) and back; distinguish a point from a displacement;
  construct and compose the six coefficients of a 2D affine transform; predict and repair a swapped transform
  order; rotate around a chosen pivot; implement a guarded local hit test; and explain why a collapsed
  transform cannot support unique backward mapping. Derive notation, rotation and matrix operations through
  this example rather than assume a linear-algebra course. Give a complete small SVG/DOMMatrix implementation
  route in the root, including pan, zoom, rotation and pointer conversion. Explain the invariant behind
  anchored zoom and dragging before offering the one deeper article on implementing those gestures. Keep
  this collection to two proposed articles; no third page currently earns its cost. Scope is 2D affine
  geometry and the browser coordinate bridge, not perspective, rendering engines, diagram layout algorithms
  or a general linear-algebra survey. Figures are mathematical teaching models until browser behaviour
  is separately checked. The writer must check calculations and the rendered controls, and separate those
  evidence types.
heading:
- title: One card, several sets of coordinates
  brief: 'Begin with the practical task: find the spot on the Review card under a pointer after its group
    has turned and the view has zoomed. Define a coordinate space as an origin, axis directions and units.
    Introduce card O, group G, world W, editor view V and browser client C only as their roles become
    necessary. State rightwards x, downwards y and clockwise positive angles in the initial browser-aligned
    frame; transformed local axes may point elsewhere. A named Space ladder figure shows the same marked
    point, local axes and conversions, not five independent points. Establish the forward route O to G
    to W to V to C and the need to reverse it for input. State the implementation approach early: store
    geometry locally, compose outward for display and invert the resulting mapping for input. Leave matrix
    symbols until the scalar operations give them meaning.'
- title: A position and a movement follow different rules
  brief: Use the card translation (30, 20) to distinguish a point from a displacement between two points.
    Show point subtraction within the same space, adding a displacement to a point, and why adding coordinates
    from different spaces is not meaningful without conversion. Introduce translation and uniform scale
    through x and y arithmetic. Show that a translation affects a point but cancels from the displacement
    between points. The named Point and step comparison follows the marked point and the local step (10,
    0); avoid treating a movement as a point whose origin should also move. Relate view zoom to units
    and pan to a displacement in V, rather than rewriting the card's stored coordinates.
- title: Turn the group around a known pivot
  brief: 'Derive the example''s clockwise quarter-turn from where its two unit steps go: (1, 0) becomes
    (0, 1), and (0, 1) becomes (-1, 0). Then extend to an arbitrary angle by introducing cosine and sine
    as the components of the turned unit step, with a unit-circle inset and the actual coordinate equations.
    Explain the degrees used in the controls and DOMMatrix versus radians required by JavaScript trigonometric
    functions if those functions appear. The named Pivot comparison holds the card centre fixed while
    contrasting rotation about its origin and about its centre. Derive subtract pivot, rotate, add pivot
    before writing a product of transforms. Distinguish turning the group from turning the view; the camera-rotation
    extension gives a concrete instance of the same rule.'
- title: Six numbers describe the whole placement
  brief: 'Build x'' = ax + cy + e and y'' = bx + dy + f from the mapped origin and the two mapped unit
    steps already encountered. Define an affine transform through this linear part plus translation; explain
    that straight lines map to lines or, under collapse, points, and that parallel directions are preserved
    unless collapsed. Angles and lengths need not be preserved. Use a labelled basis-and-origin diagram,
    with the record''s actual card to world coefficients. Introduce a matrix as a compact table for these
    two equations. Derive the extra coordinate: 1 for a point, 0 for a displacement, so one 3 by 3 table
    expresses both operations. State column vectors and the six-value browser order [a, b, c, d, e, f]
    explicitly. Distinguish display layout of the table from the constructor''s value order; derive the
    identity mapping rather than assuming its name is known.'
- title: Put the conversions together in the right order
  brief: Compose the card, group and view mappings by substitution, then show how matrix multiplication
    packages that substitution. Work one coefficient through the calculation so multiplication is an understood
    operation, not an unexplained API call. Introduce M_A_from_B only after naming its source and destination,
    and use matching spaces to check composition. Explain that the rightmost mapping acts on the point
    first with this column-vector convention. The named Follow the card table shows the complete baseline
    route and the composed coefficients; check they agree. The named Pan then zoom comparison lets the
    reader change zoom and switch between T(pan)S(zoom) and S(zoom)T(pan), with numerical coordinates
    and a visible pan arrow. At the baseline it contrasts V (320, 320) with (380, 360). Let the reader
    predict which pan distance changes with zoom. Keep controls labelled in the same terms as the prose,
    provide reset and a static baseline, and identify it as an illustrative model.
- title: Follow the pointer back to the card
  brief: Define an inverse as the mapping which undoes a conversion. Reverse the chain and undo its steps
    in reverse order; the baseline client point (440, 400) must recover card point (10, 10). Derive the
    2 by 2 inverse by solving the two scalar equations after subtracting the translation, and name the
    denominator ad - bc as the determinant only when it is needed, requiring it to be non-zero before
    dividing. Explain an inverse of a product through undoing actions, not a memorised formula. The named
    Out and back figure connects the forward and reverse routes. Test the recovered coordinates against
    the card's local rectangle [0, 80] by [0, 40]; state that this is a filled-rectangle geometry test,
    not a complete policy for strokes, overlap, occlusion or selection.
  heading:
  - title: Connect the maths to browser coordinates
    brief: Define browser client coordinates and CSS pixels before using clientX and clientY. V is the
      root SVG's user space, and is not generally the browser viewport or a physical-pixel buffer. Use
      nested SVG groups and explicit matrix values to connect the model to rendering. Explain that getScreenCTM
      supplies the element-local to browser-client mapping, including the browser bridge; invert that
      matrix once to map a pointer to the card. Give the complete small DOMMatrix/DOMPoint recipe with
      checks for a missing matrix and a non-finite inverse/result; explain that these mean input cannot
      be mapped and retain the last valid state. The following section explains the geometric loss of
      a unique inverse. Compare the explicit model composition with the browser-supplied matrix in a later
      browser check. The named Half-size editor comparison uses the record's 400 by 300 CSS rendering
      of the 800 by 600 viewBox, showing why subtracting a bounding rectangle alone is insufficient. Do
      not multiply client coordinates by device pixel ratio or add page scroll to a client-space matrix.
      Keep display and input on the same current transform state.
- title: When the way back disappears
  brief: Return to the determinant as an area-scale test, justified by the mapped unit steps. The named
    Collapsed group figure applies zero horizontal group scale before rotation and shows two distinct
    card points mapping to the same client point. Explain the lost information and why neither reversing
    steps nor an API can recover a unique position. Distinguish a negative determinant, which reflects
    an axis, from a zero determinant. Explain that a very small non-zero scale can greatly amplify pointer
    error even though an inverse mathematically exists; do not present a universal determinant cutoff
    as a numerical-stability test. Require finite input/state, positive bounded editor zoom, rejection
    of invalid inverses, and retention of the last valid interaction state as explicit policy for this
    example.
- title: Keep the chosen point under the pointer
  brief: 'Finish the root''s implementation story by stating what each interaction changes: panning changes
    the view translation in V, rotating changes a specified placement about a named pivot, and moving
    the card changes its translation in G. Introduce an invariant as something an operation keeps true.
    Derive anchored zoom from keeping the world point under the pointer fixed, including the baseline
    zoom 2 to 3 and new pan (-70, -100). Explain that a card drag retains the grabbed local point and
    converts pointer movement into the card''s parent space; dividing a client movement by zoom alone
    fails once axes or the browser bridge differ. Give a compact implementation checklist covering named
    spaces, multiplication order, pivot, current state and valid inversion so the reader can build the
    baseline editor without another page. Only then introduce the deeper gesture article. Keep event-lifecycle
    detail and the fuller gesture implementation there.'
  nested_article:
    topic: Anchored zoom, rotation and dragging through transformed coordinate spaces
    title: Keep a diagram under the pointer
    brief: Build on Coordinates in a zoomable editor and its settled Review board example in docs/coverage/coordinate-editor-example.md.
      Give a programmer who has read that root article a complete small single-pointer gesture implementation
      and the judgement to repair it. The reader should be able to derive pan, anchored zoom, chosen-pivot
      view rotation and card dragging from the point each operation retains; reproduce the recorded normal
      and resized drag snapshots; extend them to the root's rotated view; and explain why adding a client
      displacement divided by zoom to a card translation fails. They should also handle capture, completion
      and cancellation, reject stale or invalid conversions before changing stored state, and distinguish
      a geometric error from an interrupted event stream. Keep the root's space names, column-vector convention
      and browser bridge, with reminders and links at their first reuse. Do not reteach matrix multiplication,
      rotation or inversion. Additional gesture snapshots are settled in the canonical example record.
      Reuse one geometry/state module and one gesture comparison rather than a separate mechanism for
      each figure. A supplied zoom factor and angle control suffice; exclude wheel normalisation, multi-touch
      recognition, inertia, undo and a scene graph framework. No further child earns a page. Model arithmetic
      and invariant checks are distinct from observed browser events and rendered controls; require both
      kinds of checking during writing.
    heading:
    - title: Decide what the gesture must keep
      brief: 'Open with Review slipping away from the pointer when its parent is turned. State explicitly
        that this article builds on Coordinates in a zoomable editor. Remind the reader that O stores
        card geometry, G its placement, W the board, V the root SVG user space and C browser client CSS
        pixels. Link back to the root''s space ladder, composition and inverse explanations. Remind them
        that an invariant is a condition the update keeps true. The named Gesture promises table pairs
        each operation with its retained point and stored parameters: pan retains a chosen world point
        under a moving pointer and changes pan in V; zoom and view rotation keep a world anchor at a chosen
        V point and change zoom/angle plus pan; card drag retains the grabbed point in O and changes card
        translation in G. Introduce view angle theta and write the restricted editor view as v = z R(theta)
        w + t_V, reminding the reader that R turns a displacement and t_V is applied after it. The initial
        theta is zero; the root''s centre-turned view has theta 90 degrees and t_V (660, -40). This is
        the same view mapping in a convenient parameter form, not an extra camera inversion or a new coordinate
        space.'
    - title: Pan in the view's coordinates
      brief: 'Start with the simplest promise. At pointer-down, convert the pointer from C through V to
        the world anchor w; at an update obtain the current pointer v in V and solve t''_V = v - z R(theta)
        w. With fixed zoom, angle and bridge this reduces to adding the V displacement to the old pan.
        Use the named Move the view snapshot: in the half-size, turned-view state, client (310, 190) to
        (350, 210) is V movement (80, 40), so pan changes from (660, -40) to (740, 0). Adding (40, 20)
        directly is a wrong-space update. Explain why the board moves as a whole and why dividing by zoom
        would calculate a different kind of displacement. Recompute the pointer in V from the current
        root SVG mapping; a cached pointer-down bridge is only valid while that bridge remains unchanged.
        Keep the chosen world anchor rather than accumulating rounded per-event movements.'
    - title: Zoom and turn around the chosen point
      brief: Reuse the pan equation with a stationary target a_V. Recover the world anchor a_W using the
        old view inverse, choose the new zoom and angle, then derive t'_V = a_V - z' R(theta') a_W by
        substituting the retained point into the new view. Explain each subtraction as occurring in V.
        Obtain a_V from the current client-to-V mapping, never directly from client coordinates. Reproduce
        the canonical baseline zoom 2 to 3 and pan (-70, -100), then the root's turned-view zoom 2 to
        3 with pan (800, -170). A chosen-pivot rotation example resets to baseline and turns the view
        90 degrees about the marked point at V (320, 320), producing pan (600, 60); distinguish this chosen
        pivot from the root's V-centre pivot (400, 300). Neither changes stored card or group geometry.
        Use a labelled anchor/target trace in the shared Gesture comparison, with a stationary target
        cross and before/after world point, so keeping pan unchanged or dropping R can be seen to break
        the promise. Let the reader choose the pivot with a labelled diagram marker; zoom/angle controls
        retain that V target, using the SVG centre until a target is chosen. Convert an actual pointer
        position from C when choosing the marker. Explain clamping as limiting a requested value to the
        allowed interval. Validate finite inputs; clamp a valid requested zoom to the example's 0.25 to
        4 range before solving the compensating pan. The limits are editor policy. Show that zooming further
        at a bound causes no drift.
    - title: Move the card in its parent's space
      brief: 'At pointer-down map C to O once to save the actual grabbed local point g_O; do not snap
        the card origin to the pointer or assume every grab is (10, 10). At each move map the current
        pointer C to G using the parent group''s current mapping. For the example''s translation-only
        card placement derive t''_G = pointer_G - g_O, and verify by mapping the retained point forward.
        This is an absolute position update, not conversion of a displacement as a point. If recalling
        the root''s optional card rotation, briefly state that a fixed card linear part L requires subtracting
        L g_O instead; a pivot offset already inside the card placement must be represented consistently.
        Keep that reminder out of the main gesture path. Reproduce the canonical normal drag to t_G (40,
        0) and resized drag to (50, -20). Then combine the root''s turned view and half-size SVG: client
        (310, 190) to (350, 210) requires t_G (-10, 0). The named Gesture comparison toggles derived update
        and Divide client movement by zoom, with baseline, resized and turned-view presets, Reset and
        visible starting state. In the last preset that tempting update produces t_G (50, 30), putting
        the grab at client (290, 180), visibly away from the pointer (350, 210). Show the C, V, W and
        G displacement arrows and the resulting absolute placement; ask the reader to predict the direction
        before revealing it. Keep pan mode distinct: the same pointer motion moves every object there.'
      heading:
      - title: Ask the right element for the mapping
        brief: 'Use a compact DOM-role table to connect each inverse to its destination: the card for
          O at the grab, its parent group for G during card movement, the world layer for W, and the root
          SVG for V. Remind the reader that getScreenCTM maps that element''s local coordinates to C,
          so its inverse already includes the browser bridge. Do not apply the model chain a second time.
          Explain why event.target is an unreliable choice after capture or when a card contains labels.
          Reacquire the appropriate current matrix after layout or view changes; keep rendering and reads
          on the same committed state, without an independently animated CSS transform. A two-frame Resize
          between moves trace keeps g_O but changes the bridge from full size to half size before the
          next event, making a stale inverse''s error visible. Deliberately changing a parent or view
          mid-drag may change the required translation; the absolute equation re-establishes the grab
          at the next update without resetting g_O.'
    - title: Give the gesture a beginning and an end
      brief: 'Introduce pointer events, pointerId and pointer capture as delivery of one pointer''s events
        to a chosen element even when it leaves that element. Use one active gesture record with mode,
        pointerId and the retained local or world anchor. An explicit Card or Pan tool avoids a competing
        gesture recogniser. Accept pointerdown with button equal to 0 only when idle: the primary mouse
        button or touch/pen contact. Explain buttons as combined flags for the currently held buttons,
        with flag 1 for that initiating button/contact; (event.buttons & 1) tests whether it remains held.
        Validate starting coordinates and capture on a stable editor element; ignore other pointer IDs.
        Set touch-action on the editor surface before interaction begins; explain its browser-pan policy
        locally, without disabling page gestures elsewhere. Capture alone does not prevent browser cancellation.
        Explain that additional mouse-button changes arrive as pointermove while any button remains held;
        mouse pointerup waits for the last release. Provide the complete connected handler route, sharing
        the derived geometry functions. On each matching pointermove, inspect buttons before choosing
        the route: continue the normal update while flag 1 is set; when it is absent, complete immediately
        through the same finish path as a matching pointerup. Completion attempts one final valid position
        update from that event, then clears the active record and releases capture if held. If the final
        conversion is invalid, retain the last valid placement and still clean up. This editor finishes
        when its initiating button/contact is lost, even if another button remains held. Later moves and
        pointerup cannot move the finished gesture, and idle pointermove never starts another gesture.
        On pointercancel or unexpected lostpointercapture, end the gesture and keep the last valid placement,
        with no invented final movement. Clear the active record before releasing capture and make cleanup
        safe to repeat, because completion can itself cause capture loss. Handle a failed capture request
        without leaving an active gesture. The small Gesture lifecycle table distinguishes completion
        from cancellation and labels final-update and keep-last-valid behaviour as this editor''s policy,
        not API rollback. Include primary down, secondary down, primary release, movement, secondary release
        in that table: expected buttons values 1, 3, 2, 2, 0 and pointer event types pointerdown, pointermove,
        pointermove, pointermove, pointerup. Mark completion at primary release and no placement changes
        afterwards. Source the button distinctions from Pointer Events 3 sections 4.1.1, 4.2.4 and 4.2.6,
        alongside the existing lifecycle sources. Keep event logging in the browser check separate from
        the illustrative geometry trace.'
    - title: Check the promise before storing the update
      brief: 'Bring the helpers and handlers together as one small implementation route, not disconnected
        formula snippets. Take current state and mappings, compute a candidate, verify it, then commit
        state and render together. Reject a missing mapping, non-finite input/inverse/result or a disallowed
        zoom before mutating stored placement; clear the active gesture on an unmappable update while
        retaining its last valid state. Remind and link to the root''s collapsed group explanation. A
        singular DOMMatrix inverse may contain NaN rather than throw, so catching an exception alone is
        insufficient. Do not substitute an unexplained determinant cutoff. The named Find the broken promise
        table connects symptoms to checks: wrong direction to parent axes, size-dependent drag to the
        bridge, zoom drift to anchor/compensation, a jump after resize to stale state, and a stuck gesture
        to missing lifecycle cleanup. Require forward checks of every canonical and proposed snapshot,
        multiple smaller moves versus one move, unchanged zoom at bounds, off-origin grabs, resize between
        events, capture outside the card, cancellation, capture loss and singular-state rejection. Check
        primary down then secondary down, primary release, movement and secondary release: completion
        at primary release, cleanup even if its final conversion is rejected, and no later placement changes
        or duplicate completion. Check both Card and Pan with the same lifecycle. Exact quarter-turn expectations
        can be checked mathematically; arbitrary-angle checks need a stated tolerance. Separately observe
        the browser implementation''s matrices, event sequence and rendered controls in the isolated preview,
        including keyboard-operable preset and zoom/angle controls and light/dark readability. State what
        those observations establish; do not infer cross-browser or physical-device coverage. Keep all
        outcomes visible with static snapshots when interaction is unavailable.'
