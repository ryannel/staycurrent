topic: Latency percentiles
title: What latency percentiles tell you
brief: 'Take the reader from an ordinary timed request to expert judgement about a percentile dashboard:
  define the observation and population, calculate a declared sample quantile, expose the slow work a
  summary hides, compare like with like, and choose a measurement that can distinguish causes. Introduce
  latency as elapsed time between named events before using the term in the explanation. Use the workshop
  booking-status scenario and provisional values in docs/coverage/latency-flow-example.md, subject to
  central settlement. Assume percentages and familiarity with application requests, but no monitoring
  or statistics background. Teach enough here to interpret an existing dashboard; the child owns building
  and auditing the measurement pipeline. Source notes and current evidence limits are in docs/article-work/latency-flow-trial/root-planning-record.md.
  No observations are native results.'
heading:
- title: One request has several possible clocks
  brief: 'Start with a caller asking the workshop service for a booking''s status. Define latency, an
    observation and its population through a named request timeline: caller start, service receipt, pool
    wait, database work, reply and caller completion. A server timer cannot include time before server
    receipt. State operation, boundary, units, outcome and observation interval before presenting a percentile.
    Use the named caller-and-service timeline figure; it must make queue time visible and avoid double-counting
    nested spans. Distinguish one attempt from a caller operation containing retries. Keep success and
    error timings visible rather than silently mixing or discarding them. The child develops instrument
    selection and missing work.'
- title: Put the requests in order
  brief: Introduce distribution as the spread of observed durations and a percentile as a position in
    their ordered values. Use the named 100-request rank strip and frequency table for W0. Explain p50/median,
    p95 and p99, show the nearest-rank rule in words before ceil(p times N), and calculate selected ranks.
    Introduce quantile as the general fractional form of the same idea. Ties mean the fraction at or below
    a reported value can exceed the nominal percentage. Compare the mean, p95, p99 and maximum from the
    same observations. Define tail as the slow end. Show explicitly that p99 does not reveal the slowest
    request's duration. State that software may interpolate differently; this convention is an illustrative
    choice, not a universal definition or Prometheus's histogram calculation.
- title: Ask how many requests finished in time
  brief: Introduce a service-level objective as a stated target over a defined population and window.
    Use the named 200 ms threshold-count view of W0 to compare an objective of 99% at or below 200 ms
    with the observed good/total fraction. Define good, eligible and the inclusive boundary explicitly.
    Distinguish the objective threshold from an enforced request expiry. Explain why a chosen percentile
    and a direct threshold fraction answer related questions but estimated percentile output need not
    establish an exact threshold count. Keep errors and timeouts in the objective's stated policy; a fast
    failed response cannot silently become a good interaction. Explain that request-weighted results do
    not guarantee the same experience to each user or operation, and that choosing 99%/200 ms is a teaching
    assumption requiring user needs in a real service. Do not teach a full alerting or error-budget programme.
- title: Compare the same work over the same interval
  brief: Show how operation mix, deployment group and window change the population. Use the named two-worker
    partition of W0 and a window/group selector sketch to distinguish a pooled request distribution from
    a collection of already calculated percentiles. Demonstrate that neither an unweighted nor a count-weighted
    average of worker p99 values recovers pooled p99; the same issue applies to time-window rollups. Then
    use the independent W-mix before-and-after class table, subject to central settlement. Define a request
    class here as a predefined variant of the booking-status read, not a group selected by its observed
    duration. Compare status-only reads with reads also requesting session details. Every observation
    in the first class is 40 ms and every observation in the second is 400 ms in both windows; keep the
    same caller boundary, units, outcomes and equal five-minute windows. Show the class counts and exact
    within-class p99 values side by side with the pooled result. Changing counts from 990/10 to 900/100
    moves pooled nearest-rank p99 from 40 to 400 ms at rank 990 of 1,000, although neither class changes
    its stipulated timings. Keep this fixture separate from W0 and its workers. Ask whether either class
    became slower; the worked decision is that this pooled rise alone does not show that, while more requests
    now receive the slower read variant. Choose the class-separated duration distributions, counts and
    errors over matched windows as the next view to inspect before investigating a change within a class;
    the invented fixed timings supply no production cause or future guarantee. Explain why a quiet short
    window supplies few tail observations and a long window can dilute an incident. Always pair the quantile
    with count/rate and errors. Keep operation classes separate when requirements differ, then aggregate
    only when that is the question. Measurement resolution and sample uncertainty are different; introduce
    that distinction here and develop it in the child.
- title: Keep enough information to calculate the answer
  brief: Explain a histogram as counts in duration ranges using W0's named bucket table. Show why compatible
    counts can be combined before estimating a percentile whereas precomputed percentile scalars have
    discarded necessary information. Make exact raw-observation ranks, bucket-based estimates and direct
    boundary counts visibly distinct. Introduce the measurement continuation through the practical need
    to choose boundaries, retain outcomes and check which observations never arrived; do not duplicate
    its query and instrumentation workflow. The child is a contextual stub and must receive headings from
    a fresh planner after central example settlement.
  nested_article:
    topic: Collecting and combining latency measurements
    title: Measuring latency without hiding slow requests
    brief: 'Complete the commission''s measurement task: produce and audit the evidence for a workshop
      booking-status dashboard and decide whether a claimed improvement deserves acceptance. Explicitly
      build on What latency percentiles tell you, reminding and linking its observation boundary, population,
      nearest-rank percentile, histogram and 99% successful-within-200-ms objective. Keep the root''s
      interpretation and diagnosis teaching there; this article owns the measurement workflow. Follow
      docs/coverage/latency-flow-example.md, including centrally settled child additions. W0 remains the
      original finite invented census; other named fixtures are independent. Teach timer placement, outcomes,
      unfinished work, representation, compatible aggregation, resolution, count reconciliation, sampling
      limits and offered traffic through one sequence of decisions. No further articles. Source and continuity
      decisions are in docs/article-work/latency-flow-trial/child-planning-record.md. All numerical results
      are illustrative arithmetic or planned fixture expectations; no instrumentation, Prometheus query,
      load generator or service execution is claimed.'
    heading:
    - title: Put the timer around the caller's operation
      brief: Remind the root's caller-start-to-complete-reply boundary and distinguish a caller operation
        from each attempt. Use the named W-retry two-level timeline to place an outer operation timer
        around an initial failure, backoff and successful retry, and separate attempt timers inside it.
        Explain backoff as the wait before retrying; do not teach retry policy. Define a monotonic clock
        as one whose readings do not move backwards under wall-clock updates; subtract readings from the
        same elapsed-time clock, including waits, rather than CPU time or timestamps from different hosts.
        Keep wall-clock timestamps for locating the interval and request records for correlation. An HTTP
        server-duration instrument is a distinct boundary, not automatic instrumentation of a complete
        caller operation. Introduce instrumentation as recording events/durations at chosen boundaries.
        The reader should be able to inspect where a timer starts, stops and runs on every terminal path
        before interpreting its output.
      heading:
      - title: Keep groups useful and small
        brief: 'Define a metric as a named measured quantity and labels as the values distinguishing its
          groups. Keep bounded operation=booking_status and outcome=success/error/timeout, with separate
          attempt and operation instruments; retain deployment or worker groups only for a stated comparison.
          Define cardinality as the number of distinct label combinations and show a small group-count
          table: two workers times three outcomes gives six groups for one operation before histogram
          series. Arbitrary booking/request/customer identities create new combinations continually; put
          q identities in diagnostic records, not metric labels. Remind and link the root''s cause-section
          explanation of a trace, its shared identity and named intervals before using trace IDs here;
          keep those IDs in diagnostic records too. Do not presume every possible combination exists or
          that a missing series means zero requests. Remind and link the root''s two predefined W-mix
          request classes. Define request metadata as the options known when the caller starts, before
          its duration is observed. Capture request_class=status_only or status_with_session_details from
          whether the caller requests session details, and carry that value unchanged into each caller
          duration/outcome record, including failures and timeouts. Choose a record field for this class
          comparison; it is not another metric label. The W0 metric retains operation and outcome without a class discriminator
          and cannot recover a discarded class from its buckets. Do not infer class from observed duration
          or assign classes to W0, whose class membership is unspecified; the retention section works
          the independent W-mix records.'
    - title: Record failures and work that has not finished
      brief: 'Use W-timeout''s ten independent caller operations and the named outcome-ledger table: nine
        successes at 40 ms and one observed caller timeout at 1,000 ms. A success-only p99 is 40 ms but
        describes only nine successes; all-terminal-duration p99 is 1,000 ms and the eligible good/total
        fraction is 9/10 under the stated objective. The successful-completion time of the timed-out operation
        remains unknown, and a caller timeout does not establish that service work stopped. Explain right
        censoring in plain words only for the sought completion beyond observation; do not call the known
        failed caller duration unknown or impute a successful duration. Define a terminal event as success,
        error or timeout exactly once for the chosen observer. Make failure latency and failure counts
        visible alongside the successful distribution.'
      heading:
      - title: Decide which window owns the work
        brief: Use the named W-edge start-and-completion timeline and its reconciliation table. Define
          a cohort as work selected by the same event rule. Compare operations started in an interval
          with operations reaching a terminal event there; the latter may have started earlier. Define
          in flight as started without a terminal event at that instant. Reconcile opening in-flight plus
          starts minus terminal events equals closing in-flight for a loss-free observer. At a cutoff,
          retain pending counts and ages; do not insert zero durations, silently drop pending operations
          or call a completed-only sample the started cohort. Specify drain as continuing observation
          after new starts stop, with a finite cutoff and a policy for still-pending work. Prometheus
          completion counters normally answer a terminal-event window, not automatically a start-selected
          cohort.
    - title: Choose what information to retain
      brief: 'Use the named representation decision table to compare raw duration/outcome records, histograms
        and precomputed summary quantiles by the questions the workshop needs: recomputing a window, pooling
        workers, inspecting individual failures and testing an objective threshold. A summary''s quantile
        scalars are insufficient for pooling even though its separate count and sum can still be useful.
        Raw records cost retention and processing; histograms retain counts rather than request identities.
        Explain classic histograms as a configured cumulative bucket series, and native histograms as
        one composite histogram sample. Define schema as the bucket-layout rule and resolution as how
        finely durations can be distinguished; explain these names before a query or caption uses them.
        Pick a supported mergeable representation; show classic buckets concretely because W0 records
        them, and one native equivalent for readers encountering current instrumentation. Do not turn
        this into a product or sketch-algorithm survey. Add the required request-class comparison to that
        decision table: the chosen W0 histogram has no class discriminator, so retain complete caller
        duration/outcome records with request_class for W-mix. Use a named W-mix retained-record reconciliation
        table from the proposed example delta. Show a compact record with caller-operation identity, operation,
        the request_class captured at start, terminal-event timestamp on the window clock, caller duration
        and outcome. These are logical fields, not a storage-product format. Select operation=booking_status
        and matched five-minute terminal-event windows, with all eligible outcomes retained; group
        records by request_class and outcome to obtain duration frequency tables, counts, errors and timeouts.
        Require one retained terminal record per eligible operation through every terminal path, without
        duration/outcome-dependent selection, with the full window retained through comparison; verify
        collection and retention rather than assuming that writing a record made it available. Reconcile
        unique identities and per-outcome counts against an independent caller ledger, expose duplicates
        and missing records/classes, and keep an unclassified group if metadata are lost. A sampled diagnostic
        trace set cannot substitute for these complete records. Work the existing W-mix before counts
        990/10 and after counts 900/100, with success counts equal to class totals and known error/timeout
        counts zero. Recombine their duration frequencies and counts to 1,000 per window before ranking
        the pooled distribution: p99 40 then 400 ms, with both class distributions unchanged. Adding class
        p99s or averaging them is not this reconciliation. No new W0 label, query, clock, timing or observation
        is introduced.'
      heading:
      - title: Put resolution where the decision is
        brief: Use W0's named boundary-and-range table. With no 200 ms boundary, counts at 100 and 500
          ms only locate the good fraction between 95% and 99%; adding the inclusive 200 ms boundary records
          the actual 95/100 directly. Explain interpolation as estimating positions inside an unobserved
          bucket, not recovering individual durations. Contrast uncertainty in milliseconds from bucket
          width with uncertainty in percentile rank in algorithms that promise a rank bound; neither is
          uncertainty about future traffic. Contrast narrower buckets near 200 ms with enough upper range
          to retain slow-tail information. In W0's explicitly truncated classic layout ending at 200 ms
          before +infinity, five observations remain counted in the overflow bucket but their values are
          unresolved; the documented p99 fallback of 200 ms is not a measurement of their durations. Keep
          +infinity and count reconciliation visible. Native histogram resolution and threshold-boundary
          alignment also need checking; a native threshold fraction may be estimated. Choose cost/resolution
          from the decision, never from the number of decimal places displayed.
    - title: Combine the counts before calculating the percentile
      brief: 'Build one concrete Prometheus query from W0''s worker A/B bucket-delta worksheet. Define
        a counter as a cumulative total that can reset, a scrape as collecting its current value and rate
        as an estimated per-second change over a range; teach those before the first listing. Define PromQL
        as the query language and read the expression from inside out. For the invented workshop_operation_duration_seconds
        metric, filter operation=booking_status, retain operation and outcome, apply rate to each worker''s
        counter first, sum compatible bucket series by (operation,outcome,le), then apply histogram_quantile(0.99,...).
        Explain le as an inclusive upper bound in seconds; convert 200 ms to 0.2 s and any returned seconds
        to displayed ms. Show the native equivalent without the _bucket suffix or le grouping. Do not
        mix classic bucket layouts or silently combine incompatible boundaries, observers, units, outcomes
        or deployment groups. Explain why rate before sum preserves reset detection. A five-minute query
        is not an exact census of W0: scrape placement and rate extrapolation affect its values. Separately
        sum the stipulated W0 interval deltas to obtain 100 observations and explain the classic interpolation
        expectation p99=500 ms versus exact ranked p99=400 ms. No executed-query result is implied.'
      heading:
      - title: Follow every denominator through the pipeline
        brief: 'Use the named W0 collection-audit table from caller terminal events to instrumentation,
          collection, retained series, query filters and final aggregation. Distinguish a known zero,
          missing series, missing worker, failed scrape and selective filter. Hypothetically omitting
          worker B leaves 90 durations at 40 ms and a deceptively different population; label this an
          audit exercise, not a real outage or a change to W0. Reconcile independent caller starts/terminal
          events and in-flight work with recorded count deltas, outcomes and histogram +infinity counts.
          The 200 ms successful bucket supplies the numerator; all eligible terminal outcomes supply the
          denominator under that window policy, rather than filtering the denominator to success. Compare
          aligned rates or deltas and handle absent outcome series deliberately. Lost processes, buffers,
          exports or collection intervals can prevent exact reconciliation; identify the gap rather than
          inventing lost durations. No traffic must display no evidence, not 100% good or a zero percentile.
          Apply the same denominator discipline to the W-mix retained records: compare selected unique
          terminal records and each outcome total to the independent eligible caller ledger for that exact
          interval, then require the two class totals plus any unclassified records to equal the pooled
          total. Class completeness needs the captured metadata as well as count reconciliation; a missing
          class is unresolved evidence, not permission to infer it from duration. W-mix stipulates full
          capture and no unknown classes, so both windows reconcile exactly.'
    - title: Check how much evidence supports the tail
      brief: 'Distinguish W0''s exact finite census from an inference about later traffic. Use the named
        tail-support table: N times a chosen tail fraction is the expected count only under a stated stable
        probability model; for a 1% category N=100, 1,000 and 10,000 give expectations 1, 10 and 100,
        not guarantees or minimum sufficient sample sizes. Work the canonical assumed independent stationary
        example: probability of zero slow observations in 100 draws is 0.99^100, about 36.6%. Independence
        means one draw does not change another''s slow chance; stationarity means that chance stays fixed.
        Neither is established by counting requests. Explain correlated bursts and changing workload mix
        with a short sampling-policy table; a longer window adds observations but can hide a short incident
        or describe an old mix. Pair count, relevant windows, errors and resolution before accepting extra
        digits in p99. A trace set selected for errors or long durations is useful diagnostic evidence
        but has a different selection policy from the complete metric population. Remind trace at its
        next use and distinguish random selection from duration-dependent selection; do not infer the
        service percentile from unweighted selected traces. No confidence interval derivation or statistical
        sample-size prescription is needed.'
    - title: Keep the offered traffic visible during a stall
      brief: 'Use the named W-arrivals three-lane timeline, centrally settled from the extension proposal:
        a fixed scheduled arrival sequence with sufficient generator capacity, a caller that waits for
        completion before issuing the next operation, and the same scheduled sequence with insufficient
        generator capacity. Explain offered traffic, open scheduling and closed completion- driven scheduling
        in that order. Define coordinated omission as the measurement missing work that would have arrived
        under the intended independent schedule because generation waits on slow completions. Count scheduled,
        started, dropped, terminal and still-in-flight work at the end of generation and after a declared
        drain. A closed caller that never scheduled four arrivals has not recorded four dropped requests.
        An open generator that cannot start scheduled work must expose drops and start lateness; a started-only
        duration distribution cannot establish the experience of that omitted work. Match the model to
        actual user behaviour; waiting callers are sometimes the intended load. Explicitly bounded service
        and generator assumptions make these arithmetic timelines teaching devices, not queue predictions,
        a k6 run or a guarantee that open tests are unbiased.'
    - title: Assemble a comparison you can defend
      brief: 'Return to a proposed booking-status latency improvement with the named before-and-after
        evidence worksheet. Require unchanged caller boundary, operation-versus-attempt policy, eligible
        outcomes, threshold, units, representative operation mix, offered traffic and generator capacity;
        retain the relevant window, counts, errors, pending work, bucket resolution, reset/collection
        gaps and trace selection policy. For a pooled change with a different request-class mix, remind
        and link the root''s W-mix comparison and use the retained-record selection and reconciliation
        already worked in Choose what information to retain. Carry request_class from the caller''s request
        options through collection and retention into the matched class-separated duration frequencies,
        counts and error/timeout totals; verify both classes reconcile to the eligible pooled window before
        claiming that a read variant changed. W-mix''s two unchanged class distributions and complete
        1,000-operation windows support a mixture-only judgement for this fixture. If only a histogram with W0''s class-free grouping or selected traces survives for a comparison,
        record that the promised class comparison cannot be reconstructed and collect the class field
        for a new comparable interval. Separate an observed difference from
        its cause and from a promise about future traffic. Work through two conditional decisions: a lower
        success p99 accompanied by more timeouts cannot establish improved eligible experience, and a
        lower pooled estimate with missing worker B cannot establish an improvement at all. Choose the
        next evidence to collect in each case; use paired request records to investigate where time went
        and remind/link the root''s cause section, then its optional published database continuations.
        Finish with a compact reader audit they can apply to an existing chart or test report, retaining
        unresolved evidence explicitly. Later runnable PromQL or load- tool listings need versioned execution
        checks and actual observations before being described as run; planning arithmetic supplies no
        native evidence.'
- title: Follow the slow requests to a cause
  brief: 'Return to the caller''s problem. A percentile identifies a symptom and affected population,
    not a cause. First introduce linked records of one caller operation through the independent W-overlap
    record table and timeline in docs/coverage/latency-flow-example.md, subject to central settlement.
    Give each named stage record the same caller-operation identity, overlap-op01, and its start/end offsets;
    show how the common identity pairs those intervals rather than matching unrelated requests. Introduce
    a trace as linked records of one operation''s work and a trace ID as the common identifier of that
    trace before using either term. Explain that the records reveal where time was spent and which work
    the reply waits for, without establishing why an interval took that long. Show preparation 0–10 ms,
    overlapping booking-status read 10–90 ms and session-details read 10–50 ms, then reply assembly 90–100
    ms on one stipulated elapsed-time clock. Both read results are required: define the join as waiting
    for both before reply assembly. Mark the caller waiting until the complete reply at 100 ms and the
    join still waiting for booking status from 50 to 90 ms. The stage-duration sum is 140 ms but caller
    elapsed time is 100 ms. Define the critical path here as the required dependency chain determining
    completion: preparation, booking-status read, reply assembly. Ask whether shortening only the session-details
    read from 40 to 20 ms changes completion; with the other stipulated timings fixed it remains 100 ms.
    Then use the unchanged serial W-stages paired-duration table: for one request its serial stage times
    sum, but the two stage p95 values of 20 ms do not sum to whole-request p95 of 400 ms because the slow
    stages belong to different requests. Keep single-operation overlap and aggregate-percentile reasoning
    distinct. Use the now-explained linked records to distinguish pool waiting, execution and commit or
    network work; do not infer independence or prove a cause from coincident charts. Offer concrete next-observation
    branches and link the existing Connections, overload and capacity and Diagnosing a database incident
    articles as optional database continuations, with a reminder of their scope. Finish with a worked
    decision about accepting a proposed latency improvement: compare the same operation mix, boundaries,
    load, error/timeout policy, sample support and resolution, then check whether slow interactions and
    the objective improved. Leave the outcome conditional on collected evidence rather than inventing
    a benchmark success.'
