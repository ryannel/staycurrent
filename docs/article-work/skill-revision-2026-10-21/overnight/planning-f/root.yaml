topic: Latency percentiles
title: What latency percentiles tell you
brief: >-
  Take the reader from an ordinary timed request to expert judgement about a
  percentile dashboard: define the observation and population, calculate a
  declared sample quantile, expose the slow work a summary hides, compare like
  with like, and choose a measurement that can distinguish causes. Introduce
  latency as elapsed time between named events before using the term in the
  explanation. Use the workshop booking-status scenario and provisional values
  in example-proposal.md, subject to central settlement. Assume percentages and
  familiarity with application requests, but no monitoring or statistics
  background. Teach enough here to interpret an existing dashboard; the child
  owns building and auditing the measurement pipeline. Source notes and current
  evidence limits are in planning-record.md. No observations are native results.
heading:
  - title: One request has several possible clocks
    brief: >-
      Start with a caller asking the workshop service for a booking's status.
      Define latency, an observation and its population through a named request
      timeline: caller start, service receipt, pool wait, database work, reply and
      caller completion. A server timer cannot include time before server
      receipt. State operation, boundary, units, outcome and observation interval
      before presenting a percentile. Use the named caller-and-service timeline
      figure; it must make queue time visible and avoid double-counting nested
      spans. Distinguish one attempt from a caller operation containing retries.
      Keep success and error timings visible rather than silently mixing or
      discarding them. The child develops instrument selection and missing work.
  - title: Put the requests in order
    brief: >-
      Introduce distribution as the spread of observed durations and a percentile
      as a position in their ordered values. Use the named 100-request rank strip
      and frequency table for W0. Explain p50/median, p95 and p99, show the
      nearest-rank rule in words before ceil(p times N), and calculate selected
      ranks. Introduce quantile as the general fractional form of the same idea.
      Ties mean the fraction at or below a reported value can exceed the
      nominal percentage. Compare the mean, p95, p99 and maximum from the same
      observations. Define tail as the slow end. Show explicitly that p99 does
      not reveal the slowest request's duration. State that software may
      interpolate differently; this convention is an illustrative choice, not a
      universal definition or Prometheus's histogram calculation.
  - title: Ask how many requests finished in time
    brief: >-
      Introduce a service-level objective as a stated target over a defined
      population and window. Use the named 200 ms threshold-count view of W0 to
      compare an objective of 99% at or below 200 ms with the observed good/total
      fraction. Define good, eligible and the inclusive boundary explicitly.
      Distinguish the objective threshold from an enforced request expiry.
      Explain why a chosen percentile and a direct threshold fraction answer
      related questions but estimated percentile output need not establish an
      exact threshold count. Keep errors and timeouts in the objective's stated
      policy; a fast failed response cannot silently become a good interaction.
      Explain that request-weighted results do not guarantee the same experience
      to each user or operation, and that choosing 99%/200 ms is a teaching
      assumption requiring user needs in a real service. Do not teach a full
      alerting or error-budget programme.
  - title: Compare the same work over the same interval
    brief: >-
      Show how operation mix, deployment group and window change the population.
      Use the named two-worker partition of W0 and a window/group selector sketch
      to distinguish a pooled request distribution from a collection of already
      calculated percentiles. Demonstrate that neither an unweighted nor a
      count-weighted average of worker p99 values recovers pooled p99; the same
      issue applies to time-window rollups. Explain why a quiet short window
      supplies few tail observations and a long window can dilute an incident.
      Always pair the quantile with count/rate and errors. Keep operation classes
      separate when requirements differ, then aggregate only when that is the
      question. Measurement resolution and sample uncertainty are different;
      introduce that distinction here and develop it in the child.
  - title: Keep enough information to calculate the answer
    brief: >-
      Explain a histogram as counts in duration ranges using W0's named bucket
      table. Show why compatible counts can be combined before estimating a
      percentile whereas precomputed percentile scalars have discarded necessary
      information. Make exact raw-observation ranks, bucket-based estimates and
      direct boundary counts visibly distinct. Introduce the measurement
      continuation through the practical need to choose boundaries, retain
      outcomes and check which observations never arrived; do not duplicate its
      query and instrumentation workflow. The child is a contextual stub and must
      receive headings from a fresh planner after central example settlement.
    nested_article:
      topic: Collecting and combining latency measurements
      title: Measuring latency without hiding slow requests
      brief: >-
        Build and audit evidence for the workshop percentile dashboard, assuming
        the root's latency boundary, population, percentile, histogram and
        threshold concepts and explicitly reminding/linking to that dependency.
        Teach a coherent workflow: define caller-operation versus attempt timers
        and a monotonic elapsed clock; retain outcomes and account for requests
        still running or absent when a window ends; distinguish observed timeout
        duration from unknown eventual successful-completion time. Compare raw
        values, mergeable histograms and precomputed summary quantiles through
        the decisions they support. Use W0's worker partitions and compatible
        bucket counts for one concrete Prometheus aggregation example, retaining
        required grouping and units, treating counter resets before aggregation,
        and distinguishing native from classic representation without a product
        survey. Show resolution near the 200 ms objective, an insufficient upper
        range, and value-error versus rank-error rather than treating every
        approximation as the same. Choose bounded operation/outcome groups and
        explain the cost of unconstrained identifiers as metric labels; request
        identities belong in diagnostic records. Audit counts through collection,
        losses, query filters and aggregation. Explain why a precise sample
        percentile is not a precise claim about future traffic: teach N times
        tail-fraction support, one clearly assumed independent-sampling probability
        example, correlated bursts and workload drift, and the limits of selective
        trace samples. Use the named timeout and scheduled-arrival timelines to
        expose success-only truncation and a completion-driven generator reducing
        offered traffic during a stall; define coordinated omission, retain
        scheduled/started/dropped/completed work and generator capacity, and do
        not imply every closed model is wrong or every open model is unbiased.
        End by assembling an auditable comparison with unchanged boundaries,
        representative traffic, counts/errors, relevant windows and paired traces.
        Native execution is not required at planning; later executable queries or
        load-tool examples need versioned checks before claiming they were run.
        Keep probability and tool detail subordinate to practical decisions.
  - title: Follow the slow requests to a cause
    brief: >-
      Return to the caller's problem. A percentile identifies a symptom and
      affected population, not a cause. Use the named two-stage paired-duration
      table from example-proposal.md to show that adding stage p95 values does
      not give total p95: the slow observations can belong to different
      requests. Explain sequential sums and concurrent critical paths at the
      single-request level before interpreting aggregate stage metrics. Use
      correlated request records/traces to distinguish pool waiting, execution
      and commit or network work; do not infer independence or prove a cause from
      coincident charts. Offer concrete next-observation branches and link the
      existing Connections, overload and capacity and Diagnosing a database
      incident articles as optional database continuations, with a reminder of
      their scope. Finish with a worked decision about accepting a proposed
      latency improvement: compare the same operation mix, boundaries, load,
      error/timeout policy, sample support and resolution, then check whether
      slow interactions and the objective improved. Leave the outcome conditional
      on collected evidence rather than inventing a benchmark success.
