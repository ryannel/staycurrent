articles:
- key: index
  parent: null
  topic: Application caching
  title: Application caching
  brief: Understand how an application reuses a saved answer, judge whether that reuse earns
    another copy, and recognise the freshness, capacity and failure decisions it introduces.
    Follow the shop's product P7 from one source read to a cache hit, a price change and a cache
    miss. Make those decisions intelligible here; the children own their detailed designs and
    working procedures. Redis supplies concrete practice as one implementation among several.
  heading:
  - title: Reusing an answer
    brief: Follow the first product request through the application, cache and source, then
      the next request through the same drawing. Establish key, value, hit, miss and cache-aside
      through the operations. The cached product card saves source work; the database still
      owns the price and checkout still reads it. Distinguish an application result from a database's
      cached storage pages.
  - title: What a hit saves
    brief: Compare the work on the hit and miss paths with one small invented workload. Show
      why repeated expensive answers offer reuse and unique cheap answers may not. Place the
      copy inside one application process, then beside two instances in a shared service; make
      the extra hop and separate local copies visible. Readers can choose a plausible starting
      point here.
    nested_article:
      topic: Choosing whether and where to cache
      title: Choosing a cache
      brief: Decide whether to cache a measured workload and where to put the copy. Compare
        source improvements, local caches, shared caches and justified combinations through
        saved work, latency, reuse, cost and ownership. Treat Redis, Valkey, Memcached and language
        cache libraries as choices where their differences affect this decision. Own the workload
        evaluation and placement trade-offs; the root supplies the hit and miss model.
  - title: Which requests can share an answer
    brief: Change the shop or language while keeping product ID P7. Show how a key that names
      only the product can return the wrong card. Establish that a key identifies an answer
      for a particular context, including its representation. Show the corrected key without
      turning the section into a key-format guide.
    nested_article:
      topic: Cache keys and cached representations
      title: Cache keys
      brief: Design keys and values so that only requests entitled to the same answer share
        it. Work through shop, locale, currency, query parameters, authorisation-dependent results,
        representation changes and cached absence. Own key identity, encoding and value compatibility.
        Freshness owns when a previously correct answer or absence ceases to be usable.
  - title: When the source changes
    brief: Raise P7's source price from 20.00 to 22.00 while the cache still holds 20.00. Explain
      expiry and invalidation as ways of ending reuse, with a short concrete source-write-then-delete
      sequence. Establish that separate cache and source operations can leave a stale copy,
      and keep checkout's current price check visible. The deeper article owns race analysis
      and stronger freshness designs.
    nested_article:
      topic: Cache freshness and invalidation
      title: Freshness and invalidation
      brief: Choose a freshness promise and a source/cache update path that can meet it. Distinguish
        entry lifetime from source age; follow concurrent fills, delayed source reads, missed
        invalidations, deletions and newly created records. Compare accepting stale answers,
        expiry, invalidation, updating copies and version-based approaches, including the work
        and remaining assumptions of each. Give read-after-write needs an explicit solution
        or route to the source. The root owns the first price-change example.
  - title: When requests arrive together
    brief: Expire one popular product while several callers arrive. Draw the repeated source
      reads and then a shared fill, so the reader can see why hit rate alone misses the burst.
      Empty the whole cache to reveal the larger source demand. Explain that rebuilding a copy
      requires capacity and that returning an error can protect work the source must still perform.
    nested_article:
      topic: Cache misses, refresh and source protection
      title: Handling cache misses
      brief: Keep useful service within the source's capacity through popular-key expiry, cache
        failure and a cold start. Develop request coalescing, bounded waiting, refresh timing,
        permitted stale serving and admission of source work from visible request traces. Explain
        the limits of per-process coalescing and any shared refresh lease, including a slow
        former owner. Distinguish protecting one hot key from protecting the source across many
        keys. Freshness owns which stale answers are acceptable.
  - title: When the cache fills
    brief: Fill a small cache with product cards, then add a large, rarely requested answer.
      Show which useful copies must leave and which source reads return. Distinguish eviction
      under memory pressure from expiry after a time limit. Explain why admitting every result
      or counting entries alone can waste the memory budget.
    nested_article:
      topic: Cache admission, eviction and memory
      title: Cache memory and eviction
      brief: Choose which answers deserve limited memory and evaluate that choice against changing
        requests. Work through entry sizes, overhead, working sets, admission, eviction and
        expiry using trace replay and a byte budget. Compare recency and frequency where they
        change saved work, keeping illustrative policies distinct from Redis's implementation.
        Own memory sizing and retention choices; operating the cache uses the resulting signals
        to diagnose changes.
  - title: Using Redis for the worked cache
    brief: Connect the cache box to a concrete GET, SET with expiry and deletion of P7's key.
      Explain that the application supplies the source reads and update logic. Position Redis
      as the collection's worked implementation, alongside other shared stores and local libraries.
      Show what the upcoming practical article lets the reader try, with no claim that commands
      alone establish the freshness or failure policy.
    nested_article:
      topic: Implementing an application cache with Redis
      title: Caching with Redis
      brief: Build and exercise a source-backed product cache with a pinned Redis and client
        version. Follow reads, fills, expiry and committed source updates through actual application
        code. Handle missing, malformed and obsolete entries, cache errors, timeout budgets,
        connections and pending work. Apply the collection's decisions rather than surveying
        Redis features. Own runnable integration and its demonstrated behaviour; introduce deeper
        Redis topology or client work only where a distinct practical need earns it.
  - title: Keeping the cache useful
    brief: 'Read a small before-and-after service view: request latency, source work, cache
      errors and freshness. Show why a high hit ratio can coexist with poor service. End with
      the decisions a reader can now make and routes to the deeper work, including testing a
      cold or unavailable cache before depending on its warm performance.'
    nested_article:
      topic: Operating and changing an application cache
      title: Operating a cache
      brief: Diagnose whether a cache still improves the application and change it without losing
        control of source demand or answer validity. Join application and cache observations
        in concrete incidents; distinguish cache slowness, source slowness, low reuse, memory
        pressure and stale results. Rehearse a bounded rollout, cold recovery and rollback,
        with appropriate access and deployment choices for the Redis example. Use earlier mechanisms
        rather than teaching them again; include topology and failover depth only as the selected
        deployment requires.
- key: cache-benefits
  parent: index
  topic: Choosing an application cache
  title: Deciding what and where to cache
  brief: Decide whether reusing an application result earns the cost of caching, then choose
    no cache, an in-process cache, a shared cache or a justified combination. Trace the work
    saved by the shop's product-card requests, measure reuse and the whole request path, and
    test the choice under changing load and cold starts. Redis is one possible shared implementation.
    This article owns the selection and evaluation decision; neighbouring articles own correctness
    and operation.
  heading:
  - title: Find the work a hit would remove
    brief: Follow the request for P7's product card through source lookup, assembly and response.
      Show what caching the row, an assembled card or a computed result would skip, and what
      still runs on every request. Compare with the existing uncached path, including a database
      whose pages are already in memory. Identify a measurable latency, source-load or cost
      problem before choosing another copy. An adequate uncached path is a useful outcome.
  - title: Look for answers that will be reused
    brief: 'Read a short request trace with repeated P7 requests and less popular products.
      Define a hit ratio through actual hits and requests, then show why a changing popular
      set, short useful lifetime and many request variants reduce reuse. Contrast a frequently
      reused cheap answer with a costly miss: counts of hits alone do not measure saved work.
      Carry one stable unit of cache lookup through the comparison.'
  - title: Count the cost of both paths
    brief: Draw no-cache, hit and miss paths with the added lookup, decoding and fill work visible.
      Derive an illustrative weighted mean from those paths and find when the cache saves time.
      Keep latency and source work distinct. A mean improvement can coexist with worse slow
      requests; show the miss population in the latency distribution before explaining percentiles.
      End-to-end measurements decide the result when contention changes timings.
  - title: Choose where the copy lives
    brief: Compare one process's memory with a shared service by following the same requests
      across several application instances. Make duplicate copies, separate warming and differing
      cached versions visible for local caches; make the network trip and shared dependency
      visible for remote caches. Use an in-process library such as Caffeine and shared stores
      such as Redis, Valkey or Memcached as concrete choices where their properties matter.
    heading:
    - title: When a second layer earns its place
      brief: Add a small local layer ahead of a shared cache only after showing the hot repeated
        remote lookups it removes. Count conditional hit ratios at each layer rather than adding
        them. Show that each layer has its own age and invalidation problem; a hit in the first
        layer never asks the second whether the value changed. Link to freshness for mechanisms.
  - title: Test the workload you expect
    brief: Compare the proposed design against an uncached baseline using realistic key popularity,
      payloads, updates, concurrency and network placement. Measure application latency distributions,
      useful source work and cache overhead. Include cold start, a shifted popular set and cache
      unavailability. A fast GET benchmark does not establish application benefit. Demonstrate
      why a warmed-cache-only result cannot justify the choice; source protection is developed
      in the misses article.
  - title: Make a decision you can revisit
    brief: Return to the product-card workload and select a placement from the evidence. Weigh
      saved source capacity and latency against memory, transfer, cache service cost and ongoing
      maintenance. State the required freshness and failure behaviour, the observation that
      would overturn the choice, and the smallest rollout that can test it. Route the reader
      to key identity, freshness and capacity for the chosen design's next decisions.
- key: cache-keys
  parent: index
  topic: Cache keys and cached representations
  title: Cache keys
  brief: Design a key and value that let requests reuse the same permitted answer. Derive the
    shop's product key from the request, then account for query options, access context, encoding,
    representation changes and cached absence. A reader should be able to explain why two requests
    may share an entry and recognise when an extra key field merely wastes reuse. The introduction
    supplies the hit/miss model; freshness owns how an answer loses validity over time, and
    the Redis article owns the complete runnable client and error handling.
  heading:
  - title: The key names an answer
    brief: Begin with north's P7 card at GBP 20.00, then request south's independent P7 at GBP
      18.00. Follow both lookups through a cache keyed only by product ID, making the wrong
      returned card visible. Add shop identity and repeat. Establish that a key names the result
      of a particular operation in a context, not merely a source row. The same reasoning applies
      to a local cache, Redis and other shared stores.
  - title: Which inputs change the result
    brief: Derive product:v1:north:P7:en-GB:GBP one component at a time. Distinguish shop, product,
      locale, currency and representation version; the application supplies the translated or
      converted representation. Change one input and show whether the answer can still be shared.
      Carry the reasoning to a product-list query with filter, sort, page and selected fields.
      A request ID need not split identical answers, while an omitted sort or page can merge
      different ones. Cache the smallest useful shared result when a complete personalised response
      would create one entry per reader.
    heading:
    - title: Normalising equivalent requests
      brief: Give two parameter spellings that the application's query contract treats identically
        and show one canonical key. Explain that sorting parameter names, applying defaults
        or normalising case is safe only when it preserves the query's meaning. Repeated parameters,
        list order, missing values and explicit empty values can differ; do not teach blanket
        string sorting as canonicalisation.
  - title: Encoding the parts without collisions
    brief: Show how two different tuples can become the same colon-joined string when a component
      contains the separator. The baseline shop identifiers use a validated restricted alphabet;
      explain that assumption. For general inputs, use an unambiguous typed or length-delimited
      encoding with a fixed field order. A digest can shorten that encoding but cannot recover
      an omitted input or repair ambiguous serialisation. Show the human-readable namespace
      alongside the encoded request. Redis accepts binary-safe keys; other stores and client
      APIs impose different limits. Colons are a naming convention, not a hierarchy or access
      boundary.
  - title: Sharing data without sharing permission
    brief: Keep the baseline catalogue public. Introduce a labelled variant with an access-restricted
      view and follow the permission check on both a miss and a hit. A hit must not skip the
      application's authorisation decision. Distinguish sharing the underlying product data
      after checking access from caching an already filtered or personalised answer, whose key
      must capture the relevant audience or principal. A tenant prefix separates names; it does
      not authenticate a caller or grant permission. Include only a brief warning that a user
      ID does not make an old permission decision current, routing revocation and policy changes
      to freshness. Avoid placing raw credentials or sensitive request text in observable key
      names.
  - title: Changing the cached representation
    brief: Put an old and a new application reader beside the same stored card. Show how a changed
      field name, type or meaning can make readable bytes the wrong value for one reader. Compare
      compatible decoding with a new format namespace. Keep v1, the representation version in
      the key, visibly distinct from revision 1 or 2, the source product revision in the value.
      Validate the expected envelope before reuse; malformed or unsupported entries are unusable
      cache results, not proof of a missing product. A new namespace creates misses and old
      entries still occupy memory; link their rollout consequences to operating the cache instead
      of developing them here.
  - title: Remembering that a result was absent
    brief: 'Follow a lookup of P99 through three outcomes: no cache entry, a successful source
      read reporting no product, and a source error. Give a cached not-found result an explicit
      tagged representation, distinct from a cache miss and from a present value that happens
      to be empty or zero. The source failure must remain an error, not become invented absence.
      The worked cache propagates source failures rather than saving them as results. The key
      still includes the request''s shop and access context. Explain that later creation ends
      the truth of this absence; freshness owns its expiry and invalidation.'
  - title: Checking a key design
    brief: 'Return to the product card and inspect a compact set of paired requests. Hold the
      source state fixed while changing shop, locale, currency, query options, audience and
      representation. Where answers differ, the entries must stay separate; where the same permitted
      answer is safe to reuse, an accidental extra input should not defeat sharing. Check that
      every reader and writer uses the same key construction. Finish with one understandable
      key/value contract and the next question: how long that answer remains acceptable, developed
      in Freshness and invalidation.'
- key: freshness
  parent: index
  topic: Cache freshness and invalidation
  title: Freshness and invalidation
  brief: Choose what a cached answer may lag behind and design how reuse ends when its source
    changes. Follow P7's price from GBP 20.00 to GBP 22.00 through expiry, invalidation and
    a delayed fill. Distinguish an entry's lifetime from the age of its source observation,
    account for missed changes and affected answers, and choose when to reuse, validate or read
    the source. The parent introduces the first price change; this article owns the freshness
    decision and its races.
  heading:
  - title: What does fresh mean here?
    brief: 'Contrast a public product card with checkout and with the merchant reading back
      an edit. Name the requirement each actually has: an allowed age, seeing one''s completed
      write, or using authoritative state for a decision. Keep P7''s source value beside the
      displayed value so a reader can describe a stale answer without assuming that every use
      needs the latest value.'
  - title: Expiry measures time in the cache
    brief: Put the source observation, delayed fill and expiry on one timeline. A 30-second
      TTL begins at insertion; it does not count the time before that insertion. Extend the
      same timeline with a lagging source replica and a second cache layer. A copied answer
      keeps its age; moving it or renewing an expiry does not make a new source observation.
    heading:
    - title: Enforcing an age limit
      brief: 'Give the product card a maximum age measured from a trustworthy source observation.
        Reject an over-age fill and check again before returning an answer. Explain what makes
        the timestamp meaningful: the source snapshot, elapsed time and clock assumptions. The
        native lab''s local monotonic clock demonstrates one process only; neither a stale replica
        nor an old transaction snapshot becomes current by being read now.'
  - title: Invalidate after the source commits
    brief: Follow commit then delete, and compare deleting before commit, when a miss can refill
      the old price. Explain what happens if the source commits but deletion fails or the application
      stops. The write remains accepted at the source; invalidation needs retry or another repair
      route. An expiry can bound reuse only under the age assumptions already established.
  - title: A fill can arrive after the deletion
    brief: 'Step through the agreed race: App A reads revision 1 and pauses; App B commits revision
      2 and deletes the key; App A fills revision 1. Show both values after each event and the
      newly started TTL. Repeat with a cache update replacing deletion to show that an old fill
      can overwrite that update too. Atomic Redis commands do not make these separate source
      and cache operations one transaction.'
  - title: Find every answer that changed
    brief: Let P7 appear in its product card and in a cached list of products under GBP 21.00.
      Raising the price changes both answers, including list membership. Trace the dependencies
      rather than assuming that deleting P7's key repairs every result. Compare known affected
      keys, a broader group invalidation and expiry where the allowed age permits it. Keep the
      source work caused by broad invalidation visible and link to Handling cache misses.
    heading:
    - title: Recovering missed changes
      brief: Explain a committed change record and retrying consumer as a repair mechanism,
        including delayed, repeated and reordered notifications. Every writer, including imports
        and administrative changes, must reach the repair path. A durable outbox or change stream
        closes a particular loss gap; it does not remove delivery delay or the late-fill race.
        Redis notifications track Redis changes and can be lost on disconnect.
  - title: Absence, deletion and access changes
    brief: 'Create P99 after an earlier read cached its absence, then delete a previously cached
      product. Both change what an answer means and need the same freshness decisions as a price
      change. A timeout is not a negative result. For a restricted variant, revoke access while
      leaving the product bytes unchanged: a content TTL cannot replace the current access check
      required by that policy. Key construction and representation stay with Cache keys.'
  - title: Put the revision in the identity
    brief: Show revision 1 and revision 2 under different keys, then explain how a reader chooses
      the current one. Develop a complete simple design that reads the authoritative revision
      and selects or builds a matching representation. Version selection and payload must agree;
      a stale selector recreates the problem. This can save expensive assembly while retaining
      a small source read. Old versions still need memory cleanup.
    nested_article:
      topic: Versioned cache fills and invalidation ordering
      title: Versioned cache fills
      brief: Design and test conditional cache publication when concurrent fills and asynchronous
        invalidations may arrive out of order. Follow P7 through source revisions, cache generations
        and rejected old fills; distinguish knowing a newer version from knowing the current
        source version. Explain the lifetime of generation metadata through eviction, expiry,
        restart and deletion, and what to do when it is missing. Compare a retained-version
        design with the parent's authoritative revision lookup. Own protocol details and counterexamples;
        refresh ownership and source-load control remain with Handling cache misses.
  - title: Reading after a write
    brief: Return to the merchant's edit and checkout. Reading the authoritative source after
      the acknowledged commit is a clear starting solution; a replica or old transaction snapshot
      may not meet that promise. A returned revision can express a minimum acceptable version
      only if the chosen read path can honour it. Finish by matching the illustrated needs to
      age-limited reuse, invalidation with repair, validated versions or a source read.
- key: versioned-fills
  parent: freshness
  topic: Versioned cache fills and invalidation ordering
  title: Versioned cache fills
  brief: Design and test a conditional fill that cannot undo an invalidation already processed
    by the cache. Follow P7's delayed revision 1 through remembered source revisions and a revocable
    fill token. Distinguish a known newer version from the current source state, and make missing
    metadata reject old work. Compare this protection with the parent's authoritative revision
    lookup; source-work scheduling remains with Handling cache misses.
  heading:
  - title: The old fill arrives last
    brief: 'Replay the parent''s exact failure: App A reads P7 at GBP 20.00, revision 1, and
      pauses; App B commits GBP 22.00, revision 2, then deletes the cache key; App A publishes
      revision 1. Show why successful deletion and individually atomic commands did not prevent
      the old answer returning. Define the narrower target: a fill must not undo a deletion
      processed after it began.'
  - title: Remembering a newer revision
    brief: Let an invalidation record revision 2 and reject a later fill carrying revision 1.
      Apply comparisons atomically and never lower the remembered revision when messages arrive
      out of order. Then evict that knowledge and replay the old fill. Missing metadata cannot
      mean revision zero or permission to publish. Keeping a number is useful only while its
      meaning and lifetime survive every path that changes the entry.
  - title: Reserve permission before reading
    brief: 'Develop a complete alternative for this race: an atomic reservation on a missing
      key returns a new one-use token before the source read. Publishing atomically replaces
      only the matching reservation with the ready value; invalidation deletes either state.
      Replay P7: deletion removes App A''s permission, so its old fill is rejected. Show why
      checking then writing in separate operations, or reserving after the read, reopens the
      race.'
  - title: When the permission disappears
    brief: Remove the reservation by expiry, eviction or an empty restart. The old fill still
      fails because missing is not a match. A new attempt reserves a new token and makes a new
      source read; it must not reuse the earlier result. Contrast this with a generation counter
      reset to a familiar number. Explain that restoring old state after failure is different
      from losing state and lies outside the simple single-instance guarantee.
  - title: What the cache has not heard
    brief: 'Delay the revision 2 invalidation until after a fill has published: a valid token
      cannot reveal the unseen commit. A late or repeated delete can remove a newer copy, causing
      work without restoring an older one. Repeat with a source replica returning revision 1
      after the reservation. State the source read and delivery assumptions beside the result,
      and distinguish rejecting a cache write from deciding whether the waiting caller may use
      its result.'
  - title: Choose where to establish the revision
    brief: Compare remembered source revisions, revocable fill tokens and the parent's authoritative
      revision lookup. A remembered maximum prevents known regression; a token prevents an invalidated
      attempt from publishing; an authoritative selector establishes which revision was current
      at that read. None freezes later source changes. Choose the simpler source lookup when
      its cost is acceptable or the cache cannot retain the required guarantees.
  - title: Exercise the competing orders
    brief: Give a reproducible controlled schedule, first failing with unconditional publication,
      then rejecting the same old fill with the token check. Also test publication before deletion,
      reservation loss followed by a new token, duplicate completion and delayed invalidation.
      Name the expected source, cache and caller outcomes separately. Make the remaining stale
      interval visible rather than treating every rejected write as a freshness proof.
- key: cache-misses
  parent: index
  topic: Cache misses, refresh and source protection
  title: Handling cache misses
  brief: Keep useful requests within the source's capacity when a popular answer expires or
    the cache becomes cold or unavailable. Follow P7's callers through shared fills, bounded
    waiting and refresh, then widen the view to many keys competing for the same source. Choose
    which work to admit and what the other callers receive. Redis is one implementation; a cache
    outage must not remove the source's protection.
  heading:
  - title: One expiry can start many reads
    brief: Begin with P7 cached and several callers arriving just after its entry expires. Follow
      each miss until the first fill completes, counting source reads and callers still waiting.
      Define a cache stampede through that burst. Slow the source read while keeping arrivals
      fixed to expose more overlapping work. Contrast the short burst with a flattering daily
      hit ratio. Keep the timings and capacity in this drawing explicitly illustrative.
  - title: Share the work for one key
    brief: Give App A one in-flight fill per complete cache key. The first caller starts it;
      later callers share its result or error. Recheck the cache after gaining fill ownership,
      and remove the in-flight entry when the work ends. Show the source-read count falling
      while the waiting callers remain visible.
    heading:
    - title: Bound the wait as well as the work
      brief: Give callers a deadline and the shared loader its own bounded lifetime. One caller
        leaving need not cancel work that others still need. Limit waiter count and memory,
        propagate failure, and avoid releasing a source slot while timed-out work is still running.
        Distinguish requesting cancellation from knowing the source stopped. A waiter whose
        budget ends receives a permitted stale result or an explicit failure; it does not automatically
        start another source read.
    - title: Across application instances
      brief: 'Add App B: a per-process map can now permit one fill in each process. Decide whether
        this bounded duplication is acceptable before adding shared refresh ownership. For a
        lease, draw a slow owner surviving its lease and a replacement owner starting. An owner
        token checked atomically at publication and release can protect those cache operations
        on the selected store; it does not cancel old source work or make the source and cache
        one transaction. Preserve the freshness article''s validity rules and source-wide admission
        even when lease service is unavailable.'
  - title: Refresh while an answer is still usable
    brief: Put an early refresh point and the last allowed serving time on one timeline. One
      caller starts a refresh while others reuse the still-permitted answer. If refreshing fails,
      the last allowed time still holds. Compare a hot key with an unused one to show what eager
      refreshing can waste. Spread refresh or expiry times across keys with jitter, without
      extending the agreed age allowance. Show why staggered deadlines do not solve a burst
      on one key or the simultaneous loss of the whole cache.
  - title: Limit source work across all keys
    brief: 'Replace the repeated P7 calls with misses for different products: per-key coalescing
      now has little to combine. Draw finite source execution slots, a bounded waiting area
      and an explicit rejection path. Separate a limit on concurrent work from a limit on starts
      per second; neither an unbounded queue nor a connection pool alone establishes a useful
      response deadline. Choose limits from measured source capacity with room for checkout
      and other uncached work. Count refreshes, warming and retries in the same budget. Show
      how per-instance limits add across the fleet, so scaling App A into more instances cannot
      silently multiply the intended source allowance.'
  - title: When the cache is unavailable
    brief: Make the cache call slow or fail, then follow the remaining request budget. Distinguish
      a cache error from a missing key. Bounded cache waits and pending calls protect the application;
      bounded source admission protects the dependency. Returning the source answer is useful
      only when that work can be admitted. Where it cannot, use a still-permitted local copy,
      an explicitly reduced result or a timely failure. Show how automatic retries can consume
      the same scarce capacity again; any retries fit the overall deadline and budget. Briefly
      explain controlled bypass and recovery probes if used, without turning the section into
      a general circuit-breaker course.
  - title: Return from a cold cache
    brief: Bring the cache back empty while requests continue. Compare demand-driven fills with
      a bounded warm-up of useful keys, both using the existing source allowance. A whole-dataset
      prefill can compete with users and evict useful entries; it is not automatically a recovery
      step. Reintroduce traffic or application instances gradually and stop the ramp when source
      latency or admitted work shows the limit has been reached. Finish by exercising the complete
      design with a slow fill, a failed refresher, many distinct misses and cache loss. Count
      useful replies, rejected requests and actual source work separately. Operating a cache
      owns the production rollout procedure.
- key: cache-memory
  parent: index
  topic: Cache admission, eviction and memory
  title: Cache memory and eviction
  brief: Choose which reusable answers deserve a limited memory budget and check that the choice
    saves useful source work as requests change. Follow the shop's product cards through a small
    cache, account for the bytes beyond their values, and compare admission and eviction on
    the same request trace. Apply that understanding to Redis as one implementation, distinguishing
    its policies and memory accounting from the illustrative model.
  heading:
  - title: The catalogue, the working set and the cache
    brief: Begin with repeated requests for P7 among requests for other product cards. Draw
      the requests beside the copies currently resident in memory, counting hits and source
      reads. Define a working set over a chosen interval and distinguish it from the whole catalogue
      and the subset that is worth keeping. Show why fitting useful repeated answers can matter
      more than storing every product, and why a change in popular products changes that judgement.
  - title: What one entry costs
    brief: 'Build up one entry from its encoded value, complete key and bookkeeping. Show allocator
      rounding or unused space as a further cost, keeping the byte diagram explicitly illustrative.
      Compare equal entry counts with unequal value sizes: one large result can take the room
      used by many product cards. Use representative size classes rather than multiplying every
      entry by the size of P7. Explain how narrower representations or a size limit can help,
      and what application work they add or leave behind.'
    heading:
    - title: Leave room for the rest of the process
      brief: Place cached entries inside the larger process and host budget. Include connections,
        temporary work, allocator retention and any enabled replication or persistence activity.
        A configured cache allowance is not a promise about total resident memory. Use measured
        headroom for the selected deployment rather than prescribing a universal percentage.
  - title: Expiry does not reserve a place
    brief: 'Give a card an expiry time, then evict it earlier to make room. Contrast time-based
      expiry with removal under pressure: a still-usable copy can be absent and an expired entry''s
      physical memory may be reclaimed later. The application must tolerate a miss before the
      TTL ends. Keep the shared 30-second insertion TTL distinct from a source-age guarantee,
      linking to freshness for that contract. Shortening TTL solely to reduce memory may increase
      source reads; it is not a substitute for a memory budget.'
  - title: Decide what enters and what leaves
    brief: Fill a small cache, then make another answer arrive. Name eviction as choosing residents
      to remove and admission as deciding whether the new answer deserves space at all. Reuse
      the same labelled requests and sizes while changing one rule, so the reader sees which
      later source reads each decision creates. Show a large one-use result displacing useful
      cards, then keep it out with an explicit admission rule.
    heading:
    - title: Recent use and frequent use
      brief: Derive least-recently-used and least-frequently-used choices from visible histories.
        Run a recurring hot set, a one-time scan and a shift to new popular products. Show both
        the appeal and the failure of each prediction; frequency needs a way to forget old popularity.
        A reuse-based admission filter can resist scans but can also delay a newly popular answer.
        Explain that none knows future requests.
    - title: Count the work saved by the space
      brief: Compare hits, occupied bytes and avoided source work for unequal answers. A higher
        hit count need not save more costly work. Use a transparent small model to expose that
        trade-off, not an invented universal ranking formula. Explain that a library's weight
        limit may constrain occupancy without making its eviction policy optimise benefit per
        byte.
  - title: Put the budget into Redis
    brief: Translate the general choices into maxmemory and an explicit policy for the worked
      disposable cache. Explain allkeys versus volatile candidates, and show that noeviction
      can refuse a fill while a successful source result is still available to return. Keep
      non-disposable state outside this eviction budget. Redis samples eviction candidates and
      approximates LRU and LFU; the exact trace model cannot predict its next victim.
    heading:
    - title: Measure entries and the process separately
      brief: Use MEMORY USAGE on representative keys and INFO memory to distinguish allocations,
        the dataset and process RSS. Explain that summing key estimates does not account for
        every process cost, and that maxmemory excludes some replication and AOF buffering.
        Briefly connect this to the earlier headroom drawing. Memcached's size-class allocation
        and Caffeine's entry or weight limits illustrate why these details change with implementation;
        avoid a product configuration catalogue.
  - title: Check the choice against changing requests
    brief: Replay representative requests with sizes, update or expiry events and source costs
      recorded. Compare a smaller and larger budget, then a policy change, using the same inputs.
      Include cold, steady, scan and shifted-hot-set phases; show where extra memory stops saving
      much work. Verify the chosen implementation on a disposable instance before relying on
      the model. Use eviction, expiry, rejected-fill and source-work observations to state what
      would overturn the choice. Route ongoing incident diagnosis and rollouts to Operating
      a cache, and cold-miss admission to Handling cache misses.
- key: redis
  parent: index
  topic: Implementing an application cache with Redis
  title: Caching with Redis
  brief: Implement and exercise a source-backed product-card cache. Follow one request through
    a real Redis client, then make the same path handle unusable entries, cache failures and
    bounded waiting. Keep the authoritative source responsible for accepted product changes.
    Redis is the worked shared store; the application owns the key, representation, freshness
    policy and fallback. The reader leaves with runnable code and an understanding of the decisions
    needed to adapt it.
  heading:
  - title: Follow a product request
    brief: Connect the familiar application, cache and source boxes to the actual client calls.
      Read P7's complete key with GET; on a miss read the source, encode its product card and
      save it with SET and EX in one command. Follow a second request to its hit. Show the returned
      value beside the command that produced it, and make clear that Redis never calls the source
      itself. Introduce the pinned client and disposable practice setup here.
  - title: Reuse one client through the application
    brief: Give the cache client and its connection pool a process lifetime, with creation at
      startup and closure at shutdown. Show several requests sharing the pool rather than opening
      a connection per lookup. Set a finite pool size and explain what happens when no connection
      is available. Use the selected client's tested configuration explicitly; distinguish transport
      connection limits from the application's limit on pending requests.
  - title: Decide whether a value can be used
    brief: 'Develop the decoding branch using four visible replies: absent key, valid product,
      explicit not-found envelope and malformed or unsupported content. Check the envelope''s
      schema and expected product context before reuse. The value''s format version differs
      from its source revision. A successful source lookup of P99 can establish absence; a failed
      lookup cannot. Use an explicit cache-miss sentinel rather than truthiness, so empty and
      zero values are not silently treated as misses. Key design owns the full identity argument;
      apply its contract here.'
  - title: Keep the source result when a fill fails
    brief: Complete the miss branch with a bounded source call and optional cache fill. If the
      source succeeds but SET fails, the request still has its source result. If the source
      fails, preserve that failure instead of writing an invented absence. Keep cache errors
      observable and distinguish a temporary unavailable cache from an authentication, schema
      or command fault that needs repair. A cache error may allow fallback only through the
      source-work budget; it must not create unlimited database work.
  - title: Fit the cache inside the request deadline
    brief: Draw a request's remaining time through connection acquisition, GET, source work
      and optional SET. Configure connection and command limits together with an overall application
      deadline. Make the retry policy explicit so hidden retries cannot consume the source's
      remaining time. Contrast a slow read with a slow optional fill and show which result the
      caller gets. Cancellation stops waiting and the selected client cleans up its connection;
      it does not retract a command already received by Redis. Avoid unbounded detached fills
      or replaying an old payload after reconnect. The misses article owns fleet-wide admission
      and request coalescing.
  - title: Change the source, then invalidate
    brief: Update the source to revision 2 and invalidate the same key only after its commit
      succeeds. Follow the next miss to GBP 22.00. A failed invalidation does not undo that
      committed update, and a timed-out mutation must not be blindly repeated as though the
      source certainly rejected it. Reuse the native lab's delayed revision-1 fill to show the
      remaining race briefly, then link to freshness and its versioned-fill child for stronger
      designs. SET with a fresh expiry controls entry lifetime; it cannot certify source age.
      Reads that need authoritative current state bypass this cached card.
  - title: Exercise the complete adapter
    brief: Join the developed branches in one downloadable adapter and a small driver with a
      clearly labelled source model. Demonstrate miss/hit, expiry, malformed and obsolete entries,
      negative results, source failure, rejected optional fills, exhausted resources and cancellation.
      Record what was run against Redis and what was injected by the test harness. Let the reader
      change one condition and inspect the result and source-call count. End by identifying
      the application-specific source adapter, freshness allowance, capacity and access settings
      to supply before operating the design.
- key: operating-caches
  parent: index
  topic: Operating and changing an application cache
  title: Operating a cache
  brief: Decide whether the cache is still helping the application, locate the cause when it
    is not, and change or recover it without overwhelming the source or returning unacceptable
    answers. Follow the shop's product-card service through a latency incident, a loss of useful
    hits and a change of cached representation. Redis supplies concrete observations and deployment
    examples; the operating questions apply to other caches too. Earlier articles own the mechanisms;
    this article joins their evidence into actions and checks the result.
  heading:
  - title: Measure what the application receives
    brief: Follow one request through a valid hit, a miss, an unusable cached value and a cache
      error. Record application outcomes, latency distributions, cache lookup and fill times,
      source attempts and admitted source work. Distinguish a key found by Redis from an answer
      the application can reuse. Read counter differences over the same interval, accounting
      for restarts and resets, rather than dividing unrelated totals. Redis INFO supplies useful
      server counters; it does not identify the application's request, freshness policy or final
      result. Use a compact annotated service view whose signals map to the request path.
  - title: Follow a slow request
    brief: 'Compare two product-card incidents with the same increased client latency. In one,
      Redis command execution grows; in the other, the wait is in the client pool, connection,
      network or application. Locate the wait with a trace and corresponding server evidence
      before choosing a change. Explain why a quiet SLOWLOG does not clear the whole cache path:
      its timing excludes communication with the client. Check payload size, client resource
      pressure and connection churn where the evidence points. Preserve the deadline and pending-work
      limits developed in Caching with Redis.'
  - title: Explain the extra source work
    brief: Keep request volume beside valid hits, source work and source latency. Show that
      a steady hit ratio can hide growing source demand when traffic grows, and that a falling
      ratio has several causes. Compare a cold namespace, expiring entries, eviction, changed
      request variants and repeated failures to store useful fills. Join application outcomes
      with Redis expired and evicted counters, rejected commands and memory measurements. Choose
      one supported intervention, then check whether useful work and user outcomes improve.
      The memory and misses articles own policy derivation and admission mechanisms; refer to
      them without repeating them.
  - title: Check the answers as well as their speed
    brief: Revisit the P7 price change with a fast cache that continues returning revision 1.
      Show which recorded revision, observation age, invalidation progress or carefully sampled
      source comparison would expose the problem. A later source read may observe a change made
      after the cached response, so a difference alone does not prove that the response violated
      its promise. Evaluate the stated age or version requirement at the appropriate point.
      Trace all affected representations and current access checks when needed. A high hit ratio
      and low latency cannot establish validity; the freshness article owns the repair mechanisms.
  - title: Choose the failure you can recover from
    brief: Draw the application, source and selected shared-cache deployment. Compare one replaceable
      Redis instance with a replicated deployment when an outage would otherwise exceed the
      source budget. Replication can improve cache availability but asynchronous failover can
      lose acknowledged cache writes or invalidations and expose older copies. A recovered endpoint
      does not prove that its data meets the freshness contract. Explain how the client discovers
      or reconnects to the current endpoint, and test its bounded behaviour during the transition.
      Managed services take on operational work; their client and data guarantees still need
      checking.
    heading:
    - title: Memory, restart and scale
      brief: Decide whether persistence helps the disposable cache recover a useful working
        set, considering saved load, restart time and the validity of restored entries. An empty
        restart can be preferable when safe rebuilding is already budgeted; replication without
        persistence can also propagate an empty restarted primary. If one node cannot hold or
        serve the useful set, explain that Redis Cluster distributes keys and requires a client
        that handles redirects. One hot key still has one slot owner; adding shards does not
        divide that key's work. Multi-key protocols must fit the chosen topology. Keep provisioning
        commands and general cluster administration in the product documentation.
    - title: Limit access to the cache
      brief: Keep the shared store reachable only from the systems that need it and protect
        connections with the deployment's TLS and authentication setup. Give the application
        the commands and key patterns it needs, while administration uses a separate identity.
        In Redis, a key prefix alone does not restrict commands such as FLUSHALL. Verify both
        a permitted product operation and a forbidden administrative operation for the configured
        identity. Rotate credentials with a tested reconnection path. These store permissions
        do not replace the application's decision about which reader may see an answer.
  - title: Rehearse the change and the recovery
    brief: Follow a product-card format change from v1 to v2 through a small rollout, wider
      traffic and possible rollback. Keep old and new readers compatible with what they can
      encounter, or give formats separate namespaces. Show the extra memory and source demand
      while two namespaces coexist. Source changes must still invalidate every live representation.
      A rollback must not trust an old namespace whose invalidations have stopped. Increase
      the rollout only while application latency, source budget, validity and error behaviour
      meet their declared limits; stop or reverse it when they do not.
    heading:
    - title: Bring a cold cache back gradually
      brief: 'Rehearse cache unavailability and an empty cache with the same bounded source
        path used in normal service. Admit a controlled amount of warm-up and request work together,
        observe useful hits returning, and increase traffic only as the source remains healthy.
        A responding Redis PING is not a warm-cache or application-readiness test. Prefer rebuilding
        useful answers to indiscriminate full-dataset warming. End with a short worked change
        record: what changed, the observation that permits the next step, the stop condition
        and the rollback or recovery path.'
