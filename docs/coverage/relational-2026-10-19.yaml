topic: Relational databases
title: Relational databases
brief: >-
  Take an intelligent engineer who is new to relational databases to expert practice: choosing
  an appropriate relational system, designing and building applications with it, diagnosing behaviour,
  and operating and recovering it with sound judgement. The root gives a compact relational mental
  model, a complete order-reservation walkthrough, early task entrances and a worked system shortlist.
  Its stopping condition is that a newcomer can explain the database contract, distinguish responsibilities
  of the application and operator, and choose the next question to investigate. Descendants supply
  working depth. Teach implementation differences where they change judgement, compare neighbouring
  database families without planning their collections, and teach required distribution mechanisms
  in the relational context.
heading:
  - title: Find your next question
    brief: >-
      Define a relational database briefly as a system for representing related facts, querying
      and changing them, and enforcing specified integrity and transaction rules. Set up the order-reservation
      example, then expose direct task entrances before the walkthrough: first application to
      design, SQL and application integration; correctness incident to transactions; slow workload
      to execution and diagnosis; recovery preparation to operations; system evaluation to the
      root's shortlist section, following distribution only when its constraints matter. Name
      a concrete outcome for each path and make clear that the following walkthrough is the continuous
      first-reading route, not a prerequisite for revisiting one branch.
  - title: Put facts into relations and protect their meaning
    brief: >-
      Show customers, orders, order lines and stock reservations as a small connected schema.
      Explain facts, keys and relationships through that example, and use one valid-quantity constraint
      to show a database-enforced rule. Establish that a schema expresses meaning, rather than
      being a collection of containers. Defer formal dependency analysis, SQL duplicates and missing-value
      semantics to their owning branches; introduce the shared-stock concurrency rule only in
      the transaction section.
    nested_article:
      topic: Relational data modelling and integrity
      title: Designing relational data
      brief: >-
        Turn business facts and invariants into relational schemas that remain understandable
        as requirements change. Develop an order-reservation design from statements of fact through
        keys, relationships, dependencies, types and constraints, then challenge it with changes,
        missing values, history and competing writers. The reader should be able to explain what
        each row means, what identifies it, which invalid states the database rejects, which rules
        require a transaction protocol, and what a deliberate duplication costs. Own schema meaning
        and integrity design; SQL owns statement semantics, transactions owns concurrency protocols,
        application engineering owns delivery of schema and data migrations, and execution owns
        physical tuning.
      heading:
        - title: Write down facts and forbidden states first
          brief: >-
            Begin with a small order-reservation scenario and ambiguous requirements rather than
            a table diagram. Separate a product's current price, an agreed order-line price, a
            reservation and a completed sale. Write representative facts, queries, lifecycle transitions
            and counterexamples. Translate terms such as unique, required, current and owned into
            explicit scope and time boundaries.
          heading:
            - title: Give every relation a sentence
              brief: >-
                State exactly what one row asserts and at what grain; distinguish an entity, an
                association and an event. Draw a compact candidate schema with example rows, including
                two order lines for the same product, and use competing interpretations to expose
                unspecified requirements.
            - title: Keep an invariant ledger
              brief: >-
                Record each rule with an example valid state, a forbidden state and an expected
                enforcement owner. Start with line identity, positive quantities, tenant-scoped
                references and reservation totals; revise the ledger as the design develops. Separate
                stored truth from convenient answers and measures derived from that truth.
        - title: Choose identity and model relationships
          brief: >-
            Derive candidate keys from facts and business rules. Choose a primary key while preserving
            other required uniqueness. Explain the consequences of natural, surrogate and composite
            keys, including stability, scope, generated identifiers and equality; an identifier
            alone does not prevent duplicate business facts.
          heading:
            - title: Make uniqueness match the business scope
              brief: >-
                Work through order-line identity, reusable external identifiers, case and collation-sensitive
                names, and tenant-local identifiers. Show how composite uniqueness and references
                preserve scope, including a cross-tenant reference that individually valid identifiers
                would otherwise allow. Separate identity from display order and from any promise
                of gap-free numbering.
            - title: Represent cardinality and participation
              brief: >-
                Map one-to-many, many-to-many and optional one-to-one relationships to keys, references
                and association relations. Distinguish at most one from exactly one and an optional
                reference from a required reverse relationship. Give relationship attributes a
                home; examine repeated columns, lists of identifiers, polymorphic references and
                subtype alternatives through the rules they obscure.
        - title: Let dependencies explain where facts belong
          brief: >-
            Use a deliberately repetitive order sheet to reveal update, insertion and deletion
            anomalies. Derive functional dependencies from business meaning rather than accidental
            sample uniqueness. Decompose product, order and line facts while keeping the agreed
            sale price with the line; show why this is a different fact from the product's current
            price.
          heading:
            - title: Check that decomposition preserves meaning
              brief: >-
                Introduce candidate keys, partial and transitive dependencies and useful normal
                forms through this worked design. Reconstruct the original facts with a join,
                expose a lossy split that invents combinations, and distinguish lossless reconstruction
                from preservation of enforceable dependencies.
              nested_article:
                topic: Dependencies and relational decomposition
                title: Normalising relational schemas
                brief: >-
                  Derive dependencies from business facts and use them to decide whether splitting
                  a relation removes an anomaly without changing its meaning. Work an order-line
                  example through candidate keys, first, second and third normal forms; prove
                  lossless reconstruction and check dependency preservation. Use a small overlapping-key
                  counterexample for the BCNF trade-off and one independent multivalued fact for
                  fourth normal form. Own decomposition reasoning; leave complete schema design
                  and deliberate duplication to the parent, history to its neighbouring article,
                  and SQL join mechanics and concurrency protocols to their owners. Normal forms
                  are tests of stated dependencies, not a guarantee of a complete or appropriate
                  design.
                heading:
                  - title: Start with facts that must remain true
                    brief: >-
                      Open with an inconsistent update to an order's repeated customer name. Establish
                      the representation before deriving keys: first normal form replaces a repeating
                      group of independently related line facts in one cell with one line per
                      row and values from the chosen scalar domains. Explain atomicity relative
                      to the intended domain and operations: an address or timestamp need not
                      be split merely because it has parts. The following proofs concern set relations
                      and ordinary present values; SQL duplicates, NULLs, arrays and JSON require
                      their owners' separate representational decisions. Keep this setup compact
                      and retain the resulting flat OrderLine relation throughout: order number,
                      line number, order date, customer number, current customer name, product
                      number, current product name, quantity and price charged for that line.
                      State one customer and date per order, customer-number-to-current-name and
                      product-number-to-current-name rules, and order-number-plus-line-number
                      determining product, quantity and charged price. The same product may occur
                      on several lines with different prices. Contrast current names with historical
                      snapshots to avoid inventing the wrong dependency. Show the insertion and
                      deletion anomalies alongside the opening update, distinguishing redundancy
                      from missing entities and lifecycle requirements that the parent owns.
                  - title: Find the keys implied by the rules
                    brief: >-
                      Read X -> Y as agreement on X requiring agreement on Y in every legal state.
                      Distinguish a determinant, a superkey and a minimal candidate key; the primary
                      key is one selected candidate. Compute attribute closure by repeatedly applying
                      dependencies, then remove attributes to test minimality. Derive the order-line
                      candidate key from the stated rules, show why product number cannot replace
                      line number, and keep alternate keys visible when testing normal forms.
                      A violating pair can refute a claimed dependency, but a tidy sample cannot
                      establish a business rule. Adding a surrogate identifier leaves existing
                      dependencies and their anomalies in place.
                  - title: Separate facts that depend on different keys
                    brief: >-
                      Continue the same example through two motivated stages rather than a normal-form
                      ladder of unrelated tables. Define a prime attribute as belonging to some
                      candidate key. State 2NF as no non-prime attribute depending on a proper
                      subset of any candidate key; show order date and customer facts depending
                      on only the order-number part of the line key. Split Orders from OrderLines.
                      For 3NF, expose the remaining customer-number-to-name dependency in Orders
                      and product-number-to-name dependency in OrderLines, then split Customers
                      and Products. Keep the charged price on the line under the stated business
                      rule. Name the resulting relations, keys and dependencies and replay the
                      initial invalid updates. Give the precise 3NF test beside its motivating
                      split: for each non-trivial X -> A implied by the dependencies, X is a superkey
                      or A is prime. Relate it to the simple transitive-dependency example without
                      replacing the definition with a chosen-primary-key shorthand. Recompute
                      keys and projected dependencies in each resulting relation, rather than
                      treating original key labels as permanent. Reuse the exact definition in
                      the later overlapping-key example instead of introducing another definition
                      section.
                  - title: Prove that the split preserves the intended relationships
                    brief: >-
                      Distinguish two questions: joining projections reconstructs every legal
                      original relation without invented tuples, and enforcing dependencies within
                      the new relations implies the original dependencies without joining. Illustrate
                      a lossy split with two original tuples that yield a spurious combination,
                      then test each binary split of the order-line example using the common attributes
                      determining all attributes of one side under the functional dependencies.
                      Show why applying lossless binary splits successively proves the whole reconstruction.
                      Check preservation by projecting implied dependencies onto each relation
                      and taking their combined closure; do not just check whether the original
                      dependency text appears unchanged. Keeping all columns and passing one sample
                      round-trip is insufficient. Foreign keys support references but do not establish
                      these properties.
                  - title: Choose between BCNF and a dependency that spans the split
                    brief: >-
                      Use Assignment(student, course, instructor) under student+course -> instructor
                      and instructor -> course: a student has one instructor per course, and each
                      instructor teaches one course. Derive both candidate keys, student+course
                      and student+instructor; show why course is prime and the relation satisfies
                      3NF while instructor is not a superkey, violating BCNF. Split into InstructorCourse
                      and StudentInstructor. Prove losslessness, then construct individually legal
                      component states in which one student has two instructors for the same course:
                      the original student+course dependency is not preserved. Compare retaining
                      3NF with accepting a rule spanning relations; name the integrity obligation
                      and hand its concurrent enforcement to the parent and transaction owner
                      instead of prescribing a trigger as a complete solution.
                    heading:
                      - title: Use a decomposition method with a known guarantee
                        brief: >-
                          Summarise the choice once the counterexample establishes its cost: repeatedly
                          split on a BCNF violation for lossless BCNF without a general preservation
                          guarantee; for functional dependencies, use 3NF synthesis when preservation
                          matters. Explain the needed minimal-cover steps using Assignment's existing
                          two dependencies: group determinants to obtain Assignment and InstructorCourse,
                          then remove the contained InstructorCourse relation, retaining the original
                          3NF Assignment. It already contains a candidate key; state the general
                          method's conditional key-relation addition without introducing another
                          worked schema. Place this retained 3NF result beside the BCNF components
                          and their spanning constraint. State the lossless and preservation guarantees
                          and their dependence on the supplied dependencies. Omit exhaustive cover
                          derivation and algorithm proofs; the recipe neither discovers the business
                          model nor minimises the entire application's table count.
                  - title: Separate genuinely independent multivalued facts
                    brief: >-
                      Use PersonLanguageHobby(person, language, hobby) under the explicit rule
                      that a person's languages and hobbies vary independently. No non-trivial
                      functional dependency need hold, so the relation can be in BCNF while needing
                      every language-hobby combination. Add a language to expose the repeated
                      work, define the multivalued dependency and fourth normal form, and split
                      PersonLanguage from PersonHobby. Show the four-tuple rectangle required
                      by independence and lossless reconstruction. Change the requirement so that
                      a language is used for a particular hobby: now the pairing is a fact and
                      the same split invents facts. Briefly acknowledge join dependencies beyond
                      this case without adding a catalogue of higher normal forms. End by having
                      the reader justify a split using its business rule, keys, removed anomaly,
                      losslessness and preserved or newly spanning constraints; return whole-design
                      and deliberate-duplication decisions to the parent.
            - title: Separate a flexible attribute from a hidden schema
              brief: >-
                Compare dedicated columns, lookup relations and document-valued attributes for
                stable core facts and variable extensions. Evaluate type checks, references, uniqueness,
                querying and evolution costs; use a concrete new attribute requirement to show
                when an entity-attribute-value design or a document hides invariants the application
                must now maintain.
        - title: Give values precise domains
          brief: >-
            Choose representations from meaning, range, precision and comparison rules. Connect
            schema and application values without cataloguing every engine type. Make rounding,
            units, textual equality and absence explicit requirements rather than incidental defaults.
          heading:
            - title: Store quantities with units and precision
              brief: >-
                Model counts, measured quantities and money with currency, range and rounding
                policy. Compare exact and approximate numeric representations using an order total;
                distinguish a percentage from its chosen scale and a currency amount from a unitless
                number. Explain domain checks and the limits of type names as business validation.
            - title: Distinguish missing, unknown and inapplicable
              brief: >-
                Use an unassigned shipment, an unknown value and an intentionally absent attribute
                to decide between null, an explicit state and a separate relation. Explain the
                design consequences of three-valued predicates, nullable uniqueness and composite
                references; require engine-specific verification rather than assuming null behaves
                identically in every constraint. SQL owns the full expression and join semantics.
            - title: Distinguish instants, local times and durations
              brief: >-
                Separate an audit instant, a local delivery appointment and a duration. Specify
                time zone context, precision and interval boundaries, including daylight-saving
                ambiguity and expiry at an exact boundary. Explain which original context must
                be retained rather than assuming a stored timestamp encodes the user's zone or
                historical interpretation.
        - title: Turn the invariant ledger into enforcement
          brief: >-
            Annotate the evolving schema with not-null, check, unique and foreign-key constraints
            and show a rejected counterexample for each. Explain immediate and deferred checking
            as choices in allowed transitions, and distinguish accepting individual rows from
            protecting a rule across rows, relations and concurrent transactions. Verify capabilities
            against named engine versions when they change the design.
          heading:
            - title: Put ordinary guards in the schema
              brief: >-
                Classify row-local validity, key uniqueness and referential validity, then use
                the ledger to select each ordinary guard once. Work a conditional uniqueness rule
                through a structural reformulation and, where supported, a conditional index;
                identify the capability and equality assumptions that change the choice. Keep
                temporal interval enforcement with the history child.
            - title: Recognise rules that need more than a row check
              brief: >-
                Work one deferred-checking transition and contrast it with an aggregate reservation
                limit and a lifecycle transition rule. Explain the reach and gaps of generated
                values, routines and triggers, including what a procedure can reject without establishing
                a guarantee across concurrent writers. Trace two competing reservations that both
                pass a naive check, specify the required invariant and hand protocol construction
                to the transactions article.
            - title: Make rejection useful to every writer
              brief: >-
                Give constraints stable names and map failures to domain outcomes. Include imports,
                administrative changes and application writes in the enforcement boundary, and
                distinguish friendly pre-validation from the final guard. Explain that declaring
                a constraint and establishing that existing data satisfies it are separate concerns;
                link migration execution to application engineering and access policy to operations.
        - title: Model ownership, history and lifecycle deliberately
          brief: >-
            Extend the example with changed customer details, cancelled reservations, deleted
            products and corrected order facts. Decide whether the application needs current state,
            an immutable snapshot, a sequence of events or time-bounded facts, and state who owns
            each relation and its lifecycle.
          heading:
            - title: Decide what survives a change or deletion
              brief: >-
                Compare a live customer address reference with the address agreed for an order,
                and restrict, cascade, nullification and explicit lifecycle transitions for related
                rows. Treat ownership, shared references, soft deletion, identifier reuse and
                retention as separate decisions. Surface the conflict between an audit trail and
                erasure requirements as a requirement to resolve, without offering legal advice
                or equating a delete flag with deletion.
            - title: Preserve the past the question actually needs
              brief: >-
                Contrast current-state updates, order snapshots, append-only change records and
                valid-time intervals with a backdated price correction. State whether a question
                asks what was true then or what the system believed then. Show why a changed-at
                column or audit log alone may not answer either question completely, and introduce
                the deeper temporal design only when both axes or interval invariants are needed.
              nested_article:
                topic: Relational history and temporal modelling
                title: Modelling history and time
                brief: >-
                  Design relational history from questions about past facts and corrections. Compare
                  current rows plus audit records, immutable transaction snapshots, versioned
                  entities, valid-time intervals and recorded-time history; develop a worked backdated
                  correction into a two-time-axis example when the requirements demand it. Specify
                  stable identity, interval boundaries, overlaps, gaps, open-ended periods, historical
                  references, provenance, deletion and correction policy. Work an interval/overlap
                  enforcement example, distinguishing structural or declarative protection from
                  a rule requiring the transactions owner's concurrent update protocol. Explain
                  what temporal features in named systems do and do not supply, and how to validate
                  representative as-of answers. Own historical meaning, representation and temporal
                  constraint choices; the parent owns ordinary rule placement and operations owns
                  retention and recovery execution.
        - title: Use access patterns without losing the source of truth
          brief: >-
            Test the logical design against the required reads and writes before changing it for
            convenience. Compare joining normalised facts, storing an order total, maintaining
            a summary and producing a separate read model. Distinguish an agreed historical snapshot
            from a duplicate of the same current fact.
          heading:
            - title: Make duplication a maintenance contract
              brief: >-
                For each derived value, name its authoritative inputs, update owner, atomicity
                or permitted staleness, rebuild method and reconciliation check. Challenge a stored
                order total after line edits, cancellations and failed updates. Decide when measured
                need justifies duplication; hand cache and read-model delivery to application
                engineering and query and index diagnosis to execution.
            - title: Separate logical identity from physical organisation
              brief: >-
                Explain that an index, partition key or storage layout can affect cost and available
                enforcement without defining the business identity. Include a workload-driven
                key choice whose consequences must be measured, and flag partition or shard scope
                when it limits enforceable uniqueness or references; hand the mechanisms to execution
                and distribution.
        - title: Test the design against a new requirement
          brief: >-
            Present the complete annotated schema and cumulative invariant ledger as the review
            artefact: row-meaning sentences, candidate and primary keys, relationship cardinalities,
            domains and units, enforcement owners, history and deletion policy, and duplication
            contracts. Use its existing counterexamples as evidence rather than repeating their
            walkthroughs. Now require split fulfilment and cancellation after partial shipment:
            ask the reader to revise row meanings, identity, lifecycle, quantity rules and enforcement
            ownership, then explain a defensible design and its trade-offs. Finish when the reader
            can defend the revised schema with examples and counterexamples and identify the assumptions
            that must change before application engineering delivers a migration.
  - title: State the result you need in SQL
    brief: >-
      Follow one order summary from connected rows to a joined answer. Show one plausible join
      that multiplies order totals and repair it, establishing that desired result and row cardinality
      must be reasoned about before speed. Explain declarative SQL as specifying the answer while
      an engine chooses the work. Stop before a query tutorial; absent matches, missing values,
      ordering and SQL constructs belong in the child.
    nested_article:
      topic: SQL queries and data changes
      title: Working with SQL
      brief: >-
        Teach a newcomer to read, write and check useful SQL against a small order schema, progressing
        from an explicit result contract to joins, grouped results and bounded changes. Use PostgreSQL
        18 as one executable reference dialect, with a resettable fixture and expected results;
        label extensions and differences that change the answer rather than running parallel product
        tutorials. Develop judgement about row grain, duplicate multiplicity, missing values,
        ties and the rows a statement affects. Introduce substantial query composition and data-change
        semantics here, with two focused descendants supplying their working depth. Keep views,
        routines, triggers and import/export statement effects in this article. Own statement
        meaning and result validation; schema integrity design, transaction protocols, client
        integration, execution diagnosis and operational procedures have separate owners. Stop
        when the reader can produce and challenge a query or change against an explicit contract,
        identify dialect assumptions and choose the relevant depth.
      heading:
        - title: Start with a result you can check
          brief: >-
            State the requested row grain, columns, inclusion rules, duplicate policy and ordering
            before writing SQL. Introduce customers, orders, order lines and payments with a small
            labelled fixture containing multiple lines and payments, an unmatched customer, a
            missing value and tied timestamps. Supply minimal CREATE TABLE and INSERT setup, reset
            instructions and a first SELECT with its expected result. Use the schema as given;
            defer its design to the data modelling article. Say exactly which PostgreSQL 18 engine
            executes examples and distinguish observed results from hand-worked teaching tables.
          heading:
            - title: One runnable dialect, a family of contracts
              brief: >-
                Establish the portable core and a compact convention for marking extensions. Distinguish
                identifiers, quoted identifiers, string literals, statement boundaries and typed
                values. Introduce consequential dialect differences beside the task they change,
                then collect a compact portability ledger at the end; verify named differences
                against versioned primary documentation when writing. Reader-supplied values belong
                in parameters; the application article owns driver syntax and SQL injection defence.
                Do not equate similar syntax with identical semantics.
        - title: Build a result from expressions and rows
          brief: >-
            Read SELECT, FROM and WHERE using a logical explanation of intermediate rows, explicitly
            distinguished from an engine execution sequence. Project named columns and aliases,
            then use one explicitly typed calculation whose integer division and precision affect
            the requested value. Introduce other expressions only at the later task that needs
            them. Explain that a query result is unordered unless its outermost query requests
            order and normally retains duplicate rows; use DISTINCT only when the result contract
            requires duplicate elimination.
        - title: Filter when some facts are missing
          brief: >-
            Develop TRUE, FALSE and UNKNOWN with a tiny truth table and row predictions. Teach
            comparisons, AND/OR/NOT precedence, IS NULL, IS NOT NULL and explicit null-safe equality
            in the reference dialect. Explain why WHERE retains only TRUE, why NULL is not an
            empty string or zero, and why COALESCE changes meaning. Now use CASE and protected
            division to choose whether an undefined ratio is missing or excluded, showing the
            resulting rows. Textual AND/OR order is not an evaluation guard; put NULLIF or a suitable
            CASE inside the risky expression. Test nullable membership with IN and NOT IN and
            teach NOT EXISTS once as the expression of no matching row. Include pattern and range
            predicates, the inclusive endpoints of BETWEEN and half-open timestamp ranges, with
            text comparison and session time-zone assumptions beside their examples. Hand schema
            choices about whether a fact may be missing to data modelling.
        - title: Join without losing the meaning of a row
          brief: >-
            Build a join from matching row pairs, then predict result counts from key cardinality
            before running it. Teach inner, cross, left and full outer joins, aliases and self-joins;
            explain a right join by swapping sides rather than adding another recipe. Use explicit
            ON conditions and selected columns. Show unmatched rows, multiple matches, null join
            keys and the difference between filtering ON and WHERE after an outer join. Make both
            accidental cross joins and legitimate many-to-many multiplication visible.
        - title: Summarise at the intended grain
          brief: >-
            Move from rows to groups using GROUP BY and HAVING, distinguishing row filters from
            group filters. Explain COUNT(*), COUNT(expression), DISTINCT aggregates, SUM and AVG,
            including NULL inputs and empty input. Use explicit grouping of selected non-aggregate
            expressions as the portable starting rule and label reference-dialect functional-dependency
            allowances. Show conditional aggregates with CASE and the reference dialect's FILTER,
            a denominator checked separately, and an aggregate whose value depends on explicit
            input order. Reuse the unsafe division example: protect the aggregate's input or filter
            it, rather than guarding the completed aggregate with an outer CASE. Keep detailed
            evaluation exceptions in query composition. Defer specialist grouping sets unless
            needed by the query-composition descendant's worked task.
          heading:
            - title: A plausible total can still be wrong
              brief: >-
                Carry the visible line/payment row-pair multiplication from the join example into
                a SUM and predict its incorrect total. Demonstrate that DISTINCT can hide repeated
                rows while preserving the wrong total. State the required one-row-per-order grain
                before combining amounts; the next section constructs that repair with separately
                aggregated inputs. Reuse the earlier existence test when only membership is required.
                Check unmatched and duplicate keys with small counterexamples; physical joins
                belong to execution diagnosis.
        - title: Compose a query around intermediate results
          brief: >-
            Complete the preceding wrong-total example once: name separately aggregated line and
            payment results with CTEs, then join one row per order and check the corrected total.
            Explain each intermediate result's grain before revealing its rows, using the same
            fixture rather than three alternative formulations. Contrast combining rows with a
            set operation, combining columns with a join, grouping rows into aggregates and retaining
            rows with a window function. Preview a latest-order-per-customer result with tied
            timestamps to motivate explicit tie policy. Choose a form for clarity of meaning;
            SQL structure does not prescribe materialisation or execution order.
          nested_article:
            topic: Composing and validating substantial SQL queries
            title: Composing SQL queries
            brief: >-
              Build a customer-period report from the parent's order totals: one row per customer
              and period with ordered and paid amounts, latest order, a ranking and a previous-period
              comparison. Choose derived results, CTEs and scalar or correlated subqueries by
              the intermediate grain each stage requires; explain scalar cardinality, empty results
              and correlation scope through alternatives at a real report stage. Build window
              partitioning, ordering, peers and frames through rankings, running totals and lag/lead,
              specifying tie policy and distinguishing window order from final result order. Stop
              the main path when readers can assemble and independently check the report's grain,
              totals and tie behaviour against duplicate, absent, NULL and empty fixtures. Reuse
              the parent's membership and ordering lessons without reteaching them. Add small
              explicit overlap/difference tasks for UNION/INTERSECT/EXCEPT and ALL, testing duplicate
              multiplicity and compatible types. Give difficult multi-column keyset pagination
              its own direct task entrance, including nullable keys, direction, collation and
              mutable-data limits, without replaying basic pages. Make recursion an optional bounded
              traversal of a tiny added categories(id, parent_id) hierarchy, with termination
              and cycle handling. LATERAL and less-used window variations earn optional depth
              only where a named task needs them. Own a short expression-safety depth note on
              aggregate argument evaluation and CASE's planning-time constant-evaluation limits.
              Separate logical reasoning from engine traces and label dialect-specific features;
              planning, indexing and transaction guarantees have separate owners.
        - title: Ask for a deterministic order and page
          brief: >-
            Teach multi-column ORDER BY, ascending and descending direction, explicit NULL placement
            and a unique tie-breaker. Distinguish ordering the output from choosing rows within
            a subquery or window. Explain LIMIT/OFFSET, the standard FETCH form and what WITH
            TIES requests. Contrast an offset page with a simple keyset page using the same total
            order; show insertions between requests so readers do not infer a stable multi-request
            snapshot. Deeper cursor predicates belong to query composition, snapshot protocols
            to transactions and access costs to execution.
        - title: Change exactly the intended rows
          brief: >-
            Introduce explicit-column INSERT, INSERT ... SELECT, UPDATE and DELETE with predicates
            and returned results. State the target-row contract, predict the affected set on the
            fixture and compare the returned row identities and values with that prediction. Use
            a disposable setup for destructive exercises. Show defaults, generated identifiers
            and constraint rejection as observable effects, without reteaching integrity design.
            Contrast changing a value, setting NULL, deleting a row and returning no row; a successful
            statement need not affect one row. A preceding SELECT is a reasoning aid rather than
            concurrency protection.
          nested_article:
            topic: SQL data-change statement semantics
            title: Changing data with SQL
            brief: >-
              Teach precise INSERT, UPDATE, DELETE and reference-dialect MERGE semantics, including
              defaults and generated values, multi-row sources, predicates, expressions over old
              values, affected-row counts and RETURNING. Explain constraint failures and distinguish
              checking during statement execution, end-of-statement checks for applicable immediate
              deferrable constraints and deferred checks that may still reject commit. Show a
              statement returning rows while a deferred check remains outstanding; hand control
              of deferral and commit handling to transactions and constraint-property choices
              to modelling. Explain how trigger effects influence returned results without promising
              a transaction outcome. Own the detailed row-level versus statement-level, BEFORE
              versus AFTER, modified-value, added-write, raised-error and zero-row trigger cases,
              showing which values RETURNING includes and which side effects it does not enumerate.
              Begin beyond the parent's known insert/update/delete sequence rather than replaying
              its syntax tutorial. Develop conditional updates and conflict handling with PostgreSQL
              18 ON CONFLICT, its conflict target, EXCLUDED values, update predicate and no-row
              outcomes; contrast the contract of MERGE rather than treating it as a spelling of
              upsert. Expose duplicate source matches in UPDATE ... FROM, DELETE ... USING and
              MERGE, specify a unique source-to-target mapping, and test missing and repeated
              input keys. Explain data-modifying CTE statement semantics only where needed to
              reason about combined results; use explicit contracts rather than assuming textual
              step order. Contrast DELETE and TRUNCATE through their visible scope and effects.
              Use prediction, returned identities and postcondition checks on a resettable fixture.
              Hand multi-statement invariants, concurrent histories and retries to transactions,
              ambiguous client outcomes and idempotency to application engineering, and bulk ingestion
              workflows to that article rather than claiming that one SQL statement solves them.
        - title: Follow SQL stored behind a name
          brief: >-
            Explain the observable contracts of views, routines and triggers using a small view
            and a triggered data change. A name can hide SQL that runs when read or written; inspect
            its definition and effects when a result is surprising. Keep placement, deployment
            and operational privilege policy with their owners.
          heading:
            - title: Views expose a query, materialised views retain a result
              brief: >-
                Teach column contracts and dependency on underlying data with ordinary views,
                their reference-dialect write restrictions and check options. Contrast an ordinary
                view with a materialised result and explicit refresh, including what freshness
                the reader can infer. Show that ordering inside a definition does not replace
                the caller's result-order contract. Leave refresh resource costs and runbooks
                to execution and operations.
            - title: Routines and triggers can add reads and writes
              brief: >-
                Distinguish calling a function in a query from invoking a procedure, using the
                reference dialect's rules and explicitly labelling dialect differences. Show one
                triggered change adding a visible effect beyond the written statement, then inspect
                the routine and trigger definitions. Returned rows may not enumerate every side
                effect. Give detailed trigger timing, granularity, zero-row and returned-value
                cases to Changing data with SQL; keep this a bounded diagnostic bridge. Provide
                an inspection checklist for visible definitions and effects; do not make procedural
                trigger code a substitute for an analysed concurrency protocol. Application engineering
                owns placement and tests/deployment, operations owns execution privileges.
        - title: Know what import and export actually do
          brief: >-
            Demonstrate PostgreSQL 18 COPY FROM, COPY TO and query export with explicit columns,
            a small round-trip file and expected results. Distinguish server file access, STDIN/STDOUT
            and the psql client's backslash-copy command; state what is available in the chosen
            executable environment. Explain text versus CSV quoting, NULL versus empty values,
            encoding and type parsing, default/generated columns, constraint and trigger effects,
            and the reference command's failure or row-skip contract. Export a query with an explicit
            order when order matters. Keep the treatment at statement semantics: staging, checkpoints,
            restartability and reconciliation belong to application engineering; loading costs
            to execution and filesystem privileges to operations. Provide a small semantic example
            here rather than a separate bulk-loading article.
        - title: Prove the answer with cases that could break it
          brief: >-
            Finish with one compact query-and-change exercise on the same schema, with expected
            row identities, multiplicities, NULL values, totals and ordering stated before the
            solution. Reuse edge cases introduced throughout rather than adding a new tutorial.
            Challenge empty input, no match, repeated matches, tied values and a rejected change;
            show how a small counterexample refutes a plausible query. Separate equality of unordered
            multisets from equality of ordered results, avoid verifying a query solely with another
            copy of the same logic, and identify where a statement test cannot establish concurrency
            correctness or production performance. Collect the task-local dialect notes in a compact
            end reference for NULL ordering, casts, text comparison/collation, time arithmetic,
            grouping, pagination and data-change extensions. Point to the two descendants by the
            reader's next task rather than adding a syntax catalogue.
  - title: Make a business decision survive concurrent work
    brief: >-
      Let two customers attempt to reserve the final item. Show one read-then-write history that
      violates the stock invariant and one repaired transaction protocol with explicit preconditions.
      Use only the atomicity, visibility and conflict concepts needed to explain the contrast,
      distinguishing commit from a blanket claim that any transaction is safe. Explain that permitted
      concurrent histories depend on the engine and isolation setting. Defer anomaly catalogues
      and engine labels to the child.
    nested_article:
      topic: Relational transactions and concurrency
      title: Reasoning about transactions
      brief: >-
        Teach how to turn an application invariant into a transaction protocol whose permitted
        outcomes can be explained and tested. Use a stock reservation as the running example,
        using PostgreSQL 18 as the reference engine and SQL dialect, then expose the limits of
        single-row reasoning with a rule spanning several rows. Connect atomicity, isolation and
        durability to outcomes; explain snapshots, locks, multiversion concurrency, anomalies,
        serialisability, conditional changes, uniqueness, deadlocks and retries. Compare named
        engine contracts where they change the protocol, rather than treating isolation labels
        as interchangeable. The reader should leave able to analyse a two-session history, choose
        and justify a protection mechanism, recognise abort and retry boundaries, and design a
        deterministic concurrency test. The child develops complete multi-row protocols. Application
        engineering owns connection lifetimes, ambiguous client outcomes, idempotency across requests
        and external effects; execution owns physical recovery and performance investigation;
        distribution owns cross-server consistency and transaction coordination.
      heading:
        - title: Start with the rule that must remain true
          brief: >-
            State that available stock must never become negative and that a reservation must
            correspond to a stock change. Follow two customers through a check-then- write race
            before introducing terminology. Write down the initial state, each transaction's reads
            and writes, successful commit and abort, and the acceptable final states. Separate
            a transaction that is wrong even alone from one that is correct alone but unsafe under
            concurrency.
          heading:
            - title: What a transaction promises
              brief: >-
                Explain BEGIN, COMMIT, ROLLBACK and implicit statement transactions using the
                example. Relate atomicity to partial failure, isolation to overlapping work and
                durability to the configured acknowledgement and failure contract. Explain that
                ACID consistency still requires correct rules and protocols. Name savepoints as
                partial rollback boundaries, not independent commits, and flag transactional DDL
                and sequence behaviour as engine-specific.
            - title: Read a history before choosing a setting
              brief: >-
                Introduce a two-lane read/write/commit history with explicit values and blocking
                points. Ask the reader to predict the result, then compare it with legal serial
                executions. Treat the figure as an illustrative schedule; recorded native-engine
                runs elsewhere must state version and settings. Keep replication visibility and
                acknowledgement loss for their owners.
        - title: Put the decision and the change under one protection
          brief: >-
            Repair the reservation using a conditional stock decrement inside the same transaction
            as the reservation insert. Explain why wrapping an earlier read and a later unconditional
            write in BEGIN does not by itself repair the race. Carry the invariant through success,
            rejection and rollback.
          heading:
            - title: Conditional updates and version checks
              brief: >-
                Show an engine-specific conditional UPDATE, affected-row or returned-row check,
                and an optimistic version comparison. Contrast applying an increment to the current
                protected row with overwriting it using a stale value. Explain what zero matching
                rows means and why a failed version check requires a fresh business decision.
                State assumptions about target identity, update semantics and the isolation level;
                do not generalise one product's predicate recheck behaviour to all engines.
            - title: Let uniqueness arbitrate competing inserts
              brief: >-
                Show why checking absence and then inserting is insufficient, while an appropriate
                unique constraint arbitrates concurrent claims. Follow the winner, waiting or
                rejected contender, and application interpretation of the result. Link constraint
                design and SQL conflict syntax to their owners; retain the concurrency contract,
                including errors that are domain rejection rather than automatically retryable
                infrastructure failures.
        - title: Understand what a read can see and what a lock protects
          brief: >-
            Build a minimal mechanism model only after the reader has a concrete protocol. Contrast
            a snapshot used to select visible versions with locks or conflict checks used to coordinate
            changes. Explain that multiversion concurrency does not remove writer conflicts or
            guarantee serialisability.
          heading:
            - title: A snapshot is a view, not a reservation
              brief: >-
                Distinguish a statement snapshot, a transaction snapshot and reading one's own
                writes. Use a changing total and its detail rows to expose fractured observations
                across statements. Explain how an ordinary read, a locking read and a write can
                follow different visibility rules in one system. Keep physical version storage
                and reclamation mechanics in execution.
            - title: Rows, ranges and the row that is not there
              brief: >-
                Explain shared and exclusive conflicts, row locking, predicate or range protection
                and the difference between blocking prevention and dependency tracking that may
                abort. Show that locking returned rows cannot generally protect an empty result
                or future insertion. Introduce a stable guard row as an explicit coordination
                point; develop its full protocol in the child.
        - title: Choose isolation by the outcomes it must exclude
          brief: >-
            Replace a memorised ladder of isolation names with a small set of histories. Connect
            dirty reads, changing rereads, phantoms, lost updates and write skew to failed decisions;
            show that a stable snapshot can still permit incompatible decisions. Define serialisability
            by equivalence to a serial order of committed transactions, not by absence of overlap
            or a universal real-time guarantee.
          heading:
            - title: Stable reads can still produce an impossible decision
              brief: >-
                Use two depots with one available unit each and a rule requiring at least one
                unreserved unit across both. Each transaction reads a total of two, decides that
                reserving one unit is allowed, and changes its own depot row. Either alone leaves
                one; both committing from the same snapshot leave zero. In either serial order
                the second decision must reject. Use this history to distinguish a changed result
                set from write skew and explain read/write dependencies; avoid a separate anomaly
                encyclopaedia.
            - title: Check the engine contract behind the name
              brief: >-
                Use a compact decision table of versioned contracts, with PostgreSQL 18 as the
                running reference: READ COMMITTED and snapshot-based REPEATABLE READ versus SERIALIZABLE;
                MySQL InnoDB consistent reads, locking reads and range protection; and SQLite
                rollback-journal versus WAL reader/writer behaviour and write transaction start
                modes. Make settings, storage engine and journal mode explicit. Show only contrasting
                histories that change a protection or restart decision; keep full commands and
                alternative native runs in supporting evidence, verified against current primary
                documentation. Do not replay every example in each engine or build parallel product
                tutorials; shared isolation labels do not establish shared behaviour.
        - title: Protect a rule that spans several rows
          brief: >-
            Give the parent a complete worked repair of the two-depot reserve rule using serialisable
            execution and whole-transaction restart with fresh reads and a new reserve decision,
            with its assumptions stated. Compare that choice briefly with a shared guard row and
            materialising an enforceable constraint. Explain that every transaction able to violate
            the rule must participate, including administrative and background writes. A small
            decision table should let the reader recognise when the deeper protocol work is needed.
          nested_article:
            topic: Transaction protocols for multi-row invariants
            title: Protecting rules across several rows
            brief: >-
              Teach how to design and prove transaction protocols for rules involving a changing
              set of rows. Require the parent's isolation model and complete fixed-set serialisable
              repair as prerequisites; recap or link that baseline rather than reteaching it.
              Reuse the two-depot reserve invariant, extending it to concurrent insertion and
              deletion of depots. Develop stable guard-row locking and a remodelled constraint
              or conditional aggregate counter, and revisit serialisable reasoning where the changing
              set alters the proof. Include missing rows, concurrent insertion and deletion, lock
              order, snapshot timing, every participating write path, and repair after abort.
              Explain why locking only the matching rows or using an advisory lock without universal
              participation is insufficient. Compare safety, concurrency and maintenance costs,
              and supply deterministic two-session counterexamples and passing histories for the
              new protocols, using PostgreSQL as reference and named engine contrasts only where
              their contracts change the proof. Own these complete database protocols; use the
              parent's isolation model rather than reteaching it, and leave request idempotency
              and external side effects to application engineering.
        - title: Make blocking and aborts part of the design
          brief: >-
            Trace a deadlock from two transactions acquiring the same resources in opposite order;
            distinguish a wait, a deadlock victim, a timeout, a constraint rejection and a serialization
            failure. Explain that preventing invalid commits can legitimately require rejecting
            work, and progress under contention needs a bounded policy as well as a safety argument.
          heading:
            - title: Restart the decision, not the last statement
              brief: >-
                Show that a known deadlock or serialization abort requires the transaction to
                be unwound and its reads and decisions repeated. Identify engine-specific error
                scope, including statement rollback versus transaction abort and invalid transaction
                states; do not infer safety from a generic error class. State retryable outcomes
                and bounded retry/backoff assumptions at the protocol boundary. Hand ambiguous
                commit outcomes, driver behaviour and effects outside the database to application
                engineering.
            - title: Shorten the critical section without weakening the rule
              brief: >-
                Explain consistent acquisition order, unnecessary lock footprint, hot coordination
                rows, long-lived snapshots and transactions waiting on user input. Show why reducing
                work inside a transaction can improve progress but splitting an invariant across
                commits changes correctness. Distinguish safe waiting from queue-oriented NOWAIT
                or SKIP LOCKED choices that may intentionally return an incomplete set. Link wait
                diagnosis and capacity tuning to execution rather than growing an operational
                runbook here.
        - title: Test the protocol against a hostile schedule
          brief: >-
            Turn the earlier histories into one reproducible PostgreSQL 18 worksheet, rather than
            retelling their explanations. Demonstrate its barrier-and-assertion method on the
            original reservation: fixed initial rows, exact statements, explicit barriers, captured
            results, commit or abort status and final invariant assertions. Include unsafe and
            repaired variants and rollback after a forced mid-transaction failure. Reuse the two-depot
            fixture as a short second scenario: reproduce write skew under REPEATABLE READ, then
            run the SERIALIZABLE repair, capture whichever transaction aborts, and restart it
            with fresh reads so its new business decision preserves the reserve. Make universal
            writer participation explicit. Link the already explained deadlock and retry cases
            as additional worksheet scenarios rather than repeating their narrative in the main
            text. Check safety and completion under bounded load, and record version, isolation,
            relevant settings and expected alternatives. Distinguish illustrative schedules from
            native observations and explain why random success is not a correctness argument.
            End with a compact protocol checklist: rule, all writers, read assumptions, protection,
            abort handling and tests. Link application integration testing without taking over
            its driver and deployment concerns.
  - title: Understand the work behind a statement
    brief: >-
      Use one compact picture to follow the reservation transaction's update through its chosen
      access path, rows or pages in memory, and a recoverable commit. Give one scan-versus-index
      contrast and contrast the single-order lookup with a report over many orders; do not turn
      either into an index or analytics lesson. Establish that a declarative answer does not imply
      a fixed amount of work, and that a commit acknowledgement differs from writing a data page.
      End with the diagnostic entrance: measure what consumed time before changing the schema.
      Defer row-version storage, plan vocabulary, crash replay and the full diagnosis method to
      the child.
    nested_article:
      topic: Relational execution, storage and performance
      title: Understanding and improving database work
      brief: >-
        Build a practical model of the work a relational engine performs, then use it to improve
        transactional, analytical and mixed workloads. Follow an order lookup, reservation update
        and sales report through storage, access paths, planning, execution and commit. Give newcomers
        a first useful diagnosis before directing them to deeper mechanisms and investigation.
        Distinguish doing less work from waiting less and adding resources; require evidence that
        an improvement survives representative concurrency and preserves correctness. Own engine
        mechanisms and performance investigation. Refer transaction correctness, application protocols,
        service objectives and recovery procedures, and multi-server coordination to their neighbouring
        articles.
      heading:
        - title: Start with the work the user is waiting for
          brief: >-
            Introduce three concrete symptoms in one small orders system: a slow lookup, a reservation
            that waits despite a cheap query plan, and a report that disrupts checkout. Make report
            interference the first worked investigation; use the other symptoms as brief contrasts
            and later return points. Introduce only enough measurement vocabulary to read that
            case, and offer task entrances to investigation, access paths and execution.
        - title: Follow a statement from arrival to completion
          brief: >-
            Trace admission and queueing, parsing and planning, execution, waits, result transfer
            and commit acknowledgement on a compact timeline. Separate client elapsed time, server
            execution time and resource work, including concurrent activity and work deferred
            until later. Locate the connection pool and network at the application boundary and
            storage flushes within the engine; do not imply every engine follows one identical
            pipeline. Use the reservation and report to show why CPU, reads, log writes, memory
            and lock waits need different explanations. Provide the minimum map needed for the
            following sections.
        - title: Diagnose a workload before choosing a fix
          brief: >-
            Complete the report-interference case before the mechanism tour. Compare checkout
            with and without simultaneous reports using a stated observation window, offered load,
            throughput, latency distribution and failures. Contrast lock blocking with resource
            saturation as hypotheses; use blocking evidence and CPU demand to discriminate them.
            In a controlled trial, limit concurrent reports and compare the same offered workload,
            accounting for queued reports, completion time and checkout outcomes rather than hiding
            displaced work. Show the unchanged checkout plan becoming slower under the competing
            load. Keep one before-and-after evidence table here, including correctness, resource
            demand and deferred maintenance effects. Record data scale, workload assumptions,
            repetition and a reassessment trigger. End with the tuning stopping rule: if required
            work or contention exceeds the available budget, change admission, application boundaries,
            resources or architecture through the responsible neighbouring article. Introduce
            slow work, blocking and saturation as contrasting evidence patterns, not three full
            first cases.
          nested_article:
            topic: Relational workload diagnosis, measurement and benchmarking
            title: Investigating database performance
            brief: >-
              Teach a repeatable investigation from a defined symptom and workload baseline to
              ranked hypotheses, discriminating measurements, controlled interventions and verification.
              Combine statement-level totals and latency distributions, query plans, wait and
              blocking evidence, CPU, storage latency and throughput, caches, log pressure, memory
              and temporary work. Consume the storage, index and execution articles' evidence
              with short local reminders; do not reteach cache mechanisms, operators or the statistics
              model. Attribute expensive frequent queries as well as outliers; diagnose lock waits,
              saturation and regressions caused by data, parameters, plans, versions, configuration
              or workload mix. Use representative data, skew, concurrency and transaction boundaries;
              distinguish cold and warm states, offered load and completed throughput, instrument
              overhead and repeated-run variation, and preserve failures and tail latency. Teach
              safe use of execution-measuring plan tools, which may execute changes. Evaluate
              query and schema changes, memory and concurrency controls, bulk-load strategies
              and workload isolation against throughput, latency, capacity and cost. Establish
              resource headroom and marginal cost from measurements, and recognise when admission,
              application design, hardware or a different architecture must change. Operations
              owns service targets, ongoing monitoring and incidents; application engineering
              owns pools, backpressure and delivery protocols.
        - title: Rows, memory and durable writes
          brief: >-
            Follow one read and one update through a deliberately bounded storage model: logical
            rows and versions, physical pages, buffer and operating-system caches, dirty state,
            log records and eventual data writes. Explain why a cache hit, a committed change
            and a cleaned-up old version are different events. Separate an illustrative model
            from named-engine measurements. Summarise how layout, version retention, logging and
            background maintenance turn logical operations into physical work before introducing
            the deeper storage article.
          nested_article:
            topic: Relational physical storage, versions and recovery
            title: How relational engines store and change data
            brief: >-
              Teach the path from logical rows to physical work: pages and records, row and column
              layouts, compression and large values, heap and clustered storage organisation,
              buffer management and operating-system caches, updates and retained versions, free-space
              reuse, logging, checkpoints and crash recovery. Compare consequential named implementations,
              including redo and undo responsibilities, without treating one engine's page layout
              or visibility rules as universal. Explain commit durability mechanisms, write amplification,
              old-version cleanup, reclamation and the maintenance debt caused by long transactions
              or sustained writes. Show how to measure these effects and reason about safe bulk-loading
              and maintenance choices. Own physical mechanisms and their performance consequences.
              Own the physical layout, compression, cache, version and log/cleanup explanations;
              indexes owns key/locator design and execution applies those physical properties
              to operator work. Keep bulk loading here to physical/log/cleanup effects; investigation
              owns experiment design. Transaction articles own isolation correctness, and operations
              owns backup, restore and maintenance runbooks.
        - title: Find fewer rows without making every write too expensive
          brief: >-
            Compare a scan with an ordered access path for the order lookup, accounting for index
            traversal, matching entries, table fetches and visibility checks where applicable.
            Show that selectivity, locality, covering data, ordering and table size change the
            answer. Carry the same index through inserts and updates so its storage, logging and
            maintenance costs remain visible. End with a concrete workload trade-off rather than
            an instruction to index every filter.
          nested_article:
            topic: Relational indexes and access methods
            title: Choosing and maintaining indexes
            brief: >-
              Develop index judgement from ordered-tree lookup, range scans and table fetches
              to composite key order, equality and range predicates, ordering, covering and index-only
              access, partial and expression indexes, uniqueness, and the key and row-locator
              consequences of clustered versus secondary organisation. Explain when scans or index
              combinations win and when predicates, conversions, collations or parameter behaviour
              prevent the expected access path. Introduce alternative access methods only through
              workloads that justify them. Refer coarse data skipping to execution, giving only
              the local access-path consequence. Measure read benefits against update, storage,
              logging and cache costs. Teach evidence-led index building, monitoring, consolidation,
              rebuilding and removal, including concurrent activity and engine-specific locking
              or resource effects. Own key order, row locators, access eligibility and index-set
              maintenance costs; reference storage for physical layout and caches and execution
              for estimates and statistics. Refer operational change procedures and integrity
              design to their owners.
        - title: Turn a query into an executable flow of data
          brief: >-
            Read a small plan as rows flowing through operators, with separate estimates and observations.
            Use the sales report to introduce cardinality, row width, join choice, aggregation
            and sorting; show how an early underestimate can multiply later work. Explain that
            a planner's cost is a comparison model, not elapsed time, and that plan-node times
            and parallel work need careful interpretation. Preview memory and temporary work through
            their effect on this report; leave the algorithm catalogue, execution styles and parallel
            detail to the child.
          nested_article:
            topic: Relational query planning and execution
            title: Reading plans and understanding execution
            brief: >-
              Teach how planners choose access paths, join order and join algorithms, aggregation
              and sorting from cardinality and cost estimates. Develop plan reading using estimates,
              actual rows and loops, startup and total work, filters, fetched pages, memory, spills
              and parallel workers without adding overlapping node timings as independent elapsed
              time. Explain statistics, skew, correlated values, stale estimates, parameter-sensitive
              plans and plan caching. Connect nested-loop, hash and merge joins, hash and ordered
              aggregation, external sorting, materialisation and pipelining to resource use, including
              memory multiplied across operators, workers and concurrent queries. Own estimates/statistics,
              operator memory and spills, batching/vectorisation, coarse data skipping in scans
              and parallel coordination. Apply storage's row/column layouts and compression with
              brief reminders rather than repeating their physical explanations. Local partitioning
              owns key/granularity and lifecycle decisions; this article explains how pruning
              appears in execution. Make the analytical report the principal worked thread and
              a transactional lookup a brief contrast, preserving SQL semantics. Investigation
              consumes plan evidence for workload-wide prioritisation and benchmarking.
        - title: Organise growing data around the work it must support
          brief: >-
            Contrast a faster access path with changing physical organisation or removing expired
            data. Use date-based order retention to explain local partitioning, pruning and bounded
            maintenance, then show a lookup that touches every partition. Apply the earlier evidence
            method to the lifecycle decision; reference storage and indexes for growth and maintenance
            work rather than repeating those mechanisms or the capacity comparison. Keep partitioning
            within one service distinct from routing data across independently failing servers.
          nested_article:
            topic: Local relational table partitioning
            title: Partitioning tables for access and maintenance
            brief: >-
              Teach when table partitioning earns its complexity through pruning, retention, loading
              or bounded maintenance rather than assuming it makes queries faster. Choose partition
              keys and granularity against concrete predicates, data distribution, growth and
              lifecycle needs. Explain partition-aware plans, indexes and statistics, local and
              global uniqueness constraints, joins, partition counts, hot partitions and queries
              that cannot prune. Follow creating, attaching, detaching and retiring data through
              validation, locks, resource use and rollback constraints in named engines, and compare
              a partitioned design with an ordinary indexed table using representative measurements.
              Keep correctness and application migration protocols with their owners, and keep
              sharding and cross-server movement in the distribution branch.
  - title: Build the application around a database contract
    brief: >-
      Lose the reply to a successful order commit and follow what the caller can and cannot infer.
      Use that one incident to distinguish transaction success from request success and introduce
      request identity and safe replay. Point onward to external work such as fulfilment, managing
      concurrent connections and compatible schema change as application responsibilities, without
      introducing their protocols in the root. The child owns parameter safety, client lifetimes
      and implementation detail.
    nested_article:
      topic: Relational application engineering
      title: Building applications with a relational database
      brief: >-
        Teach how application boundaries turn database guarantees into reliable product behaviour.
        Follow an order reservation from a client request through a driver, a bounded transaction
        and a committed result to confirmation delivery. Give a compact working contract for resource
        use, result interpretation, retries, external effects and change delivery, then provide
        focused routes to working depth. Include database-resident behaviour, real-engine tests
        and bulk data movement. Own client and delivery protocols; use SQL and transaction guarantees
        supplied by neighbouring articles without reteaching their semantics or mechanisms.
      heading:
        - title: Follow one request beyond the commit
          brief: >-
            Trace an order reservation with an inventory change, durable request identity and
            confirmation work. Separate the caller's observation, the database result and the
            external effect. Establish what a successful API response promises and what remains
            pending; show why a missing response alone cannot establish whether a command committed.
            Use the same example throughout, with links to SQL and transaction design when their
            guarantees become prerequisites.
        - title: Make each database call bounded and explicit
          brief: >-
            Walk through acquiring a connection, binding values, consuming results, completing
            a transaction and returning a connection with a known session context for the next
            borrower. Introduce safe parameter binding, exact value mapping, query count and resource
            budgets, and the difference between pool waiting and database execution. Give a small
            caller-side contract before the deeper treatment of drivers and overload.
          nested_article:
            topic: Relational client resource and query contracts
            title: Making bounded database calls
            brief: >-
              Teach drivers, parameterised SQL and application value mapping through a real request
              path. Cover values versus SQL identifiers, dynamic query construction, nulls, exact
              numbers, dates and time zones, generated identity, result streaming and cursor lifetimes.
              Make transaction ownership explicit across helpers and asynchronous work. Own session
              initialisation and cleanup after successful use as well as failure, including request
              or tenant context. Compare application connection pooling with external session
              and transaction pooling; check prepared statements, settings, temporary objects
              and session locks against the selected driver and pooler configuration. Develop
              pool sizing and admission control from concurrency and connection budgets, including
              deployment multiplication, pool acquisition limits, backpressure and overload rejection.
              Distinguish connection, pool, statement and request timeouts; follow cancellation
              races, uncertain completion, failed transactions and connection reset or discard
              before reuse according to the chosen driver and engine. Inspect ORM or generated
              SQL, bound query count and result size, expose N+1 and hidden flush or lazy-loading
              behaviour, and measure caller latency, waiting and executed work. Test these contracts
              with a real engine, including connection reuse that cannot leak one request's context
              into the next borrower. Own client resource use; link to SQL semantics, concurrency
              design and engine performance diagnosis rather than reproducing them.
        - title: Decide what a caller may repeat
          brief: >-
            Classify a rejected request, an explicit transaction abort and an uncertain outcome
            using a short failure timeline. Establish that retry policy follows the whole command's
            effects and a stable business identity. Give the caller a way to look up a pending
            or completed result instead of treating every timeout as a failed operation.
          nested_article:
            topic: Relational application retries and idempotency
            title: Retrying commands without repeating their effects
            brief: >-
              Build an application command protocol for transient failures, explicit aborts and
              lost commit responses. Coordinate bounded retries, deadlines, backoff and jitter
              without multiplying retries across layers. Choose retry boundaries using the transaction
              article's correctness rules; account for application state and effects outside the
              transaction. Develop durable idempotency records with request fingerprints, concurrent
              attempts, result recording, expiry and retention, and a status or reconciliation
              path for ambiguous outcomes. Distinguish transport request identity from the business
              invariant that forbids a duplicate operation. Explain the limits of idempotency
              when an external system has no usable deduplication or lookup contract. Test duplicate,
              reordered and interrupted attempts with real engine commits and controlled client
              failures; distinguish injected observation loss from an observed network failure.
              Stop when the reader can specify a safe replay policy and recovery path for each
              command outcome.
        - title: Carry committed intent across system boundaries
          brief: >-
            Continue the reservation into confirmation delivery and an order-status read model.
            Compare a direct call, durable work recorded with the business change and a change
            stream. Identify the crash between two independent effects and show how explicit pending
            state, repeated delivery and reconciliation make that boundary manageable. Keep cache
            and read-model promises visible to callers.
          nested_article:
            topic: Relational coordination with external systems
            title: Delivering work beyond the database
            brief: >-
              Teach durable work records, transactional outbox and consumer inbox or deduplication
              protocols through external notification and read-model updates. Follow claim, delivery,
              acknowledgement, duplicate handling, ordering, retry, poison work, backlog and retention
              through crash histories. Separate local atomic recording from delivery guarantees,
              and explain what a consumer must make atomic with its own durable effects. Compare
              polling with change capture as a way to transport committed changes, including initial
              snapshots, resume positions, schema evolution, retention gaps and rebuild or reconciliation
              obligations without teaching replication internals. Set cache and read-model contracts
              for staleness, invalidation or versioned refresh, read-after-write expectations
              and recovery from missed work. Handle long-running business workflows with explicit
              state, compensating actions and human reconciliation where a single transaction
              cannot cover the effects; avoid a separate general workflow or messaging survey.
              Test relay and consumer crash points and state the exact limits of any exactly-once
              claim. Own integration protocols; link to relational distribution for routing and
              replicated-read guarantees.
        - title: Change code, schema and existing data together
          brief: >-
            Lay old and new application versions beside old and new schema forms on a deployment
            timeline. Show a compatible expansion, resumable data transition, cutover and later
            removal. Distinguish rolling code back from recovering transformed or deleted data,
            and make the compatibility evidence the release condition.
          nested_article:
            topic: Compatible relational application delivery
            title: Evolving schemas without breaking running applications
            brief: >-
              Design a staged schema and data migration while multiple application and worker
              versions remain live. Cover compatibility matrices, expand and contract sequencing,
              feature or traffic gates, long-lived jobs and prepared statements, constraints and
              index rollout, DDL transaction and locking differences, and the privileges of a
              separate migration runner. Develop restartable bounded backfills under concurrent
              writes, including progress records, ownership of new writes, validation, convergence
              and cutover. Examine dual-write and dual-read transitions explicitly instead of
              assuming they stay synchronised. Test old and new code against intermediate schemas,
              representative data volumes and interrupted steps; set observable stop conditions,
              release and rollback gates, and a recovery plan for irreversible data changes. Coordinate
              database-resident code and change-stream consumers with the same version contract.
              Own application delivery; link to modelling for schema meaning and operations or
              execution for service procedures and engine-specific lock and resource investigation.
        - title: Put behaviour where its contract can be maintained
          brief: >-
            Compare an application function, constraint, view, routine and trigger for a small
            business operation using transaction scope, visibility, invocation, privileges and
            all writer paths. Teach the application consequences of hidden trigger effects, routine
            versioning and deployment order, and the need to inspect generated SQL and test the
            complete write path. Use SQL's observable semantics and modelling's integrity choices
            as prerequisites. Keep this placement decision here; give testing and migration obligations
            to the same owner as the behaviour.
        - title: Move many records with a recoverable protocol
          brief: >-
            Distinguish an online command, a schema backfill and an import from another authority.
            Sketch staging, validation, acceptance and source-to-target reconciliation for an
            external order feed. Explain what evidence makes a partially completed transfer safe
            to resume or reject before offering the detailed bulk-movement path.
          nested_article:
            topic: Relational ingestion and bulk data movement
            title: Importing and moving data reliably
            brief: >-
              Build a bulk import or export protocol with source identity, a declared snapshot
              or change boundary, staging, type and encoding conversion, validation, quarantine
              and explicit publication into the target. Choose transaction and batch boundaries
              from failure recovery, target invariants, throughput and concurrent readers or writers.
              Cover native bulk facilities and driver batching through their operational contracts,
              without reteaching SQL syntax or engine internals. Make chunks restartable using
              durable checkpoints, stable record identity and deduplication; handle corrections,
              deletions and late records under a declared source-of-truth policy. Reconcile source
              and target using counts, keyed checks and business aggregates while accounting for
              concurrent source changes and transformed data. Establish acceptance, cutover and
              rollback criteria and test interruption, invalid records and replay. Relate change
              capture to continued synchronisation when needed; link to external coordination
              for delivery and to execution or operations for bulk-load resource and maintenance
              effects. Own crossing the source-target boundary; compatible schema backfills remain
              with application delivery.
        - title: Prove the application contract before release
          brief: >-
            Assemble an executable acceptance matrix for the reservation: normal result, explicit
            abort, lost response, duplicate request, pool exhaustion, cancelled work, relay restart,
            stale read model and mixed-version deployment. Use a real engine and the actual driver,
            migration runner and SQL or ORM layer; reserve mocks for dependencies they can faithfully
            represent. Separate deterministic fault injection, concurrency schedules and observed
            executions. Check durable final state and externally visible promises as well as responses,
            with production-relevant engine settings, privileges and diagnostic evidence. Point
            into the focused articles for their tests instead of creating a second testing syllabus.
            End with a request, delivery and release checklist whose entries correspond to a demonstrated
            contract and an accountable owner.
  - title: Keep the service trustworthy through change and failure
    brief: >-
      Use one mistaken deletion to distinguish crash recovery, replica failover and restoring
      an earlier state. Give the service an owner, an acceptable data-loss window and a recovery-time
      target, then show why a usable restore must have been tested. State that access control
      and health evidence are part of operating the service, while leaving their control lists
      and procedures to the child. Stop once the reader can identify which recovery mechanism
      the incident needs.
    nested_article:
      topic: Relational service operations, security and recovery
      title: Operating and recovering a relational service
      brief: >-
        Turn workload, trust and recovery requirements into a service that can be established,
        observed, changed and recovered deliberately. Follow the same order-reservation service
        through provisioning, a busy trading period, routine maintenance and an incident. Update
        one compact service record throughout: illustrative objective values and accepted reservation
        markers lead to tested settings, before/after observations and a failed acceptance result
        that forces a policy revision. Label illustrative inputs, modelled outcomes and observed
        execution distinctly. Teach operational decisions and executable runbooks, using a pinned
        PostgreSQL release for concrete examples and identifying managed-service substitutions.
        Engine diagnosis belongs to execution and replication, fencing and routing guarantees
        belong to distribution; use those mechanisms as preconditions rather than teaching them
        again. A reader should finish with an owned service specification, actionable alerts,
        a rehearsed change procedure and evidence that a chosen recovery path meets its objectives.
      heading:
        - title: Decide what this service must survive
          brief: >-
            Begin with the reservation service's peak workload, latency and availability objectives,
            data sensitivity and named failure domains. Select explicit illustrative values for
            peak demand, a latency objective and recovery objectives; identify accepted reservation
            markers to check after recovery. These are requirements to test, never observations
            or product promises. Define recovery point and recovery time objectives in terms of
            lost accepted work and time until usable service, including detection, decision, provisioning,
            restoration, validation and traffic return. Separate tolerable data loss from correctness
            failures. Assign authority, on-call ownership and escalation; show how a requirement
            becomes a measurable test rather than a product label. Define the common procedure
            record once: verified target identity, authority, preconditions and dependencies,
            expected effect, recorded evidence, gates, stop conditions, recovery route and acceptance.
            Reuse it for subsequent changes, containment and recovery rather than repeating a
            general checklist.
          heading:
            - title: Choose a recovery path for the actual failure
              brief: >-
                Use one decision table for process crash, server loss, mistaken deletion, suspected
                corruption, resource exhaustion and loss of a region or account. Distinguish crash
                recovery, replica failover, backup restoration and disaster recovery by dependencies
                and surviving state. A replica can reproduce an unwanted change; disaster recovery
                includes credentials, keys, configuration, network and application dependencies.
                Send mechanism questions about failover, fencing and routing to distribution;
                use its observed readiness conditions as live gates before a recovery action.
        - title: Establish a service you can reproduce
          brief: >-
            Walk from an empty host or managed-service account to an isolated working instance:
            supported release, installation or service creation, storage and file ownership, network
            reachability, administrative access, configuration inventory, logging and a smoke
            transaction that writes the first accepted reservation marker. Use one pinned installation
            path plus a compact managed- service substitution table. Update the same service record
            with tested reachability, actual settings and provider restrictions. Keep a small
            responsibility table for host patching, database patching, access, backup policy,
            restore validation and failure-domain independence; a managed service changes the
            executor but still requires an accountable owner and tested guarantees.
          heading:
            - title: Bound resource use before accepting traffic
              brief: >-
                Set an initial envelope for connections, concurrent work, memory, CPU, data and
                temporary space, log growth and storage throughput. Use a numerical concurrency
                example to show why a per-operation memory limit is not a server-wide budget.
                Keep administrative headroom, set justified statement and lock limits, and record
                which settings require a restart, reload, new session or provider operation. Validate
                the envelope against the intended workload and recovery storage needs; link to
                application pooling and backpressure and execution's capacity investigation.
        - title: Establish and test the trust boundary
          brief: >-
            Map application, migration, analyst, backup, automation and emergency identities to
            required actions. Introduce authentication, authorisation, transport encryption, backup
            and storage protection, key custody and audit evidence as separate controls. Require
            negative tests under the actual application identity and a tested emergency-access
            route before go-live. Explain why tenant protection includes privileged code and operational
            exports as well as normal queries.
          nested_article:
            topic: Relational service access control and security operations
            title: Securing relational access
            brief: >-
              Build and test a relational trust boundary from named identities and a threat model.
              Teach roles, ownership, role membership, grants and default privileges; separate
              application, migration, backup, analyst and emergency access. Cover authentication,
              network access, verified TLS, credential and certificate rotation, secrets and encryption-key
              custody, storage and backup encryption, tenant isolation choices and row-policy
              bypasses, audit scope, sensitive log data, retention and evidence protection. Treat
              routines, triggers, views and extensions as potential privilege boundaries: test
              invoker versus definer behaviour, executable privileges, object resolution and untrusted
              inputs using the chosen engine's actual rules. Include a reproducible least-privilege
              and cross-tenant denial test plus an access revocation and rotation exercise with
              failure and lockout cases. Use the same named actors and one denied cross-tenant
              attempt through ordinary queries, resident code and an operational export to connect
              the controls, rather than multiplying object-by-object tutorials. Compare implementation
              differences where the safe design changes; SQL owns routine semantics, application
              engineering owns placement and deployment, and this article owns security policy
              and verification.
        - title: Observe the service and act before it runs out of room
          brief: >-
            Derive a compact dashboard and actionable alerts from the service contract: request
            latency, errors and throughput alongside queueing, connections, resource saturation,
            data and log growth, maintenance debt, backup freshness, archive continuity and restore-test
            age. Observe whether the selected recovery path is ready now, consuming distribution's
            verified signals for standby availability, durable receive or replay position as appropriate,
            topology and synchronous state, freshness and current data-loss exposure. Do not infer
            catch-up or recovery time from a lag duration. Work one alert where customer traffic
            succeeds but protection has degraded: assign an owner and choose repair, explicit
            temporary risk acceptance or a work restriction required by the service contract.
            Record measurement window and workload mix; distinguish customer symptoms from explanatory
            signals. Give each alert a threshold rationale, owner, urgency and first safe action.
            Use a measured or explicitly modelled busy period to update the same service record:
            compare demand and observations before and after a bounded response. Connect growth
            rate and lead time to a capacity decision, accounting for maintenance, restore and
            temporary-space headroom and managed-service limits.
          heading:
            - title: Rehearse a connection and storage exhaustion response
              brief: >-
                Make connection exhaustion the full containment walkthrough using the common procedure
                record: identify the demand source, preserve operator access and reduce or reject
                work through the application boundary before changing limits; compare the resulting
                service observations. Treat storage pressure as a short variation with its different
                trigger, safe action and stop condition: establish which data, temporary or retained-log
                category is growing, preserve recoverability and choose a documented bounded remedy.
                Never present deletion of database files as cleanup. Link execution for diagnosis
                and distribution for replication retention causes. State when to escalate, stop
                or invoke a recovery procedure.
        - title: Prove recovery before relying on it
          brief: >-
            Turn the failure table into a recovery policy: recovery-point coverage, backup form,
            independence, retention, protected credentials and keys, restore environment and measured
            drills. Distinguish a successful backup job, an integrity check, a completed restore
            and validated application behaviour. Show a deletion timeline where the selected recovery
            point saves an earlier state but discards later good writes unless they are reconciled
            separately. Move the destructive event or remove one recovery dependency and ask which
            accepted reservation markers remain recoverable within the chosen objective. Include
            one failed drill result that forces a revised policy or setting in the shared service
            record. Keep method comparison, commands and reconciliation execution in the child.
            Keep a concise acceptance record here.
          nested_article:
            topic: Relational backups, restoration and disaster-recovery exercises
            title: Proving relational recovery
            brief: >-
              Design a backup and retention policy against explicit data-loss and recovery-time
              objectives, then execute and validate recovery in an isolated environment. Compare
              logical exports, physical backups, coordinated snapshots and log archives by consistency,
              restore scope, compatibility, dependencies and supported recovery targets. Teach
              base-backup and log continuity, retention dependencies, protected independent copies,
              restore permissions, encryption keys and configuration. Make mistaken deletion the
              full worked restoration using the parent's common procedure record: target selection,
              isolated point-in-time restore, integrity and business-invariant checks, reconciliation
              of later valid work, controlled traffic return and renewed backup protection. Treat
              corruption and total failure-domain loss as targeted restoration branches with different
              surviving dependencies and validation needs; the parent owns incident command, containment
              and preservation of original evidence. Use short failure variations for inaccessible
              keys, missing logs, insufficient space, unavailable control-plane access and an
              unmet recovery-time objective, rather than repeating full incident narratives. Distinguish
              backup checksums from successful recovery; rehearse failover only against distribution's
              verified promotion, fencing and routing preconditions and live observations that
              the intended recovery path is currently ready. Record elapsed time, recovered markers,
              lost accepted work, evidence, stop conditions and ownership. Explain what the drill
              establishes and what remains untested; keep engine crash-recovery mechanics and
              replication protocols in their owning articles.
        - title: Change and maintain the service without guessing
          brief: >-
            First apply the common procedure record to a short configuration change, reading back
            its effective scope and before/after observations. Treat the version upgrade as the
            consequential variation: compatible versions and artefacts, prerequisite restore evidence,
            realistic workload window and spare resources, expected interruption and new acceptance
            gates. Show only what changes from the first procedure; distinguish reverting configuration
            from restoring data or migrating back after incompatible changes and newly accepted
            writes. Rehearse with realistic data volume, extensions, drivers and permissions and
            record the measured outage rather than promising a generic zero-downtime upgrade.
          heading:
            - title: Schedule upkeep from debt and risk
              brief: >-
                Cover patch and support policy, engine-specific vacuum or garbage collection,
                statistics, index upkeep and integrity checks at the level of operational triggers,
                work windows, resource budgets and validation. In the PostgreSQL example, distinguish
                protective transaction and multixact age maintenance from optional optimisation,
                observe progress and blockers, and escalate before protective limits stop writes.
                Do not imply ordinary vacuum and table rewrites have the same space or locking
                effects. Show how long-running work or unavailable storage can defeat maintenance
                and threaten availability. Execution explains the mechanisms and repair diagnosis;
                application engineering owns rolling schema changes and backfills. Decide who
                owns provider maintenance notices, certificate expiry and restoring protection
                after a change.
        - title: Run an incident from evidence to restored confidence
          brief: >-
            Reuse the common procedure record for the additional judgement required by suspected
            corruption: uncertain scope, incident command, justified write or access restrictions,
            preservation of logs and original media or snapshots before destructive repair, decisions
            and handover. Choose a verified recovery path and consume the recovery child's restoration
            and validation output rather than narrating restoration again. Distinguish containment
            from diagnosis and permanent repair; include required stakeholder escalation without
            inventing regulatory obligations. Close the same service record with recovered reservation
            markers, reconciled business state, observed service acceptance, renewed protection,
            the revision forced by the failed drill and an outstanding limitation. Avoid another
            general operations checklist.
  - title: Decide where data and decisions must live
    brief: >-
      Show an order read reaching a replica before its latest change, then give one concrete reason
      to split write ownership across servers. Distinguish copying data from dividing responsibility
      and identify the resulting application-visible questions about freshness, routing and coordination.
      Stop before topology taxonomies, quorum explanations or sharding design. The child teaches
      the distribution reasoning required for relational practice without depending on the parked
      shared programme.
    nested_article:
      topic: Replication and distribution in relational databases
      title: Relational data across servers
      brief: >-
        Teach how independently failing relational servers change the database contract. Begin
        with an order reservation whose writer fails after acknowledging a commit, and whose next
        read reaches another server. Use operation histories to distinguish replication, partitioning
        and distributed coordination, then compare a single writer with replicas, application-managed
        shards and an integrated distributed relational system against an explicit workload and
        failure budget. Explain enough log, quorum, placement and routing mechanics to choose
        a path and recognise a broken promise; the three deeper articles supply implementation
        and operational depth. Keep local transaction semantics with the transactions article
        and service-wide recovery procedures and backup policy with operations. Teach required
        distributed-systems reasoning here without depending on a separate programme.
      heading:
        - title: Follow one reservation across a failure
          brief: >-
            Start with a client write, an acknowledgement, a writer failure and a read through
            another endpoint. Annotate invocation, response, log receipt, durable storage and
            application separately; ask what the surviving server may return and whether the client
            can distinguish loss from an unknown outcome. Introduce replication as copies, partitioning
            as ownership of different data and coordination as agreement about decisions. Keep
            the example's claimed outcomes conditional on the stated protocol; a topology drawing
            alone proves none of them.
        - title: Write down the contract before choosing a topology
          brief: >-
            Turn the reservation workload into required invariants, read freshness, read-your-writes
            and monotonic-session needs, permitted acknowledged-write loss, recovery time, regional
            latency, throughput and outage behaviour. Distinguish transaction isolation from replica-read
            freshness and real-time ordering, and crash durability from survival of a stated failure
            domain. Show what a timeout or network partition prevents participants from knowing;
            a protocol must choose when to wait, reject, serve stale data or permit divergent
            writes. Treat client retries and external effects as an application-engineering hand-off.
        - title: Keep one writer and copy its history
          brief: >-
            Trace how a committed change reaches a replica through log transport and application,
            and place the client acknowledgement on that timeline. Separate received, persisted
            and replayed positions, asynchronous and synchronous acknowledgement contracts, and
            read-only replicas from additional writers. Explain why a healthy writer can coexist
            with stale replicas, why a replica is not a backup, and how read routing changes what
            a session observes. Introduce promotion as a change in authority that requires old-writer
            exclusion, then hand off detailed protocols to the child.
          nested_article:
            topic: Single-writer relational replication and failover
            title: Replication, replica reads and failover
            brief: >-
              Develop single-writer replication from commit logging through transport, persistence,
              replay, bootstrapping and catch-up. Compare physical and logical replication through
              their consequences for schema, replica contents, upgrades, identity, ordering and
              retention. Derive precisely what each acknowledgement mode and failure-domain placement
              promises about acknowledged-write survival and read visibility. Design replica routing
              for lag, causal/session position waits, fallback and overload; distinguish time-based
              lag estimates from replay progress and application freshness. Analyse promotion
              histories with client reconnection, divergent timelines, stale candidates, fencing
              and reintegration of the old writer; distinguish leader selection from safe exclusion
              and failover from backup restoration. Explain logical-feed duplicate delivery; keep
              multi-writer material to a short boundary warning about conflict handling and globally
              enforced constraints, linking to the coordinated and conflict-resolving comparison
              in distributed SQL. Use verified named relational implementations only where their
              actual contracts change the decision. End with failure-injection histories and evidence
              for loss, stale reads, recovery time and a sole writable authority, completing the
              parent's common acceptance worksheet for replica lag and promotion. Operations owns
              the complete service runbook and application engineering owns ambiguous outcomes
              and external effects.
        - title: Split ownership when one writer is the limit
          brief: >-
            Distinguish local table partitioning from distributing ownership across servers. Work
            through placing orders by account: a local account transaction becomes cheap while
            a global uniqueness rule, cross-account transfer and global report cross ownership
            boundaries. Compare range and hash placement, co-location, skew and hotspots, including
            secondary indexes and the routing directory. Show how a reshard changes ownership
            while clients are still reading and writing; scale-out requires a correct movement
            protocol as well as additional machines.
          nested_article:
            topic: Application-managed relational sharding
            title: Designing and moving relational shards
            brief: >-
              Teach when application-managed sharding is justified and how to choose shard keys
              from transactions, joins, growth, tenant boundaries and access patterns. Compare
              range, hash and directory routing, co-location and placement across failure domains.
              Develop hot-key, hot-tenant, uneven-growth and global-index cases; account for uniqueness,
              referential integrity, identifiers, fan-out reads, aggregates, pagination and unavailable
              shards. Explain the explicit options for cross-shard invariants: keep related work
              together, use a supported atomic protocol or redesign the business workflow with
              visible intermediate states. Develop an online split or move, including the initial
              move out of one writer, with a snapshot, concurrent-change capture, catch-up, ownership
              epochs, a cutover barrier, stale-router handling, reconciliation and rollback limits;
              show how to prevent lost or doubled effects and avoid uncontrolled dual writes.
              Include movement throttling, routing metadata availability and correctness checks
              under interruption. Complete the parent's common acceptance worksheet for stale
              routing and interrupted movement. Own shard ownership and movement; link to application
              delivery for rolling code/schema compatibility and to distributed coordination for
              the mechanics of an atomic cross-shard transaction.
        - title: Make distributed SQL's coordination visible
          brief: >-
            Explain that a SQL interface can hide placement and message exchange while applications
            still pay their latency and failure costs. Draw one statement's fan-out and one transaction's
            reads, replicated writes and commit decision. Distinguish consensus within a replica
            group, atomic commit across groups, isolation across transactions and a real-time
            consistency promise. Place quorum members, leaders or leaseholders, data and clients
            on the same latency budget; additional replicas do not divide the cost of a hot key
            or eliminate cross-region coordination.
          nested_article:
            topic: Integrated distributed relational systems
            title: Coordinating distributed SQL
            brief: >-
              Build the machinery needed to assess an integrated distributed relational system:
              replicated ranges or tablets, placement and rebalancing, routing, leaders or leases,
              quorum intersection, terms or epochs, log commitment and recovery after partitions.
              Explain the selected implementation's safe voting membership changes: replica catch-up,
              safety across old and new configurations, and the failure-domain availability retained
              during a transition; require an interrupted membership-change history. Distinguish
              quorum replication and consensus from atomic commit, then follow a cross-range transaction
              through participant preparation, durable decision, coordinator failure and recovery.
              Connect distributed snapshots, timestamps, clock assumptions and uncertainty handling
              to documented isolation and real-time ordering guarantees without implying one universal
              protocol. Trace distributed joins, aggregation, secondary-index maintenance, constraint
              checks and transaction retries through network work, contention and failure. Derive
              latency and availability consequences from concrete regional placements, including
              loss of a region, minority operation, stale-read options, hotspots and rebalancing
              load. Compare a small number of verified relational implementations at the mechanism
              and contract level; cover synchronously coordinated writes alongside asynchronous
              or conflict-resolving multi-writer alternatives and the invariants they can preserve.
              Complete the parent's common acceptance worksheet for quorum loss, interrupted membership
              changes and commit recovery. Require executable tests of the claimed guarantees
              and distinguish illustrative histories from observations of a real engine. Local
              isolation theory belongs to transactions; full operating runbooks belong to operations.
        - title: Compare choices and change architecture safely
          brief: >-
            Use the same reservation workload to compare a larger single writer with replicas,
            application-managed shards and integrated distributed SQL. Show a compact decision
            table covering transaction locality, read requirements, write contention, failure
            domains, regional latency, coordination ownership and operational cost; avoid selecting
            by a scalability or availability label. Give one short transition decision example:
            what constraints, identities and results must be equivalent at the target, which system
            may accept writes, what reconciliation evidence permits authority handover, and when
            rollback ceases to be a simple routing change. Keep these architecture decisions here;
            the sharding article owns the worked snapshot, change-capture and cutover history,
            including an initial move from one writer. Application engineering owns rolling compatibility,
            backfill/restart and client delivery mechanics.
        - title: Test the promise, including the uncomfortable interval
          brief: >-
            Finish with a reusable acceptance worksheet: invariant, promised failure set, concurrent
            requests and responses with uncertainty, permissible outcomes and evidence limits.
            Complete it once for the opening reservation and replica failure. Include checks of
            acknowledged-write survival, valid authority or a coordinated writer set for each
            ownership unit and epoch, observed read order, invariant preservation and convergence
            after healing. Give concise prompts that route replica lag and promotion to replication,
            stale routing and interrupted movement to sharding, and quorum loss and interrupted
            membership or commit recovery to distributed SQL. Each child completes the same worksheet
            for its concrete mechanism rather than repeating the general test method. Explain
            what server logs, commit positions and client histories can establish, and why healthy
            steady-state benchmarks, wall-clock timestamps alone and a few successful failures
            do not prove the general guarantee. Separate controlled local models from measured
            engine behaviour and give operations the tested conditions and thresholds needed for
            its recovery procedures.
  - title: Choose a system by testing its consequential differences
    brief: >-
      Work through a bounded shortlist between embedded, conventional server and distributed relational
      deployment shapes for the order application; contrast a reporting or mixed workload so the
      example does not silently define all relational use. Use a concise requirement-to-evidence
      matrix: data and query semantics; concurrency and durable acknowledgement; workload shape,
      scale and geography; recovery and operational ownership; specialist capabilities and ecosystem;
      and cost, portability and exit constraints. Distinguish documented promises, measured results
      and assumptions. Show a small validation checklist whose concurrency, performance, change
      and recovery tests point to their owning branches rather than repeating their mechanisms.
      Explain when a neighbouring database family or complementary read model fits the requirements
      better. The outcome is a defensible shortlist and a plan for disqualifying evidence, not
      a product catalogue or a requirement to master the whole corpus before making a reversible
      first choice. Keep this synthesis in the root; commission a product-specific deeper article
      only when a consequential mechanism cannot be taught adequately in the common branches.
