topic: Relational databases
title: Relational databases
brief: 'Introduce relational databases through an ordinary application that must keep related facts
  correct while people read and change them. Establish the model, the work a database performs and
  the decisions its users remain responsible for. Give an intelligent engineer new to the subject
  a useful first working model and a route to expert practice in choosing, designing, querying, integrating,
  diagnosing, operating and recovering a relational service. Keep detailed mechanisms in the contextual
  articles where they change a practical decision. Make the parent-first reading contract explicit:
  the current article supplies a usable answer before its contextual children deepen a question.
  Newcomers finish the working-route parent articles before selecting that depth; readers entering
  for a particular task see any precise prerequisite section at the contextual entrance.'
heading:
  - title: One order, several changes
    anchor: one-action-changes-several-facts
    brief: 'Follow a small order-taking application: customers place orders, orders contain items,
      stock is limited and payment can fail. Show the questions readers need to answer and the inconsistencies
      that separate file or application updates can leave behind. Introduce the database as the place
      that stores shared facts, answers questions and enforces specified rules; distinguish those
      guarantees from business rules nobody has expressed.'
  - title: Tables, keys and relationships
    anchor: tables-describe-facts-and-relationships
    brief: Give the example a few tables with named, typed columns and rows. Use keys and references
      to explain identity and relationships, then a join to show that storing related facts separately
      need not make them inaccessible together. Introduce constraints, missing values and the distinction
      between a logical schema and its physical storage without turning this orientation into a schema-design
      course.
    nested_article:
      topic: Relational data design
      title: Designing relational data
      brief: Teach an engineer to translate application facts, rules and access needs into a relational
        schema. Follow a booking application from ordinary requirements to tables, identities, relationships,
        value representations and enforceable rules, exposing the failures each decision prevents.
        Establish a practical account of normalisation and controlled redundancy, then account for
        history and deletion. Test the design with representative reads, changes and lifecycle scenarios.
        Develop specialised modelling only where it changes these relational decisions; leave query
        fluency, transaction protocols and live migration procedures to their neighbouring articles.
      heading:
        - title: Begin with facts and rules
          brief: Start with customers booking places on scheduled sessions. Separate a customer's
            identity, a session's identity and the fact of a booking from the screens that display
            them. Write down example facts, vocabulary, ownership, cardinalities, required reads
            and changes, and lifecycle rules. Expose ambiguous requirements such as whether one customer
            may book twice or a cancelled booking must remain visible before choosing tables.
        - title: Give every row a clear meaning
          brief: State what one row represents and what makes two rows the same fact. Turn one-to-many
            and many-to-many relationships into keys and relationship tables; put relationship attributes,
            such as booking status, on the relationship. Distinguish a required reference from a
            promise that a parent has at least one child. Work through duplicate bookings, repeat
            sessions and customer merges to show why row meaning and identity precede a convenient
            identifier.
          heading:
            - title: Choose identity and scope deliberately
              brief: Compare natural, surrogate and composite keys using mutable customer identifiers
                and bookings scoped to a session. Explain candidate keys, primary keys and the uniqueness
                rules that remain necessary after adding an artificial identifier. Make tenant scope
                explicit in both uniqueness and references. Treat identifier generation, exposure
                and storage cost as design considerations without turning identifier formats into
                a catalogue.
            - title: Represent optional relationships
              brief: 'Use the booking example to distinguish a relationship that may be absent from
                an entity that exists independently: a customer can exist without a booking, while
                each booking must identify its customer and session. Translate those requirements
                into optional or required references and state what an absent relationship means.'
        - title: A value needs a meaning as well as a type
          brief: Show how a fee, a session start and a customer's contact details need explicit units,
            precision, comparison rules and missing-value meanings. Establish that choosing a database
            type is part of the application's contract. Use unknown, inapplicable and deliberately
            absent values to introduce nulls and designs that preserve distinctions the application
            needs.
          nested_article:
            topic: Relational value representation
            title: Choosing types and representing missing values
            brief: Choose representations that preserve a value's meaning, allowed states and useful
              operations across the database and application boundary. Develop a booking schema through
              prices, identifiers, customer text, reservation times and optional details, using concrete
              failures to justify each choice. Distinguish exactness from precision, identity from
              presentation, instants from local schedules, and missing information from empty values.
              Compare scalar columns, arrays, JSON, binary values, related rows and external payloads
              through validation, query and ownership requirements. Use selected, documented engine
              differences only when they change a decision. Leave SQL expression behaviour, constraint
              design, historical modelling and live migration procedures to their owning articles.
            heading:
              - title: Start with what a value must preserve
                brief: 'Turn each booking field into a small representation contract: meaning, unit,
                  valid range, required distinctions, equality, ordering and expected operations.
                  Distinguish domain meaning from a storage type and from a formatted display. Show
                  how a price without a currency and a booking time without a temporal meaning can
                  both fit a column while failing the application. Use this contract throughout the
                  article instead of presenting an exhaustive type catalogue.'
              - title: Choose numeric representations from the error you can accept
                brief: Compare fixed-width integers, exact decimal values and approximate floating-point
                  values through prices, measured quantities and calculated estimates. Make range,
                  scale, rounding points and acceptable error explicit; exact storage alone does
                  not settle division or business rounding. Compare decimal amounts with integer
                  minor units, retaining currency and allowing for currencies and quantities with
                  different scales. Include overflow, fractional-unit loss and a value changed by
                  a driver or serialisation layer as failure cases. Keep arithmetic and conversion
                  expression semantics in the SQL-values article.
              - title: Preserve identity and define text equality
                brief: 'Distinguish identifiers from quantities: a telephone number or external code
                  may need leading zeroes, punctuation or a namespace even when it contains digits.
                  Compare integer, UUID and text representations by required range, accepted form,
                  interchange and exact matching, leaving key generation and identity design to the
                  parent. For customer names and booking codes, distinguish original spelling, display
                  order, search matching and identity equality. Explain how encoding, Unicode normalisation,
                  case and accent policies, collation and length limits affect those decisions. Use
                  a compact documented engine comparison where text equality or trailing-space behaviour
                  changes which codes count as duplicates; link uniqueness enforcement to constraints
                  and expression behaviour to SQL values.'
              - title: Store the time the application actually means
                brief: Separate a calendar date, a local wall-clock time, an instant and an elapsed
                  duration using a booking date, confirmation event and recurring opening schedule.
                  Show why an offset and a named time zone answer different questions, why an instant
                  alone cannot retain the intended local recurrence, and why a type name does not
                  establish which zone information is preserved. For local schedules, retain the
                  intended zone and define what happens at ambiguous or nonexistent clock times and
                  after time-zone rule changes. Choose precision and application interchange deliberately.
                  Verify selected timestamp and session-zone behaviour against engine documentation;
                  leave date expressions and historical version modelling to their owning articles.
              - title: Represent missing information without inventing facts
                brief: Distinguish an unknown value, an inapplicable field, an absent relationship,
                  an empty string or collection, and a known zero. Explain when one nullable column
                  expresses the requirement and when an explicit state plus associated data is needed,
                  such as an unprovided versus declined contact detail. Treat a default as a decision
                  about omitted input, distinguishing omission from explicit null and checking engine
                  behaviour. Show how sentinel dates and empty text can collapse meaningful states.
                  Connect each design to required fields, comparisons and uniqueness, directing readers
                  to SQL values for three-valued expressions and to constraints for enforceable valid
                  combinations and engine-specific null uniqueness rules.
              - title: Choose the boundary of a structured value
                brief: Compare ordinary columns and related rows with an array or JSON booking-options
                  value. Ask whether elements need independent identity, references, uniqueness,
                  validation, frequent filtering or separate changes, and whether the enclosing row
                  truly owns the whole value. Use one requirement change to show when an embedded
                  value should become related rows; avoid another normalisation lesson. Distinguish
                  a missing JSON property, JSON null and SQL null, and require an explicit shape
                  and evolution policy for retained JSON. Briefly compare binary values with external
                  payload references through size, database validation and query needs, access ownership
                  and lifecycle consistency. Identify what cannot be made atomic across an external
                  store and the database; link the recovery protocol and storage procedures to their
                  owners instead of expanding them here.
              - title: Check representations at the application boundary
                brief: 'Review the completed booking fields against their representation contracts
                  with a compact fixture table: a numeric boundary, a rounded amount, a leading-zero
                  identifier, text variants, a daylight-saving transition, missing and empty values,
                  and an older structured payload. Check accepted and rejected inputs, database round
                  trips and application serialisation using the actual selected engine and driver.
                  Record versions and settings for observed behaviour and distinguish documented
                  expectations from executed checks. Finish with the remaining decisions to take
                  to constraints, SQL expressions or live schema evolution; do not require specialist
                  type or document-store study to complete an ordinary relational schema.'
        - title: Make invalid facts difficult to store
          brief: Translate booking requirements into required columns, uniqueness, references and
            checks, then try to insert or change invalid examples. Distinguish rules about one stored
            row, relationships between rows and an operation spanning several changes. Make the boundary
            between declarative constraints and a transaction protocol visible; application checks
            alone do not establish that stored data always satisfies the rule.
          nested_article:
            topic: Relational schema invariants
            title: Expressing rules with constraints
            brief: Teach how to translate application invariants into database constraints and identify
              what remains outside their scope. Develop a booking schema through required values,
              candidate keys, tenant-scoped references, conditional uniqueness, mutually dependent
              rows and non-overlapping reservations. Make each example end with an enforcement decision
              and valid and invalid changes. Check the selected engine's null, timing and constraint
              capabilities; reshape the data where that makes a rule enforceable, and state the obligations
              of triggers or transaction protocols where it does not. Examine update and deletion
              actions and finish with an enforcement map and concurrency cases for the transactions
              branch. Leave value representation, transaction anomaly analysis and adding constraints
              to live data to their owning articles.
            heading:
              - title: State the rule before choosing its constraint
                brief: Begin with the booking application's rule that a confirmed reservation belongs
                  to an existing customer and resource in the same tenant and occupies a valid interval.
                  Separate the rule into required facts, permitted values, identity, references and
                  relationships between rows. State whether each rule applies to every stored row,
                  a subset, a completed transaction or an application operation. Pair each intended
                  rule with one accepted and one rejected change so enforcement has an observable
                  meaning; application validation remains useful feedback but does not itself cover
                  other writers.
              - title: Close the gaps in required values and identity
                brief: Use required booking fields and a tenant's external reservation reference
                  to choose NOT NULL, CHECK, a primary key and additional candidate-key constraints.
                  Show why a generated row identifier alone does not prevent a duplicate business
                  fact. Test null separately from an out-of-range value and distinguish a default
                  from a requirement. Specify which fields make up the business key, their tenant
                  scope and the intended treatment of missing values, then verify the chosen engine's
                  CHECK and uniqueness behaviour. Link to value representation for choosing types
                  and comparison semantics rather than repeating that lesson.
              - title: Reference the whole relationship
                brief: 'Follow a booking whose tenant and resource identifiers are individually valid
                  but describe different tenants. Derive a composite reference to an eligible referenced
                  key and test inserts and changes on both sides. Make optional relationships explicit:
                  decide what a partially missing composite reference means and check the engine''s
                  matching options or require the columns together. Distinguish a valid reference
                  from a guarantee that every parent has a child. Use one generic type-and-identifier
                  reference as a counterexample only if it helps show why reshaping a relationship
                  can restore enforceable references.'
              - title: Enforce uniqueness only where the rule applies
                brief: Extend the booking example with at most one current external reference per
                  tenant, while retaining cancelled or historical records under an explicit policy.
                  Translate the condition into the selected engine's supported mechanism, such as
                  a partial unique index, and distinguish its role from a general unique constraint.
                  Check whether the resulting key can be a foreign-key target rather than assuming
                  all uniqueness mechanisms are interchangeable. Test activation, cancellation, replacement
                  and null cases; if the engine cannot express the intended rule, compare reshaping
                  current and historical facts with handing enforcement to a transaction protocol.
              - title: Decide when related changes must become valid
                brief: Use a booking and its required lead participant to expose the difference between
                  a valid final state and a sequence whose intermediate states violate references.
                  First ask whether changing relationship ownership or insertion order removes the
                  cycle. Where deferral is justified, identify the specific constraints and operations
                  the selected engine can defer, distinguish statement-time from transaction-end
                  checking, and include a transaction whose final state still fails. Explain that
                  deferring existing checks does not create an unstated rule such as every booking
                  having a participant; model and enforce that requirement separately. Leave isolation
                  and multi-session schedules to the transactions article.
              - title: Make reservation conflicts a stored rule where possible
                brief: Define the resource, tenant, applicable reservation states and interval boundaries
                  for the rule that reservations must not overlap. Test adjacency, equal endpoints,
                  invalid or missing bounds, resource changes and changes from a non-blocking state
                  to a blocking state. Investigate a declarative range or temporal enforcement mechanism
                  in the selected engine, checking version and capability rather than presenting
                  it as portable SQL. Show the exact rule that mechanism guarantees and any supporting
                  validation it needs. When unavailable, take the same invariant and cases to transaction
                  design rather than replacing enforcement with an unchecked availability query.
                  Leave the choice of historical time model to lifecycle design.
              - title: Choose what a referenced change is allowed to do
                brief: Walk the reference graph when a customer, resource or booking is updated or
                  removed. Choose rejection, explicit reassignment, nulling an optional reference
                  or cascading only after stating the business meaning and retention requirement.
                  Test a chain with shared entities to expose how a cascade can remove more than
                  the intended business object, and distinguish reference survival from permission
                  to perform a deletion. Check the chosen engine's action and timing semantics, including
                  any distinction between restricting a change and checking its final result. Link
                  to lifecycle design for retention policy and operations for removal beyond live
                  rows.
              - title: Account for rules the schema cannot express
                brief: 'Finish an enforcement map for the running schema: the invariant, enforcing
                  object, allowed change paths, validation cases and any remaining transaction or
                  application obligation. Use a total-capacity or minimum-child-count requirement
                  to recognise a rule that the chosen declarative mechanisms do not cover. Compare
                  reshaping the stored fact, a database trigger and an all-writers transaction protocol
                  by the scope they protect and the maintenance and concurrency obligations they
                  introduce; a trigger''s database location is not itself a concurrency argument.
                  Hand simultaneous duplicate creation, conflicting reservations, child insertion
                  during parent deletion and mutually dependent changes to the transactions article
                  with expected acceptable outcomes. Verify actual engine behaviour against primary
                  documentation and recorded tests when writing; label illustrative change sequences
                  accordingly. Send discovery of existing violations and live constraint deployment
                  to schema evolution.'
        - title: Store each fact where it belongs
          brief: Use copied customer details, multiple contact columns and repeating session information
            to expose update, insertion and deletion anomalies. Introduce functional dependencies
            and normalisation through repairs that give each fact an owner. Distinguish a historical
            price agreed at booking from an accidental copy of the current session price; similar
            values need not represent the same fact. Establish normalisation as a way to reason about
            correctness and change, without requiring a tour of every normal form.
          nested_article:
            topic: Relational normalisation and deliberate redundancy
            title: Normalisation and deliberate redundancy
            brief: Teach how to recognise facts with different dependencies, split their storage
              without losing meaning, and justify retaining a derived copy. Extend the booking design
              with candidate-key, partial-dependency, transitive-dependency and independent-set cases;
              introduce normal-form names only when they explain a consequential choice. Check both
              reconstruction and enforceability after a split. Compare repeated attributes, cached
              totals, summary tables and materialised results through their read benefit and maintenance
              contract. Finish with a defensible design and a falsifiable case for its redundancy,
              using the performance and transaction branches for detailed validation rather than
              expanding this into a theory or optimisation curriculum.
            heading:
              - title: State what determines each fact
                brief: Start from the parent's booking schema and a service-line extension whose
                  rows mix booking facts, service facts and quantities. Write dependencies as business
                  rules about all permitted states, not coincidences in the current sample. Show
                  the inconsistent update, missing insertion and destructive deletion that expose
                  the mixed ownership before naming functional dependencies. Identify all minimal
                  unique combinations under explicit business assumptions, including tenant scope;
                  distinguish the selected primary key from the other candidate keys. Show why a
                  generated row identifier does not remove dependencies or inconsistent copies. Recall
                  in one sentence that current and agreed prices can be different facts, linking
                  to the parent and history article for that established distinction.
              - title: Split facts that depend on different keys
                brief: Decompose the service-line example into booking, service and booked-service
                  relations. Explain why booking attributes depend on only the booking part of the
                  composite key and service attributes on the service part, while a quantity belongs
                  to their association. State the one-line-per-service assumption; if repeated lines
                  are permitted, reconsider the key rather than force the example.
                heading:
                  - title: Follow indirect dependencies
                    brief: Extend the same case with a service category whose label is determined
                      by category identity. Separate the category fact and trace a label correction
                      through the resulting tables. Introduce partial and transitive dependencies,
                      and second and third normal forms, as names for the reasoning just used; avoid
                      treating every non-key dependency as the same case.
                  - title: Handle overlapping candidate keys when they matter
                    brief: Use one small counterexample where considering only the chosen primary
                      key misses a dependency involving an alternative key. Introduce the stronger
                      Boyce-Codd condition only to explain the remaining repetition and the choice
                      of decomposition. Reuse this same example for the enforcement tradeoff below;
                      omit a progression through formal proofs and algorithms.
              - title: Prove that the split preserves the relationships
                brief: Reconstruct the original facts by joining the proposed relations and compare
                  them with a deliberately unsafe split that admits extra combinations. Explain lossless
                  decomposition as preservation of permitted facts, not merely a match on one test
                  dataset. Use the shared determinant in a simple binary split to make the reason
                  visible, then carry the same reasoning through the staged split.
                heading:
                  - title: Check what can still be enforced locally
                    brief: 'Distinguish lossless reconstruction from dependency preservation. In
                      the overlapping-key case, identify a rule that a proposed split can no longer
                      check within one table. Make the tradeoff explicit: choose a useful design
                      only after locating enforcement of every required rule. Link constraint mechanisms
                      and concurrent enforcement to their owning articles.'
              - title: Separate independent sets without inventing combinations
                brief: Give a venue independently recorded facilities and supported languages. Show
                  why storing every facility-language combination repeats two independent sets, and
                  why separate venue-facility and venue-language relations retain their meaning.
                  Introduce a multivalued dependency and fourth normal form only to explain this
                  decision, including how to represent a venue with an empty set.
                heading:
                  - title: Keep combinations that are themselves facts
                    brief: Change the requirement so a language is available only for particular
                      services or facilities. Demonstrate the false availability implied by projecting
                      and rejoining independent sets, and retain the actual association instead.
                      Derive independence from the requirement rather than a visual pattern in sample
                      rows. Stop here without a higher-normal-form survey.
              - title: Decide which repeated results are worth storing
                brief: Compare computing a booking total from source lines with storing that total;
                  then use short variations for a repeated current attribute, a summary table and
                  a materialised query result. Separate an ordinary view from stored results and
                  an agreed historical value from a derived current copy. Explain that joins alone
                  do not establish a performance problem and a stored result moves work into updates,
                  refreshes and recovery. Require a concrete expensive read, a representative workload
                  and a target before accepting redundancy. Compare the measured benefit with extra
                  writes, contention, storage, refresh work and acceptable staleness; consider simpler
                  query or index alternatives. Hand query plans, benchmark design and intervention
                  validation to performance.
              - title: Give every derived copy a maintenance contract
                brief: 'Complete a contract for the stored booking total: authoritative source facts,
                  included statuses and calculation rule, freshness visible to readers, owner of
                  updates, concurrency protection and a repair or rebuild path. Cover inserts, corrections,
                  cancellations, deletions and every writer that can affect the result. Require the
                  same answers for the other forms of stored result.'
                heading:
                  - title: Choose atomic maintenance or explicit lag
                    brief: Contrast changing the total with source rows in one transaction against
                      rebuilding or refreshing it later. Use one small lost-update counterexample
                      to establish the required concurrency guarantee, then link its implementation
                      to transactions. For asynchronous maintenance, require a stated lag allowance
                      and a guarantee that missing, repeated or out-of-order changes cannot leave
                      undetected drift. Link delivery and recovery protocols to application integration
                      rather than developing them here.
                  - title: Make drift detectable and rebuilding safe
                    brief: Require a source-based comparison and a rebuild guarantee that accounts
                      for concurrent changes and identifies when the replacement is usable. Record
                      the owner and reader behaviour if repair fails; link replacement procedures
                      and operational scheduling to evolution and operations. A value that cannot
                      be recovered from the alleged source requires revisiting the source-of-truth
                      decision, not a more elaborate refresh procedure here.
              - title: Defend the design with changes and counterexamples
                brief: 'Finish with a compact review of the worked schema: identify keys and dependencies,
                  demonstrate reconstruction without extra combinations, account for independent
                  and correlated sets, and locate enforcement for each rule. Exercise one correction,
                  one deletion and competing total updates; specify the promised reader result and
                  recovery after an interrupted refresh. Retain a redundant result only with its
                  maintenance contract and measured benefit. Distinguish paper reasoning, illustrative
                  schedules and any later engine execution evidence; do not claim these design checks
                  establish performance or concurrent correctness on their own.'
        - title: Decide what changes and what must be remembered
          brief: Walk a booking through amendment, cancellation, customer deletion and later reporting.
            Separate current state, an agreed historical fact and evidence of a change. Explain why
            overwriting or adding a deleted flag is a decision about meaning, visibility, uniqueness
            and references. Record retention and erasure requirements early enough that the schema
            can support them, without prescribing jurisdiction-specific legal rules.
          nested_article:
            topic: Relational history and data lifecycle design
            title: Modelling history and data lifecycles
            brief: Teach how to choose among current-state rows, immutable snapshots, change records
              and effective-dated versions for concrete relational requirements. Distinguish when
              a fact applied from when the database recorded it, introducing both dimensions only
              when late information and corrections require them. Design version identity, historical
              references, interval boundaries and overlap rules so point-in-time questions have a
              defined answer. Compare status changes, tombstones, archival and deletion through their
              effects on references, uniqueness, reporting, retention and erasure. Bound the evidence
              that history rows provide and the removal achieved by deleting live rows; refer operational
              procedures and live lifecycle changes to their owning branches.
            heading:
              - title: Start with the questions the past must answer
                brief: Extend the booking example with a changed customer address, an agreed price,
                  a cancellation and a corrected room assignment. Ask separately what is true now,
                  what was agreed at booking, what applied on a given date and what the system knew
                  when it issued a report. Identify the question, owner and required retention before
                  choosing a history pattern. Keep the simple current-state design where no historical
                  answer is required.
              - title: Store the facts each question needs
                brief: Compare four representations against those questions, showing what an overwrite
                  loses and what retaining a row still fails to explain. A schema may combine representations
                  when they serve distinct requirements.
                heading:
                  - title: Preserve an agreement with a snapshot
                    brief: Preserve the address and price agreed for a booking independently of later
                      customer or catalogue edits. Explain why this is a historical fact with its
                      own meaning, rather than an accidentally stale current value. Choose the snapshot
                      boundary and capture time; refer dependency reasoning and maintenance of derived
                      copies to the normalisation article.
                  - title: Record changes when the sequence matters
                    brief: Contrast a row containing the current cancellation status with records
                      of requested, confirmed and reversed changes. Define whether a change record
                      captures an action, a before-and-after difference or a complete resulting state.
                      Show the information needed to reconstruct a state and why timestamps alone
                      need not establish an unambiguous change order. Do not expand into an event-sourcing
                      architecture.
                  - title: Use effective-dated versions for facts with a period of applicability
                    brief: Model a room's capacity or a customer's contractual rate over time when
                      questions concern which value applied during a period. Distinguish this requirement
                      from merely keeping every overwritten row. Compare explicit applicability periods
                      with a history of recorded changes without turning the comparison into a catalogue
                      of temporal features.
              - title: Separate an entity from its versions
                brief: Give the enduring entity and each stored version clear identities. Decide
                  whether a booking's reference means the current customer, a particular customer
                  version or the customer details preserved in the agreement. Show how following
                  a reference to today's row can change a historical report. Preserve tenant scope
                  in entity and version references and in uniqueness; use the constraints article
                  for enforcement mechanisms.
              - title: Define time boundaries and correction rules
                brief: Make a point-in-time answer precise before implementing it. Use a small timeline
                  and expected query results; refer timestamp and time-zone representation to the
                  value-representation article.
                heading:
                  - title: Make each instant resolve to a defined version
                    brief: Choose inclusive starts and exclusive ends, represent the current open
                      end deliberately, and state whether gaps or overlaps are valid for this fact.
                      Test the exact instant where one version gives way to another and a query spanning
                      that boundary. Distinguish per-entity version overlap from the separate problem
                      of conflicting bookings. State the required invariant and link to constraints
                      and transactions for safe enforcement.
                  - title: Add recorded time only when corrections require it
                    brief: Use a rate change entered late to distinguish when the rate applied from
                      when the database learned it. Compare a corrected account of a past date with
                      reproducing the report issued before the correction. Introduce two time dimensions
                      only when both answers are required, defining what a correction supersedes
                      and which prior assertion remains queryable. Explain that an automatically
                      maintained row history must be checked against these semantics rather than
                      assumed to encode business time.
              - title: Decide what leaving the active set means
                brief: Compare cancelling a booking, marking a customer deleted, retaining a minimal
                  tombstone, moving history to an archive and physically deleting rows. Choose from
                  required behaviour rather than treating a deleted flag as a complete lifecycle
                  policy.
                heading:
                  - title: Follow references, uniqueness and reports through removal
                    brief: State whether historical bookings remain meaningful after a customer leaves,
                      which identifying details remain and whether a former identifier may be reused.
                      Show how inactive rows affect uniqueness, joins and counts, and how forgetting
                      the active-row condition exposes them to ordinary queries. Treat archival as
                      a change in availability and access path, not proof of deletion. Refer constraint
                      actions and conditional uniqueness to their owning article.
                  - title: Specify retention and erasure beyond the row
                    brief: Separate the design requirement to retain business evidence from the requirement
                      to remove or minimise identifying data. Identify copies in history tables,
                      snapshots, derived results, replicas, exports and backups; deleting a live
                      row alone does not define their lifecycle. Produce a retention and removal
                      requirement for operations to implement, including what a restore must do with
                      previously removed data. Keep jurisdictional requirements explicit inputs and
                      leave removal and restore procedures to operations and live schema changes
                      to evolution.
              - title: Test what the history can truthfully establish
                brief: 'Walk one booking through creation, agreement, a later profile edit, a backdated
                  correction, cancellation and eventual removal. Write expected answers for today''s
                  view, the applicable past state and any required as-recorded report, including
                  boundary instants and missing history. Inventory who can alter history and how
                  changes are captured: stored history alone does not prove completeness, attribution
                  or resistance to tampering. Hand access and audit requirements to security, concurrency
                  cases to transactions and live conversion work to evolution. Finish with the smallest
                  design that answers the agreed questions throughout the lifecycle.'
        - title: Test the schema against the application's life
          brief: Assemble the booking schema into a reviewable design with row meanings, key choices
            and an invariant inventory. Trace representative reads and changes, including an empty
            database, missing references, duplicate input, a tenant boundary, customer merges, corrected
            history and deletion. Demonstrate simple queries to catch accidental many-to-many multiplication
            and ambiguous meaning, leaving SQL instruction to its own branch. Separate database-enforced
            rules from transaction and application responsibilities, identify workload checks for
            performance review, and record unresolved assumptions and expected future changes. End
            with evidence that a design meets requirements, rather than a claim that one schema fits
            every application.
  - title: Asking questions with SQL
    anchor: ask-for-a-result-then-check-what-it-means
    brief: Walk from a simple selection to an order summary using filtering, a join and aggregation.
      Explain that SQL describes a result while the engine chooses how to obtain it. Make duplicate
      rows, missing matches, nulls and explicit ordering visible early, so plausible output is not
      mistaken for a correct answer. Show that SQL also changes data and that a successful statement
      can still express the wrong change.
    nested_article:
      topic: Querying and changing relational data with SQL
      title: Working with SQL
      brief: Build practical fluency in reading and writing SQL, from inspecting a disposable database
        to expressing and checking substantial application and analytical queries. Teach selection,
        joins, aggregation, subqueries, set operations, window calculations and recursion where they
        solve useful relational problems. Develop precise reasoning about duplicates, nulls, ordering,
        time, pagination and data changes. Teach how to establish expected results and test edge
        cases. Distinguish portable concepts from dialect behaviour without attempting an exhaustive
        syntax catalogue; leave execution-cost diagnosis to its own branch.
      heading:
        - title: Start with a database you can inspect and reset
          brief: Introduce a small order-and-payment database with supplied setup and reset scripts.
            Show how to connect, identify the engine and version, inspect tables, columns, keys and
            sample rows, execute a statement and read an error. Explain which commands belong to
            the client and which are SQL. Keep the exercise disposable and mark implementation-specific
            syntax at its first use.
        - title: Decide what one result row means
          brief: 'Translate a request such as outstanding orders into a result contract: one row
            per chosen entity or group, its columns and types, inclusion rules, treatment of missing
            facts, duplicate policy and required ordering. Hand-calculate a small expected result
            before writing SQL. Use the contract throughout the article to expose plausible answers
            at the wrong level of detail.'
        - title: Select rows and calculate their columns
          brief: Build SELECT expressions, aliases, FROM and WHERE through a useful first query.
            Teach comparisons, Boolean conditions and precedence, CASE, explicit column selection
            and DISTINCT. Explain the logical transformation of a query as a reasoning aid rather
            than an execution trace. Establish that repeated values and repeated result rows are
            meaningful until the result contract says otherwise.
        - title: Make values, missing facts and time explicit
          brief: Establish null as a missing value and show why an ordinary comparison cannot replace
            IS NULL. Introduce three-valued predicates and show which rows a filter retains. Use
            an amount calculation and a reporting date boundary to motivate checking expression types,
            casts and time semantics before trusting a result.
          nested_article:
            topic: SQL expression semantics, missing values and time
            title: Getting SQL values right
            brief: Teach practitioners to recognise and repair plausible wrong answers caused by
              SQL expression semantics. Extend the parent's basic null example through missing-value
              logic, deliberate defaults, arithmetic, text comparison, conversions and time calculations.
              Use a compact booking-and-charge report with hand-checked expected values, PostgreSQL
              as the named reference engine, and documented dialect differences only where they change
              the result or the repair. Keep representation choices in schema design, aggregate and
              join semantics in their sibling, membership traps in query composition and driver conversion
              in application integration. Stop at the depth needed to write and verify ordinary relational
              queries; no function catalogue or specialist calendar branch is needed.
            heading:
              - title: Start with the answer each expression must mean
                brief: Reuse a small booking-and-charge fixture to state what a missing charge, zero
                  charge, discounted amount, customer label and reporting period mean. Give expected
                  expression outputs and included row identifiers before SQL. Record the PostgreSQL
                  version and relevant session settings for executable examples; distinguish predicted
                  results from recorded execution. Link to representation design for why these columns
                  have their chosen types, rather than reopening that choice here.
              - title: Follow unknown through a predicate
                brief: Extend the parent's IS NULL introduction by tracing TRUE, FALSE and UNKNOWN
                  through comparison, NOT, AND and OR on the report's optional charge. Show why negating
                  a comparison need not recover missing rows, and distinguish a predicate's value
                  from WHERE's decision to retain a row. Build an explicit policy for including unknowns
                  and use IS DISTINCT FROM or the named dialect's null-safe comparison where that
                  policy calls for it. Keep null-sensitive membership and outer-join filtering with
                  their sibling owners; do not repeat their query walkthroughs.
              - title: Make defaults and conditional results express the business rule
                brief: Use searched CASE to distinguish unknown, waived and charged amounts, then
                  show when COALESCE legitimately supplies a fallback and when it destroys a distinction
                  needed by the report. Treat empty text, zero and null separately. Explain compatible
                  branch result types and guard a division with NULLIF or a suitable conditional
                  expression. Verify the reference engine's evaluation rules and limitations before
                  suggesting that a conditional expression safely guards an error; avoid portable
                  promises about evaluation order or short-circuiting.
              - title: Check the arithmetic before trusting the amount
                brief: Follow an average charge or discount calculation through operand types, division,
                  intermediate precision and the final rounded value. Use one counterexample each
                  where integer division, approximate representation, rounding placement or an intermediate
                  overflow changes the intended answer. Show why converting the operands before calculation
                  can differ from converting the result, and why display rounding and a contractual
                  money-rounding rule are different operations. Check negative values, zero denominators
                  and boundary values against documented PostgreSQL semantics; mention another dialect
                  only when a consequential difference would change the query. Leave storage-type
                  selection to design.
              - title: Ask which text counts as equal or matching
                brief: Use a customer lookup to distinguish exact comparison, a declared case/accent
                  comparison policy and pattern matching. Explain how operand type and collation
                  affect comparison and ordering, using only the distinctions needed to explain differing
                  answers in the example. Demonstrate the meaning and escaping of LIKE wildcards
                  and a literal percent or underscore supplied as search data. Verify relevant Unicode,
                  locale and trailing-space edge cases in the named engine and collation rather than
                  promising universal behaviour. Leave index support and search-performance diagnosis
                  to performance, and parameter binding to application integration.
              - title: Make conversions visible at the expression boundary
                brief: Compare a typed value with text input to expose type inference, implicit conversion
                  and explicit casts. Show a parse failure, an ambiguous date input and a lossy numeric
                  conversion; state which inputs the report accepts before choosing its conversion.
                  Use unambiguous literals and explicit types where they clarify intent, recording
                  session-dependent parsing settings. Verify which conversions fail, round or truncate
                  in the chosen engine. Do not imply that a cast validates the business rule or that
                  a preceding WHERE condition guarantees conversion evaluation order. Link driver-side
                  conversion and validation to application integration rather than repeating it.
              - title: Calculate reporting boundaries in the intended clock
                brief: Start from the report's question to distinguish a date, a local date-time,
                  an instant, a named time zone and an interval. Use a local business-day report
                  to derive its two boundaries in the named zone and compare event instants with
                  a half-open interval, including an event exactly at each boundary. Contrast a fixed
                  UTC offset with the named zone's rules and distinguish displaying an instant locally
                  from interpreting a local clock reading. Use a daylight-saving transition to expose
                  nonexistent and repeated local times; verify the engine's resolution behaviour
                  and make the application's ambiguity policy explicit. Keep schema storage choices
                  and historical modelling in design.
              - title: Separate calendar movement from elapsed duration
                brief: Compare a booking moved to the same local time on the following day with a
                  timeout or elapsed-hours calculation across the same daylight-saving boundary.
                  Verify the named engine's interval arithmetic and month-end behaviour only as needed
                  to explain those outcomes. Make the reference clock for a relative reporting period
                  explicit, including PostgreSQL's documented transaction/statement/clock timestamp
                  distinctions when they change a long-running report's answer. Avoid a general calendar
                  or scheduling tutorial.
              - title: Keep a small regression fixture for value semantics
                brief: Close by repairing the original report and comparing its values and selected
                  row identifiers with the declared expectations. Keep null and zero, a negative
                  amount, a rounding boundary, literal wildcard text, invalid input and time-boundary
                  cases, including the daylight-saving examples introduced above. Record engine version,
                  collation, time zone, parsing settings, query and observed result beside the evidence.
                  Use primary documentation to explain consequential behaviours and repeat the affected
                  checks when changing engine or relevant settings. Passing these checks establishes
                  only the tested result semantics; direct plan and workload questions to performance
                  without a second testing tutorial.
        - title: Combine related facts without changing the question
          brief: Walk through a join with a tiny row-by-row result and then group order lines into
            a total. Make input and output row identity visible. Introduce inner and left joins,
            ON, GROUP BY, aggregates and HAVING sufficiently to read and build a basic report, then
            expose the inflated total caused by joining two independent one-to-many relationships.
          nested_article:
            topic: SQL joins, cardinality and aggregation
            title: Joining and summarising data
            brief: 'Build correct multi-table application queries and reports by keeping the meaning
              of one result row explicit. Develop join cardinality, outer-join filtering, grouping,
              counts, conditional totals and the repair of double-counting with a small connected
              set of checked examples. Follow the parent-first reading path. Before the first worked
              task, tell contextual entrants to read Working with SQL''s section Express a larger
              question in checkable stages: its small staged query supplies the derived-table or
              CTE notation used here. Assume that section alongside the parent''s first join and
              grouped query; concentrate on cases that produce plausible wrong answers. No composition
              tutorial or prerequisite visit to Composing larger SQL queries is needed. Identify
              the example engine and consequential dialect behaviour at first use. Keep detailed
              existence and membership semantics with Composing larger SQL queries, expression semantics
              with Getting SQL values right, and execution methods and costs with performance. This
              article supplies the depth needed for expert relational practice without a further
              reporting or join-specialist branch.'
            heading:
              - title: State what one result row represents
                brief: Start from a report requiring one row per customer with order value and payment
                  value, including customers without activity. State which details qualify, what
                  zero and unknown mean, and whether totals refer to all time or a chosen period.
                  Establish customer, order, order-line and payment keys and relationships. Predict
                  the result columns and hand-calculate a tiny expected result before extending the
                  parent's basic join example. Reuse these facts through the article rather than
                  introducing a new domain for every SQL feature.
              - title: Follow the matches a join produces
                brief: Trace one-to-one, one-to-many and many-to-many matches as pairs of source
                  rows, preserving duplicates unless the question explicitly removes them. Predict
                  per-key multiplicity before running a join; test missing and incomplete join predicates,
                  non-unique matching columns and composite keys. Use a short employee-to-manager
                  self-join to explain independent aliases and missing managers, without opening
                  a hierarchy-traversal lesson. Show why selecting customers with any qualifying
                  order through the parent's presence test does not multiply customer rows; link
                  to Composing larger SQL queries for EXISTS and membership detail. Leave physical
                  join algorithms and their costs to performance.
              - title: Preserve unmatched rows deliberately
                brief: Follow a LEFT JOIN through a customer with no orders and one with only out-of-period
                  orders. Compare a detail predicate in ON with the same predicate in WHERE and show
                  the resulting retained or rejected rows. Locate null-extended rows separately from
                  matched detail rows whose attributes are null; use a guaranteed non-null detail
                  key when testing for a missing match. Keep full and right joins to a brief explanation
                  only if needed to interpret the example or reverse the preserved side. Link to
                  SQL values for three-valued logic instead of reteaching it.
              - title: Group at the level the question asks for
                brief: Derive GROUP BY keys from the result-row contract, grouping by stable customer
                  identity rather than merging customers with the same display name. Show how adding
                  a grouping column changes the result's level of detail and why selecting an ungrouped
                  value needs a defined rule; use explicit grouped columns and flag consequential
                  engine differences in functional-dependency allowances. Separate filtering source
                  rows with WHERE from filtering completed groups with HAVING. Require explicit final
                  ordering when the report promises an order. Contrast grouped totals with retaining
                  individual rows, linking to Calculating across related rows for the latter task.
              - title: Make counts, missing values and conditional totals agree
                brief: Compare COUNT(*), COUNT(detail_key), COUNT(nullable_value) and COUNT(DISTINCT
                  value) on the same outer-joined rows. Explain which rows or non-null values each
                  counts and what distinctness removes. Contrast a global aggregate over empty input
                  with a grouped query that has no groups, then show how retained customers can still
                  produce zero-detail rows. Establish SUM and other relevant aggregate null behaviour
                  in the named engine. Choose COALESCE only after deciding whether absence means
                  zero or unknown. Derive paid and unpaid totals with CASE inside an aggregate, naming
                  FILTER as an engine-supported alternative where useful. Keep arithmetic and null-expression
                  details with Getting SQL values right.
              - title: Combine independent totals without multiplying them
                brief: Give one customer multiple orders and multiple payments, show the two detail
                  sets and paired join rows, and ask the reader to predict both totals before explaining
                  how they become overstated. Repair the report by aggregating each independent detail
                  at customer level before joining those results to customers. Show the intermediate
                  order and payment subtotals, each with one row per customer, beside the final join.
                  Use only the derived-table or CTE notation from the stated prerequisite, Working
                  with SQL's section Express a larger question in checkable stages. Verify at most
                  one row per customer in each intermediate result and preserve absent details explicitly.
                  Explain why DISTINCT on final rows, SUM(DISTINCT amount), or a distinct count cannot
                  generally repair unrelated totals; equal-valued legitimate payments must survive.
                  Add a subtotal only if the chosen report actually needs one, distinguishing a subtotal
                  marker from an ordinary null and checking against double-summing subtotal rows.
                  Do not expand into a catalogue of grouping extensions.
              - title: Prove the report against awkward data
                brief: 'Finish with a compact adversarial fixture set targeting this article''s additional
                  failure cases: no activity, several details on each side, repeated legitimate amounts,
                  duplicate display names, a nullable measured value, an out-of-period detail and
                  empty qualifying input. Compare complete expected rows, per-customer totals and
                  a separately calculated overall total; check one result row per promised key and
                  explicitly requested ordering. Introduce an incorrect predicate or extra join to
                  demonstrate that the checks detect the wrong answer. Record named-engine results
                  and distinguish hand-derived expectations from observed execution. Passing correctness
                  checks does not establish acceptable execution cost; hand that diagnosis to the
                  performance branch.'
        - title: Express a larger question in checkable stages
          brief: Complete one useful unpaid-order report with a basic common table expression or
            derived result and an EXISTS test for related payments. Inspect each stage against its
            result contract and check the final answer, leaving the reader able to organise an ordinary
            query without further reading. Briefly motivate set operations and repeated parent-child
            expansion as different questions developed in the child; recursion is optional for traversal
            tasks. Distinguish this logical organisation from a description of physical execution.
          nested_article:
            topic: SQL subqueries, set operations and recursive queries
            title: Composing larger SQL queries
            brief: Extend the parent's completed report and existence test with the correctness decisions
              needed when queries return scalar values, supply tables, compare memberships or combine
              results. Make cardinality, correlation, null policy, compatible types and duplicate
              policy explicit. Explain how a checked query becomes a reusable view without implying
              an execution strategy. Offer one optional hierarchy traversal with deliberate termination,
              cycle, multiplicity and ordering rules. Use a named engine and identify consequential
              dialect differences; leave execution costs, materialisation and plan diagnosis to performance,
              and view deployment to evolution.
            heading:
              - title: Choose what the inner query must return
                brief: Start from the parent's established result-row contract rather than repeating
                  its staged-report walkthrough or CTE introduction. Distinguish a scalar value,
                  a relation of rows and a yes-or-no existence question through small extensions
                  to its order-and-payment data. For a scalar lookup, check zero, one and multiple
                  returned rows, including a one-row null result; demonstrate the chosen engine's
                  zero-row null and multiple-row failure behaviour. Explain when a constraint establishes
                  cardinality and when a business rule requires an explicit aggregate or ordered
                  selection. Do not hide ambiguity with an arbitrary first row.
              - title: Make the dependency on the outer row visible
                brief: Trace a correlated scalar query and a correlated EXISTS predicate for two
                  deliberately different outer orders. Qualify names and show how a missing correlation
                  predicate silently asks a global question. Distinguish the logical dependence on
                  outer values from claims about how many times an engine executes the inner query.
                  Contrast a table subquery's row and column contract with a scalar position, and
                  expose the row multiplication that an apparently equivalent join can introduce.
                  Link join-cardinality repairs to Joining and summarising data rather than repeating
                  them.
              - title: Define what membership means when values can be missing
                brief: Compare IN, EXISTS, NOT IN and NOT EXISTS on a tiny fixture containing matches,
                  non-matches, repeated inner values, an empty inner result and nulls on either side.
                  Show the NOT IN trap by recording true, false or unknown before applying WHERE.
                  Repair an exclusion query with a correlated NOT EXISTS and an explicit policy for
                  a null outer key; ordinary equality in the correlation does not by itself make
                  nulls match. If null denotes an equal membership value for the task, use the named
                  engine's null-safe comparison and check that policy separately. Reuse the parent's
                  basic existence lesson and link expression semantics for general three-valued logic.
                  Do not promise that rewriting predicates improves performance.
              - title: Combine result sets with the intended multiplicity
                brief: Use two small customer-selection queries to derive UNION, INTERSECT and EXCEPT
                  from their expected outputs. Align column count, column positions and compatible
                  types explicitly; compatible types alone do not establish compatible business meanings.
                  Compare UNION with UNION ALL, then explain duplicate elimination and the supported
                  ALL variants through counts of repeated rows. Show how nulls participate in set
                  duplicate comparison rather than importing ordinary equality behaviour. Mark unsupported
                  dialect variants, parenthesise mixed operations, and place a final ORDER BY over
                  the complete result. Keep branch-local limiting and ordering separate from any
                  promise about final display order.
              - title: Give a checked query a reusable interface
                brief: Turn one already checked composition into a view with deliberately named columns
                  and explicit selection. Demonstrate a consuming query and explain that reuse names
                  a query interface; it does not promise stored results, fixed row order or a particular
                  plan. Keep the decision focused on a stable meaning shared by callers. Link materialised
                  results and execution choices to performance, and interface changes, permissions
                  and production deployment to their owning branches instead of extending into view
                  administration.
              - title: Follow a hierarchy only when the task requires traversal
                brief: 'Mark this section as optional: ordinary reports, window calculations, pagination
                  and changes do not depend on it. Develop one task, listing the descendants of a
                  selected category in a parent-child hierarchy, with a tiny fixture and a hand-drawn
                  expected result. Keep it as a bounded SQL traversal rather than surveying graph
                  algorithms or alternative hierarchy representations.'
                heading:
                  - title: Separate the starting rows from each expansion
                    brief: Build the recursive CTE's anchor and expansion, showing the working rows
                      after successive rounds as a logical explanation, not an observed execution
                      trace. Define whether the selected root appears and what each output row represents.
                      Check the recursive columns' types, missing roots, leaves and a hierarchy with
                      multiple levels. Explain termination when expansion produces no further eligible
                      rows.
                  - title: Stop cycles and choose which repeats to retain
                    brief: Introduce a deliberate cycle into the disposable fixture and repair the
                      traversal using the named engine's cycle facility or an explicit visited path.
                      Explain why UNION's whole-row deduplication is not a general cycle defence
                      when depth or path changes on every visit. Distinguish revisiting a node along
                      one path from the result's desired duplicate policy. Treat a maximum-depth
                      limit as a safety bound that can truncate an answer, with a visible truncation
                      check, rather than proof of a complete traversal. Use an explicit path or ordering
                      key and final ORDER BY; traversal evaluation order does not establish display
                      order. Identify the relevant recursive-syntax differences without adding another
                      recursive-query article.
              - title: Check the contracts introduced by composition
                brief: 'Close with repeatable checks targeted at this article''s extra failure cases:
                  scalar zero and multiple rows, a lost correlation, nullable membership including
                  an empty inner set, unequal duplicate counts across set branches, and the optional
                  traversal''s missing root, leaf, cycle and depth bound. Compare expected values,
                  nulls, column types and row counts; compare order only where the query promises
                  it. Keep a compact answer key showing why attractive rewrites are or are not equivalent
                  under these contracts. Passing these checks establishes the illustrated answers,
                  not acceptable execution cost; hand that diagnosis to performance.'
        - title: Compare rows while keeping their detail
          brief: Contrast a grouped total with a per-order row carrying its customer's total. Introduce
            OVER, partition and ordering through that difference, then motivate ranking and running
            calculations. Show why the rows available to a calculation and the order eventually displayed
            are separate decisions.
          nested_article:
            topic: SQL window calculations
            title: Calculating across related rows
            brief: Teach window calculations as a way to compare and summarise related rows while
              retaining the required detail. Develop latest rows per entity, top items per group,
              shares of totals, running and moving totals, and changes from an earlier event using
              two small, hand-checked datasets. Distinguish input rows, partitions, ordering, peers
              and frames, and make ties, missing periods and filtering choices observable in expected
              results. Use a named PostgreSQL version for runnable examples, check consequential
              behaviour against its primary documentation, and identify dialect differences only
              when they change a reader's query or result. Assume the parent's basic query and staging
              workflow; link value semantics, aggregation and execution-cost diagnosis to their existing
              owners. Stop at reliable application and reporting calculations rather than a function
              catalogue or analytical specialism.
            heading:
              - title: Decide what one result row represents
                brief: Start with a ledger containing entity, event identifier, timestamp and amount,
                  and a small item-sales fixture with group, item, period and sales. Include tied
                  timestamps, tied sales, a missing period and a null amount. State whether the query
                  needs each event, each item-period or one winner per entity. Contrast retaining
                  those rows with collapsing them through grouping, referring to the joins and aggregation
                  article for establishing that input grain. Hand-calculate a small expected result
                  before introducing the window syntax.
              - title: Separate the input, partition and two kinds of order
                brief: Annotate one OVER expression to distinguish the rows supplied by the query,
                  PARTITION BY, window ORDER BY and the final query ORDER BY. Establish what makes
                  rows peers under the chosen window ordering and why an event identifier can resolve
                  an otherwise tied event sequence. Show the same calculated values displayed in
                  a different final order. Explain windows over already-aggregated item-period rows
                  without repeating the parent's grouping tutorial. Keep this a logical account of
                  query meaning rather than a claim about physical execution.
              - title: Choose one latest row or preserve tied winners
                brief: Use the ledger to choose one latest event per entity with ROW_NUMBER and a
                  stated timestamp and identifier ordering. Decide what latest means when the timestamp
                  ties and whether the identifier is merely a repeatable selection rule. Reuse the
                  sales fixture to compare a fixed number of items with all items tied at a rank,
                  and show the different cutoff results from ROW_NUMBER, RANK and DENSE_RANK. Do
                  not add an identifier to the business ranking order when that would destroy the
                  intended ties; use a separate display ordering. State the null-ordering policy
                  if the ordering key can be null.
              - title: Filter after the calculation when the question requires it
                brief: Complete the winner query by computing its window value in a derived table
                  or CTE and filtering in the outer query. Use the staging technique already taught
                  by the parent, concentrating here on the change in meaning. Contrast selecting
                  the latest event and then checking its amount with selecting the latest event among
                  amounts passing a condition. Show that restricting a report date range before a
                  running calculation can remove history that its opening value needs. Mention QUALIFY
                  only as a dialect-dependent spelling where supported, with the outer-query form
                  as the worked baseline.
              - title: Keep a whole-group denominator for shares
                brief: Calculate each item's share of its group's total from the sales rows, choosing
                  the intended group and period explicitly. Display numerator, denominator and expected
                  share together. Contrast a whole-partition aggregate with an ordered aggregate
                  whose frame can produce a running denominator. Require an explicit policy for zero
                  totals and missing amounts, linking arithmetic and null semantics rather than repeating
                  them. Check the sum of shares where the declared input and denominator make that
                  a valid invariant.
              - title: Make running and moving frames explicit
                brief: Mark the rows contributing to a ledger running total, then compare an explicit
                  ROWS frame with the default ordered aggregate frame at tied timestamps. Explain
                  why the default can advance across peers together, and specify the ordering needed
                  for an event-by-event total. Reuse the sales fixture to distinguish the last three
                  recorded rows from an interval of time using a value-based RANGE frame. Check boundary
                  inclusion, ties, partial opening frames and missing periods. Explain that a frame
                  does not invent absent periods; when a report requires zero-filled calendar periods,
                  prepare that input before calculating and link to joins and time semantics. Verify
                  the chosen engine's RANGE offset types and ordering restrictions. Bound frame discussion
                  to these tasks rather than touring every frame option.
              - title: Compare with the previous event or previous period
                brief: Use LAG on the ledger's defined event order to calculate an amount change.
                  Show a first event with no predecessor, a predecessor whose amount is null, and
                  an ordinary predecessor; use an additional predecessor identifier when the result
                  must distinguish absence from a null value. Explain the difference between supplying
                  a default for an absent row and replacing a present null. Reuse the missing-period
                  sales example to show that the previous recorded row need not be the previous calendar
                  period. Choose between event comparison and prepared calendar input according to
                  the reporting question. Keep any IGNORE NULLS discussion tied to documented support
                  in the named engine.
              - title: Check the calculation at its boundaries
                brief: 'Finish with a compact exercise reusing the fixtures: select tied top sellers,
                  calculate their shares from the intended complete group, and report a moving value
                  without losing required history. Ask the reader to identify input grain, partition,
                  ordering, tie policy, frame and filtering stage before comparing expected rows
                  and values. Check a singleton group, ties, a missing period, null values and a
                  date-range boundary; vary insertion order to expose reliance on an incomplete ordering.
                  Require explicit final output ordering for checked tables. Record the engine/version
                  and primary documentation used for frames, ranking and predecessor behaviour. Successful
                  result checks establish these examples'' meaning; link performance analysis for
                  their execution cost.'
        - title: Order and page a result deliberately
          brief: Teach a complete ORDER BY with tie-breakers, explicit null placement where supported,
            and LIMIT or the chosen dialect's equivalent. Compare offset and keyset pagination by
            walking a small ordered result, including composite cursors, tied values and page boundaries.
            Explain how insertion, deletion and changed sort values between requests affect the traversal
            contract. Link snapshot and transaction guarantees to the concurrency branch and access-path
            costs to performance rather than claiming a cursor alone freezes a result.
        - title: Change the intended rows and inspect the outcome
          brief: Introduce INSERT, UPDATE and DELETE on the disposable data, showing predicates,
            affected rows and returned values where supported. Connect a change to its precondition
            and postcondition, including a conditional update that can match zero rows. Introduce
            transaction grouping and rollback for practice, while leaving concurrent correctness
            and failure guarantees to their owning branch.
          nested_article:
            topic: SQL data modification
            title: Changing data with SQL
            brief: Make INSERT, UPDATE and DELETE express a deliberate change to a known target set,
              then establish whether their results satisfy the intended postcondition. Extend the
              parent's first change workflow through set-based changes, insert-from-query, defaults
              and generated identifiers, constraint failures, ambiguous source matches and conflict-handling
              choices. Use a small order-and-stock fixture in a named PostgreSQL version, checking
              consequential behaviour against its primary documentation and recording actual results
              separately from illustrative examples. Keep conflict-handling inserts, upsert and MERGE
              together as an outcome decision; identify consequential dialect differences without
              building a syntax catalogue. Use bounded transactions for disposable exercises and
              link to transaction reasoning for concurrent correctness, application integration for
              retries and idempotency, and evolution for production corrections and backfills.
            heading:
              - title: State the change before writing the statement
                brief: Start from the parent's basic update and specify the intended entity, target
                  keys, expected number of matches and postcondition. Distinguish changing one identified
                  order from changing every qualifying order, including tenant scope where identifiers
                  are tenant-local. Derive the candidate set with a query and inspect the same predicate's
                  treatment of nulls, zero matches and unexpectedly broad matches. Link to expression
                  semantics for three-valued logic. Establish that a preview helps find mistakes
                  but is not a reservation of those rows against concurrent writers; the transaction
                  branch owns that guarantee.
              - title: Insert the intended rows and keep their identities
                brief: Use explicit column lists for a single row, several rows and INSERT from a
                  query. Check the source's row meaning and duplicate policy before using it to create
                  rows, and distinguish an empty source from an unexpected failure to insert. Compare
                  omitted columns, DEFAULT and explicit NULL against the actual schema. Retrieve
                  generated keys through the named engine's documented returned values rather than
                  inferring them from a maximum or assuming consecutive identifiers. Introduce constraints
                  only through what they accept or reject; schema design owns their modelling and
                  evolution owns adding them to live data.
              - title: Make set-based updates unambiguous
                brief: Derive a multirow update from a checked key set, express new values from stored
                  values or a source relation, and inspect the resulting values. Include a conditional
                  stock decrement to show a business precondition in the change itself, interpreting
                  zero matches without treating it as proof of one particular cause. Require each
                  target row in a source-driven update to have the intended number of source matches.
                  Expose duplicate source matches in a fixture and repair the source through a justified
                  unique key, aggregation or explicit selection rule; arbitrary deduplication must
                  not invent the business rule. Verify UPDATE FROM behaviour in the chosen engine
                  rather than assume a portable winner. Link join-cardinality teaching and transaction-level
                  invariant reasoning.
              - title: Delete rows and account for dependent changes
                brief: Select the exact rows to remove using keys and predicates, including a bounded
                  example derived from a related table. Check zero and multiple matches and show
                  how a missing predicate changes the scope. Inspect how the fixture's foreign keys
                  reject deletion or apply declared referential actions, including effects on dependent
                  rows. Distinguish deleting a row from assigning NULL or changing its business status
                  without prescribing a universal soft-delete policy. Keep cascade design in data
                  modelling and production purges in evolution.
              - title: Decide what should happen when an insert meets existing data
                brief: State whether a conflicting business key should reject the operation, preserve
                  the existing row or update selected values, then choose documented SQL for that
                  outcome. In one consolidated comparison, use PostgreSQL conflict-handling INSERT
                  for the key-based case and introduce MERGE only where matching source and target
                  rows genuinely calls for different actions. Check the relevant uniqueness rule,
                  null policy, duplicate source keys, update expressions and returned or affected
                  rows. Identify version and dialect limits at first use. Do not equate MERGE, upsert
                  and a read-then-write sequence or infer common concurrent-insert guarantees from
                  similar syntax; link to the transaction branch when competing writers determine
                  correctness. Leave request deduplication to application integration.
              - title: Inspect what changed inside a bounded transaction
                brief: Extend the parent's BEGIN, COMMIT and ROLLBACK workflow with assertions about
                  target keys, returned values and final database state. Explain precisely what the
                  chosen engine's affected-row count and RETURNING output establish, including an
                  update assigning the existing value and a conflict action that changes no row.
                  Avoid inferring all dependent or trigger effects from a direct row count; inspect
                  the relevant postconditions. Exercise a constraint rejection and the documented
                  transaction state afterwards, then restore a usable session. Treat generated identifiers
                  and other effects according to documented rollback behaviour rather than assuming
                  rollback rewinds everything. Inspection before commit does not replace commit acknowledgement
                  or concurrency reasoning; link those decisions to transactions and application
                  integration.
              - title: Prove the change against awkward inputs
                brief: Finish with a compact executable exercise that combines a source-driven change
                  and its insert-or-update policy, requiring expected target keys and postconditions
                  before execution. Reuse fixtures for no match, one match, several intended matches,
                  a null-sensitive predicate, duplicate source matches and a constraint violation.
                  Compare predicted and observed returned rows and final state, rolling back the
                  disposable exercise after inspection. Separate this single-session evidence from
                  a claim about concurrent correctness or acceptable execution cost. Point readers
                  to transactions for invariants, performance for expensive changes, evolution for
                  live backfills and corrections, and application integration for request outcomes
                  and retries. Stop before teaching those procedures again.
        - title: Check the answer before trusting the query
          brief: Finish the outstanding-orders task with an explicit expected result and repeatable
            setup, query and reset steps. Use a compact fixture set covering empty inputs, absent
            relationships, duplicate details, nulls, ties, boundary timestamps and zero or multiple
            update matches; children test the additional failure cases they introduce. Compare row
            multiplicities and types as well as values; compare order only when promised. Check each
            intermediate result and a few independent totals or invariants rather than accepting
            one attractive sample output. Establish that passing correctness checks does not establish
            acceptable execution cost, and link to the performance branch when the answer is correct
            but too expensive.
  - title: Transactions and competing buyers
    anchor: a-transaction-protects-a-change-within-a-stated-contract
    brief: Group the example's related updates into a transaction and distinguish commit from rollback.
      Use two customers buying the last item to show why a transaction boundary alone does not specify
      every concurrency guarantee. Introduce isolation, constraints and the durable-commit contract
      as questions the application must answer, with engine and configuration differences made explicit.
      Explain that a payment provider lies outside a local database transaction.
    nested_article:
      topic: Relational transactions and application correctness
      title: Making concurrent changes correct
      brief: Teach practitioners to state application invariants, choose transaction boundaries and
        preserve those invariants under concurrent execution and failures. Connect isolation anomalies
        to locking, versioned reads, conflict detection, constraints and serialisation, using labelled
        illustrative schedules and verified engine behaviour. Develop practical choices among atomic
        statements, conditional changes, locks and stronger isolation, including deadlocks, retries
        and uncertain commit outcomes. Explain the database's durability boundary and the limit of
        transactions across external effects; leave detailed client integration and service recovery
        procedures to their respective articles.
      heading:
        - title: Start with the fact that must remain true
          brief: Use a reservation example to express a precise rule about remaining capacity, reservations
            and ownership. Separate an invariant from a convenient sequence of application steps,
            and name every writer that could affect it. Establish the invariant and acceptable outcomes
            before choosing SQL or an isolation level.
          heading:
            - title: Put the complete change inside a boundary
              brief: Decide which related changes must succeed or fail together. Explain commit,
                rollback and visibility through a successful reservation and a failed one; distinguish
                atomicity from protection against concurrent decisions. Include transaction lifetime
                and savepoints only as needed to explain which work a rollback undoes, leaving connection
                and request handling to integration.
            - title: Let the database reject invalid states where it can
              brief: Map suitable invariants to keys, uniqueness, references and checks, while distinguishing
                their scope from rules over several rows or external facts. Show why an application
                pre-check is not itself enforcement. Refer to data design for constraint syntax and
                modelling, and to schema evolution for deploying constraints on a live database.
        - title: Two correct-looking transactions can make an incorrect result
          brief: Interleave two reservation attempts and compare their reads, decisions and writes
            against the stated invariant. Introduce a labelled illustrative schedule with explicit
            initial state, transaction boundaries and outcomes. Make the difference between this
            model and an observed engine execution unmistakable.
          heading:
            - title: The protection must cover the decision as well as the write
              brief: Explain stale read-modify-write decisions and lost changes, then use a multirow
                staffing rule to reveal a failure that separate row updates cannot expose. Introduce
                read dependencies, predicates and newly matching rows through these decisions rather
                than as a catalogue of anomaly names.
            - title: A repeatable view does not by itself prove the rule
              brief: Distinguish a statement's view, a transaction's view and a serialisable execution
                contract. Explain serial equivalence using the example and separate that guarantee
                from real-time ordering and the freshness of a particular read. State which observations
                and aborts would change the application's reasoning.
        - title: Choose protection for the invariant you actually have
          brief: Develop a worked decision sequence from a single counter to a uniqueness rule and
            then a rule spanning rows. For each choice, identify the protected fact, the database
            guarantee it relies on, competing writers and the observable success or failure result.
            Prefer the simplest argument that covers every writer.
          heading:
            - title: Express a change and its condition together
              brief: Replace a separate read and overwrite with an atomic expression or a conditional
                change. Explain checking the affected rows or returned result, version tokens and
                concurrent conflict behaviour. Distinguish a failed business condition from a transaction
                abort and avoid implying one row's condition protects an unrelated aggregate.
            - title: Coordinate decisions that span several rows
              brief: Compare locking a stable coordination row, locking the relevant existing rows
                and requesting serialisable execution. Explain why the chosen rows or predicates
                must cover every way the rule can be broken, including new rows and writers using
                another code path. Introduce the deeper lock design work after making this coverage
                argument concrete.
              nested_article:
                topic: Relational locking and concurrency protocols
                title: Designing changes that coordinate with locks
                brief: Teach practitioners to construct and assess explicit locking protocols for
                  relational invariants that ordinary constraints or a conditional row change cannot
                  express. Develop one reservation-capacity example using PostgreSQL at a stated
                  isolation level, with primary-source checks and reproducible sessions required
                  before presenting engine behaviour as established. Cover existing and missing rows,
                  inserts, coordination rows, lock modes, acquisition order, waiting and deadlocks.
                  Finish with an argument covering every writer and a two-session check. Link to
                  isolation for interpreting engine contracts and to application integration for
                  retry machinery; do not expand into a queue or lock catalogue.
                heading:
                  - title: Identify the decision that needs protection
                    brief: Start from a reservation rule whose decision reads several rows before
                      inserting or changing a reservation. Reuse the parent's capacity example and
                      show the uncovered interleaving in a labelled illustrative schedule. State
                      the invariant, the decision's scope and the read-to-change interval that needs
                      protection. Explain briefly why the available constraint or conditional single-row
                      change does not settle this version of the rule, referring to the parent for
                      the general choice of protection.
                  - title: Cover every change that could invalidate the decision
                    brief: 'List the paths that reserve, cancel, move reservations, change capacity,
                      delete resources or perform administrative corrections. Map each to the state
                      it can invalidate and the coordination it must acquire before doing so. Distinguish
                      locking existing rows from preventing new qualifying rows: a predicate''s current
                      result is not itself a complete coverage argument. Include an empty result
                      and an absent resource as adversarial cases. Explain that range or predicate
                      protection needs a specific engine contract; do not infer it from the presence
                      of a locking clause.'
                  - title: Give the invariant a stable coordination row
                    brief: Construct the running protocol around an existing resource row shared
                      by every writer that can affect its capacity rule. Define how that row is created,
                      retained and found, and what happens when it is absent; a failed lookup must
                      not silently authorise an unprotected insert. Put acquisition before the protected
                      decision and mutations. For the selected PostgreSQL isolation setting, verify
                      when the capacity and reservation reads see a writer that committed while this
                      transaction waited. Make the needed fresh read or recheck explicit rather than
                      assuming that acquiring a lock repairs a stale snapshot. State which operations
                      may avoid coordination because they cannot violate the invariant, with a reason
                      for each exception.
                  - title: Choose the lock and keep it through the decision
                    brief: Use the selected engine's documented compatibility and lifetime rules
                      to choose a mode that makes competing protocol participants conflict. Verify
                      interaction with the actual updates, deletes and references in the example;
                      teach only the modes needed to assess it. Distinguish waiting for another holder
                      from reading previously visible data. Trace acquisition, decision, changes
                      and commit or rollback, including the relevant failure and savepoint boundaries
                      if the example uses them. Shorten the protected interval by moving unrelated
                      computation and external calls outside it, while keeping every prerequisite
                      read and change inside its protection.
                  - title: Acquire several resources in a consistent order
                    brief: Extend the same example to moving a reservation between resources. Show
                      an illustrative wait cycle when two transactions acquire them in opposite orders,
                      then define a canonical order and explicit acquisition procedure that all participating
                      paths follow. Do not equate SQL result ordering with a verified lock acquisition
                      contract. Explain that constraints, implicit locks and other paths can still
                      introduce deadlocks; verify the selected engine's victim and transaction-state
                      behaviour. A known abort requires abandoning the failed attempt and reconsidering
                      the transaction, with client retry policy delegated to application integration.
                  - title: Decide what waiting and skipping mean for the application
                    brief: 'Explain how a coordination row becomes a contention point and how a long
                      holder increases waiting. Relate bounded work, lock-wait limits and refusal
                      to wait to the operation''s success or failure contract, without teaching general
                      workload tuning. Use one optional claim example only to explain what skipping
                      locked candidates changes: an empty claim result cannot by itself establish
                      that no eligible work exists, and skipped work does not establish ordered processing.
                      Verify the selected syntax and behaviour. Stop before leases, worker recovery,
                      queue scheduling or retry algorithms.'
                  - title: Check the protocol with two sessions and an all-writers argument
                    brief: 'Provide a reproducible worksheet with schema, initial rows, exact statement
                      order, pause points, assertions and cleanup. Record engine version, isolation
                      and relevant settings, and distinguish expected illustrative schedules from
                      recorded observations. Exercise the unprotected race, the protected wait followed
                      by a fresh decision, an initially empty reservation set, an insert path and
                      the reversed-order deadlock. Check the final invariant as well as returned
                      results and errors. Finish with a compact correctness argument: all conflicting
                      writers coordinate on the same stable identity, acquisition precedes the relevant
                      reads, those reads have the required visibility, protection lasts through the
                      change, and rollback leaves no partial result. Identify bypass paths that invalidate
                      this argument. Passing selected runs supports the argument but does not prove
                      coverage of every possible writer.'
        - title: Understand the isolation contract behind the choice
          brief: Connect versioned reads, locking and conflict detection to what a transaction can
            observe, which writes can proceed and when a transaction must wait or abort. Establish
            that an isolation name is insufficient evidence for the selected engine's behaviour;
            show how to read its contract and check an example before relying on it.
          heading:
            - title: Versions and locks answer different questions
              brief: Trace a reader and a writer through a minimal versioned example. Explain snapshot
                selection, visibility and concurrent write arbitration without claiming that versioned
                reads eliminate locks. Distinguish ordinary reads from locking reads and account
                for statement boundaries and predicate coverage when assessing a decision.
            - title: Stronger isolation can reject a result instead of waiting
              brief: Relate serialisable guarantees to preventing or detecting incompatible dependencies.
                Explain why a valid application transaction can be aborted and why successful execution
                of individual statements does not establish eventual commit. Introduce deeper comparison
                only where the implementation changes the concurrency protocol or required failure
                handling.
              nested_article:
                topic: Relational isolation guarantees and implementations
                title: Reading and testing isolation guarantees
                brief: Teach relational practitioners to turn an engine's documented isolation contract
                  and reproducible concurrent sessions into a justified choice of protection and
                  abort handling. Reuse a reservation invariant to trace snapshot visibility, locking
                  reads and concurrent changes, then introduce a staffing invariant only to expose
                  a distinct multirow dependency. Compare PostgreSQL and MySQL InnoDB only where
                  a verified difference changes the application decision. Distinguish snapshot isolation,
                  serialisability and real-time ordering. Label illustrative schedules separately
                  from observed runs; record engine version, settings, observations and the limited
                  conclusions each run supports. Link to the locking article for protocol construction
                  and to application integration for retry machinery. Stop at the implementation
                  depth needed to use relational transactions correctly.
                heading:
                  - title: Turn an isolation name into a contract
                    brief: Start with the reservation invariant and the observations a transaction
                      uses to decide whether to accept a booking. Read the selected engine's primary
                      documentation for the exact version, isolation setting, transaction mode and
                      statement forms. Extract when reads become visible, which conflicting changes
                      wait or fail, and what a successful commit promises. Treat the isolation-level
                      name as an entry to that contract rather than a portable list of guarantees.
                      State which assumptions belong to the database and which require every writer
                      to follow an application protocol; link to the parent for choosing that protocol.
                  - title: Establish when the transaction sees a change
                    brief: Use a two-session reservation schedule to compare two ordinary reads separated
                      by another transaction's commit. Trace statement and transaction snapshots
                      and the transaction's own changes, identifying when the snapshot is established
                      rather than assuming BEGIN fixes it. Compare selected PostgreSQL and InnoDB
                      settings only where the resulting visibility changes the booking decision.
                      Explain versioned reads just far enough to show why a stable view need not
                      reserve the data being read. Keep long-lived snapshot resource costs with performance
                      and operations.
                  - title: Read and update can consult different states
                    brief: Extend the same schedule with a locking read and a concurrent update.
                      Predict which operation waits, which row version or condition it can use after
                      the competing transaction finishes, and whether it can abort instead of proceeding.
                      Verify the relevant engine and statement behaviour before deriving an obligation.
                      Include a conditional capacity change so readers distinguish a checked atomic
                      change from an earlier ordinary read followed by an unguarded write. Examine
                      a mixed ordinary-read and locking-read transaction where that distinction affects
                      the result; do not imply that every statement in a transaction necessarily
                      consults one common view. Link to the locking article for choosing protected
                      rows, lock modes, acquisition order and deadlocks.
                  - title: A consistent snapshot can still permit an invalid combination
                    brief: Introduce the staffing rule that at least one person must remain available.
                      Let two transactions read the same qualifying set and change different rows;
                      draw the read/write dependencies that make their combined outcome impossible
                      in a serial execution. Explain why preventing conflicting writes to one row
                      does not by itself protect a predicate or multirow invariant. Use this case
                      to distinguish snapshot isolation from serialisability, then relate an insert
                      into a previously read predicate to the same coverage question without adding
                      an anomaly catalogue. Show why row-repeatability alone is insufficient evidence
                      for the application's guarantee.
                  - title: Serialisability protects an outcome by ordering or rejection
                    brief: Apply the selected engines' documented serialisable contracts to the staffing
                      schedule. Explain only the implementation detail needed to understand the observed
                      choice between blocking and conflict detection; distinguish a dependency-tracking
                      mechanism from a lock that blocks a writer. Derive the obligation to reconsider
                      and rerun the whole database transaction after a relevant known abort, including
                      reads and decisions, rather than retrying only the rejected statement. A particular
                      failed run neither identifies every possible victim nor guarantees every repetition
                      will abort. Link to application integration for retry limits, deadlines and
                      external effects, and to the parent for the distinction between a known abort
                      and an unknown commit outcome.
                  - title: A serial order does not establish a real-time order
                    brief: Use a compact timeline to distinguish equivalence to some serial execution
                      from a guarantee that also respects completed-before-started operations. Explain
                      why an application's claim about an earlier acknowledgement and a later observation
                      needs an explicitly documented ordering and read-path guarantee. Do not infer
                      such a guarantee merely from the word serialisable, a timestamp or an experiment.
                      Keep distributed replication and stronger cross-service ordering analysis with
                      their owning articles.
                  - title: Build a repeatable check and state what it proves
                    brief: Assemble the earlier cases into a small disposable two-session worksheet
                      with schema, seed rows, explicit transaction settings and ordered session steps.
                      Coordinate the interesting interleaving through visible checkpoints rather
                      than timing guesses. Record exact engine version, relevant settings, statements,
                      returned rows, blocking, errors, commit results and the final invariant check;
                      identify each expected result separately from an observed run. Pair observations
                      with version-matched primary documentation in a compact comparison that ends
                      in a concrete choice of protection or whole-transaction retry obligation. Include
                      an adversarial interleaving and a changed query or insert that challenges the
                      conclusion. Explain that a passing schedule can expose a counterexample but
                      cannot prove safety for all executions; finish with the contract-based argument
                      covering the reads, writes and assumptions the application actually uses. Recheck
                      relevant cases when an engine upgrade, setting or query changes.
        - title: An aborted transaction must be reconsidered as a whole
          brief: Follow a deadlock and a serialisation conflict to rollback, identifying which earlier
            reads and decisions must be repeated. Explain consistent lock order, bounded transaction
            duration and the limits of deadlock avoidance. Distinguish business rejection, known
            abort and a failure whose commit outcome is unknown; make the database guarantee the
            basis of the decision to retry.
          heading:
            - title: Retrying one statement can preserve a stale decision
              brief: Show why repeating only the failed write can reuse assumptions that no longer
                hold. Establish the whole-transaction retry requirement where the engine's contract
                calls for it, including rechecking the invariant, while linking to application integration
                for retry limits, backoff, deadlines, idempotency and driver-specific error handling.
            - title: Losing the reply does not prove rollback
              brief: Place connection loss before a commit request, during commit and after a successful
                commit to distinguish a known abort from an uncertain result. Explain why blindly
                repeating the business operation is unsafe when commit is unknown, and hand reconciliation
                and durable request identities to the application integration article.
        - title: Commit has a durability boundary and a system boundary
          brief: Explain why an acknowledged commit has meaning only under a stated durability and
            failure contract. Introduce durable logging and recovery just far enough to separate
            committed work from in-memory state, then connect engine settings, storage and replication
            acknowledgement to the failures that may lose an acknowledged change. Link to operations
            for service choices and recovery tests.
          heading:
            - title: A database rollback cannot undo an external effect
              brief: Trace charging a payment or publishing a message before and after database commit,
                exposing both failure windows. Establish that a local transaction cannot make an
                independent service participate merely by calling it inside the transaction. Introduce
                recording intent with the database change and link to application integration for
                delivery, deduplication and reconciliation design; keep distributed transaction theory
                outside this article.
        - title: Check the argument with competing sessions and failures
          brief: 'End with a compact procedure: write the invariant and permitted outcomes, enumerate
            writers and competing schedules, name the exact engine guarantees, and run controlled
            concurrent sessions against a disposable database. Include contention, insert races,
            a known abort and an interrupted commit response. Check final state and application decisions,
            record version and settings, and explain that successful test runs support but do not
            replace the coverage argument. Revisit the initial reservation to justify the chosen
            protection and identify which application and operational responsibilities remain.'
  - title: From a request to a committed order
    anchor: the-application-is-part-of-the-database-system
    brief: Follow one request through a driver, a connection, statements and the returned result.
      Explain parameter binding, connection ownership, transaction lifetime and the difference between
      a database error and an unknown outcome after a broken connection. Show why request deadlines,
      retries and external effects must be designed together with the database contract.
    nested_article:
      topic: Relational application integration
      title: Building applications around a relational database
      brief: Follow an application request through its driver, connection, statements and transaction
        to the response and any external effects. Teach how to preserve values and authority at those
        boundaries, understand the SQL an abstraction performs, bound resource use and recover from
        failures with evidence about what completed. Build on the transaction article's correctness
        guarantees; deepen connection management, query composition, request recovery and external
        work only where their separate decisions need it.
      heading:
        - title: Follow one request across the boundaries
          brief: Trace an order placement from validated input through connection acquisition, bound
            statements, transaction completion and response delivery. Identify which component owns
            each step and where a successful database operation can outlive the request that started
            it. Use an explicitly illustrative timeline to distinguish application progress from
            evidence of database completion. Link to the transaction branch for atomicity, isolation
            and durability rather than deriving those guarantees again.
        - title: Preserve values and authority when sending SQL
          brief: Establish the driver as a boundary with an explicit conversion contract and an explicit
            database identity. Show how a plausible value or apparently safe query can change meaning
            before it reaches the database.
          heading:
            - title: Bind values and check their round trip
              brief: Explain parameter binding with a small query and distinguish values from SQL
                structure. Inspect the selected driver's handling of large integers, exact decimals,
                nulls, dates, timestamps and time zones; choose representations deliberately and
                test representative round trips. Make conversion and truncation failures visible.
                Treat prepared statement reuse and parameter syntax as implementation behaviour to
                verify, without turning this into a protocol catalogue.
            - title: Keep untrusted input out of SQL structure
              brief: Teach parameterised statements for values, allowlisted choices and supported
                identifier quoting for dynamic identifiers or sort clauses, and scrutiny of raw-query
                escape hatches. Distinguish input validation from injection prevention. Include ORM-generated
                and stored-routine calls in the same boundary reasoning rather than treating their
                names as guarantees of safety.
            - title: Give each application action the authority it needs
              brief: Separate authenticated application identity, database credentials and row-level
                authorisation. Show where tenant predicates or verified database policies must apply
                to reads and changes, including background jobs and raw queries. Keep administrative
                and migration authority out of ordinary request paths, and prevent sensitive values
                leaking into query logs. Link service credential, encryption and policy operation
                details to the operations branch.
        - title: Borrow a connection for bounded work
          brief: Establish that connections carry state and that a transaction must use the connection
            or transaction handle required by the driver. Keep user think time and unrelated network
            work outside its lifetime. Show acquisition, commit or rollback, result cleanup and release
            on success and error paths, with failed connections discarded according to the driver
            contract. Explain how long occupancy turns application concurrency into pool queues before
            introducing the focused diagnosis.
          nested_article:
            topic: Relational connection and transaction lifecycle management
            title: Managing connections and transaction lifetimes
            brief: Teach how to own a stateful database connection from acquisition to safe reuse
              or disposal, including exceptions, cancellation, streaming and shutdown. Separate application
              handles, pool leases, transactions and database sessions; verify their relationship
              against the chosen driver and any proxy. Diagnose occupied pools using acquisition
              wait, lease duration, active database work and connection counts, then bound admission
              and aggregate connection demand. Extend the parent's ordinary request example through
              resource failures rather than repeating it. Own cancellation and connection-reuse mechanics
              here; link to request recovery for deadlines, idempotency and decisions about uncertain
              operation outcomes, to transactions for correctness guarantees and to performance and
              operations for workload capacity and service budgets.
            heading:
              - title: Know what a borrowed handle owns
                brief: Draw the ownership chain from application task through pool lease and driver
                  connection to database session, with a transaction and result stream attached to
                  their actual owner. Show why a convenient pool-level query call may acquire a different
                  connection each time, while a multi-statement transaction needs the affinity guaranteed
                  by its transaction handle or checked-out client. Verify implicit transaction and
                  autocommit behaviour, concurrent use restrictions and commit-on-context-exit behaviour
                  against the selected API; do not infer them from similarly named methods in another
                  driver. Use PostgreSQL with one pinned driver as the concrete case, distinguishing
                  its behaviour from the general ownership questions. The node-postgres transaction
                  documentation supplies one explicit same-client example at https://node-postgres.com/features/transactions.
              - title: Return only a connection that is ready for another borrower
                brief: 'Extend the parent''s success and error path into a small resource-state diagram:
                  waiting, acquired, in use, cleaning up, reusable or discarded. Give each lease
                  one owner and one terminal release or discard, including failures during begin,
                  execution, rollback and cleanup. Await completion and required result draining
                  before reuse; finish or roll back an open transaction through the chosen API, and
                  distinguish a clean idle session from one in a failed transaction. Preserve the
                  original operation error while recording cleanup failure. Explain what the pool
                  actually resets on return and when broken protocol, failed cleanup or uncertain
                  connection state requires disposal. Resource disposal does not settle an operation''s
                  commit outcome; hand that question to request recovery.'
                heading:
                  - title: Cancellation is a cleanup sequence
                    brief: Follow cancellation while waiting for a lease, executing a statement and
                      cleaning up. Verify whether cancelling acquisition removes the queued waiter;
                      prevent a late acquisition from becoming an unowned lease. Distinguish a cancellation
                      request from observed command termination, then await the driver's completion
                      and protocol synchronisation requirements, roll back when needed and release
                      or discard. Keep required cleanup alive when the caller's task is cancelled,
                      using the runtime's supported mechanism and a bounded cleanup allowance; never
                      return a connection while work or results still belong to the old borrower.
                      Use the chosen driver's documentation and PostgreSQL's cancellation contract
                      at https://www.postgresql.org/docs/18/libpq-cancel.html as implementation evidence,
                      without presenting libpq calls as another driver's API. Request recovery owns
                      interpreting timeouts and deciding whether to retry or reconcile.
              - title: Match session state to the pooling mode
                brief: Compare a direct connection, an application pool and a transaction-pooling
                  proxy only where they change state ownership and reuse. Track temporary settings,
                  role or tenant context, temporary objects, prepared statements and cursors across
                  transaction end and lease return. Prefer transaction-scoped state when supported,
                  verify reset guarantees and discard when safe isolation between borrowers cannot
                  be established. Distinguish SQL-level preparation from protocol-level preparation
                  and driver statement caches; support depends on proxy version and configuration.
                  Use a compact compatibility example from https://www.pgbouncer.org/features.html
                  and the selected driver's documentation, rather than a universal claim that transaction
                  pooling preserves or forbids all prepared statements. Keep authorisation design
                  in the parent and query-plan behaviour in performance.
              - title: Keep result consumption inside the resource lifetime
                brief: Show a slow consumer holding a cursor, transaction or leased connection after
                  database execution has produced rows. Make stream ownership explicit through full
                  consumption, early loop exit, consumer error and disconnect. Close or cancel the
                  stream, await the driver's required draining or acknowledgement, close its transaction
                  where applicable and only then return the lease. Verify cursor lifetime and fetch
                  buffering for the selected API; do not assume all streaming APIs retain the same
                  resources. Bound consumer hold time and choose bounded materialisation or shorter
                  retrieval units only when their result semantics allow it, linking query composition
                  and SQL for those choices. Explain the retained connection and open-transaction
                  consequences without reteaching snapshot or retained-version mechanics.
              - title: Bound demand before enlarging the pool
                brief: Separate admitted application work, queued acquisition, leased client connections,
                  proxy queues and database sessions. Bound the acquisition queue and wait, shed
                  work when it cannot obtain a lease within the caller's supplied budget and avoid
                  holding a lease across unrelated external calls. Allocate a connection allowance
                  across application replicas, overlapping deployments, background workers and distinct
                  pools, leaving the operational reserve supplied by operations. Show an explicitly
                  illustrative aggregate-count example; behind a proxy distinguish frontend client
                  counts from backend database-session limits. An increased pool is a hypothesis
                  to validate against completed work and contention, not a default response to waiting.
                  Link performance for concurrent-load diagnosis and operations for selecting service
                  capacity and reserve; do not derive another sizing theory.
              - title: Find where the lease time goes
                brief: Correlate acquisition wait and timeout counts, queue depth, leased and idle
                  counts, lease-duration distributions and database-session activity for one request
                  or worker. Use contrasting traces to distinguish a missing release, idle open transaction,
                  slow result consumer, slow or blocked SQL, exhausted admission and stale idle connection;
                  high occupancy alone does not identify the cause. Separate executing database time
                  from application time while holding the lease, and account for proxy-side waiting
                  where present. Put borrower identity and transaction age alongside counts so an
                  investigation can find the owner. Repair ownership or cleanup defects here; hand
                  SQL and workload bottlenecks to performance and service-wide incident response
                  to operations. Verify driver behaviour on idle disconnects and replacement so validation,
                  connection lifetime settings and reconnect handling do not become assumptions that
                  a successful borrow proves the next statement will succeed.
              - title: Prove cleanup across failures and shutdown
                brief: Use a tiny real-driver pool to expose leaks quickly. Inject a statement error,
                  cancellation during acquisition and execution, early stream termination, failed
                  rollback and connection loss; after each case check that every lease has returned
                  or been discarded, no abandoned transaction remains and the next borrower receives
                  usable state without the previous borrower's settings. Record driver, database
                  and proxy versions and configuration, distinguishing captured behaviour from the
                  explanatory state diagram. For shutdown, stop admission and background acquisition,
                  let owners finish within a bounded grace period, clean up or close remaining connections
                  through the documented API and await pool closure. Test that a leaked lease cannot
                  make shutdown wait indefinitely. Keep uncertain business outcomes discoverable
                  for the request-recovery owner rather than treating successful process exit as
                  proof of transaction completion.
        - title: Make the abstraction's database work visible
          brief: Compare an explicit query with an ORM operation that appears equivalent. Count statements,
            round trips, returned rows and materialised objects; identify implicit reads or writes
            and transaction boundaries. Establish that object convenience does not remove the need
            to understand the SQL and its result semantics. Link execution-plan diagnosis to the
            performance branch after identifying the application operation that generated the work.
          nested_article:
            topic: Relational query composition and ORM behaviour
            title: Controlling the queries your application performs
            brief: Make handwritten SQL, query builders and ORM operations accountable for the database
              work a request performs. Use one bounded order-list example to trace statements, round
              trips, returned rows and materialised objects; diagnose lazy loading, N+1 reads, joined
              collection multiplication and implicit writes. Choose projections, loading strategies
              and batch sizes that preserve the required result while bounding application work.
              Inspect pagination and streaming at the abstraction boundary, preserve binding and
              authorisation during composition, and test representative query and result bounds against
              the selected database and library. Build on the parent's ordinary request and security
              explanation; leave SQL semantics, physical execution tuning, connection cleanup and
              request recovery with their existing owners.
            heading:
              - title: Trace one request to its actual statements
                brief: Start with an order-list endpoint that displays a bounded set of orders, their
                  customer names and item summaries. Write down the required response before comparing
                  equivalent SQL, query-builder and ORM expressions. Capture the statements actually
                  executed across request handling and response serialisation, with correlation to
                  the request and transaction. Record statement count, database round trips, rows
                  returned and objects retained separately; an abstraction call is not a measurement
                  of any of these. Explain safe parameter observation through redacted values and
                  types, and label invented traces as illustrations rather than observed behaviour.
              - title: Find the reads hidden behind object access
                brief: Follow the endpoint through its initial order query, customer access and item
                  iteration. Show how a serializer or template can trigger additional reads after
                  the apparent query has completed. Vary the number of parent records to expose repeated
                  per-record loading, distinguishing it from a fixed set of intentional queries.
                  Account for already-loaded relationships and identity-map reuse so a warm session
                  does not hide the cold-request behaviour. Use explicit loading boundaries or supported
                  checks against unexpected lazy loads where they make the request's work predictable.
              - title: Choose a loading shape for the response
                brief: Compare a direct projection, a joined load and separate batched relationship
                  queries for the same response. Count SQL rows, distinct entities and final response
                  items rather than treating them as interchangeable. Include empty relationships
                  and an order with many items to check meaning as well as work. Choose the shape
                  from needed fields, relationship cardinality, round trips and transfer or allocation
                  limits, rather than declaring one loading strategy universally best.
                heading:
                  - title: See what joined collections multiply
                    brief: Extend one order with two independent collections and trace the rows returned
                      by their joined load. Verify how the selected library reconstructs entities
                      and collections, including duplicate handling; deduplicated objects alone do
                      not establish bounded transferred rows. Show when fetching the collections
                      separately keeps the response's meaning while reducing repeated data. Link
                      join semantics to the SQL owner and expensive execution to performance.
                  - title: Bound separate loads and batches
                    brief: Fetch relationships for a bounded set of authorised parent identifiers,
                      then attach them to the correct parents while retaining empty collections.
                      Make parameter and batch limits explicit for the selected database, driver
                      and library. Compare the resulting fixed batches with per-parent reads, and
                      state how several statements interact with the request's required view of changing
                      data. Use the transaction branch's guarantees when one consistent view is required;
                      do not derive them again here.
              - title: Keep pages and streams bounded through materialisation
                brief: Translate the SQL branch's chosen page and ordering contract through the application
                  abstraction. Inspect whether a collection load or deduplication changes which parent
                  records a limit applies to; where needed, select the bounded parent page first
                  and load its related data afterwards. Bound child cardinality and response size
                  as well as parent count. For a large sequential export, verify whether iteration
                  actually limits driver buffering, object tracking and application retention. Show
                  how processing in chunks can still retain every object accidentally. Identify the
                  connection and transaction ownership that streaming requires and link cleanup and
                  slow-consumer handling to the connection article. Do not introduce another pagination
                  or cursor curriculum.
              - title: Inspect the writes and transactions an abstraction introduces
                brief: Change a tracked object before issuing an apparent read and capture whether
                  the selected ORM flushes pending writes, when the transaction begins and which
                  connection executes each statement. Contrast flush with commit using the existing
                  transaction guarantees. Inspect generated writes, optimistic concurrency conditions
                  where configured, and whether bulk or raw-SQL operations leave tracked objects
                  stale. Verify the selected library's documented behaviour and version rather than
                  generalising across ORMs. Keep transaction ownership explicit across helper calls;
                  leave transaction lifetime cleanup and recovery from errors to the neighbouring
                  articles.
              - title: Preserve binding and authority as queries are composed
                brief: Apply the parent's parameter-binding and authorisation rules to reusable filters,
                  relationship loaders and query fragments. Trace the tenant or owner restriction
                  through the initial query, separate relationship loads, counts and mutations, including
                  a caller-supplied identifier from another tenant. Verify that raw fragments keep
                  values bound and that dynamic SQL structure uses an allowed selection. Check how
                  optional filters, aliases and global scopes compose instead of assuming a query
                  builder supplies the request's authority. Link SQL null and predicate semantics
                  to their owner rather than reteaching expression rules.
              - title: Test the generated work as part of the operation's contract
                brief: Run representative integration tests through the real database, driver and
                  abstraction, including response serialisation. Seed no related rows, ordinary rows,
                  many parents, a high-cardinality child collection and cross-tenant identifiers.
                  Assert response meaning, allowed statement or round-trip bounds, transferred or
                  materialised result bounds where observable, and absence of unexpected writes;
                  vary parent count so an N+1 regression cannot pass on a one-row fixture. Use library-specific
                  expected ranges when batching changes counts, and avoid brittle full SQL string
                  snapshots as the sole evidence. Recheck after loading changes or dependency upgrades.
                  Hand a small number of individually costly statements and their parameters to the
                  performance investigation rather than treating a low query count as proof of efficiency.
        - title: Recover according to what the application knows
          brief: Distinguish a rejected operation, a confirmed transaction abort and an operation
            whose outcome is unknown to the caller. Use a lost response after a possible commit to
            explain why repeating the request can repeat its effect. Relate request deadlines, cancellation
            and retries to the actual driver and database contract, using the transaction branch's
            failure distinctions as the starting point.
          nested_article:
            topic: Relational request deadlines, retries and idempotency
            title: Recovering database requests safely
            brief: Design a bounded application request across pool acquisition, statements, transaction
              completion and response delivery. Decide what may be repeated from evidence about the
              database outcome, then give a logical operation a durable identity so overlapping attempts
              and lost responses can be resolved safely. Keep deadline budgets, retry eligibility,
              idempotency records and reconciliation within one operation contract. Build on the
              transaction branch's guarantees; link connection cleanup mechanics and external-effect
              recovery to their owners.
            heading:
              - title: Separate the request from the operation
                brief: 'Reuse the parent''s order-placement example after its ordinary successful
                  path. Give the logical order operation a stable identity and distinguish it from
                  each transport request and database transaction attempt. Follow one lost response
                  through three possible histories: no transaction began, the transaction aborted,
                  or the order committed without the caller learning its result. Use an explicitly
                  illustrative timeline to establish what each observer knows. Link the transaction
                  branch for the underlying commit and abort guarantees rather than deriving its
                  concurrency theory again.'
              - title: Spend one deadline across the whole request
                brief: Allocate an end-to-end deadline across admission, pool acquisition, statements,
                  transaction completion and response delivery. Derive each stage's allowance from
                  time remaining and reserve time for completion and recovery. Distinguish stopping
                  synchronous waiting from proving that the operation has stopped; any accepted work
                  allowed to outlive its caller needs a bounded lifecycle and a discoverable result.
                heading:
                  - title: Establish what each timeout actually limits
                    brief: Compare application waiting limits, driver timeouts and server-side statement
                      or transaction limits for the selected database and driver. Verify their scope,
                      when their clocks start, which error or completion evidence reaches the caller,
                      and whether commit is covered. Do not infer rollback from a client timeout,
                      cancellation request or connection loss. Treat cancellation delivery and a
                      confirmed database response as different observations. Refer connection draining,
                      reset and discard mechanics to the connection-lifecycle article; this article
                      decides whether the logical operation may proceed or be repeated.
                  - title: Keep retries inside the remaining budget
                    brief: Include acquisition, execution and bounded backoff in one deadline and
                      attempt budget. Use jitter and admission limits to avoid synchronised retry
                      demand; stop when a useful attempt cannot fit. Identify one retry-owning layer
                      and account for automatic driver or framework retries so attempts do not multiply
                      invisibly. A caller deadline ending is a reason to stop waiting, not evidence
                      that another attempt is safe.
              - title: Choose the next action from outcome evidence
                brief: Build a compact decision table from the chosen implementation's documented
                  error codes and transaction state. Separate permanent request or constraint failures,
                  confirmed aborts eligible for retry, and unknown outcomes needing operation lookup
                  or reconciliation. Record whether work was sent, whether abort or commit was confirmed,
                  and whether the connection remains usable under the sibling article's contract.
                  A transient-looking network error alone does not establish retry safety.
                heading:
                  - title: Repeat the complete logical transaction when required
                    brief: Use a confirmed serialization failure or deadlock victim as a bounded
                      example. Re-run all reads, decisions and writes that belong to the transaction
                      using fresh transaction state, subject to the application's retry policy. Keep
                      stable request intent and operation identity while recomputing decisions that
                      depended on database state. Verify actual database and driver error semantics;
                      do not assume every statement error aborts the whole transaction. Avoid replaying
                      external calls inside the retry body and link their recovery to the external-work
                      article.
              - title: Make the operation identity part of the data contract
                brief: Develop one idempotent order-placement design whose duplicate attempts can
                  return the same committed business result. Define which effects the contract covers
                  and what the caller should do while the result is still unresolved. Explain why
                  a key alone does not make an operation idempotent; correctness depends on scope,
                  request equivalence, concurrent claims, atomic changes, retained results and expiry
                  working together.
                heading:
                  - title: Define the key and the request it identifies
                    brief: Scope the unique key to the authenticated tenant or principal and operation
                      kind, and require the caller to reuse it for the same logical operation. Preserve
                      authorisation when looking up a result. Compare a canonical fingerprint of
                      the meaningful request fields so a reused key with different intent fails explicitly.
                      Decide which fields are excluded and how canonicalisation or API version changes
                      affect equivalence. A new key starts a new operation and cannot resolve an
                      unknown earlier attempt.
                  - title: Commit the claim, business change and result together
                    brief: Sketch a minimal operation table with a scoped unique key, fingerprint,
                      stable business identifier and retained result. Use one transaction for claiming
                      the key, making the relational business changes and storing the result, so
                      rollback removes them together and commit makes them discoverable together.
                      Use a uniqueness constraint and the transaction branch's mechanisms to arbitrate
                      concurrent attempts; avoid an application-side check followed by an unprotected
                      insert. Walk through two overlapping requests with bounded conflict waiting,
                      post-conflict lookup and fingerprint comparison. Verify the selected isolation
                      level's visibility and conflict behaviour rather than assuming the losing attempt
                      immediately sees a committed record.
                  - title: Return a retained result and define its lifetime
                    brief: Retain the stable result or sufficient committed data to reconstruct the
                      promised response, including expected business rejection results if the operation
                      contract requires them. Distinguish that result from per-attempt diagnostics.
                      Define how long callers may retry or query, how cleanup handles active or unresolved
                      work, and what a late request means after expiry. Show that deleting the only
                      duplicate evidence can allow an old operation to execute again; retain an identity
                      or tombstone longer when the business rule needs it. Do not promise replay
                      protection beyond the stated retention and key-reuse contract.
              - title: Resolve an outcome that the caller did not receive
                brief: After a lost commit response, query by the same operation identity through
                  an authoritative path with appropriate visibility. A matching committed record
                  supplies the result; a conflicting fingerprint is a request error. A missing record
                  is inconclusive while an earlier transaction may still be in flight or a replica
                  may lag. Re-enter only through the same atomic claim protocol, or keep the operation
                  unresolved until its status can be proved. Bound lookup and waiting attempts, expose
                  a stable status identity when resolution outlives the synchronous request, and
                  make unresolved cases discoverable for reconciliation. If separate durable pending
                  claims are introduced, require an explicit recovery protocol before allowing takeover;
                  an expired caller deadline or claim lease does not prove an old worker has stopped.
                  Link external systems' unknown outcomes to the external-work article instead of
                  extending the relational transaction's guarantee to them.
              - title: Test the failure windows around commit
                brief: 'Specify a small acceptance exercise against the selected real database and
                  driver: exhaust acquisition time; cancel during execution; force a confirmed retryable
                  abort; cut the connection before and after commit; suppress the response after
                  a known commit; and submit simultaneous requests with matching and conflicting
                  fingerprints. Include a request whose first attempt outlives its caller and a late
                  duplicate near retention expiry. Assert the number of committed business effects,
                  retained results, bounded attempts and eventual resolution, alongside connection
                  handling supplied by its owning article. Capture database evidence that distinguishes
                  a confirmed commit from an injected network failure whose outcome remains unknown.
                  Label diagrams and local fault models as illustrative; record implementation versions
                  and the evidence actually observed, without claiming that a fault script proves
                  every network or cancellation interleaving.'
        - title: Make work beyond the transaction recoverable
          brief: Trace an order commit followed by a notification or payment call and show the separate
            failure windows. Establish that a durable record of intent can make unfinished work discoverable
            while the external effect still needs its own duplication and reconciliation rules. Introduce
            database jobs and database-derived events through the same concrete recovery problem,
            without expanding into a general messaging curriculum.
          nested_article:
            topic: Relational background work and external effects
            title: Connecting transactions to background work and events
            brief: Make work beyond a relational transaction discoverable and recoverable. Follow
              one committed order and its external fulfilment request through a transactional job
              or outbox record, worker ownership, repeated attempts and uncertain external outcomes.
              Compare direct calls and database change capture by their remaining failure windows.
              Bound event contracts, ordering, retention and replay to what is needed to account
              for committed intent; reuse transaction concurrency and request-idempotency mechanisms
              rather than deriving them again.
            heading:
              - title: Find the gap between committing and doing the work
                brief: Start with an order whose database change and external fulfilment call must
                  both happen. Trace a call before commit, a call after commit and a call held inside
                  an open transaction through database failure, process death and a lost response.
                  Separate the evidence that the database committed, that an external system accepted
                  the operation and that its outcome is known. Establish which synchronous calls
                  can tolerate their failure contract and when durable unfinished work is necessary.
                  Link to request recovery for the caller's unknown transaction outcome and retry
                  contract.
              - title: Commit the business change and the intent together
                brief: 'Use one order example throughout: create the order and a durable work record
                  in the same transaction. Give the work a stable operation identity and sufficient
                  immutable input or an explicit rule for reading later state. Explain why enqueueing
                  elsewhere after commit leaves a gap, and why a database job record or transactional
                  outbox closes that particular gap without completing the external effect. Distinguish
                  a job that a worker executes from an event that describes an agreed business fact,
                  while retaining the same atomic-intent mechanism. Define the application response
                  as accepted or pending when external completion is still outstanding.'
              - title: Claim work without keeping a transaction open during the call
                brief: 'Define pending, claimed, completed and failed or unresolved states using
                  ownership, attempt identity, lease expiry, next-attempt time and recorded outcome.
                  Show a short atomic claim transaction, an external call after the claim commits
                  and a conditional completion transaction. Reuse the transaction branch''s locking
                  or conditional-update mechanisms; verify the selected engine''s claim and competing-worker
                  behaviour. Recover abandoned claims after worker death, and reject completion from
                  an obsolete attempt. Explain that a lease can expire while an old worker is still
                  executing: database ownership protects database transitions but cannot by itself
                  stop an external effect. Keep retry attempts bounded and discoverable, with a deliberate
                  route for permanent failures and manual reconciliation.'
              - title: Make repeated attempts refer to the same operation
                brief: Follow external success followed by worker death before completion is recorded.
                  Reuse the stable operation identity across delivery attempts and distinguish it
                  from each claim's attempt identity. Check the receiver's deduplication scope, request
                  matching, retained outcome and expiry contract; link to the request-recovery article
                  for implementing atomic idempotency records. Where the receiver cannot suppress
                  repeats, choose authoritative outcome lookup, reconciliation, an acceptable repeated
                  effect or an explicitly unresolved state according to the business operation. Do
                  not describe a completed work record, lease or transport acknowledgement as proof
                  that an external effect occurred only once.
              - title: Give published records a meaning that survives delay
                brief: For an outbox publisher, define the event identity, business meaning, payload
                  owner and compatibility obligation before treating a row change as an integration
                  contract. Contrast an immutable event fact with a pointer to current state, showing
                  how delayed publication changes what a receiver can reconstruct. Introduce an order
                  version only when a business rule requires per-order sequence or stale-event detection;
                  check whether concurrent workers and retries preserve that required scope. Keep
                  global ordering and broker behaviour outside the article. Retain source records,
                  payload versions and deduplication evidence for the promised recovery and replay
                  interval, including how replay can repeat external effects.
              - title: Compare polling with database change capture
                brief: 'Compare polling the same outbox with capturing its committed changes, and
                  contrast both with publishing raw application-table changes. Keep the comparison
                  to the relational application''s contract: which committed changes are visible,
                  how initial capture joins ongoing changes, what a saved source position establishes
                  and what duplicates can follow restart. Require implementation-specific verification
                  of snapshot boundaries, transaction visibility, schema changes, position persistence
                  and source-log retention. Explain why capture moves the publication mechanism without
                  making external outcomes atomic with the original transaction. Do not expand into
                  capture connector administration or messaging internals.'
              - title: Recover the unfinished order from retained evidence
                brief: Close the worked case by locating an unclaimed record, an expired claim, an
                  external success with no recorded completion and a publisher that has stopped advancing.
                  Relate work age, attempts, recorded outcomes and source position to the next safe
                  action. For lost downstream progress, establish whether retained outbox records
                  or captured changes can reproduce the required work within the receiver's duplicate-handling
                  contract; when the history has expired, reconcile authoritative database state
                  or rebuild the required projection under a defined boundary. Leave general consumer
                  and broker recovery to their owners. Specify failure-injection observations around
                  commit, claim, external acceptance, completion and publication, and label illustrative
                  timelines separately from evidence obtained with the chosen database, worker and
                  receiver.
        - title: Test the complete application path
          brief: 'Assemble a compact acceptance exercise for the running order example: exact value
            round trips, cross-tenant attempts, bounded query counts, exhausted pools, leaked or
            cancelled work, concurrency conflicts, a lost commit response and repeated external delivery.
            Use a real selected database and driver for integration guarantees; label local simulations
            as models. Record the evidence needed to distinguish waiting for a connection, executing
            a statement, completing a transaction and finishing background work. Link deeper workload
            measurement and service incident response to their owning branches.'
  - title: The work behind a query
    anchor: correct-sql-still-has-to-do-physical-work
    brief: Compare finding an order by scanning rows with following an index, then show that reads,
      writes, joins and sorting compete for resources. Introduce plans, estimates and measured execution
      as evidence about that work. Explain why an index or more hardware is a hypothesis to test,
      and why performance includes tail latency and the effect on concurrent requests.
    nested_article:
      topic: Relational execution and performance
      title: Understanding and improving database performance
      brief: Teach a repeatable method for diagnosing relational workloads and making measured improvements.
        Build the necessary understanding of row and index storage, buffering, version retention,
        access paths, join methods, sorting, aggregation, statistics and optimiser choices. Read
        estimated and observed plans without confusing their units or treating estimates as execution
        evidence. Connect query shape, indexes, physical layout, maintenance and resource contention
        to workload latency, throughput and capacity. Choose and validate changes with representative
        data and concurrency, including write and operational costs; deepen engine internals only
        where they explain a diagnosis or intervention. Give the parent a complete ordinary diagnosis-to-measured-improvement
        loop. Tell readers to finish this article, including its concluding comparison method, before
        selecting an optional contextual investigation by the question their evidence raises.
      heading:
        - title: Start with the work people need to finish
          brief: 'State the reading contract first: complete this parent through the final comparison
            method before following its contextual links. The children are optional investigations
            selected by a concrete question, not a required sequence through storage, indexes, plans
            and concurrency. Follow an application''s growing order history through a slow customer
            lookup, a reporting query and concurrent order changes. Define acceptable latency, throughput
            and resource cost for each operation. Distinguish a frequent small cost from an occasional
            expensive request, and database execution from waiting for a connection, network transfer
            and application processing. Establish a baseline with query frequency, latency distributions,
            representative parameters, row counts and concurrent activity before choosing a remedy.'
        - title: Find where time and work accumulate
          brief: Move from an affected operation to evidence about execution, blocking, storage reads,
            CPU, temporary work and result transfer. Compare a query's typical and slow executions
            with changes in parameters, data size and concurrent work. Separate observations from
            hypotheses; a slow query or a busy resource does not by itself identify the limiting
            cause. Use the operations branch for service monitoring and incident procedures, and
            the integration branch for pool waits and excessive round trips.
        - title: Rows have a physical home and a lifetime
          brief: Establish the working model needed to explain why equal result sizes can require
            very different work. Introduce pages, row and index organisation, cached and uncached
            access, locality, row width and retained versions. Connect logical changes and long transactions
            to the physical work and retained space that a performance investigation must measure,
            while keeping durability and isolation guarantees in their owning branches. After completing
            the parent, choose the storage investigation when unexplained page traffic, working-set
            growth or retained space makes the physical organisation consequential.
          nested_article:
            topic: Relational physical storage and working sets
            title: How stored rows become physical work
            brief: Teach the physical model needed to explain page traffic, cache pressure and unreclaimed
              space in relational workloads. Follow one changing table through reads, wider rows,
              updates, retained versions and space reuse, connecting each mechanism to evidence and
              a possible intervention. Use selected PostgreSQL and InnoDB differences only when they
              change that diagnosis; verify the chosen version's behaviour against primary documentation.
              Keep row locators here only far enough to understand physical locality; the index article
              owns traversal, key order, coverage and the detailed secondary-index/base-row access
              path. Treat physical pruning as one measurable layout intervention. Link transaction
              semantics and operational reorganisation procedures to their owners, and use the parent's
              comparison method rather than teaching benchmarking again. Stop at the depth needed
              for relational engineering decisions, without a separate storage-engine or partitioning
              curriculum.
            heading:
              - title: A row request becomes page work
                brief: 'Begin with a concrete investigation: a query returns the same small result
                  while its page work or latency grows as the table changes. Introduce pages as units
                  of organisation and buffering, separating requested rows, pages examined, buffer
                  hits and actual storage reads. Use a labelled illustrative page map to show why
                  returned bytes do not measure the work. Link observed plan and I/O reporting conventions
                  to the plan-reading article; do not present model counts as measured execution
                  or equate a buffer hit with zero CPU work.'
              - title: Where a row lives determines locality
                brief: Compare a heap-organised table with a table organised around a clustered key
                  using only the physical differences needed to reason about nearby rows, repeated
                  page visits and row identity. Show how a row locator connects an index entry to
                  a physical row without repeating the index article's access-path lesson. Distinguish
                  key order from guaranteed physical contiguity and SQL result order. Use PostgreSQL
                  and InnoDB as explicitly identified implementations rather than universal relational
                  rules; link candidate indexes and their coverage costs to the index owner.
              - title: The working set includes more than the returned columns
                brief: Build a working-set picture from the table pages, index pages and other retained
                  data actually touched by the workload, distinguishing this from total database
                  size and available memory. Explain how row width, page occupancy and locality affect
                  cache residency and reads. Follow a wide value through an engine's inline and out-of-line
                  representation, including when the selected query needs to fetch or decompress
                  it. Test whether narrowing the selected columns or separating rarely used values
                  changes physical work; do not assume projection alone makes existing table pages
                  smaller. Keep concurrent memory competition and resource sizing with the workload
                  and operations owners.
              - title: Updates leave work behind them
                brief: Follow an update and a deletion through a clearly bounded versioned-storage
                  illustration. Explain why a logical change can retain older data and require additional
                  table, index or undo work, with the chosen engine's representation stated explicitly.
                  Distinguish current rows, versions that readers may still need, reclaimable space,
                  reusable space and space returned to the operating system. Explain why a long-lived
                  snapshot or a lagging cleanup process can enlarge the working set even when the
                  visible row count is stable. Refer to the transaction article for visibility and
                  isolation semantics; own only their physical consequences here.
              - title: Decide whether layout and cleanup explain the cost
                brief: 'Connect the worked table''s growing page traffic to testable hypotheses:
                  wider rows, scattered access, low page occupancy, retained versions or cleanup
                  falling behind. Choose engine-supported observations that can distinguish these
                  explanations, with their collection cost and scope. Distinguish external fragmentation,
                  internal free space and lost locality rather than using one bloat percentage as
                  a diagnosis. Explain ordinary reuse and cleanup before considering reorganisation,
                  and show why a large file or a slow query alone does not establish a need to rebuild
                  it.'
                heading:
                  - title: Reorganisation exchanges future work for immediate work
                    brief: Compare expected changes in page occupancy, locality and file size with
                      rewrite I/O, temporary space, log generation, index work, locks and concurrent
                      workload impact. State which effects depend on the selected engine and operation.
                      Identify the evidence that would make the change worthwhile and the signs that
                      continued churn would erase its benefit. Link the actual scheduling, rollout
                      and recovery procedure to schema evolution and operations instead of supplying
                      maintenance commands here.
              - title: Partitioning helps only when it removes relevant work
                brief: Introduce local physical partitioning through one time-bounded query on the
                  same table. Show an illustrative partition map and require observed evidence of
                  which partitions and pages the engine accesses. Explain how predicates, partition
                  bounds and engine-supported pruning affect whether work is eliminated, including
                  runtime pruning only where the selected engine supports it. Compare the selective
                  query with a query spanning all partitions, accounting for planning and per-partition
                  access overhead. After the pruning experiment, hand the local-partition design
                  and lifecycle decision to 'Operating replicas and partitioned data' (a38), which
                  owns key and boundary choices, schema compatibility, continuing write coverage
                  and the retain-or-reject decision. Link physical DDL to 'Changing schemas without
                  breaking applications' (a29), and lifecycle and retirement gates to 'Changing a
                  live database' (a06). Keep the physical explanation and measured benefit here;
                  do not repeat their design or operating procedures or create another partitioning
                  branch.
              - title: Choose a physical change from its measured effect
                brief: 'Finish the worked investigation with a small choice among reducing the touched
                  data, improving locality, allowing cleanup to progress or changing the layout.
                  Use the parent''s comparison method and preserve SQL results. Add this article''s
                  necessary evidence: page and storage work, warm-cache conditions, retained versions,
                  reusable and allocated space, and the immediate cost of the intervention. State
                  whether each demonstration is an illustrative model or captured execution, record
                  engine/version and relevant settings for captures, and explain when the evidence
                  points onward to index design, concurrency diagnosis or operational maintenance.'
        - title: Give the query a useful route to its rows
          brief: Compare scanning, locating a range through an index and fetching base rows. Explain
            selectivity, ordering and coverage through the running lookup, then show why a small
            table, a broad request or scattered fetches can favour a scan. Introduce composite key
            order and query expressions as practical constraints on useful access. Account for every
            added index in changes, storage and upkeep. After completing the parent, choose the index
            investigation when the evidence calls for designing or comparing access paths; its local
            plan legend permits that task without first completing the full plan-diagnosis investigation.
          nested_article:
            topic: Designing and evaluating relational indexes
            title: Choosing indexes for a workload
            brief: At the opening, require completion of Understanding and improving database performance,
              including its concluding Change one explanation into a measured improvement as the
              common comparison method used here. Derive index candidates from the work a relational
              workload needs, explain how their keys limit and order access, and decide whether their
              read benefit earns their write, space and operating costs. Use one tenant order-history
              workload with equality filters, a date range, an ordered first page and a related-row
              lookup. Extend it only when another query exposes a consequential trade-off. Own B-tree
              traversal, composite key order, coverage, base-row access and index eligibility. Supply
              a compact local reporting legend before using observed index evidence; no sibling article
              is a prerequisite. Offer Diagnosing a query from its execution plan for deeper evidence
              reading and plan-choice diagnosis. Link physical storage and safe schema changes to
              their owners. Keep the depth at choosing and evaluating relational indexes, without
              an index-family catalogue or another benchmarking curriculum.
            heading:
              - title: Start with the queries the workload must serve
                brief: 'Collect actual predicates, join keys, ordering, grouping, projected columns,
                  parameter classes and execution frequency before proposing indexes. Record existing
                  constraints and indexes, table size and change rate. Use the order history query
                  to distinguish rows returned from rows inspected and to name the work a candidate
                  should remove. Establish the competing write path and related-row lookup so the
                  first successful query cannot decide the whole design. Link application query capture
                  and the parent''s workload comparison method instead of repeating them. Give the
                  local reporting legend here: estimates predict work; observed rows report execution,
                  with the engine''s per-loop or total convention stated beside loops. Distinguish
                  index entries examined, page accesses and base-row visits from rows returned; name
                  the engine''s actual counters and do not invent unavailable entry counts. State
                  whether page counters describe repeated accesses, cache hits or reads rather than
                  assuming distinct pages or physical I/O. Keep model counts explicitly separate
                  from captured execution. This is enough to assess the article''s index observations;
                  deeper interpretation is optional reading in Diagnosing a query from its execution
                  plan.'
              - title: Follow a B-tree from key to row
                brief: Build the minimum model of ordered keys, page traversal, matching leaf entries
                  and row locators needed to explain an access path. Distinguish finding a starting
                  point, scanning index entries and visiting base rows. Compare a few selective lookups
                  with a broad result whose scattered row visits can make a scan preferable. Explain
                  that selectivity, locality and cache state influence the cost; an index existing
                  does not make its use cheaper. Use labelled illustrations rather than invented
                  execution evidence, and link physical storage for page layout and working-set mechanisms.
              - title: Put composite keys in the order the query can use
                brief: Compare candidate orders such as tenant, creation time and tenant, status,
                  creation time against the shared workload. Trace equality prefixes and range bounds,
                  distinguish keys that bound the scanned interval from later tests that reject entries,
                  and show what changes when a leading condition is absent. Treat this as a baseline
                  B-tree model and check the selected engine's actual access path for optimisations
                  that can use later keys; avoid an absolute leftmost-prefix rule or a most-selective-column
                  recipe.
                heading:
                  - title: Join lookups and several query shapes compete for key order
                    brief: Derive a candidate for repeated inner-side join probes from the values
                      supplied by the outer side. Compare it with the index serving the history query,
                      including whether an existing prefix already supplies useful access. Offer
                      Diagnosing a query from its execution plan for deeper join-method explanation.
                      Show why one composite index need not serve every optional filter, and why
                      separate single-column indexes are not automatically equivalent to it.
                  - title: Ordering and grouping can change the useful route
                    brief: Follow index order through fixed equality keys, ascending or descending
                      requirements, null placement and a bounded first page. Explain when an access
                      path can avoid sorting or feed ordered grouping, and why filters, joins and
                      the selected plan can still prevent that benefit. Keep SQL pagination correctness
                      and aggregate semantics with their existing owners. Use engine-checked examples
                      rather than promising that matching column names eliminate a sort.
              - title: Decide which row visits are worth avoiding
                brief: 'Contrast search and ordering keys with extra returned values stored for coverage,
                  using included columns where the selected engine supports them. Show how wider
                  entries reduce density and increase storage and update work. Explain that containing
                  every requested value only makes an index-only path possible: visibility checks
                  and engine organisation can still require base-row visits. Inspect actual fetch
                  evidence using the local reporting legend; offer Diagnosing a query from its execution
                  plan for deeper evidence interpretation. Own this key-to-base-row explanation once
                  and link storage for the underlying row and version mechanisms.'
              - title: Check that the query is eligible to use the index
                brief: Separate a useful hypothetical key order from an index the engine can use
                  for the actual expression and comparison. Check operand types, implicit conversions,
                  comparison operators and collation against the selected engine; a textual resemblance
                  between query and definition is insufficient.
                heading:
                  - title: Index a subset or an expression when that removes real work
                    brief: 'Introduce a partial or filtered index for a small active subset and an
                      expression index for an actual transformed lookup. Explain predicate implication,
                      expression compatibility, null semantics and engine rules for indexable expressions.
                      Test representative parameterised statements: the planner may lack the information
                      needed to prove a subset predicate. Account for rows entering or leaving the
                      subset and for expression evaluation during writes. Keep plan caching mechanics
                      with Diagnosing a query from its execution plan and uniqueness semantics with
                      schema design.'
                  - title: Change index family only for an access need B-trees do not meet
                    brief: Use at most one workload-driven contrast, such as membership search within
                      a document or a broad range over physically correlated data, to explain why
                      another family could be a candidate. Verify supported operators, ordering,
                      precision and any recheck work in primary engine documentation. Point to the
                      relevant feature article for specialised search. Stop once the reader can identify
                      a justified candidate to evaluate; do not survey access methods.
              - title: Count the obligations created by each candidate
                brief: Follow inserts, updates and deletes through additional index entries, including
                  wider keys, changed indexed values, uniqueness checks and contention on busy key
                  ranges. Assess space, write amplification and maintenance work at the workload's
                  actual change rate. Separate an index's access role from a primary-key or uniqueness
                  constraint's correctness role; a faster replacement cannot silently discard the
                  constraint. Check foreign key lookup needs and engine-specific automatic index
                  creation. Compare apparent duplicates by key order, predicates, expressions, included
                  values and constraint dependencies before declaring one redundant.
              - title: Keep the candidate only if its benefit survives the workload
                brief: 'Apply Change one explanation into a measured improvement, the completed performance
                  parent''s common comparison method, to the index hypothesis: confirm reduced entries
                  examined, base-row fetches or sorting in observed plans, then compare workload
                  reads and writes including tail latency, throughput and index size. Include large
                  and small tenants, common and rare values, nulls, skew, different range widths
                  and changing query mixes. If the predicted route is not selected, hand the estimate-versus-observation
                  mismatch to Diagnosing a query from its execution plan for deeper diagnosis rather
                  than forcing index use. Distinguish a favourable demonstration from captured execution
                  evidence. End with a justified retain, revise or remove decision and its regression
                  signals. Link creation, validation, constraint replacement and removal to schema
                  evolution and operations for locking, resource headroom and recovery; index design
                  alone does not establish a safe live deployment procedure.'
        - title: Explain the work and test a plan hypothesis
          brief: 'Work through a compact observed plan for the running reporting query, following
            scans, joins, filtering, grouping and ordering. Explain estimated cost versus elapsed
            execution, estimated versus observed rows, per-loop versus total work and inclusive reporting
            before interpreting the figures. Establish safe plan collection on disposable data: execution-based
            inspection executes effects and consumes resources. Carry one ordinary example from slow
            report to a consequential underestimated input, a supported stale-statistics hypothesis
            and a targeted statistics refresh. Distinguish inaccurate estimates from accurately predicted
            expensive work; changed estimates alone do not establish an improvement. State the predicted
            reduction in repeated work and retain the before/after evidence for the concluding workload
            comparison. Mention parameter skew and prepared execution as reasons a result may differ
            in the application. After completing the parent, choose the plan investigation when the
            question requires following actual operators, explaining an estimate mismatch or checking
            common and rare prepared parameters. It completes that diagnosis in one destination rather
            than handing its central remedy to another article.'
          nested_article:
            topic: Reading and diagnosing relational execution plans
            title: Diagnosing a query from its execution plan
            brief: 'Complete one ordinary slow-query investigation in PostgreSQL: collect safe evidence,
              follow physical rows and repeated work, interpret reporting units, explain a consequential
              estimate error, test a targeted remedy and accept it against the workload. Use the
              same reporting query throughout, including common and rare prepared parameters, so
              statistics and plan choice resolve the original diagnosis rather than begin another
              tour. Record the concrete engine version and verify its behaviour against primary documentation.
              Distinguish captured evidence from illustrative arithmetic and explain what each observation
              cannot establish. Keep uncommon nodes, parallel variants and planner controls conditional
              and compact. Link index design, storage mechanisms, concurrent-load diagnosis and the
              parent''s comparison method to their owners; do not expand into optimiser or storage-engine
              specialism. No further article is required to finish this task.'
            heading:
              - title: Collect evidence for the slow report safely
                brief: Establish one query joining customers, orders and order lines, filtering a
                  dated interval and region, grouping totals and returning an ordered limited result.
                  Supply schema, relevant indexes, data distribution, common and rare parameters,
                  and a small correctness fixture covering duplicates, nulls and ties. Distinguish
                  estimated EXPLAIN from execution-based EXPLAIN ANALYZE before showing the latter
                  on disposable data. Explain that execution can write, invoke effectful functions
                  or triggers, take locks and consume shared resources; a rollback does not undo
                  every effect, including sequence or external work. Use ANALYZE and BUFFERS appropriately,
                  explaining TIMING and optional I/O timing. Record version, settings, parameters,
                  capture conditions and whether each plan is captured or illustrative. Link production
                  collection procedures to operations. State the observed slowness and the question
                  this evidence can answer.
              - title: Follow where the report spends its work
                brief: Read the plan tree as physical data dependencies with consumer demand, rather
                  than SQL clause order. Follow candidate rows through scan conditions, filters,
                  base-row fetches and join inputs to the final groups and ordering. Teach sequential,
                  index and bitmap access only far enough to interpret the case's conditions, rechecks
                  and heap work; reuse index and storage explanations. Trace nested-loop repeated
                  probes, hash build/probe and merge input ordering with compact alternatives where
                  needed to compare physical work without changing join semantics. Identify late
                  filtering and large intermediates. Explain blocking sorts and aggregation, reported
                  memory/disk use, hash batches and temporary work where the case requires them.
                  A spill indicates work and resource pressure, not by itself bad statistics or a
                  safe global memory increase. Explain Materialize or Memoize briefly only if the
                  captured plan needs saved or parameter-keyed reuse; omit an independent node catalogue.
              - title: Interpret counts, costs and timings before blaming a node
                brief: Annotate estimated rows, width, startup and total cost alongside observed
                  rows, loops and startup/total time using PostgreSQL's actual averaging and rounding
                  conventions. Derive total row work from per-loop figures only where their semantics
                  permit it. Separate arbitrary planner cost units from elapsed milliseconds, inclusive
                  node time from exclusive work, and planning/execution reports from application
                  latency. Never sum inclusive node timings or buffer reports. Interpret shared hits,
                  reads, dirtied/written blocks and temporary blocks without equating a buffer read
                  with physical device I/O. Explain instrumentation overhead and the evidence lost
                  with per-node timing disabled. Account for partially consumed inputs, LIMIT, never-executed
                  branches and varying loops before comparing estimates. If parallel nodes occur,
                  add a compact annotated worker fragment showing planned/launched workers, leader
                  participation and the version's aggregate/per-worker conventions; overlapping intervals
                  cannot be added into elapsed time or exclusive CPU time. Keep a separate parallel
                  variant optional.
              - title: Locate the first error that could change the choice
                brief: Walk backwards from the case's repeated work or large intermediate to the
                  earliest consequential estimate/observation mismatch on a sufficiently consumed
                  input. Distinguish an estimate fault from accurate predictions of genuinely expensive
                  necessary work, misleading early termination and runtime conditions. Explain how
                  underestimated rows can favour repeated lookups or alter join ordering and expected
                  sort/hash sizes; the largest error ratio is not automatically the useful target.
                  Build a short simplified calculation of table size, predicate selectivity and join
                  multiplicity, clearly labelled as a model rather than PostgreSQL's estimator. Relate
                  rows, width and anticipated CPU/page work to comparison of legal plans, without
                  suggesting costs are measured duration or row estimates directly allocate fixed
                  memory. State one falsifiable explanation for the report and the next observation
                  needed.
              - title: Check the statistics behind that prediction
                brief: 'Inspect the implicated table estimates and pg_stats summaries alongside bounded
                  observations of the actual data, accounting for diagnostic query cost. Explain
                  null fractions, distinct values, common-value frequencies and histograms through
                  the case''s skew; use a dependent same-table predicate pair to show why independent
                  selectivities can mislead. Distinguish that dependency from physical value/order
                  correlation used in access costing. Separate stale statistics after data changes,
                  sampling or summary limits and unrepresented dependencies; fresh statistics remain
                  approximate. Choose one case-supported remedy: targeted ANALYZE for drift, an increased
                  statistics target for missing consequential skew, or supported extended statistics
                  with subsequent data collection. Compare estimates and resulting work after an
                  isolated change. Use versioned planner-statistics and CREATE STATISTICS documentation
                  to bound supported predicate forms; do not promise cross-table join correction.
                  Account for analysis, planning and continuing maintenance costs. Keep other remedies
                  a short hypothesis-to-test table, not extra investigations.'
              - title: Check the application's common and rare parameters
                brief: Run the same report through its actual session and preparation path with a
                  common and a rare parameter, distinguishing driver preparation decisions from server
                  prepared execution. Compare PostgreSQL custom and generic plans to show the information
                  available for known values versus reusable unknown parameters and the planning-time
                  trade-off. Explain automatic selection, reuse and documented invalidation or replanning
                  triggers from the selected version's PREPARE and plan_cache_mode documentation;
                  a literal-only test does not establish application behaviour. Check whether the
                  targeted statistics remedy helps both parameter classes or leaves a preparation-sensitive
                  choice. If necessary, test a locally scoped preparation or cache-mode change against
                  both classes including planning overhead. Do not turn this into a catalogue of
                  engine caching rules or planner settings.
              - title: Verify the remedy and close the investigation
                brief: 'Complete an evidence ledger connecting the original symptom, supported cause,
                  isolated remedy, changed estimates, physical work and measured outcome. Verify
                  result equivalence for duplicates, nulls, conversions, ordering and LIMIT before
                  comparing performance, including any predicate rewrite. Reuse the parent''s representative
                  workload comparison method to check common and rare parameters, concurrency, end-to-end
                  latency, completed work and relevant write/resource costs; a faster isolated execution
                  is not sufficient acceptance. State remaining uncertainty and when drift requires
                  rechecking. If accurate estimates still leave a surprising choice, briefly explain
                  bounded legal alternatives and imperfect costing. Use a scoped planner control
                  only as a conditional experiment: a faster alternative supports a hypothesis but
                  does not prove its root cause; retaining a control requires scope, rationale and
                  a removal condition. Route new index design or concurrent contention to their owners.
                  Finish with the verified ordinary remedy and its acceptance record, so the reader
                  can complete this diagnosis in one destination.'
        - title: A faster query can still make the workload slower
          brief: Put the candidate improvements back beside concurrent lookups, reports and changes.
            Connect higher concurrency to queues and competition for CPU, memory, I/O and locks;
            account for per-operation memory and parallel workers. Explain how an index can help
            reads while making writes more expensive, and how a long report can change the conditions
            for short requests. Use transaction and integration guidance for lock lifetimes, retry
            behaviour and admission at the application boundary. After completing the parent, choose
            concurrent-load diagnosis when isolated query evidence does not explain latency or completed
            throughput under competing work; use operations for monitoring and provisioning.
          nested_article:
            topic: Relational workload contention and capacity
            title: Improving performance under concurrent load
            brief: Diagnose why a relational workload slows as concurrent demand grows, and choose
              changes that improve useful completed work and tail latency. Distinguish the work of
              an individual execution from queuing and competition for resources. Use one mixed workload
              and selected engine evidence to connect demand, outstanding work, resource pressure
              and serial bottlenecks to an intervention. Reuse the parent's common comparison method
              and the storage, plan, transaction and application-integration explanations. Keep pool
              implementation, service budgets, provisioning procedures and recovery with their existing
              owners.
            heading:
              - title: Locate where the extra time appears
                brief: Introduce a workload with short account updates and longer reporting queries
                  whose isolated executions are acceptable but whose concurrent latency rises. Trace
                  the measured interval from application admission and connection acquisition through
                  database execution and completion. Separate application waiting from database waits,
                  active work and result transfer; link connection handling to application integration.
                  Compare the same query and parameter classes alone and under load without assuming
                  that a fast isolated plan explains concurrent behaviour.
              - title: Count arrivals, completions and outstanding work together
                brief: Establish a single measurement boundary and distinguish offered demand, admitted
                  work, starts, successful completions, failures and timeouts. State which work remains
                  outstanding after a caller stops waiting. Follow rates, outstanding work and latency
                  through a steady interval and an interval where arrivals exceed departures; do
                  not describe a growing queue as a stable capacity measurement.
                heading:
                  - title: An average relationship needs a stable population
                    brief: Use a labelled illustrative calculation relating average outstanding work,
                      achieved throughput and average time within the same boundary. State steady-state,
                      consistent-unit and representative-window assumptions. Explain why the relationship
                      neither predicts a tail percentile nor supplies a universal concurrency setting,
                      and why a transient overload requires tracking accumulation and drainage.
                  - title: A waiting client can hide demand
                    brief: Contrast clients that wait for completion before issuing more work with
                      an arrival schedule independent of response time. Show how slow responses can
                      reduce the former's offered rate and conceal overload. Record intended arrivals,
                      actual admissions and achieved completions; distinguish scheduled-arrival latency
                      from execution-only latency. Treat retries as additional demand and link their
                      correctness and deadline policies to application integration.
              - title: Find what the concurrent executions are competing for
                brief: Correlate the workload slowdown with engine activity, wait categories and
                  host resource evidence over the same interval. Use PostgreSQL as one concrete evidence
                  path, verifying views and reporting semantics against primary documentation. Distinguish
                  accumulated counters, interval rates, gauges and sampled activity. A wait name
                  or a high utilisation figure is a hypothesis to investigate, not a diagnosis by
                  itself.
                heading:
                  - title: CPU, memory and storage pressure
                    brief: Separate CPU demand and runnable competition from storage waits and temporary-file
                      work. Compare query classes and plans for repeated work, spill evidence and
                      parallel workers, using the plan-reading sibling for interpretation. Investigate
                      the aggregate memory needs of concurrent operators and workers before changing
                      per-operation limits. Relate cache misses and the active working set to physical
                      I/O without treating a cache-hit ratio as an explanation of latency; link page
                      and locality mechanics to physical storage.
                  - title: A hot row can limit a mostly idle database
                    brief: Follow a blocking chain to the owning transaction and the business operation
                      that holds the contested row. Distinguish transaction locks from engine-specific
                      page or internal synchronisation waits. Explain how concentrated access can
                      serialise progress despite spare CPU or storage capacity. Diagnose transaction
                      duration, statement work and access skew without treating weaker isolation
                      as a general performance remedy; link locking guarantees and deadlocks to transactions.
                  - title: Background work and old transactions change the competition
                    brief: Correlate maintenance, checkpoints or other background activity with foreground
                      waits and completed work, using the selected engine's actual mechanisms. Investigate
                      long transactions and snapshots for their workload consequences, including
                      retained versions, larger working sets and constrained cleanup. Link version-retention
                      mechanics to physical storage and maintenance procedures to operations. Assess
                      deferred maintenance debt as well as immediate foreground gains.
              - title: Match the intervention to the limiting resource
                brief: Return to the mixed workload and choose a change from the evidence. Explain
                  the expected change in demand, queuing or serial work before comparing outcomes.
                  Preserve SQL results, transaction guarantees and business invariants while testing
                  performance hypotheses.
                heading:
                  - title: Bound the work in progress
                    brief: Test a small set of active-concurrency limits and workload schedules.
                      Compare useful completions and latency across both the admission queue and
                      database, so moving a queue does not masquerade as an improvement. Show why
                      fewer active executions can reduce competition and why too few can leave useful
                      resources idle. Account for rejected or deferred demand and starvation of long
                      work. Link pool implementation and request deadline handling to application
                      integration.
                  - title: Reduce work and shorten serial sections
                    brief: Use plan and index evidence to reduce work in the competing query classes,
                      linking design details to their sibling articles. Evaluate batching against
                      per-item overhead, lock duration, memory, transaction size and fairness. Test
                      whether shortening a transaction or changing how a hot business record is updated
                      removes contention while preserving its invariant; do not imply that adding
                      resources removes an inherently serial dependency.
                  - title: Reconsider parallel work and targeted resources
                    brief: Compare faster individual reports with their aggregate CPU, memory, storage
                      and worker demand alongside short transactions. Test whether changing parallelism
                      improves total completed work and the latency of each class. Consider additional
                      CPU, memory or storage capability only when evidence predicts relief of that
                      resource limit, and check for the next bottleneck. Hand provisioning execution
                      to operations.
              - title: Test the proposed limit without hiding the overload
                brief: Apply the parent's comparison method to a bounded concurrency and demand sweep,
                  keeping query mix, parameter skew, transaction duration and cache conditions representative.
                  State a stop condition and a maximum backlog for an isolated experiment. At each
                  point retain offered and admitted rates, useful completions, failures, outstanding
                  work and latency distributions by query class. Include warm-up, sustained competition
                  and queue drainage rather than reporting only the best short interval. Label model
                  curves separately from captured runs. Accept a change only after explaining its
                  effects on tail latency, total completed work, fairness, write cost and maintenance;
                  do not turn the observed operating range into a universal capacity promise.
        - title: Change one explanation into a measured improvement
          brief: 'Complete the ordinary report investigation by comparing the statistics remedy with
            its recorded baseline under representative application work. State the observed result
            and accept, reject or revise the hypothesis; do not require a child article to finish
            this loop. Establish the reusable comparison method here before the optional investigations
            apply it. Turn each diagnosis into a prediction: which work should disappear, which measurement
            should change and what new cost might appear. Compare a query rewrite, index change,
            layout or statistics change, maintenance intervention and added resources as remedies
            for particular evidence. Verify results and edge cases before measuring. Test with representative
            size, distributions, parameter classes, warm and cold conditions, concurrency and ongoing
            changes; record the engine version and configuration, measurement variance and instrumentation
            limits. Measure end-to-end latency distributions, throughput, resource use, write cost
            and maintenance burden together. Set acceptance and regression criteria, retain reproducible
            evidence and use schema-evolution guidance for deploying a successful change safely.
            Close by revisiting the running workload and identifying when growth requires another
            investigation.'
  - title: Changing a live database
    anchor: data-and-applications-change-at-different-speeds
    brief: Add a new required fact to the running example while old application instances and existing
      rows still exist. Explain why schema edits, data conversion and application deployment form
      one compatibility problem. Introduce staged change, verification and recovery from partial
      progress; distinguish reversing a schema edit from recovering data already lost.
    nested_article:
      topic: Relational schema and data evolution
      title: Changing a live database
      brief: Teach engineers to change schemas, stored data and database locations while applications
        continue to run. Use a change to an order system to connect application compatibility, physical
        database work, concurrent writes, verification and recovery. Give every change an explicit
        sequence, measurable completion conditions and a safe response to interruption. Introduce
        deeper procedures for schema changes, data jobs and database moves only where they enable
        reliable relational practice. Treat retention and deletion as changes to the guarantees readers
        and recovery procedures can rely on. Check concrete procedures against the selected engine,
        version and deployment.
      heading:
        - title: A change has more than one finish line
          brief: Start with an order system replacing a free-text delivery address with a structured
            address. Separate deploying code, making the schema usable, converting existing rows,
            switching readers and retiring the old representation. State the invariant that must
            hold through the transition, the applications and jobs using each representation, and
            the evidence needed before advancing. Distinguish schema migration records from proof
            that the whole change is complete.
        - title: Keep old and new applications compatible
          brief: Draw the successive application and schema versions, including overlapping deployments,
            background jobs and delayed clients. Work through adding the new representation, populating
            it, switching reads and removing the old one. Make concurrent writes and the authoritative
            representation explicit; dual writing alone is not a consistency argument. Explain when
            a short coordinated maintenance window costs less and provides clearer guarantees than
            a long compatibility period. Link transaction and application integration guidance for
            atomic writes and request-level retry behaviour.
        - title: Find out what the database must do
          brief: Translate the proposed change into catalogue work, scans, validation, index construction,
            row movement or copying as applicable to the chosen engine. Explain why an online label
            does not establish a safe lock wait, resource cost or failure path. Inventory dependent
            views, constraints, indexes, generated values, prepared statements and replication consumers.
            Establish lock and execution limits, storage headroom, workload budgets and abort criteria
            using a representative rehearsal and verified engine behaviour. Link performance diagnosis
            and operational monitoring rather than repeat their general methods.
          nested_article:
            topic: Safe relational schema changes
            title: Changing schemas without breaking applications
            brief: Turn an intended schema change into an executable, interruptible procedure with
              measured limits on production impact. Use PostgreSQL 18 as the worked engine, pinning
              the exact server and migration-tool versions before writing runnable examples. Reuse
              the parent's application-compatibility sequence and concentrate on locks, queued work,
              scans, rewrites, dependencies and deployment restrictions. Develop staged constraint
              validation and a large column-type change, then use a compact operation table to cover
              related column, index and table changes. Give every stage preconditions, transaction
              boundaries, completion evidence and a response to failure. Link the data-job and operations
              owners for their procedures; do not create a separate article for each DDL command
              or engine.
            heading:
              - title: Describe the physical change before scheduling it
                brief: Begin with an orders table whose amount column needs a wider representation
                  and whose future writes must obey a new rule. Carry forward the parent's compatibility
                  contract, authoritative representation and retirement gate. Inventory table size,
                  dependencies, indexes, partitions, triggers, readers, writers and replicas. Build
                  an operation table for adding a column or default, altering a type, adding a constraint,
                  building an index, and renaming or dropping a table. For each exact form identify
                  metadata work, validation scans, physical rewrites, lock requirements and remaining
                  storage work; do not infer cost from statement length or an online label. Use the
                  table to choose a short bounded pause or a staged change.
              - title: Keep a waiting schema change from stopping the workload
                brief: 'Follow three sessions: an existing transaction holds a conflicting lock,
                  the schema statement waits, and later application work queues behind it. Teach
                  how to inspect blockers, transaction age and queued requests using the selected
                  engine''s lock and activity views. Separate time waiting for a lock from time executing
                  and from time holding locks before commit. Choose lock and statement timeouts,
                  a cancellation owner and retry conditions from the service''s interruption budget.
                  Rehearse cancellation during waiting and execution, including the need to end a
                  failed transaction and check what locks or work remain. Link transaction semantics
                  and incident handling.'
              - title: Make the migration runner's boundaries visible
                brief: 'Show the actual command sequence and migration record produced by one versioned
                  runner. Establish which statements it wraps in a transaction, which must run separately,
                  how sessions inherit timeouts, and how it prevents two runners from applying the
                  same change. Check engine-specific DDL atomicity, concurrent-operation restrictions
                  and deployment privileges against documentation and a disposable rehearsal. Include
                  a lost connection after submitting DDL: inspect server state, catalogue state and
                  the runner''s history before deciding whether to resume, repair the record or rerun.
                  A successful migration-history entry is evidence about the runner, not the complete
                  application or database postcondition.'
              - title: Enforce new writes before validating old rows
                brief: Work a new orders CHECK constraint through the selected engine's staged enforcement
                  and validation facilities. Show exactly when new inserts and updates must satisfy
                  the rule, which historical rows remain unchecked and what validation must prove.
                  Deliberately include an invalid old row and a concurrent invalid write. Repair
                  historical violations using the neighbouring data-job procedure, then validate
                  and inspect the resulting constraint state. Record locks and concurrent-work behaviour
                  at each step, and show recovery after interrupted or failed validation. Contrast
                  foreign-key and not-null deployment only where their supported forms or dependencies
                  change this procedure; do not generalise staged validation to every constraint.
              - title: Build a required index through failure and completion
                brief: Compare an ordinary build with the selected engine's concurrent build using
                  the operation table's workload and interruption requirements. Follow its phases,
                  waits and resource demand, including its transaction restrictions. Force one interrupted
                  build and one uniqueness failure, inspect whether an invalid or incomplete index
                  remains and explain its operational consequences before choosing cleanup or another
                  attempt. When the change requires a uniqueness constraint, distinguish building
                  a usable eligible index from attaching the final constraint. Prove validity and
                  intended constraint ownership; use the index and performance articles for index
                  selection and query-benefit assessment.
              - title: Change a large representation in recoverable stages
                brief: Develop the amount-column type change into a complete physical procedure.
                  First rehearse a direct conversion and measure its locking, rewrite, disk and logging
                  costs, conversion failures and dependency effects. If those exceed the chosen budget,
                  use a replacement column with explicit conversion semantics and reuse the parent's
                  concurrent-write authority protocol and the neighbouring article's resumable backfill.
                  Show the schema statements that create the new representation, prepare its constraints
                  and indexes, and switch dependent views, functions or other consumers. Verify foreign-key,
                  trigger and generated-value dependencies where present. Define a stable reconciliation
                  gate before switching reads, and a safe interruption response at each stage. Do
                  not treat a rename as proof that every dependency now uses the intended representation.
              - title: Rehearse the production impact and set stop conditions
                brief: Run the two procedures with representative data volume, long transactions
                  and sustained concurrent reads and writes. Capture lock waits, request latency
                  and errors, free space, logging volume and replica delay against explicit continuation
                  and cancellation limits. Identify which replication arrangement carries schema
                  changes and what must be coordinated separately; link operations for steady-state
                  replication and recovery. Include an interrupted stage and a repeated invocation
                  so the rehearsal proves the proposed recovery path. Record expected versus observed
                  results, server and runner versions and deployment differences. Use PostgreSQL
                  18 ALTER TABLE, CREATE INDEX and relevant locking and replication documentation
                  as primary references, including https://www.postgresql.org/docs/18/sql-altertable.html
                  and https://www.postgresql.org/docs/18/sql-createindex.html.
              - title: Close the change with evidence and deliberate cleanup
                brief: Produce a completed change record connecting desired schema and application
                  behaviour to observed catalogue definitions, validated constraints, valid indexes,
                  representative workload checks and replica state. Distinguish a cancelled transaction
                  from a committed earlier stage or an uncertain client outcome. List concrete cleanup
                  for invalid indexes, temporary constraints, replacement columns and obsolete tables,
                  retaining old representations until the parent's compatibility and retirement gates
                  permit removal. Before a table rename or drop, inspect database dependencies and
                  application or job references that catalogues cannot reveal; avoid using cascading
                  removal as a substitute for that inventory. State which steps can be reversed directly
                  and which need a forward repair or the existing recovery procedure to preserve
                  writes accepted since the change.
        - title: Move existing data while writes continue
          brief: 'Show why deploying a new column leaves existing rows unfinished and why one large
            update may exceed an acceptable transaction or workload budget. Introduce bounded batches,
            durable progress, restart safety and explicit ownership of concurrent changes. Distinguish
            a backfill from an import or correction: each needs an input contract, duplicate policy,
            error handling and reconciliation. Require a concrete meaning of complete, including
            rows created or changed during the job.'
          nested_article:
            topic: Relational backfills, imports and corrections
            title: Running reliable data changes
            brief: Teach resumable, idempotent data jobs through one backfill that converts the order
              system's delivery address into a structured representation while orders continue to
              change. Develop an explicit input contract, complete work coverage, protection against
              stale writes, atomic progress and recovery after an uncertain batch outcome. Bound
              the effect on the live workload and reconcile meaning as well as row coverage. Contrast
              external imports and production corrections only where their input, duplicate or recovery
              contracts change the procedure. Reuse the parent's application compatibility argument
              and link transaction guarantees, request retries and operational diagnosis rather than
              teach them again. Verify executable procedures against the selected engine and version.
            heading:
              - title: Define what each changed row must mean
                brief: Start with a parser that can misinterpret an address or reject it, rather
                  than treating the job as a loop around UPDATE. Specify the authoritative source,
                  transformation version, source identity and required invariant; distinguish a legitimate
                  empty value from a row awaiting processing. Define acceptable, invalid and ambiguous
                  inputs and their recorded dispositions. Give the job a durable identity and keep
                  enough source and outcome evidence to explain or repair a result. Establish the
                  parent's prerequisite that all active and delayed writers follow the agreed representation
                  protocol.
              - title: Define a set of work that can actually be finished
                brief: 'Compare a durable worklist with a traversal ordered by an immutable unique
                  key. Show why offsets over changing rows can skip work, and why a largest allocated
                  identifier or timestamp alone is not a commit boundary: a lower identifier can
                  become visible after the cursor has passed it. Choose one complete protocol for
                  the example, combining an explicit enumeration boundary with writers that maintain
                  the new representation and a catch-up check for work that became visible later.
                  State the handling of inserts, deletes and eligibility changes during the run.
                  Checkpoints must describe accounted-for work, including quarantined and deferred
                  rows, rather than merely the greatest key observed. Avoid a long-lived snapshot
                  unless its workload and retention costs are accepted.'
              - title: Stop the backfill from overwriting a newer address
                brief: Interleave a worker read, an application edit and the attempted worker write.
                  Work through a conditional update guarded by a source version that every relevant
                  writer advances, or another explicitly verified protocol. Derive the structured
                  value from the guarded source and inspect the actual affected rows. A failed condition
                  means re-read, defer or record a conflict; it must not silently count as successful
                  conversion. Account for deleted rows without recreating them. Explain how writers
                  preserve the invariant after a row has been processed. Link isolation and locking
                  mechanisms and check the concrete update semantics for the chosen engine.
              - title: Commit the batch and its progress together
                brief: Put row changes, recorded dispositions and durable progress in the same transaction
                  where possible. Walk through interruption before commit and a lost acknowledgement
                  after commit. Recover through the durable job record and an idempotent replay rule,
                  using the existing transaction and retry articles for the abort-versus-unknown
                  distinction. Define the idempotency identity using the job, source record and relevant
                  version; a retry must neither double-apply a correction nor skip an uncommitted
                  effect. Begin with one worker. If concurrent workers are needed, require exclusive
                  claims or disjoint work and prevent a replaced worker from advancing shared progress;
                  do not introduce a general job-scheduler design.
              - title: Account for everything a row change can trigger
                brief: Inventory constraints, foreign keys, generated values, identities, triggers,
                  change consumers and application side effects before the first batch. Apply dependent
                  changes in a valid referential order and verify stored results after database-generated
                  behaviour. Explain why bypassing the application can omit an intended effect, while
                  reusing its normal write path can send unwanted notifications or duplicate external
                  actions. Choose deliberately which effects the job produces and how their delivery
                  is recorded and reconciled, linking application integration for atomic handoff
                  and external deduplication. Keep constraint and index deployment in the schema-change
                  sibling.
              - title: Keep each batch inside the workload budget
                brief: Select and rehearse batches using transaction duration, lock waits, rows touched,
                  logging, storage growth and replica lag as well as row count. Show that a small
                  result set can still require a large scan or expensive trigger work. Use observed
                  request latency and database pressure to reduce batch size, concurrency or rate,
                  or pause at a committed boundary. Define cancellation conditions and record the
                  last durable progress before resuming. Link operational signals and query diagnosis;
                  teach the job's control decisions without rebuilding monitoring or maintenance
                  guidance.
              - title: Adapt the input contract for imports and corrections
                brief: Reuse the same job and batch method. For an import, stage raw input when validation,
                  deduplication or review must precede live changes; preserve a source identifier
                  and input version, validate parsing and relationships, and state whether duplicate
                  input is rejected, merged or replaces a prior version. Require a deliberate conflict
                  policy for existing live rows; an upsert alone does not establish business correctness.
                  For a correction, record the expected faulty state and intended replacement, guard
                  against subsequent legitimate edits and preserve before-images where reversal is
                  required. Explain why blindly restoring those before-images later could erase valid
                  intervening changes. Do not repeat complete import and correction walkthroughs
                  or develop a separate ingestion curriculum.
              - title: Prove completion before removing the machinery
                brief: Reconcile the declared source scope with accepted, rejected, conflicted and
                  outstanding records using identities and versions. Demonstrate checks for missing
                  rows, unexpected rows, duplicates, broken relationships and semantically wrong
                  transformations; equal counts alone cannot establish correctness. Validate changing
                  source and destination data against a consistent boundary or the established writer
                  protocol, rather than comparing unrelated live snapshots. Require all deferrals
                  to be resolved or explicitly accepted and show that new writes preserve the invariant.
                  Record the transformation version, scope, reconciliation results, exceptions and
                  remaining recovery options. Hand evidence to the parent's read-switch and retirement
                  gates; retain or remove staging, before-images and job records under their agreed
                  retention policy.
        - title: Switch traffic only when the destination is ready
          brief: Extend the same staged-change reasoning to moving a database. Separate copying existing
            data, carrying later changes, validating the destination and transferring write authority.
            Explain that a replica caught up at one instant is not yet a complete cutover argument.
            Introduce readiness gates for data, application behaviour, connections, permissions and
            performance, and an explicit treatment of writes during the switch. Link replication
            and recovery mechanisms to the operations branch.
          nested_article:
            topic: Moving a relational database
            title: Moving databases with a controlled cutover
            brief: Teach one controlled move of an order database from a source to a destination,
              following the copy, intervening changes and transfer of write authority. Choose between
              a rehearsed write pause and a copy with change capture using the allowed outage and
              measured transfer time. Establish compatibility, a consistent starting state and an
              explicit final change boundary; prove that the destination meets them before admitting
              writes. Define abort conditions and explain how destination writes change the route
              back. Reuse the parent article's application compatibility method and the operations
              branch's replication and recovery evidence. Verify concrete commands and guarantees
              against the selected engine, version, deployment and migration tool; do not build an
              engine-pair migration catalogue.
            heading:
              - title: Choose the simplest move that fits the write pause
                brief: 'Start with the additional failure case: orders continue to change while their
                  earlier state is being copied, so a successful copy alone cannot authorise switching
                  the application. State the allowed write interruption, data-loss tolerance, workload
                  scope and completion evidence. Measure copy, validation and restart time in rehearsal.
                  Use a bounded write pause when the whole move fits; otherwise identify the extra
                  capture, retention and reconciliation work required to shorten that pause. Keep
                  a controlled pause as a complete path, rather than treating online migration as
                  the default.'
              - title: Prove that the destination preserves the workload's meaning
                brief: Follow representative order reads and writes through the proposed destination.
                  Inventory schema, types, collations and comparison rules, time handling, identities
                  and sequences, generated values, constraints, triggers, extensions and query semantics
                  only where they affect this move. Separate schema and object transfer from row
                  transfer, and identify state the chosen mechanism does not carry. Test application
                  roles and permissions, connections and representative queries with realistic data
                  and concurrency. Link general application-version compatibility and query diagnosis
                  to their owners; keep any required engine conversion within this move.
              - title: Join the starting copy to every later change
                brief: Draw one timeline showing the consistent source snapshot, the capture boundary,
                  copied rows and subsequent inserts, updates and deletes. Require a documented way
                  to connect snapshot and change stream without lost changes, including the tool's
                  treatment of overlap, ordering, transaction boundaries and restart. Verify table
                  eligibility, row identification, DDL handling, sequence handling and other replication
                  limitations for the selected mechanism. Set a policy for schema changes during
                  the move. Check retention, catch-up capacity and copy load; define when an expired
                  boundary or unsupported change requires restarting the copy. For the pause path,
                  show how fencing all writers supplies the stable copy boundary without a live change
                  stream.
              - title: Rehearse the destination and reconcile the copied state
                brief: Run the actual procedure on representative volume and workload, including
                  interruption and restart. Reconcile missing, duplicate and incorrect rows with
                  key-range checks and domain invariants, using comparable snapshots or an agreed
                  change boundary so concurrent changes do not invalidate comparisons. Explain why
                  a row count alone cannot establish correctness. Exercise order creation, updates,
                  constraints and generated identifiers; verify capacity, permissions and connection
                  behaviour. Reuse operations' restore and replication checks where applicable. Record
                  measured timings, tolerances, owners and evidence that make a cutover attempt acceptable.
              - title: Fence writers and prove the final boundary has arrived
                brief: 'Develop an ordered cutover runbook: stop admitting writes, drain or resolve
                  in-flight work, fence source writers, record the final committed change boundary,
                  wait for that boundary to be applied at the destination, and complete the final
                  reconciliation. Include background workers, delayed jobs, scheduled tasks, administrators
                  and old connection pools in the writer inventory; a routing or DNS change alone
                  is not evidence that they have stopped writing. Resolve uncertain request outcomes
                  through the application integration procedure. Verify all unreplicated state, including
                  identifiers, before enabling destination writes. Make exclusive write authority
                  and the boundary evidence explicit gates, with an owner empowered to abort when
                  either is unproved.'
              - title: Admit destination traffic with a defined way to stop
                brief: 'Switch connection configuration, retire or refresh old pools, and reopen
                  writers only after the preceding gates pass. Use observable application checks
                  and bounded workload admission to detect semantic, permission and capacity failures.
                  Distinguish an abort before destination writes from a return after new orders have
                  committed there: the latter needs a verified reverse synchronisation or another
                  migration that preserves those writes. Do not imply that sending connections back
                  restores a consistent service. Decide the return procedure and its feasibility
                  before cutover; avoid dual writes unless a separately justified correctness protocol
                  already exists.'
              - title: Close the move with evidence
                brief: Record the final boundary, reconciliation results, application acceptance
                  and current write authority. Keep the source fenced for the agreed decision window
                  and hand destination recovery protection and routine monitoring to operations.
                  Identify the evidence that permits removing temporary capture, credentials and
                  migration resources. Link lifecycle retirement to the parent and ongoing replication,
                  failover and backup administration to operations, without repeating their procedures.
        - title: Plan recovery before the first irreversible step
          brief: Label each stage as safely retryable, reversible with preserved data, or requiring
            compensation or restoration. Distinguish rolling back a code deployment, reversing a
            schema operation and undoing its data effects; identify the point at which old code can
            no longer run. Assign ownership and observable stop conditions, retain the evidence needed
            to resume, and decide how to handle partial success. Explain how a correction can reverse
            a transformation only when enough original information survives. Link tested backup restoration
            and point-in-time recovery procedures, including their effect on intervening valid writes,
            to operations.
        - title: Retire old data and prove the change is finished
          brief: 'Require evidence that old readers and writers have disappeared, the new invariant
            holds and the workload is stable before removing compatibility paths, columns, staging
            tables or migration machinery. Apply this to a retention change: define which records
            become eligible, what related and derived data must change, and how deletion reaches
            replicas, exports and backup expiry under the actual service guarantees. Distinguish
            removing rows from immediately reclaiming space or eliminating every recoverable copy.
            Plan bounded deletion work and restoration procedures that do not silently reintroduce
            retired data. Finish the running example with a concise change record containing validation
            results, remaining recovery options and the final ownership of the data.'
  - title: Keeping the service and its data
    anchor: operate-for-the-failure-you-must-recover-from
    brief: 'Move from an individual query to the service: access control, connections, resource headroom,
      maintenance and signals that reveal trouble. Separate service availability from recovery of
      correct data, using a server failure and an accidental deletion as contrasting cases. Introduce
      replicas, backups, recovery objectives and restore rehearsals as mechanisms whose guarantees
      must be demonstrated for the chosen deployment.'
    nested_article:
      topic: Operating and recovering relational services
      title: Running a relational service
      brief: Teach practitioners to secure, observe, maintain, scale and recover a relational service
        against explicit availability, data-loss and recovery requirements. Connect those requirements
        to access boundaries, service signals, capacity, maintenance, topology, backup and incident
        procedures. Give readers the working model needed to choose a safe next action, with contextual
        articles developing the procedures and implementation differences. Distinguish self-managed
        duties from managed service contracts. Keep query tuning, application retry logic and live
        schema changes in their neighbouring branches, and the separate distributed-systems programme
        outside this branch.
      heading:
        - title: Define what the service must survive
          brief: 'Start with an ordinary application''s database, its users and its operating owner.
            Turn acceptable interruption, acceptable loss of acknowledged changes, recovery time
            and retained recovery history into explicit requirements for named failures. Distinguish
            service availability, data durability and data correctness: meeting one does not establish
            the others. Include dependencies such as identity, storage, keys, networking and the
            application connection path when defining recovery. Use a small failure-and-recovery
            table to show which mechanisms and evidence each requirement demands.'
          heading:
            - title: Assign every operating responsibility
              brief: Compare a self-managed installation with a managed service using the same responsibility
                checklist. Establish who patches, monitors, retains backups, controls keys, initiates
                failover, restores data and proves that applications can use the recovered service.
                Require documented limits, escalation paths and tested procedures rather than treating
                a service label or availability commitment as a recovery design.
        - title: Limit who can reach and change the data
          brief: Follow one application connection through network access, authenticated identity
            and database privileges. Explain why encryption in transit and at rest, least privilege,
            restricted administrative access and audit evidence solve different problems. Establish
            separate application, migration, monitoring, backup and emergency access needs, and include
            backup copies and recovery keys within the security boundary. Keep parameter binding
            and application injection prevention with the integration branch.
          nested_article:
            topic: Securing relational services
            title: Securing a relational service
            brief: Teach how to build and verify operational access boundaries around a relational
              database, using one service's application, migration, reporting, backup and emergency
              access tasks. Connect network reachability, identity, privileges, ownership, encryption
              and audit evidence to what each actor can actually do. Develop safe rotation, revocation
              and compromise response with selected-engine checks and explicit managed-service responsibilities.
              Keep application query safety and application authorisation in integration, restoration
              procedures in backups, and the common incident decision method in service operations.
              Follow the parent-first reading route through Running a relational service; readers
              entering here directly should read its section Recover the incident without destroying
              the evidence before this article's final compromise exercise. This article supplies
              the operational security depth needed for relational practice; it does not open a general
              security architecture branch.
            heading:
              - title: Turn access needs into testable boundaries
                brief: 'Start with a small service whose application reads and changes orders, deployment
                  job changes schema, reporter reads a restricted dataset and backup operator preserves
                  recovery copies. Map each identity to its connection route, permitted operations,
                  objects and duration of access, then name the actions it must be unable to perform.
                  Include database hosts or files, provider control planes, exports and recovery
                  copies: SQL grants alone do not describe every route to the data. Separate service-owner
                  duties from managed-service guarantees and restrictions using the parent''s responsibility
                  map rather than reproducing its operating introduction.'
              - title: Admit only the intended connections
                brief: Trace a connection from a workload to the database through address exposure,
                  network policy, server admission rules and authentication. Explain why reachability,
                  authenticated identity and permission to use data are separate checks. Choose private
                  or explicitly restricted connection paths, including administrator and maintenance
                  routes, and verify both accepted and rejected connections from representative locations.
                  Check the engine's rule ordering, local socket or file access, authentication methods
                  and managed endpoint behaviour where those alter the boundary; avoid a general
                  networking course.
              - title: Give each job the authority it needs
                brief: Build the worked service's role and privilege design from concrete tasks.
                  Separate login identities from reusable privilege roles where supported; distinguish
                  object use, ownership, role membership, grant authority and administrative powers.
                  Keep the ordinary application identity from owning its schema or performing deployment
                  operations. Follow one new table or routine through creation and access to expose
                  inherited, public and default privileges, namespace resolution and privileged execution
                  paths that can undermine the intended design. Check selected-engine semantics rather
                  than present portable grant syntax. Introduce row or column restrictions only when
                  the database enforces a required boundary, testing ownership and administrative
                  bypasses; link application authorisation to integration.
              - title: Protect connections, copies and the keys that unlock them
                brief: Distinguish encrypted traffic from authenticated server identity, then configure
                  a connection that verifies the expected server and rejects an untrusted certificate
                  or wrong name. Explain client certificates only where they are the chosen authentication
                  method. Map encryption at rest across database storage, logs, temporary data, backups,
                  snapshots and exports; identify who can decrypt each copy and which administrators
                  remain trusted. Verify the selected engine or service's actual coverage and restrictions.
                  Connect key access, retention and recoverability to the backup article's restoration
                  rehearsal so encryption neither creates an unnoticed plaintext copy nor makes an
                  otherwise valid recovery copy unusable.
              - title: Change credentials without losing control of access
                brief: 'Walk through rotating one application credential and one expiring certificate
                  or trust root: inventory consumers, introduce the replacement, update and reconnect
                  clients, verify use, then retire the old material. Include pools, scheduled jobs,
                  replicas and backup clients where relevant. Keep secrets out of source, connection
                  logs and broadly readable runtime configuration. Test what credential expiry, role
                  changes and revocation do to existing sessions as well as new connections, and
                  require an explicit session termination step where necessary. Distinguish provider-managed
                  rotation promises from consumer updates the operator must still perform.'
              - title: Prove permitted work succeeds and forbidden work fails
                brief: Turn the initial access map into a repeatable verification exercise using
                  the real connection path and each effective identity. Demonstrate permitted reads
                  and writes alongside rejected cross-boundary reads, schema changes, privilege grants
                  and unauthorised connections. Include newly created objects, role inheritance and
                  recovery-copy or control-plane access in the relevant tests. Use disposable data
                  or an isolated environment for destructive attempts; retain expected outcomes,
                  observed results and the tested engine, service and configuration. Repeat after
                  changes that can alter access and explain what these bounded tests leave unproven.
                  Clearly label any diagram or simulated access matrix as an illustrative model.
              - title: Leave useful evidence and a controlled emergency route
                brief: Select audit records for connection attempts, privileged operations, grant
                  and ownership changes, and access to sensitive data or recovery copies where supported.
                  Preserve actor, time and affected object while limiting sensitive statement values
                  and credential exposure. Establish retention, independent protection and access
                  to records, and verify what the chosen engine and managed service can record before
                  relying on them. Distinguish operational logs from a complete account of data access.
                  Provide a separately controlled, short-lived emergency identity whose use is attributable,
                  tested, revoked and reviewed; account for provider or identity-service failure
                  without making the ordinary application an administrator.
              - title: Revoke compromised access and verify the boundary again
                brief: 'Recall the incident sequence from Running a relational service, section Recover
                  the incident without destroying the evidence, without repeating its runbook. Apply
                  it to suspected theft of the application credential. Identify the affected identities
                  and routes, preserve available evidence, restrict exposure, revoke or replace credentials
                  and terminate relevant sessions using verified engine procedures. Inspect role
                  memberships, ownership, new objects, scheduled work and copied data according to
                  the authority the identity actually held. Distinguish stopping further access from
                  establishing what was read or changed: rotation cannot recover disclosed data or
                  prove its integrity. Set explicit checks for restoring access and hand possible
                  data repair to the restoration owner; finish by rerunning the positive and negative
                  tests and recording remaining uncertainty. Keep this database-specific response
                  within the common incident process rather than creating another incident article.'
        - title: Observe the service before it reaches a limit
          brief: Start with successful and failed application work, latency and demand, then connect
            those observations to connections, active work, waits, CPU, memory, storage latency and
            free space. Include retained versions, transaction logs, replica lag and backup health
            where the selected system exposes them. Explain the difference between a symptom, a resource
            limit and a cause. Establish baselines and headroom for growth, maintenance and recovery,
            with actionable alerts and a first diagnostic step. Link query and workload diagnosis
            to the performance branch.
          nested_article:
            topic: Relational service monitoring and capacity
            title: Monitoring and sizing a relational service
            brief: Teach practitioners to establish deployment visibility, maintain capacity and
              growth budgets, reserve normal and degraded headroom, and act on useful alerts before
              a service reaches a limit. Produce a dashboard, an evidence-routing table and capacity
              worksheets tied to service objectives and intervention lead times. Reuse the workload
              measurement and load evidence from Improving performance under concurrent load (a28),
              the sole owner of deep concurrent-workload diagnosis. Link to the owning maintenance,
              topology and restoration procedures for their operational evidence and actions.
            heading:
              - title: Build the dashboard the deployment can support
                brief: Start from the important application operations, availability and latency
                  objectives, expected demand and recovery requirements established for the service.
                  Inventory engine views, host or container metrics, provider metrics, application
                  instrumentation and external checks. Record collection intervals, permissions,
                  overhead, visibility gaps and the limits that require provider intervention in
                  a managed service.
                heading:
                  - title: Apply the workload measures to one service view
                    brief: Build a compact dashboard showing application outcomes, database latency,
                      completed work, queues and waits alongside CPU, memory, I/O, free space, connection
                      limits, retained versions, log growth and replica lag where applicable. Include
                      a brief local legend naming the displayed time window and whether each measure
                      covers an application operation or an engine request; distinguish a rate per
                      unit of time from a gauge at a sampling point. Define completed, failed and
                      rejected work at that boundary and queued work still awaiting service, labelling
                      any overlapping provider categories. Link a28 for deeper interpretation without
                      requiring its full investigation to read this dashboard. Label engine and provider
                      definitions and add workload, deployment and maintenance annotations. Each
                      panel must support an operating decision or a route to further investigation.
              - title: Route a changed signal with its evidence
                brief: Supply a small table with observed service change, evidence to retain and
                  the owning diagnostic or incident procedure. Route rising latency or queueing to
                  a28, a specific query to execution-plan diagnosis, retained versions or abnormal
                  log growth to maintenance and replication, lost writer availability to topology,
                  and suspected damage to the parent's incident method and restoration. Retain the
                  relevant time window, workload and deployment changes, engine observations and
                  logs before actions erase them. The table chooses a destination; it does not repeat
                  a latency-regression investigation or the common containment procedure.
              - title: Forecast space and the time left to act
                brief: Produce a capacity worksheet with measured starting sizes, growth assumptions,
                  retention periods, uncertainty and the owner of each limit. Separate local engine
                  storage, remote retained copies and provider quotas without double-counting physical
                  allocations. Record where the selected engine and deployment supply each measurement.
                heading:
                  - title: Include retained and temporary allocations
                    brief: Budget table data, indexes, engine overhead, retained row versions, transaction
                      logs and independent backup copies. Include consumers that can delay log removal,
                      plus peak temporary work, ingestion, rebuilds, upgrades and restore staging
                      using their documented procedures. Estimate growth from observed bytes and
                      planned workload changes; distinguish reserved capacity from immediately usable
                      space.
                  - title: Compare growth with intervention lead time
                    brief: Calculate time to a hard limit under ordinary and adverse growth assumptions.
                      Compare it with detection, investigation, provisioning and execution lead times,
                      including quotas and expansion restrictions. Turn the result into a dated action
                      threshold and a forecast-review date, rather than a universal free-space percentage.
              - title: Reserve capacity for normal and degraded operation
                brief: Extend the worksheet to compute, memory, I/O and connections using the measured
                  operating envelope from a28. Record ordinary peaks separately from failure, promoted-writer
                  load, replica catch-up, backup or restore work and maintenance overlap. State which
                  scenarios must retain ordinary objectives and which permit agreed reduced service;
                  reserve headroom against those cases and provisioning delays.
                heading:
                  - title: Accept the budget against existing evidence
                    brief: Reuse a28's representative load method and results, and the bounded failover
                      and restoration rehearsals from their owners. Check whether their data size,
                      workload, deployment, background work and duration support this budget. State
                      acceptance criteria for application outcomes, capacity limits and recovery
                      time, plus the assumptions or evidence gaps that require a targeted recheck.
                      Do not commission a second load-test tutorial or treat an untested forecast
                      as demonstrated capacity.
              - title: Turn capacity and service alerts into owned action
                brief: Derive urgent alerts from sustained user impact, rapid use of the allowed
                  failure budget or imminent exhaustion of required capacity; route longer-horizon
                  growth and upkeep signals to scheduled action. Give each an owner, retained evidence,
                  response deadline and linked procedure. Use service objectives and intervention
                  lead times to set thresholds, account for missing telemetry and verify delivery
                  and response with bounded tests. Close the worksheet with who acts, when to escalate
                  and which capacity assumption must be rechecked after a material workload, engine
                  or deployment change. Delegate bottleneck diagnosis and the worked comparison of
                  reducing work, changing limits or adding resources to a28; delegate topology changes
                  to their operational owner. Check the resulting service outcome and update the
                  capacity forecast.
        - title: Make routine maintenance a controlled change
          brief: Explain how ordinary writes create ongoing storage and statistics upkeep, and why
            long transactions, retention and neglected maintenance can turn gradual growth into an
            outage. Give each operating change an owner, precondition, resource allowance, observation
            plan and recovery path. Distinguish routine upkeep, software patching and major-version
            upgrades; verify compatibility and recovery before altering the production service. Link
            storage mechanisms and query effects to performance and live schema changes to evolution.
          nested_article:
            topic: Relational service maintenance and upgrades
            title: Maintaining and upgrading a relational service
            brief: Teach practitioners to keep a relational service healthy and change its engine
              version through controlled, observable work. Connect required upkeep to the workload
              and engine mechanisms that create it; distinguish automatic work, operator intervention
              and managed-service duties. Build a maintenance and upgrade procedure with explicit
              resource and interruption budgets, compatibility checks, recovery choices and validation.
              Use a worked service example and current primary engine documentation for concrete
              procedures. Link to performance for storage and query mechanisms, to operations neighbours
              for monitoring, topology and restoration, and to live database changes for schema migration
              or database moves. Keep this as one practical article.
            heading:
              - title: Identify the work the service keeps creating
                brief: 'Introduce maintenance as work generated by normal operation, and upgrades
                  as changes to the software that performs that work. Begin with a concrete service
                  whose data, retained versions, logs and statistics change under load. Establish
                  an engine- and deployment-specific inventory: what runs automatically, how completion
                  is observed, what can fall behind and who can intervene. Refer to the parent''s
                  responsibility map for managed versus self-managed boundaries; automatic work still
                  needs evidence of progress.'
              - title: Diagnose upkeep before choosing a command
                brief: Give readers a compact evidence-to-action table for the recurring duties below.
                  Distinguish a backlog, an impediment to progress and a misleading expectation about
                  reclaiming space. Check the selected engine's documented behaviour before prescribing
                  an operation; link underlying storage and performance explanations instead of rebuilding
                  them here.
                heading:
                  - title: Clean up versions that are no longer needed
                    brief: Explain the operational connection between retained row versions, cleanup
                      progress and transactions or other consumers that can retain history. Inspect
                      engine-specific progress and blockers, including any mandatory housekeeping
                      whose delay threatens availability. Choose between removing a blocker, adjusting
                      automatic work and a documented manual intervention. Keep transaction visibility
                      theory in its owner.
                  - title: Keep planner statistics useful
                    brief: Recognise workload or data changes that warrant checking statistics, inspect
                      when collection ran and whether it completed, and schedule engine-supported
                      refresh work with attention to cost. Distinguish statistics upkeep from diagnosing
                      and tuning an individual query; follow the performance article when fresh statistics
                      do not resolve the observed regression.
                  - title: Account for retained logs
                    brief: Identify why the engine retains logs and which recovery, archival or replication
                      consumer governs release. Diagnose stalled consumption and retention growth
                      using engine-supported controls. Establish that a retention setting is not
                      proof of usable recovery coverage. Link to backups and topology for their policies
                      and procedures; never present deleting active engine files as routine space
                      reclamation.
                  - title: Decide whether storage or indexes need intervention
                    brief: Separate reusable space inside engine files from space returned to the
                      filesystem, and recurring cleanup from heavier rebuild or compaction operations
                      where the engine supports them. Require evidence of a useful outcome before
                      scheduling expensive work. Check locks, temporary space, log generation and
                      replica effects against the exact operation. Refer index selection and storage
                      mechanics to performance; avoid universal periodic rebuild advice.
              - title: Fit maintenance within the service budget
                brief: Turn one diagnosed upkeep problem into a scheduled change. Estimate duration,
                  temporary space, additional I/O and logs, lock acquisition and interruption using
                  representative evidence. Coordinate overlapping jobs, replica or archival consumers
                  and backup windows through their owners. Set progress signals, stop conditions
                  and a completion test; check whether stopping actually releases locks, space or
                  work in the chosen engine. Show when reducing concurrency or using a maintenance
                  window is the practical choice, rather than assuming every operation must run online.
              - title: Establish an upgrade path before choosing a date
                brief: Distinguish patch and major upgrades while checking the actual release notes,
                  supported source-to-target paths and service restrictions for both. Inventory application
                  drivers, SQL and configuration behaviour, collations, extensions and external tooling
                  where relevant. Verify replica protocol or format compatibility, mixed-version
                  restrictions, backup usability and restore tools for the intended path. Identify
                  who controls timing and versions in a managed service. Compare the engine's supported
                  in-place or replacement methods by interruption, resources and recovery options;
                  link database-move mechanics to the live-change branch.
              - title: Rehearse the upgrade and the way back
                brief: Use a representative isolated copy and the documented procedure for the exact
                  versions and extensions. Run preflight checks, measure elapsed time and storage
                  needs, and exercise the application workload and recovery dependencies. Practise
                  a failed preflight and an interruption or failed validation at a meaningful point.
                  Draw the point beyond which restarting old binaries is unsupported, and distinguish
                  switching back to an intact old service from restoring an independent recovery
                  copy. Account for writes accepted after cutover when judging loss and rollback
                  feasibility; link to the restoration and live-change owners for those procedures.
              - title: Execute with explicit gates
                brief: 'Present the worked upgrade as a concise runbook: verify prerequisites and
                  recovery evidence, coordinate traffic and dependent jobs, perform the supported
                  steps, observe progress and decide whether to continue, stop or invoke the rehearsed
                  recovery path. Place go/no-go gates before costly or irreversible transitions and
                  assign an operator to each decision. Show how replica compatibility and managed-service
                  controls alter the sequence without duplicating failover design or the parent''s
                  incident framework.'
              - title: Prove completion and update the next run
                brief: Validate the intended maintenance outcome or engine version, object and extension
                  state, application correctness, error rates, latency, resource headroom and upkeep
                  progress against the pre-change baseline. Check replication, archival and backup
                  work through their owning procedures, and establish recovery coverage for the new
                  state before retiring the previous recovery option. Distinguish successful command
                  completion from successful service operation. Record actual interruption, resource
                  use, deviations and follow-up work so the next scheduled change uses evidence.
        - title: Choose where reads and writes can safely run
          brief: Establish a single writable service as the initial topology, then introduce replicas,
            failover and partitioning through the particular availability, read load, locality or
            capacity problem each addresses. Trace an acknowledged write to a later read and a possible
            promotion, distinguishing replication progress, read freshness and protection from loss.
            Explain that replication does not replace retained recovery history. Introduce the operating
            costs and transaction boundaries of partitioned data without opening a separate distributed-systems
            curriculum.
          nested_article:
            topic: Relational replication, failover and data placement
            title: Operating replicas and partitioned data
            brief: Choose and operate a relational topology against explicit availability, data-loss,
              recovery and read-freshness requirements. Follow changes from the writer to a replica,
              distinguish acknowledgement from replay and usable reads, then practise safe promotion,
              exclusion of the former writer, reconnection and rejoining. Decide whether local table
              partitioning preserves the schema and earns its continuing lifecycle cost, then distinguish
              it from distributing database ownership and assess the routing, transaction, movement
              and recovery costs of the latter. Use selected-engine and managed-service contracts
              and bounded failure rehearsals to establish what the deployment can actually deliver.
              Keep consensus theory, query tuning, application retry mechanics and backup restoration
              with their owners.
            heading:
              - title: Turn service requirements into a placement decision
                brief: Start with one relational service whose writers, readers and failure domains
                  are visible. Specify acceptable interruption, lost acknowledged changes, freshness
                  and latency for named failures before adding replicas or locations. Compare a larger
                  single writer, read replicas, a standby, and distributed ownership by the requirement
                  each addresses. Identify whether the proposed placement leaves shared dependencies
                  that defeat the intended protection; reuse the parent's responsibility map for
                  self-managed and hosted duties.
              - title: Follow a committed change to a replica
                brief: Use a change timeline to separate local commit, sending, receiving, durable
                  storage and replay. Explain physical replication and logical change replication
                  by their copied units and resulting compatibility, schema, object-coverage and
                  promotion restrictions. Check those restrictions for the chosen engine and version
                  rather than treating every replication target as an interchangeable standby.
                heading:
                  - title: Decide what an acknowledgement promises
                    brief: Compare asynchronous and synchronous acknowledgement at their documented
                      stages and participating members. Trace what the client can be told during
                      replica loss or a broken connection, which copies may contain an acknowledged
                      change, and when writes wait or fail. Relate timeout, quorum or synchronous-member
                      policy to the deployment's data-loss and availability requirements without
                      developing a general consensus course. Link transaction outcomes and application
                      reconciliation to their existing owners.
                  - title: Keep the stream able to catch up
                    brief: Distinguish transport backlog from replay backlog and explain why elapsed
                      lag, bytes behind and application-visible freshness answer different questions.
                      Establish retention and disk-pressure limits for a disconnected or slow member,
                      including any mechanism that holds logs for it. Decide when catching up is
                      feasible and when the documented rebuild path is required, linking service
                      alerting and storage budgets to monitoring.
              - title: Send each read to a copy that can answer it
                brief: Classify reads by whether stale results are acceptable, a preceding write
                  must be visible, or a transaction needs a documented consistent view. Explain how
                  replay progress, routing, connection lifetime and engine-specific replica restrictions
                  affect those choices. Work through a read immediately after an update and a read
                  during replica lag; choose writer routing, a supported progress barrier or another
                  documented service feature where appropriate. Include replica resource contention
                  and query cancellation only where they change routing or operating policy, leaving
                  query optimisation and client implementation elsewhere.
              - title: Replace a writer without leaving two authorities
                brief: 'Develop one promotion runbook from a failed-writer scenario: establish the
                  observed state and recovery budget, identify an eligible candidate and its recoverable
                  position, exclude the former writer, promote through the supported mechanism, switch
                  routing and validate service. Explain why inability to reach the old writer is
                  insufficient evidence that it can no longer accept writes. Distinguish planned
                  switchovers from unplanned promotion and state the go/no-go evidence for each step.'
                heading:
                  - title: Reconnect clients and establish the result
                    brief: Account for cached discovery, proxies, connection pools and existing sessions
                      when changing the writer endpoint. Validate that new writes reach the intended
                      authority and required reads see them. Record interruption and any lost acknowledged
                      changes; hand uncertain request outcomes to application reconciliation rather
                      than repeat its retry and idempotency procedures.
                  - title: Rejoin or replace the former member
                    brief: Keep the old writer excluded until its history and the new writer's history
                      have been compared using supported procedures. Choose catch-up, rewind where
                      supported, or replacement from an authorised source; verify required logs,
                      compatibility, capacity and replica health before readmission. Link to the
                      backup article when restoration supplies the replacement, without teaching
                      a second restoration procedure.
              - title: Choose between local partitions and distributed ownership
                brief: 'First work one time-retained event table through a local-partition decision.
                  Choose its partition key and boundaries from access patterns and retention work,
                  accounting for skew and queries that span partitions; link measured pruning benefit
                  to performance. Check the selected engine''s uniqueness, reference and index arrangements
                  against the table''s invariants, distinguishing the intended logical rules from
                  what the available objects enforce. Define the treatment of future, late and corrected
                  rows when a partition is missing or a boundary changes, including corrections that
                  move a row between partitions. Assign ownership of advance creation and retirement.
                  For one attachment or removal, state the gates for proceeding, pausing and declaring
                  completion: valid coverage of continuing writes, compatible schema and dependencies,
                  verified data and required retention, and confirmed post-change routing and results.
                  Link physical schema-change, locking and resource procedures to a29, live lifecycle
                  and retirement procedures to a06, and ongoing capacity and alerting to monitoring.
                  Finish with an explicit retain-or-reject decision against an ordinary unpartitioned
                  table, counting the operating work as well as the measured benefit; do not build
                  a partitioning catalogue or repeat those procedures. Then distinguish that local
                  layout from assigning data and write ownership across database services. Show a
                  relational workload whose demand cannot be met by moving reads alone, and evaluate
                  whether distributing it is justified. Treat application-managed shards and an integrated
                  distributed relational service as different operating contracts; inspect documented
                  routing, placement and transaction guarantees rather than inferring them from the
                  label.'
                heading:
                  - title: Choose a key and trace work across owners
                    brief: Follow a tenant or order key through routing, unique constraints, joins
                      and transactions. Assess skew, hot keys, shared tables and operations without
                      the routing key. Contrast colocated work with cross-owner work using the selected
                      implementation's guarantees and latency costs. Keep local partition pruning
                      with performance and correctness mechanisms with transactions; use them here
                      to decide whether the placement satisfies the workload.
                  - title: Move ownership and retain a recovery path
                    brief: Explain how growth, skew or location requirements lead to moving data
                      and changing routing. Require a documented cutover boundary, write authority,
                      validation and rollback or forward-recovery option. Assess spare capacity,
                      per-owner replica protection and recovery coordination, including whether a
                      restore can establish the required cross-owner consistency. Link detailed live
                      moves and restoration to their owners; do not create a resharding speciality.
              - title: Check the actual hosting and distribution contract
                brief: Apply the preceding questions to a managed high-availability service and a
                  distributed relational deployment. Identify who detects failure, excludes writers,
                  promotes or changes ownership, updates endpoints and repairs members. Check documented
                  acknowledgement, read-consistency, placement and failure-domain settings, along
                  with failover triggers, supported operator actions and service limits. Record which
                  requirements depend on configuration or deployment shape rather than assuming that
                  an availability label establishes them.
              - title: Rehearse the failures that determine the choice
                brief: In a disposable, representative selected-engine deployment, rehearse a planned
                  switchover, writer loss, loss of replica connectivity and a returning old writer;
                  add an ownership or location failure when the chosen topology distributes data.
                  Bound each fault and define stop conditions and cleanup before execution. Record
                  acknowledged operations, replica progress, the authoritative writer, observed read
                  results, reconnection, retention pressure and recovery time, then compare them
                  with the requirement and documented contract. Keep illustrative timelines distinct
                  from measured execution and state what the rehearsal does not establish. Finish
                  with the evidence needed to accept the topology or revise the design.
        - title: Prove that the data can be restored
          brief: Compare restoration after accidental deletion, storage corruption and loss of the
            service. Introduce consistent backups, retained transaction history and point-in-time
            recovery as recovery inputs whose coverage and limits must be checked. Include configuration,
            credentials, encryption keys, extensions and sufficient destination capacity in the recovery
            dependency list. A successful backup job is evidence of one step; a timed restoration
            and application-level validation establish what recovery can actually do.
          nested_article:
            topic: Relational backups and tested restoration
            title: Backing up and restoring relational data
            brief: Teach relational practitioners to choose recovery copies for named loss cases
              and prove that they can restore correct data within the required time and loss bounds.
              Follow one accidental-deletion case from backup selection through an isolated restoration
              and a controlled return to service, contrasting complete service loss where the procedure
              changes. Develop consistency, dependencies, retention, independent access, full and
              point-in-time restoration, selective recovery and measured validation. This is the
              shared restore procedure used by incidents, database moves and adoption checks; leave
              incident command, replica promotion, application reconciliation mechanics and migration
              design to their owners. Check executable procedures against the selected engine and
              service, and distinguish rehearsed results from intended recovery.
            heading:
              - title: Start with the loss you must recover from
                brief: 'Turn the parent''s recovery requirements into concrete cases: lost service
                  storage, an accidental committed change, corruption discovered later, and loss
                  of the account or credentials that control both production and its copies. Name
                  the data and dependent services required, acceptable loss, interruption budget
                  and detection delay. Explain why a surviving replica or a successful backup job
                  does not by itself establish recovery from each case; link writer replacement to
                  topology and incident selection to the parent.'
              - title: Choose the copy that can reconstruct the required state
                brief: Compare recovery methods by the state they capture, the restore they permit,
                  compatibility constraints and expected recovery work. Use the running case to choose
                  a base copy and any subsequent history it needs, rather than treating the methods
                  as interchangeable products.
                heading:
                  - title: Logical exports preserve a selected representation
                    brief: Develop consistent export scope, schema and data ordering, roles, extensions
                      and other objects that may require separate capture. Explain how transaction
                      boundaries and multi-database scope affect consistency. Evaluate portability
                      and selective loading against type, collation, version and object compatibility,
                      and account for rebuilding indexes and validating constraints during restore.
                  - title: Physical backups and snapshots need an engine contract
                    brief: Explain what an engine-supported physical backup captures and which files,
                      tablespaces, logs, configuration and versions must accompany it. Contrast a
                      documented consistent or recoverable snapshot with an arbitrary copy of changing
                      files. Check coordination across volumes and services, snapshot dependencies
                      and restoration restrictions in the selected engine and hosting contract.
                  - title: Point-in-time recovery needs a complete history
                    brief: Connect a usable base backup to the required transaction-log chain and
                      an identifiable recovery target. Explain how missing segments, incompatible
                      history, retention gaps or an unsupported target defeat the intended restore.
                      Verify the engine's target identifiers, granularity and inclusion rules; distinguish
                      transaction-log recovery from selective replay of application intentions.
              - title: Keep recovery possible after production fails
                brief: Design retention around detection delay and the oldest state the cases require,
                  including the dependency between retained base copies and logs. Track copy locations,
                  catalogue metadata, checksums and job failures, while keeping restore evidence
                  separate from copy completion. Evaluate independent copies against storage, region,
                  administrative account and credential loss. Preserve recoverable encryption keys,
                  restore identities, configuration and required external dependencies; use security's
                  access and key controls. Identify who can delete copies or shorten retention and
                  test access using the recovery identity.
              - title: Rehearse a full restore in isolation
                brief: Restore a representative backup into a clean destination with documented engine,
                  extension and service prerequisites. Keep it isolated from live writers, queues
                  and external side effects. Record retrieval, provisioning, decryption, restore,
                  recovery and validation time, including constrained capacity and permissions. Establish
                  full recovery before adding a target time so that a failure can be attributed to
                  the base copy, missing dependencies or history rather than a vague failed drill.
              - title: Recover to the last acceptable state
                brief: Develop the accidental-deletion case using retained evidence to choose a recovery
                  boundary before the harmful change. Restore separately, apply the documented history
                  and verify the resulting transaction boundary with known records. Treat wall-clock
                  estimates as evidence requiring checks, and stop when the target or log chain cannot
                  be established. For managed services, inspect documented recovery windows, granularity,
                  restore-to-new destination behaviour, regional or account restrictions and configuration
                  that is not restored automatically. Keep the current copy available for comparison
                  and legitimate later work.
              - title: Decide between replacing the database and repairing selected data
                brief: Show that returning the entire database to an earlier point can discard valid
                  later changes. Compare a whole-service return with extracting the affected data
                  from an isolated restore and applying a deliberate repair. Trace foreign keys,
                  identifiers, dependent rows and concurrent updates so selective recovery is not
                  presented as a safe table copy. Define the evidence, write coordination and application-domain
                  reconciliation needed before merging; hand the implementation of corrective data
                  work and external-effect reconciliation to evolution and integration. Make an unresolved
                  conflict a reason to withhold cutover or repair.
              - title: Prove readiness before returning traffic
                brief: Separate engine recovery completion from acceptable service state. Check integrity
                  using supported engine tools, schema and object availability, representative data
                  invariants, permissions and application workflows; compare against the chosen recovery
                  boundary and expected loss. Define go/no-go criteria, exclusive write authority,
                  connection and dependency changes, and a preserved fallback before the parent's
                  incident procedure authorises reopening traffic. Record actual restored state,
                  data loss, time to usable service, test scope and remaining gaps. Repeat rehearsals
                  after material changes to data volume, versions, backup configuration or hosting,
                  and let measured recovery determine whether the requirements are met.
        - title: Recover the incident without destroying the evidence
          brief: 'Teach one incident decision sequence in this article: establish impact and ownership,
            preserve evidence and recovery options, distinguish plausible causes, contain ongoing
            damage, select a prepared procedure and validate service and data before reopening traffic.
            Work through a compact contrast between overload and accidental deletion to show why
            relieving demand and recovering correct data require different actions. Add a failure-to-procedure
            table linking saturation, connection or lock blockage and exhausted capacity to monitoring
            and performance; compromised access to security; writer or host loss to topology; and
            corruption or operator error to restoration. Preserve useful logs, copies and recovery
            history before intervention. Define explicit go/no-go criteria for recovery and resumed
            traffic, including data validation, application reconnection and reconciliation handoffs.
            Record and communicate actual data loss and interruption, then repair the failed controls
            or runbook assumptions. Reuse the detailed procedures in their owning articles, verify
            any concrete engine steps, and label illustrative incident timelines clearly.'
  - title: Choosing a database and a reading route
    anchor: choose-a-system-by-testing-the-contract-you-need
    brief: 'Return to the example with its workload, correctness rules, operational requirements
      and team constraints now visible. Explain why relational systems can share SQL and still differ
      materially in transaction, execution, compatibility and recovery behaviour. Frame selection
      as a short list of requirements, disqualifying limits and representative experiments, including
      whether a relational system fits the problem at all. Close with a compact route table. For
      a first working application, start with the supplied disposable setup at the beginning of Working
      with SQL (a02), then complete the parent articles Designing relational data (a01), Working
      with SQL (a02), Making concurrent changes correct (a03) and Building applications around a
      relational database (a04), in that order. Use their complete ordinary application path before
      returning to selected value, constraint, query or concurrency depth when its question matters.
      Correct but slow work starts with the complete performance parent (a05), then follows its evidence
      to the merged query-plan diagnosis (a26) for query or plan work, or Improving performance under
      concurrent load (a28) for queueing, contention or concurrency; neither route requires both
      children. Service limits start with Running a relational service (a07) and its capacity article
      (a36); a live change starts with Changing a live database (a06). Finish each task parent before
      choosing its deeper investigations or procedures, with any additional prerequisite section
      named at the entrance. For an adoption decision, use Choosing a relational database (a08):
      take the SQLite article (a32) only for an embedded candidate and the CockroachDB article (a34)
      only after a concrete distributed requirement survives comparison with a simpler service. Common
      server practice stays in the main examples and compact PostgreSQL candidate record. The disposable
      exercise engine is a starting environment; completing system selection is unnecessary before
      the first query.'
    nested_article:
      topic: Choosing relational systems and deployments
      title: Choosing a relational database
      brief: Teach how to select and validate a relational engine and deployment for a concrete application.
        Turn workload, correctness, latency, availability, locality, operational capacity and total
        cost into explicit requirements and rejection tests. Compare representative embedded, server
        and distributed relational choices through the mechanisms that change those tests, including
        managed service restrictions and responsibilities. Finish with a realistic evaluation and
        a documented adoption decision. Use neighbouring storage families only to establish suitability;
        use conditional implementation follow-ups to check a candidate's actual contract. SQLite
        and CockroachDB are alternative adoption routes, not a required sequence; common disposable
        PostgreSQL practice starts in Working with SQL before this selection evaluation is complete.
        Keep the PostgreSQL candidate record here.
      heading:
        - title: Begin with the application's promises
          brief: Follow an ordinary application from its facts and critical reads and changes to
            a short selection brief. Record invariants and transaction boundaries, dataset size and
            growth, skew, concurrency, latency percentiles, burst shape, availability, acceptable
            data loss, recovery time and location requirements. Separate measured needs, forecast
            needs and negotiable preferences. Make each hard requirement testable and explain why
            an engine name is not yet a design.
        - title: Establish whether a relational system fits
          brief: Use relationships, integrity rules, transactional changes and changing query needs
            to explain the relational fit. Identify cases where access patterns, data volume or specialised
            search and analytical needs merit a neighbouring storage family or a separate derived
            system. Account for synchronisation, recovery and operational costs before adding another
            store; keep the detailed design of those families outside this article.
        - title: Choose the process and failure boundary
          brief: Compare an embedded library, a database service and a distributed relational service
            by who owns the data files, where requests execute, how writers coordinate, which network
            paths enter latency and which failures affect reads and commits. Explain that an engine,
            a topology and a hosting arrangement are separate choices. Use SQLite, PostgreSQL and
            CockroachDB as concrete representatives of alternative choices, not a required learning
            sequence. Take the SQLite route only for an embedded candidate and the CockroachDB route
            only after a concrete distributed requirement survives comparison with a simpler server.
            Introduce other candidates only when a required capability makes them relevant. Do not
            infer identical SQL semantics, transaction guarantees or capacity from the relational
            label.
          heading:
            - title: When the database lives with the application
              brief: Introduce the attraction and boundaries of an embedded relational engine through
                application ownership, concurrent writers, file placement, deployment and backup
                needs. Establish the tests that decide whether the embedded arrangement serves this
                application. Introduce SQLite's concrete adoption checks only when evaluating an
                embedded candidate.
              nested_article:
                topic: Adopting SQLite for an application
                title: Checking an embedded choice with SQLite
                brief: Decide whether SQLite can meet one application's relational requirements in
                  its intended deployment. Trace file ownership, connections and transactions to
                  writer contention, durability and recovery obligations; verify the actual library,
                  driver and settings with small acceptance cases. Produce a defensible adoption
                  decision and starting configuration. Reuse the common transaction, integration,
                  performance and operations methods rather than teach them again; this is an optional
                  candidate check, not a SQLite internals curriculum.
                heading:
                  - title: Put the database file in the deployment diagram
                    brief: Start with a concrete application, such as a single-host service whose
                      web workers and background job share a local database. Mark who opens the file,
                      owns its storage, writes concurrently and can recover it after host loss. Compare
                      that intended arrangement with requirements already established in Choosing
                      a relational database; reject it early if ownership, independent host access
                      or recovery expectations do not fit.
                    heading:
                      - title: Verify the library the application actually loads
                        brief: Record SQLite and driver versions, relevant build options, required
                          extensions and connection/threading restrictions. Distinguish the library
                          used by the running application from an installed command-line tool. Make
                          support for required SQL and deployment platforms a testable acceptance
                          condition rather than infer it from the SQLite name.
                      - title: Check the storage and access boundary
                        brief: Inspect local versus network storage, locking and sync behaviour,
                          directory permissions, journal sidecars, container volumes and restart
                          persistence. Explain WAL's same-host requirement where it rules out a deployment.
                          Establish that access to the process and files defines the security boundary;
                          link the security article for the wider protection and recovery obligations.
                  - title: Observe two connections competing for a write
                    brief: Use a small, explicitly scheduled two-connection example to show one transaction
                      holding writer access while another waits or fails. Relate this to actual transaction
                      duration and simultaneous writers rather than infer suitability from database
                      size or request count. Link Transactions for isolation guarantees and application
                      integration for retry policy.
                    heading:
                      - title: Choose when a transaction asks to write
                        brief: Compare a deferred read-then-write transaction with BEGIN IMMEDIATE;
                          inspect driver autocommit and implicit transaction behaviour. Explain busy
                          and stale-snapshot outcomes only far enough to decide whether the transaction
                          must restart and where its boundary belongs. Configure bounded busy handling,
                          and test its actual behaviour instead of treating a timeout as a guarantee
                          that every failed write will eventually run.
                      - title: Keep reader and writer lifetimes visible
                        brief: Check when statements, cursors and transactions release their resources,
                          including slow response streaming and background work. Connect a long writer
                          to queueing and a long WAL reader to checkpoint progress and log growth.
                          Measure representative overlap with multiple connections and processes
                          where the deployment uses them; leave general workload tuning and request
                          deadlines to their existing owners.
                  - title: Choose a journal and durability contract
                    brief: Compare rollback journalling and WAL through the reader/writer interactions
                      that affect this application. Explain checkpointing only as the movement that
                      permits WAL reuse and introduces operational work. Verify supported journal
                      and synchronous settings against SQLite's documentation, the driver and the
                      actual filesystem; do not present WAL as an automatic improvement.
                    heading:
                      - title: State what a successful commit must survive
                        brief: Separate application-process failure, operating-system failure and
                          power loss. Connect the chosen journal/synchronous combination and storage
                          sync assumptions to the required acknowledged-write survival, checkpoint
                          work and latency. Read settings back at their documented scope, distinguishing
                          persistent database settings from per-connection initialisation. Reuse
                          Making concurrent changes correct for transaction durability and Backing
                          up and restoring relational data and Running a relational service for service
                          recovery.
                  - title: Prove the application's data contract on SQLite
                    brief: Run a small schema and the application's critical statements through its
                      actual driver. Verify foreign-key enforcement on every new connection, expected
                      NOT NULL, CHECK and uniqueness behaviour, and the chosen use of STRICT tables
                      or flexible typing. Include both accepted and rejected values so successful
                      insertion alone cannot stand in for constraint validation.
                    heading:
                      - title: Check representations at the driver boundary
                        brief: Test integer ranges, exact money representation, timestamps, NULLs,
                          collations and parameter/result conversions where this application uses
                          them. Check required SQL and schema-change support against the loaded version.
                          Reuse the schema, query and evolution articles for their design methods;
                          show only differences that could accept or disqualify SQLite.
                  - title: Rehearse a recoverable deployment
                    brief: Apply the shared restoration method to SQLite's files and APIs. Select
                      a supported consistent backup mechanism, such as the online backup API, and
                      explain why copying a changing main file does not establish a valid backup.
                      Restore independently and validate application invariants and measured recovery
                      time. Check recovery copies survive the host or volume failure in the application's
                      requirement; a local copy alone cannot demonstrate that.
                    heading:
                      - title: Verify restarts, upgrades and interrupted work
                        brief: Rehearse deployment with persistent data, permission checks, connection
                          initialisation and a controlled schema change. Test process termination,
                          lock contention and disposable disk-full or I/O-failure cases supported
                          by the test environment. Record error and restart behaviour without mistaking
                          a killed process for a power-loss test. Link operations and evolution for
                          full recovery and cutover procedures.
                  - title: Make the adoption decision from acceptance evidence
                    brief: Collect the deployment diagram, library/driver versions, verified settings,
                      data-contract results, contention latency and error rates, and restoration
                      evidence against the original rejection gates. Mark every result as observed,
                      documented or still assumed, with dates and links to primary SQLite and driver
                      documentation. Accept with explicit limits or reject the candidate; identify
                      the workload or deployment change that would trigger reevaluation and reuse
                      the database-move article for an eventual exit. Do not expand failed gates
                      into new SQLite specialist branches.
            - title: When applications share a database service
              brief: Introduce the service boundary, connection and resource limits, primary write
                placement, replica read semantics and operating responsibilities that distinguish
                a server deployment. Show how requirements produce a shortlist among PostgreSQL,
                MySQL and other server engines without ranking them universally. Common disposable
                PostgreSQL practice starts in Working with SQL before completing selection. Keep
                a compact PostgreSQL candidate record here, linked to the common articles' PostgreSQL
                evidence for configuration, schema and SQL behaviour, correctness, workload and recovery
                gates. Name the exact version, service tier and topology; trace the actual application,
                driver, pooler and server path. Record connection and pooling limits, required session
                features, relevant transaction, timeout and durability settings, extensions and access
                controls with reasons and verification sources. Check candidate-specific differences
                and restrictions rather than repeat the common lessons; require dialect and guarantee
                checks when choosing another engine.
            - title: When data and writes must span machines or regions
              brief: Enter this alternative route only after a concrete distributed requirement survives
                comparison with a simpler server. Compare transaction placement, coordination latency,
                locality, failure handling and operational cost against those needs. Introduce a
                concrete CockroachDB evaluation while keeping a general distributed-systems curriculum
                outside the commission.
              nested_article:
                topic: Adopting a distributed relational system with CockroachDB
                title: Checking a distributed choice with CockroachDB
                brief: Decide whether a specific CockroachDB version and deployment meet an application's
                  distributed relational requirements. Follow one regional order-reservation workload
                  from its placement and transaction boundaries through compatibility, latency, contention
                  and failure tests to a documented adoption or rejection. Establish a minimal topology
                  and starting configuration, dated version and service-tier evidence, and the resource,
                  network and operating cost of meeting the requirements. Reuse common transaction,
                  application integration, evolution, performance and operations methods; explain
                  distributed mechanisms only far enough to predict or interpret acceptance results.
                  Illustrative traces explain hypotheses; only observed tests establish acceptance,
                  and untested claims remain explicit gaps.
                heading:
                  - title: Name the requirement that needs distribution
                    brief: Start with an order-reservation application whose users and data span
                      regions. State its invariants, required read freshness, transaction boundaries,
                      latency budgets by client location, permitted interruption and data loss, and
                      any data residency obligations. Carry forward the parent's rejection gates
                      and ask which requirement a simpler deployment fails. Distinguish placing application
                      traffic, placing rows and surviving a failure; geographical presence alone
                      establishes none of their contracts. Keep this a conditional candidate evaluation
                      rather than a compulsory product lesson.
                  - title: Turn the requirements into a minimal topology
                    brief: Select the exact release, hosting arrangement and service tier before
                      designing tests. Record supported regions, locality and survival controls,
                      deployment minimums, scaling and configuration limits, maintenance responsibilities
                      and contractual restrictions from dated primary documentation. Draw gateway
                      locations, data ranges and their voting and non-voting replicas only to explain
                      where an operation travels and which failures retain a quorum. Choose the smallest
                      topology capable of testing the stated failure goal; distinguish an economical
                      development cluster from evidence for the intended production topology.
                    heading:
                      - title: Place each transaction's data and work
                        brief: Map regional customers, inventory and orders to the candidate's supported
                          table and row locality choices. Verify actual replica and leaseholder placement
                          rather than infer it from SQL connection location. Compare a local reservation
                          with a transaction touching inventory in another region, including foreign-key
                          checks, unique constraints, secondary indexes and joins where they change
                          coordination. Use the paths to predict latency and detect hidden cross-region
                          work. Check physical copies and backups against residency requirements
                          rather than treating locality as a residency promise.
                  - title: Check the application's actual SQL contract
                    brief: Build a compact compatibility acceptance set from the real schema and
                      access paths. Verify required types, constraints, expressions, SQL semantics,
                      generated identifiers, isolation choices and schema-change facilities against
                      the pinned release. Exercise the intended driver, ORM, protocol features, prepared
                      statements and connection pool; PostgreSQL protocol support is an entry point
                      for tests, not proof that PostgreSQL behaviour or extensions carry across.
                      Record unsupported requirements, acceptable adaptations and their cost. Reuse
                      the evolution branch's compatibility and rollout method to check representative
                      schema jobs, restrictions and application coexistence without repeating the
                      migration procedure.
                  - title: Make the client contract survive coordination failures
                    brief: Run the representative reservation transaction through the chosen driver's
                      transaction handling. Verify the configured isolation and actual retryable
                      abort and ambiguous-outcome signals for this release, including the boundary
                      between database, driver and application retries. Use the transaction branch's
                      correctness tests and integration branch's retry, deadline, idempotency and
                      reconciliation methods to demonstrate that an abort or uncertain commit does
                      not oversell inventory or duplicate a reservation. Test a disconnect around
                      commit and a transaction whose deadline expires during contention. Explain
                      coordination and contention only where they account for those outcomes; do
                      not build another consensus or retry curriculum.
                  - title: Measure locality and contention with production-shaped work
                    brief: Apply the performance branch's workload method with realistic regional
                      traffic, data volume, concurrency, connection behaviour and competing work.
                      Compare local and cross-region transactions, shared hot inventory and dispersed
                      inventory, measuring end-to-end latency distributions, completed throughput,
                      retry rate and invariant violations. Count retry and queueing time inside the
                      application deadline. Inspect query plans, distribution and service signals
                      to distinguish coordination distance, hot keys, poor query shape and resource
                      saturation. Test the smallest justified change and repeat the same acceptance
                      case; do not substitute a local toy trace or a vendor benchmark for measured
                      results.
                  - title: Prove the named failures and recovery path
                    brief: In an authorised disposable environment matching the required topology,
                      exercise client or gateway loss, node loss and the stated zone or region failure.
                      Include a network partition where it tests the requirement. Observe which operations
                      remain available, interruption and tail latency, retry and uncertain outcomes,
                      correctness of acknowledged work, and behaviour while capacity returns. Verify
                      placement has converged before claiming the survival goal. Use operations'
                      topology and restore procedures to gather evidence for backup availability,
                      recoverable keys and a timed restore with application validation; replication
                      and survival tests do not establish recovery from accidental deletion. Record
                      provider restrictions and any failure case that cannot be tested as an acceptance
                      gap, using contractual evidence without presenting it as execution.
                  - title: Decide whether the measured contract is worth its cost
                    brief: Complete one adoption record linking each requirement to its configuration,
                      dated source, measured result, limitation and pass or rejection threshold.
                      Include baseline and degraded capacity, replica and index storage, cross-region
                      traffic, backups, maintenance and operator effort, plus the commercial and
                      service-tier conditions required by the topology. State the verified starting
                      configuration, unresolved gaps and reassessment triggers. Reuse the common
                      restore and cutover evidence to check a practical exit route rather than teach
                      it again. Adopt only when the distributed requirement, application contract,
                      recovery evidence and total cost meet the gates; otherwise identify which requirement
                      or candidate must change.
        - title: Compare the deployment contract and its full cost
          brief: Build a responsibility table for application team, database operator and provider.
            Verify service limits, supported versions, extensions, privileges, connection and storage
            limits, maintenance windows, upgrades, data location, network access, encryption, audit
            needs, backup retention, restore granularity and failover behaviour. Separate availability
            promises from tested recovery capability. Compare realistic compute, memory, storage,
            I/O, replicas, transfer, licensing, support and engineering effort, including idle and
            burst costs. Treat product terms and service-tier behaviour as dated evidence. For the
            PostgreSQL candidate, add service-specific configuration and privilege restrictions,
            maintenance and upgrade constraints and remaining operational obligations to this same
            table, naming an owner for each obligation.
        - title: Test the candidates against the same application
          brief: Turn hard requirements into pass-or-fail gates and trade-offs into a small decision
            table. Use representative schema, realistic data distribution and growth, production-shaped
            queries and concurrent changes, and the actual driver and network path. Verify results
            and invariants before measuring steady and burst latency, throughput, resource use and
            cost. Include slow clients, connection pressure, contention and required failure, failover
            and backup-restore exercises. Record version, configuration, dataset, observations, uncertainty
            and untested cases; distinguish illustrative models from execution evidence and marketing
            benchmarks from this workload. Draw on the performance and operations branches for the
            detailed procedures. Link the common PostgreSQL examples and observed results where their
            version, configuration and execution path apply; exercise the candidate's actual driver,
            pool mode and hosting differences where those results do not establish the contract.
            Keep documentation claims, local models and unexecuted checks distinct from observed
            acceptance results.
        - title: Make the choice reversible enough to live with
          brief: Write a decision record naming the candidate, deployment, acceptance evidence, rejected
            alternatives, unresolved risks and the conditions that would reopen the choice. Check
            ecosystem maturity, driver and tooling support, staff skills and support arrangements.
            Make portability concrete by inventorying dialect, data types, extensions, operational
            dependencies, export access and migration downtime; demonstrate a small export and re-import
            where an exit requirement matters. Establish a staged adoption and verification plan,
            with explicit stop criteria, before committing critical data. Complete the compact PostgreSQL
            record with the verified starting configuration, linked acceptance evidence, measured
            candidate limits, acceptance gaps and an owner for each unresolved check. Accept, reject
            or defer it against the original gates without creating another PostgreSQL teaching destination.
            Link live migration procedures to the evolution article.
